      - id: ReviewCenter-System-ReviewRuleSwitches
        title: >-
          The tool shall keep, for each project, a switch for each of two further review rules, one for authors
          answering the checklist of their own review and one for the person who reopened a review signing it again,
          each on for a new project and for every project that existed before the rules were enforced, shall let only
          an administrator of the project or a system administrator change them, never through an access token, shall
          record each change in the audit trail, and shall enforce each rule that is on: the author of a review cannot
          answer its checklist, and the person who reopened a review cannot sign it again, nor reopen it in a way that
          leaves a slot without a person who may sign.
        tags: [system]
        justification: |
          A project must be able to say which review rules it wants, and the choice must be in the history so that it
          can be shown who relaxed a rule and when. The rules are on by default for every project, also the ones
          that were created before they were enforced, so that no project is left without the protection by
          accident; a project that has to let one person do everything switches the rules off with a record. The
          system tests verify the audited, administrator-only change and the page; the storage across a restart and
          the enforcement are verified by the tests of the child requirements.
