      - id: ReviewCenter-System-Checklist
        title: >-
          The tool shall give every review a checklist that follows the Continuous Compliance review template, with
          a review keeping the checklist it was created with, let a user answer each check Pass, Fail, or N/A with a
          justification where required, mark a section as not applicable with a reason, see what is left to do, and
          keep the answers in the database across restarts.
        tags: [system]
        justification: |
          The checklist is how a formal review shows what was examined against a defined standard. Freezing the
          wording at creation means a later change of the template cannot alter what the reviewers answered. A
          reviewer must see at a glance what is unanswered and be led to the next check, and every N/A needs a
          stated reason so that skipped checks are explained and not silent.
