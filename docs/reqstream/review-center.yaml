      - id: ReviewCenter-System-FollowUpReview
        title: >-
          The tool shall let a review be created as a follow-up of an earlier review of the same project, by hand or
          through the API, so that the Pass and N/A answers of unchanged checks, the not-applicable sections and the
          open threads of the earlier review are carried over and marked with the review they came from, without the
          Fail answers, the resolved threads, the reviewer slots or the signatures, refuse a review that does not fit
          and a silent drop of open threads, carry only what the submitted ballots of the earlier review agree on and
          let a carried answer seed the draft ballot of each reviewer slot (it counts only when a reviewer hands the
          ballot in), count carried open threads as open for approval, keep a signature bound to the review that is
          followed and to the carried threads, show the follow-up in the attestation PDF, and keep the digest of every
          review that is not a follow-up unchanged.
        tags: [system]
        justification: |
          A review that fails is followed by a review of the corrected content. The reviewers should not repeat the
          checks that passed, and the record, and the document that goes to auditors, must still say which answers
          were carried and which were given in this review (21 CFR Part 11 section 11.10(e), records that are not
          obscured by later changes, and 11.10(a), a record that is accurate and complete). A carried answer is only
          a starting point: the reviewers still hand in their ballots, so what is approved is what they agreed to.
          Leaving the new lines out of every other review keeps the signatures that already exist valid.
        children:
          - ReviewCenter-Core-FollowUp
          - ReviewCenter-Storage-FollowUp
          - ReviewCenter-Storage-FollowUp-CarriedRows
          - ReviewCenter-Storage-FollowUp-CarryFailsStoresNothing
          - ReviewCenter-Storage-FollowUp-Record
          - ReviewCenter-Storage-FollowUp-ReplaceCarried
          - ReviewCenter-Api-FollowUp
          - ReviewCenter-Evidence-FollowUp
          - ReviewCenter-Web-FollowUp
          - ReviewCenter-Web-FollowUp-Preview
          - ReviewCenter-Web-FollowUp-DropConfirmation
          - ReviewCenter-Web-FollowUp-CarriedMarks
          - ReviewCenter-Web-FollowUp-EarlierFail
          - ReviewCenter-Web-FollowUp-Follows
          - ReviewCenter-Web-FollowUp-FollowedBy
          - ReviewCenter-Web-FollowUp-CarriedThreads
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn
          - ReviewService_CreateDraftAsync_FollowUp_CarriesAnswersAndSections
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn
          - ApiEndpoints_CreateReview_FollowsReviewId_IsCreatedShownAndRefusedWhenInvalid
          - AttestationService_GenerateAsync_FollowUpReview_NamesFollowedReviewAndCarriedAnswers

      - id: ReviewCenter-Inbox
        title: >-
          The tool shall give every signed-in user an inbox of the reviews that wait for them, in eight groups: the
          ballots to hand in and the questions of others to answer, the checks the reviewers answered differently, the
          signatures to give or to give again, the signatures that no longer count and cannot be given again yet,
          the open threads whose last comment is by someone else, the failed
          checks of the reviews the user created, and, for information, the reviews that wait for other people and the
          reviews that were approved or reopened
          by someone else since the user last looked; shall never show a user who has not handed in the own ballot what
          the others answered, shall count the reviews that need action on the home page and on
          an Inbox tab of the header,
          mark what is new since the last visit, in the inbox and in the comments of a review, let the user mark all
          as read, show only the reviews of projects the user may see and offer a signature or a reply only to a user
          who may work in the project, and keep the state of what a user has seen out of the audit trail and out of
          what a signature covers.
        tags: [system]
        justification: |
          A reviewer should not have to open every project to learn what waits for them, and a late review should be
          found by the one who must act. The inbox is also the list of notifications, so a separate notification
          record is not needed. What a person has seen is personal information and not a change of a review, so it is
          not part of the signed record (21 CFR Part 11 section 11.10(e), a trail of the changes of records) and
          leaving it out keeps the signatures valid. The inbox follows the current access, so a person who lost
          access to a project no longer learns anything about its reviews.
        children:
          - ReviewCenter-Core-Inbox
          - ReviewCenter-Storage-Inbox
          - ReviewCenter-Storage-Inbox-Candidates
          - ReviewCenter-Storage-Inbox-LightRecords
          - ReviewCenter-Storage-Inbox-NeverBackwards
          - ReviewCenter-Storage-Inbox-NoFailure
          - ReviewCenter-Storage-Inbox-ReviewDeleted
          - ReviewCenter-Storage-Inbox-UserDeleted
          - ReviewCenter-Web-Inbox
