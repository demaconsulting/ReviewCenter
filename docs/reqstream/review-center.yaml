---
# ReviewCenter System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible promises of the complete system, the ones a regulated
#   user relies on and every later formal review is checked against
# - System requirements are validated through integration tests: the xUnit tests run the published
#   dotnet DLL end-to-end, subsystem tests run the real services over a real database, and CI runs the
#   self-validation of the published self-contained executable (extracted from its release archive) on each
#   supported platform, which produces the platform evidence in platform-requirements.yaml
#
# ORGANIZATION:
# - The requirements sit in one section, as the standard prescribes, and are grouped by theme with the
#   banner comments below: Review content, Review activity, Review integrity and signing, Evidence and
#   audit, Access and identity, Git and content sources, Automation, Operation and qualification
# - Every requirement states an outcome that can be verified, not a feature, and its justification gives
#   the regulatory reason (traceability, independence of review, integrity of evidence)

sections:
  - title: System-Level Requirements
    requirements:
      # ----------------------------------------------------------------------------------------------
      # Review content: what is reviewed, and against what
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Projects
        title: >-
          The tool shall organize reviews in projects, each of which holds the reviews of one body of work.
        tags: [system]
        justification: |
          Reviews of different bodies of work must be kept apart so that each can be found, assigned, and
          protected on its own.
        children:
          - ReviewCenter-Web-Projects-NewPage
          - ReviewCenter-Web-Projects-NewPageNotInList
          - ReviewCenter-Web-Projects-NewPageCancel
          - ReviewCenter-Web-Projects-NewPageCreate
          - ReviewCenter-Web-Projects-NewPageOpens
          - ReviewCenter-Web-Projects-NewPageError
          - ReviewCenter-Web-Projects-NewPageNothingCreated
          - ReviewCenter-Core-Projects
          - ReviewCenter-Core-Rules-Project

      - id: ReviewCenter-System-Projects-ProjectsPage
        title: >-
          The tool shall show a signed-in user a projects page that lists the projects the user may see.
        tags: [system]
        justification: |
          A user can only work on a project that can be found, and a user must never be shown a project that
          the user may not see.
        children:
          - ReviewCenter-Web-Projects
          - ReviewCenter-Web-Projects-Empty
          - ReviewCenter-Web-Projects-EmptyReason
          - ReviewCenter-Web-Projects-HeaderLink
          - ReviewCenter-Web-Projects-HeaderLinkSignedOut
          - ReviewCenter-Core-Projects-List

      - id: ReviewCenter-System-Projects-ProjectPage
        title: >-
          The tool shall show a page for each project that shows the reviews of the project.
        tags: [system]
        justification: |
          The reviews of a project are found, assigned, and protected from the page of the project.
        children:
          - ReviewCenter-Web-Projects-Project
          - ReviewCenter-Core-Projects-Read

      - id: ReviewCenter-System-Projects-AdminCreates
        title: >-
          The tool shall let only a system administrator create a project.
        tags: [system]
        justification: |
          Projects fix how access is organized, so creating one is limited to the people who administer the
          system.
        children:
          - ReviewCenter-Web-Projects-NewButton
          - ReviewCenter-Web-Projects-NewButtonHidden
          - ReviewCenter-Core-Projects-AdminOnly

      - id: ReviewCenter-System-Projects-LoginRedirect
        title: >-
          The tool shall send a request for the projects without a signed-in user to the login page.
        tags: [system]
        justification: |
          An unidentified visitor must never be shown a project. The page must do this against the database
          of the running server, not only in isolation.
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase

      - id: ReviewCenter-System-Reviews
        title: >-
          The tool shall let a user create a draft review in a project from uploaded files.
        tags: [system]
        justification: |
          Formal review starts from a fixed snapshot of the files under review. A review must name its project
          and carry an identity, and a refused request must leave nothing behind, so that the review list holds
          only reviews that were asked for properly.
        children:
          - ReviewCenter-Web-Reviews
          - ReviewCenter-Web-Reviews-OtherProject
          - ReviewCenter-Web-Reviews-OtherProjectReset
          - ReviewCenter-Web-Reviews-ProjectLink
          - ReviewCenter-Core-Reviews
          - ReviewCenter-Core-Rules
          - ReviewCenter-Core-Rules-ReviewIdentity
          - ReviewCenter-Core-Rules-ReviewProject
          - ReviewCenter-Core-Rules-NoStorage

      - id: ReviewCenter-System-Reviews-Bytes
        title: >-
          The tool shall keep every file of a review byte for byte.
        tags: [system]
        justification: |
          A review is evidence of the content that was examined, so the content must come back exactly as it
          was submitted (21 CFR Part 11 section 11.10(a), accuracy and completeness of records).
        children:
          - ReviewCenter-Core-Reviews-Files

      - id: ReviewCenter-System-Reviews-UploadLimits
        title: >-
          The tool shall keep the files of an uploaded review within defined upload limits.
        tags: [system]
        justification: |
          Upload limits keep the service responsive.
        children:
          - ReviewCenter-Web-Reviews-UploadLimits
          - ReviewCenter-Web-Reviews-ReservedId
          - ReviewCenter-Web-Reviews-FormError
          - ReviewCenter-Web-Reviews-FormNotFound
          - ReviewCenter-Web-Reviews-NothingCreated
          - ReviewCenter-Core-Rules-Upload

      - id: ReviewCenter-System-Reviews-Fingerprint
        title: >-
          The tool shall identify the reviewed content of a review by a fingerprint that is calculated like the
          ReviewMark fingerprint.
        tags: [system]
        justification: |
          The fingerprint identifies the snapshot independent of file names and order, and lets reviewers and
          auditors show that the content they reviewed is the content that was submitted. Calculating it like
          ReviewMark does ties the review to the file set that the configuration of the repository names.
        children:
          - ReviewCenter-Core-Fingerprint
          - ReviewCenter-Core-Fingerprint-NameOrderIndependent
          - ReviewCenter-Core-Fingerprint-Arguments

      - id: ReviewCenter-System-Reviews-Show
        title: >-
          The tool shall show a review with its fingerprint, its files, and the content of a selected file.
        tags: [system]
        justification: |
          Reviewers and auditors must be able to see what was submitted and which fingerprint identifies it,
          from the page of the review itself.
        children:
          - ReviewCenter-Web-Reviews-Page
          - ReviewCenter-Web-Reviews-NotFound
          - ReviewCenter-Web-Reviews-OtherReview
          - ReviewCenter-Web-Reviews-Summary
          - ReviewCenter-Web-Reviews-Files
          - ReviewCenter-Web-Reviews-FilesLayout
          - ReviewCenter-Web-Reviews-Content
          - ReviewCenter-Web-Reviews-NoSelection
          - ReviewCenter-Web-Reviews-Binary
          - ReviewCenter-Web-Reviews-Details
          - ReviewCenter-Core-Reviews-ReadBack
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-System-GitReviews
        title: >-
          The tool shall create a review from the files that changed between an optional baseline revision and a
          head revision of a registered git repository and match a selection.
        tags: [system]
        justification: |
          The product exists to review changes to source code, and a change is reviewed against what it replaces.
        children:
          - ReviewCenter-Core-RepositoryReviews
          - ReviewCenter-Core-RepositoryReviews-DigestBinding
          - ReviewCenter-Core-RepositoryReviews-SkippedEntries
          - ReviewCenter-Core-RepositoryReviews-Audit
          - ReviewCenter-Core-RepositoryReviews-DigestSource
          - ReviewCenter-Web-RepositoryReviews
          - ReviewCenter-Web-RepositoryReviews-SkippedEntries
          - ReviewCenter-Web-RepositoryReviews-EnabledOnly
          - ReviewCenter-Web-RepositoryReviews-NoRepository
          - ReviewCenter-Web-RepositoryReviews-ChangeKind
          - ReviewCenter-Web-RepositoryReviews-UploadNoKind
          - ReviewCenter-Web-RepositoryReviews-Source
          - ReviewCenter-Web-RepositoryReviews-Source-Upload

      - id: ReviewCenter-System-GitReviews-NothingToReview
        title: >-
          The tool shall refuse to create a review from a git repository when no changed file matches the
          selection.
        tags: [system]
        justification: |
          A review without files would be an empty record that can be approved without anything having been
          examined.
        children:
          - ReviewCenter-Core-RepositoryReviews-NothingToReview
        tests:
          - NewReviewPage_CreateForm_EmptySelection_ShowsNothingToReviewAndCreatesNothing

      - id: ReviewCenter-System-GitReviews-RequestRefused
        title: >-
          The tool shall refuse to create a review from a git repository from a request that names a repository,
          revision, selection, or identifier it cannot use, saying why and creating nothing.
        tags: [system]
        justification: |
          A request that cannot be honored must not leave a partial review or an audit entry behind, and the
          person who made it needs the reason to correct it.
        children:
          - ReviewCenter-Core-RepositoryReviews-RepositoryRefused
          - ReviewCenter-Core-RepositoryReviews-RevisionRefused
          - ReviewCenter-Core-RepositoryReviews-SelectionRefused
          - ReviewCenter-Core-RepositoryReviews-IdRefused
          - ReviewCenter-Core-RepositoryReviews-RefusalChangesNothing
          - ReviewCenter-Core-RepositoryReviews-GitFailure
          - ReviewCenter-Core-RepositoryReviews-RequestRefused
          - ReviewCenter-Core-RepositoryReviews-RuleViolations
          - ReviewCenter-Web-RepositoryReviews-Reason

      - id: ReviewCenter-System-GitReviews-Limits
        title: >-
          The tool shall refuse to create a review from a git repository whose files exceed the size limits,
          before it reads any file content.
        tags: [system]
        justification: |
          Size limits keep the service responsive, and checking them first avoids reading content that is going
          to be refused.
        children:
          - ReviewCenter-Core-RepositoryReviews-Limits
          - ReviewCenter-Core-RepositoryReviews-LimitsBeforeReading

      - id: ReviewCenter-System-GitReviews-Frozen
        title: >-
          The tool shall keep the content of the changed files and the resolved commits unchanged in a review
          from a git repository whatever happens to the repository later.
        tags: [system]
        justification: |
          Freezing the baseline and head content means the review stays evidence of what was examined even when
          the repository moves on, is rewritten, or is deleted.
        children:
          - ReviewCenter-Core-RepositoryReviews-Frozen
          - ReviewCenter-Storage-RepositoryReviews
          - ReviewCenter-Storage-RepositoryReviews-FileBaseline
          - ReviewCenter-Storage-RepositoryReviews-NoContentInReview
        tests:
          - ReviewService_CreateFromRepositoryAsync_RealGit_FreezesChangesAgainstLaterCommits

      - id: ReviewCenter-System-GitReviews-Compare
        title: >-
          The tool shall let reviewers compare each modified file of a review from a git repository with its
          baseline version side by side.
        tags: [system]
        justification: |
          Comparison with an earlier revision shows reviewers exactly what changed, so that changed lines do not
          escape review.
        children:
          - ReviewCenter-Web-RepositoryReviews-DiffView
          - ReviewCenter-Web-RepositoryReviews-HeadVersion
          - ReviewCenter-Web-RepositoryReviews-BaselineVersion
          - ReviewCenter-Web-RepositoryReviews-HeadOnly
          - ReviewCenter-Web-RepositoryReviews-VersionSwitch
          - ReviewCenter-Web-RepositoryReviews-DeletedFileComment
          - ReviewCenter-Storage-RepositoryReviews-BaselineOnRequest
          - ReviewCenter-Core-Diff
          - ReviewCenter-Core-Diff-Compute
          - ReviewCenter-Core-Diff-Numbering
          - ReviewCenter-Core-Diff-Segments
          - ReviewCenter-Core-Diff-Pairing
          - ReviewCenter-Core-Diff-Arguments
          - ReviewCenter-Core-Diff-NotFound
          - ReviewCenter-Web-DiffReview
          - ReviewCenter-Web-DiffReview-ScrollToChange
          - ReviewCenter-Web-DiffReview-CommentForm
          - ReviewCenter-Web-DiffReview-CommentFormCancel
          - ReviewCenter-Web-DiffReview-FileThreads
          - ReviewCenter-Web-DiffReview-FileThreadsCounts
          - ReviewCenter-Web-DiffReview-Collapsed
          - ReviewCenter-Web-DiffReview-PhoneLayout
        tests:
          - PuppetEndToEnd_ReviewDiff_HoverRevealsLineCommentAndClickOpensComposer_WorksAgainstRealServer

      - id: ReviewCenter-System-GitReviews-CompareUnavailable
        title: >-
          The tool shall say in plain words when a comparison of a file with its baseline version cannot be
          shown.
        tags: [system]
        justification: |
          A reviewer who sees an empty or broken comparison would think that nothing changed, so the reason that
          no comparison is shown must be stated.
        children:
          - ReviewCenter-Core-Diff-NoComparison
          - ReviewCenter-Core-Diff-Bounds
          - ReviewCenter-Web-DiffReview-Unavailable

      - id: ReviewCenter-System-PlanReviews
        title: >-
          The tool shall plan the reviews that a head revision of a registered git repository needs from the
          review-sets that the repository defines in its ReviewMark configuration file.
        tags: [system]
        justification: |
          A repository already states which files are reviewed together. Planning from that statement saves the
          author from typing every selection by hand.
        children:
          - ReviewCenter-Core-PlanReviews
          - ReviewCenter-Core-PlanReviews-FiledNewSelection
          - ReviewCenter-Core-PlanReviews-WillCreate
          - ReviewCenter-ContentSources-ReviewSets
          - ReviewCenter-ContentSources-ReviewSets-Read
          - ReviewCenter-Hosting-PlannerServices
          - ReviewCenter-Web-PlanReviews
          - ReviewCenter-Web-PlanReviews-LinkUnavailable
          - ReviewCenter-Web-PlanReviews-NoForm
          - ReviewCenter-Web-PlanReviews-NoRepository
          - ReviewCenter-Web-PlanReviews-Incomplete
          - ReviewCenter-Web-PlanReviews-IncompleteNoGitRead
          - ReviewCenter-Web-PlanReviews-Reset
          - ReviewCenter-Web-PlanReviews-Reset-Error
          - ReviewCenter-Web-PlanReviews-ProjectSwitch
          - ReviewCenter-Web-PlanReviews-ProjectSwitchLateAnswer
          - ReviewCenter-Web-PlanReviews-ProjectSwitchFreeForm
          - ReviewCenter-Web-PlanReviews-Busy
          - ReviewCenter-Web-PlanReviews-Busy-ReadDisabled
          - ReviewCenter-Web-PlanReviews-Busy-CreateDisabled
          - ReviewCenter-Web-PlanReviews-Interactive
          - ReviewCenter-Web-PlanReviews-HelpTopic
          - ReviewCenter-Web-PlanReviews-RowDetails
          - ReviewCenter-Web-PlanReviews-BulkSelection
          - ReviewCenter-Web-PlanReviews-OtherSets
          - ReviewCenter-Web-PlanReviews-ProblemSets
          - ReviewCenter-Web-PlanReviews-RowFailed
          - ReviewCenter-Web-PlanReviews-RowFailedNoGitText
          - ReviewCenter-Web-PlanReviews-RowFailedKeeps
          - ReviewCenter-Web-PlanReviews-RowFailedKeepsEarlier
          - ReviewCenter-Web-PlanReviews-Refused
          - ReviewCenter-Web-PlanReviews-RefusedNothing
          - ReviewCenter-Web-PlanReviews-RefusedKeepsPlan
          - ReviewCenter-Web-PlanReviews-NoLeak
          - ReviewCenter-Web-PlanReviews-ReviewSetNone
          - ReviewCenter-Web-PlanReviews-Summary
          - ReviewCenter-Web-PlanReviews-Ordering
          - ReviewCenter-Web-PlanReviews-ReviewSet

      - id: ReviewCenter-System-PlanReviews-BrokenSet
        title: >-
          The tool shall give a review-set that cannot be planned a row of its own with a reason, so that the
          other review-sets of the repository are still planned.
        tags: [system]
        justification: |
          One broken review-set definition must not hide the reviews that the other sets need, and the author
          must be told which set is broken and why.
        children:
          - ReviewCenter-Core-PlanReviews-BrokenSet

      - id: ReviewCenter-System-PlanReviews-Refused
        title: >-
          The tool shall refuse to plan or to create reviews when the configuration file, the request, or the
          access of the user does not allow it, saying why in plain English.
        tags: [system]
        justification: |
          A plan that is built from a missing, oversized, or invalid configuration file, or for a user who may
          not see the project, would mislead the author or leak the existence of the project.
        children:
          - ReviewCenter-Core-PlanReviews-ConfigRefused
          - ReviewCenter-Core-PlanReviews-InputRefused
          - ReviewCenter-Core-PlanReviews-AccessRefused
          - ReviewCenter-Core-PlanReviews-ArgumentsRefused
          - ReviewCenter-Core-PlanReviews-RequestInvalid
          - ReviewCenter-Core-PlanReviews-BatchRefused
          - ReviewCenter-Core-PlanReviews-BatchNoGit
          - ReviewCenter-Core-PlanReviews-BatchAccess
          - ReviewCenter-Web-PlanReviews-Failures

      - id: ReviewCenter-System-PlanReviews-Baseline
        title: >-
          The tool shall plan the review of each review-set as a full review or as the changes since the last
          approved review of the set.
        tags: [system]
        justification: |
          Reviewing only what changed since the last approved review keeps changed files from escaping review
          without making reviewers read again what was approved.
        children:
          - ReviewCenter-Core-PlanReviews-FullReview
          - ReviewCenter-Core-PlanReviews-SinceRevision
          - ReviewCenter-Core-PlanReviews-SinceLastApproved
          - ReviewCenter-Core-PlanReviews-RejectedLater
        tests:
          - ReviewPlanner_CreateAsync_RealGit_LastReviewedBaselineThenAlreadyFiled

      - id: ReviewCenter-System-PlanReviews-FullFallback
        title: >-
          The tool shall fall back to a full review of a review-set when the last approved review of the set
          cannot be trusted as the baseline.
        tags: [system]
        justification: |
          A baseline that is missing, that is not in the history of the head, or that cannot be checked would
          let changed files escape review, so the plan reviews everything instead of failing.
        children:
          - ReviewCenter-Core-PlanReviews-FallbackNoApproved
          - ReviewCenter-Core-PlanReviews-Fallback
          - ReviewCenter-ContentSources-ReviewSets-Ancestry
          - ReviewCenter-ContentSources-ReviewSets-Ancestry-NotAncestor

      - id: ReviewCenter-System-PlanReviews-Skipped
        title: >-
          The tool shall skip review-sets that are already filed or have nothing to review.
        tags: [system]
        justification: |
          Reviews that exist or would be empty add nothing, and creating them again would clutter the project.
        children:
          - ReviewCenter-Core-PlanReviews-AlreadyFiled
          - ReviewCenter-Core-PlanReviews-NothingToReview
          - ReviewCenter-Web-PlanReviews-EmptySets
        tests:
          - ReviewPlanner_CreateAsync_RealGit_LastReviewedBaselineThenAlreadyFiled

      - id: ReviewCenter-System-PlanReviews-Create
        title: >-
          The tool shall create the picked reviews of a plan with the same rules as a review made by hand.
        tags: [system]
        justification: |
          A planned review is evidence like any other, so it must meet the same rules for identity, title, and
          content as a review that the author creates by hand.
        children:
          - ReviewCenter-Core-PlanReviews-Create
          - ReviewCenter-Core-PlanReviews-Identity
          - ReviewCenter-Core-PlanReviews-IdentityUnique
          - ReviewCenter-Core-PlanReviews-IdentityTitle
          - ReviewCenter-Web-PlanReviews-Create

      - id: ReviewCenter-System-PlanReviews-CreateResult
        title: >-
          The tool shall create each picked review of a plan on its own and give one result per review, so that
          a failing request neither stops the others nor undoes their reviews.
        tags: [system]
        justification: |
          The author must see for each picked review whether it was created, was already filed, or failed, and
          one bad request must not cost the work of the others.
        children:
          - ReviewCenter-Core-PlanReviews-OwnTransaction
          - ReviewCenter-Core-PlanReviews-ResultPerReview
          - ReviewCenter-Core-PlanReviews-Cancel
          - ReviewCenter-Core-PlanReviews-ResultFiled

      - id: ReviewCenter-System-PlanReviews-DigestBinding
        title: >-
          The tool shall bind the review-set of a planned review into the digest that a signature covers.
        tags: [system]
        justification: |
          Recording the set keeps each later review of the set linked to the last one, and the evidence index can
          name the review-set that each signed review covers.
        children:
          - ReviewCenter-Core-RepositoryReviews-ReviewSet
          - ReviewCenter-Core-RepositoryReviews-ReviewSetLength
          - ReviewCenter-Core-RepositoryReviews-ReviewSetNone

      - id: ReviewCenter-System-DueDate
        title: >-
          The tool shall let a review be given an optional due date, a calendar day in UTC, when it is created by
          hand.
        tags: [system]
        justification: |
          A lead who answers for the reviews of a project must see which ones are late, so a review needs a date
          that says when it is due.
        children:
          - ReviewCenter-Core-DueDate
          - ReviewCenter-Core-DueDate-Range
          - ReviewCenter-Storage-DueDate
          - ReviewCenter-Storage-DueDate-Default
          - ReviewCenter-Web-DueDate
          - ReviewCenter-Web-DueDate-PastRefused
          - ReviewCenter-Web-DueDate-PastNothingCreated
          - ReviewCenter-Web-DueDate-PlanRefused
          - ReviewCenter-Web-DueDate-DateKept
          - ReviewCenter-Web-DueDate-NoForm
          - ReviewCenter-Web-DueDate-Repository

      - id: ReviewCenter-System-DueDate-FromPlan
        title: >-
          The tool shall let a review that is created from a plan be given an optional due date, a calendar day in
          UTC.
        tags: [system]
        justification: |
          Reviews that are planned in a batch are due on a date of the plan, or on a date of their own, without
          the author having to set each date again after the reviews exist.
        children:
          - ReviewCenter-Core-DueDate-Plan
          - ReviewCenter-Core-DueDate-PlanRefused
          - ReviewCenter-Web-DueDate-PlanDefault
          - ReviewCenter-Web-DueDate-PlanRow
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited

      - id: ReviewCenter-System-DueDate-Api
        title: >-
          The tool shall let a review that is created through the API be given an optional due date, a calendar
          day in UTC.
        tags: [system]
        justification: |
          Automation that files reviews must be able to state when they are due, and an invalid date must not
          create a review.
        children:
          - ReviewCenter-Api-DueDate
          - ReviewCenter-Api-DueDate-Invalid
        tests:
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag

      - id: ReviewCenter-System-DueDate-Change
        title: >-
          The tool shall let the administrators of the project and the creator of the review change or clear the
          due date of a review.
        tags: [system]
        justification: |
          Plans move, and the people who answer for the review must be able to say so. Nobody else may move a date
          to hide that a review is late.
        children:
          - ReviewCenter-Core-DueDate-Change
          - ReviewCenter-Core-DueDate-ChangeClear
          - ReviewCenter-Core-DueDate-Unchanged
          - ReviewCenter-Web-DueDate-Change
          - ReviewCenter-Web-DueDate-ChangeSave
          - ReviewCenter-Web-DueDate-Clear
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited

      - id: ReviewCenter-System-DueDate-ChangeRefused
        title: >-
          The tool shall refuse a change of the due date by a user who is not an administrator of the project or
          the creator of the review, by a personal access token, or to a date that is not valid, saying why.
        tags: [system]
        justification: |
          A late review must not be made to look on time by somebody who does not answer for it, or by a token
          that no person is holding, or by a date that is out of range.
        children:
          - ReviewCenter-Core-DueDate-ChangeRefused
          - ReviewCenter-Core-DueDate-NoToken
          - ReviewCenter-Core-DueDate-ChangeFarAhead
          - ReviewCenter-Storage-DueDate-MissingReview
          - ReviewCenter-Web-DueDate-Refused

      - id: ReviewCenter-System-DueDate-ChangeConflict
        title: >-
          The tool shall change the due date of a review only when the stored date is still the one that the
          change started from.
        tags: [system]
        justification: |
          Two people who change the date at the same time must not silently overwrite each other.
        children:
          - ReviewCenter-Core-DueDate-Concurrent
          - ReviewCenter-Storage-DueDate-CompareAndSet
          - ReviewCenter-Storage-DueDate-Stale

      - id: ReviewCenter-System-DueDate-ApprovedLocked
        title: >-
          The tool shall refuse a change of the due date of a review that is approved.
        tags: [system]
        justification: |
          An approved review has done its work, and its date stays as history.
        children:
          - ReviewCenter-Core-DueDate-ApprovedLocked
          - ReviewCenter-Storage-DueDate-ApprovedRefused
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited

      - id: ReviewCenter-System-DueDate-ShowDate
        title: >-
          The tool shall show the due date of a review on the review and in the list of the reviews of the API.
        tags: [system]
        justification: |
          A lead must see the date without asking, on the page and in the data that automation reads.
        children:
          - ReviewCenter-Web-DueDate-Header
          - ReviewCenter-Api-DueDate-Shown
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag

      - id: ReviewCenter-System-DueDate-Overdue
        title: >-
          The tool shall show the Overdue badge on a review while its due date is past and the review is not
          approved.
        tags: [system]
        justification: |
          A lead who answers for the reviews of a project must see which ones are late.
        children:
          - ReviewCenter-Core-DueDate-Overdue
          - ReviewCenter-Web-DueDate-Overdue
          - ReviewCenter-Api-DueDate-Shown
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag

      - id: ReviewCenter-System-DueDate-ApprovedNeverOverdue
        title: >-
          The tool shall never show an approved review as overdue.
        tags: [system]
        justification: |
          A review that is approved has done its work, so it is not late.
        children:
          - ReviewCenter-Core-DueDate-Overdue
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited

      - id: ReviewCenter-System-DueDate-OutOfDigest
        title: >-
          The tool shall keep the due date of a review out of what a signature covers.
        tags: [system]
        justification: |
          The date is planning information, so a change of it must not make a signature look out of date.
        children:
          - ReviewCenter-Core-DueDate-OutOfDigest

      - id: ReviewCenter-System-DueDate-Audit
        title: >-
          The tool shall record every setting and change of the due date of a review in the audit trail.
        tags: [system]
        justification: |
          The audit trail shows who moved a date, as for every other change of a review (21 CFR Part 11
          section 11.10(e)).
        children:
          - ReviewCenter-Core-DueDate-Audit
          - ReviewCenter-Storage-DueDate-Audit
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag

      - id: ReviewCenter-System-Oversight
        title: >-
          The tool shall show a lead, on the page of a project, for every review of the project which stage it is
          in.
        tags: [system]
        justification: |
          A lead who answers for the reviews of a project must be able to see where each one stands without
          asking. The progress is computed from the record that the signatures and the audit trail already
          protect, so it cannot be edited and cannot disagree with the review page.
        children:
          - ReviewCenter-Core-Progress
          - ReviewCenter-Core-Progress-Reopened
          - ReviewCenter-Core-Progress-Performance
          - ReviewCenter-Core-Progress-Bound
          - ReviewCenter-Core-Progress-GivenList
          - ReviewCenter-Core-Progress-Arguments
          - ReviewCenter-Web-Progress
          - ReviewCenter-Web-Progress-BlockersNoFail
          - ReviewCenter-Web-Progress-DateFormat
          - ReviewCenter-Web-Progress-DateFormat-Attributes
          - ReviewCenter-Web-Progress-FilterNoMatch
          - ReviewCenter-Web-Progress-PageRange
          - ReviewCenter-Web-Progress-QueryIgnored
          - ReviewCenter-Web-Progress-QueryEncoded
          - ReviewCenter-Web-Progress-AuditorRestrictions
          - ReviewCenter-Web-Progress-AuditorRestrictions-NewReviewPage
          - ReviewCenter-Web-Progress-AuditorRestrictions-OwnRole
          - ReviewCenter-Web-Progress-AuditorNoRead
          - ReviewCenter-Web-Progress-EmptyProject
          - ReviewCenter-Web-Progress-Summary
          - ReviewCenter-Web-Progress-SummaryOverdue
          - ReviewCenter-Web-Progress-SummaryAllReviews
        tests:
          - ReviewCenter_ProjectOverview_ShowsWhoIsBlockingAndFiltersByState

      - id: ReviewCenter-System-Oversight-Signatures
        title: >-
          The tool shall show a lead, for every review of the project, how many of the needed signatures it has.
        tags: [system]
        justification: |
          The lead sees at a glance how far each review is from approval, including the signatures that must be
          given again because the record changed.
        children:
          - ReviewCenter-Core-Progress-Signatures
          - ReviewCenter-Web-Progress-Signatures
          - ReviewCenter-Web-Progress-SignaturesOutOfDate
        tests:
          - ReviewCenter_ProjectOverview_ShowsWhoIsBlockingAndFiltersByState
          - ApiEndpoints_ListReviews_Progress_ShowsApprovalSignaturesAndLastActivity

      - id: ReviewCenter-System-Oversight-WaitingOn
        title: >-
          The tool shall show a lead, for every review of the project that is not concluded, who it waits on.
        tags: [system]
        justification: |
          A lead must be able to chase the right person without asking who is holding a review up.
        children:
          - ReviewCenter-Core-Progress-WaitingOn
          - ReviewCenter-Web-Progress-WaitingOn
        tests:
          - ReviewCenter_ProjectOverview_ShowsWhoIsBlockingAndFiltersByState

      - id: ReviewCenter-System-Oversight-Blockers
        title: >-
          The tool shall show a lead, for every review of the project, what blocks its approval.
        tags: [system]
        justification: |
          The numbers of open threads and unanswered, failed, and disputed checks that the lead sees must equal
          the ones on the review page, so that the overview cannot disagree with the review.
        children:
          - ReviewCenter-Core-Progress-Blockers
          - ReviewCenter-Core-Progress-Blocked
          - ReviewCenter-Core-Progress-KindCounts
          - ReviewCenter-Core-Progress-ApprovalCounts
          - ReviewCenter-Web-Progress-Blockers

      - id: ReviewCenter-System-Oversight-Ballots
        title: >-
          The tool shall show how many ballots of the needed ballots of a review were handed in, without showing
          what the others answered to a viewer who may not see the ballots.
        tags: [system]
        justification: |
          The overview must show how far the checklist is without letting a reviewer see the answers of the others
          before the own ballot is in.
        children:
          - ReviewCenter-Core-Progress-BallotCounts
          - ReviewCenter-Core-Progress-MaskedBallots
          - ReviewCenter-Core-Progress-TokenViewer

      - id: ReviewCenter-System-Oversight-LastActivity
        title: >-
          The tool shall show a lead, for every review of the project, when it last changed.
        tags: [system]
        justification: |
          The time of the last change comes from the audit trail, so a stale review is found by the record and
          not by a field that somebody could edit.
        children:
          - ReviewCenter-Core-Progress-LastActivity
          - ReviewCenter-Storage-Progress
          - ReviewCenter-Web-Progress-LastActivity
        tests:
          - ApiEndpoints_ListReviews_Progress_ShowsApprovalSignaturesAndLastActivity

      - id: ReviewCenter-System-Oversight-Overdue
        title: >-
          The tool shall show a lead, for every review of the project, whether it is overdue.
        tags: [system]
        justification: |
          A lead who answers for the reviews of a project must see which ones are late.
        children:
          - ReviewCenter-Core-Progress-Overdue
          - ReviewCenter-Web-Progress-DueDate
          - ReviewCenter-Web-Progress-DueDateOverdue
        tests:
          - ReviewCenter_ProjectOverview_ShowsWhoIsBlockingAndFiltersByState

      - id: ReviewCenter-System-Oversight-ApiList
        title: >-
          The tool shall show the progress of every review of a project in the list of the reviews of the API.
        tags: [system]
        justification: |
          Automation and dashboards read the same progress as the page, so that they cannot disagree with it,
          and existing clients keep working because fields are only added.
        children:
          - ReviewCenter-Api-Progress
          - ReviewCenter-Api-Progress-SameService
          - ReviewCenter-Api-Progress-OnlyAdditive
        tests:
          - ApiEndpoints_ListReviews_Progress_ShowsApprovalSignaturesAndLastActivity

      - id: ReviewCenter-System-Oversight-FilterOrder
        title: >-
          The tool shall let a lead filter and order the reviews of a project.
        tags: [system]
        justification: |
          A project with many reviews is only useful to a lead when the late and blocked ones can be brought to
          the top.
        children:
          - ReviewCenter-Web-Progress-Filters
          - ReviewCenter-Web-Progress-Sorting
          - ReviewCenter-Web-Progress-Paging
        tests:
          - ReviewCenter_ProjectOverview_ShowsWhoIsBlockingAndFiltersByState

      - id: ReviewCenter-System-Oversight-Link
        title: >-
          The tool shall keep the filters, the order, and the page of the overview of a project in the link of the
          page.
        tags: [system]
        justification: |
          A lead can send the link of a view to a colleague, or come back to it later, and see the same reviews.
        children:
          - ReviewCenter-Web-Progress-QueryString
        tests:
          - ReviewCenter_ProjectOverview_ShowsWhoIsBlockingAndFiltersByState

      - id: ReviewCenter-System-Oversight-AuditorView
        title: >-
          The tool shall show the same overview of a project to a read-only auditor of the project.
        tags: [system]
        justification: |
          An auditor must be able to show where the project stands, using the same view as the lead.
        children:
          - ReviewCenter-Core-Progress-ViewerRights
          - ReviewCenter-Web-Progress-AuditorView

      - id: ReviewCenter-System-Oversight-OutsiderView
        title: >-
          The tool shall show nothing of the overview of a project to a user outside the project.
        tags: [system]
        justification: |
          A person who has no access to a project must not learn anything about its reviews.
        children:
          - ReviewCenter-Core-Progress-ViewerRefused
          - ReviewCenter-Web-Progress-OutsiderView

      - id: ReviewCenter-System-Auditor
        title: >-
          The tool shall let a project administrator or a system administrator give a member of a project the
          read-only Auditor role.
        tags: [system]
        justification: |
          A project that is audited, for example by quality assurance or a customer, must let the auditor see how
          the reviews were done without giving the auditor the means to change the record, which is what makes the
          record trustworthy (21 CFR Part 11 section 11.10(d), limiting access to authorized individuals).
        children:
          - ReviewCenter-Core-ProjectAccess-AuditorRole
          - ReviewCenter-Web-ProjectAccess-Roles
          - ReviewCenter-Web-ProjectAccess-RolesAuditor
          - ReviewCenter-Web-ProjectAccess-RolesCombination
          - ReviewCenter-Web-ProjectAccess-RolesOpenWork
          - ReviewCenter-Web-ProjectAccess-RolesLastAdmin
          - ReviewCenter-Web-ProjectAccess-RolesOwnRole
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing

      - id: ReviewCenter-System-Auditor-ReadsAll
        title: >-
          The tool shall let an auditor of a project read everything of the project that members read, including
          its audit trail and its export.
        tags: [system]
        justification: |
          An auditor who cannot see how the reviews were done cannot audit them.
        children:
          - ReviewCenter-Core-ProjectAccess-Auditor
          - ReviewCenter-Core-ProjectAccess-AuditTrail
          - ReviewCenter-Api-ReadOnlyRole
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing

      - id: ReviewCenter-System-Auditor-ChangesNothing
        title: >-
          The tool shall let an auditor of a project change nothing in the project.
        tags: [system]
        justification: |
          An auditor who can change the record would take away the trust that the audit is meant to create.
        children:
          - ReviewCenter-Core-ProjectAccess-Auditor
          - ReviewCenter-Web-ProjectAccess-ContributeReadOnly
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing

      - id: ReviewCenter-System-Auditor-NotReviewer
        title: >-
          The tool shall not offer an auditor as a reviewer and shall not let an auditor sign.
        tags: [system]
        justification: |
          An auditor looks at the review from outside, so the auditor must not take part in the approval that the
          audit is meant to check.
        children:
          - ReviewCenter-Core-ProjectAccess-SlotsAndSigning
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing

      - id: ReviewCenter-System-Auditor-ControlsDisabled
        title: >-
          The tool shall show an auditor every control that changes something missing or disabled, with a notice
          that says so.
        tags: [system]
        justification: |
          An auditor must not be offered an action that is going to fail, and must be told why the page is
          read-only.
        children:
          - ReviewCenter-Web-ProjectAccess-AuditorReadOnly
          - ReviewCenter-Web-ProjectAccess-AuditorNotice
          - ReviewCenter-Web-ProjectAccess-AuditorRoleChange
          - ReviewCenter-Web-ProjectAccess-AuditorRoleChangeDraft
          - ReviewCenter-Web-ProjectAccess-AuditorNoRepositoryRead
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing

      - id: ReviewCenter-System-Auditor-ApiRefused
        title: >-
          The tool shall refuse every change through the API by a token of an auditor with 403.
        tags: [system]
        justification: |
          The read-only role must hold for automation as well as for the pages.
        children:
          - ReviewCenter-Api-ReadOnlyRole-Refused
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing
          - ApiAuditor_CreateReview_AuditorIs403AndNonMemberIs404

      - id: ReviewCenter-System-Auditor-NonMember
        title: >-
          The tool shall show a user who is no member of a project the answer for a project that does not exist.
        tags: [system]
        justification: |
          A person without a role in a project must not learn that the project exists.
        children:
          - ReviewCenter-Api-ReadOnlyRole-NonMember
        tests:
          - ReviewCenter_Auditor_CanReadEverythingAndChangeNothing
          - ApiAuditor_CreateReview_AuditorIs403AndNonMemberIs404

      - id: ReviewCenter-System-Auditor-BlockedWhileSlot
        title: >-
          The tool shall refuse to make a member an auditor while the member holds an unsigned or out-of-date
          reviewer slot on a review that is not approved.
        tags: [system]
        justification: |
          Refusing the role while the member still owes a signature keeps a review from waiting for somebody who
          may no longer sign.
        children:
          - ReviewCenter-Core-ProjectAccess-AuditorRoleBlocked

      - id: ReviewCenter-System-FollowUpReview
        title: >-
          The tool shall let a review be created as a follow-up of an earlier review of the same project, by hand
          or through the API.
        tags: [system]
        justification: |
          A review that fails is followed by a review of the corrected content. The reviewers should not repeat
          the checks that passed, and the record must still say which review a follow-up comes from.
        children:
          - ReviewCenter-Core-FollowUp
          - ReviewCenter-Core-FollowUp-Optional
          - ReviewCenter-Core-FollowUp-Audit
          - ReviewCenter-Core-FollowUp-AuditNone
          - ReviewCenter-Storage-FollowUp
          - ReviewCenter-Api-FollowUp
          - ReviewCenter-Api-FollowUp-Shown
          - ReviewCenter-Web-FollowUp
          - ReviewCenter-Web-FollowUp-NoChoice
          - ReviewCenter-Web-FollowUp-PlainReview
          - ReviewCenter-Web-FollowUp-Title
          - ReviewCenter-Web-FollowUp-TitleTyped
          - ReviewCenter-Web-FollowUp-Tag
          - ReviewCenter-Web-FollowUp-Refusal
          - ReviewCenter-Web-FollowUp-RefusalOnCreate
          - ReviewCenter-Web-FollowUp-EarlierFailHidden
          - ReviewCenter-Web-FollowUp-Standalone
          - ReviewCenter-Web-FollowUp-Follows
          - ReviewCenter-Web-FollowUp-FollowedBy
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn
          - ApiEndpoints_CreateReview_FollowsReviewId_IsCreatedShownAndRefusedWhenInvalid

      - id: ReviewCenter-System-FollowUpReview-Carried
        title: >-
          The tool shall carry over into a follow-up the Pass and N/A answers of unchanged checks, the
          not-applicable sections, and the open threads of the earlier review.
        tags: [system]
        justification: |
          The reviewers should not repeat the checks that passed, and an open finding must not get lost because
          the content was corrected.
        children:
          - ReviewCenter-Core-FollowUp-CarriedAnswers
          - ReviewCenter-Core-FollowUp-CarriedSections
          - ReviewCenter-Core-FollowUp-CarriedThreads
          - ReviewCenter-Core-FollowUp-ThreadAnchor
          - ReviewCenter-Storage-FollowUp-CarriedRows
          - ReviewCenter-Storage-FollowUp-CarriedRows-Counts
          - ReviewCenter-Storage-FollowUp-CarryFailsStoresNothing
          - ReviewCenter-Web-FollowUp-CarriedThreads
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn
          - ReviewService_CreateDraftAsync_FollowUp_CarriesAnswersAndSections

      - id: ReviewCenter-System-FollowUpReview-NotCarried
        title: >-
          The tool shall not carry over into a follow-up the Fail answers, the resolved threads, the threads about
          checks, the reviewer slots, or the signatures of the earlier review.
        tags: [system]
        justification: |
          A failed check must be decided again for the corrected content, and a signature or a slot of the earlier
          review says nothing about the new one.
        children:
          - ReviewCenter-Core-FollowUp-NotCarriedAnswers
          - ReviewCenter-Core-FollowUp-NotCarried
          - ReviewCenter-Core-FollowUp-CheckThreads
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn

      - id: ReviewCenter-System-FollowUpReview-NotCarriedCounted
        title: >-
          The tool shall count the threads that a follow-up leaves out of the carry.
        tags: [system]
        justification: |
          The creator sees what the carry left out and need not guess whether anything was lost, and is asked to
          confirm only a real loss, because a thread about a check is left out by design and is not counted twice.
        children:
          - ReviewCenter-Core-FollowUp-ResolvedCounted
          - ReviewCenter-Core-FollowUp-CheckThreadsCounted
          - ReviewCenter-Core-FollowUp-CheckThreadsNotDropped
        tests:
          - FollowUpCarry_Compute_ResolvedAndDroppedThreads_AreCountedAndListed
          - FollowUpCarry_CarryThreads_CheckThreads_AreNotCarriedAndNotCountedAsResolvedOrDropped
          - ReviewService_CreateFollowUpAsync_WithCheckThreads_ReportsCheckThreadsLeftOut

      - id: ReviewCenter-System-FollowUpReview-Marks
        title: >-
          The tool shall mark everything that a follow-up carries over with the review it came from.
        tags: [system]
        justification: |
          The record, and the document that goes to auditors, must still say which answers were carried and which
          were given in this review (21 CFR Part 11 section 11.10(e), records that are not obscured by later
          changes).
        children:
          - ReviewCenter-Core-FollowUp-Marks
          - ReviewCenter-Core-FollowUp-MarksProgress
          - ReviewCenter-Storage-FollowUp-ReplaceCarried
          - ReviewCenter-Web-FollowUp-CarriedMarks
          - ReviewCenter-Web-FollowUp-EarlierFail
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn

      - id: ReviewCenter-System-FollowUpReview-Refused
        title: >-
          The tool shall refuse to create a follow-up of a review that does not fit, saying why and creating
          nothing.
        tags: [system]
        justification: |
          A follow-up of a review that has nothing in common with the new content would carry data that does not
          belong to it.
        children:
          - ReviewCenter-Core-FollowUp-Unfit
          - ReviewCenter-Core-FollowUp-DuplicateId
          - ReviewCenter-Core-FollowUp-Arguments
          - ReviewCenter-Core-FollowUp-PreviewRefused
          - ReviewCenter-Core-FollowUp-PreviewHidden
          - ReviewCenter-Api-FollowUp-Invalid
        tests:
          - ApiEndpoints_CreateReview_FollowsReviewId_IsCreatedShownAndRefusedWhenInvalid

      - id: ReviewCenter-System-FollowUpReview-DropRefused
        title: >-
          The tool shall refuse to create a follow-up that would silently drop open threads of the earlier review.
        tags: [system]
        justification: |
          An open finding must not disappear because a file is not in the new review without the creator knowing
          about it.
        children:
          - ReviewCenter-Core-FollowUp-DroppedThreads
          - ReviewCenter-Web-FollowUp-DropConfirmation

      - id: ReviewCenter-System-FollowUpReview-DropAcknowledged
        title: >-
          The tool shall create a follow-up that drops open threads of the earlier review when the creator
          acknowledges them.
        tags: [system]
        justification: |
          A file may be gone on purpose, and the creator who has seen which threads go must not be stopped.
        children:
          - ReviewCenter-Core-FollowUp-Acknowledged

      - id: ReviewCenter-System-FollowUpReview-AgreedOnly
        title: >-
          The tool shall carry over into a follow-up only what the submitted ballots of the earlier review agree
          on.
        tags: [system]
        justification: |
          An answer on which the reviewers disagreed, or that is only in a draft, was not decided, so it must not
          be taken over as if it were.
        children:
          - ReviewCenter-Core-FollowUp-CarriedAnswers
          - ReviewCenter-Core-FollowUp-NotCarriedAnswers

      - id: ReviewCenter-System-FollowUpReview-SeedBallots
        title: >-
          The tool shall let a carried answer seed the draft ballot of each reviewer slot of a follow-up, so that
          it counts only when a reviewer hands the ballot in.
        tags: [system]
        justification: |
          A carried answer is only a starting point: the reviewers still hand in their ballots, so what is
          approved is what they agreed to.
        children:
          - ReviewCenter-Core-FollowUp-CarriedAnswers
          - ReviewCenter-Core-FollowUp-AnswersNoBlock

      - id: ReviewCenter-System-FollowUpReview-OpenThreads
        title: >-
          The tool shall count the open threads that a follow-up carried as open for the approval of the review.
        tags: [system]
        justification: |
          A finding that is still open must keep blocking the approval, whether it was raised in this review or
          carried over.
        children:
          - ReviewCenter-Core-FollowUp-OpenThreadsBlock
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn

      - id: ReviewCenter-System-FollowUpReview-SignatureBinding
        title: >-
          The tool shall keep a signature of a follow-up bound to the review that is followed and to the carried
          threads.
        tags: [system]
        justification: |
          What a signature covers must include where the carried content came from, so that the signature is out
          of date when that changes (21 CFR Part 11 section 11.70, signature and record linking).
        children:
          - ReviewCenter-Core-FollowUp-Digest
          - ReviewCenter-Core-FollowUp-DigestCarried
          - ReviewCenter-Storage-FollowUp-Record

      - id: ReviewCenter-System-FollowUpReview-Attestation
        title: >-
          The tool shall show the follow-up in the attestation PDF of the review.
        tags: [system]
        justification: |
          The document that goes to auditors must say which review was followed and what was carried from it.
        children:
          - ReviewCenter-Evidence-FollowUp
          - ReviewCenter-Evidence-FollowUp-Carried
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn
          - AttestationService_GenerateAsync_FollowUpReview_NamesFollowedReviewAndCarriedAnswers

      - id: ReviewCenter-System-FollowUpReview-AttestationNotShown
        title: >-
          The tool shall show nothing of the follow-up kind in the attestation PDF of a review that follows none.
        tags: [system]
        justification: |
          An ordinary review must not be described as a follow-up in the document that goes to auditors.
        children:
          - ReviewCenter-Evidence-FollowUp-NotShown

      - id: ReviewCenter-System-FollowUpReview-DigestUnchanged
        title: >-
          The tool shall keep the digest of every review that is not a follow-up unchanged.
        tags: [system]
        justification: |
          Leaving the new lines out of every other review keeps the signatures that already exist valid.
        children:
          - ReviewCenter-Core-FollowUp-DigestOthers

      - id: ReviewCenter-System-FollowUpReview-CreatorAuthor
        title: >-
          The tool shall not make the person who creates a follow-up the answerer of anything that it carries,
          and keep that person the author of the review.
        tags: [system]
        justification: |
          The creator did not give the carried answers, and independent review must still treat the creator as
          the author.
        children:
          - ReviewCenter-Core-FollowUp-CreatorAuthor

      - id: ReviewCenter-System-FollowUpReview-Preview
        title: >-
          The tool shall show, before a follow-up is created, what the follow-up would carry over, without
          storing anything.
        tags: [system]
        justification: |
          The creator can see what a follow-up takes over, and which open threads it drops, before deciding.
        children:
          - ReviewCenter-Core-FollowUp-Preview
          - ReviewCenter-Core-FollowUp-PreviewReadOnly
          - ReviewCenter-Core-FollowUp-PreviewAuditor
          - ReviewCenter-Web-FollowUp-Preview

      - id: ReviewCenter-Inbox
        title: >-
          The tool shall show each signed-in user an inbox of the reviews that wait for them.
        tags: [system]
        justification: |
          A reviewer should not have to open every project to learn what waits for them, and a late review should be
          found by the one who must act. The inbox is also the list of notifications, so a separate notification
          record is not needed. The groups of the inbox are decomposed in the requirements that follow.
        children:
          - ReviewCenter-Core-Inbox-AccessConcluded
          - ReviewCenter-Core-Inbox-EachGroup
          - ReviewCenter-Storage-Inbox-Candidates
          - ReviewCenter-Storage-Inbox-LightRecords
          - ReviewCenter-Web-Inbox
          - ReviewCenter-Web-Inbox-DueMark
          - ReviewCenter-Web-Inbox-Empty
          - ReviewCenter-Web-Inbox-Interactive
          - ReviewCenter-Web-Inbox-HomeCountNone
          - ReviewCenter-Web-Inbox-HeaderTabRefresh
          - ReviewCenter-Web-Inbox-HeaderTabNoTab
          - ReviewCenter-Web-Inbox-HeaderTabReadFailure
          - ReviewCenter-Web-Inbox-MarkersSummary
          - ReviewCenter-Web-Inbox-MarkersNone
          - ReviewCenter-Web-Inbox-SeenNoAccess
          - ReviewCenter-Web-Inbox-Summary
          - ReviewCenter-Web-Inbox-Chip
          - ReviewCenter-Web-Inbox-SignedInOnly
          - ReviewCenter-Web-Inbox-HelpTopic
        tests:
          - ReviewCenter_Inbox_AssignedReviewer_SeesToSignItemAndHomeCount_UntilSigned
          - CoreSubsystem_InboxWorkflow_ValidInput_ListsActionItemsAndCounts

      - id: ReviewCenter-Inbox-ToAnswer
        title: >-
          The tool shall list in the inbox as to answer the ballots that the user has not handed in, with a chip and
          a link to the checklist of the review.
        tags: [system]
        justification: |
          A reviewer who has not handed in a ballot holds up the review, and must find the ballot at once.
        children:
          - ReviewCenter-Core-Inbox
          - ReviewCenter-Core-Inbox-ToAnswerRow
          - ReviewCenter-Core-Inbox-ToAnswerAgain
          - ReviewCenter-Core-Inbox-ToAnswerLink
          - ReviewCenter-Core-Inbox-ToAnswerExcluded

      - id: ReviewCenter-Inbox-QuestionForYou
        title: >-
          The tool shall list in the inbox as to answer an open question of someone else that the user can answer.
        tags: [system]
        justification: |
          A question that nobody answers keeps a review open, so the person who can answer it must be told.
        children:
          - ReviewCenter-Core-Inbox-QuestionForYou
          - ReviewCenter-Core-Inbox-QuestionRow
          - ReviewCenter-Core-Inbox-QuestionCount
          - ReviewCenter-Core-Inbox-QuestionNotListed

      - id: ReviewCenter-Inbox-Disputed
        title: >-
          The tool shall list in the inbox as disputed a review in which the ballots that were handed in differ on
          some checks.
        tags: [system]
        justification: |
          Reviewers who answered a check differently must settle it before the review can conclude.
        children:
          - ReviewCenter-Core-Inbox-Disputed
          - ReviewCenter-Core-Inbox-DisputedRow
          - ReviewCenter-Core-Inbox-DisputedSettled

      - id: ReviewCenter-Inbox-ToSign
        title: >-
          The tool shall list in the inbox as ready to sign a review that the user may sign now, with the state of
          the signature, the due date, and the reviewers that are waited for.
        tags: [system]
        justification: |
          The signature is the last step of a review, so the signer must see when the step is ready and what is
          missing.
        children:
          - ReviewCenter-Core-Inbox-ToSign
          - ReviewCenter-Core-Inbox-ToSignBallotNotIn
          - ReviewCenter-Core-Inbox-ToSignBlocked
          - ReviewCenter-Core-Inbox-ToSignDisputeSettled
          - ReviewCenter-Core-Inbox-ToSignConclusionText
          - ReviewCenter-Core-Inbox-ToSignConclusionTextWritten
          - ReviewCenter-Core-Inbox-ToSignNotSigned
          - ReviewCenter-Core-Inbox-ToSignAgain
          - ReviewCenter-Core-Inbox-ToSignSlotState
          - ReviewCenter-Core-Inbox-ToSignMatchesStatus
          - ReviewCenter-Core-Inbox-ToSignOpenThread
          - ReviewCenter-Core-Inbox-ToSignOpenThreadReplies
          - ReviewCenter-Core-Inbox-ToSignDueDate
          - ReviewCenter-Core-Inbox-ToSignOverdue
          - ReviewCenter-Core-Inbox-ToSignConcluded
          - ReviewCenter-Core-Inbox-ToSignMissingBallots

      - id: ReviewCenter-Inbox-SignatureLost
        title: >-
          The tool shall list in the inbox as signature lost a review in which the signature of the user no longer
          counts, and turn the row into ready to sign when nothing blocks a new signature.
        tags: [system]
        justification: |
          A signer whose approval was taken away by a change must learn it, because the review cannot conclude
          without a new signature.
        children:
          - ReviewCenter-Core-Inbox-SignatureLost
          - ReviewCenter-Core-Inbox-SignatureLostRow
          - ReviewCenter-Core-Inbox-SignatureLostReady
          - ReviewCenter-Core-Inbox-SignatureLostWaiting
          - ReviewCenter-Core-Inbox-SignatureLostCount
          - ReviewCenter-Core-Inbox-SignatureLostNobodyElse
          - ReviewCenter-Core-Inbox-SignatureLostConcluded

      - id: ReviewCenter-Inbox-RepliesWaiting
        title: >-
          The tool shall list in the inbox as replies waiting a review with an open thread whose last comment is by
          someone else, and word the text by the kind of the open threads.
        tags: [system]
        justification: |
          A discussion that waits for an answer holds up the review, and the person who must answer must see it.
        children:
          - ReviewCenter-Core-Inbox-RepliesWaiting
          - ReviewCenter-Core-Inbox-RepliesWaitingAuthor
          - ReviewCenter-Core-Inbox-RepliesWaitingSystem
          - ReviewCenter-Core-Inbox-RepliesWaitingChip
          - ReviewCenter-Core-Inbox-RepliesWaitingNot
          - ReviewCenter-Core-Inbox-KindWording

      - id: ReviewCenter-Inbox-FailedChecks
        title: >-
          The tool shall list in the inbox as failed checks the checks that the submitted ballots agree to be failed,
          to the creator of the review.
        tags: [system]
        justification: |
          The creator must act on the failed checks of the review, and must not be misled by a draft or by a
          disagreement.
        children:
          - ReviewCenter-Core-Inbox-FailedChecks
          - ReviewCenter-Core-Inbox-FailedChecksNotCounted
          - ReviewCenter-Core-Inbox-FailedChecksRow
          - ReviewCenter-Core-Inbox-FailedChecksNotCreator
          - ReviewCenter-Core-Inbox-FailedChecksNotApplicable
          - ReviewCenter-Core-Inbox-FailedChecksConcluded

      - id: ReviewCenter-Inbox-WaitingForOthers
        title: >-
          The tool shall list in the inbox, for information, a review that waits for other people, without a due
          date.
        tags: [system]
        justification: |
          A user who has done their part wants to know who holds up the review, and must not mistake that for an
          action.
        children:
          - ReviewCenter-Core-Inbox-WaitingForOthers
          - ReviewCenter-Core-Inbox-WaitingRow
          - ReviewCenter-Core-Inbox-WaitingNoDueDate

      - id: ReviewCenter-Inbox-Updates
        title: >-
          The tool shall list in the inbox, for information, a review that was approved, rejected, or reopened by
          someone else since the user last looked.
        tags: [system]
        justification: |
          The user must learn how a review ended or that it was reopened, without opening every review again.
        children:
          - ReviewCenter-Core-Inbox-Updates
          - ReviewCenter-Core-Inbox-UpdatesRejected
          - ReviewCenter-Core-Inbox-UpdatesReopened
          - ReviewCenter-Core-Inbox-UpdatesOwn
          - ReviewCenter-Core-Inbox-UpdatesSeen
          - ReviewCenter-Core-Inbox-UpdatesCreator

      - id: ReviewCenter-Inbox-NoOthersAnswers
        title: >-
          The tool shall never show a user who has not handed in the own ballot what the others answered, in any
          group of the inbox.
        tags: [system]
        justification: |
          A reviewer who sees the answers of the others before giving their own is no longer independent.
        children:
          - ReviewCenter-Core-Inbox-DisputedHidden
          - ReviewCenter-Core-Inbox-QuestionNoBallotData
          - ReviewCenter-Core-Inbox-WaitingNoVerdict
          - ReviewCenter-Core-Inbox-UnreadHidden

      - id: ReviewCenter-Inbox-ActionCount
        title: >-
          The tool shall count as needing action only the reviews in the groups that ask the user to act, and not an
          update and not a review that waits for others.
        tags: [system]
        justification: |
          One number is shown in two places, so it must be calculated by one rule, and a number that includes
          information would stop the user from trusting it.
        children:
          - ReviewCenter-Core-Inbox-Count
          - ReviewCenter-Core-Inbox-CountNotCounted
        tests:
          - CoreSubsystem_InboxWorkflow_ValidInput_ListsActionItemsAndCounts

      - id: ReviewCenter-Inbox-HomeCount
        title: >-
          The tool shall show the number of reviews that need action on the home page.
        tags: [system]
        justification: |
          The user sees at the first page whether something waits, without opening the inbox.
        children:
          - ReviewCenter-Web-Inbox-HomeCount
        tests:
          - ReviewCenter_Inbox_AssignedReviewer_SeesToSignItemAndHomeCount_UntilSigned

      - id: ReviewCenter-Inbox-HeaderTab
        title: >-
          The tool shall show the number of reviews that need action on an Inbox tab of the header.
        tags: [system]
        justification: |
          The user sees on every page whether something waits.
        children:
          - ReviewCenter-Web-Inbox-HeaderTab

      - id: ReviewCenter-Inbox-NewMarks
        title: >-
          The tool shall mark in the inbox what is new since the last visit of the user.
        tags: [system]
        justification: |
          The user finds what changed without reading every item again.
        children:
          - ReviewCenter-Core-Inbox-DisputedUnread
          - ReviewCenter-Core-Inbox-WaitingNeverUnread
          - ReviewCenter-Core-Inbox-Unread
          - ReviewCenter-Core-Inbox-UnreadNeverSeen
          - ReviewCenter-Core-Inbox-UnreadOwn
          - ReviewCenter-Core-Inbox-UnreadItem
          - ReviewCenter-Core-Inbox-UnreadChanges
          - ReviewCenter-Core-Inbox-UnreadBallot
          - ReviewCenter-Core-Inbox-UnreadDraftIgnored
          - ReviewCenter-Web-Inbox-NewBadge

      - id: ReviewCenter-Inbox-NewMarksComments
        title: >-
          The tool shall mark the new comments of a review in its thread index and in its threads.
        tags: [system]
        justification: |
          The user finds the comments written since the last visit in the review itself.
        children:
          - ReviewCenter-Core-Inbox-UnreadCount
          - ReviewCenter-Web-Inbox-IndexMarkers
          - ReviewCenter-Web-Inbox-ThreadMarkers

      - id: ReviewCenter-Inbox-SeenState
        title: >-
          The tool shall remember what a user has seen of each review, and move the remembered state only
          forward.
        tags: [system]
        justification: |
          What is new can only be told when the last visit is kept, and an older visit must never make a seen
          comment new again.
        children:
          - ReviewCenter-Core-Inbox-MarkSeen
          - ReviewCenter-Core-Inbox-NeverBackwards
          - ReviewCenter-Core-Inbox-MarkSeenRefused
          - ReviewCenter-Core-Inbox-MarkSeenArguments
          - ReviewCenter-Storage-Inbox
          - ReviewCenter-Storage-Inbox-NeverBackwards
          - ReviewCenter-Storage-Inbox-NoFailure
          - ReviewCenter-Storage-Inbox-ReviewDeleted
          - ReviewCenter-Storage-Inbox-UserDeleted
          - ReviewCenter-Web-Inbox-SeenOnVisit
        tests:
          - StorageSubsystem_InboxOverDatabase_ReopenedDatabase_KeepsStateAndShowsItems

      - id: ReviewCenter-Inbox-MarkAllRead
        title: >-
          The tool shall let the user mark all items of the inbox as read.
        tags: [system]
        justification: |
          A user who has caught up can clear the marks with one action.
        children:
          - ReviewCenter-Core-Inbox-MarkAll
          - ReviewCenter-Web-Inbox-MarkAllRead

      - id: ReviewCenter-Inbox-OwnProjects
        title: >-
          The tool shall show in the inbox only the reviews of projects the user may see, by the access that the
          user has at the time.
        tags: [system]
        justification: |
          The inbox follows the current access, so a person who lost access to a project no longer learns anything
          about its reviews.
        children:
          - ReviewCenter-Core-Inbox-Access
          - ReviewCenter-Core-Inbox-AccessCurrent
          - ReviewCenter-Core-Inbox-AccessEmpty
          - ReviewCenter-Core-Inbox-AccessSysadmin

      - id: ReviewCenter-Inbox-ActionsForWorkers
        title: >-
          The tool shall offer a signature to give or a reply to give only to a user who may work in the project.
        tags: [system]
        justification: |
          An auditor, and an API token, cannot give a signature or a reply, so the inbox must not ask for one.
        children:
          - ReviewCenter-Core-Inbox-AccessAuditor
          - ReviewCenter-Core-Inbox-QuestionNoAction
          - ReviewCenter-Core-Inbox-QuestionApiToken
          - ReviewCenter-Core-Inbox-FailedChecksApiToken

      - id: ReviewCenter-Inbox-NotAudited
        title: >-
          The tool shall keep the state of what a user has seen out of the audit trail.
        tags: [system]
        justification: |
          What a person has seen is personal information and not a change of a review (21 CFR Part 11 section
          11.10(e), a trail of the changes of records).
        children:
          - ReviewCenter-Core-Inbox-SeenNotAudited

      - id: ReviewCenter-Inbox-NotInSignature
        title: >-
          The tool shall keep the state of what a user has seen out of what a signature covers.
        tags: [system]
        justification: |
          Leaving what a person has seen out of the record digest keeps the signatures valid.
        children:
          - ReviewCenter-Core-Inbox-SeenNotAudited

      # ----------------------------------------------------------------------------------------------
      # Review activity: the discussion and the checklist
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Comments
        title: >-
          The tool shall let a signed-in user start a comment thread on a file of a review, anchored to the whole
          file or to a range of lines.
        tags: [system]
        justification: |
          Review comments are the substance of a review. Anchoring each one to the code it concerns makes the
          finding traceable to the exact content.
        children:
          - ReviewCenter-Web-Comments
          - ReviewCenter-Web-Comments-StartError
          - ReviewCenter-Web-Comments-StartErrorKeepValues
          - ReviewCenter-Web-Comments-Shortcut
          - ReviewCenter-Web-Comments-ShortcutHint
          - ReviewCenter-Web-Comments-BinaryWholeFile
          - ReviewCenter-Web-Comments-BinaryRange
          - ReviewCenter-Web-Comments-SessionEnded
          - ReviewCenter-Web-Comments-KindChoice
          - ReviewCenter-Web-Comments-KindChoiceFinding
          - ReviewCenter-Web-Comments-KindChoiceSingleSlot
          - ReviewCenter-Web-Comments-KindChoiceCheck
          - ReviewCenter-Web-Comments-ReplyReport
          - ReviewCenter-Web-Comments-ReplyChat
          - ReviewCenter-Web-Comments-KindBadge
          - ReviewCenter-Web-Comments-KindBadgeInReport
          - ReviewCenter-Web-Comments-KindBadgeCard
          - ReviewCenter-Web-Comments-KindBadgeNotColorAlone
          - ReviewCenter-Web-Comments-KindBadgeChatBubble
          - ReviewCenter-Web-Comments-DiffMarkers
          - ReviewCenter-Web-Comments-DiffMarkersCount
          - ReviewCenter-Web-Comments-DiffMarkersName
          - ReviewCenter-Web-Comments-DiffMarkersNone
          - ReviewCenter-Web-Comments-NextStep
          - ReviewCenter-Web-Comments-NextStepMasked
          - ReviewCenter-Web-Comments-Index
          - ReviewCenter-Web-Comments-IndexDefaultFilter
          - ReviewCenter-Web-Comments-IndexSelect
          - ReviewCenter-Web-Comments-IndexSelectHighlight
          - ReviewCenter-Web-Comments-IndexSelectScroll
          - ReviewCenter-Web-Comments-IndexSelectDiffView
          - ReviewCenter-Web-Comments-IndexNoDiff
          - ReviewCenter-Web-Comments-KindFilter
          - ReviewCenter-Web-Comments-Threads
          - ReviewCenter-Web-Comments-CheckThreads
          - ReviewCenter-Web-Comments-CheckThreadsCard
          - ReviewCenter-Web-Comments-CheckThreadsApart
          - ReviewCenter-Web-Comments-CheckThreadsPlainText
          - ReviewCenter-Web-Comments-CheckThreadsActions
          - ReviewCenter-Web-Comments-CheckThreadsNoForm
          - ReviewCenter-Web-Comments-CheckThreadOpen
          - ReviewCenter-Web-Comments-ConclusionFindings
          - ReviewCenter-Web-Comments-ConclusionMasked
          - ReviewCenter-Web-Comments-Collapsed
          - ReviewCenter-Web-Comments-OpenExpanded
          - ReviewCenter-Core-Threads
          - ReviewCenter-Core-Threads-Author
          - ReviewCenter-Core-Threads-Activity
          - ReviewCenter-Core-Threads-Index
          - ReviewCenter-Core-Threads-NextStep
          - ReviewCenter-Core-Rules-ThreadAnchor
          - ReviewCenter-Core-Rules-CommentText
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-System-Comments-DiffSides
        title: >-
          The tool shall let a signed-in user anchor a comment thread to a line of either side of a comparison.
        tags: [system]
        justification: |
          A finding about a line that a change removed, or one that it added, must be anchored to that line on the
          side where it is.
        children:
          - ReviewCenter-Web-DiffReview-LineComment
          - ReviewCenter-Web-DiffReview-LineThreads
          - ReviewCenter-Core-Diff-ThreadSide
          - ReviewCenter-Core-RepositoryReviews-CommentAccepted
        tests:
          - PuppetEndToEnd_ReviewDiff_HoverRevealsLineCommentAndClickOpensComposer_WorksAgainstRealServer

      - id: ReviewCenter-System-Comments-DiffSidesRefused
        title: >-
          The tool shall refuse a comment thread on a side or a line of a comparison where the file has no such
          line.
        tags: [system]
        justification: |
          A thread anchored to a line that does not exist would point at nothing and mislead the reader.
        children:
          - ReviewCenter-Core-Diff-ThreadSideRefused
          - ReviewCenter-Core-RepositoryReviews-CommentOnHead

      - id: ReviewCenter-System-Comments-Reply
        title: >-
          The tool shall let a signed-in user reply to a comment thread, in the order of posting.
        tags: [system]
        justification: |
          A finding is discussed in the thread that holds it, and the order of the replies makes the discussion
          readable.
        children:
          - ReviewCenter-Web-Comments-Reply
          - ReviewCenter-Web-Comments-ReplyError
          - ReviewCenter-Web-Comments-KindButtons
          - ReviewCenter-Web-Comments-Auditor
          - ReviewCenter-Core-Threads-Reply

      - id: ReviewCenter-System-Comments-ThreadNotFound
        title: >-
          The tool shall refuse a reply to, and the resolving or reopening of, a thread that does not exist in the
          review.
        tags: [system]
        justification: |
          A change that names a thread of another review, or none, must not be applied to a thread by mistake.
        children:
          - ReviewCenter-Core-Threads-ReplyNotFound
          - ReviewCenter-Core-Threads-StateNotFound

      - id: ReviewCenter-System-Comments-ResolveReopen
        title: >-
          The tool shall let a signed-in user resolve a comment thread and reopen a resolved one.
        tags: [system]
        justification: |
          A finding that was dealt with is closed, and it can be opened again when it was closed by mistake or came
          back.
        children:
          - ReviewCenter-Web-Comments-Resolve
          - ReviewCenter-Web-Comments-ResolveFinding
          - ReviewCenter-Web-Comments-ResolveFinding-Cancel
          - ReviewCenter-Web-Comments-SignatureWarning
          - ReviewCenter-Web-Comments-SignatureWarning-KeepNote
          - ReviewCenter-Web-Comments-WarningCancelled
          - ReviewCenter-Web-Comments-Reopen
          - ReviewCenter-Core-Threads-ResolveReopen

      - id: ReviewCenter-System-Comments-DeepLink
        title: >-
          The tool shall open a thread by a link that survives sign-in.
        tags: [system]
        justification: |
          A link to a finding is sent to people, and a person who is not signed in must still arrive at the thread
          after signing in.
        children:
          - ReviewCenter-Web-DeepLinks
          - ReviewCenter-Web-DeepLinks-ThreadLink
          - ReviewCenter-Web-DeepLinks-ThreadLinkCopy
          - ReviewCenter-Web-DeepLinks-ThreadLinkCopyConfirm
          - ReviewCenter-Web-DeepLinks-CopyFailed
          - ReviewCenter-Web-DeepLinks-NullArgument
          - ReviewCenter-Web-DeepLinks-NotFound
          - ReviewCenter-Web-DeepLinks-NotFoundWayBack
          - ReviewCenter-Web-DeepLinks-NotFoundFileList
          - ReviewCenter-Web-DeepLinks-NotFoundCleared
          - ReviewCenter-Web-DeepLinks-UnknownSide
          - ReviewCenter-Web-DeepLinks-AddressBar
          - ReviewCenter-Web-DeepLinks-AddressBar-Opened
          - ReviewCenter-Web-DeepLinks-ReturnAfterSignIn
          - ReviewCenter-Web-DeepLinks-FirstResponse
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-Comments-Counts
        title: >-
          The tool shall show the number of open and resolved threads of the review, and of open threads per file.
        tags: [system]
        justification: |
          The reader sees at a glance how much of the discussion is still open.
        children:
          - ReviewCenter-Web-Comments-Counts
          - ReviewCenter-Web-Comments-CountsFile
          - ReviewCenter-Web-Comments-CountsUpdate
          - ReviewCenter-Core-Threads-Counts
          - ReviewCenter-Core-Threads-CountsPhrase

      - id: ReviewCenter-System-Comments-Persisted
        title: >-
          The tool shall keep every thread and comment across restarts, in order.
        tags: [system]
        justification: |
          A discussion that is lost with a restart cannot be part of a record.
        children:
          - ReviewCenter-Core-Threads-ReadBack
          - ReviewCenter-Storage-Threads
          - ReviewCenter-Storage-Threads-State
          - ReviewCenter-Storage-Threads-Comments
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments

      - id: ReviewCenter-System-Comments-NoEdit
        title: >-
          The tool shall never change or delete a posted comment.
        tags: [system]
        justification: |
          Comments that cannot be edited or deleted make the discussion a trustworthy record (21 CFR Part 11
          section 11.10(e), records that are not obscured by later changes).
        children:
          - ReviewCenter-Core-Threads-NoEdit

      - id: ReviewCenter-System-Comments-ConcludedLocked
        title: >-
          The tool shall refuse a change of the threads of a concluded review.
        tags: [system]
        justification: |
          What was concluded must stay as it was reviewed, so that the signatures keep covering it.
        children:
          - ReviewCenter-Storage-Threads-ConcludedRefused

      - id: ReviewCenter-System-Comments-ReportInclusion
        title: >-
          The tool shall let the writer of a comment include it in the report.
        tags: [system]
        justification: |
          Only what the reviewers want to be part of the formal result goes into the report.
        children:
          - ReviewCenter-Core-Threads-IncludedComment
          - ReviewCenter-Core-Threads-IncludedList
          - ReviewCenter-Core-Threads-CommentToggle
          - ReviewCenter-Storage-Threads-Report

      - id: ReviewCenter-System-Comments-ReportInclusion-Chat
        title: >-
          The tool shall treat a comment that is not included in the report as chat.
        tags: [system]
        justification: |
          The conversation of the reviewers must be able to stay out of the formal result.
        children:
          - ReviewCenter-Core-Threads-Chat

      - id: ReviewCenter-System-Comments-ReportInclusion-Kind
        title: >-
          The tool shall tell a Finding from a Question by whether the starting comment of the thread is included in
          the report.
        tags: [system]
        justification: |
          The reader of the report must see at once which threads are findings, without a second flag to maintain.
        children:
          - ReviewCenter-Core-Threads-Kind
          - ReviewCenter-Storage-Threads-Report

      - id: ReviewCenter-System-Comments-ReportInclusionRefused
        title: >-
          The tool shall refuse to change whether a comment is included in the report for a user who may not, and
          for the starting comment or a Resolution comment.
        tags: [system]
        justification: |
          Another person must not turn a comment into a finding, and the starting comment and the resolution have
          their own rules.
        children:
          - ReviewCenter-Core-Threads-CommentToggleRefused
          - ReviewCenter-Core-Threads-CommentToggleTarget

      - id: ReviewCenter-System-Comments-ResolutionNote
        title: >-
          The tool shall store the resolution note of a resolved thread as a Resolution comment, include it in the
          report for a Finding and not for a Question, and accept resolving a Question without a note.
        tags: [system]
        justification: |
          The reason why a finding was closed is part of the record, while a question needs no more than its
          answer.
        children:
          - ReviewCenter-Core-Threads-ResolutionNoteQuestion
          - ReviewCenter-Core-Threads-ResolutionNoteStored
          - ReviewCenter-Core-Threads-ResolutionNoteReport
          - ReviewCenter-Core-Threads-ResolutionNoteRepeated
          - ReviewCenter-Core-Threads-ResolutionNoteReopen

      - id: ReviewCenter-System-Comments-ResolutionNoteRefused
        title: >-
          The tool shall refuse to resolve a Finding without a resolution note, with a note that is too long, or
          when the record changed, and leave the thread open.
        tags: [system]
        justification: |
          A finding that is closed without a reason, or on a record that is no longer what the user saw, would make
          the record untrustworthy.
        children:
          - ReviewCenter-Core-Threads-ResolutionNote
          - ReviewCenter-Core-Threads-ResolutionNoteTooLong
          - ReviewCenter-Core-Threads-ResolutionNoteRecordChanged

      - id: ReviewCenter-System-Comments-Promotion
        title: >-
          The tool shall let the starter of a thread, the owner of a reviewer slot, and a lead promote a Question to
          a Finding and demote a Finding to a Question.
        tags: [system]
        justification: |
          A question can turn out to be a finding, and a finding can turn out to be a misunderstanding.
        children:
          - ReviewCenter-Core-Threads-Promotion
          - ReviewCenter-Core-Threads-PromotionLead
          - ReviewCenter-Core-Threads-PromotionReport
          - ReviewCenter-Core-Threads-Demotion
          - ReviewCenter-Core-Threads-PromotionRepeated

      - id: ReviewCenter-System-Comments-PromotionRefused
        title: >-
          The tool shall refuse to promote or demote a thread for a user who may not, and to promote a resolved
          Question that has no resolution note.
        tags: [system]
        justification: |
          Another person must not change the weight of a finding, and a promoted thread that is resolved needs the
          reason of its closing.
        children:
          - ReviewCenter-Core-Threads-PromotionRefused
          - ReviewCenter-Core-Threads-PromotionResolved

      - id: ReviewCenter-System-Comments-CheckThreads
        title: >-
          The tool shall let a thread be anchored to a check of the frozen checklist of the review, replied to,
          resolved, reopened, and written into the canonical text of the review.
        tags: [system]
        justification: |
          A discussion about a check belongs to the check, and it is covered by the record like every other
          thread.
        children:
          - ReviewCenter-Core-Threads-CheckThreads
          - ReviewCenter-Core-Threads-CheckThreadsLifecycle
          - ReviewCenter-Core-Threads-CheckThreadStart
          - ReviewCenter-Core-Threads-CheckThreadStartChat
          - ReviewCenter-Core-Threads-CheckThreadDigest

      - id: ReviewCenter-System-Comments-CheckThreadsRefused
        title: >-
          The tool shall refuse to start a thread about a check with an anchor that does not fit, for a user who may
          not, in a concluded review, or without the acknowledgement that it needs.
        tags: [system]
        justification: |
          A thread about a check can make signatures out of date, so only a user who may do that is allowed to, and
          only knowingly.
        children:
          - ReviewCenter-Core-Threads-CheckThreadsRefused
          - ReviewCenter-Core-Threads-CheckThreadStartRefused
          - ReviewCenter-Core-Threads-CheckThreadStartLocked
          - ReviewCenter-Core-Threads-CheckThreadStartAcknowledge

      - id: ReviewCenter-System-Comments-Capabilities
        title: >-
          The tool shall tell a viewer, by the rules that the thread actions enforce, which actions are allowed on
          the threads of a review.
        tags: [system]
        justification: |
          The page offers only what is allowed, and the offer cannot differ from what is enforced.
        children:
          - ReviewCenter-Core-Threads-Capabilities
          - ReviewCenter-Core-Threads-CapabilitiesLimited
          - ReviewCenter-Core-Threads-CapabilitiesEquality

      - id: ReviewCenter-System-Checklist
        title: >-
          The tool shall give every review a checklist that follows the Continuous Compliance review template.
        tags: [system]
        justification: |
          The checklist is how a formal review shows what was examined against a defined standard.
        children:
          - ReviewCenter-Web-Checklist
          - ReviewCenter-Web-Checklist-MaskedFailed
          - ReviewCenter-Web-Checklist-None
          - ReviewCenter-Web-Checklist-Page
          - ReviewCenter-Web-Checklist-OneSection
          - ReviewCenter-Web-Checklist-NotFound
          - ReviewCenter-Web-Checklist-NoChecklist
          - ReviewCenter-Core-Checklist
          - ReviewCenter-Core-Checklist-Default

      - id: ReviewCenter-System-Checklist-Frozen
        title: >-
          The tool shall let a review keep the checklist it was created with.
        tags: [system]
        justification: |
          Freezing the wording at creation means a later change of the template cannot alter what the reviewers
          answered.
        children:
          - ReviewCenter-Core-Checklist-Frozen
        tests:
          - ReviewCenter_ChecklistTemplate_ReplaceChangesOnlyNewReviewsAndResetRestoresTheDefault

      - id: ReviewCenter-System-Checklist-Answer
        title: >-
          The tool shall let a user answer each check Pass, Fail, or N/A, with a justification where one is
          required.
        tags: [system]
        justification: |
          The answers are the result of the review, and a stated reason makes an answer that needs one traceable.
        children:
          - ReviewCenter-Web-Checklist-Answer
          - ReviewCenter-Web-Checklist-AnswerPass
          - ReviewCenter-Web-Checklist-AnswerPassNoJustification
          - ReviewCenter-Web-Checklist-AnswerJustify
          - ReviewCenter-Web-Checklist-AnswerJustify-Required
          - ReviewCenter-Web-Checklist-AnswerJustify-Save
          - ReviewCenter-Web-Checklist-AnswerBy
          - ReviewCenter-Web-Checklist-AnswerByShown
          - ReviewCenter-Web-Checklist-AnswerByNoNameField
          - ReviewCenter-Web-Checklist-AnswerViolation
          - ReviewCenter-Core-Checklist-Answer
          - ReviewCenter-Core-Checklist-AnswerJustification
          - ReviewCenter-Core-Checklist-AnsweredBy
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-Checklist-AnswerRefused
        title: >-
          The tool shall refuse an answer for a check or a review that does not exist, and an outcome that is not
          defined.
        tags: [system]
        justification: |
          An answer that does not belong to a check of the review must not be stored as if it did.
        children:
          - ReviewCenter-Core-Checklist-AnswerRefused

      - id: ReviewCenter-System-Checklist-Applicability
        title: >-
          The tool shall let a user mark a section of the checklist as not applicable, with a reason.
        tags: [system]
        justification: |
          Every N/A needs a stated reason, so that skipped checks are explained and not silent.
        children:
          - ReviewCenter-Web-Checklist-Applicability
          - ReviewCenter-Web-Checklist-ApplicabilityRefused
          - ReviewCenter-Web-Checklist-ApplicabilityRefused-Counted
          - ReviewCenter-Web-Checklist-ApplicabilityPending
          - ReviewCenter-Web-Checklist-ApplicabilityPendingNothingStored
          - ReviewCenter-Core-Checklist-Applicability

      - id: ReviewCenter-System-Checklist-Remaining
        title: >-
          The tool shall show a reviewer what is left to do on the checklist, and lead the reviewer to the next
          unanswered check.
        tags: [system]
        justification: |
          A reviewer must see at a glance what is unanswered and be led to the next check.
        children:
          - ReviewCenter-Web-Checklist-Remaining
          - ReviewCenter-Web-Checklist-NextUnanswered
          - ReviewCenter-Web-Checklist-NextUnansweredDone
          - ReviewCenter-Web-Checklist-NextUnansweredNoNext
          - ReviewCenter-Core-Checklist-Progress

      - id: ReviewCenter-System-Checklist-Persisted
        title: >-
          The tool shall keep the checklist, the answers, and the applicability of the sections in the database
          across restarts.
        tags: [system]
        justification: |
          Answers that are lost with a restart cannot be part of a record.
        children:
          - ReviewCenter-Storage-Checklist
          - ReviewCenter-Storage-Checklist-Sections
          - ReviewCenter-Storage-Checklist-Answers
        tests:
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen

      - id: ReviewCenter-System-Checklist-Ballot
        title: >-
          The tool shall let a reviewer hand in the ballot of the own reviewer slot, and keep the ballot in step
          with the slot.
        tags: [system]
        justification: |
          What a reviewer answered counts only when the reviewer hands it in, and a ballot must not outlive or
          lack the slot that it belongs to.
        children:
          - ReviewCenter-Web-Checklist-SubmitBallot
          - ReviewCenter-Web-Checklist-BallotStatus
          - ReviewCenter-Web-Checklist-SubmitHidden
          - ReviewCenter-Core-Checklist-BallotSubmit
          - ReviewCenter-Core-Checklist-BallotSubmit-Incomplete
          - ReviewCenter-Core-Checklist-BallotSubmit-Repeat
          - ReviewCenter-Core-Checklist-BallotSlot
          - ReviewCenter-Core-Checklist-BallotSlot-OwnBallot
          - ReviewCenter-Core-Checklist-SingleSlot
          - ReviewCenter-Storage-Checklist-BallotStatus
          - ReviewCenter-Storage-Checklist-BallotSlotLifecycle
          - ReviewCenter-Storage-Checklist-BallotSlotLifecycle-Seed
          - ReviewCenter-Storage-Checklist-BallotSlotLifecycle-LeaverRemoved

      - id: ReviewCenter-System-Checklist-NoSlotView
        title: >-
          The tool shall tell a user without a reviewer slot on the checklist page how to join, and show the
          consolidated standing of a single-slot or concluded review.
        tags: [system]
        justification: |
          A user who is not a reviewer still learns where the review stands and how to take part.
        children:
          - ReviewCenter-Web-Checklist-JoinNotice
          - ReviewCenter-Web-Checklist-Standing

      - id: ReviewCenter-System-Checklist-ProjectTemplate
        title: >-
          The tool shall let a project administrator define the checklist that new reviews of the project start
          with, by importing a definition or by resetting to the built-in default.
        tags: [system]
        justification: |
          A project has its own standard, and a change of it must leave the checklists of existing reviews as they
          are.
        children:
          - ReviewCenter-Web-ChecklistTemplate
          - ReviewCenter-Web-ChecklistTemplate-StartLineHidden
          - ReviewCenter-Web-ChecklistTemplate-ExportRightLost
          - ReviewCenter-Web-ChecklistTemplate-ImportFileRefused
          - ReviewCenter-Web-ChecklistTemplate-ImportFileRefusedDropsImport
          - ReviewCenter-Web-ChecklistTemplate-ValidationNothingChanged
          - ReviewCenter-Web-ChecklistTemplate-ValidationNoPreview
          - ReviewCenter-Web-ChecklistTemplate-ValidationNothingStored
          - ReviewCenter-Web-ChecklistTemplate-ValidationSample
          - ReviewCenter-Web-ChecklistTemplate-DifferencesNone
          - ReviewCenter-Web-ChecklistTemplate-DifferencesNothingToReplace
          - ReviewCenter-Web-ChecklistTemplate-LabelWarning
          - ReviewCenter-Web-ChecklistTemplate-PreviewNullArgument
          - ReviewCenter-Web-ChecklistTemplate-ConfirmationCancelled
          - ReviewCenter-Web-ChecklistTemplate-ReplaceRefused
          - ReviewCenter-Web-ChecklistTemplate-ReplaceNothingStored
          - ReviewCenter-Web-ChecklistTemplate-ReplaceKeepsCandidate
          - ReviewCenter-Web-ChecklistTemplate-OtherProject
          - ReviewCenter-Web-ChecklistTemplate-StartLine
          - ReviewCenter-Web-ChecklistTemplate-ExportCurrent
          - ReviewCenter-Web-ChecklistTemplate-ExportDefault
          - ReviewCenter-Web-ChecklistTemplate-ImportPaste
          - ReviewCenter-Web-ChecklistTemplate-ImportFile
          - ReviewCenter-Web-ChecklistTemplate-Preview
          - ReviewCenter-Web-ChecklistTemplate-Differences
          - ReviewCenter-Web-ChecklistTemplate-Replace
          - ReviewCenter-Web-ChecklistTemplate-Confirmation
          - ReviewCenter-Web-ChecklistTemplate-Reset
          - ReviewCenter-Web-ChecklistTemplate-Topic
          - ReviewCenter-Core-ProjectChecklist
          - ReviewCenter-Core-ProjectChecklist-Access
          - ReviewCenter-Core-ProjectChecklist-AdminChange
          - ReviewCenter-Core-ProjectChecklist-AdminChange-Recheck
          - ReviewCenter-Core-ProjectChecklist-Change
          - ReviewCenter-Core-ProjectChecklist-NoChange
          - ReviewCenter-Core-ProjectChecklist-Reset
          - ReviewCenter-Core-ProjectChecklist-ValidationRules
          - ReviewCenter-Storage-ProjectChecklist
          - ReviewCenter-Storage-ProjectChecklist-Default
          - ReviewCenter-Storage-ProjectChecklist-CompareAndSet
        tests:
          - ReviewCenter_ChecklistTemplate_ReplaceChangesOnlyNewReviewsAndResetRestoresTheDefault

      - id: ReviewCenter-System-Checklist-ProjectTemplate-Audit
        title: >-
          The tool shall record every change of the checklist of a project in the audit trail.
        tags: [system]
        justification: |
          A change of what the reviews are answered against must be traceable in the history of the project.
        children:
          - ReviewCenter-Web-ChecklistTemplate-Audit
          - ReviewCenter-Core-ProjectChecklist-Audit
          - ReviewCenter-Storage-ProjectChecklist-Audit
        tests:
          - ReviewCenter_ChecklistTemplate_ReplaceChangesOnlyNewReviewsAndResetRestoresTheDefault

      - id: ReviewCenter-System-Checklist-ProjectTemplateRefused
        title: >-
          The tool shall refuse a change of the checklist of a project that is not allowed or not valid, and
          change and record nothing.
        tags: [system]
        justification: |
          Only a project administrator may change the standard of a project, and a definition that does not pass the
          validation, or that was overtaken by another change, must not replace the checklist.
        children:
          - ReviewCenter-Web-ChecklistTemplate-HiddenProject
          - ReviewCenter-Web-ChecklistTemplate-Validation
          - ReviewCenter-Web-ChecklistTemplate-Conflict
          - ReviewCenter-Web-ChecklistTemplate-RightLost
          - ReviewCenter-Core-ProjectChecklist-Validation
          - ReviewCenter-Core-ProjectChecklist-HiddenFromOthers
          - ReviewCenter-Core-ProjectChecklist-MemberRefused
          - ReviewCenter-Core-ProjectChecklist-NoToken
          - ReviewCenter-Core-ProjectChecklist-RefusalChangesNothing
          - ReviewCenter-Core-ProjectChecklist-VersionLabel
          - ReviewCenter-Core-ProjectChecklist-Conflict
          - ReviewCenter-Core-ProjectChecklist-Arguments
          - ReviewCenter-Storage-ProjectChecklist-Stale
          - ReviewCenter-Storage-ProjectChecklist-MissingProject

      - id: ReviewCenter-System-Author
        title: >-
          The tool shall record the signed-in user, by user name and display name, as the author of every
          comment, the person of every checklist answer, and the person of every change of section
          applicability.
        tags: [system]
        justification: |
          A review record is only evidence when it says who did what (21 CFR Part 11 section 11.10(e) and
          section 11.50, signature manifestations).
        children:
          - ReviewCenter-Identity-Actor
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen

      - id: ReviewCenter-System-Author-NotEditable
        title: >-
          The tool shall not let a user enter or change the name that is recorded as the author or the person of
          a change.
        tags: [system]
        justification: |
          Taking the name from the signed-in user, and never from a form field, means nobody can act in the name of
          somebody else.
        children:
          - ReviewCenter-Identity-Actor

      - id: ReviewCenter-System-Author-NobodyRefused
        title: >-
          The tool shall refuse an action with a message, saving nothing, when nobody is signed in.
        tags: [system]
        justification: |
          An action without a person would leave a record that says nobody did it.
        children:
          - ReviewCenter-Identity-Actor-NobodyRefused

      # ----------------------------------------------------------------------------------------------
      # Review integrity and signing: independence, fresh authentication, binding, immutability
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Signatures
        title: >-
          The tool shall conclude a review as approved only while every named reviewer slot has signed the record as
          it is now with the outcome Approved.
        tags: [system]
        justification: |
          A formal review ends with the decision of the named reviewers. The outcome must be a state that the tool
          derives from the signatures and the current record, never a flag that somebody sets, so that what the
          user sees as Approved is what the reviewers signed (21 CFR Part 11 section 11.50 and section 11.70,
          signed records and signature linking).
        children:
          - ReviewCenter-Web-Signatures
          - ReviewCenter-Web-Signatures-AddSlot
          - ReviewCenter-Web-Signatures-ChangeSlot
          - ReviewCenter-Web-Signatures-ChangeSlotRemove
          - ReviewCenter-Web-Signatures-ChangeSlotBallotNote
          - ReviewCenter-Web-Signatures-SlotRefusal
          - ReviewCenter-Web-Signatures-SlotRefusal-Change
          - ReviewCenter-Web-Signatures-SignedSlotFixed
          - ReviewCenter-Web-Signatures-EditWarning
          - ReviewCenter-Web-Signatures-EditWarning-Confirm
          - ReviewCenter-Web-Signatures-NonMember
          - ReviewCenter-Web-Signatures-NonMember-Hint
          - ReviewCenter-Web-Signatures-NonMember-Choice
          - ReviewCenter-Web-Signatures-NonMember-DisabledChoice
          - ReviewCenter-Web-Signatures-MemberUnmarked
          - ReviewCenter-Web-Signatures-MemberUnmarked-NoExtraOption
          - ReviewCenter-Web-Signatures-SignatureWarning
          - ReviewCenter-Web-Signatures-SignatureWarning-SignatureKept
          - ReviewCenter-Web-Signatures-SignatureWarning-Question
          - ReviewCenter-Web-Signatures-SignatureWarning-ResolveNote
          - ReviewCenter-Web-Signatures-ChatRefusal
          - ReviewCenter-Web-Signatures-ChecklistWarning
          - ReviewCenter-Web-Signatures-ChecklistWarning-TakenBack
          - ReviewCenter-Web-Signatures-ChecklistWarning-Applicability
          - ReviewCenter-Web-Signatures-ChecklistWarning-ApplicabilityDropped
          - ReviewCenter-Web-Signatures-ChecklistWarning-NothingStored
          - ReviewCenter-Web-Signatures-ChecklistConfirm
          - ReviewCenter-Web-Signatures-ChecklistConfirmOutOfDate
          - ReviewCenter-Web-Signatures-ChecklistMerged
          - ReviewCenter-Web-Signatures-ChecklistCancel
          - ReviewCenter-Web-Signatures-ChecklistCancel-KeepChoice
          - ReviewCenter-Web-Signatures-ChecklistCancel-Revert
          - ReviewCenter-Web-Signatures-ChecklistNoWarning
          - ReviewCenter-Web-Signatures-Approve
          - ReviewCenter-Web-Signatures-ApproveOutcome
          - ReviewCenter-Web-Signatures-ApprovePasswordHidden
          - ReviewCenter-Web-Signatures-ApproveNoSecondForm
          - ReviewCenter-Web-Signatures-ApproveResult
          - ReviewCenter-Web-Signatures-WrongPassword
          - ReviewCenter-Web-Signatures-StaleRecord
          - ReviewCenter-Web-Signatures-StaleRecord-Message
          - ReviewCenter-Web-Signatures-Blockers
          - ReviewCenter-Web-Signatures-OthersNoForm
          - ReviewCenter-Core-Signatures-Sign
          - ReviewCenter-Core-Signatures-SignApproved
          - ReviewCenter-Core-Signatures-Concluded
          - ReviewCenter-Core-ApprovalLock
          - ReviewCenter-Core-ApprovalLock-Concluded
          - ReviewCenter-Core-ApprovalLock-ApprovedOnly
          - ReviewCenter-Core-BallotConsolidation-OutcomeApproved
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-Signatures-Reject
        title: >-
          The tool shall conclude a review as rejected only while every named reviewer slot has signed the record as
          it is now with the outcome Rejected.
        tags: [system]
        justification: |
          When the reviewers agree that a check has failed, the review ends with a rejection, which is a decision of
          its own and not a missing approval. Rejecting and approving are separate outcomes so that each is signed
          and shown as what it is.
        children:
          - ReviewCenter-Web-Signatures-Reject
          - ReviewCenter-Web-Signatures-RejectResult
          - ReviewCenter-Core-Signatures-Rejected
          - ReviewCenter-Core-Signatures-FailNotBlocker
          - ReviewCenter-Core-BallotConsolidation-OutcomeRejected

      - id: ReviewCenter-System-Signatures-ConclusionRequired
        title: >-
          The tool shall refuse the signature of a rejection while the review has no conclusion text.
        tags: [system]
        justification: |
          A rejection without stated reasons cannot be acted on, so the signature waits until the conclusion text
          says why.
        children:
          - ReviewCenter-Core-Signatures-RejectedConclusion
          - ReviewCenter-Core-Signatures-RejectedMessage
          - ReviewCenter-Core-Signatures-RejectedBlockers
          - ReviewCenter-Core-ApprovalLock-RejectedText

      - id: ReviewCenter-System-Signatures-Status
        title: >-
          The tool shall show on the review and in the list of reviews whether the review is Approved, Rejected, or
          In review.
        tags: [system]
        justification: |
          People decide what to do next from the status of a review, so the status they see must be the one that
          the tool derives from the signatures and the record.
        children:
          - ReviewCenter-Web-Signatures-Status
          - ReviewCenter-Web-Signatures-ProjectStatus
          - ReviewCenter-Core-Signatures-Status
          - ReviewCenter-Core-Signatures-StatusMissing
          - ReviewCenter-Core-Signatures-SlotStates
          - ReviewCenter-Core-Signatures-StatusAssignee
          - ReviewCenter-Core-Signatures-StatusAssigneeKept
          - ReviewCenter-Core-Signatures-StatusBatch
          - ReviewCenter-Core-Signatures-SlotBallotState
          - ReviewCenter-Core-Signatures-SlotBallotStateNoChecklist
          - ReviewCenter-Core-ApprovalLock-Status
          - ReviewCenter-Storage-Signatures-Batch
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-Signatures-Persisted
        title: >-
          The tool shall keep every signature in the database across restarts.
        tags: [system]
        justification: |
          A signature that is lost with a restart would silently undo an approval.
        children:
          - ReviewCenter-Storage-Signatures
          - ReviewCenter-Storage-Signatures-Current
          - ReviewCenter-Storage-Signatures-Outcome
        tests:
          - StorageSubsystem_Signatures_PersistAcrossReopenAndStayCurrent

      - id: ReviewCenter-System-Signatures-SignedRecord
        title: >-
          The tool shall record on each signature whether the signer was the primary reviewer or the alternate, the
          name of the signer, the time of signing, and the meaning of its outcome.
        tags: [system]
        justification: |
          A signature must say who made it, when, and what it means (21 CFR Part 11 section 11.50, signed records).
        children:
          - ReviewCenter-Core-Signatures-SignRecord
          - ReviewCenter-Core-Signatures-SignMeaning

      - id: ReviewCenter-System-Signatures-AlreadySigned
        title: >-
          The tool shall refuse the signature of a reviewer slot that already has a signature for the current record.
        tags: [system]
        justification: |
          A second signature of the same slot for the same record adds nothing and would blur which one stands.
        children:
          - ReviewCenter-Core-Signatures-AlreadySigned
          - ReviewCenter-Storage-Signatures-Duplicate

      - id: ReviewCenter-System-Signatures-OwnBallot
        title: >-
          The tool shall refuse the signature of a reviewer slot whose own ballot has not been handed in.
        tags: [system]
        justification: |
          A reviewer who signs without handing in their own answers approves a review that they did not check
          themselves.
        children:
          - ReviewCenter-Core-Signatures-OwnBallot
          - ReviewCenter-Core-Signatures-OwnBallotOrder
          - ReviewCenter-Storage-Signatures-SubmittedBallot

      - id: ReviewCenter-System-Signatures-EarlySigning
        title: >-
          The tool shall let a reviewer slot sign as soon as its own ballot has been handed in and nothing blocks the
          review, without waiting for the ballots of the other slots.
        tags: [system]
        justification: |
          Reviewers work at their own pace, and each signature stands on the own ballot of its reviewer while the
          review concludes only when every slot has signed.
        children:
          - ReviewCenter-Core-Signatures-EarlySigning

      - id: ReviewCenter-System-Signatures-Audit
        title: >-
          The tool shall record each signature in the audit trail with the role of the signer, the outcome, and the
          digest of the record.
        tags: [system]
        justification: |
          The audit trail shows who approved or rejected which record.
        children:
          - ReviewCenter-Core-Signatures-AuditOutcome
          - ReviewCenter-Core-AuditTrail-Signatures

      - id: ReviewCenter-System-Signatures-AuditNothing
        title: >-
          The tool shall record nothing in the audit trail for a change of a reviewer slot or a signature that it
          refuses.
        tags: [system]
        justification: |
          A refused change did not happen, and the audit trail must not claim that it did.
        children:
          - ReviewCenter-Core-AuditTrail-SigningRefused

      - id: ReviewCenter-System-Signatures-ConclusionText
        title: >-
          The tool shall let a reviewer who holds a slot of the review, and the lead of the review, write the
          conclusion text of the review.
        tags: [system]
        justification: |
          The conclusion states the reasons of the decision, so the people who decide are the people who write it.
        children:
          - ReviewCenter-Web-Signatures-Conclusion
          - ReviewCenter-Web-Signatures-ConclusionReadOnly
          - ReviewCenter-Web-Signatures-ConclusionRefusal
          - ReviewCenter-Core-Signatures-ConclusionText
          - ReviewCenter-Core-Signatures-ConclusionTextLead
          - ReviewCenter-Core-Signatures-ConclusionTextCanSet
          - ReviewCenter-Storage-Signatures-ConclusionText

      - id: ReviewCenter-System-Signatures-ConclusionTextRefused
        title: >-
          The tool shall refuse a change of the conclusion text by a user who is not a reviewer of a slot or the lead
          of the review, and by a call through an API token.
        tags: [system]
        justification: |
          Reasons that are written by somebody else, or by a script, are not the reasons of the reviewers.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextNonMember
          - ReviewCenter-Core-Signatures-ConclusionTextRefused

      - id: ReviewCenter-System-Signatures-ConclusionTextFormat
        title: >-
          The tool shall store the conclusion text with each line break as a single line feed and without leading and
          trailing white space, and a blank text as no text.
        tags: [system]
        justification: |
          A stable form of the text keeps the same words from giving two different records.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextNormalized
          - ReviewCenter-Core-Signatures-ConclusionTextBlank

      - id: ReviewCenter-System-Signatures-ConclusionTextAccepted
        title: >-
          The tool shall accept a conclusion text of up to 4000 characters.
        tags: [system]
        justification: |
          The limit is large enough for the reasons of a rejection and still bounds what a signature covers.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextMaxLength

      - id: ReviewCenter-System-Signatures-ConclusionTextInvalid
        title: >-
          The tool shall refuse a conclusion text of more than 4000 characters, or with a control character.
        tags: [system]
        justification: |
          Text that is too long or that holds control characters cannot be shown or reported safely.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextTooLong
          - ReviewCenter-Core-Signatures-ConclusionTextControl

      - id: ReviewCenter-System-Signatures-ConclusionTextStale
        title: >-
          The tool shall refuse a change of the conclusion text that another change of the text has overtaken, and
          keep the text of the other change.
        tags: [system]
        justification: |
          Two people who write the conclusion at the same time must not overwrite each other without noticing.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextConcurrent

      - id: ReviewCenter-System-Signatures-ConclusionTextAudit
        title: >-
          The tool shall record a change of the conclusion text in the audit trail with the old and the new length of
          the text, the project, the review, and the user, and never the text itself.
        tags: [system]
        justification: |
          The change is traceable to a person, while the audit trail stays free of free text.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextAudit
          - ReviewCenter-Core-Signatures-ConclusionTextAuditNoText

      - id: ReviewCenter-System-Signatures-ConclusionTextAuditNothing
        title: >-
          The tool shall record nothing in the audit trail when the conclusion text is the same as the stored one,
          and for a change that it refuses.
        tags: [system]
        justification: |
          A change that did not happen must not leave an entry that says it did.
        children:
          - ReviewCenter-Core-Signatures-ConclusionTextAuditNoChange

      - id: ReviewCenter-System-Signatures-Acknowledge
        title: >-
          The tool shall refuse a change of a ballot, a reviewer slot, a thread, or the conclusion text that would put
          a current signature out of date, and store nothing, until the caller has acknowledged the affected slots.
        tags: [system]
        justification: |
          A reviewer who makes a change must know that it takes the approval away from signers who have already
          signed, and the signers must be named.
        children:
          - ReviewCenter-Core-Signatures-Impact
          - ReviewCenter-Core-Signatures-ImpactRefused
          - ReviewCenter-Core-Signatures-BallotAcknowledge
          - ReviewCenter-Core-Signatures-BallotNames
          - ReviewCenter-Core-Signatures-BallotRemaining
          - ReviewCenter-Core-Signatures-BallotExceptionCopy
          - ReviewCenter-Core-Signatures-SlotBallotAcknowledge
          - ReviewCenter-Core-Signatures-ThreadAcknowledge
          - ReviewCenter-Core-Signatures-ThreadNames
          - ReviewCenter-Core-Signatures-ThreadNothingStored
          - ReviewCenter-Core-Signatures-ConclusionTextAcknowledge
        tests:
          - ReviewCenter_Signing_ChangeAfterSignature_AsksToConfirmAndOnlyThenMakesItOutOfDate

      - id: ReviewCenter-System-Signatures-AcknowledgeValidation
        title: >-
          The tool shall report a change request for a thread that does not exist, or that is not valid, as that
          error and not as a signature impact.
        tags: [system]
        justification: |
          A reviewer who made a wrong request must be told what is wrong with it, and not be asked to acknowledge
          an impact that the request cannot have.
        children:
          - ReviewCenter-Core-Signatures-ThreadAfterValidation
          - ReviewCenter-Core-Signatures-ThreadNotFound

      - id: ReviewCenter-System-Signatures-Acknowledged
        title: >-
          The tool shall carry out a change that puts signatures out of date once the caller has acknowledged every
          affected slot, and leave those signatures out of date.
        tags: [system]
        justification: |
          An acknowledged change is a deliberate decision, and the signatures that it affects must then show that
          they no longer match the record.
        children:
          - ReviewCenter-Core-Signatures-ImpactAcknowledged
          - ReviewCenter-Core-Signatures-BallotAcknowledged
          - ReviewCenter-Core-Signatures-ThreadAcknowledged
          - ReviewCenter-Core-Signatures-ConclusionTextAcknowledged
        tests:
          - ReviewCenter_Signing_ChangeAfterSignature_AsksToConfirmAndOnlyThenMakesItOutOfDate

      - id: ReviewCenter-System-Signatures-AcknowledgeNotNeeded
        title: >-
          The tool shall ask for no acknowledgement of a change that leaves the digest of the record as it is or that
          no current signature covers, and keep the signatures current.
        tags: [system]
        justification: |
          Asking about changes that cannot affect a signature would teach reviewers to confirm without reading.
        children:
          - ReviewCenter-Core-Signatures-ImpactNotNeeded
          - ReviewCenter-Core-Signatures-ImpactOwnSlot
          - ReviewCenter-Core-Signatures-BallotNotNeeded
          - ReviewCenter-Core-Signatures-BallotDraftKeeps
          - ReviewCenter-Core-Signatures-SlotBallotNotNeeded
          - ReviewCenter-Core-Signatures-ThreadNotNeeded
          - ReviewCenter-Core-Signatures-ConclusionTextNoChange

      - id: ReviewCenter-System-Signatures-Consolidation
        title: >-
          The tool shall show a check as agreed, with its outcome, when every submitted ballot answers it with the
          same outcome.
        tags: [system]
        justification: |
          The outcome of the review is built from the answers that the reviewers agree on, so agreement must be
          decided in one way.
        children:
          - ReviewCenter-Core-BallotConsolidation
          - ReviewCenter-Core-BallotConsolidation-NotApplicableCheck
          - ReviewCenter-Core-BallotConsolidation-CheckOutcomes
          - ReviewCenter-Core-BallotConsolidation-Order

      - id: ReviewCenter-System-Signatures-ConsolidationDisputed
        title: >-
          The tool shall show a check as disputed when the submitted ballots answer it with different outcomes.
        tags: [system]
        justification: |
          A disagreement between reviewers must be seen and settled, and not averaged away.
        children:
          - ReviewCenter-Core-BallotConsolidation-Disputed
          - ReviewCenter-Core-BallotConsolidation-SectionDisputeCount

      - id: ReviewCenter-System-Signatures-ConsolidationPending
        title: >-
          The tool shall show a check as pending when a submitted ballot does not answer it.
        tags: [system]
        justification: |
          A check that somebody has not answered must not count as agreed.
        children:
          - ReviewCenter-Core-BallotConsolidation-Pending

      - id: ReviewCenter-System-Signatures-ConsolidationSections
        title: >-
          The tool shall show a section as not applicable when every submitted ballot marks it so, as disputed when
          only some do, and leave the checks of such a section out of the result.
        tags: [system]
        justification: |
          A section that does not apply to the content must not hold up or fail the review, and a disagreement about
          it must be seen.
        children:
          - ReviewCenter-Core-BallotConsolidation-Applicability
          - ReviewCenter-Core-BallotConsolidation-SectionChecks

      - id: ReviewCenter-System-Signatures-ConsolidationSubmittedOnly
        title: >-
          The tool shall let only submitted ballots take part in the consolidation of a review.
        tags: [system]
        justification: |
          The unfinished answers of a draft must not change the standing that signatures cover.
        children:
          - ReviewCenter-Core-BallotConsolidation-SubmittedOnly

      - id: ReviewCenter-System-Signatures-ConsolidationNoOutcome
        title: >-
          The tool shall give no outcome of the consolidation while no ballot is submitted, while a check is pending
          or disputed, or while a section is disputed.
        tags: [system]
        justification: |
          A review whose answers are not settled has no outcome that could be signed.
        children:
          - ReviewCenter-Core-BallotConsolidation-Outcome

      - id: ReviewCenter-System-Signatures-ConsolidationCounts
        title: >-
          The tool shall count the agreed, disputed, pending, and failed checks and the submitted ballots of a
          consolidation result, and give a result that the caller cannot change.
        tags: [system]
        justification: |
          The counts tell reviewers how far the review has come, and a result that cannot be altered stays what the
          ballots said.
        children:
          - ReviewCenter-Core-BallotConsolidation-Counts
          - ReviewCenter-Core-BallotConsolidation-BallotCounts
          - ReviewCenter-Core-BallotConsolidation-ReadOnly

      - id: ReviewCenter-System-Signatures-BallotComplete
        title: >-
          The tool shall tell that a ballot is complete when every check of every section that the ballot treats as
          applicable has an answer.
        tags: [system]
        justification: |
          A ballot is handed in only when the reviewer has answered everything that applies.
        children:
          - ReviewCenter-Core-BallotConsolidation-Complete

      - id: ReviewCenter-System-Signatures-ConsolidationView
        title: >-
          The tool shall build the consolidated view of a record from its submitted ballots only, and show each
          viewer the state of the own ballot and of every other ballot.
        tags: [system]
        justification: |
          The page of a reviewer must show the standing of the review and the state of the own ballot from the same
          rules as the digest.
        children:
          - ReviewCenter-Core-BallotConsolidation-BallotState
          - ReviewCenter-Core-BallotConsolidation-Projection
          - ReviewCenter-Core-BallotConsolidation-ProjectionSingleSlot
          - ReviewCenter-Core-BallotConsolidation-ProjectionNoChecklist
          - ReviewCenter-Core-BallotConsolidation-ProjectionOwnBallot

      - id: ReviewCenter-System-Signatures-ConsolidationArguments
        title: >-
          The tool shall refuse a missing checklist, record, or ballot when it consolidates ballots or builds the view
          of a record.
        tags: [system]
        justification: |
          A call with missing input must fail visibly and not produce a standing that looks complete.
        children:
          - ReviewCenter-Core-BallotConsolidation-Arguments
          - ReviewCenter-Core-BallotConsolidation-ProjectionArguments
          - ReviewCenter-Core-BallotConsolidation-EditInput

      - id: ReviewCenter-System-Signatures-BallotEdit
        title: >-
          The tool shall change the ballot of a slot by replacing, adding, or removing only the answers, section
          states, or ballot of the slot that is named.
        tags: [system]
        justification: |
          The ballot of one reviewer must never be changed by an edit of another, and an edit leaves a ballot a draft
          until it is handed in.
        children:
          - ReviewCenter-Core-BallotConsolidation-EditBallots
          - ReviewCenter-Core-BallotConsolidation-EditAnswers
          - ReviewCenter-Core-BallotConsolidation-EditSections
          - ReviewCenter-Core-BallotConsolidation-EditReassign

      - id: ReviewCenter-System-ReviewerIndependence
        title: >-
          The tool shall have the reviewers of a review named beforehand in reviewer slots, each a primary reviewer
          with an optional alternate.
        tags: [system]
        justification: |
          A review is independent only when the people who approve it are fixed beforehand. Naming an alternate lets
          a review go on when the primary reviewer is away without opening the review to anybody else.
        children:
          - ReviewCenter-Core-Signatures
          - ReviewCenter-Storage-Signatures-Slots

      - id: ReviewCenter-System-ReviewerIndependence-SlotEdit
        title: >-
          The tool shall let a reviewer slot that has never been signed be changed or removed, taking the ballot of a
          removed slot out of the record.
        tags: [system]
        justification: |
          Until somebody has signed, the naming of the reviewers is still a plan that can be corrected.
        children:
          - ReviewCenter-Core-Signatures-SlotEdit

      - id: ReviewCenter-System-ReviewerIndependence-SlotNotFound
        title: >-
          The tool shall refuse a change, a removal, or a signature for a reviewer slot or a review that does not
          exist, storing nothing.
        tags: [system]
        justification: |
          A request for something that is not there must fail visibly and not create a record that nobody named.
        children:
          - ReviewCenter-Core-Signatures-SlotEditExists
          - ReviewCenter-Storage-Signatures-UnknownTarget

      - id: ReviewCenter-System-ReviewerIndependence-SlotAccess
        title: >-
          The tool shall let every member of the project, and a system administrator who is not a member, add,
          change, and remove reviewer slots.
        tags: [system]
        justification: |
          Naming the reviewers is a task of the people who work on the project, and the lead cannot be the only one
          who can do it.
        children:
          - ReviewCenter-Core-Signatures-SlotViewAccess

      - id: ReviewCenter-System-ReviewerIndependence-SlotAccessRefused
        title: >-
          The tool shall refuse to add, change, or remove a reviewer slot, to sign, or to reopen a review for a person
          who is not a signed-in user or who may not see the project.
        tags: [system]
        justification: |
          Arranging the reviewers and signing are acts of authorized individuals only (21 CFR Part 11 section
          11.10(d), limiting access to authorized individuals).
        children:
          - ReviewCenter-Core-Signatures-SlotActor
          - ReviewCenter-Core-Signatures-SlotProject

      - id: ReviewCenter-System-ReviewerIndependence-MembersOnly
        title: >-
          The tool shall offer, and accept, only enabled members of the project as the primary reviewer or the
          alternate of a reviewer slot and as the signer of a slot.
        tags: [system]
        justification: |
          A person outside the project must never be able to supply a signature that stands for human judgement.
          The tool does not decide who else may be named.
        children:
          - ReviewCenter-Core-Signatures-SlotUsers
          - ReviewCenter-Core-Signatures-SlotCandidates
          - ReviewCenter-Core-Signatures-SignerMember
        tests:
          - ReviewCenter_ReviewerSlots_NonMemberAndSamePerson_AreNotAcceptedAsReviewers

      - id: ReviewCenter-System-ReviewerIndependence-CandidatesProtected
        title: >-
          The tool shall offer the candidates for a reviewer slot without their passwords and only to a person who may
          see the project.
        tags: [system]
        justification: |
          The list of candidates is a view of the users of the project and must reveal no more than the names.
        children:
          - ReviewCenter-Core-Signatures-SlotCandidatesNoPassword
          - ReviewCenter-Core-Signatures-SlotCandidatesAccess

      - id: ReviewCenter-System-ReviewerIndependence-OneSlot
        title: >-
          The tool shall put each person in one reviewer slot of a review only, and refuse a person who is already in
          another slot.
        tags: [system]
        justification: |
          A person who holds two slots would sign twice and make the number of signatures meaningless.
        children:
          - ReviewCenter-Core-Signatures-SlotUsers
        tests:
          - ReviewCenter_ReviewerSlots_NonMemberAndSamePerson_AreNotAcceptedAsReviewers

      - id: ReviewCenter-System-ReviewerIndependence-SignerOnly
        title: >-
          The tool shall allow a reviewer slot to be signed only by its primary reviewer or its alternate.
        tags: [system]
        justification: |
          A signature stands for the person who was named to give it, so nobody else may give it for them.
        children:
          - ReviewCenter-Core-Signatures-Signer

      - id: ReviewCenter-System-ReviewerIndependence-NoToken
        title: >-
          The tool shall never let an API token sign a review or arrange its reviewers.
        tags: [system]
        justification: |
          A script holding a token must never be able to supply a signature that stands for human judgement.
        children:
          - ReviewCenter-Api-Isolation
          - ReviewCenter-Core-TotpSecondFactor-SignatureApiToken
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-ReviewerIndependence-NoSignWhileBlocked
        title: >-
          The tool shall offer no way to sign while an unanswered check, a disputed check, or an open thread blocks
          the review.
        tags: [system]
        justification: |
          Blocking unfinished work stops an approval of a review nobody finished (EU GMP Annex 11 clause 12,
          security; 21 CFR Part 11 section 11.10(d), limiting access to authorized individuals).
        children:
          - ReviewCenter-Core-Signatures-Blockers
          - ReviewCenter-Core-Signatures-BlockersListed
          - ReviewCenter-Core-Signatures-DisputedBlocker
          - ReviewCenter-Core-ApprovalLock-OpenThreadSign
          - ReviewCenter-Storage-ReviewIntegrity-OpenThreadSigning
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-ReviewerIndependence-SignedSlotKept
        title: >-
          The tool shall offer no way to change or remove a reviewer slot that holds a signature.
        tags: [system]
        justification: |
          A reviewer who has signed cannot be replaced afterwards, or the signature would stand for somebody else.
        children:
          - ReviewCenter-Core-Signatures-SlotLocked
          - ReviewCenter-Storage-Signatures-SignedSlotKept
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-ReviewerIndependence-DefaultOn
        title: >-
          The tool shall require independent reviewers in a new project, and let each project keep the requirement on
          or off.
        tags: [system]
        justification: |
          Independence is the safe default, and a project that needs something else must say so explicitly.
        children:
          - ReviewCenter-Core-IndependentReviewers

      - id: ReviewCenter-System-ReviewerIndependence-NotRequired
        title: >-
          The tool shall enforce no independence of the reviewers while the project does not require independent
          reviewers.
        tags: [system]
        justification: |
          A team of one or two cannot review its own work in any other way, so the tool lets it turn the requirement
          off.
        children:
          - ReviewCenter-Core-IndependentReviewers-NotRequired

      - id: ReviewCenter-System-ReviewerIndependence-CreatorSlot
        title: >-
          The tool shall refuse the person who created a review as a reviewer of it, while the project requires
          independent reviewers.
        tags: [system]
        justification: |
          Nobody approves their own work: the author of a review is the user who created it. The tool does not match
          the authors of the commits in the reviewed repository to users.
        children:
          - ReviewCenter-Core-IndependentReviewers-Slot
        tests:
          - ReviewCenter_IndependentReviewers_AuthorIsNotOfferedAndAdministratorCanSwitchTheRuleOff
          - CoreSubsystem_IndependentReviewers_AuthorCannotBeSlotReviewerOrSign

      - id: ReviewCenter-System-ReviewerIndependence-CreatorSign
        title: >-
          The tool shall refuse the person who created a review as the signer of it, while the project requires
          independent reviewers.
        tags: [system]
        justification: |
          A slot that was filled before the requirement was turned on must still not let the author sign their own
          work.
        children:
          - ReviewCenter-Core-IndependentReviewers-Sign
        tests:
          - CoreSubsystem_IndependentReviewers_AuthorCannotBeSlotReviewerOrSign

      - id: ReviewCenter-System-ReviewerIndependence-CreatorHint
        title: >-
          The tool shall show the user who created a review that a different project member has to review and sign
          it, when the project requires independent reviewers.
        tags: [system]
        justification: |
          An author who cannot find their own name among the reviewers needs to be told why, and what to do next.
        children:
          - ReviewCenter-Web-ReviewLock-Independence
          - ReviewCenter-Web-ReviewLock-IndependenceHintHidden
          - ReviewCenter-Web-ReviewLock-IndependenceOff

      - id: ReviewCenter-System-ReviewerIndependence-TokenCreator
        title: >-
          The tool shall treat the owner of an access token as the person who created a review that was created with
          that token.
        tags: [system]
        justification: |
          A token must not be a way around the rule that the author does not review their own work.
        children:
          - ReviewCenter-Core-IndependentReviewers-TokenCreator
        tests:
          - CoreSubsystem_ApiTokenReview_AuthorIsTokenUser

      - id: ReviewCenter-System-ReviewerIndependence-Switch
        title: >-
          The tool shall let an administrator of the project and a system administrator switch the requirement of
          independent reviewers off and on for a project.
        tags: [system]
        justification: |
          The requirement fits most projects, and the people who administer a project know when it does not.
        children:
          - ReviewCenter-Core-IndependentReviewers-AdminOnly
          - ReviewCenter-Web-ReviewRules
          - ReviewCenter-Web-ReviewRules-Audit
          - ReviewCenter-Web-ReviewRules-Conflict
          - ReviewCenter-Web-ReviewRules-ConflictShowsStored
          - ReviewCenter-Web-ReviewRules-ConflictNothingRecorded
          - ReviewCenter-Storage-ReviewIntegrity-IndependentReviewers
        tests:
          - ReviewCenter_IndependentReviewers_AuthorIsNotOfferedAndAdministratorCanSwitchTheRuleOff
          - CoreSubsystem_IndependentReviewers_SettingChangeIsAuditedAndAdminOnly

      - id: ReviewCenter-System-ReviewerIndependence-SwitchRefused
        title: >-
          The tool shall refuse the change of the requirement of independent reviewers for a plain member of the
          project, for a person who may not see the project, and for a caller with an access token, and show the
          setting to nobody else.
        tags: [system]
        justification: |
          Whoever could switch the rule off could approve their own work, so the change is kept to administrators of
          the project (21 CFR Part 11 section 11.10(d), limiting access to authorized individuals).
        children:
          - ReviewCenter-Core-IndependentReviewers-Refused
          - ReviewCenter-Core-IndependentReviewers-NeverToken
          - ReviewCenter-Web-ReviewRules-Hidden

      - id: ReviewCenter-System-ReviewerIndependence-SwitchStale
        title: >-
          The tool shall refuse the change of the requirement of independent reviewers when the value that the caller
          saw is no longer the stored one.
        tags: [system]
        justification: |
          Two administrators who change the setting at once must not overwrite each other without noticing.
        children:
          - ReviewCenter-Core-IndependentReviewers-Stale

      - id: ReviewCenter-System-ReviewerIndependence-SwitchUnchanged
        title: >-
          The tool shall change and record nothing when the new value of the requirement of independent reviewers
          equals the value that the caller saw.
        tags: [system]
        justification: |
          A change that changes nothing must not leave an entry in the audit trail.
        children:
          - ReviewCenter-Core-IndependentReviewers-Unchanged

      - id: ReviewCenter-System-ReviewerIndependence-SwitchAudit
        title: >-
          The tool shall record each change of the requirement of independent reviewers in the audit trail, together
          with the change itself.
        tags: [system]
        justification: |
          Turning the rule off weakens the review, so who did it, and when, must be traceable (21 CFR Part 11 section
          11.10(e), audit trails).
        children:
          - ReviewCenter-Core-IndependentReviewers-Audit
          - ReviewCenter-Storage-ReviewIntegrity-SettingAudit
        tests:
          - CoreSubsystem_IndependentReviewers_SettingChangeIsAuditedAndAdminOnly

      - id: ReviewCenter-System-ReviewerIndependence-BallotHidden
        title: >-
          The tool shall keep what the other reviewers answered hidden from a reviewer who has not handed in their
          own ballot.
        tags: [system]
        justification: |
          Independent judgment means that a reviewer does not read the answers of the others before giving their own,
          so those stay hidden until the own ballot is in.
        children:
          - ReviewCenter-Core-BallotVisibility
          - ReviewCenter-Core-BallotVisibility-ViewHidden
          - ReviewCenter-Core-BallotVisibility-ViewerRequired
          - ReviewCenter-Core-BallotVisibility-FixedText
          - ReviewCenter-Core-BallotVisibility-NoDisputeLeak
          - ReviewCenter-Core-BallotVisibility-NoOutcomeLeak
          - ReviewCenter-Core-BallotVisibility-NoInboxLeak
          - ReviewCenter-Core-Signatures-FailedMasked
          - ReviewCenter-Core-Signatures-FailedMaskedNote
          - ReviewCenter-Core-Signatures-FailedMaskedWording
          - ReviewCenter-Core-Signatures-FailedMaskedHandIn
          - ReviewCenter-Core-Signatures-SlotBallotStateMasked
          - ReviewCenter-Web-BallotExperience
          - ReviewCenter-Web-BallotExperience-Counts
          - ReviewCenter-Web-BallotExperience-CountsNotice
          - ReviewCenter-Web-BallotExperience-CountsMissing
          - ReviewCenter-Web-BallotExperience-MemberView
          - ReviewCenter-Web-BallotExperience-MemberViewNoStanding
          - ReviewCenter-Web-BallotExperience-Administrator
          - ReviewCenter-Web-BallotExperience-SingleSlot
          - ReviewCenter-Web-BallotExperience-ReviewPageAdministrator
          - ReviewCenter-Web-BallotExperience-ProjectBallots
          - ReviewCenter-Web-BallotExperience-ProjectBallotsMissing
          - ReviewCenter-Web-BallotExperience-ProjectBallotsSameForEveryViewer
          - ReviewCenter-Web-BallotExperience-ProjectBallotsSingleSlot
          - ReviewCenter-Web-BallotExperience-MaskedNote
          - ReviewCenter-Web-BallotExperience-NoteGone
          - ReviewCenter-Web-BallotExperience-HistoryVisible
          - ReviewCenter-Web-BallotExperience-SideBySideSummary
          - ReviewCenter-Web-BallotExperience-SideBySideFailedStatus
          - ReviewCenter-Web-BallotExperience-DiscussThread
          - ReviewCenter-Web-BallotExperience-DiscussThreadKind
          - ReviewCenter-Web-BallotExperience-DiscussThreadLink
          - ReviewCenter-Web-BallotExperience-DiscussNoThread
          - ReviewCenter-Web-BallotExperience-DiscussNotStarted
          - ReviewCenter-Web-BallotExperience-DiscussCancel
          - ReviewCenter-Web-BallotExperience-Sign
          - ReviewCenter-Web-BallotExperience-SubmitOnly
          - ReviewCenter-Web-BallotExperience-Provider
          - ReviewCenter-Web-BallotExperience-ProviderConfirm
          - ReviewCenter-Web-BallotExperience-ProviderNoSecrets
          - ReviewCenter-Web-BallotExperience-Revealed
          - ReviewCenter-Web-BallotExperience-Revealed-Explains
          - ReviewCenter-Web-BallotExperience-Revealed-Provider
          - ReviewCenter-Web-BallotExperience-Refused
          - ReviewCenter-Web-BallotExperience-RefusedExplains
          - ReviewCenter-Web-BallotExperience-NotOffered
          - ReviewCenter-Web-BallotExperience-NotOfferedSingleSlot
          - ReviewCenter-Web-BallotExperience-Confirm
          - ReviewCenter-Web-BallotExperience-Confirm-Code
          - ReviewCenter-Web-BallotExperience-Confirm-HandOver
          - ReviewCenter-Web-BallotExperience-Confirm-HandOverCode
          - ReviewCenter-Web-BallotExperience-Confirm-Clear
          - ReviewCenter-Web-BallotExperience-AssignMeSlot
          - ReviewCenter-Web-BallotExperience-AssignMeSlot-NoAlternate
          - ReviewCenter-Web-BallotExperience-AssignMeSlot-KeepsSlots
          - ReviewCenter-Web-BallotExperience-AssignMeNotOffered
          - ReviewCenter-Web-BallotExperience-ReviewPage
          - ReviewCenter-Web-BallotExperience-ProjectOverview
          - ReviewCenter-Web-BallotExperience-History
        tests:
          - ChecklistPage_DraftBallot_HidesOtherBallotsAndDisputeCounts

      - id: ReviewCenter-System-ReviewerIndependence-BallotHiddenDiscussions
        title: >-
          The tool shall leave the discussions about checks out of the list of threads of a viewer who may not see the
          answers of the others.
        tags: [system]
        justification: |
          A discussion about a check would tell what the others answered.
        children:
          - ReviewCenter-Core-BallotVisibility-Discussions

      - id: ReviewCenter-System-ReviewerIndependence-BallotFileDiscussions
        title: >-
          The tool shall keep the discussions about files in the list of threads of a viewer who may not see the
          answers of the others.
        tags: [system]
        justification: |
          A discussion about a file says nothing about the answers, and a reviewer needs it to do the work.
        children:
          - ReviewCenter-Core-BallotVisibility-FileDiscussions

      - id: ReviewCenter-System-ReviewerIndependence-BallotAuditMasked
        title: >-
          The tool shall replace the detail of an audit entry that names an answer, a change of the applicability of a
          section, or the start of a discussion about a check, for a viewer who may not see the answers of the
          others, including a viewer that it does not know.
        tags: [system]
        justification: |
          The audit trail is a second way to read the answers, so it is masked in the same way as the checklist.
        children:
          - ReviewCenter-Core-BallotVisibility-AuditMasking
          - ReviewCenter-Core-BallotVisibility-AuditUnknownViewer

      - id: ReviewCenter-System-ReviewerIndependence-BallotAuditUnmasked
        title: >-
          The tool shall keep the entries of a discussion about a file as they are for a viewer who may not see the
          answers of the others, and return all audit entries unchanged for a viewer who may see them.
        tags: [system]
        justification: |
          Masking more than needed would hide the history from people who may read it.
        children:
          - ReviewCenter-Core-BallotVisibility-AuditKept
          - ReviewCenter-Core-BallotVisibility-AuditVisibleViewer

      - id: ReviewCenter-System-ReviewerIndependence-BallotAuditNull
        title: >-
          The tool shall refuse a missing list of entries when it masks audit entries.
        tags: [system]
        justification: |
          A call with missing input must fail visibly and not return entries that look checked.
        children:
          - ReviewCenter-Core-BallotVisibility-AuditNullRefused

      - id: ReviewCenter-System-ReviewerIndependence-BallotShown
        title: >-
          The tool shall let a viewer who has handed in their own ballot see the answers of the other reviewers, with
          the checks on which the handed-in ballots differ.
        tags: [system]
        justification: |
          Once the own judgment is on record, the reviewer needs the answers of the others to settle differences.
        children:
          - ReviewCenter-Core-BallotVisibility-HandedIn
          - ReviewCenter-Core-BallotVisibility-BallotView
          - ReviewCenter-Core-BallotVisibility-ViewDetails
          - ReviewCenter-Web-BallotExperience-SideBySide

      - id: ReviewCenter-System-ReviewerIndependence-BallotShownPrivileged
        title: >-
          The tool shall let a viewer who leads the review, administers the project, is a system administrator, or is
          an auditor see the answers of the other reviewers without having handed in a ballot.
        tags: [system]
        justification: |
          People who oversee the review do not take part in it, so they have no own judgment to protect.
        children:
          - ReviewCenter-Core-BallotVisibility-Privileged

      - id: ReviewCenter-System-ReviewerIndependence-BallotShownConcluded
        title: >-
          The tool shall let every viewer see the answers of the other reviewers of a concluded review.
        tags: [system]
        justification: |
          Once the review has ended there is no judgment left to protect, and the record must be open to read.
        children:
          - ReviewCenter-Core-BallotVisibility-Concluded

      - id: ReviewCenter-System-ReviewerIndependence-BallotNeverHidden
        title: >-
          The tool shall never hide the answers of the reviewers from a viewer who may view the project in a review
          with one slot or none.
        tags: [system]
        justification: |
          With one reviewer there are no other answers to keep apart, so hiding them would only get in the way.
        children:
          - ReviewCenter-Core-BallotVisibility-SingleSlot

      - id: ReviewCenter-System-ReviewerIndependence-BallotOwn
        title: >-
          The tool shall show a viewer who holds a slot the ballot of that slot including its draft answers, and not
          show a viewer the draft answers of a slot that the viewer does not hold.
        tags: [system]
        justification: |
          A draft is private work in progress, and only its owner may see it.
        children:
          - ReviewCenter-Core-BallotVisibility-OwnBallot

      - id: ReviewCenter-System-ReviewerIndependence-BallotProgress
        title: >-
          The tool shall tell every viewer how many ballots are handed in out of how many, who has handed in, and
          to a member of the project which other reviewers have not.
        tags: [system]
        justification: |
          Progress shows who is still to deliver without telling anything about the answers.
        children:
          - ReviewCenter-Core-BallotVisibility-HandInCounts
          - ReviewCenter-Core-BallotVisibility-HandedInVisible
          - ReviewCenter-Core-BallotVisibility-MissingNames

      - id: ReviewCenter-System-ReviewerIndependence-BallotDiscussionStart
        title: >-
          The tool shall offer a button to discuss a differing answer to the lead of the review, a system
          administrator, a slot owner who has handed in, and the owner of the only slot.
        tags: [system]
        justification: |
          Differences are settled by talking, and only people who may see the answers can talk about them.
        children:
          - ReviewCenter-Core-BallotVisibility-DiscussionStart
          - ReviewCenter-Web-BallotExperience-Discuss

      - id: ReviewCenter-System-ReviewerIndependence-BallotDiscussionStartRefused
        title: >-
          The tool shall tell a person who is none of the lead of the review, a system administrator, a slot owner who
          has handed in, or the owner of the only slot that they may not start a discussion about a differing answer.
        tags: [system]
        justification: |
          A reviewer who may not see the answers must learn why there is no button, and not guess at the answers.
        children:
          - ReviewCenter-Core-BallotVisibility-DiscussionStartRefused

      - id: ReviewCenter-System-ReviewerIndependence-BallotShortcuts
        title: >-
          The tool shall offer Assign me as reviewer to a member who may be a reviewer and holds no slot, and Submit
          and sign when the own ballot is a complete draft and nothing blocks the review.
        tags: [system]
        justification: |
          The two steps that a reviewer takes most often are offered where the rules accept them.
        children:
          - ReviewCenter-Core-BallotVisibility-AssignShortcut
          - ReviewCenter-Core-BallotVisibility-SubmitAndSign
          - ReviewCenter-Web-BallotExperience-SubmitAndSign
          - ReviewCenter-Web-BallotExperience-AssignMe

      - id: ReviewCenter-System-ReviewerIndependence-BallotHelp
        title: >-
          The tool shall explain the ballot steps in the help topics.
        tags: [system]
        justification: |
          A reviewer who cannot see the answers of the others needs to be told why and what to do next.
        children:
          - ReviewCenter-Web-BallotExperience-HelpTopics

      - id: ReviewCenter-System-WhereAreWe
        title: >-
          The tool shall tell every viewer of a review, in plain words and on the review page, where the review
          stands.
        tags: [system]
        justification: |
          A review with several people only finishes when each of them knows what is left. The system tests drive the
          pages of a running server with two reviewers: a Question becomes a Finding that is resolved with a note and
          listed in the conclusion, and a picture of the pages is taken in the light and the dark theme for a person
          to look at.
        children:
          - ReviewCenter-Web-WhereAreWe
          - ReviewCenter-Web-WhereAreWe-Ballots
          - ReviewCenter-Web-WhereAreWe-OpenQuestions
          - ReviewCenter-Web-WhereAreWe-PlainWords
          - ReviewCenter-Core-ReviewStatus-Standing
          - ReviewCenter-Core-ReviewStatus-OpenCounts
          - ReviewCenter-Core-ReviewStatus-NoSlots
          - ReviewCenter-Core-Signatures-StatusBlockers
        tests:
          - ReviewCenter_QuestionFlow_MaskedUntilSubmitThenDiscussAndResolve_ShowsStatusPanelInBothThemes
          - ReviewCenter_FindingFlow_PromoteResolveWithNote_ShowsFindingInConclusionCardInBothThemes

      - id: ReviewCenter-System-WhereAreWe-Unavailable
        title: >-
          The tool shall give no status for a review that does not exist, and refuse the status to a viewer who may
          not see the project.
        tags: [system]
        justification: |
          The status must not tell a person that a review exists in a project that the person may not see.
        children:
          - ReviewCenter-Core-ReviewStatus-Unavailable
          - ReviewCenter-Core-ReviewStatus-PassedInUnavailable

      - id: ReviewCenter-System-WhereAreWe-PassedIn
        title: >-
          The tool shall give for review values that the caller passes in the same status as it gives when it reads
          the values itself.
        tags: [system]
        justification: |
          A page that has already read the review must not get a different standing than a page that reads it again.
        children:
          - ReviewCenter-Core-ReviewStatus-PassedIn

      - id: ReviewCenter-System-WhereAreWe-Arguments
        title: >-
          The tool shall refuse to build the status of a review, or to decide its next action, without the services,
          stores, and facts that it reads.
        tags: [system]
        justification: |
          A status built from missing input would look complete and mislead the reviewers.
        children:
          - ReviewCenter-Core-ReviewStatus-StatusArguments
          - ReviewCenter-Core-ReviewStatus-NextActionArguments

      - id: ReviewCenter-System-WhereAreWe-NextAction
        title: >-
          The tool shall tell every viewer of a review, in plain words and on the review page, what to do next, as
          exactly one next action carried in the status.
        tags: [system]
        justification: |
          A review with several people only finishes when each of them knows what to do, and one clear action avoids
          waiting for somebody else by mistake.
        children:
          - ReviewCenter-Core-ReviewStatus
          - ReviewCenter-Core-ReviewStatus-StatusNextAction

      - id: ReviewCenter-System-WhereAreWe-NextStep
        title: >-
          The tool shall word the next step of a review that is not concluded as one sentence that names what blocks
          it, the disputed and rejected checks, and who has signed and whose signature is awaited.
        tags: [system]
        justification: |
          A reviewer who reads one sentence should know what stands in the way without opening every page.
        children:
          - ReviewCenter-Core-Signatures-StatusNextStep
          - ReviewCenter-Core-Signatures-NextStepDisputed
          - ReviewCenter-Core-Signatures-NextStepRejected
          - ReviewCenter-Core-Signatures-NextStepSigners
          - ReviewCenter-Core-ApprovalLock-BlockerHint
          - ReviewCenter-Core-ReviewStatus-GuidanceSignedNames

      - id: ReviewCenter-System-WhereAreWe-NextActionDone
        title: >-
          The tool shall tell every viewer of a concluded review that the review is done.
        tags: [system]
        justification: |
          A viewer of a finished review must not be sent to do work that is no longer possible.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionDone

      - id: ReviewCenter-System-WhereAreWe-NextActionNone
        title: >-
          The tool shall give a viewer who cannot take part in the review no action.
        tags: [system]
        justification: |
          A button that the viewer cannot use would only lead to a refusal.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionReadOnly

      - id: ReviewCenter-System-WhereAreWe-NextActionSlots
        title: >-
          The tool shall ask the lead of a review that has no reviewer slot to add the reviewers, and ask a project
          member who could take a slot to take one.
        tags: [system]
        justification: |
          A review without named reviewers cannot start, so the first action is to name them.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionSlots

      - id: ReviewCenter-System-WhereAreWe-NextActionBallot
        title: >-
          The tool shall ask a reviewer whose checks are not all answered to answer the checklist, and a reviewer
          whose checks are all answered to hand in the ballot.
        tags: [system]
        justification: |
          The ballot of each reviewer is what the review is built from, so handing it in comes first.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionBallot

      - id: ReviewCenter-System-WhereAreWe-NextActionOpenWork
        title: >-
          The tool shall ask a reviewer who handed in a ballot to discuss the disputed checks first, then to answer or
          resolve the open questions and findings, before the conclusion.
        tags: [system]
        justification: |
          Open work blocks the signature, so it has to be settled in the order in which it blocks.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionOpenWork

      - id: ReviewCenter-System-WhereAreWe-NextActionSign
        title: >-
          The tool shall ask a reviewer who may sign and has nothing else to do to sign the review.
        tags: [system]
        justification: |
          Signing is the last act of a reviewer, so it is asked for when nothing else is left.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionSign

      - id: ReviewCenter-System-WhereAreWe-NextActionWait
        title: >-
          The tool shall tell a reviewer who has signed, or who can do nothing yet, to wait for the other reviewers,
          in a sentence without a button.
        tags: [system]
        justification: |
          A reviewer who has nothing to do must be told so, and not search for an action.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionSigned
          - ReviewCenter-Core-ReviewStatus-NextActionWait

      - id: ReviewCenter-System-WhereAreWe-NextActionOwnQuestion
        title: >-
          The tool shall tell a reviewer who asked every open question to wait for the answer, naming the other
          reviewers when there are no more than two, and ask the other reviewer to answer the question.
        tags: [system]
        justification: |
          A question blocks the review until somebody answers it, so both sides must be told what they wait for.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionOwnQuestion
          - ReviewCenter-Core-ReviewStatus-NextActionOwnQuestionUnnamed
          - ReviewCenter-Core-ReviewStatus-GuidanceAskerWaits

      - id: ReviewCenter-System-WhereAreWe-NextActionOthers
        title: >-
          The tool shall ask a viewer who has no reviewer slot and may take part to discuss the disputed checks, to
          resolve the open findings, or to answer the open questions.
        tags: [system]
        justification: |
          People who are not reviewers can still help the review to finish.
        children:
          - ReviewCenter-Core-ReviewStatus-NextActionOthers

      - id: ReviewCenter-System-WhereAreWe-ReopenerWaits
        title: >-
          The tool shall tell the reviewer who reopened a review to wait when the project requires another reviewer
          to sign.
        tags: [system]
        justification: |
          The reviewer who reopened the review may not sign it again, so the review waits for somebody else.
        children:
          - ReviewCenter-Core-ReviewStatus-ReopenerWaits

      - id: ReviewCenter-System-WhereAreWe-ReopenerSigns
        title: >-
          The tool shall ask the reviewer who reopened a review to sign when the project does not require another
          reviewer to sign.
        tags: [system]
        justification: |
          Where the rule allows it, the reviewer who reopened the review is the one who finishes it.
        children:
          - ReviewCenter-Core-ReviewStatus-ReopenerSigns

      - id: ReviewCenter-System-WhereAreWe-Discussion
        title: >-
          The tool shall list in the status of a review the checks that the submitted ballots answer differently, with
          the answer and the justification of every ballot, and offer a viewer who may take part to start a
          discussion about each of them.
        tags: [system]
        justification: |
          Reviewers settle a disagreement about a check by a discussion that they start from where the review
          stands.
        children:
          - ReviewCenter-Web-WhereAreWe-Differences
          - ReviewCenter-Web-WhereAreWe-DiscussWarning
          - ReviewCenter-Web-WhereAreWe-DiscussConfirm
          - ReviewCenter-Web-WhereAreWe-DiscussCancel
          - ReviewCenter-Core-ReviewStatus-Disputes
          - ReviewCenter-Core-ReviewStatus-DisputeStart
          - ReviewCenter-Core-ReviewStatus-Guidance
        tests:
          - ReviewCenter_QuestionFlow_MaskedUntilSubmitThenDiscussAndResolve_ShowsStatusPanelInBothThemes

      - id: ReviewCenter-System-WhereAreWe-DiscussionNotOffered
        title: >-
          The tool shall not offer a viewer who may not take part in the review to start a discussion about a disputed
          check, and not offer it once a discussion is open.
        tags: [system]
        justification: |
          A button that cannot be used, or that starts a second discussion about the same check, only confuses.
        children:
          - ReviewCenter-Core-ReviewStatus-DisputeStartRefused

      - id: ReviewCenter-System-WhereAreWe-OutcomeNote
        title: >-
          The tool shall give a viewer who may see the answers an outcome note that names the failed check and says
          that the review will be Rejected.
        tags: [system]
        justification: |
          A reviewer who is about to decide must know where the review is heading.
        children:
          - ReviewCenter-Core-ReviewStatus-GuidanceOutcome

      - id: ReviewCenter-System-WhereAreWe-Caution
        title: >-
          The tool shall give a reviewer who is about to sign a caution that names the reviewers who have not handed
          in a ballot.
        tags: [system]
        justification: |
          A signature given before the other ballots are in may be overtaken by them, and the signer should know it.
        children:
          - ReviewCenter-Core-ReviewStatus-GuidanceCaution

      - id: ReviewCenter-System-WhereAreWe-NoCaution
        title: >-
          The tool shall give no caution to a reviewer who is about to sign when every other ballot is handed in, and
          to a reviewer who is not about to sign.
        tags: [system]
        justification: |
          A caution that does not apply would be ignored when it does.
        children:
          - ReviewCenter-Core-ReviewStatus-GuidanceNoCaution

      - id: ReviewCenter-System-WhereAreWe-ChangesSince
        title: >-
          The tool shall show a reviewer whose signature no longer matches the report the changes that were made after
          the signature, each with the time, the person, and what changed.
        tags: [system]
        justification: |
          A reviewer who must sign again needs to see what is new, and not read the whole review again.
        children:
          - ReviewCenter-Web-WhereAreWe-ChangesSince
          - ReviewCenter-Web-WhereAreWe-ChangesSinceWarning
          - ReviewCenter-Core-ReviewStatus-Changes
          - ReviewCenter-Core-ReviewStatus-ChangesBallots
          - ReviewCenter-Core-ReviewStatus-ChangesConclusion
          - ReviewCenter-Core-ReviewStatus-ChangesThreads
          - ReviewCenter-Core-ReviewStatus-ChangesComments
          - ReviewCenter-Core-ReviewStatus-ChangesFindings
          - ReviewCenter-Core-ReviewStatus-ChangesWholeTrail

      - id: ReviewCenter-System-WhereAreWe-ChangesLeftOut
        title: >-
          The tool shall leave out of the changes since a signature what the signature does not cover, such as the
          resolution of a question and a thread that stay out of the report.
        tags: [system]
        justification: |
          A list that holds changes which do not matter hides the ones that do.
        children:
          - ReviewCenter-Core-ReviewStatus-ChangesLeftOut

      - id: ReviewCenter-System-WhereAreWe-ChangesNone
        title: >-
          The tool shall list no change when the signature still matches the review.
        tags: [system]
        justification: |
          A reviewer whose signature is current has nothing to read again.
        children:
          - ReviewCenter-Core-ReviewStatus-ChangesNone

      - id: ReviewCenter-System-WhereAreWe-SignAgain
        title: >-
          The tool shall explain to a reviewer whose signature no longer matches the report that signing again is the
          way forward.
        tags: [system]
        justification: |
          A reviewer who sees that an approval has gone must be told what to do about it.
        children:
          - ReviewCenter-Web-WhereAreWe-SignAgain
          - ReviewCenter-Web-WhereAreWe-Answers
          - ReviewCenter-Web-WhereAreWe-SigningGuidance
          - ReviewCenter-Web-WhereAreWe-SigningCaution
          - ReviewCenter-Web-WhereAreWe-Waiting
          - ReviewCenter-Web-WhereAreWe-WaitingOtherParty
          - ReviewCenter-Web-WhereAreWe-WaitingAfterSigning
          - ReviewCenter-Web-WhereAreWe-GuidanceMasked

      - id: ReviewCenter-System-WhereAreWe-Hidden
        title: >-
          The tool shall keep the status panel of a review hidden from a reviewer who has not handed in their own
          ballot, listing no disputed check and no discussion, and asking for no discussion.
        tags: [system]
        justification: |
          The standing would tell a reviewer what the others answered before the own answers are given.
        children:
          - ReviewCenter-Web-WhereAreWe-Hidden
          - ReviewCenter-Core-ReviewStatus-Masked
          - ReviewCenter-Core-ReviewStatus-MaskedNoAction
        tests:
          - ReviewCenter_QuestionFlow_MaskedUntilSubmitThenDiscussAndResolve_ShowsStatusPanelInBothThemes

      - id: ReviewCenter-System-WhereAreWe-HiddenChanges
        title: >-
          The tool shall word a change whose details are hidden from the viewer as one neutral sentence without those
          details.
        tags: [system]
        justification: |
          The list of changes must not give away the answers that the status panel keeps hidden.
        children:
          - ReviewCenter-Core-ReviewStatus-ChangesMasked

      - id: ReviewCenter-System-WhereAreWe-NotHiddenSingleSlot
        title: >-
          The tool shall not hide the status of a review that has one reviewer slot, and list no disputed check for
          it.
        tags: [system]
        justification: |
          With one reviewer there are no other answers to keep apart.
        children:
          - ReviewCenter-Core-ReviewStatus-SingleSlot

      - id: ReviewCenter-System-ReviewRuleSwitches
        title: >-
          The tool shall keep, for each project, a switch for each of two further review rules, one for authors
          answering the checklist of their own review and one for the person who reopened a review signing it again.
        tags: [system]
        justification: |
          A project must be able to say which review rules it wants. The system tests verify the page where the
          switches are saved; the storage across a restart and the enforcement are verified by the tests of the child
          requirements.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches
          - ReviewCenter-Storage-ReviewRuleSwitches
          - ReviewCenter-Web-ReviewRuleSwitches
          - ReviewCenter-Web-ReviewRuleSwitches-Audit
          - ReviewCenter-Web-ReviewRuleSwitches-Conflict
          - ReviewCenter-Web-ReviewRuleSwitches-ConflictShowsStored
          - ReviewCenter-Web-ReviewRuleSwitches-ConflictNothingRecorded
          - ReviewCenter-Web-ReviewRuleSwitches-ReopenerSigning
        tests:
          - WebSubsystem_ProjectAdmin_SavesStoredReviewRuleSwitches

      - id: ReviewCenter-System-ReviewRuleSwitches-OneRuleChanged
        title: >-
          The tool shall change only the review rule that was named, without changing the other rule.
        tags: [system]
        justification: |
          An administrator who relaxes one rule must not relax the other by accident.
        children:
          - ReviewCenter-Storage-ReviewRuleSwitches-OtherRulesKept

      - id: ReviewCenter-System-ReviewRuleSwitches-DefaultOn
        title: >-
          The tool shall keep each of the two review rules on for a new project and for every project that does not
          say otherwise.
        tags: [system]
        justification: |
          The rules are on by default for every project, so that no project is left without the protection by
          accident.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches-DefaultOn
          - ReviewCenter-Storage-ReviewRuleSwitches-Default

      - id: ReviewCenter-System-ReviewRuleSwitches-DefaultNotice
        title: >-
          The tool shall say next to the switches of the review rules that the rules are on by default and apply to
          every project of the tool, also to the projects that existed before.
        tags: [system]
        justification: |
          A lead who sees a switch must know what the value means for the project that has never been changed.
        children:
          - ReviewCenter-Web-ReviewRuleSwitches-DefaultNotice
          - ReviewCenter-Web-ReviewRuleSwitches-DefaultOn

      - id: ReviewCenter-System-ReviewRuleSwitches-AdminOnly
        title: >-
          The tool shall let only an administrator of the project or a system administrator change the review rules
          of a project, and show the rules to nobody else.
        tags: [system]
        justification: |
          Whoever could switch a rule off could approve their own work, so the change is kept to administrators.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches-Refused
          - ReviewCenter-Web-ReviewRuleSwitches-Hidden
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-System-ReviewRuleSwitches-NoToken
        title: >-
          The tool shall refuse the change of a review rule for a caller with an access token, even for an
          administrator.
        tags: [system]
        justification: |
          A script holding a token must not be able to weaken the review rules of a project.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches-NeverToken

      - id: ReviewCenter-System-ReviewRuleSwitches-Stale
        title: >-
          The tool shall refuse the change of a review rule when the value that the caller saw is no longer the
          stored one.
        tags: [system]
        justification: |
          Two administrators who change a rule at once must not overwrite each other without noticing.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches-Stale
          - ReviewCenter-Storage-ReviewRuleSwitches-CompareAndSet
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-System-ReviewRuleSwitches-Unchanged
        title: >-
          The tool shall change and record nothing when the new value of a review rule equals the value that the
          caller saw.
        tags: [system]
        justification: |
          A change that changes nothing must not leave an entry in the audit trail.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches-Unchanged

      - id: ReviewCenter-System-ReviewRuleSwitches-Audit
        title: >-
          The tool shall record each change of a review rule in the audit trail, stored together with the change
          itself.
        tags: [system]
        justification: |
          The choice must be in the history so that it can be shown who relaxed a rule and when (21 CFR Part 11
          section 11.10(e), audit trails).
        children:
          - ReviewCenter-Core-ReviewRuleSwitches-Audit
          - ReviewCenter-Storage-ReviewRuleSwitches-Audit
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-System-ReviewRuleSwitches-AuthorRule
        title: >-
          The tool shall refuse the author of a review, while the project requires that authors do not answer their
          own checklist, any answer and any change of the applicability of a section, whatever the caller.
        tags: [system]
        justification: |
          Nobody checks their own work: the author's answers would count as an independent check when they are not.
        children:
          - ReviewCenter-Core-ReviewRules
          - ReviewCenter-Core-ReviewRules-AuthorSection
        tests:
          - CoreSubsystem_ReviewRules_EnforcedAndSwitchableOff

      - id: ReviewCenter-System-ReviewRuleSwitches-AuthorBeforeLock
        title: >-
          The tool shall report that the author cannot answer before it reports that the review is locked, when the
          author changes an approved review.
        tags: [system]
        justification: |
          The reason that applies to the person must come first, so the message does not suggest that an
          administrator's reopening would help.
        children:
          - ReviewCenter-Core-ReviewRules-AuthorBeforeLock

      - id: ReviewCenter-System-ReviewRuleSwitches-AuthorOthers
        title: >-
          The tool shall let another reviewer who holds the slot answer while the author rule is on, and not mark the
          checklist as blocked for another viewer.
        tags: [system]
        justification: |
          The rule restricts the author only, and the others must be able to do the review.
        children:
          - ReviewCenter-Core-ReviewRules-AuthorOthers
          - ReviewCenter-Core-ReviewRules-AuthorBlockedOthers

      - id: ReviewCenter-System-ReviewRuleSwitches-AuthorBlocked
        title: >-
          The tool shall tell the author of a review on the checklist page, while the project does not let authors
          answer, that another member must answer, and disable the answer controls for the author.
        tags: [system]
        justification: |
          An author who meets a refusal without a reason would not know what to do.
        children:
          - ReviewCenter-Core-ReviewRules-AuthorBlocked
          - ReviewCenter-Web-ReviewRuleNotices
          - ReviewCenter-Web-ReviewRuleNotices-Hidden
          - ReviewCenter-Web-ReviewRuleNotices-AuthorRefusal
          - ReviewCenter-Web-ReviewRuleNotices-AuthorRefusal-NotStored
          - ReviewCenter-Web-ReviewRuleNotices-AuthorControls
          - ReviewCenter-Web-ReviewRuleNotices-OtherControls
        tests:
          - WebSubsystem_ChecklistPage_AuthorSeesNoticeAndNonAuthorAnswers

      - id: ReviewCenter-System-ReviewRuleSwitches-ReopenerRule
        title: >-
          The tool shall refuse the signature of the person who reopened a review, while the project requires that
          that person does not sign it again.
        tags: [system]
        justification: |
          Whoever reopens a review and then signs it alone could approve their own change to it.
        children:
          - ReviewCenter-Core-ReviewRules-ReopenerSigning

      - id: ReviewCenter-System-ReviewRuleSwitches-ReopenerOrder
        title: >-
          The tool shall check the reopener rule after the independence check and before the password is checked.
        tags: [system]
        justification: |
          A refusal that depends on the person must not need the password, and must not hide a more basic refusal.
        children:
          - ReviewCenter-Core-ReviewRules-ReopenerOrder

      - id: ReviewCenter-System-ReviewRuleSwitches-ReopenerNoAttempt
        title: >-
          The tool shall neither count nor record a failed attempt when it refuses a signature by the reopener rule.
        tags: [system]
        justification: |
          A refusal by rule is not a wrong password, and must not lock the person out.
        children:
          - ReviewCenter-Core-ReviewRules-ReopenerNoAttempt

      - id: ReviewCenter-System-ReviewRuleSwitches-ReopenerBallot
        title: >-
          The tool shall let the person who reopened a review answer in and hand in the ballot of the own slot while
          the reopener rule is on.
        tags: [system]
        justification: |
          The rule keeps the person from signing, and does not keep them from doing the review.
        children:
          - ReviewCenter-Core-ReviewRules-ReopenerBallot

      - id: ReviewCenter-System-ReviewRuleSwitches-ReopenerNotice
        title: >-
          The tool shall tell the person who reopened a review on the review page, while the project does not let that
          person sign again, that another reviewer must sign.
        tags: [system]
        justification: |
          A reopener who finds no signing button must be told why.
        children:
          - ReviewCenter-Web-ReviewRuleNotices-ReopenerNotice
          - ReviewCenter-Web-ReviewRuleNotices-ReopenerNoticeHidden

      - id: ReviewCenter-System-ReviewRuleSwitches-StrandedSlot
        title: >-
          The tool shall refuse a reopening that would leave a slot without a person who may sign, while the reopener
          rule is on, storing nothing.
        tags: [system]
        justification: |
          A review that nobody can sign again would be stuck, so the reopening is refused before it happens.
        children:
          - ReviewCenter-Core-ReviewRules-StrandedSlot
          - ReviewCenter-Core-ReviewRules-StrandedSlotNothingStored

      - id: ReviewCenter-System-ReviewRuleSwitches-StrandedSlotNames
        title: >-
          The tool shall name the slots that would be left without a person who may sign, by their numbers, in the
          message of the refused reopening, and show that message to the user.
        tags: [system]
        justification: |
          The administrator who reopens must know which slot to change first.
        children:
          - ReviewCenter-Core-ReviewRules-StrandedSlotNames
          - ReviewCenter-Web-ReviewRuleNotices-ReopenRefused

      - id: ReviewCenter-System-ReviewRuleSwitches-StrandedSlotAllowed
        title: >-
          The tool shall reopen the review when after the reopening every slot keeps somebody who may sign it.
        tags: [system]
        justification: |
          The rule must refuse only what would get the review stuck, and not any reopening.
        children:
          - ReviewCenter-Core-ReviewRules-StrandedSlotAllowed

      - id: ReviewCenter-System-ReviewRuleSwitches-RuleOff
        title: >-
          The tool shall not restrict a project by a review rule that it switched off.
        tags: [system]
        justification: |
          A project that has to let one person do everything switches the rules off with a record, and the tool must
          then let them.
        children:
          - ReviewCenter-Core-ReviewRules-RuleOff
        tests:
          - CoreSubsystem_ReviewRules_EnforcedAndSwitchableOff

      - id: ReviewCenter-System-SignatureReauthentication
        title: >-
          The tool shall make a signature only after the signer has proved who they are again for that signature, with
          the password of the account.
        tags: [system]
        justification: |
          A session that was left open, or a stolen cookie, must not be enough to sign in somebody else's name. A
          signature is a legally significant act, so the signer re-authenticates for each one (21 CFR Part 11 section
          11.200(a), signature components and controls; EU GMP Annex 11 clause 14). The system tests drive the
          password proof in a real browser; the lockout, the second factor, and the OpenID Connect proof are verified
          by the tests of the child requirements.
        children:
          - ReviewCenter-Core-Signatures-Reauthenticate
          - ReviewCenter-Web-Signatures-Approve
          - ReviewCenter-Web-Signatures-ApproveOutcome
          - ReviewCenter-Web-Signatures-ApprovePasswordHidden
          - ReviewCenter-Web-Signatures-ApproveNoSecondForm
          - ReviewCenter-Web-Signatures-ApproveResult
          - ReviewCenter-Web-Signatures-WrongPassword
          - ReviewCenter-Web-Signatures-StaleRecord
          - ReviewCenter-Web-Signatures-StaleRecord-Message
          - ReviewCenter-Web-Signatures-Blockers
          - ReviewCenter-Web-Signatures-OthersNoForm
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-SignatureReauthentication-SecondFactor
        title: >-
          The tool shall require, for a signer who has a second factor, a fresh code of the authenticator app in
          addition to the password, and ask for it beside the password in the sign form.
        tags: [system]
        justification: |
          A signature has to be made with all the components of the electronic signature that the signer has (21 CFR
          Part 11 section 11.200(a), signature components and controls).
        children:
          - ReviewCenter-Core-TotpSecondFactor-SignatureCode
          - ReviewCenter-Web-TotpSecondFactor-SignatureCode

      - id: ReviewCenter-System-SignatureReauthentication-SecondFactorPasswordFirst
        title: >-
          The tool shall leave the code of a signer with a second factor unused when the password of the signature is
          wrong.
        tags: [system]
        justification: |
          A code that a wrong password has not used up stays valid for the signer's next try, and a wrong password
          does not reveal whether the code was right.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SignaturePasswordFirst

      - id: ReviewCenter-System-SignatureReauthentication-SecondFactorNotNeeded
        title: >-
          The tool shall need no code for the signature of a user without a second factor, of a user of a provider,
          or of a user whose second factor is not available.
        tags: [system]
        justification: |
          A proof that the signer cannot give would keep them from signing, and the provider has already proved who
          they are.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SignatureNoCode

      - id: ReviewCenter-System-SignatureReauthentication-Provider
        title: >-
          The tool shall let a person confirm a signature by signing in again at the identity provider.
        tags: [system]
        justification: |
          A person who has no password in the tool must still be able to prove who they are for each signature.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth

      - id: ReviewCenter-System-SignatureReauthentication-ProviderFresh
        title: >-
          The tool shall accept a confirmation of identity with a provider only when the authentication time is fresh.
        tags: [system]
        justification: |
          An old sign-in at the provider says nothing about who sits at the screen now.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-Fresh

      - id: ReviewCenter-System-SignatureReauthentication-ProviderSamePerson
        title: >-
          The tool shall accept a confirmation of identity with a provider only for the same person as the account
          that signs.
        tags: [system]
        justification: |
          A confirmation by another person at the provider must not sign in the name of the account.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-SamePerson

      - id: ReviewCenter-System-SignatureReauthentication-ProviderOnce
        title: >-
          The tool shall accept a confirmation of identity with a provider for exactly one signature.
        tags: [system]
        justification: |
          A proof that works for one signature only stops one confirmation from signing twice.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-Once

      - id: ReviewCenter-System-SignatureReauthentication-ProviderFailsClosed
        title: >-
          The tool shall issue no confirmation of identity with a provider when anything about the answer is missing,
          unusable, or refused.
        tags: [system]
        justification: |
          A proof that cannot be checked must count as no proof.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-FailsClosed
          - ReviewCenter-Identity-OidcSignIn-ReauthRefused

      - id: ReviewCenter-System-SignatureReauthentication-ProviderRefused
        title: >-
          The tool shall send the person back to the review with an answer that tells the class of the reason when a
          confirmation of identity with a provider is refused.
        tags: [system]
        justification: |
          A person whose confirmation failed must know what to try next, without learning more than the class of the
          reason.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-RefusalAnswer

      - id: ReviewCenter-System-SignatureReauthentication-Refused
        title: >-
          The tool shall refuse a signature when the proof is wrong, with the same message for a wrong password, a
          locked account, a recovery code, and a code that was already used.
        tags: [system]
        justification: |
          The message of a refusal must not tell an attacker which part of the proof was right.
        children:
          - ReviewCenter-Core-Signatures-ReauthenticateFailure
          - ReviewCenter-Core-TotpSecondFactor-SignatureRecoveryRefused
          - ReviewCenter-Core-TotpSecondFactor-SignatureReplayRefused
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-SignatureReauthentication-FailClosed
        title: >-
          The tool shall refuse the signature of a signer with a second factor when the second factor cannot be
          checked.
        tags: [system]
        justification: |
          A proof that cannot be checked must count as no proof.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SignatureFailClosed

      - id: ReviewCenter-System-SignatureReauthentication-Lockout
        title: >-
          The tool shall count a wrong password or a wrong code of a signature toward the same lockout as sign-in.
        tags: [system]
        justification: |
          Counting a wrong proof toward the lockout stops the signature step from becoming a way to guess the
          password (21 CFR Part 11 section 11.300, controls for identification codes and passwords).
        children:
          - ReviewCenter-Core-Signatures-ReauthenticateLockout
          - ReviewCenter-Core-TotpSecondFactor-SignatureLockoutCount

      - id: ReviewCenter-System-SignatureReauthentication-FailureAudit
        title: >-
          The tool shall record a wrong password, a locked account, or a wrong code at the check of a signature in
          the audit trail as a failed re-authentication.
        tags: [system]
        justification: |
          Attempts to sign in somebody else's name must leave a trace (21 CFR Part 11 section 11.300(d), detecting
          unauthorized use).
        children:
          - ReviewCenter-Core-AuditTrail-Reauth
          - ReviewCenter-Core-AuditTrail-ReauthSigning
          - ReviewCenter-Core-TotpSecondFactor-SignatureLockoutAudit
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-SignatureReauthentication-FailureAuditNoSecret
        title: >-
          The tool shall never record the typed password in the audit entry of a failed re-authentication.
        tags: [system]
        justification: |
          The audit trail must not become a list of passwords that were typed.
        children:
          - ReviewCenter-Core-AuditTrail-ReauthNoPassword
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-SignatureReauthentication-FailureAuditOnce
        title: >-
          The tool shall record failed re-authentications of the same disabled account, and of the same locked
          account, at most once per minute.
        tags: [system]
        justification: |
          A flood of attempts on one account must not fill the audit trail.
        children:
          - ReviewCenter-Core-AuditTrail-ReauthOnce

      - id: ReviewCenter-System-SignatureBinding
        title: >-
          The tool shall bind every signature to the exact record that the signer reviewed, by a digest of the
          record that the signer reviewed.
        tags: [system]
        justification: |
          A signature is worth only what it covers. Binding it to a digest of the whole record means the signer is
          never made to approve something different from what they examined, and links the signature to its record
          in a way that cannot be moved to another record (21 CFR Part 11 section 11.70, signature/record linking;
          EU GMP Annex 11 clause 14). That the digest is stable for the same record and different for any other is
          verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-Signatures-DigestBinding
          - ReviewCenter-Core-Signatures-DigestNullRecord
          - ReviewCenter-Core-Signatures-DigestIndependence
          - ReviewCenter-Core-Signatures-DigestUnambiguous
          - ReviewCenter-Core-Signatures-Status
          - ReviewCenter-Storage-Signatures-Current
          - ReviewCenter-Web-Signatures-Digest
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-SignatureBinding-Content
        title: >-
          The tool shall cover the content fingerprint of the review in the digest that a signature is bound to.
        tags: [system]
        justification: |
          The files under review are the thing that is approved. If the content fingerprint were not covered, the
          content could change after the signature and the approval would still stand.
        children:
          - ReviewCenter-Core-Fingerprint
          - ReviewCenter-Core-Fingerprint-NameOrderIndependent
          - ReviewCenter-Core-Fingerprint-Arguments

      - id: ReviewCenter-System-SignatureBinding-Checklist
        title: >-
          The tool shall cover the checklist wording of the review in the digest that a signature is bound to.
        tags: [system]
        justification: |
          The signer approves against the checklist as worded when they signed. Covering its version, sections, and
          checks means that a reworded checklist cannot leave an earlier approval standing.
        children:
          - ReviewCenter-Core-Signatures-DigestChecklist
          - ReviewCenter-Core-Signatures-DigestChecklistInvalid

      - id: ReviewCenter-System-SignatureBinding-Ballots
        title: >-
          The tool shall cover the consolidated standing of the submitted ballots in the digest that a signature is
          bound to: the agreed answer, disputed, or open per check, agreed or disputed not-applicable per section, and
          the outcome, with no answerer, justification, slot, or draft.
        tags: [system]
        justification: |
          The signer approves the standing of the ballots, not the person who gave an answer. Covering the standing
          and leaving out who answered, and any draft, means a signature goes out of date only when the result of
          the review changes.
        children:
          - ReviewCenter-Core-Signatures-DigestChecks
          - ReviewCenter-Core-Signatures-DigestDraftIgnored
          - ReviewCenter-Core-Signatures-DigestNoBallotContent
          - ReviewCenter-Core-Signatures-DigestWho
          - ReviewCenter-Core-Signatures-DigestOutcome
          - ReviewCenter-Core-Signatures-DigestBallotFingerprint

      - id: ReviewCenter-System-SignatureBinding-ConclusionText
        title: >-
          The tool shall cover the review conclusion text in the digest that a signature is bound to.
        tags: [system]
        justification: |
          The conclusion text is part of what the reviewers state. Covering it means that a changed conclusion
          cannot ride on a signature that was given for another text.
        children:
          - ReviewCenter-Core-Signatures-DigestConclusionText

      - id: ReviewCenter-System-SignatureBinding-Comments
        title: >-
          The tool shall cover the comments of the report in the digest that a signature is bound to.
        tags: [system]
        justification: |
          The comments are the findings that the signer accepted. Covering the claim, replies, resolution notes, and
          side of each thread means that a signature cannot stand for a report that was changed afterwards.
        children:
          - ReviewCenter-Core-Signatures-DigestReport
          - ReviewCenter-Core-Signatures-ThreadRestored
          - ReviewCenter-Core-Diff-DigestSide
          - ReviewCenter-Core-Threads-CheckThreadDigest

      - id: ReviewCenter-System-SignatureBinding-CommentsNotCovered
        title: >-
          The tool shall leave chat, the state of a thread, and the creation time or identity of a thread out of the
          digest that a signature is bound to.
        tags: [system]
        justification: |
          Chat and the bookkeeping of a thread are not findings. Leaving them out means that a discussion does not
          end an approval that nothing in the report has changed.
        children:
          - ReviewCenter-Core-Signatures-DigestNotCovered
          - ReviewCenter-Core-ApprovalLock-ChatKeeps

      - id: ReviewCenter-System-SignatureBinding-GitSource
        title: >-
          The tool shall cover the git source of the review in the digest that a signature is bound to: the
          repository, commits, selection, changes, and review set.
        tags: [system]
        justification: |
          A review from a repository stands for a particular source. Covering it means that the same files from
          another source, commit range, or review set do not share a signature.
        children:
          - ReviewCenter-Core-RepositoryReviews-DigestBinding
          - ReviewCenter-Core-RepositoryReviews-DigestSource
          - ReviewCenter-Core-RepositoryReviews-ReviewSet
          - ReviewCenter-Core-RepositoryReviews-ReviewSetLength
          - ReviewCenter-Core-RepositoryReviews-ReviewSetNone

      - id: ReviewCenter-System-SignatureBinding-ChangeEndsApproval
        title: >-
          The tool shall end the approval of a review when any part of the record that the digest covers changes
          after it was signed.
        tags: [system]
        justification: |
          An approval must never stand for a record that nobody signed. A change of any covered part gives a
          different digest, so the earlier signatures are out of date and the reviewers sign again.
        children:
          - ReviewCenter-Core-Signatures-DigestCoverage
          - ReviewCenter-Core-Signatures-OutOfDate
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-SignatureBinding-StaleRefused
        title: >-
          The tool shall refuse a signature when the record has changed since the page of the signer was drawn.
        tags: [system]
        justification: |
          A reviewer may be reading while the record moves. Refusing the signature, in the same transaction that
          stores it, means the signer is never made to sign a record that they did not see.
        children:
          - ReviewCenter-Core-Signatures-RecordCurrent
          - ReviewCenter-Storage-Signatures-StaleRefused
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-RecordImmutability
        title: >-
          The tool shall keep the reviewed content as it was stored.
        tags: [system]
        justification: |
          Evidence is trusted only when it cannot be rewritten afterwards. The files under review, and the baseline
          and checklist that go with them, are stored so that they can only be added to (21 CFR Part 11 section
          11.10(c), protection of records). The stored baseline and checklist wording are never updated by the code.
        children:
          - ReviewCenter-Core-Reviews
          - ReviewCenter-Core-Reviews-Files
          - ReviewCenter-Core-Reviews-ReadBack
          - ReviewCenter-Storage-Persistence-Reviews
          - ReviewCenter-Storage-Persistence-FileContent
          - ReviewCenter-Core-RepositoryReviews-Frozen
          - ReviewCenter-Storage-RepositoryReviews
          - ReviewCenter-Storage-RepositoryReviews-FileBaseline
          - ReviewCenter-Storage-RepositoryReviews-NoContentInReview
          - ReviewCenter-Storage-RepositoryReviews-BaselineOnRequest
          - ReviewCenter-Core-Checklist-Frozen
          - ReviewCenter-Storage-Checklist

      - id: ReviewCenter-System-RecordImmutability-Comments
        title: >-
          The tool shall keep every posted comment as it was stored and offer no way to edit or delete a posted
          comment.
        tags: [system]
        justification: |
          A finding is evidence of what the reviewers saw. A comment that could be edited or removed afterwards
          would let the record be rewritten (21 CFR Part 11 section 11.10(e)); a reply or a resolution only adds.
        children:
          - ReviewCenter-Core-Threads-NoEdit
          - ReviewCenter-Core-Threads-ReadBack
          - ReviewCenter-Storage-Threads
          - ReviewCenter-Storage-Threads-State
          - ReviewCenter-Storage-Threads-Comments

      - id: ReviewCenter-System-RecordImmutability-Signatures
        title: >-
          The tool shall keep every signature as it was stored and offer no way to change or remove a signature.
        tags: [system]
        justification: |
          A signature is the proof that a person accepted a record. If it could be changed or removed, the proof
          would be worthless (21 CFR Part 11 section 11.10(c)); a signed slot is also protected by the database.
        children:
          - ReviewCenter-Core-Signatures-Unchanged
          - ReviewCenter-Storage-Signatures-SignedSlotKept

      - id: ReviewCenter-System-RecordImmutability-Lock
        title: >-
          The tool shall lock a review against every change as soon as it is concluded, as approved or as rejected.
        tags: [system]
        justification: |
          Nobody may change what the reviewers signed. The lock is applied in the services and again in the database
          transaction, so that no path to the data can bypass it, and refuses with a message that says the review has
          to be reopened first.
        children:
          - ReviewCenter-Core-ApprovalLock-ChangesRefused
          - ReviewCenter-Core-ApprovalLock-NothingChanged
          - ReviewCenter-Core-ApprovalLock-AfterAccess
          - ReviewCenter-Core-ApprovalLock-BeforeFileLookup
          - ReviewCenter-Core-ApprovalLock-ReviewNotFound
          - ReviewCenter-Core-ApprovalLock-SlotChanges
          - ReviewCenter-Core-ApprovalLock-ChecklistRefused
          - ReviewCenter-Core-ApprovalLock-SignatureRefused
          - ReviewCenter-Core-ApprovalLock-Message
          - ReviewCenter-Core-Signatures-RejectedLocks
          - ReviewCenter-Core-Signatures-ConclusionTextLocked
          - ReviewCenter-Storage-ReviewIntegrity-ApprovedLock
          - ReviewCenter-Storage-Threads-ConcludedRefused
        tests:
          - ReviewCenter_ApprovedReview_IsLockedUntilAnAdministratorReopensItWithAReason
          - CoreSubsystem_ApprovedReview_RefusesEveryMutationWithReviewLocked
          - StorageSubsystem_ReopenAndLock_SurviveRestartAndRefuseWritesInTransaction

      - id: ReviewCenter-System-RecordImmutability-OpenThreadNotLocked
        title: >-
          The tool shall not lock a review whose slots are all signed while a thread is still open.
        tags: [system]
        justification: |
          A review is concluded only when no thread is open. Until then the reviewers must still be able to discuss
          and resolve, so that the last resolution can conclude the review rather than a lock getting in the way.
        children:
          - ReviewCenter-Core-ApprovalLock-OpenThreadAccepts

      - id: ReviewCenter-System-RecordImmutability-OpenThreadResolved
        title: >-
          The tool shall allow the signature, and conclude the review, once the last open thread is resolved while
          every slot holds a signature of the current record.
        tags: [system]
        justification: |
          Resolving the last open thread is the step that ends the discussion. The signatures that exist stay valid,
          so that the review is concluded without asking the reviewers to sign again.
        children:
          - ReviewCenter-Core-ApprovalLock-ResolvedConcludes

      - id: ReviewCenter-System-RecordImmutability-OpenThreadResolvedNoAudit
        title: >-
          The tool shall record no further audit entry when the resolution of the last open thread concludes the
          review.
        tags: [system]
        justification: |
          The conclusion follows from the resolution, which is audited already. A second entry would record one change
          twice.
        children:
          - ReviewCenter-Core-ApprovalLock-ResolvedNoAudit

      - id: ReviewCenter-System-RecordImmutability-LockShown
        title: >-
          The tool shall show a review that is concluded as locked, with the reason given, and disable the controls
          that change it.
        tags: [system]
        justification: |
          A user who cannot see why a change is refused cannot act on it. Showing the lock, and its reason, on the
          review page and on the checklist page, keeps the refusal from being a surprise.
        children:
          - ReviewCenter-Web-ReviewLock
          - ReviewCenter-Web-ReviewLock-ChecklistLocked
          - ReviewCenter-Web-ReviewLock-Controls
          - ReviewCenter-Web-ReviewLock-Reading
          - ReviewCenter-Web-ReviewLock-ReadingThreads
        tests:
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-System-RecordImmutability-LockReadable
        title: >-
          The tool shall keep a locked review readable to a client with a valid token, with its attestation and its
          evidence index.
        tags: [system]
        justification: |
          The lock protects the record, not access to it. A locked review is exactly the one that an auditor or a
          pipeline has to read to retrieve the evidence.
        children:
          - ReviewCenter-Api-LockedReview
        tests:
          - ApiSubsystem_LockedReview_StaysReadableAndMutationIsProblem409

      - id: ReviewCenter-System-RecordImmutability-LockConflict
        title: >-
          The tool shall report to an API client a change that the lock refuses as a problem document with status 409.
        tags: [system]
        justification: |
          A client must be able to tell a refusal because of the lock from other failures. A conflict status says
          that the state of the review, not the request, is the reason.
        children:
          - ReviewCenter-Api-LockedReview-Conflict409
        tests:
          - ApiSubsystem_LockedReview_StaysReadableAndMutationIsProblem409

      - id: ReviewCenter-System-RecordImmutability-Reopen
        title: >-
          The tool shall let a project administrator or a system administrator reopen a locked review with a reason.
        tags: [system]
        justification: |
          The only way forward from a lock is a deliberate act by an administrator. The reopening is stored with who,
          when, why, and the digest that was approved, and shown in a history, so that it can always be explained.
        children:
          - ReviewCenter-Core-ApprovalLock-Reopen
          - ReviewCenter-Core-ApprovalLock-ReopenStored
          - ReviewCenter-Core-Signatures-RejectedReopen
          - ReviewCenter-Storage-ReviewIntegrity
          - ReviewCenter-Web-ReviewLock-Reopen
          - ReviewCenter-Web-ReviewLock-ReopenHidden
          - ReviewCenter-Web-ReviewLock-ReopenRefused
          - ReviewCenter-Web-ReviewLock-ReopenRefused-StaysLocked
        tests:
          - ReviewCenter_ApprovedReview_IsLockedUntilAnAdministratorReopensItWithAReason
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures
          - StorageSubsystem_ReopenAndLock_SurviveRestartAndRefuseWritesInTransaction
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-System-RecordImmutability-ReopenHistory
        title: >-
          The tool shall show the reopenings of a review in a history.
        tags: [system]
        justification: |
          A reopening must be explainable later. The history names who reopened the review, when, and why, next to the
          digest that was approved.
        children:
          - ReviewCenter-Web-ReviewLock-ReopenHistory
        tests:
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-System-RecordImmutability-ReopenReasonRequired
        title: >-
          The tool shall refuse to reopen a review without a reason of at least one and at most 250 characters.
        tags: [system]
        justification: |
          A reopening that is not explained cannot be reviewed later. A bounded reason is what the audit trail can
          show.
        children:
          - ReviewCenter-Core-ApprovalLock-ReopenReason
        tests:
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures

      - id: ReviewCenter-System-RecordImmutability-ReopenNotAdmin
        title: >-
          The tool shall refuse to reopen a review for an actor who is neither an administrator of the project nor a
          system administrator, and for a token.
        tags: [system]
        justification: |
          Reopening ends an approval, so it is restricted to the people who are accountable for the project; an
          automated token is never such a person.
        children:
          - ReviewCenter-Core-ApprovalLock-ReopenRefused
          - ReviewCenter-Api-LockedReview-NoReopen
        tests:
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures

      - id: ReviewCenter-System-RecordImmutability-ReopenNotLocked
        title: >-
          The tool shall refuse to reopen a review that is not locked or does not exist, and let only one of two
          overlapping reopenings succeed.
        tags: [system]
        justification: |
          A reopening of a review that is open, or a second one at the same time, would write a history entry for
          something that did not happen. The refusal stores nothing.
        children:
          - ReviewCenter-Core-ApprovalLock-ReopenUnlockedRefused
          - ReviewCenter-Core-ApprovalLock-ReopenMissing
          - ReviewCenter-Storage-ReviewIntegrity-ReopenRefused
          - ReviewCenter-Storage-ReviewIntegrity-ReopenRefused-Concurrent

      - id: ReviewCenter-System-RecordImmutability-ReopenAudit
        title: >-
          The tool shall record the reopening of a review in the audit trail with the reason and the digest, in the
          same transaction that stores the reopening.
        tags: [system]
        justification: |
          A reopening is a controlled change of evidence. Recording it together with its audit entry means that
          neither can exist without the other (21 CFR Part 11 section 11.10(e)).
        children:
          - ReviewCenter-Core-ApprovalLock-ReopenAudit
          - ReviewCenter-Storage-ReviewIntegrity-ReopenAudit

      - id: ReviewCenter-System-RecordImmutability-InReviewAgain
        title: >-
          The tool shall show a review as In review again as soon as the record changes after it was signed.
        tags: [system]
        justification: |
          An approval must never stand for a record that nobody signed. A change before the approval, such as a
          checklist answer or a new comment, leaves an earlier signature out of date.
        children:
          - ReviewCenter-Core-Signatures-OutOfDate
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-RecordImmutability-ReopenedInReview
        title: >-
          The tool shall show a review as In review again as soon as it is reopened, and need fresh signatures from
          every slot before it is approved again.
        tags: [system]
        justification: |
          A reopened review no longer has the approval that it was locked for. The reviewers sign again, so that
          the new approval stands for the record as it is then.
        children:
          - ReviewCenter-Core-ApprovalLock-FreshSignatures
        tests:
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures
          - IntegrationTests_ApprovalLockReopenResign_EndToEnd

      - id: ReviewCenter-System-RecordImmutability-SignaturesHistory
        title: >-
          The tool shall keep every earlier signature as history after a reopening, out of date for good, even when
          the content is changed back.
        tags: [system]
        justification: |
          A signature that was given for an earlier approval cannot be made current again by restoring the content.
          The earlier signatures stay as history, so that the record of who signed what is complete.
        children:
          - ReviewCenter-Core-ApprovalLock-HistoryKept

      - id: ReviewCenter-System-RecordImmutability-BallotsStay
        title: >-
          The tool shall leave the ballots of the slots as they are when a review is reopened.
        tags: [system]
        justification: |
          Reopening ends the approval, not the work of the reviewers. A submitted ballot stays submitted, so that
          nobody has to redo their checklist to sign again.
        children:
          - ReviewCenter-Core-ApprovalLock-BallotsStay

      - id: ReviewCenter-System-RecordImmutability-AuditEdit
        title: >-
          The tool shall let an edit of a stored audit entry be found by the verification of the audit trail.
        tags: [system]
        justification: |
          Audit entries are chained by hash, so that an entry that was edited, deleted, inserted, or reordered breaks
          the chain at that entry and the verification reports the first broken one (21 CFR Part 11 section
          11.10(e), audit trails that do not obscure earlier entries).
        children:
          - ReviewCenter-Core-AuditTrail-Verify
          - ReviewCenter-Core-AuditTrail-TamperDetected
          - ReviewCenter-Core-AuditTrail-Record
          - ReviewCenter-Core-AuditTrail-VerifyTrail
          - ReviewCenter-Core-AuditTrail-VerifyTrailBroken
          - ReviewCenter-Storage-AuditTrail-Linear
        tests:
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-RecordImmutability-AuditKept
        title: >-
          The tool shall offer no way to update or delete a stored audit entry.
        tags: [system]
        justification: |
          The verification can only find an edit that the tool itself did not make. Offering no update or delete of
          an entry means the trail can only grow.
        children:
          - ReviewCenter-Storage-AuditTrail-Immutable

      # ----------------------------------------------------------------------------------------------
      # Evidence and audit: the history, its verification, and the portable proof
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-AuditTrail
        title: >-
          The tool shall record every change of projects, reviews, comments, checklists, reviewer slots, signatures,
          and users in an audit trail in the database.
        tags: [system]
        justification: |
          A review record is only evidence when its history can be checked (21 CFR Part 11 section 11.10(e),
          secure, computer-generated, time-stamped audit trails; EU GMP Annex 11 clause 9). Each change is stored
          together with its audit entry, so that both exist or neither does.
        children:
          - ReviewCenter-Core-AuditTrail
          - ReviewCenter-Core-AuditTrail-Projects
          - ReviewCenter-Core-AuditTrail-ProjectMembers
          - ReviewCenter-Core-AuditTrail-ProjectMembers-RoleChange
          - ReviewCenter-Core-AuditTrail-ProjectMembers-Removal
          - ReviewCenter-Core-AuditTrail-ProjectMembers-Account
          - ReviewCenter-Core-AuditTrail-ProjectMembers-NoPassword
          - ReviewCenter-Core-AuditTrail-ProjectMemberRefused
          - ReviewCenter-Core-AuditTrail-EvidenceSettings
          - ReviewCenter-Core-AuditTrail-ProjectChecklist
          - ReviewCenter-Core-AuditTrail-Reviews
          - ReviewCenter-Core-AuditTrail-Threads
          - ReviewCenter-Core-AuditTrail-ThreadReport
          - ReviewCenter-Core-AuditTrail-ThreadReportMarks
          - ReviewCenter-Core-AuditTrail-CheckThreads
          - ReviewCenter-Core-AuditTrail-Checklists
          - ReviewCenter-Core-AuditTrail-Slots
          - ReviewCenter-Core-AuditTrail-Signatures
          - ReviewCenter-Core-AuditTrail-Users
          - ReviewCenter-Core-AuditTrail-Repositories
          - ReviewCenter-Storage-AuditTrail
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-AuditTrail-SignInEvents
        title: >-
          The tool shall record every sign-in, sign-out, failed sign-in, attempt on a locked account, refusal by the
          sign-in throttle, failed re-authentication for a signature, and lockout in the audit trail.
        tags: [system]
        justification: |
          Attempts to get into the tool, and the proofs of identity that sign a record, are what an investigation of
          misuse starts from (21 CFR Part 11 section 11.10(e)). They are recorded as events of their own, apart from
          the changes of records.
        children:
          - ReviewCenter-Identity-AuditTrail
          - ReviewCenter-Core-AuditTrail-SignInEvents
          - ReviewCenter-Core-AuditTrail-SignInReasons
          - ReviewCenter-Core-AuditTrail-Reauth
          - ReviewCenter-Core-AuditTrail-ReauthSigning
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-AuditTrail-SignInRepeats
        title: >-
          The tool shall record repeated failures of the same kind for the same account at most once a minute and
          count the repeats instead.
        tags: [system]
        justification: |
          A caller can repeat a failed sign-in without limit. Recording each one would let an outsider fill the
          trail and the database with noise.
        children:
          - ReviewCenter-Core-AuditTrail-Coalesce
          - ReviewCenter-Core-AuditTrail-CoalesceOverflow
          - ReviewCenter-Core-AuditTrail-SignInOnce
          - ReviewCenter-Core-AuditTrail-ReauthOnce
          - ReviewCenter-Identity-AuditTrail-Coalesce

      - id: ReviewCenter-System-AuditTrail-SignInBestEffort
        title: >-
          The tool shall give the result of a sign-in or a sign-out unchanged when the audit trail fails.
        tags: [system]
        justification: |
          A fault of the audit trail must not lock every user out, and it must not turn a failed sign-in into a
          success or the other way round.
        children:
          - ReviewCenter-Core-AuditTrail-SignInResilient
          - ReviewCenter-Identity-AuditTrail-BestEffort

      - id: ReviewCenter-System-AuditTrail-Fields
        title: >-
          The tool shall name the time, the person, the action, and a short detail in every audit entry.
        tags: [system]
        justification: |
          An entry that does not say when, who, and what cannot be used to reconstruct events (21 CFR Part 11
          section 11.10(e)). The detail is short and holds no free text, so that the trail stays readable and does
          not copy the content of the records.
        children:
          - ReviewCenter-Core-AuditTrail-Detail
          - ReviewCenter-Core-AuditTrail-Actor
          - ReviewCenter-Core-AuditTrail-ThreadNoText
          - ReviewCenter-Core-AuditTrail-ThreadResolutionNote
          - ReviewCenter-Identity-AuditTrail-TypedName

      - id: ReviewCenter-System-AuditTrail-NoPassword
        title: >-
          The tool shall never record a password in the audit trail.
        tags: [system]
        justification: |
          The trail is read by administrators and exported, so a typed or stored password in it would be a leak of a
          credential.
        children:
          - ReviewCenter-Core-AuditTrail-UserNoPassword
          - ReviewCenter-Core-AuditTrail-SignInNoPassword
          - ReviewCenter-Core-AuditTrail-ReauthNoPassword
          - ReviewCenter-Core-AuditTrail-RepositoryNoSecret
          - ReviewCenter-Identity-AuditTrail-NoPassword
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-AuditTrail-NothingRecorded
        title: >-
          The tool shall record no audit entry for a request that is refused or that changes nothing.
        tags: [system]
        justification: |
          An entry for a change that did not happen would make the history say something false.
        children:
          - ReviewCenter-Core-AuditTrail-ThreadMissing
          - ReviewCenter-Core-AuditTrail-ThreadReportNoOp
          - ReviewCenter-Core-AuditTrail-ChecklistsRefused
          - ReviewCenter-Core-AuditTrail-SigningRefused
          - ReviewCenter-Core-AuditTrail-RepositoryNoChange

      - id: ReviewCenter-System-AuditTrail-Chained
        title: >-
          The tool shall chain the entries of the audit trail by hashes so that an edit, a deletion, an insertion, or
          a reordering in the middle of the history can be detected.
        tags: [system]
        justification: |
          The chain makes tampering with the history detectable. It does not detect the removal of the newest
          entries or a complete rewrite by someone with write access to the database, unless the head hash was
          recorded elsewhere; this version has no external anchoring, and that limit is stated to the user. The
          system test drives a real database with an edit made behind the tool's back; the other kinds of break are
          verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-AuditTrail-Verify
          - ReviewCenter-Core-AuditTrail-TamperDetected
          - ReviewCenter-Core-AuditTrail-Record
          - ReviewCenter-Storage-AuditTrail-Gate
          - ReviewCenter-Storage-AuditTrail-GateReleased
          - ReviewCenter-Storage-AuditTrail-Linear
          - ReviewCenter-Storage-AuditTrail-UniqueSequence
        tests:
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify
        title: >-
          The tool shall let a system administrator verify the hash chain of the audit trail on request from the audit
          page.
        tags: [system]
        justification: |
          Verification is how tampering is found, and an audit trail that nobody can check does not protect anyone.
          The head hash lets a system administrator record the state of the trail outside the database.
        children:
          - ReviewCenter-Web-AuditPage-Verify
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-AuditVerify-Verb
        title: >-
          The tool shall let the hash chain of the audit trail be verified from the command line with the audit
          verify verb.
        tags: [system]
        justification: |
          The command line lets scripts and scheduled jobs check the trail without a person at the audit page.
        children:
          - ReviewCenter-Program-AuditVerify
          - ReviewCenter-Program-AuditVerify-Help
          - ReviewCenter-Cli-AuditVerify
          - ReviewCenter-Cli-AuditVerify-Misuse
          - ReviewCenter-Hosting-AuditVerify
        tests:
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify-ReportIntact
        title: >-
          The tool shall report an intact chain with the number of entries, and on the audit page also the head hash.
        tags: [system]
        justification: |
          The number of entries and the head hash are what a system administrator writes down to check the trail
          again later.
        children:
          - ReviewCenter-Web-AuditPage-Intact
          - ReviewCenter-Web-AuditPage-IntactHeadHash
          - ReviewCenter-Core-AuditTrail-VerifyTrail
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify-ReportBroken
        title: >-
          The tool shall report a broken chain with the first broken entry.
        tags: [system]
        justification: |
          The first broken entry shows where the history was changed, and everything before it is still trusted.
        children:
          - ReviewCenter-Web-AuditPage-Broken
          - ReviewCenter-Web-AuditPage-BrokenHeadHash
          - ReviewCenter-Core-AuditTrail-VerifyTrailBroken
        tests:
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify-ExitZero
        title: >-
          The tool shall return exit code 0 from the audit verify verb for an intact chain.
        tags: [system]
        justification: |
          A script or scheduled job reads the exit code to decide that the trail is fine.
        children:
          - ReviewCenter-AuditCommand-Verify
          - ReviewCenter-AuditCommand-Verify-EmptyTrail
        tests:
          - AuditCommand_Run_IntactTrail_ReportsEntryCountWithExitCodeZero

      - id: ReviewCenter-System-AuditVerify-ExitOne
        title: >-
          The tool shall return exit code 1 from the audit verify verb for a broken chain or an unreadable database.
        tags: [system]
        justification: |
          A check that cannot read the trail must not look like a check that passed, so a script or scheduled job
          treats the failure as a finding.
        children:
          - ReviewCenter-AuditCommand-Verify-EditedEntry
          - ReviewCenter-AuditCommand-Verify-DeletedEntry
          - ReviewCenter-AuditCommand-Errors
          - ReviewCenter-AuditCommand-Errors-Unreadable
        tests:
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify-ShowTrail
        title: >-
          The tool shall show a system administrator the audit trail on the audit page.
        tags: [system]
        justification: |
          An audit trail that nobody can read does not protect anyone. The whole trail names every user and action,
          so it is for system administrators (21 CFR Part 11 section 11.10(e), audit trail available for review).
        children:
          - ReviewCenter-Web-AuditPage
          - ReviewCenter-Web-AuditPage-Paging
          - ReviewCenter-Web-AuditPage-PagingFilter
          - ReviewCenter-Web-AuditPage-PagingSize
          - ReviewCenter-Web-AuditPage-ShortHash
          - ReviewCenter-Web-AuditPage-ShortHashTooltip
          - ReviewCenter-Web-AuditPage-Refused
          - ReviewCenter-Web-AuditPage-Refused-Role
          - ReviewCenter-Web-AuditPage-Refused-Disabled
          - ReviewCenter-Web-AuditPage-Refused-NoEntries
          - ReviewCenter-Web-AuditPage-Refused-NoRead
          - ReviewCenter-Web-AuditPage-VerifyRefused
          - ReviewCenter-Web-AuditPage-VerifyRefused-NoEntries
          - ReviewCenter-Web-AuditPage-VerifyRefused-NoRead
          - ReviewCenter-Web-AuditPage-HeaderLink
          - ReviewCenter-Core-AuditTrail-Pages
          - ReviewCenter-Core-AuditTrail-Scope
          - ReviewCenter-Core-AuditTrail-Cursors
          - ReviewCenter-Storage-AuditTrail-Pages
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-AuditVerify-Refused
        title: >-
          The tool shall refuse the audit trail, and the export of it, to a user who is not allowed to read it.
        tags: [system]
        justification: |
          The whole trail names every user and action, so it is limited to system administrators, and the trail of
          a project to those who administer or audit that project.
        children:
          - ReviewCenter-Web-AuditPage
          - ReviewCenter-Web-AuditPage-Paging
          - ReviewCenter-Web-AuditPage-PagingFilter
          - ReviewCenter-Web-AuditPage-PagingSize
          - ReviewCenter-Web-AuditPage-ShortHash
          - ReviewCenter-Web-AuditPage-ShortHashTooltip
          - ReviewCenter-Web-AuditPage-Refused
          - ReviewCenter-Web-AuditPage-Refused-Role
          - ReviewCenter-Web-AuditPage-Refused-Disabled
          - ReviewCenter-Web-AuditPage-Refused-NoEntries
          - ReviewCenter-Web-AuditPage-Refused-NoRead
          - ReviewCenter-Web-AuditPage-VerifyRefused
          - ReviewCenter-Web-AuditPage-VerifyRefused-NoEntries
          - ReviewCenter-Web-AuditPage-VerifyRefused-NoRead
          - ReviewCenter-Web-AuditPage-ProjectTrailOnly
          - ReviewCenter-Web-AuditPage-ProjectTrailLost
          - ReviewCenter-Api-AuditExport-Refused
          - ReviewCenter-Api-AuditExport-NoSession

      - id: ReviewCenter-System-AuditVerify-ProjectTrail
        title: >-
          The tool shall show a system administrator or a project admin the audit trail of one project on a page that
          is reached from the project page.
        tags: [system]
        justification: |
          A project admin needs to see the history of the project, and does not need the trail of other projects.
        children:
          - ReviewCenter-Web-AuditPage-ProjectTrail
          - ReviewCenter-Web-AuditPage-ProjectTrailAuditor
          - ReviewCenter-Storage-AuditTrail-ProjectOnly

      - id: ReviewCenter-System-AuditVerify-History
        title: >-
          The tool shall show every signed-in user who may see the project of a review the audit history of that
          review.
        tags: [system]
        justification: |
          Participants need to see who did what and when for the reviews they may see. The history names only
          actions on that review.
        children:
          - ReviewCenter-Web-AuditHistory
          - ReviewCenter-Web-AuditHistory-NotFound
          - ReviewCenter-Web-AuditHistory-Access
          - ReviewCenter-Web-AuditHistory-Newest
          - ReviewCenter-Web-AuditHistory-Paging
          - ReviewCenter-Web-AuditHistory-Link
          - ReviewCenter-Web-AuditHistory-PlainText

      - id: ReviewCenter-System-AuditVerify-Filter
        title: >-
          The tool shall let a system administrator narrow the audit trail on the audit page by project, actor, action,
          review, and date range.
        tags: [system]
        justification: |
          A long trail is only useful when the administrator can narrow it to the project, person, or action under
          investigation.
        children:
          - ReviewCenter-Web-AuditPage-Filter
          - ReviewCenter-Web-AuditPage-FilterAddress
          - ReviewCenter-Web-AuditPage-FilterAddressFallback
          - ReviewCenter-Web-AuditPage-FilterAddressFallbackSize
          - ReviewCenter-Web-AuditPage-FilterReversed
          - ReviewCenter-Web-AuditPage-FilterReversedMessage
          - ReviewCenter-Core-AuditTrail-Filter
          - ReviewCenter-Core-AuditTrail-FilterInput
          - ReviewCenter-Core-AuditTrail-FilterSingleDay
          - ReviewCenter-Core-AuditTrail-ActionCatalog
          - ReviewCenter-Storage-AuditTrail-Filter
        tests:
          - ReviewCenter_AuditTrail_FiltersByActionAndActor

      - id: ReviewCenter-System-AuditVerify-FilterInvalid
        title: >-
          The tool shall refuse an audit filter that is invalid.
        tags: [system]
        justification: |
          A filter with a text longer than the field or a range that ends before it starts can match nothing
          useful, and a refusal says so instead of showing an empty trail.
        children:
          - ReviewCenter-Core-AuditTrail-FilterRefused
          - ReviewCenter-Core-AuditTrail-ExportRefused

      - id: ReviewCenter-System-AuditVerify-Export
        title: >-
          The tool shall let a system administrator export the filtered audit trail as CSV or JSON.
        tags: [system]
        justification: |
          The agency can ask for a copy of the audit trail in a portable form (21 CFR Part 11 section 11.10(e)). A
          project admin or an auditor may export the trail of their project only.
        children:
          - ReviewCenter-Web-AuditPage-ExportCsv
          - ReviewCenter-Web-AuditPage-ExportLinks
          - ReviewCenter-Web-AuditPage-ExportFilter
          - ReviewCenter-Web-AuditPage-ExportNoPaging
          - ReviewCenter-Web-AuditPage-ExportNote
          - ReviewCenter-Web-AuditPage-ExportNoteChain
          - ReviewCenter-Web-AuditPage-ExportJson
          - ReviewCenter-Api-AuditExport
          - ReviewCenter-Api-AuditExport-Allowed
          - ReviewCenter-Api-AuditExport-NotInApi
          - ReviewCenter-Core-AuditTrail-Export
          - ReviewCenter-Core-AuditTrail-ExportScope
          - ReviewCenter-Core-AuditTrail-ExportEmpty
          - ReviewCenter-Core-AuditTrail-ExportCanceled
          - ReviewCenter-Core-AuditTrail-ExportFile
          - ReviewCenter-Core-AuditTrail-ExportCsv
          - ReviewCenter-Core-AuditTrail-ExportCsvSafe
          - ReviewCenter-Core-AuditTrail-ExportJson
          - ReviewCenter-Core-AuditTrail-ExportWriter
          - ReviewCenter-Storage-AuditTrail-Batches
        tests:
          - ReviewCenter_AuditTrail_Export_ReportsChainStatus

      - id: ReviewCenter-System-AuditVerify-ExportChain
        title: >-
          The tool shall state the verified state of the chain together with an exported audit trail.
        tags: [system]
        justification: |
          An export that does not say whether its source chain was intact could be mistaken for a trusted copy. The
          export reveals no more of the chain than that state.
        children:
          - ReviewCenter-Api-AuditExport-ChainHeaders
          - ReviewCenter-Core-AuditTrail-ExportChainState
          - ReviewCenter-Core-AuditTrail-ExportNoLeak
        tests:
          - ReviewCenter_AuditTrail_Export_ReportsChainStatus

      - id: ReviewCenter-System-AuditVerify-ExportAudited
        title: >-
          The tool shall record each export of the audit trail as an entry of the audit trail.
        tags: [system]
        justification: |
          Handing out a copy of the whole history is itself an event that an investigation needs to find.
        children:
          - ReviewCenter-Core-AuditTrail-ExportAudited
          - ReviewCenter-Core-AuditTrail-ExportAuditedIncomplete

      - id: ReviewCenter-System-Attestation
        title: >-
          The tool shall let a signed-in user download, for a review that every reviewer slot has signed, a PDF
          attestation.
        tags: [system]
        justification: |
          Approval inside a tool is of little use to an auditor who does not have access to it. A portable document
          lets the approval be filed and checked elsewhere (21 CFR Part 11 section 11.10(b), accurate and complete
          copies in human-readable form). The attestation is generated on demand and not kept.
        children:
          - ReviewCenter-Evidence-Document
          - ReviewCenter-Evidence-Release
          - ReviewCenter-Evidence-Release-OnDemand
          - ReviewCenter-Hosting-AttestationServices
          - ReviewCenter-Web-Attestation
          - ReviewCenter-Web-Attestation-Address
          - ReviewCenter-Web-Attestation-NotConcluded
          - ReviewCenter-Web-Attestation-KeyWarning
          - ReviewCenter-Web-Attestation-NoKeyWarning
        tests:
          - EvidenceSubsystem_CompletedReview_IsOfferedAndDownloadedAsSignedPdf
          - AttestationEndpoint_Get_CompleteReview_ReturnsSignedPdfDownloadAndRecordsEvent
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-Attestation-Signed
        title: >-
          The tool shall digitally sign the attestation by the server with a key that is never exported.
        tags: [system]
        justification: |
          The signature adds integrity and the origin of the server key to the in-record signatures that identify
          the reviewers (21 CFR Part 11 section 11.50). A key that is never exported cannot be used to sign
          anything outside the server.
        children:
          - ReviewCenter-Evidence-Signature
          - ReviewCenter-Evidence-Signature-Chain
          - ReviewCenter-Evidence-Signature-NonExportable
          - ReviewCenter-Evidence-Signature-ContentUnchanged
          - ReviewCenter-Evidence-Signature-TamperEvident
        tests:
          - EvidenceSubsystem_CompletedReview_IsOfferedAndDownloadedAsSignedPdf
          - AttestationEndpoint_Get_CompleteReview_ReturnsSignedPdfDownloadAndRecordsEvent

      - id: ReviewCenter-System-Attestation-KeyChoice
        title: >-
          The tool shall sign the attestation with the key that the operator chooses: a self-signed key that the
          server keeps for itself, a certificate in a certificate store, or a certificate with its key in a file.
        tags: [system]
        justification: |
          An organization may accept the self-signed key of the server or may want its own certificate, so the
          operator decides which key stands behind the document.
        children:
          - ReviewCenter-Evidence-Key
          - ReviewCenter-Evidence-Key-SelfSigned
          - ReviewCenter-Evidence-Key-CertificateStore
          - ReviewCenter-Evidence-Key-File
          - ReviewCenter-Evidence-Key-ExpiryWarning
          - ReviewCenter-Evidence-Key-CodeSigningWarning
          - ReviewCenter-Evidence-Key-RequireTrusted-Accepted
          - ReviewCenter-Hosting-AttestationServices

      - id: ReviewCenter-System-Attestation-KeyKind
        title: >-
          The tool shall tell the user and the reader of the attestation which kind of key signed it.
        tags: [system]
        justification: |
          A self-signed key and a certificate of the organization carry different trust, and the reader must not
          have to guess which one they are looking at.
        children:
          - ReviewCenter-Evidence-Key-KeyKind
          - ReviewCenter-Evidence-Document-KeyStatement
          - ReviewCenter-Web-Attestation-KeyNote

      - id: ReviewCenter-System-Attestation-Content
        title: >-
          The tool shall state in the attestation the content, the checklist, the threads, the sign-offs, and the
          head of the audit trail of the review.
        tags: [system]
        justification: |
          The document is the portable record of the approval and has to hold what an auditor needs to judge it
          (21 CFR Part 11 section 11.10(b)). The head of the audit trail ties it to the history of the review.
        children:
          - ReviewCenter-Evidence-Document-Checklist
          - ReviewCenter-Evidence-Document-Findings
          - ReviewCenter-Evidence-Document-Conclusion
          - ReviewCenter-Evidence-Document-RejectionMarked
          - ReviewCenter-Evidence-Document-BallotsAppendix
          - ReviewCenter-Evidence-Document-SignOffs
          - ReviewCenter-Evidence-Document-AuditHead
          - ReviewCenter-Evidence-Document-ReopenHistory

      - id: ReviewCenter-System-Attestation-Reproducible
        title: >-
          The tool shall produce the attestation of a review in the same bytes for the same input.
        tags: [system]
        justification: |
          A document that can be produced again identically can be compared with a filed copy.
        children:
          - ReviewCenter-Evidence-Document-Deterministic

      - id: ReviewCenter-System-Attestation-Settings
        title: >-
          The tool shall leave out of the attestation what the evidence settings of the project say to leave out,
          and state what was left out.
        tags: [system]
        justification: |
          The project decides how much of the review the document may reveal, for example the names of the
          reviewers. A reader must still see that something was left out and by which setting.
        children:
          - ReviewCenter-Evidence-Document-LeftOut
          - ReviewCenter-Evidence-Document-NoExcludedComments
          - ReviewCenter-Evidence-ContentSettings
          - ReviewCenter-Evidence-ContentSettings-ReadTwice
          - ReviewCenter-Evidence-ContentSettings-ContentScope
          - ReviewCenter-Evidence-ContentSettings-NeutralLabels
          - ReviewCenter-Evidence-ContentSettings-SignatureValid
          - ReviewCenter-Evidence-Release-Anonymous

      - id: ReviewCenter-System-Attestation-SettingsPage
        title: >-
          The tool shall let a system administrator or a project admin keep the evidence settings of a project.
        tags: [system]
        justification: |
          The settings are how a project chooses between full evidence and privacy, so changing them is a deliberate
          act of those who answer for the project and is recorded in the audit trail.
        children:
          - ReviewCenter-Core-EvidenceSettings
          - ReviewCenter-Core-EvidenceSettings-Describe
          - ReviewCenter-Core-EvidenceSettings-Access
          - ReviewCenter-Core-EvidenceSettings-Change
          - ReviewCenter-Core-EvidenceSettings-Audit
          - ReviewCenter-Core-EvidenceSettings-StartingPoint
          - ReviewCenter-Core-EvidenceSettings-Conflict
          - ReviewCenter-Core-EvidenceSettings-ActorlessRead
          - ReviewCenter-Core-EvidenceSettings-Arguments
          - ReviewCenter-Storage-EvidenceSettings
          - ReviewCenter-Storage-EvidenceSettings-Default
          - ReviewCenter-Storage-EvidenceSettings-CompareAndSet
          - ReviewCenter-Storage-EvidenceSettings-Audit
          - ReviewCenter-Storage-EvidenceSettings-Stale
          - ReviewCenter-Storage-EvidenceSettings-MissingProject
          - ReviewCenter-Web-EvidenceSettings
          - ReviewCenter-Web-EvidenceSettings-NoWarnings
          - ReviewCenter-Web-EvidenceSettings-SaveUnchanged
          - ReviewCenter-Web-EvidenceSettings-SaveUnchangedNothingRecorded
          - ReviewCenter-Web-EvidenceSettings-OtherProject
          - ReviewCenter-Web-EvidenceSettings-Switches
          - ReviewCenter-Web-EvidenceSettings-RegulatoryWarnings
          - ReviewCenter-Web-EvidenceSettings-LeftOutSummary
          - ReviewCenter-Web-EvidenceSettings-ExposureWarning
          - ReviewCenter-Web-EvidenceSettings-Save
          - ReviewCenter-Web-EvidenceSettings-Audit
          - ReviewCenter-Web-EvidenceSettings-Conflict
          - ReviewCenter-Web-EvidenceSettings-Topic

      - id: ReviewCenter-System-Attestation-SettingsRefused
        title: >-
          The tool shall refuse to let any other user read or change the evidence settings of a project.
        tags: [system]
        justification: |
          The settings decide what leaves the project, so a plain member or an outsider must neither change them nor
          learn that the project exists.
        children:
          - ReviewCenter-Core-EvidenceSettings-Access
          - ReviewCenter-Core-EvidenceSettings-MemberRefused
          - ReviewCenter-Core-EvidenceSettings-OtherActors
          - ReviewCenter-Core-EvidenceSettings-RefusalChangesNothing
          - ReviewCenter-Web-EvidenceSettings
          - ReviewCenter-Web-EvidenceSettings-NoWarnings
          - ReviewCenter-Web-EvidenceSettings-SaveUnchanged
          - ReviewCenter-Web-EvidenceSettings-SaveUnchangedNothingRecorded
          - ReviewCenter-Web-EvidenceSettings-OtherProject
          - ReviewCenter-Web-EvidenceSettings-HiddenProject
          - ReviewCenter-Web-EvidenceSettings-RightLost
          - ReviewCenter-Web-EvidenceSettings-RightLostNothingChanged
          - ReviewCenter-Web-EvidenceSettings-RightLostSwitch

      - id: ReviewCenter-System-Attestation-Refused
        title: >-
          The tool shall refuse the attestation for a review that is not approved or that changed since it was
          signed.
        tags: [system]
        justification: |
          An attestation of a review that is not approved, or that no longer matches what was signed, would state
          an approval that does not hold.
        children:
          - ReviewCenter-Evidence-Release-IncompleteRefused
          - ReviewCenter-Web-Attestation
          - ReviewCenter-Web-Attestation-Address
          - ReviewCenter-Web-Attestation-NotConcluded
          - ReviewCenter-Web-Attestation-KeyWarning
          - ReviewCenter-Web-Attestation-NoKeyWarning
        tests:
          - EvidenceSubsystem_ReviewNotComplete_IsNotOfferedAndRefused
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-Attestation-KeyFailure
        title: >-
          The tool shall refuse the attestation, and say why, when the signing key cannot be used.
        tags: [system]
        justification: |
          A key that is unusable or that does not meet the trust rule of the organization must not lead to an
          unsigned or wrongly signed document, and the user must be able to tell the fault from an incomplete review.
        children:
          - ReviewCenter-Evidence-Key-RequireTrusted
          - ReviewCenter-Evidence-Release-KeyUnavailable
          - ReviewCenter-Hosting-AttestationKeyFailure
          - ReviewCenter-Web-Attestation-Unavailable

      - id: ReviewCenter-System-Attestation-Audited
        title: >-
          The tool shall record each release of an attestation in the audit trail, naming an anonymous actor for a
          request without a user.
        tags: [system]
        justification: |
          A copy of the evidence that leaves the tool is an event that an investigation needs to find, also when
          nobody was signed in.
        children:
          - ReviewCenter-Evidence-Release-Audit
          - ReviewCenter-Evidence-ContentSettings-AnonymousActor
        tests:
          - EvidenceSubsystem_CompletedReview_IsOfferedAndDownloadedAsSignedPdf
          - AttestationEndpoint_Get_CompleteReview_ReturnsSignedPdfDownloadAndRecordsEvent

      - id: ReviewCenter-System-Attestation-Honesty
        title: >-
          The tool shall state in the attestation, and in a help topic that the download links to, that the
          signature proves integrity since the signing and the origin of the server key.
        tags: [system]
        justification: |
          A document that is honest about what it proves can be filed and checked elsewhere (21 CFR Part 11
          section 11.10(b)). Integrity and the key origin are what the signature adds.
        children:
          - ReviewCenter-Evidence-Honesty
          - ReviewCenter-Web-Attestation-HelpLink
          - ReviewCenter-Web-Attestation-HelpTopic

      - id: ReviewCenter-System-Attestation-HonestyLimits
        title: >-
          The tool shall state in the attestation, and in the help topic, that the signature does not prove who the
          reviewers are or when the signing happened.
        tags: [system]
        justification: |
          The reviewers are identified by the in-record signatures and the time by the audit trail, not by the
          server signature, and a reader must not take the document as proof of either.
        children:
          - ReviewCenter-Evidence-Honesty-Limits
          - ReviewCenter-Web-Attestation-HelpTopic

      - id: ReviewCenter-System-EvidenceIndex
        title: >-
          The tool shall list the completed reviews of a project that were planned from a review-set in an evidence
          index in the format that ReviewMark reads, naming for each the review-set id, the fingerprint of the files,
          and the result.
        tags: [system]
        justification: |
          The evidence that a review was done must reach the place where the compliance of a release is judged. An
          index in the format that ReviewMark reads lets the release pipeline check that every review-set has a
          signed review of the current fingerprint.
        children:
          - ReviewCenter-Evidence-Index
          - ReviewCenter-Evidence-Index-Fields
          - ReviewCenter-Evidence-Index-Order
          - ReviewCenter-Evidence-Index-Schema
          - ReviewCenter-Evidence-Index-Fingerprint
          - ReviewCenter-Evidence-Index-Semantics
          - ReviewCenter-Api-EvidenceJourney
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-EvidenceIndex-Excluded
        title: >-
          The tool shall leave out of the evidence index a review that is incomplete or changed since it was signed.
        tags: [system]
        justification: |
          Listing only reviews that are complete and current stops a stale approval from satisfying the release
          check.
        children:
          - ReviewCenter-Evidence-Index-Excluded
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-EvidenceIndex-Closed
        title: >-
          The tool shall keep the evidence index and the attestation PDFs of a project closed to a client without
          credentials while the setting of the project that opens them is off, which it is by default.
        tags: [system]
        justification: |
          Opening the evidence to a client without credentials is a decision about confidentiality, so the default
          is closed, and a wrong token or another route does not open anything.
        children:
          - ReviewCenter-Evidence-Visibility-Anonymous
          - ReviewCenter-Evidence-Visibility-AnonymousOff
          - ReviewCenter-Evidence-Visibility-AnonymousIncomplete
          - ReviewCenter-Api-AnonymousEvidence
          - ReviewCenter-Api-AnonymousEvidence-OffRefused
          - ReviewCenter-Api-AnonymousEvidence-WrongToken
          - ReviewCenter-Api-AnonymousEvidence-OpenRoutes
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-EvidenceIndex-OpenedBySetting
        title: >-
          The tool shall serve the evidence index, and the attestation PDFs, of a project to a client without
          credentials when the setting of the project for that kind of document is on.
        tags: [system]
        justification: |
          A project may choose to publish its evidence, for example to a customer, and the choice is limited to the
          two documents and made for each of them.
        children:
          - ReviewCenter-Evidence-Visibility-Anonymous
          - ReviewCenter-Api-EvidenceJourney
          - ReviewCenter-Api-AnonymousEvidence
          - ReviewCenter-Api-AnonymousEvidence-OpenApi
          - ReviewCenter-Api-AnonymousEvidence-Index
          - ReviewCenter-Api-AnonymousEvidence-Pdf

      - id: ReviewCenter-System-EvidenceIndex-OpenedLimited
        title: >-
          The tool shall answer a client without credentials that sends more requests for the evidence index than the
          limit of its address allows with status 429 and a Retry-After header.
        tags: [system]
        justification: |
          An open route can be used to overload the server, so it is rate-limited by address, and a limited client
          is told when to try again.
        children:
          - ReviewCenter-Api-AnonymousEvidence-Limit
          - ReviewCenter-Api-AnonymousEvidence-RetryAfter

      - id: ReviewCenter-System-EvidenceIndex-OpenedAudited
        title: >-
          The tool shall record in the audit trail the release of an attestation PDF to a client without credentials.
        tags: [system]
        justification: |
          A document that leaves the tool without a sign-in is an event that an investigation needs to find.
        children:
          - ReviewCenter-Api-AnonymousEvidence-Audited

      # ----------------------------------------------------------------------------------------------
      # Access and identity: who may act, and who may see
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Login
        title: >-
          The tool shall let a user sign in at /login with the user name and password of a local account that is
          enabled.
        tags: [system]
        justification: |
          Review actions are only trustworthy when they are attributable, which needs a verified identity (21 CFR
          Part 11 section 11.10(d) and (g), authority checks and limiting access to authorized individuals). A
          local account with a password needs no external service.
        children:
          - ReviewCenter-Identity-Login
          - ReviewCenter-Identity-Login-Antiforgery
          - ReviewCenter-Identity-Login-ReturnUrl
          - ReviewCenter-Web-SignIn-SignInLink
          - ReviewCenter-Web-SignIn-LoginPage
          - ReviewCenter-Web-SignIn-RouteAuthorization
          - ReviewCenter-Web-SignIn-AccessDenied
          - ReviewCenter-Web-SignIn-RouteLoginLink
          - ReviewCenter-Web-SignIn-LoginPage-Antiforgery
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-System-Login-Cookie
        title: >-
          The tool shall keep the user signed in with a session cookie for the configured number of hours.
        tags: [system]
        justification: |
          A user must not have to sign in again for every page, and the sign-in must expire so that a forgotten
          browser does not stay signed in forever.
        children:
          - ReviewCenter-Identity-Login-Cookie
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd
          - SignIn_AddSignIn_SessionHoursSetting_SetsTicketLifetime

      - id: ReviewCenter-System-Login-Logout
        title: >-
          The tool shall let the user sign out.
        tags: [system]
        justification: |
          A user on a shared computer must be able to end the session on purpose.
        children:
          - ReviewCenter-Identity-Login-Logout
          - ReviewCenter-Web-SignIn-Logout
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-System-Login-SameMessage
        title: >-
          The tool shall answer every failed sign-in with the same message, so that it does not reveal whether the
          account exists.
        tags: [system]
        justification: |
          One answer for every failure does not help someone who is guessing user names.
        children:
          - ReviewCenter-Identity-Login-SameAnswer
          - ReviewCenter-Web-SignIn-LoginFailure
          - ReviewCenter-Web-SignIn-LoginThrottled
          - ReviewCenter-Web-SignIn-LoginReturnAddress
          - ReviewCenter-Web-SignIn-LoginForeignAddress

      - id: ReviewCenter-System-Login-Throttle
        title: >-
          The tool shall slow down repeated sign-in attempts from one client address with a limit.
        tags: [system]
        justification: |
          A limit per client address makes guessing passwords slow without depending on whether the account exists.
        children:
          - ReviewCenter-Identity-Throttle
          - ReviewCenter-Identity-Throttle-AddressTotal
          - ReviewCenter-Identity-Throttle-NoPasswordCheck
          - ReviewCenter-Identity-Throttle-Settings
          - ReviewCenter-Identity-Throttle-SettingsValidated

      - id: ReviewCenter-System-Login-ThrottleSameMessage
        title: >-
          The tool shall give the same message for every user name when the limit refuses a sign-in attempt.
        tags: [system]
        justification: |
          A different message for a name that exists would let the limit itself reveal which accounts exist.
        children:
          - ReviewCenter-Identity-Throttle-SameAnswer

      - id: ReviewCenter-System-Login-SessionEnds
        title: >-
          The tool shall end the session of a user when the account is disabled, removed, or changed.
        tags: [system]
        justification: |
          Disabling a user or changing the system administrator right must stop the access at the next request, not
          only at the next sign-in.
        children:
          - ReviewCenter-Identity-Session

      - id: ReviewCenter-System-Login-OpenPagesEnd
        title: >-
          The tool shall end every page that is open, within the configured number of seconds, when the account of its
          user is disabled, removed, or changed.
        tags: [system]
        justification: |
          A page that the user already has open must also stop, so open pages re-check the user at a configurable
          interval and refuse every change once the sign-in state has ended.
        children:
          - ReviewCenter-Identity-CircuitSession
          - ReviewCenter-Identity-CircuitSession-Interval
          - ReviewCenter-Identity-CircuitSession-EndSignIn
          - ReviewCenter-Identity-CircuitSession-FailClosed
          - ReviewCenter-Identity-OidcOpenPageChecked
          - ReviewCenter-Web-SessionEnd
          - ReviewCenter-Web-SessionEnd-LoginLink
          - ReviewCenter-Web-SessionEnd-Active
          - ReviewCenter-Web-SessionEnd-ChangeRefused
          - ReviewCenter-Web-SessionEnd-NothingChanged
          - ReviewCenter-Web-SessionEnd-UserAdminRefused
          - ReviewCenter-Web-SessionEnd-UserAdminNothingChanged
        tests:
          - IdentitySubsystem_Revalidation_UserDisabledAfterSignIn_OpenSessionIsNoLongerValid

      - id: ReviewCenter-System-OidcSignIn
        title: >-
          The tool shall, when an administrator turns it on, let a user sign in with an account at an OpenID Connect
          provider beside the local sign-in.
        tags: [system]
        justification: |
          Organizations already manage their people and their passwords at an identity provider. Using it avoids a
          second set of passwords.
        children:
          - ReviewCenter-Identity-OidcSignIn
          - ReviewCenter-Identity-OidcSignIn-LocalSession
          - ReviewCenter-Identity-OidcSignIn-CodeFlow
          - ReviewCenter-Hosting-OidcSignIn
          - ReviewCenter-Web-OidcSignIn
          - ReviewCenter-Web-OidcSignIn-Error
          - ReviewCenter-Web-OidcSignIn-Off
          - ReviewCenter-Web-OidcSignIn-SignatureFailed
          - ReviewCenter-Web-OidcSignIn-SignatureFailedStale
          - ReviewCenter-Web-OidcSignIn-SignatureFailedGeneral
          - ReviewCenter-Web-OidcSignIn-UserList
          - ReviewCenter-Web-OidcSignIn-HelpTopics
        tests:
          - OidcSignIn_FirstSignIn_CreatesPlainAccountAndSignsIn

      - id: ReviewCenter-System-OidcSignIn-NewAccount
        title: >-
          The tool shall create the account of a new person at the first sign-in with a provider, enabled and without
          any right.
        tags: [system]
        justification: |
          The provider says who the person is, not what the person may do, so the administrators of the review tool
          give the rights.
        children:
          - ReviewCenter-Identity-OidcSignIn-NewAccount
          - ReviewCenter-Core-ExternalIdentity-Create
          - ReviewCenter-Core-ExternalIdentity-Enabled
          - ReviewCenter-Core-ExternalIdentity-NoRights
          - ReviewCenter-Core-ExternalIdentity-UserName
          - ReviewCenter-Core-ExternalIdentity-DisplayName
          - ReviewCenter-Core-ExternalIdentity-NameTaken
        tests:
          - OidcSignIn_FirstSignIn_CreatesPlainAccountAndSignsIn

      - id: ReviewCenter-System-OidcSignIn-IssuerSubject
        title: >-
          The tool shall find the account of a person who signed in at a provider again by the issuer and the
          subject only.
        tags: [system]
        justification: |
          The issuer and the subject are the identity that the provider guarantees. A name or an address can be
          changed or reused and must never decide whose account it is.
        children:
          - ReviewCenter-Core-ExternalIdentity
          - ReviewCenter-Core-ExternalIdentity-MissingIdentity
          - ReviewCenter-Core-ExternalIdentity-IssuerLength
          - ReviewCenter-Core-ExternalIdentity-SubjectLength
          - ReviewCenter-Storage-ExternalIdentity
          - ReviewCenter-Storage-ExternalIdentity-ExactPair
          - ReviewCenter-Storage-ExternalIdentity-UniquePair

      - id: ReviewCenter-System-OidcSignIn-NoLink
        title: >-
          The tool shall never link an account of a provider to a local account.
        tags: [system]
        justification: |
          A person at the provider who picks the same name as a local account must not get that account and its
          rights.
        children:
          - ReviewCenter-Identity-OidcSignIn-NoLocalLink
          - ReviewCenter-Core-ExternalIdentity-NoLink
        tests:
          - OidcSignIn_NameOfLocalAccount_NeverLinksToIt

      - id: ReviewCenter-System-OidcSignIn-NoPassword
        title: >-
          The tool shall never give an account of a provider a password.
        tags: [system]
        justification: |
          A password for such an account would be a second way in that the provider does not control.
        children:
          - ReviewCenter-Identity-OidcSignIn-NoPassword
          - ReviewCenter-Core-ExternalIdentity-NoPassword
          - ReviewCenter-Core-ExternalIdentity-NoPasswordSignature
          - ReviewCenter-Core-ExternalIdentity-NoPasswordChange
          - ReviewCenter-Web-OidcSignIn-NoPassword
          - ReviewCenter-Web-OidcSignIn-OwnPage

      - id: ReviewCenter-System-OidcSignIn-Disabled
        title: >-
          The tool shall refuse the sign-in with a provider of an account that is disabled.
        tags: [system]
        justification: |
          Disabling a user in the review tool must hold, whatever the provider says.
        children:
          - ReviewCenter-Identity-OidcSignIn-DisabledRefused
          - ReviewCenter-Core-ExternalIdentity-Disabled

      - id: ReviewCenter-System-OidcSignIn-ReturnAddress
        title: >-
          The tool shall accept the return address of a sign-in with a provider only when it is on this server.
        tags: [system]
        justification: |
          A return address to another site would turn the sign-in into a way to send people to that site.
        children:
          - ReviewCenter-Identity-OidcSignIn-ReturnAddress
        tests:
          - OidcSignIn_ForeignReturnUrl_IsReplacedByHome

      - id: ReviewCenter-System-OidcSignIn-Settings
        title: >-
          The tool shall check the settings of the sign-in with a provider when it starts.
        tags: [system]
        justification: |
          A wrong setting found at the start is an error for the administrator, not a failed sign-in for a user.
        children:
          - ReviewCenter-Identity-OidcSignIn-Settings
          - ReviewCenter-Hosting-OidcSignIn

      - id: ReviewCenter-System-OidcSignIn-FailureAnswer
        title: >-
          The tool shall answer every failed sign-in with a provider, whatever the cause, in the same way.
        tags: [system]
        justification: |
          The answer must not tell an attacker which part of the sign-in went wrong.
        children:
          - ReviewCenter-Identity-OidcSignIn-FailureAnswer

      - id: ReviewCenter-System-OidcSignIn-Throttle
        title: >-
          The tool shall refuse an answer of the provider that arrives from a client address whose quota of the
          sign-in throttle is used up.
        tags: [system]
        justification: |
          The sign-in with a provider must not offer a way around the limit that protects the local sign-in.
        children:
          - ReviewCenter-Identity-OidcSignIn-Throttle

      - id: ReviewCenter-System-OidcSignIn-Audit
        title: >-
          The tool shall record the sign-ins, the account creations, the failed sign-ins, and the refused
          confirmations of identity with a provider in the audit trail.
        tags: [system]
        justification: |
          The history of who got in, and who was refused, is needed for the accounts of a provider as it is for local
          accounts (21 CFR Part 11 section 11.10(e)).
        children:
          - ReviewCenter-Identity-OidcSignIn-Audit
          - ReviewCenter-Core-ExternalIdentity-Audit
          - ReviewCenter-Core-ExternalIdentity-ProofAudit

      - id: ReviewCenter-System-OidcSignIn-Reauth
        title: >-
          The tool shall let a person confirm a signature by signing in again at the provider.
        tags: [system]
        justification: |
          A signature needs a proof of identity at the moment of signing, and for an account of a provider the
          provider is the only place where the proof can be given.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth
          - ReviewCenter-Core-ExternalIdentity-SignProof
          - ReviewCenter-Core-ExternalIdentity-ProofCheck
          - ReviewCenter-Core-ExternalIdentity-ProofReviewer
          - ReviewCenter-Web-OidcSignIn-Signature
        tests:
          - OidcReauth_FreshSignInOfSamePerson_AllowsExactlyOneSignature

      - id: ReviewCenter-System-OidcSignIn-ReauthOnce
        title: >-
          The tool shall accept a confirmation of identity with a provider for exactly one signature.
        tags: [system]
        justification: |
          A confirmation that could be used again would let one sign-in put several signatures in a person's name.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-Once
          - ReviewCenter-Core-ExternalIdentity-SingleUse
          - ReviewCenter-Core-ExternalIdentity-UsedUp
          - ReviewCenter-Core-ExternalIdentity-UsedUpLast
          - ReviewCenter-Core-ExternalIdentity-ProofKept
        tests:
          - OidcReauth_FreshSignInOfSamePerson_AllowsExactlyOneSignature

      - id: ReviewCenter-System-OidcSignIn-ReauthFresh
        title: >-
          The tool shall accept a confirmation of identity with a provider only when the time of sign-in at the
          provider is fresh.
        tags: [system]
        justification: |
          An old sign-in at the provider says nothing about who sits at the screen now.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-Fresh
          - ReviewCenter-Core-ExternalIdentity-ProofClock
          - ReviewCenter-Core-ExternalIdentity-ProofExpiry
        tests:
          - OidcReauth_FreshSignInOfSamePerson_AllowsExactlyOneSignature

      - id: ReviewCenter-System-OidcSignIn-ReauthSamePerson
        title: >-
          The tool shall accept a confirmation of identity with a provider only for the same person as the account
          that signs.
        tags: [system]
        justification: |
          A confirmation by somebody else at the provider must not sign in the name of the account owner.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-SamePerson
          - ReviewCenter-Core-ExternalIdentity-ProofReviewerRefused
          - ReviewCenter-Core-ExternalIdentity-ProofBinding
        tests:
          - OidcReauth_FreshSignInOfSamePerson_AllowsExactlyOneSignature

      - id: ReviewCenter-System-OidcSignIn-ReauthFailsClosed
        title: >-
          The tool shall issue no confirmation of identity with a provider, and so allow no signature, when anything
          about the answer of the provider is missing, unusable, or refused.
        tags: [system]
        justification: |
          A doubt about the proof must end in no signature, never in a signature that was not confirmed.
        children:
          - ReviewCenter-Identity-OidcSignIn-Reauth-FailsClosed
          - ReviewCenter-Core-ExternalIdentity-ProofRequired

      - id: ReviewCenter-System-OidcSignIn-ReauthStore
        title: >-
          The tool shall keep at most 10000 confirmations of identity with a provider and drop an ended one before a
          live one when the store is full.
        tags: [system]
        justification: |
          The store must not grow without limit, and making room must not cost a person a confirmation that is still
          valid.
        children:
          - ReviewCenter-Core-ExternalIdentity-ProofBounded
          - ReviewCenter-Core-ExternalIdentity-ProofBoundedLive

      - id: ReviewCenter-System-TotpSecondFactor
        title: >-
          The tool shall let a user of a local account turn on a second factor, a code of an authenticator app, by
          giving the current password and confirming a new secret with a code from the app.
        tags: [system]
        justification: |
          A password that is guessed, reused, or phished must not be enough to sign in as a person or to put a
          signature in their name (21 CFR Part 11 section 11.300, two distinct identification components). A code
          of a phone that changes every thirty seconds is the cheapest second proof.
        children:
          - ReviewCenter-Core-TotpSecondFactor
          - ReviewCenter-Core-TotpSecondFactor-SetupPending
          - ReviewCenter-Core-TotpSecondFactor-SetupReplace
          - ReviewCenter-Core-TotpSecondFactor-SetupConfirm
          - ReviewCenter-Core-TotpSecondFactor-SetupWindow
          - ReviewCenter-Core-TotpSecondFactor-SetupCancel
          - ReviewCenter-Core-TotpSecondFactor-SetupCancelKeepsOn
          - ReviewCenter-Storage-TotpSecondFactor
          - ReviewCenter-Storage-TotpSecondFactor-ConfirmRace
          - ReviewCenter-Hosting-TotpSecondFactor
          - ReviewCenter-Web-TotpSecondFactor
          - ReviewCenter-Web-TotpSecondFactor-WrongCode
          - ReviewCenter-Web-TotpSecondFactor-WrongCode-SetupOpen
          - ReviewCenter-Web-TotpSecondFactor-WrongCode-NoCodes
          - ReviewCenter-Web-TotpSecondFactor-WrongCode-StaysOn
          - ReviewCenter-Web-TotpSecondFactor-Recovery
          - ReviewCenter-Web-TotpSecondFactor-RecoveryRegenerate
          - ReviewCenter-Web-TotpSecondFactor-FieldsEmptied
          - ReviewCenter-Web-TotpSecondFactor-NoCard
          - ReviewCenter-Web-TotpSecondFactor-External
          - ReviewCenter-Web-TotpSecondFactor-ExpiredNotice
          - ReviewCenter-Web-TotpSecondFactor-WrongPasswordNoNotice
          - ReviewCenter-Web-TotpSecondFactor-SignatureCodeNoField
          - ReviewCenter-Web-TotpSecondFactor-SignatureCodeRefused
          - ReviewCenter-Web-TotpSecondFactor-VisibilityExternal
          - ReviewCenter-Web-TotpSecondFactor-ResetCancelled
          - ReviewCenter-Web-TotpSecondFactor-ResetRefused
          - ReviewCenter-Web-TotpSecondFactor-ResetKept
          - ReviewCenter-Web-TotpSecondFactor-HelpTopic

      - id: ReviewCenter-System-TotpSecondFactor-SetupRefused
        title: >-
          The tool shall refuse to start the setup of a second factor when the current password is wrong or when the
          second factor is already on.
        tags: [system]
        justification: |
          Somebody at an unattended screen must not be able to replace the second factor of the person.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SetupPassword
          - ReviewCenter-Core-TotpSecondFactor-SetupAlreadyOn

      - id: ReviewCenter-System-TotpSecondFactor-SetupConfirmRefused
        title: >-
          The tool shall refuse to confirm a setup of a second factor with a wrong or malformed code, or when no
          setup was started, and keep the second factor off.
        tags: [system]
        justification: |
          A second factor that was never proven to work in the phone of the person would lock the person out.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SetupWrongCode
          - ReviewCenter-Core-TotpSecondFactor-SetupNothingStarted

      - id: ReviewCenter-System-TotpSecondFactor-SetupUnavailable
        title: >-
          The tool shall treat a second factor as not available, with the same message, for an account of an identity
          provider, an account with a temporary password, a request with an API token, and while the feature is
          switched off.
        tags: [system]
        justification: |
          These ways in have their own proofs, and a second factor that cannot be asked for must not be set up.
        children:
          - ReviewCenter-Core-TotpSecondFactor-Availability
          - ReviewCenter-Core-TotpSecondFactor-AvailabilityRefused
          - ReviewCenter-Core-TotpSecondFactor-AvailabilityMessage
          - ReviewCenter-Core-TotpSecondFactor-AvailabilityOperations
          - ReviewCenter-Core-TotpSecondFactor-AvailabilityStatus
          - ReviewCenter-Core-TotpSecondFactor-AvailabilityArguments

      - id: ReviewCenter-System-TotpSecondFactor-SignInCode
        title: >-
          The tool shall ask a person whose account has a second factor for a fresh code after the right password at
          every sign-in.
        tags: [system]
        justification: |
          The password alone is not a proof of identity for such an account (21 CFR Part 11 section 11.300). The code
          is computed by RFC 6238 so that every authenticator app works.
        children:
          - ReviewCenter-Identity-TotpSecondFactor
          - ReviewCenter-Identity-TotpSecondFactor-OpensWithCode
          - ReviewCenter-Identity-TotpSecondFactor-Rfc6238
          - ReviewCenter-Core-TotpSecondFactor-Verify
          - ReviewCenter-Core-TotpSecondFactor-VerifyOutsideWindow
          - ReviewCenter-Core-TotpSecondFactor-VerifyUser
          - ReviewCenter-Core-TotpSecondFactor-VerifyRefusal
          - ReviewCenter-Core-TotpSecondFactor-VerifyUnreadableSecret
          - ReviewCenter-Core-TotpSecondFactor-VerifyLastSignIn
          - ReviewCenter-Core-TotpSecondFactor-SecondFactorRequired
          - ReviewCenter-Core-TotpSecondFactor-SecondFactorDisabled
          - ReviewCenter-Core-TotpSecondFactor-SecondFactorFailsClosed
          - ReviewCenter-Core-TotpSecondFactor-SecondFactorWrongPassword
          - ReviewCenter-Web-TotpSecondFactor-CodePage
          - ReviewCenter-Web-TotpSecondFactor-CodePage-Refused
          - ReviewCenter-Web-TotpSecondFactor-CodePageThrottled
          - ReviewCenter-Web-TotpSecondFactor-CodePage-NoPending
          - ReviewCenter-Web-TotpSecondFactor-CodePage-Antiforgery
        tests:
          - TotpSignIn_CodeStep_RightCode_SignsInAndRedirects

      - id: ReviewCenter-System-TotpSecondFactor-NoCodeNeeded
        title: >-
          The tool shall ask for no code from a user without an active second factor, while the feature is switched
          off, and for a temporary password.
        tags: [system]
        justification: |
          A person who has no second factor, or who must first choose a password, must still be able to get in.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SecondFactorNotRequired
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeNotRequired
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeTemporary

      - id: ReviewCenter-System-TotpSecondFactor-PendingSignIn
        title: >-
          The tool shall hold a person who passed the password step in a short pending sign-in that only the browser
          and client address it was issued to can use, once.
        tags: [system]
        justification: |
          Between the password and the code nobody else may take over the sign-in, and the open sign-ins must not
          pile up.
        children:
          - ReviewCenter-Identity-TotpSecondFactor-PendingSignIn
          - ReviewCenter-Core-TotpSecondFactor-VerifyChallengeInvalid
          - ReviewCenter-Core-TotpSecondFactor-VerifyForeignClientKept
          - ReviewCenter-Core-TotpSecondFactor-VerifyFeatureOff
          - ReviewCenter-Core-TotpSecondFactor-VerifyInvalidated
          - ReviewCenter-Core-TotpSecondFactor-ChallengeSingleUse
          - ReviewCenter-Core-TotpSecondFactor-ChallengeToken
          - ReviewCenter-Core-TotpSecondFactor-ChallengeHash
          - ReviewCenter-Core-TotpSecondFactor-ChallengeUnknown
          - ReviewCenter-Core-TotpSecondFactor-ChallengeRetry
          - ReviewCenter-Core-TotpSecondFactor-ChallengeLimit
          - ReviewCenter-Core-TotpSecondFactor-ChallengeBinding
          - ReviewCenter-Core-TotpSecondFactor-ChallengeNoAddress
          - ReviewCenter-Core-TotpSecondFactor-ChallengeExpiry
          - ReviewCenter-Core-TotpSecondFactor-ChallengeExpiryReturned
          - ReviewCenter-Core-TotpSecondFactor-ChallengeBounded
          - ReviewCenter-Core-TotpSecondFactor-ChallengeEnded
          - ReviewCenter-Core-TotpSecondFactor-ChallengeReturnFull
          - ReviewCenter-Core-TotpSecondFactor-ChallengeInvalidationBound
          - ReviewCenter-Core-TotpSecondFactor-ChallengeInvalidate
          - ReviewCenter-Core-TotpSecondFactor-ChallengeTakenBefore
          - ReviewCenter-Core-TotpSecondFactor-ChallengeTakenAfter
          - ReviewCenter-Core-TotpSecondFactor-ChallengeArguments

      - id: ReviewCenter-System-TotpSecondFactor-Signature
        title: >-
          The tool shall ask a signer whose account has a second factor for a fresh code beside the password at every
          signature.
        tags: [system]
        justification: |
          A signature put on a record needs the same two proofs as the sign-in (21 CFR Part 11 section 11.200(a)).
        children:
          - ReviewCenter-Core-TotpSecondFactor-SignatureCode
          - ReviewCenter-Web-TotpSecondFactor-SignatureCode
        tests:
          - SigningService_SignAsync_EnrolledUserWithPasswordAndFreshCode_Signs

      - id: ReviewCenter-System-TotpSecondFactor-Once
        title: >-
          The tool shall accept each code of the second factor and each recovery code only once, also when several
          requests present it at the same moment.
        tags: [system]
        justification: |
          A code that was seen over a shoulder or in a log must not work a second time.
        children:
          - ReviewCenter-Core-TotpSecondFactor-Replay
          - ReviewCenter-Core-TotpSecondFactor-ReplayConcurrent
          - ReviewCenter-Core-TotpSecondFactor-ReplaySetupCode
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesOnce
          - ReviewCenter-Core-TotpSecondFactor-SignatureReplayRefused
          - ReviewCenter-Storage-TotpSecondFactor-StepRace
          - ReviewCenter-Storage-TotpSecondFactor-RecoveryRace
        tests:
          - TotpService_CompleteSignInAsync_ConcurrentSameCode_ExactlyOneSucceeds

      - id: ReviewCenter-System-TotpSecondFactor-RecoveryCodes
        title: >-
          The tool shall give ten recovery codes when the second factor is turned on, each of which gets the person
          back in at the second step of a sign-in in place of a code of the app.
        tags: [system]
        justification: |
          A person who lost the phone must still be able to get in, and the codes are kept as hashes so that a copy of
          the database does not give them away.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SetupRecoveryCodes
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodes
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesStrength
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesHashed
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesSignIn
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesSpelling
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesOtherUser
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesUnreadableSecret

      - id: ReviewCenter-System-TotpSecondFactor-RecoveryNoSignature
        title: >-
          The tool shall refuse a recovery code as the code of a signature.
        tags: [system]
        justification: |
          A recovery code is a way back in, not a proof for a signature, which needs the code of the app that the
          person holds now.
        children:
          - ReviewCenter-Core-TotpSecondFactor-SignatureRecoveryRefused

      - id: ReviewCenter-System-TotpSecondFactor-RecoveryReplace
        title: >-
          The tool shall replace all recovery codes by ten new codes when the user gives the current password and a
          right code from the app, and refuse the old codes from then on.
        tags: [system]
        justification: |
          A person who used up or lost the codes needs a way to get a fresh set, and a set that was seen must stop
          working.
        children:
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplace
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplaceStopsOld

      - id: ReviewCenter-System-TotpSecondFactor-RecoveryReplaceRefused
        title: >-
          The tool shall refuse new recovery codes when the password is wrong, when the code from the app is wrong, or
          when a recovery code is given in place of it, and keep the old codes.
        tags: [system]
        justification: |
          Somebody who holds only a stolen password or an old recovery code must not be able to take the second
          factor over.
        children:
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplaceNeedsAppCode
          - ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplaceRefused

      - id: ReviewCenter-System-TotpSecondFactor-Lockout
        title: >-
          The tool shall count the wrong codes of the second factor toward the lockout of wrong passwords, and refuse
          even a right code while the account is locked out.
        tags: [system]
        justification: |
          A code of six digits can be guessed, so the guesses must be limited by the same lockout as the guesses of
          the password.
        children:
          - ReviewCenter-Identity-TotpSecondFactor-WrongCodes
          - ReviewCenter-Core-TotpSecondFactor-Lockout
          - ReviewCenter-Core-TotpSecondFactor-LockoutLocked
          - ReviewCenter-Core-TotpSecondFactor-LockoutOperations
          - ReviewCenter-Core-TotpSecondFactor-LockoutShared
          - ReviewCenter-Core-TotpSecondFactor-SharedLockout
          - ReviewCenter-Core-TotpSecondFactor-SharedLockoutIsLocked
          - ReviewCenter-Core-TotpSecondFactor-SharedLockoutConfirmLocked
          - ReviewCenter-Core-TotpSecondFactor-SignatureLockoutCount
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeCounted
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeLockout

      - id: ReviewCenter-System-TotpSecondFactor-LockoutCleared
        title: >-
          The tool shall clear the count of failures only when the whole proof, the password and the code, succeeded.
        tags: [system]
        justification: |
          A right password must not reset the count while somebody guesses the code.
        children:
          - ReviewCenter-Core-TotpSecondFactor-LockoutCleared
          - ReviewCenter-Core-TotpSecondFactor-LockoutPasswordAlone
          - ReviewCenter-Core-TotpSecondFactor-SecondFactorKeepsCounter
          - ReviewCenter-Core-TotpSecondFactor-SharedLockoutConfirmPassword
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeClearedAfterProof
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangePasswordOnly

      - id: ReviewCenter-System-TotpSecondFactor-TurnOff
        title: >-
          The tool shall let the user turn the second factor off by giving the current password and a right code or an
          unused recovery code, and delete the secret and the recovery codes with it.
        tags: [system]
        justification: |
          A person who changes the phone, or no longer wants the second factor, must be able to remove it, and no
          trace of the secret may stay.
        children:
          - ReviewCenter-Core-TotpSecondFactor-Disable
          - ReviewCenter-Core-TotpSecondFactor-DisableRecoveryCode
          - ReviewCenter-Core-TotpSecondFactor-DisableRecoveryCodesDeleted
          - ReviewCenter-Core-TotpSecondFactor-DisablePendingSignIns
          - ReviewCenter-Storage-TotpSecondFactor-Remove
          - ReviewCenter-Storage-TotpSecondFactor-UserDeleted
          - ReviewCenter-Web-TotpSecondFactor-TurnOff

      - id: ReviewCenter-System-TotpSecondFactor-TurnOffRefused
        title: >-
          The tool shall refuse to turn the second factor off when the password is wrong, when the code is wrong, or
          when the user has none, and keep the second factor.
        tags: [system]
        justification: |
          Somebody at an unattended screen must not be able to remove the second factor of the person.
        children:
          - ReviewCenter-Core-TotpSecondFactor-DisableRefused
          - ReviewCenter-Core-TotpSecondFactor-DisableNotEnrolled

      - id: ReviewCenter-System-TotpSecondFactor-AdminReset
        title: >-
          The tool shall let an enabled system administrator reset the second factor of a person who lost the phone.
        tags: [system]
        justification: |
          A person who lost both the phone and the recovery codes would otherwise be locked out for good.
        children:
          - ReviewCenter-Core-TotpSecondFactor-AdminReset
          - ReviewCenter-Core-TotpSecondFactor-AdminResetPendingSignIns
          - ReviewCenter-Web-TotpSecondFactor-Reset

      - id: ReviewCenter-System-TotpSecondFactor-AdminResetRefused
        title: >-
          The tool shall refuse the reset of a second factor when the caller is not an enabled system administrator,
          acts through an API token, or names a user who has none, and keep the second factor.
        tags: [system]
        justification: |
          The reset is the weakest point of the second factor, so only an administrator who is signed in may use it.
        children:
          - ReviewCenter-Core-TotpSecondFactor-AdminResetRefused
          - ReviewCenter-Core-TotpSecondFactor-AdminResetTarget

      - id: ReviewCenter-System-TotpSecondFactor-Visibility
        title: >-
          The tool shall show system administrators which users have a second factor.
        tags: [system]
        justification: |
          An administrator needs to know whether a reset is possible before the person asks for it.
        children:
          - ReviewCenter-Core-TotpSecondFactor-AdminResetList
          - ReviewCenter-Web-TotpSecondFactor-Visibility

      - id: ReviewCenter-System-TotpSecondFactor-PasswordChange
        title: >-
          The tool shall ask a user whose second factor is on for a right code from the app or an unused recovery
          code, besides the current password, when the user changes the own password.
        tags: [system]
        justification: |
          A change of the password is as strong a step as a sign-in, so it needs the same two proofs.
        children:
          - ReviewCenter-Core-TotpSecondFactor-PasswordChange
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeRecoveryCode
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeUnreadable
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeConcurrent

      - id: ReviewCenter-System-TotpSecondFactor-PasswordChangeRefused
        title: >-
          The tool shall refuse the change of the password of a user whose second factor is on when the code is
          missing, wrong, or used before, when the current password is wrong, or when the request comes with an API
          token.
        tags: [system]
        justification: |
          Somebody who holds only the password or a token must not be able to change the password and so take the
          account over.
        children:
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeNoCode
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeWrongPassword
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeReused
          - ReviewCenter-Core-TotpSecondFactor-PasswordChangeApiToken

      - id: ReviewCenter-System-TotpSecondFactor-Audit
        title: >-
          The tool shall record each change of a second factor in the audit trail: the setup, the removal by the
          owner, the reset by an administrator, a new set of recovery codes, the use of a recovery code, and a wrong
          code.
        tags: [system]
        justification: |
          The history of who turned the proof of a person on, off, or around is needed to find a misuse (21 CFR Part 11
          section 11.10(e)).
        children:
          - ReviewCenter-Core-TotpSecondFactor-Audit
          - ReviewCenter-Core-TotpSecondFactor-AuditRemoved
          - ReviewCenter-Core-TotpSecondFactor-AuditReset
          - ReviewCenter-Core-TotpSecondFactor-AuditRecoveryRegenerated
          - ReviewCenter-Core-TotpSecondFactor-AuditRecoveryUsed
          - ReviewCenter-Core-TotpSecondFactor-AuditWrongCode
          - ReviewCenter-Storage-TotpSecondFactor-Audit

      - id: ReviewCenter-System-TotpSecondFactor-SecretEncrypted
        title: >-
          The tool shall keep the secret of a second factor encrypted and bound to its user.
        tags: [system]
        justification: |
          A copy of the database must not be enough to compute the codes of a person.
        children:
          - ReviewCenter-Identity-TotpSecondFactor-SecretEncrypted
          - ReviewCenter-Identity-TotpSecondFactor-SecretBound

      - id: ReviewCenter-System-TotpSecondFactor-NoSecretLeak
        title: >-
          The tool shall keep the secret, the codes, the recovery codes, and the challenge of a second factor out of
          the audit trail, the logs, and the error messages, and show the secret and the recovery codes only once.
        tags: [system]
        justification: |
          Whatever is written down in a log must not be of any use to somebody who reads it.
        children:
          - ReviewCenter-Identity-TotpSecondFactor-NoSecretLeak
          - ReviewCenter-Core-TotpSecondFactor-NoSecretLeak
          - ReviewCenter-Core-TotpSecondFactor-NoSecretLeakErrors
          - ReviewCenter-Core-TotpSecondFactor-NoSecretLeakShownOnce

      - id: ReviewCenter-System-TotpSecondFactor-OtherSignIns
        title: >-
          The tool shall leave the sign-in with a provider and the API tokens as they were, without a second factor.
        tags: [system]
        justification: |
          The provider and the token have proofs of their own, and a second factor on top would only lock them out.
        children:
          - ReviewCenter-Identity-TotpSecondFactor-OtherSignIns

      - id: ReviewCenter-System-NotificationsOffByDefault
        title: >-
          While e-mail notifications are not enabled in the configuration, the tool shall offer a user no notification
          settings.
        tags: [system]
        justification: |
          The default installation must work without a mail server, and a page must never offer a setting that has no
          effect. E-mail notifications are enabled when the Enabled setting of the Notifications section is true and
          not enabled otherwise; this is the only term used for that state.
        children:
          - ReviewCenter-Messaging-Off
          - ReviewCenter-Messaging-OffRefusesSend
          - ReviewCenter-Messaging-OffSettings
          - ReviewCenter-Hosting-NotificationSettings
          - ReviewCenter-Hosting-NotificationTables
          - ReviewCenter-Hosting-NotificationNotEnabledSkipsChecks
          - ReviewCenter-Web-NotificationCard
          - ReviewCenter-Web-NotificationUnavailable
          - ReviewCenter-Web-NotificationCodeSent
          - ReviewCenter-Web-NotificationPendingAddress
          - ReviewCenter-Web-NotificationCodeField
          - ReviewCenter-Web-NotificationSentNotice
          - ReviewCenter-Web-NotificationInvalidAddress
          - ReviewCenter-Web-NotificationInvalidAddressNoMail
          - ReviewCenter-Web-NotificationRightCode
          - ReviewCenter-Web-NotificationRightCodeNotice
          - ReviewCenter-Web-NotificationRightCodeClosesForm
          - ReviewCenter-Web-NotificationWrongCode
          - ReviewCenter-Web-NotificationWrongCodeKeepsForm
          - ReviewCenter-Web-NotificationWrongCodeEmptiesField
          - ReviewCenter-Web-NotificationWrongCodeNotConfirmed
          - ReviewCenter-Web-NotificationResend
          - ReviewCenter-Web-NotificationResendAfterCooldown
          - ReviewCenter-Web-NotificationResendCooldown
          - ReviewCenter-Web-NotificationResendCooldownNoMail
          - ReviewCenter-Web-NotificationRemove
          - ReviewCenter-Web-NotificationRemove-Form
          - ReviewCenter-Web-NotificationRemove-Notice
          - ReviewCenter-Web-NotificationRemove-HidesAddress
          - ReviewCenter-Web-NotificationTemporaryPassword
          - ReviewCenter-Web-NotificationExternalUser
          - ReviewCenter-Web-NotificationModeHiddenNotAvailable
        tests:
          - AccountPage_Render_NotificationsNotSetUp_ShowsOneSentenceAndTouchesNoStore
          - MessagingSubsystem_NotificationsOff_SenderIsNotConfiguredAndSendFails

      - id: ReviewCenter-System-NotificationAddressConfirmation
        title: >-
          The tool shall treat the e-mail address of a user as confirmed only after the user has typed the code that
          was mailed to that address.
        tags: [system]
        justification: |
          A mail must reach only the person who owns the address, so a typed address alone must never be enough to
          receive mail.
        children:
          - ReviewCenter-Core-NotificationConfirmation
          - ReviewCenter-Storage-NotificationConfirmOneWinner
        tests:
          - NotificationPreferenceService_Confirm_RightCode_ConfirmsAddress
          - AccountPage_Confirm_RightCode_ShowsConfirmedAddress

      - id: ReviewCenter-System-NotificationAddressValid
        title: >-
          The tool shall accept a text as the e-mail address for notifications only when the text is exactly one
          syntactically valid address.
        tags: [system]
        justification: |
          The address is typed by a person and ends up in the header of a mail that the server sends, so a list or a
          display name must not aim the mail at someone else.
        children:
          - ReviewCenter-Core-NotificationAddress
        tests:
          - NotificationAddress_TryNormalize_PlainAddress_Succeeds

      - id: ReviewCenter-System-NotificationAddressKept
        title: >-
          The tool shall keep the e-mail address of a user for notifications until the user removes it.
        tags: [system]
        justification: |
          The address decides where the server sends mail, so it survives a restart and goes away only when the user
          removes it.
        children:
          - ReviewCenter-Storage-NotificationPreferences
        tests:
          - NotificationStore_RemoveAsync_DeletesRowWithAuditOnce

      - id: ReviewCenter-System-NotificationLimits
        title: >-
          The tool shall refuse a request for a confirmation mail when a limit on the number of such mails is reached.
        tags: [system]
        justification: |
          The confirmation mail goes to an address that a user types, so without a limit the feature could be used to
          flood a third person or the mail server.
        children:
          - ReviewCenter-Core-NotificationLimits
          - ReviewCenter-Storage-NotificationLimits
          - ReviewCenter-Storage-NotificationReserveOneWinner
          - ReviewCenter-Storage-NotificationAttemptLimit
          - ReviewCenter-Storage-NotificationLogRetention
        tests:
          - NotificationPreferenceService_RequestConfirmation_UserDailyLimit_ThrowsLimitReached
          - NotificationStore_ReserveConfirmationAsync_Concurrent_HasExactlyOneWinner

      - id: ReviewCenter-System-NotificationAccess
        title: >-
          The tool shall let only a person who is signed in through a session manage the notification settings of the
          account.
        tags: [system]
        justification: |
          A script with an API token must never be able to turn on mail or read an address, and no other person may
          change the settings of an account.
        children:
          - ReviewCenter-Core-NotificationAccess
          - ReviewCenter-Web-NotificationCard
          - ReviewCenter-Web-NotificationUnavailable
          - ReviewCenter-Web-NotificationCodeSent
          - ReviewCenter-Web-NotificationPendingAddress
          - ReviewCenter-Web-NotificationCodeField
          - ReviewCenter-Web-NotificationSentNotice
          - ReviewCenter-Web-NotificationInvalidAddress
          - ReviewCenter-Web-NotificationInvalidAddressNoMail
          - ReviewCenter-Web-NotificationRightCode
          - ReviewCenter-Web-NotificationRightCodeNotice
          - ReviewCenter-Web-NotificationRightCodeClosesForm
          - ReviewCenter-Web-NotificationWrongCode
          - ReviewCenter-Web-NotificationWrongCodeKeepsForm
          - ReviewCenter-Web-NotificationWrongCodeEmptiesField
          - ReviewCenter-Web-NotificationWrongCodeNotConfirmed
          - ReviewCenter-Web-NotificationResend
          - ReviewCenter-Web-NotificationResendAfterCooldown
          - ReviewCenter-Web-NotificationResendCooldown
          - ReviewCenter-Web-NotificationResendCooldownNoMail
          - ReviewCenter-Web-NotificationRemove
          - ReviewCenter-Web-NotificationRemove-Form
          - ReviewCenter-Web-NotificationRemove-Notice
          - ReviewCenter-Web-NotificationRemove-HidesAddress
          - ReviewCenter-Web-NotificationTemporaryPassword
          - ReviewCenter-Web-NotificationExternalUser
        tests:
          - NotificationPreferenceService_Actions_ApiTokenActor_AreRefused
          - AccountPage_Render_TemporaryPassword_HidesNotificationsCard

      - id: ReviewCenter-System-NotificationAudit
        title: >-
          The tool shall record each change of the notification settings of an account in the audit trail.
        tags: [system]
        justification: |
          A change of the address that receives mail is a change of an account that an administrator may have to trace
          (21 CFR Part 11 section 11.10(e), audit trail).
        children:
          - ReviewCenter-Core-NotificationAudit
          - ReviewCenter-Core-NotificationAuditNoAddress
          - ReviewCenter-Core-NotificationAuditNoCode
          - ReviewCenter-Storage-NotificationAudit
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-System-NotificationMessageSafety
        title: >-
          The tool shall refuse to build a mail message whose recipient could add a header line to the message.
        tags: [system, security]
        justification: |
          A line break in a value that a person typed must never let that person add a recipient or a header to a mail
          that the server sends.
        children:
          - ReviewCenter-Core-NotificationMessage
        tests:
          - NotificationMessage_Constructor_InvalidRecipient_ThrowsWithoutEchoingTheValue

      - id: ReviewCenter-System-NotificationSubjectSafety
        title: >-
          The tool shall refuse to build a mail message whose subject could add a header line to the message.
        tags: [system, security]
        justification: |
          A line break in a value that a person typed must never let that person add a recipient or a header to a mail
          that the server sends.
        children:
          - ReviewCenter-Core-NotificationMessage
        tests:
          - NotificationMessage_Constructor_ControlCharacterInSubject_ThrowsWithoutEchoingTheValue

      - id: ReviewCenter-System-NotificationSmtpDelivery
        title: >-
          When the SMTP transport is selected in the settings, the tool shall deliver a notification message through
          the SMTP server of the settings.
        tags: [system]
        justification: |
          Production installations send mail through the mail server of the organization.
        children:
          - ReviewCenter-Messaging-SmtpTransport
          - ReviewCenter-Messaging-SmtpDelivery
          - ReviewCenter-Messaging-SmtpTls
        tests:
          - SmtpNotificationSender_Send_DeliversMessageToServer
          - MessagingSubsystem_SmtpTransport_SettingsChooseSmtpSender

      - id: ReviewCenter-System-NotificationFileDelivery
        title: >-
          When the file transport is selected in the settings, the tool shall deliver a notification message as a file
          in the folder named in the settings.
        tags: [system]
        justification: |
          Demonstrations, development, and automatic tests need mail without a mail server.
        children:
          - ReviewCenter-Messaging-FileTransport
          - ReviewCenter-Messaging-FileEnabled
          - ReviewCenter-Messaging-FileConfigured
        tests:
          - FileNotificationSender_Send_WritesParseableEmlFile
          - MessagingSubsystem_FileTransport_SettingsChooseFileSenderThatDeliversMessage

      - id: ReviewCenter-System-NotificationSettingsSection
        title: >-
          The tool shall let an operator configure e-mail notifications in the Notifications section of the
          configuration.
        tags: [system]
        justification: |
          A mail server, a sender, and the limits differ for every installation, so they must be configurable in the
          place where the operator configures the rest of the server.
        children:
          - ReviewCenter-Messaging-SettingsDefaults
          - ReviewCenter-Messaging-PasswordFile
          - ReviewCenter-Messaging-Warnings
          - ReviewCenter-Messaging-WarningClearRemote
          - ReviewCenter-Messaging-WarningNoPassword
          - ReviewCenter-Messaging-WarningNoneForGoodSettings
          - ReviewCenter-Messaging-WarningNoneWhenNotEnabled
          - ReviewCenter-Messaging-LoopbackBaseUrl
          - ReviewCenter-Messaging-LoopbackCredentials
          - ReviewCenter-Messaging-WorkerUsesSettings
          - ReviewCenter-Messaging-WorkerUsesSettings-BatchWindow
          - ReviewCenter-Messaging-WorkerUsesSettings-DigestSchedule
          - ReviewCenter-Messaging-WorkerUsesSettings-IncludeTitles
        tests:
          - NotificationOptions_Bind_ReadsAllSections
          - NotificationOptions_Defaults_AreOffAndDocumented

      - id: ReviewCenter-System-NotificationSendFailure
        title: >-
          When a notification message cannot be delivered, the tool shall report a send error.
        tags: [system]
        justification: |
          A message that was not delivered must never be mistaken for a delivered one.
        children:
          - ReviewCenter-Messaging-SendFailure
          - ReviewCenter-Messaging-Cancellation
          - ReviewCenter-Messaging-NullMessage
        tests:
          - SmtpNotificationSender_Send_WrongPassword_ThrowsWithoutSecret
          - FileNotificationSender_Send_FolderIsAFile_ThrowsWithoutPath

      - id: ReviewCenter-System-NotificationErrorNoPassword
        title: >-
          The tool shall not put the SMTP password into the message of a send error.
        tags: [system, security]
        justification: |
          An error message reaches logs and pages, so it must not leak a secret.
        children:
          - ReviewCenter-Messaging-SendErrorNoPassword
        tests:
          - SmtpNotificationSender_Send_WrongPassword_ThrowsWithoutSecret

      - id: ReviewCenter-System-NotificationErrorNoAddress
        title: >-
          The tool shall not put the address of the recipient into the message of a send error.
        tags: [system, security]
        justification: |
          An address is personal data that must not spread into logs and pages.
        children:
          - ReviewCenter-Messaging-SendErrorNoAddress
        tests:
          - SmtpNotificationSender_Send_RecipientRefused_ThrowsWithoutAddress

      - id: ReviewCenter-System-NotificationErrorNoServerText
        title: >-
          The tool shall not put text that the mail server sent into the message of a send error.
        tags: [system, security]
        justification: |
          The text of a server is outside the control of the product and may repeat an address or a secret.
        children:
          - ReviewCenter-Messaging-SendErrorNoServerText
        tests:
          - SmtpNotificationSender_Send_RecipientRefused_ThrowsWithoutAddress

      - id: ReviewCenter-System-NotificationErrorNoPath
        title: >-
          The tool shall not put the path of the folder of the file transport into the message of a send error.
        tags: [system, security]
        justification: |
          The path of a folder shows the layout of the server and must not reach a page.
        children:
          - ReviewCenter-Messaging-SendErrorNoPath
        tests:
          - FileNotificationSender_Send_FolderIsAFile_ThrowsWithoutPath

      - id: ReviewCenter-System-NotificationSettingsRejected
        title: >-
          While e-mail notifications are enabled, the tool shall refuse to start the server when the notification
          settings are not valid.
        tags: [system]
        justification: |
          A wrong mail configuration must show at the start of the server and not at the first mail that fails.
        children:
          - ReviewCenter-Messaging-InvalidSettings
          - ReviewCenter-Messaging-InvalidSettingsNamed
          - ReviewCenter-Hosting-NotificationSenderNoneRefused
        tests:
          - ServerHost_CreateApplication_InvalidNotificationSettings_ThrowsClearErrorWithoutSecret
          - MessagingSubsystem_InvalidSettings_AreRefusedNamingTheSetting

      - id: ReviewCenter-System-NotificationConfigCheck
        title: >-
          When the check-config flag is provided, the tool shall report whether the notification settings are valid.
        tags: [system]
        justification: |
          An operator must be able to test the mail configuration before the start of the server.
        children:
          - ReviewCenter-SelfTest-ConfiguredNotifications
        tests:
          - ValidationChecks_ConfiguredNotifications_SmtpSettings_ReportsWithoutSecret
          - ValidationChecks_ConfiguredNotifications_MissingHost_FailsAndNamesSetting

      - id: ReviewCenter-System-NotificationConfigCheckNoNetwork
        title: >-
          When the check-config flag is provided, the tool shall open no network connection while it checks the
          notification settings.
        tags: [system]
        justification: |
          The test of the mail configuration must not send mail or depend on the network.
        children:
          - ReviewCenter-SelfTest-ConfiguredNotificationsNoNetwork
        tests:
          - ValidationChecks_ConfiguredNotifications_SmtpSettings_ReportsWithoutSecret

      - id: ReviewCenter-System-NotificationSelfCheck
        title: >-
          The tool shall prove in the self-validation run that a notification mail holds no ballot content.
        tags: [system]
        justification: |
          An operator must see in the self-validation that a mail holds no ballot content, without a database, a mail
          server or a network.
        children:
          - ReviewCenter-SelfTest-NotificationMail
        tests:
          - ValidationChecks_NotificationMail_Run_ComposesMaskedMailAndWritesEmlFile

      - id: ReviewCenter-System-NotificationModeDefaultNone
        title: >-
          While a user has not chosen a notification mode, or has chosen the mode None, the tool shall send that user
          no notification mail.
        tags: [system]
        justification: |
          Notification mail is off by default and the user must opt in, so a user who has not chosen must never be
          mailed, and a user who has no confirmed address can not be mailed at all.
        children:
          - ReviewCenter-Core-NotificationMode
          - ReviewCenter-Core-NotificationMode-DefaultNone
          - ReviewCenter-Core-NotificationMode-RemoveResets
          - ReviewCenter-Core-NotificationDispatch
          - ReviewCenter-Storage-NotificationMode
          - ReviewCenter-Storage-NotificationMode-DefaultNone
          - ReviewCenter-Storage-NotificationRecipients
        tests:
          - NotificationPreferenceService_GetStatus_NoRow_ModeNone
          - NotificationStore_ListRecipients_Mixed_OnlyEligible
          - CoreSubsystem_Dispatcher_MailsNewItemsOfOwnInboxOnce

      - id: ReviewCenter-System-NotificationModes
        title: >-
          The tool shall let a signed-in user who has a confirmed address choose on the Account page between no
          e-mail, a daily summary, and an e-mail for every change.
        tags: [system]
        justification: |
          People work in different ways: some want to be told soon after a change, and others once a day. The choice
          is made where the address is managed.
        children:
          - ReviewCenter-Web-NotificationMode
          - ReviewCenter-Web-NotificationModeNeedsAddress
          - ReviewCenter-Web-NotificationModeNeedsAddress-NoSaveButton
          - ReviewCenter-Web-NotificationModeNeedsAddress-Explained
          - ReviewCenter-Web-NotificationModeNeedsAddress-RemovedNone
          - ReviewCenter-Web-NotificationModeSave
          - ReviewCenter-Web-NotificationModeSavedNotice
          - ReviewCenter-Web-NotificationModeSavedNoError
          - ReviewCenter-Web-NotificationModeRefused
          - ReviewCenter-Web-NotificationModeRefusedNoSavedNotice
        tests:
          - AccountPage_Render_ModeSelector_OffersThreeModes
          - WebSubsystem_AccountPage_ChoosesNotificationMode

      - id: ReviewCenter-System-NotificationModeAudit
        title: >-
          The tool shall record a change of the notification mode of a user as an audit entry that holds no e-mail
          address.
        tags: [system]
        justification: |
          A change of when mail goes out belongs in the audit trail (21 CFR Part 11 section 11.10(e)), which is kept
          long and read by many and so holds no personal data.
        children:
          - ReviewCenter-Core-NotificationModeAudit
          - ReviewCenter-Core-NotificationModeAudit-NoAddress
          - ReviewCenter-Core-NotificationModeAudit-Unchanged
          - ReviewCenter-Storage-NotificationModeAudit
        tests:
          - CoreSubsystem_NotificationMode_ConfirmedUserChoosesAndIsAudited
          - NotificationStore_SetMode_AuditFailure_ModeUnchanged

      - id: ReviewCenter-System-NotificationNoApiToken
        title: >-
          The tool shall refuse a change of the notification mode by an actor that signed in with an API token.
        tags: [system]
        justification: |
          Only the interactive session of a person may decide where and when the mail of that person goes, so an
          automation must not be able to turn mail on or redirect it.
        children:
          - ReviewCenter-Core-NotificationModeRefusals-ApiToken
        tests:
          - NotificationPreferenceService_SetMode_ApiTokenActor_Throws

      - id: ReviewCenter-System-NotificationModeNeedsEligibleUser
        title: >-
          The tool shall refuse a change of the notification mode for a user who is not eligible for notification mail.
        tags: [system]
        justification: |
          Mail may go only to an address that its owner has proven. A user is eligible when the account is enabled, is
          taken over by its person, and has a confirmed address, and while notifications are available.
        children:
          - ReviewCenter-Core-NotificationModeRefusals
          - ReviewCenter-Core-NotificationModeRefusals-NotAvailable
          - ReviewCenter-Core-NotificationModeRefusals-DisabledUser
          - ReviewCenter-Core-NotificationModeRefusals-TemporaryPassword
          - ReviewCenter-Core-NotificationModeRefusals-UnknownValue
        tests:
          - NotificationPreferenceService_SetMode_NoConfirmedAddress_Throws
          - NotificationPreferenceService_SetMode_DisabledUser_Throws
          - NotificationPreferenceService_SetMode_MustChangePassword_Throws

      - id: ReviewCenter-System-NotificationNoBacklogOnEnable
        title: >-
          When a user switches a notification mode on, the tool shall send no mail for the items that exist at that
          time.
        tags: [system]
        justification: |
          A user who opts in must not be flooded by a mail for the whole backlog, so only news that arrives later is
          mailed.
        children:
          - ReviewCenter-Core-NotificationBaseline
          - ReviewCenter-Core-NotificationModeBaseline
        tests:
          - NotificationDispatcher_RunPass_BaselinePending_RecordsBacklogNoMail
          - NotificationPreferenceService_SetMode_NoneToEvery_BaselinePending

      - id: ReviewCenter-System-NotificationNoContent
        title: >-
          The tool shall keep the content of reviews out of a notification mail.
        tags: [system, security]
        justification: |
          A mail leaves the server and may be read by others, and reviews of regulated projects can be confidential, so
          a mail says that there is news and not what the news is. The content that stays out is the detail text of the
          inbox, the comments, the answers, the verdicts, and the outcomes.
        children:
          - ReviewCenter-Core-NotificationComposition
          - ReviewCenter-Core-NotificationComposition-NoOutcome
          - ReviewCenter-Core-NotificationMailContent
        tests:
          - CoreSubsystem_NotificationMail_HasNoInboxDetailOrOutcome

      - id: ReviewCenter-System-NotificationNoContent-AccountPage
        title: >-
          The tool shall tell the user on the Account page what a notification mail never contains.
        tags: [system, security]
        justification: |
          A person turns mail on only when they know what will be sent.
        children:
          - ReviewCenter-Web-NotificationExplainsMail-NotMailed
        tests:
          - AccountPage_Render_Card_ExplainsWhatIsNotMailed

      - id: ReviewCenter-System-NotificationExplainsMail
        title: >-
          The tool shall tell the user on the Account page what a notification mail contains.
        tags: [system]
        justification: |
          A person turns mail on only when they know what will be sent.
        children:
          - ReviewCenter-Web-NotificationExplainsMail
        tests:
          - AccountPage_Render_Card_ExplainsWhatIsMailed

      - id: ReviewCenter-System-NotificationExplainsModes
        title: >-
          The tool shall tell the user on the Account page what each notification mode does.
        tags: [system]
        justification: |
          A person chooses a mode only when they know what it does.
        children:
          - ReviewCenter-Web-NotificationExplainsMail-Modes
        tests:
          - AccountPage_Render_Card_ExplainsModes

      - id: ReviewCenter-System-NotificationHelpTopic
        title: >-
          The tool shall explain e-mail notifications in a help topic.
        tags: [system]
        justification: |
          A person who reads about the mail before turning it on needs a page that tells in plain words what is sent
          and what is never sent, without a visit to the administrator.
        children:
          - ReviewCenter-Web-NotificationHelpTopic
        tests:
          - HelpNotificationsPage_Render_ExplainsWhatIsMailedAndWhatIsNever

      - id: ReviewCenter-System-NotificationHelpLink
        title: >-
          The tool shall link the notification card of the Account page to the help topic.
        tags: [system]
        justification: |
          A person who reads the card must reach the full explanation in one step.
        children:
          - ReviewCenter-Web-NotificationHelpLink
        tests:
          - AccountPage_Render_NotificationCard_LinksToEmailNotificationsTopic

      - id: ReviewCenter-System-NotificationBrowserConfirmation
        title: >-
          When the file transport is selected, the tool shall confirm an address on the Account page with the code
          from the mailed message.
        tags: [system]
        justification: |
          The confirmation of an address is the first step of the opt-in and must work in a real browser against the
          real server, with the mail read from the folder of the file transport.
        tests:
          - ReviewCenter_Notifications_FileSender_ConfirmByMailedCodeAndChooseMode_ShowsConfirmedStates

      - id: ReviewCenter-System-NotificationBrowserMode
        title: >-
          When the file transport is selected, the tool shall show the saved mode on the Account page after the user
          saves it.
        tags: [system]
        justification: |
          The choice of the mode must survive a reload of the page in a real browser.
        tests:
          - ReviewCenter_Notifications_FileSender_ConfirmByMailedCodeAndChooseMode_ShowsConfirmedStates

      - id: ReviewCenter-System-NotificationOwnInboxOnly
        title: >-
          The tool shall base a notification mail for a user only on what that user may see in the own inbox, so that
          the answers of others stay hidden until the own ballot is handed in.
        tags: [system, security]
        justification: |
          A mail must not tell more than the page of the inbox tells to the same person, so the independence of the
          review is kept.
        children:
          - ReviewCenter-Core-NotificationOwnInbox
          - ReviewCenter-Core-NotificationCandidates
        tests:
          - NotificationDispatcher_RunPass_HiddenBallotRecipient_NoDisputedItem
          - NotificationDispatcher_RunPass_Recipient_ActorHasNoApiToken

      - id: ReviewCenter-System-NotificationLinksNeedSignIn
        title: >-
          The tool shall link each item of a notification mail to the page of its review, which opens only after a
          sign-in.
        tags: [system, security]
        justification: |
          The reader must reach the news in one step, and a link in a mail must open nothing without the sign-in of the
          reader and must carry no token.
        children:
          - ReviewCenter-Core-NotificationMailLinks
        tests:
          - NotificationComposer_Compose_Item_LinkMatchesReviewLinks
          - NotificationComposer_Compose_Item_LinkHasNoQuery

      - id: ReviewCenter-System-NotificationMailLayout
        title: >-
          The tool shall end each notification mail with a link to the Account page, where the user can turn the mail
          off.
        tags: [system]
        justification: |
          A mail that is hard to stop would be marked as spam.
        children:
          - ReviewCenter-Core-NotificationMailLayout-StopLink
        tests:
          - NotificationComposer_Compose_Footer_LinksToAccount

      - id: ReviewCenter-System-NotificationMailLayout-ItemLimit
        title: >-
          The tool shall list at most 50 items in a notification mail.
        tags: [system]
        justification: |
          A mail that is long would not be read.
        children:
          - ReviewCenter-Core-NotificationMailLayout
        tests:
          - NotificationComposer_Compose_60Items_50ListedAndMore

      - id: ReviewCenter-System-NotificationMailLayout-Order
        title: >-
          The tool shall list the items of a notification mail in the order of the sections of the inbox.
        tags: [system]
        justification: |
          The reader sees the most urgent kind of news first, as on the page of the inbox.
        children:
          - ReviewCenter-Core-NotificationMailLayout-Order
        tests:
          - NotificationComposer_Compose_MixedSections_GroupedInOrder

      - id: ReviewCenter-System-NotificationMailLayout-Daily
        title: >-
          The tool shall put the new items before the count of the outstanding items in a daily summary.
        tags: [system]
        justification: |
          The news is the reason for the mail, so it comes first.
        children:
          - ReviewCenter-Core-NotificationMailLayout-Daily
        tests:
          - NotificationComposer_Compose_Daily_NewItemsThenOutstanding

      - id: ReviewCenter-System-NotificationMailLayout-Every
        title: >-
          The tool shall leave the line about outstanding items out of a mail about new items.
        tags: [system]
        justification: |
          Only the daily summary reports on what still waits.
        children:
          - ReviewCenter-Core-NotificationMailLayout-Every
        tests:
          - NotificationComposer_Compose_Every_NoOutstandingLine

      - id: ReviewCenter-System-NotificationNoHeaderInjection
        title: >-
          The tool shall keep the text of a user, such as a title or a name, from changing the header or the structure
          of a notification mail.
        tags: [system, security]
        justification: |
          A title with a line break or markup could otherwise add a recipient, forge a header, or change the page of
          the mail.
        children:
          - ReviewCenter-Core-NotificationMailSafety
        tests:
          - NotificationDispatcher_RunPass_TitleWithCrLfBcc_SubjectFixedAndAddressUnchanged
          - NotificationComposer_Compose_TitleWithMarkup_HtmlEncoded

      - id: ReviewCenter-System-NotificationBatching
        title: >-
          While the mode of a user is Every, the tool shall tell the changes of a batch window in one mail.
        tags: [system]
        justification: |
          One mail for the changes of a few minutes is easier to read than a mail for each change.
        children:
          - ReviewCenter-Core-NotificationBatching
        tests:
          - NotificationDispatcher_RunPass_Every_ThreeItems_OneMessage

      - id: ReviewCenter-System-NotificationDaily
        title: >-
          While the mode of a user is Daily, the tool shall send one summary of the new items for each local date at the
          digest hour of the configured time zone.
        tags: [system]
        justification: |
          A user who chose the daily summary expects the news of a day in a single mail at a known hour, also on the
          days on which the clock changes and after a downtime of the server.
        children:
          - ReviewCenter-Core-NotificationDailySummary
          - ReviewCenter-Core-NotificationScheduling
          - ReviewCenter-Core-NotificationScheduling-OncePerDate
        tests:
          - NotificationDispatcher_RunPass_Daily_TwoPassesSameDate_OneMail
          - CoreSubsystem_DailyDigest_OnePerLocalDate

      - id: ReviewCenter-System-NotificationNoRepeat
        title: >-
          The tool shall send no second notification mail for an item that did not change in a way that the user can
          act on.
        tags: [system]
        justification: |
          The same news must not be mailed twice, even after a restart of the server, and the record of what was told
          must not grow without bound.
        children:
          - ReviewCenter-Core-NotificationDedupe
          - ReviewCenter-Core-NotificationNewness
          - ReviewCenter-Core-NotificationModeBaseline-KeepsItems
          - ReviewCenter-Storage-NotificationNotifiedItems
          - ReviewCenter-Storage-NotificationCommit
          - ReviewCenter-Storage-NotificationCommit-ModeNone
          - ReviewCenter-Storage-NotificationCommit-RowGone
          - ReviewCenter-Storage-NotificationRecipients-State
        tests:
          - NotificationDispatcher_RunPass_SameItemSameState_NotMailedTwice
          - StorageSubsystem_NotificationState_PersistsModeItemsAndState

      - id: ReviewCenter-System-NotificationCurrentPreference
        title: >-
          The tool shall discard a notification mail that was prepared before the user changed the notification
          preference.
        tags: [system]
        justification: |
          A user who replaced the address, or switched the mail off and on again, while a mail was in flight must not
          get the mail recorded as told, and must not get mail at the old address. The notification preference is the
          confirmed address and the mode of the user.
        children:
          - ReviewCenter-Core-NotificationCurrentAddress
          - ReviewCenter-Core-NotificationCurrentMode
          - ReviewCenter-Storage-NotificationCommit-Stale
        tests:
          - NotificationDispatcher_RunPass_AddressReplacedDuringSend_NothingRecorded
          - NotificationStore_Apply_StaleGeneration_WritesNothing

      - id: ReviewCenter-System-NotificationRetry
        title: >-
          When the send of a notification mail fails, the tool shall try again after 5 minutes, 15 minutes, 1 hour,
          4 hours, and 12 hours following the first to the fifth failed send.
        tags: [system]
        justification: |
          A short outage of the mail server must not lose mail, and the waits grow so that a dead mail server is not
          hammered.
        children:
          - ReviewCenter-Core-NotificationRetry
        tests:
          - NotificationDispatcher_RunPass_Failure1_Waits5Min
          - NotificationDispatcher_RunPass_Failure2_Waits15Min
          - NotificationDispatcher_RunPass_Failure3_Waits1Hour
          - NotificationDispatcher_RunPass_Failure4_Waits4Hours
          - NotificationDispatcher_RunPass_Failure5_Waits12Hours

      - id: ReviewCenter-System-NotificationRetry-GiveUp
        title: >-
          When the send of a notification mail failed six times, the tool shall give up.
        tags: [system]
        justification: |
          A dead address must not be tried for ever.
        children:
          - ReviewCenter-Core-NotificationRetry-GiveUp
        tests:
          - NotificationDispatcher_RunPass_Failure6_GivesUp

      - id: ReviewCenter-System-NotificationMailLimits
        title: >-
          The tool shall defer a notification mail that would exceed the limit of mails for one user in a day.
        tags: [system]
        justification: |
          A single mailbox must not be flooded. A deferral delays the news and does not lose it.
        children:
          - ReviewCenter-Core-NotificationMailLimits
          - ReviewCenter-Core-NotificationMailLimits-Reservation
          - ReviewCenter-Core-NotificationSendLog
          - ReviewCenter-Storage-NotificationSendCounts
          - ReviewCenter-Storage-NotificationSendCounts-Prune
          - ReviewCenter-Storage-NotificationSendReservation
          - ReviewCenter-Storage-NotificationSendReservation-OneWinner
        tests:
          - NotificationDispatcher_RunPass_UserCapReached_Deferred
          - NotificationStore_CountSent_User_CountsOwn

      - id: ReviewCenter-System-NotificationMailLimits-Server
        title: >-
          The tool shall defer a notification mail that would exceed the limit of mails for the server in an hour.
        tags: [system]
        justification: |
          The server must not become a source of bulk mail. A deferral delays the news and does not lose it.
        children:
          - ReviewCenter-Storage-NotificationSendCounts-All
        tests:
          - NotificationDispatcher_RunPass_GlobalCapReached_Deferred
          - NotificationStore_CountSent_All_CountsEverything

      - id: ReviewCenter-System-NotificationIdleCost
        title: >-
          When a notification pass finds the audit trail unchanged since the previous pass and no sweep is due, the tool
          shall read the inbox of no user.
        tags: [system]
        justification: |
          Most passes find nothing to do, so they must cost one cheap query and not a reading of every inbox. The first
          pass and the sweep every fifteen minutes read all inboxes, so the passes in between are the cheap ones.
        children:
          - ReviewCenter-Core-NotificationIdleCost
        tests:
          - NotificationDispatcher_RunPass_SequenceUnchanged_NoInboxRead

      - id: ReviewCenter-System-NotificationIdleCost-Sweep
        title: >-
          The tool shall read the inbox of each recipient at least every fifteen minutes.
        tags: [system]
        justification: |
          News that comes with no entry in the audit trail must still be found.
        children:
          - ReviewCenter-Core-NotificationIdleCost-Sweep
        tests:
          - NotificationDispatcher_RunPass_15MinutesNoChange_ReadsInbox

      - id: ReviewCenter-System-NotificationIdleCost-OnChange
        title: >-
          When the audit trail has a new entry, the tool shall read the inbox of each recipient in the next pass.
        tags: [system]
        justification: |
          A new entry can be the news that a user waits for. The first pass has no remembered position, so every entry
          is new to it.
        children:
          - ReviewCenter-Core-NotificationIdleCost-OnChange
          - ReviewCenter-Core-NotificationIdleCost-FirstPass
        tests:
          - NotificationDispatcher_RunPass_SequenceChanged_ReadsInbox
          - NotificationDispatcher_RunPass_First_ReadsInbox

      - id: ReviewCenter-System-NotificationIdleCost-AfterFailure
        title: >-
          When a notification pass failed for a user, the tool shall read the inbox of each recipient in the next pass
          although no sweep is due.
        tags: [system]
        justification: |
          A failed pass must not mark the sweep as done, or the user would wait for the next sweep to get the news.
        children:
          - ReviewCenter-Core-NotificationIdleCost-AfterFailure
        tests:
          - NotificationDispatcher_RunPass_FailedAfterCleanPass_NextPassReadsAgain
          - NotificationDispatcher_RunPass_FailedSweepAfterCleanPass_NextPassReadsAgain

      - id: ReviewCenter-System-NotificationIdleCost-Resume
        title: >-
          When a notification pass is clean, the tool shall read no inbox in the next idle pass.
        tags: [system]
        justification: |
          Reading everything after a failure must not keep the server from becoming cheap again.
        children:
          - ReviewCenter-Core-NotificationIdleCost-Resume
        tests:
          - NotificationDispatcher_RunPass_CleanAfterFailedPass_NextPassIdle

      - id: ReviewCenter-System-NotificationIdleCost-TimeDriven
        title: >-
          When a batch window has elapsed, the tool shall send its mail although the audit trail has no new entry.
        tags: [system]
        justification: |
          A mail that is due by the clock must not wait for an unrelated change.
        children:
          - ReviewCenter-Core-NotificationIdleCost-TimeDriven
        tests:
          - NotificationDispatcher_RunPass_WindowElapsedSequenceUnchanged_Sends

      - id: ReviewCenter-System-NotificationWorkerRuns
        title: >-
          While e-mail notifications are enabled with a sender that sends mail, the tool shall run the notification
          passes at the polling interval in the web server.
        tags: [system]
        justification: |
          The mail is sent by the server that holds the data, and the passes must recur for as long as the server runs.
          A command or the self-test must not send mail.
        children:
          - ReviewCenter-Hosting-NotificationWorker
          - ReviewCenter-Messaging-NotificationWorker
          - ReviewCenter-Messaging-WorkerRegisteredWhenEnabled
        tests:
          - HostingSubsystem_NotificationWorker_OnlyEnabledWebHost
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure

      - id: ReviewCenter-System-NotificationWorkerOnlyWhenEnabled
        title: >-
          While e-mail notifications are not enabled, the tool shall run no background work for them.
        tags: [system]
        justification: |
          A feature that is off must cost nothing, and a server that was set up before the feature existed must not
          change its behavior.
        children:
          - ReviewCenter-Hosting-NotificationWorkerNotWhenOff
          - ReviewCenter-Messaging-WorkerNotRegisteredWhenOff
        tests:
          - HostingSubsystem_NotificationWorker_OnlyEnabledWebHost
          - NotificationRegistration_AddNotificationWorker_Off_NotRegistered

      - id: ReviewCenter-System-NotificationWorkerResilient
        title: >-
          When a notification pass fails, the tool shall go on with the next pass.
        tags: [system]
        justification: |
          The failure of the mail server or the database must not end the notifications until the next restart or bring
          the server down.
        children:
          - ReviewCenter-Messaging-WorkerSurvivesFailure
          - ReviewCenter-Messaging-WorkerSurvivesFailure-NoFault
        tests:
          - NotificationWorker_ExecuteAsync_PassThrows_RunsNextPass

      - id: ReviewCenter-System-NotificationWorkerResilient-OtherUsers
        title: >-
          When the notifications of one user fail, the tool shall go on with the notifications of the other users.
        tags: [system]
        justification: |
          The failure of a mailbox or an inbox must not keep other users from their mail.
        children:
          - ReviewCenter-Core-NotificationResilience
        tests:
          - NotificationDispatcher_RunPass_InboxFails_OtherUserMailed

      - id: ReviewCenter-System-NotificationWorkerResilient-Result
        title: >-
          When a notification pass ends, the tool shall report the numbers of sent, failed, and deferred mails to the
          worker.
        tags: [system]
        justification: |
          The worker logs the result of a pass, so a pass must give it counts and no address.
        children:
          - ReviewCenter-Core-NotificationPassResult
          - ReviewCenter-Core-NotificationPassResult-NoAddress
          - ReviewCenter-Core-NotificationPassResult-Cancellation
        tests:
          - NotificationDispatcher_RunPass_Mixed_ResultCounts

      - id: ReviewCenter-System-NotificationWorkerStops
        title: >-
          When the server stops, the tool shall end the notification passes before the next polling interval ends.
        tags: [system]
        justification: |
          A server that stops must not wait for a background service or leave an error in the log.
        children:
          - ReviewCenter-Messaging-WorkerStops
          - ReviewCenter-Messaging-WorkerStops-CancelsPass
          - ReviewCenter-Messaging-WorkerStops-NoErrorLogged
        tests:
          - ServerHost_RunAsync_Stop_WorkerStopped

      - id: ReviewCenter-System-NotificationLogNoPersonalData
        title: >-
          The tool shall keep the address of a recipient out of the log of the notification passes.
        tags: [system, security]
        justification: |
          A log is kept and read by operators.
        children:
          - ReviewCenter-Messaging-WorkerLogHasNoPersonalData
        tests:
          - NotificationWorker_ExecuteAsync_PassThrowsWithAddress_NoAddressAnywhereInLog

      - id: ReviewCenter-System-NotificationLogNoPersonalData-ErrorMessage
        title: >-
          The tool shall keep the message of an error out of the log of the notification passes.
        tags: [system, security]
        justification: |
          The message of an error can hold an address.
        children:
          - ReviewCenter-Messaging-WorkerLogHasNoPersonalData-ErrorMessage
        tests:
          - NotificationWorker_ExecuteAsync_PassThrows_LogHasNoMessage

      - id: ReviewCenter-System-NotificationLogCounts
        title: >-
          When a notification pass sent or failed a mail, the tool shall log the numbers of sent, failed, and deferred
          mails.
        tags: [system]
        justification: |
          The operator sees that the notifications work and how often they fail.
        children:
          - ReviewCenter-Messaging-WorkerLogCounts
        tests:
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure

      - id: ReviewCenter-System-NotificationLogCounts-IdleQuiet
        title: >-
          When a notification pass sent and failed no mail, the tool shall log nothing for that pass.
        tags: [system]
        justification: |
          An idle server leaves the log quiet.
        children:
          - ReviewCenter-Messaging-WorkerLogCounts-IdleQuiet
        tests:
          - NotificationWorker_ExecuteAsync_IdlePass_NothingLogged

      - id: ReviewCenter-System-NotificationInputRefused
        title: >-
          When the notification composer is asked to compose a mail without an item, the tool shall refuse it with an
          argument error.
        tags: [system]
        justification: |
          A mail without an item is a mistake of the caller that must show at once and not silently stop the
          notifications.
        children:
          - ReviewCenter-Core-NotificationComposerInput
        tests:
          - NotificationComposer_Compose_NoItems_ThrowsArgument

      - id: ReviewCenter-System-NotificationInputRefused-NullRow
        title: >-
          When the notification composer is asked to classify a missing inbox row, the tool shall refuse it with an
          argument error.
        tags: [system]
        justification: |
          A call without a row is a mistake of the caller that must show at once.
        children:
          - ReviewCenter-Core-NotificationComposerInput-NullRow
        tests:
          - NotificationComposer_Classify_NullRow_ThrowsArgumentNull

      - id: ReviewCenter-System-NotificationInputRefused-EmptyBaseUrl
        title: >-
          When the notification composer is given an empty base address, the tool shall refuse it with an argument
          error.
        tags: [system]
        justification: |
          Without a base address no link of a mail can be absolute.
        children:
          - ReviewCenter-Core-NotificationComposerInput-EmptyBaseUrl
        tests:
          - NotificationComposer_Constructor_EmptyBaseUrl_Throws

      - id: ReviewCenter-System-NotificationInputRefused-Schedule
        title: >-
          When the digest schedule is given a digest hour outside the range 0 to 23, the tool shall refuse it with an
          argument error.
        tags: [system]
        justification: |
          A schedule that is never due would silently stop the daily summaries.
        children:
          - ReviewCenter-Core-NotificationSchedulingInput
        tests:
          - DigestSchedule_Constructor_Hour24_Throws

      - id: ReviewCenter-System-NotificationInputRefused-Schedule-NullZone
        title: >-
          When the digest schedule is given no time zone, the tool shall refuse it with an argument error.
        tags: [system]
        justification: |
          A schedule without a zone can not tell the local date.
        children:
          - ReviewCenter-Core-NotificationSchedulingInput-NullZone
        tests:
          - DigestSchedule_Constructor_NullZone_Throws

      - id: ReviewCenter-System-NotificationInputRefused-Worker
        title: >-
          When the notification worker is given no pass, clock, or logger, the tool shall refuse it with an argument
          error.
        tags: [system]
        justification: |
          A worker without one of these could never run properly, so the mistake must show at once.
        children:
          - ReviewCenter-Messaging-WorkerArguments
        tests:
          - NotificationWorker_Constructor_NullArgument_Throws

      - id: ReviewCenter-System-NotificationInputRefused-Worker-Interval
        title: >-
          When the notification worker is given a polling interval that is not positive, the tool shall refuse it with
          an argument error.
        tags: [system]
        justification: |
          A worker with an interval of zero could never run properly, so the mistake must show at once.
        children:
          - ReviewCenter-Messaging-WorkerArguments-Interval
        tests:
          - NotificationWorker_Constructor_NonPositivePoll_Throws

      - id: ReviewCenter-System-Authorization
        title: >-
          The tool shall send a request without a signed-in user for a project, review, checklist, account, or
          user page to the login page.
        tags: [system]
        justification: |
          Review data must only be read and changed by identified people (21 CFR Part 11 section 11.10(d), limiting
          system access to authorized individuals).
        children:
          - ReviewCenter-Identity-Authorization
          - ReviewCenter-Hosting-Authentication
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-System-Authorization-UserAdmin
        title: >-
          The tool shall refuse the user administration page to a user who is not a system administrator.
        tags: [system]
        justification: |
          Only system administrators may manage users (21 CFR Part 11 section 11.10(d)).
        children:
          - ReviewCenter-Identity-Authorization-UserAdmin

      - id: ReviewCenter-System-Authorization-OpenPages
        title: >-
          The tool shall keep the home page, the login page, and the /health URL open to everyone.
        tags: [system]
        justification: |
          The health probe and the login page must work without signing in, since nobody can sign in without them.
        children:
          - ReviewCenter-Identity-Authorization
        tests:
          - SignIn_PublicPage_Anonymous_IsServed
          - ServerHost_CreateApplication_AnonymousVisitor_HomeAndLoginPagesAreServed
          - ReviewCenter_ServeVerb_Started_HealthEndpointReturnsHealthy

      - id: ReviewCenter-System-ProjectAccess
        title: >-
          The tool shall let a user who is a member of a project or a system administrator see and use the project,
          with its reviews, files, comments, signatures, attestation, evidence index, repositories, and history.
        tags: [system]
        justification: |
          A project may hold confidential work. What a user may see and do in a project is decided in one place
          (21 CFR Part 11 section 11.10(d); EU GMP Annex 11 clause 12), and the people who work in the project need
          all of it.
        children:
          - ReviewCenter-Core-ProjectAccess
          - ReviewCenter-Core-ProjectAccess-Work
          - ReviewCenter-Core-ProjectAccess-SystemAdmin
          - ReviewCenter-Core-ProjectAccess-Dependencies
          - ReviewCenter-ProjectAccess-Visibility
          - ReviewCenter-ProjectAccess-Visibility-Administer
          - ReviewCenter-ProjectAccess-SystemAdmin
          - ReviewCenter-ProjectAccess-SystemAdmin-Administer
          - ReviewCenter-Web-ProjectAccess-ReviewRepositories
          - ReviewCenter-Evidence-Visibility
          - ReviewCenter-Hosting-ProjectAccess
        tests:
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused

      - id: ReviewCenter-System-ProjectAccess-OthersAsMissing
        title: >-
          The tool shall answer a request in the web pages of a user who is neither a member of a project nor a
          system administrator, for the project or anything in it, as it answers for a project that does not exist.
        tags: [system]
        justification: |
          Answering a user who may not see a project exactly as for a project that does not exist keeps the
          existence of a project from leaking through a page or a download (21 CFR Part 11 section 11.10(d);
          EU GMP Annex 11 clause 12).
        children:
          - ReviewCenter-Core-ProjectAccess-OtherActors
          - ReviewCenter-ProjectAccess-Visibility-NonMember
          - ReviewCenter-ProjectAccess-Visibility-NonMember-Administer
          - ReviewCenter-ProjectAccess-Visibility-OtherProject
          - ReviewCenter-ProjectAccess-Visibility-OtherProject-Administer
          - ReviewCenter-ProjectAccess-Visibility-UndefinedRole
          - ReviewCenter-ProjectAccess-Visibility-UndefinedRoleMember
          - ReviewCenter-ProjectAccess-SystemAdmin-Missing
          - ReviewCenter-ProjectAccess-SystemAdmin-Missing-Administer
          - ReviewCenter-ProjectAccess-NotFound
          - ReviewCenter-ProjectAccess-NotFound-Missing
          - ReviewCenter-ProjectAccess-NotFound-Same
          - ReviewCenter-ProjectAccess-NotFound-Administer
          - ReviewCenter-Web-ProjectAccess-HiddenProject
          - ReviewCenter-Evidence-Visibility-OtherActors
        tests:
          - ApiProjectAccess_AttestationPage_NonMemberSession_Answers404

      - id: ReviewCenter-System-ProjectAccess-ApiAsMissing
        title: >-
          The tool shall answer an API request for a project, or for anything in it, from a token whose owner is
          neither a member of the project nor a system administrator, as it answers for a project that does not
          exist.
        tags: [system]
        justification: |
          The API routes of a project are another way to find out that a project exists, so they answer exactly as
          the web pages do (21 CFR Part 11 section 11.10(d); EU GMP Annex 11 clause 12).
        children:
          - ReviewCenter-Api-ProjectAccess
          - ReviewCenter-Api-ProjectAccess-SameAnswer
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject

      - id: ReviewCenter-System-ProjectAccess-List
        title: >-
          The tool shall list to a user only the projects that the user may see.
        tags: [system]
        justification: |
          A project list that named a project the user may not see would reveal that the project exists.
        children:
          - ReviewCenter-Web-ProjectAccess
          - ReviewCenter-Web-ProjectAccess-AdminSeesAll
          - ReviewCenter-ProjectAccess-Visibility-UndefinedRoleListed
          - ReviewCenter-Api-ProjectAccess-ListProjects
        tests:
          - ApiProjectAccess_ListProjects_ShowsOnlyMemberProjectsExceptToSystemAdmins

      - id: ReviewCenter-System-ProjectAccess-TokenAccess
        title: >-
          The tool shall give the API token of a user exactly the access of its owner.
        tags: [system]
        justification: |
          A token stands for the person who created it, so it must never reach more, or less, than the person may
          reach.
        children:
          - ReviewCenter-Core-ProjectAccess-TokenOwner
          - ReviewCenter-Api-ProjectAccess-Checklist
          - ReviewCenter-Api-ProjectAccess-Served
        tests:
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused

      - id: ReviewCenter-System-ProjectAccess-ChangeEffect
        title: >-
          The tool shall let a change of a membership of a user, or of the system administrator right of a user,
          take effect with the next request.
        tags: [system]
        justification: |
          The memberships are read at every request so that taking access away works at once, also for a token
          that was handed out earlier.
        children:
          - ReviewCenter-Core-ProjectAccess-CurrentState
          - ReviewCenter-ProjectAccess-Revocation
          - ReviewCenter-ProjectAccess-Revocation-Demotion
          - ReviewCenter-ProjectAccess-Revocation-Disabled
          - ReviewCenter-ProjectAccess-Revocation-RoleChange
          - ReviewCenter-ProjectAccess-Revocation-RoleChange-Audit
          - ReviewCenter-Web-ProjectAccess-ViewRecheck
          - ReviewCenter-Web-ProjectAccess-ViewRecheckNothingStored
          - ReviewCenter-Web-ProjectAccess-ViewLost
          - ReviewCenter-Web-ProjectAccess-AdministerRecheck
          - ReviewCenter-Web-ProjectAccess-AdministerLost
          - ReviewCenter-Web-ProjectAccess-SystemAdminRecheck
          - ReviewCenter-Web-ProjectAccess-SystemAdminLost
          - ReviewCenter-Web-ProjectAccess-ContributeRecheck
          - ReviewCenter-Web-ProjectAccess-ContributeLost
          - ReviewCenter-Web-ProjectAccess-ContributeConsistent
          - ReviewCenter-Web-ProjectAccess-AuditRecheck
          - ReviewCenter-Web-ProjectAccess-AuditLost
          - ReviewCenter-Api-ProjectAccess-Removed
          - ReviewCenter-Identity-AdminClaim
          - ReviewCenter-Identity-AdminClaim-NoProjectRole
          - ReviewCenter-Identity-AdminClaim-PasswordChanged
        tests:
          - ApiProjectAccess_Token_OwnerRemovedFromProject_Gets404AtOnce

      - id: ReviewCenter-System-ProjectAccess-TemporaryPassword
        title: >-
          The tool shall give no access to any project to a user whose password is still a temporary one.
        tags: [system]
        justification: |
          A temporary password is known to the person who set it, so the account must not be used for project work
          before the user has replaced it.
        children:
          - ReviewCenter-Core-ProjectAccess-TemporaryPassword
          - ReviewCenter-Identity-AdminClaim-MustChange
          - ReviewCenter-Identity-AdminClaim-AccountPage

      - id: ReviewCenter-System-ProjectAccess-RoleLimits
        title: >-
          The tool shall refuse a user an action that neither the role of the user in a project nor the system
          administrator right of the user allows, such as administering the project, opening its repositories page,
          reading its audit trail, or creating a project.
        tags: [system]
        justification: |
          A member who may only work or read must not administer a project, and only a system administrator may
          create one, so that the administration stays with the accountable people.
        children:
          - ReviewCenter-ProjectAccess-Visibility-NotAdministrator
          - ReviewCenter-ProjectAccess-NotFound-NotAdministrator
          - ReviewCenter-ProjectAccess-NotFound-NotSystemAdmin
          - ReviewCenter-Core-ProjectAccess-AuditTrailRefused
          - ReviewCenter-Web-ProjectAccess-RepositoriesAccess
          - ReviewCenter-Web-ProjectAccess-RepositoriesNotFound
          - ReviewCenter-Web-ProjectAccess-CreateProjects
          - ReviewCenter-Web-ProjectAccess-CreateProjectsNothing

      - id: ReviewCenter-System-ProjectMembers
        title: >-
          The tool shall let a system administrator or a project admin of a project manage its members.
        tags: [system]
        justification: |
          The people who run a project must be able to manage its members without a system administrator. The
          system tests add members by the user name in a real browser; the creation of an account with a temporary
          password, the rule that a project keeps a project admin, and the refusal of other users are verified by
          the tests of the child requirements.
        children:
          - ReviewCenter-Core-ProjectAccess-ProjectAdmin
          - ReviewCenter-Core-ProjectAccess-SystemAdmin
          - ReviewCenter-Web-ProjectAccess-MemberAccess
          - ReviewCenter-Web-ProjectAccess-MemberChange
          - ReviewCenter-Web-ProjectAccess-MemberRemoval
          - ReviewCenter-Web-ProjectAccess-MemberChangeLastAdmin
          - ReviewCenter-Web-ProjectAccess-MembersHidden
          - ReviewCenter-Web-ProjectAccess-Roles
          - ReviewCenter-Web-ProjectAccess-RolesAuditor
          - ReviewCenter-Web-ProjectAccess-RolesCombination
          - ReviewCenter-Web-ProjectAccess-RolesOpenWork
          - ReviewCenter-Web-ProjectAccess-RolesLastAdmin
          - ReviewCenter-Web-ProjectAccess-RolesOwnRole
          - ReviewCenter-Storage-Memberships
          - ReviewCenter-Storage-Memberships-ChangeRole
          - ReviewCenter-Storage-Memberships-Remove

      - id: ReviewCenter-System-ProjectMembers-ExactName
        title: >-
          The tool shall let a system administrator or a project admin of a project add an existing user to the
          project as a project admin or a member only by the exact user name.
        tags: [system]
        justification: |
          The people who run a project must be able to add members, but not to browse the users of the
          installation.
        children:
          - ReviewCenter-Core-ProjectAccess-MemberLookup
          - ReviewCenter-Web-ProjectAccess-AddMember
          - ReviewCenter-Web-ProjectAccess-AddMemberNoUserList
          - ReviewCenter-Web-ProjectAccess-AddMemberUnusableName
          - ReviewCenter-Web-ProjectAccess-AddMemberUnusableName-NameKept
          - ReviewCenter-Web-ProjectAccess-AddMemberAlreadyMember
          - ReviewCenter-Web-ProjectAccess-AddMemberNotFound
          - ReviewCenter-Web-ProjectAccess-AddMemberOtherProject

      - id: ReviewCenter-System-ProjectMembers-AddThrottle
        title: >-
          The tool shall limit the failed attempts of an actor who is not a system administrator to add a member by
          a user name.
        tags: [system]
        justification: |
          Without a limit, a project admin could find out which user names exist by trying names one after another.
        children:
          - ReviewCenter-Core-ProjectAccess-AddThrottle

      - id: ReviewCenter-System-ProjectMembers-Integrity
        title: >-
          The tool shall refuse a membership that would give a user a second membership in a project, or that names
          a project or a user that does not exist.
        tags: [system]
        justification: |
          A duplicate membership or a membership without a project or a user would leave the list of members
          unclear.
        children:
          - ReviewCenter-Storage-Memberships-OnePerUser
          - ReviewCenter-Storage-Memberships-UnknownProject
          - ReviewCenter-Storage-Memberships-UnknownUser

      - id: ReviewCenter-System-ProjectMembers-NewAccount
        title: >-
          The tool shall let a system administrator or a project admin create an account only together with its
          membership of the project.
        tags: [system]
        justification: |
          An account that is created for a project and has no membership would be an account that nobody can see.
          The temporary password of the account keeps the person who created it from knowing the password that is
          used to sign.
        children:
          - ReviewCenter-Core-ProjectAccess-CreateAccount
          - ReviewCenter-Web-ProjectAccess-CreateAccount
          - ReviewCenter-Web-ProjectAccess-CreateAccountPassword
          - ReviewCenter-Web-ProjectAccess-CreateAccountPassword-Copy
          - ReviewCenter-Web-ProjectAccess-CreateAccountPassword-DoneHides
          - ReviewCenter-Web-ProjectAccess-CreateAccountPassword-DoneReturns
          - ReviewCenter-Web-ProjectAccess-CreateAccountCopyFailure
          - ReviewCenter-Web-ProjectAccess-CreateAccountUnusableName
          - ReviewCenter-Web-ProjectAccess-CreateAccountNotFound
          - ReviewCenter-Web-ProjectAccess-CreateAccountOtherProject
          - ReviewCenter-Storage-Memberships-NewAccount

      - id: ReviewCenter-System-ProjectMembers-LastAdmin
        title: >-
          The tool shall not let a project be left without an enabled project admin by removing or demoting the
          last one.
        tags: [system]
        justification: |
          A project must not be left without anybody who can manage it.
        children:
          - ReviewCenter-Core-ProjectAccess-LastAdmin
          - ReviewCenter-Storage-Memberships-LastAdmin

      - id: ReviewCenter-System-ProjectMembers-Audit
        title: >-
          The tool shall record every change of a membership of a project in the audit trail of the project.
        tags: [system]
        justification: |
          Independence of review depends on who is in the project, so a change of the members has to be
          traceable.
        children:
          - ReviewCenter-Core-ProjectAccess-MemberAudit
          - ReviewCenter-Storage-Memberships-Audit

      - id: ReviewCenter-System-ProjectMembers-OthersRefused
        title: >-
          The tool shall not let a member of a project who is not a project admin manage the members of the
          project.
        tags: [system]
        justification: |
          Only the people who run a project may decide who is in it.
        children:
          - ReviewCenter-Core-ProjectAccess-PlainMember

      - id: ReviewCenter-System-ProjectMembers-ReviewersOnlyMembers
        title: >-
          The tool shall make only the members of a project available to be named as reviewers of its reviews.
        tags: [system]
        justification: |
          Independence of review depends on who is in the project, so a person who is not a member must not be able
          to review it.
        children:
          - ReviewCenter-Core-ProjectAccess-SlotsAndSigning
        tests:
          - ReviewCenter_ReviewerSlots_NonMemberAndSamePerson_AreNotAcceptedAsReviewers

      - id: ReviewCenter-System-Users
        title: >-
          The tool shall let a system administrator create a user.
        tags: [system]
        justification: |
          Users are the accountable parties of a review, so somebody has to be able to create them.
        children:
          - ReviewCenter-Core-Users
          - ReviewCenter-Core-Users-Arguments
          - ReviewCenter-Core-Users-UserName
          - ReviewCenter-Core-Users-DisplayName
          - ReviewCenter-Web-SignIn-NewUser
          - ReviewCenter-Web-SignIn-NewUserRefused
          - ReviewCenter-Web-SignIn-NewUserNothingCreated
          - ReviewCenter-Web-SignIn-NewUserCancel
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-System-Users-List
        title: >-
          The tool shall let a system administrator list the users.
        tags: [system]
        justification: |
          A system administrator manages the users and has to see who exists.
        children:
          - ReviewCenter-Web-SignIn-UsersPage
          - ReviewCenter-Web-SignIn-UsersFilter
          - ReviewCenter-Web-SignIn-UsersFilterNoReload
          - ReviewCenter-Web-SignIn-UsersStatus
          - ReviewCenter-Web-SignIn-UsersUnlock
          - ReviewCenter-Web-SignIn-UsersUnlockAction
          - ReviewCenter-Web-SignIn-UsersUnlockOutcome
          - ReviewCenter-Web-SignIn-UsersLink

      - id: ReviewCenter-System-Users-AdminRight
        title: >-
          The tool shall let a system administrator make a user a system administrator or an ordinary user.
        tags: [system]
        justification: |
          The right to manage the installation changes when people change their duties.
        children:
          - ReviewCenter-Core-Users-SetSystemAdmin
          - ReviewCenter-Core-Users-NotFound
          - ReviewCenter-Web-SignIn-MakeAdmin
          - ReviewCenter-Web-SignIn-TakeAdmin
          - ReviewCenter-Web-SignIn-LastAdmin
          - ReviewCenter-Web-SignIn-LastAdminNothingChanged

      - id: ReviewCenter-System-Users-Enable
        title: >-
          The tool shall let a system administrator enable and disable a user.
        tags: [system]
        justification: |
          A user who leaves is disabled, not deleted, so that the accountable party of earlier work stays known.
        children:
          - ReviewCenter-Core-Users-Enabled
          - ReviewCenter-Web-SignIn-Enable
          - ReviewCenter-Web-SignIn-Disable
          - ReviewCenter-Web-SignIn-DisableCancel
          - ReviewCenter-Web-SignIn-DisableLoadError
          - ReviewCenter-Web-SignIn-DisableLoadErrorNoPanel

      - id: ReviewCenter-System-Users-SignIn
        title: >-
          The tool shall let an enabled user sign in with the right password, finding the user by the user name in any
          letter case.
        tags: [system]
        justification: |
          Only a user who is known and enabled may act in the tool.
        children:
          - ReviewCenter-Core-Users-SignIn
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-System-Users-SignInRefused
        title: >-
          The tool shall refuse a sign-in with a wrong or missing password, with an unknown user name, or of a
          disabled user.
        tags: [system]
        justification: |
          A refused sign-in must not tell an attacker which of the three reasons applied.
        children:
          - ReviewCenter-Core-Users-SignInRefused

      - id: ReviewCenter-System-Users-SetPassword
        title: >-
          The tool shall let a system administrator set a password for a user that the user has to change at the
          next sign-in.
        tags: [system]
        justification: |
          A system administrator who sets a password must not know the password that the user keeps, because that
          password is used to sign.
        children:
          - ReviewCenter-Core-Users-SetPassword
          - ReviewCenter-Core-Users-AdminPasswordIsTemporary
          - ReviewCenter-Web-SignIn-SetPassword
          - ReviewCenter-Web-SignIn-SetPasswordOwn
          - ReviewCenter-Web-SignIn-SetPasswordCancel

      - id: ReviewCenter-System-Users-TemporaryOnly
        title: >-
          The tool shall let a user who signed in with a temporary password do nothing but change the password.
        tags: [system]
        justification: |
          Until the user has replaced the password that somebody else chose, the account must not be used for work or
          for a signature.
        children:
          - ReviewCenter-Core-Users-TemporaryPassword
          - ReviewCenter-Core-Users-TemporaryReauth
          - ReviewCenter-Web-SignIn-TemporaryPassword
          - ReviewCenter-Web-SignIn-TemporaryPasswordFormOnly
          - ReviewCenter-Web-SignIn-TemporaryPasswordNone
          - ReviewCenter-Web-SignIn-TemporaryHeader
          - ReviewCenter-Web-SignIn-TemporaryPages
          - ReviewCenter-Web-SignIn-TemporaryOpenPages

      - id: ReviewCenter-System-Users-TemporaryEnd
        title: >-
          The tool shall end the temporary state of a password when the user changes it to a password that differs
          from the temporary one.
        tags: [system]
        justification: |
          Keeping the temporary password would leave the password known to the person who set it.
        children:
          - ReviewCenter-Core-Users-TemporarySame
          - ReviewCenter-Core-Users-TemporaryEnds
          - ReviewCenter-Web-SignIn-PasswordChanged

      - id: ReviewCenter-System-Users-ChangePassword
        title: >-
          The tool shall let every user change the own password.
        tags: [system]
        justification: |
          A user must be able to replace a password that may have become known.
        children:
          - ReviewCenter-Core-Users-ChangePassword
          - ReviewCenter-Web-SignIn-ChangePassword
          - ReviewCenter-Web-SignIn-ChangePasswordRefused
          - ReviewCenter-Web-SignIn-ChangePasswordNothingChanged
          - ReviewCenter-Web-SignIn-ChangePasswordCodeField
          - ReviewCenter-Web-SignIn-ChangePasswordClearCode
          - ReviewCenter-Web-SignIn-ChangePasswordNoCodeField
          - ReviewCenter-Web-SignIn-ChangePasswordCode
          - ReviewCenter-Web-SignIn-ChangePasswordCodeRefused

      - id: ReviewCenter-System-Users-ChangePasswordRefused
        title: >-
          The tool shall refuse a change of the own password when the current password is wrong, when the new password
          breaks the password rules, or when the proof of the second factor of a user who uses one is missing.
        tags: [system]
        justification: |
          A change of a password without proof that the person is the user would let a stolen session take over the
          account.
        children:
          - ReviewCenter-Core-Users-ChangePasswordRefused
          - ReviewCenter-Core-Users-ChangePasswordSecondFactor

      - id: ReviewCenter-System-Users-AccountPage
        title: >-
          The tool shall give a signed-in user an account page, which the page header links with the name of the user.
        tags: [system]
        justification: |
          The account page is where a user changes the own password.
        children:
          - ReviewCenter-Web-SignIn
          - ReviewCenter-Web-SignIn-AccountPage

      - id: ReviewCenter-System-Users-Appearance
        title: >-
          The tool shall let a signed-in user choose the appearance of the pages on the account page.
        tags: [system]
        justification: |
          Each person can read the pages in the way that suits the person best.
        children:
          - ReviewCenter-Web-SignIn-Appearance
          - ReviewCenter-Web-SignIn-AppearanceFirstPaint

      - id: ReviewCenter-System-Users-PasswordRules
        title: >-
          The tool shall require a password of 12 to 128 characters, without a demand for a mix of character classes.
        tags: [system]
        justification: |
          A password policy makes guessing hard (21 CFR Part 11 section 11.300(d), safeguards against unauthorized
          use).
        children:
          - ReviewCenter-Core-Users-Password
          - ReviewCenter-Core-Users-SetPasswordRules

      - id: ReviewCenter-System-Users-Lockout
        title: >-
          The tool shall lock a user out for 5 minutes after 5 failed sign-ins in a row.
        tags: [system]
        justification: |
          A lockout makes guessing hard (21 CFR Part 11 section 11.300(d), safeguards against unauthorized use).
        children:
          - ReviewCenter-Core-Users-Lockout
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-System-Users-Unlock
        title: >-
          The tool shall let a system administrator end the lockout of a user.
        tags: [system]
        justification: |
          A user who is locked out by mistake or by an attacker must not stay locked out for good.
        children:
          - ReviewCenter-Core-Users-Unlock

      - id: ReviewCenter-System-Users-UnlockRefused
        title: >-
          The tool shall refuse to end the lockout of a user for an actor who is not an enabled system administrator.
        tags: [system]
        justification: |
          If anybody could end a lockout, the lockout would not stop an attacker.
        children:
          - ReviewCenter-Core-Users-UnlockRefused

      - id: ReviewCenter-System-Users-LockoutShown
        title: >-
          The tool shall show whether a user is locked out.
        tags: [system]
        justification: |
          A system administrator can only end a lockout that the administrator can see.
        children:
          - ReviewCenter-Core-Users-LockedStatus

      - id: ReviewCenter-System-Users-LastSignIn
        title: >-
          The tool shall show the time of the last successful sign-in of a user.
        tags: [system]
        justification: |
          The last sign-in tells a system administrator which accounts are in use.
        children:
          - ReviewCenter-Core-Users-LastSignIn

      - id: ReviewCenter-System-Users-LastSignInNone
        title: >-
          The tool shall not take the time of a failed or refused sign-in, of a re-authentication for a signature, or
          of a password step that waits for the second factor, as the last sign-in of a user.
        tags: [system]
        justification: |
          Only a completed sign-in shows that the person was in the tool.
        children:
          - ReviewCenter-Core-Users-LastSignInNone

      - id: ReviewCenter-System-Users-LastAdmin
        title: >-
          The tool shall never disable or demote the last enabled system administrator.
        tags: [system]
        justification: |
          Without a system administrator, nobody could manage the users and the installation.
        children:
          - ReviewCenter-Core-Users-LastAdmin
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-System-Users-UserImpact
        title: >-
          The tool shall tell an administrator which open review work depends on a user before the user is disabled.
        tags: [system]
        justification: |
          The open work of a user shows what an offboarding leaves behind.
        children:
          - ReviewCenter-Core-UserImpact
          - ReviewCenter-Core-UserImpact-Ordering
          - ReviewCenter-Core-UserImpact-BatchRead
          - ReviewCenter-Core-UserImpact-Scope
          - ReviewCenter-Storage-Memberships-UserImpact

      - id: ReviewCenter-System-Users-UserImpactProjects
        title: >-
          The tool shall tell an administrator in which projects a user is the only enabled project admin before the
          user is disabled.
        tags: [system]
        justification: |
          A project without an enabled admin cannot be managed, so the administrator has to know it before
          disabling the user.
        children:
          - ReviewCenter-Core-UserImpact-SoleAdmin
          - ReviewCenter-Storage-Memberships-UserImpact-SoleAdmin

      - id: ReviewCenter-System-Users-UserImpactRefused
        title: >-
          The tool shall refuse the impact of a user to an actor who administers no project or whose account is
          disabled.
        tags: [system]
        justification: |
          The open work of a user is confidential, so only the people who administer the work may see it.
        children:
          - ReviewCenter-Core-UserImpact-Refused
          - ReviewCenter-Core-UserImpact-Arguments

      - id: ReviewCenter-System-Users-Stored
        title: >-
          The tool shall keep the users, with only a hash of the password, in the database so that they are still
          there when the tool is restarted.
        tags: [system]
        justification: |
          A password hash means that a copy of the database does not reveal the passwords.
        children:
          - ReviewCenter-Storage-Users
          - ReviewCenter-Storage-Users-UniqueName
        tests:
          - StorageSubsystem_Users_PersistAcrossReopen

      - id: ReviewCenter-System-UserAdd
        title: >-
          The tool shall create a user in the database when the user add verb is provided with a user name and a
          display name.
        tags: [system]
        justification: |
          The first system administrator must exist before anybody can sign in or create a project.
        children:
          - ReviewCenter-Program-UserAdd
          - ReviewCenter-Program-UserAdd-Help
          - ReviewCenter-Hosting-UserAdd
        tests:
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate

      - id: ReviewCenter-System-UserAdd-SystemAdminSwitch
        title: >-
          The tool shall create the user as a system administrator when the user add verb is provided with the
          --system-admin switch, and as an ordinary user when the switch is not provided.
        tags: [system]
        justification: |
          The switch lets the first system administrator be created, while every other user stays an ordinary user
          unless it is asked for explicitly.
        children:
          - ReviewCenter-Cli-UserAdd
          - ReviewCenter-Cli-UserAdd-OrdinaryDefault

      - id: ReviewCenter-System-UserAdd-PasswordSource
        title: >-
          The tool shall take the password of the new user from the REVIEWCENTER_PASSWORD environment variable, else
          from the first line of redirected standard input, else from a prompt.
        tags: [system]
        justification: |
          A script, a pipe, and a person at a terminal each need a way to give the password without anybody else
          seeing it.
        children:
          - ReviewCenter-Program-UserAdd-PasswordHelp
          - ReviewCenter-Hosting-UserAdd-StandardInput
        tests:
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate

      - id: ReviewCenter-System-UserAdd-NoCommandLinePassword
        title: >-
          The tool shall never take the password of the new user from the command line.
        tags: [system]
        justification: |
          A password on the command line would be visible to other processes and kept in shell history, so it is
          never accepted there.
        children:
          - ReviewCenter-Cli-UserAdd-NoPasswordOption

      - id: ReviewCenter-System-UserAdd-Error
        title: >-
          The tool shall report an error with a non-zero exit code when the user cannot be created.
        tags: [system]
        justification: |
          A script that creates users must be able to tell that a user was not created.
        children:
          - ReviewCenter-Program-UserAdd-Duplicate
          - ReviewCenter-Cli-UserAdd-MissingNames
          - ReviewCenter-Cli-UserAdd-OptionsWithoutVerb
          - ReviewCenter-Cli-UserAdd-WrongAction
        tests:
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate
          - ReviewCenter_UserAddVerb_NoPassword_ReturnsError

      # ----------------------------------------------------------------------------------------------
      # Git and content sources: where the reviewed code comes from
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-GitRepositories
        title: >-
          The tool shall let a project administrator or a system administrator register git repositories in a
          project by name and location, with an optional user name and token.
        tags: [system]
        justification: |
          Reviews are made from source code in git repositories. The registrations decide which repositories the
          server may read, so the administrators of the project control them.
        children:
          - ReviewCenter-Core-Repositories-LocationAccepted
          - ReviewCenter-Core-Repositories-AdminOnly
          - ReviewCenter-Web-Repositories-Register
          - ReviewCenter-Web-Repositories-RegisterRefused
          - ReviewCenter-Web-Repositories-RegisterNothingCreated
          - ReviewCenter-Web-Repositories-AddPage
        tests:
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields

      - id: ReviewCenter-System-GitRepositories-Name
        title: >-
          The tool shall register a repository only under a name that follows the name rules and that is not used by
          another repository of the project, regardless of letter case.
        tags: [system]
        justification: |
          The reviews and the pages refer to a repository by its name, so the name must be plain and must name one
          repository.
        children:
          - ReviewCenter-Core-Repositories
          - ReviewCenter-Core-Repositories-NameUnique
          - ReviewCenter-Storage-Repositories-UniqueName

      - id: ReviewCenter-System-GitRepositories-LocationRefused
        title: >-
          The tool shall refuse a repository location that git could misuse, that is not an https URL, a file URL, an
          absolute path, or a loopback http URL, or that is malformed.
        tags: [system]
        justification: |
          A location is passed to git on the server, so a hostile location must not be able to reach another host,
          run a helper, or carry a secret.
        children:
          - ReviewCenter-Core-Repositories-LocationRemoteHttp
          - ReviewCenter-Core-Repositories-LocationShape
          - ReviewCenter-Core-Repositories-LocationGitSafety
          - ReviewCenter-Core-Repositories-LocationUrlParts

      - id: ReviewCenter-System-GitRepositories-CredentialsRefused
        title: >-
          The tool shall refuse a user name or a token for a repository that is not valid for the location, that is
          malformed, or that is contained in the name, the user name, or the location of the repository.
        tags: [system]
        justification: |
          A token in the name or the location would show up in pages and in git messages, and a token for a location
          without https would be sent in the clear.
        children:
          - ReviewCenter-Core-Repositories-CredentialsHttps
          - ReviewCenter-Core-Repositories-CredentialsPair
          - ReviewCenter-Core-Repositories-CredentialsUserName
          - ReviewCenter-Core-Repositories-CredentialsToken
          - ReviewCenter-Core-Repositories-CredentialsTokenInText
          - ReviewCenter-Core-Repositories-CredentialsKeptTokenInText
          - ReviewCenter-Core-Repositories-CredentialsTokenCase
          - ReviewCenter-Core-Repositories-CredentialsNotCompared

      - id: ReviewCenter-System-GitRepositories-RefusalStoresNothing
        title: >-
          The tool shall report a violation of the rules of the repository registry as a rule violation that names the
          rule, and leave the stored token, the registration, and the audit trail unchanged.
        tags: [system]
        justification: |
          A refused registration must neither leave a half-written repository nor an audit entry for a change that
          did not happen.
        children:
          - ReviewCenter-Core-Repositories-CredentialsRefusalChangesNothing
          - ReviewCenter-Core-Repositories-RuleViolations

      - id: ReviewCenter-System-GitRepositories-Change
        title: >-
          The tool shall let a project administrator or a system administrator change a registered repository,
          keeping, replacing, or clearing its token as the change says.
        tags: [system]
        justification: |
          A repository moves and a token expires, so the administrators must be able to correct the registration
          without registering the repository again and losing the reviews made from it.
        children:
          - ReviewCenter-Core-Repositories-LocationChange
          - ReviewCenter-Core-Repositories-TokenUpdate
          - ReviewCenter-Core-Repositories-TokenReplaceEmpty
          - ReviewCenter-Storage-Repositories-EncryptedToken-UpdateSemantics
          - ReviewCenter-Web-Repositories-Change
          - ReviewCenter-Web-Repositories-TokenReplace
          - ReviewCenter-Web-Repositories-TokenClear

      - id: ReviewCenter-System-GitRepositories-DisableEnable
        title: >-
          The tool shall let a project administrator or a system administrator disable and enable a registered
          repository, keeping a disabled repository in the registry instead of deleting it.
        tags: [system]
        justification: |
          A repository is disabled, not deleted, so that the reviews made from it keep their reference.
        children:
          - ReviewCenter-Core-Repositories-DisableNotDelete
          - ReviewCenter-Web-Repositories-Disable
          - ReviewCenter-Web-Repositories-Enable

      - id: ReviewCenter-System-GitRepositories-AdminOnly
        title: >-
          The tool shall refuse a user who is neither a project administrator of the project nor a system
          administrator the registry of the repositories of the project and every change of it.
        tags: [system]
        justification: |
          The registrations decide which repositories the server may read, so nobody else may list or change them,
          and an administrator who loses the right loses it at once.
        children:
          - ReviewCenter-Core-Repositories-AdminMemberRefused
          - ReviewCenter-Core-Repositories-AdminNotVisible
          - ReviewCenter-Core-Repositories-AdminRefusalChangesNothing
          - ReviewCenter-Core-Repositories-AdminRecheck
          - ReviewCenter-Web-Repositories
          - ReviewCenter-Web-Repositories-LinkHidden

      - id: ReviewCenter-System-GitRepositories-Persisted
        title: >-
          The tool shall keep the registered repositories in the database so that they are still there, unchanged,
          when the tool is restarted.
        tags: [system]
        justification: |
          A registration that vanished at a restart would break every review that was made from the repository.
        children:
          - ReviewCenter-Storage-Repositories
        tests:
          - StorageSubsystem_Repositories_PersistAcrossReopen

      - id: ReviewCenter-System-GitRepositories-OneProject
        title: >-
          The tool shall keep each repository to its one project, so that a project never sees or reads the
          repositories of another project.
        tags: [system]
        justification: |
          A repository belongs to exactly one project, so that a project never sees another project's repositories.
        children:
          - ReviewCenter-Core-Repositories-OneProject
          - ReviewCenter-Core-Repositories-OwnerAccess
          - ReviewCenter-Storage-Repositories-ProjectOnlyList
          - ReviewCenter-Web-Repositories-NoRegistry

      - id: ReviewCenter-System-GitRepositories-EnabledNamesOnly
        title: >-
          The tool shall offer only the names of the enabled repositories of a project to the members of that
          project.
        tags: [system]
        justification: |
          The members choose a repository for a review, but only an administrator needs to know where it is, and a
          disabled repository must not be chosen.
        children:
          - ReviewCenter-Core-Repositories-OwnerListing
          - ReviewCenter-Core-Repositories-DisabledListing

      - id: ReviewCenter-System-GitContent
        title: >-
          The tool shall read the source code of a registered repository through the git program installed on the
          server, without a shell.
        tags: [system]
        justification: |
          Formal reviews compare file sets with earlier revisions. Using the installed git keeps the behavior the
          same as the developers see, and running it without a shell keeps a hostile repository from harming the
          server.
        children:
          - ReviewCenter-ContentSources-GitAccess
          - ReviewCenter-ContentSources-Content-Bytes
        tests:
          - ContentSourcesSubsystem_RegisteredRepository_IsReadThroughTheRealGitSource

      - id: ReviewCenter-System-GitContent-Mirror
        title: >-
          The tool shall keep a bare mirror of each registered repository.
        tags: [system]
        justification: |
          A local mirror lets a review read many files and revisions without fetching the repository for each one.
        children:
          - ReviewCenter-ContentSources-Mirror

      - id: ReviewCenter-System-GitContent-Revisions
        title: >-
          The tool shall check that a revision of a registered repository exists.
        tags: [system]
        justification: |
          A review of a revision that does not exist would compare nothing, so the user has to learn it at once.
        children:
          - ReviewCenter-ContentSources-Revisions
          - ReviewCenter-ContentSources-Revisions-Branch

      - id: ReviewCenter-System-GitContent-RevisionName
        title: >-
          The tool shall accept as a revision only a plain branch name, tag name, or commit identifier.
        tags: [system]
        justification: |
          A revision is passed to git, so a git revision expression or an option must never get through.
        children:
          - ReviewCenter-Core-FileSelection
          - ReviewCenter-Core-FileSelection-RevisionRule

      - id: ReviewCenter-System-GitContent-Changes
        title: >-
          The tool shall list the files of a revision and the files that changed against an earlier revision, a
          rename being a deletion and an addition.
        tags: [system]
        justification: |
          Formal reviews compare file sets with earlier revisions, and a rename must show the old and the new path
          to the reviewer.
        children:
          - ReviewCenter-ContentSources-Changes
          - ReviewCenter-ContentSources-Changes-Between

      - id: ReviewCenter-System-GitContent-Skipped
        title: >-
          The tool shall skip symbolic links and submodules when it lists the files of a revision.
        tags: [system]
        justification: |
          A symbolic link or a submodule is not a file whose content a reviewer can read, and following it could
          leave the repository.
        children:
          - ReviewCenter-ContentSources-Changes

      - id: ReviewCenter-System-GitContent-SizeLimits
        title: >-
          The tool shall enforce limits on the output of git, on the time of a git call, and on the size of a file
          that it reads.
        tags: [system]
        justification: |
          A hostile or huge repository must not be able to exhaust the memory or the time of the server.
        children:
          - ReviewCenter-ContentSources-Content
          - ReviewCenter-Hosting-GitSettings

      - id: ReviewCenter-System-GitContent-Errors
        title: >-
          The tool shall report a missing git program, an unknown revision, a failed authentication, and a timeout as
          clear errors that name the cause and the repository.
        tags: [system]
        justification: |
          A broken installation or a wrong credential must not leave the user guessing, and the error must not
          reveal the location or a secret.
        children:
          - ReviewCenter-ContentSources-Errors

      - id: ReviewCenter-System-GitContent-DisabledNotRead
        title: >-
          The tool shall not read the source code of a repository that is disabled in its registration.
        tags: [system]
        justification: |
          A repository is disabled when the administrators do not want the server to read it any more.
        children:
          - ReviewCenter-ContentSources-DisabledRepository
          - ReviewCenter-ContentSources-DisabledRepository-NotOffered
          - ReviewCenter-Core-Repositories-DisabledRefused
        tests:
          - ContentSourcesSubsystem_DisabledRepository_IsNotAvailableForReading

      - id: ReviewCenter-System-GitContent-Selection
        title: >-
          The tool shall select the files of a revision with include and exclude patterns, in which the last pattern
          that matches a path decides, with the same result as the glob matching of ReviewMark.
        tags: [system]
        justification: |
          A review covers a defined set of files, and the same patterns must select the same files in the review and
          in the review plan.
        children:
          - ReviewCenter-Core-FileSelection-Match
          - ReviewCenter-Core-FileSelection-Wildcards
          - ReviewCenter-Core-FileSelection-Parse
          - ReviewCenter-Core-FileSelection-Normalize
          - ReviewCenter-Core-FileSelection-PatternLimits
          - ReviewCenter-Core-FileSelection-Bounded
          - ReviewCenter-Core-FileSelection-Compatibility

      - id: ReviewCenter-System-GitContent-SelectionRefused
        title: >-
          The tool shall refuse a file selection that breaks the rules of a selection, with a rule violation that
          names the rule.
        tags: [system]
        justification: |
          A pattern with a backslash, a dot segment, or too many patterns is a mistake or an attack, and must not
          select anything.
        children:
          - ReviewCenter-Core-FileSelection-PatternRule
          - ReviewCenter-Core-FileSelection-PatternUnsafe
          - ReviewCenter-Core-FileSelection-RuleViolations

      - id: ReviewCenter-System-Credentials
        title: >-
          The tool shall keep the access tokens of repositories only encrypted with a key ring that is itself
          protected at rest as the requirement ReviewCenter-System-KeyProtection states.
        tags: [system]
        justification: |
          A token gives access to source code. It must not be readable in a copy of the database. A token that is
          encrypted with keys that lie beside it in plain text would be no better than a plain token, so the
          protection of the keys is part of the promise.
        children:
          - ReviewCenter-ContentSources-Credentials-Encrypted
          - ReviewCenter-Core-Repositories-TokenEncrypted
          - ReviewCenter-Storage-Repositories-EncryptedToken
        tests:
          - CredentialProtector_ProtectUnprotect_RoundTripsAndHidesToken

      - id: ReviewCenter-System-Credentials-KeyRingSurvives
        title: >-
          The tool shall keep the key ring of the access tokens across restarts, so that a token that was entered
          before a restart is still readable after it.
        tags: [system]
        justification: |
          The keys must not be lost silently at a restart, because every stored token would then be unreadable.
        children:
          - ReviewCenter-Hosting-RepositoryServices
        tests:
          - ServerHost_Restart_KeyRingPersisted_TokenStaysReadable

      - id: ReviewCenter-System-Credentials-UnreadableRefused
        title: >-
          The tool shall refuse to use a repository whose stored token cannot be decrypted, naming the repository
          and no secret, instead of using a wrong value.
        tags: [system]
        justification: |
          A wrong token would fail at the git server and could lock the account of the repository, so the tool has
          to stop and tell the operator the cause.
        children:
          - ReviewCenter-Core-Repositories-AccessUnreadable

      - id: ReviewCenter-System-Credentials-GitEnvOnly
        title: >-
          The tool shall hand a token to git only through the environment of the git process, never in the arguments
          of git.
        tags: [system]
        justification: |
          The arguments of a process can be read by every other process of the machine in a process list.
        children:
          - ReviewCenter-ContentSources-Credentials
          - ReviewCenter-ContentSources-Credentials-Access
          - ReviewCenter-Core-Repositories-Access

      - id: ReviewCenter-System-Credentials-NotLogged
        title: >-
          The tool shall never write a token to the logs or to the audit trail, in any form.
        tags: [system]
        justification: |
          Logs and the audit trail are kept, copied, and read by many people, so a token in them would reach all of
          them.
        children:
          - ReviewCenter-ContentSources-Credentials
          - ReviewCenter-ContentSources-Credentials-Display

      - id: ReviewCenter-System-Credentials-NotShown
        title: >-
          The tool shall never show a stored token again on a page or in a message.
        tags: [system]
        justification: |
          A token is only written, never read back, so that looking at a page does not give access to the source
          code.
        children:
          - ReviewCenter-Core-Repositories-TokenNeverReturned
          - ReviewCenter-Core-Repositories-CredentialsMessage
          - ReviewCenter-Web-Repositories-TokenHidden
        tests:
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields

      - id: ReviewCenter-System-Credentials-StartRefused
        title: >-
          The tool shall refuse to start when the key ring cannot be saved.
        tags: [system]
        justification: |
          A tool that started without being able to save its keys would lose them at the next restart.
        children:
          - ReviewCenter-Hosting-KeyRingFailure

      - id: ReviewCenter-System-KeyProtection
        title: >-
          The tool shall protect the Data Protection key ring, which is the root of trust of the stored access
          tokens, at rest with Windows DPAPI.
        tags: [system, security]
        justification: |
          Whoever can read the key ring and the database can read every stored token. Binding the keys to the
          account or machine of the server raises the cost of a stolen backup or disk image.
        children:
          - ReviewCenter-Hosting-KeyRingProtection

      - id: ReviewCenter-System-KeyProtection-Certificate
        title: >-
          The tool shall protect the Data Protection key ring at rest with a certificate that the operator supplies.
        tags: [system, security]
        justification: |
          Encrypting the keys with a secret that is not stored beside them raises the cost of a stolen backup or
          disk image on every operating system.
        children:
          - ReviewCenter-Hosting-KeyRingProtection
        tests:
          - ServerHost_Restart_CertificateKeyRing_ProtectedValueStaysReadable

      - id: ReviewCenter-System-KeyProtection-CertificatePassword
        title: >-
          The tool shall read the password of the certificate that protects the key ring from a setting or from a
          file that the operator names.
        tags: [system, security]
        justification: |
          A password in a file lets a secret store or the operating system hand it over without writing it into
          the settings, while the setting keeps existing deployments working.
        children:
          - ReviewCenter-Utilities-SecretSource
          - ReviewCenter-Utilities-SecretSource-Inline
          - ReviewCenter-Utilities-SecretSource-Neither

      - id: ReviewCenter-System-KeyProtection-Permissions
        title: >-
          The tool shall protect the Data Protection key ring at rest with the permissions of its folder where
          neither Windows DPAPI nor a certificate is available.
        tags: [system, security]
        justification: |
          Some platforms offer no encryption facility for the keys. Restricting the folder to its owner is the best
          protection left, and it keeps the tool usable there.
        children:
          - ReviewCenter-Hosting-KeyRingProtection

      - id: ReviewCenter-System-KeyProtection-PermissionsWarning
        title: >-
          The tool shall log a warning at every start that the key ring is protected only by the permissions of its
          folder and is not encrypted at rest.
        tags: [system, security]
        justification: |
          The tool must be honest where the platform offers no encryption, so that the operator keeps seeing that
          the keys depend on the folder permissions alone.
        children:
          - ReviewCenter-Hosting-KeyRingProtection

      - id: ReviewCenter-System-KeyProtection-SettingsInvalid
        title: >-
          The tool shall refuse to start, with a message that names the setting at fault and no secret, when the
          protection settings of the key ring are invalid.
        tags: [system, security]
        justification: |
          A key ring that is protected differently from what the operator asked for would give a false sense of
          security, so a mistake in the settings must stop the start, and the message must not leak a secret.
        children:
          - ReviewCenter-KeyRingProtection-Certificate-NoPath
          - ReviewCenter-KeyRingProtection-Certificate-Missing
          - ReviewCenter-KeyRingProtection-Certificate-WrongPassword
          - ReviewCenter-KeyRingProtection-Certificate-NoPrivateKey
          - ReviewCenter-KeyRingProtection-Certificate-Rsa
          - ReviewCenter-KeyRingProtection-Certificate-Platform
          - ReviewCenter-KeyRingProtection-Certificate-BothPasswords
          - ReviewCenter-KeyRingProtection-Certificate-PasswordHidden
          - ReviewCenter-KeyRingProtection-Dpapi-OtherSystem
          - ReviewCenter-KeyRingProtection-Validation
          - ReviewCenter-KeyRingProtection-Validation-Scope
          - ReviewCenter-KeyRingProtection-Validation-Report
          - ReviewCenter-KeyRingProtection-Validation-BadType
          - ReviewCenter-ServerHost-KeyProtection-InvalidSettings
          - ReviewCenter-ServerHost-KeyProtection-CertificateUnreadable
          - ReviewCenter-ServerHost-KeyProtection-CertificateWrongPassword
          - ReviewCenter-ServerHost-KeyProtection-CertificateNoSecret
          - ReviewCenter-ServerHost-KeyProtection-DpapiOffWindows
          - ReviewCenter-Utilities-SecretSource-Refusal
          - ReviewCenter-Utilities-SecretSource-NoDisclosure
          - ReviewCenter-Utilities-SecretSource-Conflict

      - id: ReviewCenter-System-KeyProtection-WrongCertificate
        title: >-
          The tool shall refuse to start when the certificate does not open the existing key ring.
        tags: [system, security]
        justification: |
          A wrong or replaced certificate would otherwise start a second ring that makes every stored token
          unreadable, so the operator has to learn of the mismatch at the start.
        children:
          - ReviewCenter-KeyRingProtection-WrongKeyGuard
          - ReviewCenter-KeyRingProtection-WrongKeyGuard-NoCertificate
          - ReviewCenter-KeyRingProtection-WrongKeyGuard-NoKeyCreated
          - ReviewCenter-KeyRingProtection-WrongKeyGuard-UnreadableKeys
          - ReviewCenter-KeyRingProtection-WrongKeyGuard-ContentHidden
          - ReviewCenter-ServerHost-KeyProtection-WrongCertificate
        tests:
          - ServerHost_CreateApplication_WrongCertificateForTheRing_ThrowsClearErrorWithoutSecondKey

      - id: ReviewCenter-System-KeyProtection-RequireEncrypted
        title: >-
          The tool shall refuse to start when the operator requires encrypted keys and the key ring is not
          encrypted.
        tags: [system, security]
        justification: |
          An operator who requires encrypted keys must never run with a plain key ring by a mistake in the settings
          or the platform.
        children:
          - ReviewCenter-KeyRingProtection-Require
          - ReviewCenter-KeyRingProtection-Require-Auto
          - ReviewCenter-KeyRingProtection-Require-PlaintextRing
          - ReviewCenter-ServerHost-KeyProtection-RequireEncrypted

      - id: ReviewCenter-System-KeyProtection-NoSilentReplace
        title: >-
          The tool shall never replace an unreadable key ring silently with a new one.
        tags: [system, security]
        justification: |
          A new ring created in place of an unreadable one would make the stored tokens unreadable without a word,
          so the tool must stop rather than quietly create keys.
        children:
          - ReviewCenter-Hosting-KeyRingProtection
        tests:
          - ServerHost_CreateApplication_WrongCertificateForTheRing_ThrowsClearErrorWithoutSecondKey

      - id: ReviewCenter-System-KeyRestore
        title: >-
          The tool shall refuse to start, with a message that names the key folder, when the key folder holds no key
          and the database holds protected secrets, so that a database that is restored without its key ring is
          detected.
        tags: [system, security]
        justification: |
          The database and the key ring are backed up and restored separately. A database restored without its keys
          would otherwise start with a new, empty ring and make every stored repository token and second-factor secret
          unreadable without a word. The operator must learn that at the restore, before the loss is final.
        children:
          - ReviewCenter-Hosting-SecretScan
          - ReviewCenter-Hosting-KeyRingLost
        tests:
          - ServerHost_CreateApplication_LostRing_RefusesToStartAndCreatesNoKey

      - id: ReviewCenter-System-KeyRestore-AllowNewKeyRing
        title: >-
          The tool shall start with a warning, although the key folder holds no key and the database holds protected
          secrets, for the one start in which the operator sets DataProtection:AllowNewKeyRing.
        tags: [system, security]
        justification: |
          An operator who knowingly accepts the loss of the stored secrets, for example on a test copy, must be able
          to start without restoring the keys, and the warning keeps the decision visible.
        children:
          - ReviewCenter-ServerHost-LostKeyRing-AllowNewKeyRing
          - ReviewCenter-ServerHost-LostKeyRing-AllowWarning

      - id: ReviewCenter-System-KeyRestore-PartialLog
        title: >-
          The tool shall log an error with the counts and the remedy when only some of the protected secrets cannot be
          decrypted.
        tags: [system, security]
        justification: |
          A ring that reads some secrets but not all is a partial restore. The operator needs the counts and the
          remedy to repair it, and the readable secrets keep the server useful, so it does not refuse to start.
        children:
          - ReviewCenter-ServerHost-LostKeyRing-SomeUnreadable

      - id: ReviewCenter-System-KeyRestore-CheckConfigReport
        title: >-
          The tool shall report with the opt-in `--validate --check-config` the protection mode, the key files, the
          protected secrets, and how many of them cannot be decrypted.
        tags: [system, security]
        justification: |
          An operator must be able to test a restore without starting the server, and the counts show at once
          whether the restored database and key ring belong together.
        children:
          - ReviewCenter-Hosting-SecretScan
          - ReviewCenter-ValidationChecks-ConfiguredKeys
          - ReviewCenter-ValidationChecks-ConfiguredKeys-CertificateRing

      - id: ReviewCenter-System-KeyRestore-CheckConfigFails
        title: >-
          The tool shall fail the opt-in `--validate --check-config` when the key ring cannot read the protected
          secrets of the database.
        tags: [system, security]
        justification: |
          A ring that cannot read the secrets makes every stored token unreadable, so the check must fail for a
          script or an operator to notice it before the server is started.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-EmptyRingFails
          - ReviewCenter-ValidationChecks-ConfiguredKeys-OtherRingFails
          - ReviewCenter-ValidationChecks-ConfiguredKeys-WrongCertificate
        tests:
          - ValidationChecks_ConfiguredKeys_EmptyRingWithSecrets_FailsAndCreatesNoKey

      - id: ReviewCenter-System-KeyRestore-CheckConfigSettingsFail
        title: >-
          The tool shall fail the opt-in `--validate --check-config` when the key ring settings are not usable, when
          the ring is not encrypted although encrypted keys are required, or when the database provider is not
          supported.
        tags: [system, security]
        justification: |
          The server would refuse to start with such a configuration, so the check has to fail in the same way
          instead of reporting a healthy ring.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-PlaintextWhenEncryptionRequired
          - ReviewCenter-ValidationChecks-ConfiguredKeys-UnusableSettings
          - ReviewCenter-ValidationChecks-ConfiguredKeys-UnsupportedProvider

      - id: ReviewCenter-System-KeyRestore-CheckConfigReadOnly
        title: >-
          The tool shall create or change no key, folder, or file with the opt-in `--validate --check-config`.
        tags: [system, security]
        justification: |
          The check runs on a restored copy and on a live installation, so it must not be able to cause the loss of
          keys that it is meant to detect.
        children:
          - ReviewCenter-Hosting-SecretScan
          - ReviewCenter-ValidationChecks-ConfiguredKeys-CreatesNothing
        tests:
          - ValidationChecks_ConfiguredKeys_EmptyRingWithSecrets_FailsAndCreatesNoKey

      - id: ReviewCenter-System-KeyRestore-CheckConfigNoSecret
        title: >-
          The tool shall not show a key, a secret, a ciphertext, or a password in the report of the opt-in
          `--validate --check-config`.
        tags: [system, security]
        justification: |
          The report is printed to consoles and pipeline logs, which many people can read.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-NoSecretInReport

      - id: ReviewCenter-System-KeyRestore-CheckConfigNoPath
        title: >-
          The tool shall not show a path other than the key folder in the report of the opt-in
          `--validate --check-config`.
        tags: [system, security]
        justification: |
          A path reveals the layout of the server, so a problem with a file is named by its file name or setting
          only.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-NoPathInReport

      - id: ReviewCenter-System-KeyRotation
        title: >-
          The tool shall let an operator rotate the Data Protection key with the keys reprotect verb, run with the
          server stopped.
        tags: [system, security]
        justification: |
          An old key file, and the certificate that protected it, stays a risk until nothing stored depends on it.
          Without a way to move the stored secrets to a new key, a changed protection mode or a replaced certificate
          could never be completed, and a ring that was plaintext before could never be retired.
        children:
          - ReviewCenter-Cli-KeysReprotect
          - ReviewCenter-Program-KeysReprotect
          - ReviewCenter-Hosting-KeysReprotect
        tests:
          - KeysCommand_Run_SecretsOfTheRing_AreStillReadableAfterwards

      - id: ReviewCenter-System-KeyRotation-Usage
        title: >-
          The tool shall list the keys reprotect verb in its usage text.
        tags: [system, security]
        justification: |
          An operator who has to rotate a key under pressure finds the verb in the help text without reading the
          documentation first.
        children:
          - ReviewCenter-Program-KeysReprotect-Help

      - id: ReviewCenter-System-KeyRotation-Misuse
        title: >-
          The tool shall reject the keys verb with a non-zero exit code when the reprotect action is missing or
          another action is given.
        tags: [system, security]
        justification: |
          A mistyped command must not rotate keys by accident or do nothing and report success.
        children:
          - ReviewCenter-Cli-KeysReprotect-Misuse

      - id: ReviewCenter-System-KeyRotation-Refuses
        title: >-
          The tool shall scan the stored secrets first and refuse the rotation, without changing anything, when a
          secret cannot be read or the key ring cannot be scanned.
        tags: [system, security]
        justification: |
          The command is the one place that writes keys and secrets, so it must be sure first that it loses nothing.
        children:
          - ReviewCenter-KeysCommand-RefusesUnreadable
          - ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableCount
          - ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableIds
          - ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableNoChange
          - ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableNoSecret
          - ReviewCenter-KeysCommand-RefusesUnreadable-EmptyRing
          - ReviewCenter-KeysCommand-RefusesUnreadable-EmptyRingNoKey
          - ReviewCenter-KeysCommand-RefusesUnreadable-SettingsProblem
          - ReviewCenter-KeysCommand-RefusesUnreadable-SettingsNoChange
        tests:
          - KeysCommand_Run_UnreadableSecret_RefusesAndChangesNothing

      - id: ReviewCenter-System-KeyRotation-RefusedExitCode
        title: >-
          The tool shall return exit code 1 when it refuses the key rotation.
        tags: [system, security]
        justification: |
          A script that rotates keys must see the refusal and stop instead of carrying on with the old keys.
        children:
          - ReviewCenter-KeysCommand-RefusesUnreadable
          - ReviewCenter-KeysCommand-RefusesUnreadable-EmptyRing
          - ReviewCenter-KeysCommand-RefusesUnreadable-SettingsProblem
          - ReviewCenter-KeysCommand-RefusesUnreadable-MissingDatabase
        tests:
          - Program_Run_WithKeysReprotectVerb_MissingDatabase_ReportsErrorWithExitCodeOne

      - id: ReviewCenter-System-KeyRotation-NewKey
        title: >-
          The tool shall create a new key with the configured protection when the scan of the stored secrets
          succeeds.
        tags: [system, security]
        justification: |
          A changed protection mode or a replaced certificate takes effect only for keys that are created after the
          change, so the rotation starts with a new key.
        children:
          - ReviewCenter-Hosting-KeysReprotect

      - id: ReviewCenter-System-KeyRotation-Reprotect
        title: >-
          The tool shall protect every stored repository token and second-factor secret again with the new key.
        tags: [system, security]
        justification: |
          Only when nothing stored depends on the old key can the old key file, and the certificate that protected
          it, be retired.
        children:
          - ReviewCenter-Hosting-KeysReprotect
        tests:
          - KeysCommand_Run_SecretsOfTheRing_AreStillReadableAfterwards

      - id: ReviewCenter-System-KeyRotation-Report
        title: >-
          The tool shall report the counts, the keys that stored secrets still reference, and what the operator can
          retire.
        tags: [system, security]
        justification: |
          The operator needs to know that the rotation is complete and which old keys and certificates are no longer
          needed.
        children:
          - ReviewCenter-Hosting-KeysReprotect

      - id: ReviewCenter-System-KeyRotation-NoSecret
        title: >-
          The tool shall never print a secret when it rotates the key.
        tags: [system, security]
        justification: |
          The output of the command reaches consoles and pipeline logs that many people can read.
        children:
          - ReviewCenter-Hosting-KeysReprotect

      # ----------------------------------------------------------------------------------------------
      # Automation: pipelines and tests
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-PersonalAccessTokens
        title: >-
          The tool shall let a signed-in user create personal access tokens for their own account.
        tags: [system]
        justification: |
          Pipelines and scripts that file reviews need a credential that is not a password and that is easy to
          hand out.
        children:
          - ReviewCenter-Core-AccessTokens
          - ReviewCenter-Web-AccessTokens
          - ReviewCenter-Web-AccessTokens-ValueOnce
          - ReviewCenter-Web-AccessTokens-ValueOnceNote
          - ReviewCenter-Web-AccessTokens-Refused
          - ReviewCenter-Web-AccessTokens-RefusedNothing
          - ReviewCenter-Web-AccessTokens-CopyRefused
          - ReviewCenter-Web-AccessTokens-CopyRefusedValueKept
          - ReviewCenter-Web-AccessTokens-RevokeNotOffered
          - ReviewCenter-Storage-AccessTokens
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner
          - StorageSubsystem_AccessTokens_PersistAcrossReopen

      - id: ReviewCenter-System-PersonalAccessTokens-Value
        title: >-
          The tool shall give every new personal access token its own random value that starts with a fixed prefix.
        tags: [system]
        justification: |
          A random value that cannot be guessed or repeated is what keeps one token from being mistaken for
          another, and the prefix lets scanners find a leaked token.
        children:
          - ReviewCenter-Core-AccessTokens-Value

      - id: ReviewCenter-System-PersonalAccessTokens-DisplayId
        title: >-
          The tool shall give every new personal access token a short display id that is not part of its value.
        tags: [system]
        justification: |
          People and the audit trail need a way to name one token without ever writing down its value.
        children:
          - ReviewCenter-Core-AccessTokens-DisplayId

      - id: ReviewCenter-System-PersonalAccessTokens-Name
        title: >-
          The tool shall accept a name of up to 100 characters for a personal access token and keep it without
          leading and trailing white space.
        tags: [system]
        justification: |
          A recognizable name lets the user tell their tokens apart when one has to be taken back.
        children:
          - ReviewCenter-Core-AccessTokens-Name
          - ReviewCenter-Core-AccessTokens-NameLength

      - id: ReviewCenter-System-PersonalAccessTokens-NameRefused
        title: >-
          The tool shall refuse to create a personal access token with a blank name, with a name that contains a
          control character, or with a name longer than 100 characters.
        tags: [system]
        justification: |
          Names appear on pages and in the audit trail, so a name that is empty, unprintable, or unbounded would
          make the token list unreliable.
        children:
          - ReviewCenter-Core-AccessTokens-NameRefused
          - ReviewCenter-Core-AccessTokens-NameTooLong

      - id: ReviewCenter-System-PersonalAccessTokens-List
        title: >-
          The tool shall let a signed-in user see their own personal access tokens, without the values of the
          tokens.
        tags: [system]
        justification: |
          The user must be able to tell which tokens exist, so that a forgotten token can be found and revoked.
        children:
          - ReviewCenter-Core-AccessTokens
          - ReviewCenter-Storage-AccessTokens-List
          - ReviewCenter-Web-AccessTokens-List
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-System-PersonalAccessTokens-Revoke
        title: >-
          The tool shall let a signed-in user revoke a personal access token of their own so that it stops working
          at once.
        tags: [system]
        justification: |
          A leaked or no longer needed token must be possible to take back immediately.
        children:
          - ReviewCenter-Core-AccessTokens-Revoke
          - ReviewCenter-Core-AccessTokens-AuthenticateRevoked
          - ReviewCenter-Storage-AccessTokens-Revoke
          - ReviewCenter-Web-AccessTokens-Revoke
        tests:
          - ApiSubsystem_TokenJourney_CreateUseRevoke_WorksEndToEnd
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-System-PersonalAccessTokens-RevokeRefused
        title: >-
          The tool shall refuse to revoke a personal access token of another user, a token that does not exist,
          and a token that is already revoked.
        tags: [system]
        justification: |
          Nobody may switch off the credential of another user, and a repeated revocation must not rewrite what
          was recorded.
        children:
          - ReviewCenter-Core-AccessTokens-RevokeRefused
          - ReviewCenter-Storage-AccessTokens-Revoke-OwnTokensOnly

      - id: ReviewCenter-System-PersonalAccessTokens-Expiry
        title: >-
          The tool shall give a personal access token an expiry of 30, 90, or 365 days, as the user chooses.
        tags: [system]
        justification: |
          A token that expires by itself limits the harm of a token that is forgotten or leaked.
        children:
          - ReviewCenter-Core-AccessTokens-Expiry

      - id: ReviewCenter-System-PersonalAccessTokens-ExpiryRefused
        title: >-
          The tool shall refuse to create a personal access token with an expiry other than 30, 90, or 365 days.
        tags: [system]
        justification: |
          A fixed set of lifetimes keeps tokens from living for much longer than the policy allows.
        children:
          - ReviewCenter-Core-AccessTokens-ExpiryOther

      - id: ReviewCenter-System-PersonalAccessTokens-Expired
        title: >-
          The tool shall refuse a personal access token from its expiry time on.
        tags: [system]
        justification: |
          An expired token must stop working without anybody having to remember to revoke it.
        children:
          - ReviewCenter-Core-AccessTokens-Expired

      - id: ReviewCenter-System-PersonalAccessTokens-Limit
        title: >-
          The tool shall refuse to create a personal access token for a user who already has 20 active tokens,
          not counting revoked or expired tokens.
        tags: [system]
        justification: |
          A cap on the active tokens of a user keeps the number of credentials that can leak within reach of a
          review.
        children:
          - ReviewCenter-Core-AccessTokens-Limit
          - ReviewCenter-Core-AccessTokens-LimitActive

      - id: ReviewCenter-System-PersonalAccessTokens-ValueOnce
        title: >-
          The tool shall show the value of a personal access token only once, when the token is created.
        tags: [system]
        justification: |
          A value that cannot be shown again cannot be read by somebody who later gains access to the account
          page, and the user is forced to keep the value safely.
        children:
          - ReviewCenter-Core-AccessTokens-ValueOnce
          - ReviewCenter-Web-AccessTokens
          - ReviewCenter-Web-AccessTokens-ValueOnce
          - ReviewCenter-Web-AccessTokens-ValueOnceNote
          - ReviewCenter-Web-AccessTokens-Refused
          - ReviewCenter-Web-AccessTokens-RefusedNothing
          - ReviewCenter-Web-AccessTokens-CopyRefused
          - ReviewCenter-Web-AccessTokens-CopyRefusedValueKept
          - ReviewCenter-Web-AccessTokens-RevokeNotOffered
          - ReviewCenter-Web-AccessTokens-Copy

      - id: ReviewCenter-System-PersonalAccessTokens-HashOnly
        title: >-
          The tool shall keep only a hash of the value of a personal access token, never the value itself.
        tags: [system]
        justification: |
          A copy of the database must not give away working credentials.
        children:
          - ReviewCenter-Core-AccessTokens-HashOnly
          - ReviewCenter-Storage-AccessTokens
          - ReviewCenter-Storage-AccessTokens-Find
        tests:
          - StorageSubsystem_AccessTokens_PersistAcrossReopen

      - id: ReviewCenter-System-PersonalAccessTokens-Authenticate
        title: >-
          The tool shall accept a valid personal access token as its owner, with the current role of the owner.
        tags: [system]
        justification: |
          A token keeps working only as long as the rights of its owner say so, so a change of role takes effect
          at once.
        children:
          - ReviewCenter-Core-AccessTokens-Authenticate
          - ReviewCenter-Core-AccessTokens-TemporaryPasswordCleared
        tests:
          - ApiSubsystem_TokenJourney_CreateUseRevoke_WorksEndToEnd
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-System-PersonalAccessTokens-OwnerNotAllowed
        title: >-
          The tool shall refuse to create or use a personal access token of a user who is not allowed to sign in.
        tags: [system]
        justification: |
          The tokens of a user keep working only while the user is allowed to sign in, so a disabled, locked out,
          or unknown user, or a user with a temporary password, cannot get around that with a token.
        children:
          - ReviewCenter-Core-AccessTokens-OwnerRefused
          - ReviewCenter-Core-AccessTokens-AuthenticateOwner
          - ReviewCenter-Core-AccessTokens-TemporaryPassword

      - id: ReviewCenter-System-PersonalAccessTokens-Refused
        title: >-
          The tool shall refuse a missing, malformed, unknown, or revoked personal access token with one generic
          answer.
        tags: [system]
        justification: |
          One answer for every kind of refusal gives a client that guesses tokens nothing to tell them apart.
        children:
          - ReviewCenter-Core-AccessTokens-AuthenticateRefused
          - ReviewCenter-Api-TokenJourney-Refusal
        tests:
          - ApiSubsystem_TokenJourney_CreateUseRevoke_WorksEndToEnd
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-System-PersonalAccessTokens-Throttle
        title: >-
          The tool shall refuse too many refused personal access tokens from one client address.
        tags: [system]
        justification: |
          Limiting the failed attempts of one client address makes guessing a token impractical.
        children:
          - ReviewCenter-Api-TokenJourney-Throttle

      - id: ReviewCenter-System-PersonalAccessTokens-NoTokenManagement
        title: >-
          The tool shall refuse to create or to revoke a personal access token for a request that came through a
          personal access token.
        tags: [system]
        justification: |
          A leaked token must not be able to mint more tokens that outlive its own revocation.
        children:
          - ReviewCenter-Core-AccessTokens-NoTokenManagement
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-System-PersonalAccessTokens-LastUsed
        title: >-
          The tool shall show the user when each personal access token was last used.
        tags: [system]
        justification: |
          A token that is used when its owner does not expect it is the first sign of a leak.
        children:
          - ReviewCenter-Core-AccessTokens-LastUsed
          - ReviewCenter-Storage-AccessTokens-Touch

      - id: ReviewCenter-System-PersonalAccessTokens-LastUsedThrottle
        title: >-
          The tool shall record the last use of a personal access token again only when five minutes have passed
          since the last record.
        tags: [system]
        justification: |
          A busy pipeline must not turn every request into a database write or make parallel requests collide.
        children:
          - ReviewCenter-Core-AccessTokens-LastUsedThrottle
          - ReviewCenter-Storage-AccessTokens-Touch-CompareAndSet

      - id: ReviewCenter-System-PersonalAccessTokens-Help
        title: >-
          The tool shall explain the personal access tokens in a help topic that the account page links to.
        tags: [system]
        justification: |
          A user who creates a token needs to find out how to use it without leaving the tool.
        children:
          - ReviewCenter-Web-AccessTokens-HelpTopic
          - ReviewCenter-Web-AccessTokens-HelpLink

      - id: ReviewCenter-System-PersonalAccessTokens-Audit
        title: >-
          The tool shall record the creation and the revocation of a personal access token in the audit trail.
        tags: [system]
        justification: |
          The audit trail has to show who made a credential and when it was taken back, so that every action done
          with it stays attributable.
        children:
          - ReviewCenter-Core-AccessTokens-Audit
          - ReviewCenter-Core-AccessTokens-AuditRevoked
          - ReviewCenter-Core-AccessTokens-AuditExpiry
          - ReviewCenter-Storage-AccessTokens-Audit

      - id: ReviewCenter-System-PersonalAccessTokens-AuditRefusedUse
        title: >-
          The tool shall record each refused use of a personal access token in the audit trail.
        tags: [system]
        justification: |
          Repeated refused attempts are how a stolen or guessed token shows itself, so they have to be on record.
        children:
          - ReviewCenter-Api-TokenJourney-FailureAudit

      - id: ReviewCenter-System-PersonalAccessTokens-AuditNoValue
        title: >-
          The tool shall keep the value and the hash of a personal access token out of the audit trail.
        tags: [system]
        justification: |
          The audit trail is read by many people and kept for a long time, so it must never hold a working
          credential.
        children:
          - ReviewCenter-Core-AccessTokens-AuditNoValue

      - id: ReviewCenter-System-PersonalAccessTokens-NoValueInLog
        title: >-
          The tool shall never write the value of a personal access token to its log.
        tags: [system]
        justification: |
          Logs are shipped to places that are less protected than the database.
        children:
          - ReviewCenter-Api-TokenJourney-NoTokenInLog

      - id: ReviewCenter-System-ApiAccess
        title: >-
          The tool shall offer an HTTP API under /api that a client can call with a personal access token.
        tags: [system]
        justification: |
          Creating a draft for every pull request from a pipeline and filing the attestation of a signed review
          with the release take the manual work out of the process.
        children:
          - ReviewCenter-Hosting-ApiServices

      - id: ReviewCenter-System-ApiAccess-Document
        title: >-
          The tool shall describe its HTTP API in an OpenAPI document that is served without a token.
        tags: [system]
        justification: |
          Clients and pipeline authors generate and check their calls from the description of the API, and they
          have to read it before they own a token.
        children:
          - ReviewCenter-Api-Document
          - ReviewCenter-Api-Document-Scheme
          - ReviewCenter-Api-Document-AnonymousOperations

      - id: ReviewCenter-System-ApiAccess-DocumentSnapshot
        title: >-
          The tool shall serve the same OpenAPI document at every start, matching the document that is kept with
          the documentation.
        tags: [system]
        justification: |
          A description of the API that drifts from the documentation misleads the people who build on it.
        children:
          - ReviewCenter-Api-Document-Stable
          - ReviewCenter-Api-Document-Snapshot

      - id: ReviewCenter-System-ApiAccess-ProblemDocument
        title: >-
          The tool shall answer an invalid API request, a request beyond the review limits, and an address under
          /api that does not exist with a problem document that names the cause.
        tags: [system]
        justification: |
          A client in a pipeline has to be able to tell a mistake of its own from a failure of the tool without a
          person reading the response.
        children:
          - ReviewCenter-Api-ReviewJourney-ProblemDocument
          - ReviewCenter-Api-ReviewJourney-Limits
          - ReviewCenter-Api-ReviewJourney-UnknownAddress
          - ReviewCenter-Hosting-ApiServices

      - id: ReviewCenter-System-ApiAccess-TokenSchemes
        title: >-
          The tool shall accept a personal access token for the API when it is sent as a bearer token or as the
          password of HTTP Basic credentials.
        tags: [system]
        justification: |
          Tools such as ReviewMark can send only Basic credentials, while scripts usually send a bearer token, so
          both forms have to reach the same account.
        children:
          - ReviewCenter-Api-TokenJourney
          - ReviewCenter-Api-TokenJourney-Basic
        tests:
          - ApiSubsystem_EvidenceJourney_BasicCredentials_ReadIndexAndFollowLink_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-List
        title: >-
          The tool shall let a client with a personal access token list the projects its owner may see and the
          reviews of those projects.
        tags: [system]
        justification: |
          A pipeline has to find the project and the review it files into without a person looking them up.
        children:
          - ReviewCenter-Api-ReviewJourney
          - ReviewCenter-Api-ReviewJourney-ListProjects
          - ReviewCenter-Api-ProjectAccess-ListProjects
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-Read
        title: >-
          The tool shall let a client with a personal access token read a review of a project its owner may see.
        tags: [system]
        justification: |
          A pipeline has to know the state of a review before it decides what to do next.
        children:
          - ReviewCenter-Api-ReviewJourney-Read
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-CreateFromFiles
        title: >-
          The tool shall let a client with a personal access token create a review draft from uploaded files.
        tags: [system]
        justification: |
          A pipeline that has built the files of a change can file the draft without a person uploading them.
        children:
          - ReviewCenter-Api-ReviewJourney-CreateUpload
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-CreateFromRepository
        title: >-
          The tool shall let a client with a personal access token create a review draft from the changes of a
          repository.
        tags: [system]
        justification: |
          A pipeline can file a draft for every pull request by naming the revisions, without handing over files.
        children:
          - ReviewCenter-Api-ReviewJourney-CreateRepository

      - id: ReviewCenter-System-ApiAccess-Marked
        title: >-
          The tool shall mark a review that a client created with a personal access token as created through the
          API, and shall name the token, never its value, in the audit entry of the review.
        tags: [system]
        justification: |
          A reader of a review has to see that no person drafted it, and the audit trail has to show which
          credential did.
        children:
          - ReviewCenter-Api-ReviewJourney-Marked
          - ReviewCenter-Core-AccessTokens-CreatedBy
          - ReviewCenter-Core-AccessTokens-CreatedViaApi
          - ReviewCenter-Core-AccessTokens-CreatedViaAudit
          - ReviewCenter-Storage-AccessTokens-CreatorFlag
        tests:
          - CoreSubsystem_TokenActor_CreatesFlaggedReviewButCannotSign

      - id: ReviewCenter-System-ApiAccess-NotMarkedPerson
        title: >-
          The tool shall not mark a review that a signed-in user created as created through the API.
        tags: [system]
        justification: |
          The mark only helps a reader if it is on the reviews that were filed by a pipeline and on no others.
        children:
          - ReviewCenter-Core-AccessTokens-CreatedViaPerson

      - id: ReviewCenter-System-ApiAccess-Attestation
        title: >-
          The tool shall let a client with a personal access token download the attestation of a signed review.
        tags: [system]
        justification: |
          Filing the attestation with the release takes the manual work out of the release process.
        children:
          - ReviewCenter-Api-ReviewJourney-Attestation
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-EvidenceIndex
        title: >-
          The tool shall let a client with a personal access token read the evidence index of a project in the form
          that ReviewMark reads.
        tags: [system]
        justification: |
          ReviewMark has to check the evidence of a project against the files of a release without a person
          fetching it.
        children:
          - ReviewCenter-Api-EvidenceJourney
        tests:
          - ApiSubsystem_EvidenceJourney_BasicCredentials_ReadIndexAndFollowLink_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-EvidenceRevoked
        title: >-
          The tool shall refuse a revoked personal access token that was used to read the evidence index.
        tags: [system]
        justification: |
          Taking a token back must also cut off a pipeline that reads the evidence with it.
        children:
          - ReviewCenter-Api-EvidenceJourney-Revoked
        tests:
          - ApiSubsystem_EvidenceJourney_BasicCredentials_ReadIndexAndFollowLink_WorksEndToEnd

      - id: ReviewCenter-System-ApiAccess-SameRules
        title: >-
          The tool shall give a client with a personal access token the same view of projects and reviews that its
          owner has on the web pages.
        tags: [system]
        justification: |
          The API must not be a way around what a person may see, so the rules of the pages apply to a token as
          they do to its owner.
        children:
          - ReviewCenter-Api-ReviewJourney-Masking
          - ReviewCenter-Api-ProjectAccess-Served
          - ReviewCenter-Api-ProjectAccess-Checklist
          - ReviewCenter-Api-ProjectAccess-ListProjects

      - id: ReviewCenter-System-ApiAccess-ProjectHidden
        title: >-
          The tool shall answer a request of a personal access token for a project that its owner may not see as
          for a project that does not exist.
        tags: [system]
        justification: |
          Telling a client that a project exists but is closed to it would reveal the existence of the project.
        children:
          - ReviewCenter-Api-ProjectAccess
          - ReviewCenter-Api-ProjectAccess-Checklist
          - ReviewCenter-Api-ProjectAccess-SameAnswer
          - ReviewCenter-Api-ProjectAccess-Removed
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject

      - id: ReviewCenter-System-ApiAccess-NoSigning
        title: >-
          The tool shall not let a personal access token sign a review.
        tags: [system]
        justification: |
          The people stay the only ones who sign, so that a signature still proves that a person was there.
        children:
          - ReviewCenter-Api-Isolation
          - ReviewCenter-Core-AccessTokens-NoSigning
          - ReviewCenter-Core-AccessTokens-NoSigningQuiet
        tests:
          - ApiSubsystem_TokenPrincipal_SigningAndWebPages_AreNotReachable
          - CoreSubsystem_TokenActor_CreatesFlaggedReviewButCannotSign

      - id: ReviewCenter-System-ApiAccess-NoReviewerChange
        title: >-
          The tool shall not let a personal access token arrange the reviewers of a review.
        tags: [system]
        justification: |
          Who has to review is decided by people, so a credential that a pipeline holds must not be able to
          remove a reviewer or add one that suits it.
        children:
          - ReviewCenter-Api-Isolation
          - ReviewCenter-Core-AccessTokens-NoSlotChange

      - id: ReviewCenter-System-ApiAccess-NoWebPages
        title: >-
          The tool shall not let a personal access token open a web page or use the sign-in endpoints.
        tags: [system]
        justification: |
          A token is a credential for programs, so it must not give an interactive session with the rights of a
          person.
        children:
          - ReviewCenter-Api-Isolation-NoWebPages
        tests:
          - ApiSubsystem_TokenPrincipal_SigningAndWebPages_AreNotReachable

      - id: ReviewCenter-System-ApiAccess-NoCookie
        title: >-
          The tool shall not accept a session cookie for the API.
        tags: [system]
        justification: |
          A cookie that a browser sends by itself must not be able to drive the API on behalf of a signed-in user.
        children:
          - ReviewCenter-Api-Isolation-NoCookie

      - id: ReviewCenter-System-TestIds
        title: >-
          The tool shall give every interactive element of its web pages a stable data-testid attribute, so that
          automated tests and the Puppet tool can address it.
        tags: [system]
        justification: |
          The web interface is verified and driven by automation. Addressing elements by stable identifiers,
          rather than by text or layout, keeps that automation working as the pages evolve.
        children:
          - ReviewCenter-Web-TestIds
          - ReviewCenter-Web-TestIds-Format
          - ReviewCenter-Web-TestIds-Unique
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndTagline
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId

      # ----------------------------------------------------------------------------------------------
      # Operation and qualification: running, configuring, and qualifying the tool
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-CommandLine
        title: >-
          The tool shall show its version on request.
        tags: [system]
        justification: |
          A version that can always be read identifies the release that produced a record (EU GMP Annex 11
          clause 4, validation).
        children:
          - ReviewCenter-Program-Version
          - ReviewCenter-Cli-Version
          - ReviewCenter-Cli-ArgumentParsing
        tests:
          - ReviewCenter_VersionFlag_Provided_OutputsVersion

      - id: ReviewCenter-System-CommandLine-Help
        title: >-
          The tool shall show its usage on request.
        tags: [system]
        justification: |
          Usage output lets operators help themselves without reading the documentation first.
        children:
          - ReviewCenter-Program-Help
          - ReviewCenter-Program-Help-CheckConfig
          - ReviewCenter-Cli-Help
          - ReviewCenter-Cli-ArgumentParsing
        tests:
          - ReviewCenter_HelpFlag_Provided_OutputsUsageInformation

      - id: ReviewCenter-System-CommandLine-Banner
        title: >-
          The tool shall show a banner when no action is requested.
        tags: [system]
        justification: |
          A run without an action should say which tool and which release it is instead of doing nothing quietly.
        children:
          - ReviewCenter-Program-Banner
        tests:
          - ReviewCenter_NoArguments_Invoked_DisplaysBanner

      - id: ReviewCenter-System-CommandLine-Silent
        title: >-
          The tool shall suppress its console output when asked to be silent.
        tags: [system]
        justification: |
          A pipeline that parses or archives its own output must be able to keep the tool from adding to it.
        children:
          - ReviewCenter-Cli-Silent
          - ReviewCenter-Cli-OutputChannels
        tests:
          - ReviewCenter_SilentFlag_Provided_SuppressesOutput

      - id: ReviewCenter-System-CommandLine-LogFile
        title: >-
          The tool shall write its output to a log file when asked.
        tags: [system]
        justification: |
          A log file keeps a record of a run after the console is gone.
        children:
          - ReviewCenter-Cli-Log
        tests:
          - ReviewCenter_LogFlag_Provided_WritesOutputToFile

      - id: ReviewCenter-System-CommandLine-LogFileFails
        title: >-
          The tool shall report an error and return a non-zero exit code when the log file cannot be opened.
        tags: [system]
        justification: |
          A run that was asked to keep a record must not carry on without one.
        children:
          - ReviewCenter-Cli-Log-OpenFailure

      - id: ReviewCenter-System-CommandLine-InvalidArgument
        title: >-
          The tool shall report an error message that names the argument for an unrecognized argument, a malformed
          option value, or a missing option value, and write it to the error output.
        tags: [system]
        justification: |
          An operator who mistyped an option has to be told which one, without the message being mixed into the
          output that a script reads.
        children:
          - ReviewCenter-Cli-InvalidArgs
          - ReviewCenter-Cli-InvalidArgs-Malformed
          - ReviewCenter-Cli-InvalidArgs-MissingValue
          - ReviewCenter-Cli-ErrorOutput
        tests:
          - ReviewCenter_UnknownArgument_Provided_ReturnsError

      - id: ReviewCenter-System-CommandLine-FailureExitCode
        title: >-
          The tool shall return a non-zero exit code on failure, including for an unrecognized argument.
        tags: [system]
        justification: |
          A reliable exit code lets a pipeline surface a misconfiguration instead of carrying on with it.
        children:
          - ReviewCenter-Program-ExitCode
          - ReviewCenter-Cli-ExitCode
        tests:
          - ReviewCenter_UnknownArgument_Provided_ReturnsError

      - id: ReviewCenter-System-CommandLine-SuccessExitCode
        title: >-
          The tool shall return an exit code of zero when a request succeeded.
        tags: [system]
        justification: |
          A pipeline has to be able to treat a zero exit code as success without reading the output.
        tests:
          - ReviewCenter_VersionFlag_Provided_OutputsVersion
          - ReviewCenter_HelpFlag_Provided_OutputsUsageInformation
          - ReviewCenter_NoArguments_Invoked_DisplaysBanner

      - id: ReviewCenter-System-Qualification
        title: >-
          The tool shall qualify itself in its deployment environment when the validate flag is provided, by
          exercising the behaviors it relies on (git, a complete review workflow, the fingerprint, password hashing,
          the second factor codes, the audit chain, the signed attestation, and the web host).
        tags: [system]
        justification: |
          Regulated environments require qualification evidence to show that the tool functions correctly in its
          deployment environment before it is used to produce compliance artifacts (21 CFR Part 11 section
          11.10(a), validation; EU GMP Annex 11 clause 4). The validation exercises the real behaviors that the
          integrity guarantees rest on. The same self-validation run on each supported platform is the evidence for
          the platform requirements.
        children:
          - ReviewCenter-Program-Validate
          - ReviewCenter-Cli-Validate
          - ReviewCenter-SelfTest-Qualification
        tests:
          - ReviewCenter_ValidateFlag_Provided_RunsValidation

      - id: ReviewCenter-System-Qualification-Hermetic
        title: >-
          The tool shall run the qualification in a hermetic way that never touches the configured database or key
          ring and reads no configuration of the deployment.
        tags: [system]
        justification: |
          A qualification run on a production installation must not be able to change or lose the data of that
          installation.
        children:
          - ReviewCenter-SelfTest-Hermetic-NoConfiguration
          - ReviewCenter-SelfTest-Hermetic-NoDatabase

      - id: ReviewCenter-System-Qualification-TempFolder
        title: >-
          The tool shall create every file that the qualification needs in a temporary folder that is removed at the
          end of the run.
        tags: [system]
        justification: |
          A qualification run must leave nothing behind that a later run or the installation could pick up.
        children:
          - ReviewCenter-SelfTest-Hermetic

      - id: ReviewCenter-System-Qualification-NoPort
        title: >-
          The tool shall bind no configured port during the qualification and listen only on an ephemeral loopback
          port.
        tags: [system]
        justification: |
          A qualification run must not collide with the service that runs on the configured port, or be reachable
          from the network.
        children:
          - ReviewCenter-SelfTest-Hermetic-NoPort

      - id: ReviewCenter-System-Qualification-Results
        title: >-
          The tool shall write the outcome of the qualification to a TRX or JUnit result file chosen by the
          `--results` flag.
        tags: [system]
        justification: |
          The validation produces a standard result file that quality systems can file as qualification evidence.
        children:
          - ReviewCenter-Cli-Results
          - ReviewCenter-SelfTest-ResultsOutput
        tests:
          - ReviewCenter_ValidateWithXmlResults_Requested_GeneratesJUnitFile
          - SelfTestSubsystem_ValidationWorkflow_WithTrxFile_GeneratesResults

      - id: ReviewCenter-System-Qualification-ResultAlias
        title: >-
          The tool shall accept `--result` as a legacy alias of the `--results` flag.
        tags: [system]
        justification: |
          Pipelines that were written for the earlier flag keep producing their result files without a change.
        children:
          - ReviewCenter-Cli-ResultAlias
        tests:
          - ReviewCenter_ResultAlias_LegacyFlag_WritesResultsFile

      - id: ReviewCenter-System-Qualification-Depth
        title: >-
          The tool shall write the report of the qualification at a heading depth chosen by the `--depth` flag.
        tags: [system]
        justification: |
          The report is embedded in larger documents, so its headings have to fit under the heading of the place
          where it is filed.
        children:
          - ReviewCenter-Cli-Depth
        tests:
          - ReviewCenter_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel

      - id: ReviewCenter-System-Qualification-FailureExitCode
        title: >-
          The tool shall return a non-zero exit code when the qualification fails.
        tags: [system]
        justification: |
          A pipeline has to stop on a failed qualification instead of carrying on with a tool that does not work.
        children:
          - ReviewCenter-SelfTest-Qualification

      - id: ReviewCenter-System-Qualification-UnsupportedFormat
        title: >-
          The tool shall return a non-zero exit code when the result file cannot be written in a supported format.
        tags: [system]
        justification: |
          A silent loss of the evidence, such as an unsupported result file format, must fail the run.
        children:
          - ReviewCenter-SelfTest-InvalidExtension
          - ReviewCenter-SelfTest-InvalidExtension-ExitCode
        tests:
          - SelfTestSubsystem_ValidationWorkflow_WithUnsupportedExtension_EmitsErrorAndNoFile

      - id: ReviewCenter-System-Qualification-CheckConfig
        title: >-
          The tool shall check the configured database and key ring in a qualification run only when the opt-in
          `--check-config` flag is provided together with the validate flag.
        tags: [system]
        justification: |
          An operator can test a restored installation with the real database and key ring, and a default run stays
          independent of the installation.
        children:
          - ReviewCenter-Cli-CheckConfig

      - id: ReviewCenter-System-Qualification-CheckConfigRequiresValidate
        title: >-
          The tool shall reject the `--check-config` flag when the validate flag is not provided.
        tags: [system]
        justification: |
          The check is a part of a qualification run. Accepting the flag alone would silently do nothing.
        children:
          - ReviewCenter-Cli-CheckConfig-RequiresValidate

      - id: ReviewCenter-System-Qualification-CheckConfigReadOnly
        title: >-
          The tool shall open the configured database read-only and create no database file when it checks the
          configuration.
        tags: [system]
        justification: |
          The check looks at a live or restored installation, so it must not be able to damage the data that it
          inspects.
        children:
          - ReviewCenter-SelfTest-Qualification

      - id: ReviewCenter-System-Qualification-CheckConfigSkipped
        title: >-
          The tool shall skip the check of the key ring, with the reason, when no database is configured, when the
          configured database file does not exist yet, or when there is no key folder and no protected secret.
        tags: [system]
        justification: |
          A check that has nothing to look at is neither a pass nor a failure, and the reason tells the operator why
          nothing was checked.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-NothingConfiguredSkipped
          - ReviewCenter-ValidationChecks-ConfiguredKeys-MissingDatabaseSkipped
          - ReviewCenter-ValidationChecks-ConfiguredKeys-NoFolderNoSecretsSkipped

      - id: ReviewCenter-System-Qualification-CheckConfigAttestationKey
        title: >-
          The tool shall report the subject, the thumbprint, and the validity of the attestation key when it checks
          the configuration, or that the key will be created at the first start.
        tags: [system]
        justification: |
          The attestation key signs the evidence of the reviews, so the operator must see which key the server will
          use before the first review is signed.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-AttestationKeyReport
          - ReviewCenter-ValidationChecks-ConfiguredKeys-FileProviderReport

      - id: ReviewCenter-System-Qualification-CheckConfigAttestationKeyFails
        title: >-
          The tool shall fail the check of the configuration, naming the file or the setting to correct, when the
          attestation key cannot be used.
        tags: [system]
        justification: |
          A server that could not sign its evidence must be found before the first review is signed.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-UnreadableAttestationKey
          - ReviewCenter-ValidationChecks-ConfiguredKeys-AttestationIoError
          - ReviewCenter-ValidationChecks-ConfiguredKeys-UnsupportedAttestationProvider
          - ReviewCenter-ValidationChecks-ConfiguredKeys-FileProviderNoPassword
          - ReviewCenter-ValidationChecks-ConfiguredKeys-FileProviderMissingFile
          - ReviewCenter-ValidationChecks-ConfiguredKeys-FileProviderNoPath
          - ReviewCenter-ValidationChecks-ConfiguredKeys-FileProviderWrongPassword
          - ReviewCenter-ValidationChecks-ConfiguredKeys-FileProviderUntrustedKey

      - id: ReviewCenter-System-Qualification-CheckConfigAttestationKeyWarning
        title: >-
          The tool shall add a warning to the report of the check of the configuration, and still pass, when a
          plaintext attestation key file of an earlier version is present or the attestation certificate ends soon or
          has ended.
        tags: [system]
        justification: |
          These findings do not stop the server, but the operator should act on them before the attestation key
          stops being accepted.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredKeys-LegacyAttestationWarning
          - ReviewCenter-ValidationChecks-ConfiguredKeys-ExpiryWarning
          - ReviewCenter-ValidationChecks-ConfiguredKeys-ExpiryWarning-Ended

      - id: ReviewCenter-System-Serve
        title: >-
          The tool shall run the ReviewCenter web server until it is stopped when the serve verb is provided.
        tags: [system]
        justification: |
          ReviewCenter is delivered as a web service. Operators need a single command that starts the service in
          the foreground, so that it can be run under a process supervisor, a container, or by a developer.
        children:
          - ReviewCenter-Program-Serve
          - ReviewCenter-Program-Serve-Help
          - ReviewCenter-Cli-Serve

      - id: ReviewCenter-System-Serve-Urls
        title: >-
          The tool shall listen on the URL given by the `--urls` option when it runs the web server.
        tags: [system]
        justification: |
          Operators choose the address and port so that the service can coexist with other services and sit behind
          a reverse proxy.
        children:
          - ReviewCenter-Cli-Urls
        tests:
          - ReviewCenter_ServeWithUrls_PortSpecified_ListensOnRequestedPort

      - id: ReviewCenter-System-Serve-UrlsRequireServe
        title: >-
          The tool shall report an error and return a non-zero exit code when `--urls` is given without the serve
          verb.
        tags: [system]
        justification: |
          A misplaced option must not let a mistyped command silently start nothing.
        children:
          - ReviewCenter-Cli-Urls-RequiresServe
        tests:
          - ReviewCenter_UrlsWithoutServe_Provided_ReturnsError

      - id: ReviewCenter-System-Serve-AddressError
        title: >-
          The tool shall report an error and return a non-zero exit code when the requested address cannot be used.
        tags: [system]
        justification: |
          An address that is already in use must not make the tool appear to run, or start something other than
          what was requested.
        children:
          - ReviewCenter-Program-Serve-AddressError
        tests:
          - ReviewCenter_ServeVerb_PortInUse_ReturnsError

      - id: ReviewCenter-System-Serve-Health
        title: >-
          The tool shall answer requests for the /health URL with HTTP status 200 and the text Healthy while the
          web server runs.
        tags: [system]
        justification: |
          A health URL gives reverse proxies, orchestrators, and monitoring a simple, unauthenticated way to find
          out whether the service is up.
        children:
          - ReviewCenter-Hosting-Health
          - ReviewCenter-Hosting-Health-Routes
        tests:
          - ReviewCenter_ServeVerb_Started_HealthEndpointReturnsHealthy

      - id: ReviewCenter-System-Serve-CleanStop
        title: >-
          The tool shall stop the web server cleanly on request and leave the exit code at zero.
        tags: [system]
        justification: |
          A supervisor or a container stops the service with a signal, and it must not report that as a failure.
        children:
          - ReviewCenter-Program-Serve-CleanStop
        tests:
          - ubuntu@ReviewCenter_ServeVerb_TerminationRequested_StopsGracefullyWithExitCodeZero

      - id: ReviewCenter-System-Serve-Logging
        title: >-
          The tool shall write its start-up and request activity as structured log entries.
        tags: [system]
        justification: |
          Structured log entries let the running service be monitored and audited.
        children:
          - ReviewCenter-Hosting-Logging
          - ReviewCenter-Hosting-Logging-FrameworkEntries
        tests:
          - ReviewCenter_ServeVerb_Started_LogsStartupEntryWithListenUrl

      - id: ReviewCenter-System-WebInterface
        title: >-
          The tool shall serve a home page titled ReviewCenter at the root URL of the web server.
        tags: [system]
        justification: |
          The home page is the entry point of the web user interface, and proves that pages are delivered to a
          browser.
        children:
          - ReviewCenter-Web-HomePage
          - ReviewCenter-Web-HomePage-NotFound
          - ReviewCenter-Web-HomePage-NotFoundOther
          - ReviewCenter-Web-HomePage-GetStarted
          - ReviewCenter-Web-HomePage-AdminLinks
          - ReviewCenter-Web-HomePage-AdminLinksHidden
          - ReviewCenter-Web-HomePage-HeaderLink
          - ReviewCenter-Web-HomePage-Footer
          - ReviewCenter-Web-HomePage-Document
          - ReviewCenter-Web-HomePage-ClientScript
          - ReviewCenter-Web-HomePage-ClientCopyHelper
          - ReviewCenter-Web-HomePage-ClientFocusHelper
          - ReviewCenter-Web-HomePage-ClientCtrlEnter
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndTagline

      - id: ReviewCenter-System-WebInterface-Tagline
        title: >-
          The tool shall show the product name and the tagline on the home page.
        tags: [system]
        justification: |
          A visitor learns what the product is from the first page, before signing in.
        children:
          - ReviewCenter-Web-HomePage-Tagline
          - ReviewCenter-Web-HomePage-NoLinks
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndTagline

      - id: ReviewCenter-System-WebInterface-ClientScript
        title: >-
          The tool shall serve its pages with the client script that its interactive pages depend on, so that a
          page is marked as interactive once the live connection is established.
        tags: [system]
        justification: |
          Interactive pages only work with the client script, and automation has to know when a page is ready to
          be driven.
        children:
          - ReviewCenter-Web-Interactive
          - ReviewCenter-Web-Interactive-Live
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndTagline

      - id: ReviewCenter-System-WebInterface-About
        title: >-
          The tool shall serve an About page to every visitor, including one who is not signed in.
        tags: [system]
        justification: |
          Users must be able to learn which version runs before they can sign in (EU GMP Annex 11 clause 2,
          personnel who are trained to use it).
        children:
          - ReviewCenter-Web-Help-About
        tests:
          - ReviewCenter_ServeVerb_Started_ServesHelpAndAboutPagesWithoutSignIn

      - id: ReviewCenter-System-WebInterface-Help
        title: >-
          The tool shall serve its built-in Help pages to every visitor, including one who is not signed in.
        tags: [system]
        justification: |
          Users must be able to learn how to use the product without an administrator handing out documents (EU
          GMP Annex 11 clause 2, personnel who are trained to use it).
        children:
          - ReviewCenter-Web-Help
          - ReviewCenter-Web-Help-HeaderLink
          - ReviewCenter-Web-Help-HeaderLinkBeforeSignIn
          - ReviewCenter-Web-Help-TopicPages
          - ReviewCenter-Web-Help-SigningTopic
          - ReviewCenter-Web-Help-ReadingReviewTopic
          - ReviewCenter-Web-Help-Navigation
          - ReviewCenter-Web-Help-NavigationEnds
          - ReviewCenter-Web-Help-MembersTopic
        tests:
          - ReviewCenter_ServeVerb_Started_ServesHelpAndAboutPagesWithoutSignIn

      - id: ReviewCenter-System-WebInterface-UnknownTopic
        title: >-
          The tool shall show a friendly message for a Help topic that does not exist.
        tags: [system]
        justification: |
          A visitor who follows an outdated link should find the way back instead of facing an error page.
        children:
          - ReviewCenter-Web-Help-UnknownTopic

      - id: ReviewCenter-System-Persistence
        title: >-
          The tool shall keep all its records in the database named by the Database settings.
        tags: [system]
        justification: |
          Review records must outlive the server process, and the operator must be able to choose where the data
          lives so that it can be backed up and protected like any other record (21 CFR Part 11 section 11.10(c),
          protection of records to enable their accurate and ready retrieval).
        children:
          - ReviewCenter-Hosting-Database
          - ReviewCenter-Storage-Configuration

      - id: ReviewCenter-System-Persistence-Create
        title: >-
          The tool shall create the database on first start.
        tags: [system]
        justification: |
          A new installation must work without manual database setup.
        children:
          - ReviewCenter-Hosting-Database
          - ReviewCenter-Storage-Configuration-Create
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase

      - id: ReviewCenter-System-Persistence-Restart
        title: >-
          The tool shall serve the stored data again after the server is restarted.
        tags: [system]
        justification: |
          Review records must outlive the server process, or a restart would lose the evidence of a review (21 CFR
          Part 11 section 11.10(c)).
        children:
          - ReviewCenter-Hosting-Database-Restart
          - ReviewCenter-Storage-Persistence
          - ReviewCenter-Storage-Persistence-Reviews
          - ReviewCenter-Storage-Persistence-FileContent
        tests:
          - HostingSubsystem_Startup_DatabaseConfigured_ServesStoredProjectsAfterRestart

      - id: ReviewCenter-System-Persistence-Integrity
        title: >-
          The tool shall refuse to store a second review with the same identifier in a project, and a review for a
          project that does not exist, and leave the stored data unchanged.
        tags: [system]
        justification: |
          A refused write must not damage the records that are already kept, or the history of a review could be
          overwritten.
        children:
          - ReviewCenter-Storage-Integrity
          - ReviewCenter-Storage-Integrity-UnknownProject

      - id: ReviewCenter-System-Persistence-Failure
        title: >-
          The tool shall report an error, without serving requests, when the Database settings cannot be used.
        tags: [system]
        justification: |
          Starting with a database that cannot be used would fail on the first request, so failing at start-up
          with a clear message lets the operator correct the setting.
        children:
          - ReviewCenter-Hosting-DatabaseFailure
          - ReviewCenter-Storage-Configuration-UnsupportedProvider
        tests:
          - HostingSubsystem_Startup_UnsupportedDatabaseProvider_FailsWithExitCodeOne

      - id: ReviewCenter-System-Persistence-FailureExitCode
        title: >-
          The tool shall return a non-zero exit code when the Database settings cannot be used.
        tags: [system]
        justification: |
          A supervisor or pipeline has to see that the service did not start instead of carrying on with it.
        children:
          - ReviewCenter-Hosting-DatabaseFailure-ExitCode
        tests:
          - HostingSubsystem_Startup_UnsupportedDatabaseProvider_FailsWithExitCodeOne

      - id: ReviewCenter-System-Persistence-FailureCreatesNothing
        title: >-
          The tool shall create no database when the Database settings name a provider that is not supported.
        tags: [system]
        justification: |
          A mistyped setting must not leave a stray database behind that a later start could pick up.
        children:
          - ReviewCenter-Storage-Configuration-UnsupportedProviderCreatesNothing
