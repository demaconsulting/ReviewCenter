      # ----------------------------------------------------------------------------------------------
      # Evidence and audit: the history, its verification, and the portable proof
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-AuditTrail
        title: >-
          The tool shall make tampering with its history detectable, by recording every change of projects, reviews,
          comments, checklists, reviewer slots, signatures, and users, and every sign-in, sign-out, failed sign-in,
          attempt on a locked account, refusal by the sign-in throttle, failed re-authentication for a signature,
          and lockout, in an audit trail in the database that names the time, the person, the action, and a short
          detail, never records a password, and chains the entries by hashes so that an edit, a deletion, an
          insertion, or a reordering in the middle of the history can be detected.
        tags: [system]
        justification: |
          A review record is only evidence when its history can be checked (21 CFR Part 11 section 11.10(e),
          secure, computer-generated, time-stamped audit trails; EU GMP Annex 11 clause 9). Each change is stored
          together with its audit entry, so that both exist or neither does, and the chain detects changes of the
          middle of the history. It does not detect the removal of the newest entries or a complete rewrite by
          someone with write access to the database, unless the head hash was recorded elsewhere; this version has
          no external anchoring, and that limit is stated to the user. The system tests drive a running server and
          a real database with an edit made behind its back; the other kinds of break, the once-a-minute limit of
          repeated failures, and the omission of comment texts are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-AuditTrail
          - ReviewCenter-Storage-AuditTrail
          - ReviewCenter-Storage-AuditTrail-Gate
          - ReviewCenter-Storage-AuditTrail-Linear
          - ReviewCenter-Storage-AuditTrail-UniqueSequence
          - ReviewCenter-Storage-AuditTrail-Immutable
          - ReviewCenter-Storage-AuditTrail-Pages
          - ReviewCenter-Storage-AuditTrail-Filter
          - ReviewCenter-Storage-AuditTrail-Batches
          - ReviewCenter-Storage-AuditTrail-ProjectOnly
          - ReviewCenter-Identity-AuditTrail
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify
        title: >-
          The tool shall let a system administrator verify the hash chain of the audit trail on request, from the
          audit page and from the command line with the audit verify verb, reporting an intact chain with the number
          of entries (and on the page the head hash) and a broken chain with the first broken entry, returning exit
          code 0 for an intact chain and 1 for a broken chain or an unreadable database, and shall show a system
          administrator the audit trail on the audit page, which a system administrator can narrow by project, actor,
          action, review and date range, and export as CSV or JSON together with the verified state of the chain.
        tags: [system]
        justification: |
          Verification is how tampering is found, and an audit trail that nobody can read or check does not protect
          anyone. The command line lets scripts and scheduled jobs check the trail, and the head hash lets a system
          administrator record the state of the trail outside the database. Participants need to see who did what
          and when for the reviews they may see, while the whole trail names every user and action and so is
          limited to system administrators (21 CFR Part 11 section 11.10(e), audit trail available for review and
          copying by the agency). The system tests verify the chain from the audit page and by the verb on a
          database that was edited behind the server, the filter form of the audit page by the action and the
          actor, and the export link of the audit page, which hands out the filtered trail as a CSV file that says
          the chain is intact; the history of one review that every participant may see, the
          paging of 50, the refusal of the whole trail to anybody but a system administrator, the formats and the
          access rules of the export, and the exit code
          for an unreadable database are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Program-AuditVerify
          - ReviewCenter-Program-AuditVerify-Help
          - ReviewCenter-Cli-AuditVerify
