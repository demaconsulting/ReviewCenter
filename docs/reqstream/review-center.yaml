---
# ReviewCenter System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible behavior of the complete system
# - System requirements are validated through integration tests: the xUnit tests run the published
#   dotnet DLL end-to-end, and CI runs the self-validation of the published self-contained
#   executable (extracted from its release archive) on each supported platform, which produces the
#   platform evidence in platform-requirements.yaml

sections:
  - title: System-Level Requirements
    requirements:
      - id: ReviewCenter-System-Version
        title: The tool shall display version information when the version flag is provided.
        tags: [system]
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification. The version display must
          work from a standard dotnet invocation without additional configuration.
        children:
          - ReviewCenter-Program-Version
          - ReviewCenter-Cli-Version
        tests:
          - ReviewCenter_VersionFlag_Provided_OutputsVersion

      - id: ReviewCenter-System-Help
        title: The tool shall display usage information when the help flag is provided.
        tags: [system]
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources. Help output must be accessible from a standard dotnet
          invocation and must list the available options so that users can self-serve.
        children:
          - ReviewCenter-Program-Help
          - ReviewCenter-Cli-Help
        tests:
          - ReviewCenter_HelpFlag_Provided_OutputsUsageInformation

      - id: ReviewCenter-System-Validate
        title: The tool shall execute self-validation tests when the validate flag is provided.
        tags: [system]
        justification: |
          Regulated environments require tool qualification evidence to demonstrate
          that the tool functions correctly in its deployment environment before it
          is used to generate compliance artifacts. The validation mode exercises
          core behaviors and produces a structured test result file, providing the
          qualification evidence required by quality management systems.
        children:
          - ReviewCenter-Program-Validate
          - ReviewCenter-Cli-Validate
          - ReviewCenter-SelfTest-Qualification
        tests:
          - ReviewCenter_ValidateFlag_Provided_RunsValidation

      - id: ReviewCenter-System-Silent
        title: The tool shall suppress console output when the silent flag is provided.
        tags: [system]
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs when only the exit code is needed.
        children:
          - ReviewCenter-Cli-Silent
        tests:
          - ReviewCenter_SilentFlag_Provided_SuppressesOutput

      - id: ReviewCenter-System-Log
        title: The tool shall write output to a log file when the log flag is provided.
        tags: [system]
        justification: |
          Provides persistent logging for debugging and compliance audit trails.
          Log files enable post-run inspection of tool output without requiring
          console capture.
        children:
          - ReviewCenter-Cli-Log
        tests:
          - ReviewCenter_LogFlag_Provided_WritesOutputToFile

      - id: ReviewCenter-System-ErrorHandling
        title: The tool shall return a non-zero exit code for unrecognized arguments.
        tags: [system]
        justification: |
          A non-zero exit code enables CI/CD pipelines to detect and
          surface misconfiguration failures automatically.
        children:
          - ReviewCenter-Program-ExitCode
          - ReviewCenter-Cli-ExitCode
        tests:
          - ReviewCenter_UnknownArgument_Provided_ReturnsError

      - id: ReviewCenter-System-ErrorMessage
        title: The tool shall report an error message for unrecognized arguments.
        tags: [system]
        justification: |
          Clear feedback for unrecognized arguments helps users quickly correct
          mistakes and prevents silent misconfiguration.
        children:
          - ReviewCenter-Cli-InvalidArgs
          - ReviewCenter-Cli-ErrorOutput
        tests:
          - ReviewCenter_UnknownArgument_Provided_ReturnsError

      - id: ReviewCenter-System-Results
        title: >-
          The tool shall write self-validation results to a standard test result
          file when the `--results` flag is provided.
        tags: [system]
        justification: |
          Enables integration with CI/CD systems that expect standard test result formats.
          TRX format is compatible with MSTest; JUnit XML is compatible with many CI tools.
        children:
          - ReviewCenter-Cli-Results
          - ReviewCenter-SelfTest-ResultsOutput
        tests:
          - ReviewCenter_ValidateWithTrxResults_Requested_GeneratesTrxFile
          - ReviewCenter_ValidateWithXmlResults_Requested_GeneratesJUnitFile

      - id: ReviewCenter-System-Depth
        title: The tool shall adjust the heading depth of validation output when the `--depth` flag is provided.
        tags: [system]
        justification: |
          Enables validation output to be embedded within larger markdown documents at
          the appropriate heading level, supporting documentation workflows that combine
          multiple reports.
        children:
          - ReviewCenter-Cli-Depth
        tests:
          - ReviewCenter_ValidateFlag_Provided_RunsValidation
          - ReviewCenter_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel

      - id: ReviewCenter-System-ValidateFailure
        title: >-
          The tool shall return a non-zero exit code when the results file has an unsupported extension.
        tags: [system]
        justification: |
          A non-zero exit code when the requested results file cannot be produced in a supported
          format enables CI/CD pipelines to detect and surface output errors automatically,
          preventing silent loss of validation evidence in compliance-critical workflows.
        children:
          - ReviewCenter-SelfTest-InvalidExtension
        tests:
          - ReviewCenter_ValidateWithBadExtension_ExtensionInvalid_ReturnsNonZero

      - id: ReviewCenter-System-DefaultBehavior
        title: The tool shall display a banner then run the default tool logic when invoked without any action flags.
        tags: [system]
        justification: |
          When a user invokes the tool without any recognized action flag, the tool shall
          display a banner identifying itself and run its primary logic so that the
          invocation is never silently empty.
        children:
          - ReviewCenter-Cli-ArgumentParsing
          - ReviewCenter-Cli-OutputChannels
        tests:
          - ReviewCenter_NoArguments_Invoked_DisplaysBanner

      - id: ReviewCenter-System-ResultAlias
        title: The tool shall accept `--result` as a legacy alias for `--results`.
        tags: [system]
        justification: |
          Backward compatibility with scripts that use the earlier `--result` spelling
          prevents breakage when upgrading to newer tool versions.
        children:
          - ReviewCenter-Cli-ResultAlias
        tests:
          - ReviewCenter_ResultAlias_LegacyFlag_WritesResultsFile

      - id: ReviewCenter-System-Serve
        title: The tool shall run the ReviewCenter web server until it is stopped when the serve verb is provided.
        tags: [system]
        justification: |
          ReviewCenter is delivered as a web service. Operators need a single command that
          starts the service in the foreground, keeps it running for users, and stops it
          cleanly on request, so that it can be run under a process supervisor, a container,
          or by a developer. Operators also need start-up and request activity written as
          structured log entries so that the running service can be monitored and audited.
        children:
          - ReviewCenter-Program-Serve
          - ReviewCenter-Cli-Serve
          - ReviewCenter-Hosting-Logging
        tests:
          - ReviewCenter_ServeVerb_Started_HealthEndpointReturnsHealthy
          - ReviewCenter_ServeVerb_Started_LogsStartupEntryWithListenUrl
          - ubuntu@ReviewCenter_ServeVerb_TerminationRequested_StopsGracefullyWithExitCodeZero

      - id: ReviewCenter-System-ServeUrls
        title: >-
          The tool shall listen on the URL given by the `--urls` option when the serve verb is
          provided, and shall report an error and return a non-zero exit code when `--urls` is
          given without the serve verb or the requested address cannot be used.
        tags: [system]
        justification: |
          Operators must choose the address and port the service listens on so that it can
          coexist with other services and sit behind a reverse proxy. Rejecting a misplaced
          option or an unusable address with a clear error prevents a mistyped command from
          silently starting nothing, or something other than what was requested.
        children:
          - ReviewCenter-Cli-Urls
        tests:
          - ReviewCenter_ServeWithUrls_PortSpecified_ListensOnRequestedPort
          - ReviewCenter_UrlsWithoutServe_Provided_ReturnsError
          - ReviewCenter_ServeVerb_PortInUse_ReturnsError

      - id: ReviewCenter-System-HomePage
        title: >-
          The tool shall serve a home page titled ReviewCenter at the root URL of the web server,
          offering a Hello button and a counter button.
        tags: [system]
        justification: |
          The home page is the entry point of the web user interface. It proves that pages are
          delivered to a browser and that the interactive server-side user interface needed by
          later review features works end to end, including the client script it depends on.
        children:
          - ReviewCenter-Web-HomePage
          - ReviewCenter-Web-Interactive
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndControls

      - id: ReviewCenter-System-Health
        title: >-
          The tool shall answer requests for the /health URL of the web server with HTTP status
          200 and the text Healthy while the server is running.
        tags: [system]
        justification: |
          Reverse proxies, container orchestrators, monitoring tools, and test tooling need a
          simple, unauthenticated way to find out whether the service is up and ready to
          accept requests.
        children:
          - ReviewCenter-Hosting-Health
        tests:
          - ReviewCenter_ServeVerb_Started_HealthEndpointReturnsHealthy

      - id: ReviewCenter-System-Projects
        title: >-
          The tool shall serve a projects page at /projects that lists the projects and offers a form to create
          a project, and a page for each project that shows its reviews, to a signed-in user, and shall send a
          request without a signed-in user to the login page.
        tags: [system]
        justification: |
          Reviews are organized in projects, so users need to create projects and find them again before they
          can review anything. The page must work against the database of the running server, not only in
          isolation.
        children:
          - ReviewCenter-Web-Projects
          - ReviewCenter-Core-Projects
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase

      - id: ReviewCenter-System-Reviews
        title: >-
          The tool shall let a user create a draft review in a project from uploaded files, keeping every file
          byte for byte within defined upload limits, and shall show the review with its content fingerprint,
          its files, and the content of a selected file.
        tags: [system]
        justification: |
          Formal review starts from a fixed snapshot of the files under review. The fingerprint, calculated like
          the ReviewMark fingerprint, identifies that snapshot and lets reviewers show that the content they
          reviewed is the content that was submitted. Upload limits keep the service responsive.
        children:
          - ReviewCenter-Web-Reviews
          - ReviewCenter-Core-Reviews
          - ReviewCenter-Core-Fingerprint
          - ReviewCenter-Core-Rules
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-System-Persistence
        title: >-
          The tool shall keep projects and reviews in the database named by the Database settings, creating the
          database on first start, so that the data is still there after the server is restarted.
        tags: [system]
        justification: |
          Review records must outlive the server process. Operators must be able to choose where the data lives,
          and a new installation must work without manual database setup.
        children:
          - ReviewCenter-Hosting-Database
          - ReviewCenter-Storage-Persistence
          - ReviewCenter-Storage-Integrity
          - ReviewCenter-Storage-Configuration
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase
          - HostingSubsystem_Startup_DatabaseConfigured_ServesStoredProjectsAfterRestart

      - id: ReviewCenter-System-Comments
        title: >-
          The tool shall let a user start a comment thread on a file of a review, anchored to the whole file or
          to a range of lines, with a text, let a signed-in user reply to a thread, resolve and reopen
          it, and show the number of open and resolved threads of the review and of open threads per file,
          keeping every thread and comment, with the user who wrote it, in the database across restarts without
          ever changing or deleting a posted comment.
        tags: [system]
        justification: |
          Review comments are the substance of a review. Comments that cannot be edited or deleted make the
          discussion a trustworthy record, and the author of each comment is the signed-in user, so it is known
          who said what.
        children:
          - ReviewCenter-Web-Comments
          - ReviewCenter-Core-Threads
          - ReviewCenter-Storage-Threads
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments

      - id: ReviewCenter-System-Checklist
        title: >-
          The tool shall give every review a checklist that follows the Continuous Compliance review template,
          let a user answer each check Pass, Fail, or N/A with a justification where required, mark a section
          as not applicable with a reason, and see what is left to do, keeping the answers in the database
          across restarts, with a review keeping the checklist it was created with.
        tags: [system]
        justification: |
          The checklist is how a formal review shows what was examined. A reviewer must see at a glance what is
          unanswered and be led to the next check. Each answer is saved with the signed-in user who gave it.
        children:
          - ReviewCenter-Web-Checklist
          - ReviewCenter-Core-Checklist
          - ReviewCenter-Storage-Checklist
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen

      - id: ReviewCenter-System-Login
        title: >-
          The tool shall let a user sign in at /login with the user name and password of a local account that is
          enabled, keep the user signed in with a session cookie for the configured number of hours, let the
          user sign out, and answer every failed sign-in with the same message, so that it does not reveal
          whether the account exists.
        tags: [system]
        justification: |
          Review actions are only trustworthy when they are attributable, which needs a verified identity. A
          local account with a password needs no external service, and one answer for every failure does not
          help someone who is guessing user names.
        children:
          - ReviewCenter-Identity-Login
          - ReviewCenter-Identity-Session
          - ReviewCenter-Web-SignIn
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-System-Authorization
        title: >-
          The tool shall send a request without a signed-in user for a project, review, checklist, account, or
          user page to the login page, refuse the user administration page to a user who is not an
          administrator, and keep the home page, the login page, and the /health URL open to everyone.
        tags: [system]
        justification: |
          Review data must only be read and changed by identified people, while the health probe and the login
          page must work without signing in. Only administrators may manage users.
        children:
          - ReviewCenter-Identity-Authorization
          - ReviewCenter-Hosting-Authentication
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-System-Users
        title: >-
          The tool shall let an administrator list the users and create a user with a role of Admin or Reviewer,
          enable and disable a user, change the role, and set a password, let every user change the own
          password, require a password of 12 to 128 characters, lock a user out for 5 minutes after 5 failed
          sign-ins in a row, never disable or demote the last enabled administrator, and keep the users, with
          only a hash of the password, in the database across restarts.
        tags: [system]
        justification: |
          Users are the accountable parties of a review. A password policy and a lockout make guessing hard,
          the rule for the last administrator keeps the system manageable, and a password hash means a copy of
          the database does not reveal the passwords.
        children:
          - ReviewCenter-Core-Users
          - ReviewCenter-Storage-Users
          - ReviewCenter-Web-SignIn
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin
          - StorageSubsystem_Users_PersistAcrossReopen

      - id: ReviewCenter-System-UserAdd
        title: >-
          The tool shall create a user in the database when the user add verb is provided with a user name, a
          display name, and an optional role (Reviewer by default), taking the password from the
          REVIEWCENTER_PASSWORD environment variable, the first line of redirected standard input, or a prompt,
          never from the command line, and shall report an error with a non-zero exit code when the user cannot
          be created.
        tags: [system]
        justification: |
          The first administrator must exist before anybody can sign in. A password on the command line would
          be visible to other processes and kept in shell history, so it is never accepted there.
        children:
          - ReviewCenter-Program-UserAdd
          - ReviewCenter-Cli-UserAdd
          - ReviewCenter-Hosting-UserAdd
        tests:
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate
          - ReviewCenter_UserAddVerb_NoPassword_ReturnsError

      - id: ReviewCenter-System-Author
        title: >-
          The tool shall record the signed-in user, by user name and display name, as the author of every
          comment, the person of every checklist answer, and the person of every change of section
          applicability, without letting a user enter or change that name.
        tags: [system]
        justification: |
          A review record is only evidence when it says who did what. Taking the name from the signed-in user,
          and never from a form field, means nobody can act in the name of somebody else.
        children:
          - ReviewCenter-Identity-Actor
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen

      - id: ReviewCenter-System-DatabaseFailure
        title: >-
          The tool shall report an error and return a non-zero exit code, without serving requests, when the
          Database settings cannot be used.
        tags: [system]
        justification: |
          Starting with a database that cannot be used would fail on the first request. Failing at start-up with
          a clear message lets the operator correct the setting.
        children:
          - ReviewCenter-Hosting-DatabaseFailure
        tests:
          - HostingSubsystem_Startup_UnsupportedDatabaseProvider_FailsWithExitCodeOne

      - id: ReviewCenter-System-TestIds
        title: >-
          The tool shall give every interactive element of its web pages a stable data-testid attribute, so that
          automated tests and the Puppet tool can address it.
        tags: [system]
        justification: |
          The web interface is verified and driven by automation. Addressing elements by stable identifiers,
          rather than by text or layout, keeps that automation working as the pages evolve.
        children:
          - ReviewCenter-Web-TestIds
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndControls
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId
