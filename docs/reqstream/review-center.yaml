---
# ReviewCenter System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible promises of the complete system, the ones a regulated
#   user relies on and every later formal review is checked against
# - System requirements are validated through integration tests: the xUnit tests run the published
#   dotnet DLL end-to-end, subsystem tests run the real services over a real database, and CI runs the
#   self-validation of the published self-contained executable (extracted from its release archive) on each
#   supported platform, which produces the platform evidence in platform-requirements.yaml
#
# ORGANIZATION:
# - The requirements sit in one section, as the standard prescribes, and are grouped by theme with the
#   banner comments below: Review content, Review activity, Review integrity and signing, Evidence and
#   audit, Access and identity, Git and content sources, Automation, Operation and qualification
# - Every requirement states an outcome that can be verified, not a feature, and its justification gives
#   the regulatory reason (traceability, independence of review, integrity of evidence)

sections:
  - title: System-Level Requirements
    requirements:
      # ----------------------------------------------------------------------------------------------
      # Review content: what is reviewed, and against what
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Projects
        title: >-
          The tool shall organize reviews in projects that a signed-in user can find, with a projects page that
          lists the projects the user may see and a page for each project that shows its reviews, only a system
          administrator creating a project, and a request without a signed-in user sent to the login page.
        tags: [system]
        justification: |
          Reviews of different bodies of work must be kept apart so that each can be found, assigned, and
          protected on its own. The pages must work against the database of the running server, not only in
          isolation, and an unidentified visitor must never be shown a project.
        children:
          - ReviewCenter-Web-Projects
          - ReviewCenter-Core-Projects
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase

      - id: ReviewCenter-System-Reviews
        title: >-
          The tool shall let a user create a draft review in a project from uploaded files, keeping every file byte
          for byte within defined upload limits, and shall identify the reviewed content by a fingerprint
          calculated like the ReviewMark fingerprint, showing the review with its fingerprint, its files, and the
          content of a selected file.
        tags: [system]
        justification: |
          Formal review starts from a fixed snapshot of the files under review. The fingerprint identifies that
          snapshot independent of file names and order, and lets reviewers and auditors show that the content they
          reviewed is the content that was submitted (21 CFR Part 11 section 11.10(a), accuracy and completeness
          of records). Calculating it like ReviewMark does ties the review to the file set that the
          configuration of the repository names. Upload limits keep the service responsive.
        children:
          - ReviewCenter-Web-Reviews
          - ReviewCenter-Core-Reviews
          - ReviewCenter-Core-Fingerprint
          - ReviewCenter-Core-Rules
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-System-GitReviews
        title: >-
          The tool shall create a review from the files that changed between an optional baseline revision and a
          head revision of a registered git repository and match a selection, refuse to create it when no file
          matches, keep the content of the changed files and the resolved commits unchanged in the review whatever
          happens to the repository later, and let reviewers compare each modified file with its baseline version
          side by side, in plain words when a comparison cannot be shown.
        tags: [system]
        justification: |
          The product exists to review changes to source code, and a change is reviewed against what it replaces.
          Comparison with an earlier revision shows reviewers exactly what changed so that changed lines do not
          escape review, and freezing the baseline and head content means the review stays evidence of what was
          examined even when the repository moves on, is rewritten, or is deleted.
        children:
          - ReviewCenter-Core-RepositoryReviews
          - ReviewCenter-Storage-RepositoryReviews
          - ReviewCenter-Web-RepositoryReviews
          - ReviewCenter-Core-Diff
          - ReviewCenter-Web-DiffReview
        tests:
          - ReviewService_CreateFromRepositoryAsync_RealGit_FreezesChangesAgainstLaterCommits
          - NewReviewPage_CreateForm_EmptySelection_ShowsNothingToReviewAndCreatesNothing
          - PuppetEndToEnd_ReviewDiff_HoverRevealsLineCommentAndClickOpensComposer_WorksAgainstRealServer

      - id: ReviewCenter-System-PlanReviews
        title: >-
          The tool shall plan the reviews that a head revision of a registered git repository needs from the
          review-sets that the repository defines in its ReviewMark configuration file, as a full review or as the
          changes since the last signed review of each set, fall back to a full review when that baseline cannot be
          trusted, skip sets that are already filed or have nothing to review, create the picked reviews with the
          same rules as a review made by hand, and bind the review-set into the digest that a signature covers.
        tags: [system]
        justification: |
          A repository already states which files are reviewed together. Planning from that statement saves the
          author from typing every selection by hand, and recording the set keeps each later review of the set
          linked to the last one, so that changed files do not escape review and the evidence index can name the
          review-set that each signed review covers.
        children:
          - ReviewCenter-Core-PlanReviews
          - ReviewCenter-ContentSources-ReviewSets
          - ReviewCenter-Hosting-PlannerServices
          - ReviewCenter-Web-PlanReviews
        tests:
          - ReviewPlanner_CreateAsync_RealGit_LastReviewedBaselineThenAlreadyFiled

      - id: ReviewCenter-System-DueDate
        title: >-
          The tool shall let a review be given an optional due date, a calendar day in UTC, when it is created by
          hand, from a plan, or through the API, let the administrators of the project and the creator of the review
          change or clear it until the review is approved, show the date on the review and the Overdue badge while the
          date is past and the review is not approved, never show an approved review as overdue, keep the date out of
          what a signature covers, and record every setting and change of the date in the audit trail.
        tags: [system]
        justification: |
          A lead who answers for the reviews of a project must see which ones are late. A review that is approved has
          done its work, so it is not late, and the date is planning information, so a change of it must not make a
          signature look out of date. The audit trail shows who moved a date, as for every other change of a review
          (21 CFR Part 11 section 11.10(e)).
        children:
          - ReviewCenter-Core-DueDate
          - ReviewCenter-Storage-DueDate
          - ReviewCenter-Web-DueDate
          - ReviewCenter-Api-DueDate
        tests:
          - ReviewCenter_DueDate_SetOnCreationAndEdit_ShowsOverdueAndIsAudited
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag

      - id: ReviewCenter-System-FollowUpReview
        title: >-
          The tool shall let a review be created as a follow-up of an earlier review of the same project, by hand or
          through the API, so that the Pass and N/A answers of unchanged checks, the not-applicable sections and the
          open threads of the earlier review are carried over and marked with the review they came from, without the
          Fail answers, the resolved threads, the reviewer slots or the signatures, refuse a review that does not fit
          and a silent drop of open threads, count carried answers as answered and carried open threads as open for
          approval, keep a signature bound to exactly what was carried, show the follow-up in the attestation PDF, and
          keep the digest of every review that is not a follow-up unchanged.
        tags: [system]
        justification: |
          A review that fails is followed by a review of the corrected content. The reviewers should not repeat the
          checks that passed, and the record, and the document that goes to auditors, must still say which answers
          were carried and which were given in this review (21 CFR Part 11 section 11.10(e), records that are not
          obscured by later changes, and 11.10(a), a record that is accurate and complete). Leaving the new lines out
          of every other review keeps the signatures that already exist valid.
        children:
          - ReviewCenter-Core-FollowUp
          - ReviewCenter-Storage-FollowUp
          - ReviewCenter-Api-FollowUp
          - ReviewCenter-Evidence-FollowUp
          - ReviewCenter-Web-FollowUp
        tests:
          - ReviewCenter_FollowUpReview_CarriesWhatHoldsAndIsApprovedOnItsOwn
          - ReviewService_CreateDraftAsync_FollowUp_CarriesAnswersAndSections
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn
          - ApiEndpoints_CreateReview_FollowsReviewId_IsCreatedShownAndRefusedWhenInvalid
          - AttestationService_GenerateAsync_FollowUpReview_NamesFollowedReviewAndCarriedAnswers

      # ----------------------------------------------------------------------------------------------
      # Review activity: the discussion and the checklist
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Comments
        title: >-
          The tool shall let a signed-in user start a comment thread on a file of a review, anchored to the whole
          file or to a range of lines, including a line of either side of a comparison, reply to a thread, resolve
          and reopen it, and open a thread by a link that survives sign-in, showing the number of open and
          resolved threads of the review and of open threads per file, keeping every thread and comment across
          restarts, in order, without ever changing or deleting a posted comment.
        tags: [system]
        justification: |
          Review comments are the substance of a review. Anchoring each one to the code it concerns makes the
          finding traceable to the exact content, and comments that cannot be edited or deleted make the
          discussion a trustworthy record (21 CFR Part 11 section 11.10(e), records that are not obscured by later
          changes).
        children:
          - ReviewCenter-Web-Comments
          - ReviewCenter-Web-DiffReview
          - ReviewCenter-Web-DeepLinks
          - ReviewCenter-Core-Threads
          - ReviewCenter-Storage-Threads
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments
          - PuppetEndToEnd_ReviewDiff_HoverRevealsLineCommentAndClickOpensComposer_WorksAgainstRealServer
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-Checklist
        title: >-
          The tool shall give every review a checklist that follows the Continuous Compliance review template, with
          a review keeping the checklist it was created with, let a user answer each check Pass, Fail, or N/A with a
          justification where required, mark a section as not applicable with a reason, see what is left to do, and
          keep the answers in the database across restarts.
        tags: [system]
        justification: |
          The checklist is how a formal review shows what was examined against a defined standard. Freezing the
          wording at creation means a later change of the template cannot alter what the reviewers answered. A
          reviewer must see at a glance what is unanswered and be led to the next check, and every N/A needs a
          stated reason so that skipped checks are explained and not silent.
        children:
          - ReviewCenter-Web-Checklist
          - ReviewCenter-Web-ChecklistTemplate
          - ReviewCenter-Core-Checklist
          - ReviewCenter-Core-ProjectChecklist
          - ReviewCenter-Storage-Checklist
          - ReviewCenter-Storage-ProjectChecklist
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_ChecklistTemplate_ReplaceChangesOnlyNewReviewsAndResetRestoresTheDefault

      - id: ReviewCenter-System-Author
        title: >-
          The tool shall record the signed-in user, by user name and display name, as the author of every
          comment, the person of every checklist answer, and the person of every change of section
          applicability, without letting a user enter or change that name.
        tags: [system]
        justification: |
          A review record is only evidence when it says who did what (21 CFR Part 11 section 11.10(e) and
          section 11.50, signature manifestations). Taking the name from the signed-in user, and never from a
          form field, means nobody can act in the name of somebody else.
        children:
          - ReviewCenter-Identity-Actor
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen

      # ----------------------------------------------------------------------------------------------
      # Review integrity and signing: independence, fresh authentication, binding, immutability
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Signatures
        title: >-
          The tool shall approve a review only while every named reviewer slot has signed the record as it is now,
          show on the review and in the list of reviews whether it is Approved or In review, and keep every
          signature in the database across restarts.
        tags: [system]
        justification: |
          A formal review ends with the approval of the named reviewers. Approval must be a state that the tool
          derives from the signatures and the current record, never a flag that somebody sets, so that what the
          user sees as Approved is what the reviewers signed (21 CFR Part 11 section 11.50 and section 11.70,
          signed records and signature linking).
        children:
          - ReviewCenter-Web-Signatures
          - ReviewCenter-Core-Signatures
          - ReviewCenter-Storage-Signatures
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges
          - StorageSubsystem_Signatures_PersistAcrossReopenAndStayCurrent
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-ReviewerIndependence
        title: >-
          The tool shall have the reviewers of a review named beforehand in reviewer slots, each a primary reviewer
          with an optional alternate, offering only members of the project and putting each person in one slot
          only, shall never let an API token sign a review or arrange its reviewers, shall offer no way to sign
          while an unanswered check, a Fail answer, or an open thread blocks the review, shall offer no way to
          change or remove a slot that holds a signature, and, while the project requires independent reviewers,
          which is the default and which a project administrator can switch off and on with the change audited,
          shall refuse the person who created a review as a reviewer of it and as its signer.
        tags: [system]
        justification: |
          A review is independent only when the people who approve it are fixed beforehand, are distinct, and
          cannot be replaced after they have signed. Naming an alternate lets a review go on when the primary
          reviewer is away without opening the review to anybody else. A person outside the project, or a script
          holding a token, must never be able to supply a signature that stands for human judgement. Blocking
          unfinished work stops an approval of a review nobody finished (EU GMP Annex 11 clause 12, security;
          21 CFR Part 11 section 11.10(d), limiting access to authorized individuals). Nobody approves their own
          work: the author of a review is the user who created it, and the tool refuses that user in a slot and at
          the signature unless the project has turned the requirement off, for example a team of one or two. The
          tool does not match the authors of the commits in the reviewed repository to users, and it does not
          decide who else may be named. The system tests drive the web interface and the API of a running server:
          the refusal of a non-member by the server itself, and of every other person than the slot holders, is
          verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-Signatures
          - ReviewCenter-Web-Signatures
          - ReviewCenter-Storage-Signatures
          - ReviewCenter-Api-Isolation
          - ReviewCenter-Core-IndependentReviewers
          - ReviewCenter-Storage-ReviewIntegrity
          - ReviewCenter-Web-ReviewRules
        tests:
          - ReviewCenter_ReviewerSlots_NonMemberAndSamePerson_AreNotAcceptedAsReviewers
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised
          - ReviewCenter_IndependentReviewers_AuthorIsNotOfferedAndAdministratorCanSwitchTheRuleOff
          - CoreSubsystem_IndependentReviewers_AuthorCannotBeSlotReviewerOrSign
          - CoreSubsystem_IndependentReviewers_SettingChangeIsAuditedAndAdminOnly
          - CoreSubsystem_ApiTokenReview_AuthorIsTokenUser

      - id: ReviewCenter-System-ReviewRuleSwitches
        title: >-
          The tool shall keep, for each project, a switch for each of two further review rules, one for authors
          answering the checklist of their own review and one for the person who reopened a review signing it again,
          each on for a new project, shall let only an administrator of the project or a system administrator change
          them, never through an access token, shall record each change in the audit trail, and shall only store
          them, because it does not apply them yet.
        tags: [system]
        justification: |
          A project must be able to say beforehand which review rules it wants, and the choice must be in the history
          so that it can be shown who relaxed a rule and when. The switches are stored first, so that every project
          has a recorded value on the day the rules are applied; until then the tool says on the page that they are
          not applied, so nobody takes a stored switch for a protection that does not exist yet. The system tests
          verify the audited, administrator-only change and the page; the storage across a restart is verified by the
          tests of the child requirements.
        children:
          - ReviewCenter-Core-ReviewRuleSwitches
          - ReviewCenter-Storage-ReviewRuleSwitches
          - ReviewCenter-Web-ReviewRuleSwitches
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale
          - WebSubsystem_ProjectAdmin_SavesStoredReviewRuleSwitches

      - id: ReviewCenter-System-SignatureReauthentication
        title: >-
          The tool shall make a signature only after the signer has proved who they are again for that signature,
          with the password of the account (and the further proofs of the second factor or the identity provider
          that the child requirements state), and shall refuse a signature and record the failed attempt in the
          audit trail without the secret when the proof is wrong.
        tags: [system]
        justification: |
          A session that was left open, or a stolen cookie, must not be enough to sign in somebody else's name. A
          signature is a legally significant act, so the signer re-authenticates for each one, with all the
          components of the electronic signature (21 CFR Part 11 section 11.200(a), signature components and
          controls; section 11.300, controls for identification codes and passwords; EU GMP Annex 11 clause 14).
          Counting a wrong proof toward the lockout stops the signature step from becoming a way to guess the
          password, and a proof that works for one signature only stops one confirmation from signing twice; the
          system tests drive the password proof in a real browser, and the lockout, the second factor, and the
          OpenID Connect proof are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-Signatures
          - ReviewCenter-Web-Signatures
          - ReviewCenter-Identity-OidcSignIn
          - ReviewCenter-Core-TotpSecondFactor
          - ReviewCenter-Web-TotpSecondFactor
          - ReviewCenter-Core-AuditTrail
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen

      - id: ReviewCenter-System-SignatureBinding
        title: >-
          The tool shall bind every signature to the exact record that the signer reviewed, by a digest that covers
          the content fingerprint, the checklist with who answered, every thread and comment, and the git source of
          the review, so that a change of any of them ends the approval, and shall refuse a signature when the
          record has changed since the page of the signer was drawn.
        tags: [system]
        justification: |
          A signature is worth only what it covers. Binding it to a digest of everything the reviewer saw, and
          refusing a signature over a record that moved while the signer was reading, means the signer is never
          made to approve something different from what they examined. It links the signature to its record in a
          way that cannot be moved to another record (21 CFR Part 11 section 11.70, signature/record linking;
          EU GMP Annex 11 clause 14). The system tests change the checklist and add a comment against a running
          server; that each part of the digest (wording, who answered, order of comments, source, commits, selection,
          changes, review-set) moves it is verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-Signatures
          - ReviewCenter-Storage-Signatures
          - ReviewCenter-Web-Signatures
          - ReviewCenter-Core-Fingerprint
          - ReviewCenter-Core-RepositoryReviews
          - ReviewCenter-Core-PlanReviews
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-RecordImmutability
        title: >-
          The tool shall keep the reviewed content, every posted comment, and every signature as they were stored,
          offer no way to edit or delete a posted comment or to change or remove a signature, lock a review against
          every change as soon as it is approved, until a project or system administrator reopens it with a reason
          that is audited, show a review as In review again, with its signatures kept as history, as soon as the
          record changes after it was signed or the review is reopened, so that an approval never stands for a
          record that nobody signed, and let an edit of a stored audit entry be found by the verification of the
          audit trail.
        tags: [system]
        justification: |
          Evidence is trusted only when it cannot be rewritten afterwards. Content, comments, signatures, and audit
          entries are stored so that they can only be added to (21 CFR Part 11 section 11.10(c), protection of
          records, and section 11.10(e), audit trails that do not obscure earlier entries). An approved review is
          locked, in the services and again in the database transaction, so that nobody can change what the
          reviewers signed; the only way forward is a deliberate reopen by an administrator, which needs a reason,
          is recorded with who, when, why, and the digest that was approved, and ends the approval, because the
          digest of the record changes and no earlier signature matches it: the reviewers sign again. The earlier
          signatures stay as history and can never be made current again. A record that changes before the
          approval, the checklist answers or a new comment, equally leaves an earlier signature out of date. The
          system tests drive a running server and a real database; that the stored baseline, the checklist
          wording, and the audit entries are never updated by the code, that each service and the database refuse
          a change of a locked review, and that the database itself refuses to remove a signed slot, are verified by
          the tests of the child requirements.
        children:
          - ReviewCenter-Core-Reviews
          - ReviewCenter-Core-RepositoryReviews
          - ReviewCenter-Storage-RepositoryReviews
          - ReviewCenter-Core-Checklist
          - ReviewCenter-Core-ProjectChecklist
          - ReviewCenter-Storage-Checklist
          - ReviewCenter-Storage-ProjectChecklist
          - ReviewCenter-Core-Threads
          - ReviewCenter-Storage-Threads
          - ReviewCenter-Core-Signatures
          - ReviewCenter-Storage-Signatures
          - ReviewCenter-Core-AuditTrail
          - ReviewCenter-Storage-AuditTrail
          - ReviewCenter-Storage-Persistence
          - ReviewCenter-Core-ApprovalLock
          - ReviewCenter-Storage-ReviewIntegrity
          - ReviewCenter-Web-ReviewLock
          - ReviewCenter-Api-LockedReview
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne
          - ReviewCenter_ApprovedReview_IsLockedUntilAnAdministratorReopensItWithAReason
          - CoreSubsystem_ApprovedReview_RefusesEveryMutationWithReviewLocked
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures
          - StorageSubsystem_ReopenAndLock_SurviveRestartAndRefuseWritesInTransaction
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen
          - ApiSubsystem_LockedReview_StaysReadableAndMutationIsProblem409
          - IntegrationTests_ApprovalLockReopenResign_EndToEnd

      # ----------------------------------------------------------------------------------------------
      # Evidence and audit: the history, its verification, and the portable proof
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-AuditTrail
        title: >-
          The tool shall make tampering with its history detectable, by recording every change of projects, reviews,
          comments, checklists, reviewer slots, signatures, and users, and every sign-in, sign-out, failed sign-in,
          attempt on a locked account, refusal by the sign-in throttle, failed re-authentication for a signature,
          and lockout, in an audit trail in the database that names the time, the person, the action, and a short
          detail, never records a password, and chains the entries by hashes so that an edit, a deletion, an
          insertion, or a reordering in the middle of the history can be detected.
        tags: [system]
        justification: |
          A review record is only evidence when its history can be checked (21 CFR Part 11 section 11.10(e),
          secure, computer-generated, time-stamped audit trails; EU GMP Annex 11 clause 9). Each change is stored
          together with its audit entry, so that both exist or neither does, and the chain detects changes of the
          middle of the history. It does not detect the removal of the newest entries or a complete rewrite by
          someone with write access to the database, unless the head hash was recorded elsewhere; this version has
          no external anchoring, and that limit is stated to the user. The system tests drive a running server and
          a real database with an edit made behind its back; the other kinds of break, the once-a-minute limit of
          repeated failures, and the omission of comment texts are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Core-AuditTrail
          - ReviewCenter-Storage-AuditTrail
          - ReviewCenter-Identity-AuditTrail
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-AuditVerify
        title: >-
          The tool shall let a system administrator verify the hash chain of the audit trail on request, from the
          audit page and from the command line with the audit verify verb, reporting an intact chain with the number
          of entries (and on the page the head hash) and a broken chain with the first broken entry, returning exit
          code 0 for an intact chain and 1 for a broken chain or an unreadable database, and shall show a system
          administrator the audit trail on the audit page.
        tags: [system]
        justification: |
          Verification is how tampering is found, and an audit trail that nobody can read or check does not protect
          anyone. The command line lets scripts and scheduled jobs check the trail, and the head hash lets a system
          administrator record the state of the trail outside the database. Participants need to see who did what
          and when for the reviews they may see, while the whole trail names every user and action and so is
          limited to system administrators (21 CFR Part 11 section 11.10(e), audit trail available for review and
          copying by the agency). The system tests verify the chain from the audit page and by the verb on a
          database that was edited behind the server; the history of one review that every participant may see, the
          paging of 50, the refusal of the whole trail to anybody but a system administrator, and the exit code
          for an unreadable database are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Program-AuditVerify
          - ReviewCenter-Cli-AuditVerify
          - ReviewCenter-Hosting-AuditVerify
          - ReviewCenter-Web-AuditPage
          - ReviewCenter-Web-AuditHistory
        tests:
          - ReviewCenter_Signing_FreshPasswordAndUnchangedRecord_ApprovesOnlyThen
          - ReviewCenter_AuditVerifyVerb_HistoryEditedInDatabase_ReportsFirstBrokenEntryWithExitCodeOne

      - id: ReviewCenter-System-Attestation
        title: >-
          The tool shall let a signed-in user download, for a review that every reviewer slot has signed, a PDF
          attestation that is digitally signed by the server with a key that is never exported, that states the
          content, the checklist, the threads, the sign-offs, and the head of the audit trail, as far as the
          evidence settings of the project allow, and that is refused for a review that is not approved or changed
          since it was signed.
        tags: [system]
        justification: |
          Approval inside a tool is of little use to an auditor who does not have access to it. A signed, portable
          document that is honest about what it proves lets the approval be filed and checked elsewhere
          (21 CFR Part 11 section 11.10(b), accurate and complete copies in human-readable form, and section
          11.50). It adds integrity and the origin of the server key to the in-record signatures that identify the
          reviewers, and the project decides how much of the review the document may reveal. The system tests
          download the signed PDF from a running server and see it refused before the signature and after a later
          change; the kinds of key, the statement of what the signature proves and does not prove, the shown change
          of the content, and the audit entry of the release are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Evidence-Document
          - ReviewCenter-Evidence-Signature
          - ReviewCenter-Evidence-Key
          - ReviewCenter-Evidence-Honesty
          - ReviewCenter-Evidence-Release
          - ReviewCenter-Evidence-ContentSettings
          - ReviewCenter-Core-EvidenceSettings
          - ReviewCenter-Storage-EvidenceSettings
          - ReviewCenter-Web-EvidenceSettings
          - ReviewCenter-Hosting-AttestationServices
          - ReviewCenter-Hosting-AttestationKeyFailure
          - ReviewCenter-Web-Attestation
        tests:
          - EvidenceSubsystem_CompletedReview_IsOfferedAndDownloadedAsSignedPdf
          - AttestationEndpoint_Get_CompleteReview_ReturnsSignedPdfDownloadAndRecordsEvent
          - EvidenceSubsystem_ReviewNotComplete_IsNotOfferedAndRefused
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      - id: ReviewCenter-System-EvidenceIndex
        title: >-
          The tool shall list the completed reviews of a project that were planned from a review-set in an evidence
          index in the format that ReviewMark reads, naming for each the review-set id, the fingerprint of the files,
          and the result, shall leave out a review that is incomplete or changed since it was signed, and shall
          keep the index and the attestation PDFs of a project closed to a client without credentials unless a
          setting of the project, which is off by default, opens them.
        tags: [system]
        justification: |
          The evidence that a review was done must reach the place where the compliance of a release is judged. An
          index in the format that ReviewMark reads lets the release pipeline check that every review-set has a
          signed review of the current fingerprint, and listing only reviews that are complete and current stops a
          stale approval from satisfying it. Opening the evidence to a client without credentials is a decision
          about confidentiality, so it is a setting of each project, off by default, limited to the two documents,
          and rate-limited by address. The system tests read the index with a token from a running server, before
          the signature and after a later change, and as a client without credentials; the date, the address of
          the attestation, a review without a review-set id, the same index for the same reviews, and the opened
          setting are verified by the tests of the child requirements.
        children:
          - ReviewCenter-Evidence-Index
          - ReviewCenter-Evidence-Visibility
          - ReviewCenter-Api-EvidenceJourney
          - ReviewCenter-Api-AnonymousEvidence
        tests:
          - ReviewCenter_ApprovedReview_EvidenceTokenAndLaterChange_BehaveAsPromised

      # ----------------------------------------------------------------------------------------------
      # Access and identity: who may act, and who may see
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-Login
        title: >-
          The tool shall let a user sign in at /login with the user name and password of a local account that is
          enabled, keep the user signed in with a session cookie for the configured number of hours, let the
          user sign out, answer every failed sign-in with the same message, so that it does not reveal whether
          the account exists, slow down repeated attempts from one client address with a limit that gives the same
          message for every user name, and end the session, including every page that is open, when the account is
          disabled, removed, or changed, within the configured number of seconds for an open page.
        tags: [system]
        justification: |
          Review actions are only trustworthy when they are attributable, which needs a verified identity (21 CFR
          Part 11 section 11.10(d) and (g), authority checks and limiting access to authorized individuals). A
          local account with a password needs no external service, and one answer for every failure does not help
          someone who is guessing user names. A limit per client address makes guessing slow without depending on
          whether the account exists. Disabling a user or changing the system administrator right must also stop a
          page that the user already has open, not only the next request, so open pages re-check the user at a
          configurable interval.
        children:
          - ReviewCenter-Identity-Login
          - ReviewCenter-Identity-Throttle
          - ReviewCenter-Identity-Session
          - ReviewCenter-Identity-CircuitSession
          - ReviewCenter-Web-SignIn
          - ReviewCenter-Web-SessionEnd
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd
          - IdentitySubsystem_Revalidation_UserDisabledAfterSignIn_OpenSessionIsNoLongerValid

      - id: ReviewCenter-System-OidcSignIn
        title: >-
          The tool shall, when an administrator turns it on, let a user sign in with an account at an OpenID Connect
          provider beside the local sign-in, create the account of a new person without any right, find it again by
          the issuer and the subject only, never link it to a local account, never give it a password, refuse a
          disabled account, accept the return address of a sign-in only when it is on this server, check the
          settings when it starts, and let the person confirm a signature by signing in again at the provider,
          once, with a time of sign-in that is fresh, as the same person, failing closed.
        tags: [system]
        justification: |
          Organizations already manage their people and their passwords at an identity provider. Using it avoids a
          second set of passwords, while the rules that the account has no rights of its own, is never joined to
          another account by a name, and must prove the same person again for every signature keep what the
          provider says from giving anybody more than the administrators of the review tool give.
        children:
          - ReviewCenter-Identity-OidcSignIn
          - ReviewCenter-Core-ExternalIdentity
          - ReviewCenter-Storage-ExternalIdentity
          - ReviewCenter-Hosting-OidcSignIn
          - ReviewCenter-Web-OidcSignIn
        tests:
          - OidcSignIn_FirstSignIn_CreatesPlainAccountAndSignsIn
          - OidcReauth_FreshSignInOfSamePerson_AllowsExactlyOneSignature
          - OidcSignIn_NameOfLocalAccount_NeverLinksToIt
          - OidcSignIn_ForeignReturnUrl_IsReplacedByHome

      - id: ReviewCenter-System-TotpSecondFactor
        title: >-
          The tool shall let a user of a local account turn on a second factor, a code of an authenticator app, and
          then ask for a fresh code after the password at every sign-in and every signature, accept each code only
          once, give ten recovery codes that get the person back in but cannot sign, count wrong codes toward the
          lockout of wrong passwords, let the user turn it off and a system administrator reset it for a person who
          lost the phone, record each change in the audit trail, keep the secret encrypted, and leave the sign-in
          with a provider and the API tokens as they were.
        tags: [system]
        justification: |
          A password that is guessed, reused, or phished must not be enough to sign in as a person or to put a
          signature in their name (21 CFR Part 11 section 11.300, two distinct identification components). A code
          of a phone that changes every thirty seconds is the cheapest second proof, and the rules about replay,
          lockout, and recovery keep it from becoming a new weak point.
        children:
          - ReviewCenter-Identity-TotpSecondFactor
          - ReviewCenter-Core-TotpSecondFactor
          - ReviewCenter-Storage-TotpSecondFactor
          - ReviewCenter-Hosting-TotpSecondFactor
          - ReviewCenter-Web-TotpSecondFactor
        tests:
          - TotpSignIn_CodeStep_RightCode_SignsInAndRedirects
          - SigningService_SignAsync_EnrolledUserWithPasswordAndFreshCode_Signs
          - TotpService_CompleteSignInAsync_ConcurrentSameCode_ExactlyOneSucceeds

      - id: ReviewCenter-System-Authorization
        title: >-
          The tool shall send a request without a signed-in user for a project, review, checklist, account, or
          user page to the login page, refuse the user administration page to a user who is not a system
          administrator, and keep the home page, the login page, and the /health URL open to everyone.
        tags: [system]
        justification: |
          Review data must only be read and changed by identified people, while the health probe and the login
          page must work without signing in. Only system administrators may manage users (21 CFR Part 11 section
          11.10(d), limiting system access to authorized individuals).
        children:
          - ReviewCenter-Identity-Authorization
          - ReviewCenter-Hosting-Authentication
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-System-ProjectAccess
        title: >-
          The tool shall let a user see and use a project, with its reviews, files, comments, signatures,
          attestation, evidence index, repositories, and history, only when the user is a member of the project or
          a system administrator, answer a request of any other user, in the web pages and in the API, as it
          answers for a project that does not exist, list only the projects the user may see, give the API token of
          a user exactly the access of its owner, and let a change of a membership or of the system administrator
          right take effect with the next request.
        tags: [system]
        justification: |
          A project may hold confidential work. Deciding visibility in one place, and answering a user who may not
          see a project exactly as for a project that does not exist, keeps the existence of a project from
          leaking through a page, an API route, or a download (21 CFR Part 11 section 11.10(d); EU GMP Annex 11
          clause 12). The memberships are read at every request so that taking access away works at once, also for
          a token that was handed out earlier.
        children:
          - ReviewCenter-Core-ProjectAccess
          - ReviewCenter-ProjectAccess-Visibility
          - ReviewCenter-ProjectAccess-SystemAdmin
          - ReviewCenter-ProjectAccess-NotFound
          - ReviewCenter-ProjectAccess-Revocation
          - ReviewCenter-Web-ProjectAccess
          - ReviewCenter-Api-ProjectAccess
          - ReviewCenter-Evidence-Visibility
          - ReviewCenter-Storage-Memberships
          - ReviewCenter-Hosting-ProjectAccess
          - ReviewCenter-Identity-AdminClaim
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused
          - ApiProjectAccess_ListProjects_ShowsOnlyMemberProjectsExceptToSystemAdmins
          - ApiProjectAccess_AttestationPage_NonMemberSession_Answers404
          - ApiProjectAccess_Token_OwnerRemovedFromProject_Gets404AtOnce

      - id: ReviewCenter-System-ProjectMembers
        title: >-
          The tool shall let a system administrator or a project admin of a project manage its members, adding an
          existing user to the project as a project admin or a member only by the exact user name, and shall make
          only the members of a project available to be named as reviewers of its reviews.
        tags: [system]
        justification: |
          Independence of review depends on who is in the project. The people who run a project must be able to
          manage its members without a system administrator, but not to browse the users of the installation, and a
          project must not be left without anybody who can manage it. A temporary password that the person must
          replace keeps the person who created the account from knowing the password that is used to sign. The
          system tests add members by the user name in a real browser; the creation of an account with a temporary
          password, the rule that a project keeps a project admin, and the refusal of other users are verified by
          the tests of the child requirements.
        children:
          - ReviewCenter-Core-ProjectAccess
          - ReviewCenter-Web-ProjectAccess
          - ReviewCenter-Storage-Memberships
        tests:
          - ReviewCenter_ReviewerSlots_NonMemberAndSamePerson_AreNotAcceptedAsReviewers

      - id: ReviewCenter-System-Users
        title: >-
          The tool shall let a system administrator list the users and create a user, make a user a system
          administrator or an ordinary user, enable and disable a user, and set a password, let every user change
          the own password, require a password of 12 to 128 characters, lock a user out for 5 minutes after 5
          failed sign-ins in a row, never disable or demote the last enabled system administrator, and keep the
          users, with only a hash of the password, in the database across restarts.
        tags: [system]
        justification: |
          Users are the accountable parties of a review. A password policy and a lockout make guessing hard (21
          CFR Part 11 section 11.300(d), safeguards against unauthorized use), the rule for the last system
          administrator keeps the system manageable, and a password hash means a copy of the database does not
          reveal the passwords.
        children:
          - ReviewCenter-Core-Users
          - ReviewCenter-Storage-Users
          - ReviewCenter-Web-SignIn
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin
          - StorageSubsystem_Users_PersistAcrossReopen

      - id: ReviewCenter-System-UserAdd
        title: >-
          The tool shall create a user in the database when the user add verb is provided with a user name, a
          display name, and an optional --system-admin switch (an ordinary user by default), taking the password
          from the REVIEWCENTER_PASSWORD environment variable, the first line of redirected standard input, or a
          prompt, never from the command line, and shall report an error with a non-zero exit code when the user
          cannot be created.
        tags: [system]
        justification: |
          The first system administrator must exist before anybody can sign in or create a project. A password on
          the command line would be visible to other processes and kept in shell history, so it is never accepted
          there.
        children:
          - ReviewCenter-Program-UserAdd
          - ReviewCenter-Cli-UserAdd
          - ReviewCenter-Hosting-UserAdd
        tests:
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate
          - ReviewCenter_UserAddVerb_NoPassword_ReturnsError

      # ----------------------------------------------------------------------------------------------
      # Git and content sources: where the reviewed code comes from
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-GitRepositories
        title: >-
          The tool shall let a project administrator or a system administrator, and nobody else, register git
          repositories in a project by name and location, with an optional user name and token, change them, and
          disable and enable them, keep them across restarts, keep each repository to its one project, and offer
          only the names of the enabled repositories of a project to the members of that project.
        tags: [system]
        justification: |
          Reviews are made from source code in git repositories. The registrations decide which repositories the
          server may read, so the administrators of the project control them, a repository belongs to exactly one
          project so that a project never sees another project's repositories, and a repository is disabled, not
          deleted, so that the reviews made from it keep their reference.
        children:
          - ReviewCenter-Core-Repositories
          - ReviewCenter-Storage-Repositories
          - ReviewCenter-Web-Repositories
          - ReviewCenter-Hosting-RepositoryServices
        tests:
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields
          - StorageSubsystem_Repositories_PersistAcrossReopen

      - id: ReviewCenter-System-GitContent
        title: >-
          The tool shall read the source code of a registered repository through the git program installed on the
          server, without a shell, keeping a bare mirror of each repository, check that a revision exists, list the
          files of a revision and the files that changed against an earlier revision (a rename being a deletion and
          an addition), skip symbolic links and submodules, enforce size limits, and report a missing git program,
          an unknown revision, a failed authentication, and a timeout as clear errors.
        tags: [system]
        justification: |
          Formal reviews compare file sets with earlier revisions. Using the installed git keeps the behavior the
          same as the developers see, and running it without a shell, with limits, and with clear errors keeps a
          hostile repository or a broken installation from harming the server or leaving the user guessing.
        children:
          - ReviewCenter-ContentSources-GitAccess
          - ReviewCenter-ContentSources-Mirror
          - ReviewCenter-ContentSources-Revisions
          - ReviewCenter-ContentSources-Changes
          - ReviewCenter-ContentSources-Content
          - ReviewCenter-ContentSources-Errors
          - ReviewCenter-ContentSources-DisabledRepository
          - ReviewCenter-Core-FileSelection
          - ReviewCenter-Hosting-GitSettings
        tests:
          - ContentSourcesSubsystem_RegisteredRepository_IsReadThroughTheRealGitSource
          - ContentSourcesSubsystem_DisabledRepository_IsNotAvailableForReading

      - id: ReviewCenter-System-Credentials
        title: >-
          The tool shall keep the access tokens of repositories only encrypted with a key ring that survives
          restarts and is itself protected at rest (see the key protection requirement), hand a token to git only
          through the environment of the git process, never in its arguments, the logs, the pages, or the audit
          trail, and refuse to start when the key ring cannot be saved.
        tags: [system]
        justification: |
          A token gives access to source code. It must not be readable in a copy of the database, in a process
          list, in a log, or on a page, and the keys must not be lost silently at a restart. A token that is
          encrypted with keys that lie beside it in plain text would be no better than a plain token, so the
          protection of the keys is part of the promise.
        children:
          - ReviewCenter-ContentSources-Credentials
          - ReviewCenter-Hosting-KeyRingFailure
        tests:
          - CredentialProtector_ProtectUnprotect_RoundTripsAndHidesToken
          - ServerHost_Restart_KeyRingPersisted_TokenStaysReadable

      - id: ReviewCenter-System-KeyProtection
        title: >-
          The tool shall protect the Data Protection key ring, which is the root of trust of the stored access
          tokens, at rest with Windows DPAPI, with a certificate that the operator supplies, or, where neither is
          available, with the permissions of its folder and a warning at every start, refuse to start when the
          protection settings are invalid, when the certificate does not open the existing ring, or when the
          operator requires encrypted keys and the ring is not encrypted, and never replace an unreadable ring
          silently with a new one.
        tags: [system, security]
        justification: |
          Whoever can read the key ring and the database can read every stored token. Encrypting the keys with a
          secret that is not stored beside them, or binding them to the account or machine, raises the cost of a
          stolen backup or disk image. The tool must be honest where the platform offers no such facility, and
          must stop rather than quietly create keys that make the stored tokens unreadable.
        children:
          - ReviewCenter-Hosting-KeyRingProtection
          - ReviewCenter-Utilities-SecretSource
        tests:
          - ServerHost_Restart_CertificateKeyRing_ProtectedValueStaysReadable
          - ServerHost_CreateApplication_WrongCertificateForTheRing_ThrowsClearErrorWithoutSecondKey

      - id: ReviewCenter-System-KeyRestore
        title: >-
          The tool shall detect a database that is restored without the key ring that belongs to it: at the server
          start it shall refuse to start, with a message that names the key folder, when the folder holds no key and
          the database holds protected secrets (unless the operator sets DataProtection:AllowNewKeyRing for one start),
          and log an error with the counts and the remedy when only some secrets cannot be decrypted, and the opt-in
          `--validate --check-config` shall report, read-only and without creating a key, the protection mode, the key
          files, the protected secrets, and how many cannot be decrypted, and fail when the ring cannot read them.
        tags: [system, security]
        justification: |
          The database and the key ring are backed up and restored separately. A database restored without its keys
          would otherwise start with a new, empty ring and make every stored repository token and second-factor secret
          unreadable without a word. The operator must learn that at the restore, before the loss is final, and must
          be able to test a restore without starting the server.
        children:
          - ReviewCenter-Hosting-SecretScan
          - ReviewCenter-Hosting-KeyRingLost
          - ReviewCenter-ValidationChecks-ConfiguredKeys
        tests:
          - ServerHost_CreateApplication_LostRing_RefusesToStartAndCreatesNoKey
          - ValidationChecks_ConfiguredKeys_EmptyRingWithSecrets_FailsAndCreatesNoKey

      # ----------------------------------------------------------------------------------------------
      # Automation: pipelines and tests
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-PersonalAccessTokens
        title: >-
          The tool shall let a signed-in user create, see, and revoke personal access tokens for their own account,
          with a name, an expiry of 30, 90, or 365 days, and at most 20 active tokens, showing the value of a token
          only once and keeping only a hash of it, so that the tokens of a user keep working only while the user is
          allowed to sign in, and shall record the creation, the revocation, and each refused use of a token in the
          audit trail without recording a token value.
        tags: [system]
        justification: |
          Pipelines and scripts that file reviews need a credential that is not a password, that is easy to hand
          out and to take back, and that gives away little if it leaks. A token that expires, can be revoked at
          once, is audited, and is stored only as a hash limits the harm of a leak and keeps every action
          attributable.
        children:
          - ReviewCenter-Core-AccessTokens
          - ReviewCenter-Storage-AccessTokens
          - ReviewCenter-Web-AccessTokens
          - ReviewCenter-Api-TokenJourney
        tests:
          - ApiSubsystem_TokenJourney_CreateUseRevoke_WorksEndToEnd
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner
          - StorageSubsystem_AccessTokens_PersistAcrossReopen

      - id: ReviewCenter-System-ApiAccess
        title: >-
          The tool shall offer an HTTP API under /api, described by an OpenAPI document, with which a client that
          sends a personal access token can list the projects its owner may see and the reviews of those projects,
          read a review, create a review draft from files or from the changes of a repository, download the
          attestation of a signed review, and read the evidence index of a project in the form that ReviewMark reads
          (with a token sent as a bearer token or as the password of HTTP Basic credentials), with the same rules as
          the web pages, but shall not let a token sign a review, arrange the reviewers, or open a web page, and
          shall answer a request for a project that its owner may not see as for a project that does not exist.
        tags: [system]
        justification: |
          Creating a draft for every pull request from a pipeline and filing the attestation of a signed review
          with the release take the manual work out of the process. The people stay the only ones who sign, so that
          a signature still proves that a person was there.
        children:
          - ReviewCenter-Api-ReviewJourney
          - ReviewCenter-Api-Isolation
          - ReviewCenter-Api-Document
          - ReviewCenter-Api-EvidenceJourney
          - ReviewCenter-Api-ProjectAccess
          - ReviewCenter-Hosting-ApiServices
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd
          - ApiSubsystem_EvidenceJourney_BasicCredentials_ReadIndexAndFollowLink_WorksEndToEnd
          - ApiSubsystem_TokenPrincipal_SigningAndWebPages_AreNotReachable
          - CoreSubsystem_TokenActor_CreatesFlaggedReviewButCannotSign
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject

      - id: ReviewCenter-System-TestIds
        title: >-
          The tool shall give every interactive element of its web pages a stable data-testid attribute, so that
          automated tests and the Puppet tool can address it.
        tags: [system]
        justification: |
          The web interface is verified and driven by automation. Addressing elements by stable identifiers,
          rather than by text or layout, keeps that automation working as the pages evolve.
        children:
          - ReviewCenter-Web-TestIds
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndTagline
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId

      # ----------------------------------------------------------------------------------------------
      # Operation and qualification: running, configuring, and qualifying the tool
      # ----------------------------------------------------------------------------------------------

      - id: ReviewCenter-System-CommandLine
        title: >-
          The tool shall be operable from the command line in a way that scripts and pipelines can rely on, by
          showing its version and its usage on request, showing a banner when no action is requested, suppressing
          console output when asked to be silent, writing its output to a log file when asked, and reporting an error
          message with a non-zero exit code for an unrecognized argument, an exit code of zero meaning success.
        tags: [system]
        justification: |
          The tool runs under supervisors, containers, and pipelines as often as in a shell. A version that can
          always be read identifies the release that produced a record (EU GMP Annex 11 clause 4, validation), usage
          output lets operators help themselves, a log file keeps a record of a run, and a reliable exit code
          lets a pipeline surface a misconfiguration instead of carrying on with it.
        children:
          - ReviewCenter-Program-Version
          - ReviewCenter-Cli-Version
          - ReviewCenter-Program-Help
          - ReviewCenter-Cli-Help
          - ReviewCenter-Cli-Silent
          - ReviewCenter-Cli-Log
          - ReviewCenter-Program-ExitCode
          - ReviewCenter-Cli-ExitCode
          - ReviewCenter-Cli-InvalidArgs
          - ReviewCenter-Cli-ErrorOutput
          - ReviewCenter-Cli-ArgumentParsing
          - ReviewCenter-Cli-OutputChannels
        tests:
          - ReviewCenter_VersionFlag_Provided_OutputsVersion
          - ReviewCenter_HelpFlag_Provided_OutputsUsageInformation
          - ReviewCenter_NoArguments_Invoked_DisplaysBanner
          - ReviewCenter_SilentFlag_Provided_SuppressesOutput
          - ReviewCenter_LogFlag_Provided_WritesOutputToFile
          - ReviewCenter_UnknownArgument_Provided_ReturnsError

      - id: ReviewCenter-System-Qualification
        title: >-
          The tool shall qualify itself in its deployment environment when the validate flag is provided, by
          exercising the behaviors it relies on (git, a complete review workflow, the fingerprint, password hashing,
          the second factor codes, the audit chain, the signed attestation, and the web host) in a hermetic way that
          never touches the configured database, writing the outcome to a TRX or JUnit result file chosen by the
          `--results` flag (with `--result` as a legacy alias) at a heading depth chosen by the `--depth` flag, and
          returning a non-zero exit code when the validation fails or the result file cannot be written in a
          supported format, with an opt-in, read-only check of the configured database and key ring by `--check-config`.
        tags: [system]
        justification: |
          Regulated environments require qualification evidence to show that the tool functions correctly in its
          deployment environment before it is used to produce compliance artifacts (21 CFR Part 11 section
          11.10(a), validation; EU GMP Annex 11 clause 4). The validation exercises the real behaviors that the
          integrity guarantees rest on, never the data of the installation, and produces a standard result file that
          quality systems can file. The same self-validation run on each supported platform is the evidence for
          the platform requirements. A silent loss of the evidence, such as an unsupported result file format, must
          fail the run.
        children:
          - ReviewCenter-Program-Validate
          - ReviewCenter-Cli-Validate
          - ReviewCenter-Cli-CheckConfig
          - ReviewCenter-Cli-Results
          - ReviewCenter-Cli-Depth
          - ReviewCenter-Cli-ResultAlias
          - ReviewCenter-SelfTest-Qualification
          - ReviewCenter-SelfTest-Hermetic
          - ReviewCenter-SelfTest-ResultsOutput
          - ReviewCenter-SelfTest-InvalidExtension
        tests:
          - ReviewCenter_ValidateFlag_Provided_RunsValidation
          - ReviewCenter_ValidateWithXmlResults_Requested_GeneratesJUnitFile
          - ReviewCenter_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel
          - ReviewCenter_ResultAlias_LegacyFlag_WritesResultsFile
          - SelfTestSubsystem_ValidationWorkflow_WithTrxFile_GeneratesResults
          - SelfTestSubsystem_ValidationWorkflow_WithUnsupportedExtension_EmitsErrorAndNoFile

      - id: ReviewCenter-System-Serve
        title: >-
          The tool shall run the ReviewCenter web server until it is stopped when the serve verb is provided,
          listening on the URL given by the `--urls` option, reporting an error and a non-zero exit code when
          `--urls` is given without the serve verb or the requested address cannot be used, answering requests for
          the /health URL with HTTP status 200 and the text Healthy while it runs, stopping cleanly on request, and
          writing start-up and request activity as structured log entries.
        tags: [system]
        justification: |
          ReviewCenter is delivered as a web service. Operators need a single command that starts the service in
          the foreground, lets them choose the address and port so that it can coexist with other services and sit
          behind a reverse proxy, and stops it cleanly, so that it can be run under a process supervisor, a
          container, or by a developer. A health URL gives reverse proxies, orchestrators, and monitoring a simple,
          unauthenticated way to find out whether it is up, and structured log entries let the running service be
          monitored and audited. Rejecting a misplaced option or an unusable address prevents a mistyped command
          from silently starting nothing, or something other than what was requested.
        children:
          - ReviewCenter-Program-Serve
          - ReviewCenter-Cli-Serve
          - ReviewCenter-Cli-Urls
          - ReviewCenter-Hosting-Health
          - ReviewCenter-Hosting-Logging
        tests:
          - ReviewCenter_ServeVerb_Started_HealthEndpointReturnsHealthy
          - ReviewCenter_ServeVerb_Started_LogsStartupEntryWithListenUrl
          - ubuntu@ReviewCenter_ServeVerb_TerminationRequested_StopsGracefullyWithExitCodeZero
          - ReviewCenter_ServeWithUrls_PortSpecified_ListensOnRequestedPort
          - ReviewCenter_UrlsWithoutServe_Provided_ReturnsError
          - ReviewCenter_ServeVerb_PortInUse_ReturnsError

      - id: ReviewCenter-System-WebInterface
        title: >-
          The tool shall serve a home page titled ReviewCenter at the root URL of the web server, showing the
          product name and tagline, with the client script that its interactive pages depend on, and shall serve an
          About page and its built-in Help pages to every visitor, including one who is not signed in.
        tags: [system]
        justification: |
          The home page is the entry point of the web user interface, and proves that pages are delivered to a
          browser, including the client script the interactive pages depend on. Users must be able to learn what
          the product does, which version runs, and how to use it before they can sign in, and without an
          administrator handing out documents (EU GMP Annex 11 clause 2, personnel who are trained to use it).
        children:
          - ReviewCenter-Web-HomePage
          - ReviewCenter-Web-Interactive
          - ReviewCenter-Web-Help
        tests:
          - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndTagline
          - ReviewCenter_ServeVerb_Started_ServesHelpAndAboutPagesWithoutSignIn

      - id: ReviewCenter-System-Persistence
        title: >-
          The tool shall keep all its records in the database named by the Database settings, creating the
          database on first start, so that the data is still there after the server is restarted, and shall report
          an error and return a non-zero exit code, without serving requests, when the Database settings cannot be
          used.
        tags: [system]
        justification: |
          Review records must outlive the server process, and the operator must be able to choose where the data
          lives so that it can be backed up and protected like any other record (21 CFR Part 11 section 11.10(c),
          protection of records to enable their accurate and ready retrieval). A new installation must work
          without manual database setup. Starting with a database that cannot be used would fail on the first
          request, so failing at start-up with a clear message lets the operator correct the setting.
        children:
          - ReviewCenter-Hosting-Database
          - ReviewCenter-Hosting-DatabaseFailure
          - ReviewCenter-Storage-Persistence
          - ReviewCenter-Storage-Integrity
          - ReviewCenter-Storage-Configuration
        tests:
          - ReviewCenter_ServeVerb_Started_RedirectsAnonymousProjectsRequestToLoginAndCreatesDatabase
          - HostingSubsystem_Startup_DatabaseConfigured_ServesStoredProjectsAfterRestart
          - HostingSubsystem_Startup_UnsupportedDatabaseProvider_FailsWithExitCodeOne
