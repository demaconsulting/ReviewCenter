      - id: ReviewCenter-System-WhereAreWe
        title: >-
          The tool shall tell every viewer of a review, in plain words and on the review page, where the review stands
          and what to do next, shall let the reviewers settle a disagreement about a check by a discussion that they
          start from there, shall show what changed to a reviewer whose signature no longer matches the report, and
          shall keep what a reviewer answered from the others until they have handed in their own ballot.
