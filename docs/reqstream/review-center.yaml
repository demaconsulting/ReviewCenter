      - id: ReviewCenter-System-ReviewerIndependence
        title: >-
          The tool shall have the reviewers of a review named beforehand in reviewer slots, each a primary reviewer
          with an optional alternate, offering only members of the project and putting each person in one slot
          only, shall never let an API token sign a review or arrange its reviewers, shall offer no way to sign
          while an unanswered check, a disputed check, or an open thread blocks the review, shall offer no way to
          change or remove a slot that holds a signature, and, while the project requires independent reviewers,
          which is the default and which a project administrator can switch off and on with the change audited,
          shall refuse the person who created a review as a reviewer of it and as its signer, and shall keep what the
          other reviewers answered hidden from a reviewer who has not handed in their own ballot.
        tags: [system]
        justification: |
          A review is independent only when the people who approve it are fixed beforehand, are distinct, and
          cannot be replaced after they have signed. Naming an alternate lets a review go on when the primary
          reviewer is away without opening the review to anybody else. A person outside the project, or a script
          holding a token, must never be able to supply a signature that stands for human judgement. Blocking
          unfinished work stops an approval of a review nobody finished (EU GMP Annex 11 clause 12, security;
          21 CFR Part 11 section 11.10(d), limiting access to authorized individuals). Nobody approves their own
          work: the author of a review is the user who created it, and the tool refuses that user in a slot and at
          the signature unless the project has turned the requirement off, for example a team of one or two. The
          tool does not match the authors of the commits in the reviewed repository to users, and it does not
          decide who else may be named. The system tests drive the web interface and the API of a running server:
          the refusal of a non-member by the server itself, and of every other person than the slot holders, is
          verified by the tests of the child requirements. Independent judgment also means that a reviewer does not
          read the answers of the others before giving their own, so those stay hidden until the own ballot is in.
