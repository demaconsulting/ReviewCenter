---
# Quality/process requirements grouping ReviewCenter's use of off-the-shelf
# (OTS) process tooling. These requirements exist so that OTS-derived requirements
# (which describe capabilities the repository's build/quality pipeline relies on
# from third-party tools, not user-visible tool functionality) are not reported
# as orphans by `dotnet reqstream --requirements requirements.yaml --enforce`.
sections:
  - title: Quality Requirements
    requirements:
      - id: Quality-TestInfrastructure
        title: The repository shall rely on xUnit to execute and report automated test results.
        tags: [quality]
        justification: |
          Automated testing depends on xUnit's test execution and reporting
          capabilities. This grouping requirement links the xUnit OTS requirements
          to the quality root so they participate in orphan detection without being
          falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-xUnit-Execute
          - ReviewCenter-OTS-xUnit-Report

      - id: Quality-BuildIntegrity
        title: >-
          The repository's build pipeline shall rely on BuildMark and VersionMark
          to validate tool versions and enforce build integrity.
        tags: [quality]
        justification: |
          CI/CD reliability depends on BuildMark's build-integrity checks and
          VersionMark's version-tracking capabilities. This grouping requirement
          links those OTS requirements to the quality root so they participate in
          orphan detection without being falsely reported as disconnected from
          tool functionality.
        children:
          - ReviewCenter-OTS-BuildMark
          - ReviewCenter-OTS-VersionMark

      - id: Quality-StaticAnalysis
        title: The repository shall rely on SarifMark and SonarMark to enforce static-analysis quality gates.
        tags: [quality]
        justification: |
          Code quality assurance depends on SarifMark's SARIF-based enforcement and
          SonarMark's SonarCloud integration. This grouping requirement links those
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-SarifMark
          - ReviewCenter-OTS-SarifMark-Enforcement
          - ReviewCenter-OTS-SonarMark

      - id: Quality-PeerReview
        title: The repository shall rely on ReviewMark to enforce peer-review tracking and reporting.
        tags: [quality]
        justification: |
          Peer-review compliance depends on ReviewMark's enforcement, elaboration,
          and linting capabilities. This grouping requirement links those OTS
          requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReviewMark
          - ReviewCenter-OTS-ReviewMark-Enforce
          - ReviewCenter-OTS-ReviewMark-Elaborate
          - ReviewCenter-OTS-ReviewMark-Lint

      - id: Quality-DocumentationGeneration
        title: The repository shall rely on Pandoc and WeasyPrint to generate HTML and PDF documentation.
        tags: [quality]
        justification: |
          Documentation generation depends on Pandoc's format conversion and
          WeasyPrint's PDF rendering. This grouping requirement links those OTS
          requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-Pandoc
          - ReviewCenter-OTS-WeasyPrint

      - id: Quality-RequirementsTraceability
        title: >-
          The repository shall rely on ReqStream and FileAssert to validate
          requirements traceability and generated documentation.
        tags: [quality]
        justification: |
          Requirements traceability depends on ReqStream's linting and reporting
          capabilities, and generated-document verification depends on FileAssert.
          This grouping requirement links those OTS requirements to the quality
          root so they participate in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReqStream
          - ReviewCenter-OTS-FileAssert

      - id: Quality-SoftwareStructureModeling
        title: The repository shall rely on SysML2Tools to lint and render software-structure models.
        tags: [quality]
        justification: |
          Software-structure documentation depends on SysML2Tools' model-linting
          and diagram-rendering capabilities. This grouping requirement links those
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-SysML2Tools-Lint
          - ReviewCenter-OTS-SysML2Tools-Render

      - id: Quality-WebPlatform
        title: The repository shall rely on ASP.NET Core to host the web application and render its components.
        tags: [quality]
        justification: |
          The ReviewCenter web service runs on ASP.NET Core with Kestrel and Blazor
          Server. This grouping requirement links the ASP.NET Core OTS requirements
          to the quality root so they participate in orphan detection without being
          falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Host
          - ReviewCenter-OTS-AspNetCore-Components
          - ReviewCenter-OTS-AspNetCore-Authentication

      - id: Quality-DataStorage
        title: The repository shall rely on Entity Framework Core with SQLite to store projects and reviews.
        tags: [quality]
        justification: |
          The Storage subsystem keeps projects and reviews in a SQLite database through
          Entity Framework Core. This grouping requirement links the EF Core OTS
          requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-EfCore-Mapping
          - ReviewCenter-OTS-EfCore-Sqlite

      - id: Quality-ComponentTesting
        title: The repository shall rely on bUnit and the ASP.NET Core test host to verify the web interface in memory.
        tags: [quality]
        justification: |
          Verification of the Razor components and the hosting pipeline without a
          browser depends on bUnit and the ASP.NET Core test host. This grouping
          requirement links those OTS requirements to the quality root so they
          participate in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-bUnit-Component
          - ReviewCenter-OTS-bUnit-TestHost

      - id: Quality-BrowserAutomation
        title: The repository shall rely on Playwright to drive the web interface from the Puppet developer tool.
        tags: [quality]
        justification: |
          The Puppet developer tool depends on Playwright and Chromium to open and
          drive the web interface. This grouping requirement links the Playwright
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium
