---
# Quality/process requirements grouping ReviewCenter's use of off-the-shelf
# (OTS) process tooling. These requirements exist so that OTS-derived requirements
# (which describe capabilities the repository's build/quality pipeline relies on
# from third-party tools, not user-visible tool functionality) are not reported
# as orphans by `dotnet reqstream --requirements requirements.yaml --enforce`.
sections:
  - title: Quality Requirements
    requirements:
      - id: Quality-TestInfrastructure
        title: The repository shall rely on xUnit to execute its automated tests.
        tags: [quality]
        justification: |
          Automated testing depends on xUnit's test execution capabilities. This
          grouping requirement links the xUnit execution OTS requirement to the
          quality root so it participates in orphan detection without being
          falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-xUnit-Execute

      - id: Quality-TestInfrastructure-Discovery
        title: The repository shall rely on xUnit to discover its automated tests.
        tags: [quality]
        justification: |
          The test run depends on xUnit finding every test without a hand-kept list.
          This grouping requirement links the xUnit discovery OTS requirement to the
          quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-xUnit-Execute-Discovery

      - id: Quality-TestInfrastructure-Report
        title: The repository shall rely on the test platform of xUnit to report automated test results.
        tags: [quality]
        justification: |
          Coverage reporting and requirements traceability depend on the TRX result
          files that the test run writes. This grouping requirement links the xUnit
          reporting OTS requirement to the quality root so it participates in orphan
          detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-xUnit-Report

      - id: Quality-BuildIntegrity
        title: The repository's build pipeline shall rely on BuildMark to generate build notes.
        tags: [quality]
        justification: |
          CI/CD reliability depends on BuildMark's build-notes generation. This
          grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-BuildMark

      - id: Quality-BuildIntegrity-VersionTracking
        title: The repository's build pipeline shall rely on VersionMark to publish the versions of its tools.
        tags: [quality]
        justification: |
          Reproducible builds depend on VersionMark's version-tracking
          capabilities. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-VersionMark

      - id: Quality-StaticAnalysis
        title: The repository shall rely on SarifMark to enforce the static-analysis quality gate.
        tags: [quality]
        justification: |
          Code quality assurance depends on SarifMark's SARIF-based enforcement.
          This grouping requirement links that OTS requirement to the quality root
          so it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-SarifMark-Enforcement

      - id: Quality-StaticAnalysis-SarifReport
        title: The repository shall rely on SarifMark to report the CodeQL results as a markdown document.
        tags: [quality]
        justification: |
          The release artifacts include the CodeQL results, which depend on
          SarifMark's report generation. This grouping requirement links that OTS
          requirement to the quality root so it participates in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-SarifMark

      - id: Quality-StaticAnalysis-SonarReport
        title: The repository shall rely on SonarMark to report the SonarCloud quality results.
        tags: [quality]
        justification: |
          The release artifacts include the SonarCloud quality gate, which depends
          on SonarMark's SonarCloud integration. This grouping requirement links
          that OTS requirement to the quality root so it participates in orphan
          detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-SonarMark

      - id: Quality-PeerReview
        title: The repository shall rely on ReviewMark to enforce that every review-set has current review evidence.
        tags: [quality]
        justification: |
          Peer-review compliance depends on ReviewMark's enforcement. This grouping
          requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReviewMark-Enforce

      - id: Quality-PeerReview-Reporting
        title: The repository shall rely on ReviewMark to produce the review plan.
        tags: [quality]
        justification: |
          Peer-review tracking depends on ReviewMark's plan generation. This
          grouping requirement links that OTS requirement to the quality root so
          it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReviewMark

      - id: Quality-PeerReview-Report
        title: The repository shall rely on ReviewMark to produce the review report.
        tags: [quality]
        justification: |
          Showing which review-sets are current or stale depends on ReviewMark's
          report generation. This grouping requirement links that OTS requirement
          to the quality root so it participates in orphan detection without being
          falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReviewMark-Report

      - id: Quality-PeerReview-Elaboration
        title: The repository shall rely on ReviewMark to elaborate review-set details for agent consumption.
        tags: [quality]
        justification: |
          Targeted automated reviews depend on ReviewMark's elaboration of the
          review-sets. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReviewMark-Elaborate

      - id: Quality-PeerReview-Lint
        title: The repository shall rely on ReviewMark to validate the review configuration file.
        tags: [quality]
        justification: |
          A faulty review configuration must stop the build, which depends on
          ReviewMark's linting. This grouping requirement links that OTS
          requirement to the quality root so it participates in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReviewMark-Lint

      - id: Quality-DocumentationGeneration
        title: The repository shall rely on Pandoc to generate HTML documentation.
        tags: [quality]
        justification: |
          Documentation generation depends on Pandoc's format conversion. This
          grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-Pandoc

      - id: Quality-DocumentationGeneration-Pdf
        title: The repository shall rely on WeasyPrint to generate PDF documentation.
        tags: [quality]
        justification: |
          The PDF documents of the release depend on WeasyPrint's PDF rendering.
          This grouping requirement links that OTS requirement to the quality root
          so it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-WeasyPrint

      - id: Quality-RequirementsTraceability
        title: The repository shall rely on ReqStream to validate requirements traceability.
        tags: [quality]
        justification: |
          Requirements traceability depends on ReqStream's linting and reporting
          capabilities. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-ReqStream

      - id: Quality-RequirementsTraceability-DocumentAssertions
        title: The repository shall rely on FileAssert to validate the generated documentation.
        tags: [quality]
        justification: |
          Generated-document verification depends on FileAssert. This grouping
          requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-FileAssert

      - id: Quality-SoftwareStructureModeling
        title: The repository shall rely on SysML2Tools to lint software-structure models.
        tags: [quality]
        justification: |
          Software-structure documentation depends on SysML2Tools' model linting.
          This grouping requirement links that OTS requirement to the quality root
          so it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-SysML2Tools-Lint

      - id: Quality-SoftwareStructureModeling-Rendering
        title: The repository shall rely on SysML2Tools to render software-structure models.
        tags: [quality]
        justification: |
          Software-structure documentation depends on SysML2Tools' diagram
          rendering. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-SysML2Tools-Render

      - id: Quality-WebPlatform
        title: The repository shall rely on ASP.NET Core to host the web application.
        tags: [quality]
        justification: |
          The ReviewCenter web service runs on ASP.NET Core with Kestrel. This
          grouping requirement links the ASP.NET Core hosting OTS requirement to the
          quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Host

      - id: Quality-WebPlatform-Components
        title: The repository shall rely on ASP.NET Core to render the components of the web application.
        tags: [quality]
        justification: |
          The user interface is built from Razor components that Blazor Server
          renders and drives. This grouping requirement links the ASP.NET Core
          component OTS requirements to the quality root so they participate in
          orphan detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Components

      - id: Quality-WebPlatform-Components-Events
        title: >-
          The repository shall rely on ASP.NET Core to handle the user events of the components of the web
          application.
        tags: [quality]
        justification: |
          A button click or an input change in the browser must reach the Razor component that handles it, or the
          interactive pages would show but not react. This grouping requirement links the ASP.NET Core event OTS
          requirement to the quality root so it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Components-Events

      - id: Quality-WebPlatform-Authentication
        title: The repository shall rely on ASP.NET Core to issue a session cookie to a user who signs in.
        tags: [quality]
        justification: |
          The sign-in with a local account keeps the user signed in with the cookie authentication of the
          framework. This grouping requirement links the ASP.NET Core cookie OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Authentication

      - id: Quality-WebPlatform-Authentication-SignOut
        title: The repository shall rely on ASP.NET Core to end the session of a user who signs out.
        tags: [quality]
        justification: |
          A user who signs out must not keep access to the protected pages, which depends on the sign-out of the
          cookie authentication. This grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Authentication-SignOut

      - id: Quality-WebPlatform-Authentication-Redirect
        title: >-
          The repository shall rely on ASP.NET Core to redirect a request for a protected page without a signed-in user
          to the login page.
        tags: [quality]
        justification: |
          A visitor who is not signed in must be led to the login page instead of seeing a protected page, which
          depends on the authorization of the framework. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Authentication-Redirect

      - id: Quality-WebPlatform-Authentication-Antiforgery
        title: The repository shall rely on ASP.NET Core to refuse a form post that carries no antiforgery token.
        tags: [quality]
        justification: |
          A form post that another web site forges must not change data in the name of a signed-in user, which
          depends on the antiforgery protection of the framework. This grouping requirement links that OTS
          requirement to the quality root so it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Authentication-Antiforgery

      - id: Quality-WebPlatform-Authentication-PasswordAccept
        title: >-
          The repository shall rely on the password hasher of ASP.NET Core to accept the right password against its
          hash.
        tags: [quality]
        justification: |
          A user who types the right password must be able to sign in, which depends on the verification of the
          password hasher. This grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Authentication-PasswordAccept

      - id: Quality-WebPlatform-Authentication-PasswordReject
        title: >-
          The repository shall rely on the password hasher of ASP.NET Core to reject a wrong password against a hash.
        tags: [quality]
        justification: |
          A wrong password must never sign a user in, which depends on the verification of the password hasher. This
          grouping requirement links that OTS requirement to the quality root so it participates in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-Authentication-PasswordReject

      - id: Quality-WebPlatform-DataProtection
        title: The repository shall rely on ASP.NET Core to encrypt the secrets that the web application stores.
        tags: [quality]
        justification: |
          The access tokens of git repositories are stored only encrypted, with the
          Data Protection of the framework. This grouping requirement links the
          ASP.NET Core data protection OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection

      - id: Quality-WebPlatform-DataProtection-KeyRing
        title: >-
          The repository shall rely on ASP.NET Core to keep its keys in a key ring in a folder, so that protected text
          can be read again after a restart.
        tags: [quality]
        justification: |
          The stored secrets must still be readable after the service has been restarted, which depends on the keys
          that survive in the key ring folder. This grouping requirement links that OTS requirement to the quality
          root so it participates in orphan detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection-KeyRing

      - id: Quality-WebPlatform-DataProtection-OtherKeyRing
        title: >-
          The repository shall rely on ASP.NET Core to refuse to decrypt text that was protected with another key ring.
        tags: [quality]
        justification: |
          A copy of the database is useless without the key ring that protected it, which depends on the keys of the
          key ring. This grouping requirement links that OTS requirement to the quality root so it participates in
          orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection-OtherKeyRing

      - id: Quality-WebPlatform-DataProtection-Purpose
        title: >-
          The repository shall rely on ASP.NET Core to refuse to decrypt text that was protected for another purpose.
        tags: [quality]
        justification: |
          Text protected for one use must not be readable by another use of the same key ring, which depends on the
          purpose that the data protection binds into the encrypted text. This grouping requirement links that OTS
          requirement to the quality root so it participates in orphan detection without being falsely reported as
          disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection-Purpose

      - id: Quality-WebPlatform-DataProtection-Certificate
        title: >-
          The repository shall rely on ASP.NET Core to encrypt the key files of the key ring with a certificate.
        tags: [quality]
        justification: |
          A key file that is copied from the key ring folder must not reveal the key, which depends on the
          encryption of the key files with the certificate that the operator supplies. This grouping requirement
          links that OTS requirement to the quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection-Certificate

      - id: Quality-WebPlatform-DataProtection-PreviousCertificate
        title: >-
          The repository shall rely on ASP.NET Core to decrypt the key files of the key ring with a previous
          certificate when the current certificate did not encrypt them.
        tags: [quality]
        justification: |
          An operator who replaces the certificate must still be able to read the key files that the earlier
          certificate encrypted, which depends on the previous-certificate support of the framework. This grouping
          requirement links that OTS requirement to the quality root so it participates in orphan detection without
          being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection-Certificate-Previous

      - id: Quality-WebPlatform-DataProtection-Dpapi
        title: >-
          The repository shall rely on ASP.NET Core to encrypt the key files of the key ring with DPAPI on Windows.
        tags: [quality]
        justification: |
          On Windows the key files can be protected at rest with DPAPI, which depends on the DPAPI protection of the
          framework. This grouping requirement links that OTS requirement to the quality root so it participates in
          orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-AspNetCore-DataProtection-Dpapi

      - id: Quality-DataStorage
        title: >-
          The repository shall rely on Entity Framework Core with SQLite to return the entities that it saved
          unchanged.
        tags: [quality]
        justification: |
          The Storage subsystem keeps its data in a SQLite database through
          Entity Framework Core, and every record must come back as it was saved. This grouping requirement links
          the EF Core mapping OTS requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-EfCore-Mapping
          - ReviewCenter-OTS-EfCore-Mapping-BinaryColumns

      - id: Quality-DataStorage-CompositeKeys
        title: >-
          The repository shall rely on Entity Framework Core to map a composite key that spans a project and a review
          identifier.
        tags: [quality]
        justification: |
          A review is identified by its project and its own identifier together, so the mapping of the table
          depends on composite keys. This grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-EfCore-Mapping-CompositeKeys

      - id: Quality-DataStorage-Database
        title: >-
          The repository shall rely on the Entity Framework Core SQLite provider to create a database file with the
          tables of the model on first use.
        tags: [quality]
        justification: |
          A new installation starts without a database file and must be able to create one without a separate setup
          step. This grouping requirement links that OTS requirement to the quality root so it participates in orphan
          detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-EfCore-Sqlite

      - id: Quality-DataStorage-KeyUniqueness
        title: >-
          The repository shall rely on the Entity Framework Core SQLite provider to make the database refuse a
          duplicate key.
        tags: [quality]
        justification: |
          A second record with the key of an existing one must not overwrite or double it, so the Storage subsystem
          depends on the uniqueness that the database enforces. This grouping requirement links that OTS requirement
          to the quality root so it participates in orphan detection without being falsely reported as disconnected
          from tool functionality.
        children:
          - ReviewCenter-OTS-EfCore-Sqlite-KeyUniqueness

      - id: Quality-DataStorage-Relationship
        title: >-
          The repository shall rely on the Entity Framework Core SQLite provider to make the database refuse a review
          that belongs to no project.
        tags: [quality]
        justification: |
          A review without a project would be unreachable, so the Storage subsystem depends on the relationship that
          the database enforces. This grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-EfCore-Sqlite-Relationship

      - id: Quality-ComponentTesting
        title: The repository shall rely on bUnit to verify the Razor components of the web interface in memory.
        tags: [quality]
        justification: |
          Verification of the Razor components without a browser depends on bUnit.
          This grouping requirement links the bUnit render OTS requirement to the quality
          root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-bUnit-Component

      - id: Quality-ComponentTesting-FormSubmission
        title: The repository shall rely on bUnit to simulate the submission of a form of a rendered Razor component.
        tags: [quality]
        justification: |
          The tests of the forms of the web interface submit the forms without a browser, which depends on the form
          simulation of bUnit. This grouping requirement links that OTS requirement to the quality root so it
          participates in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-bUnit-Component-FormSubmission

      - id: Quality-ComponentTesting-FileSelection
        title: >-
          The repository shall rely on bUnit to simulate the selection of files in a file input of a rendered Razor
          component.
        tags: [quality]
        justification: |
          The tests of the upload pages choose files without a browser, which depends on the file selection of bUnit.
          This grouping requirement links that OTS requirement to the quality root so it participates in orphan
          detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-bUnit-Component-FileSelection

      - id: Quality-ComponentTesting-TestHost
        title: The repository shall rely on the ASP.NET Core test host to verify the hosting pipeline in memory.
        tags: [quality]
        justification: |
          Verification of the hosting pipeline without a network listener depends on
          the ASP.NET Core test host. This grouping requirement links that OTS
          requirement to the quality root so it participates in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-bUnit-TestHost

      - id: Quality-ComponentTesting-TestProvider
        title: The repository shall rely on OpenIddict as a test identity provider to serve its discovery document.
        tags: [quality]
        justification: |
          Verification of the sign-in with an identity provider depends on OpenIddict
          as a provider that is used only by the tests, and the sign-in code starts by finding the provider through
          its discovery document. This grouping requirement links the OpenIddict discovery OTS requirement to the
          quality root so it participates in orphan detection without being falsely reported as disconnected from
          tool functionality.
        children:
          - ReviewCenter-OTS-OpenIddict-TestProvider

      - id: Quality-ComponentTesting-TestProvider-SigningKeys
        title: The repository shall rely on OpenIddict as a test identity provider to serve its signing keys.
        tags: [quality]
        justification: |
          The sign-in code checks the signature of an identity token with the keys that the provider serves. This
          grouping requirement links that OTS requirement to the quality root so it participates in orphan detection
          without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenter-OTS-OpenIddict-TestProvider-SigningKeys

      - id: Quality-ComponentTesting-TestProvider-IdentityToken
        title: >-
          The repository shall rely on OpenIddict as a test identity provider to issue an identity token that is signed
          with its keys in the authorization code flow with a proof key.
        tags: [quality]
        justification: |
          The sign-in of the web application is an authorization code flow with a proof key, and a test of it needs a
          signed identity token at the end of the flow. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely reported as disconnected from
          tool functionality.
        children:
          - ReviewCenter-OTS-OpenIddict-TestProvider-IdentityToken

      - id: Quality-ComponentTesting-TestProvider-AuthTime
        title: >-
          The repository shall rely on OpenIddict as a test identity provider to put the authentication time of the
          login into the identity tokens that it issues.
        tags: [quality]
        justification: |
          The confirmation of identity for a signature checks the time of the login, so the tests of it need a
          provider that puts the time into the token. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely reported as disconnected from
          tool functionality.
        children:
          - ReviewCenter-OTS-OpenIddict-TestProvider-AuthTime

      - id: Quality-BrowserAutomation
        title: >-
          The repository shall rely on Playwright to load the pages of the web interface in the Puppet developer tool.
        tags: [quality]
        justification: |
          The Puppet developer tool depends on Playwright and Chromium to open the
          web interface. This grouping requirement links the Playwright page-loading
          OTS requirement to the quality root so it participates in orphan
          detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium

      - id: Quality-BrowserAutomation-Click
        title: >-
          The repository shall rely on Playwright to click an element of the web interface in the Puppet developer
          tool.
        tags: [quality]
        justification: |
          Buttons and links are the main way that the Puppet developer tool moves through the interface, which
          depends on the click of Playwright. This grouping requirement links that OTS requirement to the quality
          root so it participates in orphan detection without being falsely reported as disconnected from tool
          functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium-Click

      - id: Quality-BrowserAutomation-Hover
        title: >-
          The repository shall rely on Playwright to hover an element of the web interface in the Puppet developer
          tool.
        tags: [quality]
        justification: |
          Controls that only appear under the mouse can be reached by the Puppet developer tool only with the hover
          of Playwright. This grouping requirement links that OTS requirement to the quality root so it participates
          in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium-Hover

      - id: Quality-BrowserAutomation-Fill
        title: >-
          The repository shall rely on Playwright to fill a form field of the web interface in the Puppet developer
          tool.
        tags: [quality]
        justification: |
          The Puppet developer tool fills the forms of the interface field by field, which depends on the field fill
          of Playwright. This grouping requirement links that OTS requirement to the quality root so it participates
          in orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium-Fill

      - id: Quality-BrowserAutomation-ReadText
        title: >-
          The repository shall rely on Playwright to read the text of an element of the web interface in the Puppet
          developer tool.
        tags: [quality]
        justification: |
          The text of an element is the cheapest way for the Puppet developer tool to report what a page says, which
          depends on the text reading of Playwright. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely reported as disconnected from
          tool functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium-ReadText

      - id: Quality-BrowserAutomation-ColorScheme
        title: >-
          The repository shall rely on Playwright to emulate the color scheme of the web interface in the Puppet
          developer tool.
        tags: [quality]
        justification: |
          The Puppet developer tool checks both themes of the interface without changing the settings of the
          operating system, which depends on the color scheme emulation of Playwright. This grouping requirement links
          that OTS requirement to the quality root so it participates in orphan detection without being falsely
          reported as disconnected from tool functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium-ColorScheme

      - id: Quality-BrowserAutomation-Screenshot
        title: >-
          The repository shall rely on Playwright to capture a screenshot of the web interface in the Puppet developer
          tool.
        tags: [quality]
        justification: |
          A coding agent that polishes the interface judges it from screenshots, which depends on the capture of
          Playwright. This grouping requirement links that OTS requirement to the quality root so it participates in
          orphan detection without being falsely reported as disconnected from tool functionality.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium-Screenshot

      - id: Quality-SourceAccess
        title: >-
          The repository shall rely on the installed git program to mirror repositories into bare repository folders.
        tags: [quality]
        justification: |
          The ContentSources subsystem reads source code by running git, and it starts by mirroring the repository.
          This grouping requirement links the git mirror OTS requirement to the quality root so it participates in
          orphan detection without being falsely reported as disconnected from tool functionality.
        children:
