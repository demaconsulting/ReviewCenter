---
# ReviewCenterPuppet System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what a coding agent needs the Puppet development
#   tool to provide: one persistent headless browser that it drives one command per shell call
#   (act, look at the screenshot or page text, decide, act) against a ReviewCenter server that
#   the agent starts separately
# - Puppet is a separate software system that is not part of the distributed ReviewCenter package
# - System requirements are validated by the single real-browser end-to-end test, which is linked
#   with the windows@ and ubuntu@ filters to prove it passed on both supported platforms. CI
#   installs Chromium and makes a missing browser fail that test.

sections:
  - title: ReviewCenterPuppet Requirements
    requirements:
      - id: ReviewCenterPuppet-System-Lifecycle
        title: >-
          The tool shall start one persistent headless browser that stays open between commands, report
          when it is already running or not running, and stop the browser and remove its control file
          when told to stop.
        tags: [system]
        justification: |
          A coding agent runs one shell command at a time. A browser that lives between commands lets it
          keep the page, the scroll position, and the hover state while it decides what to do next.
        children:
          - ReviewCenterPuppet-PuppetProgram-Arguments
          - ReviewCenterPuppet-ControlChannel-Protocol
          - ReviewCenterPuppet-BrowserDaemon-Lifecycle
          - ReviewCenterPuppet-PlaywrightBrowser-LaunchFailure
        tests:
          - windows@PuppetEndToEnd_StartDriveStop_HelloAndCounter_WorksAgainstRealServer
          - ubuntu@PuppetEndToEnd_StartDriveStop_HelloAndCounter_WorksAgainstRealServer

      - id: ReviewCenterPuppet-System-Interact
        title: >-
          The tool shall navigate, click, hover, fill, press keys, wait for an element or text, and read
          page text or the list of interactive elements, with the hover state persisting between commands
          until the mouse is moved again; every result shall include the current URL, the page title, and
          any new console errors, page errors, or failed requests, and a failed command shall print a
          short message and exit with a non-zero code.
        tags: [system]
        justification: |
          The agent decides its next action from what the last command reported, so each result must show
          where the browser is and what went wrong, and a bad selector must fail fast with a clear
          message. Hover effects only show in a later screenshot if the hover is not undone in between.
        children:
          - ReviewCenterPuppet-PuppetProgram-Results
          - ReviewCenterPuppet-SelectorResolver-Resolve
          - ReviewCenterPuppet-PlaywrightBrowser-Navigation
        tests:
          - windows@PuppetEndToEnd_StartDriveStop_HelloAndCounter_WorksAgainstRealServer
          - ubuntu@PuppetEndToEnd_StartDriveStop_HelloAndCounter_WorksAgainstRealServer

      - id: ReviewCenterPuppet-System-VisualCheck
        title: >-
          The tool shall save a PNG screenshot of the page or of one element, change the viewport size,
          emulate the light or dark color scheme, and evaluate a JavaScript expression in the page.
        tags: [system]
        justification: |
          A coding agent polishing the interface looks at screenshots at several sizes and themes and
          reads computed styles to confirm what it sees.
        children:
          - ReviewCenterPuppet-OTS-Playwright-Chromium
        tests:
          - windows@PuppetEndToEnd_StartDriveStop_HelloAndCounter_WorksAgainstRealServer
          - ubuntu@PuppetEndToEnd_StartDriveStop_HelloAndCounter_WorksAgainstRealServer
