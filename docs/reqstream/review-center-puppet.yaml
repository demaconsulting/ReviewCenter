---
# ReviewCenterPuppet System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what a coding agent needs the Puppet development
#   tool to provide: run a steps file against the ReviewCenter server and leave screenshots
# - Puppet is a separate software system that is not part of the distributed ReviewCenter package
# - System requirements are validated by system tests that run the whole pipeline with only the
#   browser and the server process replaced by fakes (so they run anywhere), and by the real-browser
#   end-to-end test, which is linked with the windows@ and ubuntu@ filters to prove it passed on both
#   supported platforms. CI installs Chromium and makes a missing browser fail that test.

sections:
  - title: ReviewCenterPuppet Requirements
    requirements:
      - id: ReviewCenterPuppet-System-RunSteps
        title: >-
          The tool shall start the ReviewCenter server and a headless browser, run the ordered steps of a
          steps file (go to a page, click, fill, read text, take a screenshot), print one result line per
          step, and write the screenshots to an output folder.
        tags: [system]
        justification: |
          A coding agent needs to see the web interface it is changing. One command that runs a list of
          steps and leaves screenshots and text results behind is all it needs to check the result.
        children:
          - ReviewCenterPuppet-PuppetProgram-Arguments
          - ReviewCenterPuppet-StepRunner-Parse
          - ReviewCenterPuppet-StepRunner-Execute
          - ReviewCenterPuppet-SelectorResolver-Resolve
          - ReviewCenterPuppet-ServerProcess-Lifecycle
          - ReviewCenterPuppet-OTS-Playwright-Chromium
        tests:
          - ReviewCenterPuppet_Run_AllStepsSucceed_ExitsZeroAndStopsEverything
          - windows@PuppetEndToEnd_StepsFile_HelloAndCounter_WritesScreenshotAndReportsText
          - ubuntu@PuppetEndToEnd_StepsFile_HelloAndCounter_WritesScreenshotAndReportsText

      - id: ReviewCenterPuppet-System-Failures
        title: >-
          The tool shall stop at the first failing step, save a failure screenshot when it can, and exit with
          a non-zero code and a clear message; it shall exit with a different code when it cannot run at all
          (bad arguments, bad steps file, browser or server that cannot start).
        tags: [system]
        justification: |
          A coding agent reads the exit code and the message to decide what to fix. A missing element or a
          missing Chromium installation must therefore be reported plainly, with the install command where
          that is the fix, and never reported as success.
        children:
          - ReviewCenterPuppet-StepRunner-Execute
          - ReviewCenterPuppet-PlaywrightBrowser-LaunchFailure
        tests:
          - ReviewCenterPuppet_Run_StepFails_ExitsOneWithFailureScreenshotAndStopsEverything
          - ReviewCenterPuppet_Run_BrowserCannotLaunch_ExitsTwoAndStopsServer

      - id: ReviewCenterPuppet-System-Cleanup
        title: >-
          The tool shall stop the browser and the server it started when the run ends, whether the steps
          succeeded, a step failed, or the browser could not be launched.
        tags: [system]
        justification: |
          A leftover server or browser makes later runs unreliable and wastes resources. Cleanup is best
          effort: if the Puppet process itself is killed, a server or browser may linger.
        tests:
          - ReviewCenterPuppet_Run_AllStepsSucceed_ExitsZeroAndStopsEverything
          - ReviewCenterPuppet_Run_StepFails_ExitsOneWithFailureScreenshotAndStopsEverything
          - ReviewCenterPuppet_Run_BrowserCannotLaunch_ExitsTwoAndStopsServer
