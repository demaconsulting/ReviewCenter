---
# DaemonHost Unit Requirements
#
# PURPOSE:
# - Define requirements for the DaemonHost unit (tools/puppet/DaemonHost.cs, with the production
#   adapters in tools/puppet/ServerProcessRunner.cs and tools/puppet/PlaywrightBrowser.cs)
# - DaemonHost is verified with fake server and browser abstractions; the production adapters
#   are exercised only by the real-browser end-to-end test, which is not linked to a requirement
#   because it is skipped on machines without Chromium

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: DaemonHost Requirements
        requirements:
          - id: ReviewCenterPuppet-DaemonHost-Ready
            title: >-
              The DaemonHost unit shall start the server and the browser, publish the session as ready with
              the control port, token, server URL, and the process details of the daemon, the server, and
              the browser, and then serve commands.
            justification: |
              The starting command and later commands learn everything they need about the session from the
              published file, so it must be complete before the session is reported ready. The process
              details let a later command end exactly these processes if the daemon dies.
            tests:
              - DaemonHost_Run_Ready_RecordsServerAndDaemonDetails
              - DaemonHost_Run_Ready_RecordsBrowserProcessIdentity
              - DaemonHost_Run_FakeBrowserClickCommand_ReturnsOk

          - id: ReviewCenterPuppet-DaemonHost-Stop
            title: >-
              The DaemonHost unit shall close the browser, stop the server, and delete the session file when
              it is asked to stop.
            justification: |
              Stopping must leave no browser, server, or file behind.
            tests:
              - DaemonHost_Run_FakeBrowserClickCommand_ReturnsOk

          - id: ReviewCenterPuppet-DaemonHost-ServerStopFailure
            title: >-
              The DaemonHost unit shall, when the server process does not exit after being killed, end its
              whole process tree, and if it still does not exit shall report the failure by recording a failed
              session and returning exit code 4 instead of reporting the cleanup as complete.
            justification: |
              A server that silently stays alive holds a port and memory after the session is reported
              stopped. The failure must be visible to the caller so that the leftover can be dealt with.
            tests:
              - DaemonHost_ServerStop_ExitsAfterFirstKill_KillsOnce
              - DaemonHost_ServerStop_ExitsAfterEscalation_KillsTwice
              - DaemonHost_ServerStop_NeverExits_ThrowsPuppetException
              - DaemonHost_Run_ServerCannotBeStopped_ReportsFailureAndReturnsFour

          - id: ReviewCenterPuppet-DaemonHost-IdleShutdown
            title: >-
              The DaemonHost unit shall shut down and remove the session file when the control channel
              reports that the idle period has elapsed.
            justification: |
              Abandoned sessions must clean up after themselves.
            tests:
              - DaemonHost_Run_Idle_ShutsDownAndRemovesSession
              - DaemonHost_Run_ReplacementPublishedDuringShutdown_IsNotDeleted
              - DaemonHost_Run_StartLockHeldDuringShutdown_LeavesRecordForTheStart

          - id: ReviewCenterPuppet-DaemonHost-StartFailure
            title: >-
              The DaemonHost unit shall record a failed session with the reason and return exit code 4 when
              the server or the browser cannot be started.
            justification: |
              The process that requested the start needs the reason, and a failed start must not leave a
              half-started server or browser behind.
            tests:
              - DaemonHost_Run_BrowserLaunchFails_WritesFailedSessionAndReturnsFour
              - DaemonHost_Run_ServerStartFails_WritesFailedSessionAndReturnsFour

          - id: ReviewCenterPuppet-DaemonHost-UnexpectedFailure
            title: >-
              The DaemonHost unit shall answer a command that fails unexpectedly, including a failed
              screenshot or a screenshot that exceeds the command's timeout, with a failed response, shall
              treat an unexpected start-up failure like a start failure (failed session, exit code 4), and
              shall always release the browser and the server.
            justification: |
              When the browser dies mid-session, the caller needs a clear error and a session that can still
              be stopped cleanly. An unexpected failure must never leave a browser or server running or end
              the daemon silently.
            tests:
              - DaemonHost_Run_ScreenshotThrowsUnexpected_ReturnsFailureAndKeepsServing
              - DaemonHost_Run_BrowserLaunchThrowsUnexpected_WritesFailedSessionAndReturnsFour
              - DaemonHost_PlaywrightPage_ScreenshotFails_ThrowsPuppetException
              - DaemonHost_PlaywrightPage_ScreenshotTimesOut_AppliesTimeoutAndThrowsPuppetException

          - id: ReviewCenterPuppet-DaemonHost-ReadinessCheck
            title: >-
              The DaemonHost unit shall consider the server ready only when its health endpoint answers status
              200 with the exact body "Healthy", keep waiting while the endpoint is unavailable or answers an
              error status, and fail the start with the answer it saw when a success answer has any other
              content.
            justification: |
              The port is chosen before the server binds it, so another local process could answer in its
              place, and a success status with other content is not proof that the ReviewCenter server is the
              one answering. Driving the browser against the wrong service would report a session that does
              not test the application.
            tests:
              - DaemonHost_HealthProbe_ExactHealthyAnswer_IsHealthy
              - DaemonHost_HealthProbe_SuccessWithoutExactBody_IsMismatchNamingTheAnswer
              - DaemonHost_HealthProbe_Redirect_IsMismatchAndNotFollowed
              - DaemonHost_HealthProbe_ErrorStatusOrNoListener_IsNotReady

          - id: ReviewCenterPuppet-DaemonHost-ProtocolSessionRelease
            title: >-
              The DaemonHost unit shall detach the temporary browser-protocol session it opens to learn the
              browser's process identity once it has been used, including when the query fails or the browser
              has already closed.
            justification: |
              The session serves one query. Left attached, it keeps protocol resources alive in the browser
              for the rest of the session, and every launch would add another.
            tests:
              - DaemonHost_PlaywrightBrowser_ProcessQuery_DetachesProtocolSession
              - DaemonHost_PlaywrightBrowser_DetachFailsBecauseBrowserClosed_IsTolerated
