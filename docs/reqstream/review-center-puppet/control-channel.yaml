---
# ControlChannel Unit Requirements
#
# PURPOSE:
# - Define requirements for the ControlChannel unit (tools/puppet/ControlProtocol.cs and
#   tools/puppet/ControlServer.cs)
# - ControlChannel carries commands from the short-lived client processes to the session daemon
#   over a local-only, token-authenticated connection

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: ControlChannel Requirements
        requirements:
          - id: ReviewCenterPuppet-ControlChannel-Delivery
            title: >-
              The ControlChannel unit shall deliver a request to the daemon's handler and return the
              handler's response to the client, with the request and response encoded as one line of JSON each.
            justification: |
              This is the path every browser command takes from the client process to the daemon, so
              requests and responses must arrive intact.
            tests:
              - ControlChannel_Send_ValidToken_ReturnsHandlerResponse
              - ControlChannel_SerializeDeserialize_Request_RoundTrips

          - id: ReviewCenterPuppet-ControlChannel-TokenAuth
            title: >-
              The ControlChannel unit shall reject a request whose token does not match the session token
              without calling the handler.
            justification: |
              The control port is reachable by every process on the machine. The random per-session token,
              stored only in the session file, keeps other local processes from driving the browser.
            tests:
              - ControlChannel_Send_WrongToken_IsRejectedWithoutCallingHandler

          - id: ReviewCenterPuppet-ControlChannel-LoopbackOnly
            title: The ControlChannel unit shall listen only on the loopback interface, on a system-chosen port.
            justification: |
              The browser of a session can reach authenticated pages, so the control channel must never be
              reachable from another machine, and a chosen port avoids clashes between sessions.
            tests:
              - ControlChannel_Server_Listening_BindsToLoopbackOnly

          - id: ReviewCenterPuppet-ControlChannel-IdleTimeout
            title: >-
              The ControlChannel unit shall end the server loop after a configurable idle period with no
              requests, which is 30 minutes by default.
            justification: |
              A session that nobody uses, for example because its caller crashed, must not keep a server and
              a browser running forever.
            tests:
              - ControlChannel_Run_NoRequests_ReturnsTrueAfterIdleTimeout

          - id: ReviewCenterPuppet-ControlChannel-Cancellation
            title: The ControlChannel unit shall end the server loop promptly when it is cancelled.
            justification: |
              The stop command and daemon shutdown must not wait for the idle period, so the loop has to
              respond to cancellation.
            tests:
              - ControlChannel_Run_Cancelled_ReturnsFalse

          - id: ReviewCenterPuppet-ControlChannel-Unreachable
            title: >-
              The ControlChannel unit shall report a PuppetException when the client cannot connect to the
              daemon.
            justification: |
              A daemon that is not listening is an expected situation, and the caller needs a clear error
              rather than a raw socket failure.
            tests:
              - ControlChannel_Send_NothingListening_ThrowsPuppetException

          - id: ReviewCenterPuppet-ControlChannel-ResponseTimeout
            title: >-
              The ControlChannel unit shall report a PuppetException when the daemon does not answer within
              the allowed time.
            justification: |
              A stuck daemon must not hang the calling script indefinitely.
            tests:
              - ControlChannel_Send_HandlerTooSlow_ThrowsPuppetExceptionOnTimeout

          - id: ReviewCenterPuppet-ControlChannel-MalformedMessage
            title: The ControlChannel unit shall report a PuppetException when a message is not valid JSON.
            justification: |
              A damaged or unexpected message must produce a clear error instead of an unhandled parser
              failure.
            tests:
              - ControlChannel_Deserialize_MalformedJson_ThrowsPuppetException

          - id: ReviewCenterPuppet-ControlChannel-UnexpectedFailure
            title: >-
              The ControlChannel unit shall answer a request whose handler fails unexpectedly with a failed
              response that names the problem, and shall keep serving later requests.
            justification: |
              A crashed browser or another unanticipated failure while handling one command must not end the
              session's control loop without an answer, because the caller would see only a closed connection
              and the session would look healthy until it was used again.
            tests:
              - ControlChannel_Send_HandlerThrowsUnexpected_ReturnsFailedResponseAndKeepsServing

          - id: ReviewCenterPuppet-ControlChannel-ResponseStrictness
            title: >-
              The ControlChannel unit shall accept from the daemon only a JSON object with exactly a boolean
              Ok, an integer ExitCode, and a string Message, and shall fail with an error naming the port for
              any other answer.
            justification: |
              Once a daemon is gone its port can be taken by an unrelated service, which may answer with
              anything. Turning such an answer into a "failed command" with an empty message would report a
              session that does not exist as a live one that misbehaved. The server readiness probe is equally
              strict about what it accepts. The channel is a raw line protocol, so there are no redirects to
              follow.
            tests:
              - ControlChannel_ParseResponse_AcceptsOnlyTheExactResponseShape
              - ControlChannel_Send_ForeignServiceAnswersWithEmptyObject_ThrowsPuppetException
