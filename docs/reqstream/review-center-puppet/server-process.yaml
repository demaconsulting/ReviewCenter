---
# ServerProcess Unit Requirements
#
# PURPOSE:
# - Define requirements for the ServerProcess unit (tools/puppet/ServerProcess.cs)
# - ServerProcess starts the ReviewCenter server on a free port and stops it again

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: ServerProcess Requirements
        requirements:
          - id: ReviewCenterPuppet-ServerProcess-Lifecycle
            title: >-
              The ServerProcess unit shall start the ReviewCenter server on a free loopback port, wait until it
              reports healthy, and stop the server process when disposed.
            justification: |
              The Puppet needs a real server to drive, must not collide with anything already listening on a
              fixed port, and must not leave the server running after the run.
            tests:
              - ServerProcess_Start_RealServer_BecomesHealthyAndStopsOnDispose
