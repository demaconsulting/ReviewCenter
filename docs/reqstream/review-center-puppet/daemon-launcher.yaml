---
# DaemonLauncher Unit Requirements
#
# PURPOSE:
# - Define requirements for the DaemonLauncher unit (tools/puppet/DaemonLauncher.cs)
# - Only the command-line construction can be verified in isolation; starting a detached process
#   is exercised by the real-browser end-to-end test (which CI runs with Chromium installed and
#   which is linked to the Puppet system requirements) and a manual demonstration

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: DaemonLauncher Requirements
        requirements:
          - id: ReviewCenterPuppet-DaemonLauncher-ArgumentsPreserved
            title: >-
              The DaemonLauncher unit shall deliver the session id and the server path to the daemon
              unchanged, including paths that contain spaces, quotes, or a trailing backslash.
            justification: |
              The daemon receives its session id and server path as arguments of the process that is
              started for it, and install paths commonly contain spaces. A value that arrives altered, or
              that splits into several arguments, would make every session fail to start or let a crafted
              value inject an option.
            tests:
              - DaemonLauncher_BuildCommandLine_PathsWithSpaces_AreQuoted
              - DaemonLauncher_BuildCommandLine_EmbeddedQuote_IsEscaped
              - windows@DaemonLauncher_BuildCommandLine_SpecialArguments_RoundTripThroughWindowsParsing

          - id: ReviewCenterPuppet-DaemonLauncher-ProcessIdentity
            title: >-
              The DaemonLauncher unit shall report, for a process it starts, the process id and start time of
              the process that was actually created, even when the process exits at once and its id is reused,
              and shall end a process whose identity it cannot determine instead of leaving it running unrecorded.
            justification: |
              Every later liveness check and kill of the daemon is judged by this identity. If it were looked up
              after the launch, a daemon that exited at once and whose id was recycled could be recorded with
              another program's start time, and that program could later be ended by mistake. A daemon that runs
              without any recorded identity can never be cleaned up, so it must not be left behind.
            tests:
              - DaemonLauncher_LaunchProcess_ReportsIdentityOfTheCreatedProcess
              - DaemonLauncher_CaptureIdentity_IdentityCannotBeRead_EndsCreatedProcessAndRethrows
              - DaemonLauncher_CaptureIdentity_TerminationFailsOrNotNeeded_OriginalOutcomeIsKept
              - DaemonLauncher_CaptureIdentity_PartialTreeKill_IsReportedWithTheOriginalReason
