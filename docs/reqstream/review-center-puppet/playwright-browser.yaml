---
# PlaywrightBrowser Unit Requirements
#
# PURPOSE:
# - Define requirements for the PlaywrightBrowser unit (tools/puppet/PlaywrightBrowser.cs)
# - PlaywrightBrowser drives headless Chromium through Playwright, one flat command at a time
# - Driving a real Chromium is proven by the end-to-end test linked to the system requirements
# - Every requirement states one criterion. The first criterion of a topic keeps the original id; the further
#   criteria of the same topic are named <original id>-<Aspect>.

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: PlaywrightBrowser Requirements
        requirements:
          - id: ReviewCenterPuppet-PlaywrightBrowser-LaunchFailure
            title: >-
              The PlaywrightBrowser unit shall name the command that installs Chromium in the message about a
              launch failure when the browser is missing.
            justification: |
              A missing Chromium is the most common first-run problem, and the fix is one command that the
              message can name.
            tests:
              - PlaywrightBrowser_DescribeLaunchFailure_ChromiumMissingOrOtherFailure_NamesFixOrFirstLine

          - id: ReviewCenterPuppet-PlaywrightBrowser-LaunchFailure-OtherFailure
            title: >-
              The PlaywrightBrowser unit shall report any other launch failure with the first line of the
              error.
            justification: |
              The first line is the short cause; the rest of a Playwright error is a long log that would flood
              the agent.
            tests:
              - PlaywrightBrowser_DescribeLaunchFailure_ChromiumMissingOrOtherFailure_NamesFixOrFirstLine

          - id: ReviewCenterPuppet-PlaywrightBrowser-Navigation
            title: >-
              The PlaywrightBrowser unit shall resolve a path against the base URL given at start.
            justification: |
              The agent types short paths such as /counter while the server port changes from run to run.
            tests:
              - PlaywrightBrowser_ResolveUrl_PathAndAbsoluteAndMissingBase_ResolvesOrThrows

          - id: ReviewCenterPuppet-PlaywrightBrowser-Navigation-AbsoluteUrl
            title: >-
              The PlaywrightBrowser unit shall use an absolute URL as it is given.
            justification: |
              An agent that names a full address, for example of another site, must arrive exactly there.
            tests:
              - PlaywrightBrowser_ResolveUrl_PathAndAbsoluteAndMissingBase_ResolvesOrThrows

          - id: ReviewCenterPuppet-PlaywrightBrowser-Navigation-MissingBase
            title: >-
              The PlaywrightBrowser unit shall reject a path when no base URL was given at start.
            justification: |
              Without a base URL a bare path cannot be resolved, and the agent must be told so instead of
              navigating to a wrong address.
            tests:
              - PlaywrightBrowser_ResolveUrl_PathAndAbsoluteAndMissingBase_ResolvesOrThrows
