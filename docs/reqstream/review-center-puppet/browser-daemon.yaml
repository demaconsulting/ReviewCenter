---
# BrowserDaemon Unit Requirements
#
# PURPOSE:
# - Define requirements for the BrowserDaemon unit (tools/puppet/BrowserDaemon.cs)
# - BrowserDaemon is the long-lived process that owns the browser and serves commands
# - The unit test covers the part that needs no browser: the failure to start. Launching the browser, serving
#   commands, and stopping are proven by the end-to-end test linked to the system requirements.
# - Every requirement states one criterion. The first criterion of a topic keeps the original id; the further
#   criteria of the same topic are named <original id>-<Aspect>.

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: BrowserDaemon Requirements
        requirements:
          - id: ReviewCenterPuppet-BrowserDaemon-Lifecycle
            title: >-
              The BrowserDaemon unit shall publish the control file with the failure message and without a port
              when the browser cannot start.
            justification: |
              The control file is how the commands find the daemon, so a port must be published only while the
              daemon can answer, and the start command needs the reason to show to the agent.
            tests:
              - BrowserDaemon_RunAsync_BadViewport_PublishesStartFailureWithoutPort

          - id: ReviewCenterPuppet-BrowserDaemon-Lifecycle-StartFailureExit
            title: >-
              The BrowserDaemon unit shall exit with code 1 when the browser cannot start.
            justification: |
              The exit code of the daemon process separates a start-up failure from a normal stop (exit code 0).
            tests:
              - BrowserDaemon_RunAsync_BadViewport_PublishesStartFailureWithoutPort
