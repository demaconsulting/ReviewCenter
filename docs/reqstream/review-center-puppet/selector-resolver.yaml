---
# SelectorResolver Unit Requirements
#
# PURPOSE:
# - Define requirements for the SelectorResolver unit (tools/puppet/SelectorResolver.cs)
# - SelectorResolver turns the selector text a user types into the selector the browser evaluates

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: SelectorResolver Requirements
        requirements:
          - id: ReviewCenterPuppet-SelectorResolver-Resolve
            title: >-
              The SelectorResolver unit shall resolve a testid: prefixed name or a plain name made of letters,
              digits, hyphens, and underscores to a data-testid attribute selector, return any other selector
              (css=, text=, role=, or CSS) unchanged, and reject a null or blank selector.
            justification: |
              The ReviewCenter web interface marks the elements a driver needs with stable test ids, so the
              common case is as short as possible; elements without one are reached with CSS, text, or role
              selectors that must arrive at the browser as typed; a blank selector cannot identify anything.
            tests:
              - SelectorResolver_Resolve_AllForms_ReturnsPlaywrightSelector
              - SelectorResolver_Resolve_Blank_ThrowsArgumentException
