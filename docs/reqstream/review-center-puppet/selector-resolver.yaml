---
# SelectorResolver Unit Requirements
#
# PURPOSE:
# - Define requirements for the SelectorResolver unit (tools/puppet/SelectorResolver.cs)
# - SelectorResolver turns the selector text a user types into the selector the browser evaluates
# - Every requirement states one criterion. The first criterion of a topic keeps the original id; the further
#   criteria of the same topic are named <original id>-<Aspect>.

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: SelectorResolver Requirements
        requirements:
          - id: ReviewCenterPuppet-SelectorResolver-Resolve
            title: >-
              The SelectorResolver unit shall resolve a testid: prefixed name or a plain name made of letters,
              digits, hyphens, and underscores to a data-testid attribute selector.
            justification: |
              The ReviewCenter web interface marks the elements a driver needs with stable test ids, so the
              common case is as short as possible.
            tests:
              - SelectorResolver_Resolve_AllForms_ReturnsPlaywrightSelector

          - id: ReviewCenterPuppet-SelectorResolver-Resolve-PassThrough
            title: >-
              The SelectorResolver unit shall return any other selector (css=, text=, role=, or CSS) unchanged.
            justification: |
              Elements without a test id are reached with CSS, text, or role selectors that must arrive at the
              browser as typed.
            tests:
              - SelectorResolver_Resolve_AllForms_ReturnsPlaywrightSelector

          - id: ReviewCenterPuppet-SelectorResolver-Resolve-Blank
            title: >-
              The SelectorResolver unit shall reject a null, empty, or blank selector.
            justification: |
              A blank selector cannot identify anything, so it is refused instead of matching a random element.
            tests:
              - SelectorResolver_Resolve_Blank_ThrowsArgumentException
