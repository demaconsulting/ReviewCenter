---
# SelectorResolver Unit Requirements
#
# PURPOSE:
# - Define requirements for the SelectorResolver unit (tools/puppet/SelectorResolver.cs)
# - SelectorResolver turns the selector text a user types into the selector the browser evaluates

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: SelectorResolver Requirements
        requirements:
          - id: ReviewCenterPuppet-SelectorResolver-TestId
            title: >-
              The SelectorResolver unit shall resolve a plain name made of letters, digits, hyphens, and
              underscores to a data-testid attribute selector.
            justification: |
              The ReviewCenter web interface marks the elements a driver needs with stable test ids, so the
              common case is as short as possible.
            tests:
              - SelectorResolver_Resolve_PlainName_UsesDataTestId

          - id: ReviewCenterPuppet-SelectorResolver-Passthrough
            title: >-
              The SelectorResolver unit shall return a selector that contains any other character unchanged.
            justification: |
              Elements without a test id are reached with CSS, text, or role selectors, which must arrive at
              the browser exactly as the caller typed them.
            tests:
              - SelectorResolver_Resolve_SpecialCharacters_PassesThroughUnchanged

          - id: ReviewCenterPuppet-SelectorResolver-BlankRejected
            title: The SelectorResolver unit shall reject a null or blank selector.
            justification: |
              A blank selector cannot identify an element, so it is rejected instead of being passed to the
              browser, where it would fail with a confusing message.
            tests:
              - SelectorResolver_Resolve_Blank_ThrowsArgumentException
