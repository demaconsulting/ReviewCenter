---
# PuppetProgram Unit Requirements
#
# PURPOSE:
# - Define requirements for the PuppetProgram unit (tools/puppet/PuppetProgram.cs)
# - PuppetProgram parses the command line and runs the steps file with guaranteed teardown

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: PuppetProgram Requirements
        requirements:
          - id: ReviewCenterPuppet-PuppetProgram-Arguments
            title: >-
              The PuppetProgram unit shall accept the run command with a steps file, the server, URL, output
              folder, and timeout options, print usage for help, and reject unknown or malformed arguments
              with a clear message and exit code 2.
            justification: |
              The command line is the only interface of the tool, and a coding agent corrects its next call
              from the message it gets back. Exit code 2 separates "could not run" from a failed step.
            tests:
              - PuppetProgram_Run_Help_PrintsUsageAndExitsZero
              - PuppetProgram_Run_BadArguments_ExitsTwoWithMessage
              - PuppetProgram_Run_UrlOption_UsesGivenServerWithoutStartingOne
