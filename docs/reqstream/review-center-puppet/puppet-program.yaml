---
# PuppetProgram Unit Requirements
#
# PURPOSE:
# - Define requirements for the PuppetProgram unit (tools/puppet/PuppetProgram.cs)
# - PuppetProgram parses the command line, starts the daemon, sends one command to it, and prints the result
# - Every requirement states one criterion. The first criterion of a topic keeps the original id; the further
#   criteria of the same topic are named <original id>-<Aspect>.

sections:
  - title: ReviewCenterPuppet Requirements
    sections:
      - title: PuppetProgram Requirements
        requirements:
          - id: ReviewCenterPuppet-PuppetProgram-Arguments
            title: >-
              The PuppetProgram unit shall turn the command line of a documented command into a request with
              its arguments and options.
            justification: |
              The command line is the only interface of the tool, so every documented command must reach the
              daemon as the request that the agent meant.
            tests:
              - PuppetProgram_ParseCommand_ValidCommands_BuildRequests

          - id: ReviewCenterPuppet-PuppetProgram-Arguments-UnknownCommand
            title: >-
              The PuppetProgram unit shall reject an unknown command with a message that names it and exit
              code 2.
            justification: |
              A misspelled command must not be mistaken for a failed browser action; exit code 2 separates
              "could not run" from a failed command.
            tests:
              - PuppetProgram_Run_BadArguments_ExitsTwoWithUsage

          - id: ReviewCenterPuppet-PuppetProgram-Arguments-UnknownOption
            title: >-
              The PuppetProgram unit shall reject an unknown option with a message that names it and exit
              code 2.
            justification: |
              An option that is silently ignored would hide a typing mistake of the agent, so the agent is told
              which option was not understood.
            tests:
              - PuppetProgram_Run_BadArguments_ExitsTwoWithUsage

          - id: ReviewCenterPuppet-PuppetProgram-Arguments-ArgumentCount
            title: >-
              The PuppetProgram unit shall reject a command with too few or too many arguments with a one-line
              usage message and exit code 2.
            justification: |
              The usage line of the command tells the agent how to correct its next call.
            tests:
              - PuppetProgram_Run_BadArguments_ExitsTwoWithUsage

          - id: ReviewCenterPuppet-PuppetProgram-Arguments-MalformedValue
            title: >-
              The PuppetProgram unit shall reject a malformed option or argument value with a message that names
              the problem and exit code 2.
            justification: |
              A value that cannot be used (a timeout of zero, a viewport that is not WxH, a missing file) is
              found before anything is started, so no browser action runs with it.
            tests:
              - PuppetProgram_Run_BadArguments_ExitsTwoWithUsage

          - id: ReviewCenterPuppet-PuppetProgram-Results
            title: >-
              The PuppetProgram unit shall print the result text of a command.
            justification: |
              The agent decides its next step from what the command reported.
            tests:
              - PuppetProgram_Format_ResultUrlTitleAndErrors_PrintsFooter

          - id: ReviewCenterPuppet-PuppetProgram-Results-PageLine
            title: >-
              The PuppetProgram unit shall print the page URL and the page title on one line after the result
              text of a command.
            justification: |
              The agent sees on every result which page the browser is on, without asking for it.
            tests:
              - PuppetProgram_Format_ResultUrlTitleAndErrors_PrintsFooter

          - id: ReviewCenterPuppet-PuppetProgram-Results-Events
            title: >-
              The PuppetProgram unit shall print one line for each new browser error after the page line of a
              command.
            justification: |
              A console error that a click caused is reported at once, so that the agent can connect cause and
              effect.
            tests:
              - PuppetProgram_Format_ResultUrlTitleAndErrors_PrintsFooter

          - id: ReviewCenterPuppet-PuppetProgram-Results-ExitCodeSuccess
            title: >-
              The PuppetProgram unit shall exit with code 0 for a command that worked.
            justification: |
              The exit code tells the agent at once that the command worked, without reading the text.
            tests:
              - PuppetProgram_Format_ResultUrlTitleAndErrors_PrintsFooter

          - id: ReviewCenterPuppet-PuppetProgram-Results-ExitCodeFailure
            title: >-
              The PuppetProgram unit shall exit with code 1 for a command that failed.
            justification: |
              A failed action (for example a missing element) must be told apart from a success by its exit
              code alone.
            tests:
              - PuppetProgram_Format_ResultUrlTitleAndErrors_PrintsFooter

          - id: ReviewCenterPuppet-PuppetProgram-Results-FailureMessage
            title: >-
              The PuppetProgram unit shall print the message of a failed command on the error stream.
            justification: |
              The failure text must not mix with the result text that a script may read from the output stream.
            tests:
              - PuppetProgram_Format_ResultUrlTitleAndErrors_PrintsFooter

          - id: ReviewCenterPuppet-PuppetProgram-Results-NotRunningExit
            title: >-
              The PuppetProgram unit shall exit with code 2 when a command finds no running browser, either
              because the control file is absent or because its port does not answer.
            justification: |
              "No browser to talk to" is a different situation from a failed action, and the agent must be able to
              tell them apart.
            tests:
              - PuppetProgram_Run_NotRunning_ExitsTwoWithStartHint

          - id: ReviewCenterPuppet-PuppetProgram-Results-NotRunningHint
            title: >-
              The PuppetProgram unit shall point at the `puppet start` command in the message that it prints when
              a command finds no running browser.
            justification: |
              The fix for a missing browser is one command, and the agent can run it from the message.
            tests:
              - PuppetProgram_Run_NotRunning_ExitsTwoWithStartHint
