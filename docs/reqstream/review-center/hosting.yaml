---
# Hosting Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Hosting subsystem
# - The Hosting subsystem spans ServerHost.cs (web server composition, authentication, endpoints, and logging) and
#   UserCommand.cs (the user add verb)
# - Subsystem requirements describe the externally visible behavior of the running web server

sections:
  - title: Hosting Subsystem Requirements
    requirements:
      - id: ReviewCenter-Hosting-Health
        title: >-
          The Hosting subsystem shall answer requests for the /health URL with HTTP status 200
          and the text Healthy while the server is running, without sign-in, alongside the user interface routes.
        justification: |
          Reverse proxies, container orchestrators, monitoring tools, and test tooling need a
          simple, unauthenticated way to find out whether the service is up. The health route
          must coexist with the user interface routes on the same server so that one probe
          reflects the state of the whole web service.
        children:
          - ReviewCenter-ServerHost-Health
        tests:
          - HostingSubsystem_HealthEndpoint_Requested_ReturnsHealthy
          - HostingSubsystem_Routes_BothRegistered_HomeAndHealthAnswer

      - id: ReviewCenter-Hosting-Logging
        title: >-
          The Hosting subsystem shall write structured log entries, including a start-up entry
          that carries the listen URL as a named property, to the configured logging sinks.
        justification: |
          Operators need to confirm that the service started and where it is listening, and
          log aggregation tools need named properties rather than pre-formatted text so that
          entries can be searched and correlated. Framework request logging flowing to the
          same sinks gives a single audit trail for the running service.
        children:
          - ReviewCenter-ServerHost-Logging
          - ReviewCenter-ServerHost-SilentMode
        tests:
          - HostingSubsystem_Startup_LoggingConfigured_EmitsStructuredEntry

      - id: ReviewCenter-Hosting-Database
        title: >-
          The Hosting subsystem shall create the configured database when the server starts and make the project,
          review, user, and signing services available to the pages through it, so that stored data is served
          again after the server is restarted.
        justification: |
          The pages are only useful if what users create is kept. Opening the database at start-up, rather than
          on first use, makes a configuration problem visible immediately, and a restart must not lose data.
        children:
          - ReviewCenter-ServerHost-Database
        tests:
          - HostingSubsystem_Startup_DatabaseConfigured_ServesStoredProjectsAfterRestart

      - id: ReviewCenter-Hosting-Authentication
        title: >-
          The Hosting subsystem shall set up cookie sign-in for the pages with a configurable session length and
          a configurable interval, with a minimum of 5 seconds, at which open pages re-check their user,
          requiring a signed-in user for every page except the home page and the login page, while the /health
          URL stays open to everyone.
        justification: |
          Review data must only be reached by identified users, but probes and the login page must work without
          signing in. Closing every other page by default means a new page cannot be left open by mistake, and a
          wrong interval must stop the server at start-up instead of loading the database or leaving open
          pages unchecked.
        children:
          - ReviewCenter-ServerHost-Authentication
        tests:
          - HostingSubsystem_Startup_DatabaseConfigured_ServesStoredProjectsAfterRestart
          - ServerHost_CreateApplication_NonPositiveSessionHours_ThrowsClearError
          - ServerHost_CreateApplication_RevalidationSecondsBelowMinimum_ThrowsClearError

      - id: ReviewCenter-Hosting-UserAdd
        title: >-
          The Hosting subsystem shall create a user in the configured database when the user add verb is run,
          reading the password from the environment, from redirected standard input, or from a prompt, and
          shall report the outcome without ever printing the password.
        justification: |
          The first administrator must exist before anybody can sign in, and creating it from the command line
          needs no web page that would itself need an administrator.
        children:
          - ReviewCenter-UserCommand-Create
          - ReviewCenter-UserCommand-Password
          - ReviewCenter-UserCommand-Errors
        tests:
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate
          - ReviewCenter_UserAddVerb_NoPassword_ReturnsError

      - id: ReviewCenter-Hosting-DatabaseFailure
        title: >-
          The Hosting subsystem shall report a database setting that cannot be used as an error and exit code 1,
          without starting to serve requests.
        justification: |
          A service that starts with a database it cannot use would fail on the first request. Stopping
          immediately with a clear message lets the operator fix the setting.
        children:
          - ReviewCenter-ServerHost-DatabaseFailure
        tests:
          - HostingSubsystem_Startup_UnsupportedDatabaseProvider_FailsWithExitCodeOne

      - id: ReviewCenter-Hosting-AuditVerify
        title: >-
          The Hosting subsystem shall verify the hash chain of the audit trail in the configured database when the
          audit verify verb is run, reporting the number of entries with exit code 0 for an intact chain and the
          first broken entry or the failure to read the database with exit code 1, and shall give the server and
          the command-line verbs the same audit services.
        justification: |
          Scripts and scheduled jobs must be able to check the trail without the web interface and to alert on the
          exit code.
        children:
          - ReviewCenter-AuditCommand-Verify
          - ReviewCenter-AuditCommand-Errors
          - ReviewCenter-ServerHost-AuditServices
        tests:
          - AuditCommand_Run_IntactTrail_ReportsEntryCountWithExitCodeZero
          - AuditCommand_Run_TamperedEntry_ReportsFirstBadEntryWithExitCodeOne

      - id: ReviewCenter-Hosting-RepositoryServices
        title: >-
          The Hosting subsystem shall make the repository registry, the credential protector, and the git content
          source available to the pages, keeping the key ring and the git cache in folders that default to folders
          beside the database file, so that a token entered before a restart is still readable after it.
        justification: |
          The pages can only register and use repositories when the server connects the registry to the database, the
          key ring, and git. Defaults beside the database mean a new installation works without configuration.
        children:
          - ReviewCenter-ServerHost-RepositoryServices
          - ReviewCenter-ServerHost-KeyRing
        tests:
          - ServerHost_AddServices_Configured_RegistersRepositoryServicesWithDefaultFolders
          - ServerHost_Restart_KeyRingPersisted_TokenStaysReadable

      - id: ReviewCenter-Hosting-PlannerServices
        title: >-
          The Hosting subsystem shall make the review planner and the parser of the review-set file available to the
          pages.
        justification: |
          The pages that plan reviews for the review-sets of a repository can only use the planner when the server
          connects it to the services and the git source it works with.
        children:
          - ReviewCenter-ServerHost-PlannerServices
        tests:
          - ServerHost_AddServices_Configured_RegistersReviewPlannerAndParser

      - id: ReviewCenter-Hosting-KeyRingFailure
        title: >-
          The Hosting subsystem shall report a key ring folder that cannot be written as an error that names the folder
          and its setting, without starting to serve requests.
        justification: |
          A key ring that cannot be saved would silently lose every stored token at the next restart. Stopping
          immediately with a clear message lets the operator fix the setting.
        children:
          - ReviewCenter-ServerHost-KeyRingFailure
        tests:
          - ServerHost_CreateApplication_KeyRingFolderNotWritable_ThrowsClearError

      - id: ReviewCenter-Hosting-AttestationServices
        title: >-
          The Hosting subsystem shall make the signed attestation available to the pages and to clients, mapping the
          download of the attestation of a review and registering the key provider chosen by the Attestation settings,
          with the self-signed key kept in a folder that defaults to a folder beside the Data Protection keys.
        justification: |
          The attestation can only be offered when the server connects the Evidence subsystem to the services it
          reads, and a default beside the keys means a new installation works without configuration and that the
          key is kept and backed up with the other keys.
        children:
          - ReviewCenter-ServerHost-AttestationServices
        tests:
          - ServerHost_CreateApplication_NoAttestationSettings_CreatesSelfSignedKeyBesideTheDataProtectionKeys
          - ServerHost_CreateApplication_SelfSignedFolderConfigured_KeepsTheKeyThere

      - id: ReviewCenter-Hosting-AttestationKeyFailure
        title: >-
          The Hosting subsystem shall report an attestation key that cannot be used as an error that names the
          Attestation setting at fault, without starting to serve requests.
        justification: |
          An attestation that cannot be signed would be found out by the first user who tries, long after the start.
          Stopping immediately with a clear message lets the operator fix the setting. The price is that a server
          whose key is on a hardware module that is not present does not start.
        children:
          - ReviewCenter-ServerHost-AttestationKeyFailure
        tests:
          - ServerHost_CreateApplication_UnknownAttestationProvider_ThrowsClearError
          - ServerHost_CreateApplication_CertificateStoreWithoutThumbprint_ThrowsClearError
          - ServerHost_CreateApplication_CertificateNotInStore_ThrowsClearError
          - ServerHost_CreateApplication_RequireTrustedKeyWithSelfSignedProvider_ThrowsClearError
          - ServerHost_CreateApplication_SelfSignedFolderIsAFile_ThrowsClearError
