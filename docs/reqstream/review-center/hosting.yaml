      - id: ReviewCenter-Hosting-SecretScan
        title: >-
          The Hosting subsystem shall be able to scan the database and the key ring without changing either, counting
          the key files and how many are not encrypted and the protected repository tokens and second-factor secrets
          and how many of them the ring can no longer decrypt, never creating a key, and never disclosing a secret or
          a path.
        justification: |
          The key ring and the database are backed up and restored separately, and a restore that mixes them loses
          every stored secret without any error. Finding that needs a look that is true to what the server can decrypt
          and has no side effect, so that it can run before the server starts and on a restored copy.
        children:
          - ReviewCenter-SecretScan-RingState
          - ReviewCenter-SecretScan-RingState-Unencrypted
          - ReviewCenter-SecretScan-RingState-Empty
          - ReviewCenter-SecretScan-RingState-MissingFolder
          - ReviewCenter-SecretScan-SecretReadability
          - ReviewCenter-SecretScan-SecretReadability-Readable
          - ReviewCenter-SecretScan-SecretReadability-Unreadable
          - ReviewCenter-SecretScan-SecretReadability-Ids
          - ReviewCenter-SecretScan-SecretReadability-IdList
          - ReviewCenter-SecretScan-SecretReadability-NoKeyFiles
          - ReviewCenter-SecretScan-SecretReadability-MalformedKeys
          - ReviewCenter-SecretScan-SecretReadability-MissingDatabase
          - ReviewCenter-SecretScan-SecretReadability-MissingTables
          - ReviewCenter-SecretScan-SecretReadability-NoRows
          - ReviewCenter-SecretScan-ReadOnly
          - ReviewCenter-SecretScan-ReadOnly-NoDatabase
          - ReviewCenter-SecretScan-ReadOnly-NoKey
          - ReviewCenter-SecretScan-ReadOnly-NoKeyFolder
          - ReviewCenter-SecretScan-ReadOnly-NoProtect
          - ReviewCenter-SecretScan-ReadOnly-Arguments
          - ReviewCenter-SecretScan-NoDisclosure
          - ReviewCenter-SecretScan-NoDisclosure-IdsOnly
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
          - SecretScan_ScanAsync_AnyRing_LeavesDatabaseAndRingUnchanged

      - id: ReviewCenter-Hosting-KeyRingLost
        title: >-
          The Hosting subsystem shall refuse to start, with a message that names the key folder and the setting
          DataProtection:AllowNewKeyRing, when the key folder holds no key file and the database holds protected
          secrets, shall start with a warning when that setting is true, and shall log an error with the counts and the
          remedy, without refusing, when the ring has keys but some secrets cannot be decrypted. When the database
          cannot be read to tell, it shall refuse an empty ring, without creating a key, and start with a warning
          otherwise.
        justification: |
          A database restored without its key ring would otherwise start with a new ring and silently make every stored
          repository token and second-factor secret unreadable. The operator must decide, knowingly, that the loss is
          acceptable. A database that cannot be read does not tell whether there is a loss to accept.
        children:
          - ReviewCenter-ServerHost-LostKeyRing
          - ReviewCenter-ServerHost-LostKeyRing-NoKeyCreated
          - ReviewCenter-ServerHost-LostKeyRing-NoSecretShown
          - ReviewCenter-ServerHost-LostKeyRing-AllowNewKeyRing
          - ReviewCenter-ServerHost-LostKeyRing-AllowWarning
          - ReviewCenter-ServerHost-LostKeyRing-SomeUnreadable
          - ReviewCenter-ServerHost-LostKeyRing-SomeUnreadableStarts
          - ReviewCenter-ServerHost-LostKeyRing-FreshInstallation
          - ReviewCenter-ServerHost-LostKeyRing-RestartQuiet
          - ReviewCenter-ServerHost-LostKeyRing-UnreadableDatabase
          - ReviewCenter-ServerHost-LostKeyRing-UnreadableSanitized
          - ReviewCenter-ServerHost-LostKeyRing-UnreadableNoKey
          - ReviewCenter-ServerHost-LostKeyRing-UnreadableWithKeys
          - ReviewCenter-ServerHost-LostKeyRing-UnreadableWithKeysWarning
          - ReviewCenter-ServerHost-LostKeyRing-ServicesCreateNoKey
        tests:
          - ServerHost_CreateApplication_LostRing_RefusesToStartAndCreatesNoKey
          - ServerHost_CreateApplication_LostRingWithAllowNewKeyRing_StartsWithWarning
          - ServerHost_CreateApplication_SomeSecretsUnreadable_LogsErrorAndStarts
          - ServerHost_CreateApplication_EmptyRingAndUnreadableDatabase_RefusesToStartAndCreatesNoKey

      - id: ReviewCenter-Hosting-AttestationServices
        title: >-
          The Hosting subsystem shall make the signed attestation available to the pages and to clients, mapping the
          download of the attestation of a review and registering the key provider chosen by the Attestation settings,
          with the self-signed key kept in a folder that defaults to a folder beside the Data Protection keys.
        justification: |
          The attestation can only be offered when the server connects the Evidence subsystem to the services it
          reads, and a default beside the keys means a new installation works without configuration and that the
          key is kept and backed up with the other keys.
        children:
          - ReviewCenter-ServerHost-AttestationServices
          - ReviewCenter-ServerHost-AttestationServices-SelfSignedDefault
          - ReviewCenter-ServerHost-AttestationServices-SelfSignedPersists
          - ReviewCenter-ServerHost-AttestationServices-SelfSignedConfigured
          - ReviewCenter-ServerHost-AttestationServices-UnprotectedRefused
          - ReviewCenter-ServerHost-AttestationServices-UnprotectedStarts
          - ReviewCenter-ServerHost-AttestationServices-UnprotectedWarned
          - ReviewCenter-ServerHost-AttestationKeyProtection
          - ReviewCenter-ServerHost-AttestationKeyProtection-NamesFile
          - ReviewCenter-ServerHost-AttestationKeyProtection-AllowNewKeyRing
          - ReviewCenter-ServerHost-AttestationKeyProtection-KeyKept
        tests:
          - ServerHost_CreateApplication_NoAttestationSettings_CreatesSelfSignedKeyBesideTheDataProtectionKeys
          - ServerHost_CreateApplication_SelfSignedFolderConfigured_KeepsTheKeyThere

      - id: ReviewCenter-Hosting-AttestationKeyFailure
        title: >-
          The Hosting subsystem shall report an attestation key that cannot be used as an error that names the
          Attestation setting at fault, without starting to serve requests.
        justification: |
          An attestation that cannot be signed would be found out by the first user who tries, long after the start.
          Stopping immediately with a clear message lets the operator fix the setting. The price is that a server
          whose key is on a hardware module that is not present does not start.
        children:
          - ReviewCenter-ServerHost-AttestationKeyFailure
          - ReviewCenter-ServerHost-AttestationKeyFailure-MissingThumbprint
          - ReviewCenter-ServerHost-AttestationKeyFailure-CertificateNotFound
          - ReviewCenter-ServerHost-AttestationKeyFailure-TrustedKeyRequired
          - ReviewCenter-ServerHost-AttestationKeyFailure-FolderUnusable
        tests:
          - ServerHost_CreateApplication_UnknownAttestationProvider_ThrowsClearError
          - ServerHost_CreateApplication_CertificateStoreWithoutThumbprint_ThrowsClearError
          - ServerHost_CreateApplication_CertificateNotInStore_ThrowsClearError
          - ServerHost_CreateApplication_RequireTrustedKeyWithSelfSignedProvider_ThrowsClearError
          - ServerHost_CreateApplication_SelfSignedFolderIsAFile_ThrowsClearError

      - id: ReviewCenter-Hosting-ApiServices
        title: >-
          The Hosting subsystem shall make the API available to clients, registering the personal access token
          service and mapping the API routes and the OpenAPI document under /api, so that an address under /api that
          does not exist is answered with a JSON problem document.
        justification: |
          The API can only be used when the server connects the Api subsystem to the services it reads, and keeping
          the prefix to the API keeps a script from receiving a web page.
        children:
          - ReviewCenter-ServerHost-ApiRegistration
          - ReviewCenter-ServerHost-ApiRegistration-Routes
          - ReviewCenter-ServerHost-ApiRegistration-OpenApi
          - ReviewCenter-ServerHost-ApiRegistration-UnknownAddress
        tests:
          - ServerHost_CreateApplication_ApiRoutes_AreMapped

      - id: ReviewCenter-Hosting-OidcSignIn
        title: >-
          The Hosting subsystem shall connect the sign-in with an OpenID Connect provider to the server when an
          administrator turns it on, stopping the start with a clear error that never shows a secret when the settings
          are wrong, and shall leave the server as it was when it is off.
        justification: |
          The sign-in is optional, so a server that does not use it must not change, and a server that does must not
          start with settings that cannot work.
        children:
          - ReviewCenter-ServerHost-OidcSettings
          - ReviewCenter-ServerHost-OidcSettings-NoSecret
          - ReviewCenter-ServerHost-OidcSettings-SecretFile
          - ReviewCenter-ServerHost-OidcSettings-Off
          - ReviewCenter-ServerHost-OidcSettings-ValidBuilds
        tests:
          - ServerHost_CreateApplication_InvalidOidcSettings_ThrowsClearErrorWithoutSecret
          - ServerHost_CreateApplication_OidcOffOrValid_BuildsTheApplication

      - id: ReviewCenter-Hosting-TotpSecondFactor
        title: >-
          The Hosting subsystem shall connect the second factor of the sign-in to the server, stopping the start with
          a clear error when its settings are wrong, and mapping the endpoint of the second step only while the feature
          is on.
        justification: |
          A server must not start with settings that cannot work, and a feature that is off must not leave a way in.
        children:
          - ReviewCenter-ServerHost-TotpWiring
          - ReviewCenter-ServerHost-TotpWiring-DefaultsOn
          - ReviewCenter-ServerHost-TotpWiring-SettingsApplied
          - ReviewCenter-ServerHost-TotpWiring-EndpointMapped
          - ReviewCenter-ServerHost-TotpWiring-EndpointOffNotMapped
        tests:
          - ServerHost_CreateApplication_InvalidTotpSettings_ThrowsClearError
          - ServerHost_CreateApplication_ValidTotpSettings_ProvideTheSettings

      - id: ReviewCenter-Hosting-NotificationSettings
        title: >-
          The Hosting subsystem shall check the notification settings at the start of the server while e-mail
          notifications are enabled.
        justification: |
          A feature that is enabled must not start with settings that cannot work.
        children:
          - ReviewCenter-ServerHost-NotificationInvalidStopsStart
          - ReviewCenter-ServerHost-NotificationInvalidNamesSetting
          - ReviewCenter-ServerHost-NotificationInvalidNoSecret
          - ReviewCenter-ServerHost-NotificationValidBuilds
          - ReviewCenter-ServerHost-NotificationInlinePasswordWarning
          - ReviewCenter-ServerHost-NotificationWarningNoSecret
        tests:
          - ServerHost_CreateApplication_InvalidNotificationSettings_ThrowsClearErrorWithoutSecret
          - ServerHost_CreateApplication_NotificationsOffOrValid_BuildsAndWarnsAboutInlinePassword

      - id: ReviewCenter-Hosting-NotificationTables
        title: >-
          The Hosting subsystem shall check the notification tables of the database at the start of the server while
          e-mail notifications are enabled.
        justification: |
          A feature that is enabled must not start with a database that cannot work. The database of an earlier
          version has no notification tables.
        children:
          - ReviewCenter-ServerHost-NotificationTablesMissingStopsStart
        tests:
          - ServerHost_CreateApplication_DatabaseWithoutNotificationTables_FailsOnlyWhenNotificationsAreOn

      - id: ReviewCenter-Hosting-NotificationNotEnabledSkipsChecks
        title: >-
          While e-mail notifications are not enabled, the Hosting subsystem shall start the server without checking
          the notification settings.
        justification: |
          A feature that is not enabled must leave the server as it was, so that an installation without a mail server
          keeps working.
        children:
          - ReviewCenter-ServerHost-NotificationOffNotChecked
          - ReviewCenter-ServerHost-NotificationTablesMissingOffStarts
        tests:
          - ServerHost_CreateApplication_NotificationsOffOrValid_BuildsAndWarnsAboutInlinePassword
          - ServerHost_CreateApplication_DatabaseWithoutNotificationTables_FailsOnlyWhenNotificationsAreOn

      - id: ReviewCenter-Hosting-NotificationWorker
        title: >-
          While e-mail notifications are enabled with a sender that sends mail, the Hosting subsystem shall run the
          notification worker in the web server.
        justification: |
          The mail is sent by the server that holds the data, so the worker is part of the web server. A command or the
          self-test shares the services of the server but must not send mail or start a loop, so they get no worker.
        children:
          - ReviewCenter-ServerHost-NotificationWorkerFile
          - ReviewCenter-ServerHost-NotificationWorkerSmtp
          - ReviewCenter-ServerHost-NotificationWorkerNotInShared
          - ReviewCenter-ServerHost-NotificationWorkerNotInSelfTest
          - ReviewCenter-ServerHost-NotificationWorkerStops
        tests:
          - HostingSubsystem_NotificationWorker_OnlyEnabledWebHost
          - ServerHost_CreateApplication_NotificationsFile_HasWorker

      - id: ReviewCenter-Hosting-NotificationWorkerNotWhenOff
        title: >-
          While e-mail notifications are not enabled, the Hosting subsystem shall run no notification worker.
        justification: |
          A feature that is not enabled must leave the server as it was, with no background work.
        children:
          - ReviewCenter-ServerHost-NotificationWorkerOffNone
        tests:
          - HostingSubsystem_NotificationWorker_OnlyEnabledWebHost
          - ServerHost_CreateApplication_NotificationsOff_NoWorker

      - id: ReviewCenter-Hosting-NotificationSenderNoneRefused
        title: >-
          While e-mail notifications are enabled with the sender None, the Hosting subsystem shall stop the start of the
          server with an error that names the setting.
        justification: |
          A feature that is enabled without a sender would silently do nothing, which an administrator must learn at the
          start.
        children:
          - ReviewCenter-ServerHost-NotificationSenderNoneRefused
        tests:
          - ServerHost_CreateApplication_EnabledSenderNone_RefusedBeforeAnyWorker
