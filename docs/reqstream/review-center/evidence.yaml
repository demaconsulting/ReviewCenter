      - id: ReviewCenter-Evidence-ContentSettings
        title: >-
          The Evidence subsystem shall make every PDF it releases follow the evidence settings of the project, read
          once and read again before signing, with a Content scope section that states what was left out and the
          settings in effect, names replaced by neutral labels, a signature that stays valid after the reduction, and
          the audit actor anonymous for a request without a user.
        justification: |
          A project that publishes its evidence needs to keep parts of a review out of the document, and a reader needs
          to see that this was done. The signature must cover the reduced document so that it can still be checked, and
          the release must be traceable even when nobody signed in.
