---
# Evidence Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Evidence subsystem
# - The Evidence subsystem spans the PdfDocumentWriter, AttestationRenderer, AttestationSigner, AttestationKeyProvider,
#   AttestationService, AttestationEndpoint, and EvidenceIndexService units: it produces the signed PDF attestation of a
#   completed review and the evidence index of the completed reviews of a project
# - Subsystem requirements describe the externally visible behavior of the download; the subsystem tests run the real
#   server in process against a review that was signed by two users

sections:
  - title: Evidence Subsystem Requirements
    requirements:
      - id: ReviewCenter-Evidence-Document
        title: >-
          The Evidence subsystem shall produce, for a concluded review (approved or rejected), a PDF document that
          states the review, its content fingerprint, its files, its checklist (the consolidated standing of the
          submitted ballots, with who answered each agreed check and when), the findings and included comments (never a
          comment that was not included), its conclusion, its reviewer sign-offs, a ballots
          appendix with the final ballot of every slot and its fingerprint, the head of the audit trail, and the key
          that signed it, in the same bytes for the same input, with the files, checklist wording, findings, reviewer
          names, and git context left out as the evidence settings of the project say, a rejection marked as such on
          its first page, and, for a review that was reopened after an approval, the history of the reopenings.
        justification: |
          The conclusion of a review must be portable. A document that holds what was reviewed and who signed, and that
          is the same when it is made again, can be filed, printed, and checked outside the tool. A reader must also
          be able to see that an approval followed one that was reopened, and a rejection must be recognizable at a
          glance.
        children:
          - ReviewCenter-PdfDocumentWriter-Structure
          - ReviewCenter-PdfDocumentWriter-Structure-CrossReference
