---
# Software Unit Requirements for the ApiEndpoints Unit
#
# The ApiEndpoints unit maps the JSON routes under /api: reading projects and reviews, creating review drafts,
# downloading the attestation, and the answers for an invalid request. The routes call the same services as the
# web pages.

sections:
  - title: ApiEndpoints Unit Requirements
    requirements:
      - id: ReviewCenter-ApiEndpoints-Read
        title: >-
          The ApiEndpoints unit shall return, to a client with a valid token, the list of projects the owner of the
          token may see, the review summaries of such a project, and the details of one review as JSON, answer 404
          for a project or a review that does not exist, and answer 401 to a request without a valid token (these
          routes are never open to a request without credentials).
        justification: |
          A script that files and follows reviews needs to find them, and an unknown project or review must be told
          from an empty list. A script sees what its owner sees and no more.
        tests:
          - ApiEndpoints_ListProjects_Token_ReturnsProjects
          - ApiEndpoints_ListReviews_Project_ReturnsSummariesOrNotFound
          - ApiEndpoints_GetReview_CompleteReview_ReturnsDetails
          - ApiEndpoints_ReviewDetail_Counts_IncludeCheckThreads
          - ApiEndpoints_Request_NoToken_Answers401
          - ApiEndpoints_CreateReview_NoTokenOddBody_Answers401

      - id: ReviewCenter-ApiEndpoints-ProjectAccess
        title: >-
          The ApiEndpoints unit shall check, before anything else, on every route that names a project (the reviews of
          the project, one review, the creation of a review, the attestation, the evidence index, and the checklist
          template), that the owner
          of the token may see the project, and shall answer an owner who may not with the 404 problem document, and the
          same body, that it answers for a project that does not exist, for a bearer token and for HTTP Basic
          credentials, and shall list only the projects the owner may see. This applies to a request that carries a
          token; a request without credentials to the two open routes is decided by the setting of the project (see
          OpenRoutes).
        justification: |
          Every route that names a project is a way to find out whether the project exists. Checking first, and
          answering with the body of a missing project, closes all of them, and checking before the body of a
          creation is read keeps a non-member from learning anything from the validation of a request.
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused
          - ApiProjectAccess_ListProjects_ShowsOnlyMemberProjectsExceptToSystemAdmins
          - ApiProjectAccess_Token_OwnerRemovedFromProject_Gets404AtOnce

      - id: ReviewCenter-ApiEndpoints-Create
        title: >-
          The ApiEndpoints unit shall create a review draft from files that are sent in the request, or from the
          changes of a repository that is registered with the project (reviewing every changed file when the request
          gives no selection), with the same rules as the web pages, mark the
          review as created through the API, and answer with the review and the files that were skipped.
        justification: |
          Creating a draft for every pull request from a pipeline is the main use of the API. The same rules keep
          the record consistent, and the mark lets the reviewers see that a script made the draft. The selection is
          optional in the API, so a request that leaves it out must not be refused.
        tests:
          - ApiEndpoints_CreateReview_Upload_CreatesDraftFlaggedAsApi
          - ApiEndpoints_CreateReview_Repository_CreatesReviewFromChanges
          - ApiEndpoints_CreateReview_Repository_NoSelection_ReviewsEveryChange

      - id: ReviewCenter-ApiEndpoints-CreateDueDate
        title: >-
          The ApiEndpoints unit shall accept an optional due date (a calendar day in UTC, written like 2030-01-31)
          in the request that creates a review, with the same rules as the web pages, answer a text that is not such
          a date, or a date that is before today or more than two years ahead, with status 400 and a problem
          document, creating no review, and show the due date and whether the review is overdue in the review that
          it returns, in the detail of a review, and in the list of reviews.
        justification: |
          A pipeline that creates a draft for every pull request knows when the change is expected to be reviewed.
          A date that cannot be read, or that the rules refuse, must be reported to the caller instead of being
          dropped, and a script that polls the reviews needs the date and the overdue flag without reading a page.
        tests:
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag
          - ApiEndpoints_CreateReview_InvalidDueDate_Answers400AndCreatesNothing
          - ApiProblems_StatusOf_MemberRules_MapsToDocumentedStatus

      - id: ReviewCenter-ApiEndpoints-CreateFollowUp
        title: >-
          The ApiEndpoints unit shall accept an optional followsReviewId, and an optional acknowledgeDroppedThreads,
          in the request that creates a review, with the same rules as the creation by hand, answer a review that
          cannot be followed, or open threads that would be dropped without the acknowledgement, with status 400 and a
          problem document, creating no review, and show the followed review (null when there is none) and the
          numbers of carried answers and threads in the detail of a review, and the followed review in the list.
        justification: |
          A pipeline that creates the next draft after a review failed should not make the reviewers answer again what
          they have answered. A script must be told why a follow-up was refused instead of getting a review without
          the carry, and must see which reviews are follow-ups without reading a page.
        tests:
          - ApiEndpoints_CreateReview_FollowsReviewId_IsCreatedShownAndRefusedWhenInvalid
          - ApiProblems_StatusOf_MemberRules_MapsToDocumentedStatus

      - id: ReviewCenter-ApiEndpoints-Validation
        title: >-
          The ApiEndpoints unit shall answer a request body that is not valid, including one that is not JSON or not
          JSON of the right shape, with a status of 400 (415 for a content type that is not JSON) and a problem document
          that names the field where there is one, and shall answer a domain rule that refuses the request with the
          status of that rule, including 409 for the removal of the last project administrator, 429 for too many
          attempts, 403 for an account that has to change its password or for a rejection that has no conclusion
          text, and 400 for a checklist definition that is
          not valid.
        justification: |
          A script cannot read a page, so the cause of a refusal must be in the answer. Naming the field tells the
          author which part of the request to fix.
        tests:
          - ApiEndpoints_CreateReview_BadRequestBody_Answers400NamingTheField
          - ApiEndpoints_CreateReview_MalformedJson_Answers400Problem
          - ApiEndpoints_CreateReview_NotJsonContentType_Answers415Problem
          - ApiEndpoints_CreateReview_ServiceRules_AnswerTheirStatus
          - ApiProblems_StatusOf_MemberRules_MapsToDocumentedStatus
          - ApiProblems_StatusOf_ChecklistDefinitionInvalid_Is400WithTheMessage

      - id: ReviewCenter-ApiEndpoints-Limits
        title: >-
          The ApiEndpoints unit shall refuse a request to create a review whose body is larger than the limit of the
          endpoint with status 413, and a file count, file size or total size beyond the review limits with status 400
          and a problem document, shall refuse a file count above the review limit, or a Base64 text longer than that
          of the largest file, before decoding it, and shall create no review in any of these cases.
        justification: |
          A script can send far more than a person can upload by hand. The body limit, which is derived from the
          review limits, keeps the server from reading an unbounded body, and the review limits must hold for the API
          exactly as they do for the web pages. Bounding the count and the text length before decoding keeps the
          caller's numbers from sizing allocations or loops.
        tests:
          - ApiEndpoints_CreateReview_FileLimits_Answer400Problem
          - ApiEndpoints_CreateReview_DecodeBounds_Answer400NamingTheField
          - ApiEndpoints_CreateReview_Endpoint_HasDerivedBodySizeLimit
          - ApiEndpoints_CreateReview_BodyOverLimit_Answers413

      - id: ReviewCenter-ApiEndpoints-Attestation
        title: >-
          The ApiEndpoints unit shall return the signed attestation PDF of a review whose reviewer slots have all
          signed, with the same release rules and audit record as the download from the web pages, to a client with a
          valid token or, when the project allows it, to a client without a token, and shall answer
          with a problem document, status 409, for a review that is not signed, and status 401 to a request without a
          valid token when the project does not allow anonymous attestation PDFs.
        justification: |
          Fetching the attestation after the sign-off lets a pipeline file it with a release. Using the same
          mapping as the page keeps what is released, and what is recorded, the same. A project that publishes its
          attestations lets a caller without an account fetch them, and one that does not publish them answers a
          caller without a token as before.
        tests:
          - ApiEndpoints_GetAttestation_Token_ReturnsPdfOrProblem
          - ApiEndpoints_GetAttestation_ReviewNotSigned_Answers409Problem
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous
          - AnonymousEvidenceAccess_SwitchOff_Anonymous_AnswersLikeAMissingProject

      - id: ReviewCenter-ApiEndpoints-EvidenceIndex
        title: >-
          The ApiEndpoints unit shall return the evidence index of a project at
          GET /projects/{projectId}/evidence/index.json, to a client with a valid token or, when the project allows it,
          to a client without a token, as a JSON object with a reviews list in the format that
          ReviewMark reads, with the absolute address of the attestation of each entry built from the scheme, host and
          path base of the request, with a response that no cache keeps, answer 404 with a problem document for a
          project that does not exist, and answer 401 to a request without a valid token when the project does not
          allow an anonymous evidence index.
        justification: |
          ReviewMark takes the evidence of a review from an index. The file address in it must be one that the client
          can open, whatever address it used to reach the server, a cached index would show a review that has since
          changed, and an unknown project must be told from a project without evidence. A project that publishes its
          index lets a pipeline without an account read it.
        tests:
          - ApiEndpoints_GetEvidenceIndex_CompleteReviewWithSetId_ReturnsEntryWithAbsoluteFileUrl
          - ApiEndpoints_GetEvidenceIndex_NoListableReview_ReturnsEmptyList
          - ApiEndpoints_GetEvidenceIndex_UnknownProject_Answers404Problem
          - ApiEndpoints_GetEvidenceIndex_SchemeHostPathBaseAndId_BuildsAbsoluteUrl
          - ApiEndpoints_GetEvidenceIndex_OtherHost_BuildsUrlFromRequestHost
          - ApiEndpoints_Request_NoToken_Answers401
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous

      - id: ReviewCenter-ApiEndpoints-Checklist
        title: >-
          The ApiEndpoints unit shall return the checklist template of a project at
          GET /projects/{projectId}/checklist, to a client with a valid token whose owner may see the project, as a
          JSON object with the definition (version label, sections, and checks), the version label, whether it is the
          built-in default, the SHA-256 hash of the definition text, and the number of sections and checks, and shall
          answer 404 with the problem document of a missing project for a project that does not exist or that the
          owner may not see, answer 400 with a problem document for a stored definition that cannot be read, answer
          401 to a request without a valid token, return a section that has no applicability hint with an empty string
          for the hint, and offer no route that changes the template.
        justification: |
          A pipeline that files reviews can need to know which checklist new reviews of the project start with, for
          example to check it against an approved version or to show it to the reviewers. Reading is the same right
          as seeing the project, and changing the template stays a decision of a person who administers the project,
          made on the web pages.
        tests:
          - ApiEndpoints_GetChecklist_Token_ReturnsDefaultThenCustomDefinition
          - ApiEndpoints_GetChecklist_SectionWithoutHint_ReturnsEmptyHint
          - ApiEndpoints_GetChecklist_NonMemberUnknownProjectAndUnreadableDefinition_AnswerProblems
          - ApiEndpoints_Request_NoToken_Answers401
          - ApiProblems_StatusOf_ChecklistDefinitionInvalid_Is400WithTheMessage
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused

      - id: ReviewCenter-ApiEndpoints-Errors
        title: >-
          The ApiEndpoints unit shall answer an address under /api that does not exist, with any standard HTTP method
          (GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS), with a JSON problem document and status 404, not with a web
          page.
        justification: |
          A script that mistypes an address must get an answer it can read, not the HTML of the not-found page.
        tests:
          - ApiEndpoints_Request_UnknownRoute_AnswersJsonNotFound

      - id: ReviewCenter-ApiEndpoints-NoSigning
        title: >-
          The ApiEndpoints unit shall offer no route that signs a review or adds, changes, or removes a reviewer
          slot.
        justification: |
          A signature must prove that the person was present, which a stored secret does not, so the API has no
          way to give one.
        tests:
          - ApiEndpoints_Routes_NoSigningOrSlotRoutes

      - id: ReviewCenter-ApiEndpoints-LockedReview
        title: >-
          The ApiEndpoints unit shall answer a request that a service refuses because the review is concluded
          (approved or rejected) and
          locked (ReviewLocked), or because it is not locked (ReviewNotLocked), with status 409 and a problem document
          that carries the message of the rule, and shall keep a locked review readable, whether approved or rejected,
          and, for an approved review only, with its attestation and its evidence index entry (a rejected review has
          neither), and offer no route that reopens a review.
        justification: |
          A script that meets the lock must be able to tell it from a mistake in its request, which status 409 does,
          and must be able to keep reading the concluded review and its evidence. Reopening is a decision of a person
          who administers the project, so the API has no way to do it with a token.
        tests:
          - ApiProblems_StatusOf_ReviewLockedAndNotLocked_Is409

      - id: ReviewCenter-ApiEndpoints-OutOfDateConflict
        title: >-
          The ApiEndpoints unit shall answer a request that a service refuses because the change would make a
          current signature out of date and has not been acknowledged (SignaturesWouldBecomeOutOfDate) with status
          409 and a problem document that carries the message of the rule, which names the affected slots.
        justification: |
          A script that changes a review that is signed in part must be able to tell the refusal from a mistake in its
          request, and learn whose signatures it would withdraw, in a form it can act on.
        tests:
          - ApiProblems_StatusOf_SignaturesWouldBecomeOutOfDate_Is409

      - id: ReviewCenter-ApiEndpoints-RuleConflict
        title: >-
          The ApiEndpoints unit shall answer a request that a service refuses because of a review rule of the project
          (an author answering the checklist of their own review, the person who reopened a review signing it
          again, or a
          reopening that would leave a slot without a person who may sign it) with status 409 and a problem document
          that carries the message of the rule.
        justification: |
          These refusals are conflicts with the state of the project and not mistakes in the request, and the message
          tells the script what to do instead, so that it can tell them from a request that is wrong.
        tests:
          - ApiProblems_StatusOf_ReviewRuleRefusals_Is409

      - id: ReviewCenter-ApiEndpoints-OpenRoutes
        title: >-
          The ApiEndpoints unit shall put exactly two routes, the evidence index and the attestation PDF, behind a
          policy
          that a request without credentials can satisfy, and every other route under /api behind the policy that
          needs a valid token, so that no third route is open to a caller without a token (except the OpenAPI document
          and the answer for an address that does not exist), and shall refuse a request without credentials to any
          other route of a project with 401 even when the project has switched both routes on.
        justification: |
          The exception to "an API needs a token" must stay as small as its documentation says. A test that
          enumerates the routes makes a new route that is open by mistake fail, instead of leaving it to review.
        tests:
          - AnonymousEvidenceAccess_Endpoints_OnlyTheTwoRoutesUseTheOpenPolicies
          - AnonymousEvidenceAccess_BothOn_OtherRoutes_StayClosed

      - id: ReviewCenter-ApiEndpoints-AnonymousLimit
        title: >-
          The ApiEndpoints unit shall answer a request without credentials to the evidence index route or the
          attestation PDF route from a client address that is over its limit with status 429, a problem document, a
          Retry-After header, and a response that no cache keeps, and shall not apply that limit to a request with a
          valid token.
        justification: |
          A caller without an account must be slowed down by address, and has to be told when to come back, but a
          script that holds a token is counted by the throttle of tokens and must not be refused by this limit.
        tests:
          - AnonymousEvidenceAccess_TooManyAnonymousRequests_Answers429WithRetryAfter

      - id: ReviewCenter-ApiEndpoints-ListProgress
        title: >-
          The ApiEndpoints unit shall return for every review in the list of the reviews of a project whether it is
          approved, the number of its reviewer slots, of valid signatures, and of out-of-date signatures, the time of
          its last activity, and its due date and overdue flag, taking them from the same service as the project
          page, and shall add the fields without changing any existing field. The list shall read the reviews of the
          project once and give that same list to the progress service.
        justification: |
          A script that watches a project needs the progress that the project page shows, without opening every
          review. The fields are added and nothing is renamed, so existing clients keep working. One read of the
          review list keeps a project with many reviews fast.
        tests:
          - ApiEndpoints_ListReviews_Progress_ShowsApprovalSignaturesAndLastActivity
          - ApiEndpoints_ListReviews_Project_ReadsTheReviewListOnce
          - ApiDocument_Get_MatchesCommittedSnapshot

      - id: ReviewCenter-ApiEndpoints-ReadOnlyRole
        title: >-
          The ApiEndpoints unit shall let a token of a member whose role is Auditor read everything that the member may
          see, shall refuse every change by that token with a 403 problem document and change nothing, shall answer a
          token of a user who is no member of the project with 404 for reads and changes, and shall map the rule that
          refuses a role change while the member holds open review work to 409.
        justification: |
          A script that acts for an auditor must be as read-only as the auditor, and a project that the token owner may
          not see must read like a missing one.
        tests:
          - ApiAuditor_Reads_Token_ServeTheProject
          - ApiAuditor_CreateReview_AuditorIs403AndNonMemberIs404
          - ApiAuditor_MemberHasOpenReviewWork_Is409

      - id: ReviewCenter-ApiEndpoints-AuditExport
        title: >-
          The ApiEndpoints unit shall serve, in the file AuditExportEndpoints.cs, the cookie-authenticated routes
          GET /projects/{project}/audit/export and GET /audit/export, which stream the audit trail that matches the
          filter of the query (actor, action, review, from, and to, and on the whole trail also project, all read like
          the audit pages so that an unusable value falls back and never fails) as CSV or, with format=json, as JSON,
          never accepting a request without a signed-in session (it is redirected to the sign-in page), answering for
          a project the 404 of a project that the user may not see and the 403 problem for a user who may see it but
          not read its audit trail (the audit-read access of the project), answering the whole trail to system
          administrators only with 403 for everybody else, answering an unknown format with 400 after the access
          check, and sending the status of the chain before the body in the headers X-ReviewCenter-Audit-Chain
          (intact or broken) and, when broken, X-ReviewCenter-Audit-Chain-Broken-At with the first broken sequence,
          together with the attachment file name audit-<project-N|all>-<yyyyMMddTHHmmssZ>-chain-<status>.<ext>, the
          content type, Cache-Control no-store, and X-Content-Type-Options nosniff, and shall not be part of the
          OpenAPI document.
        justification: |
          The export is for people with a signed-in session (a token cannot read the audit trail), so it uses the
          same access rules as the audit pages, answered like the other cookie routes. The status of the chain is in
          the headers because the body is streamed, so a script or a browser knows it before the first byte. A
          project that a user may not see must not be told apart from one that does not exist, and a trail that
          names every user is for system administrators.
        tests:
          - AuditExportEndpoints_ProjectExport_ProjectAdmin_ServesCsvWithHeaders
          - AuditExportEndpoints_SystemAdmin_ExportsAnyProjectAndTheWholeTrail
          - AuditExportEndpoints_JsonFormat_ServesEnvelopeWithChainStatus
          - AuditExportEndpoints_QueryFilter_IsHonoredAndTheExportIsAudited
          - AuditExportEndpoints_ProjectRoute_IgnoresProjectInQuery
          - AuditExportEndpoints_GlobalExport_ProjectInQuery_LimitsAndScopesTheAuditEntry
          - AuditExportEndpoints_ProjectExport_NotAllowed_Answers403Or404
          - AuditExportEndpoints_ProjectExport_Auditor_ServesTheProjectTrailOnly
          - AuditExportEndpoints_SignedOut_RedirectsToLogin
          - AuditExportEndpoints_GlobalExport_NotSystemAdmin_Answers403
          - AuditExportEndpoints_HostileQueryValues_AreSafe
          - AuditExportEndpoints_UnknownFormat_Answers400ToAllowedUsersOnly
          - AuditExportEndpoints_TamperedChain_ReportsBrokenInHeadersAndFileName
          - AuditExportEndpoints_Routes_AreNotInTheApiDocument
          - AuditExportEndpoints_StreamAsync_ClientAbortedDuringWrite_EndsQuietlyAndAuditsIncomplete
          - AuditExportEndpoints_StreamAsync_WriteFailsWithoutAbort_IsNotSwallowed
