---
# Software Unit Requirements for the ApiTokenAuthentication Unit
#
# The ApiTokenAuthentication unit signs in the requests under /api from a personal access token that is sent as a
# bearer token or as the password of HTTP Basic credentials (the way ReviewMark sends it), and answers a request
# without a valid token. It never uses the session cookie of the web pages. It also decides when a project has opened
# its evidence index or its attestation PDFs to callers without credentials, and limits those callers.

sections:
  - title: ApiTokenAuthentication Unit Requirements
    requirements:
      - id: ReviewCenter-ApiTokenAuthentication-Bearer
        title: >-
          The ApiTokenAuthentication unit shall sign in a request under /api that sends a valid personal access token
          as a bearer token, or as the password of HTTP Basic credentials whatever the user name is, as the owner of the
          token, with the id of the token on the actor, and shall record that the token was used.
        justification: |
          Acting as the owner keeps every change attributable to a person, the id of the token tells which of the
          tokens of that person was used, and the time of last use lets the owner find a token that nobody needs.
        tests:
          - ApiTokenAuthentication_Request_ValidToken_AuthenticatesAndRecordsLastUsed
          - ApiTokenAuthentication_Request_ValidToken_ActsAsTheOwner
          - ApiTokenAuthentication_Request_BasicWithTokenAsPassword_AuthenticatesAsOwner

      - id: ReviewCenter-ApiTokenAuthentication-Refusal
        title: >-
          The ApiTokenAuthentication unit shall answer a request under /api (except a request without any credentials
          to one of the two routes that a project can open, see AnonymousEvidence) with no token, an unknown or revoked
          token, an expired token, or a token whose owner still has to change a temporary password
          with status 401 and a Bearer challenge, and shall give the same answer for
          every reason that a token is refused, a wrong Basic password included. The challenge shall name the bearer and
          the Basic scheme.
        justification: |
          A client must be told to send a token, but a different answer for an expired token and for a token that
          never existed would help somebody who guesses tokens.
        tests:
          - ApiTokenAuthentication_Request_NoUsableToken_Answers401WithChallenge
          - ApiTokenAuthentication_Request_RefusedTokens_AllGetTheSameGenericAnswer
          - ApiTokenAuthentication_Request_ExpiredToken_Answers401
          - ApiTokenAuthentication_Request_OwnerMustChangePassword_GetsTheGenericAnswerUntilChanged
          - ApiTokenAuthentication_Request_BasicWithWrongPassword_GetsTheSameGeneric401AndIsThrottledAndAudited

      - id: ReviewCenter-ApiTokenAuthentication-Cookie
        title: >-
          The ApiTokenAuthentication unit shall not accept the session cookie of the web pages for a request under
          /api, and shall not sign in a request for a web page, the sign-in and sign-out endpoints or the web socket
          negotiation of the pages from a bearer token or from HTTP Basic credentials.
        justification: |
          A cookie is sent by the browser to a site without the user being asked, so an API that accepted it would
          be open to forgery from other sites. A token that signed in a web page would give a leaked token the
          power of the person at the screen, including the actions that need a password.
        tests:
          - ApiTokenAuthentication_Request_SessionCookie_IsNotAccepted
          - ApiTokenAuthentication_Request_TokenOnWebPage_IsNotSignedIn
          - ApiTokenAuthentication_Request_TokenOnAuthAndBlazorRoutes_IsNotSignedIn

      - id: ReviewCenter-ApiTokenAuthentication-Throttle
        title: >-
          The ApiTokenAuthentication unit shall answer a request from a client address that has had too many tokens
          refused (20 for the address in a window of 300 seconds, as the address limit of the sign-in throttle) with
          status 429 and a Retry-After header that tells the length of the window, whether the token was sent as a
          bearer token or as a Basic password.
        justification: |
          Guessing tokens must be slow for one client, even though a token has high entropy, and a limit by address
          does not stop other clients. The limit of the address, not the lower limit of a user name, is the one that
          the documentation promises, and the header tells a script when it may try again.
        tests:
          - ApiTokenAuthentication_Request_TooManyRefusals_AnswersTooManyRequests
          - ApiTokenAuthentication_Request_RefusalsBelowAddressLimit_AreNotThrottledByNameLimit

      - id: ReviewCenter-ApiTokenAuthentication-FailureAudit
        title: >-
          The ApiTokenAuthentication unit shall record a refused token in the audit trail, once for each client
          address and minute, without recording the token value.
        justification: |
          An administrator needs to see that tokens are being guessed or that a script uses a revoked token. Once
          for each address and minute keeps a flood of requests from filling the audit trail, and leaving out the
          value keeps the audit trail from becoming a source of tokens.
        tests:
          - ApiTokenAuthentication_Request_RefusedToken_IsAuditedOnceWithoutTheValue

      - id: ReviewCenter-ApiTokenAuthentication-NoLog
        title: >-
          The ApiTokenAuthentication unit shall not write a token value, or any text that starts with the token prefix,
          to the application log when a token is created, accepted or refused.
        justification: |
          A log is read by more people, and kept longer, than the place where a token is shown once. A token in a log
          would give everybody who can read the log the access of its owner.
        tests:
          - ApiTokenAuthentication_Request_AnyOutcome_NeverLogsTheToken

      - id: ReviewCenter-ApiTokenAuthentication-AnonymousEvidence
        title: >-
          The ApiTokenAuthentication unit shall let a request without credentials reach the evidence index route or the
          attestation PDF route of a project only when the project has switched on the anonymous access of that route,
          and no other route; shall answer a request without credentials to a route that is switched off, or to a
          project that does not exist, with the same generic 401 as a missing token; shall never treat a request that
          carries an Authorization header, valid or not, as anonymous; and shall let a request with a valid token
          through to the normal project rules.
        justification: |
          A project may choose to publish its evidence to a pipeline or an auditor without an account, but the choice
          must be the project's, per route, and must not widen anything else. An answer that differed for a project
          that does not exist would tell a stranger which projects exist, and a wrong token that was silently treated
          as anonymous would hide a broken pipeline and bypass the throttle of refused tokens.
        tests:
          - AnonymousEvidenceAccess_SwitchOff_Anonymous_AnswersLikeAMissingProject
          - AnonymousEvidenceAccess_Matrix_ServesOnlyWhoMay
          - AnonymousEvidenceAccess_OneSwitchOn_DoesNotOpenTheOtherRoute
          - AnonymousEvidenceAccess_SwitchOn_OpensOnlyItsOwnProject
          - AnonymousEvidenceAccess_SwitchTurnedOff_RefusesAtOnce
          - AnonymousEvidenceAccess_BothOn_OtherRoutes_StayClosed
          - AnonymousEvidenceAccess_BothOn_AttestationPageRoute_StillNeedsSignIn

      - id: ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit
        title: >-
          The ApiTokenAuthentication unit shall allow a client address at most 30 requests without credentials in a
          window of one minute to the two routes that a project can open, count each address on its own, start a new
          window when the old one has ended, and tell how long the window lasts; and shall keep the windows of at most
          4096 addresses, removing the windows that have ended first and then the oldest ones, never a renewed window
          by pruning, and be safe for concurrent use.
        justification: |
          An anonymous attestation costs a signature and the caller has no account to hold responsible, so one address
          must not be able to use up the server. A count by address does not stop other clients. The caller chooses
          the address (for example by rotating through an IPv6 range), so the table must have a hard bound or it
          could be used to exhaust memory.
        tests:
          - AnonymousRateLimit_TryAcquire_CountsPerAddressAndWindow
          - AnonymousRateLimit_TryAcquire_ManyDistinctAddresses_NeverExceedsCapacity
          - AnonymousRateLimit_TryAcquire_FullTable_RemovesExpiredBeforeEvictingLive
          - AnonymousRateLimit_TryAcquire_FullOfLiveWindows_EvictsOldestFirst
          - AnonymousRateLimit_TryAcquire_RenewedWindow_IsNotRemovedByPruning
          - AnonymousRateLimit_TryAcquire_ClockStepsBack_StillBoundedAndConsistent
          - AnonymousRateLimit_TryAcquire_Concurrent_GrantsExactlyTheLimitPerAddress
          - AnonymousRateLimit_TryAcquire_ConcurrentDistinctAddresses_StaysWithinCapacity
