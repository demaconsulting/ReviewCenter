---
# Software Unit Requirements for the CredentialProtector Class
#
# The CredentialProtector class encrypts the access tokens of repositories before they are stored and decrypts them
# for the git layer.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: CredentialProtector Unit Requirements
    requirements:
      - id: ReviewCenter-CredentialProtector-Encrypt
        title: >-
          The CredentialProtector class shall encrypt a token into text that does not contain the token.
        justification: |
          A copy of the database must not reveal the tokens.
        tests:
          - CredentialProtector_ProtectUnprotect_RoundTripsAndHidesToken

      - id: ReviewCenter-CredentialProtector-Encrypt-Decrypt
        title: >-
          The CredentialProtector class shall decrypt encrypted text back to exactly the token that was encrypted.
        justification: |
          The server must be able to use a stored token.
        tests:
          - CredentialProtector_ProtectUnprotect_RoundTripsAndHidesToken

      - id: ReviewCenter-CredentialProtector-Encrypt-Arguments
        title: >-
          The CredentialProtector class shall refuse a missing provider, a missing token to encrypt, and a missing
          text to decrypt with an argument-null error.
        justification: |
          A missing argument is a programming error that must not become an unclear failure later.
        tests:
          - CredentialProtector_NullArguments_ThrowArgumentNull

      - id: ReviewCenter-CredentialProtector-Persistence
        title: >-
          The CredentialProtector class shall decrypt a token that was encrypted before a restart when the same key
          ring is used again.
        justification: |
          A token that could not be read after each restart would have to be entered again every time.
        tests:
          - CredentialProtector_PersistedKeyRing_SurvivesRestart

      - id: ReviewCenter-CredentialProtector-Unreadable
        title: >-
          The CredentialProtector class shall report a token that was encrypted with another key ring as credentials
          that cannot be read (rule CredentialsUnreadable).
        justification: |
          After the loss of the key ring the operator must learn that the tokens have to be entered again, instead of
          the server trying to use garbage as a token. The refusal is an exception, so a wrong value is never
          returned.
        tests:
          - CredentialProtector_Unprotect_OtherKeyRing_ThrowsCredentialsUnreadable

      - id: ReviewCenter-CredentialProtector-Unreadable-NotEncrypted
        title: >-
          The CredentialProtector class shall report text that is not encrypted text as credentials that cannot be
          read.
        justification: |
          Garbage in the database must give the same clear error and never a wrong value.
        tests:
          - CredentialProtector_Unprotect_OtherKeyRing_ThrowsCredentialsUnreadable

      - id: ReviewCenter-CredentialProtector-Unreadable-Message
        title: >-
          The CredentialProtector class shall report unreadable credentials without repeating the encrypted text and
          without the exception of the cryptography library.
        justification: |
          The message may be shown and logged, and the text of the library describes the payload and is no use to the
          caller.
        tests:
          - CredentialProtector_Unprotect_OtherKeyRing_ThrowsCredentialsUnreadable

      - id: ReviewCenter-CredentialProtector-Isolation
        title: >-
          The CredentialProtector class shall encrypt with a purpose of its own, so that a protector of another
          purpose on the same key ring cannot read an encrypted token.
        justification: |
          The key ring also protects cookies and other data. Separating the purposes keeps a value made for one use
          from being accepted for another.
        tests:
          - CredentialProtector_Purpose_IsolatesTokensFromOtherUses

      - id: ReviewCenter-CredentialProtector-Isolation-Foreign
        title: >-
          The CredentialProtector class shall report text that was encrypted for another purpose of the key ring as
          credentials that cannot be read.
        justification: |
          A value made for another use of the key ring must never be accepted as a token.
        tests:
          - CredentialProtector_Unprotect_OtherPurpose_ThrowsCredentialsUnreadable
