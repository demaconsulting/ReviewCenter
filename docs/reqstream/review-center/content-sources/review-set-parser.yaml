---
# Software Unit Requirements for the ReviewMarkConfigParser Class (the review-set parser)
#
# The ReviewMarkConfigParser class reads the review-sets (identifier, title, and paths) from the bytes of the
# ReviewMark configuration file of a repository, so that the planner can offer one review per set.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: ReviewSetParser Unit Requirements
    requirements:
      - id: ReviewCenter-ReviewSetParser-Read
        title: >-
          The ReviewSetParser class shall read the review-sets of a ReviewMark configuration file as the entries of its
          reviews key, in file order, each with its identifier, title, and ordered paths.
        justification: |
          The planner offers one review for each set, in the order of the file.
        tests:
          - ReviewMarkConfigParser_Parse_RepositoryOwnConfiguration_ReadsEverySet
          - ReviewMarkConfigParser_Parse_UnknownKeys_AreIgnored

      - id: ReviewCenter-ReviewSetParser-Read-UnknownKeys
        title: >-
          The ReviewSetParser class shall ignore every key other than reviews, and in each entry every key other than
          id, title, and paths, at every level.
        justification: |
          The configuration file belongs to ReviewMark and has many keys that ReviewCenter does not need.
        tests:
          - ReviewMarkConfigParser_Parse_UnknownKeys_AreIgnored
          - ReviewMarkConfigParser_Parse_RepositoryOwnConfiguration_ReadsEverySet

      - id: ReviewCenter-ReviewSetParser-Read-Styles
        title: >-
          The ReviewSetParser class shall understand the block style of YAML.
        justification: |
          Reading the file as YAML defines it lets the same file serve both tools, and the block style is the one that
          the files of ReviewMark normally use.
        tests:
          - ReviewMarkConfigParser_Parse_BlockStyle_IsRead
          - ReviewMarkConfigParser_Parse_YamlStyles_AreUnderstood

      - id: ReviewCenter-ReviewSetParser-Read-Styles-Flow
        title: >-
          The ReviewSetParser class shall understand the flow style of YAML.
        justification: |
          A user may write an entry or a list of paths on one line with braces and brackets, and the same file must
          still serve both tools.
        tests:
          - ReviewMarkConfigParser_Parse_FlowStyle_IsRead

      - id: ReviewCenter-ReviewSetParser-Read-Styles-Quoted
        title: >-
          The ReviewSetParser class shall understand the single-quoted and double-quoted strings of YAML.
        justification: |
          A title with a colon or a path with special characters needs quotes, and the quotes are not part of the value.
        tests:
          - ReviewMarkConfigParser_Parse_QuotedStrings_AreRead

      - id: ReviewCenter-ReviewSetParser-Read-Styles-Folded
        title: >-
          The ReviewSetParser class shall understand the folded text of YAML.
        justification: |
          A long title may be written over several lines, and the same file must still serve both tools.
        tests:
          - ReviewMarkConfigParser_Parse_FoldedText_IsRead

      - id: ReviewCenter-ReviewSetParser-Read-Trimmed
        title: >-
          The ReviewSetParser class shall trim the white space around the identifier, the title, and each path of a
          review-set.
        justification: |
          A value written with padding and the same value without it must name the same set, title, and path.
        tests:
          - ReviewMarkConfigParser_Parse_PaddedValues_AreTrimmed

      - id: ReviewCenter-ReviewSetParser-Read-ByteOrderMark
        title: >-
          The ReviewSetParser class shall read a file that starts with a byte order mark.
        justification: |
          Editors on Windows add a byte order mark to files.
        tests:
          - ReviewMarkConfigParser_Parse_ByteOrderMark_IsSkipped

      - id: ReviewCenter-ReviewSetParser-Read-WindowsLineEnds
        title: >-
          The ReviewSetParser class shall read a file that uses Windows line endings.
        justification: |
          A file from a checkout on Windows has Windows line endings.
        tests:
          - ReviewMarkConfigParser_Parse_WindowsLineEnds_AreUnderstood

      - id: ReviewCenter-ReviewSetParser-Read-EmptyPaths
        title: >-
          The ReviewSetParser class shall give a review-set that has no paths an empty list of paths.
        justification: |
          A review-set without paths is allowed.
        tests:
          - ReviewMarkConfigParser_Parse_SetWithoutPaths_HasEmptyPathList

      - id: ReviewCenter-ReviewSetParser-Limits
        title: >-
          The ReviewSetParser class shall refuse a file larger than 256 KiB before reading it as YAML.
        justification: |
          The file is written by other people and is read by the server. Bounding its size keeps a hostile file from
          using unbounded time or memory.
        tests:
          - ReviewMarkConfigParser_Parse_FileTooLarge_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-Alias
        title: >-
          The ReviewSetParser class shall refuse a file that uses a YAML alias.
        justification: |
          An alias can expand a small file into an enormous document.
        tests:
          - ReviewMarkConfigParser_Parse_Alias_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-SetCount
        title: >-
          The ReviewSetParser class shall refuse a file with more than 500 review-sets.
        justification: |
          The count bounds the work of the server and the size of the planner page.
        tests:
          - ReviewMarkConfigParser_Parse_TooManySets_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-IdLength
        title: >-
          The ReviewSetParser class shall refuse a review-set whose identifier is longer than 100 characters.
        justification: |
          The identifier is stored, used in file names and shown in lists, so its length is bounded.
        tests:
          - ReviewMarkConfigParser_Parse_IdTooLong_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-TitleLength
        title: >-
          The ReviewSetParser class shall refuse a review-set whose title is longer than 200 characters.
        justification: |
          The title is shown in headings and mail, where an unbounded text would break the layout and bloat the stored
          data.
        tests:
          - ReviewMarkConfigParser_Parse_TitleTooLong_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-IdControl
        title: >-
          The ReviewSetParser class shall refuse a review-set whose identifier contains a control character.
        justification: |
          A control character in an identifier could forge lines in logs and in the keys of stored data.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-TitleControl
        title: >-
          The ReviewSetParser class shall refuse a review-set whose title contains a control character.
        justification: |
          A control character in a title could forge lines in messages and pages that show the title.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-PathCount
        title: >-
          The ReviewSetParser class shall refuse a review-set with more than 100 paths.
        justification: |
          A selection allows only 100 patterns.
        tests:
          - ReviewMarkConfigParser_Parse_TooManyPaths_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-PathValue
        title: >-
          The ReviewSetParser class shall refuse a path that is empty.
        justification: |
          An empty path selects nothing and is almost certainly a mistake in the file, so the user is told where it is.
        tests:
          - ReviewMarkConfigParser_Parse_EmptyPath_ThrowsConfigInvalid
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-PathValue-Length
        title: >-
          The ReviewSetParser class shall refuse a path that is longer than 400 characters.
        justification: |
          A selection allows only patterns of limited length, so a longer path would be refused later with a less
          helpful message.
        tests:
          - ReviewMarkConfigParser_Parse_PathTooLong_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-PathValue-Control
        title: >-
          The ReviewSetParser class shall refuse a path that contains a control character.
        justification: |
          The paths of a set are joined into one selection text with line breaks, so a path must be one plain line.
        tests:
          - ReviewMarkConfigParser_Parse_PathWithControlCharacter_ThrowsConfigInvalid
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Limits-AtLimit
        title: >-
          The ReviewSetParser class shall accept a file whose size is exactly at the limit of 256 KiB.
        justification: |
          A review-set file that is exactly as large as the size limit allows must still be read, so the size limit
          may not be off by one.
        tests:
          - ReviewMarkConfigParser_Parse_FileAtSizeLimit_IsRead

      - id: ReviewCenter-ReviewSetParser-Limits-AtLimit-SetCount
        title: >-
          The ReviewSetParser class shall accept a file with exactly 500 review-sets.
        justification: |
          A repository that uses the full number of review-sets the limit allows must still be readable, so the
          limit may not be off by one.
        tests:
          - ReviewMarkConfigParser_Parse_SetCountAtLimit_IsRead
          - ReviewMarkConfigParser_Parse_Limits_AreEnforced

      - id: ReviewCenter-ReviewSetParser-Limits-AtLimit-IdLength
        title: >-
          The ReviewSetParser class shall accept a review-set whose identifier has exactly 100 characters.
        justification: |
          The limit must not refuse an identifier that is allowed.
        tests:
          - ReviewMarkConfigParser_Parse_IdLengthAtLimit_IsRead

      - id: ReviewCenter-ReviewSetParser-Limits-AtLimit-TitleLength
        title: >-
          The ReviewSetParser class shall accept a review-set whose title has exactly 200 characters.
        justification: |
          The limit must not refuse a title that is allowed.
        tests:
          - ReviewMarkConfigParser_Parse_TitleLengthAtLimit_IsRead

      - id: ReviewCenter-ReviewSetParser-Limits-AtLimit-PathCount
        title: >-
          The ReviewSetParser class shall accept a review-set with exactly 100 paths.
        justification: |
          The limit must not refuse a set that is allowed.
        tests:
          - ReviewMarkConfigParser_Parse_PathCountAtLimit_IsRead
          - ReviewMarkConfigParser_Parse_Limits_AreEnforced

      - id: ReviewCenter-ReviewSetParser-Limits-AtLimit-PathLength
        title: >-
          The ReviewSetParser class shall accept a path with exactly 400 characters.
        justification: |
          The limit must not refuse a path that is allowed.
        tests:
          - ReviewMarkConfigParser_Parse_PathLengthAtLimit_IsRead
          - ReviewMarkConfigParser_Parse_Limits_AreEnforced

      - id: ReviewCenter-ReviewSetParser-Errors
        title: >-
          The ReviewSetParser class shall refuse a file that is empty or defines no review-sets with the rule
          ReviewSetConfigInvalid.
        justification: |
          The user who sees the message has to correct the file.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Errors-NotYaml
        title: >-
          The ReviewSetParser class shall refuse a file that is not valid YAML with the rule ReviewSetConfigInvalid and
          a message that names the line of the problem.
        justification: |
          A position tells the user where to look.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Errors-MissingId
        title: >-
          The ReviewSetParser class shall refuse a review-set without an identifier with a message that names its
          position.
        justification: |
          Without an identifier the entry cannot be referred to by later reviews; the position tells the user which
          entry lacks it.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Errors-MissingTitle
        title: >-
          The ReviewSetParser class shall refuse a review-set without a title with a message that names its position.
        justification: |
          Without a title the entry cannot be shown in lists; the position tells the user which entry lacks it.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Errors-DuplicateId
        title: >-
          The ReviewSetParser class shall refuse a review-set that repeats the identifier of an earlier one with a
          message that names its position.
        justification: |
          The identifiers of the review-sets must be unique, and a position tells the user which entry to correct.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Errors-PlainMessage
        title: >-
          The ReviewSetParser class shall show nothing of the text or the stack of the YAML library in the message of a
          refused file.
        justification: |
          The text and the stack of a library would only confuse the user or reveal the inner workings.
        tests:
          - ReviewMarkConfigParser_Parse_BrokenFile_ThrowsConfigInvalid

      - id: ReviewCenter-ReviewSetParser-Errors-Content
        title: >-
          The ReviewSetParser class shall refuse missing content with an argument-null error.
        justification: |
          Missing file content is a programming error that must not become an unclear failure later.
        tests:
          - ReviewMarkConfigParser_Parse_Null_Throws
