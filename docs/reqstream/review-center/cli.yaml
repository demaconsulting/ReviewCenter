---
# Cli Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Cli subsystem
# - The Cli subsystem spans Context.cs (command-line argument parsing and I/O)
# - Subsystem requirements describe the externally visible command-line interface behavior

sections:
  - title: Cli Subsystem Requirements
    requirements:
      - id: ReviewCenter-Cli-ArgumentParsing
        title: The Cli subsystem shall accept command-line arguments and expose the parsed flag state to callers.
        justification: |
          Provides a standardized approach to command-line argument parsing across all
          DEMA Consulting DotNet Tools. The Context class encapsulates all parsed flags
          so that the rest of the tool has a single, consistent entry point for reading
          CLI arguments.
        children:
          - ReviewCenter-Context-ArgumentParsing
        tests:
          - CliSubsystem_VersionFlow_ContextAndProgram_DisplaysVersionAndExits
          - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits
          - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits_WithShortQuestionFlag
          - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits_WithShortHFlag
          - CliSubsystem_ValidateFlow_ContextAndProgram_RunsValidationAndExits

      - id: ReviewCenter-Cli-OutputChannels
        title: >-
          The Cli subsystem shall expose output channels (standard output and
          error) so that callers can produce output without direct console
          access.
        justification: |
          Decoupling output production from direct Console access enables testability
          and flexible output routing (console, log file, or both) without requiring
          callers to manage I/O directly.
        children:
          - ReviewCenter-Context-ConsoleOutput
        tests:
          - CliSubsystem_SilentFlow_ContextAndProgram_SuppressesOutput
          - CliSubsystem_ErrorOutput_ContextAndProgram_WritesErrorToStderr

      - id: ReviewCenter-Cli-Version
        title: The Cli subsystem shall support -v and --version flags to signal version display.
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification.
        tests:
          - CliSubsystem_VersionFlow_ContextAndProgram_DisplaysVersionAndExits
          - CliSubsystem_VersionFlow_ContextAndProgram_DisplaysVersionAndExits_WithShortVFlag

      - id: ReviewCenter-Cli-Help
        title: The Cli subsystem shall support -?, -h, and --help flags to signal help display.
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources.
        tests:
          - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits
          - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits_WithShortQuestionFlag
          - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits_WithShortHFlag

      - id: ReviewCenter-Cli-Silent
        title: The Cli subsystem shall support --silent flag to suppress console output.
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs.
        children:
          - ReviewCenter-Context-Silent
        tests:
          - CliSubsystem_SilentFlow_ContextAndProgram_SuppressesOutput

      - id: ReviewCenter-Cli-Validate
        title: The Cli subsystem shall support --validate flag to signal self-validation.
        justification: |
          Provides a built-in mechanism to verify the tool is functioning correctly
          in the deployment environment.
        tests:
          - CliSubsystem_ValidateFlow_ContextAndProgram_RunsValidationAndExits

      - id: ReviewCenter-Cli-Results
        title: The Cli subsystem shall support --results flag to specify a test results output file.
        justification: |
          Enables integration with CI/CD systems that expect standard test result formats.
        tests:
          - CliSubsystem_ResultsFlow_ContextAndProgram_WritesResultsFile

      - id: ReviewCenter-Cli-Depth
        title: The Cli subsystem shall support --depth flag to control the heading depth of markdown output.
        justification: |
          Enables validation output to be embedded within larger markdown documents at
          the appropriate heading level, supporting documentation workflows that combine
          multiple reports.
        tests:
          - CliSubsystem_DepthFlow_ContextAndProgram_AdjustsHeadingDepth

      - id: ReviewCenter-Cli-Log
        title: The Cli subsystem shall support --log flag to write output to a log file.
        justification: |
          Provides persistent logging for debugging and audit trails.
        children:
          - ReviewCenter-Context-LogOutput
          - ReviewCenter-Context-LogFailure
        tests:
          - CliSubsystem_LogFlow_ContextAndProgram_WritesLogFile

      - id: ReviewCenter-Cli-ErrorOutput
        title: The Cli subsystem shall write error messages to stderr.
        justification: |
          Error messages must be written to stderr so they remain visible to the user
          without polluting stdout, which consumers may pipe or redirect for data capture.
        children:
          - ReviewCenter-Context-ErrorOutput
        tests:
          - CliSubsystem_ErrorOutput_ContextAndProgram_WritesErrorToStderr

      - id: ReviewCenter-Cli-InvalidArgs
        title: The Cli subsystem shall reject unknown or malformed command-line arguments with a descriptive error.
        justification: |
          Providing clear feedback for invalid arguments helps users quickly correct
          mistakes and prevents silent misconfiguration.
        children:
          - ReviewCenter-Context-InvalidArgs
        tests:
          - CliSubsystem_InvalidArgs_ContextAndProgram_RejectsUnknownArgumentsAndExitsNonZero

      - id: ReviewCenter-Cli-ExitCode
        title: The Cli subsystem shall return a non-zero exit code on failure.
        justification: |
          Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
          programmatically via the process exit code.
        children:
          - ReviewCenter-Context-ExitCode
        tests:
          - CliSubsystem_InvalidArgs_ContextAndProgram_RejectsUnknownArgumentsAndExitsNonZero

      - id: ReviewCenter-Cli-ResultAlias
        title: The Cli subsystem shall accept `--result` as a legacy alias for `--results` when parsing arguments.
        justification: |
          Backward compatibility with scripts that use the earlier `--result` spelling
          prevents breakage when upgrading to newer tool versions.
        tests:
          - CliSubsystem_ResultAliasFlow_ContextAndProgram_ParsesResultsFile
          - Context_Create_ResultAliasFlag_SetsResultsFile

      - id: ReviewCenter-Cli-CheckConfig
        title: >-
          The Cli subsystem shall support the `--check-config` option to add the opt-in configured-database check to a
          self-validation run, and shall reject the option when `--validate` is not provided.
        justification: |
          The default self-validation run is hermetic and never looks at the configured database. Operators who also
          want to know that the deployment's own database can be opened and has the schema of this build must ask for
          that explicitly, and the option only has meaning for a validation run.
        children:
          - ReviewCenter-Context-CheckConfig
        tests:
          - CliSubsystem_CheckConfigFlow_ContextAndProgram_RequiresValidate
      - id: ReviewCenter-Cli-Serve
        title: The Cli subsystem shall support the serve verb to signal that the web server is to be run.
        justification: |
          Operators need a command-line verb that starts the ReviewCenter web service, and
          the rest of the tool needs a single place to read that request from.
        children:
          - ReviewCenter-Context-Serve
        tests:
          - CliSubsystem_ServeFlow_ContextAndProgram_ServesOnRequestedUrlAndStops

      - id: ReviewCenter-Cli-Urls
        title: >-
          The Cli subsystem shall support the `--urls` option to specify the URL the web server
          listens on, and shall reject the option when the serve verb is not provided.
        justification: |
          Operators must choose the listen address of the service. The option only has meaning
          for the serve verb, so accepting it elsewhere would hide a forgotten verb from the
          operator.
        children:
          - ReviewCenter-Context-Urls
        tests:
          - CliSubsystem_ServeFlow_ContextAndProgram_ServesOnRequestedUrlAndStops
          - CliSubsystem_UrlsWithoutServe_Context_RejectsArgumentCombination

      - id: ReviewCenter-Cli-UserAdd
        title: >-
          The Cli subsystem shall support the user add verb with the `--username` and `--display-name` options and
          the `--system-admin` switch to signal that a user is to be created, create an ordinary user unless the
          switch is given, reject a missing user name or display name, options used without the verb, and any
          option that would put the password on the command line.
        justification: |
          The first system administrator has to be created from the command line, so the tool needs a verb for it.
          An ordinary user is the safe default, because the right to see every project must be asked for. A
          password option is deliberately missing, because a password on the command line is visible to other
          processes and kept in shell history, and options without the verb would hide a forgotten verb.
        children:
          - ReviewCenter-Context-UserAdd
          - ReviewCenter-Context-UserAddMisuse
        tests:
          - CliSubsystem_UserAddFlow_ContextAndProgram_ParsesOptionsDocumentsThemAndRejectsMisuse

      - id: ReviewCenter-Cli-AuditVerify
        title: >-
          The Cli subsystem shall support the audit verify verb to signal that the audit trail is to be verified,
          and shall reject the audit verb without the verify action or with another action.
        justification: |
          Verifying the trail from the command line lets scripts and scheduled jobs check it, and a mistyped
          action must be found when the arguments are parsed.
        children:
          - ReviewCenter-Context-AuditVerify
        tests:
          - Context_Create_AuditVerifyVerb_SetsAuditVerify
          - Program_Run_Help_DocumentsAuditVerify
