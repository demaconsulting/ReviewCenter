---
# Software Unit Requirements for the SecretSource Class
#
# The SecretSource class resolves a secret that an operator gives either inline or as the path of a file, so that a
# service can read a secret from a file that the operating system or a secret store provides, and so that a wrong
# setting stops the start with a message that names the setting and never holds the secret.

sections:
  - title: SecretSource Unit Requirements
    requirements:
      - id: ReviewCenter-SecretSource-Inline
        title: >-
          The SecretSource class shall return the inline secret unchanged when only the inline setting is set, and
          nothing when neither the inline setting nor the file setting is set.
        justification: |
          Existing deployments give the secret inline (or through an environment variable that maps to it); that
          form must keep working, and the caller, not the unit, decides whether a missing secret is an error.
        tests:
          - SecretSource_Resolve_InlineValue_ReturnsTheValueUnchanged
          - SecretSource_Resolve_NeitherSet_ReturnsNull

      - id: ReviewCenter-SecretSource-File
        title: >-
          The SecretSource class shall read the secret from the file that the file setting names as UTF-8 text with the
          surrounding white space removed, and accept a file up to 8192 bytes.
        justification: |
          Secret stores and files made with a text editor or a shell end the text with a line break, which is not
          part of the secret; trimming it avoids a sign-in that fails for a reason nobody can see. The size limit
          keeps a wrong file, such as a binary or a log, from being read and used as a secret.
        tests:
          - SecretSource_Resolve_File_ReturnsTheContents
          - SecretSource_Resolve_FileWithSurroundingWhiteSpace_ReturnsTrimmedSecret
          - SecretSource_Resolve_FileAtSizeLimit_ReturnsTheContents

      - id: ReviewCenter-SecretSource-Conflict
        title: >-
          The SecretSource class shall refuse a secret that is set both inline and in a file with a message that names
          both settings.
        justification: |
          Two sources of one secret leave it unclear which one is in force, and an old value left in one of them
          could silently win; the operator must choose one.
        tests:
          - SecretSource_Resolve_BothSet_ThrowsNamingBothSettingsWithoutTheSecret

      - id: ReviewCenter-SecretSource-FileProblems
        title: >-
          The SecretSource class shall refuse a secret file that is missing, cannot be read, is empty, is larger than
          8192 bytes, or is not UTF-8 text, with a message that names the file setting and the file.
        justification: |
          A secret that silently falls back to nothing or to garbage turns a mistake into a start that appears to work
          and fails later at sign-in; stopping the start with a clear message lets the operator fix it at once.
        tests:
          - SecretSource_Resolve_MissingFile_ThrowsNamingTheSettingAndTheFile
          - SecretSource_Resolve_DirectoryInsteadOfFile_ThrowsNamingTheSetting
          - SecretSource_Resolve_EmptyFile_ThrowsNamingTheSetting
          - SecretSource_Resolve_FilePastSizeLimit_ThrowsWithoutTheContents
          - SecretSource_Resolve_FileNotUtf8_ThrowsWithoutTheContents

      - id: ReviewCenter-SecretSource-NoDisclosure
        title: >-
          The SecretSource class shall never put the secret, or a part of it, in the message of an error it raises.
        justification: |
          The message of a failed start reaches the console, the journal, and the log collection of the operator; a
          secret there is a leak.
        tests:
          - SecretSource_Resolve_BothSet_ThrowsNamingBothSettingsWithoutTheSecret
          - SecretSource_Resolve_FilePastSizeLimit_ThrowsWithoutTheContents
          - SecretSource_Resolve_FileNotUtf8_ThrowsWithoutTheContents
