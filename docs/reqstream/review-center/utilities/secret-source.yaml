---
# Software Unit Requirements for the SecretSource Class
#
# The SecretSource class resolves a secret that an operator gives either inline or as the path of a file, so that a
# service can read a secret from a file that the operating system or a secret store provides, and so that a wrong
# setting stops the start with a message that names the setting and never holds the secret.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: SecretSource Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # Inline: the secret given in the setting itself
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretSource-Inline
        title: >-
          The SecretSource class shall return the inline secret unchanged when only the inline setting is set.
        justification: |
          Existing deployments give the secret inline (or through an environment variable that maps to it); that
          form must keep working, and an inline value is taken exactly as the operator wrote it.
        tests:
          - SecretSource_Resolve_InlineValue_ReturnsTheValueUnchanged

      - id: ReviewCenter-SecretSource-Inline-Neither
        title: >-
          The SecretSource class shall return no secret, and raise no error, when neither the inline setting nor the
          file setting is set.
        justification: |
          Whether a missing secret is an error depends on the service, so the caller, not this unit, decides; an
          error here would stop a service that does not need the secret.
        tests:
          - SecretSource_Resolve_NeitherSet_ReturnsNull

      # ---------------------------------------------------------------------------------------------------------------
      # File: the secret given as the path of a file
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretSource-File
        title: >-
          The SecretSource class shall return the contents of the file that the file setting names, read as UTF-8
          text, when only the file setting is set.
        justification: |
          Secret stores and the operating system hand a secret to a service as a file; reading it from there keeps the
          secret out of the configuration file and out of the list of environment variables.
        tests:
          - SecretSource_Resolve_File_ReturnsTheContents

      - id: ReviewCenter-SecretSource-File-Trimmed
        title: >-
          The SecretSource class shall remove the white space around the secret that it reads from a file and keep the
          white space inside it.
        justification: |
          Files made with a text editor or a shell end the text with a line break, which is not part of the secret;
          trimming it avoids a sign-in that fails for a reason nobody can see, while a secret with a space inside it
          stays whole.
        tests:
          - SecretSource_Resolve_FileWithSurroundingWhiteSpace_ReturnsTrimmedSecret

      - id: ReviewCenter-SecretSource-File-SizeLimit
        title: >-
          The SecretSource class shall accept a secret file of exactly 8192 bytes.
        justification: |
          The size limit keeps a wrong file, such as a binary or a log, from being read and used as a secret; a file
          that is exactly at the limit is still a valid secret, so the limit must not be off by one.
        tests:
          - SecretSource_Resolve_FileAtSizeLimit_ReturnsTheContents

      # ---------------------------------------------------------------------------------------------------------------
      # Conflict: both settings set
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretSource-Conflict
        title: >-
          The SecretSource class shall refuse a secret that is set both inline and in a file with a message that names
          both settings.
        justification: |
          Two sources of one secret leave it unclear which one is in force, and an old value left in one of them
          could silently win; the operator must choose one, and the message tells which two settings to look at.
        tests:
          - SecretSource_Resolve_BothSet_ThrowsNamingBothSettingsWithoutTheSecret

      # ---------------------------------------------------------------------------------------------------------------
      # FileProblems: a secret file that cannot be used
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretSource-FileProblems
        title: >-
          The SecretSource class shall refuse a secret file that does not exist with a message that names the file
          setting and the file.
        justification: |
          A secret that silently falls back to nothing turns a mistake in the path into a start that appears to work
          and fails later at sign-in; stopping the start with a clear message lets the operator fix it at once.
        tests:
          - SecretSource_Resolve_MissingFile_ThrowsNamingTheSettingAndTheFile

      - id: ReviewCenter-SecretSource-FileProblems-Unreadable
        title: >-
          The SecretSource class shall refuse a secret file that cannot be read, such as a path that is a directory,
          with a message that names the file setting.
        justification: |
          A file that exists but cannot be read, for example for lack of permission, must not be mistaken for a
          missing or an empty secret; the message tells the operator which setting points to it.
        tests:
          - SecretSource_Resolve_DirectoryInsteadOfFile_ThrowsNamingTheSetting

      - id: ReviewCenter-SecretSource-FileProblems-Empty
        title: >-
          The SecretSource class shall refuse a secret file that is empty or holds only white space with a message that
          names the file setting.
        justification: |
          An empty secret would let a service start with a credential that anyone can guess; stopping the start with a
          message that names the setting lets the operator fix the file.
        tests:
          - SecretSource_Resolve_EmptyFile_ThrowsNamingTheSetting

      - id: ReviewCenter-SecretSource-FileProblems-TooLarge
        title: >-
          The SecretSource class shall refuse a secret file larger than 8192 bytes with a message that names the file
          setting.
        justification: |
          A file that large is a wrong file, such as a binary or a log, and must not be read and used as a secret.
        tests:
          - SecretSource_Resolve_FilePastSizeLimit_ThrowsWithoutTheContents

      - id: ReviewCenter-SecretSource-FileProblems-NotUtf8
        title: >-
          The SecretSource class shall refuse a secret file that is not UTF-8 text with a message that names the file
          setting.
        justification: |
          Bytes that are not text would be decoded to garbage and used as a secret that nobody can type again; the
          start stops instead, with a message that names the setting.
        tests:
          - SecretSource_Resolve_FileNotUtf8_ThrowsWithoutTheContents

      # ---------------------------------------------------------------------------------------------------------------
      # NoDisclosure: what the messages never hold
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretSource-NoDisclosure
        title: >-
          The SecretSource class shall never put the secret, or a part of it, in the message of an error it raises.
        justification: |
          The message of a failed start reaches the console, the journal, and the log collection of the operator; a
          secret there is a leak.
        tests:
          - SecretSource_Resolve_BothSet_ThrowsNamingBothSettingsWithoutTheSecret
          - SecretSource_Resolve_FilePastSizeLimit_ThrowsWithoutTheContents
          - SecretSource_Resolve_FileNotUtf8_ThrowsWithoutTheContents
