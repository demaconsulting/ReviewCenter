---
# Software Unit Requirements for the AttestationEndpoint Class
#
# The AttestationEndpoint class maps the download of the signed attestation of a review at
# GET /projects/{projectId}/reviews/{reviewId}/attestation.pdf to the AttestationService class.

sections:
  - title: AttestationEndpoint Unit Requirements
    requirements:
      - id: ReviewCenter-AttestationEndpoint-Authorization
        title: >-
          The AttestationEndpoint class shall answer a visitor who is not signed in with a redirect to the sign-in page
          and not with the document.
        justification: |
          An attestation contains the whole review. Only the signed-in users of the server may see it.
        tests:
          - AttestationEndpoint_Get_SignedOut_RedirectsToLogin

      - id: ReviewCenter-AttestationEndpoint-Visibility
        title: >-
          The AttestationEndpoint class shall answer a signed-in user who may not view the project with an empty 404,
          the answer for a review that does not exist, and not with the document or a refusal that tells the project
          exists.
        justification: |
          Only the members of a project, and the system administrators, may see what its reviews contain, and a
          different answer would tell everybody else that the project exists.
        tests:
          - ApiProjectAccess_AttestationPage_NonMemberSession_Answers404
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused

      - id: ReviewCenter-AttestationEndpoint-Download
        title: >-
          The AttestationEndpoint class shall answer a signed-in user's request for a completed review with the signed
          PDF as a download with the content type application/pdf and a response that no cache keeps, and shall record
          who asked for it in the audit trail.
        justification: |
          The attestation is generated on demand and is kept nowhere, so a cache must not keep it either. The event
          shows who took a copy of the document.
        tests:
          - AttestationEndpoint_Get_CompleteReview_ReturnsSignedPdfDownloadAndRecordsEvent
          - AttestationEndpoint_Get_DefaultConfiguration_SignsWithTheServerGeneratedSelfSignedKey

      - id: ReviewCenter-AttestationEndpoint-Statuses
        title: >-
          The AttestationEndpoint class shall answer 404 for a review that does not exist, 409 with a problem
          description that says the review is not complete for a review that is not approved, 409 with a problem
          description that says the review changed during generation when it changed while the document was being
          prepared, and 500 with a problem description that says the signing key is unavailable when the key cannot
          be used, and in the last two cases record nothing in the audit trail.
        justification: |
          A client must be able to tell a wrong address from a review that has to be signed first and from a problem
          that only the operator can solve.
        tests:
          - AttestationEndpoint_Get_UnknownReview_Answers404
          - AttestationEndpoint_Get_ReviewNotSigned_Answers409
          - AttestationEndpoint_Get_ReviewChangesDuringGeneration_Answers409AndRecordsNothing
          - AttestationEndpoint_Get_KeyBecomesUnavailable_Answers500AndRecordsNothing
