---
# Software Unit Requirements for the AttestationKeyProvider Unit
#
# The AttestationKeyProvider unit finds the key that signs the attestation. It consists of the provider interface
# and its status, the base class that loads and caches the key, the SelfSignedKeyProvider,
# CertificateStoreKeyProvider and FileKeyProvider classes, the factory that chooses between them from the settings,
# the policy that enforces RequireTrustedKey and warns about unsuitable certificates, and the key and exception types.

sections:
  - title: AttestationKeyProvider Unit Requirements
    requirements:
      - id: ReviewCenter-AttestationKeyProvider-Selection
        title: >-
          The AttestationKeyProvider unit shall choose the SelfSigned provider when no provider or SelfSigned is
          configured, the CertificateStore provider when CertificateStore is configured and the File provider when
          File is configured, hand the SelfSigned provider the Data Protection provider that protects its key, and
          refuse any other value with an error that names the Attestation:Provider setting and lists the three
          providers.
        justification: |
          Which key signs the attestation is the most important choice of an operator. A misspelled value must stop the
          server with a clear message and never silently fall back to a different kind of key. The key at rest is
          protected by the key ring of the server, so the factory must pass that ring on.
        tests:
          - AttestationKeyProviderFactory_Create_BlankOrSelfSigned_SelectsSelfSignedProvider
          - AttestationKeyProviderFactory_Create_CertificateStore_SelectsCertificateStoreProvider
          - AttestationKeyProviderFactory_Create_File_SelectsFileProvider
          - AttestationKeyProviderFactory_Create_UnknownProvider_ThrowsNamingTheSetting

      - id: ReviewCenter-AttestationKeyProvider-File
        title: >-
          The FileKeyProvider class shall load the signing key from the configured PFX or PKCS #12 file, or from a
          PEM certificate with the private key in the same file or in the file named by PrivateKeyPath (which is
          ignored for a PFX), detecting the
          format from the content, keep the private key in memory only and clear the bytes that it read from the files,
          take the other certificates of the file as the
          chain of the signer without the signer itself and without a self-signed root, apply the RequireTrustedKey
          rules like every provider, and report a missing path, a missing file, a file that is not a certificate with
          a private key, a legacy encrypted PEM key (with the remedy of converting it to PKCS #8), a missing password
          and a wrong password as errors that name the setting or the file and that
          hold neither the password nor, in the form for the configuration check, the folder.
        justification: |
          Many organizations keep their signing certificate in a file that an administrator deploys, for example from
          a secret store, and not in a certificate store. The server must use that file without writing the key
          anywhere, and an operator can correct a problem only when the message says which setting or file has it.
        tests:
          - FileKeyProvider_GetSigningKey_PfxWithPasswordSetting_LoadsSignerAndKey
          - FileKeyProvider_GetSigningKey_PfxWithIntermediateAndRoot_ChainHoldsTheIntermediateOnly
          - FileKeyProvider_GetSigningKey_PemWithSeparateKeyAndChain_LoadsSignerAndChain
          - FileKeyProvider_GetSigningKey_EncryptedPemInOneFile_LoadsSignerWithPassword
          - FileKeyProvider_GetSigningKey_EncryptedPemWithSeparateKey_LoadsSignerWithPassword
          - FileKeyProvider_GetSigningKey_NoCertificatePath_NamesTheSetting
          - FileKeyProvider_GetSigningKey_MissingFile_NamesTheFileAndTheCheckMessageNamesNoFolder
          - FileKeyProvider_GetSigningKey_MissingKeyFile_NamesTheSetting
          - FileKeyProvider_GetSigningKey_PfxWithoutPassword_AsksForThePassword
          - FileKeyProvider_GetSigningKey_EncryptedPemWithoutPassword_AsksForThePassword
          - FileKeyProvider_GetSigningKey_WrongPassword_SaysSoAndEchoesNoPassword
          - FileKeyProvider_GetSigningKey_FileThatIsNotACertificate_SaysSo
          - FileKeyProvider_GetSigningKey_LegacyEncryptedPemKey_AsksToConvertToPkcs8
          - FileKeyProvider_GetSigningKey_PfxWithPrivateKeyPath_IgnoresIt
          - FileKeyProvider_GetSigningKey_ValidOrganizationCertificateWithRequireTrustedKey_Accepts
          - FileKeyProvider_GetSigningKey_ExpiredWithRequireTrustedKey_IsRefused

      - id: ReviewCenter-AttestationKeyProvider-FileSecret
        title: >-
          The FileKeyProvider class shall take the password of the file from CertificatePassword or from the contents
          of the file named by CertificatePasswordFile, trimmed of surrounding white space, through the SecretSource
          unit, refuse both settings
          together and a password file that does not exist with the messages of that unit, refuse a key that is not
          protected by a password when DataProtection:RequireEncryptedKeys is set, and otherwise load it with a
          warning that names the file and not the folder.
        justification: |
          A password in a file keeps it out of the process environment and the configuration, and an operator who
          requires encrypted keys must not end up with a signing key on disk that anyone who can read the file can use.
        tests:
          - FileKeyProvider_GetSigningKey_PfxWithPasswordFile_LoadsSigner
          - FileKeyProvider_GetSigningKey_PasswordSettingsConflictOrFileMissing_AreRefusedWithTheirMessages
          - FileKeyProvider_GetSigningKey_UnprotectedPfx_LoadsWithWarning
          - FileKeyProvider_GetSigningKey_UnprotectedKeyWithRequireEncryptedKeys_IsRefused

      - id: ReviewCenter-AttestationKeyProvider-FilePermissions
        title: >-
          The FileKeyProvider class shall, on Linux and macOS, warn when the file that holds the private key (the
          private key file for a PEM certificate with a separate one, otherwise the certificate file; PrivateKeyPath
          is ignored for a PFX) or the password file can be accessed by the group or by others, with a message that
          names the file, the mode and a remedy and not the folder.
        justification: |
          A private key or a password that other accounts of the machine can read is not protected, and the operator
          must hear about it at start. The warning is advice, because a deployment can have a reason for a shared
          group, so the server still starts.
        tests:
          - ubuntu@FileKeyProvider_GetSigningKey_FilesReadableByOthersOnUnix_WarnsAboutEachOfThem
          - ubuntu@FileKeyProvider_GetSigningKey_SeparateKeyOrPfxWithKeyPath_ChecksOnlyTheFileThatHoldsTheKey

      - id: ReviewCenter-AttestationKeyProvider-Expiry
        title: >-
          The AttestationKeyProvider unit shall warn, for the CertificateStore and File providers, when the
          certificate ends within ExpiryWarningDays (30 by default) or has ended, naming the thumbprint and the date,
          log the warning once for each wording when the key is used, show it in the status of the key, warn for an
          expired certificate also when RequireTrustedKey is not set, warn about nothing when ExpiryWarningDays is 0,
          and refuse a negative value with an error that names the setting. The self-signed key shall not get this
          warning, because the server replaces it when it has ended.
        justification: |
          An attestation signed with an expired certificate is reported as untrusted by a PDF reader. The operator
          must hear about the end of the certificate in time to replace it, and also when the certificate has ended
          and the server still signs because the trusted key policy is off. The self-signed key renews itself.
        tests:
          - AttestationKeyPolicy_ExpiryWarning_EndsWithinDaysOrHasEnded_NamesThumbprintAndDate
          - AttestationKeyPolicy_ExpiryWarning_FarAwayOrDisabled_ReturnsNull
          - AttestationKeyProviderBase_GetSigningKey_ExpiredKeyWithoutPolicy_WarnsOnceAndStillSigns
          - AttestationKeyProviderBase_Describe_EndsSoonOrLater_WarnsOnlyWhenSoon
          - AttestationKeyProviderFactory_Create_NegativeExpiryWarningDays_ThrowsNamingTheSetting
          - AttestationKeyProviderFactory_Create_SelfSigned_StatusHasNoExpiryWarning
          - FileKeyProvider_Describe_EndsWithinWarningDays_WarnsUnlessDisabledOrFarAway
          - FileKeyProvider_GetSigningKey_ExpiredWithoutRequireTrustedKey_SignsAndWarns

      - id: ReviewCenter-AttestationKeyProvider-SelfSigned
        title: >-
          The SelfSignedKeyProvider class shall create an RSA key with a self-signed certificate of a limited validity
          period in the file attestation-selfsigned.pfx.protected in the configured folder when none exists, reload
          and use the same key afterwards, return the same key on every call, and let concurrent first uses end with
          one key for everyone.
        justification: |
          A new installation must produce an attestation without any configuration, so the server makes a key of its
          own. The key must persist, because attestations signed with different keys after every restart could not be
          compared, and concurrent requests must not each create a different key.
        tests:
          - SelfSignedKeyProvider_GetSigningKey_FirstUse_CreatesSelfSignedKeyFile
          - SelfSignedKeyProvider_GetSigningKey_FirstUse_SetsTheValidityPeriod
          - SelfSignedKeyProvider_GetSigningKey_ExistingFile_ReloadsTheSameKeyAndSigns
          - SelfSignedKeyProvider_GetSigningKey_RepeatedCalls_ReturnTheSameKey
          - SelfSignedKeyProvider_GetSigningKey_ConcurrentFirstUse_CreatesOneKeyForEveryone

      - id: ReviewCenter-AttestationKeyProvider-SelfSignedProtected
        title: >-
          The SelfSignedKeyProvider class shall store the key only as bytes that the Data Protection key ring has
          protected, so that the file is not a readable PFX and reloads with the same ring after a restart; shall
          ignore a plaintext file of an earlier version with a warning that tells the operator to delete it, and
          create a new key; shall report a file that the ring cannot decrypt as an error that names the file and tells
          the operator to restore the ring or delete the file; shall archive an expired key as a retired file and
          create a new key with a warning; and shall put no key, password or ciphertext into a message.
        justification: |
          A key file that anyone who can read the folder can use would let that person sign attestations. Tying the
          file to the key ring protects it at rest, and the ring is already part of every backup and restore. An old
          unprotected file is never trusted or migrated, so a leaked file cannot become the key again. An expired key
          would make the attestation fail, and the old PDFs stay valid because they carry their own certificate.
        tests:
          - SelfSignedKeyProvider_GetSigningKey_FirstUse_FileIsNotAReadablePfx
          - SelfSignedKeyProvider_GetSigningKey_RestartWithPersistedRing_ReloadsTheSameKey
          - SelfSignedKeyProvider_GetSigningKey_OtherKeyRing_ThrowsNamingTheFileAndKeepsIt
          - SelfSignedKeyProvider_GetSigningKey_LegacyPlaintextFile_IsIgnoredWithWarning
          - SelfSignedKeyProvider_GetSigningKey_ExpiredKey_IsArchivedAndRegeneratedWithWarning
          - SelfSignedKeyProvider_GetSigningKey_AnyScenario_NoSecretOrCiphertextInMessages

      - id: ReviewCenter-AttestationKeyProvider-NoCreate
        title: >-
          The AttestationKeyProvider unit shall, when it is told not to create a key, describe an existing key
          without changing any file, when no key exists report that a key will be created on first start without
          creating the folder or a file, and when a regular file stands where the folder should be report an error
          that names Attestation:SelfSignedFolder instead.
        justification: |
          A configuration check must be safe to run on a production installation. A check that created the key as a
          side effect would hide the very state the operator wants to see and would write with the wrong account. A
          check that reports a key that will be created where the start would fail would be wrong.
        tests:
          - SelfSignedKeyProvider_GetSigningKey_CreationNotAllowedAndNoKey_ReportsWillBeCreatedAndCreatesNothing
          - SelfSignedKeyProvider_GetSigningKey_CreationNotAllowedAndFolderIsAFile_ThrowsNamingTheSetting
          - SelfSignedKeyProvider_GetSigningKey_CreationNotAllowedAndExpiredKey_DescribesItAndChangesNothing
          - AttestationKeyProviderFactory_Create_CreationNotAllowed_ProviderCreatesNothing

      - id: ReviewCenter-AttestationKeyProvider-SelfSignedWarning
        title: >-
          The SelfSignedKeyProvider class shall log a warning that the key is self-signed and for development and test
          only when it creates or loads the key, and shall not log any secret.
        justification: |
          The operator must be told that the default key is not an organization key, and a log is one place where a
          secret must never appear.
        tests:
          - SelfSignedKeyProvider_GetSigningKey_FirstUse_LogsSelfSignedWarningWithoutSecrets

      - id: ReviewCenter-AttestationKeyProvider-SelfSignedErrors
        title: >-
          The SelfSignedKeyProvider class shall report a folder that is not set, a folder that is a file, and a key
          file that cannot be read as an attestation key error that names the setting or the file, shall offer a
          message without any folder path for a report that prints none, and shall report a cryptographic failure
          while a key is created as a failure to create the key and not as a file that cannot be decrypted.
        justification: |
          An operator can correct a problem only when the message names the setting or the file that has it. The
          configuration check is archived, so it must not print a folder path, and an error while a key is created
          must not send the operator to delete a key file that is fine.
        tests:
          - SelfSignedKeyProvider_GetSigningKey_FolderNotSet_ThrowsNamingTheSetting
          - SelfSignedKeyProvider_GetSigningKey_FolderIsAFile_ThrowsNamingTheSetting
          - SelfSignedKeyProvider_GetSigningKey_CorruptFile_ThrowsNamingTheFile
          - SelfSignedKeyProvider_GetSigningKey_OtherKeyRing_ThrowsNamingTheFileAndKeepsIt
          - SelfSignedKeyProvider_GetSigningKey_StorageAndUnreadableFailures_MessageWithoutPathHoldsNoFolder
          - SelfSignedKeyProvider_GetSigningKey_ProtectFails_IsNotReportedAsUnreadable

      - id: ReviewCenter-AttestationKeyProvider-CertificateStore
        title: >-
          The CertificateStoreKeyProvider class shall find the certificate with the configured thumbprint in the
          configured store and location, accept a thumbprint copied from a certificate dialog, keep the handle of the
          private key without exporting it, and report an unknown location, a malformed thumbprint, a certificate that
          is not in the store, and a certificate without a private key as errors that name the setting.
        justification: |
          An organization key lives in a certificate store, on a smart card, or in a hardware module, and the server
          must use it where it is. The thumbprint is usually copied from a dialog together with invisible characters.
        tests:
          - CertificateStoreKeyProvider_NormalizeThumbprint_CopiedText_GivesUpperCaseHex
          - CertificateStoreKeyProvider_NormalizeThumbprint_MissingOrMalformed_ThrowsNamingTheSetting
          - CertificateStoreKeyProvider_GetSigningKey_UnknownStoreLocation_ThrowsNamingTheSetting
          - CertificateStoreKeyProvider_GetSigningKey_CertificateNotInStore_ThrowsNamingThumbprintAndStore
          - CertificateStoreKeyProvider_GetSigningKey_CertificateInStore_FindsItAndSigns
          - CertificateStoreKeyProvider_GetSigningKey_CertificateWithoutPrivateKey_Throws
          - CertificateStoreKeyProvider_GetSigningKey_ConfiguredForTheServer_StartsWithTheCertificate

      - id: ReviewCenter-AttestationKeyProvider-Describe
        title: >-
          The AttestationKeyProvider unit shall describe the state of the key without ever throwing: available with
          the public description of the key, or unavailable with the message of the key error, and for any other
          non-fatal failure unavailable with a message that holds no detail (the detail goes to the log).
        justification: |
          The review page asks for the status on every render. A platform failure while the key is loaded (a malformed
          folder or store name, a broken certificate chain) must not turn into an error page for the whole review.
        tests:
          - SelfSignedKeyProvider_GetSigningKey_FolderIsAFile_ThrowsNamingTheSetting
          - CertificateStoreKeyProvider_GetSigningKey_CertificateNotInStore_ThrowsNamingThumbprintAndStore
          - CertificateStoreKeyProvider_GetSigningKey_CertificateInStore_FindsItAndSigns
          - SelfSignedKeyProvider_Describe_UnexpectedFailure_ReportsUnavailableWithoutDetail

      - id: ReviewCenter-AttestationKeyProvider-RequireTrustedKey
        title: >-
          The AttestationKeyProvider unit shall, when RequireTrustedKey is set, refuse a self-signed certificate, a
          certificate whose key usage does not allow digital signatures or non-repudiation, and a certificate that is
          not within its validity period, on every call and not only the first, and shall accept an organization
          certificate; the check shall not claim to check chain trust or revocation.
        justification: |
          An organization that requires an organization key must not get an attestation signed with anything else. A
          certificate can expire while the server runs, so the rule applies to every signing. Naming what is checked
          keeps the setting from being read as a promise of trust that the server does not examine.
        tests:
          - AttestationKeyPolicy_Enforce_PolicyOff_AcceptsSelfSignedKey
          - AttestationKeyPolicy_Enforce_TrustedKeyRequiredAndSelfSigned_Throws
          - AttestationKeyPolicy_Enforce_TrustedKeyRequiredAndOrganizationKey_Accepts
          - AttestationKeyPolicy_Enforce_TrustedKeyRequiredAndNoSigningUsage_Throws
          - AttestationKeyPolicy_Enforce_TrustedKeyRequiredAndOutsideValidity_Throws
          - AttestationKeyPolicy_HasSigningKeyUsage_Usage_AllowsOnlyDigitalSignatureOrNonRepudiation
          - AttestationKeyPolicy_HasSigningKeyUsage_NoExtension_AllowsSigning
          - SelfSignedKeyProvider_GetSigningKey_RequireTrustedKey_IsCheckedOnEveryCall
          - CertificateStoreKeyProvider_GetSigningKey_RequireTrustedKeyAndSelfSignedCertificate_Throws

      - id: ReviewCenter-AttestationKeyProvider-CodeSigningWarning
        title: >-
          The AttestationKeyProvider unit shall warn, without refusing the certificate for that reason, when the
          extended key usage of
          a certificate allows code signing and none of the document signing purposes (e-mail protection, Microsoft or
          Adobe document signing, any purpose), with the text "This certificate is a code-signing certificate. Adobe
          Acrobat will not trust it for document signatures; use a document-signing certificate for production.", log
          that warning once when the key is first loaded, and report the classification in the description of the key.
          A certificate without an extended key usage shall not be classified as code signing only, and the
          RequireTrustedKey rules and the lack of a chain and revocation check shall be unchanged.
        justification: |
          A code-signing certificate is not meant for documents and Adobe Acrobat does not trust it for document
          signatures, but some organizations have only such a certificate. The operator should know, and the decision
          stays with them. The server does not check the chain or revocation; the PDF reader does.
        tests:
          - AttestationKeyPolicy_IsCodeSigningOnly_ExtendedKeyUsage_ClassifiesCertificates
          - AttestationKeyPolicy_CodeSigningNotice_HasTheDefinedWording
          - AttestationSigningKey_Create_CodeSigningOnlyCertificate_SetsInfoFlag
          - AttestationKeyProviderBase_GetSigningKey_CodeSigningOnlyCertificate_LogsWarningOnceAndDoesNotRefuse
