---
# Api Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Api subsystem
# - The Api subsystem spans ApiTokenAuthentication.cs (the token sign-in of API requests),
#   ApiEndpoints.cs (the JSON routes under /api), and ApiDocument.cs (the OpenAPI document of the API)
# - Subsystem requirements describe the externally visible behavior of a script that calls the API with a personal
#   access token: reading projects and reviews, creating review drafts, downloading attestations, the evidence index
#   for ReviewMark, the document that
#   describes the API, the limits on what a token can do, and the evidence that a project chooses to publish
#   without credentials

sections:
  - title: Api Subsystem Requirements
    requirements:
      - id: ReviewCenter-Api-TokenJourney
        title: >-
          The Api subsystem shall let a client that sends a valid personal access token as a bearer token or as an HTTP
          Basic password call the API
          as the owner of the token, refuse a missing, unknown, revoked, or expired token with one generic answer,
          refuse too many refused tokens from one address, and record
          each use that is refused without recording the token value, in the audit trail or in the log.
        justification: |
          A script cannot sign in through a page, so it needs a credential that is easy to hand out and to take back.
          Acting as the owner keeps every change attributable to a person. One answer for every refusal does not tell
          somebody guessing tokens whether a token ever existed, a limit makes guessing slow, and an audit record
          without the value lets an administrator see failed use without the log becoming a source of tokens.
        children:
          - ReviewCenter-ApiTokenAuthentication-Bearer
          - ReviewCenter-ApiTokenAuthentication-Basic
          - ReviewCenter-ApiTokenAuthentication-LastUsed
          - ReviewCenter-ApiTokenAuthentication-Refusal
          - ReviewCenter-ApiTokenAuthentication-Refusal-Challenge
          - ReviewCenter-ApiTokenAuthentication-Refusal-Generic
          - ReviewCenter-ApiTokenAuthentication-Refusal-Expired
          - ReviewCenter-ApiTokenAuthentication-Refusal-MustChangePassword
          - ReviewCenter-ApiTokenAuthentication-Refusal-BasicWrong
          - ReviewCenter-ApiTokenAuthentication-Throttle
          - ReviewCenter-ApiTokenAuthentication-Throttle-RetryAfter
          - ReviewCenter-ApiTokenAuthentication-Throttle-AddressLimit
          - ReviewCenter-ApiTokenAuthentication-Throttle-Basic
          - ReviewCenter-ApiTokenAuthentication-FailureAudit
          - ReviewCenter-ApiTokenAuthentication-FailureAudit-Basic
          - ReviewCenter-ApiTokenAuthentication-FailureAudit-Once
          - ReviewCenter-ApiTokenAuthentication-FailureAudit-NoValue
          - ReviewCenter-ApiTokenAuthentication-NoLog
        tests:
          - ApiSubsystem_TokenJourney_CreateUseRevoke_WorksEndToEnd

      - id: ReviewCenter-Api-ReviewJourney
        title: >-
          The Api subsystem shall let a client with a valid token list the projects the owner of the token may see and
          the reviews of such a project, read
          one review (hiding the standing of the reviewers from a token exactly where the pages hide it), create a
          review draft from uploaded files or from the changes of a repository, mark a review
          that was created this way, download the attestation of a concluded review, report an invalid request or a
          refused rule as a problem document that names the cause, refuse a body that is too large or beyond the
          review limits, and answer an address that does not exist with a
          JSON problem document.
        justification: |
          Creating a draft for every pull request from a pipeline and fetching the attestation after sign-off are
          the reasons to have an API. The same rules as for the web pages keep the record consistent, a mark on the
          review keeps a draft created by a script visible to the reviewers, and a machine readable problem document
          lets a script act on an error without parsing text.
        children:
          - ReviewCenter-ApiEndpoints-Read
          - ReviewCenter-ApiEndpoints-Read-Reviews
          - ReviewCenter-ApiEndpoints-Read-ReviewsNotFound
          - ReviewCenter-ApiEndpoints-Read-Details
          - ReviewCenter-ApiEndpoints-Read-DetailsNotFound
          - ReviewCenter-ApiEndpoints-Read-CheckThreadCounts
          - ReviewCenter-ApiEndpoints-Read-ThreadKinds
          - ReviewCenter-ApiEndpoints-Read-NoToken
          - ReviewCenter-ApiEndpoints-Masking
          - ReviewCenter-ApiEndpoints-Masking-LeadOrOwner
          - ReviewCenter-ApiEndpoints-Masking-SubmittedOwner
          - ReviewCenter-ApiEndpoints-Masking-Concluded
          - ReviewCenter-ApiEndpoints-Masking-SingleSlot
          - ReviewCenter-ApiEndpoints-Masking-NoOutcome
          - ReviewCenter-ApiEndpoints-Masking-StoredText
          - ReviewCenter-ApiEndpoints-Masking-CreateResponse
          - ReviewCenter-ApiEndpoints-Masking-NoSlotFields
          - ReviewCenter-ApiEndpoints-Masking-AgreedFail
          - ReviewCenter-ApiEndpoints-Masking-AgreedFailSubmitted
          - ReviewCenter-ApiEndpoints-Masking-NextStep
          - ReviewCenter-ApiEndpoints-Masking-NextStepMasked
          - ReviewCenter-ApiEndpoints-Create
          - ReviewCenter-ApiEndpoints-Create-Flag
          - ReviewCenter-ApiEndpoints-Create-Audit
          - ReviewCenter-ApiEndpoints-Create-Repository
          - ReviewCenter-ApiEndpoints-Create-AllChanges
          - ReviewCenter-ApiEndpoints-Create-Skipped
          - ReviewCenter-ApiEndpoints-Create-NoToken
          - ReviewCenter-ApiEndpoints-Validation
          - ReviewCenter-ApiEndpoints-Validation-Base64
          - ReviewCenter-ApiEndpoints-Validation-EmptyBody
          - ReviewCenter-ApiEndpoints-Validation-Malformed
          - ReviewCenter-ApiEndpoints-Validation-ContentType
          - ReviewCenter-ApiEndpoints-Validation-DuplicateId
          - ReviewCenter-ApiEndpoints-Validation-InvalidIdOrTitle
          - ReviewCenter-ApiEndpoints-Validation-UnknownProject
          - ReviewCenter-ApiEndpoints-Validation-LastAdmin
          - ReviewCenter-ApiEndpoints-Validation-TooManyAttempts
          - ReviewCenter-ApiEndpoints-Validation-PasswordChange
          - ReviewCenter-ApiEndpoints-Validation-ConclusionRequired
          - ReviewCenter-ApiEndpoints-Validation-InvalidInput
          - ReviewCenter-ApiEndpoints-Validation-ChecklistInvalid
          - ReviewCenter-ApiEndpoints-Limits
          - ReviewCenter-ApiEndpoints-Limits-BodySize
          - ReviewCenter-ApiEndpoints-Limits-FileCount
          - ReviewCenter-ApiEndpoints-Limits-FileSize
          - ReviewCenter-ApiEndpoints-Limits-TotalSize
          - ReviewCenter-ApiEndpoints-Limits-DecodeCount
          - ReviewCenter-ApiEndpoints-Limits-DecodeLength
          - ReviewCenter-ApiEndpoints-Limits-DecodeOrder
          - ReviewCenter-ApiEndpoints-Attestation
          - ReviewCenter-ApiEndpoints-Attestation-NotFound
          - ReviewCenter-ApiEndpoints-Attestation-NotSigned
          - ReviewCenter-ApiEndpoints-Attestation-NoToken
          - ReviewCenter-ApiEndpoints-Errors
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd

      - id: ReviewCenter-Api-DueDate
        title: >-
          The Api subsystem shall let a client with a valid token give a review an optional due date, a calendar day
          in UTC, in the request that creates it, refuse a date that is not valid with a problem document, creating
          nothing, and show the due date and whether the review is overdue in the reviews that it returns.
        justification: |
          A pipeline that creates a draft for every pull request knows when the change is expected to be reviewed,
          and a script that polls the reviews must see which are late without reading a page.
        children:
          - ReviewCenter-ApiEndpoints-CreateDueDate
          - ReviewCenter-ApiEndpoints-CreateDueDate-Audit
          - ReviewCenter-ApiEndpoints-CreateDueDate-List
          - ReviewCenter-ApiEndpoints-CreateDueDate-OverdueFlag
          - ReviewCenter-ApiEndpoints-CreateDueDate-Invalid
        tests:
          - ApiEndpoints_CreateReview_DueDate_IsCreatedAndShownWithOverdueFlag
          - ApiEndpoints_CreateReview_InvalidDueDate_Answers400AndCreatesNothing

      - id: ReviewCenter-Api-Progress
        title: >-
          The Api subsystem shall show in every review of the list of the reviews of a project whether it is approved,
          how many reviewer slots and valid and out-of-date signatures it has, when it last changed, its due date and
          whether it is overdue, from the same service as the project page, and shall only add these fields.
        justification: |
          A script that watches a project must see the same progress as a person who opens the project page, and an
          added field must not break a client that already reads the list.
        children:
          - ReviewCenter-ApiEndpoints-ListProgress
          - ReviewCenter-ApiEndpoints-ListProgress-ReadOnce
          - ReviewCenter-ApiEndpoints-ListProgress-Outcome
        tests:
          - ApiEndpoints_ListReviews_Progress_ShowsApprovalSignaturesAndLastActivity
          - ApiEndpoints_ListReviews_Project_ReadsTheReviewListOnce
          - ApiDocument_Get_MatchesCommittedSnapshot

      - id: ReviewCenter-Api-ReadOnlyRole
        title: >-
          The Api subsystem shall let a token of a member whose role is Auditor read what the member may see and refuse
          every change by it with a problem document, and shall answer a token of a user who is no member of the project
          as for a project that does not exist.
        justification: |
          A script that acts for an auditor must be as read-only as the auditor, and must not reveal which projects
          exist.
        children:
          - ReviewCenter-ApiEndpoints-ReadOnlyRole
          - ReviewCenter-ApiEndpoints-ReadOnlyRole-Auditor403
          - ReviewCenter-ApiEndpoints-ReadOnlyRole-NonMember404
          - ReviewCenter-ApiEndpoints-ReadOnlyRole-OpenWork
        tests:
          - ApiAuditor_Reads_Token_ServeTheProject
          - ApiAuditor_CreateReview_AuditorIs403AndNonMemberIs404

      - id: ReviewCenter-Api-FollowUp
        title: >-
          The Api subsystem shall let a client with a valid token create a review as a follow-up of an earlier review
          of the project by naming it in the request that creates the review, refuse a review that cannot be followed
          with a problem document, creating nothing, and show the followed review in the reviews that it returns.
        justification: |
          A pipeline that creates the next draft after a failed review must be able to carry over the work that was
          fine, and a script that polls the reviews must see which ones are follow-ups without reading a page.
        children:
          - ReviewCenter-ApiEndpoints-CreateFollowUp
          - ReviewCenter-ApiEndpoints-CreateFollowUp-Shown
          - ReviewCenter-ApiEndpoints-CreateFollowUp-Invalid
        tests:
          - ApiEndpoints_CreateReview_FollowsReviewId_IsCreatedShownAndRefusedWhenInvalid

      - id: ReviewCenter-Api-EvidenceJourney
        title: >-
          The Api subsystem shall let ReviewMark read the evidence index of a project and follow the file address of an
          entry with a personal access token that it sends as the password of HTTP Basic credentials, and shall refuse
          the token once it is revoked. A project may also open the index and its files to a client without credentials
          (see AnonymousEvidence).
        justification: |
          ReviewMark can send only HTTP Basic credentials. Accepting the token that way, with the same checks and the
          same refusal as a bearer token, lets a pipeline verify the reviews against ReviewCenter without a second
          kind of credential.
        children:
          - ReviewCenter-ApiEndpoints-EvidenceIndex
          - ReviewCenter-ApiEndpoints-EvidenceIndex-OnlyPlanned
          - ReviewCenter-ApiEndpoints-EvidenceIndex-Result
          - ReviewCenter-ApiEndpoints-EvidenceIndex-File
          - ReviewCenter-ApiEndpoints-EvidenceIndex-UrlBuild
          - ReviewCenter-ApiEndpoints-EvidenceIndex-RequestHost
          - ReviewCenter-ApiEndpoints-EvidenceIndex-Basic
          - ReviewCenter-ApiEndpoints-EvidenceIndex-NoStore
          - ReviewCenter-ApiEndpoints-EvidenceIndex-Empty
          - ReviewCenter-ApiEndpoints-EvidenceIndex-UnknownProject
          - ReviewCenter-ApiEndpoints-EvidenceIndex-NoToken
        tests:
          - ApiSubsystem_EvidenceJourney_BasicCredentials_ReadIndexAndFollowLink_WorksEndToEnd

      - id: ReviewCenter-Api-Isolation
        title: >-
          The Api subsystem shall keep a token to the API: a token shall not sign a review or change the reviewers of
          a review, shall not sign in to a web page or to the sign-in endpoints, and a session cookie shall not be
          accepted by the API.
        justification: |
          A signature must prove that the person was present, which a stored secret does not. A token that could
          sign, or that could open the web pages, would turn a leaked token into the identity of the person, and a
          cookie accepted by the API would open it to forgery from other sites.
        children:
          - ReviewCenter-ApiTokenAuthentication-Cookie
          - ReviewCenter-ApiTokenAuthentication-Cookie-WebPage
          - ReviewCenter-ApiTokenAuthentication-Cookie-AuthAndBlazor
          - ReviewCenter-ApiEndpoints-NoSigning
        tests:
          - ApiSubsystem_TokenPrincipal_SigningAndWebPages_AreNotReachable

      - id: ReviewCenter-Api-LockedReview
        title: >-
          The Api subsystem shall keep a review that is approved and locked readable to a client with a valid token,
          with its attestation and its evidence index, shall report a change that the lock refuses, or that would make
          a signature out of date without acknowledgement, or that a review rule of the project refuses, as a problem
          document with status 409, and shall not let a token reopen a review.
        justification: |
          The approved record is what pipelines and auditors read, so the lock must not hide it, while a script that
          tries to change it must learn the reason in a form it can act on.
        children:
          - ReviewCenter-ApiEndpoints-LockedReview
          - ReviewCenter-ApiEndpoints-OutOfDateConflict
          - ReviewCenter-ApiEndpoints-RuleConflict
        tests:
          - ApiSubsystem_LockedReview_StaysReadableAndMutationIsProblem409

      - id: ReviewCenter-Api-Document
        title: >-
          The Api subsystem shall describe the API in an OpenAPI document, served without a token, that names the
          bearer scheme, marks the two operations that can be called without credentials, is the same for every server
          start, and matches the document that is kept with the documentation.
        justification: |
          A client generator and a person reading the documentation both need the contract of the API. A document
          that is committed and compared with the running server is kept from drifting away from the behavior.
        children:
          - ReviewCenter-ApiDocument-Document
          - ReviewCenter-ApiDocument-Document-Version
          - ReviewCenter-ApiDocument-Document-NoServer
          - ReviewCenter-ApiDocument-Document-Scheme
          - ReviewCenter-ApiDocument-Document-OpenOperations
          - ReviewCenter-ApiDocument-Document-RequiredMembers
          - ReviewCenter-ApiDocument-Snapshot
          - ReviewCenter-ApiDocument-Snapshot-Committed
          - ReviewCenter-OTS-OpenApi-Document
        tests:
          - ApiDocument_Get_NoToken_DescribesTheApiWithBearerScheme
          - ApiDocument_Get_MatchesCommittedSnapshot

      - id: ReviewCenter-Api-ProjectAccess
        title: >-
          The Api subsystem shall answer a request for a project, or for anything in a project, with the owner of the
          token being neither a member of the project nor a system administrator, with the 404 that it answers for a
          project that does not exist, with the same body, on every route of a project and for a bearer token as well as
          for HTTP Basic credentials, list only the projects the owner may see, serve a member and a system
          administrator, and stop serving a token for a project at once when its owner is removed from it. A request
          without credentials is decided by the project (see AnonymousEvidence).
        justification: |
          A project may hold confidential work, and a script that holds a token must see only what its owner sees. An
          answer that differed between a project the owner may not see and a project that does not exist would tell
          the script which projects exist. The token carries no copy of the memberships, so a change of them takes
          effect with the next request.
        children:
          - ReviewCenter-ApiEndpoints-ProjectAccess
          - ReviewCenter-ApiEndpoints-ProjectAccess-Create
          - ReviewCenter-ApiEndpoints-EvidenceIndex
          - ReviewCenter-ApiEndpoints-EvidenceIndex-OnlyPlanned
          - ReviewCenter-ApiEndpoints-EvidenceIndex-Result
          - ReviewCenter-ApiEndpoints-EvidenceIndex-File
          - ReviewCenter-ApiEndpoints-EvidenceIndex-UrlBuild
          - ReviewCenter-ApiEndpoints-EvidenceIndex-RequestHost
          - ReviewCenter-ApiEndpoints-EvidenceIndex-Basic
          - ReviewCenter-ApiEndpoints-EvidenceIndex-NoStore
          - ReviewCenter-ApiEndpoints-EvidenceIndex-Empty
          - ReviewCenter-ApiEndpoints-EvidenceIndex-UnknownProject
          - ReviewCenter-ApiEndpoints-EvidenceIndex-NoToken
          - ReviewCenter-ApiEndpoints-Attestation
          - ReviewCenter-ApiEndpoints-Attestation-NotFound
          - ReviewCenter-ApiEndpoints-Attestation-NotSigned
          - ReviewCenter-ApiEndpoints-Attestation-NoToken
          - ReviewCenter-ApiEndpoints-Checklist
          - ReviewCenter-ApiEndpoints-Checklist-Custom
          - ReviewCenter-ApiEndpoints-Checklist-EmptyHint
          - ReviewCenter-ApiEndpoints-Checklist-NonMember
          - ReviewCenter-ApiEndpoints-Checklist-UnknownProject
          - ReviewCenter-ApiEndpoints-Checklist-Unreadable
          - ReviewCenter-ApiEndpoints-Checklist-NoToken
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused
          - ApiProjectAccess_ListProjects_ShowsOnlyMemberProjectsExceptToSystemAdmins
          - ApiProjectAccess_Token_OwnerRemovedFromProject_Gets404AtOnce

      - id: ReviewCenter-Api-ProjectAccess-SameAnswer
        title: >-
          The Api subsystem shall answer a request on any route of a project, from a token whose owner may not see the
          project, with the status 404 and the same body that it answers for a project that does not exist, for a
          bearer token and for HTTP Basic credentials.
        justification: |
          Every route that names a project is a way to find out whether the project exists. Answering with the body of
          a missing project closes all of them, and checking before the body of a creation is read keeps a non-member
          from learning anything from the validation of a request.
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject

      - id: ReviewCenter-Api-ProjectAccess-Served
        title: >-
          The Api subsystem shall serve a request on any route of a project from the token of a member of the project
          and from the token of a system administrator, and not refuse it as for a project that does not exist.
        justification: |
          The check that hides a project from a non-member must not hide it from the people who may see it.
        tests:
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused

      - id: ReviewCenter-Api-ProjectAccess-ListProjects
        title: >-
          The Api subsystem shall list for a token only the projects that its owner is a member of, except that it
          lists every project for a system administrator.
        justification: |
          A script that holds a token must see only what its owner sees, and the list of projects must not tell it
          which other projects exist.
        tests:
          - ApiProjectAccess_ListProjects_ShowsOnlyMemberProjectsExceptToSystemAdmins

      - id: ReviewCenter-Api-ProjectAccess-Removed
        title: >-
          The Api subsystem shall answer a token with the status 404 for a project at once when its owner has been
          removed from the project.
        justification: |
          The token carries no copy of the memberships, so a change of them must take effect with the next request.
        tests:
          - ApiProjectAccess_Token_OwnerRemovedFromProject_Gets404AtOnce

      - id: ReviewCenter-Api-AuditExport
        title: >-
          The Api subsystem shall let a signed-in user who may read the audit trail (a project admin or a system
          administrator for a project, a system administrator for the whole trail) download the trail that matches
          a filter as CSV or JSON from a cookie-authenticated route, with the state of the chain in the response
          headers, refuse everybody else as the audit pages do and a request without a session, and keep these
          routes out of the token API and its OpenAPI document.
        justification: |
          An auditor needs a copy of the trail that can be kept and checked elsewhere, and the export of a trail that
          names every user and action must be limited like the page that shows it.
        children:
          - ReviewCenter-ApiEndpoints-AuditExport
          - ReviewCenter-ApiEndpoints-AuditExport-FileName
          - ReviewCenter-ApiEndpoints-AuditExport-Chain
          - ReviewCenter-ApiEndpoints-AuditExport-NoStore
          - ReviewCenter-ApiEndpoints-AuditExport-System
          - ReviewCenter-ApiEndpoints-AuditExport-WholeTrail
          - ReviewCenter-ApiEndpoints-AuditExport-Json
          - ReviewCenter-ApiEndpoints-AuditExport-JsonEnvelope
          - ReviewCenter-ApiEndpoints-AuditExport-Filter
          - ReviewCenter-ApiEndpoints-AuditExport-ReversedRange
          - ReviewCenter-ApiEndpoints-AuditExport-Audited
          - ReviewCenter-ApiEndpoints-AuditExport-ProjectRouteScope
          - ReviewCenter-ApiEndpoints-AuditExport-GlobalScope
          - ReviewCenter-ApiEndpoints-AuditExport-Forbidden
          - ReviewCenter-ApiEndpoints-AuditExport-NotFound
          - ReviewCenter-ApiEndpoints-AuditExport-Auditor
          - ReviewCenter-ApiEndpoints-AuditExport-SignedOut
          - ReviewCenter-ApiEndpoints-AuditExport-GlobalRefused
          - ReviewCenter-ApiEndpoints-AuditExport-Hostile
          - ReviewCenter-ApiEndpoints-AuditExport-UnknownFormat
          - ReviewCenter-ApiEndpoints-AuditExport-Broken
          - ReviewCenter-ApiEndpoints-AuditExport-NotInApiDocument
          - ReviewCenter-ApiEndpoints-AuditExport-ClientAbort
          - ReviewCenter-ApiEndpoints-AuditExport-WriteFailure
        tests:
          - AuditExportEndpoints_ProjectExport_ProjectAdmin_ServesCsvWithHeaders
          - AuditExportEndpoints_ProjectExport_NotAllowed_Answers403Or404
          - AuditExportEndpoints_GlobalExport_NotSystemAdmin_Answers403

      - id: ReviewCenter-Api-AnonymousEvidence
        title: >-
          The Api subsystem shall let a project open its evidence index and its attestation PDFs to a client without
          credentials, each by its own setting that is off by default, and no other route; shall refuse a client
          without credentials as it refuses a missing token when the setting is off, whether or not the project
          exists; shall never treat a request with a wrong token as a request without credentials; shall limit such
          a client by address; shall record such a release of an attestation in the audit trail with the actor
          anonymous; and shall describe the two routes in the OpenAPI document as callable without credentials.
        justification: |
          Evidence is useful when a pipeline or an auditor can read it without an account, but whether a project
          publishes it is the decision of the project. The exception must be narrow, switched off by default, no
          different for a project that does not exist, limited by address, and visible in the audit trail and in the
          contract of the API.
        children:
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-Open
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-OwnRoute
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-OwnProject
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-TurnedOff
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-OtherRoutes
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-AttestationPage
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-WrongToken
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence-ValidToken
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-PerAddress
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-NewWindow
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-RetryAfter
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-Capacity
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-EvictExpired
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-EvictOldest
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-Renewed
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-ClockBack
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-Concurrent
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit-ConcurrentCapacity
          - ReviewCenter-ApiDocument-Document
          - ReviewCenter-ApiDocument-Document-Version
          - ReviewCenter-ApiDocument-Document-NoServer
          - ReviewCenter-ApiDocument-Document-Scheme
          - ReviewCenter-ApiDocument-Document-OpenOperations
          - ReviewCenter-ApiDocument-Document-RequiredMembers
        tests:
          - AnonymousEvidenceAccess_Matrix_ServesOnlyWhoMay
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous
          - AnonymousEvidenceAccess_TooManyAnonymousRequests_Answers429WithRetryAfter

      - id: ReviewCenter-Api-AnonymousEvidence-OpenRoutes
        title: >-
          The Api subsystem shall let only two routes of the API, the evidence index and the attestation PDF of a
          project, be called without credentials, and shall require a token for every other route of the API.
        justification: |
          The exception for the evidence that a project chooses to publish must be narrow, so that a new route of the
          API is closed to a caller without credentials unless somebody opens it on purpose.
        tests:
          - AnonymousEvidenceAccess_Endpoints_OnlyTheTwoRoutesUseTheOpenPolicies

      - id: ReviewCenter-Api-AnonymousEvidence-Index
        title: >-
          The Api subsystem shall serve the evidence index of a project, with the file address of the attestation of a
          review in each entry, to a client without credentials once the project has switched on the anonymous access
          of the index.
        justification: |
          A pipeline or an auditor that has no account can read the evidence that the project chose to publish.
        tests:
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous

      - id: ReviewCenter-Api-AnonymousEvidence-Pdf
        title: >-
          The Api subsystem shall serve the signed attestation PDF of a review to a client without credentials once the
          project has switched on the anonymous access of the PDFs, as a PDF whose signature can be verified and that
          is not stored by caches.
        justification: |
          A pipeline or an auditor that has no account can fetch the attestation that the index points to and check it.
        tests:
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous

      - id: ReviewCenter-Api-AnonymousEvidence-Audited
        title: >-
          The Api subsystem shall record in the audit trail, with the actor anonymous and the project, the release of
          an attestation PDF to a client without credentials.
        justification: |
          A project must be able to see afterwards that its attestations were fetched without an account.
        tests:
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous

      - id: ReviewCenter-Api-AnonymousEvidence-Limit
        title: >-
          The Api subsystem shall answer a client without credentials that has sent more requests to the evidence index
          route than the limit of its address allows with status 429 and a response that caches do
          not store, and shall not limit a client that sends a token.
        justification: |
          An anonymous attestation costs a signature and the caller has no account to hold responsible, but a member
          who is signed in with a token must not be locked out by the requests of strangers.
        tests:
          - AnonymousEvidenceAccess_TooManyAnonymousRequests_Answers429WithRetryAfter

      - id: ReviewCenter-Api-AnonymousEvidence-RetryAfter
        title: >-
          The Api subsystem shall tell a client without credentials that was limited, in a Retry-After header, how long
          it has to wait.
        justification: |
          A script must know when it may try again.
        tests:
          - AnonymousEvidenceAccess_TooManyAnonymousRequests_Answers429WithRetryAfter
