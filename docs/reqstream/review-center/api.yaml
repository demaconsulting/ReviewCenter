---
# Api Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Api subsystem
# - The Api subsystem spans ApiTokenAuthentication.cs (the token sign-in of API requests),
#   ApiEndpoints.cs (the JSON routes under /api), and ApiDocument.cs (the OpenAPI document of the API)
# - Subsystem requirements describe the externally visible behavior of a script that calls the API with a personal
#   access token: reading projects and reviews, creating review drafts, downloading attestations, the evidence index
#   for ReviewMark, the document that
#   describes the API, the limits on what a token can do, and the evidence that a project chooses to publish
#   without credentials

sections:
  - title: Api Subsystem Requirements
    requirements:
      - id: ReviewCenter-Api-TokenJourney
        title: >-
          The Api subsystem shall let a client that sends a valid personal access token as a bearer token or as an HTTP
          Basic password call the API
          as the owner of the token, refuse a missing, unknown, revoked, or expired token with one generic answer,
          refuse too many refused tokens from one address, and record
          each use that is refused without recording the token value, in the audit trail or in the log.
        justification: |
          A script cannot sign in through a page, so it needs a credential that is easy to hand out and to take back.
          Acting as the owner keeps every change attributable to a person. One answer for every refusal does not tell
          somebody guessing tokens whether a token ever existed, a limit makes guessing slow, and an audit record
          without the value lets an administrator see failed use without the log becoming a source of tokens.
        children:
          - ReviewCenter-ApiTokenAuthentication-Bearer
          - ReviewCenter-ApiTokenAuthentication-Refusal
          - ReviewCenter-ApiTokenAuthentication-Throttle
          - ReviewCenter-ApiTokenAuthentication-FailureAudit
          - ReviewCenter-ApiTokenAuthentication-NoLog
        tests:
          - ApiSubsystem_TokenJourney_CreateUseRevoke_WorksEndToEnd

      - id: ReviewCenter-Api-ReviewJourney
        title: >-
          The Api subsystem shall let a client with a valid token list the projects the owner of the token may see and
          the reviews of such a project, read
          one review, create a review draft from uploaded files or from the changes of a repository, mark a review
          that was created this way, download the attestation of a signed review, report an invalid request or a
          refused rule as a problem document that names the cause, refuse a body that is too large or beyond the
          review limits, and answer an address that does not exist with a
          JSON problem document.
        justification: |
          Creating a draft for every pull request from a pipeline and fetching the attestation after sign-off are
          the reasons to have an API. The same rules as for the web pages keep the record consistent, a mark on the
          review keeps a draft created by a script visible to the reviewers, and a machine readable problem document
          lets a script act on an error without parsing text.
        children:
          - ReviewCenter-ApiEndpoints-Read
          - ReviewCenter-ApiEndpoints-Create
          - ReviewCenter-ApiEndpoints-Validation
          - ReviewCenter-ApiEndpoints-Limits
          - ReviewCenter-ApiEndpoints-Attestation
          - ReviewCenter-ApiEndpoints-Errors
        tests:
          - ApiSubsystem_ReviewJourney_CreateDraftReadAndDownloadAttestation_WorksEndToEnd

      - id: ReviewCenter-Api-EvidenceJourney
        title: >-
          The Api subsystem shall let ReviewMark read the evidence index of a project and follow the file address of an
          entry with a personal access token that it sends as the password of HTTP Basic credentials, and shall refuse
          the token once it is revoked. A project may also open the index and its files to a client without credentials
          (see AnonymousEvidence).
        justification: |
          ReviewMark can send only HTTP Basic credentials. Accepting the token that way, with the same checks and the
          same refusal as a bearer token, lets a pipeline verify the reviews against ReviewCenter without a second
          kind of credential.
        children:
          - ReviewCenter-ApiEndpoints-EvidenceIndex
        tests:
          - ApiSubsystem_EvidenceJourney_BasicCredentials_ReadIndexAndFollowLink_WorksEndToEnd

      - id: ReviewCenter-Api-Isolation
        title: >-
          The Api subsystem shall keep a token to the API: a token shall not sign a review or change the reviewers of
          a review, shall not sign in to a web page or to the sign-in endpoints, and a session cookie shall not be
          accepted by the API.
        justification: |
          A signature must prove that the person was present, which a stored secret does not. A token that could
          sign, or that could open the web pages, would turn a leaked token into the identity of the person, and a
          cookie accepted by the API would open it to forgery from other sites.
        children:
          - ReviewCenter-ApiTokenAuthentication-Cookie
          - ReviewCenter-ApiEndpoints-NoSigning
        tests:
          - ApiSubsystem_TokenPrincipal_SigningAndWebPages_AreNotReachable

      - id: ReviewCenter-Api-Document
        title: >-
          The Api subsystem shall describe the API in an OpenAPI document, served without a token, that names the
          bearer scheme, marks the two operations that can be called without credentials, is the same for every server
          start, and matches the document that is kept with the documentation.
        justification: |
          A client generator and a person reading the documentation both need the contract of the API. A document
          that is committed and compared with the running server is kept from drifting away from the behavior.
        children:
          - ReviewCenter-ApiDocument-Document
          - ReviewCenter-ApiDocument-Snapshot
          - ReviewCenter-OTS-OpenApi-Document
        tests:
          - ApiDocument_Get_NoToken_DescribesTheApiWithBearerScheme
          - ApiDocument_Get_MatchesCommittedSnapshot

      - id: ReviewCenter-Api-ProjectAccess
        title: >-
          The Api subsystem shall answer a request for a project, or for anything in a project, with the owner of the
          token being neither a member of the project nor a system administrator, with the 404 that it answers for a
          project that does not exist, with the same body, on every route of a project and for a bearer token as well as
          for HTTP Basic credentials, list only the projects the owner may see, serve a member and a system
          administrator, and stop serving a token for a project at once when its owner is removed from it. A request
          without credentials is decided by the project (see AnonymousEvidence).
        justification: |
          A project may hold confidential work, and a script that holds a token must see only what its owner sees. An
          answer that differed between a project the owner may not see and a project that does not exist would tell
          the script which projects exist. The token carries no copy of the memberships, so a change of them takes
          effect with the next request.
        children:
          - ReviewCenter-ApiEndpoints-ProjectAccess
          - ReviewCenter-ApiEndpoints-EvidenceIndex
          - ReviewCenter-ApiEndpoints-Attestation
        tests:
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject
          - ApiProjectAccess_EveryProjectRoute_MemberAndSystemAdmin_AreNotRefused
          - ApiProjectAccess_ListProjects_ShowsOnlyMemberProjectsExceptToSystemAdmins
          - ApiProjectAccess_Token_OwnerRemovedFromProject_Gets404AtOnce

      - id: ReviewCenter-Api-AnonymousEvidence
        title: >-
          The Api subsystem shall let a project open its evidence index and its attestation PDFs to a client without
          credentials, each by its own setting that is off by default, and no other route; shall refuse a client
          without credentials as it refuses a missing token when the setting is off, whether or not the project
          exists; shall never treat a request with a wrong token as a request without credentials; shall limit such
          a client by address; shall record such a release of an attestation in the audit trail with the actor
          anonymous; and shall describe the two routes in the OpenAPI document as callable without credentials.
        justification: |
          Evidence is useful when a pipeline or an auditor can read it without an account, but whether a project
          publishes it is the decision of the project. The exception must be narrow, switched off by default, no
          different for a project that does not exist, limited by address, and visible in the audit trail and in the
          contract of the API.
        children:
          - ReviewCenter-ApiTokenAuthentication-AnonymousEvidence
          - ReviewCenter-ApiTokenAuthentication-AnonymousRateLimit
          - ReviewCenter-ApiEndpoints-OpenRoutes
          - ReviewCenter-ApiEndpoints-AnonymousLimit
          - ReviewCenter-ApiDocument-Document
        tests:
          - AnonymousEvidenceAccess_Matrix_ServesOnlyWhoMay
          - AnonymousEvidenceAccess_BothOn_ServesIndexEntryAndSignedPdfAndAuditsAnonymous
          - AnonymousEvidenceAccess_TooManyAnonymousRequests_Answers429WithRetryAfter
