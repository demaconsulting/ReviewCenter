---
# Software Unit Requirements for the TotpLoginPage Unit
#
# The TotpLoginPage unit is the page at /login/totp (TotpLoginPage.razor with its code-behind): the second step of the
# sign-in of an account with a second factor, where the person types the code of the authenticator app or a recovery
# code.

sections:
  - title: TotpLoginPage Unit Requirements
    requirements:
      - id: ReviewCenter-TotpLoginPage-SecondStepForm
        title: >-
          The TotpLoginPage unit shall show, only while a valid pending sign-in for the client exists, a form with one
          code field that posts to the endpoint of the second step.
        justification: |
          The page is reached with a cookie only, so it must not open for somebody without a pending sign-in.
        tests:
          - TotpLoginPage_Render_PendingSignIn_ShowsCodeFormAndNoUserName

      - id: ReviewCenter-TotpLoginPage-SecondStepForm-NoUserName
        title: >-
          The TotpLoginPage unit shall not show the user name of the account that is being signed in.
        justification: |
          Whoever sees the screen must not learn whose account is being signed in.
        tests:
          - TotpLoginPage_Render_PendingSignIn_ShowsCodeFormAndNoUserName

      - id: ReviewCenter-TotpLoginPage-SecondStepForm-WrongCode
        title: >-
          The TotpLoginPage unit shall show the same message for a wrong code whatever the reason, a message that does
          not tell the cause.
        justification: |
          A message that differed by reason would tell an observer whether a recovery code was used before or whether
          a code was close.
        tests:
          - TotpLoginPage_Render_ErrorFlag_ShowsMatchingMessage

      - id: ReviewCenter-TotpLoginPage-SecondStepForm-Throttled
        title: >-
          The TotpLoginPage unit shall show a message that there were too many attempts when the client made too many
          attempts.
        justification: |
          A person who is refused for the number of attempts must be told why a right code does not work now.
        tests:
          - TotpLoginPage_Render_ErrorFlag_ShowsMatchingMessage

      - id: ReviewCenter-TotpLoginPage-SecondStepForm-NoPendingSignIn
        title: >-
          The TotpLoginPage unit shall send a visitor who has no valid pending sign-in to the login page with the notice
          that the sign-in has ended.
        justification: |
          The page must not open for somebody who did not pass the first step, and the notice tells why the sign-in
          page is shown.
        tests:
          - TotpLoginPage_Render_NoValidChallenge_RedirectsToLoginWithExpiredFlag

      - id: ReviewCenter-TotpLoginPage-SecondStepForm-OtherAddress
        title: >-
          The TotpLoginPage unit shall send a visitor whose pending sign-in was started from another address to the
          login page.
        justification: |
          A pending sign-in that is used from a different address may be a stolen cookie, so it is not accepted.
        tests:
          - TotpLoginPage_Render_ChallengeFromOtherAddress_RedirectsToLogin
