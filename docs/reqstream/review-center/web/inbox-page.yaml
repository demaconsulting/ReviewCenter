---
# Software Unit Requirements for the InboxPage Unit
#
# The InboxPage unit is the page at /inbox that lists the reviews that wait for the signed-in user in eight groups,
# with a summary line, a chip and an unread badge on each item, and a button that marks everything as read. It is an
# interactive page that needs a sign-in.

sections:
  - title: InboxPage Unit Requirements
    requirements:
      - id: ReviewCenter-InboxPage-Access
        title: >-
          The InboxPage unit shall show the items of the inbox only to a signed-in user.
        justification: |
          The inbox says what waits for a person, so it is personal and needs the identity of the person.
        tests:
          - InboxPage_Render_Anonymous_IsNotShown

      - id: ReviewCenter-InboxPage-Sections
        title: >-
          The InboxPage unit shall show under the titled group To answer the reviews in which the user has a ballot
          to hand in.
        justification: |
          The reader must see first what is theirs to do, and a ballot not yet handed in is the most basic work.
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - InboxPage_Render_NewSections_ShowTitlesChipsAndChecklistLinks

      - id: ReviewCenter-InboxPage-Sections-Question
        title: >-
          The InboxPage unit shall show under the titled group To answer the reviews in which someone else asked the
          user a question that the user has not answered.
        justification: |
          A question left unanswered holds up the whole review, and the person asked must see it as work to do and
          not as news.
        tests:
          - InboxPage_Render_QuestionForYou_ShowsRowLinkingToReview

      - id: ReviewCenter-InboxPage-Sections-Disputed
        title: >-
          The InboxPage unit shall show under the titled group Disputed the reviews in which the user handed in the
          ballot and the ballots differ on some check.
        justification: |
          A difference between the ballots is settled by the reviewers, so the user who gave a ballot must be led to
          it.
        tests:
          - InboxPage_Render_NewSections_ShowTitlesChipsAndChecklistLinks

      - id: ReviewCenter-InboxPage-Sections-ReadyToSign
        title: >-
          The InboxPage unit shall show under the titled group Ready to sign the reviews in which nothing blocks the
          signature of the user and a slot of the user has no current signature.
        justification: |
          A signature that is ready to be given is the last step of the work of a reviewer, so it must not be missed.
        tests:
          - InboxPage_Render_NewSections_ShowTitlesChipsAndChecklistLinks

      - id: ReviewCenter-InboxPage-Sections-SignatureLost
        title: >-
          The InboxPage unit shall show under the titled group Your signature no longer counts the reviews that
          changed after the user signed and still block a new signature.
        justification: |
          A lost signature leaves the review short of approval without a word, so the signer must be told.
        tests:
          - InboxPage_Render_SignatureLost_ShowsSectionChipAndReason

      - id: ReviewCenter-InboxPage-Sections-RepliesWaiting
        title: >-
          The InboxPage unit shall show under the titled group Replies waiting the reviews in which someone else
          answered in a thread that the user took part in.
        justification: |
          A person who asked a question must learn that the answer has come without opening every review.
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - InboxPage_Render_RepliesWaiting_ShowsTitledSection

      - id: ReviewCenter-InboxPage-Sections-RepliesWaitingReview
        title: >-
          The InboxPage unit shall show under the titled group Replies waiting the reviews that the user authored and
          in which someone else wrote the latest comment of an open thread.
        justification: |
          The author owns the review and must learn of every open discussion on it, also of one the author did not
          start.
        tests:
          - InboxPage_Render_RepliesWaitingOnOwnReview_ShowsTitledSection

      - id: ReviewCenter-InboxPage-Sections-FailedChecks
        title: >-
          The InboxPage unit shall show under the titled group Failed checks the reviews of the user in which a check
          is answered with Fail.
        justification: |
          The author must see at once that a reviewer found a defect, because the author is the one who fixes it.
        tests:
          - InboxPage_Render_FailedChecks_ShowsTitledSection

      - id: ReviewCenter-InboxPage-Sections-WaitingForOthers
        title: >-
          The InboxPage unit shall show under the titled group Waiting for others the reviews in which the user did
          their part and the review waits for other people.
        justification: |
          The user must see that the review is under way and not forgotten, without taking it for work to do.
        tests:
          - InboxPage_Render_WaitingForOthers_NotCountedInSummary

      - id: ReviewCenter-InboxPage-Sections-Updates
        title: >-
          The InboxPage unit shall show under the titled group Updates the reviews of the user that someone else
          approved since the user last looked.
        justification: |
          News that need no action must not mix with the work, but the author must still learn them.
        tests:
          - InboxPage_Render_Update_ShowsTitledSection

      - id: ReviewCenter-InboxPage-Sections-UpdatesRejected
        title: >-
          The InboxPage unit shall show under the titled group Updates, with the chip Rejected, the reviews of the
          user that someone else rejected since the user last looked.
        justification: |
          A rejection ends the review without approval and the author must rework it, so the author must be told at
          once.
        tests:
          - InboxPage_Render_UpdateRejected_ShowsTitledSectionAndChip

      - id: ReviewCenter-InboxPage-Sections-UpdatesReopened
        title: >-
          The InboxPage unit shall show under the titled group Updates, with the chip Reopened, the reviews of the
          user that someone else reopened since the user last looked.
        justification: |
          A reopened review needs fresh signatures, so the author must not keep taking it for concluded.
        tests:
          - InboxPage_Render_UpdateReopened_ShowsTitledSectionAndChip

      - id: ReviewCenter-InboxPage-Sections-Project
        title: >-
          The InboxPage unit shall show with each item the project and the review.
        justification: |
          The reader must know which review an item belongs to before opening it.
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks

      - id: ReviewCenter-InboxPage-Sections-ChecklistLink
        title: >-
          The InboxPage unit shall link an item of the groups to answer and disputed to the checklist of the review.
        justification: |
          A ballot or a dispute is worked on in the checklist, so the link goes there.
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - InboxPage_Render_NewSections_ShowTitlesChipsAndChecklistLinks

      - id: ReviewCenter-InboxPage-Sections-ReviewLink
        title: >-
          The InboxPage unit shall link an item of the groups other than to answer and disputed to the review.
        justification: |
          What waits in these groups is read or done on the review page.
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - InboxPage_Render_NewSections_ShowTitlesChipsAndChecklistLinks
          - InboxPage_Render_WaitingForOthers_NotCountedInSummary
          - InboxPage_Render_SignatureLost_ShowsSectionChipAndReason

      - id: ReviewCenter-InboxPage-Sections-QuestionLink
        title: >-
          The InboxPage unit shall link the question for you in the group to answer to the review and not to the
          checklist.
        justification: |
          A question is read in its thread on the review page.
        tests:
          - InboxPage_Render_QuestionForYou_ShowsRowLinkingToReview

      - id: ReviewCenter-InboxPage-Sections-Chip
        title: >-
          The InboxPage unit shall show a chip with the reason on each item.
        justification: |
          The chip tells at a glance why the item is listed.
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - InboxPage_Render_NewSections_ShowTitlesChipsAndChecklistLinks
          - InboxPage_Render_SignatureLost_ShowsSectionChipAndReason
          - InboxPage_Render_SummaryLine_ShowsActionAndUpdateCounts

      - id: ReviewCenter-InboxPage-Sections-DetailLine
        title: >-
          The InboxPage unit shall show a detail line on an item that has one.
        justification: |
          The detail line names who or what the item waits for, so that the reader need not open it to find out.
        tests:
          - InboxPage_Render_WaitingForOthers_NotCountedInSummary
          - InboxPage_Render_QuestionForYou_ShowsRowLinkingToReview
          - InboxPage_Render_SignatureLost_ShowsSectionChipAndReason
          - InboxPage_Render_SummaryLine_ShowsActionAndUpdateCounts

      - id: ReviewCenter-InboxPage-Sections-DueMark
        title: >-
          The InboxPage unit shall mark the due date of an action item with the word Due.
        justification: |
          The reader sees when the work is expected.
        tests:
          - InboxPage_Render_OverdueReview_ShowsOverdueChip

      - id: ReviewCenter-InboxPage-Sections-OverdueMark
        title: >-
          The InboxPage unit shall mark the due date of an action item with the word Overdue when the date has passed.
        justification: |
          Late work must stand out from work that is only due.
        tests:
          - InboxPage_Render_OverdueReview_ShowsOverdueChip

      - id: ReviewCenter-InboxPage-Sections-NewBadge
        title: >-
          The InboxPage unit shall show a New badge on an item that the user has not seen.
        justification: |
          The badge tells what changed since the last visit.
        tests:
          - InboxPage_Render_UnreadItem_ShowsDot

      - id: ReviewCenter-InboxPage-Sections-EmptyMessage
        title: >-
          The InboxPage unit shall show a short message when nothing needs action.
        justification: |
          An empty inbox must read as good news and not as an error.
        tests:
          - InboxPage_Render_NothingWaiting_ShowsEmptyState
          - InboxPage_Render_Auditor_ShowsNoSignItems

      - id: ReviewCenter-InboxPage-Summary
        title: >-
          The InboxPage unit shall show a summary line with the number of reviews that need action and the number of
          updates.
        justification: |
          The totals tell the reader at once how much work is waiting before any group is read.
        tests:
          - InboxPage_Render_SummaryLine_ShowsActionAndUpdateCounts
          - InboxPage_Render_NothingWaiting_ShowsEmptyState

      - id: ReviewCenter-InboxPage-Summary-WaitingCount
        title: >-
          The InboxPage unit shall add the number of reviews that wait for others to the summary line only when some
          review waits for others.
        justification: |
          The count tells the reader that something is under way without crowding the line when nothing is.
        tests:
          - InboxPage_Render_WaitingForOthers_NotCountedInSummary
          - InboxPage_Render_SummaryLine_ShowsActionAndUpdateCounts
          - InboxPage_Render_NothingWaiting_ShowsEmptyState

      - id: ReviewCenter-InboxPage-Summary-WaitingNotAction
        title: >-
          The InboxPage unit shall not count a review that waits for others as a review that needs action.
        justification: |
          A review that only waits for other people must not look like work.
        tests:
          - InboxPage_Render_WaitingForOthers_NotCountedInSummary
          - InboxPage_Render_QuestionForYou_ShowsRowLinkingToReview

      - id: ReviewCenter-InboxPage-MarkAllRead
        title: >-
          The InboxPage unit shall offer a button that marks every listed review as seen.
        justification: |
          A user who has caught up wants to start from a clean list without opening each review.
        tests:
          - InboxPage_MarkAllRead_ClearsUnreadDots

      - id: ReviewCenter-InboxPage-MarkAllRead-BadgesCleared
        title: >-
          The InboxPage unit shall show the items without the New badge once the button has marked them as seen.
        justification: |
          The list must show at once that the user has caught up.
        tests:
          - InboxPage_MarkAllRead_ClearsUnreadDots

      - id: ReviewCenter-InboxPage-Interactive
        title: >-
          The InboxPage unit shall set the interactive marker on its page once the page has rendered.
        justification: |
          The marker tells that the page has become interactive, so that a driver waits for it before it acts. Serving
          the page only to a signed-in user belongs to the Web subsystem.
        tests:
          - InboxPage_AfterRender_Interactive_SetsMarkerAndOffersMarkAllRead
          - InboxPage_AfterRender_NothingWaiting_SetsInteractiveMarker

      - id: ReviewCenter-InboxPage-Interactive-MarkAllRead
        title: >-
          The InboxPage unit shall offer the Mark all as read button only while the inbox lists at least one review.
        justification: |
          A user with nothing listed has nothing to mark, and a button without effect would confuse.
        tests:
          - InboxPage_Render_ItemsListed_OffersMarkAllReadButton
          - InboxPage_Render_NothingWaiting_ShowsEmptyState
          - InboxPage_AfterRender_Interactive_SetsMarkerAndOffersMarkAllRead

      - id: ReviewCenter-InboxPage-Interactive-Challenge
        title: >-
          The InboxPage unit shall, when it is reached through the router by a visitor who is not signed in, show a link
          to the login page that returns to the inbox and none of the inbox.
        justification: |
          The page keeps the rule of every other page of the application: no page that holds personal data is open
          without a sign-in. That the server challenges the request is verified for the Web subsystem.
        tests:
          - InboxPage_Render_AnonymousThroughRouter_ShowsLoginLinkAndNoInbox
