---
# Software Unit Requirements for the InboxPage Unit
#
# The InboxPage unit is the page at /inbox that lists the reviews that wait for the signed-in user in four groups,
# with a summary line, a chip and an unread badge on each item, and a button that marks everything as read. It is an
# interactive page that needs a sign-in.

sections:
  - title: InboxPage Unit Requirements
    requirements:
      - id: ReviewCenter-InboxPage-Access
        title: >-
          The InboxPage unit shall be shown only to a signed-in user and shall show nobody who is not signed in the
          items of the inbox.
        justification: |
          The inbox says what waits for a person, so it is personal and needs the identity of the person.
        tests:
          - InboxPage_Render_Anonymous_IsNotShown

      - id: ReviewCenter-InboxPage-Sections
        title: >-
          The InboxPage unit shall show the groups to sign, replies waiting, failed checks and updates, each with its
          items, and for each item the project and the review with a link to the review, a chip, a detail line, the
          Overdue or Due mark of an action item, and a New badge when it is unread, and shall show a short message
          when nothing waits.
        justification: |
          The reader must see what to do and where, in one place, and must find an empty inbox as good news and not as
          an error.
        tests:
          - InboxPage_Render_NothingWaiting_ShowsEmptyState
          - InboxPage_Render_ToSignAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - InboxPage_Render_UnreadItem_ShowsDot
          - InboxPage_Render_OverdueReview_ShowsOverdueChip
          - InboxPage_Render_Auditor_ShowsNoSignItems

      - id: ReviewCenter-InboxPage-Summary
        title: >-
          The InboxPage unit shall show a summary line with the number of reviews that need action and the number of
          updates.
        justification: |
          The totals tell the reader at once how much work is waiting before any group is read.
        tests:
          - InboxPage_Render_SummaryLine_ShowsActionAndUpdateCounts

      - id: ReviewCenter-InboxPage-MarkAllRead
        title: >-
          The InboxPage unit shall offer a button that marks every listed review as seen and then shows the items
          without the New badge.
        justification: |
          A user who has caught up wants to start from a clean list without opening each review.
        tests:
          - InboxPage_MarkAllRead_ClearsUnreadDots

      - id: ReviewCenter-InboxPage-Interactive
        title: >-
          The InboxPage unit shall be served as an interactive page of a signed-in session, so that a button on it
          works, and a request without a sign-in shall be challenged and not served.
        justification: |
          The page keeps the rules of every other page of the application: no page that holds personal data is open
          without a sign-in, and a button needs the live session.
        tests:
          - WebSubsystem_InboxPage_Unauthenticated_IsChallenged
