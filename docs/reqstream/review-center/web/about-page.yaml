---
# Software Unit Requirements for the AboutPage Unit
#
# The AboutPage unit is the AboutPage.razor page at /about, open to everyone, that says what ReviewCenter does and which
# version of it is running.

sections:
  - title: AboutPage Unit Requirements
    requirements:
      - id: ReviewCenter-AboutPage-Version
        title: >-
          The AboutPage unit shall show the full version of the program, the same text that the command line prints.
        justification: |
          Users and auditors must be able to tell exactly which build they are using, for example when reporting a
          problem or recording the version used for a review. The footer shows a shortened version; this page gives the
          full one.
        tests:
          - AboutPage_Render_Anonymous_ShowsVersionCopyrightAndProjectLink

      - id: ReviewCenter-AboutPage-Version-Copyright
        title: >-
          The AboutPage unit shall show the copyright holder of the program.
        justification: |
          The page is where a user finds out whose program this is, next to the version that is running.
        tests:
          - AboutPage_Render_Anonymous_ShowsVersionCopyrightAndProjectLink

      - id: ReviewCenter-AboutPage-Version-ProjectLink
        title: >-
          The AboutPage unit shall show a link to the project page on GitHub.
        justification: |
          A user who wants to report a problem or read about the program needs to find the project from the page that
          names the version.
        tests:
          - AboutPage_Render_Anonymous_ShowsVersionCopyrightAndProjectLink

      - id: ReviewCenter-AboutPage-Version-AnonymousAccess
        title: >-
          The AboutPage unit shall serve the page at /about to a visitor who is not signed in.
        justification: |
          The version must be readable before signing in, for example by somebody who has to say which build of the
          product they are about to use.
        tests:
          - AboutPage_Render_AnonymousThroughRouter_ShowsPageAndNoSignInPrompt

      - id: ReviewCenter-AboutPage-Description
        title: >-
          The AboutPage unit shall describe in plain words what ReviewCenter does, naming the threaded comments, the
          checklist, and the audit trail.
        justification: |
          A visitor who has just arrived at the product needs a short answer to what it is for, in terms of the
          features that matter for a formal review, without having to read the help first.
        tests:
          - AboutPage_Render_Default_DescribesWhatReviewCenterDoes
