---
# Software Unit Requirements for the UsersPage Unit
#
# The UsersPage unit is the Users.razor page at /users where a system administrator manages the users. The unit
# includes the NewUserPage.razor page at /users/new, which holds the form that creates a user. Whether a user is a
# system administrator is a flag of the user, set here; what a user may do in a project is set on the project page.

sections:
  - title: UsersPage Unit Requirements
    requirements:
      - id: ReviewCenter-UsersPage-List
        title: >-
          The UsersPage unit shall serve at /users, to a system administrator only, the list of users with their user
          name, display name, a System admin badge where the user is one, and enabled state, and the controls to
          change them, with no role to choose.
        justification: |
          System administrators need an overview of who has access. Other users must not see or change the accounts
          of others.
        tests:
          - UsersPage_Render_ExistingUsers_ListsThemWithControls

      - id: ReviewCenter-UsersPage-NewPage
        title: >-
          The UsersPage unit shall offer a button that leads to a separate page that holds only the form that creates
          a user, and that page shall offer a way back to the list without creating anything and return to the list
          after a user was created.
        justification: |
          A creation form among the rows of a list pushes the users down and keeps a typed password on a page that
          is meant for reading. A page of its own keeps the list tidy and makes cancelling obvious.
        tests:
          - UsersPage_Render_ExistingUsers_ListsThemWithControls
          - NewUserPage_CreateForm_ValidInput_CreatesUserAndClearsForm

      - id: ReviewCenter-UsersPage-Create
        title: >-
          The UsersPage unit shall create a user from a form with a user name, a display name, a System
          administrator checkbox, and a password, clearing the password afterwards, and shall show a violated rule as
          a message, creating nothing.
        justification: |
          After the first system administrator exists, users are added in the web interface rather than on the
          command line. The password is cleared so that it does not stay on the page.
        tests:
          - NewUserPage_CreateForm_ValidInput_CreatesUserAndClearsForm
          - NewUserPage_CreateForm_TooShortPassword_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-UsersPage-Update
        title: >-
          The UsersPage unit shall let a system administrator disable and enable a user and set a new password for a
          user, clearing the password field afterwards, and shall tell that the password has to be changed at the next
          sign-in.
        justification: |
          Disabling takes access away without losing the record of what the user did, and a new password lets a
          system administrator help a user who forgot the password. The password is a temporary one, and the page
          says so, so that nobody expects it to stay.
        tests:
          - UsersPage_ToggleEnabled_User_DisablesAndEnablesAgain
          - UsersPage_SetPassword_ValidPassword_ChangesPasswordAndClearsField
          - UsersPage_SetPassword_FirstClick_ExplainsThenSecondClickMakesItTemporary

      - id: ReviewCenter-UsersPage-Status
        title: >-
          The UsersPage unit shall show for each user a badge with the end of the lockout, in UTC, while the user is
          locked, a badge for a temporary password, and the time of the last sign-in in UTC or the word Never, and
          shall offer a button that ends the lockout only for a locked user, which acts at once and shows the outcome.
        justification: |
          An administrator who reviews access must see which accounts are locked, waiting for a first password
          change, or not used, and must be able to help a person who is locked out without waiting.
        tests:
          - UsersPage_Render_StatusBadges_ShowLockedTemporaryAndLastSignIn
          - UsersPage_Render_ExpiredLockout_IsNotShownAsLocked
          - UsersPage_Unlock_LockedUser_ClearsLockoutInOneClick

      - id: ReviewCenter-UsersPage-SearchFilter
        title: >-
          The UsersPage unit shall narrow the list to the users whose user name or display name contains the typed
          text in any letter case, and to the users that are enabled, disabled, locked, or system administrators,
          both together, without a new request to the store.
        justification: |
          A list of many users is hard to review as a whole, and a short list of the locked or disabled accounts is
          what an access review looks at first.
        tests:
          - UsersPage_Search_TypedText_MatchesUserNameOrDisplayNameIgnoringCase
          - UsersPage_Filter_EachStatus_ListsOnlyMatchingUsers
          - UsersPage_SearchAndFilter_Combined_BothApply

      - id: ReviewCenter-UsersPage-DisableImpact
        title: >-
          The UsersPage unit shall, when a system administrator disables a user, first show a confirmation that lists
          the open reviews of the user as links to the reviews and the projects where the user is the only
          administrator as links to the projects, or says that nothing is waiting, shall disable the user only after
          the second click on the button that confirms, shall change nothing when the confirmation is cancelled, and
          shall show an error and open no confirmation when the impact cannot be loaded.
        justification: |
          Disabling a person who holds open review slots or administers a project alone leaves work stuck. The list
          warns without blocking, because a person who has left must be disabled whatever is open, and the second
          click keeps a mistaken click from taking access away.
        tests:
          - UsersPage_Disable_UserWithImpact_ShowsLinksAndChangesNothingUntilConfirmed
          - UsersPage_Disable_UserWithoutImpact_SaysNothingIsWaitingAndStillNeedsTheClick
          - UsersPage_Disable_Cancel_ClosesThePanelAndChangesNothing
          - UsersPage_Disable_ImpactLoadRefused_ShowsErrorAndOpensNoPanel
          - UsersPage_Enable_DisabledUser_NeedsNoConfirmation

      - id: ReviewCenter-UsersPage-Confirmations
        title: >-
          The UsersPage unit shall, before it resets the second factor of a user, explain that the user has to set it
          up again, and, before it sets a password, explain that the user has to change it at the next sign-in and
          can only use the Account, Help, and About pages, cannot sign reviews, and cannot use the API tokens until
          then (for the own password of the administrator, which is not temporary, say that instead), and shall
          act only after the second click that confirms and not at all when the confirmation is cancelled.
        justification: |
          Both actions change how a person gets in, and the person who performs them should know what follows
          before it happens. The explanation is shown on the page, in the place of the action, without a dialog of
          the browser.
        tests:
          - UsersPage_ResetTotp_FirstClickAndCancel_ExplainsAndRemovesNothing
          - UsersPage_SetPassword_FirstClick_ExplainsThenSecondClickMakesItTemporary
          - UsersPage_SetPassword_OwnRow_SaysThePasswordIsNotTemporary
          - UsersPage_SetPassword_CancelOrEmptyField_ChangesNothing

      - id: ReviewCenter-UsersPage-SystemAdmin
        title: >-
          The UsersPage unit shall let a system administrator make a user a system administrator and take that away
          again with one button per user, and show the outcome.
        justification: |
          Being a system administrator is the one right that is not tied to a project, so it is a flag of the user
          that is changed on the page of the users, replacing the earlier choice of a role.
        tests:
          - UsersPage_ToggleSystemAdmin_User_GrantsAndTakesAwayTheFlag

      - id: ReviewCenter-UsersPage-LastAdmin
        title: >-
          The UsersPage unit shall show an error and change nothing when a system administrator tries to disable or
          demote the last enabled system administrator.
        justification: |
          Without an enabled system administrator nobody could manage users, so the refusal must be shown to the
          system administrator instead of failing silently.
        tests:
          - UsersPage_LastAdmin_DisableOrDemote_IsRefusedWithError

      - id: ReviewCenter-UsersPage-AdminCheck
        title: >-
          The UsersPage unit shall refuse every create or change action, showing an error and changing nothing,
          when the signed-in user is no longer an enabled system administrator in the user store, or nobody is
          signed in any more, and shall then stop rendering the user list, the typed passwords and the button
          that creates a user.
        justification: |
          An open page can keep the sign-in state it started with for up to one revalidation interval, so a user
          who was demoted or disabled after opening the page must not be able to go on managing users in that
          time. The check is made on every action, so it does not wait for the next revalidation. An error shown
          above the list would still leave the names and roles readable, so the list is dropped with it.
        tests:
          - UsersPage_Action_SignedInAdminLaterDemoted_IsRefusedWithError
          - UsersPage_Action_SessionEndedBeforePageKnows_ShowsClearErrorAndChangesNothing
          - UsersPage_Action_AdminDemotedAfterOpening_DropsUserListAndTypedPasswords
          - UsersPage_ToggleSystemAdmin_AdminDemotesSelf_ShowsStatusButDropsTheList

      - id: ReviewCenter-UsersPage-ExternalAccount
        title: >-
          The UsersPage unit shall mark an account of a provider with a badge that names the provider, and shall show
          no password control, and no temporary password control, for it.
        justification: |
          An administrator must see which accounts are managed by the provider, and must not be offered an action
          that cannot work for them, or that could give such an account a password.
        tests:
          - UsersPage_Render_ExternalUser_ShowsMarkerAndNoPasswordControls

      - id: ReviewCenter-UsersPage-TotpReset
        title: >-
          The UsersPage unit shall mark the accounts that have a second factor with a badge, offer a button to reset the
          second factor only for them, also while the feature is off, remove the second factor and show a status when
          the button is used, show no control for an account of a provider, and show an error and keep the second
          factor when the signed-in user is no longer a system administrator.
        justification: |
          A person who lost the phone and the recovery codes needs an administrator to let them in again, and the
          administrator must see who has a second factor. The rule that only a system administrator may reset it is
          the service's, and the page must show what the service decides.
        tests:
          - UsersPage_Render_EnrolledAndPlainUsers_BadgeAndResetOnlyForEnrolled
          - UsersPage_Render_ExternalUser_HasNoTotpControls
          - UsersPage_ResetTotp_EnrolledUser_RemovesEnrollmentAndShowsStatus
          - UsersPage_Render_FeatureDisabled_StillShowsBadgeAndReset
          - UsersPage_ResetTotp_SessionEndedBeforePageKnows_ShowsErrorAndKeepsEnrollment
