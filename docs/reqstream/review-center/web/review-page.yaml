---
# Software Unit Requirements for the ReviewPage Unit
#
# The ReviewPage unit is the page at /projects/{project}/reviews/{review} that shows one review with a summary strip,
# its fingerprint and files, and displays the content of a selected file.

sections:
  - title: ReviewPage Unit Requirements
    requirements:
      - id: ReviewCenter-ReviewPage-Show
        title: >-
          The ReviewPage unit shall show the identifier of the review in the Details section.
        justification: |
          The identifier names the review, so the reader can tell which review the page is about.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsIdTitleAndFingerprint
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-Show-Title
        title: >-
          The ReviewPage unit shall show the title of the review.
        justification: |
          The title tells the reader at a glance what the review is about.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsIdTitleAndFingerprint

      - id: ReviewCenter-ReviewPage-Show-Fingerprint
        title: >-
          The ReviewPage unit shall show the content fingerprint of the review in the Details section.
        justification: |
          The fingerprint identifies the exact content under review, so it must be available.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsIdTitleAndFingerprint
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-Show-NoState
        title: >-
          The ReviewPage unit shall not repeat the approval status of the review in the Details section.
        justification: |
          The status is shown once, where the reader looks for it, so the Details section does not say it again.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsIdTitleAndFingerprint
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-Show-ProjectLink
        title: >-
          The ReviewPage unit shall show a link back to the owning project, labeled with the project name.
        justification: |
          The reviewer must see which project the review belongs to and be able to go back to it.
        tests:
          - ReviewPage_Render_ExistingReview_ProjectLinkPointsToTheProject
          - ReviewPage_Render_FileSelected_ShowsProjectNameAndHighlightsRow

      - id: ReviewCenter-ReviewPage-Show-NotFound
        title: >-
          The ReviewPage unit shall show a not-found message when the review does not exist.
        justification: |
          A mistyped link must lead to a clear answer.
        tests:
          - ReviewPage_Render_UnknownReview_ShowsNotFound

      - id: ReviewCenter-ReviewPage-Show-OtherReview
        title: >-
          The ReviewPage unit shall show the new review, with no selected file and no typed thread text, when the page
          is reused for another review.
        justification: |
          A page that is reused for another review must not carry the selection or a half-written comment of the
          previous review over.
        tests:
          - ReviewPage_ParametersChange_OtherReview_ShowsNewReviewAndClearsSelection

      - id: ReviewCenter-ReviewPage-Access
        title: >-
          The ReviewPage unit shall show a user who may not see the project the page for a review that does not
          exist.
        justification: |
          A hidden project looks like a missing one, so the page does not reveal that the review exists.
        tests:
          - ReviewPage_Render_NonMember_LooksLikeAMissingReview

      - id: ReviewCenter-ReviewPage-Access-NoData
        title: >-
          The ReviewPage unit shall show a user who may not see the project none of the data of the project.
        justification: |
          The page must not reveal files, comments or checklist answers of a project to a user who may not see it.
        tests:
          - ReviewPage_Render_NonMember_LooksLikeAMissingReview

      - id: ReviewCenter-ReviewPage-Access-SelectFile
        title: >-
          The ReviewPage unit shall check the view access again when a file is selected, and show a user whose
          membership was removed meanwhile the page of a missing review and none of the loaded data.
        justification: |
          A page that stays open does not load again, so without a new check a removed member would keep reading
          files through the open page.
        tests:
          - ReviewPage_SelectFile_MembershipRevoked_ShowsNotFoundAndNoData

      - id: ReviewCenter-ReviewPage-Access-SelectThread
        title: >-
          The ReviewPage unit shall check the view access again when a thread is selected, and show a user whose
          membership was removed meanwhile the page of a missing review and none of the loaded data.
        justification: |
          A page that stays open does not load again, so without a new check a removed member would keep reading
          comments through the open page.
        tests:
          - ReviewPage_SelectThread_MembershipRevoked_ShowsNotFoundAndNoData

      - id: ReviewCenter-ReviewPage-Access-FilterIndex
        title: >-
          The ReviewPage unit shall check the view access again when the thread index is filtered, and show a user
          whose membership was removed meanwhile the page of a missing review and none of the loaded data.
        justification: |
          A page that stays open does not load again, so without a new check a removed member would keep reading the
          thread index through the open page.
        tests:
          - ReviewPage_FilterIndex_MembershipRevoked_ShowsNotFoundAndNoData

      - id: ReviewCenter-ReviewPage-Access-Reply
        title: >-
          The ReviewPage unit shall check the view access again when a reply is submitted, and show a user whose
          membership was removed meanwhile the page of a missing review and none of the loaded data.
        justification: |
          A page that stays open does not load again, so a removed member must not keep using it for the discussion.
        tests:
          - ReviewPage_Reply_MembershipRevoked_ShowsNotFoundAndStoresNothing

      - id: ReviewCenter-ReviewPage-Access-ReplyNothingStored
        title: >-
          The ReviewPage unit shall store no reply that is submitted by a user whose membership was removed meanwhile.
        justification: |
          A removed member must not keep writing to the review through a page that was open before the removal.
        tests:
          - ReviewPage_Reply_MembershipRevoked_ShowsNotFoundAndStoresNothing

      - id: ReviewCenter-ReviewPage-Access-RevealRun
        title: >-
          The ReviewPage unit shall check the view access again when a collapsed run of the diff is expanded, reveal
          no line to a user whose membership was removed meanwhile, and show that user the page of a missing review.
        justification: |
          A page that stays open does not load again, so without a new check a removed member could keep reading file
          content through the open diff.
        tests:
          - ReviewPage_DiffView_RevealRun_MembershipRevoked_RevealsNothingAndShowsNotFound

      - id: ReviewCenter-ReviewPage-Access-NewThread
        title: >-
          The ReviewPage unit shall store no new thread that is submitted by a user whose membership was removed
          meanwhile, and show that user the page of a missing review.
        justification: |
          Starting a thread is the main write action of the page, and a removed member must not keep writing to the
          review through a page that was open before the removal.
        tests:
          - ReviewPage_StartThread_MembershipRevoked_ShowsNotFoundAndStoresNothing

      - id: ReviewCenter-ReviewPage-ReadOnly
        title: >-
          The ReviewPage unit shall show a member whose role is auditor the whole review.
        justification: |
          An auditor reads everything and changes nothing, so the page shows the review as it shows it to any member.
        tests:
          - ReviewPage_Render_Auditor_ShowsReadOnlyNoticeAndNoWriteControls

      - id: ReviewCenter-ReviewPage-ReadOnly-Notice
        title: >-
          The ReviewPage unit shall show a member whose role is auditor a notice that the access is read-only.
        justification: |
          The notice says why the controls that change the review are missing.
        tests:
          - ReviewPage_Render_Auditor_ShowsReadOnlyNoticeAndNoWriteControls

      - id: ReviewCenter-ReviewPage-ReadOnly-SlotForms
        title: >-
          The ReviewPage unit shall offer a member whose role is auditor no reviewer slot form to add, save or remove
          a slot.
        justification: |
          The rules refuse an auditor any change of the reviewer slots, so the page must not offer the forms.
        tests:
          - ReviewPage_Render_Auditor_ShowsReadOnlyNoticeAndNoWriteControls

      - id: ReviewCenter-ReviewPage-ReadOnly-ThreadForms
        title: >-
          The ReviewPage unit shall offer a member whose role is auditor no new comment form, no reply box and no
          resolve toggle.
        justification: |
          The rules refuse an auditor any change of the discussion, so the page must not offer the controls.
        tests:
          - ReviewPage_Render_AuditorWithFileSelected_ShowsThreadsWithoutWriteControls

      - id: ReviewCenter-ReviewPage-ReadOnly-SigningForm
        title: >-
          The ReviewPage unit shall offer a member whose role is auditor no signing form, also when the auditor holds
          a reviewer slot.
        justification: |
          A role that cannot change the review cannot sign it, even when the slot of the auditor is still seated.
        tests:
          - ReviewPage_Render_SlotOccupantWhoIsAuditor_ShowsNoSignForm

      - id: ReviewCenter-ReviewPage-ReadOnly-LineControls
        title: >-
          The ReviewPage unit shall disable the line comment controls of the Diff view for a member whose role is
          auditor.
        justification: |
          A control that the rules would refuse must not invite a click.
        tests:
          - ReviewPage_DiffView_Auditor_HasReadOnlyHintAndNoComposerEvenWithAStaleSelection

      - id: ReviewCenter-ReviewPage-ReadOnly-HeadLineControls
        title: >-
          The ReviewPage unit shall disable the line comment buttons of the Head version for a member whose role is
          auditor.
        justification: |
          A control that the rules would refuse must not invite a click, in the numbered view as in the diff.
        tests:
          - ReviewPage_FileSelect_AuditorHeadView_DisablesEveryLineCommentButton

      - id: ReviewCenter-ReviewPage-ReadOnly-Hint
        title: >-
          The ReviewPage unit shall say in the hint of the Diff view that the access is read-only, instead of saying
          that the review is locked, for a member whose role is auditor.
        justification: |
          A reader of an open review must not be told that the review is locked.
        tests:
          - ReviewPage_DiffView_ReadOnlyAccess_HintSaysReadOnlyNotLocked

      - id: ReviewCenter-ReviewPage-ReadOnly-NoComposer
        title: >-
          The ReviewPage unit shall show a member whose role is auditor no comment composer in the Diff view, even
          for a stale line selection.
        justification: |
          A selection that is left over must not bring back a form that the rules would refuse.
        tests:
          - ReviewPage_DiffView_Auditor_HasReadOnlyHintAndNoComposerEvenWithAStaleSelection

      - id: ReviewCenter-ReviewPage-ReadOnly-RoleChange
        title: >-
          The ReviewPage unit shall drop the comment composer of the Diff view of an open page when the role of the
          user changes to auditor.
        justification: |
          A page that stays open must not keep a form that the new role of the user may not use.
        tests:
          - ReviewPage_DiffView_MemberBecomesAuditor_ReloadDropsTheComposerAndTheDraft

      - id: ReviewCenter-ReviewPage-ReadOnly-RoleChangeDraft
        title: >-
          The ReviewPage unit shall discard the typed comment draft of an open page when the role of the user changes
          to auditor.
        justification: |
          A draft that was typed under the old role must not come back when the form opens again.
        tests:
          - ReviewPage_DiffView_MemberBecomesAuditor_ReloadDropsTheComposerAndTheDraft

      - id: ReviewCenter-ReviewPage-Layout
        title: >-
          The ReviewPage unit shall place the next-step line, the files and the thread index ahead of the Details
          section.
        justification: |
          Reviewers come to read code and discussion, so what they need first must not be pushed down by identifiers.
        tests:
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-Layout-Collapsed
        title: >-
          The ReviewPage unit shall keep the Details section collapsed by default.
        justification: |
          Identifiers and hashes are needed rarely, yet they must stay one click away.
        tests:
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-Layout-Content
        title: >-
          The ReviewPage unit shall place the content of the selected file ahead of the Details section.
        justification: |
          The code is what the reviewer came to read, so it must not compete with identifiers and hashes.
        tests:
          - ReviewPage_Render_FileSelected_ShowsContentBeforeDetails

      - id: ReviewCenter-ReviewPage-NextStep
        title: >-
          The ReviewPage unit shall show one short sentence at the top of the page that tells the reader what to do
          next.
        justification: |
          The reader should see what is expected of them without working it out from counts.
        tests:
          - ReviewPage_Render_NextStep_FollowsThreadState

      - id: ReviewCenter-ReviewPage-NextStep-Threads
        title: >-
          The ReviewPage unit shall name in the next-step sentence the open threads that remain to be resolved.
        justification: |
          An open thread blocks the approval, so the reader is told how many are left.
        tests:
          - ReviewPage_Render_NextStep_FollowsThreadState

      - id: ReviewCenter-ReviewPage-NextStep-Checklist
        title: >-
          The ReviewPage unit shall name in the next-step sentence the number of unanswered checks of the checklist.
        justification: |
          An unanswered check blocks the approval, so the reader is told how many are left.
        tests:
          - ReviewPage_Render_NextStep_FollowsThreadState
          - ReviewPage_Render_NextStep_IncludesChecklistProgress

      - id: ReviewCenter-ReviewPage-NextStep-Ready
        title: >-
          The ReviewPage unit shall say "Ready for signatures." in the next-step sentence when the threads and the
          checklist are done and the review has a reviewer slot.
        justification: |
          The reader must see that nothing but the signatures is left.
        tests:
          - ReviewPage_Render_NextStep_IncludesChecklistProgress

      - id: ReviewCenter-ReviewPage-NextStep-Approved
        title: >-
          The ReviewPage unit shall say "Approved. Every reviewer slot has a current signature." in the next-step
          sentence once the review is approved.
        justification: |
          The wording comes from the signing rules, so the page and the approval can never disagree.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-NextStep-Current
        title: >-
          The ReviewPage unit shall keep the next-step sentence current after every change of the review.
        justification: |
          A stale sentence would mislead the reader about what is left to do.
        tests:
          - ReviewPage_Render_NextStep_FollowsThreadState
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-NextStep-HiddenNotice
        title: >-
          The ReviewPage unit shall not repeat in the next-step sentence of a viewer who may not see the answers of the
          others the notice that the answers stay hidden.
        justification: |
          The notice is shown once, in the status panel, so the next step stays short.
        tests:
          - ReviewStatusPanel_MaskedViewer_HideNoticeAppearsOnce

      - id: ReviewCenter-ReviewPage-Checklist
        title: >-
          The ReviewPage unit shall show the progress of the review's checklist as a summary, for example "37 of 58
          checks answered".
        justification: |
          The checklist is part of the work of the review, so its progress belongs where the reviewer starts.
        tests:
          - ReviewPage_Render_NewReview_ShowsChecklistProgressAndLink

      - id: ReviewCenter-ReviewPage-Checklist-Link
        title: >-
          The ReviewPage unit shall show a link to the checklist page next to the progress of the checklist.
        justification: |
          The checklist itself is one click away from its progress.
        tests:
          - ReviewPage_Render_NewReview_ShowsChecklistProgressAndLink
          - ReviewPage_Render_ExistingReview_ShowsSummaryStripWithChecklistReviewersAndThreads

      - id: ReviewCenter-ReviewPage-Checklist-Failed
        title: >-
          The ReviewPage unit shall say "Checklist complete, 1 check failed" for a viewer who may see the answers of
          the others when a check was failed.
        justification: |
          A failed check decides the outcome of the review, so a viewer who may read the ballots is told at once.
        tests:
          - ReviewStatusPanel_BothFailed_NamesTheOutcome

      - id: ReviewCenter-ReviewPage-Checklist-MaskedFailed
        title: >-
          The ReviewPage unit shall not show the number of failed checks to a viewer who may not see the answers of
          the others.
        justification: |
          The failed count is a content of the ballots, so it is shown only where the ballots may be read.
        tests:
          - ReviewStatusPanel_MaskedViewer_NoAnswersNoOutcomeNoCaution

      - id: ReviewCenter-ReviewPage-Checklist-None
        title: >-
          The ReviewPage unit shall show neither the checklist progress nor the link to the checklist page when the
          review has no checklist.
        justification: |
          Progress of a checklist that does not exist would mislead the reader.
        tests:
          - ReviewPage_Render_ReviewWithoutChecklist_HidesChecklistCard

      - id: ReviewCenter-ReviewPage-Summary
        title: >-
          The ReviewPage unit shall show the checklist progress with a link to the checklist in one compact strip at
          the top of the page.
        justification: |
          A reviewer decides what to do from the state of the whole review, so the checklist progress is shown with
          the other counts in one place and one click from the checklist.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsSummaryStripWithChecklistReviewersAndThreads

      - id: ReviewCenter-ReviewPage-Summary-Reviewers
        title: >-
          The ReviewPage unit shall show "No reviewer slots yet" in the summary strip when the review has no reviewer
          slot.
        justification: |
          The reader must see at once that nobody is yet expected to sign.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsSummaryStripWithChecklistReviewersAndThreads

      - id: ReviewCenter-ReviewPage-Summary-SignedCount
        title: >-
          The ReviewPage unit shall show in the summary strip how many of the reviewer slots are signed, for example
          "1 of 1 signed".
        justification: |
          The reader must see who still has to sign without scrolling to the slots.
        tests:
          - ReviewPage_Render_SignedSlot_SummaryShowsSignedCount

      - id: ReviewCenter-ReviewPage-Summary-OpenThreads
        title: >-
          The ReviewPage unit shall show the number of open threads in the summary strip.
        justification: |
          The reader must see how much discussion is open without scrolling to the thread index.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsSummaryStripWithChecklistReviewersAndThreads
          - ReviewPage_SummaryStrip_ShowsQuestionAndFindingCounts

      - id: ReviewCenter-ReviewPage-Summary-ResolvedThreads
        title: >-
          The ReviewPage unit shall show the number of resolved threads in the summary strip.
        justification: |
          The reader must see how much discussion is settled without scrolling to the thread index.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsSummaryStripWithChecklistReviewersAndThreads
          - ReviewPage_SummaryStrip_ShowsQuestionAndFindingCounts

      - id: ReviewCenter-ReviewPage-Summary-Position
        title: >-
          The ReviewPage unit shall place the summary strip below the next-step line and above the files.
        justification: |
          The strip supports the next step, and the files follow once the reader knows where the review stands.
        tests:
          - ReviewPage_Render_ExistingReview_SummaryStripSitsBetweenNextStepAndFiles

      - id: ReviewCenter-ReviewPage-Files
        title: >-
          The ReviewPage unit shall list the files of the review with the path and size of each.
        justification: |
          Reviewers need to see what the review contains.
        tests:
          - ReviewPage_Render_ExistingReview_ListsFilesWithPathSizeAndHash
          - ReviewPage_Render_DeletedFile_ListsBaselineSize

      - id: ReviewCenter-ReviewPage-Files-Hash
        title: >-
          The ReviewPage unit shall show the SHA-256 hash of each file in the Details section.
        justification: |
          The per-file hashes let reviewers verify a file independently of the product.
        tests:
          - ReviewPage_Render_ExistingReview_ListsFilesWithPathSizeAndHash
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-Files-ButtonName
        title: >-
          The ReviewPage unit shall give the View button of each file an accessible name that identifies the file.
        justification: |
          A reader who uses a screen reader must be able to tell the buttons of the files apart.
        tests:
          - ReviewPage_Render_ExistingReview_FileButtonsNameTheirFile

      - id: ReviewCenter-ReviewPage-Files-Highlight
        title: >-
          The ReviewPage unit shall highlight the row of the selected file in the file list.
        justification: |
          The reader must see which file the content on the page belongs to.
        tests:
          - ReviewPage_Render_FileSelected_ShowsProjectNameAndHighlightsRow

      - id: ReviewCenter-ReviewPage-Content
        title: >-
          The ReviewPage unit shall show the selected file as numbered lines.
        justification: |
          Reviewers must see the true content of a file, and line numbers are what a comment points at.
        tests:
          - ReviewPage_FileSelect_TextFile_ShowsNumberedLinesWithExactText

      - id: ReviewCenter-ReviewPage-Content-NoSelection
        title: >-
          The ReviewPage unit shall show no file content until a file is selected.
        justification: |
          The page starts with the overview of the review, not with an arbitrary file.
        tests:
          - ReviewPage_Render_NoFileSelected_ShowsNoContent

      - id: ReviewCenter-ReviewPage-Content-ExactText
        title: >-
          The ReviewPage unit shall show the text of each line exactly as stored, without the line ending.
        justification: |
          Reviewers must see the true content of a file, and a line ending is not part of the line.
        tests:
          - ReviewPage_FileSelect_TextFile_ShowsNumberedLinesWithExactText
          - ReviewPage_FileSelect_TrailingLoneCarriageReturn_IsKept

      - id: ReviewCenter-ReviewPage-Content-PlainText
        title: >-
          The ReviewPage unit shall show the text of a line as plain text, never as markup.
        justification: |
          Plain text shows every character of the file and cannot execute anything in the file.
        tests:
          - ReviewPage_FileSelect_TextFile_ShowsNumberedLinesWithExactText

      - id: ReviewCenter-ReviewPage-Content-EmptyFile
        title: >-
          The ReviewPage unit shall show an empty file with no lines.
        justification: |
          A file without content has no line to number or to comment on.
        tests:
          - ReviewPage_FileSelect_EmptyFile_ShowsNoLines

      - id: ReviewCenter-ReviewPage-Content-OtherFile
        title: >-
          The ReviewPage unit shall show the lines of another file when that file is selected.
        justification: |
          The reader moves from file to file, and the content must always belong to the selected file.
        tests:
          - ReviewPage_FileSelect_SecondFile_ReplacesContent

      - id: ReviewCenter-ReviewPage-Binary
        title: >-
          The ReviewPage unit shall show a notice instead of content for a selected file that contains a NUL byte.
        justification: |
          Binary content cannot be shown meaningfully as text. The notice tells the reviewer why nothing is shown.
        tests:
          - ReviewPage_FileSelect_BinaryFile_ShowsBinaryNoticeAndNoContent

      - id: ReviewCenter-ReviewPage-Binary-InvalidUtf8
        title: >-
          The ReviewPage unit shall show a notice instead of content for a selected file that is not valid UTF-8.
        justification: |
          Bytes that are not valid text cannot be shown meaningfully. The notice tells the reviewer why nothing is
          shown.
        tests:
          - ReviewPage_FileSelect_InvalidUtf8_ShowsBinaryNotice

      - id: ReviewCenter-ReviewPage-Source
        title: >-
          The ReviewPage unit shall show the change kind of each file (Added, Modified or Deleted) in the file list
          of a review from a repository.
        justification: |
          Reviewers must see what kind of change each file of a repository review has.
        tests:
          - ReviewPage_Render_RepositoryReview_ShowsChangeKindPerFile

      - id: ReviewCenter-ReviewPage-Source-Details
        title: >-
          The ReviewPage unit shall show the repository name, the baseline and head commit identifiers and the
          selection in the Details section of a review from a repository.
        justification: |
          Reviewers must see which change a review covers, in which repository and between which commits.
        tests:
          - ReviewPage_Render_RepositoryReview_DetailsShowRepositoryShasAndSelection

      - id: ReviewCenter-ReviewPage-Source-UploadNoKind
        title: >-
          The ReviewPage unit shall show no change kind for the files of an uploaded review.
        justification: |
          An uploaded review has no baseline, so a change kind would state something that does not exist.
        tests:
          - ReviewPage_Render_RepositoryReview_ShowsChangeKindPerFile

      - id: ReviewCenter-ReviewPage-Source-UploadNoDetails
        title: >-
          The ReviewPage unit shall show no repository name, commit identifiers or selection in the Details section of
          an uploaded review.
        justification: |
          An uploaded review has no repository, so empty source rows would only mislead the reader.
        tests:
          - ReviewPage_Render_UploadedReview_DetailsShowNoSource

      - id: ReviewCenter-ReviewPage-Versions
        title: >-
          The ReviewPage unit shall open a file of a review that has a baseline commit on the Diff view, which is the
          default.
        justification: |
          A change is reviewed against what it replaces, so the differences are what the reader sees first, also for
          a file that is new.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline
          - ReviewPage_FileSelect_AddedFileOfReviewWithBaseline_OpensAsAllAddedDiffWithDiffAndHeadChoice

      - id: ReviewCenter-ReviewPage-Versions-Head
        title: >-
          The ReviewPage unit shall offer for a modified file the Head version, which is the numbered view with the
          comment controls.
        justification: |
          The full head text stays one click away, and it is where a comment on a whole line of the file is made.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-ReviewPage-Versions-Baseline
        title: >-
          The ReviewPage unit shall offer for a modified file the Baseline version, which is a read-only numbered view
          without comment controls.
        justification: |
          The full baseline text stays one click away, and it is read-only because it is not what is under review.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-ReviewPage-Versions-AddedFile
        title: >-
          The ReviewPage unit shall offer for an added file the choice between the Diff view and the Head version
          only, and no Baseline version.
        justification: |
          Nothing existed at the baseline, so the reader must not be offered a version that does not exist.
        tests:
          - ReviewPage_FileSelect_AddedFileOfReviewWithBaseline_OpensAsAllAddedDiffWithDiffAndHeadChoice
          - ReviewPage_FileSelect_AddedFile_HeadViewAndBack_ShowsNumberedLinesAndCommentControls

      - id: ReviewCenter-ReviewPage-Versions-DeletedFile
        title: >-
          The ReviewPage unit shall offer for a deleted file the Baseline version and no Head version, and open it on
          the Diff view.
        justification: |
          Nothing exists at the head, so the reader must not be offered a version that does not exist.
        tests:
          - ReviewPage_FileSelect_DeletedFile_ShowsRemovedLinesAndAcceptsWholeFileComment

      - id: ReviewCenter-ReviewPage-Versions-DeletedContent
        title: >-
          The ReviewPage unit shall show the Baseline version of a deleted file as numbered lines with a "Deleted file"
          note and without line comment controls.
        justification: |
          The reader must see what was deleted and be told that the lines cannot be commented on one by one.
        tests:
          - ReviewPage_FileSelect_DeletedFileBaselineView_ShowsNoteWithoutLineControls

      - id: ReviewCenter-ReviewPage-Versions-DeletedComment
        title: >-
          The ReviewPage unit shall accept for a deleted file a comment on the whole file only.
        justification: |
          A deleted file has no head lines, so a comment can only be about the file as a whole.
        tests:
          - ReviewPage_FileSelect_DeletedFileBaselineView_ShowsNoteWithoutLineControls
          - ReviewPage_FileSelect_DeletedFile_ShowsRemovedLinesAndAcceptsWholeFileComment

      - id: ReviewCenter-ReviewPage-Versions-NextFile
        title: >-
          The ReviewPage unit shall show the Diff view again when another file is selected after a Baseline version.
        justification: |
          The choice of a version belongs to one file, so the next file starts on its default view.
        tests:
          - ReviewPage_FileSelect_AfterBaselineView_ShowsHeadOfTheNextFile

      - id: ReviewCenter-ReviewPage-Versions-HeadOnly
        title: >-
          The ReviewPage unit shall show a file of an uploaded review, or of a review without a baseline commit, as
          the Head version only, with no choice.
        justification: |
          A file with nothing to compare against keeps the plain numbered view.
        tests:
          - ReviewPage_FileSelect_UploadAndNoBaselineReview_KeepHeadOnlyView

      - id: ReviewCenter-ReviewPage-Versions-Switch
        title: >-
          The ReviewPage unit shall keep the text of the file and clear the line selection when the reader switches
          between versions.
        justification: |
          A line selection of one version has no meaning in another version, and the reader stays with the same file.
        tests:
          - ReviewPage_ViewSwitch_KeepsTextAndClearsTheSelection

      - id: ReviewCenter-ReviewPage-Diff
        title: >-
          The ReviewPage unit shall show the Diff view of a file side by side, the baseline on the left and the head
          on the right, each with its own line numbers.
        justification: |
          A reviewer wants to see what changed. Old and new next to each other, aligned row by row, show what
          replaced what, and each side keeps the numbers that a comment on that side points at.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_ShowsDiffWithSummaryHintAndNumbers
          - ReviewPage_DiffView_Rows_AreSideBySideWithPlaceholders

      - id: ReviewCenter-ReviewPage-Diff-PlainText
        title: >-
          The ReviewPage unit shall show the text of a line of the Diff view as plain text, never as markup.
        justification: |
          Plain text shows every character of the file and cannot execute anything in the file.
        tests:
          - ReviewPage_DiffView_MarkupInLines_IsShownAsPlainText

      - id: ReviewCenter-ReviewPage-Diff-Unchanged
        title: >-
          The ReviewPage unit shall show an unchanged line of the Diff view on both sides.
        justification: |
          The unchanged lines give the context in which a change is read, and each side keeps its own numbering.
        tests:
          - ReviewPage_DiffView_Rows_AreSideBySideWithPlaceholders

      - id: ReviewCenter-ReviewPage-Diff-Pairing
        title: >-
          The ReviewPage unit shall pair a run of removed lines row by row with the run of added lines that follows
          it, and fill the leftover cells of the shorter run with muted empty placeholders.
        justification: |
          Pairing shows what replaced what, and the placeholders keep the two sides aligned.
        tests:
          - ReviewPage_DiffView_Rows_AreSideBySideWithPlaceholders

      - id: ReviewCenter-ReviewPage-Diff-AddedFile
        title: >-
          The ReviewPage unit shall show an added file in the Diff view as all added lines.
        justification: |
          Nothing existed before an added file, so every line of it is a change.
        tests:
          - ReviewPage_FileSelect_AddedFileOfReviewWithBaseline_OpensAsAllAddedDiffWithDiffAndHeadChoice

      - id: ReviewCenter-ReviewPage-Diff-DeletedFile
        title: >-
          The ReviewPage unit shall show a deleted file in the Diff view as all removed lines.
        justification: |
          Nothing remains after a deleted file, so every line of it is a change.
        tests:
          - ReviewPage_FileSelect_DeletedFile_ShowsRemovedLinesAndAcceptsWholeFileComment

      - id: ReviewCenter-ReviewPage-Diff-Marks
        title: >-
          The ReviewPage unit shall mark a removed line of the Diff view with a - sign and an added line with a + sign.
        justification: |
          The sign keeps added and removed lines apart for a reader who cannot tell the colors apart.
        tests:
          - ReviewPage_DiffView_RemovedAndAddedRows_ShowSignsAndKindStyles

      - id: ReviewCenter-ReviewPage-Diff-Colors
        title: >-
          The ReviewPage unit shall give the row of a removed line, of an added line and of an unchanged line of the
          Diff view each a different kind class, so that the stylesheet can color them differently.
        justification: |
          Color lets the reader see the changes at a glance, and the kind class is what the stylesheet colors.
        tests:
          - ReviewPage_DiffView_RemovedAndAddedRows_ShowSignsAndKindStyles

      - id: ReviewCenter-ReviewPage-Diff-Summary
        title: >-
          The ReviewPage unit shall show above the rows of the Diff view a one-line summary "x added, y removed".
        justification: |
          The summary tells how much there is to read before the reader starts.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_ShowsDiffWithSummaryHintAndNumbers

      - id: ReviewCenter-ReviewPage-Diff-Hint
        title: >-
          The ReviewPage unit shall show above the rows of the Diff view a hint that says to click + to comment on a
          line.
        justification: |
          The reader who sees the diff for the first time learns how to comment.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_ShowsDiffWithSummaryHintAndNumbers

      - id: ReviewCenter-ReviewPage-Diff-Collapsed
        title: >-
          The ReviewPage unit shall collapse every run of unchanged lines that is more than three lines from a change
          into a button "Show N unchanged lines" that expands it.
        justification: |
          Collapsing the unchanged lines puts the changes in front of the reader, and the button keeps the rest one
          click away.
        tests:
          - ReviewPage_DiffView_UnchangedRuns_AreCollapsedAndExpandOnRequest

      - id: ReviewCenter-ReviewPage-Diff-ScrollToChange
        title: >-
          The ReviewPage unit shall bring the first change into view when a file opens on its Diff view.
        justification: |
          The reader wants to start at the first change, not at the top of a long unchanged stretch.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_ScrollsToFirstChange

      - id: ReviewCenter-ReviewPage-Diff-NoRows
        title: >-
          The ReviewPage unit shall show the Diff view of an empty added file without rows and with the summary "No
          changes.".
        justification: |
          A file without content has no line to show, and the reader must not take the empty view for a failure.
        tests:
          - ReviewPage_FileSelect_EmptyAddedFile_ShowsDiffWithoutRows

      - id: ReviewCenter-ReviewPage-DiffStates
        title: >-
          The ReviewPage unit shall say in plain words, instead of rows, that a file is too large to compare line by
          line.
        justification: |
          A comparison that cannot be shown must not look like a failure or like an empty change.
        tests:
          - ReviewPage_FileSelect_TooLargeFile_OffersHeadAndBaseline
          - ReviewPage_FileSelect_AddedFileTooLarge_OffersHeadOnly

      - id: ReviewCenter-ReviewPage-DiffStates-Versions
        title: >-
          The ReviewPage unit shall offer for a file that is too large to compare the Head and the Baseline version
          that the file has, and no version that it lacks.
        justification: |
          The reader is told what to do instead, and is not offered a version that does not exist.
        tests:
          - ReviewPage_FileSelect_TooLargeFile_OffersHeadAndBaseline
          - ReviewPage_FileSelect_AddedFileTooLarge_OffersHeadOnly

      - id: ReviewCenter-ReviewPage-DiffStates-Binary
        title: >-
          The ReviewPage unit shall say in plain words, instead of rows, that a file is binary.
        justification: |
          A comparison that cannot be shown must not look like a failure or like an empty change.
        tests:
          - ReviewPage_FileSelect_BinaryFile_ShowsNotice
          - ReviewPage_FileSelect_AddedBinaryFile_ShowsNoticeAndOffersHeadOnly

      - id: ReviewCenter-ReviewPage-DiffStates-LineEndings
        title: >-
          The ReviewPage unit shall say "No line changes; only line endings or the final newline differ." when two
          versions differ only in their line endings.
        justification: |
          A change that cannot be seen in the lines must not look like an empty change.
        tests:
          - ReviewPage_DiffView_OnlyLineEndingsDiffer_SaysSo

      - id: ReviewCenter-ReviewPage-DiffComment
        title: >-
          The ReviewPage unit shall offer a + control in each cell of the Diff view that holds a line, which opens
          the comment form under that row.
        justification: |
          Discussion is written next to the code it is about, so the control sits in the row of the line.
        tests:
          - ReviewPage_DiffView_CommentOnRemovedLine_StartsBaselineThread
          - ReviewPage_DiffView_CommentOnAddedAndContextLines_StartsHeadThreads

      - id: ReviewCenter-ReviewPage-DiffComment-Baseline
        title: >-
          The ReviewPage unit shall anchor a comment started from the left cell of the Diff view to the Baseline
          version, with the baseline line number.
        justification: |
          The left cell shows the baseline, so the cell chosen says which version the comment is about.
        tests:
          - ReviewPage_DiffView_CommentOnRemovedLine_StartsBaselineThread
          - ReviewPage_DiffView_LeftControlIsBaseline_RightControlIsHead

      - id: ReviewCenter-ReviewPage-DiffComment-Head
        title: >-
          The ReviewPage unit shall anchor a comment started from the right cell of the Diff view to the Head version,
          with the head line number.
        justification: |
          The right cell shows the head, so the cell chosen says which version the comment is about.
        tests:
          - ReviewPage_DiffView_CommentOnAddedAndContextLines_StartsHeadThreads
          - ReviewPage_DiffView_LeftControlIsBaseline_RightControlIsHead
          - ReviewPage_DiffView_AddedFile_CommentOnLine_StartsHeadThreadUnderTheRow

      - id: ReviewCenter-ReviewPage-DiffComment-PlainWords
        title: >-
          The ReviewPage unit shall state the version and the lines of the comment target in plain words, for example
          "Comment on line 10 (before)".
        justification: |
          The plain wording tells the reader what the comment will be attached to.
        tests:
          - ReviewPage_DiffView_CommentOnRemovedLine_StartsBaselineThread

      - id: ReviewCenter-ReviewPage-DiffComment-ShiftClick
        title: >-
          The ReviewPage unit shall extend the selection of the comment target with Shift-click only within one
          version.
        justification: |
          A range must not mix the numbering of the baseline with the numbering of the head.
        tests:
          - ReviewPage_DiffView_ShiftClick_ExtendsOnlyWithinTheSameSide

      - id: ReviewCenter-ReviewPage-DiffComment-ThroughLine
        title: >-
          The ReviewPage unit shall extend the selection of the comment target with a "Through line" field only within
          one version.
        justification: |
          A range must not mix the numbering of the baseline with the numbering of the head.
        tests:
          - ReviewPage_DiffView_ThroughLineField_ExtendsTheRange

      - id: ReviewCenter-ReviewPage-DiffComment-Cancel
        title: >-
          The ReviewPage unit shall close the comment form and clear the selection when Cancel is chosen.
        justification: |
          The reader must be able to leave the form without commenting and without a selection left over.
        tests:
          - ReviewPage_DiffView_CancelAndWholeFileOption_BehaveAsLabeled

      - id: ReviewCenter-ReviewPage-DiffComment-WholeFile
        title: >-
          The ReviewPage unit shall offer a whole-file comment in the comment form of the Diff view that keeps the
          typed text.
        justification: |
          A reader who sees that the comment is about the file as a whole must not lose what was typed.
        tests:
          - ReviewPage_DiffView_CancelAndWholeFileOption_BehaveAsLabeled

      - id: ReviewCenter-ReviewPage-DiffComment-Focus
        title: >-
          The ReviewPage unit shall move the keyboard focus to the comment field when a line comment control is
          clicked.
        justification: |
          A keyboard user must be able to type at once.
        tests:
          - ReviewPage_LineCommentButton_Click_MovesFocusToTheCommentField

      - id: ReviewCenter-ReviewPage-DiffThreads
        title: >-
          The ReviewPage unit shall draw the threads of a file under the row of the last line of their anchor in the
          Diff view.
        justification: |
          Discussion is read next to the code it is about.
        tests:
          - ReviewPage_DiffView_ExistingThreads_AreShownUnderTheirLines

      - id: ReviewCenter-ReviewPage-DiffThreads-FirstLine
        title: >-
          The ReviewPage unit shall keep the first line of a thread that covers several lines visible in the Diff view,
          even where that line would be in a collapsed run.
        justification: |
          The thread index and the links of a thread scroll to its first line, so that line must be on the page.
        tests:
          - ReviewPage_DiffView_MultiLineThread_KeepsItsFirstLineVisible

      - id: ReviewCenter-ReviewPage-DiffThreads-Collapsed
        title: >-
          The ReviewPage unit shall keep the last line of a thread visible in the Diff view, even where that line would
          be in a collapsed run.
        justification: |
          A thread that is hidden inside a collapsed run would be missed.
        tests:
          - ReviewPage_DiffView_ExistingThreads_AreShownUnderTheirLines

      - id: ReviewCenter-ReviewPage-DiffThreads-Highlight
        title: >-
          The ReviewPage unit shall highlight the cells of the lines that a thread covers on the side of the Diff view
          that the thread belongs to.
        justification: |
          The reader must see which lines a thread is about, and on which version.
        tests:
          - ReviewPage_DiffView_ExistingThreads_AreShownUnderTheirLines
          - ReviewPage_DiffView_LeftControlIsBaseline_RightControlIsHead

      - id: ReviewCenter-ReviewPage-DiffThreads-Resolved
        title: >-
          The ReviewPage unit shall show a resolved thread of the Diff view as a collapsed header.
        justification: |
          A settled thread must not push the code apart, yet it stays one click away.
        tests:
          - ReviewPage_DiffView_InlineThread_ReplyResolveAndReopen

      - id: ReviewCenter-ReviewPage-DiffThreads-Controls
        title: >-
          The ReviewPage unit shall offer on an inline thread of the Diff view the reply, resolve and reopen controls
          of the thread list.
        justification: |
          The reader must be able to take part in the discussion where it is read.
        tests:
          - ReviewPage_DiffView_InlineThread_ReplyResolveAndReopen

      - id: ReviewCenter-ReviewPage-DiffThreads-WholeFileOnly
        title: >-
          The ReviewPage unit shall list only the whole-file threads of a file below its Diff view.
        justification: |
          A thread that is drawn under its line must not be listed a second time.
        tests:
          - ReviewPage_DiffView_ExistingThreads_AreShownUnderTheirLines
          - ReviewPage_DiffView_CancelAndWholeFileOption_BehaveAsLabeled

      - id: ReviewCenter-ReviewPage-DiffThreads-Counts
        title: >-
          The ReviewPage unit shall count the open threads of both sides of a file in the file list.
        justification: |
          The thread count of a file must not miss the threads of the baseline.
        tests:
          - ReviewPage_FileList_ThreadCounts_IncludeBothSides
      - id: ReviewCenter-ReviewPage-ThreadSummary
        title: >-
          The ReviewPage unit shall show the number of open threads of the review on the Open filter button of the
          thread index.
        justification: |
          Reviewers need to see at a glance how much discussion is still open.
        tests:
          - ReviewPage_Render_NoThreads_ShowsZeroSummaryAndZeroFileCounts
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments

      - id: ReviewCenter-ReviewPage-ThreadSummary-Resolved
        title: >-
          The ReviewPage unit shall show the number of resolved threads of the review on the Resolved filter button
          of the thread index.
        justification: |
          Reviewers need to see at a glance how much of the discussion is settled.
        tests:
          - ReviewPage_Render_NoThreads_ShowsZeroSummaryAndZeroFileCounts
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments

      - id: ReviewCenter-ReviewPage-ThreadSummary-FileCount
        title: >-
          The ReviewPage unit shall show the number of open threads next to every file in the list of files.
        justification: |
          Reviewers need to see which files the open discussion concerns.
        tests:
          - ReviewPage_Render_NoThreads_ShowsZeroSummaryAndZeroFileCounts
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments

      - id: ReviewCenter-ReviewPage-ThreadIndex
        title: >-
          The ReviewPage unit shall list the threads of all files in one index, each row showing the file, the
          anchor, the state, the number of comments, the author of the first comment and the time of last
          activity.
        justification: |
          Reviewers need to find the discussion that needs them without opening every file.
        tests:
          - ReviewPage_ThreadIndex_Filters_ShowRowsWithFileAnchorStateCountAuthorAndActivity

      - id: ReviewCenter-ReviewPage-ThreadIndex-AnchorWording
        title: >-
          The ReviewPage unit shall state the anchor of a thread of a file that has a baseline in plain words as
          "Before: line N" or "After: lines N-M".
        justification: |
          A line number alone is ambiguous when a file has two versions, so the index says which one it means.
        tests:
          - ReviewPage_ThreadIndex_ShowsSideAndLinesAndJumpsToTheDiff

      - id: ReviewCenter-ReviewPage-ThreadIndex-Filters
        title: >-
          The ReviewPage unit shall let the reader filter the index of threads to All, Open or Resolved threads.
        justification: |
          Reviewers narrow the list to the discussion they came for.
        tests:
          - ReviewPage_ThreadIndex_Filters_ShowRowsWithFileAnchorStateCountAuthorAndActivity

      - id: ReviewCenter-ReviewPage-ThreadIndex-DefaultOpen
        title: >-
          The ReviewPage unit shall choose the Open filter of the index of threads first when the review is not
          concluded and has an open thread.
        justification: |
          The discussion that needs the reader comes first.
        tests:
          - ReviewPage_ThreadIndex_Filters_ShowRowsWithFileAnchorStateCountAuthorAndActivity
          - ReviewPage_Render_OnlyResolvedThreads_ThreadsDefaultToAll

      - id: ReviewCenter-ReviewPage-ThreadIndex-DefaultAllResolved
        title: >-
          The ReviewPage unit shall choose the All filter of the index of threads first when the review has only
          resolved threads.
        justification: |
          An empty Open list would look as if there were no discussion.
        tests:
          - ReviewPage_Render_OnlyResolvedThreads_ThreadsDefaultToAll

      - id: ReviewCenter-ReviewPage-ThreadIndex-DefaultAllConcluded
        title: >-
          The ReviewPage unit shall choose the All filter of the index of threads first when the review is
          concluded.
        justification: |
          Nothing is open to act on in a concluded review, so the reader reads the record.
        tests:
          - ReviewPage_Render_ConcludedReview_ThreadsDefaultToAll

      - id: ReviewCenter-ReviewPage-ThreadIndex-SelectFile
        title: >-
          The ReviewPage unit shall select the file of a thread when the reader chooses the thread in the index.
        justification: |
          A thread is read next to the code it is about.
        tests:
          - ReviewPage_ThreadIndex_RowClick_SelectsFileHighlightsAnchorAndScrolls

      - id: ReviewCenter-ReviewPage-ThreadIndex-Highlight
        title: >-
          The ReviewPage unit shall highlight the anchored lines of the chosen thread on the side, baseline or
          head, that the thread belongs to.
        justification: |
          The reader sees which code the thread is about.
        tests:
          - ReviewPage_ThreadIndex_RowClick_SelectsFileHighlightsAnchorAndScrolls
          - ReviewPage_ThreadIndex_BaselineThreadOnTooLargeFile_HighlightsItsBaselineLines
          - ReviewPage_ThreadIndex_ThreadHighlight_StaysOnTheSideOfTheThread

      - id: ReviewCenter-ReviewPage-ThreadIndex-Scroll
        title: >-
          The ReviewPage unit shall scroll to the first anchored line of the thread that the reader chose in the
          index.
        justification: |
          The reader does not search a long file for the lines of the thread.
        tests:
          - ReviewPage_ThreadIndex_RowClick_SelectsFileHighlightsAnchorAndScrolls
          - ReviewPage_ThreadIndex_ShowsSideAndLinesAndJumpsToTheDiff
          - ReviewPage_ThreadIndex_TooLargeFile_OpensTheVersionOfTheThread

      - id: ReviewCenter-ReviewPage-ThreadIndex-DiffView
        title: >-
          The ReviewPage unit shall show the thread that the reader chose in the index in the Diff view, at its
          row, when the file has a diff.
        justification: |
          The thread is read against the change it is about.
        tests:
          - ReviewPage_ThreadIndex_ShowsSideAndLinesAndJumpsToTheDiff
          - ReviewPage_ThreadIndex_AddedFileHeadThread_JumpsToTheDiffRow

      - id: ReviewCenter-ReviewPage-ThreadIndex-Version
        title: >-
          The ReviewPage unit shall open the version of the file that the chosen thread belongs to when the file
          has no diff because it is too large to compare.
        justification: |
          A thread on a file without a diff must still lead the reader to its lines.
        tests:
          - ReviewPage_ThreadIndex_TooLargeFile_OpensTheVersionOfTheThread
          - ReviewPage_ThreadIndex_BaselineThreadOnTooLargeFile_HighlightsItsBaselineLines

      - id: ReviewCenter-ReviewPage-ThreadCollapse
        title: >-
          The ReviewPage unit shall show a resolved thread as a one-line header with its anchor, state and number of
          comments.
        justification: |
          Settled discussion should not push the open discussion out of sight.
        tests:
          - ReviewPage_ResolvedThread_CollapsedHeaderExpandsOnRequest

      - id: ReviewCenter-ReviewPage-ThreadCollapse-Toggle
        title: >-
          The ReviewPage unit shall expand a collapsed thread and collapse it again on request.
        justification: |
          Settled discussion must stay readable and open to being reopened.
        tests:
          - ReviewPage_ResolvedThread_CollapsedHeaderExpandsOnRequest

      - id: ReviewCenter-ReviewPage-ThreadCollapse-OpenExpanded
        title: >-
          The ReviewPage unit shall keep an open thread expanded.
        justification: |
          Open discussion is what the reader needs to see.
        tests:
          - ReviewPage_ResolvedThread_CollapsedHeaderExpandsOnRequest

      - id: ReviewCenter-ReviewPage-ThreadCollapse-OnResolve
        title: >-
          The ReviewPage unit shall collapse a thread when the reader resolves it.
        justification: |
          The thread leaves the open discussion at once.
        tests:
          - ReviewPage_ResolvedThread_CollapsedHeaderExpandsOnRequest
          - ReviewPage_ResolveAndReopen_Toggle_ChangesStateAndSummary

      - id: ReviewCenter-ReviewPage-ThreadStart
        title: >-
          The ReviewPage unit shall let a reader start a thread on the selected file with an optional start and
          end line and a text, anchor it to the lines entered or to the whole file when none are entered, and
          show the new thread under its anchor.
        justification: |
          Comments are only useful when they are easy to start.
        tests:
          - ReviewPage_StartThread_WholeFile_CreatesThreadAndClearsText
          - ReviewPage_StartThread_LineRangeAndSingleLine_AnchorLines

      - id: ReviewCenter-ReviewPage-ThreadStart-Author
        title: >-
          The ReviewPage unit shall record the signed-in user as the author of a new thread.
        justification: |
          The author is the signed-in user, so it cannot be chosen or faked.
        tests:
          - ReviewPage_StartThread_WholeFile_CreatesThreadAndClearsText

      - id: ReviewCenter-ReviewPage-ThreadStart-NoAuthorField
        title: >-
          The ReviewPage unit shall offer no field to enter an author when a thread is started.
        justification: |
          Nothing in the form can name another author.
        tests:
          - ReviewPage_StartThread_WholeFile_CreatesThreadAndClearsText

      - id: ReviewCenter-ReviewPage-ThreadStart-LineButton
        title: >-
          The ReviewPage unit shall offer a Comment button on a line of the selected file that fills the start and
          end line fields with the number of that line.
        justification: |
          The reader does not need to type line numbers.
        tests:
          - ReviewPage_LineCommentButton_Click_FillsStartAndEndLine

      - id: ReviewCenter-ReviewPage-ThreadStart-Error
        title: >-
          The ReviewPage unit shall show a violated rule or an unreadable line number as a message next to the
          form that starts a thread.
        justification: |
          A mistake is easy to correct when the message is next to the form.
        tests:
          - ReviewPage_StartThread_InvalidInput_ShowsErrorAndKeepsValues

      - id: ReviewCenter-ReviewPage-ThreadStart-KeepValues
        title: >-
          The ReviewPage unit shall keep the entered line numbers and text in the form that starts a thread after
          a message was shown.
        justification: |
          Keeping what was typed saves the reader from typing it again.
        tests:
          - ReviewPage_StartThread_InvalidInput_ShowsErrorAndKeepsValues

      - id: ReviewCenter-ReviewPage-ThreadStart-Clear
        title: >-
          The ReviewPage unit shall clear the text field of the form after a thread was started.
        justification: |
          The next comment starts with an empty field.
        tests:
          - ReviewPage_StartThread_WholeFile_CreatesThreadAndClearsText

      - id: ReviewCenter-ReviewPage-ThreadStart-CtrlEnter
        title: >-
          The ReviewPage unit shall make Ctrl+Enter in the comment field press the button that starts the thread.
        justification: |
          The keyboard shortcut spares the reader from leaving the keyboard to send a comment.
        tests:
          - ReviewPage_CommentFields_CtrlEnterTarget_NamesTheSubmitButton

      - id: ReviewCenter-ReviewPage-ThreadStart-ReplyShortcut
        title: >-
          The ReviewPage unit shall make Ctrl+Enter in the reply field of a thread press the Reply button of that
          thread.
        justification: |
          The keyboard shortcut spares the reader from leaving the keyboard to send a reply.
        tests:
          - ReviewPage_CommentFields_CtrlEnterTarget_NamesTheSubmitButton

      - id: ReviewCenter-ReviewPage-ThreadStart-ShortcutHint
        title: >-
          The ReviewPage unit shall tell the reader next to the submit button of a comment and of a reply that
          Ctrl+Enter submits.
        justification: |
          A shortcut that nobody knows is not used.
        tests:
          - ReviewPage_CommentFields_CtrlEnterTarget_NamesTheSubmitButton

      - id: ReviewCenter-ReviewPage-ThreadStart-BinaryWholeFile
        title: >-
          The ReviewPage unit shall accept a thread on the whole of a binary file.
        justification: |
          A binary file can still be discussed.
        tests:
          - ReviewPage_StartThread_BinaryFile_WholeFileAllowedAndRangeRefused

      - id: ReviewCenter-ReviewPage-ThreadStart-BinaryRange
        title: >-
          The ReviewPage unit shall refuse a line range on a binary file with a message that says the file is binary.
        justification: |
          A binary file has no lines to anchor a thread to.
        tests:
          - ReviewPage_StartThread_BinaryFile_WholeFileAllowedAndRangeRefused

      - id: ReviewCenter-ReviewPage-ThreadStart-SessionEnded
        title: >-
          The ReviewPage unit shall show the not-found page and store no thread when the session of the user ended
          before the page knew it.
        justification: |
          An action after the session ended must neither fail the page nor leave a trace.
        tests:
          - ReviewPage_StartThread_SessionEndedBeforePageKnows_ShowsNotFoundAndStoresNothing

      - id: ReviewCenter-ReviewPage-ThreadShow
        title: >-
          The ReviewPage unit shall list the threads of the selected file, and only those, each with its anchor
          and state and its comments with author, UTC time and text.
        justification: |
          Reviewers read the discussion next to the code.
        tests:
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments

      - id: ReviewCenter-ReviewPage-ThreadShow-Order
        title: >-
          The ReviewPage unit shall list the threads of the selected file in the order in which they were created.
        justification: |
          A discussion reads in the order in which it happened.
        tests:
          - ReviewPage_FileSelect_ThreadsExist_ListsThreadsInCreationOrder

      - id: ReviewCenter-ReviewPage-ThreadShow-Markers
        title: >-
          The ReviewPage unit shall mark the lines that a thread of the selected file is anchored to.
        justification: |
          The reader sees at once where the discussion is.
        tests:
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments

      - id: ReviewCenter-ReviewPage-ThreadShow-PlainText
        title: >-
          The ReviewPage unit shall show the text of a comment as plain text.
        justification: |
          Nothing typed by an author can change the page.
        tests:
          - ReviewPage_Render_ThreadText_IsShownAsPlainText

      - id: ReviewCenter-ReviewPage-ThreadShow-Empty
        title: >-
          The ReviewPage unit shall show an empty message and no list for a file without threads.
        justification: |
          The reader knows that there is nothing to read.
        tests:
          - ReviewPage_FileSelect_NoThreadsOnFile_ShowsEmptyMessage

      - id: ReviewCenter-ReviewPage-ThreadUpdate
        title: >-
          The ReviewPage unit shall let a reader add a reply to a thread and show it in that thread.
        justification: |
          Replying is how a discussion moves forward.
        tests:
          - ReviewPage_Reply_ValidAndBlank_AppendsCommentOrShowsErrorInThread

      - id: ReviewCenter-ReviewPage-ThreadUpdate-Author
        title: >-
          The ReviewPage unit shall record the signed-in user as the author of a reply.
        justification: |
          The author is the signed-in user, so it cannot be chosen or faked.
        tests:
          - ReviewPage_Reply_ValidAndBlank_AppendsCommentOrShowsErrorInThread
          - ReviewPage_Reply_NoAuthorField_AuthorCannotBeChosen

      - id: ReviewCenter-ReviewPage-ThreadUpdate-NoAuthorField
        title: >-
          The ReviewPage unit shall offer no field to enter an author when a reply is added.
        justification: |
          Nothing in the form can name another author.
        tests:
          - ReviewPage_Reply_NoAuthorField_AuthorCannotBeChosen

      - id: ReviewCenter-ReviewPage-ThreadUpdate-Error
        title: >-
          The ReviewPage unit shall show a violated rule of a reply, such as a blank text, as a message inside that
          thread.
        justification: |
          A mistake is corrected where it was made.
        tests:
          - ReviewPage_Reply_ValidAndBlank_AppendsCommentOrShowsErrorInThread

      - id: ReviewCenter-ReviewPage-ThreadUpdate-Resolve
        title: >-
          The ReviewPage unit shall let a reader resolve an open thread, which then shows the state Resolved.
        justification: |
          Reviewers track what is settled.
        tests:
          - ReviewPage_ResolveAndReopen_Toggle_ChangesStateAndSummary

      - id: ReviewCenter-ReviewPage-ThreadUpdate-Reopen
        title: >-
          The ReviewPage unit shall let a reader reopen a resolved thread, which then shows the state Open.
        justification: |
          A settled discussion may have to continue.
        tests:
          - ReviewPage_ResolveAndReopen_Toggle_ChangesStateAndSummary
          - ThreadCard_ResolveFinding_AsksForNoteThenReopens

      - id: ReviewCenter-ReviewPage-ThreadUpdate-Counts
        title: >-
          The ReviewPage unit shall update the counts of open and of resolved threads when a thread is resolved or
          reopened.
        justification: |
          The summary must follow the threads.
        tests:
          - ReviewPage_ResolveAndReopen_Toggle_ChangesStateAndSummary

      - id: ReviewCenter-ReviewPage-CheckThreads
        title: >-
          The ReviewPage unit shall list a thread about a check of the checklist in the index of threads with the
          label Check discussion and the anchor Check followed by the identifier of the check, in place of a file
          path.
        justification: |
          A discussion about a check has no file, so the index names the check instead.
        tests:
          - ReviewPage_CheckThread_ListedInIndexWithCheckLabel

      - id: ReviewCenter-ReviewPage-CheckThreads-Card
        title: >-
          The ReviewPage unit shall show a thread about a check in a card of check discussions with its anchor,
          state and comments.
        justification: |
          The discussion about a check must be readable on the page.
        tests:
          - ReviewPage_CheckThread_ListedInIndexWithCheckLabel
          - ReviewPage_CheckThread_ReplyAndResolve_Work

      - id: ReviewCenter-ReviewPage-CheckThreads-Apart
        title: >-
          The ReviewPage unit shall keep a thread about a check out of the list of threads of the selected file.
        justification: |
          A discussion about a check must not be hidden among the threads of a file.
        tests:
          - ReviewPage_CheckThread_SelectedFile_KeepsCheckThreadOutOfFileList

      - id: ReviewCenter-ReviewPage-CheckThreads-PlainText
        title: >-
          The ReviewPage unit shall show the text of a comment of a thread about a check as plain text.
        justification: |
          Nothing typed by an author can change the page.
        tests:
          - ReviewPage_CheckThread_CommentText_IsShownAsPlainText

      - id: ReviewCenter-ReviewPage-CheckThreads-Reply
        title: >-
          The ReviewPage unit shall let a reader reply to a thread about a check like to any other thread.
        justification: |
          An open check thread blocks the signature and the conclusion, so it must be answerable.
        tests:
          - ReviewPage_CheckThread_ReplyAndResolve_Work

      - id: ReviewCenter-ReviewPage-CheckThreads-Resolve
        title: >-
          The ReviewPage unit shall let a reader resolve a thread about a check like any other thread.
        justification: |
          An open check thread blocks the signature and the conclusion, so it must be resolvable.
        tests:
          - ReviewPage_CheckThread_ReplyAndResolve_Work

      - id: ReviewCenter-ReviewPage-CheckThreads-DeepLink
        title: >-
          The ReviewPage unit shall show a thread about a check from a deep link in the card of check discussions
          without a not-found message.
        justification: |
          A link in a mail must lead to the thread.
        tests:
          - ReviewPage_CheckThreadDeepLink_ShowsCheckCard

      - id: ReviewCenter-ReviewPage-CheckThreads-DeepLinkNoFile
        title: >-
          The ReviewPage unit shall select no file when a thread about a check is opened from a deep link.
        justification: |
          The page must not select a file for a discussion that has none.
        tests:
          - ReviewPage_CheckThreadDeepLink_SelectsNoFile

      - id: ReviewCenter-ReviewPage-CheckThreads-NoFile
        title: >-
          The ReviewPage unit shall select no file when the reader chooses a thread about a check in the index.
        justification: |
          The page must not select a file for a discussion that has none.
        tests:
          - ReviewPage_CheckThread_DoesNotSelectFile

      - id: ReviewCenter-ReviewPage-CheckThreads-NoForm
        title: >-
          The ReviewPage unit shall offer no form to start a thread in the card of check discussions.
        justification: |
          A thread about a check is started with the Discuss button of the status panel, so the card only shows
          what exists.
        tests:
          - ReviewPage_CheckThread_Card_OffersNoFormToStartThread

      - id: ReviewCenter-ReviewPage-SignatureWarning
        title: >-
          The ReviewPage unit shall store a new thread, a reply, and the resolving and reopening of a thread at once
          and without a warning on a review with a current signature.
        justification: |
          Chat is not part of what a signature covers, so it needs no confirmation of the reader.
        tests:
          - ReviewPage_PostChat_SignedReview_NeedsNoWarningAndKeepsSignature

      - id: ReviewCenter-ReviewPage-SignatureWarning-SignatureKept
        title: >-
          The ReviewPage unit shall leave the signature of a review current after chat was posted on it.
        justification: |
          Chat does not void a signature, so the slot keeps showing that it is signed.
        tests:
          - ReviewPage_PostChat_SignedReview_NeedsNoWarningAndKeepsSignature

      - id: ReviewCenter-ReviewPage-SignatureWarning-Question
        title: >-
          The ReviewPage unit shall post a new thread as a Question, which is not included in the report.
        justification: |
          The page only posts chat; it does not offer to include a comment in the report in this version.
        tests:
          - ReviewPage_PostChat_SignedReview_NeedsNoWarningAndKeepsSignature

      - id: ReviewCenter-ReviewPage-SignatureWarning-ResolveNote
        title: >-
          The ReviewPage unit shall resolve a Question without a resolution note.
        justification: |
          The note is optional for a Question, so a reader can close chat with one action.
        tests:
          - ReviewPage_ResolveThread_Question_PassesNullNoteAndResolves

      - id: ReviewCenter-ReviewPage-SignatureWarning-RefusalMessage
        title: >-
          The ReviewPage unit shall show the refusal of a new thread for a review that was concluded meanwhile as the
          normal error message and not as a signature warning.
        justification: |
          A refusal for another reason is an error, not a question about signatures, so it must not look like one.
        tests:
          - ReviewPage_StartThread_ApprovedMeanwhile_ShowsErrorAndNoWarning

      - id: ReviewCenter-ReviewPage-Reviewers
        title: >-
          The ReviewPage unit shall show a Reviewers card that lists each reviewer slot of the review as "Slot N" with
          its primary reviewer and its alternate reviewer ("None" when there is none).
        justification: |
          Approval of a review is by named people, so the reviewer must see who has to sign.
        tests:
          - ReviewPage_Render_NoSlots_ShowsEmptyReviewersCardAndInReviewBadge
          - ReviewPage_AddSlot_PrimaryAndAlternate_ShowsSlotNotSigned
          - ReviewPage_EditAndRemoveSlot_Unsigned_ChangesAndRemoves

      - id: ReviewCenter-ReviewPage-Reviewers-NotSigned
        title: >-
          The ReviewPage unit shall show the signature status of a slot without a signature as "Not signed".
        justification: |
          The reviewer must see what is still to do.
        tests:
          - ReviewPage_AddSlot_PrimaryAndAlternate_ShowsSlotNotSigned
          - ReviewPage_Sign_WrongPassword_ShowsGenericErrorAndKeepsNoPassword

      - id: ReviewCenter-ReviewPage-Reviewers-SignedStatus
        title: >-
          The ReviewPage unit shall show the signature status of a signed slot as "Signed by {name} on {UTC time}".
        justification: |
          The reviewer must see who signed and when.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Reviewers-OutOfDate
        title: >-
          The ReviewPage unit shall show the signature status of a slot whose record changed after signing as
          "Signed, then the review changed".
        justification: |
          The reviewer must see that a signature no longer covers the current record.
        tests:
          - ReviewPage_Render_RecordChangedAfterSigning_ShowsOutOfDateAndInReview

      - id: ReviewCenter-ReviewPage-Reviewers-AddSlot
        title: >-
          The ReviewPage unit shall let a signed-in user add a slot by choosing a primary reviewer and an optional
          alternate reviewer.
        justification: |
          Any user who may see the project manages the reviewer slots of its reviews.
        tests:
          - ReviewPage_AddSlot_PrimaryAndAlternate_ShowsSlotNotSigned

      - id: ReviewCenter-ReviewPage-Reviewers-EnabledOnly
        title: >-
          The ReviewPage unit shall offer only enabled users in the choice lists of the add form.
        justification: |
          A disabled user cannot sign, so offering one only leads to an error.
        tests:
          - ReviewPage_Render_DisabledUser_IsNotOfferedInTheAddForm

      - id: ReviewCenter-ReviewPage-Reviewers-AddRefusal
        title: >-
          The ReviewPage unit shall show the reason next to the add control and add nothing when the choices of a new
          slot are refused.
        justification: |
          The user must learn why no slot was added.
        tests:
          - ReviewPage_AddSlot_InvalidChoices_ShowsErrorAndAddsNothing

      - id: ReviewCenter-ReviewPage-Reviewers-ChangeSlot
        title: >-
          The ReviewPage unit shall let a signed-in user change the primary and the alternate reviewer of a slot that
          has no signature.
        justification: |
          A slot without a signature is not yet part of the approval history.
        tests:
          - ReviewPage_EditAndRemoveSlot_Unsigned_ChangesAndRemoves

      - id: ReviewCenter-ReviewPage-Reviewers-RemoveSlot
        title: >-
          The ReviewPage unit shall let a signed-in user remove a slot that has no signature.
        justification: |
          A slot without a signature is not yet part of the approval history.
        tests:
          - ReviewPage_EditAndRemoveSlot_Unsigned_ChangesAndRemoves

      - id: ReviewCenter-ReviewPage-Reviewers-ChangeRefusal
        title: >-
          The ReviewPage unit shall show the reason next to the slot and keep the slot unchanged when a change of the
          slot is refused.
        justification: |
          The user must learn why the slot did not change.
        tests:
          - ReviewPage_EditSlot_InvalidChoices_ShowsErrorNextToTheSlot

      - id: ReviewCenter-ReviewPage-Reviewers-EditWarning
        title: >-
          The ReviewPage unit shall show, before a change of a slot that would make the signatures of other slots out
          of date, a warning that names the signers of those slots.
        justification: |
          A change of the record withdraws signatures, so the reader must know whose.
        tests:
          - ReviewPage_EditSlot_ChangeAltersSignedRecord_WarnsAndStoresOnlyOnConfirm

      - id: ReviewCenter-ReviewPage-Reviewers-EditConfirm
        title: >-
          The ReviewPage unit shall store the change of a slot that carries such a warning only after the user
          confirms.
        justification: |
          The reader decides whether to withdraw the signatures.
        tests:
          - ReviewPage_EditSlot_ChangeAltersSignedRecord_WarnsAndStoresOnlyOnConfirm

      - id: ReviewCenter-ReviewPage-Reviewers-RemoveWarning
        title: >-
          The ReviewPage unit shall show, before the removal of a slot that would make the signatures of other slots
          out of date, a warning that names the signers of those slots.
        justification: |
          The removal of a slot changes the record, so the reader must know whose signatures it withdraws.
        tests:
          - ReviewPage_RemoveSlot_RemovalAltersSignedRecord_WarnsAndRemovesOnlyOnConfirm

      - id: ReviewCenter-ReviewPage-Reviewers-RemoveConfirm
        title: >-
          The ReviewPage unit shall remove a slot that carries such a warning only after the user confirms.
        justification: |
          The reader decides whether to withdraw the signatures.
        tests:
          - ReviewPage_RemoveSlot_RemovalAltersSignedRecord_WarnsAndRemovesOnlyOnConfirm

      - id: ReviewCenter-ReviewPage-Reviewers-SignedNoChange
        title: >-
          The ReviewPage unit shall offer no change or removal for a slot that has a signature.
        justification: |
          A slot that carries a signature is part of the approval history and must not be edited away from the page.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot
          - ReviewPage_Render_RecordChangedAfterSigning_ShowsOutOfDateAndInReview

      - id: ReviewCenter-ReviewPage-Reviewers-PlainName
        title: >-
          The ReviewPage unit shall show the display names of the reviewers as plain text.
        justification: |
          Display names are chosen by users, so they must never be able to change the page.
        tests:
          - ReviewPage_Render_SlotDisplayName_IsShownAsPlainText

      - id: ReviewCenter-ReviewPage-Reviewers-NonMemberBadge
        title: >-
          The ReviewPage unit shall mark an assignee who is no longer a member of the project with the badge "No
          longer a project member".
        justification: |
          A person who left the project keeps the slot but can no longer sign.
        tests:
          - ReviewPage_Render_AssigneesNoLongerMembers_ShowsIndicatorOnlyForThem

      - id: ReviewCenter-ReviewPage-Reviewers-NonMemberHint
        title: >-
          The ReviewPage unit shall show for a slot with such an assignee the hint that this reviewer cannot sign until
          added to the project again.
        justification: |
          The page says why the slot cannot make progress.
        tests:
          - ReviewPage_Render_AssigneesNoLongerMembers_ShowsIndicatorOnlyForThem

      - id: ReviewCenter-ReviewPage-Reviewers-MemberUnmarked
        title: >-
          The ReviewPage unit shall show neither the badge nor the hint for assignees who are members of the project.
        justification: |
          A marker on a member would mislead the reader.
        tests:
          - ReviewPage_Render_AssigneesNoLongerMembers_ShowsIndicatorOnlyForThem

      - id: ReviewCenter-ReviewPage-Reviewers-DisabledChoice
        title: >-
          The ReviewPage unit shall keep a primary or alternate reviewer who is disabled as a labeled choice in the
          change lists instead of a blank one.
        justification: |
          A blank choice would silently drop the stored reviewer when the form is saved.
        tests:
          - ReviewPage_EditSlot_DisabledReviewers_KeepCurrentChoiceInTheLists

      - id: ReviewCenter-ReviewPage-Reviewers-NonMemberChoice
        title: >-
          The ReviewPage unit shall keep a primary or alternate reviewer who is no longer a member of the project as a
          labeled choice in the change lists instead of a blank one.
        justification: |
          A blank choice would silently drop the stored reviewer when the form is saved.
        tests:
          - ReviewPage_EditSlot_NonMemberReviewers_KeepCurrentChoiceInTheLists

      - id: ReviewCenter-ReviewPage-Reviewers-NoExtraOption
        title: >-
          The ReviewPage unit shall add no extra option to the change lists for a current reviewer who is an enabled
          member.
        justification: |
          The labeled extra option is only for a reviewer who cannot be chosen again.
        tests:
          - ReviewPage_EditSlot_EnabledReviewers_AddsNoExtraOption

      - id: ReviewCenter-ReviewPage-Reviewers-AuthorChoice
        title: >-
          The ReviewPage unit shall label the extra option of a review author who holds a slot as not offered for a new
          choice because of the review author when the project requires independent reviewers.
        justification: |
          The label names the rule that applies instead of calling the author disabled.
        tests:
          - ReviewPage_EditSlot_AuthorHoldingSlotUnderIndependence_LabelNamesTheRule

      - id: ReviewCenter-ReviewPage-Reviewers-BallotNote
        title: >-
          The ReviewPage unit shall show next to the controls of an unsigned slot a note that removing or replacing a
          reviewer also removes the ballot that reviewer handed in.
        justification: |
          The user must know the cost of the change before making it.
        tests:
          - ReviewPage_Render_UnlockedSlot_NotesThatRemovingTakesTheBallot

      - id: ReviewCenter-ReviewPage-Reviewers-ApprovedBadge
        title: >-
          The ReviewPage unit shall show next to the review title the badge "Approved" when the review is approved.
        justification: |
          The state of the approval must be visible at a glance.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Reviewers-InReviewBadge
        title: >-
          The ReviewPage unit shall show next to the review title the badge "In review" while the review is not
          concluded.
        justification: |
          The state of the approval must be visible at a glance.
        tests:
          - ReviewPage_Render_NoSlots_ShowsEmptyReviewersCardAndInReviewBadge
          - ReviewPage_Render_RecordChangedAfterSigning_ShowsOutOfDateAndInReview

      - id: ReviewCenter-ReviewPage-Reviewers-RejectedBadge
        title: >-
          The ReviewPage unit shall show next to the review title the badge "Rejected", styled as rejected, when the
          review is concluded as rejected.
        justification: |
          A rejection is as decisive as an approval; a reader must see at a glance that the review ended without
          approval and not mistake it for one still in progress.
        tests:
          - ReviewPage_Render_RejectedConcluded_ShowsRejectedBadgeLockedBannerAndAttestationDownload
          - ReviewPage_Sign_RejectedOutcome_ShowsRejectMeaningAndConcludes

      - id: ReviewCenter-ReviewPage-Sign
        title: >-
          The ReviewPage unit shall offer the signed-in user who is the primary or the alternate reviewer of a slot that
          is not currently signed a sign form with a password field.
        justification: |
          Asking again for the password proves that the person at the keyboard is the reviewer. The page only collects
          the password and passes it on, so it holds no signing rules of its own.
        tests:
          - ReviewPage_Sign_WrongPassword_ShowsGenericErrorAndKeepsNoPassword
          - ReviewPage_Render_SignableReview_OccupantsSeeSignFormWithApprovedOutcome

      - id: ReviewCenter-ReviewPage-Sign-ApprovedOutcome
        title: >-
          The ReviewPage unit shall show in the sign form of a review that can be approved the outcome Approved and the
          meaning of that outcome.
        justification: |
          A signature is a statement by one person about one exact record, and the statement differs for an approval
          and a rejection, so the form shows which one the signer is about to make.
        tests:
          - ReviewPage_Sign_WrongPassword_ShowsGenericErrorAndKeepsNoPassword
          - ReviewPage_Render_SignableReview_OccupantsSeeSignFormWithApprovedOutcome

      - id: ReviewCenter-ReviewPage-Sign-RejectedOutcome
        title: >-
          The ReviewPage unit shall show in the sign form of a review that can be rejected the outcome Rejected and the
          meaning of that outcome.
        justification: |
          The statement of a rejection differs from that of an approval, so the form shows which one the signer is
          about to make.
        tests:
          - ReviewPage_Sign_RejectedOutcome_ShowsRejectMeaningAndConcludes

      - id: ReviewCenter-ReviewPage-Sign-Signature
        title: >-
          The ReviewPage unit shall sign the slot when the password is correct.
        justification: |
          The page passes the password on to the signing service, which holds the signing rules.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Sign-StaleRecord
        title: >-
          The ReviewPage unit shall not sign a slot when the record has changed since the page was drawn.
        justification: |
          Signing what was shown prevents approving something that was never seen.
        tests:
          - ReviewPage_Sign_RecordChangedSincePageDrawn_IsRefused

      - id: ReviewCenter-ReviewPage-Sign-StaleMessage
        title: >-
          The ReviewPage unit shall tell the signer that the record has changed when signing is refused for that
          reason.
        justification: |
          The signer must know to read the record again before signing.
        tests:
          - ReviewPage_Sign_RecordChangedSincePageDrawn_IsRefused

      - id: ReviewCenter-ReviewPage-Sign-Blockers
        title: >-
          The ReviewPage unit shall list what blocks signing instead of the sign form to the reviewer of a slot while
          the review cannot be signed.
        justification: |
          Listing the blockers tells the reviewer what is left to do.
        tests:
          - ReviewPage_Render_BlockedReview_ShowsBlockersInsteadOfSignForm

      - id: ReviewCenter-ReviewPage-Sign-ConclusionBlocker
        title: >-
          The ReviewPage unit shall list the missing conclusion text as the blocker, instead of the sign form, for a
          Rejected outcome without a conclusion text.
        justification: |
          A rejection needs stated reasons, so the reviewer is told to write them.
        tests:
          - ReviewPage_Render_RejectedOutcomeBlankConclusion_ShowsBlockerAndNoSignForm

      - id: ReviewCenter-ReviewPage-Sign-OthersNoForm
        title: >-
          The ReviewPage unit shall show neither the sign form nor the blockers of a slot to a user who is not its
          primary or alternate reviewer.
        justification: |
          Only the occupants of a slot sign it, so nobody else is offered the action.
        tests:
          - ReviewPage_Render_SignableReview_NonOccupantSeesNoSignForm
          - ReviewPage_Render_BlockedReview_ShowsBlockersInsteadOfSignForm

      - id: ReviewCenter-ReviewPage-Sign-WrongPassword
        title: >-
          The ReviewPage unit shall answer a wrong password with the generic message "The password is incorrect." only.
        justification: |
          The answer must not help somebody who guesses passwords.
        tests:
          - ReviewPage_Sign_WrongPassword_ShowsGenericErrorAndKeepsNoPassword

      - id: ReviewCenter-ReviewPage-Sign-PasswordHidden
        title: >-
          The ReviewPage unit shall never show the typed password in the page, neither after a wrong nor after a
          correct password.
        justification: |
          A password must not be echoed back to the browser.
        tests:
          - ReviewPage_Sign_WrongPassword_ShowsGenericErrorAndKeepsNoPassword
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Sign-NoSecondForm
        title: >-
          The ReviewPage unit shall offer no sign form for a slot after it was signed.
        justification: |
          A slot is signed once; a second signature of the same slot would only confuse the history.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Sign-ApprovedResult
        title: >-
          The ReviewPage unit shall show the review as Approved when every slot has a current signature.
        justification: |
          The reader must see the outcome of the signing at once.
        tests:
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Sign-RejectedResult
        title: >-
          The ReviewPage unit shall show the review as Rejected when every slot is signed with the outcome Rejected.
        justification: |
          The reader must see the outcome of the signing at once.
        tests:
          - ReviewPage_Sign_RejectedOutcome_ShowsRejectMeaningAndConcludes

      - id: ReviewCenter-ReviewPage-Digest
        title: >-
          The ReviewPage unit shall show the record digest of the review in the Details section as its first 16
          characters.
        justification: |
          The digest identifies the exact record that signatures cover. It is needed rarely and must stay out of the
          way.
        tests:
          - ReviewPage_Render_Details_ShowShortDigestWithFullValueInTitle

      - id: ReviewCenter-ReviewPage-Digest-FullValue
        title: >-
          The ReviewPage unit shall carry the full 64-character record digest in the title of the element that shows
          its first 16 characters.
        justification: |
          Anyone who wants to compare the digest needs the full value.
        tests:
          - ReviewPage_Render_Details_ShowShortDigestWithFullValueInTitle

      - id: ReviewCenter-ReviewPage-Interactive
        title: >-
          The ReviewPage unit shall report that it is interactive, through a marker on its root element, once it
          has rendered on a live connection.
        justification: |
          Users, automated tests, and tooling need a reliable signal that the page now responds, so that they do
          not act before the live connection exists.
        tests:
          - ReviewPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ReviewPage-HistoryLink
        title: >-
          The ReviewPage unit shall show a link to the history page of the review in its title row.
        justification: |
          The history of a review is reached from the review it belongs to.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsHistoryLink

      - id: ReviewCenter-ReviewPage-ReviewSet
        title: >-
          The ReviewPage unit shall show in the Details section of a review that was planned from a review-set the
          identifier of that set.
        justification: |
          A reviewer must see which review-set a planned review belongs to, because the set links this review to
          the earlier and later reviews of the same files.
        tests:
          - ReviewPage_Render_PlannedReview_DetailsShowReviewSet

      - id: ReviewCenter-ReviewPage-ReviewSet-NoRow
        title: >-
          The ReviewPage unit shall show no review-set row in the Details section of a review that was not planned
          from a review-set.
        justification: |
          An empty row would suggest that the review belongs to a set when it does not.
        tests:
          - ReviewPage_Render_RepositoryReview_DetailsShowRepositoryShasAndSelection

      - id: ReviewCenter-ReviewPage-DeepLinks
        title: >-
          The ReviewPage unit shall open the file named by an address of the form /files/{path} and show it in the
          diff.
        justification: |
          A link that names one file is how reviewers point each other at it.
        tests:
          - ReviewPage_FileAddress_ModifiedFile_OpensFileInDiff

      - id: ReviewCenter-ReviewPage-DeepLinks-Line
        title: >-
          The ReviewPage unit shall scroll to the line named by an address of a file with a line, and highlight it.
        justification: |
          A link that names one line is how reviewers point each other at a finding.
        tests:
          - ReviewPage_LineAddress_HeadLine_HighlightsAndScrollsToTheRow
          - ReviewPage_LineAddress_LineInCollapsedRun_IsShownAndHighlighted
          - ReviewPage_LineAddress_AddedFile_HighlightsTheDiffRow
          - ReviewPage_LineAddress_UploadFile_HighlightsTheCodeLine

      - id: ReviewCenter-ReviewPage-DeepLinks-BaselineLine
        title: >-
          The ReviewPage unit shall highlight the baseline line named by a line address with the baseline side in the
          left cell, and not the head line of the same number.
        justification: |
          The two versions of a file have their own numbering, so the side of the address decides which line is meant.
        tests:
          - ReviewPage_LineAddress_BaselineLine_HighlightsTheLeftCell
          - ReviewPage_LineAddress_DeletedFile_BaselineLineYesHeadLineNo

      - id: ReviewCenter-ReviewPage-DeepLinks-Thread
        title: >-
          The ReviewPage unit shall open the file of the thread named by an address of the form /threads/{id} and
          highlight the thread.
        justification: |
          A link that names one thread is how reviewers point each other at a discussion.
        tests:
          - ReviewPage_ThreadAddress_HeadThread_OpensFileAndHighlightsThread
          - ReviewPage_ThreadAddress_AddedFileHeadThread_OpensDiffAndHighlightsRow

      - id: ReviewCenter-ReviewPage-DeepLinks-ThreadScroll
        title: >-
          The ReviewPage unit shall scroll to a whole-file thread named by a thread address.
        justification: |
          A whole-file thread has no line, so the thread itself is what the reader must be brought to.
        tests:
          - ReviewPage_ThreadAddress_WholeFileThread_ScrollsToTheThread

      - id: ReviewCenter-ReviewPage-DeepLinks-BaselineThread
        title: >-
          The ReviewPage unit shall highlight the baseline lines of a baseline thread named by a thread address, and
          not the lines of the head that have the same numbers.
        justification: |
          The two versions of a file have their own numbering, so the side of the thread decides which lines are meant.
        tests:
          - ReviewPage_ThreadAddress_BaselineThreadOnTooLargeFile_HighlightsItsBaselineLines
          - ReviewPage_ThreadAddress_BaselineThread_DoesNotHighlightTheSameLinesOfTheHead

      - id: ReviewCenter-ReviewPage-DeepLinks-ResolvedThread
        title: >-
          The ReviewPage unit shall expand a resolved thread that is named by a thread address.
        justification: |
          A reader who follows a link to a thread wants to read it, not to find it collapsed.
        tests:
          - ReviewPage_ThreadAddress_ResolvedBaselineThread_IsExpandedAndHighlightedOnTheLeft

      - id: ReviewCenter-ReviewPage-DeepLinks-ThreadCounts
        title: >-
          The ReviewPage unit shall keep the thread counts in the file list when a thread address is opened.
        justification: |
          Opening a link must not change what the file list tells about the discussion.
        tests:
          - ReviewPage_ThreadAddress_KeepsThreadCountsInTheFileList

      - id: ReviewCenter-ReviewPage-DeepLinks-ReplaceAddress
        title: >-
          The ReviewPage unit shall replace the address of the browser, without a history entry and without reloading
          the page, with the link of the file or thread that the reader chooses.
        justification: |
          An address bar that always holds a shareable link needs no extra step.
        tests:
          - ReviewPage_Choose_FileAndThread_ReplacesAddressWithoutNavigating

      - id: ReviewCenter-ReviewPage-DeepLinks-KeepAddress
        title: >-
          The ReviewPage unit shall not replace the address of the browser when it opens an address.
        justification: |
          The address that the reader followed is already the shareable link.
        tests:
          - ReviewPage_OpenDeepLink_DoesNotReplaceAddress

      - id: ReviewCenter-ReviewPage-DeepLinks-ThreadLink
        title: >-
          The ReviewPage unit shall show on every thread a link to its address.
        justification: |
          A link on the thread is how reviewers point each other at the discussion.
        tests:
          - ReviewPage_Thread_ShowsLinkButtonAndCopyLinkControl

      - id: ReviewCenter-ReviewPage-DeepLinks-CopyButton
        title: >-
          The ReviewPage unit shall show on every thread a Copy link button.
        justification: |
          A Copy link button saves the reviewer from selecting the address by hand.
        tests:
          - ReviewPage_Thread_ShowsLinkButtonAndCopyLinkControl

      - id: ReviewCenter-ReviewPage-DeepLinks-CopyLink
        title: >-
          The ReviewPage unit shall copy the absolute address of the thread to the clipboard when Copy link is
          clicked.
        justification: |
          An absolute address works wherever the reviewer pastes it.
        tests:
          - ReviewPage_CopyLink_Click_CopiesAbsoluteThreadAddressAndShowsCopied

      - id: ReviewCenter-ReviewPage-DeepLinks-CopyConfirm
        title: >-
          The ReviewPage unit shall confirm a copy of the thread address with the message "Copied".
        justification: |
          The reader must know that the copy worked.
        tests:
          - ReviewPage_CopyLink_Click_CopiesAbsoluteThreadAddressAndShowsCopied

      - id: ReviewCenter-ReviewPage-DeepLinks-CopyTiming
        title: >-
          The ReviewPage unit shall keep the confirmation of a copy until two seconds after the latest click.
        justification: |
          A second click must not lose its confirmation to the timer of the first click.
        tests:
          - ReviewPage_CopyLink_SecondClick_KeepsFeedbackUntilTwoSecondsAfterTheLatestClick

      - id: ReviewCenter-ReviewPage-DeepLinks-CopyFailed
        title: >-
          The ReviewPage unit shall report "Copy failed" when the clipboard refuses the copy.
        justification: |
          The reader must not believe that the address was copied when it was not.
        tests:
          - ReviewPage_CopyLink_ClipboardFails_ShowsCopyFailed

      - id: ReviewCenter-ReviewPage-DeepLinks-BuildReview
        title: >-
          The ReviewPage unit shall build the address of a review from the project and the review identifiers.
        justification: |
          One place builds the addresses, so every link of the product agrees with the router.
        tests:
          - ReviewLinks_ForReview_ProjectAndReview_BuildsAddress

      - id: ReviewCenter-ReviewPage-DeepLinks-BuildLine
        title: >-
          The ReviewPage unit shall add the line and the side to the address of a file when a line is given, and no
          query when only a side is given.
        justification: |
          A side without a line names no line, so it must not leave a query that the router would reject.
        tests:
          - ReviewLinks_ForFile_WithLine_AddsLineAndSide
          - ReviewLinks_ForFile_SideWithoutLine_AddsNoQuery

      - id: ReviewCenter-ReviewPage-DeepLinks-BuildThread
        title: >-
          The ReviewPage unit shall build the address of a thread from the project, review and thread identifiers.
        justification: |
          One place builds the addresses, so every link of the product agrees with the router.
        tests:
          - ReviewLinks_ForThread_Thread_BuildsAddress

      - id: ReviewCenter-ReviewPage-DeepLinks-Escaping
        title: >-
          The ReviewPage unit shall escape each path segment of the address of a file once.
        justification: |
          Names with spaces, hashes, question marks, percent signs and non-ASCII letters must keep working.
        tests:
          - ReviewLinks_ForFile_Path_EscapesEachSegment

      - id: ReviewCenter-ReviewPage-DeepLinks-RoundTrip
        title: >-
          The ReviewPage unit shall open the same file and line that a link was built for when the link from the
          builder is opened.
        justification: |
          The router decodes once what the builder escaped once, so no name changes on the way.
        tests:
          - ReviewPage_RoundTrip_LinkFromBuilder_OpensTheSameFileAndLine

      - id: ReviewCenter-ReviewPage-DeepLinks-LocalOnly
        title: >-
          The ReviewPage unit shall build only local addresses that the return-address check of the sign-in accepts.
        justification: |
          A link that the sign-in would refuse could not bring a signed-out reader back to the page.
        tests:
          - ReviewLinks_AnyAddress_IsLocalAndSurvivesTheReturnUrlCheck

      - id: ReviewCenter-ReviewPage-DeepLinks-NullArguments
        title: >-
          The ReviewPage unit shall throw an argument-null exception when an address is built from a null argument.
        justification: |
          A missing identifier is a mistake of the caller that must not produce an address that names nothing.
        tests:
          - ReviewLinks_NullArguments_Throw

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound
        title: >-
          The ReviewPage unit shall answer an address that names nothing in the review, such as a missing file, line,
          thread, a thread of another review or a baseline line of a file without a baseline, with a plain message
          in the page.
        justification: |
          Links outlive the files and threads they point at. A friendly message is better than an error page, and it
          must not reveal anything about other reviews.
        tests:
          - ReviewPage_Address_NamesNothing_ShowsMessageWithWayBack

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound-WayBack
        title: >-
          The ReviewPage unit shall show with that message a link back to the file list of the review.
        justification: |
          The reader must have a way back from a link that leads nowhere.
        tests:
          - ReviewPage_Address_NamesNothing_ShowsMessageWithWayBack

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound-FileList
        title: >-
          The ReviewPage unit shall keep the file list working when it shows that message.
        justification: |
          The reader must be able to pick another file at once.
        tests:
          - ReviewPage_Address_NamesNothing_ShowsMessageWithWayBack

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound-NoErrorPage
        title: >-
          The ReviewPage unit shall show that message in the page with no highlight, and not an error page.
        justification: |
          An address that names nothing is not a failure of the page.
        tests:
          - ReviewPage_Address_NamesNothing_ShowsMessageWithWayBack

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound-UnknownSide
        title: >-
          The ReviewPage unit shall read an unknown side in the address of a line as the head, and show no message.
        justification: |
          A side that the page does not know is no reason to refuse a line that exists.
        tests:
          - ReviewPage_Address_UnknownSideAndLaterChoice_UsesHeadAndClearsMessage

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound-Cleared
        title: >-
          The ReviewPage unit shall clear that message when the reader chooses a file.
        justification: |
          A message about a link that was followed must not stay once the reader has moved on.
        tests:
          - ReviewPage_Address_UnknownSideAndLaterChoice_UsesHeadAndClearsMessage

      - id: ReviewCenter-ReviewPage-Attestation
        title: >-
          The ReviewPage unit shall show a button that downloads the signed attestation of a review that is concluded
          (approved or rejected) when its signing key can be used.
        justification: |
          The attestation is evidence of how a review concluded, so it is offered when the review is concluded, as an
          approval or as a rejection whose reasons are worth keeping.
        tests:
          - ReviewPage_Sign_CorrectPassword_OffersAttestationDownload
          - ReviewPage_Render_RejectedConcluded_ShowsRejectedBadgeLockedBannerAndAttestationDownload
          - ReviewPage_Sign_RejectedOutcome_ShowsRejectMeaningAndConcludes
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-ReviewPage-Attestation-Address
        title: >-
          The ReviewPage unit shall link the download button to the attestation address of the project and the review.
        justification: |
          The button must lead to the attestation of this review and no other.
        tests:
          - ReviewLinks_ForAttestation_ProjectAndReview_BuildsAddress
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-ReviewPage-Attestation-NotConcluded
        title: >-
          The ReviewPage unit shall show nothing about the attestation for a review that is not concluded.
        justification: |
          There is nothing to attest before the review concluded.
        tests:
          - ReviewPage_Render_ReviewNotApproved_OffersNoAttestation

      - id: ReviewCenter-ReviewPage-Attestation-SelfSignedNote
        title: >-
          The ReviewPage unit shall show next to the button a note that the key is a self-signed key generated by the
          server and not an organization key, for the SelfSigned provider.
        justification: |
          The note keeps the default key from being taken for an organization key.
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-ReviewPage-Attestation-SuppliedNote
        title: >-
          The ReviewPage unit shall show next to the button a note that the key is a self-signed key supplied by the
          administrator and not an organization key, for a self-signed certificate from the certificate store.
        justification: |
          A self-signed certificate that the administrator supplied was not generated by the server, so the note must
          not say that it was.
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedCertificateFromStore_NoteSaysAdministratorSuppliedIt

      - id: ReviewCenter-ReviewPage-Attestation-OrganizationNote
        title: >-
          The ReviewPage unit shall show next to the button a note that names the certificate that signs, for an
          organization key.
        justification: |
          The reader sees who vouches for the attestation.
        tests:
          - ReviewPage_Render_ReviewApprovedWithOrganizationKey_NoteNamesTheCertificate

      - id: ReviewCenter-ReviewPage-Attestation-HelpLink
        title: >-
          The ReviewPage unit shall show next to the button a link to the help topic about the signing key.
        justification: |
          The reader can learn what the note about the key means.
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-ReviewPage-Attestation-KeyProblem
        title: >-
          The ReviewPage unit shall show, instead of the button, that the attestation is unavailable and why when the
          signing key cannot be used.
        justification: |
          A visible reason is better than a download that fails.
        tests:
          - ReviewPage_Render_ReviewApprovedWithKeyProblem_ShowsProblemInsteadOfDownload

      - id: ReviewCenter-ReviewPage-Attestation-KeyWarning
        title: >-
          The ReviewPage unit shall show the warnings of the key status, such as a certificate that ends soon, next to
          the button.
        justification: |
          A certificate that ends soon should be noticed by the people who download attestations.
        tests:
          - ReviewPage_Render_KeyStatusWithExpiryWarning_ShowsTheWarningNextToTheDownload

      - id: ReviewCenter-ReviewPage-Attestation-NoKeyWarning
        title: >-
          The ReviewPage unit shall show no key warning when the key status has none.
        justification: |
          A warning that is always there is not read.
        tests:
          - ReviewPage_Render_KeyStatusWithoutWarnings_ShowsNoWarning

      - id: ReviewCenter-ReviewPage-ExternalSignature
        title: >-
          The ReviewPage unit shall offer a user of a provider a button that confirms the identity at the provider
          instead of the password field.
        justification: |
          A user of a provider has no password to type.
        tests:
          - ReviewPage_Render_ProviderUser_OffersConfirmationButtonInsteadOfPassword

      - id: ReviewCenter-ReviewPage-ExternalSignature-Confirmed
        title: >-
          The ReviewPage unit shall offer a user of a provider the signature after a successful confirmation of
          identity.
        justification: |
          The confirmation must come before the signature so that the person knows that the next step records it.
        tests:
          - ReviewPage_Render_ProviderUserWithConfirmation_OffersSignButton

      - id: ReviewCenter-ReviewPage-ExternalSignature-MissingTime
        title: >-
          The ReviewPage unit shall say, after a failed confirmation because the provider reported no usable sign-in
          time (`auth_time` absent, or not a whole number of seconds), that the provider did not report a usable
          sign-in time.
        justification: |
          When the provider sends no usable authentication time, an administrator must change the provider, and the
          person who sees the failure is the one who tells them.
        tests:
          - ReviewPage_Render_ProviderUserMissingAuthTime_NamesTheCause

      - id: ReviewCenter-ReviewPage-ExternalSignature-StaleTime
        title: >-
          The ReviewPage unit shall say, after a failed confirmation because the sign-in was not recent enough, that
          the sign-in was not recent enough.
        justification: |
          The person knows to sign in again at the provider when asked.
        tests:
          - ReviewPage_Render_ProviderUserStaleAuthTime_NamesTheCause

      - id: ReviewCenter-ReviewPage-ExternalSignature-GeneralMessage
        title: >-
          The ReviewPage unit shall give the general message after any other failed confirmation of identity.
        justification: |
          The page must not say more than it knows about why the confirmation failed.
        tests:
          - ReviewPage_Render_ProviderUserFailedConfirmation_ShowsGeneralMessage

      - id: ReviewCenter-ReviewPage-SignTotpCode
        title: >-
          The ReviewPage unit shall show a code field beside the password field of the sign form for a signer who has
          a second factor.
        justification: |
          A signature proves that the person was there, so a person with a second factor must give a fresh code.
        tests:
          - ReviewPage_Sign_EnrolledSignerWithPasswordAndFreshCode_SignsAndClearsFields

      - id: ReviewCenter-ReviewPage-SignTotpCode-NoCodeField
        title: >-
          The ReviewPage unit shall show no code field for a signer without a second factor.
        justification: |
          A field that people cannot use must not be offered.
        tests:
          - ReviewPage_Render_SignerNotEnrolled_ShowsNoCodeField

      - id: ReviewCenter-ReviewPage-SignTotpCode-CodePassed
        title: >-
          The ReviewPage unit shall pass the typed code with the password to the signing service.
        justification: |
          The signing service decides whether the code is right; the page only collects it.
        tests:
          - ReviewPage_Sign_EnrolledSignerWithPasswordAndFreshCode_SignsAndClearsFields

      - id: ReviewCenter-ReviewPage-SignTotpCode-FieldsCleared
        title: >-
          The ReviewPage unit shall empty both the password field and the code field after each attempt.
        justification: |
          A secret must not stay in the page after it was used.
        tests:
          - ReviewPage_Sign_EnrolledSignerWithPasswordAndFreshCode_SignsAndClearsFields
          - ReviewPage_Sign_EnrolledSignerWithWrongCode_ShowsGenericErrorAndSignsNothing

      - id: ReviewCenter-ReviewPage-SignTotpCode-WrongCode
        title: >-
          The ReviewPage unit shall answer a wrong code with the message "The password or the code is incorrect." and
          sign nothing.
        justification: |
          The answer must not tell which part was wrong.
        tests:
          - ReviewPage_Sign_EnrolledSignerWithWrongCode_ShowsGenericErrorAndSignsNothing

      - id: ReviewCenter-ReviewPage-SignTotpCode-ReusedCode
        title: >-
          The ReviewPage unit shall answer a code that was already used in its time step with the same message and sign
          nothing.
        justification: |
          A code can be used once, and the answer must not tell which part was wrong.
        tests:
          - ReviewPage_Sign_CodeAlreadyUsedInStep_IsRefusedUntilTheNextCode

      - id: ReviewCenter-ReviewPage-SignTotpCode-RecoveryCode
        title: >-
          The ReviewPage unit shall answer a recovery code typed in place of the code with the same message and sign
          nothing.
        justification: |
          A recovery code is not a code of the authenticator app, and the answer must not tell which part was wrong.
        tests:
          - ReviewPage_Sign_RecoveryCodeInsteadOfCode_IsRefused

      - id: ReviewCenter-ReviewPage-Locked
        title: >-
          The ReviewPage unit shall show a review that is concluded, approved or rejected, with a Locked badge next to
          the status.
        justification: |
          A user who sees a control that is gone or disabled must also see the reason, or the page looks broken.
        tests:
          - ReviewPage_Render_ApprovedReview_ShowsLockedBadgeBannerAndDisabledControls
          - ReviewPage_Render_RejectedConcluded_ShowsRejectedBadgeLockedBannerAndAttestationDownload

      - id: ReviewCenter-ReviewPage-Locked-Banner
        title: >-
          The ReviewPage unit shall show on a concluded review a banner that says that the review is concluded and
          locked.
        justification: |
          The banner gives the reason why controls are gone or disabled.
        tests:
          - ReviewPage_Render_ApprovedReview_ShowsLockedBadgeBannerAndDisabledControls
          - ReviewPage_Render_RejectedConcluded_ShowsRejectedBadgeLockedBannerAndAttestationDownload

      - id: ReviewCenter-ReviewPage-Locked-NoNewThread
        title: >-
          The ReviewPage unit shall offer no form to start a thread on a concluded review.
        justification: |
          A form that can never be sent only misleads.
        tests:
          - ReviewPage_Render_ApprovedReview_ShowsLockedBadgeBannerAndDisabledControls

      - id: ReviewCenter-ReviewPage-Locked-NoReply
        title: >-
          The ReviewPage unit shall offer no reply box in the threads of a concluded review.
        justification: |
          A form that can never be sent only misleads.
        tests:
          - ReviewPage_Render_ApprovedReviewWithThread_HidesReplyBox

      - id: ReviewCenter-ReviewPage-Locked-DiffHint
        title: >-
          The ReviewPage unit shall show in the diff of a concluded review the hint "This review is locked; comments
          are read-only." instead of the hint to click +.
        justification: |
          A hint to click a control that is disabled only misleads.
        tests:
          - ReviewPage_DiffView_CommentsDisabled_HintSaysReviewIsLocked
          - ReviewPage_DiffView_ApprovedReview_ShowsLockedHintAndDisablesLineComments

      - id: ReviewCenter-ReviewPage-Locked-LineButtons
        title: >-
          The ReviewPage unit shall disable the comment button of every line of a file shown on a concluded review.
        justification: |
          Disabling the controls is a courtesy to the user; the banner gives the reason.
        tests:
          - ReviewPage_Render_ApprovedReview_DisablesTheLineCommentButtons

      - id: ReviewCenter-ReviewPage-Locked-DiffButtons
        title: >-
          The ReviewPage unit shall disable the comment button of every line of the diff shown on a concluded review.
        justification: |
          Disabling the controls is a courtesy to the user; the hint gives the reason.
        tests:
          - ReviewPage_DiffView_CommentsDisabled_HintSaysReviewIsLocked
          - ReviewPage_DiffView_ApprovedReview_ShowsLockedHintAndDisablesLineComments

      - id: ReviewCenter-ReviewPage-Locked-NoResolve
        title: >-
          The ReviewPage unit shall offer no control to resolve or reopen a thread on a concluded review.
        justification: |
          A concluded review cannot change, so a control that would change a thread is not offered.
        tests:
          - ReviewPage_Render_ApprovedReviewWithThread_OffersNoResolveOrReopen

      - id: ReviewCenter-ReviewPage-Locked-SlotsNoControls
        title: >-
          The ReviewPage unit shall show no control to add, change, or remove a reviewer slot on a concluded review.
        justification: |
          The slots are part of the approval history and must not change after the conclusion.
        tests:
          - ReviewPage_Render_ApprovedReview_ShowsLockedBadgeBannerAndDisabledControls
          - ReviewPage_Render_ConcludedReview_ThreadsDefaultToAll

      - id: ReviewCenter-ReviewPage-Locked-SlotsNote
        title: >-
          The ReviewPage unit shall show on a concluded review the note that the reviewers cannot change.
        justification: |
          The reader learns why the controls for the slots are gone.
        tests:
          - ReviewPage_Render_ApprovedReview_ShowsLockedBadgeBannerAndDisabledControls

      - id: ReviewCenter-ReviewPage-Locked-ThreadsAll
        title: >-
          The ReviewPage unit shall list all threads, not only the open ones, at first on a concluded review.
        justification: |
          The history is what the reader wants on a settled review.
        tests:
          - ReviewPage_Render_ConcludedReview_ThreadsDefaultToAll

      - id: ReviewCenter-ReviewPage-Locked-Reading
        title: >-
          The ReviewPage unit shall keep selecting a file and reading the comments of its threads available on a
          concluded review.
        justification: |
          The lock must not hide the record.
        tests:
          - ReviewPage_Render_ApprovedReviewWithThread_HidesReplyBox

      - id: ReviewCenter-ReviewPage-ConclusionCard
        title: >-
          The ReviewPage unit shall show the review conclusion text in a card for everybody who can read the review.
        justification: |
          A rejection needs stated reasons, shown where the review is.
        tests:
          - ReviewPage_ConclusionCard_ReadOnlyUser_SeesTextWithoutEditor
          - ReviewPage_Render_ConcludedReview_ConclusionCardIsReadOnly

      - id: ReviewCenter-ReviewPage-ConclusionCard-EmptyState
        title: >-
          The ReviewPage unit shall show "No conclusion written." in the card when the conclusion text is blank and
          the viewer cannot write it.
        justification: |
          An empty card must say why it is empty.
        tests:
          - ReviewPage_ConclusionCard_ReadOnlyUserBlankText_ShowsEmptyState

      - id: ReviewCenter-ReviewPage-ConclusionCard-Write
        title: >-
          The ReviewPage unit shall let the primary reviewer of a slot write and save the conclusion text in the card.
        justification: |
          The person who signs must be able to write the reasons where the review is shown.
        tests:
          - ReviewPage_ConclusionCard_SlotOwnerSavesText_ShowsInCard

      - id: ReviewCenter-ReviewPage-ConclusionCard-AlternateWrite
        title: >-
          The ReviewPage unit shall let the alternate reviewer of a slot write and save the conclusion text in the
          card.
        justification: |
          The alternate signs in place of the primary reviewer, so the alternate must be able to write the reasons.
        tests:
          - ReviewPage_ConclusionCard_AlternateSavesText_ShowsInCard

      - id: ReviewCenter-ReviewPage-ConclusionCard-Warning
        title: >-
          The ReviewPage unit shall show, before a change of the text that would make a current signature out of date,
          a confirmation that names the signers concerned.
        justification: |
          The text is part of the record that the signatures cover, so the reader must know whose signature a change
          withdraws.
        tests:
          - ReviewPage_ConclusionCard_ChangeAfterSignature_AsksForConfirmation

      - id: ReviewCenter-ReviewPage-ConclusionCard-ConfirmSave
        title: >-
          The ReviewPage unit shall store a changed text that carries such a confirmation only after the user
          confirms.
        justification: |
          The reader decides whether to withdraw the signature.
        tests:
          - ReviewPage_ConclusionCard_ChangeAfterSignature_AsksForConfirmation

      - id: ReviewCenter-ReviewPage-ConclusionCard-NoEditor
        title: >-
          The ReviewPage unit shall show the text without an editor to a viewer who owns no slot.
        justification: |
          Only the reviewers of the slots write the conclusion.
        tests:
          - ReviewPage_ConclusionCard_ReadOnlyUser_SeesTextWithoutEditor

      - id: ReviewCenter-ReviewPage-ConclusionCard-Concluded
        title: >-
          The ReviewPage unit shall show the text without an editor on a concluded review, even to the owner of a
          slot.
        justification: |
          A concluded review cannot be changed.
        tests:
          - ReviewPage_Render_ConcludedReview_ConclusionCardIsReadOnly

      - id: ReviewCenter-ReviewPage-ConclusionCard-Refusal
        title: >-
          The ReviewPage unit shall show the message of the rule when the service refuses a change of the text.
        justification: |
          The user must learn why the text was not stored.
        tests:
          - ReviewPage_ConclusionCard_ServiceRefuses_ShowsRuleMessage

      - id: ReviewCenter-ReviewPage-Reopen
        title: >-
          The ReviewPage unit shall show to a system administrator, on a review that is locked, a form with a field for
          the reason and a button that reopens the review.
        justification: |
          Reopening is the one way out of the lock, so it is offered to those who may use it and asks for the reason
          that the history keeps.
        tests:
          - ReviewPage_Reopen_AdminWithReason_ReturnsToInReviewAndShowsHistory

      - id: ReviewCenter-ReviewPage-Reopen-ProjectAdmin
        title: >-
          The ReviewPage unit shall show the reopen form on a locked review to an administrator of the project who is
          not a system administrator.
        justification: |
          The administrator of the project must be able to reopen the reviews of the project.
        tests:
          - ReviewPage_Render_ApprovedReviewProjectAdmin_ShowsReopenForm

      - id: ReviewCenter-ReviewPage-Reopen-NobodyElse
        title: >-
          The ReviewPage unit shall show the reopen form to nobody else.
        justification: |
          Users who may not reopen a review must not be offered an action that is refused.
        tests:
          - ReviewPage_Render_ApprovedReviewNonAdmin_HidesReopenForm

      - id: ReviewCenter-ReviewPage-Reopen-ReasonLimit
        title: >-
          The ReviewPage unit shall limit the field for the reason of a reopening to 250 characters.
        justification: |
          The history keeps the reason, so its size is bounded.
        tests:
          - ReviewPage_Render_ReopenForm_LimitsTheReasonLength

      - id: ReviewCenter-ReviewPage-Reopen-Refusal
        title: >-
          The ReviewPage unit shall show the message of the rule when the service refuses to reopen the review, for
          example for an empty reason.
        justification: |
          The administrator must learn what to correct.
        tests:
          - ReviewPage_Reopen_EmptyReason_ShowsError

      - id: ReviewCenter-ReviewPage-Reopen-StaysLocked
        title: >-
          The ReviewPage unit shall keep the review locked and record no reopening when the service refuses to reopen
          it.
        justification: |
          A refusal must change nothing.
        tests:
          - ReviewPage_Reopen_EmptyReason_ShowsError

      - id: ReviewCenter-ReviewPage-Reopen-InReview
        title: >-
          The ReviewPage unit shall show the review as In review, without the Locked badge and banner, after a
          reopening.
        justification: |
          The page must show the new state at once.
        tests:
          - ReviewPage_Reopen_AdminWithReason_ReturnsToInReviewAndShowsHistory

      - id: ReviewCenter-ReviewPage-Reopen-History
        title: >-
          The ReviewPage unit shall list each reopening with who reopened the review, when, the reason, and the short
          digest of the approved record.
        justification: |
          Every reader of the review can see that an approval was reopened and why.
        tests:
          - ReviewPage_Reopen_AdminWithReason_ReturnsToInReviewAndShowsHistory

      - id: ReviewCenter-ReviewPage-Reopen-HistoryOrder
        title: >-
          The ReviewPage unit shall list the reopenings oldest first.
        justification: |
          The history reads in the order of the events.
        tests:
          - ReviewPage_Reopen_TwoReopenings_ListsOldestFirst

      - id: ReviewCenter-ReviewPage-Independence
        title: >-
          The ReviewPage unit shall leave the user who created the review out of the primary and the alternate choice
          lists of the add form while the project requires independent reviewers.
        justification: |
          Offering a choice that the service will refuse only leads to an error message.
        tests:
          - ReviewPage_Render_IndependenceOn_HidesAuthorFromCandidates

      - id: ReviewCenter-ReviewPage-Independence-AuthorHint
        title: >-
          The ReviewPage unit shall show to that user, in the Reviewers card, a hint that a different project member has
          to review and sign the review.
        justification: |
          The hint tells the author what to do instead of choosing the own name.
        tests:
          - ReviewPage_Render_IndependenceOn_HidesAuthorFromCandidates

      - id: ReviewCenter-ReviewPage-Independence-HintAuthorOnly
        title: >-
          The ReviewPage unit shall show that hint to no other user.
        justification: |
          Other users have nothing to do about the rule for the author.
        tests:
          - ReviewPage_Render_IndependenceOn_OtherMemberSeesNoHint

      - id: ReviewCenter-ReviewPage-Independence-Off
        title: >-
          The ReviewPage unit shall offer every user again, including the author, and show no hint while the project
          does not require independent reviewers.
        justification: |
          Whether reviewers must be independent of the author is the choice of the project.
        tests:
          - ReviewPage_Render_IndependenceOff_OffersTheAuthorAndShowsNoHint

      - id: ReviewCenter-ReviewPage-ReopenerBlocked
        title: >-
          The ReviewPage unit shall show to a user who occupies a slot and reopened the review, while the project does
          not let that person sign again, a notice that another reviewer must sign instead of the sign form.
        justification: |
          A user who cannot sign must see why.
        tests:
          - ReviewPage_Render_ReopenerOfTheReview_ShowsNoticeInsteadOfSignForm

      - id: ReviewCenter-ReviewPage-ReopenerBlocked-OtherOccupants
        title: >-
          The ReviewPage unit shall show the sign form and no such notice to every other occupant of the slot.
        justification: |
          The rule concerns the person who reopened the review only.
        tests:
          - ReviewPage_Render_ReopenerOfTheReview_ShowsNoticeInsteadOfSignForm

      - id: ReviewCenter-ReviewPage-ReopenerBlocked-RuleOff
        title: >-
          The ReviewPage unit shall show the sign form to the person who reopened the review when the project switched
          the rule off.
        justification: |
          Whether the person who reopened may sign again is the choice of the project.
        tests:
          - ReviewPage_Render_ReopenerOfTheReview_ShowsNoticeInsteadOfSignForm

      - id: ReviewCenter-ReviewPage-ReopenerBlocked-StrandRefusal
        title: >-
          The ReviewPage unit shall show the message of the rule in the reopen error when a reopening is refused
          because a slot would have nobody who may sign it.
        justification: |
          An administrator who is refused a reopening must learn what to do.
        tests:
          - ReviewPage_Reopen_WouldStrandSlot_ShowsMessageAndReopensNothing

      - id: ReviewCenter-ReviewPage-DueDate
        title: >-
          The ReviewPage unit shall show the due date of a review in its header as a calendar day in UTC.
        justification: |
          The date is only useful when everyone who reads the review sees it.
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc

      - id: ReviewCenter-ReviewPage-DueDate-NoDate
        title: >-
          The ReviewPage unit shall state in the header that the review has no due date when it has none.
        justification: |
          The absence of a date must be visible too.
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc

      - id: ReviewCenter-ReviewPage-DueDate-SaveDate
        title: >-
          The ReviewPage unit shall show the new date after the save button was pressed with a valid date.
        justification: |
          The user must see at once what was stored.
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused

      - id: ReviewCenter-ReviewPage-DueDate-ClearDate
        title: >-
          The ReviewPage unit shall remove the due date and state that there is none when the clear button is pressed.
        justification: |
          A date that was set by mistake or is no longer planned must be possible to take back.
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc

      - id: ReviewCenter-ReviewPage-DueDate-SystemAdminForm
        title: >-
          The ReviewPage unit shall show a form with a date field and buttons to save and to clear the date to a system
          administrator.
        justification: |
          Only the people in charge of the review may move the date.
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused

      - id: ReviewCenter-ReviewPage-DueDate-ProjectAdminForm
        title: >-
          The ReviewPage unit shall show the same form to an administrator of the project who is not a system
          administrator.
        justification: |
          Only the people in charge of the review may move the date.
        tests:
          - ReviewPage_DueDate_ProjectAdministrator_ShowsTheForm

      - id: ReviewCenter-ReviewPage-DueDate-CreatorForm
        title: >-
          The ReviewPage unit shall show the same form to the user who created the review.
        justification: |
          Only the people in charge of the review may move the date.
        tests:
          - ReviewPage_DueDate_CreatorMayEditAndOtherMemberMayNot

      - id: ReviewCenter-ReviewPage-DueDate-NoFormOthers
        title: >-
          The ReviewPage unit shall show the form to no other user.
        justification: |
          Only the people in charge of the review may move the date.
        tests:
          - ReviewPage_DueDate_CreatorMayEditAndOtherMemberMayNot

      - id: ReviewCenter-ReviewPage-DueDate-NoFormLocked
        title: >-
          The ReviewPage unit shall show the form to nobody on a review that is locked.
        justification: |
          A concluded review cannot change.
        tests:
          - ReviewPage_DueDate_ApprovedReview_IsNeverOverdueAndCannotBeEdited

      - id: ReviewCenter-ReviewPage-DueDate-BadText
        title: >-
          The ReviewPage unit shall show the message of the rule and store nothing when the typed text is not a date.
        justification: |
          The user must learn what to correct.
        tests:
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused

      - id: ReviewCenter-ReviewPage-DueDate-LockedRefusal
        title: >-
          The ReviewPage unit shall show the message of the rule when the service refuses a date because the review was
          concluded meanwhile.
        justification: |
          A page that is out of date must not fail silently.
        tests:
          - ReviewPage_DueDate_ApprovedMeanwhile_KeepsTheRefusalMessageAfterTheFormIsGone

      - id: ReviewCenter-ReviewPage-DueDate-RefusalKept
        title: >-
          The ReviewPage unit shall keep that message visible after the form is gone.
        justification: |
          The reload removes the form, but the explanation must not go with it.
        tests:
          - ReviewPage_DueDate_ApprovedMeanwhile_KeepsTheRefusalMessageAfterTheFormIsGone

      - id: ReviewCenter-ReviewPage-Overdue
        title: >-
          The ReviewPage unit shall show an Overdue badge next to the due date while the date is before today (UTC) and
          the review is not concluded.
        justification: |
          A reader must see at a glance that a review is late.
        tests:
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused
          - ReviewPage_DueDate_CreatorMayEditAndOtherMemberMayNot

      - id: ReviewCenter-ReviewPage-Overdue-TodayOrLater
        title: >-
          The ReviewPage unit shall show no Overdue badge for a due date that is today or later.
        justification: |
          A review is not late before its due day is over.
        tests:
          - ReviewPage_DueDate_TodayOrLater_ShowsNoOverdueBadge

      - id: ReviewCenter-ReviewPage-Overdue-Concluded
        title: >-
          The ReviewPage unit shall show no Overdue badge on a concluded review, approved or rejected.
        justification: |
          A concluded review has done its work, so calling it overdue would be wrong.
        tests:
          - ReviewPage_DueDate_ApprovedReview_IsNeverOverdueAndCannotBeEdited
          - ReviewPage_DueDate_RejectedConcluded_ShowsNoOverdueBadge

      - id: ReviewCenter-ReviewPage-Overdue-DateKept
        title: >-
          The ReviewPage unit shall keep showing the due date of a concluded review.
        justification: |
          The date stays as the record of what was planned.
        tests:
          - ReviewPage_DueDate_ApprovedReview_IsNeverOverdueAndCannotBeEdited

      - id: ReviewCenter-ReviewPage-FollowUp
        title: >-
          The ReviewPage unit shall show on a review that follows another a link to the followed review.
        justification: |
          A reader of a follow-up must see where its answers and threads came from.
        tests:
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-ReviewPage-FollowUp-Counts
        title: >-
          The ReviewPage unit shall show next to that link the number of answers and of threads that were carried.
        justification: |
          The reader sees how much was taken over from the followed review.
        tests:
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-ReviewPage-FollowUp-FollowedBy
        title: >-
          The ReviewPage unit shall show on a review that is followed a list of the reviews that follow it, each with a
          link.
        justification: |
          A reader of the earlier review must find the review that took over.
        tests:
          - ReviewPage_Render_FollowedReview_ListsFollowUpsAndShowsNoFollowsLine

      - id: ReviewCenter-ReviewPage-FollowUp-CarriedMark
        title: >-
          The ReviewPage unit shall mark each carried thread, and no thread of the review's own, with a link to the
          review it came from.
        justification: |
          Nothing carried can be mistaken for something that was said in this review.
        tests:
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-ReviewPage-FollowUp-Standalone
        title: >-
          The ReviewPage unit shall show no follows line, no list of follow-ups, and no carried mark on a review that
          neither follows nor is followed.
        justification: |
          These lines are information about a relation between reviews, so they must not appear where there is none.
        tests:
          - ReviewPage_Render_StandaloneReview_ShowsNoFollowUpInformation

      - id: ReviewCenter-ReviewPage-UnreadMarkers
        title: >-
          The ReviewPage unit shall mark a thread with a New badge when it holds a comment of somebody else that is
          newer than the last comment the user has seen.
        justification: |
          A reader who returns to a review wants to see what was said since the last visit without reading all of it
          again.
        tests:
          - ReviewPage_Render_FirstVisit_ShowsUnreadDotsForCommentsByOthers

      - id: ReviewCenter-ReviewPage-UnreadMarkers-Index
        title: >-
          The ReviewPage unit shall show the New badge also on the row of such a thread in the thread index.
        justification: |
          The reader finds the new discussion without opening every file.
        tests:
          - ReviewPage_Render_FirstVisit_ShowsUnreadDotsForCommentsByOthers

      - id: ReviewCenter-ReviewPage-UnreadMarkers-Summary
        title: >-
          The ReviewPage unit shall give the number of comments that are new to the user in the summary of the
          review.
        justification: |
          The reader sees the size of what is new at a glance.
        tests:
          - ReviewPage_Render_FirstVisit_ShowsUnreadDotsForCommentsByOthers
          - ReviewPage_Render_CommentPostedAfterTheLoadStarted_IsNotStoredAsSeen

      - id: ReviewCenter-ReviewPage-UnreadMarkers-OwnComments
        title: >-
          The ReviewPage unit shall show no New badge for the comments of the user.
        justification: |
          Nobody needs news of what they wrote themselves.
        tests:
          - ReviewPage_Render_OwnComments_ShowNoDot

      - id: ReviewCenter-ReviewPage-UnreadMarkers-LaterVisit
        title: >-
          The ReviewPage unit shall show no New badge on a later visit when nothing was added since the last visit.
        justification: |
          The markers show what is new, not what is old.
        tests:
          - ReviewPage_Render_AfterLiveRender_UpsertsLastSeen_AndSecondVisitShowsNoDots

      - id: ReviewCenter-ReviewPage-MarkSeen
        title: >-
          The ReviewPage unit shall store the newest comment shown, with its time, as seen after the page was shown
          in the live session.
        justification: |
          Only a page that was rendered counts as seen.
        tests:
          - ReviewPage_Render_AfterLiveRender_UpsertsLastSeen_AndSecondVisitShowsNoDots

      - id: ReviewCenter-ReviewPage-MarkSeen-Baseline
        title: >-
          The ReviewPage unit shall read what the user has seen before it shows the review and mark the threads
          against it.
        justification: |
          The badges must show the state of the previous visit, so what was seen is read first.
        tests:
          - ReviewPage_Render_ParameterChangeToOtherReview_ReloadsBaselineAndMarksSeen
          - ReviewPage_Render_CommentPostedAfterTheLoadStarted_IsNotStoredAsSeen

      - id: ReviewCenter-ReviewPage-MarkSeen-LoadStart
        title: >-
          The ReviewPage unit shall store as seen only comments written up to the time the loading began.
        justification: |
          A comment posted while the page loads was not shown and must stay new.
        tests:
          - ReviewPage_Render_CommentPostedAfterTheLoadStarted_IsNotStoredAsSeen

      - id: ReviewCenter-ReviewPage-MarkSeen-ParameterChange
        title: >-
          The ReviewPage unit shall store what was seen again when the page is changed to another review.
        justification: |
          The other review was shown too, so it must count as seen.
        tests:
          - ReviewPage_Render_ParameterChangeToOtherReview_ReloadsBaselineAndMarksSeen

      - id: ReviewCenter-ReviewPage-MarkSeen-NoAccess
        title: >-
          The ReviewPage unit shall store nothing as seen for a user who may not see the review.
        justification: |
          A user without access must leave no trace.
        tests:
          - ReviewPage_Render_NoViewAccess_WritesNoState

      - id: ReviewCenter-ReviewPage-BallotMasking
        title: >-
          The ReviewPage unit shall show a member without a slot of a review with several slots a note that the
          checklist standing stays hidden until the own ballot is handed in.
        justification: |
          The review page summarizes the same ballots as the checklist, so it must follow the same rule or it would
          give the hidden answers away.
        tests:
          - ReviewPage_MemberWithoutSlot_ShowsChecklistStandingHidden

      - id: ReviewCenter-ReviewPage-BallotMasking-OwnProgress
        title: >-
          The ReviewPage unit shall show a slot owner who has not handed in a ballot only the progress of the own
          checklist and no count of failed checks.
        justification: |
          The own work is visible, while the work of the other reviewers stays hidden.
        tests:
          - ReviewPage_HiddenViewer_SlotOwner_ShowsOwnChecklistProgressOnly

      - id: ReviewCenter-ReviewPage-BallotMasking-CheckThreads
        title: >-
          The ReviewPage unit shall show no discussion about a check to a viewer who may not see the answers of the
          others.
        justification: |
          The title or the text of such a discussion would give the hidden answers away.
        tests:
          - ReviewPage_HiddenViewer_ShowsNoStandingConclusionOrCheckThreads

      - id: ReviewCenter-ReviewPage-BallotMasking-ThreadCount
        title: >-
          The ReviewPage unit shall count no discussion about a check in the number of open threads that a viewer
          who may not see the answers of the others is shown.
        justification: |
          A count would give the hidden answers away.
        tests:
          - ReviewPage_HiddenViewer_ShowsNoStandingConclusionOrCheckThreads

      - id: ReviewCenter-ReviewPage-BallotMasking-Conclusion
        title: >-
          The ReviewPage unit shall show a viewer who may not see the answers of the others the notice that the
          conclusion is hidden instead of the conclusion text.
        justification: |
          The conclusion text may name the hidden answers.
        tests:
          - ReviewPage_HiddenViewer_ShowsNoStandingConclusionOrCheckThreads
          - ReviewPage_MemberWithoutSlot_ShowsChecklistStandingHidden

      - id: ReviewCenter-ReviewPage-BallotMasking-Administrator
        title: >-
          The ReviewPage unit shall show a system administrator the discussions about checks with their count and
          the conclusion, without the notice that they are hidden.
        justification: |
          An administrator steers the review and must see all of it.
        tests:
          - ReviewPage_Administrator_SeesCheckThreadsAndConclusion

      - id: ReviewCenter-ReviewPage-ThreadKinds
        title: >-
          The ReviewPage unit shall show a Question with a neutral speech-bubble icon and the visible word Question.
        justification: |
          A Question is conversation, so the reader must recognize it at a glance.
        tests:
          - ThreadKindBadge_Question_ShowsIconAndLabel

      - id: ReviewCenter-ReviewPage-ThreadKinds-Finding
        title: >-
          The ReviewPage unit shall show a Finding with an amber flag icon and the visible word Finding.
        justification: |
          A Finding goes into the report, so the reader must recognize it at a glance.
        tests:
          - ThreadKindBadge_Finding_ShowsFlagLabelAndInReportBadge

      - id: ReviewCenter-ReviewPage-ThreadKinds-InReport
        title: >-
          The ReviewPage unit shall show an In report badge on a Finding.
        justification: |
          The reader sees which content the report will hold.
        tests:
          - ThreadKindBadge_Finding_ShowsFlagLabelAndInReportBadge

      - id: ReviewCenter-ReviewPage-ThreadKinds-DistinctIcons
        title: >-
          The ReviewPage unit shall use a different icon for a Question and for a Finding.
        justification: |
          The reader tells the two kinds apart at a glance.
        tests:
          - ThreadKindBadge_Kinds_UseDifferentIcons

      - id: ReviewCenter-ReviewPage-ThreadKinds-Card
        title: >-
          The ReviewPage unit shall show the kind badge of a thread in its thread card.
        justification: |
          The kind is read where the thread is read.
        tests:
          - ThreadCard_Question_ShowsQuestionBadgeAndChatBubbles
          - ThreadCard_Finding_ShowsFindingBadgeAndInReportMarkOnStartingComment

      - id: ReviewCenter-ReviewPage-ThreadKinds-CheckCard
        title: >-
          The ReviewPage unit shall show the kind badge of a thread about a check in the card of check discussions.
        justification: |
          The kind is read where the discussion about a check is read.
        tests:
          - ReviewPage_CheckThread_ShowsKindBadgeAndPromote

      - id: ReviewCenter-ReviewPage-ThreadKinds-DiffMarkers
        title: >-
          The ReviewPage unit shall mark a diff row that has threads with one marker per kind, a gray bubble for
          questions and an amber flag for findings.
        justification: |
          The reader sees where the discussion is and of which kind it is.
        tests:
          - DiffView_Markers_UseDifferentIconPerKind

      - id: ReviewCenter-ReviewPage-ThreadKinds-MarkerCount
        title: >-
          The ReviewPage unit shall show the number of threads of its kind on every diff marker.
        justification: |
          A count says more than a dot.
        tests:
          - DiffView_Markers_MixedRow_ShowsBothKindsWithCounts
          - ThreadKindBadge_Compact_NamesKindAndCount

      - id: ReviewCenter-ReviewPage-ThreadKinds-MarkerName
        title: >-
          The ReviewPage unit shall give every diff marker a title and an accessible name such as 2 questions or
          1 finding.
        justification: |
          Icons are hidden from assistive technology, so every marker carries its meaning as text.
        tests:
          - ThreadKindBadge_Compact_NamesKindAndCount

      - id: ReviewCenter-ReviewPage-ThreadKinds-MixedRow
        title: >-
          The ReviewPage unit shall show both markers, each with its count, on a diff row that has threads of both
          kinds.
        justification: |
          A row must not hide one of its kinds.
        tests:
          - DiffView_Markers_MixedRow_ShowsBothKindsWithCounts

      - id: ReviewCenter-ReviewPage-ThreadKinds-NoMarker
        title: >-
          The ReviewPage unit shall show no marker on a diff row without threads.
        justification: |
          A marker must always mean that there is a discussion.
        tests:
          - DiffView_Markers_NoThreads_NoMarkers

      - id: ReviewCenter-ReviewPage-ThreadKinds-NotColorAlone
        title: >-
          The ReviewPage unit shall give every kind marker a visible word or accessible name and hide its icon from
          assistive technology, so that no kind rests on the icon or the color alone.
        justification: |
          Color and icons must not carry a meaning alone.
        tests:
          - ReviewPage_KindMarkers_EveryMarkerHasTextLabel
          - DiffView_Markers_EveryMarkerHasTextNameAndHiddenIcon

      - id: ReviewCenter-ReviewPage-ThreadComposer
        title: >-
          The ReviewPage unit shall offer, wherever a new thread is started, a choice between Question and Finding
          with Question chosen by default.
        justification: |
          The kind is decided when the thread is written, so the form makes the choice plain and makes Question the
          harmless default.
        tests:
          - ThreadComposer_DefaultsToQuestion

      - id: ReviewCenter-ReviewPage-ThreadComposer-Finding
        title: >-
          The ReviewPage unit shall start the new thread as a Finding when the reader chooses Finding.
        justification: |
          The kind chosen when the thread is written decides what goes into the report.
        tests:
          - ThreadComposer_FindingChoice_StartsFindingThread

      - id: ReviewCenter-ReviewPage-ThreadComposer-SingleSlot
        title: >-
          The ReviewPage unit shall offer the choice between Question and Finding also in a review with a single
          slot.
        justification: |
          A review with a single slot needs Findings too.
        tests:
          - ReviewPage_SingleSlot_KindChoiceStillAvailable

      - id: ReviewCenter-ReviewPage-ThreadComposer-Check
        title: >-
          The ReviewPage unit shall start a discussion about a check from the status panel as a Finding when the
          reader chooses Finding.
        justification: |
          The choice must exist where a check is discussed as well.
        tests:
          - ReviewStatusPanel_DisputedCheck_DiscussAsFindingAfterSignature_WarnsThenStoresOnConfirm

      - id: ReviewCenter-ReviewPage-ThreadComposer-ReplyReport
        title: >-
          The ReviewPage unit shall offer in the reply box an Add to report check box that includes the reply in
          the report when it is ticked.
        justification: |
          A reply that matters for the report must be addable without leaving the box.
        tests:
          - ThreadComposer_ReplyAddToReport_SetsIncludeInReport

      - id: ReviewCenter-ReviewPage-ThreadComposer-ReplyChat
        title: >-
          The ReviewPage unit shall treat a reply as chat that is not part of the report unless the Add to report
          check box is ticked.
        justification: |
          Chat must not change the report.
        tests:
          - ThreadComposer_ReplyAddToReport_SetsIncludeInReport

      - id: ReviewCenter-ReviewPage-ThreadComposer-Error
        title: >-
          The ReviewPage unit shall show a rule violation of a new thread or of a reply as an alert in the composer.
        justification: |
          The reader must notice that the thread or the reply was refused.
        tests:
          - ThreadComposer_Error_IsShownAsAlert

      - id: ReviewCenter-ReviewPage-ThreadActions
        title: >-
          The ReviewPage unit shall show the button that makes a Question a Finding in a thread card only to a
          person who may use it.
        justification: |
          The page must not offer what the rules would refuse.
        tests:
          - ThreadCard_PromoteVisibleForSlotOwner_HiddenForAuditor
          - ReviewPage_CheckThread_ShowsKindBadgeAndPromote

      - id: ReviewCenter-ReviewPage-ThreadActions-Demote
        title: >-
          The ReviewPage unit shall show the button that makes a Finding a Question in a thread card only to a
          person who may use it.
        justification: |
          The page must not offer what the rules would refuse.
        tests:
          - ThreadCard_DemoteHiddenForNonStarterNonLead

      - id: ReviewCenter-ReviewPage-ThreadActions-ReportToggle
        title: >-
          The ReviewPage unit shall show the button that adds a reply to the report or takes it out only to a
          person who may use it.
        justification: |
          The page must not offer what the rules would refuse.
        tests:
          - ThreadCard_ReplyReportToggle_OnlyAuthorOrLead

      - id: ReviewCenter-ReviewPage-ThreadActions-ReplyReport
        title: >-
          The ReviewPage unit shall add a reply to the report or take it out again when the person uses that
          button.
        justification: |
          The content of the report is chosen on the page.
        tests:
          - ReviewPage_ReplyReportToggle_AddsAndRemovesReplyFromReport

      - id: ReviewCenter-ReviewPage-ThreadActions-Auditor
        title: >-
          The ReviewPage unit shall show an auditor the kind of every thread but no action on a thread.
        justification: |
          An auditor only reads.
        tests:
          - ReviewPage_Auditor_SeesKindsButNoThreadActions

      - id: ReviewCenter-ReviewPage-ThreadActions-Concluded
        title: >-
          The ReviewPage unit shall show no action on a thread after the review is concluded.
        justification: |
          A concluded review is locked.
        tests:
          - ReviewPage_Concluded_ThreadActionsAbsent

      - id: ReviewCenter-ReviewPage-ThreadActions-ChatBubble
        title: >-
          The ReviewPage unit shall show the comments of a Question as chat bubbles.
        justification: |
          A Question is conversation.
        tests:
          - ThreadCard_Question_ShowsQuestionBadgeAndChatBubbles

      - id: ReviewCenter-ReviewPage-ThreadActions-InReportMark
        title: >-
          The ReviewPage unit shall show the starting comment of a Finding with an In report mark.
        justification: |
          The reader sees which content goes into the report.
        tests:
          - ThreadCard_Finding_ShowsFindingBadgeAndInReportMarkOnStartingComment

      - id: ReviewCenter-ReviewPage-ThreadActions-NoteFinding
        title: >-
          The ReviewPage unit shall ask for a resolution note when a Finding is resolved and refuse a blank note
          with a message.
        justification: |
          The note says why a Finding is closed.
        tests:
          - ResolveNoteDialog_Finding_RequiresNote
          - ThreadCard_ResolveFinding_AsksForNoteThenReopens

      - id: ReviewCenter-ReviewPage-ThreadActions-NoteQuestion
        title: >-
          The ReviewPage unit shall let a Question be resolved with or without a note.
        justification: |
          A Question needs no justification.
        tests:
          - ResolveNoteDialog_Question_NoteOptional

      - id: ReviewCenter-ReviewPage-ThreadActions-NoteCancel
        title: >-
          The ReviewPage unit shall hand over no note and tell the card when the person cancels the resolution
          note.
        justification: |
          The person may change their mind.
        tests:
          - ResolveNoteDialog_Cancel_HandsOverNothing

      - id: ReviewCenter-ReviewPage-ThreadActions-SignatureWarning
        title: >-
          The ReviewPage unit shall ask for a confirmation that names the signers whose signatures a change makes
          stale before that change is made.
        justification: |
          Moving content into or out of the report asks the signers to sign again, so the person must know it.
        tests:
          - ReviewPage_Promote_AfterSignature_ShowsSignatureImpactAndAudits
          - ReviewPage_Demote_AfterSignature_NamesAffectedSigners
          - ReviewPage_ResolveFinding_AfterSignature_CancelKeepsTheTypedNote

      - id: ReviewCenter-ReviewPage-ThreadActions-CancelStoresNothing
        title: >-
          The ReviewPage unit shall store nothing when the person cancels that confirmation.
        justification: |
          A decision that changes the report must be a deliberate one.
        tests:
          - ReviewPage_Promote_AfterSignature_ShowsSignatureImpactAndAudits
          - ReviewPage_ResolveFinding_AfterSignature_CancelKeepsTheTypedNote

      - id: ReviewCenter-ReviewPage-ThreadActions-KeepNote
        title: >-
          The ReviewPage unit shall keep the typed resolution note while the confirmation is cancelled and store
          it when the change is confirmed.
        justification: |
          The reader does not have to type the note again.
        tests:
          - ReviewPage_ResolveFinding_AfterSignature_CancelKeepsTheTypedNote

      - id: ReviewCenter-ReviewPage-ThreadKindIndex
        title: >-
          The ReviewPage unit shall let the reader filter the index of threads by kind: Both kinds, Questions or
          Findings.
        justification: |
          A reader who prepares the report wants the findings first, and a reader who answers wants the questions.
        tests:
          - ReviewPage_ThreadIndex_FiltersByKindWithCounts

      - id: ReviewCenter-ReviewPage-ThreadKindIndex-KindCounts
        title: >-
          The ReviewPage unit shall show the number of threads next to each kind choice.
        justification: |
          The reader sees the size of each view before choosing it.
        tests:
          - ReviewPage_ThreadIndex_FiltersByKindWithCounts

      - id: ReviewCenter-ReviewPage-ThreadKindIndex-Combined
        title: >-
          The ReviewPage unit shall apply the kind filter and the state filter of the index together.
        justification: |
          The open findings are the view that a reader who prepares the report needs.
        tests:
          - ReviewPage_ThreadIndex_FiltersByKindWithCounts

      - id: ReviewCenter-ReviewPage-ThreadKindIndex-StateCounts
        title: >-
          The ReviewPage unit shall show on the state filter buttons the number of threads of the chosen kind.
        justification: |
          The counts must match the list that they filter.
        tests:
          - ReviewPage_ThreadIndex_FiltersByKindWithCounts

      - id: ReviewCenter-ReviewPage-ThreadKindIndex-Badge
        title: >-
          The ReviewPage unit shall show the kind badge in every row of the index of threads.
        justification: |
          The kind is read without opening the thread.
        tests:
          - ReviewPage_ThreadIndex_FiltersByKindWithCounts

      - id: ReviewCenter-ReviewPage-ThreadKindIndex-SummaryQuestions
        title: >-
          The ReviewPage unit shall show the number of open questions in the summary strip.
        justification: |
          A reader who answers wants to see the open questions.
        tests:
          - ReviewPage_SummaryStrip_ShowsQuestionAndFindingCounts

      - id: ReviewCenter-ReviewPage-ThreadKindIndex-SummaryFindings
        title: >-
          The ReviewPage unit shall show the number of open findings in the summary strip.
        justification: |
          A reader who prepares the report wants to see the open findings.
        tests:
          - ReviewPage_SummaryStrip_ShowsQuestionAndFindingCounts

      - id: ReviewCenter-ReviewPage-ConclusionFindings
        title: >-
          The ReviewPage unit shall list the findings that are in the report on the conclusion card with their text
          and state and the resolution note of a resolved one, and no chat thread.
        justification: |
          The conclusion is the record that the review leaves behind, so it must say which findings were closed how.
        tests:
          - ReviewPage_ConclusionCard_Rejected_ShowsOutcomeTextFindingsAndSigners
          - ReviewPage_ConclusionCard_InProgress_ShowsEmptyStateAndOpenFindings

      - id: ReviewCenter-ReviewPage-ConclusionFindings-Outcome
        title: >-
          The ReviewPage unit shall show the outcome of a concluded review on the conclusion card as an icon that
          is hidden from assistive technology and as a word.
        justification: |
          The outcome must not depend on color.
        tests:
          - ReviewPage_ConclusionCard_Rejected_ShowsOutcomeTextFindingsAndSigners
          - ReviewPage_ConclusionCard_Approved_ShowsApprovedOutcomeWithoutFindings

      - id: ReviewCenter-ReviewPage-ConclusionFindings-Text
        title: >-
          The ReviewPage unit shall show the conclusion text on the card of a concluded review.
        justification: |
          The record says why the outcome was decided.
        tests:
          - ReviewPage_ConclusionCard_Rejected_ShowsOutcomeTextFindingsAndSigners

      - id: ReviewCenter-ReviewPage-ConclusionFindings-Signers
        title: >-
          The ReviewPage unit shall show the signers with the time they signed on the card of a concluded review.
        justification: |
          The record says who decided and when.
        tests:
          - ReviewPage_ConclusionCard_Rejected_ShowsOutcomeTextFindingsAndSigners
          - ReviewPage_ConclusionCard_Approved_ShowsApprovedOutcomeWithoutFindings

      - id: ReviewCenter-ReviewPage-ConclusionFindings-NoFindings
        title: >-
          The ReviewPage unit shall show no list of findings on the conclusion card when no Finding is in the
          report.
        justification: |
          An empty list would look like missing content.
        tests:
          - ReviewPage_ConclusionCard_Approved_ShowsApprovedOutcomeWithoutFindings

      - id: ReviewCenter-ReviewPage-ConclusionFindings-InProgress
        title: >-
          The ReviewPage unit shall show no outcome and no signers on the conclusion card of a review that is not
          concluded.
        justification: |
          Nothing is decided yet.
        tests:
          - ReviewPage_ConclusionCard_InProgress_ShowsEmptyStateAndOpenFindings

      - id: ReviewCenter-ReviewPage-ConclusionFindings-Empty
        title: >-
          The ReviewPage unit shall show the empty state "No conclusion written." on the conclusion card to a
          viewer who may not write the conclusion while none is written.
        justification: |
          The card must not look broken while the conclusion is still to be written.
        tests:
          - ReviewPage_ConclusionCard_InProgress_ShowsEmptyStateAndOpenFindings

      - id: ReviewCenter-ReviewPage-ConclusionFindings-Masked
        title: >-
          The ReviewPage unit shall show no finding, no outcome, no signer and no empty state on the conclusion
          card of a viewer who may not see the answers of the others.
        justification: |
          The card must not give away hidden ballots.
        tests:
          - ReviewPage_ConclusionCard_MaskedViewer_ShowsNoticeOnly

      - id: ReviewCenter-ReviewPage-StatusPanel
        title: >-
          The ReviewPage unit shall show at the top of the page a "Where are we?" panel that lists each reviewer
          with the state of the ballot: Not started, Draft or Handed in.
        justification: |
          A reviewer opens the page to learn who is done.
        tests:
          - ReviewStatusPanel_ShowsReviewerBallotAndSignedStates

      - id: ReviewCenter-ReviewPage-StatusPanel-Signature
        title: >-
          The ReviewPage unit shall show in the "Where are we?" panel for each reviewer whether the review is
          Signed or Not signed by that reviewer.
        justification: |
          A reviewer sees who still has to sign.
        tests:
          - ReviewStatusPanel_ShowsReviewerBallotAndSignedStates
          - ReviewStatusPanel_AfterSigning_PanelAndNextStepAgree

      - id: ReviewCenter-ReviewPage-StatusPanel-Disputed
        title: >-
          The ReviewPage unit shall list in the "Where are we?" panel the checks that the reviewers answered
          differently.
        justification: |
          A disagreement between reviewers must be settled by discussion, so it is shown.
        tests:
          - ReviewStatusPanel_DisputedCheck_DiscussStartsThread
          - ReviewStatusPanel_DisputedCheck_ShowsAnswersAndOtherReviewersJustification

      - id: ReviewCenter-ReviewPage-StatusPanel-Discuss
        title: >-
          The ReviewPage unit shall offer a Discuss button on a disputed check that starts a discussion about the
          check, and remove the button once the discussion exists.
        justification: |
          Reviewers settle a dispute from the panel without searching for the place to start a discussion.
        tests:
          - ReviewStatusPanel_DisputedCheck_DiscussStartsThread

      - id: ReviewCenter-ReviewPage-StatusPanel-DiscussWarning
        title: >-
          The ReviewPage unit shall show the signature warning in the form first when starting the discussion would
          make a signature stale.
        justification: |
          Signers must know that they will have to sign again.
        tests:
          - ReviewStatusPanel_DisputedCheck_DiscussAsFindingAfterSignature_WarnsThenStoresOnConfirm

      - id: ReviewCenter-ReviewPage-StatusPanel-DiscussConfirm
        title: >-
          The ReviewPage unit shall store that discussion only when the signature warning is confirmed.
        justification: |
          Nothing may change the report without a deliberate decision.
        tests:
          - ReviewStatusPanel_DisputedCheck_DiscussAsFindingAfterSignature_WarnsThenStoresOnConfirm

      - id: ReviewCenter-ReviewPage-StatusPanel-DiscussCancel
        title: >-
          The ReviewPage unit shall store nothing and keep the typed text in the form when the signature warning is
          cancelled.
        justification: |
          The reader may change their mind without losing the typed text.
        tests:
          - ReviewStatusPanel_DisputedCheck_DiscussWarningCancel_StoresNothing

      - id: ReviewCenter-ReviewPage-StatusPanel-OpenCounts
        title: >-
          The ReviewPage unit shall show in the "Where are we?" panel the number of open questions and of open
          findings, each with its kind icon and word.
        justification: |
          The panel answers what is still open.
        tests:
          - ReviewStatusPanel_ShowsQuestionAndFindingCounts

      - id: ReviewCenter-ReviewPage-StatusPanel-NextAction
        title: >-
          The ReviewPage unit shall show in the "Where are we?" panel exactly one next action, a button or a
          sentence, for the viewer.
        justification: |
          A reviewer opens the page to learn what to do next.
        tests:
          - ReviewStatusPanel_ShowsExactlyOneNextActionButton

      - id: ReviewCenter-ReviewPage-StatusPanel-Hidden
        title: >-
          The ReviewPage unit shall show a viewer who may not see the answers of the others a notice that the rest
          stays hidden until the own ballot is handed in.
        justification: |
          Independent judgment stays intact only when the answers of the others stay hidden.
        tests:
          - ReviewStatusPanel_MaskedViewer_HidesDisputes

      - id: ReviewCenter-ReviewPage-StatusPanel-HiddenDisputes
        title: >-
          The ReviewPage unit shall show a viewer who may not see the answers of the others no disputed check and
          no Discuss button.
        justification: |
          A dispute would give the hidden answers away.
        tests:
          - ReviewStatusPanel_MaskedViewer_HidesDisputes

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance
        title: >-
          The ReviewPage unit shall show in the "Where are we?" panel, to a viewer who may see the answers of the
          others, who answered what to each disputed check.
        justification: |
          A reviewer who sees "Different answers" wants to know the other answer.
        tests:
          - ReviewStatusPanel_DisputedCheck_ShowsAnswersAndOtherReviewersJustification

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-Justification
        title: >-
          The ReviewPage unit shall show with a disputed check the justification of the other reviewer and never
          that of the viewer.
        justification: |
          The reason of the other reviewer is what settles the dispute.
        tests:
          - ReviewStatusPanel_DisputedCheck_ShowsAnswersAndOtherReviewersJustification

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-PlainText
        title: >-
          The ReviewPage unit shall show the justification of the other reviewer as plain text.
        justification: |
          Nothing typed by a reviewer can change the page.
        tests:
          - ReviewStatusPanel_DisputedCheck_ShowsAnswersAndOtherReviewersJustification

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-Outcome
        title: >-
          The ReviewPage unit shall state in plain words that the review will be Rejected, and which check the
          reviewers failed, when all reviewers failed a check.
        justification: |
          The reviewer is not left to guess the outcome.
        tests:
          - ReviewStatusPanel_BothFailed_NamesTheOutcome

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-Caution
        title: >-
          The ReviewPage unit shall caution a viewer who is about to sign, naming the reviewers who have not handed
          in a ballot.
        justification: |
          Signing early may mean signing again.
        tests:
          - ReviewStatusPanel_EarlySigning_ShowsCautionNamingTheMissingReviewer

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-SignatureLost
        title: >-
          The ReviewPage unit shall tell a reviewer whose signature no longer counts so in plain words, and tell
          nobody else.
        justification: |
          The reviewer is told what to do about the lost signature.
        tests:
          - ReviewStatusPanel_SignatureLost_StatedToTheSigner

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-AskerWaits
        title: >-
          The ReviewPage unit shall show the person who asked an open question a sentence that says whom they
          wait for, instead of a button, while the other reviewer is still asked to answer.
        justification: |
          The asker must not be told to answer their own question.
        tests:
          - ReviewStatusPanel_OwnQuestion_AskerWaitsAndOtherPartyAnswers

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-OtherParty
        title: >-
          The ReviewPage unit shall show the reviewer who is asked a link to answer the open questions.
        justification: |
          The person who is asked knows what to do.
        tests:
          - ReviewStatusPanel_OwnQuestion_AskerWaitsAndOtherPartyAnswers

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-AfterSigning
        title: >-
          The ReviewPage unit shall say to a reviewer who signed whom the review waits for, in the same meaning as
          the next-step line.
        justification: |
          Two lines of the same panel must not disagree.
        tests:
          - ReviewStatusPanel_AfterSigning_PanelAndNextStepAgree

      - id: ReviewCenter-ReviewPage-StatusPanelGuidance-Masked
        title: >-
          The ReviewPage unit shall show none of the answers, the failed checks, the outcome or the caution to a
          viewer who has not handed in a ballot.
        justification: |
          The answers and the outcome are content of the ballots and follow the visibility rule of the ballots.
        tests:
          - ReviewStatusPanel_MaskedViewer_NoAnswersNoOutcomeNoCaution

      - id: ReviewCenter-ReviewPage-ChangesSinceSigning
        title: >-
          The ReviewPage unit shall show a reviewer whose signature no longer matches the report the words
          "Signed, then the review changed".
        justification: |
          "Out of date" tells nobody what to do, so the status says in plain words what happened.
        tests:
          - ReviewPage_SignedThenChanged_ExplainsWhatChanged
          - ReviewPage_NoJargonOutOfDateText

      - id: ReviewCenter-ReviewPage-ChangesSinceSigning-NoJargon
        title: >-
          The ReviewPage unit shall not describe such a signature as "out of date" or "outdated" in any text of the
          page.
        justification: |
          The reader is told in plain words and not in jargon.
        tests:
          - ReviewPage_NoJargonOutOfDateText

      - id: ReviewCenter-ReviewPage-ChangesSinceSigning-List
        title: >-
          The ReviewPage unit shall show for such a reviewer an expandable list "What changed since {name} signed".
        justification: |
          The reviewer sees what happened since the signature.
        tests:
          - ReviewPage_SignedThenChanged_ExplainsWhatChanged

      - id: ReviewCenter-ReviewPage-ChangesSinceSigning-Change
        title: >-
          The ReviewPage unit shall show each change in that list with the time, the person and a reason in plain
          words.
        justification: |
          The reviewer sees who changed what and when.
        tests:
          - ReviewPage_SignedThenChanged_ExplainsWhatChanged

      - id: ReviewCenter-ReviewPage-ChangesSinceSigning-Note
        title: >-
          The ReviewPage unit shall tell the reviewer above that list when they signed and that they need to look
          again and sign again.
        justification: |
          Signing again is the way forward, so the reviewer is told so before the list.
        tests:
          - ReviewStatusPanel_SignedThenChanged_NoteSaysToLookAgainAndSignAgain

      - id: ReviewCenter-ReviewPage-ChangesSinceSigning-Warning
        title: >-
          The ReviewPage unit shall say in the warning before a change that alters the report that the signed
          reviewers will need to look again and sign again.
        justification: |
          The person who makes the change knows its effect on the signers.
        tests:
          - SignatureWarning_UsesPlainLanguage
