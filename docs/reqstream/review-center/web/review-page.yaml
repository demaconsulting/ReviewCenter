---
# Software Unit Requirements for the ReviewPage Unit
#
# The ReviewPage unit is the page at /projects/{project}/reviews/{review} that shows one review with its
# fingerprint and files, and displays the content of a selected file.

sections:
  - title: ReviewPage Unit Requirements
    requirements:
      - id: ReviewCenter-ReviewPage-Show
        title: >-
          The ReviewPage unit shall show the identifier, title, state, and content fingerprint of the review (the
          identifier, state, and fingerprint in the Details section), a link back to the owning project labeled
          with the project name, or a not-found message when the review does not exist.
        justification: |
          The fingerprint identifies the exact content under review, so it must be available. A mistyped link
          must lead to a clear answer, and the reviewer must see which project the review belongs to.
        tests:
          - ReviewPage_Render_UnknownReview_ShowsNotFound
          - ReviewPage_Render_ExistingReview_ShowsIdTitleStateAndFingerprint
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata
          - ReviewPage_Render_FileSelected_ShowsProjectNameAndHighlightsRow
          - ReviewPage_ParametersChange_OtherReview_ShowsNewReviewAndClearsSelection

      - id: ReviewCenter-ReviewPage-Layout
        title: >-
          The ReviewPage unit shall present the next-step line, the files, the thread index and the content of
          the selected file ahead of the review identifier, state, content fingerprint and per-file hashes,
          which it keeps in a Details section that is collapsed by default.
        justification: |
          Reviewers come to read code and discussion. Identifiers and hashes are needed rarely, so they must not
          compete with the code for attention, yet they must stay one click away.
        tests:
          - ReviewPage_Render_ExistingReview_FilesFirstAndDetailsCollapsedHoldMetadata

      - id: ReviewCenter-ReviewPage-NextStep
        title: >-
          The ReviewPage unit shall show one short sentence at the top of the page, derived from the threads, the
          progress of the review's checklist, and the reviewer slots and signatures, that tells the reader what to
          do next (including "Add a reviewer slot." when the review has no slot and "Approved. Every reviewer
          slot has a current signature." once the review is approved), and keep it current after every change.
        justification: |
          The reader should see what is expected of them without working it out from counts. The wording comes
          from the signing rules, so the page and the approval can never disagree.
        tests:
          - ReviewPage_Render_NextStep_FollowsThreadState
          - ReviewPage_Render_NextStep_IncludesChecklistProgress
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot

      - id: ReviewCenter-ReviewPage-Checklist
        title: >-
          The ReviewPage unit shall show the progress of the review's checklist as a summary (for example "37 of
          58 checks answered") with a link to the checklist page, and shall show neither when the review has no
          checklist.
        justification: |
          The checklist is part of the work of the review, so its progress belongs where the reviewer starts,
          one click from the checklist itself.
        tests:
          - ReviewPage_Render_NewReview_ShowsChecklistProgressAndLink
          - ReviewPage_Render_ReviewWithoutChecklist_HidesChecklistCard

      - id: ReviewCenter-ReviewPage-Files
        title: >-
          The ReviewPage unit shall list the files of the review with the path and size of each, show the
          SHA-256 hash of each file in the Details section, and give each file's View button an accessible name
          that identifies the file.
        justification: |
          Reviewers need to see what the review contains, and the per-file hashes let them verify a file
          independently of the product.
        tests:
          - ReviewPage_Render_ExistingReview_ListsFilesWithPathSizeAndHash
          - ReviewPage_Render_ExistingReview_FileButtonsNameTheirFile

      - id: ReviewCenter-ReviewPage-Content
        title: >-
          The ReviewPage unit shall show no file content until a file is selected, show the selected file, when
          it is valid UTF-8 text without NUL bytes, as numbered lines whose text is exactly as stored, without
          the line ending, as plain text (an empty file shows no lines), and show the lines of another file
          when that file is selected.
        justification: |
          Reviewers must see the true content of a file, and line numbers are what a comment points at.
          Displaying the text as plain text, never as markup, shows every character and cannot execute anything
          in the file.
        tests:
          - ReviewPage_Render_NoFileSelected_ShowsNoContent
          - ReviewPage_FileSelect_TextFile_ShowsNumberedLinesWithExactText
          - ReviewPage_FileSelect_EmptyFile_ShowsNoLines
          - ReviewPage_FileSelect_SecondFile_ReplacesContent

      - id: ReviewCenter-ReviewPage-Binary
        title: >-
          The ReviewPage unit shall show a notice instead of content for a selected file that contains a NUL
          byte or is not valid UTF-8.
        justification: |
          Binary content cannot be shown meaningfully as text, and rendering it would produce unreadable
          output. The notice tells the reviewer why nothing is shown.
        tests:
          - ReviewPage_FileSelect_BinaryFile_ShowsBinaryNoticeAndNoContent
          - ReviewPage_FileSelect_InvalidUtf8_ShowsBinaryNotice

      - id: ReviewCenter-ReviewPage-Source
        title: >-
          The ReviewPage unit shall show, for a review from a repository, the change kind of each file (Added,
          Modified, or Deleted) in the file list, and the repository name, the baseline and head commit
          identifiers, and the selection in the Details section, and shall show none of these for an uploaded
          review.
        justification: |
          Reviewers must see what a review covers - which change, in which repository, between which commits.
        tests:
          - ReviewPage_Render_RepositoryReview_ShowsChangeKindPerFile
          - ReviewPage_Render_RepositoryReview_DetailsShowRepositoryShasAndSelection
          - ReviewPage_Render_DeletedFile_ListsBaselineSize

      - id: ReviewCenter-ReviewPage-Versions
        title: >-
          The ReviewPage unit shall offer for a file of a review that has a baseline commit a choice between the Diff
          view, which is the default, and: for a modified file the Head version, which is the numbered view with the
          comment controls, and the Baseline version, which is a read-only numbered view without comment controls;
          for an added file the Head version only, because nothing existed at the baseline and the Diff view shows
          every line added; for a deleted file the Baseline version only, opening on the Diff view; shall show the
          Diff view again when another file is selected; and shall show a file of an uploaded review, or of a review
          without a baseline commit, as the Head version only, with no choice.
        justification: |
          A change is reviewed against what it replaces, so the differences are what the reader sees first, also for
          a file that is new. The full head and baseline texts stay one click away where they exist, and a file with
          nothing to compare against keeps the plain numbered view.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline
          - ReviewPage_FileSelect_AfterBaselineView_ShowsHeadOfTheNextFile
          - ReviewPage_FileSelect_DeletedFileBaselineView_ShowsNoteWithoutLineControls
          - ReviewPage_FileSelect_UploadAndNoBaselineReview_KeepHeadOnlyView
          - ReviewPage_FileSelect_AddedFileOfReviewWithBaseline_OpensAsAllAddedDiffWithDiffAndHeadChoice
          - ReviewPage_FileSelect_AddedFile_HeadViewAndBack_ShowsNumberedLinesAndCommentControls
          - ReviewPage_ViewSwitch_KeepsTextAndClearsTheSelection

      - id: ReviewCenter-ReviewPage-Diff
        title: >-
          The ReviewPage unit shall show the Diff view of a file side by side, the baseline on the left and the head
          on the right with their own line numbers and the text as plain text, an unchanged line on both sides, a
          run of removed lines paired row by row with the run of added lines that follows it (the leftover cells of
          the shorter run being muted empty placeholders), an added file as all added lines and a deleted file as
          all removed lines, removed and added lines marked by color and by a - or +
          sign, with a one-line summary "x added, y removed" above the rows, a hint that says to click + to comment
          on a line, and every run of unchanged lines that is more than three lines from a change collapsed into a
          button "Show N unchanged lines" that expands it, and shall bring the first change into view when a file
          opens on its diff.
        justification: |
          A reviewer wants to see what changed and nothing else. Old and new next to each other, aligned row by row,
          show what replaced what. Collapsing the unchanged lines and scrolling to the first change put it in
          front of the reader, the summary tells how much there is to read, and the sign keeps added and removed
          lines apart for a reader who cannot tell the colors apart.
        tests:
          - ReviewPage_FileSelect_ModifiedFile_ShowsDiffWithSummaryHintAndNumbers
          - ReviewPage_DiffView_Rows_AreSideBySideWithPlaceholders
          - ReviewPage_DiffView_UnchangedRuns_AreCollapsedAndExpandOnRequest
          - ReviewPage_FileSelect_ModifiedFile_ScrollsToFirstChange
          - ReviewPage_FileSelect_DeletedFile_ShowsRemovedLinesAndAcceptsWholeFileComment
          - ReviewPage_FileSelect_AddedFileOfReviewWithBaseline_OpensAsAllAddedDiffWithDiffAndHeadChoice
          - ReviewPage_FileSelect_EmptyAddedFile_ShowsDiffWithoutRows

      - id: ReviewCenter-ReviewPage-DiffStates
        title: >-
          The ReviewPage unit shall say in plain words, instead of rows, that a file is too large to compare line
          by line and offer the Head and the Baseline version that the file has, that a file is binary, and that two
          versions differ only in their line endings.
        justification: |
          A comparison that cannot be shown must not look like a failure or like an empty change. The reader is
          told why and what to do instead, and is not offered a version that does not exist.
        tests:
          - ReviewPage_FileSelect_TooLargeFile_OffersHeadAndBaseline
          - ReviewPage_FileSelect_BinaryFile_ShowsNotice
          - ReviewPage_DiffView_OnlyLineEndingsDiffer_SaysSo
          - ReviewPage_FileSelect_AddedFileTooLarge_OffersHeadOnly
          - ReviewPage_FileSelect_AddedBinaryFile_ShowsNoticeAndOffersHeadOnly

      - id: ReviewCenter-ReviewPage-DiffComment
        title: >-
          The ReviewPage unit shall offer a + control in every cell of the Diff view that opens the comment form
          under that row, anchored to the Baseline version with the baseline line number for a control in the left
          cell and to the Head version with the head line number for a control in the right cell, state the version
          and lines in plain words ("Comment on line 10 (before)"), extend the selection with Shift-click or a
          "Through line" field only within one version, and offer Cancel and a whole-file comment that keeps the
          typed text.
        justification: |
          The left cell shows the baseline and the right cell the head, so the cell chosen says which version the
          comment is about, with the number the reader sees. Keeping a range within one version prevents mixing two
          numberings, and the plain wording tells the reader what the comment will be attached to.
        tests:
          - ReviewPage_DiffView_CommentOnRemovedLine_StartsBaselineThread
          - ReviewPage_DiffView_CommentOnAddedAndContextLines_StartsHeadThreads
          - ReviewPage_DiffView_LeftControlIsBaseline_RightControlIsHead
          - ReviewPage_DiffView_ShiftClick_ExtendsOnlyWithinTheSameSide
          - ReviewPage_DiffView_ThroughLineField_ExtendsTheRange
          - ReviewPage_DiffView_CancelAndWholeFileOption_BehaveAsLabelled
          - ReviewPage_DiffView_AddedFile_CommentOnLine_StartsHeadThreadUnderTheRow

      - id: ReviewCenter-ReviewPage-DiffThreads
        title: >-
          The ReviewPage unit shall draw the threads of a file under the row of the last line of their anchor in the
          Diff view, across the full width, even where the line would be collapsed, highlight the cell of the lines
          they cover on the side the thread belongs to, show a resolved thread as a collapsed header, reuse the
          reply, resolve and reopen controls of the thread list, and list only whole-file threads below the diff.
        justification: |
          Discussion is read next to the code it is about. A thread that is hidden inside a collapsed run would be
          missed, so its line always stays visible.
        tests:
          - ReviewPage_DiffView_ExistingThreads_AreShownUnderTheirLines
          - ReviewPage_DiffView_MultiLineThread_KeepsItsFirstLineVisible
          - ReviewPage_DiffView_InlineThread_ReplyResolveAndReopen
          - ReviewPage_FileList_ThreadCounts_IncludeBothSides

      - id: ReviewCenter-ReviewPage-DiffLayout
        title: >-
          The ReviewPage unit shall keep the Diff view inside the width of the page on a phone, stacking the left
          cell of a row above its right cell and hiding the empty placeholders and the repeated baseline copy of an
          unchanged line, wrapping long lines inside their cell, keeping the collapsed-run buttons and inline
          threads in view, and using a narrower line-number gutter, and shall give the two sides room on a wide
          screen.
        justification: |
          Reviewers read on phones as well. A long line must never make the whole page scroll sideways, a narrow
          screen has no room for two columns, and the comment form under a line must stay reachable.
        tests:
          - WebSubsystem_Stylesheet_DiffRules_KeepCodeScrollingInsideItself

      - id: ReviewCenter-ReviewPage-ThreadSummary
        title: >-
          The ReviewPage unit shall show the number of open and of resolved threads of the review (on the filter
          buttons of the thread index), and the number of open threads next to every file.
        justification: |
          Reviewers need to see at a glance how much discussion is still open and which files it concerns.
        tests:
          - ReviewPage_Render_NoThreads_ShowsZeroSummaryAndZeroFileCounts
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments

      - id: ReviewCenter-ReviewPage-ThreadIndex
        title: >-
          The ReviewPage unit shall list the threads of all files in one index showing file, anchor (for a file
          that has a baseline in plain words as "Before: line N" or "After: lines N-M"), state, number of
          comments, author of the first comment and time of last activity, filterable to All, Open (default) and
          Resolved, where choosing a thread selects its file and highlights and scrolls to its anchored lines, in
          the Diff view when the file has one.
        justification: |
          Reviewers need to find the discussion that needs them without opening every file, and to go from a
          thread to the code it is about in one step. A line number alone is ambiguous when a file has two
          versions, so the index says which one it means.
        tests:
          - ReviewPage_ThreadIndex_Filters_ShowRowsWithFileAnchorStateCountAuthorAndActivity
          - ReviewPage_ThreadIndex_RowClick_SelectsFileHighlightsAnchorAndScrolls
          - ReviewPage_ThreadIndex_ShowsSideAndLinesAndJumpsToTheDiff
          - ReviewPage_ThreadIndex_TooLargeFile_OpensTheVersionOfTheThread
          - ReviewPage_ThreadIndex_BaselineThreadOnTooLargeFile_HighlightsItsBaselineLines
          - ReviewPage_ThreadIndex_ThreadHighlight_StaysOnTheSideOfTheThread
          - ReviewPage_ThreadIndex_AddedFileHeadThread_JumpsToTheDiffRow

      - id: ReviewCenter-ReviewPage-ThreadCollapse
        title: >-
          The ReviewPage unit shall show a resolved thread as a one-line header (anchor, state, number of
          comments) that expands and collapses on request, keep open threads expanded, and collapse a thread
          when it is resolved.
        justification: |
          Settled discussion should not push the open discussion out of sight, yet it must stay readable and
          open to being reopened.
        tests:
          - ReviewPage_ResolvedThread_CollapsedHeaderExpandsOnRequest

      - id: ReviewCenter-ReviewPage-ThreadStart
        title: >-
          The ReviewPage unit shall let a reader start a thread on the selected file with an optional start and
          end line and a text, with the signed-in user as the author and no field to enter an author, offer a
          Comment button on every line that fills in the line range, show a violated rule or an unreadable line
          number as a message next to the form while keeping the entered values, and on success clear the text
          and show the new thread.
        justification: |
          Comments are only useful when they are easy to start and a mistake is easy to correct. Keeping what
          was typed saves the reader from typing it again. The author is the signed-in user, so it cannot be
          chosen or faked.
        tests:
          - ReviewPage_LineCommentButton_Click_FillsStartAndEndLine
          - ReviewPage_StartThread_WholeFile_CreatesThreadAndClearsText
          - ReviewPage_StartThread_LineRangeAndSingleLine_AnchorLines
          - ReviewPage_StartThread_InvalidInput_ShowsErrorAndKeepsValues
          - ReviewPage_StartThread_SessionEndedBeforePageKnows_ShowsClearErrorAndStoresNothing
          - ReviewPage_StartThread_BinaryFile_WholeFileAllowedAndRangeRefused

      - id: ReviewCenter-ReviewPage-ThreadShow
        title: >-
          The ReviewPage unit shall list the threads of the selected file in creation order, each with its
          anchor, state, and comments (author, UTC time, and text as plain text), and shall mark the lines that
          a thread is anchored to.
        justification: |
          Reviewers read the discussion next to the code. Showing comment text as plain text means that nothing
          typed by an author can change the page.
        tests:
          - ReviewPage_FileSelect_ThreadsExist_ShowsSummaryCountsMarkersAndComments
          - ReviewPage_FileSelect_NoThreadsOnFile_ShowsEmptyMessage
          - ReviewPage_Render_ThreadText_IsShownAsPlainText

      - id: ReviewCenter-ReviewPage-ThreadUpdate
        title: >-
          The ReviewPage unit shall let a reader reply to a thread as the signed-in user, without a field to
          enter an author, showing a violated rule inside that thread, and resolve and reopen a thread, updating
          the thread and the counts.
        justification: |
          Replying, resolving, and reopening are how a discussion moves forward and how reviewers track what
          is settled.
        tests:
          - ReviewPage_Reply_ValidAndBlank_AppendsCommentOrShowsErrorInThread
          - ReviewPage_Reply_NoAuthorField_AuthorCannotBeChosen
          - ReviewPage_ResolveAndReopen_Toggle_ChangesStateAndSummary

      - id: ReviewCenter-ReviewPage-Reviewers
        title: >-
          The ReviewPage unit shall show a Reviewers card that lists the reviewer slots of the review as "Slot N"
          with the primary reviewer, the alternate reviewer ("None" when there is none), and the signature status
          ("Not signed", "Signed by {name} on {UTC time}", or "Signature out of date"); let a signed-in user add a
          slot by choosing enabled users as primary and alternate, and change or remove a slot that has no
          signature, showing the reason next to the control when a change is refused; offer no change or removal
          for a slot that has a signature; show the display names as plain text; and show next to the review title
          a badge that reads Approved or In review.
        justification: |
          Approval of a review is by named people. The reviewer must see who has to sign, who has signed and
          whether a signature still covers the current record. A slot that carries a signature is part of the
          approval history and must not be edited away from the page. Display names are chosen by users, so they
          must never be able to change the page.
        tests:
          - ReviewPage_Render_NoSlots_ShowsEmptyReviewersCardAndInReviewBadge
          - ReviewPage_AddSlot_PrimaryAndAlternate_ShowsSlotNotSigned
          - ReviewPage_AddSlot_InvalidChoices_ShowsErrorAndAddsNothing
          - ReviewPage_EditAndRemoveSlot_Unsigned_ChangesAndRemoves
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot
          - ReviewPage_Render_RecordChangedAfterSigning_ShowsOutOfDateAndInReview
          - ReviewPage_Render_SlotDisplayName_IsShownAsPlainText

      - id: ReviewCenter-ReviewPage-Sign
        title: >-
          The ReviewPage unit shall offer the signed-in user who is the primary or the alternate reviewer of a slot
          that is not currently signed a form with the meaning of the signature and a password field, and sign the
          slot for the record that was on screen when the password is correct; instead of the form it shall list
          what blocks signing while the review cannot be signed; it shall show no form to anybody else; it shall
          answer a wrong password with the generic message only and never show the typed password; it shall refuse
          to sign when the record has changed since the page was drawn; and after a signature it shall show the
          slot as signed and locked, and the review as Approved when every slot is signed.
        justification: |
          A signature is a statement by one person about one exact record. Asking again for the password proves
          that the person at the keyboard is the reviewer, signing what was shown prevents approving something
          that was never seen, and listing the blockers tells the reviewer what is left to do. The page only
          collects the password and passes it on, so it holds no signing rules of its own.
        tests:
          - ReviewPage_Render_BlockedReview_ShowsBlockersInsteadOfSignForm
          - ReviewPage_Render_SignableReview_NonOccupantSeesNoSignForm
          - ReviewPage_Sign_WrongPassword_ShowsGenericErrorAndKeepsNoPassword
          - ReviewPage_Sign_CorrectPassword_ApprovesReviewAndLocksSlot
          - ReviewPage_Render_RecordChangedAfterSigning_ShowsOutOfDateAndInReview
          - ReviewPage_Sign_RecordChangedSincePageDrawn_IsRefused

      - id: ReviewCenter-ReviewPage-Digest
        title: >-
          The ReviewPage unit shall show the record digest of the review in the Details section, as its first 16
          characters with the full 64-character value in the title of the element.
        justification: |
          The digest identifies the exact record that signatures cover. It is needed rarely and must stay out of
          the way, yet it must be available in full to anyone who wants to compare it.
        tests:
          - ReviewPage_Render_Details_ShowShortDigestWithFullValueInTitle

      - id: ReviewCenter-ReviewPage-Interactive
        title: >-
          The ReviewPage unit shall report that it is interactive, through a marker on its root element, once it
          has rendered on a live connection.
        justification: |
          Users, automated tests, and tooling need a reliable signal that the page now responds, so that they do
          not act before the live connection exists.
        tests:
          - ReviewPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ReviewPage-HistoryLink
        title: >-
          The ReviewPage unit shall show a link to the history page of the review in its title row.
        justification: |
          The history of a review is reached from the review it belongs to.
        tests:
          - ReviewPage_Render_ExistingReview_ShowsHistoryLink

      - id: ReviewCenter-ReviewPage-ReviewSet
        title: >-
          The ReviewPage unit shall show in the Details section of a review that was planned from a review-set the
          identifier of that set, and shall show no such row for any other review.
        justification: |
          A reviewer must see which review-set a planned review belongs to, because the set links this review to
          the earlier and later reviews of the same files.
        tests:
          - ReviewPage_Render_PlannedReview_DetailsShowReviewSet
          - ReviewPage_Render_RepositoryReview_DetailsShowRepositoryShasAndSelection

      - id: ReviewCenter-ReviewPage-DeepLinks
        title: >-
          The ReviewPage unit shall open a file, a line or a thread of the review from its address (a path of
          the form /files/{path} with an optional line and side, or /threads/{id}), showing the file in the diff,
          scrolling to the line or thread and highlighting it; shall replace the address of the browser, without a
          history entry and without reloading the page, with the link of the file or thread the reader chooses;
          shall show on every thread a plain, unobtrusive link (not styled as a button) to its address; and shall
          build every link by escaping each path segment once, so the router returns the same file path.
        justification: |
          A link that names one file, line or thread is how reviewers point each other at a finding. An address bar
          that always holds a shareable link needs no extra step, and escaping once and decoding once keeps names
          with spaces, hashes, question marks, percent signs and non-ASCII letters working.
        tests:
          - ReviewLinks_ForReview_ProjectAndReview_BuildsAddress
          - ReviewLinks_ForFile_Path_EscapesEachSegment
          - ReviewLinks_ForFile_WithLine_AddsLineAndSide
          - ReviewLinks_ForFile_SideWithoutLine_AddsNoQuery
          - ReviewLinks_ForThread_Thread_BuildsAddress
          - ReviewLinks_AnyAddress_IsLocalAndSurvivesTheReturnUrlCheck
          - ReviewLinks_NullArguments_Throw
          - ReviewPage_FileAddress_ModifiedFile_OpensFileInDiff
          - ReviewPage_LineAddress_HeadLine_HighlightsAndScrollsToTheRow
          - ReviewPage_LineAddress_BaselineLine_HighlightsTheLeftCell
          - ReviewPage_LineAddress_LineInCollapsedRun_IsShownAndHighlighted
          - ReviewPage_LineAddress_AddedFile_HighlightsTheDiffRow
          - ReviewPage_LineAddress_UploadFile_HighlightsTheCodeLine
          - ReviewPage_LineAddress_DeletedFile_BaselineLineYesHeadLineNo
          - ReviewPage_ThreadAddress_HeadThread_OpensFileAndHighlightsThread
          - ReviewPage_ThreadAddress_AddedFileHeadThread_OpensDiffAndHighlightsRow
          - ReviewPage_ThreadAddress_ResolvedBaselineThread_IsExpandedAndHighlightedOnTheLeft
          - ReviewPage_ThreadAddress_BaselineThreadOnTooLargeFile_HighlightsItsBaselineLines
          - ReviewPage_ThreadAddress_BaselineThread_DoesNotHighlightTheSameLinesOfTheHead
          - ReviewPage_ThreadAddress_WholeFileThread_ScrollsToTheThread
          - ReviewPage_ThreadAddress_KeepsThreadCountsInTheFileList
          - ReviewPage_ThreadAddress_OverHttp_RendersFileAndHighlightedThread
          - ReviewPage_Choose_FileAndThread_ReplacesAddressWithoutNavigating
          - ReviewPage_OpenDeepLink_DoesNotReplaceAddress
          - ReviewPage_Thread_ShowsPlainLinkToItsAddress
          - WebSubsystem_Stylesheet_ThreadLink_IsQuietTextLink
          - ReviewPage_RoundTrip_LinkFromBuilder_OpensTheSameFileAndLine

      - id: ReviewCenter-ReviewPage-DeepLinksNotFound
        title: >-
          The ReviewPage unit shall answer an address that names a file, line, side or thread that does not exist in
          the review (including a thread of another review and a baseline line of a file without a baseline) with a
          plain message in the page and a link back to the file list of the review, and shall keep the page and the
          file list working.
        justification: |
          Links outlive the files and threads they point at. A friendly message with a way back is better than an
          error page, and it must not reveal anything about other reviews.
        tests:
          - ReviewPage_Address_NamesNothing_ShowsMessageWithWayBack
          - ReviewPage_Address_UnknownSideAndLaterChoice_UsesHeadAndClearsMessage
