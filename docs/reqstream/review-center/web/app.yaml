---
# Software Unit Requirements for the App Unit
#
# The App unit is the HTML shell (App.razor), the router (Routes.razor), the header layout (MainLayout.razor), and the
# SessionGate component that selects the page for a requested URL and keeps an open protected page from showing
# data after the sign-in state of its user has ended.

sections:
  - title: App Unit Requirements
    requirements:
      - id: ReviewCenter-App-Shell
        title: >-
          The App unit shall render every page inside an HTML document that sets the base
          address, receives the page title, and loads the interactive client script.
        justification: |
          Pages need a common document around them so that relative links resolve, so that each
          page can set the browser title, and so that the client script that makes a page
          interactive is loaded exactly once.
        tests:
          - App_Render_ServedAtRoot_ContainsShellElements

      - id: ReviewCenter-App-Routing
        title: >-
          The App unit shall show the home page for the root URL and a not-found message for a
          URL that no page handles.
        justification: |
          Users must reach the home page at the root address and must be told clearly when an
          address matches no page, instead of seeing a blank page.
        tests:
          - Routes_Render_RootUrl_RendersHomePage
          - Routes_Render_UnknownUrl_ShowsNotFoundMessage

      - id: ReviewCenter-App-Header
        title: >-
          The App unit shall show in the header of every page the display name of the signed-in user, a link
          to the account page, and a logout button, or a sign-in link when nobody is signed in.
        justification: |
          Users need to see who they are signed in as, and to sign in or out from wherever they are, without
          searching for a page.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout
          - MainLayout_Render_NobodySignedIn_ShowsSignInLink

      - id: ReviewCenter-App-RouteAuthorization
        title: >-
          The App unit shall apply the authorization rules of a page when the user navigates to it inside an open
          interactive session, showing a signed-in user without the needed role an access denied message and a
          signed-out user a link to the login page, without rendering the page.
        justification: |
          The endpoint check runs only for requests to the server; navigation inside an open interactive session
          does not make such a request, so without this rule a reviewer could open the user administration page
          and a signed-out user could open a protected page.
        tests:
          - Routes_Render_ReviewerOpensUsersRoute_ShowsAccessDeniedNotUserList
          - Routes_Render_AdminOpensUsersRoute_ShowsUsersPage
          - Routes_Render_AnonymousOpensProjectsRoute_ShowsLoginLinkNotPage

      - id: ReviewCenter-App-SessionGate
        title: >-
          The App unit shall show the content of a protected page only while a user is signed in, and shall
          replace the whole page, as soon as the sign-in state of the open page ends, with a message that the
          session has ended and a link to the login page that returns to the same page, leaving no page content
          and no control on the page.
        justification: |
          The header and the router are served once and cannot react when the sign-in state of an open page
          ends. Only a component inside the page can. Without it, ending the sign-in state of a user who was
          disabled, removed, or changed would change nothing the user sees, and the page would go on showing
          review data and offering actions.
        tests:
          - SessionGate_Render_SignedInUser_ShowsContent
          - SessionGate_Render_Anonymous_ShowsSessionEndedWithLoginLinkAndNoContent
          - SessionGate_Render_StateBecomesAnonymous_ReplacesContentWithMessage
          - SessionGate_Render_EveryProtectedPageSignedOut_ShowsSessionEndedAndNoPage

      - id: ReviewCenter-App-AuditLink
        title: >-
          The App unit shall show a link to the audit page in the header only while an enabled administrator is
          signed in.
        justification: |
          The link must not invite other users to a page they cannot open.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout

      - id: ReviewCenter-App-RepositoriesLink
        title: >-
          The App unit shall show a link to the repositories page in the header only while an enabled administrator is
          signed in.
        justification: |
          The link must not invite other users to a page they cannot open.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout
