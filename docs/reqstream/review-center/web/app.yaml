---
# Software Unit Requirements for the App Unit
#
# The App unit is the HTML shell (App.razor), the router (Routes.razor), the page frame (MainLayout.razor) with the
# menu bar header and the footer, and the SessionGate component. It selects the page for a requested URL, puts the
# same header and footer around every page, applies the stored appearance before the first paint, and keeps an open
# protected page from showing data after the sign-in state of its user has ended.

sections:
  - title: App Unit Requirements
    requirements:
      - id: ReviewCenter-App-Shell
        title: >-
          The App unit shall render every page inside an HTML document that sets the base
          address, receives the page title, loads the interactive client script, and defines the
          browser helper that copies text to the clipboard for the Copy link button, the helper that moves
          the focus to a field by its test id, and the keyboard shortcut that presses the submit button named
          by a comment field when Ctrl+Enter is pressed in it.
        justification: |
          Pages need a common document around them so that relative links resolve, so that each
          page can set the browser title, and so that the client script that makes a page
          interactive is loaded exactly once. Copying needs browser code, which falls back to a
          hidden text area where the clipboard API is not available (a page that is not a secure context).
          Moving the focus and the shortcut are browser behavior as well; handling the shortcut in the
          browser avoids a round trip to the server for every key pressed.
        tests:
          - App_Render_ServedAtRoot_ContainsShellElements
          - App_Render_ServedAtRoot_DefinesCopyTextHelper
          - App_Render_ServedAtRoot_DefinesFocusHelperAndCtrlEnterListener

      - id: ReviewCenter-App-Routing
        title: >-
          The App unit shall show the home page for the root URL and, for a URL that no page handles, a
          not-found page inside the same page frame (header and footer) as every other page.
        justification: |
          Users must reach the home page at the root address and must be told clearly when an
          address matches no page, instead of seeing a blank page.
        tests:
          - Routes_Render_RootUrl_RendersHomePage
          - Routes_Render_UnknownUrl_ShowsNotFoundMessage
          - Routes_Render_UnknownUrl_ShowsNotFoundInsidePageFrameWithHeaderAndFooter

      - id: ReviewCenter-App-NotFoundPage
        title: >-
          The App unit shall answer a request for a page that no page handles with HTTP status 404 and a "Page not
          found" page that has the header and the footer and a button back to the projects page, and shall leave the
          404 of an API address, of an address that ends in a file extension, and of a request that is not a GET or
          HEAD without the page.
        justification: |
          A mistyped address must give the user a clear answer and a way back inside the familiar page frame, not a
          blank page. A missing script, style sheet, or API address is read by a program, which needs the plain 404
          and not an HTML document, and the 404 status keeps the answer honest for browsers and search engines.
        tests:
          - App_Request_UnknownPath_Returns404WithFramedNotFoundPage
          - App_Request_UnknownApiPath_Returns404WithoutPageFrame
          - App_Request_UnknownFilePath_Returns404WithoutPageFrame
          - App_Request_PostToUnknownPath_Returns404WithoutPageFrame
          - Routes_Render_UnknownUrl_ShowsNotFoundInsidePageFrameWithHeaderAndFooter

      - id: ReviewCenter-App-Header
        title: >-
          The App unit shall show in a header on every page the display name of the signed-in user, a link to the
          account page, and a logout button, or a sign-in link when nobody is signed in.
        justification: |
          Users need to see who they are signed in as, and to sign in or out from wherever they are, without searching
          for a page.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout
          - MainLayout_Render_NobodySignedIn_ShowsSignInLink

      - id: ReviewCenter-App-HomeLink
        title: >-
          The App unit shall show in the header of every page exactly one link to the home page, labeled with the
          product name.
        justification: |
          Users need one familiar way back to the start from any page. Because the header always provides it, the
          pages do not repeat it, and a second link to the same place would only confuse.
        tests:
          - MainLayout_Render_NobodySignedIn_ShowsFooterWithVersionAndAboutLink
          - Routes_Render_UnknownUrl_ShowsNotFoundInsidePageFrameWithHeaderAndFooter

      - id: ReviewCenter-App-Navigation
        title: >-
          The App unit shall show in the header a link to the projects page while a user is signed in, and no
          such link while nobody is.
        justification: |
          Users need to reach the review features from wherever they are, and a link to a page that needs a sign-in
          must not be offered to a visitor who is not signed in.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout
          - MainLayout_Render_NobodySignedIn_ShowsSignInLink

      - id: ReviewCenter-App-HelpLink
        title: >-
          The App unit shall show in the header of every page, to a visitor who is signed in or not, a link to the
          help, placed before the sign-in link when nobody is signed in.
        justification: |
          Help is most needed by a new user who may not have signed in yet, so it is offered to everyone and stays in
          the same place on every page.
        tests:
          - MainLayout_Render_NobodySignedIn_ShowsHelpLinkBeforeSignIn

      - id: ReviewCenter-App-Footer
        title: >-
          The App unit shall show in a footer on every page the product name, its version, the copyright
          holder, and a link to the About page.
        justification: |
          Users and auditors need to see which version of the product they are using wherever they are, and
          to find the full version and the project page from there. The footer shows the version number and the
          start of the commit identifier, enough to tell builds apart.
        tests:
          - MainLayout_Render_NobodySignedIn_ShowsFooterWithVersionAndAboutLink
          - Routes_Render_UnknownUrl_ShowsNotFoundInsidePageFrameWithHeaderAndFooter

      - id: ReviewCenter-App-Theme
        title: >-
          The App unit shall apply the light, dark, or system appearance stored in the browser before the first
          paint of every page.
        justification: |
          A page that first appears in the wrong appearance and then changes flashes at the user, which is
          unpleasant and, for a reader who chose the dark appearance, glaring. The choice is applied before the
          style sheet is used so that it never shows.
        tests:
          - App_Render_ServedAtRoot_AppliesStoredThemeBeforeStyleSheet

      - id: ReviewCenter-App-FormRoutes
        title: >-
          The App unit shall show the new-review form, and not a review, for the address of the new-review form of a
          project.
        justification: |
          The address of the form lies in the same place as the addresses of the reviews of a project. If it were read
          as the address of a review called "new", a user who asked for the form would be shown a missing review.
        tests:
          - Routes_Render_NewReviewRoute_ShowsFormNotReview

      - id: ReviewCenter-App-RouteAuthorization
        title: >-
          The App unit shall apply the authorization rules of a page when the user navigates to it inside an open
          interactive session, showing a signed-in user without the needed role an access denied message and a
          signed-out user a link to the login page, without rendering the page.
        justification: |
          The endpoint check runs only for requests to the server; navigation inside an open interactive session
          does not make such a request, so without this rule a reviewer could open the user administration page
          and a signed-out user could open a protected page.
        tests:
          - Routes_Render_ReviewerOpensUsersRoute_ShowsAccessDeniedNotUserList
          - Routes_Render_AdminOpensUsersRoute_ShowsUsersPage
          - Routes_Render_AnonymousOpensProjectsRoute_ShowsLoginLinkNotPage

      - id: ReviewCenter-App-SessionGate
        title: >-
          The App unit shall show the content of a protected page only while a user is signed in, and shall
          replace the whole page, as soon as the sign-in state of the open page ends, with a message that the
          session has ended and a link to the login page that returns to the same page, leaving no page content
          and no control on the page.
        justification: |
          The header and the router are served once and cannot react when the sign-in state of an open page
          ends. Only a component inside the page can. Without it, ending the sign-in state of a user who was
          disabled, removed, or changed would change nothing the user sees, and the page would go on showing
          review data and offering actions.
        tests:
          - SessionGate_Render_SignedInUser_ShowsContent
          - SessionGate_Render_Anonymous_ShowsSessionEndedWithLoginLinkAndNoContent
          - SessionGate_Render_StateBecomesAnonymous_ReplacesContentWithMessage
          - SessionGate_Render_EveryProtectedPageSignedOut_ShowsSessionEndedAndNoPage

      - id: ReviewCenter-App-AuditLink
        title: >-
          The App unit shall show a link to the audit page in the header only while an enabled system administrator
          is signed in.
        justification: |
          The link must not invite other users to a page they cannot open.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout

      - id: ReviewCenter-App-NoRepositoriesLink
        title: >-
          The App unit shall show no link to a repositories page in the header, for any user, because the
          repositories belong to the projects and are reached from the page of a project.
        justification: |
          A header link would lead to a registry outside the projects, which does not exist, and would suggest that
          repositories are shared between projects.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout

      - id: ReviewCenter-App-UsersLink
        title: >-
          The App unit shall show a link to the users page in the header only while an enabled system administrator
          is signed in.
        justification: |
          The link must not invite other users to a page they cannot open.
        tests:
          - MainLayout_Render_SignedInUser_ShowsNameAccountAndLogout

      - id: ReviewCenter-App-InboxBadge
        title: >-
          The App unit shall, while a user who need not change a temporary password is signed in, show in the header an
          Inbox tab with a badge of the number of reviews that need the user's action, shown only above zero and as
          99+ above ninety-nine, with that number in its accessible label; read the number when the layout starts and
          on each navigation, at most once per user in 30 seconds, and ask for no number when nobody is signed in or
          the password is temporary; and, when the number cannot be read, hide the badge and still render the page.
        justification: |
          A reviewer should see from every page that something waits, without opening the inbox. Counting costs a
          snapshot for each review the user is involved in, so the number is kept for 30 seconds per user and
          refreshed on navigation instead of by a timer, which bounds the cost however often the user clicks; a hint
          must never break the page, so a failure only hides it.
        tests:
          - MainLayout_Render_UserWithActionItems_ShowsInboxTabWithCount
          - MainLayout_Render_NoActionItems_ShowsInboxTabWithoutBadge
          - MainLayout_Render_ManyActionItems_CapsBadgeAt99Plus
          - MainLayout_Render_NobodyOrTemporaryPassword_ShowsNoInboxTabAndReadsNoCount
          - MainLayout_Render_WithinThirtySeconds_ReadsCountOnceThenAgainAfterwards
          - MainLayout_Navigate_ChangedCount_RefreshesBadgeAndStopsAfterDispose
          - MainLayout_Render_CountFails_HidesBadgeAndStillRendersPage
          - MainLayout_Render_TwoUsers_KeepsTheirCountsApart

      - id: ReviewCenter-App-TemporaryPassword
        title: >-
          The App unit shall, while the signed-in session carries the must-change-password claim, show no navigation
          tabs in the header and send the browser to the account page from every page except the account, login,
          help, and about pages, on the first request and on every later navigation inside the same session.
        justification: |
          A user who signed in with a temporary password may do nothing but replace it. The layout wraps every page,
          so confining the user there keeps all pages out of reach without each page having to know; the layout lives
          on while the user clicks from page to page, so the check is repeated on every navigation; the server side
          refuses the same user as well, so the confinement is a convenience and not the only barrier.
        tests:
          - MainLayout_Render_TemporaryPassword_ConfinesUserToAccountPage
          - MainLayout_Navigate_TemporaryPassword_RedirectsLaterNavigationAndStopsAfterDispose
          - MainLayout_Navigate_OrdinaryUser_IsNotRedirected
