---
# Software Unit Requirements for the RepositoriesPage Component
#
# The RepositoriesPage component lets whoever manages a project (a system administrator or a project admin of it)
# register, change, disable, and enable the git repositories of that project, at /projects/{project}/repositories.
# Reviews of the project can be created from them. The token is write-only on this page. The unit includes the
# NewRepositoryPage component, the separate page at /projects/{project}/repositories/new that holds the form that
# registers a repository. There is no registry of repositories outside the projects. A user who may not manage the
# project is shown the not-found message of a project that does not exist.

sections:
  - title: RepositoriesPage Unit Requirements
    requirements:
      - id: ReviewCenter-RepositoriesPage-Display
        title: >-
          The RepositoriesPage component shall list the repositories of the project, and no other, with their name,
          location, and enabled state, with the user name and a token indicator only where they are set, never
          showing a token, and shall offer no way to delete a repository.
        justification: |
          Whoever manages the project needs to see what is registered for it and whether a token is set, but a token
          shown on a page can be copied, shoulder-surfed, and logged. A repository is retired by disabling it, and the
          repositories of other projects are not this project's business.
        tests:
          - RepositoriesPage_Render_Repositories_ShowsTokenStateOnlyAndNoDelete
          - RepositoriesPage_Render_OtherProjectsRepositories_AreNotListed
          - RepositoriesPage_Render_ProjectAdmin_ShowsRepositoriesAndActions

      - id: ReviewCenter-RepositoriesPage-AddPage
        title: >-
          The RepositoriesPage component shall offer an add button that leads to a separate page that holds only the
          form that registers a repository, and that page shall offer a way back to the list without registering
          anything and return to the list after a repository was registered.
        justification: |
          A form between the rows of a list pushes the list down and invites a half-typed token to stay on a page
          that is meant for reading. A page of its own keeps the list clean and makes cancelling obvious.
        tests:
          - RepositoriesPage_Render_Repositories_ShowsTokenStateOnlyAndNoDelete
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields

      - id: ReviewCenter-RepositoriesPage-Create
        title: >-
          The RepositoriesPage component shall register a repository in the project from a form with a name, a
          location, an optional user name, and an optional token, empty the token field afterwards, and show a rule
          violation without creating anything.
        justification: |
          Registering a repository is how an administrator makes a source reachable. A token must not stay in the form
          after it is saved.
        tests:
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields
          - NewRepositoryPage_CreateForm_InvalidLocation_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-RepositoriesPage-Edit
        title: >-
          The RepositoriesPage component shall let whoever manages the project change the name, location, and user
          name of a repository and keep, replace, or clear its token, never showing the stored token, and cancel
          without any change.
        justification: |
          Locations move and tokens expire. The stored token cannot be read back, so keeping, replacing, and
          clearing are the only operations that make sense for it.
        tests:
          - RepositoriesPage_Edit_KeepToken_ChangesFieldsAndKeepsToken
          - RepositoriesPage_Edit_ReplaceToken_StoresNewTokenWriteOnly
          - RepositoriesPage_Edit_ClearToken_RemovesToken
          - RepositoriesPage_Edit_Cancel_ClosesFormAndChangesNothing

      - id: ReviewCenter-RepositoriesPage-Enable
        title: >-
          The RepositoriesPage component shall let whoever manages the project disable a repository and enable it
          again.
        justification: |
          Disabling stops the use of a repository at once, for example after a token was exposed, and keeps the
          reviews made from it.
        tests:
          - RepositoriesPage_ToggleEnabled_Repository_DisablesAndEnablesAgain

      - id: ReviewCenter-RepositoriesPage-Admin
        title: >-
          The RepositoriesPage component shall be available only to a system administrator and to a project admin of
          the project, shall show anybody else, a plain member or a user who is no member, only the not-found
          message of a project that does not exist, with no repository and no control, shall check on every action
          that the user still manages the project, and, when the user no longer does or nobody is signed in, shall
          change nothing and replace the page with the not-found message, dropping the project, the repositories,
          the edit form and the token state, even when the check that follows an action fails.
        justification: |
          The repositories control what the server reads and hold secrets. An open page keeps its state for a while
          after a user is demoted, disabled, or signed out, and a plain member must not read the locations and user
          names of the repositories. A refusal that said "not allowed" would show that the project exists, and an
          error shown above the stale data would still leave it readable, so the page answers as for a missing
          project and clears everything it loaded.
        tests:
          - SignIn_RepositoriesPage_NonMemberAndSystemAdmin_OnlyAdminIsServed
          - RepositoriesPage_Render_MemberOrNonMember_ShowsNotFoundOnly
          - RepositoriesPage_Action_SignedInAdminLaterDemoted_ShowsNotFoundAndNoData
          - RepositoriesPage_Action_ProjectAdminDemotedToMember_ShowsNotFoundAndNoRepositoryData
          - RepositoriesPage_StartEdit_ProjectAdminDemoted_ShowsNotFoundAndNoEditForm
          - RepositoriesPage_Action_AccessLostBeforeTheReload_ShowsNotFoundNotStaleList
          - RepositoriesPage_Revalidation_AdminDemoted_PageShowsSessionEndedAndNoActions
          - RepositoriesPage_Action_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing
          - NewRepositoryPage_CreateForm_ProjectAdminDemoted_ShowsNotFoundAndCreatesNothing
