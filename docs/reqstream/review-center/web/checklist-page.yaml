---
# Software Unit Requirements for the ChecklistPage Unit
#
# The ChecklistPage unit is the page at /projects/{project}/reviews/{review}/checklist that shows the checklist of
# one review, lets a reviewer answer its checks, and shows what is left to do.

sections:
  - title: ChecklistPage Unit Requirements
    requirements:
      - id: ReviewCenter-ChecklistPage-Show
        title: >-
          The ChecklistPage unit shall show a status line of how many checks are unanswered (or that the
          checklist is complete), the overall progress with the number of sections that do not apply, and every
          section with its own progress, with only the first section that has unanswered checks open to begin
          with, and shall show a not-found message when the review does not exist and a message when the review
          has no checklist.
        justification: |
          A reviewer must see at once what is left to do and where to start. Opening only one section keeps the
          fifty-odd checks from burying what matters. A mistyped link must lead to a clear answer.
        tests:
          - ChecklistPage_Render_NewReview_ShowsProgressAndOpensFirstSection
          - ChecklistPage_Render_UnknownReview_ShowsNotFound
          - ChecklistPage_Render_ReviewWithoutChecklist_ShowsMissing
          - ChecklistPage_Render_PartlyAnswered_OpensFirstIncompleteSection
          - ChecklistPage_Render_AllAnswered_ShowsCompleteAndNoNextAction

      - id: ReviewCenter-ChecklistPage-Access
        title: >-
          The ChecklistPage unit shall show a user who may not see the project the page for a review that does not
          exist and none of the checklist, and shall check the view access again at the start of every action of
          the open page, so that a user whose membership was removed meanwhile gets that page and nothing that was
          loaded, and an answer is not stored.
        justification: |
          A page that stays open does not load again, so without a new check a removed member would keep reading
          the checklist and could keep answering it. A hidden project looks like a missing one, so the page does
          not reveal it either.
        tests:
          - ChecklistPage_Render_NonMember_LooksLikeAMissingReview
          - ChecklistPage_Choose_MembershipRevoked_ShowsNotFoundAndNoData
          - ChecklistPage_ToggleSection_MembershipRevoked_ShowsNotFoundAndNoData

      - id: ReviewCenter-ChecklistPage-ReadOnly
        title: >-
          The ChecklistPage unit shall show a member whose role is auditor the checklist with a read-only notice and
          with every control that answers a check or changes a section disabled, so that nothing can be changed.
        justification: |
          An auditor reads the answers and the justifications but must not be offered to change them, and the notice
          says why the controls are disabled.
        tests:
          - ChecklistPage_Render_Auditor_ShowsReadOnlyNoticeAndDisablesEveryControl

      - id: ReviewCenter-ChecklistPage-Answer
        title: >-
          The ChecklistPage unit shall offer Pass, Fail, and N/A buttons for each check of the open section, store
          a Pass at once, ask for a justification, marked as required, only for Fail and N/A and store those when
          the reviewer saves, show the display name and UTC time of the answer, record the signed-in user as the
          person who answered without any field for a name, and show a violated rule as a message next to the
          check.
        justification: |
          One click per check keeps the work fast, and the justification is only asked for where it is needed.
          A message beside the check tells the reviewer exactly what to fix. The person is the signed-in user, so
          it cannot be chosen or faked.
        tests:
          - ChecklistPage_Answer_Pass_SavesImmediately
          - ChecklistPage_Answer_Fail_ShowsJustificationBoxAndRequiresText
          - ChecklistPage_Answer_FailWithJustification_SavesAndShowsAnsweredBy
          - ChecklistPage_Answer_SignedInUser_IsRecordedAsAnsweredBy

      - id: ReviewCenter-ChecklistPage-Applicability
        title: >-
          The ChecklistPage unit shall let the reviewer mark the open section as not applying, asking for a
          required reason and storing it when the reviewer saves, show such a section as not applicable with no
          checks to answer and leave it out of the progress totals, show a violated rule next to the reason, and
          let the reviewer mark the section as applying again. While the switch is off and the reason is not
          saved yet, the section shall show a "Reason needed" state with a hint that nothing is saved until the
          reason is saved.
        justification: |
          Sections that do not fit the review, such as code checks in a documentation-only review, must not
          leave the checklist incomplete forever, but skipping one must be a visible, explained decision. A switch
          that looks off while nothing is stored would mislead the reviewer.
        tests:
          - ChecklistPage_Applicability_NotApplicableWithoutReason_ShowsError
          - ChecklistPage_Applicability_NotApplicableWithReason_CountsAsDoneAndHidesChecks
          - ChecklistPage_Applicability_SwitchOffBeforeReasonSaved_ShowsReasonNeeded

      - id: ReviewCenter-ChecklistPage-SignatureWarning
        title: >-
          The ChecklistPage unit shall, when an answer or a change of the applicability of a section would make a
          current signature out of date, store nothing and show a warning next to the control that was used that
          names every affected slot and its signer, repeat the change with those slots acknowledged only when the
          reviewer confirms, show the warning again with every affected slot when another signature appeared
          meanwhile, and leave the signatures and the record unchanged, and keep the unsaved choice and reason, when
          the reviewer cancels.
        justification: |
          A changed answer after a signature silently voids the signature. The reviewer has to see whose signature
          is affected and decide, so that nobody learns afterwards that a reviewer has to sign again. A signature
          that appears while the warning is open must be shown before it is voided.
        tests:
          - ChecklistPage_Answer_SignedReview_ShowsWarningAndConfirmStoresTheAnswerAndMarksTheSignatureOutOfDate
          - ChecklistPage_Answer_PassOnSignedReview_ShowsWarningNextToTheCheckAndConfirmStores
          - ChecklistPage_Answer_SignatureAddedWhileWarningOpen_ShowsMergedWarningBeforeStoring
          - ChecklistPage_Applicability_NotApplicableOnSignedReview_ShowsWarningAndConfirmStores
          - ChecklistPage_Applicability_SwitchOnOnSignedReview_CancelRevertsTheSwitchAndConfirmStores
          - ChecklistPage_Applicability_SwitchOnWarningOpen_SwitchingOffDropsTheWarning
          - ChecklistPage_Render_SignatureWarningOpen_EveryInteractiveElementHasKebabCaseTestId

      - id: ReviewCenter-ChecklistPage-NextUnanswered
        title: >-
          The ChecklistPage unit shall offer, while checks are unanswered, a Next unanswered check button that
          opens the section of the first unanswered check and scrolls to that check (skipping sections that are being
          switched off, unless only those are left, when it opens the first of them at its reason field), offer the
          same button at the
          end of a finished section, and, once the checklist is complete, offer a link back to the review instead.
        justification: |
          The page tells the reviewer what to do next, so that they do not have to look for the one check that
          is left, or scroll back to the top when a section is done.
        tests:
          - ChecklistPage_NextUnanswered_Click_OpensSectionOfFirstUnansweredCheck
          - ChecklistPage_NextUnanswered_PendingNotApplicableSection_SkipsIt
          - ChecklistPage_NextUnanswered_OnlyPendingNotApplicableSectionLeft_OpensItsReasonField
          - ChecklistPage_Render_AllAnswered_ShowsCompleteAndNoNextAction
          - ChecklistPage_FinishedSection_OffersNextActionAtItsEnd

      - id: ReviewCenter-ChecklistPage-Interactive
        title: >-
          The ChecklistPage unit shall keep one section open at a time, give every interactive element a stable
          lowercase hyphenated data-testid attribute, and report that it is interactive, through a marker on its
          root element, once it has rendered on a live connection.
        justification: |
          One open section keeps the page short. Stable identifiers keep automated tests and the Puppet tool
          working as the page evolves, and the marker tells them when the page responds.
        tests:
          - ChecklistPage_Render_OpeningSection_ClosesOthers
          - ChecklistPage_Render_EveryInteractiveElementHasKebabCaseTestId
          - ChecklistPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ChecklistPage-Locked
        title: >-
          The ChecklistPage unit shall show a notice that the review is approved and locked, and disable the answer
          buttons, the justification fields, the save buttons, and the applicability switches of the sections, while
          the review is locked, and shall keep the checklist readable and the navigation available.
        justification: |
          The answers are part of what the signatures approved. A user who cannot change them must see why. The
          lock itself is enforced by the checklist service, which refuses the change with the message of the rule if a
          stale page still sends it.
        tests:
          - ChecklistPage_Render_ApprovedReview_ShowsLockedAndDisablesControls

      - id: ReviewCenter-ChecklistPage-AuthorBlocked
        title: >-
          The ChecklistPage unit shall show to the author of the review, while the project does not let authors answer
          the checklist, a notice that another project member has to answer it, with the answer buttons, the
          justification fields, the save buttons, and the applicability switches disabled, shall show neither to any
          other user nor when the rule is switched off, shall show only the lock notice for a locked review, and shall
          show the message of the rule when a stale page still sends the answer.
        justification: |
          A user who cannot answer must see why and what to do instead. The rule itself is enforced by the checklist
          service, which refuses the change with the message of the rule if a stale page still sends it.
        tests:
          - ChecklistPage_Render_AuthorWhileRuleIsOn_ShowsNoticeAndDisablesControls
          - ChecklistPage_Render_AuthorOfApprovedReview_ShowsOnlyTheLockNotice
          - ChecklistPage_Answer_RuleSwitchedOnAfterLoad_ShowsTheRefusalAndStoresNothing

      - id: ReviewCenter-ChecklistPage-CarriedMarks
        title: >-
          The ChecklistPage unit shall mark on the checklist of a follow-up review every answer and every section
          state that was carried from another review with a Carried from badge that links to that review, and shall
          show, for a check that is not answered and failed in the followed review with the same wording, the earlier
          Fail and its justification, read-only, with a link to that review, until the check is answered again, and
          shall show neither on a review that follows nothing.
        justification: |
          A carried answer was given by someone else about an earlier state of the content, so the reviewer must see
          that it was carried and from where. The earlier Fail is the reason for the follow-up; showing it makes the
          reviewer decide the check again on purpose instead of overlooking it.
        tests:
          - ChecklistPage_Render_FollowUp_ShowsCarriedMarksAndEarlierFail
          - ChecklistPage_Render_FollowUp_DecidedAgainOrEarlierReview_ShowsNoEarlierFail
          - ChecklistPage_Render_FollowUp_ReworkedCheckThatFailed_ShowsNoEarlierFail
