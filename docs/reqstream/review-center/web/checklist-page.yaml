---
# Software Unit Requirements for the ChecklistPage Unit
#
# The ChecklistPage unit is the page at /projects/{project}/reviews/{review}/checklist that shows the checklist of
# one review, lets a reviewer answer its checks, and shows what is left to do.

sections:
  - title: ChecklistPage Unit Requirements
    requirements:
      - id: ReviewCenter-ChecklistPage-Show
        title: >-
          The ChecklistPage unit shall show a status line of how many checks are unanswered (or that the
          checklist is complete), the overall progress with the number of sections that do not apply, and every
          section with its own progress, with only the first section that has unanswered checks open to begin
          with, and shall show a not-found message when the review does not exist and a message when the review
          has no checklist.
        justification: |
          A reviewer must see at once what is left to do and where to start. Opening only one section keeps the
          fifty-odd checks from burying what matters. A mistyped link must lead to a clear answer.
        tests:
          - ChecklistPage_Render_NewReview_ShowsProgressAndOpensFirstSection
          - ChecklistPage_Render_UnknownReview_ShowsNotFound
          - ChecklistPage_Render_ReviewWithoutChecklist_ShowsMissing
          - ChecklistPage_Render_PartlyAnswered_OpensFirstIncompleteSection
          - ChecklistPage_Render_AllAnswered_ShowsCompleteAndNoNextAction

      - id: ReviewCenter-ChecklistPage-Access
        title: >-
          The ChecklistPage unit shall show a user who may not see the project the page for a review that does not
          exist and none of the checklist, and shall check the view access again at the start of every action of
          the open page, so that a user whose membership was removed meanwhile gets that page and nothing that was
          loaded, and an answer is not stored.
        justification: |
          A page that stays open does not load again, so without a new check a removed member would keep reading
          the checklist and could keep answering it. A hidden project looks like a missing one, so the page does
          not reveal it either.
        tests:
          - ChecklistPage_Render_NonMember_LooksLikeAMissingReview
          - ChecklistPage_Choose_MembershipRevoked_ShowsNotFoundAndNoData
          - ChecklistPage_ToggleSection_MembershipRevoked_ShowsNotFoundAndNoData

      - id: ReviewCenter-ChecklistPage-ReadOnly
        title: >-
          The ChecklistPage unit shall show a member whose role is auditor the checklist with a read-only notice and
          with every control that answers a check or changes a section disabled, so that nothing can be changed.
        justification: |
          An auditor reads the answers and the justifications but must not be offered to change them, and the notice
          says why the controls are disabled.
        tests:
          - ChecklistPage_Render_Auditor_ShowsReadOnlyNoticeAndDisablesEveryControl

      - id: ReviewCenter-ChecklistPage-Answer
        title: >-
          The ChecklistPage unit shall offer Pass, Fail, and N/A buttons for each check of the open section, store
          a Pass at once, ask for a justification, marked as required, only for Fail and N/A and store those when
          the reviewer saves, store each answer in the ballot of the reviewer slot of the signed-in user, show the
          display name and UTC time of the answer, record the signed-in user as the person who answered without any
          field for a name, and show a violated rule as a message next to the check.
        justification: |
          One click per check keeps the work fast, and the justification is only asked for where it is needed.
          A message beside the check tells the reviewer exactly what to fix. The person is the signed-in user, so
          it cannot be chosen or faked, and the answer belongs to the ballot of that person's slot, so that nobody
          answers in the name of another reviewer.
        tests:
          - ChecklistPage_Answer_Pass_SavesImmediately
          - ChecklistPage_Answer_Fail_ShowsJustificationBoxAndRequiresText
          - ChecklistPage_Answer_FailWithJustification_SavesAndShowsAnsweredBy
          - ChecklistPage_Answer_SignedInUser_IsRecordedAsAnsweredBy

      - id: ReviewCenter-ChecklistPage-SubmitBallot
        title: >-
          The ChecklistPage unit shall show a reviewer who holds a reviewer slot the state of the own ballot (not
          answered yet, a draft that does not count until it is submitted, or submitted and counting), shall offer a
          Submit ballot button only while that ballot is a draft that answers every check it requires and the controls
          are not disabled, and shall hand the ballot in when the button is pressed, so that the button is not offered
          for an incomplete ballot or after a hand-in, and, in a review with a single slot, where an answer or an edit
          that completes the ballot hands it in, only for a complete draft that no such answer produced (a follow-up
          whose checks are all carried, or a checklist without checks).
        justification: |
          A ballot counts in the record only after the reviewer hands it in, so the reviewer has to see whether the
          answers already count and has to have a visible way to hand them in. Offering the button only when the
          service would accept the hand-in avoids a refusal that the page could have prevented, and a review with
          one slot has nobody to agree with, so it keeps its single step of answering.
        tests:
          - ChecklistPage_SubmitButton_ShownWhenDraftComplete
          - ChecklistPage_SubmitButton_HiddenWhenIncompleteOrSingleSlot

      - id: ReviewCenter-ChecklistPage-NoSlot
        title: >-
          The ChecklistPage unit shall tell a signed-in user who holds no reviewer slot of the review, and who is not
          read-only, that they cannot answer until they add themselves as a reviewer slot, with neither a ballot
          status nor a Submit ballot button, and with the answer controls disabled; in a review with a single slot or
          a concluded review the notice also says that they see the consolidated standing of the submitted ballots
          (a multi-slot review that is not concluded is covered by ReviewCenter-ChecklistPage-HiddenBallots).
        justification: |
          Only a reviewer answers a checklist, so a project member without a slot would otherwise meet controls that
          the service refuses. The notice says why and what to do, and where the standing is open to everyone (a
          single-slot or concluded review) the standing they see is the one that every other reader sees.
        tests:
          - ChecklistPage_NoSlot_ShowsHint

      - id: ReviewCenter-ChecklistPage-Applicability
        title: >-
          The ChecklistPage unit shall let the reviewer mark the open section as not applying, asking for a
          required reason and storing it when the reviewer saves, show such a section as not applicable with no
          checks to answer and leave it out of the progress totals, show a violated rule next to the reason, and
          let the reviewer mark the section as applying again. While the switch is off and the reason is not
          saved yet, the section shall show a "Reason needed" state with a hint that nothing is saved until the
          reason is saved.
        justification: |
          Sections that do not fit the review, such as code checks in a documentation-only review, must not
          leave the checklist incomplete forever, but skipping one must be a visible, explained decision. A switch
          that looks off while nothing is stored would mislead the reviewer.
        tests:
          - ChecklistPage_Applicability_NotApplicableWithoutReason_ShowsError
          - ChecklistPage_Applicability_NotApplicableWithReason_CountsAsDoneAndHidesChecks
          - ChecklistPage_Applicability_SwitchOffBeforeReasonSaved_ShowsReasonNeeded

      - id: ReviewCenter-ChecklistPage-SignatureWarning
        title: >-
          The ChecklistPage unit shall, when handing the own ballot in, or saving an answer or a change of the
          applicability of a section that changes the consolidated standing, would make a current signature of another
          reviewer out of date, store nothing and show a warning next to the control that was used that names every
          affected slot and its signer, repeat the change with those slots acknowledged only when the reviewer
          confirms, show the warning again with every affected slot when another signature appeared meanwhile, and
          leave the signatures and the record unchanged, and keep the unsaved choice and reason, when the reviewer
          cancels, and shall show no warning for a save that leaves the digest unchanged, such as an answer in a draft
          ballot.
        justification: |
          A ballot changes the record only while it counts, so saving answers into a draft is free and handing the
          ballot in is the moment that can void a signature, as can taking back a dissent that was submitted. The
          reviewer has to see whose signature is affected and decide, so that nobody learns afterwards that a reviewer
          has to sign again. A signature that appears while the warning is open must be shown before it is voided. The
          test names are kept from the single-checklist model; each now follows a draft, a hand-in or the taking back
          of a counted dissent, as the scenarios describe.
        tests:
          - ChecklistPage_Answer_SignedReview_ShowsWarningAndConfirmStoresTheAnswerAndMarksTheSignatureOutOfDate
          - ChecklistPage_Answer_PassOnSignedReview_ShowsWarningNextToTheCheckAndConfirmStores
          - ChecklistPage_Answer_SignatureAddedWhileWarningOpen_ShowsMergedWarningBeforeStoring
          - ChecklistPage_Applicability_NotApplicableOnSignedReview_ShowsWarningAndConfirmStores
          - ChecklistPage_Applicability_SwitchOnOnSignedReview_CancelRevertsTheSwitchAndConfirmStores
          - ChecklistPage_Applicability_SwitchOnWarningOpen_SwitchingOffDropsTheWarning
          - ChecklistPage_Render_SignatureWarningOpen_EveryInteractiveElementHasKebabCaseTestId

      - id: ReviewCenter-ChecklistPage-NextUnanswered
        title: >-
          The ChecklistPage unit shall offer, while checks are unanswered, a Next unanswered check button that
          opens the section of the first unanswered check and scrolls to that check (skipping sections that are being
          switched off, unless only those are left, when it opens the first of them at its reason field), offer the
          same button at the
          end of a finished section, and, once the checklist is complete, offer a link back to the review instead.
        justification: |
          The page tells the reviewer what to do next, so that they do not have to look for the one check that
          is left, or scroll back to the top when a section is done.
        tests:
          - ChecklistPage_NextUnanswered_Click_OpensSectionOfFirstUnansweredCheck
          - ChecklistPage_NextUnanswered_PendingNotApplicableSection_SkipsIt
          - ChecklistPage_NextUnanswered_OnlyPendingNotApplicableSectionLeft_OpensItsReasonField
          - ChecklistPage_Render_AllAnswered_ShowsCompleteAndNoNextAction
          - ChecklistPage_FinishedSection_OffersNextActionAtItsEnd

      - id: ReviewCenter-ChecklistPage-Interactive
        title: >-
          The ChecklistPage unit shall keep one section open at a time, give every interactive element a stable
          lowercase hyphenated data-testid attribute, and report that it is interactive, through a marker on its
          root element, once it has rendered on a live connection.
        justification: |
          One open section keeps the page short. Stable identifiers keep automated tests and the Puppet tool
          working as the page evolves, and the marker tells them when the page responds.
        tests:
          - ChecklistPage_Render_OpeningSection_ClosesOthers
          - ChecklistPage_Render_EveryInteractiveElementHasKebabCaseTestId
          - ChecklistPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ChecklistPage-Locked
        title: >-
          The ChecklistPage unit shall show a notice that the review is concluded, approved or rejected, and locked, and
          disable the answer
          buttons, the justification fields, the save buttons, and the applicability switches of the sections, and not
          offer the Submit ballot button, while the review is locked, and shall keep the checklist readable and the
          navigation available.
        justification: |
          The answers are part of what the signatures approved. A user who cannot change them must see why. The
          lock itself is enforced by the checklist service, which refuses the change with the message of the rule if a
          stale page still sends it.
        tests:
          - ChecklistPage_Render_ApprovedReview_ShowsLockedAndDisablesControls
          - ChecklistPage_Render_RejectedConcludedReview_IsReadOnly

      - id: ReviewCenter-ChecklistPage-AuthorBlocked
        title: >-
          The ChecklistPage unit shall show to the author of the review, while the project does not let authors answer
          the checklist, a notice that another project member has to answer it, with the answer buttons, the
          justification fields, the save buttons, and the applicability switches disabled, shall show neither to any
          other user nor when the rule is switched off, shall show only the lock notice for a locked review, and shall
          show the message of the rule when a stale page still sends the answer.
        justification: |
          A user who cannot answer must see why and what to do instead. The rule itself is enforced by the checklist
          service, which refuses the change with the message of the rule if a stale page still sends it.
        tests:
          - ChecklistPage_Render_AuthorWhileRuleIsOn_ShowsNoticeAndDisablesControls
          - ChecklistPage_Render_AuthorOfApprovedReview_ShowsOnlyTheLockNotice
          - ChecklistPage_Answer_RuleSwitchedOnAfterLoad_ShowsTheRefusalAndStoresNothing

      - id: ReviewCenter-ChecklistPage-CarriedMarks
        title: >-
          The ChecklistPage unit shall mark on the checklist of a follow-up review every answer and every section
          state that was carried from another review with a Carried from badge that links to that review, and shall
          show, for a check that is not answered and failed in the followed review with the same wording, the earlier
          Fail and its justification, read-only, with a link to that review, until the check is answered again, and
          shall show neither on a review that follows nothing.
        justification: |
          A carried answer was given by someone else about an earlier state of the content, so the reviewer must see
          that it was carried and from where. The earlier Fail is the reason for the follow-up; showing it makes the
          reviewer decide the check again on purpose instead of overlooking it.
        tests:
          - ChecklistPage_Render_FollowUp_ShowsCarriedMarksAndEarlierFail
          - ChecklistPage_Render_FollowUp_DecidedAgainOrEarlierReview_ShowsNoEarlierFail
          - ChecklistPage_Render_FollowUp_ReworkedCheckThatFailed_ShowsNoEarlierFail

      - id: ReviewCenter-ChecklistPage-HiddenBallots
        title: >-
          The ChecklistPage unit shall tell a reviewer of a review with several reviewer slots who has not handed in
          their own ballot how many ballots are handed in out of how many, and that the answers of the others stay
          hidden until the own ballot is handed in, shall show no standing, no number of disputed checks, and no
          different-answers mark to that reviewer, shall tell a member without a slot the same count with no
          standing, shall show everything to an administrator without a ballot, and shall show none of it for a review
          with a single slot.
        justification: |
          Seeing that somebody answered differently, or what they answered, would sway the reviewer before the own
          answer is given. Who has handed in stays visible, because it tells who is still to come, and the people who
          steer the review need the whole picture. A single reviewer has nobody to be swayed by, so that page keeps
          its plain form.
        tests:
          - ChecklistPage_DraftBallot_HidesOtherBallotsAndDisputeCounts
          - ChecklistPage_MemberWithoutSlot_SeesNoStandingOnlyBallotCount
          - ChecklistPage_AdministratorWithoutBallot_SeesDifferingAnswers
          - ChecklistPage_SingleSlot_ShowsNoBallotCountsOrSideBySide

      - id: ReviewCenter-ChecklistPage-SideBySide
        title: >-
          The ChecklistPage unit shall show a reviewer who has handed in their own ballot, under every check that the
          submitted ballots answer differently, the answers by name side by side in the order of the slots, shall mark
          the check with a different-answers badge, and shall offer a Discuss button that opens a small form and
          starts a discussion thread about that check with the text given, refusing an empty text with a message
          next to the form, closing the form on cancel, and linking to the review page for the thread.
        justification: |
          After the own ballot is in, the reviewers are meant to compare and to settle the difference. Seeing who
          answered what, in one line, is the quickest way to know whom to talk to, and a button next to the check
          turns that into the conversation without a search for the right place.
        tests:
          - ChecklistPage_SubmittedBallot_ShowsSideBySideForDifferingChecks
          - ChecklistPage_DisputedCheck_DiscussStartsCheckThread
          - ChecklistPage_DiscussWithoutText_ShowsError
          - ChecklistPage_DiscussCancel_ClosesTheForm

      - id: ReviewCenter-ChecklistPage-SubmitAndSign
        title: >-
          The ChecklistPage unit shall offer, in a review with several reviewer slots whose own ballot is a complete
          draft and where nothing but the hand-in blocks the signature, a Submit and sign button as the main action
          with the password field (and the code field of the second factor) beside it, and the Submit ballot button
          as a secondary action, shall hand the ballot in and then sign when the button is pressed, keeping the
          handed-in ballot and saying so when the signature is refused, shall hand the ballot in for an account of an
          identity provider and then ask the user to confirm the identity at the provider, and shall offer neither
          button for an incomplete draft, and not Submit and sign in a review with a single slot, and shall sign only
          the digest of the record that the viewer is shown after the hand-in, so that when the reloaded view shows a
          check that the submitted ballots answer differently nothing is signed and the page says that something
          changed.
        justification: |
          Handing in and signing are two steps that most reviewers want as one, once the answers are final and nobody
          else is in the way. Offering it only when the signature would be accepted avoids a refusal, and keeping the
          hand-in when the signature fails means no work is lost. The identity provider cannot be asked from the
          same step, so the ballot is handed in first and the confirmation follows. Before the hand-in the viewer has
          not seen the answers of the other reviewers, so a signature given in the same click must never cover a
          record that the viewer has not been shown: when the view after the hand-in reveals a difference, the
          viewer reads it and signs on the review page, which is the second confirmation.
        tests:
          - ChecklistPage_CompleteDraft_OffersSubmitAndSignAsPrimaryAction
          - ChecklistPage_IncompleteDraft_OffersNoSubmitButtons
          - ChecklistPage_SubmitAndSign_SubmitsThenSigns
          - ChecklistPage_SubmitAndSign_WrongPassword_KeepsBallotAndExplains
          - ChecklistPage_SubmitAndSign_OtherReviewerChangesAnswerAfterHandIn_SignsNothingAndExplains
          - ChecklistPage_SubmitBallotAlone_DoesNotSign
          - ChecklistPage_SingleSlot_OffersNoSubmitAndSign
          - ChecklistPage_SubmitAndSign_ProviderUser_SubmitsThenAsksToConfirmIdentity

      - id: ReviewCenter-ChecklistPage-SignConfirm
        title: >-
          The SignConfirm component shall show the password field, and the code field when the user has a second
          factor, for a local account, and no field for an account of an identity provider, shall hand the entries
          to the page once when the button is pressed, and shall clear the password field afterwards.
        justification: |
          The secrets of a signature must not stay in the page, and the form must match the way the account signs in.
          The component is small and reusable, so its behavior is tested on its own.
        tests:
          - SignConfirm_PasswordUser_HandsPasswordOverOnceAndClearsField
          - SignConfirm_UserWithSecondFactor_HandsPasswordAndCodeOver
          - SignConfirm_ProviderUser_ShowsNoFieldsAndHandsOverNothing

      - id: ReviewCenter-ChecklistPage-AssignMe
        title: >-
          The ChecklistPage unit shall offer a project member who may be a reviewer and holds no slot an Assign me as
          reviewer button that adds a new slot with the user as primary reviewer and no alternate, leaving every
          existing slot as it is, and shall offer it to nobody who holds a slot or who is not a member.
        justification: |
          A member who wants to review should not need to find the page of the slots. The shortcut only ever adds a
          slot, so it can never take a place that somebody else holds.
        tests:
          - ChecklistPage_AssignMe_AddsNewSlotAndKeepsExistingOnes
          - ChecklistPage_ProjectAdministratorWithoutSlot_OffersAssignMe
          - ChecklistPage_ViewerWithSlot_OffersNoAssignMe
          - ChecklistPage_NonMember_OffersNoAssignMe
