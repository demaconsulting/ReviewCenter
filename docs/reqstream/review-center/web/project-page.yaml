---
# Software Unit Requirements for the ProjectPage Unit
#
# The ProjectPage unit is the page at /projects/{project} that shows one project with its reviews, and for whoever
# administers the project (a system administrator or a project admin) its members and a link to its audit trail,
# the page at /projects/{project}/reviews/new that holds the form to create a review from uploaded files or from a
# repository of the project, and the two pages that add a member: /projects/{project}/members/new, which adds an
# existing user by the exact user name, and /projects/{project}/members/account, which creates a new account together
# with its membership, and the page /projects/{project}/evidence-settings (EvidenceSettingsPage), where whoever
# administers the project decides who may read its evidence without signing in and what its attestation PDFs
# contain, and the page /projects/{project}/checklist (ProjectChecklistPage), where whoever administers the project
# exports, imports, checks, replaces, and resets the checklist template that new reviews start with. A project the
# user may not see, or may not administer where it matters, looks like a missing one.

sections:
  - title: ProjectPage Unit Requirements
    requirements:
      - id: ReviewCenter-ProjectPage-Show
        title: >-
          The ProjectPage unit shall show the name and description of the project, or the same not-found message
          when the project does not exist and when the user may not see it, without showing anything of the project.
        justification: |
          A stored or mistyped link must lead to a clear answer rather than to an error page. A project the user is
          no member of must be indistinguishable from a missing one, so the page does not reveal that the project
          exists. The same holds for the page of a new review of the project.
        tests:
          - ProjectPage_Render_UnknownProject_ShowsNotFound
          - ProjectPage_Render_ProjectWithoutReviews_ShowsNameAndEmptyMessage
          - ProjectPage_Render_NonMember_LooksLikeAMissingProject

      - id: ReviewCenter-ProjectPage-Members
        title: >-
          The ProjectPage unit shall show whoever administers the project (a system administrator or a project admin
          of it), and nobody else, a Members section with the members of the project, each with a role badge
          (Project admin or Member), a button that switches the role, and a Remove button, a + Add member button that
          leads to the page for a new member, an Audit trail button that leads to the audit page of the project, and
          a message that says that only system administrators can see the project when it has no members, and shall
          show no list of users.
        justification: |
          Membership decides who sees a project, so the people who run the project need to see it at a glance and to
          change it on the page of the project. Plain members do not manage membership, so they are not shown the
          section or its buttons. The page offers no list of users, so a project admin cannot browse the accounts of
          other projects.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection
          - ProjectPage_Render_PlainMember_ShowsNoMembersAndNoAuditLink

      - id: ReviewCenter-ProjectPage-MemberChange
        title: >-
          The ProjectPage unit shall let whoever administers the project switch a member between member and project
          admin and remove a member, show the outcome or the reason for a refusal, including the explanation that
          the last project admin cannot be removed or demoted, and list the members again afterwards; and shall check
          on every such action that the user still administers the project and still sees it, and, when not, change
          nothing and drop the members and the administration buttons, or replace the page with the not-found
          message when the user also lost the view of the project.
        justification: |
          Members are changed rarely and the outcome next to the list tells the administrator what changed. A
          project must keep an administrator, so the refusal is explained on the page. An open page keeps its state
          after the user is demoted or removed, and the member names are for administrators only, so a failed check
          clears them instead of showing an error above them.
        tests:
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership
          - ProjectPage_MemberChange_ProjectAdmin_ChangesRoleAndRemoves
          - ProjectPage_MemberChange_LastProjectAdminSelf_ShowsExplanationAndChangesNothing
          - ProjectPage_MemberChange_SecondAdminExists_AdminMayRemoveSelf
          - ProjectPage_MemberChange_ProjectAdminMembershipRevoked_ShowsNotFoundAndChangesNothing
          - ProjectPage_MemberChange_ProjectAdminDemoted_DropsMembersKeepsReviews
          - ProjectPage_MemberChange_SystemAdminDemotedButStillMember_DropsMembersSectionKeepsReviews
          - ProjectPage_MemberChange_SystemAdminDemotedAndNotMember_ShowsNotFoundAndNoData
          - ProjectPage_ToggleRole_SystemAdminDemoted_ChangesNothingAndDropsMembers
          - ProjectPage_MemberChange_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-ProjectPage-AddMember
        title: >-
          The ProjectPage unit shall provide the page /projects/{project}/members/new, which shows whoever
          administers the project a form with the user name to type exactly and a project admin choice, with a
          Cancel button and a Create a new account button, and no list of users to pick from, adds the existing user
          with that exact name with the chosen role and returns to the project, gives one and the same message for a
          missing, a disabled, and an unknown name without adding anything and keeping what was typed, tells that a
          user is a member already, shows the not-found message and no form to anybody else, and, when the right is
          lost while the page is open, adds nothing and drops the form.
        justification: |
          Typing the exact name keeps the add function from being a way to browse the users of the installation,
          and one message for every name that cannot be added keeps it from telling which names exist. The form is
          for administrators only and is checked again at the submission, because the page may have been open for a
          long time.
        tests:
          - NewMemberPage_Render_Administrator_ShowsFormWithoutUserList
          - NewMemberPage_Render_NoAdministerRight_ShowsNotFoundAndNoForm
          - NewMemberPage_Submit_ExistingUser_AddsWithRoleAndReturnsToTheProject
          - NewMemberPage_Submit_UnusableNames_GiveOneGenericMessageAndAddNothing
          - NewMemberPage_Submit_AlreadyMember_ShowsMessageAndKeepsTheRole
          - NewMemberPage_Submit_RightLostWhileOpen_AddsNothingAndDropsTheForm
          - NewMemberPage_Load_OtherProject_DropsWhatWasTypedAndTheProject
          - ProjectPage_AddMember_ButtonLeadsToNewMemberPage_WhichAddsTheNamedUser

      - id: ReviewCenter-ProjectPage-CreateAccount
        title: >-
          The ProjectPage unit shall provide the page /projects/{project}/members/account, which shows whoever
          administers the project a form with a user name, a display name, and a project admin choice, creates the
          account together with its membership, shows the generated temporary password once, with the user name and
          a Copy button that says whether the copy worked, until Done is pressed, shows a message next to the form
          and creates nothing for a taken or invalid name, shows the not-found message and no form to anybody else,
          and, when the right is lost while the page is open, creates nothing and drops the form and the password.
        justification: |
          A person who has no account cannot be added to a project, so a project admin must be able to create one,
          but only as part of adding it to the own project. The password is made by the application, and shown once
          and only in the memory of the page, so nobody chooses it, writes it down in the system, or can read it
          again; losing the right drops it at once.
        tests:
          - NewMemberAccountPage_Render_Administrator_ShowsTheForm
          - NewMemberAccountPage_Render_NoAdministerRight_ShowsNotFoundAndNoForm
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt
          - NewMemberAccountPage_Copy_Password_CopiesAndReportsTheResult
          - NewMemberAccountPage_Submit_TakenOrInvalidName_ShowsMessageAndCreatesNothing
          - NewMemberAccountPage_Submit_RightLostWhileOpen_CreatesNothingAndDropsTheForm
          - NewMemberAccountPage_Copy_RightLostWhilePasswordShown_DropsThePasswordAndCopiesNothing
          - NewMemberAccountPage_Load_OtherProject_DropsNamesAndPassword

      - id: ReviewCenter-ProjectPage-RepositoriesLink
        title: >-
          The ProjectPage unit shall show a Repositories button that leads to the repositories page of the project to
          a system administrator and to a project admin of the project only.
        justification: |
          Repositories belong to projects, so the project page is where they are reached from. A plain member does
          not manage them and is not offered a page that would show only a not-found message.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection

      - id: ReviewCenter-ProjectPage-Reviews
        title: >-
          The ProjectPage unit shall list the reviews of the project as rows with a link to each review and its
          title, without a badge for the stored state, which has only one value.
        justification: |
          The project page is how users reach their reviews and see where each one stands.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndApproval

      - id: ReviewCenter-ProjectPage-NewReview
        title: >-
          The ProjectPage unit shall offer a New review button that opens the page holding the review creation form
          for that project, so the project page itself shows only the reviews.
        justification: |
          Users mostly come to the project page to pick a review; the creation form is reached on purpose, from a
          button, instead of crowding the list.
        tests:
          - ProjectPage_Render_ProjectWithoutReviews_ShowsNameAndEmptyMessage

      - id: ReviewCenter-ProjectPage-Approval
        title: >-
          The ProjectPage unit shall show on each listed review a badge for its stage: Setup while it has no reviewer
          slot, Approved when it has at least one reviewer slot and every slot has a current signature, and In review
          otherwise.
        justification: |
          Users scan the project page to see which reviews are finished. The stage is computed from the current
          record, so a review whose record changed after signing is shown as In review again.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndApproval
          - ProjectPage_Render_SignedAndUnsignedReviews_ShowApprovedOrInReview

      - id: ReviewCenter-ProjectPage-Progress
        title: >-
          The ProjectPage unit shall show for each listed review, besides its link, title, and stage, the signatures
          as given of needed with the number that are out of date, what blocks the approval (open threads, unanswered
          checks, checks answered Fail), the people it waits on, the time of the last activity, and the due date with
          the Overdue badge of the rule while the review is overdue, all taken from the progress service in one read
          for the whole project.
        justification: |
          A lead opens the project page to see who is holding each review up. Showing the reason a review is not
          approved and the names to ask turns the list into a work list, and reading it in one step keeps the page
          fast for a project with many reviews.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Summary
        title: >-
          The ProjectPage unit shall show above the reviews a summary of the number of reviews of the project in each
          stage and the number that are overdue, counted over all reviews and not only the ones that a filter shows.
        justification: |
          The summary is the answer to "how are we doing" at one glance, and it must not change when the lead narrows
          the table.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-ProjectPage-ProgressFilter
        title: >-
          The ProjectPage unit shall let the user narrow the reviews by stage, to the overdue ones, to the blocked
          ones, and by a text that is part of the review identifier or title, and shall keep the choice in the query
          string of the page (stage, overdue, blocked, q), so that a link or a reload shows the same table, and shall
          say so when no review matches. A value of the query string that it does not understand shall be ignored,
          a page that is not a whole number shall show the first page, a page out of range shall be brought into
          range, and text taken from the query string or from a review shall be shown encoded, never as markup.
        justification: |
          A lead who follows up with the team wants "everything that is overdue" or "everything blocked" as a link
          that can be shared and bookmarked. The address can be typed or forged by anyone, so it must never break the
          page or inject markup into it.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable
          - ProjectPage_Render_ManyReviews_PagesBy25AndKeepsTheFilters
          - ProjectPage_Render_InvalidQueryValues_AreIgnoredAndShowTheDefaultView
          - ProjectPage_Render_InvalidPageValues_ShowAValidPage
          - ProjectPage_Render_HostileMarkup_IsRenderedEncoded

      - id: ReviewCenter-ProjectPage-ProgressSort
        title: >-
          The ProjectPage unit shall sort the reviews by identifier, stage, last activity, due date, or signatures,
          ascending or descending, through headers that are links that toggle the direction, show the reviews 25 to a
          page, and keep the sort, the direction, the filters, and the page in the query string.
        justification: |
          A project can have hundreds of reviews. The lead needs the stalest or the nearest due date first, and the
          position in the list must survive a reload or a shared link.
        tests:
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle
          - ProjectPage_Render_IdDescending_FilterFormKeepsTheSortState
          - ProjectPage_Render_ManyReviews_PagesBy25AndKeepsTheFilters

      - id: ReviewCenter-ProjectPage-ReadOnly
        title: >-
          The ProjectPage unit shall show the same table, summary, and filters to a read-only auditor of the project as
          to a member, offer the auditor no control that creates or plans a review and no list of repositories, and
          show a user outside the project the page of a project that does not exist.
        justification: |
          An auditor reads everything and changes nothing, so the page must not offer what the rules would refuse, and
          must not fail on the parts that only contributors may see. A project that the user may not see must read
          like a missing one.
        tests:
          - ProjectPage_Render_AuditorAndStranger_AuditorSeesTheTableStrangerNothing
          - ProjectPage_Render_EmptyProject_InvitesOnlyContributors

      - id: ReviewCenter-ProjectPage-Selection
        title: >-
          The ProjectPage unit shall list the name and size of each file the user selects for a new review, and
          a new selection shall replace the previous one. When the page is reused for another project, it shall
          show that project and discard the previous form values and selection.
        justification: |
          Users must see exactly which files they are about to submit before they submit them, and must be able
          to correct a wrong selection. Files chosen for one project must never be submitted into another.
        tests:
          - NewReviewPage_FileInput_FilesSelected_ListsNamesAndSizes
          - NewReviewPage_FileInput_SecondSelection_ReplacesFirst
          - NewReviewPage_ParametersChange_OtherProject_ClearsFormAndSelection

      - id: ReviewCenter-ProjectPage-Create
        title: >-
          The ProjectPage unit shall offer, on its page for a new review, a form with a review identifier, a
          title, and selected files that creates a review from the file names and contents, and then shows the
          review page.
        justification: |
          Creating a review from files is the central action of the product. Only the file name is used as the
          path, because a browser does not reveal the folder a file came from.
        tests:
          - NewReviewPage_CreateForm_ValidInput_CreatesReviewAndNavigatesToIt

      - id: ReviewCenter-ProjectPage-Error
        title: >-
          The ProjectPage unit shall show the reason when a review cannot be created, naming the identifier for
          a duplicate identifier, and shall create nothing, including when no files are selected, two selected
          files have the same name, or the sign-in state of the user has ended or the user has lost the access to the
          project while the form is open (the page then shows the page of a project that does not exist).
        justification: |
          A rejected form must tell users what to correct, and must not leave a partial review.
        tests:
          - NewReviewPage_CreateForm_NoFiles_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_DuplicateReviewId_ShowsErrorNamingTheId
          - NewReviewPage_CreateForm_DuplicateFileNames_ShowsDuplicatePathError
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing
          - NewReviewPage_CreateForm_MembershipRevoked_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-ProjectPage-ReservedId
        title: >-
          The ProjectPage unit shall refuse the review identifier "new", in any letter case, with a message that
          it is reserved, and shall create nothing.
        justification: |
          The address of the page for a new review ends in "new", so a review with that identifier could never
          be opened. Users are told to choose another identifier instead of creating an unreachable review.
        tests:
          - NewReviewPage_CreateForm_ReservedReviewId_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Limits
        title: >-
          The ProjectPage unit shall refuse a selection that has more files than the review file-count limit,
          a file larger than the per-file size limit, or files that together are larger than the total size
          limit, with an error message, before reading any content, and shall keep no selection from that
          attempt and create no review.
        justification: |
          Files are uploaded over the live connection into server memory. Refusing a selection by its reported
          count and sizes protects the server before any content is transferred, and refusing it as a whole
          ensures a partly read file set is never submitted.
        tests:
          - NewReviewPage_FileInput_FileTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TooManyFiles_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TotalSizeTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_DeclaredSizesUnderstated_RejectsOnReceivedBytes

      - id: ReviewCenter-ProjectPage-SourceChoice
        title: >-
          The ProjectPage unit shall let the user choose whether the files of a new review are uploaded or come
          from a repository, with upload as the default, shall show only the controls of the chosen source, and
          shall offer the repository source only when at least one repository of the project is enabled, saying so
          otherwise.
        justification: |
          One form serves both sources without clutter. A repository cannot be chosen when the project has none, and
          the user is told whom to ask.
        tests:
          - NewReviewPage_SourceChoice_RepositoryChosen_ShowsRepositoryFieldsInsteadOfUpload
          - NewReviewPage_SourceChoice_NoEnabledRepository_DisablesRepositorySourceWithHint

      - id: ReviewCenter-ProjectPage-RepositoryForm
        title: >-
          The ProjectPage unit shall, for the repository source, offer the enabled repositories of the project by
          name only, never showing a location, user name, or token, and never a repository of another project, a
          head revision, an optional baseline revision, and a selection that starts as "**/*", and shall create the
          review from them and show the review page, or list the skipped links and submodules with a link to the
          review when there are any.
        justification: |
          Ordinary users choose from the repositories the administrators of the project maintain and must not see
          how the server reaches the repository, nor the repositories of projects they may not see. The creator is
          told once which entries were left out.
        tests:
          - NewReviewPage_RepositorySelect_OffersOnlyEnabledRepositoriesWithoutLocationOrToken
          - NewReviewPage_RepositorySelect_OffersOnlyRepositoriesOfThisProject
          - NewReviewPage_CreateForm_FromRepository_CreatesReviewWithSourceAndNavigates
          - NewReviewPage_CreateForm_FromRepositoryWithoutBaseline_ReviewsAllFilesAtHead
          - NewReviewPage_CreateForm_SkippedEntries_AreShownBeforeOpeningTheReview

      - id: ReviewCenter-ProjectPage-RepositoryError
        title: >-
          The ProjectPage unit shall show the reason when a review from a repository cannot be created, among
          them that nothing matches the selection, that a revision does not exist, that no repository was
          chosen, and that the repository was disabled meanwhile, and shall create nothing.
        justification: |
          The user can fix a wrong revision or selection only when told which one is wrong.
        tests:
          - NewReviewPage_CreateForm_EmptySelection_ShowsNothingToReviewAndCreatesNothing
          - NewReviewPage_CreateForm_BadRevision_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_NoRepositoryChosen_AsksForOne
          - NewReviewPage_CreateForm_RepositoryDisabledMeanwhile_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-NewReviewDueDate
        title: >-
          The ProjectPage unit shall offer on its page for a new review an optional due date, which it states is a
          calendar day in UTC, for an upload and for a repository alike, shall create the review with that date, and
          shall show the reason and create nothing when the date is not a date that the rules accept.
        justification: |
          The person who creates a review often knows when it is expected. Stating the time basis keeps a date
          from being read in another time zone, and a refused date must be corrected, not dropped.
        tests:
          - NewReviewPage_CreateForm_DueDate_IsStoredWithTheReview
          - NewReviewPage_CreateForm_DueDateInThePast_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_UploadWithDueDate_StoresDateAndRefusesPastDate

      - id: ReviewCenter-ProjectPage-FollowUp
        title: >-
          The ProjectPage unit shall offer on its page for a new review, when the project has an earlier review of
          the chosen kind of source, a choice of the review to follow up, shall show for an upload what the
          follow-up would carry (the Pass and N/A answers, the not-applicable sections, the open threads, the
          resolved threads that are not carried, and the open threads of files that the new review does not have),
          shall suggest the title Follow-up to the identifier without replacing a title that was typed, shall require
          a confirmation before dropping open threads and pass it on, shall pass the choice on when it creates the
          review from files or from a repository, shall show the message of the rule when the service refuses the
          follow-up, shall offer nothing when the project has no earlier review, and shall mark a follow-up on the
          list of reviews with a link to the review it follows.
        justification: |
          The creator decides what the new review is a follow-up of, and should see what that takes over before
          creating it, and must confirm anything that would be dropped. The service decides what is allowed, so the
          page shows its refusal instead of repeating its rules.
        tests:
          - NewReviewPage_FollowUp_NoEligibleReview_HidesSelectorOrShowsEmptyHint
          - NewReviewPage_FollowUp_Selector_ListsEligibleReviewsOfTheChosenSource
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp
          - NewReviewPage_FollowUp_TypedTitle_IsNotReplacedBySuggestion
          - NewReviewPage_FollowUp_DroppedThreads_NeedTheAcknowledgement
          - NewReviewPage_FollowUp_UnfitFiles_ShowsServiceRefusal
          - NewReviewPage_FollowUp_DuplicateFileNames_ShowsRefusalInsteadOfFailing
          - NewReviewPage_FollowUp_ChoiceCleared_CreatesPlainReview
          - NewReviewPage_FollowUp_Repository_PassesChoiceAndAcknowledgement
          - ProjectPage_Render_FollowUpReview_ShowsFollowTag

      - id: ReviewCenter-ProjectPage-Interactive
        title: >-
          The ProjectPage unit shall report that it is interactive, through a marker on its root element, once
          it has rendered on a live connection.
        justification: |
          Users, automated tests, and tooling need a reliable signal that the page now responds, so that they do
          not act before the live connection exists.
        tests:
          - ProjectPage_AfterRender_Interactive_SetsMarker
          - NewMemberPage_AfterRender_Interactive_SetsMarker
          - NewMemberAccountPage_AfterRender_Interactive_SetsMarker
          - EvidenceSettingsPage_AfterRender_Interactive_SetsMarker
          - ProjectChecklistPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ProjectPage-PlanLink
        title: >-
          The ProjectPage unit shall show a link to the plan page of the project when at least one repository of the
          project is enabled, and a short note that says whom to ask when none is.
        justification: |
          Planning starts from the project page. A user must find the way in, and must be told why it is not
          offered instead of finding no link and guessing.
        tests:
          - ProjectPage_Render_PlanLink_ShownOnlyWithEnabledRepository

      - id: ReviewCenter-ProjectPage-EvidenceSettingsLink
        title: >-
          The ProjectPage unit shall show an Evidence settings button that leads to the evidence settings page of the
          project to a system administrator and to a project admin of the project only.
        justification: |
          The evidence settings decide who may read the evidence of the project without signing in, so they are
          reached from the project page by the people who may change them. A plain member does not change them and
          is not offered a page that would show only a not-found message.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons
          - ProjectPage_Render_PlainMember_ShowsNoMembersAndNoAuditLink

      - id: ReviewCenter-ProjectPage-EvidenceSettingsAccess
        title: >-
          The ProjectPage unit shall provide the page /projects/{project}/evidence-settings, which shows whoever
          administers the project (a system administrator or a project admin of it) the evidence settings form with a
          Save settings button and a Back to project button, and shows the not-found message and no form to a plain
          member, to a user who is no member, and for a project that does not exist.
        justification: |
          Anonymous access and the content of the evidence are decisions of the people who answer for the project, so
          nobody else may see or change them. The same message as for a missing project keeps the page from revealing
          that the project exists.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings
          - EvidenceSettingsPage_Render_NoAdministerRight_ShowsNotFoundAndNoSwitches

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSwitches
        title: >-
          The ProjectPage unit shall show on the evidence settings page the stored settings of the project, or the
          defaults when none are stored, as seven switches each with a short description: the anonymous evidence index
          and the anonymous attestation PDFs, both off by default, where the description of the index says that the
          index alone is useless to ReviewMark unless anonymous PDFs are on or the client has credentials, and the
          review discussion threads, the reviewer names, the checklist wording, the file list and hashes, and the git
          context of the PDFs, all on by default.
        justification: |
          The defaults keep everything behind a sign-in and keep the PDFs complete, so nothing is opened or left out
          unless someone chooses it. A person who turns a switch must be told in one sentence what it does, and the
          index switch must not promise more than it gives, because the index without the PDFs or credentials does not
          let ReviewMark verify anything.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings
          - EvidenceSettingsPage_Render_EverySwitchHasADescription
          - EvidenceSettingsPage_Render_StoredSettings_AreShown

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings
        title: >-
          The ProjectPage unit shall, while the switches are changed and before anything is saved, show below each
          content switch that is off a warning of its own that omitting it may not satisfy the regulatory regime and
          that says to confirm with the quality or compliance lead, show a summary at the top that names every
          section left out of the PDFs, and show an exposure warning while an anonymous switch is on that says that
          anyone who reaches the server can read what was opened, and in addition says
          that the PDFs still contain the review discussion or the reviewer names, whichever are on, while the
          anonymous PDFs are on; and shall show none of these when nothing is left out and nothing is anonymous.
        justification: |
          Leaving content out of the evidence, or opening it to anyone, can break the obligations of a regulated
          project. The warning belongs next to the switch that causes it and appears at once, so the person sees the
          consequence before saving instead of finding it out afterwards.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings
          - EvidenceSettingsPage_Switch_ContentOff_ShowsItsWarningAndTheBanner
          - EvidenceSettingsPage_Switch_AllContentOff_WarningsAreTailoredAndBannerListsAll
          - EvidenceSettingsPage_Switch_AnonymousOn_ShowsExposureWarningAndPeopleLine

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave
        title: >-
          The ProjectPage unit shall save all seven switches together with one Save settings button, confirm the
          saved settings in words and stay open on the page, say that there is nothing to save and record nothing when
          nothing changed, and, for a change, cause one audit entry of the project with the action
          project.evidence-settings-changed that names the changed settings with their old and new values and the
          user who saved them, so that it shows on the audit page of the project.
        justification: |
          The settings decide what leaves the system, so a change must be accountable: who changed what, from what, to
          what, and when. One save for all switches keeps the stored settings consistent, and the confirmation tells
          the person what happened.
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits
          - EvidenceSettingsPage_Save_NoChange_SaysNothingToSaveAndRecordsNothing

      - id: ReviewCenter-ProjectPage-EvidenceSettingsConflict
        title: >-
          The ProjectPage unit shall, when the settings were changed by someone else after the page loaded them,
          store nothing on save, say that the settings were changed by someone else, and show the settings that are
          stored now.
        justification: |
          Two administrators must not overwrite each other without knowing it, least of all for settings that open
          the evidence to anonymous readers. Showing the current settings lets the person decide again.
        tests:
          - EvidenceSettingsPage_Save_ChangedByOthers_ShowsMessageAndTheCurrentSettings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsRightLost
        title: >-
          The ProjectPage unit shall check on every switch change and every save that the user still administers the
          project and, when the
          right was lost while the page was open (the membership was revoked, the user was demoted, or the sign-in
          state ended), store and record nothing and replace the page with the not-found message and none of the
          settings or messages, and shall drop the choices and the project when the page is reused for another
          project.
        justification: |
          An open page keeps its state after the user is demoted or removed, and a stale page must not be able to open
          the evidence of a project to anonymous readers. Choices made for one project must not follow the user to
          another.
        tests:
          - EvidenceSettingsPage_Save_RightLostWhileOpen_StoresNothingAndDropsThePage
          - EvidenceSettingsPage_Switch_RightLostWhileOpen_DropsThePageAndTakesNoChange
          - EvidenceSettingsPage_Load_OtherProject_DropsTheChoicesAndTheProject

      - id: ReviewCenter-ProjectPage-ChecklistLink
        title: >-
          The ProjectPage unit shall show a Checklist button that leads to the checklist template page of the
          project to a system administrator and to a project admin of the project only, and shall show them in the
          Review rules card one line that names the version label of the checklist that new reviews start with, its
          number of sections and checks, and whether it is the built-in default or a custom checklist, with a link to
          that page, and shall show a plain member neither the button nor the line.
        justification: |
          The checklist that new reviews start with is decided by the people who answer for the project, so the page
          that changes it is reached from the project page by them only. The summary tells them at a glance whether
          the project still uses the default, without opening the page. A plain member does not change the template
          and is not offered a page that would show only a not-found message.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsChecklistLinkAndSummary
          - ProjectPage_Render_PlainMember_ShowsNoChecklistLinkOrSummary

      - id: ReviewCenter-ProjectPage-ChecklistAccess
        title: >-
          The ProjectPage unit shall provide the page /projects/{project}/checklist, which shows whoever administers
          the project (a system administrator or a project admin of it) the current checklist template of the project
          with its version label, its number of sections and checks, a badge when it is the built-in default, and a Back
          to project button, and shows the not-found message and nothing of the template to a plain member, to a user
          who is no member, and for a project that does not exist.
        justification: |
          The wording of the checklist is a decision of the people who answer for the project, so nobody else may see
          or change it there. The same message as for a missing project keeps the page from revealing that the project
          exists.
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary
          - ProjectChecklistPage_Render_CustomChecklist_ShowsLabelWithoutBadgeAndOffersReset
          - ProjectChecklistPage_Render_NoAdministerRight_ShowsNotFoundAndNothingElse

      - id: ReviewCenter-ProjectPage-ChecklistExport
        title: >-
          The ProjectPage unit shall let whoever may open the checklist template page download the checklist template
          of the project, and the built-in default checklist, as indented JSON files named after the version label,
          and shall download nothing once the right to administer the project was lost while the page was open.
        justification: |
          An export is the starting point for a custom template and the way to keep a copy of what the project uses.
          The built-in default is offered too, so a project that still uses the default can start from it. A page
          that stayed open after the user was demoted must not hand out the wording.
        tests:
          - ProjectChecklistPage_Export_Current_DownloadsTheDefinition
          - ProjectChecklistPage_Export_Default_DownloadsTheBuiltInDefault
          - ProjectChecklistPage_Export_RightLostWhileOpen_DownloadsNothing
          - ChecklistDiff_ToIndentedJson_RoundTripsThroughTheValidator

      - id: ReviewCenter-ProjectPage-ChecklistImport
        title: >-
          The ProjectPage unit shall let an administrator of the project bring a checklist definition into the page by
          pasting JSON text or by choosing a file of at most the size limit of a checklist (256 KiB), refuse a larger
          file, check the definition with the checklist validator when the Validate button is used, show every error
          with its path in a list (a single error for text that is not JSON or when nothing was imported), and store
          nothing while it only checks.
        justification: |
          A checklist is written outside the tool, so it must be possible to bring it in and to learn everything that
          is wrong with it at once, with the place of each error, instead of one error per attempt. Checking must not
          change what new reviews use.
        tests:
          - ProjectChecklistPage_Validate_InvalidDefinition_ShowsAllErrorsWithPaths
          - ProjectChecklistPage_Validate_NothingImported_ShowsOneError
          - ProjectChecklistPage_Validate_NotJson_ShowsOneError
          - ProjectChecklistPage_Import_File_IsReadValidatedAndPreviewed
          - ProjectChecklistPage_Import_FileTooLarge_IsRefused
          - ProjectChecklistPage_Sample_Iec62304ExampleIsValid

      - id: ReviewCenter-ProjectPage-ChecklistPreview
        title: >-
          The ProjectPage unit shall show, for a definition that is valid, a read-only preview of its sections and
          checks with their counts, and a short summary of the differences from the current checklist (the version
          label, and the sections and checks that are added, removed, or reworded, by identifier), and shall say that
          there is nothing to replace, and offer no replacement, when the definition is the same as the current one.
        justification: |
          An administrator replaces the wording that new reviews use, so they must see what they are about to
          introduce and how it differs from what is in use before they confirm. A compact summary by identifier is
          enough to notice an unintended change.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing
          - ProjectChecklistPage_Validate_SameAsCurrent_SaysNothingToReplaceAndDisablesReplace
          - ProjectChecklistPage_Validate_SameLabelOtherWording_WarnsAboutTheLabel
          - ChecklistDiff_Compare_Identical_FindsNoChange
          - ChecklistDiff_Compare_OnlyVersion_ReportsVersionChange
          - ChecklistDiff_Compare_AddedAndRemoved_ListsIdentifiers
          - ChecklistDiff_Compare_OtherWording_ListsChangedSectionsAndItems
          - ChecklistDiff_Compare_MovedItem_IsChangedNotAddedOrRemoved
          - ChecklistDiff_Compare_CaseOrderAndMissingHint_AreNotDifferences
          - ChecklistDiff_Compare_NullArgument_Throws

      - id: ReviewCenter-ProjectPage-ChecklistReplace
        title: >-
          The ProjectPage unit shall enable the Replace button only for a definition that is valid and differs from the
          current one, ask for a confirmation that says that existing reviews keep the checklist they were created with
          and only new reviews use the new one, store nothing when the confirmation is declined, replace the checklist
          of the project through the project checklist service from the hash that was read when the page loaded when it
          is confirmed, confirm the replacement in words and show the new checklist, cause one audit entry of the
          project with the action project.checklist-changed, and show the message of the rule, with nothing stored,
          when the service refuses the definition (for example a changed wording that keeps the version label).
        justification: |
          The replacement changes what every later review of the project is checked against, so it must be deliberate,
          must say what it does not change, and must be accountable. A review that exists keeps its own copy, which the
          confirmation states so that nobody expects the open reviews to change.
        tests:
          - ProjectChecklistPage_Replace_Cancelled_ChangesNothing
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits
          - ProjectChecklistPage_Replace_SameLabelOtherWording_ShowsTheRefusalAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistReset
        title: >-
          The ProjectPage unit shall offer, for a project that has a checklist of its own, a Reset to default button
          that asks for a confirmation that says that existing reviews keep their checklist, returns the project to
          the built-in default checklist through the project checklist service when it is confirmed, confirms it in
          words, and causes one audit entry of the project with the action project.checklist-changed; the button is
          disabled while the project uses the default.
        justification: |
          A project must be able to go back to the standard wording without help from the person who runs the server.
          The change is recorded like a replacement, and the confirmation says what it does not touch.
        tests:
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary

      - id: ReviewCenter-ProjectPage-ChecklistConflict
        title: >-
          The ProjectPage unit shall, when the checklist template was changed by someone else after the page read it,
          store nothing on replace or reset, say that the checklist was changed by someone else, and show the
          checklist that is stored now.
        justification: |
          Two administrators must not overwrite each other without knowing it. Showing the current checklist lets the
          person decide again with the real state in front of them.
        tests:
          - ProjectChecklistPage_Replace_ChangedByOthers_ShowsMessageAndTheCurrentChecklist
          - ProjectChecklistPage_Reset_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistRightLost
        title: >-
          The ProjectPage unit shall check on every validation, replacement, and reset that the user still administers
          the project and, when the right was lost while the page was open (the membership was revoked, the user was
          demoted, or the sign-in state ended), store and record nothing and replace the page with the not-found message
          and none of the checklist or messages, and shall drop the imported text and the project when the page is
          reused for another project.
        justification: |
          An open page keeps its state after the user is demoted or removed, and a stale page must not be able to change
          what the reviews of a project are checked against. Text imported for one project must not follow the user to
          another.
        tests:
          - ProjectChecklistPage_Action_RightLostWhileOpen_DropsThePageAndChangesNothing
          - ProjectChecklistPage_Load_OtherProject_DropsTheImportAndTheProject

      - id: ReviewCenter-ProjectPage-ReviewRules
        title: >-
          The ProjectPage unit shall show to an administrator of the project or a system administrator, and to nobody
          else, a Review rules card with a switch that requires independent reviewers, with an explanation that the
          person who created the review cannot be a reviewer or sign it and that the authors of commits are not
          matched, shall save a changed switch through the project service from the value that was loaded, and shall
          show the confirmation or the message of the rule, for example when someone else changed the setting first.
        justification: |
          The rule belongs to the people who administer the project, and a project that must let one person do both has
          to be able to switch it off. The explanation states what the tool can and cannot know about authors, so that
          nobody reads the rule as a guarantee about commits.
        tests:
          - ProjectPage_ReviewRules_AdminSavesToggle
          - ProjectPage_ReviewRules_NonAdmin_HidesCard

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches
        title: >-
          The ProjectPage unit shall show to an administrator of the project or a system administrator, and to nobody
          else, two further switches in the Review rules card (authors answering the checklist of their own review,
          and the person who reopened a review signing it again), on for a project that was not given another value,
          each with the statement that the rule is stored but not applied yet, shall save each changed switch through
          the project service from the value that was loaded, and shall show the confirmation or the message of the
          rule, for example when someone else changed the setting first, and the stored values after a refusal.
        justification: |
          The rules are stored before they are applied, so the page must say so, or an administrator would believe a
          switch protects the reviews when it does not yet. Saving from the loaded value keeps two administrators from
          silently overwriting each other, and showing the stored values after a refusal keeps the page true.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DefaultOnAndSaveEachRule
          - ProjectPage_ReviewRules_NewSwitches_StaleValue_ShowsMessageAndReloads
          - ProjectPage_ReviewRules_NewSwitches_SayNotAppliedYet
          - ProjectPage_ReviewRules_NonAdmin_HidesCard
