---
# Software Unit Requirements for the ProjectPage Unit
#
# The ProjectPage unit is the page at /projects/{project} that shows one project with its reviews, and for whoever
# administers the project (a system administrator or a project admin) its members and a link to its audit trail,
# the page at /projects/{project}/reviews/new that holds the form to create a review from uploaded files or from a
# repository of the project, and the two pages that add a member: /projects/{project}/members/new, which adds an
# existing user by the exact user name, and /projects/{project}/members/account, which creates a new account together
# with its membership, and the page /projects/{project}/evidence-settings (EvidenceSettingsPage), where whoever
# administers the project decides who may read its evidence without signing in and what its attestation PDFs
# contain, and the page /projects/{project}/checklist (ProjectChecklistPage), where whoever administers the project
# exports, imports, checks, replaces, and resets the checklist template that new reviews start with. A project the
# user may not see, or may not administer where it matters, looks like a missing one.

sections:
  - title: ProjectPage Unit Requirements
    requirements:
      - id: ReviewCenter-ProjectPage-Show
        title: >-
          The ProjectPage unit shall show the name and the description of a project to a user who may see it.
        justification: |
          The page is the entry to the work of one project, so a user who may see the project must first see which
          project it is.
        tests:
          - ProjectPage_Render_ProjectWithoutReviews_ShowsNameAndEmptyMessage

      - id: ReviewCenter-ProjectPage-Show-Missing
        title: >-
          The ProjectPage unit shall show a not-found message and nothing of a project for a project that does not
          exist.
        justification: |
          A stored or mistyped link must lead to a clear answer rather than to an error page.
        tests:
          - ProjectPage_Render_UnknownProject_ShowsNotFound

      - id: ReviewCenter-ProjectPage-Show-Hidden
        title: >-
          The ProjectPage unit shall show to a user who may not see a project the same not-found message as for a
          missing project, and nothing of the project.
        justification: |
          A project the user is no member of must be indistinguishable from a missing one, so the page does not
          reveal that the project exists.
        tests:
          - ProjectPage_Render_NonMember_LooksLikeAMissingProject

      - id: ReviewCenter-ProjectPage-Show-NewReviewHidden
        title: >-
          The ProjectPage unit shall show on the page for a new review to a user who may not see the project the same
          not-found message as for a missing project, and no form.
        justification: |
          The page for a new review must not reveal the project either, and must not offer a form that would be
          refused.
        tests:
          - NewReviewPage_Render_NonMember_LooksLikeAMissingProject

      - id: ReviewCenter-ProjectPage-Members
        title: >-
          The ProjectPage unit shall show a Members section with the members of the project, each with a role badge,
          to a system administrator and to a project admin of the project.
        justification: |
          Membership decides who sees a project, so the people who run the project need to see at a glance who
          belongs to it.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions

      - id: ReviewCenter-ProjectPage-Members-Hidden
        title: >-
          The ProjectPage unit shall show no Members section to a user who does not administer the project.
        justification: |
          The member list is administration data. Plain members do not manage membership, so they are not shown the
          section.
        tests:
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection
          - ProjectPage_Render_PlainMember_ShowsNoMembersAndNoAuditLink

      - id: ReviewCenter-ProjectPage-Members-RoleButton
        title: >-
          The ProjectPage unit shall show on each member a button that switches the role between member and project
          admin and is labeled with the new role.
        justification: |
          The administrator changes a role where the member is listed, and a label that names the new role tells what
          the button will do.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons

      - id: ReviewCenter-ProjectPage-Members-RemoveButton
        title: >-
          The ProjectPage unit shall show a Remove button on each member of the Members section.
        justification: |
          A membership is ended where it is listed, so the administrator does not have to look for another page.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons

      - id: ReviewCenter-ProjectPage-Members-AddButton
        title: >-
          The ProjectPage unit shall show to whoever administers the project a + Add member button that leads to the
          page for a new member of the project.
        justification: |
          Adding members starts on the page of the project, and the page for a new member is where the user to add is
          named.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons
          - ProjectPage_AddMember_ButtonLeadsToNewMemberPage_WhichAddsTheNamedUser

      - id: ReviewCenter-ProjectPage-Members-AddButtonHidden
        title: >-
          The ProjectPage unit shall show no + Add member button to a user who does not administer the project.
        justification: |
          The page must not offer what the rules refuse to a plain member.
        tests:
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection

      - id: ReviewCenter-ProjectPage-Members-AuditLink
        title: >-
          The ProjectPage unit shall show an Audit trail button that leads to the audit page of the project to a user
          who administers or audits the project.
        justification: |
          The audit trail is for the people who answer for the project, so they reach it from the page of the
          project.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons
          - ProjectPage_Render_Auditor_ShowsReadOnlyNoticeAndReadsNoRepositories

      - id: ReviewCenter-ProjectPage-Members-AuditLinkHidden
        title: >-
          The ProjectPage unit shall show no Audit trail button to a plain member of the project.
        justification: |
          A plain member may not read the audit trail, so the page does not offer it.
        tests:
          - ProjectPage_Render_PlainMember_ShowsNoMembersAndNoAuditLink

      - id: ReviewCenter-ProjectPage-Members-Empty
        title: >-
          The ProjectPage unit shall say, when a project has no members, that only system administrators can see the
          project.
        justification: |
          An empty list would otherwise look like an error, and the message tells the administrator why nobody but a
          system administrator can open the project.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership

      - id: ReviewCenter-ProjectPage-Members-NoUserList
        title: >-
          The ProjectPage unit shall show no list of the users of the system on the page of a project.
        justification: |
          The page offers no list of users, so a project admin cannot browse the accounts of other projects.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons

      - id: ReviewCenter-ProjectPage-MemberChange
        title: >-
          The ProjectPage unit shall switch a member between member and project admin when the role button of the
          member is used, so that the list shows the new role.
        justification: |
          The button must do what its label says, and the list must show the new role afterwards.
        tests:
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership
          - ProjectPage_MemberChange_ProjectAdmin_ChangesRoleAndRemoves

      - id: ReviewCenter-ProjectPage-MemberChange-Remove
        title: >-
          The ProjectPage unit shall remove a member from the project when the Remove button of the member is used,
          so that the list no longer shows the member.
        justification: |
          Ending a membership is the purpose of the button, and the list must not show a member who is gone.
        tests:
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership
          - ProjectPage_MemberChange_ProjectAdmin_ChangesRoleAndRemoves

      - id: ReviewCenter-ProjectPage-MemberChange-Outcome
        title: >-
          The ProjectPage unit shall show the outcome of a role change or of a removal next to the list of members.
        justification: |
          Members are changed rarely, and the outcome next to the list tells the administrator what changed.
        tests:
          - ProjectPage_MemberChange_ProjectAdmin_ShowsOutcomeOfEachChange

      - id: ReviewCenter-ProjectPage-MemberChange-LastAdmin
        title: >-
          The ProjectPage unit shall refuse to let the last project admin remove or demote the own membership, show
          the explanation next to the list, and leave the membership unchanged.
        justification: |
          A project must keep an administrator, so the refusal is explained on the page instead of leaving the
          administrator to guess why nothing happened.
        tests:
          - ProjectPage_MemberChange_LastProjectAdminSelf_ShowsExplanationAndChangesNothing

      - id: ReviewCenter-ProjectPage-MemberChange-SelfRemoval
        title: >-
          The ProjectPage unit shall let a project admin remove the own membership when another project admin exists.
        justification: |
          The rule protects the last administrator only, so an administrator who is not the last may leave.
        tests:
          - ProjectPage_MemberChange_SecondAdminExists_AdminMayRemoveSelf

      - id: ReviewCenter-ProjectPage-MemberChange-NoRight
        title: >-
          The ProjectPage unit shall change nothing when a role change or a removal is requested by a user who no
          longer administers the project.
        justification: |
          An open page keeps its state after the user is demoted or removed, so the right is checked when the action
          runs and not when the page was opened.
        tests:
          - ProjectPage_MemberChange_ProjectAdminMembershipRevoked_ShowsNotFoundAndChangesNothing
          - ProjectPage_MemberChange_ProjectAdminDemoted_DropsMembersKeepsReviews
          - ProjectPage_MemberChange_SystemAdminDemotedButStillMember_DropsMembersSectionKeepsReviews
          - ProjectPage_MemberChange_SystemAdminDemotedAndNotMember_ShowsNotFoundAndNoData
          - ProjectPage_ToggleRole_SystemAdminDemoted_ChangesNothingAndDropsMembers
          - ProjectPage_MemberChange_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-ProjectPage-MemberChange-DropMembers
        title: >-
          The ProjectPage unit shall drop the Members section and the administration buttons, and keep the reviews,
          when the user lost the right to administer the project but may still see it.
        justification: |
          The member names are for administrators only, so a failed check clears them instead of showing an error
          above them, and the page must not keep offering what is refused now.
        tests:
          - ProjectPage_MemberChange_ProjectAdminDemoted_DropsMembersKeepsReviews
          - ProjectPage_MemberChange_SystemAdminDemotedButStillMember_DropsMembersSectionKeepsReviews
          - ProjectPage_ToggleRole_SystemAdminDemoted_ChangesNothingAndDropsMembers

      - id: ReviewCenter-ProjectPage-MemberChange-NotFound
        title: >-
          The ProjectPage unit shall replace the page by the not-found message when the user lost the right to see the
          project.
        justification: |
          A project the user may no longer see must read like a missing one, and nothing of it may stay on the page.
        tests:
          - ProjectPage_MemberChange_ProjectAdminMembershipRevoked_ShowsNotFoundAndChangesNothing
          - ProjectPage_MemberChange_SystemAdminDemotedAndNotMember_ShowsNotFoundAndNoData
          - ProjectPage_MemberChange_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-ProjectPage-AddMember
        title: >-
          The ProjectPage unit shall show to whoever administers the project, on the page
          /projects/{project}/members/new, a form with a user name field and a project admin choice.
        justification: |
          The administrator names the user to add and the role of the user on the page for a new member.
        tests:
          - NewMemberPage_Render_Administrator_ShowsFormWithoutUserList

      - id: ReviewCenter-ProjectPage-AddMember-CancelButton
        title: >-
          The ProjectPage unit shall show on the page for a new member a Cancel button that leads back to the project.
        justification: |
          Leaving the page without adding anybody must be possible.
        tests:
          - NewMemberPage_Render_Administrator_ShowsFormWithoutUserList

      - id: ReviewCenter-ProjectPage-AddMember-AccountButton
        title: >-
          The ProjectPage unit shall show on the page for a new member a Create a new account button that links to the
          page for a new account of the project.
        justification: |
          A person who has no account can be added in one flow.
        tests:
          - NewMemberPage_Render_Administrator_ShowsFormWithoutUserList

      - id: ReviewCenter-ProjectPage-AddMember-NoUserList
        title: >-
          The ProjectPage unit shall show no list of the users of the system on the page for a new member.
        justification: |
          Typing the name keeps the add function from being a way to browse the users of the installation, so only the
          typed name may select a user.
        tests:
          - NewMemberPage_Render_Administrator_ShowsFormWithoutUserList

      - id: ReviewCenter-ProjectPage-AddMember-AddsUser
        title: >-
          The ProjectPage unit shall add to the project the existing user whose name was typed, with the role that was
          chosen.
        justification: |
          This is the purpose of the form: the chosen role decides what the new member may do.
        tests:
          - NewMemberPage_Submit_ExistingUser_AddsWithRoleAndReturnsToTheProject

      - id: ReviewCenter-ProjectPage-AddMember-ReturnsToProject
        title: >-
          The ProjectPage unit shall show the project page after a user was added.
        justification: |
          The administrator sees the new member in the list of the project.
        tests:
          - NewMemberPage_Submit_ExistingUser_AddsWithRoleAndReturnsToTheProject

      - id: ReviewCenter-ProjectPage-AddMember-UnusableName
        title: >-
          The ProjectPage unit shall show one and the same message for a name that does not exist and for the name of a
          disabled user, and add nobody.
        justification: |
          One message for every name that cannot be added keeps the page from telling which names exist.
        tests:
          - NewMemberPage_Submit_UnusableNames_GiveOneGenericMessageAndAddNothing

      - id: ReviewCenter-ProjectPage-AddMember-NameKept
        title: >-
          The ProjectPage unit shall keep the typed name in the field after the user could not be added.
        justification: |
          The administrator can correct a typing error instead of typing the name again.
        tests:
          - NewMemberPage_Submit_UnusableNames_GiveOneGenericMessageAndAddNothing

      - id: ReviewCenter-ProjectPage-AddMember-AlreadyMember
        title: >-
          The ProjectPage unit shall show a message for a user who already is a member and leave the role of the member
          unchanged.
        justification: |
          A second add must not silently change a role.
        tests:
          - NewMemberPage_Submit_AlreadyMember_ShowsMessageAndKeepsTheRole

      - id: ReviewCenter-ProjectPage-AddMember-NotFound
        title: >-
          The ProjectPage unit shall show on the page for a new member the not-found message and no form to a user who
          does not administer the project, and for a project that does not exist.
        justification: |
          The page must not reveal the project, and must not offer what is refused.
        tests:
          - NewMemberPage_Render_NoAdministerRight_ShowsNotFoundAndNoForm

      - id: ReviewCenter-ProjectPage-AddMember-RightLost
        title: >-
          The ProjectPage unit shall add nobody and drop the form when the user loses the right to administer the
          project while the page for a new member is open.
        justification: |
          The form is checked again at the submission, because the page may have been open for a long time.
        tests:
          - NewMemberPage_Submit_RightLostWhileOpen_AddsNothingAndDropsTheForm

      - id: ReviewCenter-ProjectPage-AddMember-OtherProject
        title: >-
          The ProjectPage unit shall drop the typed name and the old project when the page for a new member is reused
          for another project.
        justification: |
          Input for one project must never be submitted for another.
        tests:
          - NewMemberPage_Load_OtherProject_DropsWhatWasTypedAndTheProject

      - id: ReviewCenter-ProjectPage-CreateAccount
        title: >-
          The ProjectPage unit shall show to whoever administers the project, on the page
          /projects/{project}/members/account, a form with a user name field, a display name field, and a project
          admin choice.
        justification: |
          A person who has no account cannot be added to a project, so the administrator describes the new person on
          this page.
        tests:
          - NewMemberAccountPage_Render_Administrator_ShowsTheForm

      - id: ReviewCenter-ProjectPage-CreateAccount-BackButton
        title: >-
          The ProjectPage unit shall show on the page for a new account a Cancel button that leads back to the page for
          a new member.
        justification: |
          The flow can be left without creating anything.
        tests:
          - NewMemberAccountPage_Render_Administrator_ShowsTheForm

      - id: ReviewCenter-ProjectPage-CreateAccount-CreatesAccount
        title: >-
          The ProjectPage unit shall create the account of the typed names together with the membership in the project,
          with the role that was chosen.
        justification: |
          The new person can work in the project at once, but only in the project of the administrator who made the
          account.
        tests:
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt

      - id: ReviewCenter-ProjectPage-CreateAccount-TempPassword
        title: >-
          The ProjectPage unit shall show the generated temporary password with the user name in a box that says that
          it is shown only once.
        justification: |
          The password is made by the application, so nobody chooses it. The administrator must pass it on and must
          know that it cannot be read again.
        tests:
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt

      - id: ReviewCenter-ProjectPage-CreateAccount-DoneHides
        title: >-
          The ProjectPage unit shall hide the temporary password when the Done button is used.
        justification: |
          A password on the screen is a risk once it was passed on.
        tests:
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt

      - id: ReviewCenter-ProjectPage-CreateAccount-DoneReturns
        title: >-
          The ProjectPage unit shall show the project page when the Done button is used.
        justification: |
          The administrator continues with the project.
        tests:
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt

      - id: ReviewCenter-ProjectPage-CreateAccount-CopyButton
        title: >-
          The ProjectPage unit shall hand the temporary password to the clipboard of the browser when the Copy button
          is used, and say "Copied.".
        justification: |
          Typing a generated password invites errors.
        tests:
          - NewMemberAccountPage_Copy_Password_CopiesAndReportsTheResult

      - id: ReviewCenter-ProjectPage-CreateAccount-CopyFailure
        title: >-
          The ProjectPage unit shall say "Could not copy; select the password and copy it by hand." when the browser
          does not copy the password.
        justification: |
          The administrator must know to copy the password by hand.
        tests:
          - NewMemberAccountPage_Copy_Password_CopiesAndReportsTheResult

      - id: ReviewCenter-ProjectPage-CreateAccount-UnusableName
        title: >-
          The ProjectPage unit shall show a message next to the form and create nothing for a user name that is taken
          or invalid.
        justification: |
          The administrator can correct the name, and no half-made account is left behind.
        tests:
          - NewMemberAccountPage_Submit_TakenOrInvalidName_ShowsMessageAndCreatesNothing

      - id: ReviewCenter-ProjectPage-CreateAccount-NotFound
        title: >-
          The ProjectPage unit shall show on the page for a new account the not-found message and no form to a user who
          does not administer the project, and for a project that does not exist.
        justification: |
          The page must not reveal the project, and must not offer what is refused.
        tests:
          - NewMemberAccountPage_Render_NoAdministerRight_ShowsNotFoundAndNoForm

      - id: ReviewCenter-ProjectPage-CreateAccount-RightLost
        title: >-
          The ProjectPage unit shall create nothing and drop the form when the user loses the right to administer the
          project while the page for a new account is open.
        justification: |
          The form is checked again at the submission, because the page may have been open for a long time.
        tests:
          - NewMemberAccountPage_Submit_RightLostWhileOpen_CreatesNothingAndDropsTheForm

      - id: ReviewCenter-ProjectPage-CreateAccount-PasswordDropped
        title: >-
          The ProjectPage unit shall drop the temporary password and copy nothing when the user loses the right to
          administer the project while the password is shown.
        justification: |
          A password must not stay readable for a user who lost the right to administer the project.
        tests:
          - NewMemberAccountPage_Copy_RightLostWhilePasswordShown_DropsThePasswordAndCopiesNothing

      - id: ReviewCenter-ProjectPage-CreateAccount-OtherProject
        title: >-
          The ProjectPage unit shall drop the typed names and the password when the page for a new account is reused
          for another project.
        justification: |
          Data of one project must never be used for another.
        tests:
          - NewMemberAccountPage_Load_OtherProject_DropsNamesAndPassword

      - id: ReviewCenter-ProjectPage-RepositoriesLink
        title: >-
          The ProjectPage unit shall show to whoever administers the project a Repositories button that leads to the
          repositories page of the project.
        justification: |
          Repositories belong to projects, so the project page is where they are reached from.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_ProjectAdmin_ShowsRepositoriesLink

      - id: ReviewCenter-ProjectPage-RepositoriesLink-Hidden
        title: >-
          The ProjectPage unit shall show no Repositories button to a user who does not administer the project.
        justification: |
          A plain member does not manage repositories and is not offered a page that would show only a not-found
          message.
        tests:
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection

      - id: ReviewCenter-ProjectPage-Reviews
        title: >-
          The ProjectPage unit shall list the reviews of the project as rows with a link to each review and its title.
        justification: |
          The project page is how users reach their reviews.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndApproval

      - id: ReviewCenter-ProjectPage-Reviews-NoStateBadge
        title: >-
          The ProjectPage unit shall show no badge of the stored state of a review.
        justification: |
          The stored state has only one value and says nothing, so a badge for it would only crowd the row and could
          contradict the stage that is derived from the signatures.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndApproval

      - id: ReviewCenter-ProjectPage-NewReview
        title: >-
          The ProjectPage unit shall show a + New review button that links to the page for a new review of the project
          to a user who may contribute to the project.
        justification: |
          Users mostly come to the project page to pick a review, so the creation form is reached on purpose from a
          button instead of crowding the list.
        tests:
          - ProjectPage_Render_ProjectWithoutReviews_ShowsNameAndEmptyMessage

      - id: ReviewCenter-ProjectPage-Approval
        title: >-
          The ProjectPage unit shall show the stage Approved on a review that has at least one reviewer slot and whose
          every slot has a current signature of approval.
        justification: |
          Users scan the project page to see which reviews are finished. The stage is derived from the signatures and
          never stored.
        tests:
          - ProjectPage_Render_SignedAndUnsignedReviews_ShowApprovedOrInReview
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Approval-Setup
        title: >-
          The ProjectPage unit shall show the stage Setup on a review that has no reviewer slot.
        justification: |
          A review without a slot cannot be signed yet, and users must see that it is still being set up.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndApproval
          - ProjectPage_Render_SignedAndUnsignedReviews_ShowApprovedOrInReview
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Approval-Rejected
        title: >-
          The ProjectPage unit shall show the stage Rejected on a review that has at least one reviewer slot, whose
          every slot has a current signature of rejection, and that has its conclusion text.
        justification: |
          A unanimous rejection is an outcome that users must see as clearly as an approval.
        tests:
          - ProjectPage_Render_RejectedReview_ShowsStageFilterBadgeAndNoFailBlocker

      - id: ReviewCenter-ProjectPage-Approval-InReview
        title: >-
          The ProjectPage unit shall show the stage In review on a review that has a reviewer slot and is neither
          approved nor rejected.
        justification: |
          Open work must stay visible on the project page.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Approval-Current
        title: >-
          The ProjectPage unit shall count only current signatures for the stage, so that a review whose record changed
          after it was signed shows the stage In review again.
        justification: |
          A signature of an old record approves nothing, so the stage is computed from the current record.
        tests:
          - ProjectPage_Render_SignedThenChangedReview_ShowsInReviewAgain

      - id: ReviewCenter-ProjectPage-Progress
        title: >-
          The ProjectPage unit shall show for each listed review how many signatures were given of how many are
          needed, and a dash for a review in Setup.
        justification: |
          A lead opens the project page to see how far each review is.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-OutOfDate
        title: >-
          The ProjectPage unit shall say for a review in which a signature is out of date that the signature was given
          and the review changed afterwards.
        justification: |
          A signature of an old record must not read as progress.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-NoChecklist
        title: >-
          The ProjectPage unit shall name "No checklist" as a blocker of a review that has no checklist.
        justification: |
          A review without a checklist cannot be answered, so the lead must see why it does not move.
        tests:
          - ProjectPage_Render_ReviewWithoutChecklist_ShowsNoChecklistBlockerAndIsBlocked

      - id: ReviewCenter-ProjectPage-Progress-OpenThreads
        title: >-
          The ProjectPage unit shall name the number of open threads of a review as a blocker.
        justification: |
          Open questions block the approval, so the lead must see how many are open.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-UnansweredChecks
        title: >-
          The ProjectPage unit shall name the number of unanswered checks of a review as a blocker.
        justification: |
          Unanswered checks block the approval, so the lead must see how many are still open.
        tests:
          - ProjectPage_Render_UnansweredChecks_ShowsCountAsBlocker

      - id: ReviewCenter-ProjectPage-Progress-DisputedChecks
        title: >-
          The ProjectPage unit shall name the number of disputed checks of a review as a blocker to a viewer who may
          see it.
        justification: |
          Disputes must be resolved before the approval, so the lead must see how many there are.
        tests:
          - ProjectPage_Render_DisputedCheck_ShowsDisputedCountAsBlocker

      - id: ReviewCenter-ProjectPage-Progress-ConclusionNeeded
        title: >-
          The ProjectPage unit shall name "conclusion needed" as a blocker of a review that lacks its conclusion.
        justification: |
          A review ends with a conclusion, so the lead must see which reviews still need one.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary
          - ProjectPage_Render_RejectedReview_ShowsStageFilterBadgeAndNoFailBlocker

      - id: ReviewCenter-ProjectPage-Progress-NoFailCount
        title: >-
          The ProjectPage unit shall not count a check answered Fail as a blocker.
        justification: |
          A Fail is a finding, which is a result of the review and not unfinished work.
        tests:
          - ProjectPage_Render_RejectedReview_ShowsStageFilterBadgeAndNoFailBlocker
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-WaitingOn
        title: >-
          The ProjectPage unit shall name the people whose signature is still missing on a review.
        justification: |
          The lead knows whom to ask, which turns the list into a work list.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-LastActivity
        title: >-
          The ProjectPage unit shall show the time of the newest activity on each listed review.
        justification: |
          The lead finds the reviews that stand still.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary
          - ProjectPage_Render_LastActivity_ShowsTheTimeOfTheNewestActivity

      - id: ReviewCenter-ProjectPage-Progress-DueDate
        title: >-
          The ProjectPage unit shall show the due date of each listed review, or a dash for a review without one.
        justification: |
          The lead sees what is expected when.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-Overdue
        title: >-
          The ProjectPage unit shall show an Overdue badge on a review whose due date has passed.
        justification: |
          Late work must stand out in the list.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Progress-Culture
        title: >-
          The ProjectPage unit shall write the creation date, the last activity, and the due date in the invariant
          culture, in Gregorian digits, whatever culture the request has.
        justification: |
          A date in the calendar of the culture of the visitor (such as the Buddhist year) would disagree with the
          review page and the API.
        tests:
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-ProjectPage-Progress-DateAttributes
        title: >-
          The ProjectPage unit shall give the creation time and the last activity time as machine-readable time
          attributes in the invariant culture.
        justification: |
          Tools and screen readers read the exact moment, and it must not depend on the culture of the request.
        tests:
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-ProjectPage-Summary
        title: >-
          The ProjectPage unit shall show above the reviews a summary of the number of reviews in Setup, In review, and
          Approved.
        justification: |
          The summary is the answer to "how are we doing" at one glance.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Summary-Rejected
        title: >-
          The ProjectPage unit shall show the number of rejected reviews in the summary.
        justification: |
          Rejections must not vanish from the count of the project.
        tests:
          - ProjectPage_Render_RejectedReview_ShowsStageFilterBadgeAndNoFailBlocker

      - id: ReviewCenter-ProjectPage-Summary-Overdue
        title: >-
          The ProjectPage unit shall show the number of overdue reviews in the summary.
        justification: |
          Late work is the first thing a lead looks for.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-ProjectPage-Summary-AllReviews
        title: >-
          The ProjectPage unit shall count all reviews of the project in the summary, and not only the ones that a
          filter shows.
        justification: |
          The summary describes the project, and it must not change when the lead narrows the table.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-ProjectPage-ProgressFilter
        title: >-
          The ProjectPage unit shall show only the reviews of the stage named in the query value stage (Setup, In
          review, Approved, or Rejected).
        justification: |
          A lead works through one stage at a time, and the choice in the address can be shared and bookmarked.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable
          - ProjectPage_Render_RejectedReview_ShowsStageFilterBadgeAndNoFailBlocker

      - id: ReviewCenter-ProjectPage-ProgressFilter-Overdue
        title: >-
          The ProjectPage unit shall show only the overdue reviews when the query value overdue is 1.
        justification: |
          A lead who follows up with the team wants everything that is overdue as a link.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-ProjectPage-ProgressFilter-Blocked
        title: >-
          The ProjectPage unit shall show only the blocked reviews when the query value blocked is 1.
        justification: |
          Blocked work needs somebody to act, and a lead wants it as a link.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable
          - ProjectPage_Render_ReviewWithoutChecklist_ShowsNoChecklistBlockerAndIsBlocked
          - ProjectPage_Render_DisputedCheck_ShowsDisputedCountAsBlocker

      - id: ReviewCenter-ProjectPage-ProgressFilter-Text
        title: >-
          The ProjectPage unit shall show only the reviews whose identifier or title contains the query value q,
          ignoring case.
        justification: |
          A project can have hundreds of reviews, so the lead must be able to find one by a part of its name.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-ProjectPage-ProgressFilter-NoMatch
        title: >-
          The ProjectPage unit shall show a message instead of the table when no review matches the filters.
        justification: |
          An empty table looks like an error.
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-ProjectPage-ProgressFilter-Ignored
        title: >-
          The ProjectPage unit shall ignore a value of the query string that it does not understand and show the
          default view.
        justification: |
          The address can be typed or forged by anyone, and an old or hand-edited link must still show the page.
        tests:
          - ProjectPage_Render_InvalidQueryValues_AreIgnoredAndShowTheDefaultView

      - id: ReviewCenter-ProjectPage-ProgressFilter-PageNotNumber
        title: >-
          The ProjectPage unit shall show the first page when the query value page is not a whole number.
        justification: |
          A damaged link must still show the page instead of failing.
        tests:
          - ProjectPage_Render_InvalidPageValues_ShowAValidPage

      - id: ReviewCenter-ProjectPage-ProgressFilter-PageRange
        title: >-
          The ProjectPage unit shall bring a page number outside the existing pages into range, a number below the
          first to the first page and a number above the last to the last page.
        justification: |
          A link to a page that has disappeared must still show data.
        tests:
          - ProjectPage_Render_InvalidPageValues_ShowAValidPage
          - ProjectPage_Render_ManyReviews_PagesBy25AndKeepsTheFilters

      - id: ReviewCenter-ProjectPage-ProgressFilter-Encoded
        title: >-
          The ProjectPage unit shall show text taken from the query string or from a review encoded, never as markup.
        justification: |
          The address can be forged by anyone, so it must never inject markup into the page.
        tests:
          - ProjectPage_Render_HostileMarkup_IsRenderedEncoded

      - id: ReviewCenter-ProjectPage-ProgressSort
        title: >-
          The ProjectPage unit shall sort the reviews by identifier, ascending by default and descending when asked.
        justification: |
          The identifier order is the natural order of a list of reviews.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle
          - ProjectPage_Render_IdDescending_FilterFormKeepsTheSortState

      - id: ReviewCenter-ProjectPage-ProgressSort-Stage
        title: >-
          The ProjectPage unit shall sort the reviews by stage in the order Setup, In review, Approved, and by
          identifier within a stage.
        justification: |
          The lead groups the reviews by progress.
        tests:
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle

      - id: ReviewCenter-ProjectPage-ProgressSort-Signatures
        title: >-
          The ProjectPage unit shall sort the reviews by the share of signatures given.
        justification: |
          The lead finds the reviews that are nearly done or that have not started.
        tests:
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle

      - id: ReviewCenter-ProjectPage-ProgressSort-Activity
        title: >-
          The ProjectPage unit shall sort the reviews by the time of the last activity, newest first by default.
        justification: |
          The lead finds the reviews that have seen no work for the longest time.
        tests:
          - ProjectPage_Render_QuerySortActivity_OrdersByLastActivity

      - id: ReviewCenter-ProjectPage-ProgressSort-Due
        title: >-
          The ProjectPage unit shall sort the reviews by due date and put the reviews without a due date last in either
          direction.
        justification: |
          The lead wants the nearest due date first, and a review without a date must not hide the ones with a date.
        tests:
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle

      - id: ReviewCenter-ProjectPage-ProgressSort-Direction
        title: >-
          The ProjectPage unit shall take the sort direction from the query value dir (asc or desc) and use the default
          direction of the column when the value is not understood.
        justification: |
          A damaged link must still sort.
        tests:
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle
          - ProjectPage_Render_InvalidQueryValues_AreIgnoredAndShowTheDefaultView

      - id: ReviewCenter-ProjectPage-ProgressSort-HeaderLinks
        title: >-
          The ProjectPage unit shall make each column header a link that sorts by the column, toggles the direction of
          the column that is sorted now, and marks that column with the aria-sort attribute.
        justification: |
          Sorting needs no extra control, and assistive technology learns which column is sorted.
        tests:
          - ProjectPage_Render_QuerySort_OrdersTheTableAndTheHeaderLinksToggle

      - id: ReviewCenter-ProjectPage-ProgressSort-PageSize
        title: >-
          The ProjectPage unit shall show the reviews 25 to a page, with the range shown and the total.
        justification: |
          A project can have hundreds of reviews, and a page of that size would be slow and hard to scan.
        tests:
          - ProjectPage_Render_ManyReviews_PagesBy25AndKeepsTheFilters

      - id: ReviewCenter-ProjectPage-ProgressSort-LinksKeepState
        title: >-
          The ProjectPage unit shall keep the sort, the direction, the filters, and the page in the query string of
          every link and of the filter form of the page.
        justification: |
          The position in the list must survive a reload or a shared link.
        tests:
          - ProjectPage_Render_ManyReviews_PagesBy25AndKeepsTheFilters
          - ProjectPage_Render_IdDescending_FilterFormKeepsTheSortState
          - ProjectPage_Render_FilteredAndSorted_LinksKeepTheOtherState

      - id: ReviewCenter-ProjectPage-ReadOnly
        title: >-
          The ProjectPage unit shall show the same table, summary, and filters to a read-only auditor of the project as
          to a member.
        justification: |
          An auditor reads everything and changes nothing.
        tests:
          - ProjectPage_Render_AuditorAndStranger_AuditorSeesTheTableStrangerNothing

      - id: ReviewCenter-ProjectPage-ReadOnly-NoControls
        title: >-
          The ProjectPage unit shall offer a read-only auditor no control that creates or plans a review, or that
          administers the project.
        justification: |
          The page must not offer what the rules would refuse.
        tests:
          - ProjectPage_Render_Auditor_ShowsReadOnlyNoticeAndReadsNoRepositories

      - id: ReviewCenter-ProjectPage-ReadOnly-Notice
        title: >-
          The ProjectPage unit shall show a read-only auditor a notice that the project is read-only for the auditor.
        justification: |
          The auditor learns why the controls are missing.
        tests:
          - ProjectPage_Render_Auditor_ShowsReadOnlyNoticeAndReadsNoRepositories

      - id: ReviewCenter-ProjectPage-ReadOnly-NoRepositoryRead
        title: >-
          The ProjectPage unit shall read no repository of the project for a read-only auditor.
        justification: |
          The list of repositories is for contributors, and the page must not fail on the parts that only
          contributors may see.
        tests:
          - ProjectPage_Render_Auditor_ShowsReadOnlyNoticeAndReadsNoRepositories

      - id: ReviewCenter-ProjectPage-ReadOnly-NewReviewPage
        title: >-
          The ProjectPage unit shall show a read-only auditor on the page for a new review the read-only notice instead
          of the form.
        justification: |
          The form would be refused anyway, so it is not offered.
        tests:
          - NewReviewPage_Render_Auditor_ShowsReadOnlyNoticeInsteadOfTheForm

      - id: ReviewCenter-ProjectPage-ReadOnly-EmptyProject
        title: >-
          The ProjectPage unit shall show on a project without reviews a neutral message, without the invitation to add
          the first review, to a user who may not contribute.
        justification: |
          An auditor cannot add a review, so the invitation would mislead.
        tests:
          - ProjectPage_Render_EmptyProject_InvitesOnlyContributors

      - id: ReviewCenter-ProjectPage-ReadOnly-Stranger
        title: >-
          The ProjectPage unit shall show a user outside the project the not-found state and no table.
        justification: |
          A project that the user may not see must read like a missing one.
        tests:
          - ProjectPage_Render_AuditorAndStranger_AuditorSeesTheTableStrangerNothing

      - id: ReviewCenter-ProjectPage-ReadOnly-OwnRole
        title: >-
          The ProjectPage unit shall show a project admin who made the own role auditor the read-only notice and the
          Audit trail button, and neither the members card nor the + New review button.
        justification: |
          The rights are recomputed after a role change, so the page follows the new role at once.
        tests:
          - ProjectPage_MemberRoles_AdminChangesOwnRole_RightsAreRecomputed

      - id: ReviewCenter-ProjectPage-MemberRoles
        title: >-
          The ProjectPage unit shall name the role of every member on the members card as member, auditor, or project
          admin.
        justification: |
          The administrator sees who may do what in the project.
        tests:
          - ProjectPage_MemberRoles_ThreeRoles_AreNamedAndChangedExplicitly

      - id: ReviewCenter-ProjectPage-MemberRoles-ExplicitChange
        title: >-
          The ProjectPage unit shall change the role of a member only by buttons that name the new role, and offer no
          toggle for an auditor.
        justification: |
          A toggle between two values would turn an auditor into an administrator by accident.
        tests:
          - ProjectPage_MemberRoles_ThreeRoles_AreNamedAndChangedExplicitly

      - id: ReviewCenter-ProjectPage-MemberRoles-AddPageAuditor
        title: >-
          The ProjectPage unit shall offer the auditor role on the page for a new member and add the user with that
          role.
        justification: |
          Auditors are added like other members.
        tests:
          - NewMemberPage_Submit_AuditorChosen_AddsTheUserAsAuditor

      - id: ReviewCenter-ProjectPage-MemberRoles-AccountPageAuditor
        title: >-
          The ProjectPage unit shall offer the auditor role on the page for a new account and create the account with
          that role.
        justification: |
          Auditors are created like other members.
        tests:
          - NewMemberAccountPage_Submit_AuditorChosen_CreatesTheAccountAsAuditor

      - id: ReviewCenter-ProjectPage-MemberRoles-AddPageCombination
        title: >-
          The ProjectPage unit shall refuse on the page for a new member to combine the project admin role and the
          auditor role, show "Choose either project admin or auditor, not both.", and add nobody.
        justification: |
          An administrator who is read-only has no meaning.
        tests:
          - NewMemberPage_Submit_AdminAndAuditorTogether_ShowsMessageAndAddsNothing

      - id: ReviewCenter-ProjectPage-MemberRoles-AccountPageCombination
        title: >-
          The ProjectPage unit shall refuse on the page for a new account to combine the project admin role and the
          auditor role, show "Choose either project admin or auditor, not both.", and create nothing.
        justification: |
          An administrator who is read-only has no meaning.
        tests:
          - NewMemberAccountPage_Submit_AdminAndAuditorTogether_ShowsMessageAndCreatesNothing

      - id: ReviewCenter-ProjectPage-MemberRoles-OpenWork
        title: >-
          The ProjectPage unit shall refuse to change the role of a member who holds an unsigned review slot, show the
          reason that names the review, and leave the role unchanged.
        justification: |
          The administrator must resolve the open work before the role can change, and the reason tells which work.
        tests:
          - ProjectPage_MemberRoles_OpenWorkAndLastAdmin_AreRefusedWithAMessage

      - id: ReviewCenter-ProjectPage-MemberRoles-LastAdmin
        title: >-
          The ProjectPage unit shall refuse to make the last project admin an auditor, show the reason, and leave the
          role unchanged.
        justification: |
          A project without an administrator could not be managed.
        tests:
          - ProjectPage_MemberRoles_OpenWorkAndLastAdmin_AreRefusedWithAMessage

      - id: ReviewCenter-ProjectPage-MemberRoles-OwnRole
        title: >-
          The ProjectPage unit shall show a project admin who made the own role member the + New review button and no
          members card.
        justification: |
          The rights are recomputed after a role change, so the page follows the new role at once.
        tests:
          - ProjectPage_MemberRoles_AdminChangesOwnRole_RightsAreRecomputed

      - id: ReviewCenter-ProjectPage-Selection
        title: >-
          The ProjectPage unit shall list the name and size of each file the user selects for a new review.
        justification: |
          Users must see exactly which files they are about to submit before they submit them.
        tests:
          - NewReviewPage_FileInput_FilesSelected_ListsNamesAndSizes

      - id: ReviewCenter-ProjectPage-Selection-Replacement
        title: >-
          The ProjectPage unit shall replace the previous file selection of a new review with a new selection.
        justification: |
          Users must be able to correct a wrong selection by choosing again.
        tests:
          - NewReviewPage_FileInput_SecondSelection_ReplacesFirst

      - id: ReviewCenter-ProjectPage-Selection-OtherProject
        title: >-
          The ProjectPage unit shall show the other project when the page for a new review is reused for another
          project.
        justification: |
          A reused page that kept showing the first project would send the user's work to the wrong place.
        tests:
          - NewReviewPage_ParametersChange_OtherProject_ClearsFormAndSelection

      - id: ReviewCenter-ProjectPage-Selection-OtherProjectReset
        title: >-
          The ProjectPage unit shall discard the previous form values and the file selection when the page for a new
          review is reused for another project.
        justification: |
          Files chosen for one project must never be submitted into another.
        tests:
          - NewReviewPage_ParametersChange_OtherProject_ClearsFormAndSelection

      - id: ReviewCenter-ProjectPage-Create
        title: >-
          The ProjectPage unit shall offer, on its page for a new review, a form with a review identifier, a title and
          selected files that creates a review from the file names and contents.
        justification: |
          Creating a review from files is the central action of the product. Only the file name is used as the path,
          because a browser does not reveal the folder a file came from.
        tests:
          - NewReviewPage_CreateForm_ValidInput_CreatesReviewAndNavigatesToIt

      - id: ReviewCenter-ProjectPage-Create-ShowsReview
        title: >-
          The ProjectPage unit shall show the review page after it has created a review from the form.
        justification: |
          The creator continues with the review that was just created.
        tests:
          - NewReviewPage_CreateForm_ValidInput_CreatesReviewAndNavigatesToIt

      - id: ReviewCenter-ProjectPage-Error
        title: >-
          The ProjectPage unit shall show the reason on its page for a new review when a review cannot be created from
          the form.
        justification: |
          A rejected form must tell users what to correct.
        tests:
          - NewReviewPage_CreateForm_NoFiles_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_DuplicateReviewId_ShowsErrorNamingTheId
          - NewReviewPage_CreateForm_DuplicateFileNames_ShowsDuplicatePathError

      - id: ReviewCenter-ProjectPage-Error-NoFiles
        title: >-
          The ProjectPage unit shall refuse a form without selected files and show an error that mentions the files.
        justification: |
          A review needs files, and the user is told that they are missing.
        tests:
          - NewReviewPage_CreateForm_NoFiles_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Error-DuplicateId
        title: >-
          The ProjectPage unit shall refuse a review identifier that the project already uses and name that identifier
          in the error.
        justification: |
          Identifiers are unique within a project, and naming the identifier shows what to change.
        tests:
          - NewReviewPage_CreateForm_DuplicateReviewId_ShowsErrorNamingTheId

      - id: ReviewCenter-ProjectPage-Error-DuplicateFileNames
        title: >-
          The ProjectPage unit shall refuse selected files that have the same name and name the duplicated path in the
          error.
        justification: |
          Only the file name is used as the path, so two files with the same name cannot both be part of a review.
        tests:
          - NewReviewPage_CreateForm_DuplicateFileNames_ShowsDuplicatePathError

      - id: ReviewCenter-ProjectPage-Error-SessionEnded
        title: >-
          The ProjectPage unit shall show the page of a project that does not exist when the sign-in state of the user
          has ended while the form is open.
        justification: |
          An ended session must not be able to create a review, and the page must not reveal the project.
        tests:
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Error-AccessLost
        title: >-
          The ProjectPage unit shall show the page of a project that does not exist when the user has lost the access to
          the project while the form is open.
        justification: |
          A user who was removed from the project must not be able to create a review, and must not see the project.
        tests:
          - NewReviewPage_CreateForm_MembershipRevoked_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Error-NothingCreated
        title: >-
          The ProjectPage unit shall leave the reviews of the project unchanged when it refuses the form or shows the
          page of a project that does not exist.
        justification: |
          A rejected form must not leave a partial review.
        tests:
          - NewReviewPage_CreateForm_NoFiles_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_DuplicateReviewId_ShowsErrorNamingTheId
          - NewReviewPage_CreateForm_DuplicateFileNames_ShowsDuplicatePathError
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing
          - NewReviewPage_CreateForm_MembershipRevoked_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-ProjectPage-ReservedId
        title: >-
          The ProjectPage unit shall refuse the review identifier "new", in any letter case, with a message that it is
          reserved.
        justification: |
          The address of the page for a new review ends in "new", so a review with that identifier could never be
          opened. Users are told to choose another identifier instead.
        tests:
          - NewReviewPage_CreateForm_ReservedReviewId_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-ReservedId-NothingCreated
        title: >-
          The ProjectPage unit shall create no review for the reserved review identifier "new".
        justification: |
          A refused identifier must not leave an unreachable review behind.
        tests:
          - NewReviewPage_CreateForm_ReservedReviewId_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Limits
        title: >-
          The ProjectPage unit shall refuse a selection of more files than the review file-count limit allows and name
          the limit in the error.
        justification: |
          Files are uploaded over the live connection into server memory, so the number of files must be bounded.
        tests:
          - NewReviewPage_FileInput_TooManyFiles_ShowsErrorAndKeepsNothing

      - id: ReviewCenter-ProjectPage-Limits-FileSize
        title: >-
          The ProjectPage unit shall refuse a selection that contains a file larger than the per-file size limit and
          name that file in the error.
        justification: |
          A single large file must not be read into server memory.
        tests:
          - NewReviewPage_FileInput_FileTooLarge_ShowsErrorAndKeepsNothing

      - id: ReviewCenter-ProjectPage-Limits-TotalSize
        title: >-
          The ProjectPage unit shall refuse a selection whose files are together larger than the total size limit and
          say so in the error.
        justification: |
          The sum of the files must be bounded too, because each file may be within its own limit.
        tests:
          - NewReviewPage_FileInput_TotalSizeTooLarge_ShowsErrorAndKeepsNothing

      - id: ReviewCenter-ProjectPage-Limits-ReceivedBytes
        title: >-
          The ProjectPage unit shall refuse files whose received bytes exceed the limits although the browser declared
          smaller sizes.
        justification: |
          The sizes that a client declares cannot be trusted, so the bytes actually received are checked.
        tests:
          - NewReviewPage_FileInput_DeclaredSizesUnderstated_RejectsOnReceivedBytes

      - id: ReviewCenter-ProjectPage-Limits-BeforeReading
        title: >-
          The ProjectPage unit shall refuse a selection that breaks the file-count limit or a declared size limit before
          it reads the content of any file.
        justification: |
          Refusing a selection by its reported count and sizes protects the server before any content is transferred.
        tests:
          - NewReviewPage_FileInput_DeclaredLimitsExceeded_OpensNoStream

      - id: ReviewCenter-ProjectPage-Limits-NoSelectionKept
        title: >-
          The ProjectPage unit shall keep no file in the selection after it has refused a selection because of a limit.
        justification: |
          A refused selection as a whole must never be submitted, and a partly read file set must not remain.
        tests:
          - NewReviewPage_FileInput_FileTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TooManyFiles_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TotalSizeTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_DeclaredSizesUnderstated_RejectsOnReceivedBytes
          - NewReviewPage_FileInput_DeclaredLimitsExceeded_OpensNoStream

      - id: ReviewCenter-ProjectPage-Limits-NothingCreated
        title: >-
          The ProjectPage unit shall create no review from a selection that it has refused because of a limit.
        justification: |
          A refused selection must leave the project unchanged.
        tests:
          - NewReviewPage_FileInput_FileTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TooManyFiles_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TotalSizeTooLarge_ShowsErrorAndKeepsNothing

      - id: ReviewCenter-ProjectPage-SourceChoice
        title: >-
          The ProjectPage unit shall let the user choose on the page for a new review whether the files are uploaded or
          come from a repository, with upload as the default, and show only the controls of the chosen source.
        justification: |
          One form serves both sources without clutter.
        tests:
          - NewReviewPage_SourceChoice_RepositoryChosen_ShowsRepositoryFieldsInsteadOfUpload

      - id: ReviewCenter-ProjectPage-SourceChoice-RepositoryOffered
        title: >-
          The ProjectPage unit shall offer the repository source only when at least one repository of the project is
          enabled.
        justification: |
          A repository cannot be chosen when the project has none that can be used.
        tests:
          - NewReviewPage_SourceChoice_RepositoryChosen_ShowsRepositoryFieldsInsteadOfUpload
          - NewReviewPage_SourceChoice_NoEnabledRepository_DisablesRepositorySourceWithHint

      - id: ReviewCenter-ProjectPage-SourceChoice-NoRepositoryHint
        title: >-
          The ProjectPage unit shall say, when no repository of the project is enabled, that the project has no
          repository and that a project administrator can add one.
        justification: |
          The user is told whom to ask instead of finding a disabled choice and guessing.
        tests:
          - NewReviewPage_SourceChoice_NoEnabledRepository_DisablesRepositorySourceWithHint

      - id: ReviewCenter-ProjectPage-RepositoryForm
        title: >-
          The ProjectPage unit shall offer for the repository source the enabled repositories of the project by name
          only, never showing a location, user name, or token.
        justification: |
          Ordinary users choose from the repositories the administrators of the project maintain and must not see how
          the server reaches a repository.
        tests:
          - NewReviewPage_RepositorySelect_OffersOnlyEnabledRepositoriesWithoutLocationOrToken

      - id: ReviewCenter-ProjectPage-RepositoryForm-ThisProjectOnly
        title: >-
          The ProjectPage unit shall offer no repository of another project for the repository source.
        justification: |
          The repositories of projects the user may not see must stay unseen.
        tests:
          - NewReviewPage_RepositorySelect_OffersOnlyRepositoriesOfThisProject

      - id: ReviewCenter-ProjectPage-RepositoryForm-Revisions
        title: >-
          The ProjectPage unit shall show for the repository source a head revision field, an optional baseline
          revision field, and a selection field that starts as "**/*".
        justification: |
          These three fields define what is reviewed.
        tests:
          - NewReviewPage_SourceChoice_RepositoryChosen_ShowsRepositoryFieldsInsteadOfUpload
          - NewReviewPage_CreateForm_FromRepositoryWithoutBaseline_ReviewsAllFilesAtHead

      - id: ReviewCenter-ProjectPage-RepositoryForm-Creates
        title: >-
          The ProjectPage unit shall create the review from the chosen repository, the head revision, and the baseline
          revision, and show the review page.
        justification: |
          This is the purpose of the form, and the user continues with the new review.
        tests:
          - NewReviewPage_CreateForm_FromRepository_CreatesReviewWithSourceAndNavigates

      - id: ReviewCenter-ProjectPage-RepositoryForm-NoBaseline
        title: >-
          The ProjectPage unit shall review all selected files at the head revision when no baseline revision is given.
        justification: |
          A first review has no earlier revision to compare with.
        tests:
          - NewReviewPage_CreateForm_FromRepositoryWithoutBaseline_ReviewsAllFilesAtHead

      - id: ReviewCenter-ProjectPage-RepositoryForm-SkippedEntries
        title: >-
          The ProjectPage unit shall list the skipped links and submodules with a link to the review, and not open the
          review at once, when there are any.
        justification: |
          The creator is told once which entries were left out.
        tests:
          - NewReviewPage_CreateForm_SkippedEntries_AreShownBeforeOpeningTheReview

      - id: ReviewCenter-ProjectPage-RepositoryError
        title: >-
          The ProjectPage unit shall show the reason and create nothing when no file matching the selection changed
          between the baseline and the head.
        justification: |
          The user can fix a wrong selection only when told that nothing matches it.
        tests:
          - NewReviewPage_CreateForm_EmptySelection_ShowsNothingToReviewAndCreatesNothing

      - id: ReviewCenter-ProjectPage-RepositoryError-BadRevision
        title: >-
          The ProjectPage unit shall show a message that names the revision and create nothing when a revision does not
          exist.
        justification: |
          The user can fix a wrong revision only when told which one is wrong.
        tests:
          - NewReviewPage_CreateForm_BadRevision_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-RepositoryError-NoneChosen
        title: >-
          The ProjectPage unit shall ask for a repository and create nothing when no repository was chosen.
        justification: |
          The user must know what is missing.
        tests:
          - NewReviewPage_CreateForm_NoRepositoryChosen_AsksForOne

      - id: ReviewCenter-ProjectPage-RepositoryError-Disabled
        title: >-
          The ProjectPage unit shall show a message that names the repository and create nothing when the repository
          was disabled after the form was opened.
        justification: |
          A disabled repository cannot be used any more, and the user must be told so.
        tests:
          - NewReviewPage_CreateForm_RepositoryDisabledMeanwhile_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-NewReviewDueDate
        title: >-
          The ProjectPage unit shall offer on its page for a new review an optional due date field that may stay empty.
        justification: |
          The person who creates a review often knows when it is expected, but does not have to say.
        tests:
          - NewReviewPage_Render_DueDateField_StatesCalendarDayInUtc
          - NewReviewPage_CreateForm_DueDateInThePast_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-NewReviewDueDate-UtcStatement
        title: >-
          The ProjectPage unit shall state next to the due date field that the date is a calendar day in UTC.
        justification: |
          Stating the time basis keeps a date from being read in another time zone.
        tests:
          - NewReviewPage_Render_DueDateField_StatesCalendarDayInUtc

      - id: ReviewCenter-ProjectPage-NewReviewDueDate-Stored
        title: >-
          The ProjectPage unit shall create a review from an upload with the due date that was entered.
        justification: |
          The date is the point of the field, and it must reach the review that is created from files.
        tests:
          - NewReviewPage_CreateForm_UploadWithDueDate_StoresDateAndRefusesPastDate

      - id: ReviewCenter-ProjectPage-NewReviewDueDate-StoredFromRepository
        title: >-
          The ProjectPage unit shall create a review from a repository with the due date that was entered.
        justification: |
          The date is the point of the field, and it must reach the review that is created from a repository too.
        tests:
          - NewReviewPage_CreateForm_DueDate_IsStoredWithTheReview

      - id: ReviewCenter-ProjectPage-NewReviewDueDate-PastDate
        title: >-
          The ProjectPage unit shall refuse a due date in the past and name the due date in the error.
        justification: |
          A date in the past is a mistake that must be corrected, not dropped.
        tests:
          - NewReviewPage_CreateForm_DueDateInThePast_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_UploadWithDueDate_StoresDateAndRefusesPastDate

      - id: ReviewCenter-ProjectPage-NewReviewDueDate-PastDateNothingCreated
        title: >-
          The ProjectPage unit shall create no review when it has refused the due date.
        justification: |
          A refused date must leave the project unchanged.
        tests:
          - NewReviewPage_CreateForm_DueDateInThePast_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_UploadWithDueDate_StoresDateAndRefusesPastDate

      - id: ReviewCenter-ProjectPage-FollowUp
        title: >-
          The ProjectPage unit shall offer on its page for a new review, when the project has an earlier review of the
          chosen kind of source, a choice of the review to follow up.
        justification: |
          The creator decides what the new review is a follow-up of, and only an earlier review that suits the chosen
          source can be followed.
        tests:
          - NewReviewPage_FollowUp_Selector_ListsEligibleReviewsOfTheChosenSource

      - id: ReviewCenter-ProjectPage-FollowUp-NoEarlierReview
        title: >-
          The ProjectPage unit shall offer no choice of a review to follow up when the project has no earlier review.
        justification: |
          There is nothing to choose, so the page must not show an empty selector.
        tests:
          - NewReviewPage_FollowUp_NoEligibleReview_HidesSelectorOrShowsEmptyHint

      - id: ReviewCenter-ProjectPage-FollowUp-Answers
        title: >-
          The ProjectPage unit shall show in the follow-up preview how many Pass and N/A answers the follow-up would
          carry.
        justification: |
          The creator should see what the new review takes over before creating it.
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-ProjectPage-FollowUp-NotApplicableSections
        title: >-
          The ProjectPage unit shall show in the follow-up preview how many sections marked not applicable the follow-up
          would carry.
        justification: |
          The creator should see what the new review takes over before creating it.
        tests:
          - NewReviewPage_FollowUp_NotApplicableSection_PreviewCountsIt

      - id: ReviewCenter-ProjectPage-FollowUp-OpenThreads
        title: >-
          The ProjectPage unit shall show in the follow-up preview how many open threads the follow-up would carry.
        justification: |
          The creator should see what the new review takes over before creating it.
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-ProjectPage-FollowUp-ResolvedThreads
        title: >-
          The ProjectPage unit shall show in the follow-up preview how many resolved threads the follow-up would not
          carry.
        justification: |
          The creator should see what the new review leaves behind.
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-ProjectPage-FollowUp-CheckDiscussions
        title: >-
          The ProjectPage unit shall show in the follow-up preview how many check discussions the follow-up would not
          carry.
        justification: |
          The creator should see what the new review leaves behind.
        tests:
          - NewReviewPage_FollowUp_CheckThreads_PreviewCountsThemAsNotCarried

      - id: ReviewCenter-ProjectPage-FollowUp-DroppedFiles
        title: >-
          The ProjectPage unit shall list in the follow-up preview the files of the earlier review that the new review
          does not have and whose open threads would be dropped.
        justification: |
          The creator must see which open threads are lost before confirming the loss.
        tests:
          - NewReviewPage_FollowUp_DroppedThreads_NeedTheAcknowledgement

      - id: ReviewCenter-ProjectPage-FollowUp-Title
        title: >-
          The ProjectPage unit shall suggest the title "Follow-up to" followed by the identifier of the review that is
          followed.
        justification: |
          A suggested title saves typing and names the relation.
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-ProjectPage-FollowUp-TypedTitle
        title: >-
          The ProjectPage unit shall keep a title that the user typed instead of replacing it with the suggestion.
        justification: |
          Text typed by the user must never be overwritten.
        tests:
          - NewReviewPage_FollowUp_TypedTitle_IsNotReplacedBySuggestion

      - id: ReviewCenter-ProjectPage-FollowUp-Acknowledgement
        title: >-
          The ProjectPage unit shall refuse to create a follow-up that would drop open threads until the user confirms
          that the threads were checked.
        justification: |
          Dropped threads are lost, so the creator must confirm deliberately, and the confirmation starts unchecked.
        tests:
          - NewReviewPage_FollowUp_DroppedThreads_NeedTheAcknowledgement

      - id: ReviewCenter-ProjectPage-FollowUp-AcknowledgementPassed
        title: >-
          The ProjectPage unit shall pass the confirmation of dropped threads on when it creates the follow-up.
        justification: |
          The service decides what is allowed and needs the confirmation to accept the follow-up.
        tests:
          - NewReviewPage_FollowUp_DroppedThreads_NeedTheAcknowledgement
          - NewReviewPage_FollowUp_Repository_PassesChoiceAndAcknowledgement

      - id: ReviewCenter-ProjectPage-FollowUp-UploadCreation
        title: >-
          The ProjectPage unit shall create the review from files as a follow-up of the chosen earlier review.
        justification: |
          The relation to the earlier review is recorded when the files are uploaded.
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-ProjectPage-FollowUp-RepositoryCreation
        title: >-
          The ProjectPage unit shall create the review from a repository as a follow-up of the chosen earlier review.
        justification: |
          The relation to the earlier review is recorded when the files come from a repository.
        tests:
          - NewReviewPage_FollowUp_Repository_PassesChoiceAndAcknowledgement

      - id: ReviewCenter-ProjectPage-FollowUp-PlainReview
        title: >-
          The ProjectPage unit shall remove the follow-up preview and create a plain review when the choice of the
          review to follow up is cleared.
        justification: |
          Following up is optional, and a cleared choice must not leave anything carried behind.
        tests:
          - NewReviewPage_FollowUp_ChoiceCleared_CreatesPlainReview

      - id: ReviewCenter-ProjectPage-FollowUp-Refusal
        title: >-
          The ProjectPage unit shall show the message of the service instead of the follow-up preview when the service
          refuses the follow-up, for example for files that do not fit the earlier review or for a path that appears
          more than once.
        justification: |
          The service decides what is allowed, so the page shows its refusal instead of repeating its rules or failing.
        tests:
          - NewReviewPage_FollowUp_UnfitFiles_ShowsServiceRefusal
          - NewReviewPage_FollowUp_DuplicateFileNames_ShowsRefusalInsteadOfFailing

      - id: ReviewCenter-ProjectPage-FollowUp-RefusalOnCreate
        title: >-
          The ProjectPage unit shall show the same message of the service and create no review when the user creates a
          follow-up that the service refuses.
        justification: |
          A refused follow-up must be explained and must leave the project unchanged.
        tests:
          - NewReviewPage_FollowUp_UnfitFiles_ShowsServiceRefusal
          - NewReviewPage_FollowUp_DuplicateFileNames_ShowsRefusalInsteadOfFailing

      - id: ReviewCenter-ProjectPage-FollowUp-FollowTag
        title: >-
          The ProjectPage unit shall mark a follow-up in the list of reviews of a project with a tag that links to the
          review it follows.
        justification: |
          The list shows the relation between reviews, and the link leads to the earlier review.
        tests:
          - ProjectPage_Render_FollowUpReview_ShowsFollowTag

      - id: ReviewCenter-ProjectPage-Interactive
        title: >-
          The ProjectPage unit shall report that it is interactive, through a marker on its root element, once
          it has rendered on a live connection.
        justification: |
          Users, automated tests, and tooling need a reliable signal that the page now responds, so that they do
          not act before the live connection exists.
        tests:
          - ProjectPage_AfterRender_Interactive_SetsMarker
          - NewMemberPage_AfterRender_Interactive_SetsMarker
          - NewMemberAccountPage_AfterRender_Interactive_SetsMarker
          - EvidenceSettingsPage_AfterRender_Interactive_SetsMarker
          - ProjectChecklistPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ProjectPage-PlanLink
        title: >-
          The ProjectPage unit shall show the link Plan reviews to the plan page of the project when at least one
          repository of the project is enabled.
        justification: |
          Planning starts from the project page, so a user must find the way in.
        tests:
          - ProjectPage_Render_PlanLink_ShownOnlyWithEnabledRepository

      - id: ReviewCenter-ProjectPage-PlanLink-Unavailable
        title: >-
          The ProjectPage unit shall show instead of the link, when no repository of the project is enabled, a note
          that says whom to ask.
        justification: |
          A user must be told why planning is not offered instead of finding no link and guessing.
        tests:
          - ProjectPage_Render_PlanLinkUnavailable_PlainMember_NamesWhomToAsk

      - id: ReviewCenter-ProjectPage-PlanLink-Disabled
        title: >-
          The ProjectPage unit shall not count a disabled repository as enabled for the plan link and its note.
        justification: |
          A disabled repository cannot be used for planning, so it must not make the link appear.
        tests:
          - ProjectPage_Render_PlanLink_OnlyDisabledRepository_ShowsNoLinkAndNote

      - id: ReviewCenter-ProjectPage-EvidenceSettingsLink
        title: >-
          The ProjectPage unit shall show a project admin an Evidence settings button that leads to the evidence
          settings page of the project.
        justification: |
          The evidence settings decide who may read the evidence of the project without signing in, so the people who
          may change them reach them from the project page.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsMembersAndButtons

      - id: ReviewCenter-ProjectPage-EvidenceSettingsLink-SystemAdmin
        title: >-
          The ProjectPage unit shall show a system administrator an Evidence settings button that leads to the evidence
          settings page of the project.
        justification: |
          A system administrator administers every project, including the ones without a membership.
        tests:
          - ProjectPage_Render_SystemAdministrator_ShowsEvidenceChecklistAndRulesControls

      - id: ReviewCenter-ProjectPage-EvidenceSettingsLink-Hidden
        title: >-
          The ProjectPage unit shall show a plain member no Evidence settings button.
        justification: |
          A plain member does not change the settings and is not offered a page that would show only a not-found
          message.
        tests:
          - ProjectPage_Render_PlainMember_ShowsNoMembersAndNoAuditLink

      - id: ReviewCenter-ProjectPage-EvidenceSettingsAccess
        title: >-
          The ProjectPage unit shall show the evidence settings form of a project to a project admin and to a system
          administrator.
        justification: |
          Anonymous access and the content of the evidence are decisions of the people who answer for the project.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsAccess-BackButton
        title: >-
          The ProjectPage unit shall show a Back to project button on the evidence settings page that leads to the
          project.
        justification: |
          The user returns to the project without using the browser.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsAccess-NotFound
        title: >-
          The ProjectPage unit shall show the not-found message and no settings form on the evidence settings page to a
          user who does not administer the project.
        justification: |
          Nobody else may see or change the settings, and the page must not reveal that the project exists.
        tests:
          - EvidenceSettingsPage_Render_NoAdministerRight_ShowsNotFoundAndNoSwitches

      - id: ReviewCenter-ProjectPage-EvidenceSettingsAccess-MissingProject
        title: >-
          The ProjectPage unit shall show the same not-found message and no settings form on the evidence settings page
          for a project that does not exist.
        justification: |
          The same message as for a hidden project keeps the page from telling the two apart.
        tests:
          - EvidenceSettingsPage_Render_NoAdministerRight_ShowsNotFoundAndNoSwitches

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSwitches
        title: >-
          The ProjectPage unit shall show the stored evidence settings of the project as switches on the evidence
          settings page.
        justification: |
          The person who changes a setting must see what is in force now.
        tests:
          - EvidenceSettingsPage_Render_StoredSettings_AreShown

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSwitches-Defaults
        title: >-
          The ProjectPage unit shall show the default settings when none are stored: the anonymous evidence index and
          the anonymous attestation PDFs off, and the five content switches on.
        justification: |
          The defaults keep everything behind a sign-in and keep the PDFs complete, so nothing is opened or left out
          unless someone chooses it.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSwitches-Descriptions
        title: >-
          The ProjectPage unit shall show a short description with each of the seven switches.
        justification: |
          A person who turns a switch must be told in one sentence what it does.
        tests:
          - EvidenceSettingsPage_Render_EverySwitchHasADescription

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSwitches-IndexDescription
        title: >-
          The ProjectPage unit shall say in the description of the anonymous evidence index that the index alone is
          useless to ReviewMark unless credentials are used.
        justification: |
          The index switch must not promise more than it gives, because the index alone does not let ReviewMark verify
          anything.
        tests:
          - EvidenceSettingsPage_Render_EverySwitchHasADescription

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings
        title: >-
          The ProjectPage unit shall show, as soon as a content switch is turned off and before anything is saved, a
          warning below that switch that says that omitting it may not satisfy the regulatory regime and to confirm with
          the quality or compliance lead.
        justification: |
          Leaving content out of the evidence can break the obligations of a regulated project, and the person should
          see the consequence before saving.
        tests:
          - EvidenceSettingsPage_Switch_ContentOff_ShowsItsWarningAndTheBanner

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings-Removed
        title: >-
          The ProjectPage unit shall remove the warning of a content switch when the switch is turned on again.
        justification: |
          A warning for a condition that no longer holds would mislead.
        tests:
          - EvidenceSettingsPage_Switch_ContentOff_ShowsItsWarningAndTheBanner

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings-Banner
        title: >-
          The ProjectPage unit shall show a summary at the top of the evidence settings page that names every section
          that is left out of the PDFs.
        justification: |
          One summary tells the person what the PDFs will lack without reading every switch.
        tests:
          - EvidenceSettingsPage_Switch_ContentOff_ShowsItsWarningAndTheBanner
          - EvidenceSettingsPage_Switch_AllContentOff_WarningsAreTailoredAndBannerListsAll

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings-ReviewerNames
        title: >-
          The ProjectPage unit shall word the warning for omitted reviewer names as "Omitting reviewer names may not
          satisfy your regulatory regime" followed by the advice to confirm with the quality or compliance lead.
        justification: |
          Reviewer names are what identifies the signers, so their omission has its own warning.
        tests:
          - EvidenceSettingsPage_Switch_AllContentOff_WarningsAreTailoredAndBannerListsAll

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings-Exposure
        title: >-
          The ProjectPage unit shall show an exposure warning, that anyone who can reach the server can read what was
          opened, while an anonymous switch is on.
        justification: |
          Anonymous evidence can be read by anyone, and the person must know that before saving.
        tests:
          - EvidenceSettingsPage_Switch_AnonymousOn_ShowsExposureWarningAndPeopleLine

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings-PeopleLine
        title: >-
          The ProjectPage unit shall say, while the anonymous attestation PDFs are on, that the PDFs still contain the
          review discussion and the reviewer names, naming only the ones that are on.
        justification: |
          Anonymous PDFs can show people data, and the person must know which data would be public.
        tests:
          - EvidenceSettingsPage_Switch_AnonymousOn_ShowsExposureWarningAndPeopleLine

      - id: ReviewCenter-ProjectPage-EvidenceSettingsWarnings-NoneByDefault
        title: >-
          The ProjectPage unit shall show no warning and no summary for the default settings.
        justification: |
          Settings that need no attention must not raise an alarm.
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave
        title: >-
          The ProjectPage unit shall store the changed evidence switches when the user saves them with the Save settings
          button.
        justification: |
          The settings decide what leaves the system, and one save keeps the stored settings consistent.
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave-StaysOpen
        title: >-
          The ProjectPage unit shall stay open on the evidence settings page, showing the saved choices, after a save.
        justification: |
          The person sees the result and can continue.
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave-Confirmation
        title: >-
          The ProjectPage unit shall confirm a saved change with the text "Evidence settings saved.".
        justification: |
          The confirmation tells the person what happened.
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave-NothingToSave
        title: >-
          The ProjectPage unit shall say that there is nothing to save when the user saves without a change.
        justification: |
          A save without a change must not look like it did something.
        tests:
          - EvidenceSettingsPage_Save_NoChange_SaysNothingToSaveAndRecordsNothing

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave-NothingRecorded
        title: >-
          The ProjectPage unit shall record no audit entry when the user saves without a change.
        justification: |
          An empty entry would make the audit trail harder to read.
        tests:
          - EvidenceSettingsPage_Save_NoChange_SaysNothingToSaveAndRecordsNothing

      - id: ReviewCenter-ProjectPage-EvidenceSettingsSave-Audit
        title: >-
          The ProjectPage unit shall cause for a saved change one audit entry of the project with the action
          project.evidence-settings-changed that names the changed settings with their old and new values and the user
          who saved them.
        justification: |
          The settings decide what leaves the system, so a change must be accountable: who changed what, from what, to
          what.
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits

      - id: ReviewCenter-ProjectPage-EvidenceSettingsConflict
        title: >-
          The ProjectPage unit shall say that the settings were changed by someone else when the user saves after
          somebody else changed them following the loading of the page.
        justification: |
          Two administrators must not overwrite each other without knowing it.
        tests:
          - EvidenceSettingsPage_Save_ChangedByOthers_ShowsMessageAndTheCurrentSettings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsConflict-NothingStored
        title: >-
          The ProjectPage unit shall leave the stored settings and the audit trail unchanged when it refuses a save
          because the settings were changed by someone else.
        justification: |
          The refused change must not take effect, least of all for settings that open the evidence to anonymous
          readers.
        tests:
          - EvidenceSettingsPage_Save_ChangedByOthers_ShowsMessageAndTheCurrentSettings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsConflict-ShowsStored
        title: >-
          The ProjectPage unit shall show the settings that are stored now, instead of the unsaved choices, after it
          refused a save because the settings were changed by someone else.
        justification: |
          The person can decide again from the current state.
        tests:
          - EvidenceSettingsPage_Save_ChangedByOthers_ShowsMessageAndTheCurrentSettings

      - id: ReviewCenter-ProjectPage-EvidenceSettingsRightLost
        title: >-
          The ProjectPage unit shall replace the evidence settings page with the not-found message, without form, error
          or status, when the user saves after the right to administer the project was lost while the page was open.
        justification: |
          An open page keeps its state after the user is demoted or removed, and a stale page must not act.
        tests:
          - EvidenceSettingsPage_Save_RightLostWhileOpen_StoresNothingAndDropsThePage

      - id: ReviewCenter-ProjectPage-EvidenceSettingsRightLost-NothingChanged
        title: >-
          The ProjectPage unit shall store and record nothing when the user saves or changes a switch after the right to
          administer the project was lost while the page was open.
        justification: |
          A stale page must not be able to open the evidence of a project to anonymous readers.
        tests:
          - EvidenceSettingsPage_Save_RightLostWhileOpen_StoresNothingAndDropsThePage
          - EvidenceSettingsPage_Switch_RightLostWhileOpen_DropsThePageAndTakesNoChange

      - id: ReviewCenter-ProjectPage-EvidenceSettingsRightLost-Switch
        title: >-
          The ProjectPage unit shall replace the evidence settings with the not-found message, without warning, summary
          or settings, when the user changes a switch after the right to administer the project was lost while the page
          was open.
        justification: |
          The right is checked on every change, not only when saving.
        tests:
          - EvidenceSettingsPage_Switch_RightLostWhileOpen_DropsThePageAndTakesNoChange

      - id: ReviewCenter-ProjectPage-EvidenceSettingsRightLost-OtherProject
        title: >-
          The ProjectPage unit shall show the not-found message and nothing of the previous project when the evidence
          settings page is reused for a project that the user does not administer.
        justification: |
          Nothing of one project may follow the user to another.
        tests:
          - EvidenceSettingsPage_Load_OtherProject_DropsTheChoicesAndTheProject

      - id: ReviewCenter-ProjectPage-ChecklistLink
        title: >-
          The ProjectPage unit shall show a project admin a Checklist button that leads to the checklist page of the
          project.
        justification: |
          The checklist that new reviews start with is decided by the people who answer for the project.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsChecklistLinkAndSummary

      - id: ReviewCenter-ProjectPage-ChecklistLink-SystemAdmin
        title: >-
          The ProjectPage unit shall show a system administrator a Checklist button that leads to the checklist page of
          the project.
        justification: |
          A system administrator administers every project, including the ones without a membership.
        tests:
          - ProjectPage_Render_SystemAdministrator_ShowsEvidenceChecklistAndRulesControls

      - id: ReviewCenter-ProjectPage-ChecklistLink-Hidden
        title: >-
          The ProjectPage unit shall show a plain member no Checklist button.
        justification: |
          A plain member does not change the checklist and is not offered a page that would show only a not-found
          message.
        tests:
          - ProjectPage_Render_PlainMember_ShowsNoChecklistLinkOrSummary

      - id: ReviewCenter-ProjectPage-ChecklistLink-Summary
        title: >-
          The ProjectPage unit shall show a project admin, in the Review rules card, one line with the version label of
          the checklist that new reviews start with, its number of sections and checks, and whether it is the built-in
          default or a custom checklist.
        justification: |
          The summary tells the administrator at a glance whether the project still uses the default.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsChecklistLinkAndSummary
          - ProjectPage_Render_SystemAdministrator_ShowsEvidenceChecklistAndRulesControls

      - id: ReviewCenter-ProjectPage-ChecklistLink-SummaryLink
        title: >-
          The ProjectPage unit shall link the checklist summary in the Review rules card to the checklist page.
        justification: |
          The administrator can open the checklist from the card.
        tests:
          - ProjectPage_Render_ProjectAdmin_ShowsChecklistLinkAndSummary

      - id: ReviewCenter-ProjectPage-ChecklistLink-SummaryHidden
        title: >-
          The ProjectPage unit shall show a plain member no checklist summary.
        justification: |
          The card and its summary are for the administrators of the project.
        tests:
          - ProjectPage_Render_PlainMember_ShowsNoChecklistLinkOrSummary

      - id: ReviewCenter-ProjectPage-ChecklistAccess
        title: >-
          The ProjectPage unit shall show a project admin and a system administrator the current checklist of the
          project with its version label and its numbers of sections and checks.
        justification: |
          The wording of the checklist is a decision of the people who answer for the project.
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary
          - ProjectChecklistPage_Render_CustomChecklist_ShowsLabelWithoutBadgeAndOffersReset

      - id: ReviewCenter-ProjectPage-ChecklistAccess-DefaultBadge
        title: >-
          The ProjectPage unit shall show a badge on the checklist page when the current checklist is the built-in
          default and none when it is a custom checklist.
        justification: |
          The administrator sees which checklist is in use.
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary
          - ProjectChecklistPage_Render_CustomChecklist_ShowsLabelWithoutBadgeAndOffersReset

      - id: ReviewCenter-ProjectPage-ChecklistAccess-BackButton
        title: >-
          The ProjectPage unit shall show a Back to project button on the checklist page that leads to the project.
        justification: |
          The user returns to the project without using the browser.
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary

      - id: ReviewCenter-ProjectPage-ChecklistAccess-NotFound
        title: >-
          The ProjectPage unit shall show the not-found message and nothing of the checklist on the checklist page to a
          user who does not administer the project.
        justification: |
          Nobody else may see or change the checklist there, and the page must not reveal that the project exists.
        tests:
          - ProjectChecklistPage_Render_NoAdministerRight_ShowsNotFoundAndNothingElse

      - id: ReviewCenter-ProjectPage-ChecklistAccess-MissingProject
        title: >-
          The ProjectPage unit shall show the same not-found message and nothing of the checklist on the checklist page
          for a project that does not exist.
        justification: |
          The same message as for a hidden project keeps the page from telling the two apart.
        tests:
          - ProjectChecklistPage_Render_NoAdministerRight_ShowsNotFoundAndNothingElse

      - id: ReviewCenter-ProjectPage-ChecklistExport
        title: >-
          The ProjectPage unit shall let an administrator download the current checklist of the project as a JSON file
          named after its version label.
        justification: |
          An export is the starting point for a custom checklist and the way to keep a copy of what the project uses.
        tests:
          - ProjectChecklistPage_Export_Current_DownloadsTheDefinition

      - id: ReviewCenter-ProjectPage-ChecklistExport-Default
        title: >-
          The ProjectPage unit shall let an administrator download the built-in default checklist as a JSON file named
          after its version label.
        justification: |
          A project that still uses the default can start from it.
        tests:
          - ProjectChecklistPage_Export_Default_DownloadsTheBuiltInDefault

      - id: ReviewCenter-ProjectPage-ChecklistExport-IndentedJson
        title: >-
          The ProjectPage unit shall write an exported checklist as indented JSON.
        justification: |
          An indented file can be read and edited by a person.
        tests:
          - ChecklistDiff_ToIndentedJson_RoundTripsThroughTheValidator
          - ProjectChecklistPage_Export_Current_DownloadsTheDefinition

      - id: ReviewCenter-ProjectPage-ChecklistExport-ReadsBack
        title: >-
          The ProjectPage unit shall write an exported checklist so that the checklist validator accepts it and finds
          the same checklist.
        justification: |
          An export that cannot be imported again would be useless as a starting point.
        tests:
          - ChecklistDiff_ToIndentedJson_RoundTripsThroughTheValidator
          - ProjectChecklistPage_Export_Current_DownloadsTheDefinition
          - ProjectChecklistPage_Export_Default_DownloadsTheBuiltInDefault

      - id: ReviewCenter-ProjectPage-ChecklistExport-LineBreak
        title: >-
          The ProjectPage unit shall end an exported checklist file with a line break.
        justification: |
          A file that ends with a line break behaves well in editors and in version control.
        tests:
          - ChecklistDiff_ToIndentedJson_RoundTripsThroughTheValidator

      - id: ReviewCenter-ProjectPage-ChecklistExport-RightLost
        title: >-
          The ProjectPage unit shall download nothing when the user exports after the right to administer the project
          was lost while the page was open.
        justification: |
          A page that stayed open after the user was demoted must not hand out the wording.
        tests:
          - ProjectChecklistPage_Export_RightLostWhileOpen_DownloadsNothing

      - id: ReviewCenter-ProjectPage-ChecklistImport
        title: >-
          The ProjectPage unit shall let an administrator paste a checklist definition as JSON text into the checklist
          page and check it with the Validate button.
        justification: |
          A checklist is written outside the tool, so it must be possible to bring it in.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing
          - ProjectChecklistPage_Validate_InvalidDefinition_ShowsAllErrorsWithPaths

      - id: ReviewCenter-ProjectPage-ChecklistImport-File
        title: >-
          The ProjectPage unit shall let an administrator choose a JSON file as the checklist definition and check its
          text like a pasted one.
        justification: |
          A file is the usual source of a checklist.
        tests:
          - ProjectChecklistPage_Import_File_IsReadValidatedAndPreviewed

      - id: ReviewCenter-ProjectPage-ChecklistImport-FileName
        title: >-
          The ProjectPage unit shall show the name of the chosen checklist file.
        justification: |
          The administrator sees which file is being checked.
        tests:
          - ProjectChecklistPage_Import_File_IsReadValidatedAndPreviewed

      - id: ReviewCenter-ProjectPage-ChecklistImport-FileTooLarge
        title: >-
          The ProjectPage unit shall refuse a chosen checklist file larger than 256 KiB and name the limit in the error.
        justification: |
          The size of the text that is read must be bounded.
        tests:
          - ProjectChecklistPage_Import_FileTooLarge_IsRefused

      - id: ReviewCenter-ProjectPage-ChecklistImport-RefusedFileDropsImport
        title: >-
          The ProjectPage unit shall drop the earlier import when it refuses a chosen checklist file.
        justification: |
          An old import must not be mistaken for the content of the refused file.
        tests:
          - ProjectChecklistPage_Import_FileTooLarge_IsRefused

      - id: ReviewCenter-ProjectPage-ChecklistImport-AllErrors
        title: >-
          The ProjectPage unit shall list every error of an invalid checklist definition with its path.
        justification: |
          The administrator learns everything that is wrong at once, with the place of each error, instead of one error
          per attempt.
        tests:
          - ProjectChecklistPage_Validate_InvalidDefinition_ShowsAllErrorsWithPaths

      - id: ReviewCenter-ProjectPage-ChecklistImport-NothingChangedNotice
        title: >-
          The ProjectPage unit shall say that nothing was changed when it shows the errors of an invalid checklist
          definition.
        justification: |
          The administrator must know that the checklist of the project is still the old one.
        tests:
          - ProjectChecklistPage_Validate_InvalidDefinition_ShowsAllErrorsWithPaths

      - id: ReviewCenter-ProjectPage-ChecklistImport-NoPreview
        title: >-
          The ProjectPage unit shall show no preview for an invalid checklist definition.
        justification: |
          A preview would suggest that the definition can be used.
        tests:
          - ProjectChecklistPage_Validate_InvalidDefinition_ShowsAllErrorsWithPaths

      - id: ReviewCenter-ProjectPage-ChecklistImport-NotJson
        title: >-
          The ProjectPage unit shall show a single error with the path "json" for a text that is not JSON.
        justification: |
          A text that is not JSON has one cause, which is clearest when named once.
        tests:
          - ProjectChecklistPage_Validate_NotJson_ShowsOneError

      - id: ReviewCenter-ProjectPage-ChecklistImport-NothingImported
        title: >-
          The ProjectPage unit shall show a single error when the administrator validates and nothing was imported.
        justification: |
          An empty import has one cause, which is clearest when named once.
        tests:
          - ProjectChecklistPage_Validate_NothingImported_ShowsOneError

      - id: ReviewCenter-ProjectPage-ChecklistImport-NothingStored
        title: >-
          The ProjectPage unit shall store and audit nothing while it only checks a checklist definition.
        justification: |
          Checking is a dry run that must not change what new reviews use.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistImport-Sample
        title: >-
          The ProjectPage unit shall accept the IEC 62304 example checklist definition of the user guide as valid.
        justification: |
          The example in the documentation must work.
        tests:
          - ProjectChecklistPage_Sample_Iec62304ExampleIsValid

      - id: ReviewCenter-ProjectPage-ChecklistPreview
        title: >-
          The ProjectPage unit shall show for a valid checklist definition a preview with its version label and its
          numbers of sections and checks.
        justification: |
          The administrator sees what would be used before replacing anything.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Sections
        title: >-
          The ProjectPage unit shall list in the preview every section and check of a valid checklist definition with
          its wording.
        justification: |
          The administrator reads the wording before replacing the checklist.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Version
        title: >-
          The ProjectPage unit shall state in the preview how the version label changes from the current checklist to
          the definition, or that it is unchanged.
        justification: |
          Version labels identify checklists, so a change or a missing change must be visible.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing
          - ProjectChecklistPage_Validate_SameLabelOtherWording_WarnsAboutTheLabel
          - ChecklistDiff_Compare_OnlyVersion_ReportsVersionChange

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Added
        title: >-
          The ProjectPage unit shall list in the preview, by identifier, the sections and checks that the definition
          adds to the current checklist.
        justification: |
          A compact list by identifier is enough to notice an unintended addition.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing
          - ChecklistDiff_Compare_AddedAndRemoved_ListsIdentifiers

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Removed
        title: >-
          The ProjectPage unit shall list in the preview, by identifier, the sections and checks that the definition
          removes from the current checklist.
        justification: |
          A compact list by identifier is enough to notice an unintended removal.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing
          - ChecklistDiff_Compare_AddedAndRemoved_ListsIdentifiers

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Reworded
        title: >-
          The ProjectPage unit shall list in the preview the sections and checks of the definition whose wording differs
          from the current checklist.
        justification: |
          A reworded check changes what the reviewers are asked, so it must be visible.
        tests:
          - ProjectChecklistPage_Validate_SameLabelOtherWording_WarnsAboutTheLabel
          - ChecklistDiff_Compare_OtherWording_ListsChangedSectionsAndItems

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Moved
        title: >-
          The ProjectPage unit shall report a check that the definition moves to another section as changed and not as
          added or removed.
        justification: |
          A moved check is the same check, and reporting it twice would hide that.
        tests:
          - ChecklistDiff_Compare_MovedItem_IsChangedNotAddedOrRemoved

      - id: ReviewCenter-ProjectPage-ChecklistPreview-Ignored
        title: >-
          The ProjectPage unit shall report no difference for a change of letter case, of order or of a missing hint
          only.
        justification: |
          Differences that do not change the questions would hide the real ones.
        tests:
          - ChecklistDiff_Compare_CaseOrderAndMissingHint_AreNotDifferences

      - id: ReviewCenter-ProjectPage-ChecklistPreview-NoChange
        title: >-
          The ProjectPage unit shall find no difference between identical checklists.
        justification: |
          Without a baseline of no difference every other difference would be doubtful.
        tests:
          - ChecklistDiff_Compare_Identical_FindsNoChange

      - id: ReviewCenter-ProjectPage-ChecklistPreview-NothingToReplace
        title: >-
          The ProjectPage unit shall say that there is nothing to replace when the definition equals the current
          checklist.
        justification: |
          An empty replacement must not look like a change.
        tests:
          - ProjectChecklistPage_Validate_SameAsCurrent_SaysNothingToReplaceAndDisablesReplace

      - id: ReviewCenter-ProjectPage-ChecklistPreview-LabelWarning
        title: >-
          The ProjectPage unit shall warn when the definition keeps the version label of the current checklist but
          differs in content.
        justification: |
          The label must change when the wording changes, or two checklists would share one label.
        tests:
          - ProjectChecklistPage_Validate_SameLabelOtherWording_WarnsAboutTheLabel

      - id: ReviewCenter-ProjectPage-ChecklistPreview-NullArgument
        title: >-
          The ProjectPage unit shall refuse a missing checklist when it compares two checklists or writes one as JSON.
        justification: |
          A missing checklist is a programming error that must fail loudly.
        tests:
          - ChecklistDiff_Compare_NullArgument_Throws

      - id: ReviewCenter-ProjectPage-ChecklistReplace
        title: >-
          The ProjectPage unit shall enable the Replace button only for a checklist definition that is valid and differs
          from the current checklist.
        justification: |
          An invalid or identical definition cannot be a replacement.
        tests:
          - ProjectChecklistPage_Validate_ValidDefinition_ShowsPreviewAndDifferencesAndStoresNothing
          - ProjectChecklistPage_Validate_SameAsCurrent_SaysNothingToReplaceAndDisablesReplace
          - ProjectChecklistPage_Validate_InvalidDefinition_ShowsAllErrorsWithPaths

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Confirmation
        title: >-
          The ProjectPage unit shall ask for a confirmation that says that existing reviews keep their checklist and
          only reviews created afterwards use the new one.
        justification: |
          The replacement changes what every later review is checked against, so the administrator must know what it
          does not change.
        tests:
          - ProjectChecklistPage_Replace_Cancelled_ChangesNothing

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Cancelled
        title: >-
          The ProjectPage unit shall store and audit nothing when the administrator cancels the confirmation of a
          replacement.
        justification: |
          Cancelling must be safe.
        tests:
          - ProjectChecklistPage_Replace_Cancelled_ChangesNothing

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Confirmed
        title: >-
          The ProjectPage unit shall store the definition as the checklist of the project when the administrator
          confirms the replacement.
        justification: |
          The confirmed definition is what later reviews start with.
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Shown
        title: >-
          The ProjectPage unit shall show the stored definition as the current checklist, with its version label and its
          numbers of sections and checks, and without the default badge, after a replacement.
        justification: |
          The administrator sees the result at once.
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Status
        title: >-
          The ProjectPage unit shall say after a replacement which checklist was stored and that existing reviews keep
          the checklist they were created with.
        justification: |
          The confirmation tells the administrator what happened and what did not.
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Audit
        title: >-
          The ProjectPage unit shall cause for a confirmed replacement one audit entry of the project with the action
          project.checklist-changed that names the new version and the user.
        justification: |
          A change of the checklist must be accountable.
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReplace-Refusal
        title: >-
          The ProjectPage unit shall show the message that the version label must change when the service refuses a
          replacement that keeps the version label with other wording.
        justification: |
          The service decides what is allowed, so the page shows its refusal.
        tests:
          - ProjectChecklistPage_Replace_SameLabelOtherWording_ShowsTheRefusalAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistReplace-RefusalNothingStored
        title: >-
          The ProjectPage unit shall leave the stored checklist unchanged when the service refuses a replacement.
        justification: |
          A refused definition must not take effect.
        tests:
          - ProjectChecklistPage_Replace_SameLabelOtherWording_ShowsTheRefusalAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistReplace-RefusalKeepsCandidate
        title: >-
          The ProjectPage unit shall keep the definition and its preview on the page after the service refused the
          replacement.
        justification: |
          The administrator corrects the definition instead of typing it again.
        tests:
          - ProjectChecklistPage_Replace_SameLabelOtherWording_ShowsTheRefusalAndStoresNothing

      - id: ReviewCenter-ProjectPage-ChecklistReset
        title: >-
          The ProjectPage unit shall offer a Reset to default button for a project that has a checklist of its own.
        justification: |
          A project must be able to go back to the standard wording without help from the person who runs the server.
        tests:
          - ProjectChecklistPage_Render_CustomChecklist_ShowsLabelWithoutBadgeAndOffersReset

      - id: ReviewCenter-ProjectPage-ChecklistReset-Disabled
        title: >-
          The ProjectPage unit shall disable the Reset to default button while the project uses the built-in default.
        justification: |
          There is nothing to reset.
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary

      - id: ReviewCenter-ProjectPage-ChecklistReset-Confirmation
        title: >-
          The ProjectPage unit shall ask for a confirmation that says that existing reviews keep the checklist they were
          created with before it resets the checklist.
        justification: |
          The reset changes what later reviews start with, so the administrator must know what it does not change.
        tests:
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReset-Cancelled
        title: >-
          The ProjectPage unit shall leave the checklist unchanged when the administrator cancels the confirmation of a
          reset.
        justification: |
          Cancelling must be safe.
        tests:
          - ProjectChecklistPage_Reset_Cancelled_ChangesNothing
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReset-Confirmed
        title: >-
          The ProjectPage unit shall return the project to the built-in default checklist when the administrator
          confirms the reset.
        justification: |
          The project goes back to the standard wording.
        tests:
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReset-Shown
        title: >-
          The ProjectPage unit shall show the default badge and the numbers of sections and checks of the default, and
          disable the Reset to default button, after a reset.
        justification: |
          The administrator sees the result at once.
        tests:
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReset-Status
        title: >-
          The ProjectPage unit shall say after a reset that the project uses the built-in default checklist.
        justification: |
          The confirmation tells the administrator what happened.
        tests:
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistReset-Audit
        title: >-
          The ProjectPage unit shall cause for a confirmed reset one audit entry of the project with the action
          project.checklist-changed that says that the checklist was reset to default.
        justification: |
          A change of the checklist must be accountable.
        tests:
          - ProjectChecklistPage_Reset_Confirmed_ReturnsToTheDefaultAndAudits

      - id: ReviewCenter-ProjectPage-ChecklistConflict
        title: >-
          The ProjectPage unit shall say that the checklist was changed by someone else when the administrator replaces
          it after somebody else changed it following the loading of the page.
        justification: |
          Two administrators must not overwrite each other without knowing it.
        tests:
          - ProjectChecklistPage_Replace_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistConflict-NothingStored
        title: >-
          The ProjectPage unit shall leave the stored checklist and the audit trail unchanged when it refuses a
          replacement because the checklist was changed by someone else.
        justification: |
          The refused replacement must not take effect.
        tests:
          - ProjectChecklistPage_Replace_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistConflict-ShowsStored
        title: >-
          The ProjectPage unit shall show the checklist that is stored now as the current checklist after it refused a
          replacement because the checklist was changed by someone else.
        justification: |
          The administrator decides again with the real state in front of them.
        tests:
          - ProjectChecklistPage_Replace_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistConflict-Differences
        title: >-
          The ProjectPage unit shall compare the definition with the checklist that is stored now, not with the one that
          was loaded, after it refused a replacement because the checklist was changed by someone else.
        justification: |
          The differences must describe what a replacement would do now.
        tests:
          - ProjectChecklistPage_Replace_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistConflict-Reset
        title: >-
          The ProjectPage unit shall say that the checklist was changed by someone else when the administrator resets it
          after somebody else changed it following the loading of the page.
        justification: |
          Two administrators must not overwrite each other without knowing it.
        tests:
          - ProjectChecklistPage_Reset_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistConflict-ResetNothingStored
        title: >-
          The ProjectPage unit shall leave the stored checklist unchanged when it refuses a reset because the checklist
          was changed by someone else.
        justification: |
          The refused reset must not take effect.
        tests:
          - ProjectChecklistPage_Reset_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistConflict-ResetShowsStored
        title: >-
          The ProjectPage unit shall show the checklist that is stored now as the current checklist after it refused a
          reset because the checklist was changed by someone else.
        justification: |
          The administrator decides again with the real state in front of them.
        tests:
          - ProjectChecklistPage_Reset_ChangedByOthers_ShowsMessageAndTheCurrentChecklist

      - id: ReviewCenter-ProjectPage-ChecklistRightLost
        title: >-
          The ProjectPage unit shall replace the checklist page with the not-found message, without checklist or
          messages, when the user validates, replaces or resets after the right to administer the project was lost while
          the page was open.
        justification: |
          An open page keeps its state after the user is demoted or removed, and a stale page must not act.
        tests:
          - ProjectChecklistPage_Action_RightLostWhileOpen_DropsThePageAndChangesNothing

      - id: ReviewCenter-ProjectPage-ChecklistRightLost-NothingChanged
        title: >-
          The ProjectPage unit shall store and record nothing when the user validates, replaces or resets after the
          right to administer the project was lost while the page was open.
        justification: |
          A stale page must not be able to change what the reviews of a project are checked against.
        tests:
          - ProjectChecklistPage_Action_RightLostWhileOpen_DropsThePageAndChangesNothing

      - id: ReviewCenter-ProjectPage-ChecklistRightLost-OtherProject
        title: >-
          The ProjectPage unit shall show the not-found message and nothing of the previous project when the checklist
          page is reused for a project that the user does not administer.
        justification: |
          Nothing of one project may follow the user to another.
        tests:
          - ProjectChecklistPage_Load_OtherProject_DropsTheImportAndTheProject

      - id: ReviewCenter-ProjectPage-ReviewRules
        title: >-
          The ProjectPage unit shall show a project admin a Review rules card with a switch that requires independent
          reviewers.
        justification: |
          The rule belongs to the people who administer the project.
        tests:
          - ProjectPage_ReviewRules_AdminSavesToggle

      - id: ReviewCenter-ProjectPage-ReviewRules-SystemAdmin
        title: >-
          The ProjectPage unit shall show a system administrator the Review rules card with the switches.
        justification: |
          A system administrator administers every project, including the ones without a membership.
        tests:
          - ProjectPage_Render_SystemAdministrator_ShowsEvidenceChecklistAndRulesControls

      - id: ReviewCenter-ProjectPage-ReviewRules-Hidden
        title: >-
          The ProjectPage unit shall show a plain member no Review rules card.
        justification: |
          Members who do not administer the project must not change its rules.
        tests:
          - ProjectPage_ReviewRules_NonAdmin_HidesCard

      - id: ReviewCenter-ProjectPage-ReviewRules-Explanation
        title: >-
          The ProjectPage unit shall explain with the independent-reviewers switch that the person who created a review
          cannot be one of its reviewers and cannot sign it, and that the authors of commits are not matched.
        justification: |
          The explanation states what the tool can and cannot know about authors, so that nobody reads the rule as a
          guarantee about commits.
        tests:
          - ProjectPage_ReviewRules_IndependentSwitch_ExplainsTheRule

      - id: ReviewCenter-ProjectPage-ReviewRules-Save
        title: >-
          The ProjectPage unit shall store the independent-reviewers switch when the administrator changes it and saves.
        justification: |
          A project that must let one person do both has to be able to switch the rule off.
        tests:
          - ProjectPage_ReviewRules_AdminSavesToggle

      - id: ReviewCenter-ProjectPage-ReviewRules-Confirmation
        title: >-
          The ProjectPage unit shall confirm a saved independent-reviewers switch with "Independent reviewers are no
          longer required." or "Independent reviewers are now required.".
        justification: |
          The confirmation tells the administrator what happened.
        tests:
          - ProjectPage_ReviewRules_AdminSavesToggle

      - id: ReviewCenter-ProjectPage-ReviewRules-Audit
        title: >-
          The ProjectPage unit shall cause for a saved independent-reviewers switch an audit entry of the project that
          names the old and the new value.
        justification: |
          A change of a rule must be accountable.
        tests:
          - ProjectPage_ReviewRules_AdminSavesToggle

      - id: ReviewCenter-ProjectPage-ReviewRules-Conflict
        title: >-
          The ProjectPage unit shall show the message of the rule when the administrator saves an independent-reviewers
          switch that somebody else changed following the loading of the page.
        justification: |
          Two administrators must not overwrite each other without knowing it.
        tests:
          - ProjectPage_ReviewRules_IndependentReviewers_StaleValue_ShowsMessageAndReloads

      - id: ReviewCenter-ProjectPage-ReviewRules-ConflictShowsStored
        title: >-
          The ProjectPage unit shall show the stored values of the review rules, instead of the unsaved choices, after
          it refused a save because somebody else changed a rule.
        justification: |
          Showing the stored values keeps the page true.
        tests:
          - ProjectPage_ReviewRules_IndependentReviewers_StaleValue_ShowsMessageAndReloads

      - id: ReviewCenter-ProjectPage-ReviewRules-ConflictNothingRecorded
        title: >-
          The ProjectPage unit shall record no audit entry when it refuses a save because somebody else changed a rule.
        justification: |
          The refused change must not take effect.
        tests:
          - ProjectPage_ReviewRules_IndependentReviewers_StaleValue_ShowsMessageAndReloads

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches
        title: >-
          The ProjectPage unit shall show a project admin, in the Review rules card, a switch that stops authors from
          answering the checklist of their own review and a switch that stops the person who reopened a review from
          signing it again.
        justification: |
          The rules belong to the people who administer the project.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DefaultOnAndSaveEachRule

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-DefaultOn
        title: >-
          The ProjectPage unit shall show both of these switches on for a project that was not given another value.
        justification: |
          The rules are enforced for every project unless an administrator switches them off.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DefaultOnAndSaveEachRule

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-Hidden
        title: >-
          The ProjectPage unit shall show a plain member none of the review rule switches.
        justification: |
          Members who do not administer the project must not change its rules.
        tests:
          - ProjectPage_ReviewRules_NonAdmin_HidesCard

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-EnforcementHints
        title: >-
          The ProjectPage unit shall say with each of these switches that the rule applies to every project, including a
          project that was created before the rule was enforced.
        justification: |
          An administrator would be surprised by a refusal in an old project unless the page says that the rule reaches
          it too.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DescribeEnforcement

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-Save
        title: >-
          The ProjectPage unit shall store each of these switches that the administrator changes when saving.
        justification: |
          Each rule must be changeable on its own.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DefaultOnAndSaveEachRule

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-Confirmation
        title: >-
          The ProjectPage unit shall confirm each saved one of these switches by naming the rule and its new state.
        justification: |
          The confirmation tells the administrator what happened.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DefaultOnAndSaveEachRule

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-Audit
        title: >-
          The ProjectPage unit shall cause for each changed one of these switches one audit entry of the project that
          names the rule and the old and new value.
        justification: |
          A change of a rule must be accountable.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_DefaultOnAndSaveEachRule

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-Conflict
        title: >-
          The ProjectPage unit shall show the message of the rule when the administrator saves a switch that somebody
          else changed following the loading of the page.
        justification: |
          Two administrators must not overwrite each other without knowing it.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_StaleValue_ShowsMessageAndReloads

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-ConflictShowsStored
        title: >-
          The ProjectPage unit shall show the stored values of these switches, instead of the unsaved choices, after it
          refused a save because somebody else changed a rule.
        justification: |
          Showing the stored values keeps the page true.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_StaleValue_ShowsMessageAndReloads

      - id: ReviewCenter-ProjectPage-ReviewRuleSwitches-ConflictNothingRecorded
        title: >-
          The ProjectPage unit shall record no audit entry when it refuses a save of these switches because somebody
          else changed a rule.
        justification: |
          The refused change must not take effect.
        tests:
          - ProjectPage_ReviewRules_NewSwitches_StaleValue_ShowsMessageAndReloads

      - id: ReviewCenter-ProjectPage-BallotMasking
        title: >-
          The ProjectPage unit shall show no disputed count in the blockers of a review for a viewer who has not
          handed in their own ballot in a review with several slots.
        justification: |
          The overview is open to every member, and a blocker that says how many checks are disputed would reveal that
          the reviewers differ.
        tests:
          - ProjectPage_HiddenViewer_ShowsNoDisputedCountAsBlocker

      - id: ReviewCenter-ProjectPage-Ballots
        title: >-
          The ProjectPage unit shall show for a review with several reviewer slots how many ballots were handed in of
          how many the review needs.
        justification: |
          A lead who chases a review needs to see how many ballots are still missing.
        tests:
          - ProjectPage_Render_Ballots_ShowsSubmittedOfTotalAndNames

      - id: ReviewCenter-ProjectPage-Ballots-Missing
        title: >-
          The ProjectPage unit shall name the people whose ballot is missing on a review with several reviewer slots.
        justification: |
          The lead knows whom to ask.
        tests:
          - ProjectPage_Render_Ballots_ShowsSubmittedOfTotalAndNames

      - id: ReviewCenter-ProjectPage-Ballots-SingleSlot
        title: >-
          The ProjectPage unit shall show only a dash for the ballots of a review with fewer than two reviewer slots.
        justification: |
          One ballot is no progress to report.
        tests:
          - ProjectPage_Render_Ballots_ShowsSubmittedOfTotalAndNames

      - id: ReviewCenter-ProjectPage-Ballots-SameForEveryViewer
        title: >-
          The ProjectPage unit shall show the same ballot counts and names to every viewer, also to a viewer who has not
          handed in their own ballot.
        justification: |
          That a ballot is in is progress and no verdict, so it can be shown to all.
        tests:
          - ProjectPage_HiddenViewer_ShowsBallotCountsAndMaskedNote

      - id: ReviewCenter-ProjectPage-Ballots-MaskedNote
        title: >-
          The ProjectPage unit shall show a viewer who has not handed in their own ballot in some review the note that
          some details are hidden until they hand it in.
        justification: |
          A reviewer must be told why the dispute counts are not shown instead of reading their absence as agreement.
        tests:
          - ProjectPage_HiddenViewer_ShowsBallotCountsAndMaskedNote

      - id: ReviewCenter-ProjectPage-Ballots-NoteGone
        title: >-
          The ProjectPage unit shall show no such note to a viewer who handed in their own ballot in every review.
        justification: |
          Nothing is hidden from this viewer, so the note would mislead.
        tests:
          - ProjectPage_HiddenViewer_ShowsBallotCountsAndMaskedNote
