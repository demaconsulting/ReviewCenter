---
# Software Unit Requirements for the ProjectPage Unit
#
# The ProjectPage unit is the page at /projects/{project} that shows one project with its reviews, and for a system
# administrator its members, and the page at /projects/{project}/reviews/new that holds the form to create a review
# from uploaded files or from a repository of the project. A project the user may not see looks like a missing one.

sections:
  - title: ProjectPage Unit Requirements
    requirements:
      - id: ReviewCenter-ProjectPage-Show
        title: >-
          The ProjectPage unit shall show the name and description of the project, or the same not-found message
          when the project does not exist and when the user may not see it, without showing anything of the project.
        justification: |
          A stored or mistyped link must lead to a clear answer rather than to an error page. A project the user is
          no member of must be indistinguishable from a missing one, so the page does not reveal that the project
          exists. The same holds for the page of a new review of the project.
        tests:
          - ProjectPage_Render_UnknownProject_ShowsNotFound
          - ProjectPage_Render_ProjectWithoutReviews_ShowsNameAndEmptyMessage
          - ProjectPage_Render_NonMember_LooksLikeAMissingProject

      - id: ReviewCenter-ProjectPage-Members
        title: >-
          The ProjectPage unit shall show a system administrator, and nobody else, a Members section with the
          members of the project, each with a role badge (Project admin or Member), a button that switches the role,
          and a Remove button, and a message that says that only system administrators can see the project when it
          has no members.
        justification: |
          Membership decides who sees a project, so a system administrator needs to see it at a glance and to change
          it on the page of the project. Members and project admins do not manage membership, so they are not shown
          the section or its buttons.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection

      - id: ReviewCenter-ProjectPage-MemberChange
        title: >-
          The ProjectPage unit shall let a system administrator reveal an inline form with the button + Add member
          that offers the enabled users who are not members yet and a project admin choice, add the chosen user as a
          member, switch a member between member and project admin, and remove a member, show the outcome or the
          reason for a refusal, and list the members again afterwards; and shall check on every such action that
          the user is still a system administrator and still sees the project, and, when not, change nothing and
          drop the members, the candidates and the add form, or replace the page with the not-found message when
          the user also lost the view of the project.
        justification: |
          Members are changed rarely, so the form stays hidden until asked for. Showing only users who are not yet
          members prevents a duplicate, and showing the outcome next to the list tells the administrator what changed.
          An open page keeps its state after the user is demoted, and the member names and the candidate list are
          for system administrators only, so a failed check clears them instead of showing an error above them.
        tests:
          - ProjectPage_AddMember_ChosenUser_BecomesMemberWithTheRole
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership
          - ProjectPage_MemberChange_SystemAdminDemotedButStillMember_DropsMembersSectionKeepsReviews
          - ProjectPage_MemberChange_SystemAdminDemotedAndNotMember_ShowsNotFoundAndNoData
          - ProjectPage_OpenAddForm_SystemAdminDemoted_DropsCandidatesAndForm
          - ProjectPage_MemberChange_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-ProjectPage-RepositoriesLink
        title: >-
          The ProjectPage unit shall show a Repositories button that leads to the repositories page of the project to
          a system administrator and to a project admin of the project only.
        justification: |
          Repositories belong to projects, so the project page is where they are reached from. A plain member does
          not manage them and is not offered a page that would show only a not-found message.
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection

      - id: ReviewCenter-ProjectPage-Reviews
        title: >-
          The ProjectPage unit shall list the reviews of the project as rows with a link to each review, its
          title, and its state.
        justification: |
          The project page is how users reach their reviews and see where each one stands.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndState

      - id: ReviewCenter-ProjectPage-NewReview
        title: >-
          The ProjectPage unit shall offer a New review button that opens the page holding the review creation form
          for that project, so the project page itself shows only the reviews.
        justification: |
          Users mostly come to the project page to pick a review; the creation form is reached on purpose, from a
          button, instead of crowding the list.
        tests:
          - ProjectPage_Render_ProjectWithoutReviews_ShowsNameAndEmptyMessage

      - id: ReviewCenter-ProjectPage-Approval
        title: >-
          The ProjectPage unit shall show next to the state of each listed review a badge that reads Approved when
          the review has at least one reviewer slot and every slot has a current signature, and In review
          otherwise.
        justification: |
          Users scan the project page to see which reviews are finished. The approval status is computed from the
          current record, so a review whose record changed after signing is shown as In review again.
        tests:
          - ProjectPage_Render_ProjectWithReview_ListsReviewWithLinkTitleAndState
          - ProjectPage_Render_SignedAndUnsignedReviews_ShowApprovedOrInReview

      - id: ReviewCenter-ProjectPage-Selection
        title: >-
          The ProjectPage unit shall list the name and size of each file the user selects for a new review, and
          a new selection shall replace the previous one. When the page is reused for another project, it shall
          show that project and discard the previous form values and selection.
        justification: |
          Users must see exactly which files they are about to submit before they submit them, and must be able
          to correct a wrong selection. Files chosen for one project must never be submitted into another.
        tests:
          - NewReviewPage_FileInput_FilesSelected_ListsNamesAndSizes
          - NewReviewPage_FileInput_SecondSelection_ReplacesFirst
          - NewReviewPage_ParametersChange_OtherProject_ClearsFormAndSelection

      - id: ReviewCenter-ProjectPage-Create
        title: >-
          The ProjectPage unit shall offer, on its page for a new review, a form with a review identifier, a
          title, and selected files that creates a review from the file names and contents, and then shows the
          review page.
        justification: |
          Creating a review from files is the central action of the product. Only the file name is used as the
          path, because a browser does not reveal the folder a file came from.
        tests:
          - NewReviewPage_CreateForm_ValidInput_CreatesReviewAndNavigatesToIt

      - id: ReviewCenter-ProjectPage-Error
        title: >-
          The ProjectPage unit shall show the reason when a review cannot be created, naming the identifier for
          a duplicate identifier, and shall create nothing, including when no files are selected, two selected
          files have the same name, or the sign-in state of the user has ended or the user has lost the access to the
          project while the form is open (the page then shows the page of a project that does not exist).
        justification: |
          A rejected form must tell users what to correct, and must not leave a partial review.
        tests:
          - NewReviewPage_CreateForm_NoFiles_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_DuplicateReviewId_ShowsErrorNamingTheId
          - NewReviewPage_CreateForm_DuplicateFileNames_ShowsDuplicatePathError
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing
          - NewReviewPage_CreateForm_MembershipRevoked_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-ProjectPage-ReservedId
        title: >-
          The ProjectPage unit shall refuse the review identifier "new", in any letter case, with a message that
          it is reserved, and shall create nothing.
        justification: |
          The address of the page for a new review ends in "new", so a review with that identifier could never
          be opened. Users are told to choose another identifier instead of creating an unreachable review.
        tests:
          - NewReviewPage_CreateForm_ReservedReviewId_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Limits
        title: >-
          The ProjectPage unit shall refuse a selection that has more files than the review file-count limit,
          a file larger than the per-file size limit, or files that together are larger than the total size
          limit, with an error message, before reading any content, and shall keep no selection from that
          attempt and create no review.
        justification: |
          Files are uploaded over the live connection into server memory. Refusing a selection by its reported
          count and sizes protects the server before any content is transferred, and refusing it as a whole
          ensures a partly read file set is never submitted.
        tests:
          - NewReviewPage_FileInput_FileTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TooManyFiles_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_TotalSizeTooLarge_ShowsErrorAndKeepsNothing
          - NewReviewPage_FileInput_DeclaredSizesUnderstated_RejectsOnReceivedBytes

      - id: ReviewCenter-ProjectPage-SourceChoice
        title: >-
          The ProjectPage unit shall let the user choose whether the files of a new review are uploaded or come
          from a repository, with upload as the default, shall show only the controls of the chosen source, and
          shall offer the repository source only when at least one repository of the project is enabled, saying so
          otherwise.
        justification: |
          One form serves both sources without clutter. A repository cannot be chosen when the project has none, and
          the user is told whom to ask.
        tests:
          - NewReviewPage_SourceChoice_RepositoryChosen_ShowsRepositoryFieldsInsteadOfUpload
          - NewReviewPage_SourceChoice_NoEnabledRepository_DisablesRepositorySourceWithHint

      - id: ReviewCenter-ProjectPage-RepositoryForm
        title: >-
          The ProjectPage unit shall, for the repository source, offer the enabled repositories of the project by
          name only, never showing a location, user name, or token, and never a repository of another project, a
          head revision, an optional baseline revision, and a selection that starts as "**/*", and shall create the
          review from them and show the review page, or list the skipped links and submodules with a link to the
          review when there are any.
        justification: |
          Ordinary users choose from the repositories the administrators of the project maintain and must not see
          how the server reaches the repository, nor the repositories of projects they may not see. The creator is
          told once which entries were left out.
        tests:
          - NewReviewPage_RepositorySelect_OffersOnlyEnabledRepositoriesWithoutLocationOrToken
          - NewReviewPage_RepositorySelect_OffersOnlyRepositoriesOfThisProject
          - NewReviewPage_CreateForm_FromRepository_CreatesReviewWithSourceAndNavigates
          - NewReviewPage_CreateForm_FromRepositoryWithoutBaseline_ReviewsAllFilesAtHead
          - NewReviewPage_CreateForm_SkippedEntries_AreShownBeforeOpeningTheReview

      - id: ReviewCenter-ProjectPage-RepositoryError
        title: >-
          The ProjectPage unit shall show the reason when a review from a repository cannot be created, among
          them that nothing matches the selection, that a revision does not exist, that no repository was
          chosen, and that the repository was disabled meanwhile, and shall create nothing.
        justification: |
          The user can fix a wrong revision or selection only when told which one is wrong.
        tests:
          - NewReviewPage_CreateForm_EmptySelection_ShowsNothingToReviewAndCreatesNothing
          - NewReviewPage_CreateForm_BadRevision_ShowsErrorAndCreatesNothing
          - NewReviewPage_CreateForm_NoRepositoryChosen_AsksForOne
          - NewReviewPage_CreateForm_RepositoryDisabledMeanwhile_ShowsErrorAndCreatesNothing

      - id: ReviewCenter-ProjectPage-Interactive
        title: >-
          The ProjectPage unit shall report that it is interactive, through a marker on its root element, once
          it has rendered on a live connection.
        justification: |
          Users, automated tests, and tooling need a reliable signal that the page now responds, so that they do
          not act before the live connection exists.
        tests:
          - ProjectPage_AfterRender_Interactive_SetsMarker

      - id: ReviewCenter-ProjectPage-PlanLink
        title: >-
          The ProjectPage unit shall show a link to the plan page of the project when at least one repository of the
          project is enabled, and a short note that says whom to ask when none is.
        justification: |
          Planning starts from the project page. A user must find the way in, and must be told why it is not
          offered instead of finding no link and guessing.
        tests:
          - ProjectPage_Render_PlanLink_ShownOnlyWithEnabledRepository
