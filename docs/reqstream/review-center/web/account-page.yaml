---
# Software Unit Requirements for the AccountPage Unit
#
# The AccountPage unit is the Account.razor page at /account where a signed-in user sees the account, chooses the
# appearance of the interface, and changes the own password.

sections:
  - title: AccountPage Unit Requirements
    requirements:
      - id: ReviewCenter-AccountPage-Show
        title: >-
          The AccountPage unit shall serve at /account, to a signed-in user, a form for changing the password.
        justification: |
          Users must be able to change the password without asking an administrator.
        tests:
          - AccountPage_Render_SignedIn_ShowsFormControls

      - id: ReviewCenter-AccountPage-ChangePassword
        title: >-
          The AccountPage unit shall change the password of the signed-in user when the current password is given
          correctly and the new password follows the password rules, clearing the password fields afterwards, and
          shall show a violated rule as a message, changing nothing.
        justification: |
          The current password is required so that somebody at an unattended session cannot take over the
          account, and the fields are cleared so that no password stays on the page.
        tests:
          - AccountPage_ChangePassword_ValidInput_ChangesOwnPasswordAndClearsFields
          - AccountPage_ChangePassword_InvalidInput_ShowsErrorAndChangesNothing

      - id: ReviewCenter-AccountPage-Appearance
        title: >-
          The AccountPage unit shall let the signed-in user choose between a system, a light, and a dark appearance,
          with the system appearance selected until a choice was made, apply a chosen appearance at once, and keep the
          choice in the browser only, showing the stored choice as selected when the page is opened.
        justification: |
          Reviewers read code for long periods and have different needs for contrast and glare. The choice is a
          property of the device and its surroundings, so it is kept in the browser rather than on the server, and
          following the device setting is the default so that nobody has to configure anything.
        tests:
          - AccountPage_Render_AppearanceCard_ShowsThreeOptionsWithSystemSelected
          - AccountPage_ChooseDark_AppliesThemeAndSelectsOption
          - AccountPage_Render_StoredLightChoice_IsSelected

      - id: ReviewCenter-AccountPage-TokensCard
        title: >-
          The AccountPage unit shall show a card of the personal access tokens of the signed-in user, with a form to
          create a token, the list of the tokens with the name, the display id, the expiry, the last use, and the
          state of each, without any token value, and a link to the help topic about the API.
        justification: |
          The owner of a token must see which tokens exist and which are in use, in order to take back the ones that
          are not needed, and a link to the help topic puts the explanation where the token is made.
        tests:
          - AccountPage_Render_TokensCard_ShowsFormEmptyListAndHelpLink
          - AccountPage_Render_ExpiredToken_ShowsExpiredWithoutRevokeButton

      - id: ReviewCenter-AccountPage-TokenCreate
        title: >-
          The AccountPage unit shall create a token from the name and the expiry that the user entered, show its
          value once, with a copy button and a note that it cannot be shown again, list the new token, and show an
          error and create nothing when the name is empty or the user already has 20 active tokens.
        justification: |
          The value is only known at the moment of creation, so the page must show it then, and a refusal must say why
          and must not leave a token that the user did not see.
        tests:
          - AccountPage_CreateToken_ValidInput_ShowsValueOnceAndListsToken
          - AccountPage_CreateToken_EmptyName_ShowsErrorAndCreatesNothing
          - AccountPage_CreateToken_TwentyActive_ShowsLimitError

      - id: ReviewCenter-AccountPage-TokenCopy
        title: >-
          The AccountPage unit shall copy the value of a new token to the clipboard through the browser when the user
          presses the copy button, and show a hint to copy it by hand, keeping the value on the page, when the
          browser refuses.
        justification: |
          Copying the value avoids a typing error, and the value must not be lost because a browser did not allow the
          copy, as it cannot be shown again.
        tests:
          - AccountPage_CopyToken_NewToken_CopiesThroughBrowserScript
          - AccountPage_CopyToken_BrowserRefuses_ShowsHintAndKeepsToken

      - id: ReviewCenter-AccountPage-TokenRevoke
        title: >-
          The AccountPage unit shall let the user revoke an active token of their own, show the token as revoked
          without the revoke button afterwards, and offer no revoke button for a token that is expired.
        justification: |
          A token that leaked or is no longer used must be possible to take back from the page at once, and a button
          that does nothing for a token that is already dead would only confuse.
        tests:
          - AccountPage_RevokeToken_ActiveToken_MarksRevokedAndRemovesButton
          - AccountPage_Render_ExpiredToken_ShowsExpiredWithoutRevokeButton
