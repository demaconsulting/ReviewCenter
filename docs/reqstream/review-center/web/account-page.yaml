---
# Software Unit Requirements for the AccountPage Unit
#
# The AccountPage unit is the Account.razor page at /account where a signed-in user sees the account, chooses the
# appearance of the interface, and changes the own password.

sections:
  - title: AccountPage Unit Requirements
    requirements:
      - id: ReviewCenter-AccountPage-Show
        title: >-
          The AccountPage unit shall serve at /account, to a signed-in user, a form for changing the password.
        justification: |
          Users must be able to change the password without asking an administrator.
        tests:
          - AccountPage_Render_SignedIn_ShowsFormControls

      - id: ReviewCenter-AccountPage-ChangePassword
        title: >-
          The AccountPage unit shall change the password of the signed-in user when the current password is given
          correctly and the new password follows the password rules, clearing the password fields afterwards, and
          shall show a violated rule as a message, changing nothing.
        justification: |
          The current password is required so that somebody at an unattended session cannot take over the
          account, and the fields are cleared so that no password stays on the page.
        tests:
          - AccountPage_ChangePassword_ValidInput_ChangesOwnPasswordAndClearsFields
          - AccountPage_ChangePassword_InvalidInput_ShowsErrorAndChangesNothing

      - id: ReviewCenter-AccountPage-Appearance
        title: >-
          The AccountPage unit shall let the signed-in user choose between a system, a light, and a dark appearance,
          with the system appearance selected until a choice was made, apply a chosen appearance at once, and keep the
          choice in the browser only, showing the stored choice as selected when the page is opened.
        justification: |
          Reviewers read code for long periods and have different needs for contrast and glare. The choice is a
          property of the device and its surroundings, so it is kept in the browser rather than on the server, and
          following the device setting is the default so that nobody has to configure anything.
        tests:
          - AccountPage_Render_AppearanceCard_ShowsThreeOptionsWithSystemSelected
          - AccountPage_ChooseDark_AppliesThemeAndSelectsOption
          - AccountPage_Render_StoredLightChoice_IsSelected
