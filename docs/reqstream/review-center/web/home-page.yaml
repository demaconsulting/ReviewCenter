---
# Software Unit Requirements for the HomePage Unit
#
# The HomePage unit is the landing page served at the root URL, with the product name and tagline. It is
# server-rendered markup with no interactive behavior. A signed-in user also sees a "Get started" list of links to
# the pages the user can use, the inbox first with the number of reviews that need action; the administration pages
# are listed only for a system administrator. There is no card for the
# repositories, which belong to the projects.

sections:
  - title: HomePage Unit Requirements
    requirements:
      - id: ReviewCenter-HomePage-Title
        title: The HomePage unit shall display the product name ReviewCenter as its heading.
        justification: |
          Users must be able to tell at a glance which application they have reached.
        tests:
          - HomePage_Render_Default_ShowsTitle

      - id: ReviewCenter-HomePage-Anonymous
        title: >-
          The HomePage unit shall show a visitor who is not signed in the tagline of the product and no link to any
          other page.
        justification: |
          The home page is open to everyone, but the pages it would lead to need a sign-in. A visitor should learn what
          the product is and be left to the sign-in link in the header, not be offered links that only lead to a
          refusal.
        tests:
          - HomePage_Render_Anonymous_ShowsTaglineAndNoLinks

      - id: ReviewCenter-HomePage-GetStarted
        title: >-
          The HomePage unit shall show a signed-in user a Get started section with a link, and a one-line
          description, for the inbox page and for the projects page.
        justification: |
          A new user needs a clear first step after signing in. The inbox says what waits for the user and the
          projects page is where every review starts, so the home page points to both directly.
        tests:
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-InboxCard
        title: >-
          The HomePage unit shall show on the inbox card a sentence with the number of reviews that need the action of
          the user, and the sentence that nothing needs action when the number is zero.
        justification: |
          The number is the reason to open the inbox, and a card without work should not suggest any.
        tests:
          - HomePage_Render_Reviewer_InboxCardShowsActionCount
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-AdminLinks
        title: >-
          The HomePage unit shall add to the Get started section, each with a one-line description, links to the
          audit and users pages only while an enabled system administrator is signed in, so that a system
          administrator sees four cards and any other user two, and shall offer no link to a repositories page.
        justification: |
          The links must not invite other users to pages they cannot open, and a system administrator needs the same
          first steps for the pages that administration involves. Repositories belong to projects and are reached
          from the page of a project.
        tests:
          - HomePage_Render_Admin_ShowsGetStartedWithAdministrationLinks
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards
