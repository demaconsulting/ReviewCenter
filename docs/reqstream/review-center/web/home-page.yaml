---
# Software Unit Requirements for the HomePage Unit
#
# The HomePage unit is the landing page served at the root URL, with the product name and tagline. It is
# server-rendered markup with no interactive behavior. A signed-in user also sees a "Get started" list of links to
# the pages the user can use, the inbox first with the number of reviews that need action; the administration pages
# are listed only for a system administrator. There is no card for the
# repositories, which belong to the projects.

sections:
  - title: HomePage Unit Requirements
    requirements:
      - id: ReviewCenter-HomePage-Title
        title: The HomePage unit shall display the product name ReviewCenter as its heading.
        justification: |
          Users must be able to tell at a glance which application they have reached.
        tests:
          - HomePage_Render_Default_ShowsTitle

      - id: ReviewCenter-HomePage-Anonymous
        title: >-
          The HomePage unit shall show a visitor who is not signed in the tagline of the product.
        justification: |
          A visitor should learn what the product is as soon as the page opens.
        tests:
          - HomePage_Render_Anonymous_ShowsTaglineAndNoLinks

      - id: ReviewCenter-HomePage-Anonymous-NoLinks
        title: >-
          The HomePage unit shall show a visitor who is not signed in no link to any other page.
        justification: |
          The home page is open to everyone, but the pages it would lead to need a sign-in. A visitor is left to the
          sign-in link in the header and is not offered links that only lead to a refusal.
        tests:
          - HomePage_Render_Anonymous_ShowsTaglineAndNoLinks

      - id: ReviewCenter-HomePage-GetStarted
        title: >-
          The HomePage unit shall show a signed-in user a Get started section with a link to the inbox page.
        justification: |
          A new user needs a clear first step after signing in. The inbox says what waits for the user, so the home
          page points to it directly.
        tests:
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-GetStarted-ProjectsLink
        title: >-
          The HomePage unit shall show in the Get started section a link to the projects page.
        justification: |
          The projects page is where every review starts, so the home page points to it directly.
        tests:
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-GetStarted-Descriptions
        title: >-
          The HomePage unit shall give the link to the inbox page and the link to the projects page a one-line
          description each.
        justification: |
          A new user should know what each page is for before opening it.
        tests:
          - HomePage_Render_Reviewer_EachLinkHasOneLineDescription

      - id: ReviewCenter-HomePage-InboxCard
        title: >-
          The HomePage unit shall show on the inbox card a sentence with the number of reviews that need the action of
          the user.
        justification: |
          The number is the reason to open the inbox.
        tests:
          - HomePage_Render_Reviewer_InboxCardShowsActionCount

      - id: ReviewCenter-HomePage-InboxCard-NoAction
        title: >-
          The HomePage unit shall show on the inbox card the sentence that nothing needs action when the number of
          reviews that need the action of the user is zero.
        justification: |
          A card without work should not suggest any.
        tests:
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-AdminLinks
        title: >-
          The HomePage unit shall add to the Get started section links to the audit page and the users page while a
          system administrator is signed in.
        justification: |
          A system administrator needs the same first steps for the pages that administration involves.
        tests:
          - HomePage_Render_Admin_ShowsGetStartedWithAdministrationLinks

      - id: ReviewCenter-HomePage-AdminLinks-OtherUsers
        title: >-
          The HomePage unit shall show a signed-in user who is no system administrator no link to the audit page and no
          link to the users page.
        justification: |
          The links must not invite other users to pages they cannot open.
        tests:
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-AdminLinks-NoRepositories
        title: >-
          The HomePage unit shall offer no link to a repositories page.
        justification: |
          Repositories belong to projects and are reached from the page of a project.
        tests:
          - HomePage_Render_Admin_ShowsGetStartedWithAdministrationLinks
          - HomePage_Render_Reviewer_ShowsInboxAndProjectsCards

      - id: ReviewCenter-HomePage-AdminLinks-Descriptions
        title: >-
          The HomePage unit shall give the link to the audit page and the link to the users page a one-line
          description each.
        justification: |
          A system administrator should know what each page is for before opening it.
        tests:
          - HomePage_Render_Admin_AdminLinksHaveOneLineDescription
