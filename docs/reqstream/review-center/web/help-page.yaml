---
# Software Unit Requirements for the HelpPage Unit
#
# The HelpPage unit is the built-in help: the index at /help (HelpPage.razor), one page for each help topic at
# /help/{topic} with its shared frame (HelpTopicFrame.razor) fed by the list of topics (HelpTopics.cs), and the
# friendly page for an unknown address under /help/ (HelpNotFoundPage.razor). The link to the help in the header of
# every page belongs to the App unit.

sections:
  - title: HelpPage Unit Requirements
    requirements:
      - id: ReviewCenter-HelpPage-Index
        title: >-
          The HelpPage unit shall serve at /help an index headed Help that lists every help topic with its title and a
          link to the page of the topic, and a link to the About page.
        justification: |
          A user who needs help must be able to see what is covered and to choose a topic without guessing an address.
          The About page holds the version and the project page, which a user reporting a problem needs, so the help
          points to it.
        tests:
          - HelpPage_Render_ListsEveryTopicWithItsPageLink

      - id: ReviewCenter-HelpPage-Topics
        title: >-
          The HelpPage unit shall serve for every help topic, at the address /help/ followed by the name of the topic,
          a page headed with the title of the topic, in which every image has alternative text.
        justification: |
          Each task of a review is explained on a page of its own, so that a user can find it from the index and
          share its address. A listed topic without a page would lead to an error, and an image without alternative
          text cannot be read by a user of assistive technology.
        tests:
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation

      - id: ReviewCenter-HelpPage-Navigation
        title: >-
          The HelpPage unit shall end every topic page with links to the previous topic, to the index of all help
          topics, and to the next topic, leaving out the link to the previous topic on the first page and the link to
          the next topic on the last, and shall not use a link to a place within the same page.
        justification: |
          A user who has finished reading a topic should be able to continue, go back, or return to the index without
          scrolling up or using the browser. The site gives every page a base address, so a link to a place within the
          page would lead to the home page, and the links must lead to whole pages.
        tests:
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation
          - HelpPage_Render_ListsEveryTopicWithItsPageLink

      - id: ReviewCenter-HelpPage-NotFound
        title: >-
          The HelpPage unit shall show, for an address under /help/ that is not a help topic, a message that there is no
          such topic and a link to the index of all help topics.
        justification: |
          An old or mistyped help address, such as a bookmark of a topic that was renamed, should lead the user back to
          the index and not to a blank page or the general not-found message.
        tests:
          - HelpNotFoundPage_Render_UnknownTopic_ShowsMessageAndIndexLink

      - id: ReviewCenter-HelpPage-AttestationTopic
        title: >-
          The HelpPage unit shall serve a topic, Signed attestation, that explains what the signature of the
          attestation proves (integrity since the signing and the origin of the server key), what it does not prove
          (who the reviewers are, and when the signing happened), that the self-signed key is for development and test
          only, how to use a certificate from a certificate store, and what RequireTrustedKey checks (the server refuses
          to start for a self-signed key or a certificate without a signing key usage, and the review page shows why
          attestation is unavailable when a certificate stops being valid while the server runs), that the signature
          certifies the document with no changes allowed, and that a code-signing-only certificate is used with a
          note and a start-up warning while the server does not check the chain or revocation, with a
          screenshot of the download of an approved review.
        justification: |
          The attestation is easy to take for more than it is. The place the user is sent from the review page must
          say plainly what the document proves and how to make it carry weight.
        tests:
          - HelpAttestationPage_Render_ExplainsWhatTheSignatureProvesAndTheKey

      - id: ReviewCenter-HelpPage-ApiTokensTopic
        title: >-
          The HelpPage unit shall serve a topic, API tokens, that explains how to create a token on the account page
          and that its value is shown once, how to send it as a bearer token with a curl example, which endpoints
          the API offers, how to use it with ReviewMark as the password of HTTP Basic credentials, that a token never
          signs or opens a page, and what the errors of the API mean.
        justification: |
          A script author needs one place that tells how to get a token and use it, and the limits of a token must
          be said plainly so that nobody expects a pipeline to sign a review.
        tests:
          - HelpApiTokensPage_Render_ExplainsTokensCurlEndpointsAndErrors

      - id: ReviewCenter-HelpPage-MembersTopic
        title: >-
          The HelpPage unit shall serve a topic, Project members, at /help/project-members, that explains how a project
          admin adds an existing user with the + Add member button by the exact user name, how a new account is
          created as part of adding it, with a temporary password that is shown once and must be replaced at the first
          sign-in, that the last project admin cannot be removed or demoted, that a person who is no longer a member is
          marked as such on the reviews assigned to them, and that the Audit trail button shows the trail of the
          project.
        justification: |
          Managing members is new to project admins and has rules that look like errors when met without
          explanation: no list of users, one message for any name that cannot be added, a password that cannot be
          shown again, and a last administrator that cannot leave. One place explains them.
        tests:
          - HelpMembersPage_Render_ExplainsAddingAccountsAndTheLastAdminRule
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation

      - id: ReviewCenter-HelpPage-EvidenceSettingsTopic
        title: >-
          The HelpPage unit shall serve a topic, Evidence settings, at /help/evidence-settings, that explains that only
          a project admin or a system administrator can change the evidence settings of a project from the Evidence
          settings button, what the two anonymous switches (the evidence index and the attestation PDFs) do, that they
          are off by default and independent, that the index alone is of no use to ReviewMark without the PDFs and that
          anyone who reaches the server can then read what was opened, what the five PDF content
          switches (review discussion threads, reviewer names, checklist wording, file list and hashes, git context)
          leave out, the regulatory warning, the Content scope section of every PDF, and that every change is recorded
          in the audit trail, with two screenshots of the settings page.
        justification: |
          The settings open the evidence to anonymous readers and can reduce what a PDF proves, so the person who
          changes them must be able to read what each switch costs before turning it. The consequences are explained
          in one place, with pictures of the page the person sees.
        tests:
          - HelpEvidenceSettingsPage_Render_ExplainsAnonymousAccessContentSwitchesAndScope
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation

      - id: ReviewCenter-HelpPage-OidcSignIn
        title: >-
          The HelpPage unit shall explain, in the topics for getting started, for signing, and for API tokens, that
          an account of an identity provider signs in at the provider, confirms a signature there, and has no password
          and no token that signs.
        justification: |
          People who sign in with a provider meet different steps, and they should find the reasons where they look
          for help on those tasks.
        tests:
          - HelpTopicPage_Render_MentionsSignInWithProvider
