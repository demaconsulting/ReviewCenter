      - id: ReviewCenter-SelfTest-Hermetic
        title: >-
          The self-validation run shall be hermetic: every file it creates lives in a temporary folder that is
          removed at the end, and by default it reads no configuration, touches no configured database and binds no
          configured port.
        justification: |
          Tool qualification evidence is only worth something if it comes out the same on every machine and cannot
          damage the deployment it qualifies. A run that used the configured database or port would depend on, and
          could change, the state of the system under test, and a run that left files behind would fill the disk of
          a CI runner. The only look at the deployment's own configuration is the opt-in `--check-config` check,
          which is read-only.
        children:
          - ReviewCenter-Validation-CheckConfig
          - ReviewCenter-Validation-DefaultChecks
          - ReviewCenter-ValidationChecks-Hermetic
          - ReviewCenter-ValidationChecks-Hermetic-InMemoryConfiguration
          - ReviewCenter-ValidationChecks-Hermetic-EphemeralLoopbackPort
          - ReviewCenter-ValidationChecks-Hermetic-PermissionsOnlyKeys
          - ReviewCenter-ValidationChecks-FastCommit
          - ReviewCenter-ValidationChecks-FastCommit-ProductionDefault
          - ReviewCenter-ValidationChecks-FastCommit-OnlyInsideFolder
          - ReviewCenter-ValidationChecks-FastCommit-ReadOnlyUntouched
          - ReviewCenter-ValidationChecks-FastCommit-InMemoryUntouched
          - ReviewCenter-ValidationChecks-FastCommit-RequiresAllowedFolder
          - ReviewCenter-ServerHost-IsolatedSettings
          - ReviewCenter-ServerHost-IsolatedSettings-Environment
          - ReviewCenter-ServerHost-IsolatedSettings-AmbientData
          - ReviewCenter-ServerHost-IsolatedSettings-Routes
          - ReviewCenter-ServerHost-IsolatedSettings-DefaultHostAmbient
        tests:
          - SelfTestSubsystem_ValidationWorkflow_DefaultRun_IsHermetic

      - id: ReviewCenter-SelfTest-ConfiguredNotifications
        title: >-
          When `--check-config` is given, the self-validation run shall check the configured e-mail notification
          settings.
        justification: |
          An operator who enables e-mail notifications wants to know before the server start that the settings are
          usable. The default run stays hermetic, so the check runs only on request.
        children:
          - ReviewCenter-Validation-DefaultChecks
          - ReviewCenter-Validation-CheckConfig
          - ReviewCenter-Validation-CheckConfigAfterHermetic
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsSkipped
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsSmtpReport
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsSmtpPortReport
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsSmtpProtectionReport
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsSmtpPasswordSourceReport
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsNoSecret
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsNoPath
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsInlineWarning
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsWarningNoSecret
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsFileSender
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsFailsUnusable
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsFailureNamesSetting
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsWrongTypeFails
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsWrongTypeNoValue
        tests:
          - Validation_CreateChecks_CheckConfig_AddsConfiguredNotificationsDatabaseAndKeysLast
          - ValidationChecks_ConfiguredNotifications_SmtpSettings_ReportsWithoutSecret

      - id: ReviewCenter-SelfTest-ConfiguredNotificationsNoNetwork
        title: >-
          When `--check-config` is given, the self-validation run shall open no network connection while it checks the
          e-mail notification settings.
        justification: |
          A validation run that reached out to a mail server would depend on the network and would send the password
          on the strength of a mere check.
        children:
          - ReviewCenter-ValidationChecks-ConfiguredNotificationsNoNetwork
        tests:
          - ValidationChecks_ConfiguredNotifications_SmtpSettings_OpensNoConnection

      - id: ReviewCenter-SelfTest-NotificationMail
        title: >-
          The self-validation run shall check a notification mail without a database or a network.
        justification: |
          An operator must see in the default run that a notification mail is composed from a fixture, holds no ballot
          content and is written as a file, on every machine and without a mail server.
        children:
          - ReviewCenter-ValidationChecks-NotificationMail
          - ReviewCenter-ValidationChecks-NotificationMail-FileWritten
          - ReviewCenter-ValidationChecks-NotificationMail-ProjectNamed
          - ReviewCenter-ValidationChecks-NotificationMail-ReviewLinked
          - ReviewCenter-ValidationChecks-NotificationMail-NoBallotContent
          - ReviewCenter-ValidationChecks-NotificationMail-NoAddressInReport
          - ReviewCenter-ValidationChecks-NotificationMail-NoPathInReport
        tests:
          - Validation_CreateChecks_Default_ListsTenHermeticChecks
          - ValidationChecks_NotificationMail_Run_ComposesMaskedMailAndWritesEmlFile

      - id: ReviewCenter-SelfTest-ResultsOutput
        title: The tool shall write self-validation results to a standard test result file when --results is provided.
        justification: |
          CI/CD pipelines and requirements traceability tools (such as ReqStream) consume
          test result files in standard formats. By supporting both TRX (MSTest) and JUnit
          XML output, the SelfTest subsystem enables self-validation results to be fed
          directly into pipeline tooling and traceability reports without additional
          conversion steps, satisfying audit trail requirements.
        children:
          - ReviewCenter-Validation-TrxResults
          - ReviewCenter-Validation-XmlResults
        tests:
          - SelfTestSubsystem_ValidationWorkflow_WithTrxFile_GeneratesResults
          - SelfTestSubsystem_ValidationWorkflow_WithJUnitFile_GeneratesResults
          - SelfTestSubsystem_ValidationWorkflow_WithBothResultFiles_GeneratesBothResults

      - id: ReviewCenter-SelfTest-InvalidExtension
        title: >-
          The tool shall report an error and set a non-zero exit code when an
          unsupported results file extension is provided.
        justification: |
          Prevents silent loss of validation evidence by failing loudly when a results
          file cannot be written due to an unrecognized extension. This enables CI/CD
          pipelines to detect misconfigured output paths automatically.
        children:
          - ReviewCenter-Validation-InvalidExtension
          - ReviewCenter-Validation-InvalidExtension-ExitCode
        tests:
          - SelfTestSubsystem_ValidationWorkflow_WithUnsupportedExtension_EmitsErrorAndNoFile
