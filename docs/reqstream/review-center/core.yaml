      - id: ReviewCenter-Core-ApprovalLock
        title: >-
          The Core subsystem shall treat a review that every slot has signed for the current record with the same
          outcome, as approved or as rejected (with a conclusion text), as concluded and locked, refuse every change
          of its threads, checklist answers, section applicability, and reviewer slots,
          and refuse a further signature, with the ReviewLocked rule, until an administrator of the project or a system
          administrator reopens it with a reason, shall refuse the reopening of a review that is not locked with the
          ReviewNotLocked rule, shall keep every earlier signature as history after the reopening, out of date for good,
          even when the content is changed back, shall need fresh signatures from every slot to approve the review
          again, and shall record the reopening, with the reason and the digest of the approved record, in the audit
          trail.
        justification: |
          An approval is only worth something if the content it approved cannot move afterwards. Locking the concluded
          review, and allowing only a deliberate, explained, and recorded reopening by someone responsible for the
          project, keeps the record that was signed the record that exists, and keeps the history of approvals complete.
        children:
          - ReviewCenter-SigningService-ApprovalLock
