---
# Core Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Core subsystem
# - The Core subsystem spans the Fingerprint, ProjectService, ReviewService, ThreadService, ChecklistService,
#   UserService, RecordDigest, SigningService, RepositoryService, SelectionMatcher, RevisionValidator,
#   ReviewPlanner, LineDiff, ProjectAccess, and EvidenceSettingsService units, with the domain types they share
#   (project, evidence settings, review,
#   review file, thread, comment, checklist, user, project membership, actor, reviewer slot, signature, upload,
#   limits, repository, rule exception, and store interfaces)
# - Subsystem requirements describe the externally visible behavior of the domain model and its rules

sections:
  - title: Core Subsystem Requirements
    requirements:
      - id: ReviewCenter-Core-Projects
        title: >-
          The Core subsystem shall create projects from a name and an optional description, only for a system
          administrator, and shall list and read back the projects that the actor may see.
        justification: |
          Projects group the reviews of one body of work. The rest of the system can only manage reviews once
          projects can be created and found again, and a project is created only by a system administrator.
        children:
          - ReviewCenter-ProjectService-Create
          - ReviewCenter-ProjectService-CreateAdmin
          - ReviewCenter-ProjectService-List
          - ReviewCenter-ProjectService-Read
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-ProjectAccess
        title: >-
          The Core subsystem shall give access to a project by membership: a system administrator sees and
          administers every project and manages the members, a project administrator manages the members and the
          repositories of the own project, a member sees the own project and works in it, and every other actor,
          including a disabled, unknown, anonymous, or command line actor, gets the answer for a project that does
          not exist. A user who still has a temporary password has no access to any project. The subsystem shall
          decide on the current state of the user and the memberships at every call, treat an actor that came
          through a token as its owner, limit reviewer slots and signing to members, let a project administrator
          add an existing user only by the exact user name, with a limit on failed attempts and no way to list
          users, create an account only together with its membership, and not remove or demote the last
          project administrator, and audit every change of a membership with the project.
        justification: |
          Reviews of different bodies of work must be separated, and the separation must not reveal which projects
          exist. Deciding in one place, from the current data, keeps the rule the same for every page, route, and
          service, and makes a revoked right take effect at once. The people who work on a project manage who
          belongs to it, which only works if that power cannot be turned into a way to browse the users of the
          installation or to leave the project without anybody to manage it.
        children:
          - ReviewCenter-ProjectAccess-Visibility
          - ReviewCenter-ProjectAccess-SystemAdmin
          - ReviewCenter-ProjectAccess-NoAccount
          - ReviewCenter-ProjectAccess-NotFound
          - ReviewCenter-ProjectAccess-TemporaryPassword
          - ReviewCenter-ProjectAccess-Revocation
          - ReviewCenter-ProjectAccess-TokenOwner
          - ReviewCenter-ProjectAccess-List
          - ReviewCenter-ProjectAccess-Dependencies
          - ReviewCenter-ProjectService-Members
          - ReviewCenter-ProjectService-MemberRules
          - ReviewCenter-ProjectService-MemberLookup
          - ReviewCenter-ProjectService-AddThrottle
          - ReviewCenter-ProjectService-LastAdmin
          - ReviewCenter-ProjectService-CreateMemberAccount
          - ReviewCenter-ProjectService-MemberAudit
          - ReviewCenter-RepositoryService-Ownership
          - ReviewCenter-ThreadService-Access
          - ReviewCenter-ChecklistService-Access
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectAccess_Revocation_TakesEffectOnTheNextCall
          - ProjectService_Members_SystemAdminManages_OthersAreRefused
          - ProjectService_GetAsync_HiddenProject_ReadsAsMissing
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-EvidenceSettings
        title: >-
          The Core subsystem shall keep evidence settings for each project, private and complete by default, that
          decide whether the evidence index and the attestation PDFs may be read without signing in and which
          sections the PDFs contain, let only a system administrator or a project administrator of the project read
          and change them (every other actor gets the answer for a project that does not exist, and a plain member is
          told it may not), change them only from the settings the caller started from, refuse a change that was
          overtaken by another, record every change in the audit trail with its changed keys, and give the services
          that apply the settings to a request a read that needs no actor.
        justification: |
          Evidence is kept private unless the people who administer a project open it, and an attestation may be
          reduced only on purpose. The decision belongs to those administrators, must not be lost or undone by a
          simultaneous change, and must be traceable in the history of the project.
        children:
          - ReviewCenter-EvidenceSettingsService-Defaults
          - ReviewCenter-EvidenceSettingsService-Describe
          - ReviewCenter-EvidenceSettingsService-Access
          - ReviewCenter-EvidenceSettingsService-Change
          - ReviewCenter-EvidenceSettingsService-Audit
          - ReviewCenter-EvidenceSettingsService-NoChange
          - ReviewCenter-EvidenceSettingsService-Conflict
          - ReviewCenter-EvidenceSettingsService-Effective
          - ReviewCenter-EvidenceSettingsService-Arguments
        tests:
          - EvidenceSettingsService_GetAndSet_ActorKinds_AreAllowedOrRefused
          - EvidenceSettingsService_SetAsync_Change_IsStoredAndAudited
          - EvidenceSettingsService_SetAsync_ChangedMeanwhile_IsRefusedAsRecordChanged

      - id: ReviewCenter-Core-Reviews
        title: >-
          The Core subsystem shall create a draft review in a project from a set of uploaded files, keep every
          file byte for byte with its size and SHA-256 hash, and read the review, its list, and its file
          content back.
        justification: |
          A review is a fixed snapshot of the files to be reviewed. Keeping the exact bytes, and showing them
          again unchanged, is what lets a reviewer trust that the content seen is the content that was
          submitted, including binary files and files with Windows line endings.
        children:
          - ReviewCenter-ReviewService-Draft
          - ReviewCenter-ReviewService-Read
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Fingerprint
        title: >-
          The Core subsystem shall give every review a content fingerprint that is calculated from the bytes of
          its files exactly as ReviewMark calculates it, independent of file names and order.
        justification: |
          The fingerprint identifies the exact content under review and later allows a review to be matched to
          the evidence ReviewMark produces for the same files. Only the same algorithm gives the same value, so
          a deviation would silently break that match.
        children:
          - ReviewCenter-Fingerprint-FileHash
          - ReviewCenter-Fingerprint-SetHash
          - ReviewCenter-Fingerprint-Duplicates
          - ReviewCenter-ReviewService-Fingerprint
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack
          - CoreSubsystem_Fingerprint_SameContentOtherNamesAndOrder_GivesSameFingerprint

      - id: ReviewCenter-Core-Rules
        title: >-
          The Core subsystem shall enforce the project, review identity, and upload rules, and shall report each
          violation as a domain rule exception that names the rule, without storing anything.
        justification: |
          Rules that protect the integrity of the review record must hold no matter which user interface or
          store is used. Naming the violated rule lets a caller tell the user what to correct, and storing
          nothing on a violation keeps the record free of partial reviews.
        children:
          - ReviewCenter-ProjectService-Validation
          - ReviewCenter-ReviewService-Id
          - ReviewCenter-ReviewService-Title
          - ReviewCenter-ReviewService-Project
          - ReviewCenter-ReviewService-Files
          - ReviewCenter-ReviewService-Limits
          - ReviewCenter-ThreadService-Anchor
          - ReviewCenter-ThreadService-Comment
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-Threads
        title: >-
          The Core subsystem shall start comment threads on a file of a review, anchored to the whole file or a
          line range, let anyone reply, resolve and reopen threads, and read the threads of a review back with
          their comments in order, never changing or removing a posted comment, and give the last activity of a
          thread, an index of threads by state, and a next step.
        justification: |
          Review comments are the purpose of a review. Keeping posted comments unchanged makes the discussion a
          reliable record of what was said and in which order.
        children:
          - ReviewCenter-ThreadService-Start
          - ReviewCenter-ThreadService-Reply
          - ReviewCenter-ThreadService-State
          - ReviewCenter-ThreadService-Read
          - ReviewCenter-ThreadService-Index
          - ReviewCenter-ThreadService-NextStep
        tests:
          - CoreSubsystem_ThreadWorkflow_StartReplyResolveReopen_ReadsBackInOrder

      - id: ReviewCenter-Core-Diff
        title: >-
          The Core subsystem shall give the line differences between the baseline and the head content of a file of
          a review from the content frozen with the review, within fixed bounds on the size of the comparison, and
          let a thread be anchored to lines of either side, so that a reviewer can comment on removed lines as well
          as on lines at the head, with the side bound into the record digest.
        justification: |
          A change is reviewed by looking at what was removed and what was added. The comparison must not depend on
          the repository still being reachable, must stay bounded, and a comment must keep saying which text it is
          about.
        children:
          - ReviewCenter-LineDiff-Compute
          - ReviewCenter-LineDiff-Order
          - ReviewCenter-LineDiff-Numbering
          - ReviewCenter-LineDiff-Bounds
          - ReviewCenter-LineDiff-Segments
          - ReviewCenter-LineDiff-Pairing
          - ReviewCenter-ReviewService-Diff
          - ReviewCenter-ThreadService-Side
          - ReviewCenter-RecordDigest-ThreadSide
        tests:
          - ReviewService_GetDiffAsync_ModifiedAddedDeleted_ComparesFrozenContentWithoutGit
          - ThreadService_StartThreadAsync_SideMatrix_AcceptsOnlyLinesThatExistOnThatSide

      - id: ReviewCenter-Core-Checklist
        title: >-
          The Core subsystem shall give every review a checklist of checks grouped in sections, frozen when the
          review is created, let each section be marked as not applicable with a reason, let each check be
          answered Pass, Fail, or N/A with a justification where required, and give the progress per section and
          overall and whether the checklist is complete.
        justification: |
          The checklist turns the review into a defined set of checks, so that it is clear what was examined and
          what is still open. Freezing it at creation keeps the questions fixed for the life of the review.
        children:
          - ReviewCenter-ChecklistService-Default
          - ReviewCenter-ChecklistService-Freeze
          - ReviewCenter-ChecklistService-Applicability
          - ReviewCenter-ChecklistService-Answer
          - ReviewCenter-ChecklistService-AnsweredBy
          - ReviewCenter-ChecklistService-Progress
        tests:
          - CoreSubsystem_Checklist_FrozenAtCreationAnswerAndProgress

      - id: ReviewCenter-Core-Users
        title: >-
          The Core subsystem shall create users with a user name, a display name, a system administrator flag, and a
          password, keeping only a hash of the password, check a sign-in with a lockout after repeated failures,
          enable and disable users, set the system administrator flag, change and set passwords, never leave
          the system without an enabled system administrator, and let an account that has a temporary password sign
          in but do nothing except choose a new password, which cannot be confirmed as a signature.
        justification: |
          Accountability in a review needs verified users. The rules must hold whichever user interface or store
          is used, and keeping only a hash of the password protects the passwords if the database is copied. A
          password handed over by somebody else proves little, so it only opens the way to replacing it.
        children:
          - ReviewCenter-UserService-Username
          - ReviewCenter-UserService-DisplayName
          - ReviewCenter-UserService-Password
          - ReviewCenter-UserService-Create
          - ReviewCenter-UserService-Authenticate
          - ReviewCenter-UserService-Lockout
          - ReviewCenter-UserService-Enabled
          - ReviewCenter-UserService-LastAdmin
          - ReviewCenter-UserService-ChangePassword
          - ReviewCenter-UserService-SetPassword
          - ReviewCenter-UserService-SetSystemAdmin
          - ReviewCenter-UserService-NotFound
          - ReviewCenter-UserService-TemporaryPassword
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-Core-Signatures
        title: >-
          The Core subsystem shall let a review have reviewer slots with a primary reviewer and an optional
          alternate, let a reviewer sign the review only when nothing blocks it and only after confirming the
          password again, bind each signature to a digest of the review record, keep every signature unchanged,
          and show a signature as out of date, and the review as not approved, as soon as the record changes
          until every slot has signed the new record.
        justification: |
          A signature is only worth something if it says who approved which content. Binding it to a digest of
          the record, and computing the approval from the record each time, means an approval can never outlive
          the content it approved, and asking for the password again shows the approval came from the person.
        children:
          - ReviewCenter-RecordDigest-Format
          - ReviewCenter-RecordDigest-Coverage
          - ReviewCenter-RecordDigest-Checklist
          - ReviewCenter-RecordDigest-AnsweredBy
          - ReviewCenter-RecordDigest-Independence
          - ReviewCenter-RecordDigest-Unambiguous
          - ReviewCenter-SigningService-Slots
          - ReviewCenter-SigningService-SlotUsers
          - ReviewCenter-SigningService-SlotEdit
          - ReviewCenter-SigningService-Actor
          - ReviewCenter-SigningService-Blockers
          - ReviewCenter-SigningService-Sign
          - ReviewCenter-SigningService-Reauthenticate
          - ReviewCenter-SigningService-Current
          - ReviewCenter-SigningService-Status
        tests:
          - CoreSubsystem_Signatures_SignChangeOutOfDateAndResign_FollowsTheRecord

      - id: ReviewCenter-Core-AuditTrail
        title: >-
          The Core subsystem shall record every change of projects, reviews, threads, checklists, reviewer slots,
          signatures, and users, and every sign-in event, as an entry of a hash-chained audit trail that names the
          actor, the action, and a short detail without passwords or free text, read the trail back newest first
          in pages, for the whole trail, for one project, or for one review, and verify the chain by streaming, so
          that an edit, a deletion, an insertion, or a reordering
          in the middle of the history is detected.
        justification: |
          A review record is only trustworthy if its history can be checked. Hash chaining makes tampering with
          the middle of the history evident without a special database. It does not detect the removal of the
          newest entries or a complete rewrite by someone with write access to the database, unless the head hash
          was recorded elsewhere.
        children:
          - ReviewCenter-AuditChain-Hash
          - ReviewCenter-AuditChain-Verify
          - ReviewCenter-AuditChain-Text
          - ReviewCenter-AuditService-Record
          - ReviewCenter-AuditService-Coalesce
          - ReviewCenter-AuditService-CoalesceOverflow
          - ReviewCenter-AuditService-List
          - ReviewCenter-AuditService-Verify
          - ReviewCenter-ProjectService-Audit
          - ReviewCenter-ProjectService-MemberAudit
          - ReviewCenter-EvidenceSettingsService-Audit
          - ReviewCenter-ReviewService-Audit
          - ReviewCenter-ThreadService-Audit
          - ReviewCenter-ChecklistService-Audit
          - ReviewCenter-SigningService-Audit
          - ReviewCenter-UserService-Audit
          - ReviewCenter-UserService-SignInAudit
          - ReviewCenter-UserService-ReauthAudit
          - ReviewCenter-SigningService-ReauthAudit
          - ReviewCenter-RepositoryService-Audit
        tests:
          - AuditService_RecordAsync_Draft_StoresEntryThatVerifies
          - UserService_AdministrationEvents_AreRecordedWithoutPasswords

      - id: ReviewCenter-Core-Repositories
        title: >-
          The Core subsystem shall keep a registry of git repositories, each belonging to one project, with a name, a
          location, an optional user name, and an optional token that is stored only encrypted and is never given
          back, managed by the administrator of the project or a system administrator only, disabled instead of
          deleted, and report each violation of its rules as a domain rule exception that names the rule, without
          storing anything.
        justification: |
          The registry decides what source code the server reads and holds secrets for it. Its rules must hold
          whichever user interface or store is used, the token must stay write-only, and a project must not be
          able to use the repositories of another.
        children:
          - ReviewCenter-RepositoryService-Name
          - ReviewCenter-RepositoryService-Location
          - ReviewCenter-RepositoryService-Credentials
          - ReviewCenter-RepositoryService-Token
          - ReviewCenter-RepositoryService-Admin
          - ReviewCenter-RepositoryService-Ownership
          - ReviewCenter-RepositoryService-Disable
          - ReviewCenter-RepositoryService-Access
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-FileSelection
        title: >-
          The Core subsystem shall check a revision given by a user, and match repository paths against include and
          exclude selection patterns that support the common glob syntax, reporting an invalid revision or pattern
          as a domain rule exception that names the rule.
        justification: |
          Revisions and patterns come from users and are passed on to git and to the file walk. Checking them in
          one place keeps option-like text away from git and keeps a pattern from using unbounded resources.
        children:
          - ReviewCenter-RevisionValidator-Accept
          - ReviewCenter-RevisionValidator-Refuse
          - ReviewCenter-SelectionMatcher-Match
          - ReviewCenter-SelectionMatcher-Parse
          - ReviewCenter-SelectionMatcher-Bounded
          - ReviewCenter-SelectionMatcher-Compatibility
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-RepositoryReviews
        title: >-
          The Core subsystem shall create a review from the files that changed in a registered git repository between
          an optional baseline revision and a head revision and match a selection, freeze their baseline and head
          content and the resolved commits, refuse a review that has no such file, bind the source, the selection, and
          every change into the record digest, and accept a comment on the lines of a file only when it exists at the
          head.
        justification: |
          A review of a change must keep exactly what was reviewed, and a signature must bind to it, so that neither a
          later commit nor a different selection can leave a signature looking current.
        children:
          - ReviewCenter-ReviewService-FromRepository
          - ReviewCenter-ReviewService-Frozen
          - ReviewCenter-ReviewService-NothingToReview
          - ReviewCenter-ReviewService-RepositoryLimits
          - ReviewCenter-ReviewService-SkippedEntries
          - ReviewCenter-ReviewService-RepositoryAudit
          - ReviewCenter-RecordDigest-Source
          - ReviewCenter-ReviewService-ReviewSet
          - ReviewCenter-ThreadService-DeletedFile
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing
          - ReviewService_CreateFromRepositoryAsync_Changes_FreezesFilesAndSource

      - id: ReviewCenter-Core-PlanReviews
        title: >-
          The Core subsystem shall plan the reviews that a head revision of a registered repository needs, one for each
          review-set that the repository defines in its configuration file, choosing for each set a full review, the
          changes since a given revision, or the changes since the last signed review of that set (falling back to a
          full
          review, with a plain note, when that review is not in the history or covered other files), telling which sets
          are already filed or have nothing to review, and create the picked reviews through the review service, each in
          its own transaction, reporting the result of each.
        justification: |
          A repository already states which sets of files are reviewed together. Planning from that statement, and
          creating the reviews with the same rules as a review made by hand, saves effort and mistakes, and falling
          back to a full review whenever a baseline cannot be trusted keeps changed files from escaping review.
        children:
          - ReviewCenter-ReviewPlanner-Plan
          - ReviewCenter-ReviewPlanner-Baseline
          - ReviewCenter-ReviewPlanner-Classification
          - ReviewCenter-ReviewPlanner-Create
          - ReviewCenter-ReviewPlanner-Identity
        tests:
          - ReviewPlanner_PlanAsync_NoBaseline_ClassifiesSetsWithOneSession
          - ReviewPlanner_CreateAsync_PlanRows_CreatesReviewsWithSetIdAndOneSession
          - ReviewPlanner_CreateAsync_RealGit_LastReviewedBaselineThenAlreadyFiled

      - id: ReviewCenter-Core-AccessTokens
        title: >-
          The Core subsystem shall let a user create personal access tokens with a name and an expiry, up to a limit,
          show the value only when it is created, authenticate a request from a token as its owner for as long as the
          owner is allowed to sign in and has no temporary password, let the owner revoke a token, record the
          creation and the revocation in the audit trail, mark a review created through a token, and refuse that an
          actor that came through a token signs a review or arranges the reviewers.
        justification: |
          Scripts need a credential of their own, and it must give less than a person has. Keeping only a hash, a
          limit, an expiry, and a revocation that works at once keep a leaked token small in effect, and refusing a
          signature in the service keeps the rule in force for every route that is ever added.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create
          - ReviewCenter-PersonalAccessTokenService-Expiry
          - ReviewCenter-PersonalAccessTokenService-Limit
          - ReviewCenter-PersonalAccessTokenService-Authenticate
          - ReviewCenter-PersonalAccessTokenService-LastUsed
          - ReviewCenter-PersonalAccessTokenService-Revoke
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword
          - ReviewCenter-PersonalAccessTokenService-Audit
          - ReviewCenter-SigningService-ApiToken
          - ReviewCenter-ReviewService-CreatedVia
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner
          - CoreSubsystem_TokenActor_CreatesFlaggedReviewButCannotSign

      - id: ReviewCenter-Core-ExternalIdentity
        title: >-
          The Core subsystem shall let a person who signed in at an OpenID Connect provider have an account, found by
          the issuer and the subject only, created without any right on the first sign-in, never linked to another
          account, and without a password, and shall let such a person sign a review only with a confirmation of
          identity from the provider that is for this user and slot, valid for a short time, and used up by the
          signature.
        justification: |
          The provider says who the person is, and the review tool says what the person may do. Keeping the rules in
          the services keeps every page and route that is ever added from giving a right, a password, or a signature
          to an account that the provider only vouches for.
        children:
          - ReviewCenter-UserService-ExternalSignIn
          - ReviewCenter-UserService-ExternalCreate
          - ReviewCenter-UserService-UsernameCollision
          - ReviewCenter-UserService-ExternalNoPassword
          - ReviewCenter-SigningService-ExternalReauth
          - ReviewCenter-ReauthProofStore-SingleUse
          - ReviewCenter-ReauthProofStore-Binding
          - ReviewCenter-ReauthProofStore-Expiry
          - ReviewCenter-ReauthProofStore-Bounded
        tests:
          - UserService_SignInExternalAsync_FirstThenSecond_CreatesOnceAndMatches
          - SigningService_SignAsync_ExternalUserWithProof_SignsOnce

      - id: ReviewCenter-Core-TotpSecondFactor
        title: >-
          The Core subsystem shall let a user of a local account turn on a second factor with a code of an authenticator
          app and ten recovery codes, ask for the code after the password at sign-in and at every signature, accept
          each code only once, count wrong codes toward the lockout of the password, let the user and, for a lost
          phone, a system administrator turn it off, record every change in the audit trail, and never keep or show a
          secret or a code anywhere but in the answer that creates it.
        justification: |
          A password alone is the weakest link of a review tool that holds signatures. The rules sit in the services so
          that every page and route that is ever added gets them, and so that the code cannot be avoided by a path
          that was written earlier.
        children:
          - ReviewCenter-TotpService-Enrollment
          - ReviewCenter-TotpService-Availability
          - ReviewCenter-TotpService-Verify
          - ReviewCenter-TotpService-Replay
          - ReviewCenter-TotpService-RecoveryCodes
          - ReviewCenter-TotpService-Disable
          - ReviewCenter-TotpService-AdminReset
          - ReviewCenter-TotpService-Lockout
          - ReviewCenter-TotpService-Audit
          - ReviewCenter-TotpService-NoSecretLeak
          - ReviewCenter-TotpChallengeStore-SingleUse
          - ReviewCenter-TotpChallengeStore-Binding
          - ReviewCenter-TotpChallengeStore-Expiry
          - ReviewCenter-TotpChallengeStore-Bounded
          - ReviewCenter-TotpChallengeStore-Invalidate
          - ReviewCenter-UserService-SecondFactorRequired
          - ReviewCenter-UserService-SecondFactorLockout
          - ReviewCenter-SigningService-TotpReauth
        tests:
          - TotpService_CompleteSignInAsync_ConcurrentSameCode_ExactlyOneSucceeds
          - SigningService_SignAsync_EnrolledUserWithPasswordAndFreshCode_Signs
