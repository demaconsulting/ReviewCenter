      - id: ReviewCenter-Core-IndependentReviewers
        title: >-
          The Core subsystem shall let each project require independent reviewers, on for a new project, so that the
          user who created a review, which for a review created with an access token is the owner of the token, can
          neither be a primary reviewer or an alternate of a slot of it nor sign it, also for a slot that was filled
          before the setting was switched on, shall let only an administrator of the project or a system
          administrator change the setting, never through an access token, and shall record each change in the audit
          trail.
        justification: |
          A review in which the author is also the approver gives little assurance. Making independence the default,
          while leaving a project that must let one person do both a recorded way to switch it off, keeps the rule
          strong without blocking such a project. The rule applies to the user who created the review in this tool and
          not to the authors of the commits, which the tool cannot know.
        children:
          - ReviewCenter-SigningService-IndependentReviewers
          - ReviewCenter-SigningService-IndependentReviewers-Update
          - ReviewCenter-SigningService-IndependentReviewers-Signing
          - ReviewCenter-SigningService-IndependentReviewers-SettingOff
          - ReviewCenter-ProjectService-IndependentReviewersSetting
        tests:
          - CoreSubsystem_IndependentReviewers_AuthorCannotBeSlotReviewerOrSign
          - CoreSubsystem_IndependentReviewers_SettingChangeIsAuditedAndAdminOnly
          - CoreSubsystem_ApiTokenReview_AuthorIsTokenUser

      - id: ReviewCenter-Core-ReviewRuleSwitches
        title: >-
          The Core subsystem shall keep, for each project, a switch for each of two further review rules (authors
          answering the checklist of their own review, and the person who reopened a review signing it again), on for
          a new project and for every project that existed before the rules were enforced, shall let only an
          administrator of the project or a system administrator change them, never through an access token, and shall
          record each change in the audit trail.
        justification: |
          Every project has a recorded choice, and the default is on. The change rules are the ones of the
          independence rule, so that a project that has to relax a rule does so in a way that is visible in the
          history.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-Core-ReviewRules
        title: >-
          The Core subsystem shall enforce the two further review rules of a project through its services, whatever
          the caller: while a project requires that authors do not answer the checklist, the author of a review cannot
          answer a check or change the applicability of a section of it; while it requires that the person who
          reopened a review does not sign it again, that person cannot sign it, but can still answer the checklist and
          hand in a ballot of a slot, and an administrator cannot reopen a
          review in a way that leaves a slot without a person who may sign; and a project that switched a rule off is
          not restricted by it.
        justification: |
          Enforcing the rules in the services means that the web pages, the API, and the command line cannot bypass
          them. The reopening guard keeps a review from becoming impossible to approve. A rule that an administrator
          can switch off, with a record, leaves a project that has to let one person do everything able to do so.
        children:
