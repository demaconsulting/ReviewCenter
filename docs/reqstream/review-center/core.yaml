      - id: ReviewCenter-Core-NotificationLimits
        title: >-
          The Core subsystem shall refuse an e-mail confirmation step that goes beyond a limit that is set for the
          confirmation.
        justification: |
          A confirmation sends mail to an address chosen by a user, so it could be used to flood a mailbox or to use
          the mail server for bulk mail, and a six digit code could be guessed. The limits are the pause of 60 seconds
          between mails, three mails per user and three mails per address in a day, a limit per hour for the whole
          server, five wrong codes for each code, and a lifetime of 30 minutes for a code.
        children:
          - ReviewCenter-NotificationPreferenceService-ResendCooldown
          - ReviewCenter-NotificationPreferenceService-ResendAfterCooldown
          - ReviewCenter-NotificationPreferenceService-UserDailyLimit
          - ReviewCenter-NotificationPreferenceService-AddressDailyLimit
          - ReviewCenter-NotificationPreferenceService-ServerHourlyLimit
          - ReviewCenter-NotificationPreferenceService-LimitsRecover
          - ReviewCenter-NotificationPreferenceService-AttemptLimit
          - ReviewCenter-NotificationPreferenceService-CodeLifetime
          - ReviewCenter-NotificationPreferenceService-ExpiredReported
        tests:
          - NotificationPreferenceService_RequestConfirmation_UserDailyLimit_ThrowsLimitReached
          - NotificationPreferenceService_Confirm_AfterMaxWrongAttempts_RefusesTheRightCode

      - id: ReviewCenter-Core-NotificationAccess
        title: >-
          The Core subsystem shall refuse a notification address action that is not permitted for the acting account.
        justification: |
          The address decides where the server sends mail, so only the interactive session of an enabled user may
          change it. An actor that signed in with an API token, a disabled or unknown user, a user with a temporary
          password, and every request while the feature is off or no sender is configured are not permitted, and a
          refusal touches no data.
        children:
          - ReviewCenter-NotificationPreferenceService-RefuseApiToken
          - ReviewCenter-NotificationPreferenceService-RefuseFeatureOff
          - ReviewCenter-NotificationPreferenceService-FeatureOffTouchesNoStore
          - ReviewCenter-NotificationPreferenceService-UnavailableWithoutSender
