      - id: ReviewCenter-Core-NotificationConfirmation
        title: >-
          The Core subsystem shall confirm an e-mail address for notifications only when the user types back the code
          that was mailed to that address.
        justification: |
          Mail may go only to an address that its owner has shown to be theirs. The owner shows it by reading a code
          in a mail that was sent to the address, so a typing error or a stranger's address never receives
          notifications. The code is mailed once, kept only as a salted hash, never shown elsewhere, and the mail has no
          link.
        children:
          - ReviewCenter-NotificationPreferenceService-MailCode
