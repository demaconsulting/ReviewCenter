      - id: ReviewCenter-Core-NotificationAudit
        title: >-
          The Core subsystem shall record each change of a notification address as an audit entry.
        justification: |
          A change of the place where mail goes belongs in the audit trail. The trail is kept for a long time and read
          by many people, so it must hold neither personal data nor a code that could still be used.
        children:
          - ReviewCenter-NotificationPreferenceService-AuditRequest
