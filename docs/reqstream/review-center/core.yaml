      - id: ReviewCenter-Core-NotificationAddress
        title: >-
          The Core subsystem shall accept a text as the e-mail address for notifications only when the text is exactly
          one syntactically valid address.
        justification: |
          The address is typed by a person and ends up in the header of a mail that the server sends. A list, a
          display name, or a line break could aim the mail at someone else or add a header, so only one plain address
          may pass, in one normal form.
