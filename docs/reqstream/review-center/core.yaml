      - id: ReviewCenter-Core-NotificationLimits
        title: >-
          The Core subsystem shall refuse an e-mail confirmation step that goes beyond a limit that is set for the
          confirmation.
        justification: |
          A confirmation sends mail to an address chosen by a user, so it could be used to flood a mailbox or to use
          the mail server for bulk mail, and a six digit code could be guessed. The limits are the pause of 60 seconds
          between mails, three mails per user and three mails per address in a day, a limit per hour for the whole
          server, five wrong codes for each code, and a lifetime of 30 minutes for a code.
        children:
          - ReviewCenter-NotificationPreferenceService-ResendCooldown
          - ReviewCenter-NotificationPreferenceService-ResendAfterCooldown
          - ReviewCenter-NotificationPreferenceService-UserDailyLimit
          - ReviewCenter-NotificationPreferenceService-AddressDailyLimit
