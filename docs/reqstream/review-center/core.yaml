          - ReviewCenter-ReviewService-Files
          - ReviewCenter-ReviewService-Files-BlankPath
          - ReviewCenter-ReviewService-Files-PathLength
          - ReviewCenter-ReviewService-Files-DuplicatePath
          - ReviewCenter-ReviewService-Files-PathCase
          - ReviewCenter-ReviewService-Limits
          - ReviewCenter-ReviewService-Limits-AtLimit
          - ReviewCenter-ReviewService-Limits-FileCount
          - ReviewCenter-ReviewService-Limits-TotalSize
          - ReviewCenter-ThreadService-Anchor
          - ReviewCenter-ThreadService-Comment
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-Threads
        title: >-
          The Core subsystem shall start comment threads on a file of a review, anchored to the whole file or a
          line range, let anyone reply, resolve and reopen threads, and read the threads of a review back with
          their comments in order, never changing or removing a posted comment, and give the last activity of a
          thread, an index of threads by state, and a next step. A comment shall be chat unless it is included in the
          report; the owner rules for including comments, resolution notes, and promoting and demoting threads are
          met by the ThreadService requirements below.
        justification: |
          Review comments are the purpose of a review. Keeping posted comments unchanged makes the discussion a
          reliable record of what was said and in which order.
        children:
          - ReviewCenter-ThreadService-Start
          - ReviewCenter-ThreadService-Reply
          - ReviewCenter-ThreadService-State
          - ReviewCenter-ThreadService-Read
          - ReviewCenter-ThreadService-Index
          - ReviewCenter-ThreadService-NextStep
