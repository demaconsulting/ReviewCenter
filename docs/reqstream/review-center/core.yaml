      - id: ReviewCenter-Core-IndependentReviewers
        title: >-
          The Core subsystem shall let each project require independent reviewers, on for a new project, so that the
          user who created a review, which for a review created with an access token is the owner of the token, can
          neither be a primary reviewer or an alternate of a slot of it nor sign it, also for a slot that was filled
          before the setting was switched on, shall let only an administrator of the project or a system
          administrator change the setting, never through an access token, and shall record each change in the audit
          trail.
        justification: |
          A review in which the author is also the approver gives little assurance. Making independence the default,
          while leaving a project that must let one person do both a recorded way to switch it off, keeps the rule
