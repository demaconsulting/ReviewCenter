---
# Core Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Core subsystem
# - The Core subsystem spans the Fingerprint, ProjectService, ReviewService, ThreadService, ChecklistService,
#   UserService, RecordDigest, SigningService, RepositoryService, SelectionMatcher, RevisionValidator,
#   ReviewPlanner, LineDiff, ProjectAccess, EvidenceSettingsService, ProjectChecklistService, InboxService,
#   UserImpactService, BallotConsolidation, BallotVisibility, ReviewStatusService, NotificationAddress,
#   NotificationMessage, NotificationPreferenceService, NotificationComposer, DigestSchedule, and
#   NotificationDispatcher
#   units, with the
#   domain types they share
#   (project, evidence settings, review,
#   review file, thread, comment, checklist, user, project membership, actor, reviewer slot, signature, upload,
#   limits, repository, rule exception, and store interfaces)
# - Subsystem requirements describe the externally visible behavior of the domain model and its rules

sections:
  - title: Core Subsystem Requirements
    requirements:
      - id: ReviewCenter-Core-Projects
        title: >-
          The Core subsystem shall create a project from a name and an optional description.
        justification: |
          Projects group the reviews of one body of work. The rest of the system can only manage reviews once
          projects can be created.
        children:
          - ReviewCenter-ProjectService-Create
          - ReviewCenter-ProjectService-Create-NameTrimmed
          - ReviewCenter-ProjectService-Create-DescriptionTrimmed
          - ReviewCenter-ProjectService-Create-EmptyDescription
          - ReviewCenter-ProjectService-Create-CreationTime
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Projects-AdminOnly
        title: >-
          The Core subsystem shall create a project only for a system administrator.
        justification: |
          A project is the unit of separation between bodies of work, so only the people who run the installation
          may start one.
        children:
          - ReviewCenter-ProjectService-CreateAdmin
          - ReviewCenter-ProjectService-CreateAdmin-NoMembers
          - ReviewCenter-ProjectService-CreateAdmin-NothingStored
        tests:
          - CoreSubsystem_CreateProject_NotSystemAdministrator_IsRefusedAndStoresNothing

      - id: ReviewCenter-Core-Projects-List
        title: >-
          The Core subsystem shall list the projects that the actor may see.
        justification: |
          People find the work to do from the list of the projects, and the list must not show a project that the
          actor has no right to see.
        children:
          - ReviewCenter-ProjectService-List
          - ReviewCenter-ProjectService-List-Order
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Projects-Read
        title: >-
          The Core subsystem shall read back a project that the actor may see.
        justification: |
          A page or a service that works on a project must be able to read the project again by its identifier,
          and an actor who may not see the project must get the answer for a project that does not exist.
        children:
          - ReviewCenter-ProjectService-Read
          - ReviewCenter-ProjectService-Read-Unknown
          - ReviewCenter-ProjectService-Read-Hidden

      - id: ReviewCenter-Core-ProjectAccess
        title: >-
          The Core subsystem shall let a member of a project see the project that the member belongs to.
        justification: |
          Reviews of different bodies of work must be separated, so a person sees the projects that the person
          has been made a member of and lists only those.
        children:
          - ReviewCenter-ProjectAccess-Visibility
          - ReviewCenter-ProjectAccess-Visibility-UndefinedRole
          - ReviewCenter-ProjectAccess-Visibility-UndefinedRoleListed
          - ReviewCenter-ProjectAccess-Visibility-UndefinedRoleMember
          - ReviewCenter-ProjectAccess-List-Member
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - AccessCoverage_PublicActorMethods_AreAllClassified
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-ProjectAccess-Work
        title: >-
          The Core subsystem shall let a member whose role is User or project administrator, and an enabled
          system administrator, work in a project.
        justification: |
          Working in a project (starting reviews, discussing, answering, signing) must be tied to the membership
          and its role, and the same rule must apply to every page, route, and service.
        children:
          - ReviewCenter-ProjectAccess-Contribute
          - ReviewCenter-ProjectAccess-Contribute-ProjectAdmin
          - ReviewCenter-ProjectAccess-Contribute-SystemAdmin
          - ReviewCenter-ProjectAccess-Contribute-UndefinedRole
        tests:
          - ReviewOperations_ProjectAdminAndSystemAdmin_AreAllowed

      - id: ReviewCenter-Core-ProjectAccess-ProjectAdmin
        title: >-
          The Core subsystem shall let a project administrator administer the own project, manage its members,
          and manage its repositories.
        justification: |
          The people who work on a project manage who belongs to it and which repositories feed it, so that the
          installation administrator does not have to take part in every change.
        children:
          - ReviewCenter-ProjectAccess-Visibility-Administer
          - ReviewCenter-ProjectService-Members
          - ReviewCenter-ProjectService-Members-ChangeRole
          - ReviewCenter-ProjectService-Members-Remove
          - ReviewCenter-ProjectService-Members-List
          - ReviewCenter-ProjectService-Members-ListOrder
          - ReviewCenter-ProjectService-Members-ProjectAdmin
          - ReviewCenter-ProjectService-MemberRules
          - ReviewCenter-ProjectService-MemberRules-RoleChangeNoMembership
          - ReviewCenter-ProjectService-MemberRules-RemoveNoMembership
          - ReviewCenter-ProjectService-MemberRules-UnknownUser
          - ReviewCenter-ProjectService-MemberRules-UnknownProject
          - ReviewCenter-ProjectService-MemberRules-NothingChanged
          - ReviewCenter-ProjectService-MemberRules-UndefinedRole
          - ReviewCenter-RepositoryService-Ownership
          - ReviewCenter-RepositoryService-Ownership-Access
          - ReviewCenter-RepositoryService-Ownership-Listing
          - ReviewCenter-RepositoryService-Ownership-ListingProject
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - Repositories_OfAnotherProject_CannotBeUsedOrChanged

      - id: ReviewCenter-Core-ProjectAccess-PlainMember
        title: >-
          The Core subsystem shall not let a member who is not a project administrator administer the project or
          manage its members.
        justification: |
          Managing who belongs to a project is a power of its administrators, so every other member, including an
          auditor, must be refused.
        children:
          - ReviewCenter-ProjectAccess-Visibility-NotAdministrator
          - ReviewCenter-ProjectAccess-NotFound-NotAdministrator
          - ReviewCenter-ProjectService-Members-PlainMember
          - ReviewCenter-ProjectService-AuditorRole-Refused
        tests:
          - ProjectService_Members_SystemAdminManages_OthersAreRefused

      - id: ReviewCenter-Core-ProjectAccess-OtherActors
        title: >-
          The Core subsystem shall give every actor who is not entitled to see a project, including a disabled,
          unknown, anonymous, or command line actor, the answer for a project that does not exist.
        justification: |
          The separation of projects must not reveal which projects exist, so a refusal must look the same as a
          project that is missing.
        children:
          - ReviewCenter-ProjectAccess-Visibility-NonMember
          - ReviewCenter-ProjectAccess-Visibility-NonMember-Administer
          - ReviewCenter-ProjectAccess-Visibility-OtherProject
          - ReviewCenter-ProjectAccess-Visibility-OtherProject-Administer
          - ReviewCenter-ProjectAccess-NoAccount
          - ReviewCenter-ProjectAccess-NoAccount-CommandLine
          - ReviewCenter-ProjectAccess-NoAccount-NoName
          - ReviewCenter-ProjectAccess-NoAccount-UnknownUser
          - ReviewCenter-ProjectAccess-NoAccount-Disabled
          - ReviewCenter-ProjectAccess-NotFound
          - ReviewCenter-ProjectAccess-NotFound-Missing
          - ReviewCenter-ProjectAccess-NotFound-Same
          - ReviewCenter-ProjectAccess-NotFound-Administer
          - ReviewCenter-ProjectAccess-NotFound-NotSystemAdmin
          - ReviewCenter-ProjectAccess-Contribute-NotFound
          - ReviewCenter-ProjectAccess-AuditAccess-NotFound
          - ReviewCenter-ProjectAccess-List-NoAccess
          - ReviewCenter-ProjectService-Members-Hidden
          - ReviewCenter-ThreadService-Access
          - ReviewCenter-ThreadService-Access-CommandLine
          - ReviewCenter-ThreadService-Access-NothingStored
          - ReviewCenter-ChecklistService-Access
          - ReviewCenter-ChecklistService-Access-Section
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectService_GetAsync_HiddenProject_ReadsAsMissing
          - ReviewOperations_NotAMember_AreRefusedAsAMissingProjectAndChangeNothing

      - id: ReviewCenter-Core-ProjectAccess-SystemAdmin
        title: >-
          The Core subsystem shall let an enabled system administrator see and administer every project that
          exists, and manage the members of every project.
        justification: |
          The person who runs the installation must be able to find and manage every body of work, also when the
          project has no administrator left.
        children:
          - ReviewCenter-ProjectAccess-SystemAdmin
          - ReviewCenter-ProjectAccess-SystemAdmin-Administer
          - ReviewCenter-ProjectAccess-SystemAdmin-Missing
          - ReviewCenter-ProjectAccess-SystemAdmin-Missing-Administer
          - ReviewCenter-ProjectAccess-List
          - ReviewCenter-ProjectService-Members-SystemAdmin
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectService_Members_SystemAdminManages_OthersAreRefused

      - id: ReviewCenter-Core-ProjectAccess-AuditTrail
        title: >-
          The Core subsystem shall let a project administrator, a member whose role is Auditor, and an enabled
          system administrator read the audit trail of a project.
        justification: |
          The audit trail of a project is the record that others rely on, so the people who manage and the people
          who oversee the project must be able to read it.
        children:
          - ReviewCenter-ProjectAccess-AuditAccess
          - ReviewCenter-ProjectAccess-AuditAccess-Auditor
          - ReviewCenter-ProjectAccess-AuditAccess-SystemAdmin

      - id: ReviewCenter-Core-ProjectAccess-AuditTrailRefused
        title: >-
          The Core subsystem shall not let a member whose role is User read the audit trail of a project.
        justification: |
          The audit trail names the actions of everybody on the project, so reading it is not part of ordinary work.
        children:
          - ReviewCenter-ProjectAccess-AuditAccess-NotAllowed

      - id: ReviewCenter-Core-ProjectAccess-Auditor
        title: >-
          The Core subsystem shall let a member whose role is Auditor see the project but not work in it.
        justification: |
          An auditor oversees the review work without taking part in it, so the auditor must read everything and
          change nothing.
        children:
          - ReviewCenter-ProjectAccess-Contribute-AuditorSees
          - ReviewCenter-ProjectAccess-Contribute-AuditorReadOnly
          - ReviewCenter-ProjectAccess-Contribute-NotAllowed
          - ReviewCenter-ThreadService-Access-Auditor
          - ReviewCenter-ChecklistService-BallotAccess
        tests:
          - ReviewOperations_Auditor_AreRefusedAsNotAllowedAndChangeNothing
          - ReviewReads_Auditor_AreAllowed

      - id: ReviewCenter-Core-ProjectAccess-TemporaryPassword
        title: >-
          The Core subsystem shall give no access to any project to a user whose password is still a temporary
          one.
        justification: |
          A temporary password is known to the person who created the account, so it must not give access to the
          work until the user has chosen a password.
        children:
          - ReviewCenter-ProjectAccess-TemporaryPassword
          - ReviewCenter-ProjectAccess-TemporaryPassword-Changed
        tests:
          - UserService_ChangeOwnPasswordAsync_NewPassword_ClearsTheFlagAndGivesAccess

      - id: ReviewCenter-Core-ProjectAccess-CurrentState
        title: >-
          The Core subsystem shall decide on the current state of the user and the memberships at every call.
        justification: |
          Deciding from the current data makes a removed membership, a changed role, or a disabled account take
          effect at once, without a new sign-in.
        children:
          - ReviewCenter-ProjectAccess-Revocation
          - ReviewCenter-ProjectAccess-Revocation-Demotion
          - ReviewCenter-ProjectAccess-Revocation-Disabled
          - ReviewCenter-ProjectAccess-Revocation-RoleChange
          - ReviewCenter-ProjectAccess-Revocation-RoleChange-Audit
        tests:
          - ProjectAccess_Revocation_TakesEffectOnTheNextCall

      - id: ReviewCenter-Core-ProjectAccess-TokenOwner
        title: >-
          The Core subsystem shall treat an actor that came through a personal access token as the owner of the
          token.
        justification: |
          A token acts for its owner, so it must give neither more nor less access than the owner has.
        children:
          - ReviewCenter-ProjectAccess-TokenOwner
          - ReviewCenter-ProjectAccess-TokenOwner-NoMore

      - id: ReviewCenter-Core-ProjectAccess-Dependencies
        title: >-
          The Core subsystem shall refuse to create a service that decides on project access without the stores
          and rules that it reads.
        justification: |
          A decision made without its data would silently allow or deny, so a missing dependency must stop the
          service from being created.
        children:
          - ReviewCenter-ProjectAccess-Dependencies
          - ReviewCenter-ProjectAccess-Dependencies-ProjectStore
          - ReviewCenter-ThreadService-Access-Required
          - ReviewCenter-ChecklistService-Arguments

      - id: ReviewCenter-Core-ProjectAccess-MemberLookup
        title: >-
          The Core subsystem shall let a project administrator add an existing user only by the exact user name,
          with no way to list users.
        justification: |
          The power to add members must not become a way to browse the users of the installation.
        children:
          - ReviewCenter-ProjectService-MemberLookup
          - ReviewCenter-ProjectService-MemberLookup-PartialName
          - ReviewCenter-ProjectService-MemberLookup-NoListing
          - ReviewCenter-ProjectService-MemberLookup-UnusableName
          - ReviewCenter-ProjectService-MemberLookup-NotMemberName

      - id: ReviewCenter-Core-ProjectAccess-AddThrottle
        title: >-
          The Core subsystem shall limit the failed attempts of an actor who is not a system administrator to add
          a member.
        justification: |
          Exact-name lookups must not be usable to guess the user names of the installation, so too many failed
          attempts in a short time are refused.
        children:
          - ReviewCenter-ProjectService-AddThrottle
          - ReviewCenter-ProjectService-AddThrottle-Create
          - ReviewCenter-ProjectService-AddThrottle-CreateFailures
          - ReviewCenter-ProjectService-AddThrottle-PerActor
          - ReviewCenter-ProjectService-AddThrottle-Window
          - ReviewCenter-ProjectService-AddThrottle-Concurrent
          - ReviewCenter-ProjectService-AddThrottle-LookupError
          - ReviewCenter-ProjectService-AddThrottle-Successes
          - ReviewCenter-ProjectService-AddThrottle-SystemAdmin

      - id: ReviewCenter-Core-ProjectAccess-LastAdmin
        title: >-
          The Core subsystem shall not let a project administrator remove or demote the last enabled
          administrator of a project.
        justification: |
          A project without anybody to manage it cannot change its members any more, so the last administrator
          must stay.
        children:
          - ReviewCenter-ProjectService-LastAdmin
          - ReviewCenter-ProjectService-LastAdmin-Demote
          - ReviewCenter-ProjectService-LastAdmin-DisabledAdmin
          - ReviewCenter-ProjectService-LastAdmin-SystemAdmin
          - ReviewCenter-ProjectService-LastAdmin-SystemAdminDemote
          - ReviewCenter-ProjectService-LastAdmin-NothingChanged

      - id: ReviewCenter-Core-ProjectAccess-CreateAccount
        title: >-
          The Core subsystem shall let a project administrator and a system administrator create an account only
          together with its membership of the project.
        justification: |
          A person who is new to the installation can be brought into a project in one step, while an account
          without a project would give nobody a reason to exist.
        children:
          - ReviewCenter-ProjectService-CreateMemberAccount
          - ReviewCenter-ProjectService-CreateMemberAccount-NoSystemAdmin
          - ReviewCenter-ProjectService-CreateMemberAccount-PasswordLength
          - ReviewCenter-ProjectService-CreateMemberAccount-PasswordRandom
          - ReviewCenter-ProjectService-CreateMemberAccount-PasswordChange
          - ReviewCenter-ProjectService-CreateMemberAccount-PasswordReturned
          - ReviewCenter-ProjectService-CreateMemberAccount-PasswordHashed
          - ReviewCenter-ProjectService-CreateMemberAccount-PasswordText
          - ReviewCenter-ProjectService-CreateMemberAccount-NameTaken
          - ReviewCenter-ProjectService-CreateMemberAccount-NameInvalid
          - ReviewCenter-ProjectService-CreateMemberAccount-DisplayNameInvalid
          - ReviewCenter-ProjectService-CreateMemberAccount-NothingCreated

      - id: ReviewCenter-Core-ProjectAccess-MemberAudit
        title: >-
          The Core subsystem shall audit every change of a membership with the project.
        justification: |
          Who belongs to a project decides who sees its reviews, so every change must be traceable to an actor.
        children:
          - ReviewCenter-ProjectService-MemberAudit
          - ReviewCenter-ProjectService-MemberAudit-RoleChange
          - ReviewCenter-ProjectService-MemberAudit-Removal
          - ReviewCenter-ProjectService-MemberAudit-Account
          - ReviewCenter-ProjectService-MemberAudit-NoPassword
          - ReviewCenter-ProjectService-MemberAudit-FailedAdd
          - ReviewCenter-ProjectService-MemberAudit-FailedAccount
          - ReviewCenter-ProjectService-MemberAudit-FailedSystemAdmin

      - id: ReviewCenter-Core-ProjectAccess-AuditorRole
        title: >-
          The Core subsystem shall let the actors who manage the members assign the read-only Auditor role.
        justification: |
          An oversight role that cannot work in the project lets a person watch the review work without being
          able to change it.
        children:
          - ReviewCenter-ProjectService-AuditorRole
          - ReviewCenter-ProjectService-AuditorRole-Account
          - ReviewCenter-ProjectService-AuditorRole-ChangeRole
          - ReviewCenter-ProjectService-AuditorRole-Audit

      - id: ReviewCenter-Core-ProjectAccess-AuditorRoleBlocked
        title: >-
          The Core subsystem shall refuse the Auditor role for a member who holds an open reviewer slot, and name the
          reviews that hold the member.
        justification: |
          A member who still owes a signature or an answer must not become a person who cannot work in the project,
          because the review would wait for somebody who may no longer sign.
        children:
          - ReviewCenter-ProjectService-AuditorRole-OpenWork
          - ReviewCenter-ProjectService-AuditorRole-OutOfDate
          - ReviewCenter-ProjectService-AuditorRole-ReviewNames
        tests:
          - CoreSubsystem_AuditorRole_MemberHoldingUnsignedSlot_IsRefusedAndStaysUser

      - id: ReviewCenter-Core-ProjectAccess-SlotsAndSigning
        title: >-
          The Core subsystem shall limit reviewer slots and signing to members who work in the project.
        justification: |
          A signature is a statement of the person who did the review, so a person who may only watch (an
          auditor) must be neither offered nor allowed to sign.
        children:
          - ReviewCenter-SigningService-AuditorNotReviewer
          - ReviewCenter-SigningService-AuditorNotReviewer-Assign
          - ReviewCenter-SigningService-AuditorNotReviewer-Sign
          - ReviewCenter-SigningService-AuditorNotReviewer-NothingStored

      - id: ReviewCenter-Core-EvidenceSettings
        title: >-
          The Core subsystem shall keep evidence settings for each project, private and complete by default.
        justification: |
          Evidence is kept private unless the people who administer a project open it, and an attestation may be
          reduced only on purpose, so a project that nobody has touched shows nothing to the public and leaves
          nothing out.
        children:
          - ReviewCenter-EvidenceSettingsService-Defaults
          - ReviewCenter-EvidenceSettingsService-Defaults-Complete
          - ReviewCenter-EvidenceSettingsService-Defaults-NewProject

      - id: ReviewCenter-Core-EvidenceSettings-Describe
        title: >-
          The Core subsystem shall name every content switch of the evidence settings that is off as an omitted
          section, in the words the user sees.
        justification: |
          A reader of an attestation must be told in plain words which sections the project chose to leave out, and
          the settings must decide which sections the attestation PDFs contain.
        children:
          - ReviewCenter-EvidenceSettingsService-Describe
          - ReviewCenter-EvidenceSettingsService-Describe-Order
          - ReviewCenter-EvidenceSettingsService-Describe-Anonymous
          - ReviewCenter-EvidenceSettingsService-Describe-Changes
          - ReviewCenter-EvidenceSettingsService-Describe-ChangesOrder

      - id: ReviewCenter-Core-EvidenceSettings-Access
        title: >-
          The Core subsystem shall let only a system administrator or a project administrator of the project read
          and change the evidence settings of a project.
        justification: |
          The decision to open evidence belongs to the people who administer the project, and a revoked right must
          take effect at the next call.
        children:
          - ReviewCenter-EvidenceSettingsService-Access
          - ReviewCenter-EvidenceSettingsService-Access-Change
          - ReviewCenter-EvidenceSettingsService-Access-Rechecked
        tests:
          - EvidenceSettingsService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-EvidenceSettings-MemberRefused
        title: >-
          The Core subsystem shall tell a plain member of a project that the member may not read or change the
          evidence settings.
        justification: |
          A member sees the project, so the refusal can say what is wrong without revealing anything.
        children:
          - ReviewCenter-EvidenceSettingsService-Access-Member
        tests:
          - EvidenceSettingsService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-EvidenceSettings-OtherActors
        title: >-
          The Core subsystem shall give every other actor who asks to read or change the evidence settings of a
          project the answer for a project that does not exist.
        justification: |
          The separation of projects must not reveal which projects exist.
        children:
          - ReviewCenter-EvidenceSettingsService-Access-Hidden
        tests:
          - EvidenceSettingsService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-EvidenceSettings-RefusalChangesNothing
        title: >-
          The Core subsystem shall change no evidence settings and record no audit entry when it refuses an actor.
        justification: |
          A refused request must leave no trace in the settings or in the history of the project.
        children:
          - ReviewCenter-EvidenceSettingsService-Access-StoresNothing
          - ReviewCenter-EvidenceSettingsService-Access-RecordsNothing

      - id: ReviewCenter-Core-EvidenceSettings-Change
        title: >-
          The Core subsystem shall store a change of the evidence settings for the project that it names.
        justification: |
          The decision to open evidence or to reduce an attestation must be kept, for that project only, until the
          administrators change it again.
        children:
          - ReviewCenter-EvidenceSettingsService-Change
          - ReviewCenter-EvidenceSettingsService-Change-OtherProjects
          - ReviewCenter-EvidenceSettingsService-Change-Reported
        tests:
          - EvidenceSettingsService_SetAsync_Change_IsStoredAndAudited

      - id: ReviewCenter-Core-EvidenceSettings-Audit
        title: >-
          The Core subsystem shall record every change of the evidence settings in the audit trail with its
          changed keys.
        justification: |
          A decision that changes who can read the evidence must be traceable in the history of the project.
        children:
          - ReviewCenter-EvidenceSettingsService-Audit
          - ReviewCenter-EvidenceSettingsService-Audit-Atomic
          - ReviewCenter-EvidenceSettingsService-Audit-Actor
          - ReviewCenter-EvidenceSettingsService-Audit-Keys
          - ReviewCenter-EvidenceSettingsService-Audit-KeyValues
        tests:
          - EvidenceSettingsService_SetAsync_Change_IsStoredAndAudited

      - id: ReviewCenter-Core-EvidenceSettings-StartingPoint
        title: >-
          The Core subsystem shall report that nothing changed, and store and record nothing, when the new evidence
          settings equal the settings that the caller started from.
        justification: |
          A caller who changes nothing must not leave a record in the history of the project.
        children:
          - ReviewCenter-EvidenceSettingsService-NoChange
          - ReviewCenter-EvidenceSettingsService-NoChange-Stored
          - ReviewCenter-EvidenceSettingsService-NoChange-RecordsNothing

      - id: ReviewCenter-Core-EvidenceSettings-Conflict
        title: >-
          The Core subsystem shall refuse a change of the evidence settings that was overtaken by another change.
        justification: |
          A decision must not be lost or undone by a simultaneous change of another administrator.
        children:
          - ReviewCenter-EvidenceSettingsService-Conflict
          - ReviewCenter-EvidenceSettingsService-Conflict-StoresNothing
          - ReviewCenter-EvidenceSettingsService-Conflict-RecordsNothing
        tests:
          - EvidenceSettingsService_SetAsync_ChangedMeanwhile_IsRefusedAsRecordChanged

      - id: ReviewCenter-Core-EvidenceSettings-ActorlessRead
        title: >-
          The Core subsystem shall give the services that apply the evidence settings to a request a read that
          needs no actor.
        justification: |
          A request that comes without signing in must still be answered by the settings of the project.
        children:
          - ReviewCenter-EvidenceSettingsService-Effective
          - ReviewCenter-EvidenceSettingsService-Effective-UnknownProject
          - ReviewCenter-EvidenceSettingsService-Effective-ChangeNotFound

      - id: ReviewCenter-Core-EvidenceSettings-Arguments
        title: >-
          The Core subsystem shall refuse to create the service for the evidence settings without the store and
          the access rule that it needs.
        justification: |
          A service without its store or its access rule could not keep the settings private.
        children:
          - ReviewCenter-EvidenceSettingsService-Arguments

      - id: ReviewCenter-Core-ProjectChecklist
        title: >-
          The Core subsystem shall let every project have a checklist of its own, the built-in default checklist when
          it has none.
        justification: |
          A project decides what its reviews are answered against, and the wording is covered by every signature, so
          each project must be able to have its own wording and to fall back to a known default.
        children:
          - ReviewCenter-ProjectChecklistService-Read
          - ReviewCenter-ProjectChecklistService-Read-Hash
          - ReviewCenter-ProjectChecklistService-Read-DefaultHash
          - ReviewCenter-ProjectChecklistService-Read-Unreadable

      - id: ReviewCenter-Core-ProjectChecklist-Validation
        title: >-
          The Core subsystem shall refuse a checklist definition that does not pass a strict validation, report
          every error of it with its path, and store nothing.
        justification: |
          A checklist that is not well formed would break every review that is created from it, so the author must
          be told every error at once.
        children:
          - ReviewCenter-ProjectChecklistService-Validation
          - ReviewCenter-ProjectChecklistService-Validation-Errors
          - ReviewCenter-ProjectChecklistService-Validation-StoredForm
          - ReviewCenter-ProjectChecklistService-Validation-Check
          - ReviewCenter-ProjectChecklistService-Validation-CheckValid
          - ReviewCenter-ProjectChecklistService-Validation-CheckNothingStored

      - id: ReviewCenter-Core-ProjectChecklist-Access
        title: >-
          The Core subsystem shall return the checklist of a project to any actor who may see the project, also to
          an actor that came through an API token.
        justification: |
          Everybody who works on the project must be able to see what the reviews are answered against.
        children:
          - ReviewCenter-ProjectChecklistService-Access
          - ReviewCenter-ProjectChecklistService-Access-ReadToken
        tests:
          - ProjectChecklistService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-ProjectChecklist-HiddenFromOthers
        title: >-
          The Core subsystem shall give every actor who may not see a project, and every request for a project that
          does not exist, the answer for a project that does not exist when the actor reads, replaces, or resets
          its checklist.
        justification: |
          The separation of projects must not reveal which projects exist.
        children:
          - ReviewCenter-ProjectChecklistService-Access-HiddenReplace
          - ReviewCenter-ProjectChecklistService-Access-HiddenReset
          - ReviewCenter-ProjectChecklistService-Access-Hidden
          - ReviewCenter-ProjectChecklistService-Access-Missing
        tests:
          - ProjectChecklistService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-ProjectChecklist-AdminChange
        title: >-
          The Core subsystem shall let only a system administrator or a project administrator of the project
          replace or reset the checklist of the project.
        justification: |
          The decision belongs to those who administer the project.
        children:
          - ReviewCenter-ProjectChecklistService-Access-Change
          - ReviewCenter-ProjectChecklistService-Access-Reset
        tests:
          - ProjectChecklistService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-ProjectChecklist-AdminChange-Recheck
        title: >-
          The Core subsystem shall check the right to change the checklist of the project again at every call, so
          that a project administrator whose membership was removed is refused.
        justification: |
          A revoked right must take effect at once, also for a form that the person opened before.
        children:
          - ReviewCenter-ProjectChecklistService-Access-Revoked

      - id: ReviewCenter-Core-ProjectChecklist-MemberRefused
        title: >-
          The Core subsystem shall tell a plain member of a project, who may only read the checklist, that the
          member may not replace or reset it.
        justification: |
          A member sees the project, so the refusal can say what is wrong without revealing anything.
        children:
          - ReviewCenter-ProjectChecklistService-Access-MemberRefused
        tests:
          - ProjectChecklistService_GetAndSet_ActorKinds_AreAllowedOrRefused

      - id: ReviewCenter-Core-ProjectChecklist-NoToken
        title: >-
          The Core subsystem shall refuse to replace or reset the checklist of a project when the call comes
          through an API token.
        justification: |
          A token is meant for reading and automation, and the wording that every signature covers is changed only by
          a person who is signed in.
        children:
          - ReviewCenter-ProjectChecklistService-Access-Token
          - ReviewCenter-ProjectChecklistService-Access-TokenReset

      - id: ReviewCenter-Core-ProjectChecklist-RefusalChangesNothing
        title: >-
          The Core subsystem shall change and record nothing when it refuses a replacement or a reset of the
          checklist because of the right of the actor.
        justification: |
          A refused request must leave no trace in the checklist or in the history of the project.
        children:
          - ReviewCenter-ProjectChecklistService-Access-NothingChanged

      - id: ReviewCenter-Core-ProjectChecklist-Change
        title: >-
          The Core subsystem shall store a valid checklist definition for the project that it names.
        justification: |
          A project must keep the checklist that its administrators chose, for that project only.
        children:
          - ReviewCenter-ProjectChecklistService-Change
          - ReviewCenter-ProjectChecklistService-Change-NormalForm
          - ReviewCenter-ProjectChecklistService-Change-OtherProjects
          - ReviewCenter-ProjectChecklistService-Change-Reported
        tests:
          - ProjectChecklistService_SetAsync_Change_IsStoredAndAudited

      - id: ReviewCenter-Core-ProjectChecklist-VersionLabel
        title: >-
          The Core subsystem shall refuse a replacement of the checklist whose wording differs from the current
          definition but whose version label is the same.
        justification: |
          The wording is covered by every signature, so a change of the wording must be visible as a new version
          label.
        children:
          - ReviewCenter-ProjectChecklistService-VersionLabel
          - ReviewCenter-ProjectChecklistService-VersionLabel-Default
          - ReviewCenter-ProjectChecklistService-VersionLabel-Message
          - ReviewCenter-ProjectChecklistService-VersionLabel-NothingStored

      - id: ReviewCenter-Core-ProjectChecklist-NoChange
        title: >-
          The Core subsystem shall report that nothing was changed, and store and record nothing, when the new
          definition of the checklist has the same content as the current one.
        justification: |
          A request that changes nothing must not leave a record or a new version in the history of the project.
        children:
          - ReviewCenter-ProjectChecklistService-NoChange
          - ReviewCenter-ProjectChecklistService-NoChange-Recorded
          - ReviewCenter-ProjectChecklistService-NoChange-Reset
          - ReviewCenter-ProjectChecklistService-NoChange-ResetRecorded

      - id: ReviewCenter-Core-ProjectChecklist-Reset
        title: >-
          The Core subsystem shall, on a reset, remove the checklist of the project so that its new reviews use the
          built-in default checklist again, and leave the existing reviews as they are.
        justification: |
          An administrator who regrets a custom checklist must be able to go back to the default without touching
          the reviews that already answered the old wording.
        children:
          - ReviewCenter-ProjectChecklistService-Reset
          - ReviewCenter-ProjectChecklistService-Reset-Reported
          - ReviewCenter-ProjectChecklistService-Reset-ExistingReviews

      - id: ReviewCenter-Core-ProjectChecklist-Audit
        title: >-
          The Core subsystem shall record every replacement and every reset of the checklist in the audit trail
          without the wording.
        justification: |
          A change of what the reviews are answered against must be traceable in the history of the project, while
          the wording itself stays out of the audit trail.
        children:
          - ReviewCenter-ProjectChecklistService-Audit
          - ReviewCenter-ProjectChecklistService-Audit-ResetActor
          - ReviewCenter-ProjectChecklistService-Audit-Reset
          - ReviewCenter-ProjectChecklistService-Audit-Project
          - ReviewCenter-ProjectChecklistService-Audit-Actor
          - ReviewCenter-ProjectChecklistService-Audit-Detail
          - ReviewCenter-ProjectChecklistService-Audit-ResetDetail
          - ReviewCenter-ProjectChecklistService-Audit-NoWording
          - ReviewCenter-ProjectChecklistService-Audit-Length
        tests:
          - ProjectChecklistService_SetAsync_Change_IsStoredAndAudited

      - id: ReviewCenter-Core-ProjectChecklist-Conflict
        title: >-
          The Core subsystem shall refuse a change of the checklist that was overtaken by another change.
        justification: |
          A decision must not be lost or undone by a simultaneous change, so a change is made only from the
          definition that the caller started from.
        children:
          - ReviewCenter-ProjectChecklistService-Conflict
          - ReviewCenter-ProjectChecklistService-Conflict-Reset
          - ReviewCenter-ProjectChecklistService-Conflict-Message
          - ReviewCenter-ProjectChecklistService-Conflict-NothingStored
        tests:
          - ProjectChecklistService_SetAndReset_ChangedMeanwhile_AreRefusedAsRecordChanged

      - id: ReviewCenter-Core-ProjectChecklist-Arguments
        title: >-
          The Core subsystem shall refuse to create the service for the checklist of a project without the store
          and the access rule that it needs, and to change the checklist without an actor or an expected hash.
        justification: |
          A service without its store or its access rule could not protect the checklist, and a change without an
          actor could not be traced.
        children:
          - ReviewCenter-ProjectChecklistService-Arguments
          - ReviewCenter-ProjectChecklistService-Arguments-Actor
          - ReviewCenter-ProjectChecklistService-Arguments-ExpectedHash

      - id: ReviewCenter-Core-ProjectChecklist-ValidationRules
        title: >-
          The Core subsystem shall accept a checklist definition that follows every rule of a checklist definition
          and return the parsed definition.
        justification: |
          The rules of a definition keep every review that is created from it well formed.
        children:
          - ReviewCenter-ChecklistService-Validation
          - ReviewCenter-ChecklistService-Validation-Size-AtLimit
          - ReviewCenter-ChecklistService-Validation-SectionCount-AtLimit
          - ReviewCenter-ChecklistService-Validation-ItemCount-AtLimit
          - ReviewCenter-ChecklistService-Validation-IdUnique-CaseInsensitive
          - ReviewCenter-ChecklistService-Validation-IdUnique-LaterUse
          - ReviewCenter-ChecklistService-Validation-Hint-Length
          - ReviewCenter-ChecklistService-Validation-Hint-TooLong
          - ReviewCenter-ChecklistService-Validation-EmptyText
          - ReviewCenter-ChecklistService-Validation-NotJson
          - ReviewCenter-ChecklistService-Validation-Size
          - ReviewCenter-ChecklistService-Validation-Version
          - ReviewCenter-ChecklistService-Validation-Sections
          - ReviewCenter-ChecklistService-Validation-SectionCount
          - ReviewCenter-ChecklistService-Validation-ItemCount
          - ReviewCenter-ChecklistService-Validation-EmptySection
          - ReviewCenter-ChecklistService-Validation-IdForm
          - ReviewCenter-ChecklistService-Validation-IdLength
          - ReviewCenter-ChecklistService-Validation-IdUnique
          - ReviewCenter-ChecklistService-Validation-Titles
          - ReviewCenter-ChecklistService-Validation-Wording
          - ReviewCenter-ChecklistService-Validation-Hint
          - ReviewCenter-ChecklistService-Validation-NullEntries
          - ReviewCenter-ChecklistService-Validation-AllErrors
          - ReviewCenter-ChecklistService-Validation-ErrorPath
          - ReviewCenter-ChecklistService-Validation-CanonicalPath
          - ReviewCenter-ChecklistService-Validation-MemberNames
          - ReviewCenter-ChecklistService-Validation-ParseOrThrow
          - ReviewCenter-ChecklistService-Validation-ErrorText

      - id: ReviewCenter-Core-Reviews
        title: >-
          The Core subsystem shall create a draft review in a project from a set of uploaded files.
        justification: |
          A review is a fixed snapshot of the files to be reviewed. It starts as a draft in the project that the
          files were uploaded to, so that reviewers can later work on exactly that snapshot.
        children:
          - ReviewCenter-ReviewService-Draft
          - ReviewCenter-ReviewService-Draft-CreatedAt
          - ReviewCenter-ReviewService-Draft-Title
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Reviews-Files
        title: >-
          The Core subsystem shall keep every uploaded file of a review byte for byte with its size and SHA-256
          hash.
        justification: |
          Keeping the exact bytes is what lets a reviewer trust that the content seen is the content that was
          submitted, including binary files and files with Windows line endings.
        children:
          - ReviewCenter-ReviewService-Draft-Content
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Reviews-ReadBack
        title: >-
          The Core subsystem shall read a review, the list of the reviews of a project, and the content of a file of
          a review back unchanged.
        justification: |
          Showing the stored review again exactly as it was submitted is the other half of the snapshot: without
          it a reviewer could not check what the other reviewers saw.
        children:
          - ReviewCenter-ReviewService-Read
          - ReviewCenter-ReviewService-Read-List
          - ReviewCenter-ReviewService-Read-Content
          - ReviewCenter-ReviewService-Read-NotFound
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Fingerprint
        title: >-
          The Core subsystem shall give every review a content fingerprint that is calculated from the bytes of
          its files exactly as ReviewMark calculates it.
        justification: |
          The fingerprint identifies the exact content under review and later allows a review to be matched to
          the evidence ReviewMark produces for the same files. Only the same algorithm gives the same value, so
          a deviation would silently break that match.
        children:
          - ReviewCenter-Fingerprint-FileHash
          - ReviewCenter-Fingerprint-FileHash-LineEndings
          - ReviewCenter-Fingerprint-FileHash-Verbatim
          - ReviewCenter-Fingerprint-SetHash
          - ReviewCenter-Fingerprint-SetHash-FromContents
          - ReviewCenter-Fingerprint-Duplicates
          - ReviewCenter-ReviewService-Fingerprint
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Fingerprint-NameOrderIndependent
        title: >-
          The Core subsystem shall give the same content fingerprint to the same file contents regardless of file
          names and order.
        justification: |
          The same snapshot may be uploaded again under other paths or in another order. The fingerprint must
          still match, because it identifies the content and not the way the content was packed.
        children:
          - ReviewCenter-Fingerprint-SetHash-Order
          - ReviewCenter-ReviewService-Fingerprint-Independent
        tests:
          - CoreSubsystem_Fingerprint_SameContentOtherNamesAndOrder_GivesSameFingerprint

      - id: ReviewCenter-Core-Fingerprint-Arguments
        title: >-
          The Core subsystem shall refuse to calculate a content fingerprint from a missing set of per-file hashes
          or a missing set of file contents.
        justification: |
          A fingerprint of nothing would look like a valid value and could be matched to evidence by mistake, so
          a missing input must be refused instead.
        children:
          - ReviewCenter-Fingerprint-SetHash-Arguments

      - id: ReviewCenter-Core-Rules
        title: >-
          The Core subsystem shall report each violation of a project, review identity, upload, or thread input
          rule as a domain rule exception that names the rule.
        justification: |
          Rules that protect the integrity of the review record must hold no matter which user interface or
          store is used. Naming the violated rule lets a caller tell the user what to correct.
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-Rules-Project
        title: >-
          The Core subsystem shall enforce the rules for the name and the description of a project.
        justification: |
          A project that is created with a blank or oversized name or description would be unusable in lists and
          in the audit trail, so the limits must hold for every caller.
        children:
          - ReviewCenter-ProjectService-Validation
          - ReviewCenter-ProjectService-Validation-NameLength
          - ReviewCenter-ProjectService-Validation-NameLimit
          - ReviewCenter-ProjectService-Validation-DescriptionLength

      - id: ReviewCenter-Core-Rules-ReviewIdentity
        title: >-
          The Core subsystem shall enforce the rules for the identifier and the title of a review.
        justification: |
          The identifier names a review in addresses and in evidence files, so its form and its uniqueness within
          the project must be fixed. The title is what people see in lists, so it must not be blank.
        children:
          - ReviewCenter-ReviewService-Id
          - ReviewCenter-ReviewService-Id-Unique
          - ReviewCenter-ReviewService-Id-OtherProject
          - ReviewCenter-ReviewService-Title
          - ReviewCenter-ReviewService-Title-Length

      - id: ReviewCenter-Core-Rules-ReviewProject
        title: >-
          The Core subsystem shall refuse a review for a project that does not exist or that the actor may not
          see, with the same rule.
        justification: |
          Using the same rule for a missing project and a hidden project keeps a caller from learning that a
          project exists when the caller may not see it.
        children:
          - ReviewCenter-ReviewService-Project
          - ReviewCenter-ReviewService-Project-Hidden

      - id: ReviewCenter-Core-Rules-Upload
        title: >-
          The Core subsystem shall enforce the rules for the paths, the number, and the sizes of the files of an
          uploaded review.
        justification: |
          A review without files, with ambiguous paths, or with unbounded content cannot be reviewed or stored
          safely, so the limits must hold no matter how the files were sent.
        children:
          - ReviewCenter-ReviewService-Files
          - ReviewCenter-ReviewService-Files-BlankPath
          - ReviewCenter-ReviewService-Files-PathLength
          - ReviewCenter-ReviewService-Files-DuplicatePath
          - ReviewCenter-ReviewService-Files-PathCase
          - ReviewCenter-ReviewService-Limits
          - ReviewCenter-ReviewService-Limits-AtLimit
          - ReviewCenter-ReviewService-Limits-FileCount
          - ReviewCenter-ReviewService-Limits-TotalSize

      - id: ReviewCenter-Core-Rules-ThreadAnchor
        title: >-
          The Core subsystem shall enforce the rules for the file and the line range that a thread is anchored to.
        justification: |
          A thread whose anchor points to nothing, or to lines that do not exist, could not be shown next to the
          content it discusses.
        children:
          - ReviewCenter-ThreadService-Anchor
          - ReviewCenter-ThreadService-Anchor-UnknownReview
          - ReviewCenter-ThreadService-Anchor-HalfRange
          - ReviewCenter-ThreadService-Anchor-StartBelowOne
          - ReviewCenter-ThreadService-Anchor-EndBeforeStart
          - ReviewCenter-ThreadService-Anchor-EndBeyondFile
          - ReviewCenter-ThreadService-Anchor-BinaryOrEmptyRange
          - ReviewCenter-ThreadService-Anchor-WholeFile
          - ReviewCenter-ThreadService-Anchor-LastLine
          - ReviewCenter-ThreadService-Anchor-LineEndings
          - ReviewCenter-ThreadService-Anchor-FinalLineEnding

      - id: ReviewCenter-Core-Rules-CommentText
        title: >-
          The Core subsystem shall enforce the rules for the text of a new thread or of a reply.
        justification: |
          Empty and unbounded comments make a discussion unreadable and unbounded in size, so the text must be
          checked and stored in one normal form.
        children:
          - ReviewCenter-ThreadService-Comment-Blank
          - ReviewCenter-ThreadService-Comment-TooLong
          - ReviewCenter-ThreadService-Comment-LongestAccepted
          - ReviewCenter-ThreadService-Comment-Trimmed

      - id: ReviewCenter-Core-Rules-NoStorage
        title: >-
          The Core subsystem shall store nothing when it refuses a project, a review, or a comment because of a
          rule violation.
        justification: |
          Storing nothing on a violation keeps the record free of partial projects, partial reviews, and
          half-posted comments.
        children:
          - ReviewCenter-ProjectService-Validation-NothingStored
          - ReviewCenter-ThreadService-Comment-NothingStored
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-Threads
        title: >-
          The Core subsystem shall start comment threads on a file of a review, anchored to the whole file or a
          line range.
        justification: |
          Review comments are the purpose of a review. A comment is only useful when it points to the content it
          discusses, so a thread must be anchored to a file, or to a range of lines in it.
        children:
          - ReviewCenter-ThreadService-Start
          - ReviewCenter-ThreadService-Start-WholeFile
          - ReviewCenter-ThreadService-Start-LineRange
          - ReviewCenter-ThreadService-Start-FirstComment
          - ReviewCenter-ThreadService-Start-Created
        tests:
          - CoreSubsystem_ThreadWorkflow_StartReplyResolveReopen_ReadsBackInOrder

      - id: ReviewCenter-Core-Threads-Author
        title: >-
          The Core subsystem shall take the author of a thread or a reply as the signed-in actor and store the user
          name and the display name of the actor with the comment.
        justification: |
          A comment that a user could post in the name of another user would make the discussion untrustworthy.
        children:
          - ReviewCenter-ThreadService-Comment

      - id: ReviewCenter-Core-Threads-Reply
        title: >-
          The Core subsystem shall let any contributor reply to a thread of a review in posting order without
          changing the state of the thread.
        justification: |
          A discussion grows by replies, and a reply must not reopen or resolve a thread by itself.
        children:
          - ReviewCenter-ThreadService-Reply
          - ReviewCenter-ThreadService-Reply-Created
          - ReviewCenter-ThreadService-Reply-Order
          - ReviewCenter-ThreadService-Reply-StateUnchanged
        tests:
          - CoreSubsystem_ThreadWorkflow_StartReplyResolveReopen_ReadsBackInOrder

      - id: ReviewCenter-Core-Threads-ReplyNotFound
        title: >-
          The Core subsystem shall refuse a reply to a thread that does not exist in the review, with the
          ThreadNotFound rule.
        justification: |
          A reply must never be attached to a thread of another review, which would show it to the wrong readers.
        children:
          - ReviewCenter-ThreadService-Reply-ThreadNotFound
          - ReviewCenter-ThreadService-Reply-OtherReview

      - id: ReviewCenter-Core-Threads-ResolveReopen
        title: >-
          The Core subsystem shall resolve and reopen threads of a review, treating a repeated resolve or reopen as
          harmless.
        justification: |
          The state of a thread tells the team which discussions are finished. Repeating an action that is already
          done must not fail or change anything.
        children:
          - ReviewCenter-ThreadService-State
          - ReviewCenter-ThreadService-State-Reopen
          - ReviewCenter-ThreadService-State-ResolveRepeated
          - ReviewCenter-ThreadService-State-ReopenRepeated
        tests:
          - CoreSubsystem_ThreadWorkflow_StartReplyResolveReopen_ReadsBackInOrder

      - id: ReviewCenter-Core-Threads-StateNotFound
        title: >-
          The Core subsystem shall refuse to resolve or reopen a thread that does not exist in the review, with the
          ThreadNotFound rule.
        justification: |
          A change of state must never reach a thread of another review.
        children:
          - ReviewCenter-ThreadService-State-ThreadNotFound
          - ReviewCenter-ThreadService-State-OtherReview

      - id: ReviewCenter-Core-Threads-NoEdit
        title: >-
          The Core subsystem shall never change or remove a posted comment, when a reply is appended or when a
          thread is resolved or reopened.
        justification: |
          Keeping posted comments unchanged makes the discussion a reliable record of what was said.
        children:
          - ReviewCenter-ThreadService-Reply-EarlierUnchanged
          - ReviewCenter-ThreadService-State-CommentsKept

      - id: ReviewCenter-Core-Threads-ReadBack
        title: >-
          The Core subsystem shall read the threads of a review back with their comments, both in creation order.
        justification: |
          The order of the comments is part of what was said, and a stable order of the threads lets readers find
          the same thread again.
        children:
          - ReviewCenter-ThreadService-Read
          - ReviewCenter-ThreadService-Read-ThreadOrder
          - ReviewCenter-ThreadService-Read-CommentOrder
          - ReviewCenter-ThreadService-Read-Empty
        tests:
          - CoreSubsystem_ThreadWorkflow_StartReplyResolveReopen_ReadsBackInOrder

      - id: ReviewCenter-Core-Threads-Activity
        title: >-
          The Core subsystem shall give the last activity of a thread as the time of its latest comment.
        justification: |
          Readers want to know which discussions are alive, and the latest comment is the only activity that is
          kept for a thread.
        children:
          - ReviewCenter-ThreadService-Index

      - id: ReviewCenter-Core-Threads-Index
        title: >-
          The Core subsystem shall give an index of the threads of a review by state, with the thread of the newest
          activity first.
        justification: |
          The index is the entry to the discussions of a review. It must not change the threads that it is given.
        children:
          - ReviewCenter-ThreadService-Index-All
          - ReviewCenter-ThreadService-Index-StateFilter
          - ReviewCenter-ThreadService-Index-Order
          - ReviewCenter-ThreadService-Index-InputUnchanged

      - id: ReviewCenter-Core-Threads-NextStep
        title: >-
          The Core subsystem shall give, for the threads and the checklist of a review, one short sentence that names
          the next step.
        justification: |
          A reader who opens a review wants to know what is left to do, without counting threads and checks.
        children:
          - ReviewCenter-ThreadService-NextStep
          - ReviewCenter-ThreadService-NextStep-StartDiscussion
          - ReviewCenter-ThreadService-NextStep-AllResolved
          - ReviewCenter-ThreadService-NextStep-Unanswered
          - ReviewCenter-ThreadService-NextStep-Disputed
          - ReviewCenter-ThreadService-NextStep-Failed
          - ReviewCenter-ThreadService-NextStep-FailNotBlocking
          - ReviewCenter-ThreadService-NextStep-ChecklistComplete
          - ReviewCenter-ThreadService-NextStep-Combined
          - ReviewCenter-ThreadService-NextStep-Order
          - ReviewCenter-ThreadService-NextStep-Conclusion
          - ReviewCenter-ThreadService-NextStep-ExplicitUnanswered
          - ReviewCenter-ThreadService-NextStep-DisputedOnce

      - id: ReviewCenter-Core-Threads-IncludedComment
        title: >-
          The Core subsystem shall let the starting comment of a thread and a reply be included in the report, and
          store the flag with the comment.
        justification: |
          Only the comments that the team chooses go to the report, so the choice must be stored with each comment.
        children:
          - ReviewCenter-ThreadService-IncludedComment
          - ReviewCenter-ThreadService-IncludedComment-Reply

      - id: ReviewCenter-Core-Threads-Chat
        title: >-
          The Core subsystem shall treat a comment that is not included in the report as chat.
        justification: |
          Everyday talk in a thread must not reach the report unless somebody decides that it belongs there.
        children:
          - ReviewCenter-ThreadService-IncludedComment-Chat

      - id: ReviewCenter-Core-Threads-Kind
        title: >-
          The Core subsystem shall derive the kind of a thread, Finding or Question, from whether its starting
          comment is included in the report, and list the kind of every thread.
        justification: |
          A Finding is a point that the report must settle, and a Question is not, so the kind decides which rules
          apply to the thread.
        children:
          - ReviewCenter-ThreadService-IncludedComment-Finding
          - ReviewCenter-ThreadService-IncludedComment-Question
          - ReviewCenter-ThreadService-IncludedComment-List-Kind

      - id: ReviewCenter-Core-Threads-IncludedList
        title: >-
          The Core subsystem shall list for every comment of a thread whether it is included in the report.
        justification: |
          A reader must be able to see which comments the report will contain before the report is made.
        children:
          - ReviewCenter-ThreadService-IncludedComment-List

      - id: ReviewCenter-Core-Threads-ResolutionNote
        title: >-
          The Core subsystem shall refuse, with the ResolutionNoteRequired rule, to resolve a Finding without a
          resolution note, and store nothing.
        justification: |
          A Finding that is closed without saying why leaves the report without the answer that it needs.
        children:
          - ReviewCenter-ThreadService-ResolutionNote
          - ReviewCenter-ThreadService-ResolutionNote-Blank
          - ReviewCenter-ThreadService-ResolutionNote-NothingStored

      - id: ReviewCenter-Core-Threads-ResolutionNoteTooLong
        title: >-
          The Core subsystem shall refuse a resolution note of more than 4000 characters and leave the thread open.
        justification: |
          A resolution note is a comment, and it is bound by the same limit as every other comment.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-TooLong
          - ReviewCenter-ThreadService-ResolutionNote-TooLong-StaysOpen

      - id: ReviewCenter-Core-Threads-ResolutionNoteQuestion
        title: >-
          The Core subsystem shall accept resolving a Question without a resolution note.
        justification: |
          A Question is not part of the report, so closing it needs no explanation.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-Question
          - ReviewCenter-ThreadService-ResolutionNote-BlankNoteIgnored

      - id: ReviewCenter-Core-Threads-ResolutionNoteStored
        title: >-
          The Core subsystem shall store the trimmed resolution note of a resolved thread as a Resolution comment,
          together with the new state of the thread.
        justification: |
          The note and the new state must be stored together so that a thread never shows as resolved without its
          explanation.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-NoteStored
          - ReviewCenter-ThreadService-ResolutionNote-NoteWithState
          - ReviewCenter-ThreadService-ResolutionNote-NoteTrimmed

      - id: ReviewCenter-Core-Threads-ResolutionNoteReport
        title: >-
          The Core subsystem shall include the Resolution comment of a Finding in the report and not include that
          of a Question.
        justification: |
          The report needs the answer to each Finding and must not carry the notes on questions that were only
          discussed.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-FindingNoteIncluded
          - ReviewCenter-ThreadService-ResolutionNote-QuestionNoteExcluded

      - id: ReviewCenter-Core-Threads-ResolutionNoteRepeated
        title: >-
          The Core subsystem shall treat resolving a thread that is already resolved as harmless, adding no comment
          and recording nothing in the audit trail.
        justification: |
          A repeated resolve, for example from a second browser window, must not add noise to the thread or to the
          audit trail.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-AlreadyResolved
          - ReviewCenter-ThreadService-ResolutionNote-AlreadyResolved-NoAudit

      - id: ReviewCenter-Core-Threads-ResolutionNoteReopen
        title: >-
          The Core subsystem shall keep the earlier Resolution comments when a thread is reopened, and add a second
          one when a reopened Finding is resolved again.
        justification: |
          The history of a thread shows how often a point was settled and reopened.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-ReopenKeepsNotes
          - ReviewCenter-ThreadService-ResolutionNote-ResolveAgain

      - id: ReviewCenter-Core-Threads-ResolutionNoteRecordChanged
        title: >-
          The Core subsystem shall refuse, with the RecordChanged rule and without storing anything, to resolve a
          thread that was promoted or demoted in the meantime.
        justification: |
          The kind of the thread decides whether a note is needed, so a caller who decided on an old kind must see
          the change first.
        children:
          - ReviewCenter-ThreadService-ResolutionNote-RecordChanged
          - ReviewCenter-ThreadService-ResolutionNote-RecordChangedNothingStored

      - id: ReviewCenter-Core-Threads-Promotion
        title: >-
          The Core subsystem shall let the starter of a thread and the owner of a reviewer slot, primary or
          alternate and also with an API token, promote a Question to a Finding.
        justification: |
          The people who know the question best decide that it needs an answer in the report.
        children:
          - ReviewCenter-ThreadService-Promote
          - ReviewCenter-ThreadService-Promote-AlternateSlotOwner
          - ReviewCenter-ThreadService-Promote-SlotOwnerApiToken

      - id: ReviewCenter-Core-Threads-PromotionLead
        title: >-
          The Core subsystem shall treat the creator of a review who may contribute, a project administrator, and a
          system administrator as the lead of the review, for promoting and demoting threads.
        justification: |
          The lead is responsible for the report and must be able to correct the kind of any thread, and a user who
          is not one of these is not a lead.
        children:
          - ReviewCenter-ThreadService-Promote-Lead
          - ReviewCenter-ThreadService-Promote-LeadCreatorCase
          - ReviewCenter-ThreadService-Promote-NotLead
          - ReviewCenter-ThreadService-Promote-NoCreatorLead

      - id: ReviewCenter-Core-Threads-PromotionRefused
        title: >-
          The Core subsystem shall refuse, with the ActorNotAllowed rule, to promote or demote a thread for an actor
          who is not allowed to.
        justification: |
          The kind of a thread decides what the report must settle, so a user without a stake in the review must not
          change it, and an API token must not give a lead more rights than a person has.
        children:
          - ReviewCenter-ThreadService-Promote-NotSlotOwner
          - ReviewCenter-ThreadService-Promote-Refused
          - ReviewCenter-ThreadService-Promote-LeadNotApiToken
          - ReviewCenter-ThreadService-Promote-CreatorMadeAuditor
          - ReviewCenter-ThreadService-Promote-Auditor
          - ReviewCenter-ThreadService-Promote-DemoteSlotOwnerRefused

      - id: ReviewCenter-Core-Threads-PromotionReport
        title: >-
          The Core subsystem shall include the Resolution comments of a promoted thread in the report together with
          its starting comment.
        justification: |
          A promoted thread is a Finding, and the report must show how it was settled.
        children:
          - ReviewCenter-ThreadService-Promote-ResolutionIncluded

      - id: ReviewCenter-Core-Threads-PromotionResolved
        title: >-
          The Core subsystem shall refuse, with the ResolutionNoteRequired rule, to promote a resolved Question that
          has no resolution note.
        justification: |
          A resolved Finding must carry its note, so a resolved Question that becomes a Finding needs one too.
        children:
          - ReviewCenter-ThreadService-Promote-ResolvedNeedsNote

      - id: ReviewCenter-Core-Threads-Demotion
        title: >-
          The Core subsystem shall let the starter of a thread and a lead demote a Finding to a Question, excluding
          its Resolution comments from the report and keeping the flags of its replies.
        justification: |
          A point that turned out to be only a question must leave the report without losing the choices that were
          made for its replies.
        children:
          - ReviewCenter-ThreadService-Promote-Demote
          - ReviewCenter-ThreadService-Promote-DemoteResolutionExcluded
          - ReviewCenter-ThreadService-Promote-DemoteReplyFlagsKept

      - id: ReviewCenter-Core-Threads-PromotionRepeated
        title: >-
          The Core subsystem shall treat promoting a Finding and demoting a Question as harmless.
        justification: |
          A repeated action, for example from a second browser window, must not fail or add noise.
        children:
          - ReviewCenter-ThreadService-Promote-AlreadyFinding
          - ReviewCenter-ThreadService-Promote-AlreadyQuestion

      - id: ReviewCenter-Core-Threads-CommentToggle
        title: >-
          The Core subsystem shall let the author of a reply, and a lead, include the reply in the report or take it
          out again, treating the value that the reply already has as harmless.
        justification: |
          Not every reply belongs in the report, and the people who wrote or lead the review decide which do.
        children:
          - ReviewCenter-ThreadService-CommentToggle
          - ReviewCenter-ThreadService-CommentToggle-Lead
          - ReviewCenter-ThreadService-CommentToggle-SameValue

      - id: ReviewCenter-Core-Threads-CommentToggleRefused
        title: >-
          The Core subsystem shall refuse, with the ActorNotAllowed rule, to change whether a reply is included in
          the report for an actor who is neither its author nor a lead, and for a lead with an API token.
        justification: |
          The content of the report must not be changed by users without a stake in it.
        children:
          - ReviewCenter-ThreadService-CommentToggle-Refused
          - ReviewCenter-ThreadService-CommentToggle-LeadNotApiToken

      - id: ReviewCenter-Core-Threads-CommentToggleTarget
        title: >-
          The Core subsystem shall refuse to change whether the starting comment or a Resolution comment is
          included in the report, and report a comment that is not in the thread as not found.
        justification: |
          The starting comment and the Resolution comments follow the kind of the thread, and cannot be chosen one by
          one.
        children:
          - ReviewCenter-ThreadService-CommentToggle-StartingOrResolution
          - ReviewCenter-ThreadService-CommentToggle-UnknownComment

      - id: ReviewCenter-Core-Threads-CheckThreads
        title: >-
          The Core subsystem shall store a thread that is anchored to a check of the frozen checklist of the review.
        justification: |
          A discussion about a check of the checklist has no file or lines, and it must stay with that check.
        children:
          - ReviewCenter-ThreadService-CheckThreads

      - id: ReviewCenter-Core-Threads-CheckThreadsRefused
        title: >-
          The Core subsystem shall refuse, and store nothing for, a check thread whose anchor is mixed, has lines or a
          Baseline side, has no check identifier, or names a check that the review does not have.
        justification: |
          An anchor that does not point to exactly one check could not be shown at that check, and the review must
          not keep it.
        children:
          - ReviewCenter-ThreadService-CheckThreads-MixedAnchor
          - ReviewCenter-ThreadService-CheckThreads-Lines
          - ReviewCenter-ThreadService-CheckThreads-BaselineSide
          - ReviewCenter-ThreadService-CheckThreads-EmptyCheck
          - ReviewCenter-ThreadService-CheckThreads-NoChecklist
          - ReviewCenter-ThreadService-CheckThreads-UnknownCheck
          - ReviewCenter-ThreadService-CheckThreads-NothingStored

      - id: ReviewCenter-Core-Threads-CheckThreadsLifecycle
        title: >-
          The Core subsystem shall let a check thread be replied to, resolved with the resolution-note rule of its
          kind, and reopened like any other thread.
        justification: |
          A check thread is a discussion like any other, so people can work with it in the same way.
        children:
          - ReviewCenter-ThreadService-CheckThreads-Reply
          - ReviewCenter-ThreadService-CheckThreads-Resolve
          - ReviewCenter-ThreadService-CheckThreads-Reopen

      - id: ReviewCenter-Core-Threads-CheckThreadStart
        title: >-
          The Core subsystem shall allow a system administrator, a project administrator, the creator or lead of the
          review, and a reviewer who holds a slot of a submitted or sole-reviewer review to start a check thread.
        justification: |
          The people who take part in the review need to discuss its checks.
        children:
          - ReviewCenter-ThreadService-CheckThreadStart
          - ReviewCenter-ThreadService-CheckThreadStart-SubmittedReviewer
          - ReviewCenter-ThreadService-CheckThreadStart-SoleReviewer

      - id: ReviewCenter-Core-Threads-CheckThreadStartRefused
        title: >-
          The Core subsystem shall refuse, with the ActorNotAllowed rule, to let a reviewer of a draft review, an
          auditor, and other users start a check thread.
        justification: |
          Users without a part in the review, and reviewers before the review is submitted, must not add to its
          discussion.
        children:
          - ReviewCenter-ThreadService-CheckThreadStart-DraftReviewer
          - ReviewCenter-ThreadService-CheckThreadStart-Refused

      - id: ReviewCenter-Core-Threads-CheckThreadStartLocked
        title: >-
          The Core subsystem shall refuse, with the ReviewLocked rule, to start a check thread in a concluded review.
        justification: |
          A concluded review is a closed record and must not receive new discussions.
        children:
          - ReviewCenter-ThreadService-CheckThreadStart-Locked

      - id: ReviewCenter-Core-Threads-CheckThreadStartAcknowledge
        title: >-
          The Core subsystem shall refuse, with the SignaturesWouldBecomeOutOfDate rule, to start a check thread that
          is included in the report without an acknowledgement.
        justification: |
          A new included thread changes the content that signatures were given for, so the caller must confirm it.
        children:
          - ReviewCenter-ThreadService-CheckThreadStart-Acknowledgement

      - id: ReviewCenter-Core-Threads-CheckThreadStartChat
        title: >-
          The Core subsystem shall start a check thread that is not included in the report without an
          acknowledgement and keep a current signature current.
        justification: |
          Chat does not change the content that signatures were given for, so it must not cost a signature.
        children:
          - ReviewCenter-ThreadService-CheckThreadStart-ChatNoAcknowledgement
          - ReviewCenter-ThreadService-CheckThreadStart-ChatKeepsSignature

      - id: ReviewCenter-Core-Threads-Capabilities
        title: >-
          The Core subsystem shall tell a viewer, with the same rules that the thread actions enforce, which actions
          are allowed for a thread.
        justification: |
          A user interface that offers an action that is then refused, or hides an action that is allowed, would
          mislead users, so both must follow the same rules.
        children:
          - ReviewCenter-ThreadService-Capabilities
          - ReviewCenter-ThreadService-Capabilities-Demote
          - ReviewCenter-ThreadService-Capabilities-ResolvedQuestion
          - ReviewCenter-ThreadService-Capabilities-Resolve
          - ReviewCenter-ThreadService-Capabilities-UnknownThread
          - ReviewCenter-ThreadService-Capabilities-ToggleReply
          - ReviewCenter-ThreadService-Capabilities-StartingComment

      - id: ReviewCenter-Core-Threads-CapabilitiesLimited
        title: >-
          The Core subsystem shall tell an auditor, a user outside the project, a viewer of a concluded review, and
          a lead with an API token that the actions that they may not do are not allowed.
        justification: |
          The limits of an actor apply to the capabilities exactly as they apply to the actions.
        children:
          - ReviewCenter-ThreadService-Capabilities-Auditor
          - ReviewCenter-ThreadService-Capabilities-Concluded
          - ReviewCenter-ThreadService-Capabilities-ApiToken
          - ReviewCenter-ThreadService-Capabilities-ApiTokenNotLead

      - id: ReviewCenter-Core-Threads-CapabilitiesEquality
        title: >-
          The Core subsystem shall compare the capabilities of a viewer for the threads of a review by value.
        justification: |
          A page that is built again must be able to tell whether anything changed for the viewer.
        children:
          - ReviewCenter-ThreadService-Capabilities-Equality

      - id: ReviewCenter-Core-Threads-Counts
        title: >-
          The Core subsystem shall count the threads of a review by kind and by state, and refuse a missing list of
          threads.
        justification: |
          The counts show how much discussion is open and what kind it is.
        children:
          - ReviewCenter-ThreadService-Capabilities-Counts
          - ReviewCenter-ThreadService-Capabilities-CountsArguments

      - id: ReviewCenter-Core-Threads-CountsPhrase
        title: >-
          The Core subsystem shall describe the open threads by naming the count of each kind, in the singular or the
          plural as needed.
        justification: |
          A phrase that reads "1 open threads" looks careless, and users must be able to read the status at a glance.
        children:
          - ReviewCenter-ThreadService-Capabilities-CountsPhrase
          - ReviewCenter-ThreadService-Capabilities-CountsPhrase-ZeroOneMany

      - id: ReviewCenter-Core-Threads-CheckThreadDigest
        title: >-
          The Core subsystem shall write a thread about a check into the canonical text of a review with the
          identifier of the check in place of a file anchor, leaving out chat.
        justification: |
          The digest of the review must cover the discussions about checks as well, and must stay the same for a
          review that has none.
        children:
          - ReviewCenter-RecordDigest-CheckThread
          - ReviewCenter-RecordDigest-CheckThread-Comments
          - ReviewCenter-RecordDigest-CheckThread-Chat
          - ReviewCenter-RecordDigest-CheckThread-Sorted
          - ReviewCenter-RecordDigest-CheckThread-FileUnchanged

      - id: ReviewCenter-Core-Diff
        title: >-
          The Core subsystem shall give the line differences between the baseline and the head content of a modified
          file of a review, from the content frozen with the review.
        justification: |
          A change is reviewed by looking at what was removed and what was added. The comparison must not depend on
          the repository still being reachable, so it is made from the content that was stored with the review.
        children:
          - ReviewCenter-ReviewService-Diff
          - ReviewCenter-ReviewService-Diff-Added
          - ReviewCenter-ReviewService-Diff-Deleted
          - ReviewCenter-ReviewService-Diff-LineEndings
        tests:
          - ReviewService_GetDiffAsync_ModifiedAddedDeleted_ComparesFrozenContentWithoutGit

      - id: ReviewCenter-Core-Diff-Compute
        title: >-
          The Core subsystem shall compute the rows of a shortest edit script for a baseline and a head list of
          lines, showing the removed rows of a change before its added rows.
        justification: |
          A shortest script shows the fewest changes that explain the difference, and showing the old line above the
          new line is the order that reviewers read a replaced line in.
        children:
          - ReviewCenter-LineDiff-Compute
          - ReviewCenter-LineDiff-Compute-Reconstruct
          - ReviewCenter-LineDiff-Compute-Equal
          - ReviewCenter-LineDiff-Compute-EmptyBaseline
          - ReviewCenter-LineDiff-Compute-EmptyHead
          - ReviewCenter-LineDiff-Compute-Counts
          - ReviewCenter-LineDiff-Order

      - id: ReviewCenter-Core-Diff-Numbering
        title: >-
          The Core subsystem shall number the rows of each side of a comparison from 1 without gaps, as the line
          numbers of a file are counted for threads.
        justification: |
          A comment on a line is anchored by its line number, so the numbers shown in a comparison must be the ones
          that the thread rules count, whatever the line endings are.
        children:
          - ReviewCenter-LineDiff-Numbering
          - ReviewCenter-LineDiff-Numbering-Context
          - ReviewCenter-LineDiff-Numbering-Removed
          - ReviewCenter-LineDiff-Numbering-Added
          - ReviewCenter-LineDiff-Numbering-SplitLines
          - ReviewCenter-LineDiff-Numbering-LineEndings
          - ReviewCenter-LineDiff-Numbering-FinalLineEnding
          - ReviewCenter-LineDiff-Numbering-LoneReturn
        tests:
          - FileText_TryReadLines_Text_SplitsLikeSplitLines

      - id: ReviewCenter-Core-Diff-Bounds
        title: >-
          The Core subsystem shall report that a comparison is too large, giving no rows, when either side has more
          than 10,000 lines or the script needs more than 2,000 added and removed lines.
        justification: |
          A comparison grows with the product of its sizes, so without fixed bounds one large file could stall the
          service for every user.
        children:
          - ReviewCenter-LineDiff-Bounds
          - ReviewCenter-LineDiff-Bounds-LineLimitAccepted
          - ReviewCenter-LineDiff-Bounds-EditLimit
          - ReviewCenter-LineDiff-Bounds-EditLimitAccepted
          - ReviewCenter-LineDiff-Bounds-EmptySide
          - ReviewCenter-ReviewService-Diff-TooLarge

      - id: ReviewCenter-Core-Diff-Segments
        title: >-
          The Core subsystem shall show three context rows around every change and collapse the other rows into
          gaps.
        justification: |
          A reviewer wants to see the changes and what is around them, not the whole file, and the rows that the
          reviewer pinned must stay shown.
        children:
          - ReviewCenter-LineDiff-Segments
          - ReviewCenter-LineDiff-Segments-NoChangesSingleRow
          - ReviewCenter-LineDiff-Segments-NoRows
          - ReviewCenter-LineDiff-Segments-Merge
          - ReviewCenter-LineDiff-Segments-OneRowGap
          - ReviewCenter-LineDiff-Segments-Collapse
          - ReviewCenter-LineDiff-Segments-NoChanges
          - ReviewCenter-LineDiff-Segments-Cover
          - ReviewCenter-LineDiff-Segments-EdgeNoGap
          - ReviewCenter-LineDiff-Segments-Context
          - ReviewCenter-LineDiff-Segments-Pinned
          - ReviewCenter-LineDiff-Segments-PinnedIgnored

      - id: ReviewCenter-Core-Diff-Pairing
        title: >-
          The Core subsystem shall place the rows of a comparison side by side, pairing a run of removed lines row
          by row with the run of added lines that follows it.
        justification: |
          A side-by-side view shows what a line was replaced by, and every row must appear exactly once.
        children:
          - ReviewCenter-LineDiff-Pairing
          - ReviewCenter-LineDiff-Pairing-Paired
          - ReviewCenter-LineDiff-Pairing-LeftoverRemoved
          - ReviewCenter-LineDiff-Pairing-LeftoverAdded
          - ReviewCenter-LineDiff-Pairing-PureAdded
          - ReviewCenter-LineDiff-Pairing-PureRemoved
          - ReviewCenter-LineDiff-Pairing-Cover
          - ReviewCenter-LineDiff-Pairing-Range

      - id: ReviewCenter-Core-Diff-Arguments
        title: >-
          The Core subsystem shall refuse a missing list, a negative number of context rows, and a range outside the
          rows when it compares, shows, or reads lines.
        justification: |
          A wrong argument is a mistake of the caller, and it must show as an error instead of as a wrong
          comparison.
        children:
          - ReviewCenter-LineDiff-Compute-Arguments
          - ReviewCenter-LineDiff-Segments-ArgumentsContext
          - ReviewCenter-LineDiff-Segments-Arguments
          - ReviewCenter-LineDiff-Pairing-Arguments
        tests:
          - FileText_TryReadLines_Null_ThrowsArgumentNullException

      - id: ReviewCenter-Core-Diff-NoComparison
        title: >-
          The Core subsystem shall report that no comparison is possible, instead of comparing, when a review has no
          baseline or a side of the file is binary.
        justification: |
          A comparison with nothing, or of bytes that are not text, would show nonsense as a change.
        children:
          - ReviewCenter-ReviewService-Diff-NoBaseline
          - ReviewCenter-ReviewService-Diff-Binary
        tests:
          - FileText_TryReadLines_Binary_ReturnsNull

      - id: ReviewCenter-Core-Diff-NotFound
        title: >-
          The Core subsystem shall give nothing for a comparison of a review or a file that does not exist,
          comparing the path exactly.
        justification: |
          A comparison of a file that is not part of the review would show content that was never submitted.
        children:
          - ReviewCenter-ReviewService-Diff-NotFound

      - id: ReviewCenter-Core-Diff-ThreadSide
        title: >-
          The Core subsystem shall let a thread be anchored to the Head or the Baseline side of a file, checking the
          lines of a range against the chosen side only.
        justification: |
          A reviewer can then comment on removed lines as well as on lines at the head.
        children:
          - ReviewCenter-ThreadService-Side
          - ReviewCenter-ThreadService-Side-Default
          - ReviewCenter-ThreadService-Side-Lines
          - ReviewCenter-ThreadService-Side-WholeFile
        tests:
          - ThreadService_StartThreadAsync_SideMatrix_AcceptsOnlyLinesThatExistOnThatSide

      - id: ReviewCenter-Core-Diff-ThreadSideRefused
        title: >-
          The Core subsystem shall refuse a thread on the Baseline side when the review has no baseline commit or
          the file is not modified or deleted, and refuse a whole-file anchor or a side value that is not defined.
        justification: |
          A comment on a side that does not exist could not be shown next to the text that it is about.
        children:
          - ReviewCenter-ThreadService-Side-BaselineCommit
          - ReviewCenter-ThreadService-Side-BaselineFile
          - ReviewCenter-ThreadService-Side-WholeFileBaseline
          - ReviewCenter-ThreadService-Side-Undefined
        tests:
          - ThreadService_StartThreadAsync_SideMatrix_AcceptsOnlyLinesThatExistOnThatSide

      - id: ReviewCenter-Core-Diff-DigestSide
        title: >-
          The Core subsystem shall write the side of every thread of the report into the canonical text of the
          review record, so that a change of the side gives a different digest.
        justification: |
          A comment that moves from the removed text to the new text says something else, and signatures must not
          stay current when that happens.
        children:
          - ReviewCenter-RecordDigest-ThreadSide
          - ReviewCenter-RecordDigest-ThreadSide-Change

      - id: ReviewCenter-Core-Checklist
        title: >-
          The Core subsystem shall give every review a checklist of checks grouped in sections, taken when the review
          is created from the checklist of its project or, when the project has none, the built-in default.
        justification: |
          The checklist turns the review into a defined set of checks, so that it is clear what was examined and
          what is still open. A project can state its own checks, and a project without them still gets a useful
          checklist.
        children:
          - ReviewCenter-ReviewService-ProjectChecklist
          - ReviewCenter-ReviewService-ProjectChecklist-Default
          - ReviewCenter-ReviewService-ProjectChecklist-Unusable
          - ReviewCenter-ReviewService-ProjectChecklist-Later
          - ReviewCenter-ReviewService-ProjectChecklist-LaterApproved
        tests:
          - ReviewService_CreateDraftAsync_ValidInput_AttachesDefaultChecklistSnapshot

      - id: ReviewCenter-Core-Checklist-Default
        title: >-
          The Core subsystem shall provide a built-in default checklist of 14 sections and 58 checks that follows
          the review template.
        justification: |
          A project that has not written its own checks still needs a checklist, and the template of the review
          is the best known starting point.
        children:
          - ReviewCenter-ChecklistService-Default
          - ReviewCenter-ChecklistService-Default-Checks
          - ReviewCenter-ChecklistService-Default-Version
          - ReviewCenter-ChecklistService-Default-FirstLast
          - ReviewCenter-ChecklistService-Default-Wording
          - ReviewCenter-ChecklistService-Default-Identifiers
          - ReviewCenter-ChecklistService-Default-Valid
          - ReviewCenter-ChecklistService-Default-Json
          - ReviewCenter-ChecklistService-Default-Incomplete
        tests:
          - ReviewService_CreateDraftAsync_ValidInput_AttachesDefaultChecklistSnapshot

      - id: ReviewCenter-Core-Checklist-Frozen
        title: >-
          The Core subsystem shall read the checklist of a review from the copy that was stored with the review, so
          that a later change of the project checklist does not change an existing review.
        justification: |
          Freezing the checklist at creation keeps the questions fixed for the life of the review.
        children:
          - ReviewCenter-ChecklistService-Freeze
          - ReviewCenter-ChecklistService-Freeze-NoChecklist
          - ReviewCenter-ChecklistService-Freeze-UnknownReview
        tests:
          - CoreSubsystem_Checklist_FrozenAtCreationAnswerAndProgress

      - id: ReviewCenter-Core-Checklist-Applicability
        title: >-
          The Core subsystem shall let each section of a checklist be marked as not applicable with a reason.
        justification: |
          A section that does not apply to the files under review must not hold the review back, but the reason must
          be written down so that the others can judge it.
        children:
          - ReviewCenter-ChecklistService-Applicability
          - ReviewCenter-ChecklistService-Applicability-ReasonLimit-AtLimit
          - ReviewCenter-ChecklistService-Applicability-ReasonLimit-KeepsEarlier
          - ReviewCenter-ChecklistService-Applicability-Reason
          - ReviewCenter-ChecklistService-Applicability-ReasonLimit
          - ReviewCenter-ChecklistService-Applicability-Applies
          - ReviewCenter-ChecklistService-Applicability-UnknownSection

      - id: ReviewCenter-Core-Checklist-Answer
        title: >-
          The Core subsystem shall let each check of a checklist be answered Pass, Fail, or N/A, replacing an earlier
          answer and trimming the text.
        justification: |
          The answers are the result of the review, and a reviewer must be able to correct an answer.
        children:
          - ReviewCenter-ChecklistService-Answer
          - ReviewCenter-ChecklistService-Answer-PassNoJustification-BlankStoredAsNone
          - ReviewCenter-ChecklistService-Answer-PassNoJustification
          - ReviewCenter-ChecklistService-Answer-Replace
          - ReviewCenter-ChecklistService-Answer-Trimmed
        tests:
          - CoreSubsystem_Checklist_FrozenAtCreationAnswerAndProgress

      - id: ReviewCenter-Core-Checklist-AnswerJustification
        title: >-
          The Core subsystem shall require a justification where an answer needs one and bound it to its length
          limit, storing nothing for an answer that is too long.
        justification: |
          A Fail or N/A answer that is not explained cannot be judged by the others, and an unbounded text could
          overload the record.
        children:
          - ReviewCenter-ChecklistService-Answer-JustificationLimit-AtLimit
          - ReviewCenter-ChecklistService-Answer-JustificationLimit-StoresNothing
          - ReviewCenter-ChecklistService-Answer-Justification
          - ReviewCenter-ChecklistService-Answer-JustificationLimit

      - id: ReviewCenter-Core-Checklist-AnswerRefused
        title: >-
          The Core subsystem shall refuse an answer for a check or a review that does not exist and an outcome that
          is not defined.
        justification: |
          An answer that cannot be tied to a check of the frozen checklist would be lost or would corrupt the record.
        children:
          - ReviewCenter-ChecklistService-Answer-UnknownCheck
          - ReviewCenter-ChecklistService-Answer-UnknownReview
          - ReviewCenter-ChecklistService-Answer-UndefinedOutcome

      - id: ReviewCenter-Core-Checklist-AnsweredBy
        title: >-
          The Core subsystem shall store who answered a check and who marked a section, without making the digest of
          the record depend on it.
        justification: |
          People need to know who gave an answer, but the digest must depend only on the outcome so that the same
          outcome from another reviewer does not invalidate signatures.
        children:
          - ReviewCenter-ChecklistService-AnsweredBy
          - ReviewCenter-ChecklistService-AnsweredBy-Section
          - ReviewCenter-ChecklistService-AnsweredBy-NullActor
          - ReviewCenter-ChecklistService-AnsweredBy-Digest

      - id: ReviewCenter-Core-Checklist-Progress
        title: >-
          The Core subsystem shall give the progress per section and overall and whether the checklist is complete.
        justification: |
          A reviewer wants to know what is left to do, and the review cannot be signed before nothing is left.
        children:
          - ReviewCenter-ChecklistService-Progress
          - ReviewCenter-ChecklistService-Progress-NothingLeft-NextCheck
          - ReviewCenter-ChecklistService-Progress-Failed
          - ReviewCenter-ChecklistService-Progress-NotApplicable
          - ReviewCenter-ChecklistService-Progress-IgnoredAnswers
          - ReviewCenter-ChecklistService-Progress-Complete
          - ReviewCenter-ChecklistService-Progress-NothingLeft
          - ReviewCenter-ChecklistService-Progress-FirstSection
          - ReviewCenter-ChecklistService-Progress-NextCheck
          - ReviewCenter-ChecklistService-Progress-SingleSlotDraft
        tests:
          - CoreSubsystem_Checklist_FrozenAtCreationAnswerAndProgress

      - id: ReviewCenter-Core-Checklist-BallotSubmit
        title: >-
          The Core subsystem shall let a reviewer hand in the ballot of the own slot.
        justification: |
          Handing in the ballot is how a reviewer says that the checks are done, and the consolidation must only
          count ballots that are complete.
        children:
          - ReviewCenter-ChecklistService-BallotSubmit

      - id: ReviewCenter-Core-Checklist-BallotSubmit-Incomplete
        title: >-
          The Core subsystem shall refuse the hand-in of a ballot that is incomplete.
        justification: |
          The consolidation must only count ballots that are complete, so an incomplete ballot stays a draft.
        children:
          - ReviewCenter-ChecklistService-BallotSubmit-Incomplete

      - id: ReviewCenter-Core-Checklist-BallotSubmit-Repeat
        title: >-
          The Core subsystem shall treat a repeated hand-in of a ballot as harmless.
        justification: |
          A reviewer who hands in twice, for example by a double click, must not change a ballot that is already in.
        children:
          - ReviewCenter-ChecklistService-BallotSubmit-Repeat

      - id: ReviewCenter-Core-Checklist-BallotSlot
        title: >-
          The Core subsystem shall refuse an answer, a hand-in, or a change of the applicability of a section from an
          actor who holds no reviewer slot of the review.
        justification: |
          Only the reviewers of a review may speak for its checks, so a person without a slot must not leave a trace
          in a ballot.
        children:
          - ReviewCenter-ChecklistService-BallotSlot
          - ReviewCenter-ChecklistService-BallotSlot-Submit
          - ReviewCenter-ChecklistService-BallotSlot-Section

      - id: ReviewCenter-Core-Checklist-BallotSlot-OwnBallot
        title: >-
          The Core subsystem shall record an answer in the ballot of the slot of the actor only.
        justification: |
          One reviewer must not change what another reviewer answered.
        children:
          - ReviewCenter-ChecklistService-BallotSlot-OwnBallot

      - id: ReviewCenter-Core-Checklist-SingleSlot
        title: >-
          The Core subsystem shall hand in the draft ballot of a review that has a single slot as soon as the
          reviewer signs.
        justification: |
          With one reviewer there is nobody to consolidate with, so a separate hand-in would only be an extra step.
        children:
          - ReviewCenter-ChecklistService-SingleSlotAutoSubmit
          - ReviewCenter-ChecklistService-SingleSlotAutoSubmit-Draft
          - ReviewCenter-ChecklistService-SingleSlotAutoSubmit-Section

      - id: ReviewCenter-Core-Users
        title: >-
          The Core subsystem shall create users with a user name, a display name, a system administrator flag, and a
          password, keeping only a hash of the password.
        justification: |
          Accountability in a review needs verified users. Keeping only a hash of the password protects the
          passwords if the database is copied.
        children:
          - ReviewCenter-UserService-Create
          - ReviewCenter-UserService-Create-Administrator
          - ReviewCenter-UserService-Create-NoAdministratorByDefault
          - ReviewCenter-UserService-Create-PasswordHash
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-Core-Users-Arguments
        title: >-
          The Core subsystem shall refuse to build the user service without a user store, a password hasher, or a
          time provider.
        justification: |
          A user service that lacks one of these would fail later in a way that is hard to trace, so it is refused
          when it is built.
        children:
          - ReviewCenter-UserService-Create-Arguments

      - id: ReviewCenter-Core-Users-UserName
        title: >-
          The Core subsystem shall enforce the rules for the user name of a user: its characters, its length from 3
          to 50, and that it is not taken in any letter case.
        justification: |
          The user name is what people type to sign in and what the audit trail shows, so it must be unambiguous and
          limited, and a rejected name must leave nothing behind.
        children:
          - ReviewCenter-UserService-Username
          - ReviewCenter-UserService-Username-MinLength
          - ReviewCenter-UserService-Username-MaxLength
          - ReviewCenter-UserService-Username-Characters
          - ReviewCenter-UserService-Username-TooShort
          - ReviewCenter-UserService-Username-TooLong
          - ReviewCenter-UserService-Username-Taken
          - ReviewCenter-UserService-Username-NothingStored

      - id: ReviewCenter-Core-Users-DisplayName
        title: >-
          The Core subsystem shall enforce the rules for the display name of a user: trimmed, from 1 to 100
          characters.
        justification: |
          The display name is what other users see next to comments and signatures, so it must not be empty or
          unbounded.
        children:
          - ReviewCenter-UserService-DisplayName
          - ReviewCenter-UserService-DisplayName-MinLength
          - ReviewCenter-UserService-DisplayName-MaxLength
          - ReviewCenter-UserService-DisplayName-Empty
          - ReviewCenter-UserService-DisplayName-TooLong
          - ReviewCenter-UserService-DisplayName-NothingStored

      - id: ReviewCenter-Core-Users-Password
        title: >-
          The Core subsystem shall enforce the rules for the password of a user: 12 to 128 characters, kept exactly
          as typed, without a demand for a mix of character classes.
        justification: |
          Length protects a password better than composition rules, and a password that is changed silently
          could not be typed again.
        children:
          - ReviewCenter-UserService-Password
          - ReviewCenter-UserService-Password-MinLength
          - ReviewCenter-UserService-Password-MaxLength
          - ReviewCenter-UserService-Password-TooShort
          - ReviewCenter-UserService-Password-TooLong
          - ReviewCenter-UserService-Password-NoComposition
          - ReviewCenter-UserService-Password-Missing
          - ReviewCenter-UserService-Password-NotTrimmed
          - ReviewCenter-UserService-Password-NothingStored

      - id: ReviewCenter-Core-Users-SignIn
        title: >-
          The Core subsystem shall return the user when the password is right and the user is enabled, finding the
          user by the user name in any letter case.
        justification: |
          A sign-in establishes who acts in the review, and people do not remember the letter case of a name.
        children:
          - ReviewCenter-UserService-Authenticate
          - ReviewCenter-UserService-Authenticate-AnyCase
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-Core-Users-SignInRefused
        title: >-
          The Core subsystem shall return nothing for a sign-in with a wrong or missing password, an unknown user
          name, or a disabled user, taking the same effort for an unknown user as for a known one.
        justification: |
          A refusal must not tell an attacker which user names exist, neither by its answer nor by its timing.
        children:
          - ReviewCenter-UserService-Authenticate-WrongPassword
          - ReviewCenter-UserService-Authenticate-UnknownUser
          - ReviewCenter-UserService-Authenticate-DisabledUser
          - ReviewCenter-UserService-Authenticate-SameEffort

      - id: ReviewCenter-Core-Users-Lockout
        title: >-
          The Core subsystem shall lock a user out for 5 minutes after 5 failed sign-ins in a row, refusing even the
          right password during the lockout.
        justification: |
          A limit on failed sign-ins stops the guessing of passwords. A lockout must not be extended by the attempts
          that it refuses, and a successful sign-in starts the count again.
        children:
          - ReviewCenter-UserService-Lockout
          - ReviewCenter-UserService-Lockout-Duration
          - ReviewCenter-UserService-Lockout-LockedRefused
          - ReviewCenter-UserService-Lockout-LockedNotCounted
          - ReviewCenter-UserService-Lockout-ResetOnSuccess
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-Core-Users-Enabled
        title: >-
          The Core subsystem shall let a user be disabled and be enabled again, so that a disabled user cannot sign
          in.
        justification: |
          A user who leaves a project must lose access without the loss of the history that the user left.
        children:
          - ReviewCenter-UserService-Enabled
          - ReviewCenter-UserService-Enabled-Enable

      - id: ReviewCenter-Core-Users-LastAdmin
        title: >-
          The Core subsystem shall never leave the system without an enabled system administrator.
        justification: |
          Without an administrator nobody could repair accounts, so disabling or demoting the last enabled one is
          refused with the LastAdmin rule, and a disabled administrator does not count.
        children:
          - ReviewCenter-UserService-LastAdmin
          - ReviewCenter-UserService-LastAdmin-Demote
          - ReviewCenter-UserService-LastAdmin-OtherAdminRemains
          - ReviewCenter-UserService-LastAdmin-DisabledNotCounted
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-Core-Users-ChangePassword
        title: >-
          The Core subsystem shall change the password of a user when the current password is given correctly and
          the new password follows the password rules, and when the second factor is switched off, with the current
          password alone.
        justification: |
          A user must be able to renew a password, and only a person who knows the current one may do it.
        children:
          - ReviewCenter-UserService-ChangePassword
          - ReviewCenter-UserService-ChangePassword-SecondFactorOff

      - id: ReviewCenter-Core-Users-ChangePasswordRefused
        title: >-
          The Core subsystem shall refuse a change of the password when the current password is wrong, counting it
          as a failed sign-in, or when the new password breaks the password rules.
        justification: |
          Changing a password is a way to guess the current one, so a wrong guess must count against the lockout.
        children:
          - ReviewCenter-UserService-ChangePassword-WrongCurrent
          - ReviewCenter-UserService-ChangePassword-NewPasswordRules
          - ReviewCenter-UserService-ChangePassword-WrongCurrentCounts

      - id: ReviewCenter-Core-Users-ChangePasswordSecondFactor
        title: >-
          The Core subsystem shall refuse a change of the password that comes without the proof of the second factor
          from a user who uses one, change nothing, and record the refusal in the audit trail.
        justification: |
          A stolen password alone must not be enough to take over an account that is protected by a second factor.
        children:
          - ReviewCenter-UserService-ChangePassword-SecondFactorRefused
          - ReviewCenter-UserService-ChangePassword-SecondFactorNothingChanged
          - ReviewCenter-UserService-ChangePassword-SecondFactorRefusalAudited

      - id: ReviewCenter-Core-Users-SetPassword
        title: >-
          The Core subsystem shall set a new password for a user without knowing the old one, ending a lockout of the
          user and clearing the count of failed sign-ins.
        justification: |
          An administrator who restores access for a locked-out user expects the user to be able to sign in at once.
        children:
          - ReviewCenter-UserService-SetPassword
          - ReviewCenter-UserService-SetPassword-EndsLockout

      - id: ReviewCenter-Core-Users-SetPasswordRules
        title: >-
          The Core subsystem shall refuse a new password that is set without the old one when it breaks the password
          rules, with the PasswordInvalid rule.
        justification: |
          The rules of the password must hold also when an administrator sets it.
        children:
          - ReviewCenter-UserService-SetPassword-Rules

      - id: ReviewCenter-Core-Users-SetSystemAdmin
        title: >-
          The Core subsystem shall give a user the system administrator right and take it away again, by user name.
        justification: |
          Administration needs to be handed over as people join and leave.
        children:
          - ReviewCenter-UserService-SetSystemAdmin
          - ReviewCenter-UserService-SetSystemAdmin-Remove

      - id: ReviewCenter-Core-Users-NotFound
        title: >-
          The Core subsystem shall report a change of a user that does not exist with the UserNotFound rule.
        justification: |
          A change for a name that matches nobody must fail visibly and must not create or alter another user.
        children:
          - ReviewCenter-UserService-NotFound

      - id: ReviewCenter-Core-Users-TemporaryPassword
        title: >-
          The Core subsystem shall let a user whose password is a temporary one sign in.
        justification: |
          A password that somebody else handed over proves little, but the user must be able to sign in to replace
          it.
        children:
          - ReviewCenter-UserService-TemporaryPassword

      - id: ReviewCenter-Core-Users-TemporaryReauth
        title: >-
          The Core subsystem shall refuse a user whose password is a temporary one a re-authentication for a
          signature, and record the refusal with its reason in the audit trail.
        justification: |
          A signature that is confirmed with a password handed over by somebody else would prove nothing about who
          signed.
        children:
          - ReviewCenter-UserService-TemporaryPassword-ReauthRefused
          - ReviewCenter-UserService-TemporaryPassword-ReauthAudited

      - id: ReviewCenter-Core-Users-TemporarySame
        title: >-
          The Core subsystem shall refuse a new password that is the same as the temporary one, and keep the
          temporary state.
        justification: |
          A user who keeps the password that was handed over would stay in the state that it is meant to end.
        children:
          - ReviewCenter-UserService-TemporaryPassword-SameRefused
          - ReviewCenter-UserService-TemporaryPassword-SameKeepsFlag

      - id: ReviewCenter-Core-Users-TemporaryEnds
        title: >-
          The Core subsystem shall end the temporary state of a password when the user changes the own password.
        justification: |
          Choosing a new password is the only way out of the temporary state, and it restores the full rights of the
          account.
        children:
          - ReviewCenter-UserService-TemporaryPassword-EndsOnChange

      - id: ReviewCenter-Core-Users-AdminPasswordIsTemporary
        title: >-
          The Core subsystem shall make the password that an administrator or the command line sets for another user
          a temporary one, and not the password that an actor sets for the own account.
        justification: |
          A password that another party knows must be replaced at the next sign-in, and an actor with an API token
          counts as another party.
        children:
          - ReviewCenter-UserService-AdminPasswordIsTemporary
          - ReviewCenter-UserService-AdminPasswordIsTemporary-OwnAccount
          - ReviewCenter-UserService-AdminPasswordIsTemporary-OwnClearsPending
          - ReviewCenter-UserService-AdminPasswordIsTemporary-ApiTokenActor

      - id: ReviewCenter-Core-Users-LastSignIn
        title: >-
          The Core subsystem shall store the time of the last successful sign-in of a user, at the end of the second
          factor where there is one, and for an account that signs in at a provider.
        justification: |
          Administrators use the time of the last sign-in to find accounts that are no longer used.
        children:
          - ReviewCenter-UserService-LastSignIn
          - ReviewCenter-UserService-LastSignIn-SecondFactor
          - ReviewCenter-UserService-LastSignIn-Provider

      - id: ReviewCenter-Core-Users-LastSignInNone
        title: >-
          The Core subsystem shall store no time for a failed sign-in, a re-authentication for a signature, a
          password step that waits for the second factor, or a refused sign-in at a provider.
        justification: |
          Only a sign-in that was completed shows that the account is in use.
        children:
          - ReviewCenter-UserService-LastSignIn-Failed
          - ReviewCenter-UserService-LastSignIn-Reauthentication
          - ReviewCenter-UserService-LastSignIn-WaitingSecondFactor
          - ReviewCenter-UserService-LastSignIn-ProviderRefused

      - id: ReviewCenter-Core-Users-LockedStatus
        title: >-
          The Core subsystem shall tell whether a user is locked out at a given time, up to the end instant of the
          lockout.
        justification: |
          A user interface must show the same state that the sign-in enforces.
        children:
          - ReviewCenter-UserService-LockedStatus
          - ReviewCenter-UserService-LockedStatus-Ended
          - ReviewCenter-UserService-LockedStatus-NoLockout

      - id: ReviewCenter-Core-Users-Unlock
        title: >-
          The Core subsystem shall let a system administrator end the lockout of a user by user identifier, clearing
          the count of failed sign-ins.
        justification: |
          A user who is locked out by mistake or by an attacker needs help without a wait of minutes.
        children:
          - ReviewCenter-UserService-Unlock
          - ReviewCenter-UserService-Unlock-ClearsCount

      - id: ReviewCenter-Core-Users-UnlockRefused
        title: >-
          The Core subsystem shall refuse to end a lockout for an actor who is not an enabled system administrator,
          change nothing, and report an unknown user identifier with the UserNotFound rule.
        justification: |
          Ending a lockout takes away a protection, so only the people who administer accounts may do it.
        children:
          - ReviewCenter-UserService-Unlock-ActorNotAllowed
          - ReviewCenter-UserService-Unlock-NothingChanged
          - ReviewCenter-UserService-Unlock-NotFound

      - id: ReviewCenter-Core-Signatures
        title: >-
          The Core subsystem shall let a review have any number of reviewer slots, each with a primary reviewer and an
          optional alternate.
        justification: |
          A signature is only worth something if it says who signed. The slots define the people who are expected to
          take part in the review, and a review without a slot can still be reviewed and consolidated.
        children:
          - ReviewCenter-SigningService-Slots
          - ReviewCenter-SigningService-Slots-Members
          - ReviewCenter-SigningService-Slots-Numbering
          - ReviewCenter-SigningService-Slots-Unsigned
          - ReviewCenter-SigningService-Slots-ReviewExists

      - id: ReviewCenter-Core-Signatures-DigestBinding
        title: >-
          The Core subsystem shall bind each signature to the digest of the review record that was signed, as the
          SHA-256 hash of its canonical text written as 64 lowercase hexadecimal characters.
        justification: |
          Binding a signature to a digest of the record means that a conclusion can never outlive the content it
          concluded.
        children:
          - ReviewCenter-SigningService-Sign-Digest
          - ReviewCenter-RecordDigest-Format
          - ReviewCenter-RecordDigest-Format-Header
          - ReviewCenter-RecordDigest-Format-Layout

      - id: ReviewCenter-Core-Signatures-DigestNullRecord
        title: >-
          The Core subsystem shall reject a missing record with an ArgumentNullException when it builds the canonical
          text of a review record or computes its digest.
        justification: |
          A digest of nothing would look like a valid value, so a missing record must fail instead.
        children:
          - ReviewCenter-RecordDigest-NullRecord
          - ReviewCenter-RecordDigest-NullRecord-Compute

      - id: ReviewCenter-Core-Signatures-DigestCoverage
        title: >-
          The Core subsystem shall give a different digest when any content that a signature is meant to cover
          changes, such as the content fingerprint, an answer, the applicability of a section, a thread, a comment, or
          a promotion.
        justification: |
          A signature that stays current after a change of what was signed would be worth nothing.
        children:
          - ReviewCenter-RecordDigest-Coverage
          - ReviewCenter-RecordDigest-Coverage-CheckAnswered
          - ReviewCenter-RecordDigest-Coverage-PromotionRoundTrip
          - ReviewCenter-RecordDigest-Coverage-CheckAnswer
          - ReviewCenter-RecordDigest-Coverage-SectionNa
          - ReviewCenter-RecordDigest-Coverage-ThreadAdded
          - ReviewCenter-RecordDigest-Coverage-ThreadAnchor
          - ReviewCenter-RecordDigest-Coverage-CommentFields
          - ReviewCenter-RecordDigest-Coverage-Promotion
          - ReviewCenter-RecordDigest-Coverage-NewComment

      - id: ReviewCenter-Core-Signatures-DigestNotCovered
        title: >-
          The Core subsystem shall give the same digest when only chat, the state of a thread, or the creation time or
          identity of a thread changes.
        justification: |
          Talk around the report, and bookkeeping of a thread, is not what the signers agreed on, so it must not
          make a signature out of date.
        children:
          - ReviewCenter-RecordDigest-Coverage-Chat
          - ReviewCenter-RecordDigest-Coverage-ThreadState
          - ReviewCenter-RecordDigest-Coverage-ThreadIdentity

      - id: ReviewCenter-Core-Signatures-DigestConclusionText
        title: >-
          The Core subsystem shall cover the review conclusion text in the digest as the line conclusion-text between
          the outcome line and the report, and write no such line when there is no text.
        justification: |
          The text is part of what a signer concludes with, and a record without a text must keep the digest that it
          had before the text existed.
        children:
          - ReviewCenter-RecordDigest-Coverage-ConclusionText
          - ReviewCenter-RecordDigest-Coverage-ConclusionLine
          - ReviewCenter-RecordDigest-Coverage-ConclusionNone

      - id: ReviewCenter-Core-Signatures-DigestChecklist
        title: >-
          The Core subsystem shall cover the checklist of the review in the canonical text: its version and, sorted
          by identifier, the identifier and title of every section and check.
        justification: |
          A change of the questions that were asked changes what the signature means, so the checklist belongs to
          the signed content.
        children:
          - ReviewCenter-RecordDigest-Checklist
          - ReviewCenter-RecordDigest-Checklist-Removal
          - ReviewCenter-RecordDigest-Checklist-Change
          - ReviewCenter-RecordDigest-Checklist-Order
          - ReviewCenter-RecordDigest-Checklist-None

      - id: ReviewCenter-Core-Signatures-DigestChecklistInvalid
        title: >-
          The Core subsystem shall refuse a stored checklist definition that is invalid or incomplete with a JSON
          error instead of hiding it when it builds the canonical text.
        justification: |
          A digest that silently skips a damaged checklist would let a signature stay current for content that
          was never covered.
        children:
          - ReviewCenter-RecordDigest-ChecklistInvalid
          - ReviewCenter-RecordDigest-ChecklistInvalid-Minimal

      - id: ReviewCenter-Core-Signatures-DigestWho
        title: >-
          The Core subsystem shall not cover who answered a check or who marked a section as not applicable in the
          canonical text, so that the digest is the same whoever gave the same outcome.
        justification: |
          A reviewer who gives the same answer as before must not make signatures out of date.
        children:
          - ReviewCenter-RecordDigest-AnsweredBy
          - ReviewCenter-RecordDigest-AnsweredBy-Justification
          - ReviewCenter-RecordDigest-AnsweredBy-Time
          - ReviewCenter-RecordDigest-SectionSetter
          - ReviewCenter-RecordDigest-SectionSetter-Reason
          - ReviewCenter-RecordDigest-SectionSetter-Time

      - id: ReviewCenter-Core-Signatures-DigestIndependence
        title: >-
          The Core subsystem shall give the same digest for the same record whatever the order in which its threads,
          ballots, answers, and sections are given.
        justification: |
          The order in which a store returns records is not content, so it must not change a signature.
        children:
          - ReviewCenter-RecordDigest-Independence
          - ReviewCenter-RecordDigest-Independence-Identities
          - ReviewCenter-RecordDigest-Independence-Slots
          - ReviewCenter-RecordDigest-Independence-ApplicableSection

      - id: ReviewCenter-Core-Signatures-DigestUnambiguous
        title: >-
          The Core subsystem shall give different digests for two records that differ only in where a text ends and
          the next value begins.
        justification: |
          If text could be moved across a boundary without a change of the digest, a signature could be made to
          cover text that nobody signed.
        children:
          - ReviewCenter-RecordDigest-Unambiguous
          - ReviewCenter-RecordDigest-Unambiguous-EmptyValues
          - ReviewCenter-RecordDigest-Unambiguous-Absent

      - id: ReviewCenter-Core-Signatures-DigestReport
        title: >-
          The Core subsystem shall write the report of a review into the canonical text as the marker line report
          followed by one block for every thread with an included comment, sorted ordinally, with its claim, its
          included replies, and its included resolution notes, and leave out chat.
        justification: |
          The report is what the signers agree on, so its content, and not the talk around it, must be covered.
        children:
          - ReviewCenter-RecordDigest-Report
          - ReviewCenter-RecordDigest-Report-CommentExcluded
          - ReviewCenter-RecordDigest-Report-ResolutionExcluded
          - ReviewCenter-RecordDigest-Report-Block
          - ReviewCenter-RecordDigest-Report-Claim
          - ReviewCenter-RecordDigest-Report-Comment
          - ReviewCenter-RecordDigest-Report-Resolution
          - ReviewCenter-RecordDigest-Report-Fields
          - ReviewCenter-RecordDigest-Report-CommentOrder
          - ReviewCenter-RecordDigest-Report-Sorted
          - ReviewCenter-RecordDigest-Report-Chat

      - id: ReviewCenter-Core-Signatures-DigestChecks
        title: >-
          The Core subsystem shall write a check line that says agreed with the outcome for every check of a section
          that applies when the submitted ballots agree, and the state of the sections and checks that they do not
          agree on.
        justification: |
          The signatures cover the result of the consolidation, so the digest must show what the ballots agree and
          disagree on.
        children:
          - ReviewCenter-RecordDigest-ConsolidatedChecks
          - ReviewCenter-RecordDigest-ConsolidatedChecks-Disputed
          - ReviewCenter-RecordDigest-ConsolidatedChecks-Pending
          - ReviewCenter-RecordDigest-ConsolidatedChecks-Sorted
          - ReviewCenter-RecordDigest-ConsolidatedChecks-NaSection
          - ReviewCenter-RecordDigest-ConsolidatedChecks-DisputedSection
          - ReviewCenter-RecordDigest-ConsolidatedChecks-NaSectionChecks
          - ReviewCenter-RecordDigest-ConsolidatedChecks-DisputedSectionChecks
          - ReviewCenter-RecordDigest-ConsolidatedChecks-ApplicableSection
          - ReviewCenter-RecordDigest-ConsolidatedChecks-SectionsSorted

      - id: ReviewCenter-Core-Signatures-DigestDraftIgnored
        title: >-
          The Core subsystem shall let a draft ballot, and any edit of a draft, never change the digest.
        justification: |
          A reviewer who is still working on a ballot must not make the signatures of the others out of date.
        children:
          - ReviewCenter-RecordDigest-DraftIgnored
          - ReviewCenter-RecordDigest-DraftIgnored-Agreeing
          - ReviewCenter-RecordDigest-DraftIgnored-Disagreement

      - id: ReviewCenter-Core-Signatures-DigestNoBallotContent
        title: >-
          The Core subsystem shall not cover in the digest the review that an answer of a ballot was carried from.
        justification: |
          Where an answer came from does not change what it says, so it must not change a signature.
        children:
          - ReviewCenter-RecordDigest-NoBallotContent
          - ReviewCenter-RecordDigest-NoBallotContent-CarriedSection

      - id: ReviewCenter-Core-Signatures-DigestOutcome
        title: >-
          The Core subsystem shall write the outcome line of the canonical text as none while the consolidation has
          no outcome, and as approved or rejected when it has.
        justification: |
          The outcome is what the signers agree to, so it must be part of the signed content.
        children:
          - ReviewCenter-RecordDigest-Outcome
          - ReviewCenter-RecordDigest-Outcome-Approved
          - ReviewCenter-RecordDigest-Outcome-Rejected

      - id: ReviewCenter-Core-Signatures-DigestBallotFingerprint
        title: >-
          The Core subsystem shall compute the ballot fingerprint of a record, separate from the record digest, as
          the SHA-256 hash of the canonical text of the submitted ballots.
        justification: |
          Reviewers need to see whether ballots changed without the report changing, and the digest of the whole
          record cannot say that.
        children:
          - ReviewCenter-RecordDigest-BallotFingerprint
          - ReviewCenter-RecordDigest-BallotFingerprint-Header
          - ReviewCenter-RecordDigest-BallotFingerprint-SubmittedOnly
          - ReviewCenter-RecordDigest-BallotFingerprint-Ordinal
          - ReviewCenter-RecordDigest-BallotFingerprint-Answers
          - ReviewCenter-RecordDigest-BallotFingerprint-AnswerOrder
          - ReviewCenter-RecordDigest-BallotFingerprint-LastRow
          - ReviewCenter-RecordDigest-BallotFingerprint-Sections
          - ReviewCenter-RecordDigest-BallotFingerprint-SectionOrder
          - ReviewCenter-RecordDigest-BallotFingerprint-Change
          - ReviewCenter-RecordDigest-BallotFingerprint-DisplayName
          - ReviewCenter-RecordDigest-BallotFingerprint-Justification
          - ReviewCenter-RecordDigest-BallotFingerprint-NullRecord

      - id: ReviewCenter-Core-Signatures-SlotUsers
        title: >-
          The Core subsystem shall require that the primary reviewer and the alternate of a slot are existing, enabled
          users who are members of the project, different from each other, and in no other slot of the same review.
        justification: |
          A signature from a person who cannot take part in the review, or who signs twice, would make the number of
          signatures meaningless.
        children:
          - ReviewCenter-SigningService-SlotUsers
          - ReviewCenter-SigningService-SlotUsers-Enabled
          - ReviewCenter-SigningService-SlotUsers-Member
          - ReviewCenter-SigningService-SlotUsers-AdminMember
          - ReviewCenter-SigningService-SlotUsers-Different
          - ReviewCenter-SigningService-SlotUsers-OneSlot

      - id: ReviewCenter-Core-Signatures-SlotCandidates
        title: >-
          The Core subsystem shall offer only the enabled members of the project as candidates for a slot.
        justification: |
          A choice list that offers people who cannot take the slot leads to refusals that could have been avoided.
        children:
          - ReviewCenter-SigningService-SlotUsers-Candidates

      - id: ReviewCenter-Core-Signatures-SlotCandidatesNoPassword
        title: >-
          The Core subsystem shall offer the candidates for a slot without their passwords.
        justification: |
          A list of candidates is shown to many people, so it must never carry a secret.
        children:
          - ReviewCenter-SigningService-SlotUsers-NoPassword

      - id: ReviewCenter-Core-Signatures-SlotCandidatesAccess
        title: >-
          The Core subsystem shall offer the candidates for a slot only to an actor who may see the project.
        justification: |
          The members of a project are not public, so the list of candidates must not reveal them to outsiders.
        children:
          - ReviewCenter-SigningService-SlotUsers-CandidateAccess

      - id: ReviewCenter-Core-Signatures-SlotEdit
        title: >-
          The Core subsystem shall let a slot that has never been signed be changed or removed, and take the ballot of
          a removed slot out of the record together with the slot.
        justification: |
          A slot that was set up wrongly must be fixable while nothing depends on it, and a ballot of a slot that no
          longer exists must not stay in the record.
        children:
          - ReviewCenter-SigningService-SlotEdit
          - ReviewCenter-SigningService-SlotEdit-Remove
          - ReviewCenter-SigningService-SlotEdit-Ballot

      - id: ReviewCenter-Core-Signatures-SlotEditExists
        title: >-
          The Core subsystem shall reject a slot that does not exist in the review with the SlotNotFound rule.
        justification: |
          A caller that names a slot of another review, or one that is gone, must be told so and not get a silent
          change of something else.
        children:
          - ReviewCenter-SigningService-SlotEdit-Exists

      - id: ReviewCenter-Core-Signatures-SlotLocked
        title: >-
          The Core subsystem shall refuse to change or remove a slot that has any signature, current or out of date.
        justification: |
          A signature names a slot, so a slot that has a signature, even an out-of-date one, is part of the history
          of the review and must stay as it was.
        children:
          - ReviewCenter-SigningService-SlotEdit-Signed

      - id: ReviewCenter-Core-Signatures-SlotActor
        title: >-
          The Core subsystem shall allow a slot to be added, changed, removed, or signed, and a review to be reopened,
          only for a signed-in user that still exists and is enabled.
        justification: |
          A slot decides who may approve, so only a person who can be held to account may change or use one.
        children:
          - ReviewCenter-SigningService-Actor
          - ReviewCenter-SigningService-Actor-Sign
          - ReviewCenter-SigningService-Actor-Reopen

      - id: ReviewCenter-Core-Signatures-SlotProject
        title: >-
          The Core subsystem shall refuse to add, change, or remove a slot, to sign, and to reopen a review for a
          project that does not exist or that the actor may not see, with the ProjectNotFound rule.
        justification: |
          Answering that a project exists, but is closed to the caller, would reveal it, so both cases look the same.
        children:
          - ReviewCenter-SigningService-Actor-ProjectMissing
          - ReviewCenter-SigningService-Actor-ProjectHidden

      - id: ReviewCenter-Core-Signatures-SlotViewAccess
        title: >-
          The Core subsystem shall let any actor who may see the project, a member or a system administrator who is
          not a member, add, change, and remove slots.
        justification: |
          Setting up the reviewers is the work of whoever runs the review, which a system administrator may need to
          do for a project that they are not a member of.
        children:
          - ReviewCenter-SigningService-Actor-ViewAccess

      - id: ReviewCenter-Core-Signatures-Signer
        title: >-
          The Core subsystem shall allow a slot to be signed only by its primary reviewer or its alternate.
        justification: |
          A signature stands for the person who was named to give it, so nobody else may give it for them.
        children:
          - ReviewCenter-SigningService-Actor-Signer

      - id: ReviewCenter-Core-Signatures-SignerMember
        title: >-
          The Core subsystem shall refuse to let a reviewer of a slot sign who is not a member of the project, also a
          system administrator, with the ActorNotAllowed rule.
        justification: |
          A person who has left the project can no longer vouch for its content, even if a slot still names them.
        children:
          - ReviewCenter-SigningService-Actor-SignerMember

      - id: ReviewCenter-Core-Signatures-Blockers
        title: >-
          The Core subsystem shall refuse to sign a review while a check in a section that applies is unanswered, or a
          thread is open, whether chat or included in the report, with the SigningNotAllowed rule.
        justification: |
          A signature says that nothing is left open, so work that is still open must stop it.
        children:
          - ReviewCenter-SigningService-Blockers
          - ReviewCenter-SigningService-Blockers-OpenThread

      - id: ReviewCenter-Core-Signatures-BlockersListed
        title: >-
          The Core subsystem shall list each blocker of a review by name, and the sentence "This review has no
          checklist." for a review without a checklist, so that the signer is told what to do.
        justification: |
          A signer who is only told that signing is not possible cannot act on it.
        children:
          - ReviewCenter-SigningService-Blockers-Listed
          - ReviewCenter-SigningService-Blockers-MissingChecklist

      - id: ReviewCenter-Core-Signatures-FailNotBlocker
        title: >-
          The Core subsystem shall not treat a check answered Fail as a blocker of a signature, whether its section
          applies or not.
        justification: |
          A failed check is a finding that leads to a rejection, not a reason for the review to be stuck.
        children:
          - ReviewCenter-SigningService-Blockers-FailNotBlocker
          - ReviewCenter-SigningService-Blockers-NotApplicable

      - id: ReviewCenter-Core-Signatures-Sign
        title: >-
          The Core subsystem shall let the primary reviewer or the alternate of a slot sign the review, and store a
          signature for the slot and the user.
        justification: |
          The signature is the act that approves or rejects the review, and it must name who gave it.
        children:
          - ReviewCenter-SigningService-Sign
          - ReviewCenter-SigningService-Sign-Alternate

      - id: ReviewCenter-Core-Signatures-SignRecord
        title: >-
          The Core subsystem shall record on each signature whether the signer was the primary reviewer or the
          alternate, the display name of the signer at the time of signing, and the time of signing.
        justification: |
          A later reader must be able to tell who signed, in which role, and when, even after names change.
        children:
          - ReviewCenter-SigningService-Sign-Role
          - ReviewCenter-SigningService-Sign-DisplayName
          - ReviewCenter-SigningService-Sign-Time

      - id: ReviewCenter-Core-Signatures-SignMeaning
        title: >-
          The Core subsystem shall record on each signature the fixed meaning text of its outcome.
        justification: |
          A signature must say what the signer stands for, in words that cannot change with the software.
        children:
          - ReviewCenter-SigningService-Sign-Meaning

      - id: ReviewCenter-Core-Signatures-Unchanged
        title: >-
          The Core subsystem shall never change or remove a signature that has been stored.
        justification: |
          A signature is a record of what a person did, so it is only ever added to, never edited.
        children:
          - ReviewCenter-SigningService-Sign-Immutable

      - id: ReviewCenter-Core-Signatures-Reauthenticate
        title: >-
          The Core subsystem shall store a signature only after the signer has given the password of the account
          again, and ask for the password only after every other check has passed.
        justification: |
          Asking for the password again shows that the signature came from the person and not from a session left
          open, and asking last keeps a wrong password from revealing how far the request got.
        children:
          - ReviewCenter-SigningService-Reauthenticate
          - ReviewCenter-SigningService-Reauthenticate-LastCheck

      - id: ReviewCenter-Core-Signatures-ReauthenticateFailure
        title: >-
          The Core subsystem shall report a wrong password and a locked account in the same way when a signature is
          given.
        justification: |
          Different answers would tell an attacker whether the account is locked.
        children:
          - ReviewCenter-SigningService-Reauthenticate-SameFailure

      - id: ReviewCenter-Core-Signatures-ReauthenticateLockout
        title: >-
          The Core subsystem shall count wrong passwords of a signature toward the same lockout as sign-in.
        justification: |
          A signature must not give a second way to guess a password without limit.
        children:
          - ReviewCenter-SigningService-Reauthenticate-SharedLockout

      - id: ReviewCenter-Core-Signatures-RecordCurrent
        title: >-
          The Core subsystem shall refuse to sign with the RecordChanged rule when the record is not the one that the
          signer saw.
        justification: |
          A signer must only be able to sign what they have seen, so a record that changed in the meantime stops it.
        children:
          - ReviewCenter-SigningService-Current

      - id: ReviewCenter-Core-Signatures-AlreadySigned
        title: >-
          The Core subsystem shall refuse to sign a slot that already has a signature for the current record.
        justification: |
          A second signature for the same record adds nothing and would confuse the history.
        children:
          - ReviewCenter-SigningService-Current-AlreadySigned

      - id: ReviewCenter-Core-Signatures-Status
        title: >-
          The Core subsystem shall give for a review the digest of its record.
        justification: |
          The digest is what a signer, and the next change, compare against, so it is part of the status.
        children:
          - ReviewCenter-SigningService-Status

      - id: ReviewCenter-Core-Signatures-StatusMissing
        title: >-
          The Core subsystem shall give no status for a review that does not exist.
        justification: |
          An invented status for a missing review would hide a mistake of the caller.
        children:
          - ReviewCenter-SigningService-Status-MissingReview

      - id: ReviewCenter-Core-Signatures-SlotStates
        title: >-
          The Core subsystem shall give for a slot the state not signed when it has no signature, and the state signed,
          naming the signer and the time, when it has a signature of the current record.
        justification: |
          Reviewers see who still has to sign by the state of the slots.
        children:
          - ReviewCenter-SigningService-Status-NotSigned
          - ReviewCenter-SigningService-Status-Signed

      - id: ReviewCenter-Core-Signatures-OutOfDate
        title: >-
          The Core subsystem shall give for a slot that was signed only for an earlier record the state out of date,
          also when a later ballot changes the consolidated standing after an early signature.
        justification: |
          A signature of content that has changed must show as no longer valid, or it would still count.
        children:
          - ReviewCenter-SigningService-Status-OutOfDate
          - ReviewCenter-SigningService-EarlySigning-LaterChange
        tests:
          - CoreSubsystem_Signatures_SignChangeOutOfDateAndResign_FollowsTheRecord

      - id: ReviewCenter-Core-Signatures-Concluded
        title: >-
          The Core subsystem shall give for a review whether it is approved, and whether it is concluded.
        justification: |
          The conclusion of a review is computed from its record each time, so it can never outlive its content.
        children:
          - ReviewCenter-SigningService-Status-Approved
          - ReviewCenter-SigningService-Status-Conclusion

      - id: ReviewCenter-Core-Signatures-StatusBlockers
        title: >-
          The Core subsystem shall give for a review the blockers that stop a signature.
        justification: |
          A reviewer should see what is in the way without having to try to sign.
        children:
          - ReviewCenter-SigningService-Status-Blockers

      - id: ReviewCenter-Core-Signatures-StatusNextStep
        title: >-
          The Core subsystem shall give for a review one sentence that names the next step.
        justification: |
          A single sentence tells a reviewer what to do next without reading the whole status.
        children:
          - ReviewCenter-SigningService-Status-NextStep

      - id: ReviewCenter-Core-Signatures-StatusAssignee
        title: >-
          The Core subsystem shall say in the status for the primary and for the alternate reviewer of each slot
          whether that user is still a member of the project.
        justification: |
          A slot held by someone who left the project cannot sign, and the others need to see that.
        children:
          - ReviewCenter-SigningService-Status-AssigneeMembership

      - id: ReviewCenter-Core-Signatures-StatusAssigneeKept
        title: >-
          The Core subsystem shall keep the slot assigned to a user who has been removed from the project.
        justification: |
          Removing a user must not rewrite who was expected to review.
        children:
          - ReviewCenter-SigningService-Status-AssigneeKept

      - id: ReviewCenter-Core-Signatures-StatusBatch
        title: >-
          The Core subsystem shall give for each review of a batch read the same status as a single read of that
          review, reading the store and the users once for the batch.
        justification: |
          A list of many reviews must not cost one query per review, and must not differ from the single view.
        children:
          - ReviewCenter-SigningService-Status-BatchSame
          - ReviewCenter-SigningService-Status-BatchStore
          - ReviewCenter-SigningService-Status-BatchUsers
          - ReviewCenter-SigningService-Status-BatchEmpty

      - id: ReviewCenter-Core-Signatures-Impact
        title: >-
          The Core subsystem shall name the current signatures that a change would make out of date before the change
          is stored, with the number of each affected slot in slot order and its signer.
        justification: |
          A person who is about to withdraw a signature should know whose it is before doing so.
        children:
          - ReviewCenter-SigningService-SignatureImpact
          - ReviewCenter-SigningService-SignatureImpact-SlotNumbers
          - ReviewCenter-SigningService-SignatureImpact-Signer

      - id: ReviewCenter-Core-Signatures-ImpactRefused
        title: >-
          The Core subsystem shall refuse a change that would make a signature out of date with the
          SignaturesWouldBecomeOutOfDate rule, and store nothing, until the caller acknowledges the affected slots.
        justification: |
          Refusing until the caller confirms keeps a signature from being lost unnoticed.
        children:
          - ReviewCenter-SigningService-SignatureImpact-Refused
          - ReviewCenter-SigningService-SignatureImpact-NothingStored
        tests:
          - CoreSubsystem_Signatures_ChangeAfterSigning_NeedsAcknowledgement

      - id: ReviewCenter-Core-Signatures-ImpactAcknowledged
        title: >-
          The Core subsystem shall carry out a change that makes signatures out of date when the caller has
          acknowledged every affected slot.
        justification: |
          A change must still be possible when the caller knowingly accepts that signatures are withdrawn.
        children:
          - ReviewCenter-SigningService-SignatureImpact-Acknowledged

      - id: ReviewCenter-Core-Signatures-ImpactNotNeeded
        title: >-
          The Core subsystem shall need no acknowledgement for a change that leaves the digest of the record as it is,
          such as chat, or for a change to a review without a current signature.
        justification: |
          Asking for a confirmation where nothing is lost would only teach callers to confirm without reading.
        children:
          - ReviewCenter-SigningService-SignatureImpact-DigestUnchanged
          - ReviewCenter-SigningService-SignatureImpact-NoSignature

      - id: ReviewCenter-Core-Signatures-ImpactOwnSlot
        title: >-
          The Core subsystem shall leave the signature of the slot of the person who changes and hands in the own
          ballot out of the acknowledgement.
        justification: |
          A person who changes their own ballot does not need to be warned about their own signature.
        children:
          - ReviewCenter-SigningService-SignatureImpact-OwnSlotExcluded
          - ReviewCenter-ChecklistService-BallotImpact-OwnSlot

      - id: ReviewCenter-Core-Signatures-BallotAcknowledge
        title: >-
          The Core subsystem shall refuse the hand-in of a ballot that would put the signature of another slot out of
          date until the actor has acknowledged every affected slot, with the SignaturesWouldBecomeOutOfDate rule, and
          not hand the ballot in.
        justification: |
          A reviewer's ballot changes the consolidation, so handing it in must not silently withdraw the signature of
          another reviewer.
        children:
          - ReviewCenter-ChecklistService-SignatureImpact

      - id: ReviewCenter-Core-Signatures-BallotNames
        title: >-
          The Core subsystem shall name in the refusal of a hand-in the number and the signer of every affected slot,
          whichever of the primary or the alternate reviewer signed, and no slot that has no signature.
        justification: |
          The reviewer must see whose signature the hand-in would withdraw, and not be told about slots that are not
          affected.
        children:
          - ReviewCenter-ChecklistService-SignatureImpact-Names
          - ReviewCenter-ChecklistService-SignatureImpact-Names-Unsigned

      - id: ReviewCenter-Core-Signatures-BallotRemaining
        title: >-
          The Core subsystem shall name in the refusal after an incomplete acknowledgement the slots that are still
          not acknowledged, without letting the acknowledgement of a slot that has no signature suppress any of them.
        justification: |
          An acknowledgement that is incomplete must lead to a refusal that says exactly what is missing.
        children:
          - ReviewCenter-ChecklistService-SignatureImpact-Remaining
          - ReviewCenter-ChecklistService-SignatureImpact-Remaining-Unrelated

      - id: ReviewCenter-Core-Signatures-BallotAcknowledged
        title: >-
          The Core subsystem shall hand in a ballot after every affected slot is acknowledged, and leave the
          signatures of those slots out of date.
        justification: |
          A reviewer must be able to hand in a ballot once they accept that other signatures are withdrawn.
        children:
          - ReviewCenter-ChecklistService-SignatureImpact-Acknowledged

      - id: ReviewCenter-Core-Signatures-BallotExceptionCopy
        title: >-
          The Core subsystem shall keep the affected slots listed in a refusal as they were when it raised the
          refusal, so that a later change of the signatures does not change the refusal.
        justification: |
          A refusal that changes after it was raised would give the caller wrong information about what they refused.
        children:
          - ReviewCenter-ChecklistService-SignatureImpact-ExceptionCopy

      - id: ReviewCenter-Core-Signatures-BallotNotNeeded
        title: >-
          The Core subsystem shall accept changes to a ballot and its hand-in without an acknowledgement while no
          signature is current, when the handed-in ballots still agree, and for a hand-in that agrees with the other
          handed-in ballots, and keep the signatures current.
        justification: |
          Only a change of the consolidated standing makes a signature out of date, so other changes need no warning.
        children:
          - ReviewCenter-ChecklistService-SignatureImpact-NoSignature
          - ReviewCenter-ChecklistService-SignatureImpact-DraftChange
          - ReviewCenter-ChecklistService-BallotImpact-NoWarning

      - id: ReviewCenter-Core-Signatures-BallotDraftKeeps
        title: >-
          The Core subsystem shall leave the current signatures of the other slots as they are while a reviewer
          changes the ballot of the own slot and has not handed it in.
        justification: |
          A ballot that is still a draft is not part of the record, so working on it must not disturb anyone.
        children:
          - ReviewCenter-ChecklistService-BallotImpact

      - id: ReviewCenter-Core-Signatures-OwnBallot
        title: >-
          The Core subsystem shall refuse a signature of a slot whose own ballot has not been handed in with the
          BallotNotSubmitted rule, and store nothing.
        justification: |
          A reviewer who has not stated a view of their own must not sign for the review.
        children:
          - ReviewCenter-SigningService-OwnBallotSubmitted
          - ReviewCenter-SigningService-OwnBallotSubmitted-NothingStored

      - id: ReviewCenter-Core-Signatures-OwnBallotOrder
        title: >-
          The Core subsystem shall check the own ballot after the comparison of the digest and after the check for an
          earlier signature of the slot, and before the blockers of the review, except that a review with a single
          slot names the blockers first.
        justification: |
          When several things are wrong, the signer should be told the one that they can act on first.
        children:
          - ReviewCenter-SigningService-OwnBallotSubmitted-AfterDigest
          - ReviewCenter-SigningService-OwnBallotSubmitted-AfterSigned
          - ReviewCenter-SigningService-OwnBallotSubmitted-BeforeBlockers
          - ReviewCenter-SigningService-OwnBallotSubmitted-SingleSlot

      - id: ReviewCenter-Core-Signatures-EarlySigning
        title: >-
          The Core subsystem shall let a slot sign as soon as its own ballot is submitted and nothing blocks the
          review, without waiting for the ballots of the other slots.
        justification: |
          Reviewers who are done should not have to wait for the others, and a later change makes the signature out of
          date in the normal way.
        children:
          - ReviewCenter-SigningService-EarlySigning

      - id: ReviewCenter-Core-Signatures-DisputedBlocker
        title: >-
          The Core subsystem shall refuse to sign a review while the submitted ballots disagree on a check, with the
          SigningNotAllowed rule.
        justification: |
          A disagreement between reviewers is a finding that must be settled before anybody concludes the review.
        children:
          - ReviewCenter-SigningService-DisputedBlocker
          - ReviewCenter-SigningService-Blockers-Disputed
          - ReviewCenter-SigningService-DisputedBlocker-MessageCount
          - ReviewCenter-SigningService-DisputedBlocker-Listed
          - ReviewCenter-SigningService-DisputedBlocker-Count

      - id: ReviewCenter-Core-Signatures-NextStepDisputed
        title: >-
          The Core subsystem shall word the next step of a review that is not concluded so that a check on which the
          ballots disagree is named once, as disputed, and never as unanswered.
        justification: |
          Telling a reviewer to answer a check that has been answered would send them the wrong way.
        children:
          - ReviewCenter-SigningService-NextStepWording

      - id: ReviewCenter-Core-Signatures-NextStepRejected
        title: >-
          The Core subsystem shall say in the next step, when the only thing left is the conclusion and the agreed
          outcome is Rejected, which checks the reviewers failed and that the review will be Rejected.
        justification: |
          A reviewer who is about to reject needs to know what the rejection rests on.
        children:
          - ReviewCenter-SigningService-NextStepWording-RejectedConclusion

      - id: ReviewCenter-Core-Signatures-NextStepSigners
        title: >-
          The Core subsystem shall name in the next step, when nothing blocks, who has signed and whose signature is
          awaited, naming the person who actually signed and the signer of an out-of-date signature as awaited.
        justification: |
          The next step is useful when it says who has to act, and the actual people are the ones who matter.
        children:
          - ReviewCenter-SigningService-NextStepWording-SignersAwaited
          - ReviewCenter-SigningService-NextStepWording-OutOfDateSigner
          - ReviewCenter-SigningService-NextStepWording-ActualSigner

      - id: ReviewCenter-Core-Signatures-FailedMasked
        title: >-
          The Core subsystem shall never give the identifiers of the failed checks to a viewer who may not see the
          standing of the others.
        justification: |
          A reviewer who has not handed in a ballot must not be steered by what the others answered.
        children:
          - ReviewCenter-SigningService-FailedChecksMasked

      - id: ReviewCenter-Core-Signatures-FailedMaskedNote
        title: >-
          The Core subsystem shall never give the note on the provisional rejection to a viewer who may not see the
          standing of the others.
        justification: |
          The note would reveal the failed checks in words.
        children:
          - ReviewCenter-SigningService-FailedChecksMasked-RejectionNote

      - id: ReviewCenter-Core-Signatures-FailedMaskedWording
        title: >-
          The Core subsystem shall never give a wording that depends on the signatures to a viewer who may not see the
          standing of the others.
        justification: |
          Who has signed shows the standing, so a wording that depends on it must be left out too.
        children:
          - ReviewCenter-SigningService-FailedChecksMasked-SignatureWording

      - id: ReviewCenter-Core-Signatures-FailedMaskedHandIn
        title: >-
          The Core subsystem shall start the next step of a viewer who may not see the standing of the others with
          the request to hand in the own ballot.
        justification: |
          Such a viewer can only act on their own ballot, so that is the next step that they are shown.
        children:
          - ReviewCenter-SigningService-FailedChecksMasked-HandInFirst

      - id: ReviewCenter-Core-Signatures-SlotBallotAcknowledge
        title: >-
          The Core subsystem shall require the acknowledgement of the other signed slots, with the
          SignaturesWouldBecomeOutOfDate rule and before anything is stored, when removing a slot, or a reviewer
          leaving a slot, would change the consolidated standing, and so the digest.
        justification: |
          Taking a ballot out of the consolidation can change the standing just like a new ballot, so it needs the
          same protection of the signatures.
        children:
          - ReviewCenter-SigningService-SlotBallotImpact
          - ReviewCenter-SigningService-SlotBallotImpact-Departure

      - id: ReviewCenter-Core-Signatures-SlotBallotNotNeeded
        title: >-
          The Core subsystem shall not ask for an acknowledgement when a reviewer leaves a slot, or a slot is removed,
          and the consolidated standing, and so the digest, stays as it is.
        justification: |
          Where no signature would be lost, a question would only be noise.
        children:
          - ReviewCenter-SigningService-SlotBallotImpact-StandingKept
          - ReviewCenter-SigningService-SlotBallotImpact-RemoveKept

      - id: ReviewCenter-Core-Signatures-SlotBallotState
        title: >-
          The Core subsystem shall return with the approval status of a review the state of the ballot of every slot:
          not started, draft or handed in.
        justification: |
          Reviewers see who is still working on a ballot without opening each one.
        children:
          - ReviewCenter-SigningService-SlotBallotState

      - id: ReviewCenter-Core-Signatures-SlotBallotStateNoChecklist
        title: >-
          The Core subsystem shall return no ballot state for the slots of a review without a checklist.
        justification: |
          Without a checklist there is no ballot to be in any state.
        children:
          - ReviewCenter-SigningService-SlotBallotState-NoChecklist

      - id: ReviewCenter-Core-Signatures-SlotBallotStateMasked
        title: >-
          The Core subsystem shall keep the ballot state of every slot when the status is masked for a viewer who may
          not see the others.
        justification: |
          The state of a ballot, not started, draft, or handed in, does not give away what it answers.
        children:
          - ReviewCenter-SigningService-SlotBallotState-Masked

      - id: ReviewCenter-Core-Signatures-SignApproved
        title: >-
          The Core subsystem shall record the outcome Approved on a signature when the submitted ballots do not agree
          on any Fail.
        justification: |
          The outcome of a signature follows from the ballots, and not from the wish of the signer.
        children:
          - ReviewCenter-SigningService-Sign-OutcomeApproved
          - ReviewCenter-SigningService-RejectedOutcome-Approved

      - id: ReviewCenter-Core-Signatures-Rejected
        title: >-
          The Core subsystem shall record the outcome Rejected on a signature when the submitted ballots agree on at
          least one Fail.
        justification: |
          A failed check is a finding, so it leads to a rejection that states its reasons and not to a review that
          nobody can sign.
        children:
          - ReviewCenter-SigningService-Sign-OutcomeRejected
          - ReviewCenter-SigningService-RejectedOutcome

      - id: ReviewCenter-Core-Signatures-RejectedConclusion
        title: >-
          The Core subsystem shall refuse the signature of a Rejected outcome with the ConclusionRequired rule when
          the conclusion text is blank and that is the only blocker.
        justification: |
          A rejection without reasons would leave the author with nothing to act on.
        children:
          - ReviewCenter-SigningService-Blockers-RejectedNoConclusion
          - ReviewCenter-SigningService-RejectedOutcome-ConclusionRequired

      - id: ReviewCenter-Core-Signatures-RejectedMessage
        title: >-
          The Core subsystem shall give the message "A rejected review needs a conclusion stating the reasons." with
          the ConclusionRequired rule.
        justification: |
          The refusal must say what to do, in words that do not change.
        children:
          - ReviewCenter-SigningService-RejectedOutcome-Message

      - id: ReviewCenter-Core-Signatures-RejectedBlockers
        title: >-
          The Core subsystem shall refuse the signature of a Rejected outcome with the SigningNotAllowed rule that
          lists every blocker, the missing conclusion included, when the conclusion is not the only blocker.
        justification: |
          A signer who has more than one thing to do should be told all of them at once.
        children:
          - ReviewCenter-SigningService-RejectedOutcome-ListsBlockers

      - id: ReviewCenter-Core-Signatures-RejectedLocks
        title: >-
          The Core subsystem shall lock a review that is concluded as Rejected.
        justification: |
          A rejection is a conclusion like an approval, so what it concluded must not move afterwards.
        children:
          - ReviewCenter-SigningService-RejectedOutcome-Locks

      - id: ReviewCenter-Core-Signatures-RejectedReopen
        title: >-
          The Core subsystem shall let an administrator reopen a review that is concluded as Rejected, as any concluded
          review.
        justification: |
          A rejected review is worked on again after the findings are dealt with, so it needs the same way back as an
          approved one.
        children:
          - ReviewCenter-SigningService-RejectedOutcome-Reopen

      - id: ReviewCenter-Core-Signatures-AuditOutcome
        title: >-
          The Core subsystem shall write the outcome of a signature into the audit entry of the signature.
        justification: |
          The audit trail must tell an approval from a rejection.
        children:
          - ReviewCenter-SigningService-RejectedOutcome-AuditOutcome

      - id: ReviewCenter-Core-Signatures-ThreadAcknowledge
        title: >-
          The Core subsystem shall refuse, with the SignaturesWouldBecomeOutOfDate rule, to start a thread that is
          included in the report, to reply with a comment that is included, to promote a Question to a Finding, to
          demote a Finding to a Question, to change whether a reply is included, and to resolve a Finding with a note,
          when a signature is current and the caller has not acknowledged the affected slots.
        justification: |
          Each of these changes the content that the signatures cover, so none of them may withdraw a signature
          unnoticed.
        children:
          - ReviewCenter-ThreadService-SignatureImpact
          - ReviewCenter-ThreadService-SignatureImpact-Reply
          - ReviewCenter-ThreadService-SignatureImpact-Promote
          - ReviewCenter-ThreadService-SignatureImpact-Demote
          - ReviewCenter-ThreadService-SignatureImpact-CommentToggle
          - ReviewCenter-ThreadService-SignatureImpact-Resolve

      - id: ReviewCenter-Core-Signatures-ThreadNames
        title: >-
          The Core subsystem shall name in the SignaturesWouldBecomeOutOfDate refusal of a thread change the slot
          number and the signer of each slot whose signature is current, and no slot that holds no current signature.
        justification: |
          The caller must see whose signatures they would withdraw, and only those.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-NamesSlots
          - ReviewCenter-ThreadService-SignatureImpact-NamesSlots-OnlySigned

      - id: ReviewCenter-Core-Signatures-ThreadAcknowledged
        title: >-
          The Core subsystem shall store a thread change when the caller has acknowledged the affected slots, and make
          the signatures of the acknowledged slots out of date.
        justification: |
          A caller who accepts the consequences must be able to proceed, and the withdrawn signatures must show it.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-Acknowledged
          - ReviewCenter-ThreadService-SignatureImpact-Acknowledged-OutOfDate

      - id: ReviewCenter-Core-Signatures-ThreadNothingStored
        title: >-
          The Core subsystem shall store nothing when it refuses a thread or a reply for the signatures that would
          become out of date.
        justification: |
          A refused change must leave the record as it was.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-NothingStored

      - id: ReviewCenter-Core-Signatures-ThreadAfterValidation
        title: >-
          The Core subsystem shall validate a thread request before it asks for an acknowledgement, so that a request
          that is not valid is reported as that error and not as the signature impact.
        justification: |
          A caller should not be asked to confirm a change that could never be made.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-AfterValidation

      - id: ReviewCenter-Core-Signatures-ThreadNotFound
        title: >-
          The Core subsystem shall report a reply to a thread that does not exist with the not-found rule and not
          with the SignaturesWouldBecomeOutOfDate rule.
        justification: |
          The real mistake of the caller must be the one that is reported.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-ThreadNotFound

      - id: ReviewCenter-Core-Signatures-ThreadNotNeeded
        title: >-
          The Core subsystem shall need no acknowledgement, and leave the signatures current, for resolving a Finding
          that is already resolved, for resolving a Question, for reopening a resolved thread, and for a thread or
          a reply that is not included in the report.
        justification: |
          These changes do not alter what the signatures cover, so they must not ask for a confirmation.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-ResolvedAgain
          - ReviewCenter-ThreadService-SignatureImpact-ResolvedAgain-SignaturesCurrent
          - ReviewCenter-ThreadService-SignatureImpact-ChatThread
          - ReviewCenter-ThreadService-SignatureImpact-ChatThread-SignaturesCurrent
          - ReviewCenter-ThreadService-SignatureImpact-ChatReply
          - ReviewCenter-ThreadService-SignatureImpact-ChatReply-SignaturesCurrent
          - ReviewCenter-ThreadService-SignatureImpact-ResolveQuestion
          - ReviewCenter-ThreadService-SignatureImpact-Reopen

      - id: ReviewCenter-Core-Signatures-ThreadRestored
        title: >-
          The Core subsystem shall restore the original record digest when a promoted thread is demoted again.
        justification: |
          A change that is undone must leave the signatures as valid as they were.
        children:
          - ReviewCenter-ThreadService-SignatureImpact-Restored

      - id: ReviewCenter-Core-Signatures-ConclusionText
        title: >-
          The Core subsystem shall let a reviewer who holds a slot of the review, as the primary or as the alternate
          reviewer, write the review conclusion text and store it.
        justification: |
          The reasons of a conclusion belong to the review, and the people who hold the slots are the ones who
          conclude it.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText

      - id: ReviewCenter-Core-Signatures-ConclusionTextLead
        title: >-
          The Core subsystem shall let the lead of the review write the review conclusion text and store it.
        justification: |
          The lead answers for the review, so they must be able to state its conclusion.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Lead

      - id: ReviewCenter-Core-Signatures-ConclusionTextNonMember
        title: >-
          The Core subsystem shall refuse a user who is not a member of the project with the ProjectNotFound rule when
          the user writes the review conclusion text, and store nothing.
        justification: |
          A project that a user may not see must not be revealed by an attempt to write to it.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-NonMember

      - id: ReviewCenter-Core-Signatures-ConclusionTextRefused
        title: >-
          The Core subsystem shall refuse a project member who holds no slot and is not the lead, an auditor, and a
          call through an API token, also for the lead, with the ActorNotAllowed rule when it writes the review
          conclusion text, and store nothing.
        justification: |
          Only the people who answer for the review, signed in as themselves, may conclude it.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-OtherMember
          - ReviewCenter-ChecklistService-ReviewConclusionText-Auditor
          - ReviewCenter-ChecklistService-ReviewConclusionText-ApiToken

      - id: ReviewCenter-Core-Signatures-ConclusionTextCanSet
        title: >-
          The Core subsystem shall tell that a reviewer who holds a slot and the lead may write the review conclusion
          text, and that nobody may when there is no actor, when the actor uses an API token, or when the review does
          not exist, and that another member, an auditor, and a user outside the project may not.
        justification: |
          A user interface needs to know in advance whether to offer the field.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-CanSet
          - ReviewCenter-ChecklistService-ReviewConclusionText-CanSetNobody

      - id: ReviewCenter-Core-Signatures-ConclusionTextNormalized
        title: >-
          The Core subsystem shall store the review conclusion text with each carriage return and line feed pair as a
          single line feed and without leading and trailing white space.
        justification: |
          The same text from different systems must give the same stored value and the same digest.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Normalized

      - id: ReviewCenter-Core-Signatures-ConclusionTextBlank
        title: >-
          The Core subsystem shall store a review conclusion text that is blank as no text.
        justification: |
          A blank text and no text mean the same, so they must not be two different records.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Blank

      - id: ReviewCenter-Core-Signatures-ConclusionTextMaxLength
        title: >-
          The Core subsystem shall accept a review conclusion text of exactly 4000 characters.
        justification: |
          The limit must be a clear number that a user can stay within.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-MaxLength

      - id: ReviewCenter-Core-Signatures-ConclusionTextTooLong
        title: >-
          The Core subsystem shall refuse a review conclusion text of more than 4000 characters with the
          ConclusionTextInvalid rule.
        justification: |
          A conclusion is meant to be read, and an unlimited text would let one field hold anything.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-TooLong

      - id: ReviewCenter-Core-Signatures-ConclusionTextControl
        title: >-
          The Core subsystem shall refuse a review conclusion text that contains a control character, such as U+0001,
          or a carriage return that is not part of a carriage return and line feed pair, also at the start or at the
          end of the text, with the ConclusionTextInvalid rule.
        justification: |
          Control characters cannot be shown and can break the reports that carry the text.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Control
          - ReviewCenter-ChecklistService-ReviewConclusionText-CarriageReturn

      - id: ReviewCenter-Core-Signatures-ConclusionTextLocked
        title: >-
          The Core subsystem shall refuse a change of the review conclusion text of a concluded review with the
          ReviewLocked rule, and store and record nothing.
        justification: |
          What a concluded review concluded must not move, and the reason of the conclusion is part of it.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Concluded

      - id: ReviewCenter-Core-Signatures-ConclusionTextAcknowledge
        title: >-
          The Core subsystem shall refuse a change of the review conclusion text while a signature is current, with
          the SignaturesWouldBecomeOutOfDate rule and the affected slot named in the message, until the actor
          acknowledges it.
        justification: |
          The text is covered by the signatures, so a change of it must not withdraw one unnoticed.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Acknowledge

      - id: ReviewCenter-Core-Signatures-ConclusionTextAcknowledged
        title: >-
          The Core subsystem shall store the changed review conclusion text after every affected slot is acknowledged
          and leave the signatures of those slots out of date.
        justification: |
          An actor who accepts the consequences must be able to change the text.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Acknowledged

      - id: ReviewCenter-Core-Signatures-ConclusionTextNoChange
        title: >-
          The Core subsystem shall report that nothing changed when the review conclusion text is the same as the
          stored one, need no acknowledgement of a signature, and keep the signatures current.
        justification: |
          Saving the same text again changes nothing, so it must have no consequences.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-NoChange
          - ReviewCenter-ChecklistService-ReviewConclusionText-NoChange-Acknowledgement
          - ReviewCenter-ChecklistService-ReviewConclusionText-NoChange-Signature

      - id: ReviewCenter-Core-Signatures-ConclusionTextConcurrent
        title: >-
          The Core subsystem shall refuse a change of the review conclusion text that is overtaken by another change
          of the text with the RecordChanged rule, and keep the text of the other change.
        justification: |
          Two people who edit the text at the same time must not overwrite each other without knowing.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionText-Concurrent

      - id: ReviewCenter-Core-Signatures-ConclusionTextAudit
        title: >-
          The Core subsystem shall record a change of the review conclusion text as an audit entry with the action
          review.conclusion-changed that states the old and the new length of the text, the project and the review,
          and the user who changed it.
        justification: |
          Changes of the conclusion must be traceable to a person.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionTextAudit
          - ReviewCenter-ChecklistService-ReviewConclusionTextAudit-Scope
          - ReviewCenter-ChecklistService-ReviewConclusionTextAudit-Actor

      - id: ReviewCenter-Core-Signatures-ConclusionTextAuditNoText
        title: >-
          The Core subsystem shall never write the review conclusion text into the audit entry.
        justification: |
          The audit trail is read by more people than the review, so it must not carry the text itself.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionTextAudit-NoText

      - id: ReviewCenter-Core-Signatures-ConclusionTextAuditNoChange
        title: >-
          The Core subsystem shall record no audit entry when the review conclusion text is the same as the stored
          one, and none for a change that it refuses.
        justification: |
          The audit trail must hold what happened and nothing else.
        children:
          - ReviewCenter-ChecklistService-ReviewConclusionTextAudit-NoChange
          - ReviewCenter-ChecklistService-ReviewConclusionTextAudit-Refused

      - id: ReviewCenter-Core-ApprovalLock
        title: >-
          The Core subsystem shall treat a review that every slot has signed for the current record with the same
          outcome, as approved or as rejected (with a conclusion text), as concluded and locked.
        justification: |
          An approval is only worth something if the content it approved cannot move afterwards, so a concluded review
          is locked, and it is concluded or not by what its record says now.
        children:
          - ReviewCenter-SigningService-ApprovalLock
          - ReviewCenter-SigningService-ApprovalLock-Derived
        tests:
          - ReviewService_FollowUp_ApprovedIsLockedAndCanBeReopened

      - id: ReviewCenter-Core-ApprovalLock-Concluded
        title: >-
          The Core subsystem shall treat a review as concluded only when it has at least one slot, every slot has a
          submitted ballot and a signature of the current digest that attests the outcome that the record has now, no
          check is pending or disputed, and no thread is open.
        justification: |
          A conclusion that rests on anything less would leave work open behind a signature.
        children:
          - ReviewCenter-SigningService-Concluded
          - ReviewCenter-SigningService-Concluded-NoOpenChecks
          - ReviewCenter-SigningService-Concluded-AllSigned
          - ReviewCenter-SigningService-Concluded-SameOutcome
          - ReviewCenter-SigningService-Concluded-NoOpenThread
          - ReviewCenter-SigningService-OpenThreadRule
          - ReviewCenter-SigningService-OpenThreadRule-OpenThreadBlocks

      - id: ReviewCenter-Core-ApprovalLock-RejectedText
        title: >-
          The Core subsystem shall treat a review whose outcome is Rejected as concluded only when it has a
          conclusion text that is not blank.
        justification: |
          A rejection without reasons would leave the author with nothing to act on.
        children:
          - ReviewCenter-SigningService-Concluded-ConclusionText

      - id: ReviewCenter-Core-ApprovalLock-ApprovedOnly
        title: >-
          The Core subsystem shall treat a concluded review as approved only when its outcome is Approved, and not
          call a review approved while a thread is open.
        justification: |
          Approval is one of two conclusions, and an open thread means that nothing is settled yet.
        children:
          - ReviewCenter-SigningService-Concluded-ApprovedOnly
          - ReviewCenter-SigningService-OpenThreadRule-NotApproved

      - id: ReviewCenter-Core-ApprovalLock-Status
        title: >-
          The Core subsystem shall report in the status of a review whether the review is concluded and with which
          outcome.
        justification: |
          Readers of a review need the conclusion without having to work it out.
        children:
          - ReviewCenter-SigningService-Concluded-ReviewLockDefinition

      - id: ReviewCenter-Core-ApprovalLock-BlockerHint
        title: >-
          The Core subsystem shall word the next step of a review that has blockers as the hint for them, also when
          the review has no slot.
        justification: |
          A review without a slot can still be blocked, and its reader needs to know what to do.
        children:
          - ReviewCenter-SigningService-Concluded-BlockerHint

      - id: ReviewCenter-Core-ApprovalLock-OpenThreadSign
        title: >-
          The Core subsystem shall refuse a signature with the SigningNotAllowed rule while a thread, also one about a
          check, is open, as a rule separate from the comparison of the digest.
        justification: |
          An open thread is unfinished work, so it must stop a signature.
        children:
          - ReviewCenter-SigningService-OpenThreadRule-SignRefused
          - ReviewCenter-SigningService-OpenCheckThread
          - ReviewCenter-SigningService-OpenCheckThread-NotConcluded

      - id: ReviewCenter-Core-ApprovalLock-ChatKeeps
        title: >-
          The Core subsystem shall keep the signatures that exist valid when a chat thread is started after them.
        justification: |
          Chat is not part of what the signers agreed on, so it must not withdraw a signature.
        children:
          - ReviewCenter-SigningService-OpenThreadRule-ChatKeepsSignatures

      - id: ReviewCenter-Core-ApprovalLock-ResolvedConcludes
        title: >-
          The Core subsystem shall allow the signature, and conclude the review, once the last open thread, also one
          about a check, is resolved while every slot holds a signature of the current record.
        justification: |
          Resolving the last open thread is what finishes a review, so it must lead to the conclusion.
        children:
          - ReviewCenter-SigningService-OpenThreadRule-ResolvedConcludes
          - ReviewCenter-SigningService-OpenCheckThread-ResolvedAllowsSign
          - ReviewCenter-SigningService-OpenCheckThread-ResolvedConcludes

      - id: ReviewCenter-Core-ApprovalLock-ResolvedNoAudit
        title: >-
          The Core subsystem shall record no further audit entry when the resolution of the last open thread
          concludes the review.
        justification: |
          The resolution is already recorded, and the conclusion follows from it.
        children:
          - ReviewCenter-SigningService-OpenThreadRule-NoConclusionAudit

      - id: ReviewCenter-Core-ApprovalLock-ChangesRefused
        title: >-
          The Core subsystem shall refuse every thread action, start, reply, resolve, reopen, promote, demote, and the
          inclusion of a comment, on a concluded review with the ReviewLocked rule.
        justification: |
          The threads are the content of the review, so they must not move once it is concluded.
        children:
          - ReviewCenter-ThreadService-ApprovalLock
          - ReviewCenter-ThreadService-ApprovalLock-Report
          - ReviewCenter-ThreadService-ConcludedRefusal
        tests:
          - CoreSubsystem_ApprovedReview_RefusesEveryMutationWithReviewLocked

      - id: ReviewCenter-Core-ApprovalLock-NothingChanged
        title: >-
          The Core subsystem shall leave the threads, the comments and the audit trail of a concluded review as they
          were when it refuses a thread action.
        justification: |
          A refused change must leave no trace behind.
        children:
          - ReviewCenter-ThreadService-ConcludedRefusal-NothingChanged

      - id: ReviewCenter-Core-ApprovalLock-AfterAccess
        title: >-
          The Core subsystem shall check that the actor may see the project before it checks whether the review is
          concluded, so that a user who may not see the project is told ProjectNotFound for every thread action.
        justification: |
          Telling an outsider that a review is concluded would reveal that it exists.
        children:
          - ReviewCenter-ThreadService-ApprovalLock-AfterAccess

      - id: ReviewCenter-Core-ApprovalLock-BeforeFileLookup
        title: >-
          The Core subsystem shall refuse starting a thread in a concluded review with the ReviewLocked rule before the
          file of the new thread is looked up.
        justification: |
          A file that is not found must not hide the fact that the review is locked.
        children:
          - ReviewCenter-ThreadService-ApprovalLock-BeforeFileLookup

      - id: ReviewCenter-Core-ApprovalLock-ReviewNotFound
        title: >-
          The Core subsystem shall report starting a thread in a review that does not exist with the
          ThreadAnchorInvalid rule and not with the ReviewLocked rule.
        justification: |
          A review that does not exist cannot be locked, so the error must name the real problem.
        children:
          - ReviewCenter-ThreadService-ApprovalLock-ReviewNotFound

      - id: ReviewCenter-Core-ApprovalLock-OpenThreadAccepts
        title: >-
          The Core subsystem shall accept every thread action in a review whose slots are all signed but that still
          has an open thread.
        justification: |
          Such a review is not concluded, so its threads must stay open for work.
        children:
          - ReviewCenter-ThreadService-ApprovalLock-OpenThread

      - id: ReviewCenter-Core-ApprovalLock-SlotChanges
        title: >-
          The Core subsystem shall refuse to add, change, or remove a slot while the review is locked, with the
          ReviewLocked rule.
        justification: |
          The slots say who must sign, so they must not change once the review is concluded.
        children:
          - ReviewCenter-SigningService-ApprovalLock-SlotChanges

      - id: ReviewCenter-Core-ApprovalLock-ChecklistRefused
        title: >-
          The Core subsystem shall refuse an answer, a change of the applicability of a section in either direction,
          and the hand-in of a ballot for a review that is approved with the ReviewLocked rule, and change nothing,
          reporting the lock before it asks for the acknowledgement of signatures.
        justification: |
          The checklist answers are the content that was approved, so they must not move.
        children:
          - ReviewCenter-ChecklistService-ApprovalLock
          - ReviewCenter-ChecklistService-ApprovalLock-BeforeImpact

      - id: ReviewCenter-Core-ApprovalLock-SignatureRefused
        title: >-
          The Core subsystem shall refuse a further signature of a locked review with the ReviewLocked rule.
        justification: |
          A review that is concluded has nothing left to sign.
        children:
          - ReviewCenter-SigningService-ApprovalLock-Sign
        tests:
          - CoreSubsystem_ApprovedReview_RefusesEveryMutationWithReviewLocked

      - id: ReviewCenter-Core-ApprovalLock-Message
        title: >-
          The Core subsystem shall say in the message of a refusal because of the lock that the review is concluded
          and has to be reopened first.
        justification: |
          The person who is refused must be told what to do.
        children:
          - ReviewCenter-SigningService-ApprovalLock-Message

      - id: ReviewCenter-Core-ApprovalLock-Reopen
        title: >-
          The Core subsystem shall let an administrator of the project or a system administrator reopen a locked
          review with a reason.
        justification: |
          Allowing only a deliberate, explained reopening by someone responsible for the project keeps the record that
          was signed the record that exists.
        children:
          - ReviewCenter-SigningService-Reopen
          - ReviewCenter-SigningService-Reopen-SystemAdmin
        tests:
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures
          - ReviewService_FollowUp_ApprovedIsLockedAndCanBeReopened

      - id: ReviewCenter-Core-ApprovalLock-ReopenRefused
        title: >-
          The Core subsystem shall refuse to reopen a review for an actor who is neither an administrator of the
          project nor a system administrator, and for an actor that came through a personal access token, with the
          ActorNotAllowed rule.
        justification: |
          Reopening withdraws every signature, so only people who answer for the project may do it, in person.
        children:
          - ReviewCenter-SigningService-Reopen-OthersRefused
          - ReviewCenter-SigningService-Reopen-NoApiToken

      - id: ReviewCenter-Core-ApprovalLock-ReopenReason
        title: >-
          The Core subsystem shall refuse to reopen a review without a reason of at least one character, or with a
          reason of more than 250 characters, after trimming, with the ReopenReasonInvalid rule.
        justification: |
          A reopening must be explained, and the explanation must be short enough to read in the history.
        children:
          - ReviewCenter-SigningService-Reopen-ReasonRequired
          - ReviewCenter-SigningService-Reopen-ReasonLimit

      - id: ReviewCenter-Core-ApprovalLock-ReopenUnlockedRefused
        title: >-
          The Core subsystem shall refuse to reopen a review that is not locked, also one whose slots are all signed
          but that still has an open thread, with the ReviewNotLocked rule.
        justification: |
          Reopening a review that is not concluded would withdraw signatures for nothing.
        children:
          - ReviewCenter-SigningService-Reopen-NotLocked
          - ReviewCenter-SigningService-Reopen-OpenThread
        tests:
          - CoreSubsystem_ReopenReview_OfUnlockedReview_ThrowsReviewNotLocked

      - id: ReviewCenter-Core-ApprovalLock-ReopenMissing
        title: >-
          The Core subsystem shall refuse to reopen a review that does not exist, with the ReviewNotFound rule.
        justification: |
          The caller must be told that the review they named is not there.
        children:
          - ReviewCenter-SigningService-Reopen-MissingReview

      - id: ReviewCenter-Core-ApprovalLock-ReopenStored
        title: >-
          The Core subsystem shall store the reopening with the user, the time, the reason, and the digest of the
          approved record.
        justification: |
          The history of a review must say who reopened it, when, why, and what was approved before.
        children:
          - ReviewCenter-SigningService-Reopen-Stored

      - id: ReviewCenter-Core-ApprovalLock-ReopenAudit
        title: >-
          The Core subsystem shall record the reopening in the audit trail as review.reopened, with the reason and the
          digest, in the same call that stores the reopening.
        justification: |
          A reopening that could be stored without its audit entry would leave a gap in the trail.
        children:
          - ReviewCenter-SigningService-Reopen-Audit
          - ReviewCenter-SigningService-Reopen-AuditAtomic

      - id: ReviewCenter-Core-ApprovalLock-HistoryKept
        title: >-
          The Core subsystem shall keep every earlier signature as history after the reopening, out of date for good,
          even when the content is changed back.
        justification: |
          A signature was given for a review that was then withdrawn, so it must stay as history and never count again.
        children:
          - ReviewCenter-SigningService-Reopen-KeepsSignatures
          - ReviewCenter-SigningService-Reopen-CountInvalidates
          - ReviewCenter-RecordDigest-ReopenCount
          - ReviewCenter-RecordDigest-ReopenCount-Change
          - ReviewCenter-RecordDigest-ReopenCount-Zero

      - id: ReviewCenter-Core-ApprovalLock-BallotsStay
        title: >-
          The Core subsystem shall leave the ballots of the slots as they are when a review is reopened, so that a
          submitted ballot stays submitted.
        justification: |
          Reopening withdraws the approval, not the work of the reviewers.
        children:
          - ReviewCenter-SigningService-Reopen-BallotsStay

      - id: ReviewCenter-Core-ApprovalLock-FreshSignatures
        title: >-
          The Core subsystem shall need fresh signatures from every slot before a reopened review is approved again.
        justification: |
          An approval must always be a statement about the review as it is now.
        children:
          - ReviewCenter-SigningService-Reopen-FreshSignatures
        tests:
          - CoreSubsystem_ReopenReview_RequiresAdminAndReasonAndNeedsFreshSignatures

      - id: ReviewCenter-Core-IndependentReviewers
        title: >-
          The Core subsystem shall let each project require independent reviewers, on for a new project.
        justification: |
          A review in which the author is also the approver gives little assurance. Making independence the default,
          while leaving a project that must let one person do both a recorded way to switch it off, keeps the rule
          strong without blocking such a project.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting

      - id: ReviewCenter-Core-IndependentReviewers-Slot
        title: >-
          The Core subsystem shall, when the project requires independent reviewers, refuse with the
          ReviewerNotIndependent rule to put the user who created the review into a slot as primary reviewer or as
          alternate, new or existing.
        justification: |
          The rule applies to the user who created the review in this tool and not to the authors of the commits, which
          the tool cannot know.
        children:
          - ReviewCenter-SigningService-IndependentReviewers
          - ReviewCenter-SigningService-IndependentReviewers-Update
        tests:
          - CoreSubsystem_IndependentReviewers_AuthorCannotBeSlotReviewerOrSign

      - id: ReviewCenter-Core-IndependentReviewers-Sign
        title: >-
          The Core subsystem shall, when the project requires independent reviewers, refuse with the
          ReviewerNotIndependent rule the signature of the user who created the review, also for a slot that was
          filled before the setting was switched on.
        justification: |
          A slot that was filled before the rule was switched on must not let the author approve their own review.
        children:
          - ReviewCenter-SigningService-IndependentReviewers-Signing
        tests:
          - CoreSubsystem_IndependentReviewers_AuthorCannotBeSlotReviewerOrSign

      - id: ReviewCenter-Core-IndependentReviewers-NotRequired
        title: >-
          The Core subsystem shall enforce no independence of the reviewers when the project does not require
          independent reviewers.
        justification: |
          A project that must let one person do both needs a way to do so.
        children:
          - ReviewCenter-SigningService-IndependentReviewers-SettingOff

      - id: ReviewCenter-Core-IndependentReviewers-TokenCreator
        title: >-
          The Core subsystem shall treat the owner of the access token as the user who created a review that was
          created with an access token.
        justification: |
          A review created through the API must not escape the independence rule by having no author.
        tests:
          - CoreSubsystem_ApiTokenReview_AuthorIsTokenUser

      - id: ReviewCenter-Core-IndependentReviewers-AdminOnly
        title: >-
          The Core subsystem shall let an administrator of the project and a system administrator change the setting
          that requires independent reviewers.
        justification: |
          Only someone who answers for the project should relax a rule that protects its reviews.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting-Change
        tests:
          - CoreSubsystem_IndependentReviewers_SettingChangeIsAuditedAndAdminOnly

      - id: ReviewCenter-Core-IndependentReviewers-Refused
        title: >-
          The Core subsystem shall refuse a plain member of the project the change of the setting with the
          actor-not-allowed rule, and an actor who cannot see the project with the project-not-found rule.
        justification: |
          A project that a user may not see must not be revealed, and a member without the role must not relax the rule.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting-PlainMember
          - ReviewCenter-ProjectService-IndependentReviewersSetting-Hidden

      - id: ReviewCenter-Core-IndependentReviewers-NeverToken
        title: >-
          The Core subsystem shall refuse the change of the setting for an actor that came through an access token,
          even for an administrator.
        justification: |
          A token can be used by software that nobody watches, so it must not change a rule of the project.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting-ApiToken

      - id: ReviewCenter-Core-IndependentReviewers-Stale
        title: >-
          The Core subsystem shall refuse the change of the setting with the RecordChanged rule when the value that the
          caller saw is no longer the stored one.
        justification: |
          Two administrators must not overwrite each other without knowing.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting-Stale

      - id: ReviewCenter-Core-IndependentReviewers-Unchanged
        title: >-
          The Core subsystem shall change and record nothing when the new value of the setting equals the value that
          the caller saw.
        justification: |
          A change that changes nothing must not fill the trail.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting-Unchanged

      - id: ReviewCenter-Core-IndependentReviewers-Audit
        title: >-
          The Core subsystem shall record each change of the setting in the audit trail as
          project.independent-reviewers-changed, with the old and the new value.
        justification: |
          A relaxed rule must be visible in the history.
        children:
          - ReviewCenter-ProjectService-IndependentReviewersSetting-Audit
        tests:
          - CoreSubsystem_IndependentReviewers_SettingChangeIsAuditedAndAdminOnly

      - id: ReviewCenter-Core-ReviewRuleSwitches
        title: >-
          The Core subsystem shall keep, for each project, a switch for each of two further review rules (authors
          answering the checklist of their own review, and the person who reopened a review signing it again), and let
          an administrator of the project or a system administrator change them.
        justification: |
          Every project has a recorded choice. The change rules are the ones of the independence rule, so that a
          project that has to relax a rule does so in a way that is visible in the history.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-Core-ReviewRuleSwitches-DefaultOn
        title: >-
          The Core subsystem shall keep the two further review rules on for a new project.
        justification: |
          The default is on, so that a project is only without a rule when somebody chose that.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-NewProject

      - id: ReviewCenter-Core-ReviewRuleSwitches-DefaultExisting
        title: >-
          The Core subsystem shall keep the two further review rules, authors answering the checklist of their own
          review and the person who reopened a review signing it again, on and enforce them for a project that exists
          and whose rules were never changed.
        justification: |
          A project that nobody set up must not be without the protection of the rules. The database of an earlier
          version has no column for the rules and must be created again, so the claim is about the projects of the
          current database.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-ExistingProject
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ExistingProject_KeepsBothRulesOnAndEnforced

      - id: ReviewCenter-Core-ReviewRuleSwitches-Refused
        title: >-
          The Core subsystem shall refuse a plain member of the project the change of a review rule with the
          actor-not-allowed rule, and an actor who cannot see the project with the project-not-found rule.
        justification: |
          A project that a user may not see must not be revealed, and a member without the role must not relax a rule.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-PlainMember
          - ReviewCenter-ProjectService-ReviewRuleSwitches-Hidden
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-Core-ReviewRuleSwitches-NeverToken
        title: >-
          The Core subsystem shall refuse the change of a review rule for an actor that came through an access token,
          even for an administrator.
        justification: |
          A token can be used by software that nobody watches, so it must not change a rule of the project.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-ApiToken

      - id: ReviewCenter-Core-ReviewRuleSwitches-Stale
        title: >-
          The Core subsystem shall refuse the change of a review rule with the RecordChanged rule when the value that
          the caller saw is no longer the stored one.
        justification: |
          Two administrators must not overwrite each other without knowing.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-Stale

      - id: ReviewCenter-Core-ReviewRuleSwitches-Unchanged
        title: >-
          The Core subsystem shall change and record nothing when the new value of a review rule equals the value that
          the caller saw.
        justification: |
          A change that changes nothing must not fill the trail.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-Unchanged

      - id: ReviewCenter-Core-ReviewRuleSwitches-Audit
        title: >-
          The Core subsystem shall record each change of a review rule in the audit trail, as
          project.review-rule-changed with the property name and the old and the new value for a further rule, and as
          project.independent-reviewers-changed for the independence rule.
        justification: |
          A relaxed rule must be visible in the history.
        children:
          - ReviewCenter-ProjectService-ReviewRuleSwitches-Audit
          - ReviewCenter-ProjectService-ReviewRuleSwitches-IndependenceAudit
        tests:
          - CoreSubsystem_ReviewRuleSwitches_ChangeIsAuditedAdminOnlyAndStale

      - id: ReviewCenter-Core-ReviewRules
        title: >-
          The Core subsystem shall enforce the author rule of a project through its services, whatever the caller:
          while a project requires that authors do not answer the checklist, the author of a review cannot answer a
          check, and the refusal says that authors cannot answer the checklist of their own review.
        justification: |
          Enforcing the rules in the services means that the web pages, the API, and the command line cannot bypass
          them.
        children:
          - ReviewCenter-ChecklistService-AuthorRule
          - ReviewCenter-ChecklistService-AuthorRule-Message
        tests:
          - CoreSubsystem_ReviewRules_EnforcedAndSwitchableOff
          - ThreadService_Threads_AuthorWhileRuleIsOn_AreNotAffected

      - id: ReviewCenter-Core-ReviewRules-AuthorSection
        title: >-
          The Core subsystem shall refuse the author of a review, while the author rule is on, a change of the
          applicability of a section, whatever the letter case of the user name.
        justification: |
          Marking a section as not applicable is the same as answering its checks.
        children:
          - ReviewCenter-ChecklistService-AuthorRule-Section

      - id: ReviewCenter-Core-ReviewRules-AuthorOthers
        title: >-
          The Core subsystem shall let another reviewer who holds the slot answer while the author rule is on.
        justification: |
          The rule restricts the author and nobody else.
        children:
          - ReviewCenter-ChecklistService-AuthorRule-OtherActors

      - id: ReviewCenter-Core-ReviewRules-AuthorBeforeLock
        title: >-
          The Core subsystem shall report the AuthorCannotAnswer rule before the ReviewLocked rule when the author
          changes an approved review.
        justification: |
          The author should learn that they may not answer at all, and not only that the review is locked.
        children:
          - ReviewCenter-ChecklistService-AuthorRule-BeforeLock

      - id: ReviewCenter-Core-ReviewRules-AuthorBlocked
        title: >-
          The Core subsystem shall mark the checklist as blocked for the author of the review while the author rule is
          on, whatever the letter case of the user name.
        justification: |
          The pages need to tell the author that they cannot answer before they try.
        children:
          - ReviewCenter-ChecklistService-AuthorRule-BlockedFlag

      - id: ReviewCenter-Core-ReviewRules-AuthorBlockedOthers
        title: >-
          The Core subsystem shall not mark the checklist as blocked for another viewer or without a viewer.
        justification: |
          Other people can answer, so they must not be told that they cannot.
        children:
          - ReviewCenter-ChecklistService-AuthorRule-BlockedFlag-OtherViewers

      - id: ReviewCenter-Core-ReviewRules-ReopenerSigning
        title: >-
          The Core subsystem shall, while a project requires that the person who reopened a review does not sign it
          again, refuse the signature of a user who reopened the review at any time before with the
          ReopenerCannotSign rule.
        justification: |
          A person who reopened a review should not be the one who approves the result.
        children:
          - ReviewCenter-SigningService-ReopenerRule
          - ReviewCenter-SigningService-ReopenerRule-AnyEarlierReopen

      - id: ReviewCenter-Core-ReviewRules-ReopenerOrder
        title: >-
          The Core subsystem shall check the ReopenerCannotSign rule after the independence check and before the
          password is checked.
        justification: |
          A user who is both the author and a reopener must be told about the independence, and a password must not be
          asked for a signature that is refused anyway.
        children:
          - ReviewCenter-SigningService-ReopenerRule-AfterIndependence
          - ReviewCenter-SigningService-ReopenerRule-BeforePassword

      - id: ReviewCenter-Core-ReviewRules-ReopenerNoAttempt
        title: >-
          The Core subsystem shall neither count nor record a failed attempt when it refuses a signature with the
          ReopenerCannotSign rule.
        justification: |
          A refusal by a rule is not a wrong password, so it must not lead to a lockout.
        children:
          - ReviewCenter-SigningService-ReopenerRule-NoFailedAttempt

      - id: ReviewCenter-Core-ReviewRules-ReopenerBallot
        title: >-
          The Core subsystem shall let the person who reopened a review answer in and hand in the ballot of the own
          slot while the reopener rule is on.
        justification: |
          The rule keeps that person from signing, and it must not keep them from taking part in the review.
        children:
          - ReviewCenter-ChecklistService-ReopenerBallot
          - ReviewCenter-ChecklistService-ReopenerBallot-Submit

      - id: ReviewCenter-Core-ReviewRules-StrandedSlot
        title: >-
          The Core subsystem shall, while the project requires that the person who reopened a review does not sign it
          again, refuse a reopening with the ReopenWouldStrandSlot rule when after it a slot of the review would have
          nobody who may sign it, counting the primary reviewer and the alternate of every slot and treating the user
          who reopens and every user who reopened the review before as unable to sign.
        justification: |
          A reopening that leaves a slot with nobody to sign it would make the review impossible to approve.
        children:
          - ReviewCenter-SigningService-StrandedSlot
          - ReviewCenter-SigningService-StrandedSlot-BothReviewers
          - ReviewCenter-SigningService-StrandedSlot-ReopenBlocked

      - id: ReviewCenter-Core-ReviewRules-StrandedSlotNames
        title: >-
          The Core subsystem shall name the stranded slots, by their numbers, in the message of the
          ReopenWouldStrandSlot rule.
        justification: |
          The administrator needs to know which slots to fix.
        children:
          - ReviewCenter-SigningService-StrandedSlot-NamesSlots

      - id: ReviewCenter-Core-ReviewRules-StrandedSlotNothingStored
        title: >-
          The Core subsystem shall store nothing when it refuses a reopening with the ReopenWouldStrandSlot rule.
        justification: |
          A refused reopening must leave the review as it was.
        children:
          - ReviewCenter-SigningService-StrandedSlot-NothingStored

      - id: ReviewCenter-Core-ReviewRules-StrandedSlotAllowed
        title: >-
          The Core subsystem shall reopen the review when after it every slot keeps somebody who may sign it.
        justification: |
          The guard must only stop a reopening that would cause the problem.
        children:
          - ReviewCenter-SigningService-StrandedSlot-SlotKeepsSomebody

      - id: ReviewCenter-Core-ReviewRules-RuleOff
        title: >-
          The Core subsystem shall not restrict a project by a review rule that it switched off: the author may answer
          and is not marked as blocked, the reopener may sign, and a reopening may strand a slot.
        justification: |
          A rule that an administrator can switch off, with a record, leaves a project that has to let one person do
          everything able to do so.
        children:
          - ReviewCenter-ChecklistService-AuthorRule-RuleOff
          - ReviewCenter-ChecklistService-AuthorRule-BlockedFlag-RuleOff
          - ReviewCenter-SigningService-ReopenerRule-RuleOff
          - ReviewCenter-SigningService-StrandedSlot-RuleOff

      - id: ReviewCenter-Core-AuditTrail
        title: >-
          The Core subsystem shall record every change of projects, reviews, threads, checklists, reviewer slots,
          signatures, and users, and every sign-in event, as an entry of a hash-chained audit trail that names the
          actor, the action, and a short detail.
        justification: |
          A review record is only trustworthy if its history can be checked. Hashing each entry over its
          predecessor makes every entry depend on the whole history before it, without a special database.
        children:
          - ReviewCenter-AuditChain-Hash
          - ReviewCenter-AuditChain-Hash-LowercaseHex
          - ReviewCenter-AuditChain-Hash-IgnoresStoredHash
          - ReviewCenter-AuditChain-Hash-UtcTime
          - ReviewCenter-AuditChain-Hash-EachField
          - ReviewCenter-AuditChain-Hash-AbsentReview
          - ReviewCenter-AuditChain-Hash-NoTextMoves
          - ReviewCenter-AuditChain-Hash-Unicode
          - ReviewCenter-AuditChain-Hash-NullEntry

      - id: ReviewCenter-Core-AuditTrail-Verify
        title: >-
          The Core subsystem shall verify a sequence of audit entries by taking one entry at a time, report an
          intact sequence with the hash of its last entry as its head, and report an empty sequence as intact.
        justification: |
          Verification has to work on a trail of any size, so it streams the entries instead of loading them.
        children:
          - ReviewCenter-AuditChain-Verify
          - ReviewCenter-AuditChain-Verify-Head
          - ReviewCenter-AuditChain-Verify-Empty
          - ReviewCenter-AuditChain-Verify-OneByOne

      - id: ReviewCenter-Core-AuditTrail-TamperDetected
        title: >-
          The Core subsystem shall detect that an entry in the middle of the audit trail was edited, deleted,
          inserted, duplicated, or reordered, and report the sequence of the first bad entry.
        justification: |
          Hash chaining makes tampering with the middle of the history evident without a special database. It does
          not detect the removal of the newest entries or a complete rewrite by someone with write access to the
          database, unless the head hash was recorded elsewhere.
        children:
          - ReviewCenter-AuditChain-Verify-Edited
          - ReviewCenter-AuditChain-Verify-EditedRehashed
          - ReviewCenter-AuditChain-Verify-Missing
          - ReviewCenter-AuditChain-Verify-MissingFirst
          - ReviewCenter-AuditChain-Verify-FirstOtherSequence
          - ReviewCenter-AuditChain-Verify-Inserted
          - ReviewCenter-AuditChain-Verify-Duplicated
          - ReviewCenter-AuditChain-Verify-OutOfOrder
          - ReviewCenter-AuditChain-Verify-WrongPredecessor
          - ReviewCenter-AuditChain-Verify-FirstOfTwo
          - ReviewCenter-AuditChain-Verify-StopsReading
          - ReviewCenter-AuditChain-Verify-HeadOfLastGood
          - ReviewCenter-AuditChain-Verify-StaysFailed

      - id: ReviewCenter-Core-AuditTrail-Detail
        title: >-
          The Core subsystem shall keep the detail of an audit entry a short, single line of cleaned text that holds
          no password and no free text, and identify text that must not be stored by a short hash.
        justification: |
          Control characters, long text, and secrets in the trail would make it unreadable, injectable, or
          dangerous to export.
        children:
          - ReviewCenter-AuditChain-Text
          - ReviewCenter-AuditChain-Text-Plain
          - ReviewCenter-AuditChain-Text-Trim
          - ReviewCenter-AuditChain-Text-Null
          - ReviewCenter-AuditChain-Text-LoneSurrogate
          - ReviewCenter-AuditChain-Text-SurrogatePair
          - ReviewCenter-AuditChain-Text-LimitCut
          - ReviewCenter-AuditChain-Text-LimitKept
          - ReviewCenter-AuditChain-Text-NoPairSplit
          - ReviewCenter-AuditChain-Text-LimitBelowFour
          - ReviewCenter-AuditChain-Text-ShortHash
          - ReviewCenter-AuditChain-Text-ShortHashNull
          - ReviewCenter-AuditChain-Text-ShortHashDiffers

      - id: ReviewCenter-Core-AuditTrail-Actor
        title: >-
          The Core subsystem shall name the actor of an audit entry as the display name and user name of the
          signed-in user, or as the command line when the command line acted.
        justification: |
          An audit trail must say who acted, also for changes that no signed-in user made.
        children:
          - ReviewCenter-AuditChain-Text-ActorSignedIn
          - ReviewCenter-AuditChain-Text-ActorCommandLine

      - id: ReviewCenter-Core-AuditTrail-Record
        title: >-
          The Core subsystem shall record each audit draft as the next entry of one gap-free chain, also when
          drafts arrive in parallel, with a strict operation that lets a failure of the store reach the caller and
          a best-effort operation that never does.
        justification: |
          A change must not be lost silently when a change must be audited, and a failing audit write must not
          break an action that may go on without it.
        children:
          - ReviewCenter-AuditService-Record
          - ReviewCenter-AuditService-Record-Parallel
          - ReviewCenter-AuditService-Record-StrictFailure
          - ReviewCenter-AuditService-Record-BestEffort
          - ReviewCenter-AuditService-Record-BestEffortReturnsTrue
          - ReviewCenter-AuditService-Record-BestEffortFailure
          - ReviewCenter-AuditService-Record-ErrorHook
          - ReviewCenter-AuditService-Record-HookFailure
          - ReviewCenter-AuditService-Record-Cancellation
          - ReviewCenter-AuditService-Record-Arguments
        tests:
          - AuditService_RecordAsync_Draft_StoresEntryThatVerifies

      - id: ReviewCenter-Core-AuditTrail-Coalesce
        title: >-
          The Core subsystem shall, for events that a caller can repeat without limit, record the first event of a
          key in a one-minute window and count the repeats instead of recording them.
        justification: |
          A repeated failed sign-in must not fill the trail without limit.
        children:
          - ReviewCenter-AuditService-Coalesce
          - ReviewCenter-AuditService-Coalesce-Repeats
          - ReviewCenter-AuditService-Coalesce-NextWindow
          - ReviewCenter-AuditService-Coalesce-DifferentKeys
          - ReviewCenter-AuditService-Coalesce-KeyLimit
          - ReviewCenter-AuditService-Coalesce-KeyLimitRecovery
          - ReviewCenter-AuditService-Coalesce-CancelledRepeat
          - ReviewCenter-AuditService-Coalesce-CancelledFirst
          - ReviewCenter-AuditService-Coalesce-Cancellation
          - ReviewCenter-AuditService-Coalesce-StoreFailure
          - ReviewCenter-AuditService-Coalesce-StoreFailureReported
          - ReviewCenter-AuditService-Coalesce-Arguments

      - id: ReviewCenter-Core-AuditTrail-CoalesceOverflow
        title: >-
          The Core subsystem shall, when its table of coalesced keys is full of keys that have not expired, count
          the events of new keys instead of recording them, and never fail because of it.
        justification: |
          An attacker who varies the key must not make the table grow without limit or break the caller.
        children:
          - ReviewCenter-AuditService-CoalesceOverflow
          - ReviewCenter-AuditService-CoalesceOverflow-OneEntry
          - ReviewCenter-AuditService-CoalesceOverflow-PreviousCount
          - ReviewCenter-AuditService-CoalesceOverflow-Reported
          - ReviewCenter-AuditService-CoalesceOverflow-NeverThrows

      - id: ReviewCenter-Core-AuditTrail-Pages
        title: >-
          The Core subsystem shall read the audit trail back newest first in pages of 50 entries by default, of
          the size the caller asks for, and never of more than 200 entries.
        justification: |
          A long trail must be read in bounded pages, so that one request cannot load all of it.
        children:
          - ReviewCenter-AuditService-List
          - ReviewCenter-AuditService-List-DefaultPageSize
          - ReviewCenter-AuditService-List-PageSizeAsked
          - ReviewCenter-AuditService-List-PageSizeCap

      - id: ReviewCenter-Core-AuditTrail-Scope
        title: >-
          The Core subsystem shall read the audit trail back for one project, in all its reviews, or for one
          review, and show no entry of another project.
        justification: |
          Project members must see the history of their own project and nothing of another one.
        children:
          - ReviewCenter-AuditService-List-Project
          - ReviewCenter-AuditService-List-ProjectScope
          - ReviewCenter-AuditService-List-Review

      - id: ReviewCenter-Core-AuditTrail-Cursors
        title: >-
          The Core subsystem shall let a reader move through the audit trail by an older cursor and a newer cursor,
          offered only when entries exist behind or before the page, so that every entry is shown exactly once.
        justification: |
          Paging must neither skip nor repeat an entry, and must not offer a page that does not exist.
        children:
          - ReviewCenter-AuditService-List-Older
          - ReviewCenter-AuditService-List-Newer
          - ReviewCenter-AuditService-List-PagingOnce
          - ReviewCenter-AuditService-List-PagingNewer
          - ReviewCenter-AuditService-List-EmptyTrail
          - ReviewCenter-AuditService-List-BeforeWins

      - id: ReviewCenter-Core-AuditTrail-Filter
        title: >-
          The Core subsystem shall narrow the listing of the audit trail by project, review, actor, action, group
          of actions, and range of UTC days, with all conditions of the filter together, also while paging.
        justification: |
          An auditor looks for one actor, one action, or one period in a trail too long to read through.
        children:
          - ReviewCenter-AuditService-Filter
          - ReviewCenter-AuditService-Filter-Project
          - ReviewCenter-AuditService-Filter-Review
          - ReviewCenter-AuditService-Filter-ActorText
          - ReviewCenter-AuditService-Filter-ActorIdentity
          - ReviewCenter-AuditService-Filter-Action
          - ReviewCenter-AuditService-Filter-ActionGroup
          - ReviewCenter-AuditService-Filter-DayRange
          - ReviewCenter-AuditService-Filter-Paging

      - id: ReviewCenter-Core-AuditTrail-FilterInput
        title: >-
          The Core subsystem shall trim the texts of an audit filter, treat an empty text as no condition, and
          keep a filter without any condition as it is.
        justification: |
          Typed filter texts are messy, and an empty field must mean everything and not nothing.
        children:
          - ReviewCenter-AuditService-Filter-Trim
          - ReviewCenter-AuditService-Filter-EmptyText
          - ReviewCenter-AuditService-Filter-None

      - id: ReviewCenter-Core-AuditTrail-FilterRefused
        title: >-
          The Core subsystem shall refuse an audit filter with a text that is longer than the field it is compared
          with, or with a range of days that ends before it starts, with the invalid-filter rule.
        justification: |
          An invalid filter has no meaning, and a silent empty result would hide the mistake.
        children:
          - ReviewCenter-AuditService-Filter-TextTooLong
          - ReviewCenter-AuditService-Filter-ReversedRange

      - id: ReviewCenter-Core-AuditTrail-FilterSingleDay
        title: >-
          The Core subsystem shall accept a range of days of an audit filter that starts and ends on the same day.
        justification: |
          The most common question is what happened on one day.
        children:
          - ReviewCenter-AuditService-Filter-SingleDay

      - id: ReviewCenter-Core-AuditTrail-ActionCatalog
        title: >-
          The Core subsystem shall offer a catalog of the known audit actions and their groups that matches the
          actions the code records, and tell a listed action or group from an unlisted one.
        justification: |
          The filter offers actions to choose from, and a catalog that drifts from the recorded actions would hide
          entries.
        children:
          - ReviewCenter-AuditService-Filter-ActionList
          - ReviewCenter-AuditService-Filter-ActionListOrder
          - ReviewCenter-AuditService-Filter-ActionListForm
          - ReviewCenter-AuditService-Filter-ActionGroups
          - ReviewCenter-AuditService-Filter-ActionLookup
          - ReviewCenter-AuditService-ExportAudited-Catalog

      - id: ReviewCenter-Core-AuditTrail-VerifyTrail
        title: >-
          The Core subsystem shall verify the hash chain of the whole stored audit trail by reading it in ordered
          batches that are smaller than the trail, and report an intact chain or an empty trail as intact with its
          entry count and head hash.
        justification: |
          The trail grows without limit, so verifying it must not need to hold all of it in memory.
        children:
          - ReviewCenter-AuditService-Verify
          - ReviewCenter-AuditService-Verify-Intact
          - ReviewCenter-AuditService-Verify-Empty

      - id: ReviewCenter-Core-AuditTrail-VerifyTrailBroken
        title: >-
          The Core subsystem shall report the first broken entry of the stored audit trail, with the count of the
          entries before it, when the trail does not verify.
        justification: |
          An auditor needs to know where the history stops being trustworthy.
        children:
          - ReviewCenter-AuditService-Verify-Broken

      - id: ReviewCenter-Core-AuditTrail-Export
        title: >-
          The Core subsystem shall export every audit entry that matches the filter of the listing exactly once, in
          ascending sequence order, in streamed batches of 500, without the entries appended after the export was
          prepared and without the audit entry of the export itself.
        justification: |
          An export must be complete and consistent, and must not hold the whole trail in memory.
        children:
          - ReviewCenter-AuditService-Export
          - ReviewCenter-AuditService-Export-Ascending
          - ReviewCenter-AuditService-Export-Batches
          - ReviewCenter-AuditService-Export-Streamed
          - ReviewCenter-AuditService-Export-Snapshot
          - ReviewCenter-AuditService-Export-OwnEntry

      - id: ReviewCenter-Core-AuditTrail-ExportScope
        title: >-
          The Core subsystem shall write only the entries of the project for a project export, and every entry,
          with or without a project, for an export without a project.
        justification: |
          A project export must not leak entries of another project.
        children:
          - ReviewCenter-AuditService-Export-Project
          - ReviewCenter-AuditService-Export-Global

      - id: ReviewCenter-Core-AuditTrail-ExportEmpty
        title: >-
          The Core subsystem shall write a valid, empty export when the audit trail is empty.
        justification: |
          A reader of the export must not meet a broken file because nothing happened yet.
        children:
          - ReviewCenter-AuditService-Export-Empty

      - id: ReviewCenter-Core-AuditTrail-ExportCanceled
        title: >-
          The Core subsystem shall stop reading and writing at once and throw the cancellation when an export is
          canceled.
        justification: |
          A user who abandons a large download must free the server at once.
        children:
          - ReviewCenter-AuditService-Export-Cancelled

      - id: ReviewCenter-Core-AuditTrail-ExportRefused
        title: >-
          The Core subsystem shall refuse to prepare an export for an invalid filter with the invalid-filter rule,
          and refuse null arguments.
        justification: |
          An invalid filter has no meaning, and a silent wrong export would mislead an auditor.
        children:
          - ReviewCenter-AuditService-Export-InvalidFilter
          - ReviewCenter-AuditService-Export-Arguments

      - id: ReviewCenter-Core-AuditTrail-ExportChainState
        title: >-
          The Core subsystem shall verify the whole chain while it prepares an export, before the first entry is
          read, and report in the export that the chain is intact or broken, with the first broken sequence, also
          when the export holds only the entries of a project, and export the entries of a broken chain too.
        justification: |
          A reader of an export must know whether the history it shows can be trusted.
        children:
          - ReviewCenter-AuditService-ExportChainStatus
          - ReviewCenter-AuditService-ExportChainStatus-Intact
          - ReviewCenter-AuditService-ExportChainStatus-Broken
          - ReviewCenter-AuditService-ExportChainStatus-WholeChain
          - ReviewCenter-AuditService-ExportChainStatus-Once
          - ReviewCenter-AuditService-ExportChainStatus-SnapshotFirst
          - ReviewCenter-AuditService-ExportChainStatus-BrokenExported

      - id: ReviewCenter-Core-AuditTrail-ExportFile
        title: >-
          The Core subsystem shall name the scope, the UTC time, and the chain status in the file name of an export,
          and give an export the extension and the content type of its format.
        justification: |
          Exports are kept as evidence, so their name must say what they show and when they were made.
        children:
          - ReviewCenter-AuditService-ExportChainStatus-FileName
          - ReviewCenter-AuditService-ExportChainStatus-ContentType

      - id: ReviewCenter-Core-AuditTrail-ExportNoLeak
        title: >-
          The Core subsystem shall reveal neither the number of the entries of the whole chain nor its head hash in
          an export, and nothing of the entries of other projects in a project export.
        justification: |
          The chain state of the whole system must not tell a project member about other projects.
        children:
          - ReviewCenter-AuditService-ExportChainStatus-NoCounts
          - ReviewCenter-AuditService-ExportChainStatus-NoOtherProjects

      - id: ReviewCenter-Core-AuditTrail-ExportAudited
        title: >-
          The Core subsystem shall, after an export has ended and so outside its snapshot, record the export as an
          audit entry of the action audit.exported for the user who exported, scoped to the project of the filter,
          that names the format, the number of entries written, whether the export was complete, and a bounded
          summary of the filter.
        justification: |
          Reading the whole history is itself an event that must show in the history.
        children:
          - ReviewCenter-AuditService-ExportAudited
          - ReviewCenter-AuditService-ExportAudited-User
          - ReviewCenter-AuditService-ExportAudited-Project
          - ReviewCenter-AuditService-ExportAudited-NoProject
          - ReviewCenter-AuditService-ExportAudited-Detail
          - ReviewCenter-AuditService-ExportAudited-FilterSummary
          - ReviewCenter-AuditService-ExportAudited-SummaryBounded
          - ReviewCenter-AuditService-ExportAudited-SummaryKeepsCount

      - id: ReviewCenter-Core-AuditTrail-ExportAuditedIncomplete
        title: >-
          The Core subsystem shall record the audit entry of an export that is canceled or fails, marked
          incomplete, let the failure reach the caller, and complete an export normally when the audit entry
          cannot be stored, reporting that failure to the error hook.
        justification: |
          A partial export is still a read of the history, but a failing audit write must not spoil an export.
        children:
          - ReviewCenter-AuditService-ExportAudited-Cancelled
          - ReviewCenter-AuditService-ExportAudited-Failed
          - ReviewCenter-AuditService-ExportAudited-FailureRethrown
          - ReviewCenter-AuditService-ExportAudited-AppendFailureReported
          - ReviewCenter-AuditService-ExportAudited-AppendFailureCompletes

      - id: ReviewCenter-Core-AuditTrail-ExportCsv
        title: >-
          The Core subsystem shall write an export as CSV in UTF-8 with a byte order mark, with the columns
          sequence, timestampUtc, actor, action, project, review, detail, previousHash, and hash in that order,
          CRLF line ends, RFC 4180 quoting, ISO 8601 UTC timestamps, and a header only for an empty export.
        justification: |
          A spreadsheet and an evidence archive both need a stable, well-formed file.
        children:
          - ReviewCenter-AuditService-ExportFormat
          - ReviewCenter-AuditService-ExportFormat-CsvEncoding
          - ReviewCenter-AuditService-ExportFormat-CsvLineEnds
          - ReviewCenter-AuditService-ExportFormat-CsvQuoting
          - ReviewCenter-AuditService-ExportFormat-CsvTimestamp
          - ReviewCenter-AuditService-ExportFormat-CsvNoProject
          - ReviewCenter-AuditService-ExportFormat-CsvEmpty

      - id: ReviewCenter-Core-AuditTrail-ExportCsvSafe
        title: >-
          The Core subsystem shall neutralize a CSV text cell of an export that starts with a formula character,
          and alter no sequence, timestamp, or hash cell.
        justification: |
          A spreadsheet would run a formula that a user typed into an audited text, but the hash cells must stay
          exact for verification.
        children:
          - ReviewCenter-AuditService-ExportFormat-CsvNeutralized
          - ReviewCenter-AuditService-ExportFormat-CsvGenerated

      - id: ReviewCenter-Core-AuditTrail-ExportJson
        title: >-
          The Core subsystem shall write an export as one valid JSON object with the parts export, chain, and
          entries, with the time and filter of the export, the chain status and the first broken sequence, each
          entry with its fields, escaped by a JSON writer and with formula characters unchanged, and with an empty
          list of entries for an empty export, but neither a count nor the head hash of the chain.
        justification: |
          A program that reads the export needs a stable structure, and JSON has no formula risk to neutralize.
        children:
          - ReviewCenter-AuditService-ExportFormat-JsonExport
          - ReviewCenter-AuditService-ExportFormat-JsonChain
          - ReviewCenter-AuditService-ExportFormat-JsonEntries
          - ReviewCenter-AuditService-ExportFormat-JsonEntryFields
          - ReviewCenter-AuditService-ExportFormat-JsonEscaped
          - ReviewCenter-AuditService-ExportFormat-JsonFormulaUnchanged
          - ReviewCenter-AuditService-ExportFormat-JsonEmpty
          - ReviewCenter-AuditService-ExportFormat-JsonBroken
          - ReviewCenter-AuditService-ExportFormat-JsonNoCounts

      - id: ReviewCenter-Core-AuditTrail-ExportWriter
        title: >-
          The Core subsystem shall pass the written batch of an export on to the target and empty its buffer at
          every flush, release its buffers when disposed, accept a repeated disposal, and refuse null arguments.
        justification: |
          A streamed export holds only one batch at a time, so the writers must hand it on and let go of it.
        children:
          - ReviewCenter-AuditService-ExportFormat-Flush
          - ReviewCenter-AuditService-ExportFormat-FlushEmptied
          - ReviewCenter-AuditService-ExportFormat-Dispose
          - ReviewCenter-AuditService-ExportFormat-DisposeRepeatable
          - ReviewCenter-AuditService-ExportFormat-Arguments

      - id: ReviewCenter-Core-AuditTrail-Projects
        title: >-
          The Core subsystem shall record the creation of a project in the audit trail, naming the actor and the
          project name.
        justification: |
          A project is the unit of access, so its creation must be traceable to an actor.
        children:
          - ReviewCenter-ProjectService-Audit

      - id: ReviewCenter-Core-AuditTrail-ProjectMembers
        title: >-
          The Core subsystem shall record the adding of a member in the audit trail, naming the actor, the user, the
          role, and the project.
        justification: |
          Who may see and sign a review depends on membership, so every change of it must be traceable.
        children:
          - ReviewCenter-ProjectService-MemberAudit

      - id: ReviewCenter-Core-AuditTrail-ProjectMembers-RoleChange
        title: >-
          The Core subsystem shall record the change of the role of a member in the audit trail, naming the actor,
          the user, the new role, and the project.
        justification: |
          A change of the role changes what a member may do in the project, so it must be traceable.
        children:
          - ReviewCenter-ProjectService-MemberAudit-RoleChange

      - id: ReviewCenter-Core-AuditTrail-ProjectMembers-Removal
        title: >-
          The Core subsystem shall record the removal of a member in the audit trail, naming the actor, the user, and
          the project.
        justification: |
          The end of the access of a member must be traceable as well as its start.
        children:
          - ReviewCenter-ProjectService-MemberAudit-Removal

      - id: ReviewCenter-Core-AuditTrail-ProjectMembers-Account
        title: >-
          The Core subsystem shall record the creation of a member account in the audit trail, naming the actor, the
          user, the role, and the project.
        justification: |
          A new account gives a new person a way in, so its creation must be traceable.
        children:
          - ReviewCenter-ProjectService-MemberAudit-Account

      - id: ReviewCenter-Core-AuditTrail-ProjectMembers-NoPassword
        title: >-
          The Core subsystem shall never record a temporary password in the audit trail.
        justification: |
          The audit trail is read by many people, so a password in it would be a password that many people know.
        children:
          - ReviewCenter-ProjectService-MemberAudit-NoPassword

      - id: ReviewCenter-Core-AuditTrail-ProjectMemberRefused
        title: >-
          The Core subsystem shall record every failed attempt to add a member or to create a member account in the
          audit trail, also by a system administrator, with the user name and the reason.
        justification: |
          Refused attempts to widen access are what an auditor looks for first.
        children:
          - ReviewCenter-ProjectService-MemberAudit-FailedAdd
          - ReviewCenter-ProjectService-MemberAudit-FailedAccount
          - ReviewCenter-ProjectService-MemberAudit-FailedSystemAdmin

      - id: ReviewCenter-Core-AuditTrail-EvidenceSettings
        title: >-
          The Core subsystem shall record a change of the evidence settings of a project as one audit entry,
          project.evidence-settings-changed, saved in the same call as the change, that carries the project and no
          review, names the actor, and lists every changed key with its old and new value as on or off.
        justification: |
          The settings decide which evidence a review needs, so a change must not pass unnoticed.
        children:
          - ReviewCenter-EvidenceSettingsService-Audit
          - ReviewCenter-EvidenceSettingsService-Audit-Atomic
          - ReviewCenter-EvidenceSettingsService-Audit-Actor
          - ReviewCenter-EvidenceSettingsService-Audit-Keys
          - ReviewCenter-EvidenceSettingsService-Audit-KeyValues

      - id: ReviewCenter-Core-AuditTrail-ProjectChecklist
        title: >-
          The Core subsystem shall record a replacement or a reset of the checklist of a project as one audit entry,
          project.checklist-changed, that carries the project and no review, names the actor and the new version,
          stays within the length limit of a detail, and never holds the wording of the checklist.
        justification: |
          The checklist defines what a reviewer attests, so a change of it must be traceable without copying it.
        children:
          - ReviewCenter-ProjectChecklistService-Audit
          - ReviewCenter-ProjectChecklistService-Audit-ResetActor
          - ReviewCenter-ProjectChecklistService-Audit-Reset
          - ReviewCenter-ProjectChecklistService-Audit-Project
          - ReviewCenter-ProjectChecklistService-Audit-Actor
          - ReviewCenter-ProjectChecklistService-Audit-Detail
          - ReviewCenter-ProjectChecklistService-Audit-ResetDetail
          - ReviewCenter-ProjectChecklistService-Audit-NoWording
          - ReviewCenter-ProjectChecklistService-Audit-Length

      - id: ReviewCenter-Core-AuditTrail-Reviews
        title: >-
          The Core subsystem shall record the creation of a draft review in the audit trail, naming the actor, the
          title, the content fingerprint, and the number of files, in the singular for one file.
        justification: |
          A review is the unit of approval, so its start must be traceable to an actor and to the content it covers.
        children:
          - ReviewCenter-ReviewService-Audit
          - ReviewCenter-ReviewService-Audit-FileCount

      - id: ReviewCenter-Core-AuditTrail-Threads
        title: >-
          The Core subsystem shall record starting a thread, a reply, resolving, and reopening a thread in the
          audit trail, saved in the same call as the change, naming the actor and the identifiers, and marking a
          line anchor on the Baseline side.
        justification: |
          Discussions decide whether a review may be approved, so every step of one must be traceable.
        children:
          - ReviewCenter-ThreadService-Audit
          - ReviewCenter-ThreadService-Audit-Atomic
          - ReviewCenter-ThreadService-Audit-Reply
          - ReviewCenter-ThreadService-Audit-Resolve
          - ReviewCenter-ThreadService-Audit-Reopen
          - ReviewCenter-ThreadService-Audit-BaselineSide

      - id: ReviewCenter-Core-AuditTrail-ThreadNoText
        title: >-
          The Core subsystem shall never put the text of a comment in the audit trail.
        justification: |
          Comments are free text that may hold secrets, and the trail is exported.
        children:
          - ReviewCenter-ThreadService-Audit-NoText

      - id: ReviewCenter-Core-AuditTrail-ThreadMissing
        title: >-
          The Core subsystem shall record nothing in the audit trail for a request that names a thread that does
          not exist.
        justification: |
          An entry for a change that did not happen would falsify the history.
        children:
          - ReviewCenter-ThreadService-Audit-MissingThread

      - id: ReviewCenter-Core-AuditTrail-ThreadReport
        title: >-
          The Core subsystem shall record in the audit trail a change of the kind of a thread, naming the old and
          the new kind, and a change of whether a comment is included in the report, saved in the same call as the
          change.
        justification: |
          What goes into the report is a decision of the reviewers that must be traceable.
        children:
          - ReviewCenter-ThreadService-ReportAudit
          - ReviewCenter-ThreadService-ReportAudit-Atomic
          - ReviewCenter-ThreadService-ReportAudit-CommentToggle

      - id: ReviewCenter-Core-AuditTrail-ThreadResolutionNote
        title: >-
          The Core subsystem shall record the hash of the resolution note, and not its text, in the audit entry
          thread.resolved.
        justification: |
          A reader can check that a note did not change without the trail holding the note.
        children:
          - ReviewCenter-ThreadService-ReportAudit-ResolutionNoteHash
          - ReviewCenter-ThreadService-ReportAudit-ResolutionNoteNoText

      - id: ReviewCenter-Core-AuditTrail-ThreadReportMarks
        title: >-
          The Core subsystem shall mark in the audit entry of a started thread and of a reply that the comment is
          in the report, but not for a reply in a chat.
        justification: |
          The trail must show which comments were declared part of the report.
        children:
          - ReviewCenter-ThreadService-ReportAudit-StartedInReport
          - ReviewCenter-ThreadService-ReportAudit-ReplyInReport
          - ReviewCenter-ThreadService-ReportAudit-ReplyInReport-ChatNotMarked

      - id: ReviewCenter-Core-AuditTrail-ThreadReportNoOp
        title: >-
          The Core subsystem shall record nothing in the audit trail for a request that changes nothing.
        justification: |
          An entry for a change that did not happen would falsify the history.
        children:
          - ReviewCenter-ThreadService-ReportAudit-NoOp

      - id: ReviewCenter-Core-AuditTrail-CheckThreads
        title: >-
          The Core subsystem shall record starting a check thread in the audit trail, saved in the same call as the
          thread, naming the thread, the check, and a short hash of the comment text, and not the text itself.
        justification: |
          A check thread ties a discussion to a checklist answer, and must be traceable without copying free text.
        children:
          - ReviewCenter-ThreadService-CheckThreadAudit
          - ReviewCenter-ThreadService-CheckThreadAudit-Atomic
          - ReviewCenter-ThreadService-CheckThreadAudit-NoText

      - id: ReviewCenter-Core-AuditTrail-Checklists
        title: >-
          The Core subsystem shall record an answer, and a change of the applicability of a section, as an audit
          entry that states the check and the outcome or the section, the project and the review, and the actor,
          with a short hash of a justification or a reason.
        justification: |
          Checklist answers are the evidence of a review, so every change of one must be traceable.
        children:
          - ReviewCenter-ChecklistService-Audit
          - ReviewCenter-ChecklistService-Audit-Section
          - ReviewCenter-ChecklistService-Audit-Hash
          - ReviewCenter-ChecklistService-Audit-Scope
          - ReviewCenter-ChecklistService-Audit-Actor

      - id: ReviewCenter-Core-AuditTrail-ChecklistsRefused
        title: >-
          The Core subsystem shall record no audit entry for an answer or a change of the applicability of a
          section that is refused.
        justification: |
          An entry for a change that did not happen would falsify the history.
        children:
          - ReviewCenter-ChecklistService-Audit-Refused

      - id: ReviewCenter-Core-AuditTrail-Slots
        title: >-
          The Core subsystem shall record adding, changing, and removing a reviewer slot in the audit trail, saved
          in the same call as the change, naming the actor, the slot by its number on the review page counted from
          1, and the reviewers of the slot.
        justification: |
          Who has to sign a review is decided by its slots, so every change of them must be traceable.
        children:
          - ReviewCenter-SigningService-Audit
          - ReviewCenter-SigningService-Audit-SlotChanged
          - ReviewCenter-SigningService-Audit-SlotRemoved
          - ReviewCenter-SigningService-Audit-Atomic
          - ReviewCenter-SigningService-Audit-Actor
          - ReviewCenter-SigningService-Audit-SlotNumber
          - ReviewCenter-SigningService-Audit-Reviewers

      - id: ReviewCenter-Core-AuditTrail-Signatures
        title: >-
          The Core subsystem shall record adding a signature in the audit trail, naming the role, the outcome, and
          the record digest.
        justification: |
          A signature is the approval itself, so it must be traceable to the exact record it covers.
        children:
          - ReviewCenter-SigningService-Audit-SignatureAdded
          - ReviewCenter-SigningService-Audit-SignatureDetail

      - id: ReviewCenter-Core-AuditTrail-SigningRefused
        title: >-
          The Core subsystem shall record nothing in the audit trail for a change of a slot or a signature that is
          refused.
        justification: |
          An entry for a change that did not happen would falsify the history.
        children:
          - ReviewCenter-SigningService-Audit-RefusedNothing

      - id: ReviewCenter-Core-AuditTrail-Users
        title: >-
          The Core subsystem shall record the creation, enabling, disabling, unlocking, a change of the system
          administrator right, and the setting of a password of a user in the audit trail, with the action and the
          user name, naming the actor, or the command line for a user created from it.
        justification: |
          Accounts are the root of access, so every administrative change of one must be traceable.
        children:
          - ReviewCenter-UserService-Audit
          - ReviewCenter-UserService-Audit-Enable
          - ReviewCenter-UserService-Audit-Disable
          - ReviewCenter-UserService-Audit-AdminChange
          - ReviewCenter-UserService-Audit-AdminPassword
          - ReviewCenter-UserService-Audit-OwnPassword
          - ReviewCenter-UserService-Audit-Unlock
          - ReviewCenter-UserService-Audit-Actor
          - ReviewCenter-UserService-Audit-CommandLine

      - id: ReviewCenter-Core-AuditTrail-UserNoPassword
        title: >-
          The Core subsystem shall never record a password, or a hash of one, in an audit entry of a change of a
          user.
        justification: |
          The trail is read and exported by many people, so it must not hold anything that unlocks an account.
        children:
          - ReviewCenter-UserService-Audit-NoPassword
        tests:
          - UserService_AdministrationEvents_AreRecordedWithoutPasswords

      - id: ReviewCenter-Core-AuditTrail-SignInEvents
        title: >-
          The Core subsystem shall record a failed sign-in with a wrong password in the audit trail, naming the
          user.
        justification: |
          Failed sign-ins are the first sign of an attack on an account.
        children:
          - ReviewCenter-UserService-SignInAudit

      - id: ReviewCenter-Core-AuditTrail-SignInNoPassword
        title: >-
          The Core subsystem shall never record the typed password in the audit entry of a failed sign-in.
        justification: |
          A mistyped password is often a real password of the user for another system.
        children:
          - ReviewCenter-UserService-SignInAudit-NoPassword

      - id: ReviewCenter-Core-AuditTrail-SignInReasons
        title: >-
          The Core subsystem shall record a sign-in on a disabled account, a sign-in for an unknown user, and an
          attempt on a locked account in the audit trail as a failure with the reason, record the typed name of an
          unknown user on one line and capped to the length of a user name, and record the lockout of an account
          once, when the fifth failure locks it.
        justification: |
          The reason tells an auditor guessing from a stale account, and a typed name must not break the trail.
        children:
          - ReviewCenter-UserService-SignInAudit-DisabledAccount
          - ReviewCenter-UserService-SignInAudit-UnknownUser
          - ReviewCenter-UserService-SignInAudit-TypedNameCleaned
          - ReviewCenter-UserService-SignInAudit-TypedNameCapped
          - ReviewCenter-UserService-SignInAudit-LockedAccount
          - ReviewCenter-UserService-SignInAudit-Lockout

      - id: ReviewCenter-Core-AuditTrail-SignInOnce
        title: >-
          The Core subsystem shall record failures for the same unknown user name, the same disabled account, and
          the same locked account at most once per minute.
        justification: |
          A guessing attack must not fill the trail with one entry per attempt.
        children:
          - ReviewCenter-UserService-SignInAudit-UnknownUserOnce
          - ReviewCenter-UserService-SignInAudit-DisabledOnce
          - ReviewCenter-UserService-SignInAudit-LockedOnce

      - id: ReviewCenter-Core-AuditTrail-SignInResilient
        title: >-
          The Core subsystem shall give the result of the sign-in check unchanged, without throwing, when the audit
          trail fails or is not there, and keep the update of the failure counter of a user out of the audit
          entries of the user.
        justification: |
          A failing trail must not lock everybody out, and counting failures is not a change of the account.
        children:
          - ReviewCenter-UserService-SignInAudit-TrailFailure
          - ReviewCenter-UserService-SignInAudit-NoAuditService
          - ReviewCenter-UserService-SignInAudit-CounterNoEntry

      - id: ReviewCenter-Core-AuditTrail-Reauth
        title: >-
          The Core subsystem shall offer a re-authentication check that returns the user for the right password of
          an enabled user, record a failed re-authentication in the audit trail with its reason under an action that
          differs from the sign-in failures, and lock the account out after 5 failed re-authentications in a row.
        justification: |
          Re-authentication guards signatures, and its failures must not be taken for sign-in failures.
        children:
          - ReviewCenter-UserService-ReauthAudit
          - ReviewCenter-UserService-ReauthAudit-WrongPassword
          - ReviewCenter-UserService-ReauthAudit-LockedAccount
          - ReviewCenter-UserService-ReauthAudit-DisabledAccount
          - ReviewCenter-UserService-ReauthAudit-UnknownUser
          - ReviewCenter-UserService-ReauthAudit-Lockout
          - ReviewCenter-UserService-ReauthAudit-Action

      - id: ReviewCenter-Core-AuditTrail-ReauthNoPassword
        title: >-
          The Core subsystem shall never record the typed password in the audit entry of a failed re-authentication.
        justification: |
          A mistyped password is often a real password of the user for another system.
        children:
          - ReviewCenter-UserService-ReauthAudit-NoPassword

      - id: ReviewCenter-Core-AuditTrail-ReauthOnce
        title: >-
          The Core subsystem shall record failed re-authentications of the same disabled account, and of the same
          locked account, at most once per minute, and a disabled and a locked failure of one account within the
          same minute as two entries.
        justification: |
          Repeated attempts must not fill the trail, and two different reasons must both stay visible.
        children:
          - ReviewCenter-UserService-ReauthAudit-DisabledOnce
          - ReviewCenter-UserService-ReauthAudit-LockedOnce
          - ReviewCenter-UserService-ReauthAudit-BothReasons

      - id: ReviewCenter-Core-AuditTrail-ReauthSigning
        title: >-
          The Core subsystem shall record a wrong password and a locked account at the password check of a
          signature in the audit trail as a failed re-authentication, without the password that was typed.
        justification: |
          A signature is the approval itself, so attempts to sign with a wrong password must be traceable.
        children:
          - ReviewCenter-SigningService-ReauthAudit
          - ReviewCenter-SigningService-ReauthAudit-Locked
          - ReviewCenter-SigningService-ReauthAudit-NoPassword

      - id: ReviewCenter-Core-AuditTrail-Repositories
        title: >-
          The Core subsystem shall record the creation, the change, the disabling, and the enabling of a repository
          in the audit trail with its name, its location, whether a user name and a token are set, and the project
          that owns it, and record that the token of a repository was cleared.
        justification: |
          A repository decides where review content comes from, so every change of it must be traceable.
        children:
          - ReviewCenter-RepositoryService-Audit
          - ReviewCenter-RepositoryService-Audit-Update
          - ReviewCenter-RepositoryService-Audit-TokenCleared
          - ReviewCenter-RepositoryService-Audit-Disabled
          - ReviewCenter-RepositoryService-Audit-Enabled
          - ReviewCenter-RepositoryService-Audit-Project

      - id: ReviewCenter-Core-AuditTrail-RepositoryNoSecret
        title: >-
          The Core subsystem shall never put a token or another secret into a repository audit entry.
        justification: |
          The trail is read and exported by many people, so it must not hold anything that grants access.
        children:
          - ReviewCenter-RepositoryService-Audit-NoSecret

      - id: ReviewCenter-Core-AuditTrail-RepositoryNoChange
        title: >-
          The Core subsystem shall record nothing in the audit trail for a repository update that changes nothing.
        justification: |
          An entry for a change that did not happen would falsify the history.
        children:
          - ReviewCenter-RepositoryService-Audit-NoChange

      - id: ReviewCenter-Core-Repositories
        title: >-
          The Core subsystem shall keep a registry of git repositories, each belonging to one project and registered
          under a name of 1 to 40 letters, digits, dots, underscores, and dashes that starts with a letter or digit,
          and refuse any other name with the repository name invalid rule.
        justification: |
          The registry decides what source code the server reads and holds secrets for it. Its rules must hold
          whichever user interface or store is used, and a project must not be able to use the repositories of
          another.
        children:
          - ReviewCenter-RepositoryService-Name
          - ReviewCenter-RepositoryService-Name-Empty
          - ReviewCenter-RepositoryService-Name-TooLong
          - ReviewCenter-RepositoryService-Name-FirstCharacter
          - ReviewCenter-RepositoryService-Name-Characters

      - id: ReviewCenter-Core-Repositories-NameUnique
        title: >-
          The Core subsystem shall refuse a second repository in the same project whose name differs from an
          existing one only by case, and allow the same repository name in two different projects.
        justification: |
          Names are how members pick a repository, so they must be unambiguous inside a project, which is the only
          place they are compared.
        children:
          - ReviewCenter-RepositoryService-Name-Duplicate
          - ReviewCenter-RepositoryService-Name-OtherProject

      - id: ReviewCenter-Core-Repositories-LocationAccepted
        title: >-
          The Core subsystem shall accept an https URL, a file URL, an absolute local path, or an http URL whose host
          is exactly localhost, 127.0.0.1, or [::1] as the location of a repository.
        justification: |
          A repository can live on a remote server or on the same machine, but a plain http URL to a remote host
          would send the token in clear text.
        children:
          - ReviewCenter-RepositoryService-Location
          - ReviewCenter-RepositoryService-Location-LoopbackHttp
          - ReviewCenter-RepositoryService-Location-File
          - ReviewCenter-RepositoryService-Location-LocalPath

      - id: ReviewCenter-Core-Repositories-LocationRemoteHttp
        title: >-
          The Core subsystem shall refuse an http URL whose host is not a loopback host, also one whose host only
          starts or ends like a loopback host, with the repository location invalid rule.
        justification: |
          A lookalike host such as localhost.example.com would send the token to a stranger.
        children:
          - ReviewCenter-RepositoryService-Location-RemoteHttp
          - ReviewCenter-RepositoryService-Location-LoopbackLookalike

      - id: ReviewCenter-Core-Repositories-LocationChange
        title: >-
          The Core subsystem shall apply the same location rules when the location of an existing repository is
          changed.
        justification: |
          A change must not be a way around the rules of registration.
        children:
          - ReviewCenter-RepositoryService-Location-Change

      - id: ReviewCenter-Core-Repositories-LocationShape
        title: >-
          The Core subsystem shall refuse an empty or blank location, and a location longer than 500 characters,
          with the repository location invalid rule.
        justification: |
          A location without content cannot be read, and a very long one is a way to abuse the registry.
        children:
          - ReviewCenter-RepositoryService-Location-Empty
          - ReviewCenter-RepositoryService-Location-TooLong

      - id: ReviewCenter-Core-Repositories-LocationGitSafety
        title: >-
          The Core subsystem shall refuse a location that starts with a dash, a location that git could run as a
          remote helper, and a location that is not an https, http, or file URL or an absolute path, with the
          repository location invalid rule.
        justification: |
          A location is passed to git, and option-like or helper text would let a user run what the server does
          not intend.
        children:
          - ReviewCenter-RepositoryService-Location-Option
          - ReviewCenter-RepositoryService-Location-Helper
          - ReviewCenter-RepositoryService-Location-OtherForm

      - id: ReviewCenter-Core-Repositories-LocationUrlParts
        title: >-
          The Core subsystem shall refuse an https URL that has no host or contains white space or a control
          character, and a location that carries user information, a query string, or a fragment, with the
          repository location invalid rule.
        justification: |
          User information would put a secret in the location, and a query or a fragment changes what git reads.
        children:
          - ReviewCenter-RepositoryService-Location-Malformed
          - ReviewCenter-RepositoryService-Location-UserInfo
          - ReviewCenter-RepositoryService-Location-Query
          - ReviewCenter-RepositoryService-Location-Fragment

      - id: ReviewCenter-Core-Repositories-CredentialsHttps
        title: >-
          The Core subsystem shall refuse a user name or a token for a repository whose location is not an https
          URL, also when a change of the location would leave a user name or a token on such a location, with the
          repository credential invalid rule.
        justification: |
          Credentials sent over another transport would travel in clear text or to a place that cannot use them.
        children:
          - ReviewCenter-RepositoryService-Credentials
          - ReviewCenter-RepositoryService-Credentials-LocationChange

      - id: ReviewCenter-Core-Repositories-CredentialsPair
        title: >-
          The Core subsystem shall refuse a token without a user name, and a change that removes the user name while
          the token is kept, with the repository credential invalid rule.
        justification: |
          A token is only used together with its user name, so one without the other is a mistake.
        children:
          - ReviewCenter-RepositoryService-Credentials-TokenWithoutUser
          - ReviewCenter-RepositoryService-Credentials-UserNameRemoved

      - id: ReviewCenter-Core-Repositories-CredentialsUserName
        title: >-
          The Core subsystem shall refuse a user name that contains a colon or a control character, or that is
          longer than 200 characters, with the repository credential invalid rule.
        justification: |
          The user name is put in front of the token in an authorization header, where a colon or a control
          character would change its meaning.
        children:
          - ReviewCenter-RepositoryService-Credentials-UserNameColon
          - ReviewCenter-RepositoryService-Credentials-UserNameControl
          - ReviewCenter-RepositoryService-Credentials-UserNameLength

      - id: ReviewCenter-Core-Repositories-CredentialsToken
        title: >-
          The Core subsystem shall refuse a token that contains white space or a control character, or that is
          longer than 1000 characters, with the repository credential invalid rule.
        justification: |
          Such a token cannot be sent in a header, and a very long one is a way to abuse the registry.
        children:
          - ReviewCenter-RepositoryService-Credentials-TokenSpace
          - ReviewCenter-RepositoryService-Credentials-TokenControl
          - ReviewCenter-RepositoryService-Credentials-TokenLength

      - id: ReviewCenter-Core-Repositories-CredentialsTokenInText
        title: >-
          The Core subsystem shall refuse, when a repository is registered or its token is replaced, a token that is
          contained in the name, the user name, or the location of the repository, also in its percent-escaped form
          whatever the case of the hexadecimal digits, with the repository credential invalid rule.
        justification: |
          The name, the user name, and the location are shown to members, so a token placed in them would leak.
        children:
          - ReviewCenter-RepositoryService-Credentials-TokenInName
          - ReviewCenter-RepositoryService-Credentials-TokenInUserName
          - ReviewCenter-RepositoryService-Credentials-TokenInLocation
          - ReviewCenter-RepositoryService-Credentials-TokenInEscapedLocation
          - ReviewCenter-RepositoryService-Credentials-TokenEscapedHexCase

      - id: ReviewCenter-Core-Repositories-CredentialsKeptTokenInText
        title: >-
          The Core subsystem shall refuse a change of the name, the user name, or the location to text that contains
          the kept token, also in its percent-escaped form, with the repository credential invalid rule.
        justification: |
          A change of a field must not copy the stored token into a field that members can see.
        children:
          - ReviewCenter-RepositoryService-Credentials-KeptTokenInName
          - ReviewCenter-RepositoryService-Credentials-KeptTokenInUserName
          - ReviewCenter-RepositoryService-Credentials-KeptTokenInLocation
          - ReviewCenter-RepositoryService-Credentials-KeptTokenInEscapedLocation

      - id: ReviewCenter-Core-Repositories-CredentialsTokenCase
        title: >-
          The Core subsystem shall not treat a token as contained in the name, the user name, or the location when
          the text differs from the token in its letter case.
        justification: |
          A token is case-sensitive, so a different case is a different secret and refusing it would be a false alarm.
        children:
          - ReviewCenter-RepositoryService-Credentials-TokenCase

      - id: ReviewCenter-Core-Repositories-CredentialsMessage
        title: >-
          The Core subsystem shall not show the token in the message of a refusal because the token is contained in
          the name, the user name, or the location.
        justification: |
          The message is shown to the user, so repeating the token there would leak it.
        children:
          - ReviewCenter-RepositoryService-Credentials-MessageHidesToken

      - id: ReviewCenter-Core-Repositories-CredentialsRefusalChangesNothing
        title: >-
          The Core subsystem shall leave the stored token, the registration, and the audit trail unchanged when it
          refuses a credential.
        justification: |
          A refused change must not leave a half-applied registration behind.
        children:
          - ReviewCenter-RepositoryService-Credentials-RefusalChangesNothing

      - id: ReviewCenter-Core-Repositories-CredentialsNotCompared
        title: >-
          The Core subsystem shall not compare a kept token that cannot be decrypted, and not compare a cleared
          token, with the new name, user name, or location.
        justification: |
          A token that is not readable or not there cannot leak, and failing on it would block a repair.
        children:
          - ReviewCenter-RepositoryService-Credentials-KeptUnreadable
          - ReviewCenter-RepositoryService-Credentials-ClearedNotCompared

      - id: ReviewCenter-Core-Repositories-TokenEncrypted
        title: >-
          The Core subsystem shall store the token of a repository only in encrypted form.
        justification: |
          A token is a secret that unlocks a code host, so a copy of the database must not give it away.
        children:
          - ReviewCenter-RepositoryService-Token

      - id: ReviewCenter-Core-Repositories-TokenUpdate
        title: >-
          The Core subsystem shall leave the stored token unchanged when an update keeps it, store a new token,
          encrypted, in place of the old one when an update replaces it, and remove it when an update clears it.
        justification: |
          An administrator must be able to rotate or remove a token without retyping the rest of the repository.
        children:
          - ReviewCenter-RepositoryService-Token-Keep
          - ReviewCenter-RepositoryService-Token-Replace
          - ReviewCenter-RepositoryService-Token-Clear

      - id: ReviewCenter-Core-Repositories-TokenReplaceEmpty
        title: >-
          The Core subsystem shall refuse an update that replaces the token with an empty token.
        justification: |
          An empty token would silently remove access, which is what clearing is for.
        children:
          - ReviewCenter-RepositoryService-Token-ReplaceEmpty

      - id: ReviewCenter-Core-Repositories-TokenNeverReturned
        title: >-
          The Core subsystem shall report, instead of the token, only whether a token is set to a caller that lists
          or reads a repository, and not show the token in the text form of the token change or of the access data.
        justification: |
          The token is write-only, so no screen, log, or export can leak it.
        children:
          - ReviewCenter-RepositoryService-Token-WriteOnly
          - ReviewCenter-RepositoryService-Token-TextForm

      - id: ReviewCenter-Core-Repositories-AdminOnly
        title: >-
          The Core subsystem shall let an enabled system administrator and an administrator of the project list the
          registry of a project and register, change, enable, and disable a repository of it.
        justification: |
          The registry holds secrets and decides what code the server reads, so only administrators manage it.
        children:
          - ReviewCenter-RepositoryService-Admin
          - ReviewCenter-RepositoryService-Admin-Register
          - ReviewCenter-RepositoryService-Admin-Change
          - ReviewCenter-RepositoryService-Admin-SetEnabled
          - ReviewCenter-RepositoryService-Admin-ProjectAdmin
          - ReviewCenter-RepositoryService-Admin-ProjectAdmin-Register
          - ReviewCenter-RepositoryService-Admin-ProjectAdmin-Change
          - ReviewCenter-RepositoryService-Admin-ProjectAdmin-SetEnabled

      - id: ReviewCenter-Core-Repositories-AdminMemberRefused
        title: >-
          The Core subsystem shall refuse a plain member of the project with the actor not allowed rule when the
          member lists the registry or registers, changes, enables, or disables a repository.
        justification: |
          Membership gives the right to review, not the right to change where code comes from.
        children:
          - ReviewCenter-RepositoryService-Admin-Member
          - ReviewCenter-RepositoryService-Admin-Member-Register
          - ReviewCenter-RepositoryService-Admin-Member-Change
          - ReviewCenter-RepositoryService-Admin-Member-SetEnabled

      - id: ReviewCenter-Core-Repositories-AdminNotVisible
        title: >-
          The Core subsystem shall refuse a user who cannot see the project, an unknown user, and a disabled
          administrator with the project not found rule or the repository not found rule.
        justification: |
          Refusing as not found keeps a user from learning that a project or repository exists.
        children:
          - ReviewCenter-RepositoryService-Admin-NotVisible
          - ReviewCenter-RepositoryService-Admin-UnknownUser
          - ReviewCenter-RepositoryService-Admin-DisabledUser

      - id: ReviewCenter-Core-Repositories-AdminRefusalChangesNothing
        title: >-
          The Core subsystem shall leave the registry and the audit trail unchanged when it refuses an actor.
        justification: |
          A refused actor must leave no trace in the registry.
        children:
          - ReviewCenter-RepositoryService-Admin-RefusalChangesNothing

      - id: ReviewCenter-Core-Repositories-AdminRecheck
        title: >-
          The Core subsystem shall check the acting user again on every call, so that an administrator who is
          disabled or demoted loses the right at once.
        justification: |
          A right that is checked only at sign-in would outlive the decision that took it away.
        children:
          - ReviewCenter-RepositoryService-Admin-Recheck

      - id: ReviewCenter-Core-Repositories-OneProject
        title: >-
          The Core subsystem shall register every repository in exactly one project.
        justification: |
          A project must not be able to use the repositories of another.
        children:
          - ReviewCenter-RepositoryService-Ownership

      - id: ReviewCenter-Core-Repositories-OwnerAccess
        title: >-
          The Core subsystem shall give the git layer the access data of a repository only for the project that owns
          it.
        justification: |
          The access data holds the token, so it must not serve another project.
        children:
          - ReviewCenter-RepositoryService-Ownership-Access

      - id: ReviewCenter-Core-Repositories-OwnerListing
        title: >-
          The Core subsystem shall offer the enabled repositories of a project only to a user who may see that
          project, and only the enabled repositories of that project.
        justification: |
          A member picks from the repositories of the own project and learns nothing about others.
        children:
          - ReviewCenter-RepositoryService-Ownership-Listing
          - ReviewCenter-RepositoryService-Ownership-ListingProject

      - id: ReviewCenter-Core-Repositories-DisableNotDelete
        title: >-
          The Core subsystem shall keep a disabled repository in the registry of the administrators instead of
          deleting it.
        justification: |
          Reviews refer to the repository, so deleting it would break their history.
        children:
          - ReviewCenter-RepositoryService-Disable

      - id: ReviewCenter-Core-Repositories-DisabledListing
        title: >-
          The Core subsystem shall leave a disabled repository out of the list of enabled repositories, and offer
          the members of the project only the identity and the name of an enabled repository.
        justification: |
          Members choose among usable repositories, and need no more than a name.
        children:
          - ReviewCenter-RepositoryService-Disable-Listed
          - ReviewCenter-RepositoryService-Disable-NameOnly

      - id: ReviewCenter-Core-Repositories-DisabledRefused
        title: >-
          The Core subsystem shall refuse access to a disabled repository with the repository disabled rule.
        justification: |
          Disabling must stop the server from reading the repository at once.
        children:
          - ReviewCenter-RepositoryService-Disable-Access

      - id: ReviewCenter-Core-Repositories-Access
        title: >-
          The Core subsystem shall give the git layer the location, the user name, and the decrypted token of an
          enabled repository, all of one version of the repository.
        justification: |
          The git layer needs the real token, and a mix of two versions would use a wrong or stale credential.
        children:
          - ReviewCenter-RepositoryService-Access
          - ReviewCenter-RepositoryService-Access-Consistent

      - id: ReviewCenter-Core-Repositories-AccessUnreadable
        title: >-
          The Core subsystem shall refuse access with the credentials unreadable rule when the stored token cannot
          be decrypted, naming the repository and no secret in the message.
        justification: |
          A lost key must show as a clear failure and must not leak anything.
        children:
          - ReviewCenter-RepositoryService-Access-Unreadable
          - ReviewCenter-RepositoryService-Access-UnreadableMessage

      - id: ReviewCenter-Core-Repositories-RuleViolations
        title: >-
          The Core subsystem shall report each violation of the rules of the repository registry as a domain rule
          exception that names the rule, without storing anything.
        justification: |
          A user interface must be able to tell the user which rule was broken, and a refused request must leave
          the registry as it was.
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-FileSelection
        title: >-
          The Core subsystem shall accept a revision given by a user that is a plain branch name, tag name, or
          commit identifier, also one of exactly the length limit, and return it unchanged.
        justification: |
          Revisions come from users and are passed on to git and to the file walk, so only plain names may pass.
        children:
          - ReviewCenter-RevisionValidator-Accept
          - ReviewCenter-RevisionValidator-Accept-LengthLimit
          - ReviewCenter-RevisionValidator-Accept-Verdict

      - id: ReviewCenter-Core-FileSelection-RevisionRule
        title: >-
          The Core subsystem shall refuse a revision that is not a plain name, such as an empty or missing one, one
          that is too long, one that does not start with a letter or a digit, a git revision expression, one with
          white space, a control character, or another character, or a malformed one, with a rule violation that
          names the revision rule.
        justification: |
          Option-like text or a revision expression passed to git could make it do what the server does not intend.
        children:
          - ReviewCenter-RevisionValidator-Refuse
          - ReviewCenter-RevisionValidator-Refuse-Empty
          - ReviewCenter-RevisionValidator-Refuse-TooLong
          - ReviewCenter-RevisionValidator-Refuse-Start
          - ReviewCenter-RevisionValidator-Refuse-Expression
          - ReviewCenter-RevisionValidator-Refuse-Whitespace
          - ReviewCenter-RevisionValidator-Refuse-Characters
          - ReviewCenter-RevisionValidator-Refuse-Malformed

      - id: ReviewCenter-Core-FileSelection-Match
        title: >-
          The Core subsystem shall select a repository path if and only if the last include or exclude pattern that
          matches it is an inclusion, a pattern with a leading exclamation mark being an exclusion.
        justification: |
          Reviewers narrow a selection by excluding paths after including folders, so the order must decide.
        children:
          - ReviewCenter-SelectionMatcher-Match
          - ReviewCenter-SelectionMatcher-Match-Exclusion

      - id: ReviewCenter-Core-FileSelection-Wildcards
        title: >-
          The Core subsystem shall match any characters inside one path segment with a star that never matches a
          path separator, exactly one character with a question mark, any number of segments with a segment of two
          stars, at least one segment for a trailing double star, and match paths case-sensitively.
        justification: |
          Reviewers expect the common glob syntax, and a different meaning would select the wrong files.
        children:
          - ReviewCenter-SelectionMatcher-Match-StarSeparator
          - ReviewCenter-SelectionMatcher-Match-Star
          - ReviewCenter-SelectionMatcher-Match-Question
          - ReviewCenter-SelectionMatcher-Match-DoubleStar
          - ReviewCenter-SelectionMatcher-Match-TrailingDoubleStar
          - ReviewCenter-SelectionMatcher-Match-CaseSensitive

      - id: ReviewCenter-Core-FileSelection-Parse
        title: >-
          The Core subsystem shall read the lines of a selection as patterns, trimming them, skipping blank lines,
          dropping a leading dot-slash or slash, allowing white space after the exclamation mark of an exclusion,
          and reading a pattern that ends with a slash as everything below that folder.
        justification: |
          A selection is typed by users, so harmless differences in how it is written must not change what it selects.
        children:
          - ReviewCenter-SelectionMatcher-Parse
          - ReviewCenter-SelectionMatcher-Parse-BlankLines
          - ReviewCenter-SelectionMatcher-Parse-Prefix
          - ReviewCenter-SelectionMatcher-Parse-ExclusionSpace
          - ReviewCenter-SelectionMatcher-Parse-Folder

      - id: ReviewCenter-Core-FileSelection-Normalize
        title: >-
          The Core subsystem shall write parsed patterns back as the normalized selection text, one pattern per
          line, that gives patterns which write back as the same text.
        justification: |
          The stored selection must be stable, so that saving it again changes nothing.
        children:
          - ReviewCenter-SelectionMatcher-Parse-Normalize
          - ReviewCenter-SelectionMatcher-Parse-RoundTrip

      - id: ReviewCenter-Core-FileSelection-PatternRule
        title: >-
          The Core subsystem shall refuse a selection that breaks a rule of parsing, such as one without a pattern,
          a pattern that names no file or folder, more patterns than the limit, or a longer pattern than the limit,
          with a rule violation that names the selection rule.
        justification: |
          Limits keep a pattern from using unbounded resources, and a selection that selects nothing is a mistake.
        children:
          - ReviewCenter-SelectionMatcher-Parse-Invalid
          - ReviewCenter-SelectionMatcher-Parse-Empty
          - ReviewCenter-SelectionMatcher-Parse-EmptyPattern
          - ReviewCenter-SelectionMatcher-Parse-TooMany
          - ReviewCenter-SelectionMatcher-Parse-TooLong

      - id: ReviewCenter-Core-FileSelection-PatternLimits
        title: >-
          The Core subsystem shall accept a selection that has exactly the limit of patterns and a pattern that has
          exactly the limit of length.
        justification: |
          The limits are inclusive, so a selection at the limit must keep working.
        children:
          - ReviewCenter-SelectionMatcher-Parse-Limits

      - id: ReviewCenter-Core-FileSelection-PatternUnsafe
        title: >-
          The Core subsystem shall refuse a pattern that uses a backslash, that has a dot, double dot, or empty
          segment, or that contains a control character, and refuse a missing selection text, a missing path, and a
          missing list of patterns, with a rule violation that names the selection rule.
        justification: |
          Such patterns could reach outside the repository or mean different things on different systems.
        children:
          - ReviewCenter-SelectionMatcher-Parse-Backslash
          - ReviewCenter-SelectionMatcher-Parse-DotSegment
          - ReviewCenter-SelectionMatcher-Parse-EmptySegment
          - ReviewCenter-SelectionMatcher-Parse-Control
          - ReviewCenter-SelectionMatcher-Parse-Arguments

      - id: ReviewCenter-Core-FileSelection-Bounded
        title: >-
          The Core subsystem shall decide a path of 60 segments against a pattern of 40 double-star segments in at
          most five seconds.
        justification: |
          A pattern typed by a user must not be able to keep the server busy without limit.
        children:
          - ReviewCenter-SelectionMatcher-Bounded

      - id: ReviewCenter-Core-FileSelection-Compatibility
        title: >-
          The Core subsystem shall select the same paths as the glob matching used by ReviewMark for literal, star,
          and double-star patterns with exclusions.
        justification: |
          A selection written for the review configuration must select the same files in this server.
        children:
          - ReviewCenter-SelectionMatcher-Compatibility

      - id: ReviewCenter-Core-FileSelection-RuleViolations
        title: >-
          The Core subsystem shall report an invalid revision or pattern as a domain rule exception that names the
          rule, without storing anything.
        justification: |
          A user interface must be able to tell the user which rule was broken.
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-RepositoryReviews
        title: >-
          The Core subsystem shall create a review from the files that changed between an optional baseline revision
          and a head revision of a registered git repository of the project and that match a selection, or from
          every changed file when no selection is given, matching a deleted file by its path, reading every file at
          the head as Added when the baseline is blank, and setting the content fingerprint from the files that exist
          at the head.
        justification: |
          A review of a change must keep exactly what was reviewed, and a signature must bind to it, so that neither a
          later commit nor a different selection can leave a signature looking current.
        children:
          - ReviewCenter-ReviewService-FromRepository
          - ReviewCenter-ReviewService-FromRepository-Selection
          - ReviewCenter-ReviewService-FromRepository-AllFiles
          - ReviewCenter-ReviewService-FromRepository-DeletedFiles
          - ReviewCenter-ReviewService-FromRepository-Baseline
          - ReviewCenter-ReviewService-FromRepository-Fingerprint

      - id: ReviewCenter-Core-RepositoryReviews-DigestBinding
        title: >-
          The Core subsystem shall make the record digest of a review from a repository depend on its selection, its
          source, and every change.
        justification: |
          A signature must stop looking current when what was reviewed or how it was chosen changes.
        children:
          - ReviewCenter-ReviewService-FromRepository-Digest

      - id: ReviewCenter-Core-RepositoryReviews-RepositoryRefused
        title: >-
          The Core subsystem shall refuse a review from a disabled repository, from a repository that does not
          exist, and from a repository of another project, as not found, with the matching repository rule.
        justification: |
          A project must not use the repositories of another, and a disabled repository must not be read.
        children:
          - ReviewCenter-ReviewService-FromRepository-Disabled
          - ReviewCenter-ReviewService-FromRepository-RepositoryUnknown
          - ReviewCenter-ReviewService-FromRepository-OtherProject

      - id: ReviewCenter-Core-RepositoryReviews-RevisionRefused
        title: >-
          The Core subsystem shall refuse a review whose baseline or head revision cannot be found in the
          repository, a revision that is not a valid revision name, and a blank head revision, the last two with the
          RevisionInvalid rule and before it opens the repository.
        justification: |
          A review of a revision that does not exist, or of text that git could read as an option, must not start.
        children:
          - ReviewCenter-ReviewService-FromRepository-RevisionUnknown
          - ReviewCenter-ReviewService-FromRepository-RevisionInvalid
          - ReviewCenter-ReviewService-FromRepository-RevisionBlank

      - id: ReviewCenter-Core-RepositoryReviews-SelectionRefused
        title: >-
          The Core subsystem shall refuse a blank selection, and a selection that is longer than 2000 characters,
          with the SelectionInvalid rule.
        justification: |
          A selection that selects nothing or is without bounds is a mistake or an abuse.
        children:
          - ReviewCenter-ReviewService-FromRepository-SelectionInvalid
          - ReviewCenter-ReviewService-FromRepository-SelectionLength

      - id: ReviewCenter-Core-RepositoryReviews-IdRefused
        title: >-
          The Core subsystem shall refuse an invalid review identifier of a review from a repository with the review
          identifier rule.
        justification: |
          The identifier is used in addresses and file names, so it must follow the same rule as any other review.
        children:
          - ReviewCenter-ReviewService-FromRepository-IdInvalid

      - id: ReviewCenter-Core-RepositoryReviews-RefusalChangesNothing
        title: >-
          The Core subsystem shall store no review and write no audit entry for a request for a review from a
          repository that it refuses.
        justification: |
          A refused request must leave no half-made review behind.
        children:
          - ReviewCenter-ReviewService-FromRepository-Refusal

      - id: ReviewCenter-Core-RepositoryReviews-GitFailure
        title: >-
          The Core subsystem shall pass on a failure to reach the repository with its own GitAccessFailed rule.
        justification: |
          A user must be able to tell an unreachable repository from a wrong request.
        children:
          - ReviewCenter-ReviewService-FromRepository-GitFailure

      - id: ReviewCenter-Core-RepositoryReviews-RequestRefused
        title: >-
          The Core subsystem shall refuse a review from a repository for a project that does not exist or with an
          invalid request before it opens the repository, refuse with an invalid-operation error when the project has
          no repositories, and refuse a missing source with an argument-null error.
        justification: |
          Cheap checks must come before the expensive access to the repository.
        children:
          - ReviewCenter-ReviewService-FromRepository-BeforeOpening
          - ReviewCenter-ReviewService-FromRepository-NoRepositories
          - ReviewCenter-ReviewService-FromRepository-SourceRequired

      - id: ReviewCenter-Core-RepositoryReviews-Frozen
        title: >-
          The Core subsystem shall keep with a review created from a repository the repository, the two resolved
          commits, and the content of its files, and keep them unchanged when the repository later receives a commit
          or a branch moves, also when the repository is disabled, without opening the repository again.
        justification: |
          A review of a change must keep exactly what was reviewed, so that a later commit cannot change it.
        children:
          - ReviewCenter-ReviewService-FromRepository-Source
          - ReviewCenter-ReviewService-Frozen
          - ReviewCenter-ReviewService-Frozen-NoGit
          - ReviewCenter-ReviewService-Frozen-Digest
          - ReviewCenter-ReviewService-Frozen-Disabled
        tests:
          - ReviewService_CreateFromRepositoryAsync_Changes_FreezesFilesAndSource

      - id: ReviewCenter-Core-RepositoryReviews-NothingToReview
        title: >-
          The Core subsystem shall refuse a review from a repository, storing nothing, with the NothingToReview rule
          when no changed file matches the selection, naming the baseline and the head revision, and the beginning of
          the history when no baseline was given.
        justification: |
          A review without a file cannot be signed for anything, and the message must say what was compared.
        children:
          - ReviewCenter-ReviewService-NothingToReview
          - ReviewCenter-ReviewService-NothingToReview-Message
          - ReviewCenter-ReviewService-NothingToReview-NoBaseline

      - id: ReviewCenter-Core-RepositoryReviews-Limits
        title: >-
          The Core subsystem shall refuse a review from a repository with a file larger than 2 MiB on its baseline
          or head side, with baseline and head content together over the total limit, or with more than 200 files.
        justification: |
          A review is stored and shown whole, so its size must be bounded.
        children:
          - ReviewCenter-ReviewService-RepositoryLimits
          - ReviewCenter-ReviewService-RepositoryLimits-TotalSize
          - ReviewCenter-ReviewService-RepositoryLimits-FileCount

      - id: ReviewCenter-Core-RepositoryReviews-LimitsBeforeReading
        title: >-
          The Core subsystem shall refuse a review from a repository that exceeds these limits before it reads any
          file content.
        justification: |
          Reading a huge repository to refuse it afterwards would waste the resources the limits protect.
        children:
          - ReviewCenter-ReviewService-RepositoryLimits-BeforeReading

      - id: ReviewCenter-Core-RepositoryReviews-SkippedEntries
        title: >-
          The Core subsystem shall leave symbolic links and submodules out of a review from a repository and return
          them, with their reasons, to the creator.
        justification: |
          Their content is not in the repository tree, so they cannot be reviewed, but the creator must know.
        children:
          - ReviewCenter-ReviewService-SkippedEntries

      - id: ReviewCenter-Core-RepositoryReviews-Audit
        title: >-
          The Core subsystem shall record the creation of a review from a repository in the audit trail, naming the
          actor, the repository, the baseline and head commits, the number of files by change kind, the number of
          skipped entries, and the content fingerprint.
        justification: |
          The history must show which commits a review covers without opening the review.
        children:
          - ReviewCenter-ReviewService-SkippedEntries-Audit
          - ReviewCenter-ReviewService-RepositoryAudit

      - id: ReviewCenter-Core-RepositoryReviews-DigestSource
        title: >-
          The Core subsystem shall write the word upload as the source of an uploaded review into its record digest,
          write for a review from a repository the repository identity, the commit identifiers, and every change with
          its path and change kind, give a different digest when any covered part changes, and give the same digest
          for the same changes in any order.
        justification: |
          The digest is what a signature binds to, so it must cover the whole source and not depend on listing order.
        children:
          - ReviewCenter-RecordDigest-Source
          - ReviewCenter-RecordDigest-Source-Repository
          - ReviewCenter-RecordDigest-Source-Changes
          - ReviewCenter-RecordDigest-Source-Change
          - ReviewCenter-RecordDigest-SourceOrder

      - id: ReviewCenter-Core-RepositoryReviews-ReviewSet
        title: >-
          The Core subsystem shall record on a review created from a plan the identifier of the review set that it
          comes from, write it into the record digest, also when it is the empty identifier as different from none,
          and name it last in the audit entry of the creation.
        justification: |
          A review must say which review set it answers, so that approval of the set can be told from approval of
          its files.
        children:
          - ReviewCenter-ReviewService-ReviewSet
          - ReviewCenter-RecordDigest-Source-ReviewSet
          - ReviewCenter-RecordDigest-Source-ReviewSetEmpty
          - ReviewCenter-ReviewService-ReviewSet-Audit

      - id: ReviewCenter-Core-RepositoryReviews-ReviewSetLength
        title: >-
          The Core subsystem shall refuse a review-set identifier that is empty or longer than 100 characters.
        justification: |
          The identifier is stored and shown, so it must be bounded.
        children:
          - ReviewCenter-ReviewService-ReviewSet-Length

      - id: ReviewCenter-Core-RepositoryReviews-ReviewSetNone
        title: >-
          The Core subsystem shall keep the review-set identifier empty for a review that is not created from a
          plan.
        justification: |
          A review made by hand answers no review set.
        children:
          - ReviewCenter-ReviewService-ReviewSet-None

      - id: ReviewCenter-Core-RepositoryReviews-CommentOnHead
        title: >-
          The Core subsystem shall reject a thread anchored to head lines of a file that a repository review marks
          as Deleted.
        justification: |
          A deleted file has no lines at the head, so a comment on them would point at nothing.
        children:
          - ReviewCenter-ThreadService-DeletedFile

      - id: ReviewCenter-Core-RepositoryReviews-CommentAccepted
        title: >-
          The Core subsystem shall accept a thread on the whole of a file that a repository review marks as Deleted,
          on baseline lines of such a file, and on head lines of a file that it marks as Modified.
        justification: |
          A deleted file can still be discussed, but only where it exists.
        children:
          - ReviewCenter-ThreadService-DeletedFile-WholeFile
          - ReviewCenter-ThreadService-DeletedFile-BaselineLines
          - ReviewCenter-ThreadService-DeletedFile-HeadLines

      - id: ReviewCenter-Core-RepositoryReviews-RuleViolations
        title: >-
          The Core subsystem shall report each violation of the rules of a review from a repository as a domain rule
          exception that names the rule, without storing anything.
        justification: |
          A user interface must be able to tell the user which rule was broken.
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-PlanReviews
        title: >-
          The Core subsystem shall plan the reviews that a head revision of a registered repository needs, one row
          for each review-set that the repository defines in its configuration file at that head, in file order,
          with the numbers of files added, modified, and deleted, using one session on the repository for the whole
          plan and listing the changes once for every distinct baseline.
        justification: |
          A repository already states which sets of files are reviewed together. Planning from that statement saves
          effort and mistakes.
        children:
          - ReviewCenter-ReviewPlanner-Plan
          - ReviewCenter-ReviewPlanner-Plan-Session
          - ReviewCenter-ReviewPlanner-Plan-Counts
          - ReviewCenter-ReviewPlanner-Plan-ChangeLists
          - ReviewCenter-ReviewPlanner-Plan-OneList
        tests:
          - ReviewPlanner_PlanAsync_NoBaseline_ClassifiesSetsWithOneSession

      - id: ReviewCenter-Core-PlanReviews-BrokenSet
        title: >-
          The Core subsystem shall give a review-set that cannot be planned a row of its own with the state cannot
          be planned and a reason, for a set whose path leaves the repository, whose identifier is too long, or that
          selects too many files.
        justification: |
          One bad set must not hide the plan of the other sets, and the reason tells the repository owner what to fix.
        children:
          - ReviewCenter-ReviewPlanner-Plan-BrokenSet
          - ReviewCenter-ReviewPlanner-Plan-SetPath
          - ReviewCenter-ReviewPlanner-Plan-SetId
          - ReviewCenter-ReviewPlanner-Plan-SetSize

      - id: ReviewCenter-Core-PlanReviews-ConfigRefused
        title: >-
          The Core subsystem shall refuse a head that has no configuration file, a configuration file larger than the
          limit, and a configuration file that is not valid, with the matching review-set configuration rule and
          message.
        justification: |
          Without a valid statement of the sets there is nothing to plan, and the user needs to know why.
        children:
          - ReviewCenter-ReviewPlanner-Plan-NoConfig
          - ReviewCenter-ReviewPlanner-Plan-ConfigTooLarge
          - ReviewCenter-ReviewPlanner-Plan-ConfigInvalid
        tests:
          - ReviewPlanner_PlanAsync_RealGit_NoConfigurationOrUnknownHead_ThrowTheirRules

      - id: ReviewCenter-Core-PlanReviews-InputRefused
        title: >-
          The Core subsystem shall refuse a baseline mode that is not defined before anything is read, a head
          revision that does not exist, and a head revision that is not a plain name, with the matching rule.
        justification: |
          Cheap checks of the request come before the access to the repository.
        children:
          - ReviewCenter-ReviewPlanner-Plan-Mode
          - ReviewCenter-ReviewPlanner-Plan-HeadUnknown
          - ReviewCenter-ReviewPlanner-Plan-HeadInvalid
        tests:
          - ReviewPlanner_PlanAsync_RealGit_NoConfigurationOrUnknownHead_ThrowTheirRules

      - id: ReviewCenter-Core-PlanReviews-AccessRefused
        title: >-
          The Core subsystem shall refuse a plan for a project that does not exist, for a repository that is not a
          repository of the project or is disabled, for an actor who may not see the project, and for an actor who
          may only read it, with the matching rule.
        justification: |
          Planning prepares reviews, so it needs the same rights as creating them, and must not reveal other
          projects.
        children:
          - ReviewCenter-ReviewPlanner-Plan-ProjectMissing
          - ReviewCenter-ReviewPlanner-Plan-RepositoryMissing
          - ReviewCenter-ReviewPlanner-Plan-RepositoryOff
          - ReviewCenter-ReviewPlanner-Plan-Hidden
          - ReviewCenter-ReviewPlanner-Plan-ReadOnly

      - id: ReviewCenter-Core-PlanReviews-ArgumentsRefused
        title: >-
          The Core subsystem shall refuse to be created without any of its collaborators, and refuse a plan without
          an actor.
        justification: |
          A planner without its collaborators or an actor could not check any right.
        children:
          - ReviewCenter-ReviewPlanner-Plan-Arguments
          - ReviewCenter-ReviewPlanner-Plan-ActorMissing
      - id: ReviewCenter-Core-PlanReviews-FullReview
        title: >-
          The Core subsystem shall choose no baseline and a full review of all selected files when the user asks for
          none.
        justification: |
          A first review of a set has nothing to compare with, so it must cover every selected file.
        children:
          - ReviewCenter-ReviewPlanner-Baseline
        tests:
          - ReviewPlanner_PlanAsync_RealGit_NoBaselineAndExplicitBaseline

      - id: ReviewCenter-Core-PlanReviews-SinceRevision
        title: >-
          The Core subsystem shall use one revision given by the user as the baseline of every review-set and say
          so, and refuse a given baseline revision that does not exist with the revision not found rule.
        justification: |
          A reviewer may want everything since a release, and a revision that does not exist must not silently turn
          into a full review.
        children:
          - ReviewCenter-ReviewPlanner-Baseline-Explicit
          - ReviewCenter-ReviewPlanner-Baseline-ExplicitUnknown
        tests:
          - ReviewPlanner_PlanAsync_RealGit_NoBaselineAndExplicitBaseline

      - id: ReviewCenter-Core-PlanReviews-SinceLastApproved
        title: >-
          The Core subsystem shall choose the head of the last approved review of the same review-set, the approved
          review that was signed last, as the baseline when the user asks for the changes since the last approved
          review.
        justification: |
          Only what changed since the last approval needs a new review.
        children:
          - ReviewCenter-ReviewPlanner-Baseline-Last
          - ReviewCenter-ReviewPlanner-Baseline-LastSigned
        tests:
          - ReviewPlanner_CreateAsync_RealGit_LastReviewedBaselineThenAlreadyFiled

      - id: ReviewCenter-Core-PlanReviews-FallbackNoApproved
        title: >-
          The Core subsystem shall choose a full review with the note "no approved review of this set yet" for a
          review-set that has no approved review, also when its only review was rejected.
        justification: |
          Without an approval there is no baseline to trust, so everything must be reviewed.
        children:
          - ReviewCenter-ReviewPlanner-Baseline-NoApproved
          - ReviewCenter-ReviewPlanner-Baseline-Rejected

      - id: ReviewCenter-Core-PlanReviews-RejectedLater
        title: >-
          The Core subsystem shall keep the approved review as the baseline when a later review of the review-set
          was rejected.
        justification: |
          A rejected review does not take back an earlier approval of the files it covered.
        children:
          - ReviewCenter-ReviewPlanner-Baseline-RejectedLater

      - id: ReviewCenter-Core-PlanReviews-Fallback
        title: >-
          The Core subsystem shall choose a full review with a note, and not fail the plan, when the head of the last
          approved review is not an ancestor of the head, when that cannot be checked, or when the selection of the
          review-set changed since.
        justification: |
          Falling back to a full review whenever a baseline cannot be trusted keeps changed files from escaping
          review.
        children:
          - ReviewCenter-ReviewPlanner-Baseline-NotAncestor
          - ReviewCenter-ReviewPlanner-Baseline-AncestorUnknown
          - ReviewCenter-ReviewPlanner-Baseline-SelectionChanged
        tests:
          - ReviewPlanner_PlanAsync_RealGit_NotAncestor_FallsBackToFullReview
          - ReviewPlanner_PlanAsync_RealGit_SelectionChanged_FallsBackToFullReview

      - id: ReviewCenter-Core-PlanReviews-AlreadyFiled
        title: >-
          The Core subsystem shall mark a review-set as already filed, with the identity of the review, when a review
          of the same repository, set, head commit, baseline, and selection exists.
        justification: |
          Planning twice must not create the same review twice.
        children:
          - ReviewCenter-ReviewPlanner-Classification
        tests:
          - ReviewPlanner_CreateAsync_RealGit_LastReviewedBaselineThenAlreadyFiled

      - id: ReviewCenter-Core-PlanReviews-FiledNewSelection
        title: >-
          The Core subsystem shall mark a review-set as ready to create when a review of the same commits exists but
          for another selection.
        justification: |
          A changed selection covers other files, so the earlier review does not answer it.
        children:
          - ReviewCenter-ReviewPlanner-Classification-NewSelection

      - id: ReviewCenter-Core-PlanReviews-NothingToReview
        title: >-
          The Core subsystem shall mark a review-set as nothing to review, with a note, when its head equals the head
          of the baseline or when no selected file changed.
        justification: |
          A review without a change cannot be signed for anything.
        children:
          - ReviewCenter-ReviewPlanner-Classification-Unchanged
          - ReviewCenter-ReviewPlanner-Classification-NoChange

      - id: ReviewCenter-Core-PlanReviews-WillCreate
        title: >-
          The Core subsystem shall mark every other review-set as ready to create, and give on the plan the number
          of rows in each state.
        justification: |
          The user picks the reviews to create from the ready rows and needs the totals at a glance.
        children:
          - ReviewCenter-ReviewPlanner-Classification-WillCreate
          - ReviewCenter-ReviewPlanner-Classification-Totals

      - id: ReviewCenter-Core-PlanReviews-Create
        title: >-
          The Core subsystem shall create the picked reviews through the review service, one for every picked
          request in the order given, from the commits of the plan, with the files that changed within the selection,
          the identifier of the review-set, and the checklist of the project, using one session on the repository for
          the whole batch, and write one audit entry for every created review.
        justification: |
          Creating the reviews with the same rules as a review made by hand saves effort and mistakes.
        children:
          - ReviewCenter-ReviewPlanner-Create
          - ReviewCenter-ReviewPlanner-Create-Commits
          - ReviewCenter-ReviewPlanner-Create-Content
          - ReviewCenter-ReviewPlanner-Create-SetId
          - ReviewCenter-ReviewPlanner-Create-Session
          - ReviewCenter-ReviewPlanner-Create-Audit
          - ReviewCenter-ReviewPlanner-Create-Checklist
        tests:
          - ReviewPlanner_CreateAsync_PlanRows_CreatesReviewsWithSetIdAndOneSession

      - id: ReviewCenter-Core-PlanReviews-OwnTransaction
        title: >-
          The Core subsystem shall create each review in its own transaction, so that a failing request neither
          stops the other requests nor undoes their reviews.
        justification: |
          One bad request must not cost the user the reviews that were fine.
        children:
          - ReviewCenter-ReviewPlanner-Create-Isolation

      - id: ReviewCenter-Core-PlanReviews-ResultPerReview
        title: >-
          The Core subsystem shall give one result per request that says whether the review was created, was already
          filed, or failed, with a plain reason for a failed request that stores no review, a generic reason for an
          unexpected fault, and a fixed sentence in place of the text of a git access failure.
        justification: |
          The user needs to see what happened to each request, but a raw fault text could reveal internal details.
        children:
          - ReviewCenter-ReviewPlanner-Create-Failed
          - ReviewCenter-ReviewPlanner-Create-Fault
          - ReviewCenter-ReviewPlanner-Create-GitFailure

      - id: ReviewCenter-Core-PlanReviews-Cancel
        title: >-
          The Core subsystem shall pass on a cancellation and not report it as a failed request.
        justification: |
          A canceled batch is not a failure of the request that was running.
        children:
          - ReviewCenter-ReviewPlanner-Create-Cancel

      - id: ReviewCenter-Core-PlanReviews-ResultFiled
        title: >-
          The Core subsystem shall report a request whose review exists as already filed under that review and
          create nothing for it.
        justification: |
          Creating the batch again must not create duplicates.
        children:
          - ReviewCenter-ReviewPlanner-Create-Filed

      - id: ReviewCenter-Core-PlanReviews-RequestInvalid
        title: >-
          The Core subsystem shall fail a request whose baseline is not a full commit identifier, whose selection is
          not valid, or whose review-set identifier is too long.
        justification: |
          A request that cannot make a valid review must fail on its own and not harm the batch.
        children:
          - ReviewCenter-ReviewPlanner-Create-BadBaseline
          - ReviewCenter-ReviewPlanner-Create-BadSelection
          - ReviewCenter-ReviewPlanner-Create-BadSetId

      - id: ReviewCenter-Core-PlanReviews-BatchRefused
        title: >-
          The Core subsystem shall refuse a batch whose head is not a full commit identifier, a batch of more
          requests than the limit, a missing list of requests, a missing actor, and a batch for a project that does
          not exist, with the matching rule.
        justification: |
          A batch is bounded, and its head must name one commit so that every review covers the same state.
        children:
          - ReviewCenter-ReviewPlanner-Create-BatchHead
          - ReviewCenter-ReviewPlanner-Create-BatchSize
          - ReviewCenter-ReviewPlanner-Create-BatchArguments
          - ReviewCenter-ReviewPlanner-Create-BatchProject

      - id: ReviewCenter-Core-PlanReviews-BatchNoGit
        title: >-
          The Core subsystem shall not open the repository for a batch that is refused.
        justification: |
          Opening a repository costs time and must not be possible for a request that has no right.
        children:
          - ReviewCenter-ReviewPlanner-Create-BatchNoGit

      - id: ReviewCenter-Core-PlanReviews-BatchAccess
        title: >-
          The Core subsystem shall refuse a batch from an actor who may not see the project, with the project not
          found rule, and from an actor who may only read the project, with the actor not allowed rule.
        justification: |
          Creating reviews needs the right to author, and the existence of a project must not be revealed.
        children:
          - ReviewCenter-ReviewPlanner-Create-Hidden
          - ReviewCenter-ReviewPlanner-Create-ReadOnly

      - id: ReviewCenter-Core-PlanReviews-Identity
        title: >-
          The Core subsystem shall give every created review an identifier made from the review-set identifier with
          each character that is unsafe for page addresses replaced, the identifier "review" when nothing is left,
          and cut to the length limit so that a number suffix still fits.
        justification: |
          The identifier is used in page addresses, so it must be safe and bounded.
        children:
          - ReviewCenter-ReviewPlanner-Identity
          - ReviewCenter-ReviewPlanner-Identity-Fallback
          - ReviewCenter-ReviewPlanner-Identity-Length

      - id: ReviewCenter-Core-PlanReviews-IdentityUnique
        title: >-
          The Core subsystem shall add a number to the identifier when it is taken in the project, and try the next
          number when another user takes the identifier at the same moment.
        justification: |
          Two reviews of one set over time need different identifiers, also when users create them at once.
        children:
          - ReviewCenter-ReviewPlanner-Identity-Unique
          - ReviewCenter-ReviewPlanner-Identity-Race

      - id: ReviewCenter-Core-PlanReviews-IdentityTitle
        title: >-
          The Core subsystem shall give every created review a title that shows the title of the review-set and the
          range of the review, cut so that the whole title fits the limit and the range stays.
        justification: |
          A reader of the review list tells reviews of one set apart by the range in the title.
        children:
          - ReviewCenter-ReviewPlanner-Identity-Title
          - ReviewCenter-ReviewPlanner-Identity-TitleCut

      - id: ReviewCenter-Core-DueDate
        title: >-
          The Core subsystem shall let a review be created, by hand or from a plan, with an optional due date that is
          a calendar day in UTC, store a valid date on a review made from files or from a repository, create a
          review without a due date when none is given, and read the text of a date only as an ISO calendar date.
        justification: |
          A lead needs to see which reviews are late without asking.
        children:
          - ReviewCenter-ReviewService-DueDate
          - ReviewCenter-ReviewService-DueDate-None
          - ReviewCenter-ReviewService-DueDate-Repository
          - ReviewCenter-ReviewService-DueDate-IsoText
        tests:
          - ReviewService_CreateDraftAsync_DueDateInRange_StoresDateAndAuditsIt

      - id: ReviewCenter-Core-DueDate-Range
        title: >-
          The Core subsystem shall accept a due date only from today up to exactly two years ahead, and refuse a
          date before today or more than two years ahead, also for a review created from a repository, with the
          DueDateInvalid rule.
        justification: |
          A date in the past or far in the future is a mistake, and a review created that way would be late or
          forgotten at once.
        children:
          - ReviewCenter-ReviewService-DueDate-Range
          - ReviewCenter-ReviewService-DueDate-Repository-Range

      - id: ReviewCenter-Core-DueDate-Audit
        title: >-
          The Core subsystem shall record every setting and change of a due date in the audit trail, naming the date
          in the audit entry of the creation only when one is set, also for a review created from a repository or
          from a plan, and the old and the new date for a change.
        justification: |
          Moving a date is a decision that must be traceable.
        children:
          - ReviewCenter-ReviewService-DueDate-Audit
          - ReviewCenter-ReviewService-DueDate-Repository-Audit
          - ReviewCenter-ReviewService-DueDateChange-Audit
          - ReviewCenter-ReviewPlanner-DueDate-Audit
        tests:
          - ReviewService_SetDueDateAsync_ProjectAdmin_ChangesAndAuditsOldAndNew

      - id: ReviewCenter-Core-DueDate-OutOfDigest
        title: >-
          The Core subsystem shall keep the due date out of the record digest, so that changing it does not affect
          a signature.
        justification: |
          The date is planning information and not review content, so it must not make a signature look out of
          date.
        children:
          - ReviewCenter-ReviewService-DueDate-OutsideDigest
        tests:
          - ReviewService_SetDueDateAsync_AfterSignature_KeepsDigestAndSignature

      - id: ReviewCenter-Core-DueDate-Overdue
        title: >-
          The Core subsystem shall treat a review as overdue only while its due date is before today (UTC) and the
          review is not approved.
        justification: |
          An approved review is never late, and a review is not late on its due date.
        children:
          - ReviewCenter-ReviewService-DueDate-Overdue

      - id: ReviewCenter-Core-DueDate-Change
        title: >-
          The Core subsystem shall let a project administrator, a system administrator, and the creator of a review
          who can still contribute to it set or change the due date of the review after its creation.
        justification: |
          The people in charge of a review may move its date.
        children:
          - ReviewCenter-ReviewService-DueDateChange
          - ReviewCenter-ReviewService-DueDateChange-Creator
          - ReviewCenter-ReviewService-DueDateChange-SystemAdmin

      - id: ReviewCenter-Core-DueDate-ChangeRefused
        title: >-
          The Core subsystem shall refuse a change of the due date by a member who is neither a project administrator
          nor the creator, by a user who may not see the project, and by the creator who has become a read-only
          member, and refuse a review that does not exist, with the matching rule.
        justification: |
          The date is a promise to the lead, so only those in charge may move it, and a project must not be revealed
          to an outsider.
        children:
          - ReviewCenter-ReviewService-DueDateChange-OtherMember
          - ReviewCenter-ReviewService-DueDateChange-Outsider
          - ReviewCenter-ReviewService-DueDateChange-ReadOnlyCreator
          - ReviewCenter-ReviewService-DueDateChange-NotFound

      - id: ReviewCenter-Core-DueDate-NoToken
        title: >-
          The Core subsystem shall refuse a change of the due date by an actor that works through a personal access
          token.
        justification: |
          A script may not move a date that people committed to.
        children:
          - ReviewCenter-ReviewService-DueDateChange-ApiToken

      - id: ReviewCenter-Core-DueDate-ChangeClear
        title: >-
          The Core subsystem shall clear the due date when no date is given, and accept a date in the past when it
          changes the due date.
        justification: |
          A lead may drop a date or record that a review is already late.
        children:
          - ReviewCenter-ReviewService-DueDateChange-Clear
          - ReviewCenter-ReviewService-DueDateChange-Past

      - id: ReviewCenter-Core-DueDate-ChangeFarAhead
        title: >-
          The Core subsystem shall refuse a change to a date more than two years ahead with the DueDateInvalid rule.
        justification: |
          A date that far ahead is a mistake.
        children:
          - ReviewCenter-ReviewService-DueDateChange-FarAhead

      - id: ReviewCenter-Core-DueDate-Unchanged
        title: >-
          The Core subsystem shall change nothing and write no audit entry when the due date already has the given
          value.
        justification: |
          An entry for a change that did not happen would falsify the history.
        children:
          - ReviewCenter-ReviewService-DueDateChange-Unchanged

      - id: ReviewCenter-Core-DueDate-ApprovedLocked
        title: >-
          The Core subsystem shall refuse the change of the due date of an approved review with the ReviewLocked
          rule.
        justification: |
          An approved review is never late, and its record must not change.
        children:
          - ReviewCenter-ReviewService-DueDateChange-Locked

      - id: ReviewCenter-Core-DueDate-Concurrent
        title: >-
          The Core subsystem shall store a change of the due date only when the stored date is still the one that
          the change started from.
        justification: |
          Two people changing a date at once must not overwrite each other without knowing.
        children:
          - ReviewCenter-ReviewService-DueDateChange-Concurrent

      - id: ReviewCenter-Core-DueDate-Plan
        title: >-
          The Core subsystem shall create a review from a plan with the due date of its own request when the request
          has one, and with the default due date of the batch when it has none.
        justification: |
          A batch of reviews of one release usually shares a date, but one set may need its own.
        children:
          - ReviewCenter-ReviewPlanner-DueDate
          - ReviewCenter-ReviewPlanner-DueDate-Default
        tests:
          - ReviewPlanner_CreateAsync_DueDates_DefaultOwnAndInvalidPerRow

      - id: ReviewCenter-Core-DueDate-PlanRefused
        title: >-
          The Core subsystem shall fail only the request of a plan whose due date is refused, with the reason, and
          store no review for it.
        justification: |
          One wrong date must not cost the user the other reviews of the batch.
        children:
          - ReviewCenter-ReviewPlanner-DueDate-Refused
        tests:
          - ReviewPlanner_CreateAsync_DueDates_DefaultOwnAndInvalidPerRow

      - id: ReviewCenter-Core-Progress
        title: >-
          The Core subsystem shall answer for every review of a project which stage it is in, Setup for a review
          without a reviewer slot, In review for one that has a slot and is not concluded, Approved or Rejected for one
          that is concluded, derived from the approval status and not from the stored state, and keep a review
          whose slots are all signed in the stage In review while a blocker remains.
        justification: |
          A lead who answers for the reviews of a project needs to see where each stands, without opening every
          review. The answer is computed from what is stored, so it cannot disagree with the review page.
        children:
          - ReviewCenter-ReviewProgressService-Stage
          - ReviewCenter-ReviewProgressService-Stage-Empty
          - ReviewCenter-ReviewProgressService-Stage-Setup
          - ReviewCenter-ReviewProgressService-Stage-Approved
          - ReviewCenter-ReviewProgressService-Stage-Rejected
          - ReviewCenter-ReviewProgressService-Stage-InReview
          - ReviewCenter-ReviewProgressService-Stage-OpenThread
        tests:
          - ReviewProgressService_GetProgressAsync_SlotsAndSignatures_DeriveTheStage

      - id: ReviewCenter-Core-Progress-Reopened
        title: >-
          The Core subsystem shall keep a review that was reopened after its conclusion in the stage In review and
          flag a review as reopened only when it was reopened after its conclusion.
        justification: |
          A lead must see that a concluded review is open again.
        children:
          - ReviewCenter-ReviewProgressService-Stage-Reopened
          - ReviewCenter-ReviewProgressService-Stage-ReopenedFlag

      - id: ReviewCenter-Core-Progress-Signatures
        title: >-
          The Core subsystem shall answer for every review of a project how many signatures it has of the number
          it needs, and how many are out of date.
        justification: |
          A lead sees how far a review is from approval and which signatures a change made stale.
        children:
          - ReviewCenter-ReviewProgressService-SlotProgress
          - ReviewCenter-ReviewProgressService-SlotProgress-OutOfDate
        tests:
          - ReviewProgressService_GetProgressAsync_SlotsAndSignatures_DeriveTheStage

      - id: ReviewCenter-Core-Progress-WaitingOn
        title: >-
          The Core subsystem shall answer for every review of a project that is not concluded whom it waits on,
          the reviewers of the slots that are not signed or out of date in slot order, once each, with a disabled
          person marked.
        justification: |
          A lead who answers for a review needs to know who is holding it up.
        children:
          - ReviewCenter-ReviewProgressService-WaitingOn
          - ReviewCenter-ReviewProgressService-WaitingOn-OutOfDate
          - ReviewCenter-ReviewProgressService-WaitingOn-Alternate
          - ReviewCenter-ReviewProgressService-WaitingOn-Signed
          - ReviewCenter-ReviewProgressService-WaitingOn-Once
          - ReviewCenter-ReviewProgressService-WaitingOn-Disabled
          - ReviewCenter-ReviewProgressService-WaitingOn-Concluded

      - id: ReviewCenter-Core-Progress-Blockers
        title: >-
          The Core subsystem shall answer for every review of a project what blocks its approval, with the numbers
          that equal the blocker sentences of the approval status.
        justification: |
          The answer must never disagree with the review page.
        children:
          - ReviewCenter-ReviewProgressService-Blockers
          - ReviewCenter-ReviewProgressService-Blockers-Unanswered
          - ReviewCenter-ReviewProgressService-Blockers-Failed
          - ReviewCenter-ReviewProgressService-Blockers-Disputed
          - ReviewCenter-ReviewProgressService-Blockers-NoChecklist
          - ReviewCenter-ReviewProgressService-Blockers-ConclusionRequired
          - ReviewCenter-ReviewProgressService-Blockers-Consistent
        tests:
          - ReviewProgressService_GetProgressAsync_BlockerCounts_EqualTheApprovalBlockers

      - id: ReviewCenter-Core-Progress-Blocked
        title: >-
          The Core subsystem shall mark a review that is not concluded as blocked while any blocker exists, never
          mark a concluded review as blocked, and not block a review because of a check that the ballots agree is
          Fail.
        justification: |
          A lead needs one flag for the reviews that cannot move.
        children:
          - ReviewCenter-ReviewProgressService-Blockers-Blocked
          - ReviewCenter-ReviewProgressService-Blockers-Concluded
          - ReviewCenter-ReviewProgressService-Blockers-FailAgreed

      - id: ReviewCenter-Core-Progress-Overdue
        title: >-
          The Core subsystem shall answer for every review of a project its due date and whether it is overdue,
          from the day after the due date and only while the review is not concluded.
        justification: |
          A lead needs to see which reviews are late.
        children:
          - ReviewCenter-ReviewProgressService-Overdue
          - ReviewCenter-ReviewProgressService-Overdue-DueDay
          - ReviewCenter-ReviewProgressService-Overdue-NoDate
          - ReviewCenter-ReviewProgressService-Overdue-Concluded
          - ReviewCenter-ReviewProgressService-Overdue-DueDate

      - id: ReviewCenter-Core-Progress-LastActivity
        title: >-
          The Core subsystem shall answer for every review of a project when it last changed according to the audit
          trail, with one read of the audit trail for all reviews.
        justification: |
          A lead sees which reviews have gone quiet.
        children:
          - ReviewCenter-ReviewProgressService-LastActivity
          - ReviewCenter-ReviewProgressService-LastActivity-Created
          - ReviewCenter-ReviewProgressService-LastActivity-OneRead
        tests:
          - ReviewProgressService_GetProgressAsync_ManyReviews_ReadsActivityOnceAndIsFast

      - id: ReviewCenter-Core-Progress-ViewerRights
        title: >-
          The Core subsystem shall give the progress of a project to every user who may see the project, a read-only
          auditor included, and check the access also when the caller gives the list of reviews.
        justification: |
          Everyone who may see a project may see how its reviews stand.
        children:
          - ReviewCenter-ReviewProgressService-ViewerRights
          - ReviewCenter-ReviewProgressService-ViewerRights-GivenList

      - id: ReviewCenter-Core-Progress-ViewerRefused
        title: >-
          The Core subsystem shall refuse the progress of a project to a user outside the project, to a missing
          actor, and to a user whose account is disabled, with the ProjectNotFound rule.
        justification: |
          The answer must not tell a stranger that a project exists.
        children:
          - ReviewCenter-ReviewProgressService-ViewerRights-NotFound
          - ReviewCenter-ReviewProgressService-ViewerRights-Disabled

      - id: ReviewCenter-Core-Progress-TokenViewer
        title: >-
          The Core subsystem shall give a personal access token the same masked standing as any other viewer, except
          that the token of the owner of a slot sees its own ballot once it is handed in the consolidation and
          not before.
        justification: |
          A script must not see what its owner may not see yet.
        children:
          - ReviewCenter-ReviewProgressService-ViewerRights-TokenMasked
          - ReviewCenter-ReviewProgressService-ViewerRights-TokenSubmitted
          - ReviewCenter-ReviewProgressService-ViewerRights-TokenDraft

      - id: ReviewCenter-Core-Progress-Performance
        title: >-
          The Core subsystem shall read the approval statuses of all reviews of a project with one batch read, and
          read the list of reviews once, or not at all when the caller gives it.
        justification: |
          The cost of the answer must not grow with the number of reviews.
        children:
          - ReviewCenter-ReviewProgressService-Performance
          - ReviewCenter-ReviewProgressService-Performance-ReviewList
          - ReviewCenter-ReviewProgressService-Performance-ListGiven
          - ReviewCenter-ReviewProgressService-Performance-ListEmpty
        tests:
          - ReviewProgressService_GetProgressAsync_ManyReviews_ReadsActivityOnceAndIsFast

      - id: ReviewCenter-Core-Progress-Bound
        title: >-
          The Core subsystem shall answer for a project with 300 reviews within ten seconds.
        justification: |
          A project page must stay usable for a large project.
        children:
          - ReviewCenter-ReviewProgressService-Performance-Bound
        tests:
          - ReviewProgressService_GetProgressAsync_ManyReviews_ReadsActivityOnceAndIsFast

      - id: ReviewCenter-Core-Progress-GivenList
        title: >-
          The Core subsystem shall answer only for the reviews of a list that the caller gives, in the order of
          the list.
        justification: |
          A page that shows some reviews needs the progress of those only.
        children:
          - ReviewCenter-ReviewProgressService-Performance-ListSubset

      - id: ReviewCenter-Core-Progress-Arguments
        title: >-
          The Core subsystem shall refuse a null review service, signing service, audit store, access rule, or list
          of reviews when the progress is built or asked for.
        justification: |
          A missing part must fail at once and not later in a page.
        children:
          - ReviewCenter-ReviewProgressService-Arguments
          - ReviewCenter-ReviewProgressService-Arguments-ReviewList

      - id: ReviewCenter-Core-Progress-KindCounts
        title: >-
          The Core subsystem shall count the open questions and the open findings of every review apart, with open
          threads equal to their sum, worded by kind, and worded as a plain count when the kinds are not known.
        justification: |
          A question and a finding ask for different action, so a lead sees them apart.
        children:
          - ReviewCenter-ReviewProgressService-KindCounts
          - ReviewCenter-ReviewProgressService-KindCounts-Sum
          - ReviewCenter-ReviewProgressService-KindCounts-Words
          - ReviewCenter-ReviewProgressService-KindCounts-Fallback

      - id: ReviewCenter-Core-Progress-BallotCounts
        title: >-
          The Core subsystem shall answer for every review that has a checklist how many ballots were handed in of
          the ballots it needs, one for every reviewer slot, and name the reviewers whose ballot is missing, a
          disabled person marked, for a review that is not concluded.
        justification: |
          A lead sees who still has to hand in a ballot.
        children:
          - ReviewCenter-ReviewProgressService-BallotProgress
          - ReviewCenter-ReviewProgressService-BallotProgress-ConcludedCounts
          - ReviewCenter-ReviewProgressService-BallotProgress-Names
          - ReviewCenter-ReviewProgressService-BallotProgress-Disabled
          - ReviewCenter-ReviewProgressService-BallotProgress-NoChecklist
          - ReviewCenter-ReviewProgressService-BallotProgress-Concluded

      - id: ReviewCenter-Core-Progress-MaskedBallots
        title: >-
          The Core subsystem shall give a viewer who may not see the ballots the same ballot counts as everyone,
          mark the progress as masked, give zero disputed and zero failed checks, and not count the discussions
          about checks.
        justification: |
          The counts of a viewer must not reveal what the ballots say before they are handed in.
        children:
          - ReviewCenter-ReviewProgressService-BallotProgress-MaskedCounts
          - ReviewCenter-ReviewProgressService-BallotProgress-MaskedFlag
          - ReviewCenter-ReviewProgressService-BallotProgress-MaskedBlockers
          - ReviewCenter-ReviewProgressService-KindCounts-MaskedChecks

      - id: ReviewCenter-Core-Progress-ApprovalCounts
        title: >-
          The Core subsystem shall return with the approval status of a review the numbers of open threads,
          unanswered, failed, and disputed checks, calculated in the same step as the blocker sentences, and for each
          person of a slot whether the account is enabled.
        justification: |
          The progress and the review page must show the same numbers.
        children:
          - ReviewCenter-SigningService-ProgressCounts
          - ReviewCenter-SigningService-ProgressCounts-Unanswered
          - ReviewCenter-SigningService-ProgressCounts-Failed
          - ReviewCenter-SigningService-ProgressCounts-Disputed
          - ReviewCenter-SigningService-ProgressCounts-SameAsSentences
          - ReviewCenter-SigningService-ProgressCounts-AccountEnabled

      - id: ReviewCenter-Core-UserImpact
        title: >-
          The Core subsystem shall answer, for a user who may leave, which reviewer slots of unlocked reviews still
          wait for the user, as primary or alternate, not signed or out of date, also for a disabled user, with the
          project, the review, and the state of each slot.
        justification: |
          Before a person is disabled, their open review work has to be handed over. The answer is computed from what
          is stored by the rules the inbox already uses.
        children:
          - ReviewCenter-UserImpactService-OpenWork
          - ReviewCenter-UserImpactService-OpenWork-Fields
          - ReviewCenter-UserImpactService-OpenWork-NotSigned
          - ReviewCenter-UserImpactService-OpenWork-OutOfDate
          - ReviewCenter-UserImpactService-OpenWork-SignedLeftOut
          - ReviewCenter-UserImpactService-OpenWork-ApprovedLeftOut
          - ReviewCenter-UserImpactService-OpenWork-DisabledUser
        tests:
          - UserImpactService_GetImpactAsync_PrimaryAndAlternateSlots_AreOpenWork

      - id: ReviewCenter-Core-UserImpact-Ordering
        title: >-
          The Core subsystem shall order the open work of a user by project name, then by review identifier, then
          by the number of the slot.
        justification: |
          A person who hands work over needs a list in a stable order.
        children:
          - ReviewCenter-UserImpactService-OpenWork-Ordering
          - ReviewCenter-UserImpactService-OpenWork-Ordering-Slot

      - id: ReviewCenter-Core-UserImpact-BatchRead
        title: >-
          The Core subsystem shall read the snapshots of the reviews of a project with one batch read when it
          answers for a user.
        justification: |
          The cost of the answer must not grow with the number of reviews.
        children:
          - ReviewCenter-UserImpactService-OpenWork-BatchRead

      - id: ReviewCenter-Core-UserImpact-SoleAdmin
        title: >-
          The Core subsystem shall answer, for a user who may leave, in which projects the user is the only enabled
          project administrator, and not count a disabled account, a plain member, or a system administrator who is
          not a project administrator as another administrator.
        justification: |
          No project may be left without an administrator.
        children:
          - ReviewCenter-UserImpactService-SoleAdmin
          - ReviewCenter-UserImpactService-SoleAdmin-OtherAdmin
          - ReviewCenter-UserImpactService-SoleAdmin-DisabledNotCounted
          - ReviewCenter-UserImpactService-SoleAdmin-MemberNotCounted
          - ReviewCenter-UserImpactService-SoleAdmin-SystemAdminNotCounted
        tests:
          - UserImpactService_GetImpactAsync_OnlyEnabledProjectAdministrator_IsSoleAdmin

      - id: ReviewCenter-Core-UserImpact-Scope
        title: >-
          The Core subsystem shall answer the impact of a user to a system administrator for every project and to a
          project administrator, for any user, only for the projects the asker administers.
        justification: |
          The answer is limited to those who run projects and to the projects they run.
        children:
          - ReviewCenter-UserImpactService-Scope
          - ReviewCenter-UserImpactService-Scope-ProjectAdmin
        tests:
          - UserImpactService_GetImpactAsync_ProjectAdministrator_SeesOnlyOwnProjects

      - id: ReviewCenter-Core-UserImpact-Refused
        title: >-
          The Core subsystem shall refuse as not allowed an actor who administers no project or whose account is
          disabled, before it tells whether the user exists, and report a user that does not exist as not found to
          an administrator.
        justification: |
          A person who may not ask must not learn who exists.
        children:
          - ReviewCenter-UserImpactService-Scope-Refused
          - ReviewCenter-UserImpactService-Scope-DisabledAdmin
          - ReviewCenter-UserImpactService-Scope-NoLeak
          - ReviewCenter-UserImpactService-Scope-UserNotFound

      - id: ReviewCenter-Core-UserImpact-Arguments
        title: >-
          The Core subsystem shall refuse a null actor and a null review store, user store, or access rule when the
          impact of a user is asked for.
        justification: |
          A missing part must fail at once.
        children:
          - ReviewCenter-UserImpactService-Arguments

      - id: ReviewCenter-Core-BallotConsolidation
        title: >-
          The Core subsystem shall report a check of a section that applies as agreed, with its outcome, when every
          submitted ballot answers it with the same outcome.
        justification: |
          A signature must attest what the reviewers have handed in and agree on. The standing of the checks is derived
          only from the submitted ballots by one pure rule, so that every page and every signature sees the same
          agreement.
        children:
          - ReviewCenter-BallotConsolidation-PerCheck
        tests:
          - BallotConsolidation_Consolidate_SubmittedEqual_Agreed

      - id: ReviewCenter-Core-BallotConsolidation-Disputed
        title: >-
          The Core subsystem shall report a check as disputed when the submitted ballots answer it with different
          outcomes, also when one submitted ballot passes it and another marks it not applicable.
        justification: |
          A check on which reviewers disagree must be settled by people and not hidden by a rule.
        children:
          - ReviewCenter-BallotConsolidation-PerCheck-Disputed
          - ReviewCenter-BallotConsolidation-PerCheck-PassVsNa

      - id: ReviewCenter-Core-BallotConsolidation-Pending
        title: >-
          The Core subsystem shall report a check as pending when a submitted ballot does not answer it, and every
          check as pending when no ballot is submitted.
        justification: |
          A check that nobody has settled must not count as agreed.
        children:
          - ReviewCenter-BallotConsolidation-PerCheck-Pending
          - ReviewCenter-BallotConsolidation-PerCheck-NoBallot

      - id: ReviewCenter-Core-BallotConsolidation-NotApplicableCheck
        title: >-
          The Core subsystem shall report a check that every submitted ballot marks as not applicable as agreed,
          neither failing nor blocking.
        justification: |
          A check that does not apply must not hold up an approval.
        children:
          - ReviewCenter-BallotConsolidation-PerCheck-NotFailure
          - ReviewCenter-BallotConsolidation-PerCheck-NotBlocking

      - id: ReviewCenter-Core-BallotConsolidation-CheckOutcomes
        title: >-
          The Core subsystem shall list the outcome that each submitted ballot gave for a check, by slot, and never
          let a justification or a note decide between agreement and dispute.
        justification: |
          A reader sees who answered what, and the agreement rests on the outcomes alone.
        children:
          - ReviewCenter-BallotConsolidation-PerCheck-NoteIgnored
          - ReviewCenter-BallotConsolidation-PerCheck-Outcomes

      - id: ReviewCenter-Core-BallotConsolidation-SubmittedOnly
        title: >-
          The Core subsystem shall let only submitted ballots take part in the consolidation, so that the answers
          and the section states of a draft never change the result.
        justification: |
          A reviewer's unfinished work must not change what is already agreed or disputed.
        children:
          - ReviewCenter-BallotConsolidation-SubmittedOnly
          - ReviewCenter-BallotConsolidation-SubmittedOnly-DraftSections
        tests:
          - BallotConsolidation_Consolidate_OneSubmittedOneDraft_OnlySubmittedCounts

      - id: ReviewCenter-Core-BallotConsolidation-Order
        title: >-
          The Core subsystem shall give the same result for the same ballots in any order, and list the checks of
          the result in the order of the checklist.
        justification: |
          Every page and every signature must see the same result.
        children:
          - ReviewCenter-BallotConsolidation-SubmittedOnly-Order
          - ReviewCenter-BallotConsolidation-SubmittedOnly-ChecklistOrder

      - id: ReviewCenter-Core-BallotConsolidation-Applicability
        title: >-
          The Core subsystem shall report a section as not applicable when every submitted ballot marks it not
          applicable, as disputed when some mark it not applicable and others do not, and as applicable when none
          marks it not applicable.
        justification: |
          A section that does not apply must not need answers, and a disagreement about it must be settled.
        children:
          - ReviewCenter-BallotConsolidation-Applicability
          - ReviewCenter-BallotConsolidation-Applicability-Disputed
          - ReviewCenter-BallotConsolidation-Applicability-Applicable

      - id: ReviewCenter-Core-BallotConsolidation-SectionChecks
        title: >-
          The Core subsystem shall leave out the checks of a section that is not applicable and of a section that is
          disputed from the result.
        justification: |
          Only the checks of an applicable section can be agreed or settled.
        children:
          - ReviewCenter-BallotConsolidation-Applicability-ChecksOmitted
          - ReviewCenter-BallotConsolidation-Applicability-DisputedChecksOmitted

      - id: ReviewCenter-Core-BallotConsolidation-SectionDisputeCount
        title: >-
          The Core subsystem shall count the dispute of a section once and not once for each of its checks.
        justification: |
          A lead must see how many disagreements exist and not how large the section is.
        children:
          - ReviewCenter-BallotConsolidation-Applicability-DisputeCount

      - id: ReviewCenter-Core-BallotConsolidation-Outcome
        title: >-
          The Core subsystem shall give no outcome of the consolidation while no ballot is submitted, while a check
          is pending or disputed, or while a section is disputed.
        justification: |
          The outcome exists only when there is nothing left to settle.
        children:
          - ReviewCenter-BallotConsolidation-Outcome
          - ReviewCenter-BallotConsolidation-Outcome-Pending
          - ReviewCenter-BallotConsolidation-Outcome-DisputedCheck
          - ReviewCenter-BallotConsolidation-Outcome-DisputedSection

      - id: ReviewCenter-Core-BallotConsolidation-OutcomeRejected
        title: >-
          The Core subsystem shall give the outcome rejected when an agreed check is a fail.
        justification: |
          An agreed failure cannot be approved.
        children:
          - ReviewCenter-BallotConsolidation-Outcome-Rejected
        tests:
          - BallotConsolidation_Consolidate_AgreedFail_Rejected

      - id: ReviewCenter-Core-BallotConsolidation-OutcomeApproved
        title: >-
          The Core subsystem shall give the outcome approved when every check is agreed and none of the agreed checks
          is a fail, also for a checklist without checks that has a submitted ballot.
        justification: |
          Approval needs agreement and nothing left to settle.
        children:
          - ReviewCenter-BallotConsolidation-Outcome-Approved
          - ReviewCenter-BallotConsolidation-Outcome-NoChecks

      - id: ReviewCenter-Core-BallotConsolidation-Counts
        title: >-
          The Core subsystem shall count the agreed, disputed, pending, and failed checks of the result, with the
          agreed, disputed, and pending counts adding up to the listed checks.
        justification: |
          A lead sees how far the ballots are from agreement.
        children:
          - ReviewCenter-BallotConsolidation-Counts
          - ReviewCenter-BallotConsolidation-Counts-Sum

      - id: ReviewCenter-Core-BallotConsolidation-BallotCounts
        title: >-
          The Core subsystem shall count the submitted ballots and all ballots of the result.
        justification: |
          A lead sees how many reviewers have handed in.
        children:
          - ReviewCenter-BallotConsolidation-Counts-BallotCounts

      - id: ReviewCenter-Core-BallotConsolidation-ReadOnly
        title: >-
          The Core subsystem shall give a consolidation result whose check list, section list, and outcomes cannot be
          changed by the caller, with the outcomes in ascending slot order.
        justification: |
          A page must not be able to change the agreement it displays.
        children:
          - ReviewCenter-BallotConsolidation-ReadOnly

      - id: ReviewCenter-Core-BallotConsolidation-Complete
        title: >-
          The Core subsystem shall tell that a ballot is complete when every check of every section that the ballot
          treats as applicable has an answer of any outcome, ask for no answer in a section that the ballot marks as
          not applicable, and tell it whatever the status of the ballot.
        justification: |
          A reviewer must know whether the ballot is ready to hand in.
        children:
          - ReviewCenter-BallotConsolidation-Complete
          - ReviewCenter-BallotConsolidation-Complete-Missing
          - ReviewCenter-BallotConsolidation-Complete-NotApplicableSection
          - ReviewCenter-BallotConsolidation-Complete-Status

      - id: ReviewCenter-Core-BallotConsolidation-BallotState
        title: >-
          The Core subsystem shall show a submitted ballot as submitted and every ballot that is not submitted as a
          draft, and never show an existing ballot as not started.
        justification: |
          Whether a ballot takes part in the agreement depends on this state.
        children:
          - ReviewCenter-BallotConsolidation-BallotState
          - ReviewCenter-BallotConsolidation-BallotState-Draft

      - id: ReviewCenter-Core-BallotConsolidation-Arguments
        title: >-
          The Core subsystem shall refuse a null checklist, a null list of ballots, a list that holds a null ballot,
          or a list that holds two ballots of one slot when it consolidates ballots, and a null checklist or ballot
          when it tells whether a ballot is complete.
        justification: |
          A wrong input must fail at once and not produce an agreement that is wrong.
        children:
          - ReviewCenter-BallotConsolidation-Arguments
          - ReviewCenter-BallotConsolidation-Arguments-NullBallots
          - ReviewCenter-BallotConsolidation-Arguments-NullBallot
          - ReviewCenter-BallotConsolidation-Arguments-DuplicateSlot
          - ReviewCenter-BallotConsolidation-Arguments-CompleteArguments

      - id: ReviewCenter-Core-BallotConsolidation-Projection
        title: >-
          The Core subsystem shall build the consolidated view of a record from its submitted ballots only, answer an
          agreed check with the row of the lowest slot that answered it, give a pending or disputed check no answer,
          and give a section that every submitted ballot marks as not applicable the row of the lowest such slot.
        justification: |
          A draft ballot of any slot must take no part in what everyone sees.
        children:
          - ReviewCenter-BallotConsolidation-Projection
          - ReviewCenter-BallotConsolidation-Projection-AgreedRow
          - ReviewCenter-BallotConsolidation-Projection-NoAnswer
          - ReviewCenter-BallotConsolidation-Projection-SectionRow

      - id: ReviewCenter-Core-BallotConsolidation-ProjectionSingleSlot
        title: >-
          The Core subsystem shall read the sole draft ballot of a review with exactly one slot as submitted, for
          progress and blockers only, when the caller gives the number of slots, and not read a draft ballot as
          submitted when the caller gives no number of slots.
        justification: |
          A review with one slot has nobody to agree with and no separate hand-in step.
        children:
          - ReviewCenter-BallotConsolidation-Projection-SingleSlot
          - ReviewCenter-BallotConsolidation-Projection-SingleSlotOnly

      - id: ReviewCenter-Core-BallotConsolidation-ProjectionNoChecklist
        title: >-
          The Core subsystem shall give no consolidated view for a record without a checklist.
        justification: |
          Without a checklist there is nothing to agree on.
        children:
          - ReviewCenter-BallotConsolidation-Projection-NoChecklist

      - id: ReviewCenter-Core-BallotConsolidation-ProjectionOwnBallot
        title: >-
          The Core subsystem shall show a viewer the state of the viewer's own ballot, a draft included, marked as
          the viewer's own, and show a slot that has no ballot as an empty state that is not started.
        justification: |
          A reviewer needs to see and edit the own draft.
        children:
          - ReviewCenter-BallotConsolidation-Projection-OwnBallot
          - ReviewCenter-BallotConsolidation-Projection-NotStarted

      - id: ReviewCenter-Core-BallotConsolidation-ProjectionArguments
        title: >-
          The Core subsystem shall refuse a missing record, and a missing checklist definition when it builds the
          view of a record, with an ArgumentNullException.
        justification: |
          A wrong input must fail at once.
        children:
          - ReviewCenter-BallotConsolidation-Projection-Arguments
          - ReviewCenter-BallotConsolidation-Projection-DefinitionArgument

      - id: ReviewCenter-Core-BallotConsolidation-EditBallots
        title: >-
          The Core subsystem shall replace the ballot of a slot that already has one, add the ballot of a slot that
          has none, and remove only the ballot of the named slot, keeping the ballots in slot order and removing
          nothing for a slot that has no ballot.
        justification: |
          A change of one reviewer's ballot must not touch the others.
        children:
          - ReviewCenter-BallotConsolidation-Edits
          - ReviewCenter-BallotConsolidation-Edits-AddBallot
          - ReviewCenter-BallotConsolidation-Edits-RemoveBallot
          - ReviewCenter-BallotConsolidation-Edits-RemoveUnknown

      - id: ReviewCenter-Core-BallotConsolidation-EditAnswers
        title: >-
          The Core subsystem shall replace the earlier answer for the same check with a stored answer, keep the
          answers in check order, make the ballot a draft without submission time and submitter, and create a draft
          that holds just the answer for a slot that has no ballot.
        justification: |
          A changed answer must be handed in again before it counts.
        children:
          - ReviewCenter-BallotConsolidation-Edits-AnswerReplaced
          - ReviewCenter-BallotConsolidation-Edits-AnswerOrder
          - ReviewCenter-BallotConsolidation-Edits-AnswerDraft
          - ReviewCenter-BallotConsolidation-Edits-AnswerNewBallot

      - id: ReviewCenter-Core-BallotConsolidation-EditSections
        title: >-
          The Core subsystem shall replace the earlier state of the same section with a stored section state, make
          the ballot a draft, and create a draft that holds just the section state for a slot that has no ballot.
        justification: |
          A changed section state must be handed in again before it counts.
        children:
          - ReviewCenter-BallotConsolidation-Edits-SectionReplaced
          - ReviewCenter-BallotConsolidation-Edits-SectionDraft
          - ReviewCenter-BallotConsolidation-Edits-SectionNewBallot

      - id: ReviewCenter-Core-BallotConsolidation-EditReassign
        title: >-
          The Core subsystem shall, when a slot is reassigned, drop the answers and the section states that a
          departing reviewer gave, comparing the user names ignoring case, keep the rows that were carried from an
          earlier review and the rows that other reviewers gave, and revert the ballot of that slot to a draft.
        justification: |
          A new reviewer must not inherit the judgment of the one who left.
        children:
          - ReviewCenter-BallotConsolidation-Edits-ReassignAnswers
          - ReviewCenter-BallotConsolidation-Edits-ReassignSections
          - ReviewCenter-BallotConsolidation-Edits-ReassignCase
          - ReviewCenter-BallotConsolidation-Edits-ReassignKeepsCarried
          - ReviewCenter-BallotConsolidation-Edits-ReassignKeepsOthers
          - ReviewCenter-BallotConsolidation-Edits-ReassignDraft

      - id: ReviewCenter-Core-BallotConsolidation-EditInput
        title: >-
          The Core subsystem shall leave the input record or ballot of a change of ballots unchanged, and refuse
          missing arguments with an ArgumentNullException.
        justification: |
          A change gives a new value and never edits the stored one in place.
        children:
          - ReviewCenter-BallotConsolidation-Edits-InputUnchanged
          - ReviewCenter-BallotConsolidation-Edits-Arguments

      - id: ReviewCenter-Core-BallotVisibility
        title: >-
          The Core subsystem shall keep the answers of the other reviewers of a review with several reviewer slots
          from every viewer who has not handed in their own ballot, a project member who holds no slot and a slot
          owner without a handed-in ballot included, and treat a viewer it does not know as such a viewer.
        justification: |
          Reviewers add value only when they judge on their own. One rule decides who may see the others and every
          reader of the ballots asks it, so that no summary, list, or history can reveal what the checklist hides.
        children:
          - ReviewCenter-BallotVisibility-Rule-HiddenFromOthers
          - ReviewCenter-BallotVisibility-Rule-UnknownViewer
        tests:
          - BallotVisibility_CanSeeOthers_PlainContributorWithoutSlot_Masked

      - id: ReviewCenter-Core-BallotVisibility-HandedIn
        title: >-
          The Core subsystem shall let a viewer see the answers of the other reviewers of a review with several
          reviewer slots when the viewer has handed in their own ballot.
        justification: |
          A reviewer who has judged on their own may compare.
        children:
          - ReviewCenter-BallotVisibility-Rule

      - id: ReviewCenter-Core-BallotVisibility-Privileged
        title: >-
          The Core subsystem shall let a viewer who leads the review, administers the project, is a system
          administrator, or is an auditor see the answers of the other reviewers without a ballot of their own.
        justification: |
          Those who run or check a review must see how it stands.
        children:
          - ReviewCenter-BallotVisibility-Rule-LeadAdminAuditor

      - id: ReviewCenter-Core-BallotVisibility-Concluded
        title: >-
          The Core subsystem shall let every viewer see the answers of the other reviewers of a concluded review.
        justification: |
          Nothing is left to influence once the review is concluded.
        children:
          - ReviewCenter-BallotVisibility-Rule-Concluded

      - id: ReviewCenter-Core-BallotVisibility-SingleSlot
        title: >-
          The Core subsystem shall never hide the answers of the reviewers from a viewer who may view the project in
          a review with one slot or none, and show a viewer who holds no slot in a review with a single slot the
          answers of that slot, not masked.
        justification: |
          With one slot nobody can influence anybody.
        children:
          - ReviewCenter-BallotVisibility-Rule-SingleSlot
          - ReviewCenter-ChecklistService-OwnBallotView-Consolidated

      - id: ReviewCenter-Core-BallotVisibility-BallotView
        title: >-
          The Core subsystem shall give a viewer who may see the others a ballot view of a review that lists, in the
          order of the slots, what each submitted ballot answered for every check the submitted ballots answer
          differently, together with the consolidated standing, and give no ballot view for a review that does not
          exist.
        justification: |
          A reviewer who handed in can compare the differing answers side by side and settle them.
        children:
          - ReviewCenter-BallotVisibility-BallotView
          - ReviewCenter-BallotVisibility-BallotView-MissingReview
          - ReviewCenter-BallotVisibility-BallotView-OnlyWhenVisible
        tests:
          - ChecklistService_GetBallotView_SubmittedViewer_ListsDifferingChecksInSlotOrder

      - id: ReviewCenter-Core-BallotVisibility-HandInCounts
        title: >-
          The Core subsystem shall tell every viewer how many ballots are handed in out of how many.
        justification: |
          Who has handed in is not secret, and reviewers wait for each other.
        children:
          - ReviewCenter-BallotVisibility-BallotView-HandInCounts

      - id: ReviewCenter-Core-BallotVisibility-AssignShortcut
        title: >-
          The Core subsystem shall offer a viewer to add themselves as a reviewer only when the viewer is a member
          who may be a reviewer and holds no slot.
        justification: |
          A shortcut that cannot work must not be offered.
        children:
          - ReviewCenter-BallotVisibility-BallotView-AssignShortcut

      - id: ReviewCenter-Core-BallotVisibility-SubmitAndSign
        title: >-
          The Core subsystem shall offer submitting and signing in one step only when the own ballot is a complete
          draft in a review with several slots and nothing but the hand-in blocks the signature.
        justification: |
          The shortcut must not let a reviewer sign without seeing how the others answered.
        children:
          - ReviewCenter-BallotVisibility-BallotView-SubmitAndSign

      - id: ReviewCenter-Core-BallotVisibility-ViewHidden
        title: >-
          The Core subsystem shall give a viewer who may not see the others, whether the viewer holds no slot or
          uses an API token, an empty checklist state that is marked hidden, with no consolidation and no differing
          check, no failed check count, and no reason of another reviewer, and treat an API token like any other
          viewer and never as the lead, an administrator, or an auditor.
        justification: |
          A script must not see what its owner may not see yet.
        children:
          - ReviewCenter-BallotVisibility-BallotView-HiddenState
          - ReviewCenter-BallotVisibility-BallotView-TokenMasked
          - ReviewCenter-ChecklistService-BallotViewDetails-Hidden

      - id: ReviewCenter-Core-BallotVisibility-ViewerRequired
        title: >-
          The Core subsystem shall require a viewer for every read of the consolidated standing.
        justification: |
          A read without a viewer could not apply the rule.
        children:
          - ReviewCenter-BallotVisibility-BallotView-ViewerRequired

      - id: ReviewCenter-Core-BallotVisibility-NoDisputeLeak
        title: >-
          The Core subsystem shall give a viewer who may not see the others no disputed or failed count in the
          approval status and in the progress overview.
        justification: |
          A count of disputes would reveal what the hidden ballots say.
        children:
          - ReviewCenter-BallotVisibility-NoDisputeLeak
          - ReviewCenter-BallotVisibility-NoDisputeLeak-Progress
        tests:
          - SigningService_GetApproval_MaskedViewer_ShowsNoDisputeCountOrOutcome

      - id: ReviewCenter-Core-BallotVisibility-NoOutcomeLeak
        title: >-
          The Core subsystem shall give a viewer who may not see the others no outcome and no conclusion text in the
          approval status.
        justification: |
          The provisional outcome would reveal the answers of the others.
        children:
          - ReviewCenter-BallotVisibility-NoDisputeLeak-ApprovalOutcome

      - id: ReviewCenter-Core-BallotVisibility-NoInboxLeak
        title: >-
          The Core subsystem shall give a viewer who may not see the others no inbox row about a dispute or a failed
          check, and not count a discussion about a check as news in an inbox row of such a viewer.
        justification: |
          An inbox row would reveal what the hidden ballots say.
        children:
          - ReviewCenter-BallotVisibility-NoDisputeLeak-Inbox
          - ReviewCenter-BallotVisibility-NoDisputeLeak-DiscussionNotNews

      - id: ReviewCenter-Core-BallotVisibility-HandedInVisible
        title: >-
          The Core subsystem shall give every viewer the same ballot progress, who has handed in and not what was
          answered, and keep the state of the ballot of each slot in the approval status of a viewer who may not see
          the others.
        justification: |
          Who has handed in is not secret, and reviewers wait for each other.
        children:
          - ReviewCenter-BallotVisibility-NoDisputeLeak-ProgressSameForAll
          - ReviewCenter-BallotVisibility-NoDisputeLeak-ApprovalBallotState

      - id: ReviewCenter-Core-BallotVisibility-FixedText
        title: >-
          The Core subsystem shall say in one fixed sentence that the standing is hidden until a viewer who may not
          see the others hands in their own ballot, with the same texts for a list of reviews as for a single review.
        justification: |
          A fixed sentence cannot carry the answers it hides.
        children:
          - ReviewCenter-BallotVisibility-NoDisputeLeak-FixedSentence
          - ReviewCenter-BallotVisibility-NoDisputeLeak-BatchSameAsSingle

      - id: ReviewCenter-Core-BallotVisibility-Discussions
        title: >-
          The Core subsystem shall leave the discussions about checks out of the list of threads for a viewer who may
          not see the others.
        justification: |
          A discussion about a check can reveal what the hidden ballots say.
        children:
          - ReviewCenter-BallotVisibility-Discussions

      - id: ReviewCenter-Core-BallotVisibility-FileDiscussions
        title: >-
          The Core subsystem shall keep the discussions about files in the list of threads of a viewer who may not
          see the others.
        justification: |
          A discussion about a file reveals no answer of a ballot.
        children:
          - ReviewCenter-BallotVisibility-Discussions-FileThreadsStay

      - id: ReviewCenter-Core-BallotVisibility-DiscussionStart
        title: >-
          The Core subsystem shall tell the lead of the review, a system administrator, a slot owner who has handed
          in, and the owner of the only slot that they may start a discussion about a check.
        justification: |
          A discussion about a check can reveal an answer, so only those who may see the others may start one.
        children:
          - ReviewCenter-BallotVisibility-Discussions-StartAllowed

      - id: ReviewCenter-Core-BallotVisibility-DiscussionStartRefused
        title: >-
          The Core subsystem shall tell a person who is none of the lead of the review, a system administrator, a
          slot owner who has handed in, or the owner of the only slot that they may not start a discussion about a
          check.
        justification: |
          A person who may not see the others must not learn them from a discussion they start.
        children:
          - ReviewCenter-BallotVisibility-Discussions-StartRefused

      - id: ReviewCenter-Core-BallotVisibility-AuditMasking
        title: >-
          The Core subsystem shall replace the detail of an audit entry that names an answer, a change of the
          applicability of a section, or the start of a discussion about a check, and the detail of every later entry
          of such a discussion, by a fixed sentence for a viewer who may not see the others, also when the entries
          do not show the discussion to be about a file.
        justification: |
          The audit trail is read by everyone who sees the project, so it must not reveal the hidden answers.
        children:
          - ReviewCenter-BallotVisibility-AuditMasking
          - ReviewCenter-BallotVisibility-AuditMasking-Applicability
          - ReviewCenter-BallotVisibility-AuditMasking-CheckDiscussionStart
          - ReviewCenter-BallotVisibility-AuditMasking-LaterEntries
          - ReviewCenter-BallotVisibility-AuditMasking-UnknownThread
        tests:
          - AuditMasking_ForViewer_OtherAnswer_HidesDetailKeepsActorAndHash

      - id: ReviewCenter-Core-BallotVisibility-AuditKept
        title: >-
          The Core subsystem shall keep the detail of the entries of a discussion about a file for a viewer who may
          not see the others, keep the action, the actor, the time, and the hashes of every entry as stored, and never
          hide the entries of the viewer themselves.
        justification: |
          Only what reveals an answer is hidden, so the chain of the trail still verifies.
        children:
          - ReviewCenter-BallotVisibility-AuditMasking-FileThreadKept
          - ReviewCenter-BallotVisibility-AuditMasking-MetadataKept
          - ReviewCenter-BallotVisibility-AuditMasking-OwnEntries

      - id: ReviewCenter-Core-BallotVisibility-AuditVisibleViewer
        title: >-
          The Core subsystem shall return the audit entries unchanged for a viewer who may see the others.
        justification: |
          Those who may see the others lose nothing.
        children:
          - ReviewCenter-BallotVisibility-AuditMasking-VisibleViewerUnchanged

      - id: ReviewCenter-Core-BallotVisibility-AuditUnknownViewer
        title: >-
          The Core subsystem shall treat a viewer it does not know as a viewer who may not see the others when it
          masks audit entries.
        justification: |
          A missing viewer must get the safe result.
        children:
          - ReviewCenter-BallotVisibility-AuditMasking-UnknownViewer

      - id: ReviewCenter-Core-BallotVisibility-AuditNullRefused
        title: >-
          The Core subsystem shall refuse a null list of entries when it masks audit entries.
        justification: |
          A wrong input must fail at once.
        children:
          - ReviewCenter-BallotVisibility-AuditMasking-NullRefused

      - id: ReviewCenter-Core-BallotVisibility-OwnBallot
        title: >-
          The Core subsystem shall show a viewer who holds a slot the ballot of that slot, including its draft
          answers, and not show a viewer the draft answers of the ballots of the other slots, and mark the checklist
          given to a viewer who holds no slot as being without a slot and as not the own ballot.
        justification: |
          Drafts are private until they are handed in.
        children:
          - ReviewCenter-ChecklistService-OwnBallotView
          - ReviewCenter-ChecklistService-OwnBallotView-NoOtherDraft
          - ReviewCenter-ChecklistService-OwnBallotView-NoSlot

      - id: ReviewCenter-Core-BallotVisibility-ViewDetails
        title: >-
          The Core subsystem shall give a viewer who handed in a ballot the checks on which the handed-in ballots
          differ, with the justification that the other reviewers gave, the number of checks that every handed-in
          ballot failed, and the number of the own slot.
        justification: |
          The page marks which slot is the own one and what the others said.
        children:
          - ReviewCenter-ChecklistService-BallotViewDetails
          - ReviewCenter-ChecklistService-BallotViewDetails-FailedCount
          - ReviewCenter-ChecklistService-BallotViewDetails-OwnSlot

      - id: ReviewCenter-Core-BallotVisibility-MissingNames
        title: >-
          The Core subsystem shall name to a viewer who is a member of the project the other reviewers whose ballot
          is not handed in, without the own slot of the viewer, and name nobody to a viewer outside the project.
        justification: |
          A member waits for the others and a stranger learns nothing.
        children:
          - ReviewCenter-ChecklistService-BallotViewDetails-MissingNames

      - id: ReviewCenter-Core-ReviewStatus
        title: >-
          The Core subsystem shall give every viewer of a review exactly one next action, worded in plain words
          without the term "out of date", with a place to go to if and only if the viewer can take that action.
        justification: |
          A review has several people, several kinds of open work, and a signature that can lapse. One status that is
          built from the same services as the pages, for the same viewer, lets every reviewer see what to do next
          without learning more than they may.
        children:
          - ReviewCenter-ReviewStatusService-NextAction
          - ReviewCenter-ReviewStatusService-NextAction-Words
          - ReviewCenter-ReviewStatusService-NextAction-Place
        tests:
          - ReviewNextAction_OneActionPerViewer

      - id: ReviewCenter-Core-ReviewStatus-NextActionDone
        title: >-
          The Core subsystem shall tell every viewer of a concluded review that the review is done.
        justification: |
          Nobody needs to look for work in a concluded review.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-Concluded

      - id: ReviewCenter-Core-ReviewStatus-NextActionReadOnly
        title: >-
          The Core subsystem shall give a viewer who cannot take part in the review no action.
        justification: |
          A button that cannot work must not be shown.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-ReadOnly

      - id: ReviewCenter-Core-ReviewStatus-NextActionSlots
        title: >-
          The Core subsystem shall ask the lead of a review that has no reviewer slot to add the reviewers, and ask a
          project member who could take a slot of a review without slots to add themselves as a reviewer.
        justification: |
          A review without reviewers cannot move.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-AddReviewers
          - ReviewCenter-ReviewStatusService-NextAction-AddSelf

      - id: ReviewCenter-Core-ReviewStatus-NextActionBallot
        title: >-
          The Core subsystem shall ask a reviewer whose checks are not all answered to answer the checklist, ask a
          reviewer whose checks are all answered and whose ballot is not handed in to hand it in, and ask a reviewer
          whose ballot is complete and who can hand it in and sign in one step to do both in that step.
        justification: |
          A reviewer sees the next step of the own ballot.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-AnswerChecks
          - ReviewCenter-ReviewStatusService-NextAction-SubmitBallot
          - ReviewCenter-ReviewStatusService-NextAction-SubmitAndSign

      - id: ReviewCenter-Core-ReviewStatus-NextActionOpenWork
        title: >-
          The Core subsystem shall ask a reviewer who handed in a ballot with disputed checks to discuss them before
          any open question or the conclusion, ask a reviewer to resolve the open findings before answering open
          questions, to answer the open questions that wait for that reviewer, and to write the conclusion when the
          review needs one before it can be signed.
        justification: |
          Open work has an order, and a reviewer sees which step comes first.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-Discuss
          - ReviewCenter-ReviewStatusService-NextAction-ResolveFindings
          - ReviewCenter-ReviewStatusService-NextAction-AnswerQuestions
          - ReviewCenter-ReviewStatusService-NextAction-Conclusion

      - id: ReviewCenter-Core-ReviewStatus-NextActionSign
        title: >-
          The Core subsystem shall ask a reviewer who may sign and has nothing else to do to sign the review, label
          the action of a reviewer whose signature went out of date "Look at the changes and sign again", and tell a
          reviewer whose signature went out of date and who cannot sign yet that signing again has to wait, in a
          sentence without a button.
        justification: |
          A reviewer must know when to sign and why a signature lapsed.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-Sign
          - ReviewCenter-ReviewStatusService-NextAction-SignAgain
          - ReviewCenter-ReviewStatusService-NextAction-SignatureBlocked

      - id: ReviewCenter-Core-ReviewStatus-NextActionSigned
        title: >-
          The Core subsystem shall tell a reviewer who has signed to wait for the other reviewers, in a sentence
          without a button, naming the reviewers who still have to sign.
        justification: |
          A reviewer who signed has nothing to do but wait, and sees for whom.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-SignedWaits
          - ReviewCenter-ReviewStatusService-NextAction-SignedNames

      - id: ReviewCenter-Core-ReviewStatus-NextActionWait
        title: >-
          The Core subsystem shall tell a reviewer who can do nothing yet to wait for the other reviewers.
        justification: |
          A reviewer who is blocked must not be sent away with an empty page.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-Waits

      - id: ReviewCenter-Core-ReviewStatus-NextActionOwnQuestion
        title: >-
          The Core subsystem shall tell a reviewer who asked every open question to wait for the answer, in a
          sentence without a button, naming the other reviewers when there are at most two.
        justification: |
          The reviewer knows whom the review waits for.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-OwnQuestion
          - ReviewCenter-ReviewStatusService-NextAction-OwnQuestionNames

      - id: ReviewCenter-Core-ReviewStatus-NextActionOwnQuestionUnnamed
        title: >-
          The Core subsystem shall not name the other reviewers in the sentence of a reviewer who waits for an answer
          when there are more than two.
        justification: |
          A long list of names makes the sentence unreadable.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-OwnQuestionUnnamed

      - id: ReviewCenter-Core-ReviewStatus-NextActionOthers
        title: >-
          The Core subsystem shall ask a viewer who has no reviewer slot and may take part to discuss the disputed
          checks, to resolve the open findings, to answer the open questions, and to write the conclusion when one is
          needed.
        justification: |
          A lead without a slot still moves the review along.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-OthersDiscuss
          - ReviewCenter-ReviewStatusService-NextAction-OthersFindings
          - ReviewCenter-ReviewStatusService-NextAction-OthersQuestions
          - ReviewCenter-ReviewStatusService-NextAction-OthersConclusion

      - id: ReviewCenter-Core-ReviewStatus-NextActionArguments
        title: >-
          The Core subsystem shall refuse to decide the next action without the facts.
        justification: |
          A guess would send a reviewer to the wrong step.
        children:
          - ReviewCenter-ReviewStatusService-NextAction-Arguments

      - id: ReviewCenter-Core-ReviewStatus-Standing
        title: >-
          The Core subsystem shall give a viewer who may see the project the status of a review for that viewer,
          listing the reviewers in the order of the slots and showing for every reviewer whether the ballot is not
          started, a draft, or handed in, and whether the signature is missing, current, or out of date, without the
          content of any ballot.
        justification: |
          One status shows everybody where the review stands.
        children:
          - ReviewCenter-ReviewStatusService-Status
          - ReviewCenter-ReviewStatusService-Status-Reviewers
          - ReviewCenter-ReviewStatusService-Status-BallotState
          - ReviewCenter-ReviewStatusService-Status-SignatureState
          - ReviewCenter-ReviewStatusService-Status-NoBallotContent

      - id: ReviewCenter-Core-ReviewStatus-Disputes
        title: >-
          The Core subsystem shall list in the status of a review the checks that the submitted ballots answer
          differently.
        justification: |
          Reviewers need to see what to settle.
        children:
          - ReviewCenter-ReviewStatusService-Status-DisputedChecks

      - id: ReviewCenter-Core-ReviewStatus-DisputeStart
        title: >-
          The Core subsystem shall offer a viewer who may take part in the review to start a discussion about a
          disputed check.
        justification: |
          A dispute is settled by talking about it.
        children:
          - ReviewCenter-ReviewStatusService-Status-DisputeDiscuss

      - id: ReviewCenter-Core-ReviewStatus-DisputeStartRefused
        title: >-
          The Core subsystem shall not offer a viewer who may not take part in the review to start a discussion about
          a disputed check, and not offer it once a discussion about the check is open.
        justification: |
          An offer that cannot work, or that would duplicate a discussion, must not be shown.
        children:
          - ReviewCenter-ReviewStatusService-Status-DisputeReadOnly
          - ReviewCenter-ReviewStatusService-Status-DisputeThread

      - id: ReviewCenter-Core-ReviewStatus-OpenCounts
        title: >-
          The Core subsystem shall count in the status of a review the open questions and the open findings apart.
        justification: |
          A question and a finding ask for different action.
        children:
          - ReviewCenter-ReviewStatusService-Status-OpenQuestions
          - ReviewCenter-ReviewStatusService-Status-OpenFindings

      - id: ReviewCenter-Core-ReviewStatus-StatusNextAction
        title: >-
          The Core subsystem shall carry the next action of the viewer in the status of a review.
        justification: |
          The status answers what to do next.
        children:
          - ReviewCenter-ReviewStatusService-Status-NextAction

      - id: ReviewCenter-Core-ReviewStatus-SingleSlot
        title: >-
          The Core subsystem shall not mask the status of a review that has one reviewer slot, and list no disputed
          check for it.
        justification: |
          With one reviewer nobody can disagree or be influenced.
        children:
          - ReviewCenter-ReviewStatusService-Status-SingleSlot
          - ReviewCenter-ReviewStatusService-Status-SingleSlotDisputes

      - id: ReviewCenter-Core-ReviewStatus-NoSlots
        title: >-
          The Core subsystem shall give an empty list of reviewers for a review without reviewer slots.
        justification: |
          A review without reviewers has nobody to list.
        children:
          - ReviewCenter-ReviewStatusService-Status-NoSlots

      - id: ReviewCenter-Core-ReviewStatus-Unavailable
        title: >-
          The Core subsystem shall give no status for a review that does not exist, and refuse a viewer who may not
          see the project with the ProjectNotFound rule.
        justification: |
          A stranger must not learn that a project or a review exists.
        children:
          - ReviewCenter-ReviewStatusService-Status-Missing
          - ReviewCenter-ReviewStatusService-Status-Refused

      - id: ReviewCenter-Core-ReviewStatus-PassedIn
        title: >-
          The Core subsystem shall give for review values that the caller passes in the same status as it gives when
          it reads the values itself, and use the passed-in values and not read them again.
        justification: |
          A list of reviews must not read every review twice.
        children:
          - ReviewCenter-ReviewStatusService-Status-PassedIn
          - ReviewCenter-ReviewStatusService-Status-PassedInUsed

      - id: ReviewCenter-Core-ReviewStatus-PassedInUnavailable
        title: >-
          The Core subsystem shall, when review values are passed in, refuse a viewer who may not see the project and
          give no status for a review that does not exist.
        justification: |
          Passing the values in must not open a way around the access check.
        children:
          - ReviewCenter-ReviewStatusService-Status-PassedInRefused
          - ReviewCenter-ReviewStatusService-Status-PassedInMissing

      - id: ReviewCenter-Core-ReviewStatus-ReopenerWaits
        title: >-
          The Core subsystem shall tell the reviewer who reopened a review to wait when the project requires another
          reviewer to sign.
        justification: |
          The reviewer who reopened a review must not sign alone when the project wants a second signer.
        children:
          - ReviewCenter-ReviewStatusService-Status-ReopenerWaits

      - id: ReviewCenter-Core-ReviewStatus-ReopenerSigns
        title: >-
          The Core subsystem shall ask the reviewer who reopened a review to sign when the project does not require
          another reviewer to sign, and ask a reviewer who did not reopen the review to sign again when the
          signature went out of date.
        justification: |
          Each reviewer is asked for the signature that the project rules allow.
        children:
          - ReviewCenter-ReviewStatusService-Status-ReopenerSigns
          - ReviewCenter-ReviewStatusService-Status-NonReopenerSigns

      - id: ReviewCenter-Core-ReviewStatus-StatusArguments
        title: >-
          The Core subsystem shall refuse to build the status of a review without one of the services and stores that
          it reads, and refuse a status from passed-in values when the approval or the threads are missing.
        justification: |
          A missing part must fail at once and not give a wrong status.
        children:
          - ReviewCenter-ReviewStatusService-Status-Arguments
          - ReviewCenter-ReviewStatusService-Status-PassedInArguments

      - id: ReviewCenter-Core-ReviewStatus-Masked
        title: >-
          The Core subsystem shall list no disputed check, count no discussion about a check, give no outcome note and
          no caution, and name no answer, no check text, and no check identifier in the status for a viewer who may
          not see the answers of the other reviewers yet.
        justification: |
          The status must not give away what a hidden ballot holds.
        children:
          - ReviewCenter-ReviewStatusService-MaskedViewer
          - ReviewCenter-ReviewStatusService-MaskedViewer-Counts
          - ReviewCenter-ReviewStatusService-MaskedViewer-Outcome
          - ReviewCenter-ReviewStatusService-MaskedViewer-Caution
          - ReviewCenter-ReviewStatusService-MaskedViewer-Details
        tests:
          - ReviewStatus_MaskedViewer_NoDisputedChecks

      - id: ReviewCenter-Core-ReviewStatus-MaskedNoAction
        title: >-
          The Core subsystem shall not ask a viewer who may not see the answers of the other reviewers yet to discuss a
          disputed check, and not tell such a viewer that the review waits for somebody.
        justification: |
          An action or a wait would show that a dispute exists.
        children:
          - ReviewCenter-ReviewStatusService-MaskedViewer-Action
          - ReviewCenter-ReviewStatusService-MaskedViewer-Waiting

      - id: ReviewCenter-Core-ReviewStatus-Changes
        title: >-
          The Core subsystem shall list for a reviewer whose signature is out of date the changes that were made after
          the signature, each with the time, the person, and a reason in plain words.
        justification: |
          A reviewer who signs again must see what changed since the signature.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-AfterSignature
        tests:
          - ReviewStatus_ChangesSinceSigning_ListsDigestAffectingEntriesOnly

      - id: ReviewCenter-Core-ReviewStatus-ChangesBallots
        title: >-
          The Core subsystem shall list among the changes since a signature a ballot that was handed in, a ballot that
          was taken back for changes, and a ballot that was given to another reviewer.
        justification: |
          A ballot changes what the reviewer signed.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-Ballots
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-BallotReopened
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-Reassigned

      - id: ReviewCenter-Core-ReviewStatus-ChangesConclusion
        title: >-
          The Core subsystem shall list among the changes since a signature a change of the review conclusion.
        justification: |
          The conclusion is part of what the reviewer signed.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-Conclusion

      - id: ReviewCenter-Core-ReviewStatus-ChangesThreads
        title: >-
          The Core subsystem shall list among the changes since a signature a thread that was started and goes in the
          report, a reply that goes in the report, and a thread that was turned from a question into a finding or
          back.
        justification: |
          A thread in the report is part of what the reviewer signed.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-ThreadStarted
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-ThreadReply
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-ThreadKind
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-ThreadKindBack

      - id: ReviewCenter-Core-ReviewStatus-ChangesComments
        title: >-
          The Core subsystem shall list among the changes since a signature a comment that was put in the report and a
          comment that was taken out of the report.
        justification: |
          A comment in the report is part of what the reviewer signed.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-CommentReport
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-CommentReportOut

      - id: ReviewCenter-Core-ReviewStatus-ChangesFindings
        title: >-
          The Core subsystem shall list among the changes since a signature the resolution of a finding together
          with its note, also for a finding that was carried into the review from an earlier one and for a carried
          finding that was turned into a question later.
        justification: |
          The resolution note of a finding is part of what the reviewer signed.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-FindingNote
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-CarriedFinding
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-CarriedFindingKind

      - id: ReviewCenter-Core-ReviewStatus-ChangesLeftOut
        title: >-
          The Core subsystem shall leave out of the changes since a signature the resolution of a question, a thread
          and a reply that stay out of the report, and every other entry that does not change what the reviewer
          signed.
        justification: |
          A change that the signature does not cover must not make the reviewer look again.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-QuestionNote
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-NotInReport
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-OtherEntries

      - id: ReviewCenter-Core-ReviewStatus-ChangesNone
        title: >-
          The Core subsystem shall list no change when the signature still matches the review.
        justification: |
          A current signature needs no review of changes.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-StillMatches

      - id: ReviewCenter-Core-ReviewStatus-ChangesWholeTrail
        title: >-
          The Core subsystem shall read the whole audit trail of the review when it lists the changes since a
          signature, also when the trail has more than twenty thousand entries.
        justification: |
          A change must not be missed because the trail is long.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-WholeTrail

      - id: ReviewCenter-Core-ReviewStatus-ChangesMasked
        title: >-
          The Core subsystem shall word a change whose details are hidden from the viewer as one neutral sentence
          without those details.
        justification: |
          The list of changes must not give away what a hidden ballot holds.
        children:
          - ReviewCenter-ReviewStatusService-ChangesSinceSigning-Masking

      - id: ReviewCenter-Core-ReviewStatus-Guidance
        title: >-
          The Core subsystem shall list for every disputed check the answer and the justification of every submitted
          ballot in the order of the slots.
        justification: |
          Reviewers settle a dispute by seeing who said what.
        children:
          - ReviewCenter-ReviewStatusService-Guidance

      - id: ReviewCenter-Core-ReviewStatus-GuidanceOutcome
        title: >-
          The Core subsystem shall give a viewer who may see the answers an outcome note that names the failed check
          and says that the review will be Rejected when every reviewer failed it.
        justification: |
          The reviewers see the consequence of a failed check before they sign.
        children:
          - ReviewCenter-ReviewStatusService-Guidance-Outcome

      - id: ReviewCenter-Core-ReviewStatus-GuidanceCaution
        title: >-
          The Core subsystem shall give a reviewer who is about to sign a caution that names the reviewers who have
          not handed in a ballot.
        justification: |
          A reviewer who signs before the others have judged should know it.
        children:
          - ReviewCenter-ReviewStatusService-Guidance-Caution

      - id: ReviewCenter-Core-ReviewStatus-GuidanceNoCaution
        title: >-
          The Core subsystem shall give no caution to a reviewer who is about to sign when every other ballot is
          handed in, to a reviewer who is not about to sign, or for a review that has one reviewer slot.
        justification: |
          A caution that does not apply is noise.
        children:
          - ReviewCenter-ReviewStatusService-Guidance-CautionNone
          - ReviewCenter-ReviewStatusService-Guidance-CautionNotSigning
          - ReviewCenter-ReviewStatusService-Guidance-SingleReviewer

      - id: ReviewCenter-Core-ReviewStatus-GuidanceAskerWaits
        title: >-
          The Core subsystem shall tell the reviewer who asked a question that the review waits for the answer, and
          ask the other reviewer to answer the question of a reviewer.
        justification: |
          A question moves the review only when the one who is asked sees it.
        children:
          - ReviewCenter-ReviewStatusService-Guidance-AskerWaits
          - ReviewCenter-ReviewStatusService-Guidance-OtherAnswers

      - id: ReviewCenter-Core-ReviewStatus-GuidanceSignedNames
        title: >-
          The Core subsystem shall name in the status of a reviewer who signed the reviewers who sign next.
        justification: |
          A reviewer who signed sees who is next.
        children:
          - ReviewCenter-ReviewStatusService-Guidance-SignedNames

      - id: ReviewCenter-Core-FollowUp
        title: >-
          The Core subsystem shall let a review be created as a follow-up of one earlier review of the same project, by
          hand or through a script, whether the earlier review is still in review or approved.
        justification: |
          After a review failed, the work that was fine should carry over to the review of the corrected content, so
          the reviewers spend their time on what changed. Every follow-up points to the review directly before it.
        children:
          - ReviewCenter-ReviewService-FollowUp
          - ReviewCenter-ReviewService-FollowUp-Source
          - ReviewCenter-ReviewService-FollowUp-Chain

      - id: ReviewCenter-Core-FollowUp-Optional
        title: >-
          The Core subsystem shall create an ordinary review with no carried data when no earlier review is given.
        justification: |
          The follow-up is a choice; a review without one must behave exactly as before.
        children:
          - ReviewCenter-ReviewService-FollowUp-Optional

      - id: ReviewCenter-Core-FollowUp-Unfit
        title: >-
          The Core subsystem shall refuse with the FollowUpInvalid rule an earlier review that does not exist in the
          project, or that has no review-set, repository or file in common with the new review.
        justification: |
          A follow-up only makes sense as a real continuation; carrying data between unrelated reviews would mislead.
        children:
          - ReviewCenter-ReviewService-FollowUp-Unknown
          - ReviewCenter-ReviewService-FollowUp-ReviewSet
          - ReviewCenter-ReviewService-FollowUp-Repository
          - ReviewCenter-ReviewService-FollowUp-CommonFile

      - id: ReviewCenter-Core-FollowUp-DroppedThreads
        title: >-
          The Core subsystem shall refuse with the FollowUpInvalid rule a follow-up that would silently drop open
          threads of files that the new review does not have, and name the files in the refusal.
        justification: |
          Nothing may be lost without the creator confirming it, and the files tell what the creator must decide on.
        children:
          - ReviewCenter-ReviewService-FollowUp-DroppedThreads
          - ReviewCenter-ReviewService-FollowUp-DroppedMessage
          - ReviewCenter-ReviewService-FollowUpCarry-Resolved-DroppedListed
        tests:
          - ReviewService_CreateDraftAsync_DroppedThreads_NeedAcknowledgement

      - id: ReviewCenter-Core-FollowUp-Acknowledged
        title: >-
          The Core subsystem shall create a follow-up normally when the creator acknowledges the open threads that it
          drops.
        justification: |
          Dropping threads can be right, for example when a file was deleted, once the creator has confirmed it.
        children:
          - ReviewCenter-ReviewService-FollowUp-Acknowledged

      - id: ReviewCenter-Core-FollowUp-DuplicateId
        title: >-
          The Core subsystem shall store a follow-up with the review in one step, and refuse a follow-up whose
          identifier is already used, changing nothing.
        justification: |
          A review that is stored without its carried data, or twice, would leave a wrong record behind.
        children:
          - ReviewCenter-ReviewService-FollowUp-DuplicateId

      - id: ReviewCenter-Core-FollowUp-Arguments
        title: >-
          The Core subsystem shall refuse a missing argument when it checks whether a follow-up fits and when it
          creates one.
        justification: |
          A call that lacks an argument fails clearly instead of failing deep inside the carry.
        children:
          - ReviewCenter-ReviewService-FollowUp-InputValidation

      - id: ReviewCenter-Core-FollowUp-Audit
        title: >-
          The Core subsystem shall name the followed review, by its whole identifier, and how many answers and open
          threads were carried, in the audit entry of the creation of a follow-up.
        justification: |
          The audit trail must show where the carried work came from and how much of it there was.
        children:
          - ReviewCenter-ReviewService-FollowUp-Audit
          - ReviewCenter-ReviewService-FollowUp-AuditCarried

      - id: ReviewCenter-Core-FollowUp-AuditNone
        title: >-
          The Core subsystem shall name no followed review in the audit entry of a review that follows none.
        justification: |
          An entry that names a review that was not followed would send an auditor to the wrong place.
        children:
          - ReviewCenter-ReviewService-FollowUp-AuditNone

      - id: ReviewCenter-Core-FollowUp-CarriedAnswers
        title: >-
          The Core subsystem shall carry from the earlier review the Pass and Not applicable answers of unchanged
          checks on which the submitted ballots agree, pass on what the earlier review itself carried when no
          submitted ballot answered, and seed the draft ballot of every reviewer slot with them without handing a
          ballot in.
        justification: |
          Answers that were fine and are still valid need no second look, and seeding spares each reviewer typing
          them again while the reviewer still has to hand the ballot in.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry
          - ReviewCenter-ReviewService-FollowUpCarry-Baseline
          - ReviewCenter-ReviewService-FollowUpCarry-Baseline-BallotWins
        tests:
          - ReviewService_CreateDraftAsync_FollowUp_CarriesAnswersAndSections

      - id: ReviewCenter-Core-FollowUp-NotCarriedAnswers
        title: >-
          The Core subsystem shall not carry the Fail answers, the answers of a draft ballot, the answers on which the
          ballots disagree, the answers to a check whose wording changed or that is missing from the new checklist,
          and no answer at all from an earlier review that has no checklist.
        justification: |
          Only an answer that stood and still applies may be taken over; anything open, contested or changed must be
          decided again.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Wording-Missing
          - ReviewCenter-ReviewService-FollowUpCarry-Disputed
          - ReviewCenter-ReviewService-FollowUpCarry-Draft
          - ReviewCenter-ReviewService-FollowUpCarry-Fail
          - ReviewCenter-ReviewService-FollowUpCarry-Wording
          - ReviewCenter-ReviewService-FollowUpCarry-NoChecklist

      - id: ReviewCenter-Core-FollowUp-CarriedSections
        title: >-
          The Core subsystem shall carry the not-applicable sections that are in the checklist of the new review with
          the same title, with their reasons, in the same way as the answers.
        justification: |
          A section that did not apply to the earlier content usually does not apply to the corrected content either.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Sections

      - id: ReviewCenter-Core-FollowUp-CarriedThreads
        title: >-
          The Core subsystem shall carry the open threads whose file is in the new review, still open, with every
          comment unchanged and with the kind and the report flag kept.
        justification: |
          An open discussion about a file is not settled because the review was created again.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Threads
          - ReviewCenter-ReviewService-FollowUpCarry-ThreadKind
          - ReviewCenter-ReviewService-FollowUpCarry-ThreadKind-ReportFlag

      - id: ReviewCenter-Core-FollowUp-ThreadAnchor
        title: >-
          The Core subsystem shall keep the line anchor of a carried thread only when the file has the same content on
          the side that it is anchored to, and otherwise move it to the whole file with a note from the system that
          gives the original anchor.
        justification: |
          A line number in changed content points at the wrong line; the note keeps the original place findable.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Anchor
          - ReviewCenter-ReviewService-FollowUpCarry-MovedNote

      - id: ReviewCenter-Core-FollowUp-NotCarried
        title: >-
          The Core subsystem shall not carry the resolved threads, the reviewer slots, the signatures, the reopenings
          or the free text of the conclusion of the earlier review.
        justification: |
          These belong to the earlier review and its people; carrying them would sign or settle what was not
          reviewed again.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Resolved
          - ReviewCenter-ReviewService-FollowUpCarry-Slots
          - ReviewCenter-ReviewService-FollowUpCarry-Reopenings
          - ReviewCenter-ReviewService-FollowUpCarry-Conclusion

      - id: ReviewCenter-Core-FollowUp-ResolvedCounted
        title: >-
          The Core subsystem shall count the resolved threads that a follow-up does not carry.
        justification: |
          The creator sees what the carry left out and need not guess whether anything was lost.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Resolved-Counted

      - id: ReviewCenter-Core-FollowUp-CheckThreads
        title: >-
          The Core subsystem shall not carry a thread about a check into a follow-up, whether it is open or resolved.
        justification: |
          A thread about a check belongs to the answer of that check, which is decided again.
        children:
          - ReviewCenter-ReviewService-FollowUpCheckThreads

      - id: ReviewCenter-Core-FollowUp-CheckThreadsCounted
        title: >-
          The Core subsystem shall count the threads about checks that it leaves out of a follow-up, in the creation
          and in the preview.
        justification: |
          The creator can see how much discussion was left out before and after creating the follow-up.
        children:
          - ReviewCenter-ReviewService-FollowUpCheckThreads-Counted
          - ReviewCenter-ReviewService-FollowUpCheckThreads-Counted-Preview

      - id: ReviewCenter-Core-FollowUp-CheckThreadsNotDropped
        title: >-
          The Core subsystem shall count threads about checks neither as resolved threads that are not carried nor as
          threads of dropped files, and ask for no acknowledgement because of them.
        justification: |
          The creator is asked to confirm only a real loss; threads about checks are left out by design.
        children:
          - ReviewCenter-ReviewService-FollowUpCheckThreads-NotDropped
          - ReviewCenter-ReviewService-FollowUpCheckThreads-NoAcknowledgement

      - id: ReviewCenter-Core-FollowUp-Marks
        title: >-
          The Core subsystem shall mark everything that a follow-up carries with the review that it came from until it
          is answered again, and store an answer or a section change that is given again without the mark and as the
          work of the actor.
        justification: |
          The record must stay honest about who answered what; a reviewer who answers again takes it over.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Marked
          - ReviewCenter-ChecklistService-CarriedMarking
          - ReviewCenter-ChecklistService-CarriedMarking-Section
        tests:
          - ReviewService_FollowUp_ReAnsweringOrResettingSection_ClearsTheCarriedMarker

      - id: ReviewCenter-Core-FollowUp-MarksProgress
        title: >-
          The Core subsystem shall count the answers that were carried from an earlier review as answered in the
          progress of a ballot, and leave a carried not-applicable section out of its total.
        justification: |
          Carried work counts as done, so the reviewer sees only what is left to do.
        children:
          - ReviewCenter-ChecklistService-CarriedMarking-Progress
          - ReviewCenter-ChecklistService-CarriedMarking-Progress-NotApplicableSection

      - id: ReviewCenter-Core-FollowUp-CreatorAuthor
        title: >-
          The Core subsystem shall not make the person who creates a follow-up the answerer of anything that it
          carries, and keep that person the author for the rule of independent reviewers.
        justification: |
          The creator only moves the work along; the independence of the reviewers must not depend on who copied it.
        children:
          - ReviewCenter-ReviewService-FollowUpCarry-Answerer
          - ReviewCenter-SigningService-CarriedRecord-CreatorIsAuthor

      - id: ReviewCenter-Core-FollowUp-AnswersNoBlock
        title: >-
          The Core subsystem shall treat the answers that a follow-up carried as answered checks that do not block
          approval.
        justification: |
          The carried answers were agreed on before; they must not hold the approval back a second time.
        children:
          - ReviewCenter-SigningService-CarriedRecord
        tests:
          - ReviewService_FollowUp_CarriedOpenThreadBlocksSigning_CarriedAnswersDoNot

      - id: ReviewCenter-Core-FollowUp-OpenThreadsBlock
        title: >-
          The Core subsystem shall count the open threads that a follow-up carried as open for approval, with the same
          message as any open thread.
        justification: |
          An unsettled discussion must still hold the approval back, whichever review it started in.
        children:
          - ReviewCenter-SigningService-CarriedRecord-OpenThreads
        tests:
          - ReviewService_FollowUp_CarriedOpenThreadBlocksSigning_CarriedAnswersDoNot

      - id: ReviewCenter-Core-FollowUp-Digest
        title: >-
          The Core subsystem shall cover the review that a follow-up follows in its record digest, as a line right
          after the source, so that the digest changes when the followed review changes.
        justification: |
          A signature then approves exactly what was carried and from where.
        children:
          - ReviewCenter-RecordDigest-FollowUp
          - ReviewCenter-RecordDigest-FollowUp-Change
        tests:
          - ReviewService_FollowUp_DigestBindsToFollowAndIsImmuneToLaterChecklistChange

      - id: ReviewCenter-Core-FollowUp-DigestCarried
        title: >-
          The Core subsystem shall cover a carried thread in the record digest with the review that it came from as a
          suffix, not cover the number that it had before, and not write a carried thread without an included comment.
        justification: |
          The thread is the same discussion whichever number it had, but it differs from a thread that began here.
        children:
          - ReviewCenter-RecordDigest-FollowUp-CarriedSuffix
          - ReviewCenter-RecordDigest-FollowUp-CarriedNoComment
          - ReviewCenter-RecordDigest-FollowUp-CarriedChange
          - ReviewCenter-RecordDigest-FollowUp-CarriedNumber

      - id: ReviewCenter-Core-FollowUp-DigestOthers
        title: >-
          The Core subsystem shall give a review that is not a follow-up and has no carried thread the same digest as
          before the follow-up existed, without a new format version.
        justification: |
          Leaving the follow-up out for other reviews keeps every existing signature valid.
        children:
          - ReviewCenter-RecordDigest-FollowUp-None
        tests:
          - RecordDigest_Compute_NoFollowUp_EqualsLegacyDigest

      - id: ReviewCenter-Core-FollowUp-Preview
        title: >-
          The Core subsystem shall tell a member of the project who may see it, for a given earlier review and a given
          set of files, the number of answers, not-applicable sections, open threads, resolved threads that are not
          carried and the files of open threads that the new review does not have, by the same rule as creation.
        justification: |
          The creator can see the effect of a follow-up before creating it.
        children:
          - ReviewCenter-ReviewService-FollowUpPreview

      - id: ReviewCenter-Core-FollowUp-PreviewReadOnly
        title: >-
          The Core subsystem shall store nothing and write no audit entry when it previews a follow-up.
        justification: |
          Looking at a follow-up must not change the project.
        children:
          - ReviewCenter-ReviewService-FollowUpPreview-ReadOnly

      - id: ReviewCenter-Core-FollowUp-PreviewRefused
        title: >-
          The Core subsystem shall refuse in the preview an earlier review that is blank, missing, of another project
          or without a file in common, and a set of files that creation would refuse, with the same rule and message.
        justification: |
          A preview that accepts what creation refuses would promise something that cannot be done.
        children:
          - ReviewCenter-ReviewService-FollowUpPreview-UnfitSource
          - ReviewCenter-ReviewService-FollowUpPreview-Files

      - id: ReviewCenter-Core-FollowUp-PreviewHidden
        title: >-
          The Core subsystem shall refuse in the preview a user who may not see the project as for a project that does
          not exist, with the ProjectNotFound rule, even when the named review does not exist.
        justification: |
          The preview must not tell an outsider that a project or a review exists.
        children:
          - ReviewCenter-ReviewService-FollowUpPreview-Hidden

      - id: ReviewCenter-Core-FollowUp-PreviewAuditor
        title: >-
          The Core subsystem shall let a read-only member of the project, such as an auditor, preview a follow-up.
        justification: |
          The preview changes nothing, so a member who may only read can use it.
        children:
          - ReviewCenter-ReviewService-FollowUpPreview-Auditor

      - id: ReviewCenter-Core-Inbox
        title: >-
          The Core subsystem shall list as to answer in the inbox of a user a review that is not concluded and has a
          checklist, in which the user is the primary or the alternate reviewer of a slot and has not handed in the
          ballot.
        justification: |
          The inbox joins facts that the review, thread, checklist and signature rules already decide, so it is a rule
          of the domain and not of the page. Keeping it in the Core subsystem lets every page and later every client
          show the same list, and the same rules of access apply to it as to the reviews themselves.
        children:
          - ReviewCenter-InboxService-ToAnswer
          - ReviewCenter-InboxService-ToAnswer-Alternate
        tests:
          - CoreSubsystem_InboxWorkflow_ValidInput_ListsActionItemsAndCounts

      - id: ReviewCenter-Core-Inbox-ToAnswerRow
        title: >-
          The Core subsystem shall give the to answer row of a user who has no ballot the chip Not started, of a user
          whose ballot is a draft the chip Draft, and a text that tells how many checks are answered.
        justification: |
          The user sees at a glance whether the answer was begun and how far it is.
        children:
          - ReviewCenter-InboxService-ToAnswer-NotStarted
          - ReviewCenter-InboxService-ToAnswer-Draft
          - ReviewCenter-InboxService-ToAnswer-Progress

      - id: ReviewCenter-Core-Inbox-ToAnswerAgain
        title: >-
          The Core subsystem shall list a review as to answer again when the handed-in ballot of the user is reverted
          to a draft.
        justification: |
          A reverted ballot has to be handed in again, so the review needs the action of the user once more.
        children:
          - ReviewCenter-InboxService-ToAnswer-RevertedToDraft

      - id: ReviewCenter-Core-Inbox-ToAnswerLink
        title: >-
          The Core subsystem shall link the to answer row of a ballot to the checklist of the review, not to the review
          page.
        justification: |
          The user wants to answer, so the row leads straight to the place where the answers are given.
        children:
          - ReviewCenter-InboxService-ToAnswer-Link

      - id: ReviewCenter-Core-Inbox-ToAnswerExcluded
        title: >-
          The Core subsystem shall list nothing as to answer for the author of a review when the project requires the
          checklist answers of somebody else, and for a review that has no checklist.
        justification: |
          A row that asks for an answer that cannot be given or may not be given would mislead the user.
        children:
          - ReviewCenter-InboxService-ToAnswer-AuthorBlocked
          - ReviewCenter-InboxService-ToAnswer-NoChecklist

      - id: ReviewCenter-Core-Inbox-Disputed
        title: >-
          The Core subsystem shall list as disputed a review that is not concluded and in which the ballots that were
          handed in differ on some checks, to a user who has handed in the own ballot and to the creator of the review.
        justification: |
          A disagreement between reviewers has to be settled before the review can be signed, so those who can see it
          are told.
        children:
          - ReviewCenter-InboxService-Disputed
          - ReviewCenter-InboxService-Disputed-Author

      - id: ReviewCenter-Core-Inbox-DisputedRow
        title: >-
          The Core subsystem shall give the disputed row a chip that gives the number of disputed checks and a sentence
          that names at most five of them and says how many more are disputed.
        justification: |
          The user sees how large the dispute is without opening the review, and the row stays short.
        children:
          - ReviewCenter-InboxService-Disputed-Chip
          - ReviewCenter-InboxService-Disputed-NamesChecks
          - ReviewCenter-InboxService-Disputed-NamesAtMostFive
          - ReviewCenter-InboxService-Disputed-NamesAtMostFive-MoreCount

      - id: ReviewCenter-Core-Inbox-DisputedUnread
        title: >-
          The Core subsystem shall mark the disputed row as unread only when another reviewer handed in a ballot after
          the user last saw the review.
        justification: |
          A dispute that the user already knows is not news.
        children:
          - ReviewCenter-InboxService-Disputed-Unread

      - id: ReviewCenter-Core-Inbox-DisputedSettled
        title: >-
          The Core subsystem shall drop the disputed row when the dispute is settled.
        justification: |
          A row for a dispute that no longer exists would send the user to nothing.
        children:
          - ReviewCenter-InboxService-Disputed-Settled

      - id: ReviewCenter-Core-Inbox-DisputedHidden
        title: >-
          The Core subsystem shall list no disputed row, count, or text to a user who has not handed in the own ballot.
        justification: |
          What the others answered must not reach a reviewer before the reviewer has answered, not even through the
          inbox.
        children:
          - ReviewCenter-InboxService-Disputed-HiddenViewer

      - id: ReviewCenter-Core-Inbox-ToSign
        title: >-
          The Core subsystem shall list as ready to sign a review in which the user is the primary or the alternate
          reviewer of a slot that has no current signature, has handed in the own ballot, and nothing blocks the
          signature.
        justification: |
          The user is told when it is the turn of the user to sign.
        children:
          - ReviewCenter-InboxService-ToSign
          - ReviewCenter-InboxService-ToSign-Alternate

      - id: ReviewCenter-Core-Inbox-ToSignBallotNotIn
        title: >-
          The Core subsystem shall list nothing as ready to sign for a user whose ballot is not handed in.
        justification: |
          A signature without the own ballot would approve what the signer has not judged.
        children:
          - ReviewCenter-InboxService-ToSign-BallotNotIn

      - id: ReviewCenter-Core-Inbox-ToSignBlocked
        title: >-
          The Core subsystem shall list nothing as ready to sign while a thread of the review is open, a check of the
          review is unanswered, or the ballots that were handed in differ.
        justification: |
          The inbox must agree with the signing rules: it may not invite a signature that would be refused.
        children:
          - ReviewCenter-InboxService-ToSign-OpenThreadBlocks
          - ReviewCenter-InboxService-ToSign-UnansweredBlocks
          - ReviewCenter-InboxService-ToSign-DisputeBlocks

      - id: ReviewCenter-Core-Inbox-ToSignDisputeSettled
        title: >-
          The Core subsystem shall list a review as ready to sign once the dispute between the ballots is settled.
        justification: |
          When the blocker is gone the user must be invited to sign again.
        children:
          - ReviewCenter-InboxService-ToSign-DisputeSettled

      - id: ReviewCenter-Core-Inbox-ToSignConclusionText
        title: >-
          The Core subsystem shall list nothing as ready to sign for a rejection while the conclusion text of the
          review is not written.
        justification: |
          A rejection cannot be signed without its reasons, so the row would invite what is refused.
        children:
          - ReviewCenter-InboxService-ToSign-ConclusionTextBlocks

      - id: ReviewCenter-Core-Inbox-ToSignConclusionTextWritten
        title: >-
          The Core subsystem shall list a rejected review as ready to sign once the conclusion text of the review is
          written.
        justification: |
          Once the reasons are written the rejection can be signed, and the user must be invited to do so.
        children:
          - ReviewCenter-InboxService-ToSign-ConclusionTextWritten

      - id: ReviewCenter-Core-Inbox-ToSignNotSigned
        title: >-
          The Core subsystem shall give the ready to sign row the chip Not signed when no signature was given.
        justification: |
          The chip tells a first signature from a new one.
        children:
          - ReviewCenter-InboxService-ToSign-NotSignedChip

      - id: ReviewCenter-Core-Inbox-ToSignAgain
        title: >-
          The Core subsystem shall give the ready to sign row of a slot whose signature no longer covers the record the
          chip The review changed, sign again, and the sentence that the signature no longer counts.
        justification: |
          The user must know that the earlier signature is void and that the changes need a look before signing again.
        children:
          - ReviewCenter-InboxService-ToSign-SignAgainChip
          - ReviewCenter-InboxService-ToSign-SignAgainText

      - id: ReviewCenter-Core-Inbox-ToSignSlotState
        title: >-
          The Core subsystem shall decide whether a slot is signed, out of date, or not signed as the approval of the
          review does, and list nothing as ready to sign for a slot that has a current signature.
        justification: |
          The inbox and the approval must never disagree about who still has to sign.
        children:
          - ReviewCenter-InboxService-ToSign-SignedSlot
          - ReviewCenter-InboxService-ToSign-SlotState

      - id: ReviewCenter-Core-Inbox-ToSignMatchesStatus
        title: >-
          The Core subsystem shall list a review of a reviewer in the section that the next action of the status of the
          review names.
        justification: |
          The page of the review and the inbox must tell the same user the same thing to do.
        children:
          - ReviewCenter-InboxService-ToSign-MatchesStatus

      - id: ReviewCenter-Core-Inbox-ToSignOpenThread
        title: >-
          The Core subsystem shall treat a review whose slots are all signed but that has an open thread as not
          concluded.
        justification: |
          An open thread keeps the review from concluding, so the review must stay in the lists of the people involved.
        children:
          - ReviewCenter-InboxService-ToSign-OpenThreadNotConcluded

      - id: ReviewCenter-Core-Inbox-ToSignOpenThreadReplies
        title: >-
          The Core subsystem shall list the open thread of a review whose slots are all signed as replies waiting.
        justification: |
          When nothing is left to sign, the open thread is the one thing that still needs an answer.
        children:
          - ReviewCenter-InboxService-ToSign-OpenThreadNotConcluded-RepliesWaiting

      - id: ReviewCenter-Core-Inbox-ToSignDueDate
        title: >-
          The Core subsystem shall give the ready to sign row the due date of the review while it is not concluded.
        justification: |
          The user sees by when the signature is wanted.
        children:
          - ReviewCenter-InboxService-ToSign-DueDate

      - id: ReviewCenter-Core-Inbox-ToSignOverdue
        title: >-
          The Core subsystem shall mark the ready to sign row as overdue when the due date of the review is past.
        justification: |
          A late review needs to stand out among the rows.
        children:
          - ReviewCenter-InboxService-ToSign-Overdue

      - id: ReviewCenter-Core-Inbox-ToSignConcluded
        title: >-
          The Core subsystem shall give a row of a concluded review no due date and no overdue mark.
        justification: |
          A concluded review has nothing left to be late for.
        children:
          - ReviewCenter-InboxService-ToSign-ConcludedNoDueDate
          - ReviewCenter-InboxService-ToSign-ConcludedNotOverdue

      - id: ReviewCenter-Core-Inbox-ToSignMissingBallots
        title: >-
          The Core subsystem shall tell in the ready to sign row, when other reviewers have not handed in a ballot,
          that they have not and who they are.
        justification: |
          The signer knows whether the others have judged yet and whom to ask.
        children:
          - ReviewCenter-InboxService-ToSign-MissingBallots

      - id: ReviewCenter-Core-Inbox-QuestionForYou
        title: >-
          The Core subsystem shall list as to answer a review that is not concluded, in which an open question (not a
          finding) was started by someone else and the user, a holder of a slot who may work in the project, has not
          written in it.
        justification: |
          A question that waits for an answer from the user is work for the user, even when no ballot is left.
        children:
          - ReviewCenter-InboxService-QuestionForYou

      - id: ReviewCenter-Core-Inbox-QuestionRow
        title: >-
          The Core subsystem shall give the row of a question for the user the chip Question for you, link it to the
          review page, and name only the person who asked, without quoting the question.
        justification: |
          The row shows what to do and where, and the question text stays on the review page with its access rules.
        children:
          - ReviewCenter-InboxService-QuestionForYou-Chip
          - ReviewCenter-InboxService-QuestionForYou-OpensReview
          - ReviewCenter-InboxService-QuestionForYou-NamesAsker

      - id: ReviewCenter-Core-Inbox-QuestionNoBallotData
        title: >-
          The Core subsystem shall name no check, verdict, or dispute in the row of a question for a user who has not
          handed in the own ballot, and list no question that was started on a check to a user who may not see the
          other ballots yet.
        justification: |
          A question about a check would reveal what the others answered before the user has answered.
        children:
          - ReviewCenter-InboxService-QuestionForYou-NoBallotData
          - ReviewCenter-InboxService-QuestionForYou-CheckThreadsHidden

      - id: ReviewCenter-Core-Inbox-QuestionCount
        title: >-
          The Core subsystem shall count a review with a row of a question for the user as action.
        justification: |
          A question for the user is work, so it belongs to the number of reviews that need the user.
        children:
          - ReviewCenter-InboxService-QuestionForYou-Count

      - id: ReviewCenter-Core-Inbox-QuestionNotListed
        title: >-
          The Core subsystem shall list no question for the author of the review, for the user who asked it, and for a
          user who wrote in its thread.
        justification: |
          These users cannot or need not answer the question, so a row would only be noise.
        children:
          - ReviewCenter-InboxService-QuestionForYou-Author
          - ReviewCenter-InboxService-QuestionForYou-Asker
          - ReviewCenter-InboxService-QuestionForYou-Answered

      - id: ReviewCenter-Core-Inbox-QuestionNoAction
        title: >-
          The Core subsystem shall list no question and count no action for an auditor, also one who holds a slot, for
          a slot holder who is no member of the project, and for a user who is not part of the review.
        justification: |
          Only a member who may work in the review can answer, so the inbox must not ask anybody else.
        children:
          - ReviewCenter-InboxService-QuestionForYou-Auditor
          - ReviewCenter-InboxService-QuestionForYou-NonMember
          - ReviewCenter-InboxService-QuestionForYou-Stranger

      - id: ReviewCenter-Core-Inbox-QuestionApiToken
        title: >-
          The Core subsystem shall list no question for an API token of a slot holder.
        justification: |
          An API token acts for scripts and does not answer questions, so the question stays with the person.
        children:
          - ReviewCenter-InboxService-QuestionForYou-ApiToken

      - id: ReviewCenter-Core-Inbox-SignatureLost
        title: >-
          The Core subsystem shall list as signature lost a review that is not concluded and in which a slot of the
          user has a signature that no longer covers the record and a new signature is not possible yet.
        justification: |
          A signer whose signature became void must learn it even when the review is not ready to be signed again.
        children:
          - ReviewCenter-InboxService-SignatureLost

      - id: ReviewCenter-Core-Inbox-SignatureLostRow
        title: >-
          The Core subsystem shall give the signature lost row the chip The review changed, your signature no longer
          counts, and a sentence that says what blocks the signature and that the user shall look at the changes and
          sign again afterwards.
        justification: |
          The user learns why the signature is void and what has to happen before signing again.
        children:
          - ReviewCenter-InboxService-SignatureLost-Chip
          - ReviewCenter-InboxService-SignatureLost-BlockedText

      - id: ReviewCenter-Core-Inbox-SignatureLostReady
        title: >-
          The Core subsystem shall turn the signature lost row into a ready to sign row when nothing blocks the
          signature.
        justification: |
          Once the block is gone the user must be invited to sign again instead of being told to wait.
        children:
          - ReviewCenter-InboxService-SignatureLost-ReadyToSign

      - id: ReviewCenter-Core-Inbox-SignatureLostWaiting
        title: >-
          The Core subsystem shall tell the other signers in their waiting for others row that the signature of the
          user no longer counts, and name in it the person who actually signed the slot.
        justification: |
          The others see that the approval is open again and whose signature is missing, even when it was signed by the
          alternate.
        children:
          - ReviewCenter-InboxService-SignatureLost-WaitingRow
          - ReviewCenter-InboxService-SignatureLost-WaitingNamesSigner

      - id: ReviewCenter-Core-Inbox-SignatureLostCount
        title: >-
          The Core subsystem shall count a review with a signature lost row as action.
        justification: |
          A void signature is work for the signer, so the review belongs to the number of reviews that need the user.
        children:
          - ReviewCenter-InboxService-SignatureLost-Count

      - id: ReviewCenter-Core-Inbox-SignatureLostNobodyElse
        title: >-
          The Core subsystem shall list a signature lost row to nobody but the user who holds the slot.
        justification: |
          The row names a personal signature, so it is not for the others.
        children:
          - ReviewCenter-InboxService-SignatureLost-NobodyElse

      - id: ReviewCenter-Core-Inbox-SignatureLostConcluded
        title: >-
          The Core subsystem shall list no signature lost row for a review that is concluded.
        justification: |
          A concluded review needs no further signature.
        children:
          - ReviewCenter-InboxService-SignatureLost-Concluded

      - id: ReviewCenter-Core-Inbox-RepliesWaiting
        title: >-
          The Core subsystem shall list as replies waiting a review that is not concluded and has an open thread, chat
          or included in the report, whose last comment is by someone else and in which the user wrote a comment while
          holding a slot of the review.
        justification: |
          A user who joined a discussion wants to know when somebody answered.
        children:
          - ReviewCenter-InboxService-RepliesWaiting

      - id: ReviewCenter-Core-Inbox-RepliesWaitingAuthor
        title: >-
          The Core subsystem shall list as replies waiting an open thread whose last comment is by someone else to the
          user who created the review.
        justification: |
          The creator follows every discussion of the review without having to write in it first.
        children:
          - ReviewCenter-InboxService-RepliesWaiting-Author

      - id: ReviewCenter-Core-Inbox-RepliesWaitingSystem
        title: >-
          The Core subsystem shall treat a last comment of the system as a comment of someone else.
        justification: |
          A note of the system, such as a moved anchor, is news to the user and not the user's own word.
        children:
          - ReviewCenter-InboxService-RepliesWaiting-SystemComment

      - id: ReviewCenter-Core-Inbox-RepliesWaitingChip
        title: >-
          The Core subsystem shall give the replies waiting row a chip that gives the number of such threads.
        justification: |
          The user sees how many discussions wait for an answer.
        children:
          - ReviewCenter-InboxService-RepliesWaiting-Chip

      - id: ReviewCenter-Core-Inbox-RepliesWaitingNot
        title: >-
          The Core subsystem shall list no replies waiting for a thread that is resolved or whose last comment is the
          user's own.
        justification: |
          A settled thread, or one in which the user spoke last, waits for nothing from the user.
        children:
          - ReviewCenter-InboxService-RepliesWaiting-Resolved
          - ReviewCenter-InboxService-RepliesWaiting-OwnLast

      - id: ReviewCenter-Core-Inbox-FailedChecks
        title: >-
          The Core subsystem shall list as failed checks a review that is not concluded and was created by the user,
          and in which the submitted ballots agree that at least one check is Fail, counting a Fail in the sole ballot
          of a review with a single slot before the ballot is handed in.
        justification: |
          The creator learns early that the review is likely to be rejected, without waiting for the signatures.
        children:
          - ReviewCenter-InboxService-FailedChecks
          - ReviewCenter-InboxService-FailedChecks-SingleSlotDraft

      - id: ReviewCenter-Core-Inbox-FailedChecksNotCounted
        title: >-
          The Core subsystem shall not count as a failed check a Fail in a draft ballot of a review with several slots,
          or a check on which the submitted ballots disagree.
        justification: |
          A Fail that is not yet handed in, or is contested, may still change, so it must not be reported as agreed.
        children:
          - ReviewCenter-InboxService-FailedChecks-DraftNotCounted
          - ReviewCenter-InboxService-FailedChecks-Disputed

      - id: ReviewCenter-Core-Inbox-FailedChecksRow
        title: >-
          The Core subsystem shall give the failed checks row a chip that gives the number of failed checks and a text
          that says the reviewers marked the checks as Fail so far and that, if that stands, the review will be
          rejected and its reasons must be written down.
        justification: |
          The creator sees how much failed and what follows from it.
        children:
          - ReviewCenter-InboxService-FailedChecks-Chip
          - ReviewCenter-InboxService-FailedChecks-Text

      - id: ReviewCenter-Core-Inbox-FailedChecksNotCreator
        title: >-
          The Core subsystem shall list no failed checks to a user who did not create the review.
        justification: |
          Only the creator decides what to do with a rejection that is coming.
        children:
          - ReviewCenter-InboxService-FailedChecks-NotCreator

      - id: ReviewCenter-Core-Inbox-FailedChecksNotApplicable
        title: >-
          The Core subsystem shall ignore a Fail in a section that is marked not applicable.
        justification: |
          A section that does not apply cannot fail the review.
        children:
          - ReviewCenter-InboxService-FailedChecks-NotApplicableSection

      - id: ReviewCenter-Core-Inbox-FailedChecksConcluded
        title: >-
          The Core subsystem shall list no failed checks for a concluded review.
        justification: |
          Once the review is concluded the outcome is known and nothing is left to warn about.
        children:
          - ReviewCenter-InboxService-FailedChecks-Concluded

      - id: ReviewCenter-Core-Inbox-FailedChecksApiToken
        title: >-
          The Core subsystem shall list no failed checks to an API token of the creator.
        justification: |
          A script that signs in with the token does not decide about a rejection, so the person is told instead.
        children:
          - ReviewCenter-InboxService-FailedChecks-ApiToken

      - id: ReviewCenter-Core-Inbox-WaitingForOthers
        title: >-
          The Core subsystem shall list as waiting for others a review that is not concluded and in which the user
          holds a slot that is signed, or in which the ballot of the user is in and something that is not the user's
          to do blocks the signature.
        justification: |
          A user who has done the part is told that the review now waits for others and not for the user.
        children:
          - ReviewCenter-InboxService-WaitingForOthers
          - ReviewCenter-InboxService-WaitingForOthers-BallotInBlocked

      - id: ReviewCenter-Core-Inbox-WaitingRow
        title: >-
          The Core subsystem shall give the waiting row a chip that names the number of reviewers waited for, or the
          chip Open items remain when no reviewer is waited for, and a text that names the reviewers.
        justification: |
          The user sees whom the review waits for.
        children:
          - ReviewCenter-InboxService-WaitingForOthers-ChipCount
          - ReviewCenter-InboxService-WaitingForOthers-ChipOpenItems
          - ReviewCenter-InboxService-WaitingForOthers-NamesReviewers

      - id: ReviewCenter-Core-Inbox-WaitingNoVerdict
        title: >-
          The Core subsystem shall word the text of the waiting row from the names of the reviewers only, so that no
          verdict or dispute count of another ballot is in it.
        justification: |
          The text is shown before the ballots are open to the user, so it must not leak what the others answered.
        children:
          - ReviewCenter-InboxService-WaitingForOthers-NoVerdict

      - id: ReviewCenter-Core-Inbox-WaitingNoDueDate
        title: >-
          The Core subsystem shall show no due date and no overdue mark on the waiting row.
        justification: |
          The user can do nothing about the date, so it would only press where no action is possible.
        children:
          - ReviewCenter-InboxService-WaitingForOthers-NoDueDate

      - id: ReviewCenter-Core-Inbox-WaitingNeverUnread
        title: >-
          The Core subsystem shall never mark the waiting row as unread.
        justification: |
          A row that asks for nothing must not draw attention as news.
        children:
          - ReviewCenter-InboxService-WaitingForOthers-NeverUnread

      - id: ReviewCenter-Core-Inbox-Updates
        title: >-
          The Core subsystem shall list as an update, with the chip Approved, a review of which the user is a reviewer
          or the creator when it was approved by a signature of somebody else after the user last saw it, and name the
          signer who completed the approval.
        justification: |
          People who took part learn the outcome without having to look at every review.
        children:
          - ReviewCenter-InboxService-Updates
          - ReviewCenter-InboxService-Updates-Names

      - id: ReviewCenter-Core-Inbox-UpdatesRejected
        title: >-
          The Core subsystem shall list as an update, with the chip Rejected, a review that was rejected by a signature
          of somebody else after the user last saw it, and name the signer who concluded the review.
        justification: |
          A rejection is as important to the people involved as an approval.
        children:
          - ReviewCenter-InboxService-Updates-Rejected
          - ReviewCenter-InboxService-Updates-Rejected-Names

      - id: ReviewCenter-Core-Inbox-UpdatesReopened
        title: >-
          The Core subsystem shall list as an update, with the chip Reopened, a review that somebody else reopened
          after the user last saw it, and name the person who reopened it.
        justification: |
          A reopening voids signatures, so the people involved must learn of it.
        children:
          - ReviewCenter-InboxService-Updates-Reopened
          - ReviewCenter-InboxService-Updates-Reopened-Names

      - id: ReviewCenter-Core-Inbox-UpdatesOwn
        title: >-
          The Core subsystem shall list no update for a conclusion that the own signature of the user completed or for
          a reopening by the user.
        justification: |
          The user knows what the user did and needs no news about it.
        children:
          - ReviewCenter-InboxService-Updates-OwnSignature
          - ReviewCenter-InboxService-Updates-OwnReopen

      - id: ReviewCenter-Core-Inbox-UpdatesSeen
        title: >-
          The Core subsystem shall list no update for a review that the user has seen since.
        justification: |
          News that the user already looked at is no longer news.
        children:
          - ReviewCenter-InboxService-Updates-Seen

      - id: ReviewCenter-Core-Inbox-UpdatesCreator
        title: >-
          The Core subsystem shall list the update of an approved review to the creator of the review too.
        justification: |
          The creator waits for the outcome even without holding a slot.
        children:
          - ReviewCenter-InboxService-Updates-Creator

      - id: ReviewCenter-Core-Inbox-Access
        title: >-
          The Core subsystem shall consider only the reviews of the projects the user may see.
        justification: |
          The inbox must not show an outsider anything about a project.
        children:
          - ReviewCenter-InboxService-Access

      - id: ReviewCenter-Core-Inbox-AccessCurrent
        title: >-
          The Core subsystem shall decide on the access of the user at the time of the call, so that a removed member
          stops seeing the reviews of the project at once.
        justification: |
          A removed member must lose sight of the project immediately, not when something is stored or cached again.
        children:
          - ReviewCenter-InboxService-Access-CurrentAccess

      - id: ReviewCenter-Core-Inbox-AccessAuditor
        title: >-
          The Core subsystem shall offer no signature to give and no reply to give to an auditor.
        justification: |
          An auditor reads and does not act, so the inbox must not ask the auditor to.
        children:
          - ReviewCenter-InboxService-Access-AuditorNoSign
          - ReviewCenter-InboxService-Access-AuditorNoReply

      - id: ReviewCenter-Core-Inbox-AccessEmpty
        title: >-
          The Core subsystem shall give a user who is disabled or has a temporary password, a name that is no user, and
          no actor or the command line actor an empty inbox and a count of zero, without an error.
        justification: |
          A caller who cannot be a working user gets a plain empty answer and no way to tell which case it was.
        children:
          - ReviewCenter-InboxService-Access-Disabled
          - ReviewCenter-InboxService-Access-Disabled-CountZero
          - ReviewCenter-InboxService-Access-TemporaryPassword
          - ReviewCenter-InboxService-Access-Unknown
          - ReviewCenter-InboxService-Access-Unknown-CountZero
          - ReviewCenter-InboxService-Access-Anonymous
          - ReviewCenter-InboxService-Access-Anonymous-CountZero

      - id: ReviewCenter-Core-Inbox-AccessConcluded
        title: >-
          The Core subsystem shall show a review that is concluded to nobody as action, by the same rule that the lock
          of a review uses.
        justification: |
          A concluded review needs nobody; the inbox and the lock must not disagree about what concluded means.
        children:
          - ReviewCenter-InboxService-Access-ConcludedNoAction
        tests:
          - ReviewLock_IsConcluded_ParityWithInboxRules_ForAllStateCombinations

      - id: ReviewCenter-Core-Inbox-AccessSysadmin
        title: >-
          The Core subsystem shall give a system administrator who is no member of the project rows only for the
          reviews in which the administrator is a reviewer or the creator, and no row other than an update for a
          review in which the administrator only holds a slot.
        justification: |
          Administration of the system is not membership of a project, so it must not open the inbox to its reviews.
        children:
          - ReviewCenter-InboxService-Access-Sysadmin
          - ReviewCenter-InboxService-Access-Sysadmin-SlotOnly

      - id: ReviewCenter-Core-Inbox-Count
        title: >-
          The Core subsystem shall count the reviews that need the action of the user as the number of distinct reviews
          in the groups to answer, disputed, ready to sign, signature lost, replies waiting and failed checks.
        justification: |
          One number tells the user how much waits, and a review that is in two groups is still one piece of work.
        children:
          - ReviewCenter-InboxService-Count

      - id: ReviewCenter-Core-Inbox-CountNotCounted
        title: >-
          The Core subsystem shall not count an update, and not a review that waits for others, in the number of
          reviews that need action.
        justification: |
          Updates and waiting rows ask for nothing, so they must not raise the number that calls the user to act.
        children:
          - ReviewCenter-InboxService-Count-UpdatesNotCounted
          - ReviewCenter-InboxService-Count-WaitingNotCounted
          - ReviewCenter-InboxService-Updates-NotAction
          - ReviewCenter-InboxService-WaitingForOthers-NotAction

      - id: ReviewCenter-Core-Inbox-EachGroup
        title: >-
          The Core subsystem shall show a review that is in several groups in each of them.
        justification: |
          Each group answers a different question of the user, so none may hide a review that another shows.
        children:
          - ReviewCenter-InboxService-Count-EachGroup
        tests:
          - InboxService_GetInboxAsync_ReviewInSeveralSections_AppearsInEach

      - id: ReviewCenter-Core-Inbox-Unread
        title: >-
          The Core subsystem shall treat a comment as unread when it was written by somebody else and is newer than the
          last comment the user has seen, comparing the user names without regard to case.
        justification: |
          New comments are what the user wants to find first; the same person must not be told apart by letter case.
        children:
          - ReviewCenter-InboxService-Unread
          - ReviewCenter-InboxService-Unread-CaseInsensitive

      - id: ReviewCenter-Core-Inbox-UnreadNeverSeen
        title: >-
          The Core subsystem shall treat every comment of somebody else as unread when the user has never seen the
          review.
        justification: |
          A review that was never opened has nothing the user knows yet.
        children:
          - ReviewCenter-InboxService-Unread-NeverSeen

      - id: ReviewCenter-Core-Inbox-UnreadOwn
        title: >-
          The Core subsystem shall never treat a comment of the user as unread.
        justification: |
          What the user wrote is not news to the user.
        children:
          - ReviewCenter-InboxService-Unread-OwnComment

      - id: ReviewCenter-Core-Inbox-UnreadItem
        title: >-
          The Core subsystem shall mark an item of the inbox as unread when it holds an unread comment.
        justification: |
          The user finds the rows with news without opening every review.
        children:
          - ReviewCenter-InboxService-Unread-ItemComment

      - id: ReviewCenter-Core-Inbox-UnreadChanges
        title: >-
          The Core subsystem shall mark a ready to sign or signature lost item of a review the user has seen before as
          unread when somebody else signed, commented or reopened the review after the user last saw it.
        justification: |
          Changes that matter for the signature are news even when no new comment was written.
        children:
          - ReviewCenter-InboxService-Unread-Signature
          - ReviewCenter-InboxService-Unread-SignatureLost
          - ReviewCenter-InboxService-Unread-CommentChange
          - ReviewCenter-InboxService-Unread-Reopen

      - id: ReviewCenter-Core-Inbox-UnreadBallot
        title: >-
          The Core subsystem shall mark a ready to sign item as unread when another reviewer handed in a ballot after
          the user last saw the review.
        justification: |
          A new ballot can change what the user signs, so the user should look again.
        children:
          - ReviewCenter-InboxService-Unread-SubmittedBallot

      - id: ReviewCenter-Core-Inbox-UnreadDraftIgnored
        title: >-
          The Core subsystem shall not mark an item as unread because of a draft ballot of another slot.
        justification: |
          A draft is private to its reviewer and may still change, so it is no news to the others.
        children:
          - ReviewCenter-InboxService-Unread-DraftIgnored

      - id: ReviewCenter-Core-Inbox-UnreadHidden
        title: >-
          The Core subsystem shall not mark an item as unread because of a thread on a check for a user who may not see
          the other ballots.
        justification: |
          The mark would show that somebody wrote about a check, which tells that the others answered.
        children:
          - ReviewCenter-InboxService-Unread-HiddenCheckThread

      - id: ReviewCenter-Core-Inbox-UnreadCount
        title: >-
          The Core subsystem shall count the unread comments of all threads of a review for a user, and find the newest
          comment of all threads of a review.
        justification: |
          The count tells how much news there is and the newest comment is what marking the review as seen stores.
        children:
          - ReviewCenter-InboxService-Unread-CommentCount
          - ReviewCenter-InboxService-Unread-NewestComment

      - id: ReviewCenter-Core-Inbox-MarkSeen
        title: >-
          The Core subsystem shall store the newest comment and the time that a user has seen of a review.
        justification: |
          What the user has seen is the base of every unread mark, so it has to be kept per user and review.
        children:
          - ReviewCenter-InboxService-MarkSeen

      - id: ReviewCenter-Core-Inbox-NeverBackwards
        title: >-
          The Core subsystem shall never move the stored comment or time of a review back.
        justification: |
          A late or repeated call must not make comments that were seen unread again.
        children:
          - ReviewCenter-InboxService-MarkSeen-NeverBackwards

      - id: ReviewCenter-Core-Inbox-MarkSeenRefused
        title: >-
          The Core subsystem shall store nothing for a user who may not see the review and for a review that does not
          exist.
        justification: |
          Storing a mark would show that the review exists, and a mark for a missing review is of no use.
        children:
          - ReviewCenter-InboxService-MarkSeen-MayNotSee
          - ReviewCenter-InboxService-MarkSeen-NoSuchReview

      - id: ReviewCenter-Core-Inbox-MarkAll
        title: >-
          The Core subsystem shall mark every review of the inbox of the user as seen on request, and only the
          comments written up to the time that was read before the inbox was read.
        justification: |
          A user can clear the list in one step without losing a comment that arrived while the list was shown.
        children:
          - ReviewCenter-InboxService-MarkSeen-MarkAll
          - ReviewCenter-InboxService-MarkSeen-MarkAllUpToStart

      - id: ReviewCenter-Core-Inbox-MarkSeenArguments
        title: >-
          The Core subsystem shall refuse a missing user when it marks a review as seen.
        justification: |
          A call that lacks the user fails clearly instead of storing a mark for nobody.
        children:
          - ReviewCenter-InboxService-MarkSeen-MissingUser

      - id: ReviewCenter-Core-Inbox-KindWording
        title: >-
          The Core subsystem shall word the text of a review that waits for a reply by the kind of the open threads,
          naming the open findings and the open questions.
        justification: |
          A finding and a question ask for different answers, so the text says which of them waits.
        children:
          - ReviewCenter-InboxService-KindWording

      - id: ReviewCenter-Core-Inbox-SeenNotAudited
        title: >-
          The Core subsystem shall keep what the user has seen of each review out of the audit trail and out of the
          record digest.
        justification: |
          What a user looked at is private to the user, and it must not change what a signature covers.
        tests:
          - InboxService_MarkSeenAsync_KeepsStateOutOfRecordDigestAndAuditTrail
          - StorageSubsystem_InboxSeenState_MarkSeen_LeavesAuditTrailAndRecordDigestUnchanged

      - id: ReviewCenter-Core-AccessTokens
        title: >-
          The Core subsystem shall let a user create a personal access token with a name for a known, enabled user, and
          list it among the tokens of that user.
        justification: |
          Scripts need a credential of their own, and it must give less than a person has. Keeping only a hash, a
          limit, an expiry, and a revocation that works at once keep a leaked token small in effect, and refusing a
          signature in the service keeps the rule in force for every route that is ever added.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-Core-AccessTokens-Value
        title: >-
          The Core subsystem shall start the value of a new token with the prefix rcpat_, follow it with random
          URL-safe characters of a fixed length, and give two new tokens different values.
        justification: |
          A recognizable prefix lets secret scanners find a leaked token, and a unique random value cannot be guessed.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-Prefix
          - ReviewCenter-PersonalAccessTokenService-Create-ValueFormat
          - ReviewCenter-PersonalAccessTokenService-Create-ValueUnique

      - id: ReviewCenter-Core-AccessTokens-HashOnly
        title: >-
          The Core subsystem shall store only the SHA-256 hash of the value of a new token and no other form of it.
        justification: |
          A stolen copy of the storage must not give away working tokens.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-HashOnly

      - id: ReviewCenter-Core-AccessTokens-DisplayId
        title: >-
          The Core subsystem shall give a new token a short display id that is drawn at random and is not part of its
          value.
        justification: |
          A user and the audit trail can name a token without the name giving away anything of the secret.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-DisplayId
          - ReviewCenter-PersonalAccessTokenService-Create-DisplayIdIndependent
          - ReviewCenter-PersonalAccessTokenService-Create-DisplayIdRandom

      - id: ReviewCenter-Core-AccessTokens-ValueOnce
        title: >-
          The Core subsystem shall show the value of a token only in the answer of its creation and never again.
        justification: |
          Only the hash is kept, so a value that was not noted cannot be shown, and a value that is never shown again
          cannot leak from a list.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-ValueOnce

      - id: ReviewCenter-Core-AccessTokens-Name
        title: >-
          The Core subsystem shall store the name of a new token without leading and trailing white space.
        justification: |
          Names that differ only in blanks would look equal in a list and could not be told apart.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-NameTrimmed

      - id: ReviewCenter-Core-AccessTokens-NameRefused
        title: >-
          The Core subsystem shall refuse an empty or blank token name, and a token name that contains a control
          character, with the token name invalid rule.
        justification: |
          A name that shows nothing or breaks a line cannot serve to tell the tokens apart.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-NameEmpty
          - ReviewCenter-PersonalAccessTokenService-Create-NameControl

      - id: ReviewCenter-Core-AccessTokens-NameLength
        title: >-
          The Core subsystem shall accept a token name of exactly the allowed length of 100 characters.
        justification: |
          The limit is part of the rule, so the longest allowed name has to work.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-NameLength

      - id: ReviewCenter-Core-AccessTokens-NameTooLong
        title: >-
          The Core subsystem shall refuse a token name longer than 100 characters with the token name invalid rule.
        justification: |
          A bounded name keeps the lists and the audit entries readable.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-NameTooLong

      - id: ReviewCenter-Core-AccessTokens-OwnerRefused
        title: >-
          The Core subsystem shall refuse with the actor not allowed rule to create a token for an unknown or a
          disabled user, and to list the tokens of an unknown user.
        justification: |
          Only an existing, enabled user may hold a credential.
        children:
          - ReviewCenter-PersonalAccessTokenService-Create-UnknownOwner
          - ReviewCenter-PersonalAccessTokenService-Create-DisabledOwner
          - ReviewCenter-PersonalAccessTokenService-Create-ListUnknownOwner

      - id: ReviewCenter-Core-AccessTokens-Expiry
        title: >-
          The Core subsystem shall give a token an expiry of 30, 90, or 365 days after its creation, as chosen.
        justification: |
          A token that ends by itself limits how long a leaked token can be used.
        children:
          - ReviewCenter-PersonalAccessTokenService-Expiry
          - ReviewCenter-PersonalAccessTokenService-Expiry-Days30
          - ReviewCenter-PersonalAccessTokenService-Expiry-Days365

      - id: ReviewCenter-Core-AccessTokens-ExpiryOther
        title: >-
          The Core subsystem shall refuse a choice of expiry other than 30, 90, or 365 days.
        justification: |
          A fixed set of choices keeps tokens from living for an unbounded time.
        children:
          - ReviewCenter-PersonalAccessTokenService-Expiry-Other

      - id: ReviewCenter-Core-AccessTokens-Expired
        title: >-
          The Core subsystem shall refuse a token from its expiry time on with the expired failure reason.
        justification: |
          An expired token must stop working without anybody having to revoke it.
        children:
          - ReviewCenter-PersonalAccessTokenService-Expiry-Expired

      - id: ReviewCenter-Core-AccessTokens-Limit
        title: >-
          The Core subsystem shall refuse to create a token for a user who already has 20 active tokens, with the token
          limit reached rule, and store nothing.
        justification: |
          A bounded number of tokens limits what a single account can spread.
        children:
          - ReviewCenter-PersonalAccessTokenService-Limit

      - id: ReviewCenter-Core-AccessTokens-LimitActive
        title: >-
          The Core subsystem shall not count a revoked token or an expired token among the active tokens.
        justification: |
          A user must be able to make room by revoking tokens, and tokens that no longer work cost nothing.
        children:
          - ReviewCenter-PersonalAccessTokenService-Limit-Revoked
          - ReviewCenter-PersonalAccessTokenService-Limit-Expired

      - id: ReviewCenter-Core-AccessTokens-Authenticate
        title: >-
          The Core subsystem shall accept a token value whose hash equals the stored hash, and answer the owner of the
          token with the current role.
        justification: |
          A request that carries a valid token acts as its owner and never with more than the owner has now.
        children:
          - ReviewCenter-PersonalAccessTokenService-Authenticate
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-Core-AccessTokens-AuthenticateRefused
        title: >-
          The Core subsystem shall refuse a value that has the wrong shape, a well-formed value that matches no stored
          token, and a token whose stored hash differs from the hash of the presented value.
        justification: |
          Only a value that really belongs to a stored token may pass, and a refusal must say why.
        children:
          - ReviewCenter-PersonalAccessTokenService-Authenticate-Unknown
          - ReviewCenter-PersonalAccessTokenService-Authenticate-HashRecheck
          - ReviewCenter-PersonalAccessTokenService-Authenticate-Malformed

      - id: ReviewCenter-Core-AccessTokens-AuthenticateRevoked
        title: >-
          The Core subsystem shall refuse a revoked token with the revoked failure reason.
        justification: |
          A revoked token must stop working at once, whatever its expiry.
        children:
          - ReviewCenter-PersonalAccessTokenService-Authenticate-Revoked

      - id: ReviewCenter-Core-AccessTokens-AuthenticateOwner
        title: >-
          The Core subsystem shall refuse a token of an owner who is disabled or locked out, with the owner disabled or
          the owner locked out failure reason.
        justification: |
          A token only lasts as long as its owner is allowed to sign in.
        children:
          - ReviewCenter-PersonalAccessTokenService-Authenticate-OwnerDisabled
          - ReviewCenter-PersonalAccessTokenService-Authenticate-OwnerLockedOut

      - id: ReviewCenter-Core-AccessTokens-LastUsed
        title: >-
          The Core subsystem shall record the time of the first use of a token when it is authenticated.
        justification: |
          The owner can see which tokens are in use and which are forgotten.
        children:
          - ReviewCenter-PersonalAccessTokenService-LastUsed

      - id: ReviewCenter-Core-AccessTokens-LastUsedThrottle
        title: >-
          The Core subsystem shall record the last use of a token again only when five minutes have passed since the
          last record, and only once when several requests arrive at the same time.
        justification: |
          A busy script must not turn every request into a write.
        children:
          - ReviewCenter-PersonalAccessTokenService-LastUsed-WithinFiveMinutes
          - ReviewCenter-PersonalAccessTokenService-LastUsed-AfterFiveMinutes
          - ReviewCenter-PersonalAccessTokenService-LastUsed-Burst

      - id: ReviewCenter-Core-AccessTokens-Revoke
        title: >-
          The Core subsystem shall let a user revoke a token of their own so that it stops working at once.
        justification: |
          A user whose token may have leaked needs a way to end it immediately.
        children:
          - ReviewCenter-PersonalAccessTokenService-Revoke
        tests:
          - CoreSubsystem_AccessTokens_CreateAuthenticateAndRevoke_FollowTheOwner

      - id: ReviewCenter-Core-AccessTokens-RevokeRefused
        title: >-
          The Core subsystem shall refuse with the token not found rule to revoke the token of another user, a token
          that does not exist, and a token that is already revoked.
        justification: |
          A user must learn nothing about the tokens of others, and a repeated revocation must change nothing.
        children:
          - ReviewCenter-PersonalAccessTokenService-Revoke-OtherUser
          - ReviewCenter-PersonalAccessTokenService-Revoke-Missing
          - ReviewCenter-PersonalAccessTokenService-Revoke-AlreadyRevoked

      - id: ReviewCenter-Core-AccessTokens-NoTokenManagement
        title: >-
          The Core subsystem shall refuse to create and to revoke a token for an actor that came through a token.
        justification: |
          A leaked token must not be able to create further tokens or revoke the ones of its owner.
        children:
          - ReviewCenter-PersonalAccessTokenService-Revoke-ApiTokenCreate
          - ReviewCenter-PersonalAccessTokenService-Revoke-ApiToken

      - id: ReviewCenter-Core-AccessTokens-TemporaryPassword
        title: >-
          The Core subsystem shall refuse, with the password change required rule, to create, list, or revoke a token
          for a user whose password is a temporary one, and refuse every token of such an owner at authentication.
        justification: |
          A user with a temporary password has to choose a password before anything else, tokens included.
        children:
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-List
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Revoke
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Authenticate

      - id: ReviewCenter-Core-AccessTokens-TemporaryPasswordCleared
        title: >-
          The Core subsystem shall let a user create, list, and revoke tokens again, and accept a token of the owner at
          authentication again, once the password of the user is no longer a temporary one.
        justification: |
          The restriction ends with the temporary password, and the tokens of the user work again.
        children:
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared-List
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared-Revoke
          - ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared-Authenticate

      - id: ReviewCenter-Core-AccessTokens-Audit
        title: >-
          The Core subsystem shall record the creation of a token in the audit trail with the display id and the name
          of the token.
        justification: |
          The owner and an auditor can see which tokens were issued and when.
        children:
          - ReviewCenter-PersonalAccessTokenService-Audit

      - id: ReviewCenter-Core-AccessTokens-AuditRevoked
        title: >-
          The Core subsystem shall record the revocation of a token in the audit trail.
        justification: |
          The end of a credential belongs to the history just as much as its start.
        children:
          - ReviewCenter-PersonalAccessTokenService-Audit-Revoked

      - id: ReviewCenter-Core-AccessTokens-AuditNoValue
        title: >-
          The Core subsystem shall keep the value and the hash of a token out of the audit trail.
        justification: |
          The audit trail is read by many people, and a secret in it would be a leak.
        children:
          - ReviewCenter-PersonalAccessTokenService-Audit-NoValue

      - id: ReviewCenter-Core-AccessTokens-AuditExpiry
        title: >-
          The Core subsystem shall record the expiry of a token in the audit entry of its creation.
        justification: |
          An auditor can tell how long a credential was meant to last.
        children:
          - ReviewCenter-PersonalAccessTokenService-Audit-Expiry

      - id: ReviewCenter-Core-AccessTokens-NoSigning
        title: >-
          The Core subsystem shall refuse with the actor not allowed rule that an actor that came through a token signs
          a review, and name the token in the message of the refusal.
        justification: |
          A signature is a personal act, so a script must never give one, and the owner must see which token tried.
        children:
          - ReviewCenter-SigningService-ApiToken
          - ReviewCenter-SigningService-ApiToken-Message
        tests:
          - CoreSubsystem_TokenActor_CreatesFlaggedReviewButCannotSign

      - id: ReviewCenter-Core-AccessTokens-NoSlotChange
        title: >-
          The Core subsystem shall refuse that an actor that came through a token adds, changes, or removes a reviewer
          slot.
        justification: |
          Who may sign is part of the review, and a script must not be able to arrange it.
        children:
          - ReviewCenter-SigningService-ApiToken-SlotChange

      - id: ReviewCenter-Core-AccessTokens-NoSigningQuiet
        title: >-
          The Core subsystem shall let a refusal of a signature for a token actor be checked before anything else, and
          leave no count of wrong passwords and no audit entry behind.
        justification: |
          A refused script must not lock out its owner or fill the audit trail.
        children:
          - ReviewCenter-SigningService-ApiToken-FirstCheck
          - ReviewCenter-SigningService-ApiToken-NoPasswordCount
          - ReviewCenter-SigningService-ApiToken-NoAudit

      - id: ReviewCenter-Core-AccessTokens-CreatedBy
        title: >-
          The Core subsystem shall record the user who created a review.
        justification: |
          A review needs a creator that can be shown and checked, whatever route was used.
        children:
          - ReviewCenter-ReviewService-CreatedVia
        tests:
          - CoreSubsystem_TokenActor_CreatesFlaggedReviewButCannotSign

      - id: ReviewCenter-Core-AccessTokens-CreatedViaApi
        title: >-
          The Core subsystem shall mark a review created through a token as created through the API.
        justification: |
          Readers need to know that a script and not a person made the review.
        children:
          - ReviewCenter-ReviewService-CreatedVia-Api

      - id: ReviewCenter-Core-AccessTokens-CreatedViaAudit
        title: >-
          The Core subsystem shall name the identifier of the token, never its value, in the audit entry of a review
          created through a token.
        justification: |
          The trail must show which credential acted without giving the credential away.
        children:
          - ReviewCenter-ReviewService-CreatedVia-Token
          - ReviewCenter-ReviewService-CreatedVia-RepositoryToken

      - id: ReviewCenter-Core-AccessTokens-CreatedViaPerson
        title: >-
          The Core subsystem shall not mark a review created by a signed-in user as created through the API and shall
          name no token in its audit entry.
        justification: |
          The mark must not appear on the work of people.
        children:
          - ReviewCenter-ReviewService-CreatedVia-Person

      - id: ReviewCenter-Core-ExternalIdentity
        title: >-
          The Core subsystem shall find the account of a person who signed in at an OpenID Connect provider by the
          issuer and the subject only, and by no name.
        justification: |
          The provider says who the person is, and the review tool says what the person may do. A match on the issuer
          and the subject alone cannot be taken over by a person who picks the same name.
        children:
          - ReviewCenter-UserService-ExternalSignIn
          - ReviewCenter-UserService-ExternalSignIn-OnlyIssuerSubject
        tests:
          - UserService_SignInExternalAsync_FirstThenSecond_CreatesOnceAndMatches

      - id: ReviewCenter-Core-ExternalIdentity-Create
        title: >-
          The Core subsystem shall create the account of a provider on the first sign-in of an identity, once, and keep
          its issuer and subject.
        justification: |
          A person needs no separate registration, and a second sign-in must reach the same account.
        children:
          - ReviewCenter-UserService-ExternalSignIn-Create
        tests:
          - UserService_SignInExternalAsync_FirstThenSecond_CreatesOnceAndMatches

      - id: ReviewCenter-Core-ExternalIdentity-Enabled
        title: >-
          The Core subsystem shall create the account of a provider as an enabled user.
        justification: |
          The person has just proven the identity, so the account has to work at once.
        children:
          - ReviewCenter-UserService-ExternalSignIn-Enabled

      - id: ReviewCenter-Core-ExternalIdentity-NoRights
        title: >-
          The Core subsystem shall create the account of a provider as a user who is not a system administrator.
        justification: |
          The provider only vouches for the identity, so it must not hand out the right to run the tool.
        children:
          - ReviewCenter-UserService-ExternalSignIn-NotAdministrator

      - id: ReviewCenter-Core-ExternalIdentity-Audit
        title: >-
          The Core subsystem shall record the creation of the account of a provider in the audit trail with the host of
          the issuer.
        justification: |
          An auditor can see which accounts came from outside and from where.
        children:
          - ReviewCenter-UserService-ExternalSignIn-Audit

      - id: ReviewCenter-Core-ExternalIdentity-Disabled
        title: >-
          The Core subsystem shall refuse the sign-in of a disabled account of a provider and leave the account
          unchanged.
        justification: |
          An administrator who disabled a person must stay in control, whatever the provider says.
        children:
          - ReviewCenter-UserService-ExternalSignIn-Disabled

      - id: ReviewCenter-Core-ExternalIdentity-MissingIdentity
        title: >-
          The Core subsystem shall refuse a sign-in with a missing or empty issuer or subject.
        justification: |
          Without both values nothing identifies the person.
        children:
          - ReviewCenter-UserService-ExternalSignIn-MissingIdentity

      - id: ReviewCenter-Core-ExternalIdentity-IssuerLength
        title: >-
          The Core subsystem shall accept an issuer of up to 512 characters and refuse a longer one.
        justification: |
          A bound keeps the stored identity small, and the longest allowed value has to work.
        children:
          - ReviewCenter-UserService-ExternalSignIn-IssuerMaxLength
          - ReviewCenter-UserService-ExternalSignIn-IssuerTooLong

      - id: ReviewCenter-Core-ExternalIdentity-SubjectLength
        title: >-
          The Core subsystem shall accept a subject of up to 256 characters and refuse a longer one.
        justification: |
          A bound keeps the stored identity small, and the longest allowed value has to work.
        children:
          - ReviewCenter-UserService-ExternalSignIn-SubjectMaxLength
          - ReviewCenter-UserService-ExternalSignIn-SubjectTooLong

      - id: ReviewCenter-Core-ExternalIdentity-UserName
        title: >-
          The Core subsystem shall make the user name of the account of a provider from the suggestion of the provider
          by keeping only letters, digits, full stops, underscores, and hyphens, with a fallback and a length limit.
        justification: |
          A user name from outside must fit the rules of the tool and must not carry anything surprising.
        children:
          - ReviewCenter-UserService-ExternalCreate
          - ReviewCenter-UserService-ExternalCreate-NameFallback
          - ReviewCenter-UserService-ExternalCreate-ShortName
          - ReviewCenter-UserService-ExternalCreate-NameLength

      - id: ReviewCenter-Core-ExternalIdentity-DisplayName
        title: >-
          The Core subsystem shall clean the display name from the provider of control characters and extra white
          space, use the user name when it is empty, and cut it to the display name limit.
        justification: |
          A display name from outside is shown to other people, so it has to be clean and bounded.
        children:
          - ReviewCenter-UserService-ExternalCreate-DisplayNameClean
          - ReviewCenter-UserService-ExternalCreate-DisplayNameFallback
          - ReviewCenter-UserService-ExternalCreate-DisplayNameLength

      - id: ReviewCenter-Core-ExternalIdentity-NameTaken
        title: >-
          The Core subsystem shall add a number to the made user name of a new account of a provider when that name is
          taken, and fall back to a name made from the identity when no numbered variant is free.
        justification: |
          A new person must get an account even when the name that was suggested already exists.
        children:
          - ReviewCenter-UserService-UsernameCollision
          - ReviewCenter-UserService-UsernameCollision-IdentityName
          - ReviewCenter-UserService-UsernameCollision-IdentityNameTaken
          - ReviewCenter-UserService-UsernameCollision-LocalAccountName

      - id: ReviewCenter-Core-ExternalIdentity-NoLink
        title: >-
          The Core subsystem shall never sign a person from a provider in to an account that merely holds the same user
          name.
        justification: |
          Linking by name would let a person take over a local account, so the identity must be the only key.
        children:
          - ReviewCenter-UserService-UsernameCollision-NeverTakesOver

      - id: ReviewCenter-Core-ExternalIdentity-NoPassword
        title: >-
          The Core subsystem shall refuse to authenticate an account of a provider with any password and leave the
          count of failures at zero.
        justification: |
          An account without a password must not be reachable by guessing one, and must not lock itself out.
        children:
          - ReviewCenter-UserService-ExternalNoPassword

      - id: ReviewCenter-Core-ExternalIdentity-NoPasswordSignature
        title: >-
          The Core subsystem shall refuse to confirm a signature for an account of a provider with a password.
        justification: |
          A signature of such an account must rest on the provider, never on a password.
        children:
          - ReviewCenter-UserService-ExternalNoPassword-Confirm

      - id: ReviewCenter-Core-ExternalIdentity-NoPasswordChange
        title: >-
          The Core subsystem shall refuse to change or to set the password of an account of a provider and leave it
          without a password.
        justification: |
          A password set later would open a second way in that the provider does not control.
        children:
          - ReviewCenter-UserService-ExternalNoPassword-ChangePassword
          - ReviewCenter-UserService-ExternalNoPassword-SetPassword

      - id: ReviewCenter-Core-ExternalIdentity-SignProof
        title: >-
          The Core subsystem shall let a user of a provider sign a slot when a confirmation of identity that was issued
          for this user, project, review, and slot is still valid.
        justification: |
          A signature needs fresh proof of the person, and the provider is the only source of it for such an account.
        children:
          - ReviewCenter-SigningService-ExternalReauth
        tests:
          - SigningService_SignAsync_ExternalUserWithProof_SignsOnce

      - id: ReviewCenter-Core-ExternalIdentity-ProofRequired
        title: >-
          The Core subsystem shall refuse the signature of a user of a provider when there is no confirmation of
          identity or when the service has no store of confirmations.
        justification: |
          Without a confirmation the signature would rest on nothing.
        children:
          - ReviewCenter-SigningService-ExternalReauth-NoProof
          - ReviewCenter-SigningService-ExternalReauth-NoStore

      - id: ReviewCenter-Core-ExternalIdentity-ProofAudit
        title: >-
          The Core subsystem shall record a refusal for a missing confirmation of identity as a failed
          re-authentication in the audit trail, without any secret.
        justification: |
          A missing confirmation can be an attempt to forge a signature, and it has to leave a trace.
        children:
          - ReviewCenter-SigningService-ExternalReauth-FailedAudit

      - id: ReviewCenter-Core-ExternalIdentity-ProofCheck
        title: >-
          The Core subsystem shall let a page ask whether a confirmation of identity exists without using it up.
        justification: |
          The page has to tell the person whether to go to the provider first, and asking must not cost the proof.
        children:
          - ReviewCenter-SigningService-ExternalReauth-HasProof

      - id: ReviewCenter-Core-ExternalIdentity-ProofReviewer
        title: >-
          The Core subsystem shall accept a request for a confirmation of identity from a reviewer of the slot.
        justification: |
          The reviewer of a slot is the only person who may sign it, so the reviewer is the only one who may ask.
        children:
          - ReviewCenter-SigningService-ExternalReauth-ConfirmableReviewer

      - id: ReviewCenter-Core-ExternalIdentity-ProofReviewerRefused
        title: >-
          The Core subsystem shall refuse a request for a confirmation of identity from a user who is not a reviewer of
          the slot.
        justification: |
          Another person must not be able to spend or probe the proof of a slot.
        children:
          - ReviewCenter-SigningService-ExternalReauth-ConfirmableRefused

      - id: ReviewCenter-Core-ExternalIdentity-ProofBinding
        title: >-
          The Core subsystem shall accept a confirmation of identity only for the user, project, review, and slot it
          was issued for, refuse a missing review identifier, and keep it when another one tries to use it.
        justification: |
          A confirmation for one signature must not be usable for another.
        children:
          - ReviewCenter-SigningService-ExternalReauth-Binding
          - ReviewCenter-ReauthProofStore-Binding
          - ReviewCenter-ReauthProofStore-Binding-Kept
          - ReviewCenter-ReauthProofStore-Binding-ReviewId

      - id: ReviewCenter-Core-ExternalIdentity-ProofClock
        title: >-
          The Core subsystem shall refuse to keep confirmations of identity without a clock.
        justification: |
          The lifetime cannot be judged without a clock, so a store without one must not exist.
        children:
          - ReviewCenter-ReauthProofStore-Binding-Clock

      - id: ReviewCenter-Core-ExternalIdentity-ProofExpiry
        title: >-
          The Core subsystem shall treat a confirmation of identity as ended five minutes after it was issued, restart
          the lifetime when a new one is issued, and refuse the signature when it has expired.
        justification: |
          A confirmation that stays valid for long could be used by whoever finds the open session.
        children:
          - ReviewCenter-SigningService-ExternalReauth-Expired
          - ReviewCenter-ReauthProofStore-Expiry
          - ReviewCenter-ReauthProofStore-Expiry-Lifetime
          - ReviewCenter-ReauthProofStore-Expiry-Renewed

      - id: ReviewCenter-Core-ExternalIdentity-SingleUse
        title: >-
          The Core subsystem shall let a confirmation of identity be used once, refuse every later use, and accept a
          new use only after a new confirmation is issued.
        justification: |
          A proof that could be used twice would let one confirmation sign many slots.
        children:
          - ReviewCenter-ReauthProofStore-SingleUse
          - ReviewCenter-ReauthProofStore-SingleUse-Spent
          - ReviewCenter-ReauthProofStore-SingleUse-Reissue

      - id: ReviewCenter-Core-ExternalIdentity-UsedUp
        title: >-
          The Core subsystem shall use up the confirmation of identity when the signature of a user of a provider is
          stored.
        justification: |
          Each signature needs its own proof of the person.
        children:
          - ReviewCenter-SigningService-ExternalReauth-Spent
        tests:
          - SigningService_SignAsync_ExternalUserWithProof_SignsOnce

      - id: ReviewCenter-Core-ExternalIdentity-UsedUpLast
        title: >-
          The Core subsystem shall use up the confirmation of identity only after every other check of the signature
          has passed.
        justification: |
          A check that fails later must not cost the person the confirmation.
        children:
          - ReviewCenter-SigningService-ExternalReauth-SpentLast

      - id: ReviewCenter-Core-ExternalIdentity-ProofKept
        title: >-
          The Core subsystem shall keep the confirmation of identity when the signature is refused for another reason.
        justification: |
          The person can fix the problem and sign again without another trip to the provider.
        children:
          - ReviewCenter-SigningService-ExternalReauth-KeptOnRefusal

      - id: ReviewCenter-Core-ExternalIdentity-ProofBounded
        title: >-
          The Core subsystem shall keep at most 10000 confirmations of identity and drop the oldest one to make room
          for a new one when the store is full.
        justification: |
          A flood of sign-ins must not exhaust the memory of the tool.
        children:
          - ReviewCenter-ReauthProofStore-Bounded
          - ReviewCenter-ReauthProofStore-Bounded-Oldest

      - id: ReviewCenter-Core-ExternalIdentity-ProofBoundedLive
        title: >-
          The Core subsystem shall not drop a live confirmation of identity to make room for a new one while an ended
          confirmation can be dropped instead.
        justification: |
          A person who is about to sign must not lose the proof because of the load made by others.
        children:
          - ReviewCenter-ReauthProofStore-Bounded-Ended

      - id: ReviewCenter-Core-TotpSecondFactor
        title: >-
          The Core subsystem shall give a signed-in user of a local account who starts the setup of a second factor with
          the current password a new secret, as text and as an authenticator address.
        justification: |
          A password alone is the weakest link of a review tool that holds signatures. The rules sit in the services so
          that every page and route that is ever added gets them, and so that the code cannot be avoided by a path
          that was written earlier.
        children:
          - ReviewCenter-TotpService-Enrollment

      - id: ReviewCenter-Core-TotpSecondFactor-SetupSecretStrength
        title: >-
          The Core subsystem shall make the secret of a new setup of a second factor 160 bits long.
        justification: |
          A secret that is too short could be found by trying, and the second factor would protect nothing.
        children:
          - ReviewCenter-TotpService-Enrollment-SecretBits

      - id: ReviewCenter-Core-TotpSecondFactor-SetupIssuer
        title: >-
          The Core subsystem shall name ReviewCenter as the issuer in the authenticator address of a new secret.
        justification: |
          A person who has several entries in the app must be able to see which one belongs to this tool.
        children:
          - ReviewCenter-TotpService-Enrollment-Issuer

      - id: ReviewCenter-Core-TotpSecondFactor-SetupPending
        title: >-
          The Core subsystem shall keep a started setup of a second factor pending, so that the password alone still
          signs in until the setup is confirmed.
        justification: |
          A user who never finishes the setup must not be locked out by a half-made second factor.
        children:
          - ReviewCenter-TotpService-Enrollment-Pending

      - id: ReviewCenter-Core-TotpSecondFactor-SetupReplace
        title: >-
          The Core subsystem shall replace the pending secret with a new one when the setup is started again, so that a
          code of the old secret no longer confirms.
        justification: |
          A user who starts over must not leave an old secret that is still able to finish the setup.
        children:
          - ReviewCenter-TotpService-Enrollment-Replace

      - id: ReviewCenter-Core-TotpSecondFactor-SetupPassword
        title: >-
          The Core subsystem shall refuse to start the setup of a second factor when the current password is wrong, and
          store no secret.
        justification: |
          Somebody at an open session must not be able to bind a second factor of their own to the account.
        children:
          - ReviewCenter-TotpService-Enrollment-Password
          - ReviewCenter-TotpService-Enrollment-PasswordNothingStored

      - id: ReviewCenter-Core-TotpSecondFactor-SetupAlreadyOn
        title: >-
          The Core subsystem shall refuse to start the setup of a second factor for a user whose second factor is
          already on.
        justification: |
          A second factor that is on can only be replaced after it was turned off with its own proof.
        children:
          - ReviewCenter-TotpService-Enrollment-AlreadyOn

      - id: ReviewCenter-Core-TotpSecondFactor-SetupConfirm
        title: >-
          The Core subsystem shall turn the second factor on when the user confirms a pending setup with a right code
          from the app within 15 minutes.
        justification: |
          The right code proves that the app of the user holds the secret before the factor starts to be demanded.
        children:
          - ReviewCenter-TotpService-Enrollment-Confirm

      - id: ReviewCenter-Core-TotpSecondFactor-SetupWindow
        title: >-
          The Core subsystem shall accept the confirmation of a setup up to exactly 15 minutes after it was started and
          refuse it after that.
        justification: |
          A pending secret must not stay open for confirmation for ever.
        children:
          - ReviewCenter-TotpService-Enrollment-Window
          - ReviewCenter-TotpService-Enrollment-Expired

      - id: ReviewCenter-Core-TotpSecondFactor-SetupWrongCode
        title: >-
          The Core subsystem shall refuse the confirmation of a setup with a wrong or a malformed code, with the same
          message for both, and keep the setup pending.
        justification: |
          A refusal must not tell a guesser more than it must, and the user must be able to try again.
        children:
          - ReviewCenter-TotpService-Enrollment-WrongCode
          - ReviewCenter-TotpService-Enrollment-WrongCodePending

      - id: ReviewCenter-Core-TotpSecondFactor-SetupNothingStarted
        title: >-
          The Core subsystem shall refuse the confirmation of a setup when none was started.
        justification: |
          There is no secret to check a code against.
        children:
          - ReviewCenter-TotpService-Enrollment-NothingStarted

      - id: ReviewCenter-Core-TotpSecondFactor-SetupRecoveryCodes
        title: >-
          The Core subsystem shall return ten recovery codes in the answer that confirms the setup.
        justification: |
          A user who loses the phone needs a way in, and the codes can be handed out only while they are known.
        children:
          - ReviewCenter-TotpService-Enrollment-RecoveryCodes

      - id: ReviewCenter-Core-TotpSecondFactor-SetupCancel
        title: >-
          The Core subsystem shall remove a pending setup when the user gives it up.
        justification: |
          A secret that is not going to be used should not stay stored.
        children:
          - ReviewCenter-TotpService-Enrollment-Cancel

      - id: ReviewCenter-Core-TotpSecondFactor-SetupCancelKeepsOn
        title: >-
          The Core subsystem shall leave a confirmed second factor alone when the user gives up a setup.
        justification: |
          Giving up a new setup must never turn off the protection that is already working.
        children:
          - ReviewCenter-TotpService-Enrollment-CancelKeepsOn

      - id: ReviewCenter-Core-TotpSecondFactor-Availability
        title: >-
          The Core subsystem shall refuse the setup of a second factor for an account of an identity provider.
        justification: |
          The provider owns the sign-in of such an account, so a second factor of this tool would never be asked for.
        children:
          - ReviewCenter-TotpService-Availability

      - id: ReviewCenter-Core-TotpSecondFactor-AvailabilityRefused
        title: >-
          The Core subsystem shall refuse the setup of a second factor for an account with a temporary password, for a
          request that comes with an API token, and while the feature is switched off.
        justification: |
          In each of these cases the setup would be unsafe or would never be asked for.
        children:
          - ReviewCenter-TotpService-Availability-TemporaryPassword
          - ReviewCenter-TotpService-Availability-ApiToken
          - ReviewCenter-TotpService-Availability-FeatureOff

      - id: ReviewCenter-Core-TotpSecondFactor-AvailabilityMessage
        title: >-
          The Core subsystem shall give the same message, that a second factor is not available for the account,
          whichever reason makes the setup of a second factor unavailable.
        justification: |
          A refusal must not tell an outsider which kind of account or setting is behind it.
        children:
          - ReviewCenter-TotpService-Availability-Message

      - id: ReviewCenter-Core-TotpSecondFactor-AvailabilityOperations
        title: >-
          The Core subsystem shall refuse each account operation of the second factor, namely the confirmation, the
          cancellation, the removal, and the issue of new recovery codes, for a request that comes with an API token
          and while the feature is switched off.
        justification: |
          A script must not change the protection of its owner, and a feature that is off must not be changed.
        children:
          - ReviewCenter-TotpService-Availability-OperationsApiToken
          - ReviewCenter-TotpService-Availability-OperationsFeatureOff

      - id: ReviewCenter-Core-TotpSecondFactor-AvailabilityStatus
        title: >-
          The Core subsystem shall report a user for whom a second factor is not available as unable to set one up.
        justification: |
          The page can then hide the setup instead of offering something that is refused.
        children:
          - ReviewCenter-TotpService-Availability-Status

      - id: ReviewCenter-Core-TotpSecondFactor-AvailabilityArguments
        title: >-
          The Core subsystem shall refuse a missing argument of the setup of a second factor with an argument-null
          error.
        justification: |
          A call that is wrong must fail at once and in a way that the caller can tell.
        children:
          - ReviewCenter-TotpService-Availability-NullArguments

      - id: ReviewCenter-Core-TotpSecondFactor-Verify
        title: >-
          The Core subsystem shall complete the second step of a sign-in with a code of the current 30 second step or of
          the step before or after it.
        justification: |
          The clock of a phone drifts a little, and a code that is one step off must still work.
        children:
          - ReviewCenter-TotpService-Verify

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyOutsideWindow
        title: >-
          The Core subsystem shall refuse a code that is two or more steps away from the current step.
        justification: |
          A wider window would give a guesser more codes that work at any time.
        children:
          - ReviewCenter-TotpService-Verify-OutsideWindow

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyUser
        title: >-
          The Core subsystem shall sign in the user of the pending challenge and never a user named by the request.
        justification: |
          The password step has already named the user, and a request must not be able to change that.
        children:
          - ReviewCenter-TotpService-Verify-User

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyRefusal
        title: >-
          The Core subsystem shall give the same failed outcome, without a user, for a wrong, a reused, an empty, and a
          malformed code at the second step.
        justification: |
          The outcome must not tell a guesser why a code failed.
        children:
          - ReviewCenter-TotpService-Verify-Refusal

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyChallengeInvalid
        title: >-
          The Core subsystem shall answer a missing, unknown, used, expired, or foreign-client challenge, and the
          challenge of a user who was disabled meanwhile, with the outcome "challenge invalid" and no user.
        justification: |
          A challenge that cannot be trusted must end the sign-in and say nothing else.
        children:
          - ReviewCenter-TotpService-Verify-ChallengeInvalid
          - ReviewCenter-TotpService-Verify-DisabledUser

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyForeignClientKept
        title: >-
          The Core subsystem shall keep a challenge that was tried from another client address, so that its own client
          can still use it.
        justification: |
          A stranger who has seen a challenge must not be able to destroy it for the person it belongs to.
        children:
          - ReviewCenter-TotpService-Verify-ForeignClientKept

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyFeatureOff
        title: >-
          The Core subsystem shall answer every challenge with the outcome "challenge invalid" while the feature is
          switched off.
        justification: |
          A feature that is off must not let a sign-in finish through the second step.
        children:
          - ReviewCenter-TotpService-Verify-FeatureOff

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyUnreadableSecret
        title: >-
          The Core subsystem shall refuse a six digit code like a wrong one when the stored secret cannot be read.
        justification: |
          A damaged secret must fail closed and look like any other failure.
        children:
          - ReviewCenter-TotpService-Verify-UnreadableSecret

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyInvalidated
        title: >-
          The Core subsystem shall not give back a challenge that was ended while its code was being checked.
        justification: |
          A reset or a removal that happens during the check must still end the sign-in.
        children:
          - ReviewCenter-TotpService-Verify-Invalidated

      - id: ReviewCenter-Core-TotpSecondFactor-VerifyLastSignIn
        title: >-
          The Core subsystem shall store the time of the last sign-in only when the second step succeeds, and not for a
          failed code.
        justification: |
          The shown time of the last sign-in must tell the truth about who got in.
        children:
          - ReviewCenter-TotpService-Verify-LastSignIn

      - id: ReviewCenter-Core-TotpSecondFactor-Replay
        title: >-
          The Core subsystem shall accept a code only when its time step is later than the step of the last accepted
          code.
        justification: |
          A code that was seen once, for example over a shoulder, must not work a second time.
        children:
          - ReviewCenter-TotpService-Replay

      - id: ReviewCenter-Core-TotpSecondFactor-ReplayConcurrent
        title: >-
          The Core subsystem shall let exactly one of several requests that present the same code at the same moment
          succeed.
        justification: |
          A check that is not atomic could let a single code open several sessions.
        children:
          - ReviewCenter-TotpService-Replay-Concurrent
        tests:
          - TotpService_CompleteSignInAsync_ConcurrentSameCode_ExactlyOneSucceeds

      - id: ReviewCenter-Core-TotpSecondFactor-ReplaySetupCode
        title: >-
          The Core subsystem shall refuse the code that confirmed the setup when it is used to sign in.
        justification: |
          The code that was typed to finish the setup has been seen by the user and the screen, so it must not count.
        children:
          - ReviewCenter-TotpService-Replay-Enrollment

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodes
        title: >-
          The Core subsystem shall create each set of recovery codes as ten distinct codes.
        justification: |
          Ten codes give a user several ways in, and equal codes would waste them.
        children:
          - ReviewCenter-TotpService-RecoveryCodes

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesStrength
        title: >-
          The Core subsystem shall write each recovery code as four groups of four symbols from an alphabet of 32
          symbols, separated by hyphens.
        justification: |
          The code has to be long enough that it cannot be guessed and short enough to be written down.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-Strength

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesHashed
        title: >-
          The Core subsystem shall store only a hash of each recovery code.
        justification: |
          A copy of the storage must not give away codes that still work.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-Hashed

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesSignIn
        title: >-
          The Core subsystem shall accept an unused recovery code in place of an authenticator code at the second step
          of a sign-in.
        justification: |
          A user who lost the phone must still be able to get in.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-SignIn

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesSpelling
        title: >-
          The Core subsystem shall accept a recovery code regardless of case, spaces, and hyphens.
        justification: |
          A code that was copied from paper is easily typed with other spacing.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-Spelling

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesOnce
        title: >-
          The Core subsystem shall accept each recovery code only once, also when several requests present the same
          code at the same moment.
        justification: |
          A code that works twice is a code that can be kept and used later by somebody else.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-Once
          - ReviewCenter-TotpService-RecoveryCodes-Concurrent

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesOtherUser
        title: >-
          The Core subsystem shall refuse the recovery code of another user.
        justification: |
          A code belongs to one account only.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-OtherUser

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplace
        title: >-
          The Core subsystem shall replace all recovery codes by ten new codes when the user presents the current
          password and a right code from the app.
        justification: |
          A user who used up or lost the codes needs a new set, and only the user may ask for it.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-Replace

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplaceStopsOld
        title: >-
          The Core subsystem shall refuse the old recovery codes after a new set was issued.
        justification: |
          Old codes that were written down in a lost place must stop working.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-ReplaceStopsOld

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplaceNeedsAppCode
        title: >-
          The Core subsystem shall refuse a recovery code in place of the code from the app when new recovery codes are
          requested.
        justification: |
          Whoever found one old code must not be able to turn it into a whole new set.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-ReplaceNeedsAppCode

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesReplaceRefused
        title: >-
          The Core subsystem shall refuse new recovery codes when the password is wrong or when the code from the app
          is wrong, and keep the old codes.
        justification: |
          A failed request must neither give a new set nor take the old one away.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-ReplacePassword
          - ReviewCenter-TotpService-RecoveryCodes-ReplaceCode

      - id: ReviewCenter-Core-TotpSecondFactor-RecoveryCodesUnreadableSecret
        title: >-
          The Core subsystem shall accept a recovery code at the second step of a sign-in when the stored secret cannot
          be read.
        justification: |
          The recovery code is the way out of a damaged secret, so it must not depend on it.
        children:
          - ReviewCenter-TotpService-RecoveryCodes-UnreadableSecret

      - id: ReviewCenter-Core-TotpSecondFactor-Disable
        title: >-
          The Core subsystem shall remove the second factor of a user who presents the current password and a right
          code.
        justification: |
          A user who changes phone or no longer wants the factor must be able to end it, with proof.
        children:
          - ReviewCenter-TotpService-Disable

      - id: ReviewCenter-Core-TotpSecondFactor-DisableRecoveryCode
        title: >-
          The Core subsystem shall remove the second factor of a user who presents the current password and an unused
          recovery code.
        justification: |
          A user who lost the phone can end the factor without an administrator.
        children:
          - ReviewCenter-TotpService-Disable-RecoveryCode

      - id: ReviewCenter-Core-TotpSecondFactor-DisableRefused
        title: >-
          The Core subsystem shall refuse the removal of the second factor when the password is wrong or when the code
          is wrong, and keep the second factor.
        justification: |
          Somebody at an open session must not be able to take the protection away.
        children:
          - ReviewCenter-TotpService-Disable-WrongPassword
          - ReviewCenter-TotpService-Disable-WrongCode

      - id: ReviewCenter-Core-TotpSecondFactor-DisableNotEnrolled
        title: >-
          The Core subsystem shall refuse the removal of the second factor for a user who has none.
        justification: |
          There is nothing to remove, and the refusal tells the caller so.
        children:
          - ReviewCenter-TotpService-Disable-NotEnrolled

      - id: ReviewCenter-Core-TotpSecondFactor-DisableRecoveryCodesDeleted
        title: >-
          The Core subsystem shall delete the recovery codes of the user together with the secret when the second
          factor is removed.
        justification: |
          Codes that are left behind would be hashes that serve no purpose and could confuse a later setup.
        children:
          - ReviewCenter-TotpService-Disable-RecoveryCodesDeleted

      - id: ReviewCenter-Core-TotpSecondFactor-DisablePendingSignIns
        title: >-
          The Core subsystem shall end every pending sign-in of the user whose second factor was removed.
        justification: |
          A challenge that was issued under the old setting must not finish a sign-in afterwards.
        children:
          - ReviewCenter-TotpService-Disable-PendingSignIns

      - id: ReviewCenter-Core-TotpSecondFactor-AdminReset
        title: >-
          The Core subsystem shall let an enabled system administrator remove the second factor of another user.
        justification: |
          A user who lost both the phone and the codes needs help, and the administrator is the one who can give it.
        children:
          - ReviewCenter-TotpService-AdminReset

      - id: ReviewCenter-Core-TotpSecondFactor-AdminResetRefused
        title: >-
          The Core subsystem shall refuse the reset when the caller is not a system administrator, when the
          administrator acts through an API token, or when the administrator account is disabled, and keep the
          second factor of the user.
        justification: |
          Only a person who holds the right now may take the protection of another user away.
        children:
          - ReviewCenter-TotpService-AdminReset-NotAdmin
          - ReviewCenter-TotpService-AdminReset-ApiToken
          - ReviewCenter-TotpService-AdminReset-DisabledAdmin

      - id: ReviewCenter-Core-TotpSecondFactor-AdminResetPasswordChange
        title: >-
          The Core subsystem shall refuse to reset the second factor of a user when the system administrator who asks
          still has to change a temporary password, and keep the second factor of the user.
        justification: |
          An administrator whose password is a temporary one is not yet the only holder of the account, so the right
          to take the protection of another user away must wait until the password is changed.
        children:
          - ReviewCenter-TotpService-AdminReset-MustChangePassword

      - id: ReviewCenter-Core-TotpSecondFactor-AdminResetTarget
        title: >-
          The Core subsystem shall refuse the reset of a user who does not exist and of a user who has no second
          factor.
        justification: |
          A reset must act on a real second factor, and the refusal tells the administrator what is wrong.
        children:
          - ReviewCenter-TotpService-AdminReset-UnknownUser
          - ReviewCenter-TotpService-AdminReset-NotEnrolled

      - id: ReviewCenter-Core-TotpSecondFactor-AdminResetPendingSignIns
        title: >-
          The Core subsystem shall end every pending sign-in of the user whose second factor was reset.
        justification: |
          A challenge that was issued under the old setting must not finish a sign-in afterwards.
        children:
          - ReviewCenter-TotpService-AdminReset-PendingSignIns

      - id: ReviewCenter-Core-TotpSecondFactor-AdminResetList
        title: >-
          The Core subsystem shall list the users who have a confirmed second factor, and not those with a pending
          setup.
        justification: |
          An administrator needs to see who can be reset, and a setup that was never confirmed protects nobody.
        children:
          - ReviewCenter-TotpService-AdminReset-EnrolledList

      - id: ReviewCenter-Core-TotpSecondFactor-Lockout
        title: >-
          The Core subsystem shall count a wrong code at the second step of a sign-in toward the lockout that counts
          wrong passwords.
        justification: |
          A code of six digits can be guessed, so wrong codes must lead to the same lockout as wrong passwords.
        children:
          - ReviewCenter-TotpService-Lockout

      - id: ReviewCenter-Core-TotpSecondFactor-LockoutLocked
        title: >-
          The Core subsystem shall refuse even a right code at the second step while the account is locked out.
        justification: |
          A lockout that a lucky guess could end would not stop guessing.
        children:
          - ReviewCenter-TotpService-Lockout-Locked

      - id: ReviewCenter-Core-TotpSecondFactor-LockoutSetupLocked
        title: >-
          The Core subsystem shall refuse even a right code at the confirmation of a setup while the account is locked
          out.
        justification: |
          A lockout that a lucky guess at the setup could get around would not stop guessing.
        children:
          - ReviewCenter-TotpService-Lockout-SetupLocked

      - id: ReviewCenter-Core-TotpSecondFactor-LockoutOperations
        title: >-
          The Core subsystem shall count a wrong code at the confirmation of a setup, at the removal of the second
          factor, and at a signature toward the lockout.
        justification: |
          Every place that asks for a code can be used to guess it, so each must count.
        children:
          - ReviewCenter-TotpService-Lockout-Setup
          - ReviewCenter-TotpService-Lockout-Removal
          - ReviewCenter-TotpService-Lockout-Signature

      - id: ReviewCenter-Core-TotpSecondFactor-LockoutShared
        title: >-
          The Core subsystem shall count wrong codes and wrong passwords in one counter.
        justification: |
          Two counters would give a guesser twice as many tries before the lockout.
        children:
          - ReviewCenter-TotpService-Lockout-Shared

      - id: ReviewCenter-Core-TotpSecondFactor-LockoutCleared
        title: >-
          The Core subsystem shall clear the failure counter when the whole sign-in succeeds.
        justification: |
          A user who got in must start again with a full number of tries.
        children:
          - ReviewCenter-TotpService-Lockout-Cleared

      - id: ReviewCenter-Core-TotpSecondFactor-LockoutPasswordAlone
        title: >-
          The Core subsystem shall not clear the failure counter when only the password of a sign-in is right.
        justification: |
          A guesser who knows the password could otherwise reset the counter and try codes without end.
        children:
          - ReviewCenter-TotpService-Lockout-PasswordAlone

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChange
        title: >-
          The Core subsystem shall change the own password of a user whose second factor is on when the current
          password and a right code from the app are given.
        justification: |
          A new password is worth as much as the sign-in, so it needs the same two proofs.
        children:
          - ReviewCenter-TotpService-ChangePassword

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeRecoveryCode
        title: >-
          The Core subsystem shall accept an unused recovery code in place of the code from the app when the password
          is changed, and accept each recovery code only once.
        justification: |
          A user without the phone must still be able to change the password.
        children:
          - ReviewCenter-TotpService-ChangePassword-RecoveryCode
          - ReviewCenter-TotpService-ChangePassword-RecoveryCodeOnce

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeNoCode
        title: >-
          The Core subsystem shall refuse the change of the password without a code, with an empty or blank code, or
          with a wrong code, and keep the password hash.
        justification: |
          A password change without the second proof would open the way around the second factor.
        children:
          - ReviewCenter-TotpService-ChangePassword-NoCode
          - ReviewCenter-TotpService-ChangePassword-WrongCode

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeWrongPassword
        title: >-
          The Core subsystem shall refuse the change of the password with a wrong current password before the code is
          looked at, and keep the code unused.
        justification: |
          A guesser of the password must not be able to use up the codes of the user.
        children:
          - ReviewCenter-TotpService-ChangePassword-WrongPassword

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeReused
        title: >-
          The Core subsystem shall refuse the change of the password with a code whose step was already used.
        justification: |
          A code that was seen once must not work for a password change either.
        children:
          - ReviewCenter-TotpService-ChangePassword-Reused

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeCounted
        title: >-
          The Core subsystem shall count a wrong or missing code at a password change toward the shared failure
          counter.
        justification: |
          A password change is one more place where codes can be guessed.
        children:
          - ReviewCenter-TotpService-ChangePassword-Counted

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeClearedAfterProof
        title: >-
          The Core subsystem shall clear the failure counter only after the whole proof of a password change
          succeeded.
        justification: |
          A right password alone must not reset the counter that limits the guessing of codes.
        children:
          - ReviewCenter-TotpService-ChangePassword-ClearedAfterProof

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeLockout
        title: >-
          The Core subsystem shall refuse even a right code at a password change after five wrong codes, until the
          lockout ends.
        justification: |
          A lockout that a lucky guess could end would not stop guessing.
        children:
          - ReviewCenter-TotpService-ChangePassword-Lockout

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangePasswordOnly
        title: >-
          The Core subsystem shall leave the failure counter alone when the password is right but the code is missing.
        justification: |
          A form that was sent without the code is a slip and not a guess.
        children:
          - ReviewCenter-TotpService-ChangePassword-PasswordOnly

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeApiToken
        title: >-
          The Core subsystem shall refuse the change of the password for a request that comes with an API token.
        justification: |
          A script must not be able to take over the account of its owner by choosing a new password.
        children:
          - ReviewCenter-TotpService-ChangePassword-ApiToken

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeNotRequired
        title: >-
          The Core subsystem shall change the password with the password alone for a user without a second factor and
          while the feature is switched off.
        justification: |
          The second proof is only asked for where there is a second factor to ask about.
        children:
          - ReviewCenter-TotpService-ChangePassword-NotEnrolled
          - ReviewCenter-TotpService-ChangePassword-FeatureOff

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeTemporary
        title: >-
          The Core subsystem shall change a temporary password without a code.
        justification: |
          A user with a temporary password has to choose a new one before anything else, and no setup can exist yet.
        children:
          - ReviewCenter-TotpService-ChangePassword-TemporaryPassword

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeUnreadable
        title: >-
          The Core subsystem shall refuse a six digit code at a password change like a wrong one, and accept a recovery
          code, when the stored secret cannot be read.
        justification: |
          A damaged secret must fail closed for codes and must leave the recovery code as the way out.
        children:
          - ReviewCenter-TotpService-ChangePassword-UnreadableSecret
          - ReviewCenter-TotpService-ChangePassword-UnreadableRecovery

      - id: ReviewCenter-Core-TotpSecondFactor-PasswordChangeConcurrent
        title: >-
          The Core subsystem shall let exactly one of several requests that present the same code and a password change
          the password.
        justification: |
          A check that is not atomic could let one code change the password more than once.
        children:
          - ReviewCenter-TotpService-ChangePassword-Concurrent

      - id: ReviewCenter-Core-TotpSecondFactor-Audit
        title: >-
          The Core subsystem shall record in the audit trail that a setup of a second factor was completed.
        justification: |
          A change of the protection of an account belongs to the history of the review tool.
        children:
          - ReviewCenter-TotpService-Audit

      - id: ReviewCenter-Core-TotpSecondFactor-AuditRemoved
        title: >-
          The Core subsystem shall record in the audit trail that a second factor was removed by its owner.
        justification: |
          Taking the protection away is the change an auditor most wants to see.
        children:
          - ReviewCenter-TotpService-Audit-Removed

      - id: ReviewCenter-Core-TotpSecondFactor-AuditReset
        title: >-
          The Core subsystem shall record in the audit trail that a second factor was reset by an administrator, with
          the administrator and the target.
        justification: |
          A reset by another person has to show who did it and to whom.
        children:
          - ReviewCenter-TotpService-Audit-Reset

      - id: ReviewCenter-Core-TotpSecondFactor-AuditRecoveryRegenerated
        title: >-
          The Core subsystem shall record in the audit trail that a new set of recovery codes was issued.
        justification: |
          A new set changes how an account can be entered, so it belongs to the history.
        children:
          - ReviewCenter-TotpService-Audit-RecoveryRegenerated

      - id: ReviewCenter-Core-TotpSecondFactor-AuditRecoveryUsed
        title: >-
          The Core subsystem shall record in the audit trail the use of a recovery code, without the code.
        justification: |
          A recovery code is the sign that the phone is gone, and the owner should be able to see the use.
        children:
          - ReviewCenter-TotpService-Audit-RecoveryUsed

      - id: ReviewCenter-Core-TotpSecondFactor-AuditWrongCode
        title: >-
          The Core subsystem shall record in the audit trail a wrong code at the second step, with the user as actor and
          a fixed text.
        justification: |
          Repeated wrong codes can be an attack, and they have to leave a trace that holds no secret.
        children:
          - ReviewCenter-TotpService-Audit-WrongCode

      - id: ReviewCenter-Core-TotpSecondFactor-NoSecretLeak
        title: >-
          The Core subsystem shall never put secret material of the second factor, namely the secret, a code, a
          recovery code, or a challenge token, into the audit trail.
        justification: |
          The audit trail is read by many people, and a secret in it would be a leak.
        children:
          - ReviewCenter-TotpService-NoSecretLeak

      - id: ReviewCenter-Core-TotpSecondFactor-NoSecretLeakErrors
        title: >-
          The Core subsystem shall never put secret material of the second factor, namely the secret, a code, a
          recovery code, or a challenge token, into an error message.
        justification: |
          Error messages are shown on screen and written to logs, so a secret there would be a leak.
        children:
          - ReviewCenter-TotpService-NoSecretLeak-ErrorMessages

      - id: ReviewCenter-Core-TotpSecondFactor-NoSecretLeakShownOnce
        title: >-
          The Core subsystem shall show the secret and the recovery codes only in the answer to the request that
          created them, and not when the status is read.
        justification: |
          A secret that can be read again later can be taken from an open session.
        children:
          - ReviewCenter-TotpService-NoSecretLeak-ShownOnce

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeSingleUse
        title: >-
          The Core subsystem shall give a challenge of a sign-in to only one caller, also when several requests take it
          at the same time, so that a second request for a challenge that was taken gets nothing.
        justification: |
          A challenge that could be taken twice would let one password step lead to several sessions.
        children:
          - ReviewCenter-TotpChallengeStore-SingleUse
          - ReviewCenter-TotpChallengeStore-SingleUse-Concurrent

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeToken
        title: >-
          The Core subsystem shall issue a different token of 256 random bits, written as URL-safe text, for each
          challenge.
        justification: |
          A token that cannot be guessed or met twice cannot be used to reach the challenge of another person.
        children:
          - ReviewCenter-TotpChallengeStore-SingleUse-Token
          - ReviewCenter-TotpChallengeStore-SingleUse-Unique

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeHash
        title: >-
          The Core subsystem shall keep only the SHA-256 hash of the token of a challenge.
        justification: |
          A copy of the memory or storage must not give away tokens that still work.
        children:
          - ReviewCenter-TotpChallengeStore-SingleUse-Hash

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeUnknown
        title: >-
          The Core subsystem shall give nothing for a missing, empty, or unknown challenge token.
        justification: |
          A made-up token must lead nowhere and must not raise an error that tells more.
        children:
          - ReviewCenter-TotpChallengeStore-SingleUse-Unknown

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeRetry
        title: >-
          The Core subsystem shall keep a challenge that is given back after a wrong code, so that it can be taken
          again, until five wrong codes were counted.
        justification: |
          A user who mistyped a code must be able to try again without repeating the password.
        children:
          - ReviewCenter-TotpChallengeStore-SingleUse-Retry

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeLimit
        title: >-
          The Core subsystem shall drop a challenge at the fifth wrong code.
        justification: |
          A challenge that lives for ever would let a guesser try codes without end.
        children:
          - ReviewCenter-TotpChallengeStore-SingleUse-Limit

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeBinding
        title: >-
          The Core subsystem shall give a challenge only to a request from the client address that it was issued to, and
          keep it when a request from another client address tries to see or take it.
        justification: |
          A challenge that was seen by somebody else must not be usable from there, and must not be lost to its owner.
        children:
          - ReviewCenter-TotpChallengeStore-Binding
          - ReviewCenter-TotpChallengeStore-Binding-Kept

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeNoAddress
        title: >-
          The Core subsystem shall give a challenge that was issued without a client address only to a request without
          a client address.
        justification: |
          A missing address must not become a way to take a challenge from anywhere.
        children:
          - ReviewCenter-TotpChallengeStore-Binding-NoAddress

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeExpiry
        title: >-
          The Core subsystem shall treat a challenge as ended five minutes after it was issued.
        justification: |
          A sign-in that was left half-finished must not stay open for ever.
        children:
          - ReviewCenter-TotpChallengeStore-Expiry
          - ReviewCenter-TotpChallengeStore-Expiry-Lifetime

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeExpiryReturned
        title: >-
          The Core subsystem shall not keep a challenge that is given back after a wrong code once its lifetime has
          passed.
        justification: |
          Giving a challenge back must not give it a new life.
        children:
          - ReviewCenter-TotpChallengeStore-Expiry-Returned

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeBounded
        title: >-
          The Core subsystem shall keep at most 10000 challenges and drop the oldest one to make room for a new one when
          the store is full.
        justification: |
          A flood of password steps must not exhaust the memory of the tool.
        children:
          - ReviewCenter-TotpChallengeStore-Bounded
          - ReviewCenter-TotpChallengeStore-Bounded-Oldest

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeEnded
        title: >-
          The Core subsystem shall drop the ended challenges before a live one when the store is full, both when a new
          challenge is issued and when a challenge is given back.
        justification: |
          A person who is in the middle of a sign-in must not lose the challenge to one that has ended.
        children:
          - ReviewCenter-TotpChallengeStore-Bounded-Ended
          - ReviewCenter-TotpChallengeStore-Bounded-ReturnEnded

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeReturnFull
        title: >-
          The Core subsystem shall drop a challenge that is given back to a full store that holds no ended challenge,
          and no other challenge.
        justification: |
          A full store must stay at its limit even when the last free place is taken by a challenge that comes back.
        children:
          - ReviewCenter-TotpChallengeStore-Bounded-ReturnFull

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeInvalidationBound
        title: >-
          The Core subsystem shall forget the invalidation of a user once the lifetime of a challenge has passed, and
          remember the invalidations of fewer than 10000 users at a time.
        justification: |
          The record of invalidations must not grow without bound, and it is only needed while a challenge can live.
        children:
          - ReviewCenter-TotpChallengeStore-Bounded-InvalidationAge
          - ReviewCenter-TotpChallengeStore-Bounded-InvalidationCount

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeInvalidate
        title: >-
          The Core subsystem shall drop every challenge of one user on request, match the user name without regard to
          case, and leave the challenges of other users.
        justification: |
          A reset or a removal has to end the pending sign-ins of exactly the user it concerns.
        children:
          - ReviewCenter-TotpChallengeStore-Invalidate
          - ReviewCenter-TotpChallengeStore-Invalidate-CaseInsensitive
          - ReviewCenter-TotpChallengeStore-Invalidate-OtherUsers

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeTakenBefore
        title: >-
          The Core subsystem shall refuse to take back a challenge that was taken before its user was invalidated,
          however long the check took.
        justification: |
          A sign-in that was being checked while the second factor was removed must not finish afterwards.
        children:
          - ReviewCenter-TotpChallengeStore-Invalidate-TakenBefore

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeTakenAfter
        title: >-
          The Core subsystem shall take back a challenge that was taken after the invalidation of its user, and a
          challenge of a user other than the user that was invalidated.
        justification: |
          An invalidation must stop only the sign-ins it was meant for.
        children:
          - ReviewCenter-TotpChallengeStore-Invalidate-TakenAfter
          - ReviewCenter-TotpChallengeStore-Invalidate-OtherUserReturn

      - id: ReviewCenter-Core-TotpSecondFactor-ChallengeArguments
        title: >-
          The Core subsystem shall refuse a missing user name, return URL, or challenge, and refuse to keep challenges
          without a clock.
        justification: |
          A call that is wrong or a store that cannot judge the lifetime must fail at once.
        children:
          - ReviewCenter-TotpChallengeStore-Invalidate-Arguments
          - ReviewCenter-TotpChallengeStore-Invalidate-Clock

      - id: ReviewCenter-Core-TotpSecondFactor-SecondFactorRequired
        title: >-
          The Core subsystem shall report that the code is still required when the password of an account with a second
          factor is right.
        justification: |
          The sign-in is only half done after the password, and the caller must be told what is still missing.
        children:
          - ReviewCenter-UserService-SecondFactorRequired

      - id: ReviewCenter-Core-TotpSecondFactor-SecondFactorKeepsCounter
        title: >-
          The Core subsystem shall leave the count of failures as it is when the password of an account with a second
          factor is right.
        justification: |
          A right password is not yet a finished sign-in, so it must neither clear nor raise the counter.
        children:
          - ReviewCenter-UserService-SecondFactorRequired-KeepsCounter

      - id: ReviewCenter-Core-TotpSecondFactor-SecondFactorDisabled
        title: >-
          The Core subsystem shall refuse a disabled account that has a second factor.
        justification: |
          A disabled account must not get as far as the second step.
        children:
          - ReviewCenter-UserService-SecondFactorRequired-DisabledRefused

      - id: ReviewCenter-Core-TotpSecondFactor-SecondFactorFailsClosed
        title: >-
          The Core subsystem shall refuse the sign-in check and the re-authentication by password alone for an account
          with a second factor.
        justification: |
          A path that checks only the password must not become a way around the second factor.
        children:
          - ReviewCenter-UserService-SecondFactorRequired-SignInFailsClosed
          - ReviewCenter-UserService-SecondFactorRequired-ReauthFailsClosed

      - id: ReviewCenter-Core-TotpSecondFactor-SecondFactorNotRequired
        title: >-
          The Core subsystem shall sign in with the password alone an account that has no active second factor, or when
          the feature is switched off, or when there is no store of second factors.
        justification: |
          The code is only asked for where there is a second factor to ask about.
        children:
          - ReviewCenter-UserService-SecondFactorRequired-NotRequired

      - id: ReviewCenter-Core-TotpSecondFactor-SecondFactorWrongPassword
        title: >-
          The Core subsystem shall answer a wrong password the same for an account with a second factor and for one
          without.
        justification: |
          The answer must not tell a guesser which accounts have a second factor.
        children:
          - ReviewCenter-UserService-SecondFactorRequired-WrongPassword

      - id: ReviewCenter-Core-TotpSecondFactor-SharedLockout
        title: >-
          The Core subsystem shall count a wrong code together with the wrong passwords in one counter that leads to one
          lockout.
        justification: |
          One counter and one lockout keep the number of tries the same whatever mix of passwords and codes is used.
        children:
          - ReviewCenter-UserService-SecondFactorLockout

      - id: ReviewCenter-Core-TotpSecondFactor-SharedLockoutIsLocked
        title: >-
          The Core subsystem shall tell the second factor whether an account is locked out.
        justification: |
          The check of a code must stop while the account is locked out.
        children:
          - ReviewCenter-UserService-SecondFactorLockout-IsLocked

      - id: ReviewCenter-Core-TotpSecondFactor-SharedLockoutConfirmLocked
        title: >-
          The Core subsystem shall refuse to confirm the password of a locked account.
        justification: |
          A lockout that a right password could end would not stop guessing.
        children:
          - ReviewCenter-UserService-SecondFactorLockout-ConfirmLocked

      - id: ReviewCenter-Core-TotpSecondFactor-SharedLockoutConfirmPassword
        title: >-
          The Core subsystem shall confirm the password of an account that has a second factor by the password alone,
          leaving the count of failures as it is.
        justification: |
          The check of the password that comes before a code must not change the counter that the code check uses.
        children:
          - ReviewCenter-UserService-SecondFactorLockout-ConfirmPassword

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureCode
        title: >-
          The Core subsystem shall require, for a signer with a second factor, a fresh code of the authenticator app in
          addition to the password.
        justification: |
          A signature is the act the review tool exists for, so it needs the strongest proof of the person.
        children:
          - ReviewCenter-SigningService-TotpReauth
        tests:
          - SigningService_SignAsync_EnrolledUserWithPasswordAndFreshCode_Signs

      - id: ReviewCenter-Core-TotpSecondFactor-SignaturePasswordFirst
        title: >-
          The Core subsystem shall leave the code of a signer with a second factor unused when the password is wrong.
        justification: |
          A guesser of the password must not be able to use up the codes of the user.
        children:
          - ReviewCenter-SigningService-TotpReauth-PasswordFirst

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureRecoveryRefused
        title: >-
          The Core subsystem shall refuse a recovery code as the code of a signature, with the same message as a wrong
          password.
        justification: |
          A recovery code is the way into an account, and it must not stand for a fresh proof at a signature.
        children:
          - ReviewCenter-SigningService-TotpReauth-RecoveryRefused

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureReplayRefused
        title: >-
          The Core subsystem shall refuse a code that was already used in the current step as the code of a signature,
          with the same message as a wrong password.
        justification: |
          A code that was seen once must not sign a review.
        children:
          - ReviewCenter-SigningService-TotpReauth-ReplayRefused

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureApiToken
        title: >-
          The Core subsystem shall refuse an actor that came through an API token at a signature with the actor not
          allowed rule, and keep the code unused.
        justification: |
          A script must not sign, and its refusal must not spend the code of the owner.
        children:
          - ReviewCenter-SigningService-TotpReauth-ApiToken
          - ReviewCenter-SigningService-TotpReauth-ApiTokenKeepsCode

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureLockoutCount
        title: >-
          The Core subsystem shall count wrong codes of a signature toward the lockout of the account.
        justification: |
          A signature is one more place where codes can be guessed.
        children:
          - ReviewCenter-SigningService-TotpReauth-LockoutCount

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureLockoutAudit
        title: >-
          The Core subsystem shall record a wrong code of a signature in the audit trail.
        justification: |
          A series of wrong codes at a signature can be an attack, and it has to leave a trace.
        children:
          - ReviewCenter-SigningService-TotpReauth-LockoutAudit

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureFailClosed
        title: >-
          The Core subsystem shall refuse the signature of a signer with a second factor when the second factor cannot
          be checked.
        justification: |
          A signature must never go through only because the check could not be made.
        children:
          - ReviewCenter-SigningService-TotpReauth-FailClosed

      - id: ReviewCenter-Core-TotpSecondFactor-SignatureNoCode
        title: >-
          The Core subsystem shall need no code for the signature of a user without a second factor, of a user of a
          provider, or of a user whose second factor an administrator has reset.
        justification: |
          The code is only asked for where there is a second factor to ask about.
        children:
          - ReviewCenter-SigningService-TotpReauth-NoSecondFactor
          - ReviewCenter-SigningService-TotpReauth-ProviderUser
          - ReviewCenter-SigningService-TotpReauth-AfterReset

      - id: ReviewCenter-Core-NotificationAddress
        title: >-
          The Core subsystem shall accept a text as the e-mail address for notifications only when the text is exactly
          one syntactically valid address.
        justification: |
          The address is typed by a person and ends up in the header of a mail that the server sends. A list, a
          display name, or a line break could aim the mail at someone else or add a header, so only one plain address
          may pass, in one normal form.
        children:
          - ReviewCenter-NotificationAddress-Accept
          - ReviewCenter-NotificationAddress-AcceptPlusTag
          - ReviewCenter-NotificationAddress-LowerCase
          - ReviewCenter-NotificationAddress-TrimWhiteSpace
          - ReviewCenter-NotificationAddress-RefuseNoAtSign
          - ReviewCenter-NotificationAddress-RefuseTwoAtSigns
          - ReviewCenter-NotificationAddress-RefuseList
          - ReviewCenter-NotificationAddress-RefuseDisplayName
          - ReviewCenter-NotificationAddress-RefuseComment
          - ReviewCenter-NotificationAddress-RefuseQuotedLocalPart
          - ReviewCenter-NotificationAddress-RefuseIpLiteral
          - ReviewCenter-NotificationAddress-RefuseLineBreak
          - ReviewCenter-NotificationAddress-RefuseControlCharacter
          - ReviewCenter-NotificationAddress-RefuseNonAscii
          - ReviewCenter-NotificationAddress-RefuseDomainWithoutDot
          - ReviewCenter-NotificationAddress-RefuseLeadingDot
          - ReviewCenter-NotificationAddress-RefuseTrailingDot
          - ReviewCenter-NotificationAddress-RefuseDoubleDot
          - ReviewCenter-NotificationAddress-RefuseEmptyLabel
          - ReviewCenter-NotificationAddress-RefuseHyphenAtLabelStart
          - ReviewCenter-NotificationAddress-RefuseHyphenAtLabelEnd
          - ReviewCenter-NotificationAddress-RefuseEmptyLocalPart
          - ReviewCenter-NotificationAddress-RefuseEmptyDomain
          - ReviewCenter-NotificationAddress-RefuseEmpty
          - ReviewCenter-NotificationAddress-RefuseMissing
          - ReviewCenter-NotificationAddress-RefuseWhiteSpaceOnly
          - ReviewCenter-NotificationAddress-AcceptMaxLength
          - ReviewCenter-NotificationAddress-RefuseTooLong
          - ReviewCenter-NotificationAddress-AcceptLongestLocalPart
          - ReviewCenter-NotificationAddress-RefuseLongLocalPart
        tests:
          - NotificationAddress_TryNormalize_PlainAddress_Succeeds
          - NotificationAddress_TryNormalize_ControlCharacter_Fails

      - id: ReviewCenter-Core-NotificationConfirmation
        title: >-
          The Core subsystem shall confirm an e-mail address for notifications only when the user types back the code
          that was mailed to that address.
        justification: |
          Mail may go only to an address that its owner has shown to be theirs. The owner shows it by reading a code
          in a mail that was sent to the address, so a typing error or a stranger's address never receives
          notifications. The code is mailed once, kept only as a salted hash, never shown elsewhere, and the mail has no
          link.
        children:
          - ReviewCenter-NotificationPreferenceService-MailCode
          - ReviewCenter-NotificationPreferenceService-MailNormalizedAddress
          - ReviewCenter-NotificationPreferenceService-PendingUntilConfirmed
          - ReviewCenter-NotificationPreferenceService-ConfirmRightCode
          - ReviewCenter-NotificationPreferenceService-IgnoreSpacesInCode
          - ReviewCenter-NotificationPreferenceService-ConfirmedAddressShown
          - ReviewCenter-NotificationPreferenceService-PendingAddressShown
          - ReviewCenter-NotificationPreferenceService-WrongCodeRefused
          - ReviewCenter-NotificationPreferenceService-WrongCodeKeepsPending
          - ReviewCenter-NotificationPreferenceService-NothingPending
          - ReviewCenter-NotificationPreferenceService-CodeUsedOnce
          - ReviewCenter-NotificationPreferenceService-InvalidAddressRefused
          - ReviewCenter-NotificationPreferenceService-InvalidAddressSendsNothing
          - ReviewCenter-NotificationPreferenceService-NewCodeReplacesOld
          - ReviewCenter-NotificationPreferenceService-SendFailureReported
          - ReviewCenter-NotificationPreferenceService-SendFailureRollsBack
          - ReviewCenter-NotificationPreferenceService-ConfirmedAddressKept
          - ReviewCenter-NotificationPreferenceService-MailOnlyToConfirmed
          - ReviewCenter-NotificationPreferenceService-Remove
          - ReviewCenter-NotificationPreferenceService-RemoveReported
          - ReviewCenter-NotificationPreferenceService-CodeNotStored
          - ReviewCenter-NotificationPreferenceService-CanceledSendRollsBack
          - ReviewCenter-NotificationPreferenceService-MailCarriesLifetime
          - ReviewCenter-NotificationPreferenceService-MailCarriesName
          - ReviewCenter-NotificationPreferenceService-MailIgnoreHint
          - ReviewCenter-NotificationPreferenceService-MailNoLinkText
          - ReviewCenter-NotificationPreferenceService-MailNoLinkHtml
          - ReviewCenter-NotificationPreferenceService-HtmlEncodesName
        tests:
          - NotificationPreferenceService_Confirm_RightCode_ConfirmsAddress
          - NotificationPreferenceService_Confirm_WrongCode_ThrowsAndStaysPending

      - id: ReviewCenter-Core-NotificationLimits
        title: >-
          The Core subsystem shall refuse an e-mail confirmation step that goes beyond a limit that is set for the
          confirmation.
        justification: |
          A confirmation sends mail to an address chosen by a user, so it could be used to flood a mailbox or to use
          the mail server for bulk mail, and a six digit code could be guessed. The limits are the pause of 60 seconds
          between mails, three mails per user and three mails per address in a day, a limit per hour for the whole
          server, five wrong codes for each code, and a lifetime of 30 minutes for a code.
        children:
          - ReviewCenter-NotificationPreferenceService-ResendCooldown
          - ReviewCenter-NotificationPreferenceService-ResendAfterCooldown
          - ReviewCenter-NotificationPreferenceService-UserDailyLimit
          - ReviewCenter-NotificationPreferenceService-AddressDailyLimit
          - ReviewCenter-NotificationPreferenceService-ServerHourlyLimit
          - ReviewCenter-NotificationPreferenceService-LimitsRecover
          - ReviewCenter-NotificationPreferenceService-AttemptLimit
          - ReviewCenter-NotificationPreferenceService-CodeLifetime
          - ReviewCenter-NotificationPreferenceService-ExpiredReported
        tests:
          - NotificationPreferenceService_RequestConfirmation_UserDailyLimit_ThrowsLimitReached
          - NotificationPreferenceService_Confirm_AfterMaxWrongAttempts_RefusesTheRightCode

      - id: ReviewCenter-Core-NotificationAccess
        title: >-
          The Core subsystem shall refuse a notification address action that is not permitted for the acting account.
        justification: |
          The address decides where the server sends mail, so only the interactive session of an enabled user may
          change it. An actor that signed in with an API token, a disabled or unknown user, a user with a temporary
          password, and every request while the feature is off or no sender is configured are not permitted, and a
          refusal touches no data.
        children:
          - ReviewCenter-NotificationPreferenceService-RefuseApiToken
          - ReviewCenter-NotificationPreferenceService-RefuseFeatureOff
          - ReviewCenter-NotificationPreferenceService-FeatureOffTouchesNoStore
          - ReviewCenter-NotificationPreferenceService-UnavailableWithoutSender
          - ReviewCenter-NotificationPreferenceService-RefuseDisabledUser
          - ReviewCenter-NotificationPreferenceService-RefuseUnknownUser
          - ReviewCenter-NotificationPreferenceService-RefuseTemporaryPassword
          - ReviewCenter-NotificationPreferenceService-RefuseMissingActor
        tests:
          - NotificationPreferenceService_Actions_ApiTokenActor_AreRefused
          - NotificationPreferenceService_Actions_FeatureOff_AreRefusedAndTouchNoStore

      - id: ReviewCenter-Core-NotificationAudit
        title: >-
          The Core subsystem shall record each change of a notification address as an audit entry.
        justification: |
          A change of the place where mail goes belongs in the audit trail. The trail is kept for a long time and read
          by many people, so it must hold neither personal data nor a code that could still be used.
        children:
          - ReviewCenter-NotificationPreferenceService-AuditRequest
          - ReviewCenter-NotificationPreferenceService-AuditConfirm
          - ReviewCenter-NotificationPreferenceService-AuditRemove
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-Core-NotificationAuditNoAddress
        title: >-
          The Core subsystem shall keep the e-mail address of a user out of the audit entries.
        justification: |
          The audit trail is kept for a long time and read by many people, so it must hold no personal data.
        children:
          - ReviewCenter-NotificationPreferenceService-AuditNoAddress
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-Core-NotificationAuditNoCode
        title: >-
          The Core subsystem shall keep the confirmation code out of the audit entries.
        justification: |
          A code in the audit trail could still be used by a person who must not be able to confirm the address.
        children:
          - ReviewCenter-NotificationPreferenceService-AuditNoCode
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-Core-NotificationMessage
        title: >-
          The Core subsystem shall refuse a notification message that has a line break in a part that goes into the
          header of the mail.
        justification: |
          A line break in the subject or the recipient starts a new header line, with which a caller could add a
          recipient or change the mail. The check is made when the message is built, so that no sender can be handed
          such a message.
        children:
          - ReviewCenter-NotificationMessage-KeepParts
          - ReviewCenter-NotificationMessage-KeepTextBody
          - ReviewCenter-NotificationMessage-KeepHtmlBody
          - ReviewCenter-NotificationMessage-NormalizeRecipient
          - ReviewCenter-NotificationMessage-RefuseInvalidRecipient
          - ReviewCenter-NotificationMessage-HideInvalidRecipient
          - ReviewCenter-NotificationMessage-RefuseSubjectLineBreak
          - ReviewCenter-NotificationMessage-RefuseSubjectControlCharacter
          - ReviewCenter-NotificationMessage-HideInvalidSubject
          - ReviewCenter-NotificationMessage-RefuseEmptySubject
          - ReviewCenter-NotificationMessage-RefuseBlankSubject
          - ReviewCenter-NotificationMessage-RefuseLongSubject
          - ReviewCenter-NotificationMessage-RefuseBlankBody
          - ReviewCenter-NotificationMessage-RefuseEmptyBody
          - ReviewCenter-NotificationMessage-RefuseLongBody
          - ReviewCenter-NotificationMessage-RefuseNulInBody
          - ReviewCenter-NotificationMessage-AcceptBodyLineBreaks
          - ReviewCenter-NotificationMessage-NoSenderNotConfigured
          - ReviewCenter-NotificationMessage-NoSenderRefuses
        tests:
          - NotificationMessage_Constructor_ControlCharacterInSubject_ThrowsWithoutEchoingTheValue
          - NotificationMessage_Constructor_InvalidRecipient_ThrowsWithoutEchoingTheValue

      - id: ReviewCenter-Core-NotificationCandidates
        title: >-
          The Core subsystem shall derive a notification candidate from each inbox row that calls for an action of the
          user.
        justification: |
          A user is mailed only about the rows of the inbox that need the user. A notification candidate is the item of
          the inbox of a user in the form that the rules of the mails use: the project, the review, the section of the
          inbox, and a state without text.
        children:
          - ReviewCenter-NotificationComposer-ClassifyToAnswer
          - ReviewCenter-NotificationComposer-ClassifyQuestion
          - ReviewCenter-NotificationComposer-ClassifyDisputed
          - ReviewCenter-NotificationComposer-ClassifyToSign
          - ReviewCenter-NotificationComposer-ClassifySignAgain
          - ReviewCenter-NotificationComposer-ClassifySignatureLost
          - ReviewCenter-NotificationComposer-ClassifyReplies
          - ReviewCenter-NotificationComposer-ClassifyApprovedConcluded
          - ReviewCenter-NotificationComposer-ClassifyRejectedConcluded
          - ReviewCenter-NotificationComposer-ClassifyReopened
          - ReviewCenter-NotificationComposer-ClassifyRefuseFailedChecks
          - ReviewCenter-NotificationComposer-ClassifyRefuseWaitingForOthers
        tests:
          - CoreSubsystem_Dispatcher_MailsNewItemsOfOwnInboxOnce
          - NotificationComposer_Classify_NotStartedAndDraft_SameState

      - id: ReviewCenter-Core-NotificationNewness
        title: >-
          The Core subsystem shall tell whether a notification candidate is new for a user from the state that the user
          was told about.
        justification: |
          The same news must not be mailed twice, and a change that the user can not act on is no news.
        children:
          - ReviewCenter-NotificationComposer-NewWhenNothingStored
          - ReviewCenter-NotificationComposer-NewWhenStateDiffers
          - ReviewCenter-NotificationComposer-NotNewWhenStateSame
          - ReviewCenter-NotificationComposer-NewWhenRepliesRise
          - ReviewCenter-NotificationComposer-NotNewWhenRepliesFall
          - ReviewCenter-NotificationComposer-LoweredWhenRepliesFall
        tests:
          - NotificationComposer_IsNew_StoredAndCurrentState_FollowsRules

      - id: ReviewCenter-Core-NotificationComposition
        title: >-
          The Core subsystem shall keep the detail text of an inbox row out of a notification mail.
        justification: |
          A mail leaves the server and may be read by others, so it says that there is news and not what the news is.
        children:
          - ReviewCenter-NotificationComposer-SubjectNoItemText
          - ReviewCenter-NotificationComposer-NeverUseDetail
          - ReviewCenter-NotificationDispatcher-NoDetailInMail
          - ReviewCenter-NotificationDispatcher-ExcludeFailedChecks
          - ReviewCenter-NotificationDispatcher-ExcludeWaitingForOthers
        tests:
          - NotificationComposer_Compose_DetailSentinel_NotInTextOrHtml
          - NotificationDispatcher_RunPass_DetailText_NotInMail

      - id: ReviewCenter-Core-NotificationComposition-NoOutcome
        title: >-
          The Core subsystem shall keep the outcome of a review out of a notification mail.
        justification: |
          A mail leaves the server and may be read by others, so a conclusion is told without its outcome.
        children:
          - ReviewCenter-NotificationComposer-NeverShowOutcome
          - ReviewCenter-NotificationComposer-ConcludedWording
          - ReviewCenter-NotificationComposer-ReopenedWording
          - ReviewCenter-NotificationComposer-DisputedNoCount
          - ReviewCenter-NotificationDispatcher-NoOutcomeInMail
          - ReviewCenter-NotificationDispatcher-NoOutcomeInMailRejected
        tests:
          - NotificationComposer_Compose_Updates_NoOutcomeWord
          - NotificationDispatcher_RunPass_Concluded_MailHasNoOutcome
          - NotificationDispatcher_RunPass_Rejected_MailHasNoOutcomeOrConclusionText

      - id: ReviewCenter-Core-NotificationMailContent
        title: >-
          The Core subsystem shall name in a notification mail the project and the review of each new item.
        justification: |
          The reader must see where the news is, and the operator decides whether titles are part of it.
        children:
          - ReviewCenter-NotificationComposer-SubjectEveryFixed
          - ReviewCenter-NotificationComposer-SubjectDailyFixed
          - ReviewCenter-NotificationComposer-RepliesShowCount
          - ReviewCenter-NotificationComposer-ShowProjectName
          - ReviewCenter-NotificationComposer-ShowTitle
          - ReviewCenter-NotificationComposer-OmitTitle
          - ReviewCenter-NotificationComposer-ShowReviewId
        tests:
          - NotificationComposer_Compose_IncludeTitlesTrue_ShowsTitle
          - NotificationComposer_Compose_IncludeTitlesFalse_OmitsTitle

      - id: ReviewCenter-Core-NotificationMailLinks
        title: >-
          The Core subsystem shall link each new item of a notification mail to the page of its review.
        justification: |
          The reader must reach the news in one step, and a link must open nothing without the sign-in of the reader.
        children:
          - ReviewCenter-NotificationComposer-LinkPath
          - ReviewCenter-NotificationComposer-LinkBaseUrl
          - ReviewCenter-NotificationComposer-LinkTrailingSlash
          - ReviewCenter-NotificationComposer-LinkEscapeReviewId
          - ReviewCenter-NotificationComposer-LinkNoToken
        tests:
          - NotificationComposer_Compose_Item_LinkMatchesReviewLinks
          - NotificationComposer_Compose_Item_LinkHasNoQuery

      - id: ReviewCenter-Core-NotificationMailLayout
        title: >-
          The Core subsystem shall list at most 50 items in a notification mail.
        justification: |
          A mail that is long would not be read, and the size of a mail is limited.
        children:
          - ReviewCenter-NotificationComposer-ItemLimit
          - ReviewCenter-NotificationComposer-ItemLimit-More
          - ReviewCenter-NotificationComposer-BodyWithinMessageLimits
        tests:
          - NotificationComposer_Compose_60Items_50ListedAndMore

      - id: ReviewCenter-Core-NotificationMailLayout-Order
        title: >-
          The Core subsystem shall list the items of a notification mail in the order of the sections of the inbox.
        justification: |
          The reader sees the most urgent kind of news first, as on the page of the inbox.
        children:
          - ReviewCenter-NotificationComposer-GroupBySection
        tests:
          - NotificationComposer_Compose_MixedSections_GroupedInOrder

      - id: ReviewCenter-Core-NotificationMailLayout-Daily
        title: >-
          The Core subsystem shall put the new items before the count of the outstanding items in a daily summary.
        justification: |
          The news is the reason for the mail, so it comes first, and the outstanding items need no second listing.
        children:
          - ReviewCenter-NotificationComposer-DigestNewFirst
          - ReviewCenter-NotificationComposer-DigestOutstandingCountOnly
        tests:
          - NotificationComposer_Compose_Daily_NewItemsThenOutstanding

      - id: ReviewCenter-Core-NotificationMailLayout-Every
        title: >-
          The Core subsystem shall leave the line about outstanding items out of a mail about new items.
        justification: |
          Only the daily summary reports on what still waits.
        children:
          - ReviewCenter-NotificationComposer-EveryNoOutstanding
        tests:
          - NotificationComposer_Compose_Every_NoOutstandingLine

      - id: ReviewCenter-Core-NotificationMailLayout-StopLink
        title: >-
          The Core subsystem shall lay out a notification mail so that it says how to stop the mails.
        justification: |
          A mail that is hard to stop would be marked as spam.
        children:
          - ReviewCenter-NotificationComposer-FooterAccountLink
          - ReviewCenter-NotificationComposer-FooterAccountLink-Reason
        tests:
          - NotificationComposer_Compose_Footer_LinksToAccount

      - id: ReviewCenter-Core-NotificationMailSafety
        title: >-
          The Core subsystem shall keep the text of a user from changing the structure of a notification mail.
        justification: |
          A title or a name that holds a line break or markup could otherwise forge header lines, lines of the text, or
          elements of the page of the mail.
        children:
          - ReviewCenter-NotificationComposer-SubjectInstanceNameSingleLine
          - ReviewCenter-NotificationComposer-TextSingleLineValues
          - ReviewCenter-NotificationComposer-HtmlEncodeText
          - ReviewCenter-NotificationComposer-HtmlEncodeLink
          - ReviewCenter-NotificationDispatcher-HeaderInjectionSafe
          - ReviewCenter-NotificationDispatcher-HeaderInjectionSafe-ProjectName
          - ReviewCenter-NotificationDispatcher-HeaderInjectionSafe-DisplayName
        tests:
          - NotificationComposer_Compose_TitleWithMarkup_HtmlEncoded
          - NotificationDispatcher_RunPass_TitleWithCrLfBcc_SubjectFixedAndAddressUnchanged
          - NotificationDispatcher_RunPass_ProjectNameWithCrLfBcc_SubjectFixedAndAddressUnchanged
          - NotificationDispatcher_RunPass_DisplayNameWithCrLfBcc_SubjectFixedAndAddressUnchanged

      - id: ReviewCenter-Core-NotificationComposerInput
        title: >-
          When the notification composer is asked to compose a mail without an item, the Core subsystem shall refuse
          it with an argument error.
        justification: |
          A mail without an item is a mistake of the caller that must show at once.
        children:
          - ReviewCenter-NotificationComposer-RefuseNoItems
        tests:
          - NotificationComposer_Compose_NoItems_ThrowsArgument

      - id: ReviewCenter-Core-NotificationComposerInput-NullRow
        title: >-
          When the notification composer is asked to classify a missing inbox row, the Core subsystem shall refuse it
          with an argument error.
        justification: |
          A call without a row is a mistake of the caller that must show at once.
        children:
          - ReviewCenter-NotificationComposer-ClassifyRefuseNullRow
        tests:
          - NotificationComposer_Classify_NullRow_ThrowsArgumentNull

      - id: ReviewCenter-Core-NotificationComposerInput-EmptyBaseUrl
        title: >-
          When the notification composer is given an empty base address, the Core subsystem shall refuse it with an
          argument error.
        justification: |
          Without a base address no link of a mail can be absolute.
        children:
          - ReviewCenter-NotificationComposer-RefuseEmptyBaseUrl
        tests:
          - NotificationComposer_Constructor_EmptyBaseUrl_Throws

      - id: ReviewCenter-Core-NotificationScheduling
        title: >-
          The Core subsystem shall make the daily summary due from the digest hour of the configured time zone on.
        justification: |
          The reader of a daily summary expects it at a known hour, also on the days on which the clock changes and
          after a downtime of the server.
        children:
          - ReviewCenter-DigestSchedule-NotDueBeforeHour
          - ReviewCenter-DigestSchedule-DueAtHour
          - ReviewCenter-DigestSchedule-DueAfterHour
          - ReviewCenter-DigestSchedule-CatchUp
          - ReviewCenter-DigestSchedule-HourZero
          - ReviewCenter-DigestSchedule-HourZero-DueAfterMidnight
          - ReviewCenter-DigestSchedule-SpringForwardGap
        tests:
          - DigestSchedule_IsDue_AtHour_True

      - id: ReviewCenter-Core-NotificationScheduling-OncePerDate
        title: >-
          The Core subsystem shall make the daily summary due once for each local date.
        justification: |
          The reader of a daily summary expects one mail a day, also on the day on which the clock repeats an hour.
        children:
          - ReviewCenter-DigestSchedule-NotDueWhenHandledToday
          - ReviewCenter-DigestSchedule-DueWhenHandledYesterday
          - ReviewCenter-DigestSchedule-DueWhenNeverHandled
          - ReviewCenter-DigestSchedule-UseLocalDate
          - ReviewCenter-DigestSchedule-FallBackRepeatedHour
          - ReviewCenter-DigestSchedule-LocalDate
        tests:
          - CoreSubsystem_DailyDigest_OnePerLocalDate

      - id: ReviewCenter-Core-NotificationSchedulingInput
        title: >-
          When the digest schedule is given a digest hour outside the range 0 to 23, the Core subsystem shall refuse it
          with an argument error.
        justification: |
          A schedule that can never be due would silently stop all daily summaries.
        children:
          - ReviewCenter-DigestSchedule-RefuseInvalidHour
        tests:
          - DigestSchedule_Constructor_Hour24_Throws

      - id: ReviewCenter-Core-NotificationSchedulingInput-NullZone
        title: >-
          When the digest schedule is given no time zone, the Core subsystem shall refuse it with an argument error.
        justification: |
          A schedule without a zone can not tell the local date.
        children:
          - ReviewCenter-DigestSchedule-RefuseNullZone
        tests:
          - DigestSchedule_Constructor_NullZone_Throws

      - id: ReviewCenter-Core-NotificationDispatch
        title: >-
          The Core subsystem shall mail the new items of the inbox of a user to the confirmed address of that user,
          once, when the user chose a notification mode.
        justification: |
          This is the purpose of the notifications: the user learns about the work that waits, without a look at the
          pages of the server.
        children:
          - ReviewCenter-NotificationDispatcher-SkipModeNone
          - ReviewCenter-NotificationDispatcher-SkipNoAddress
          - ReviewCenter-NotificationDispatcher-SkipDisabledUser
          - ReviewCenter-NotificationDispatcher-SkipMustChangePassword
          - ReviewCenter-NotificationDispatcher-MailToConfirmedAddress
        tests:
          - CoreSubsystem_Dispatcher_MailsNewItemsOfOwnInboxOnce

      - id: ReviewCenter-Core-NotificationOwnInbox
        title: >-
          The Core subsystem shall base a notification mail on what the recipient may see in the own inbox.
        justification: |
          A mail must not tell more than the page of the inbox tells to the same person, so the answers of others stay
          hidden until the own ballot is handed in.
        children:
          - ReviewCenter-NotificationDispatcher-OwnInboxOnly
          - ReviewCenter-NotificationDispatcher-OwnIdentity
          - ReviewCenter-NotificationDispatcher-NoApiTokenActor
          - ReviewCenter-NotificationDispatcher-NoAuditEntries
          - ReviewCenter-NotificationDispatcher-HiddenBallotMasked
        tests:
          - CoreSubsystem_Dispatcher_MailsNewItemsOfOwnInboxOnce
          - NotificationDispatcher_RunPass_HiddenBallotRecipient_NoDisputedItem

      - id: ReviewCenter-Core-NotificationBaseline
        title: >-
          When a user switches a notification mode on, the Core subsystem shall send no mail for the items that exist
          at that time.
        justification: |
          A user who switches notifications on must not get a mail for the whole backlog.
        children:
          - ReviewCenter-NotificationDispatcher-BaselineNoSend
          - ReviewCenter-NotificationDispatcher-BaselineNoSend-RecordsItems
          - ReviewCenter-NotificationDispatcher-BaselineClearsPending
          - ReviewCenter-NotificationDispatcher-BaselineNoLogRow
          - ReviewCenter-NotificationDispatcher-BaselineStartsDigestDay
          - ReviewCenter-NotificationDispatcher-BaselineThenNewMails
          - ReviewCenter-NotificationDispatcher-BaselineBypassesIdleSkip
          - ReviewCenter-NotificationDispatcher-BaselineKeptBetweenModes
        tests:
          - NotificationDispatcher_RunPass_BaselinePending_RecordsBacklogNoMail
          - NotificationDispatcher_RunPass_AfterBaseline_NewItemMailed
          - NotificationDispatcher_RunPass_ModeSwitchedBeforeBaseline_BacklogNotMailed

      - id: ReviewCenter-Core-NotificationBatching
        title: >-
          While the mode of a user is Every, the Core subsystem shall tell the new items of a batch window in one mail
          at the end of the window.
        justification: |
          One mail for the changes of a few minutes is easier to read than a mail for each change.
        children:
          - ReviewCenter-NotificationDispatcher-EveryStartsWindow
          - ReviewCenter-NotificationDispatcher-EveryNoSendInWindow
          - ReviewCenter-NotificationDispatcher-EverySendsAfterWindow
          - ReviewCenter-NotificationDispatcher-EveryOneMessage
          - ReviewCenter-NotificationDispatcher-EveryIncludesLateItem
          - ReviewCenter-NotificationDispatcher-EveryDropsHandledItem
          - ReviewCenter-NotificationDispatcher-EveryNothingNewNoMail
          - ReviewCenter-NotificationDispatcher-EveryNothingNewClearsWindow
          - ReviewCenter-NotificationDispatcher-EveryWindowSurvivesRestart
          - ReviewCenter-NotificationDispatcher-EveryConfiguredWindow
          - ReviewCenter-NotificationDispatcher-EverySuccessClearsWindow
        tests:
          - NotificationDispatcher_RunPass_Every_ThreeItems_OneMessage
          - NotificationDispatcher_RunPass_Every_AfterWindow_Sends

      - id: ReviewCenter-Core-NotificationDailySummary
        title: >-
          While the mode of a user is Daily, the Core subsystem shall send one summary of the new items for each local
          date.
        justification: |
          A user who chose the daily summary expects the news of a day in a single mail at the digest hour.
        children:
          - ReviewCenter-NotificationDispatcher-DailyNoSendBeforeHour
          - ReviewCenter-NotificationDispatcher-DailySendsAtHour
          - ReviewCenter-NotificationDispatcher-DailyNothingNewNoMail
          - ReviewCenter-NotificationDispatcher-DailyNothingNewConsumesSlot
          - ReviewCenter-NotificationDispatcher-DailyOnePerDate
          - ReviewCenter-NotificationDispatcher-DailyLateItemWaits
          - ReviewCenter-NotificationDispatcher-DailyCatchUp
          - ReviewCenter-NotificationDispatcher-DailyConfiguredZone
          - ReviewCenter-NotificationDispatcher-DailyDst
          - ReviewCenter-NotificationDispatcher-DailyOutstandingCounted
          - ReviewCenter-NotificationDispatcher-DailyOutstandingCounted-GaveUp
          - ReviewCenter-NotificationDispatcher-DailySwitchFromEvery
          - ReviewCenter-NotificationDispatcher-DailyFirstAfterEnable
        tests:
          - CoreSubsystem_DailyDigest_OnePerLocalDate
          - NotificationDispatcher_RunPass_Daily_AtHour_Sends

      - id: ReviewCenter-Core-NotificationDedupe
        title: >-
          The Core subsystem shall send no second mail for an item that did not change in a way that the user can act
          on.
        justification: |
          The same news must not be mailed twice, and the record of what was told must neither grow without bound nor
          lose news.
        children:
          - ReviewCenter-NotificationDispatcher-DedupeSameState
          - ReviewCenter-NotificationDispatcher-DedupeChangedState
          - ReviewCenter-NotificationDispatcher-DedupeToAnswerDraft
          - ReviewCenter-NotificationDispatcher-DedupeRepliesRise
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall-Stored
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall-ThenRise
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall-ToZero
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall-NoRewrite
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall-KeepsGaveUp
          - ReviewCenter-NotificationDispatcher-DedupeRepliesFall-WithMail
          - ReviewCenter-NotificationDispatcher-DedupeReappear
          - ReviewCenter-NotificationDispatcher-DedupePruneStale
          - ReviewCenter-NotificationDispatcher-DedupeConcludedThenReopened
          - ReviewCenter-NotificationDispatcher-DedupeRecordAfterSend
          - ReviewCenter-NotificationDispatcher-DedupeNotRecordedOnFailure
          - ReviewCenter-NotificationDispatcher-DedupeUnseenOnly
          - ReviewCenter-NotificationDispatcher-DedupeQuestionAfterToAnswer
          - ReviewCenter-NotificationDispatcher-DedupeQuestionNotRepeated
          - ReviewCenter-NotificationComposer-KindInKey
          - ReviewCenter-NotificationComposer-KindOfStripsCount
          - ReviewCenter-NotificationComposer-KindOfPlainState
        tests:
          - CoreSubsystem_Dispatcher_MailsNewItemsOfOwnInboxOnce
          - NotificationDispatcher_RunPass_SameItemSameState_NotMailedTwice

      - id: ReviewCenter-Core-NotificationCurrentAddress
        title: >-
          The Core subsystem shall mail a user only at the confirmed address that the user has at the time of the
          send.
        justification: |
          A user who replaced the address must not see the news go to the old address, and the result of a mail that
          went nowhere must not hide the news.
        children:
          - ReviewCenter-NotificationDispatcher-StaleAddressNoSend
          - ReviewCenter-NotificationDispatcher-StaleAddressNextPass
          - ReviewCenter-NotificationDispatcher-StaleAddressNothingRecorded
        tests:
          - NotificationDispatcher_RunPass_AddressReplacedBeforeSend_NothingSent
          - NotificationDispatcher_RunPass_AddressReplacedDuringSend_NothingRecorded

      - id: ReviewCenter-Core-NotificationCurrentMode
        title: >-
          The Core subsystem shall discard a notification that was prepared before the user changed the notification
          mode.
        justification: |
          A user who switched the mail off, or off and on again, chose a new start, and the result of a send that began
          before it must not decide what is news. Discarding means that nothing is sent when the mail is off before
          the send, and that no item is recorded when the mode flipped during the send.
        children:
          - ReviewCenter-NotificationDispatcher-StaleModeOffNoSend
          - ReviewCenter-NotificationDispatcher-StaleModeFlipNothingRecorded
        tests:
          - NotificationDispatcher_RunPass_ModeSwitchedOffBeforeSend_NothingSent
          - NotificationDispatcher_RunPass_ModeFlippedDuringSend_NothingRecorded

      - id: ReviewCenter-Core-NotificationRetry
        title: >-
          When the send of a notification mail fails, the Core subsystem shall try again after 5 minutes, 15 minutes,
          1 hour, 4 hours, and 12 hours following the first to the fifth failed send.
        justification: |
          A short outage of the mail server must not lose mail, and the waits grow so that a dead mail server is not
          hammered.
        children:
          - ReviewCenter-NotificationDispatcher-RetryStoresFailure
          - ReviewCenter-NotificationDispatcher-RetryStoresFailure-NextAttempt
          - ReviewCenter-NotificationDispatcher-RetryFirstFiveMinutes
          - ReviewCenter-NotificationDispatcher-RetrySecondFifteenMinutes
          - ReviewCenter-NotificationDispatcher-RetryThirdOneHour
          - ReviewCenter-NotificationDispatcher-RetryFourthFourHours
          - ReviewCenter-NotificationDispatcher-RetryFifthTwelveHours
          - ReviewCenter-NotificationDispatcher-RetryNoSendBeforeDue
          - ReviewCenter-NotificationDispatcher-IdleRetryWaitKept
          - ReviewCenter-NotificationDispatcher-RetryRecomputes
          - ReviewCenter-NotificationDispatcher-RetrySuccessResets
          - ReviewCenter-NotificationDispatcher-RetryFailureKeepsOthers
        tests:
          - NotificationDispatcher_RunPass_Failure1_Waits5Min
          - NotificationDispatcher_RunPass_Failure2_Waits15Min
          - NotificationDispatcher_RunPass_Failure3_Waits1Hour
          - NotificationDispatcher_RunPass_Failure4_Waits4Hours
          - NotificationDispatcher_RunPass_Failure5_Waits12Hours

      - id: ReviewCenter-Core-NotificationRetry-GiveUp
        title: >-
          When the send of a notification mail failed six times, the Core subsystem shall give up.
        justification: |
          A dead address must not be tried for ever.
        children:
          - ReviewCenter-NotificationDispatcher-RetryGiveUp
          - ReviewCenter-NotificationDispatcher-RetryGiveUpRecordsItems
          - ReviewCenter-NotificationDispatcher-RetryGiveUpSameStateNotMailed
          - ReviewCenter-NotificationDispatcher-RetryGiveUpNewStateMailed
          - ReviewCenter-NotificationDispatcher-RetryGiveUpNewStateDelivered
        tests:
          - NotificationDispatcher_RunPass_Failure6_GivesUp

      - id: ReviewCenter-Core-NotificationMailLimits
        title: >-
          The Core subsystem shall defer a notification mail that would exceed a limit on the number of mails.
        justification: |
          The server must not become a source of bulk mail, and a single mailbox must not be flooded. A deferral delays
          the news and does not lose it.
        children:
          - ReviewCenter-NotificationDispatcher-CapGlobal
          - ReviewCenter-NotificationDispatcher-CapGlobalCountsAllKinds
          - ReviewCenter-NotificationDispatcher-CapUser
          - ReviewCenter-NotificationDispatcher-CapKeepsItemsNew
          - ReviewCenter-NotificationDispatcher-CapDeferNoFailure
        tests:
          - NotificationDispatcher_RunPass_GlobalCapReached_Deferred
          - NotificationDispatcher_RunPass_UserCapReached_Deferred

      - id: ReviewCenter-Core-NotificationMailLimits-Reservation
        title: >-
          The Core subsystem shall reserve a notification mail under the limits on the number of mails before it sends
          the mail.
        justification: |
          The limits are counted in the shared database, so a reservation that exists during the send keeps concurrent
          senders inside the one host, such as the dispatcher and a confirmation request, from passing the same count.
          A mail that was sent stays counted,
          and a mail that was not sent is released.
        children:
          - ReviewCenter-NotificationDispatcher-CapReserveBeforeSend
          - ReviewCenter-NotificationDispatcher-CapReservationRefusedNoSend
          - ReviewCenter-NotificationDispatcher-CapReleaseOnFailure
          - ReviewCenter-NotificationDispatcher-CapReleaseOnCancellation
          - ReviewCenter-NotificationDispatcher-CapKeepsRowWhenStale
        tests:
          - NotificationDispatcher_RunPass_SendInProgress_ReservationExists
          - NotificationDispatcher_RunPass_ReservationRefused_NothingChanges

      - id: ReviewCenter-Core-NotificationSendLog
        title: >-
          When a notification mail is sent, the Core subsystem shall record the kind of the mail in the send log.
        justification: |
          The limits on mails count the rows of the send log, so every mail that is sent must have a row.
        children:
          - ReviewCenter-NotificationDispatcher-LogUpdateKind
          - ReviewCenter-NotificationDispatcher-LogDigestKind
        tests:
          - NotificationDispatcher_RunPass_EverySent_LogKindUpdate
          - NotificationDispatcher_RunPass_DailySent_LogKindDigest

      - id: ReviewCenter-Core-NotificationIdleCost
        title: >-
          When a notification pass finds the audit trail unchanged since the previous pass and no sweep is due, the Core
          subsystem shall read no inbox.
        justification: |
          Most passes find nothing to do, so they must cost one cheap query and not a reading of the inbox of every
          user.
        children:
          - ReviewCenter-NotificationDispatcher-IdleNoRecipientsNoRead
          - ReviewCenter-NotificationDispatcher-IdleSkipUnchanged
        tests:
          - NotificationDispatcher_RunPass_SequenceUnchanged_NoInboxRead

      - id: ReviewCenter-Core-NotificationIdleCost-FirstPass
        title: >-
          In its first pass, the Core subsystem shall read the inbox of each recipient.
        justification: |
          Without a remembered audit position the pass can not tell what changed.
        children:
          - ReviewCenter-NotificationDispatcher-IdleFirstPassFull
        tests:
          - NotificationDispatcher_RunPass_First_ReadsInbox

      - id: ReviewCenter-Core-NotificationIdleCost-OnChange
        title: >-
          When the audit trail has a new entry, the Core subsystem shall read the inbox of each recipient.
        justification: |
          A new entry can be the news that a user waits for, and a pass that failed must not hide news.
        children:
          - ReviewCenter-NotificationDispatcher-IdleReadOnChange
          - ReviewCenter-NotificationDispatcher-IdleSequenceKeptOnError
        tests:
          - NotificationDispatcher_RunPass_SequenceChanged_ReadsInbox
          - NotificationDispatcher_RunPass_PassFails_NextPassReads

      - id: ReviewCenter-Core-NotificationIdleCost-AfterFailure
        title: >-
          When a notification pass failed for a user, the Core subsystem shall read the inbox of each recipient in the
          next pass although no sweep is due.
        justification: |
          A failed pass must not mark the sweep as done, or the user would wait for the next sweep to get the news.
        children:
          - ReviewCenter-NotificationDispatcher-IdleSweepKeptOnError
        tests:
          - NotificationDispatcher_RunPass_FailedAfterCleanPass_NextPassReadsAgain
          - NotificationDispatcher_RunPass_FailedSweepAfterCleanPass_NextPassReadsAgain

      - id: ReviewCenter-Core-NotificationIdleCost-Resume
        title: >-
          When a notification pass is clean, the Core subsystem shall read no inbox in the next idle pass.
        justification: |
          Reading everything after a failure must not keep the dispatcher from becoming cheap again.
        children:
          - ReviewCenter-NotificationDispatcher-IdleResumesAfterCleanPass
        tests:
          - NotificationDispatcher_RunPass_CleanAfterFailedPass_NextPassIdle

      - id: ReviewCenter-Core-NotificationIdleCost-Sweep
        title: >-
          When 15 minutes have passed since the last full reading, the Core subsystem shall read the inbox of each
          recipient.
        justification: |
          News that comes with no entry in the audit trail must still be found.
        children:
          - ReviewCenter-NotificationDispatcher-IdleSweep
        tests:
          - NotificationDispatcher_RunPass_15MinutesNoChange_ReadsInbox

      - id: ReviewCenter-Core-NotificationIdleCost-TimeDriven
        title: >-
          When a batch window has elapsed, the Core subsystem shall serve it although the audit trail has no new entry.
        justification: |
          A mail that is due by the clock must not wait for an unrelated change.
        children:
          - ReviewCenter-NotificationDispatcher-IdleTimeDriven
        tests:
          - NotificationDispatcher_RunPass_WindowElapsedSequenceUnchanged_Sends

      - id: ReviewCenter-Core-NotificationResilience
        title: >-
          When the notifications of one user fail, the Core subsystem shall go on with the notifications of the other
          users.
        justification: |
          The failure of one mailbox or one inbox must not keep other users from their mail.
        children:
          - ReviewCenter-NotificationDispatcher-ErrorIsolation
          - ReviewCenter-NotificationDispatcher-ErrorCallback
        tests:
          - NotificationDispatcher_RunPass_InboxFails_OtherUserMailed
          - NotificationDispatcher_RunPass_InboxFails_CallbackInvoked

      - id: ReviewCenter-Core-NotificationPassResult
        title: >-
          When a notification pass ends, the Core subsystem shall report the numbers of sent, failed, and deferred
          mails.
        justification: |
          The host logs the result of a pass.
        children:
          - ReviewCenter-NotificationDispatcher-ResultCounts
        tests:
          - NotificationDispatcher_RunPass_Mixed_ResultCounts

      - id: ReviewCenter-Core-NotificationPassResult-NoAddress
        title: >-
          The Core subsystem shall keep the address of a recipient out of the result of a notification pass.
        justification: |
          The host logs the result of a pass, which must hold no personal data.
        children:
          - ReviewCenter-NotificationDispatcher-ResultCounts-NoAddress
        tests:
          - NotificationDispatcher_RunPass_Sent_ResultHoldsNoAddress

      - id: ReviewCenter-Core-NotificationPassResult-Cancellation
        title: >-
          When a notification pass is canceled, the Core subsystem shall report a cancellation.
        justification: |
          A server that stops must not wait for a pass.
        children:
          - ReviewCenter-NotificationDispatcher-Cancellation
        tests:
          - NotificationDispatcher_RunPass_Cancelled_Throws

      - id: ReviewCenter-Core-NotificationMode
        title: >-
          The Core subsystem shall let a user with a confirmed address choose the notification mode.
        justification: |
          Notification mail is off by default, so the user must opt in. Two ways to be told serve the two ways in which
          people work: soon after each change, or once a day.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeStatusShown
          - ReviewCenter-NotificationPreferenceService-ModeSet
          - ReviewCenter-NotificationPreferenceService-ModeSetEvery
          - ReviewCenter-NotificationPreferenceService-ModeSetNone
        tests:
          - CoreSubsystem_NotificationMode_ConfirmedUserChoosesAndIsAudited

      - id: ReviewCenter-Core-NotificationMode-DefaultNone
        title: >-
          The Core subsystem shall use the mode None for a user who has not chosen a mode.
        justification: |
          Notification mail is off by default, so the user must opt in.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeDefaultNone
        tests:
          - NotificationPreferenceService_GetStatus_NoRow_ModeNone

      - id: ReviewCenter-Core-NotificationMode-RemoveResets
        title: >-
          When a user removes the address, the Core subsystem shall return the notification mode to None.
        justification: |
          Mail must not go to an address that is gone.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeRemoveResets
        tests:
          - NotificationPreferenceService_RemoveAddress_AfterMode_ModeNone

      - id: ReviewCenter-Core-NotificationModeRefusals
        title: >-
          The Core subsystem shall refuse a change of the notification mode for a user without a confirmed address.
        justification: |
          Mail may go only to an address that its owner has proven.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeNeedsConfirmedAddress
        tests:
          - NotificationPreferenceService_SetMode_NoConfirmedAddress_Throws

      - id: ReviewCenter-Core-NotificationModeRefusals-ApiToken
        title: >-
          The Core subsystem shall refuse a change of the notification mode by an actor of an API token.
        justification: |
          Only the person may decide when mail goes.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeRefuseApiToken
        tests:
          - NotificationPreferenceService_SetMode_ApiTokenActor_Throws

      - id: ReviewCenter-Core-NotificationModeRefusals-NotAvailable
        title: >-
          The Core subsystem shall refuse a change of the notification mode while notifications are not available.
        justification: |
          A feature that is off must not cause mail.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeRefuseNotAvailable
          - ReviewCenter-NotificationPreferenceService-ModeRefuseNotAvailable-StoreUntouched
        tests:
          - NotificationPreferenceService_SetMode_NotAvailable_Throws

      - id: ReviewCenter-Core-NotificationModeRefusals-DisabledUser
        title: >-
          The Core subsystem shall refuse a change of the notification mode for a disabled user.
        justification: |
          A disabled account must not cause mail.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeRefuseDisabledUser
        tests:
          - NotificationPreferenceService_SetMode_DisabledUser_Throws

      - id: ReviewCenter-Core-NotificationModeRefusals-TemporaryPassword
        title: >-
          The Core subsystem shall refuse a change of the notification mode for a user with a temporary password.
        justification: |
          An account that is not yet taken over by its person must not cause mail.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeRefuseTemporaryPassword
        tests:
          - NotificationPreferenceService_SetMode_MustChangePassword_Throws

      - id: ReviewCenter-Core-NotificationModeRefusals-UnknownValue
        title: >-
          The Core subsystem shall refuse a notification mode that is not one of the defined modes.
        justification: |
          A value that no code path knows must not be stored.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeRefuseUnknownValue
        tests:
          - NotificationPreferenceService_SetMode_UndefinedValue_Throws

      - id: ReviewCenter-Core-NotificationModeAudit
        title: >-
          The Core subsystem shall record a change of the notification mode as an audit entry.
        justification: |
          A change of when mail goes belongs in the audit trail.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeAudited
        tests:
          - CoreSubsystem_NotificationMode_ConfirmedUserChoosesAndIsAudited
          - NotificationPreferenceService_SetMode_Changed_AuditEntryWritten

      - id: ReviewCenter-Core-NotificationModeAudit-NoAddress
        title: >-
          The Core subsystem shall keep the address out of the audit entry of a change of the notification mode.
        justification: |
          The audit trail is kept long and read by many, so it holds no personal data.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeAuditNoAddress
        tests:
          - NotificationPreferenceService_SetMode_Changed_AuditHasNoAddress

      - id: ReviewCenter-Core-NotificationModeAudit-Unchanged
        title: >-
          When the notification mode does not change, the Core subsystem shall record no audit entry.
        justification: |
          An unchanged choice is no change.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeUnchangedNoAudit
          - ReviewCenter-NotificationPreferenceService-ModeUnchangedNoAudit-NoChange
          - ReviewCenter-NotificationPreferenceService-ModeUnchangedNoAudit-NoneWithoutRow
        tests:
          - NotificationPreferenceService_SetMode_Same_NoAuditNoChange

      - id: ReviewCenter-Core-NotificationModeBaseline
        title: >-
          When a user switches a notification mode on from None, the Core subsystem shall mark the items of the inbox as
          known before any mail is sent for them.
        justification: |
          A user who opts in must not get a mail for the whole backlog.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeEnableMarksBaseline
        tests:
          - NotificationPreferenceService_SetMode_NoneToEvery_BaselinePending

      - id: ReviewCenter-Core-NotificationModeBaseline-KeepsItems
        title: >-
          When a user switches between the modes Daily and Every, the Core subsystem shall keep the known items.
        justification: |
          A switch between Daily and Every must neither repeat nor swallow news.
        children:
          - ReviewCenter-NotificationPreferenceService-ModeSwitchKeepsItems
          - ReviewCenter-NotificationPreferenceService-ModeSwitchKeepsItems-NoBaseline
        tests:
          - NotificationPreferenceService_SetMode_DailyToEvery_ItemsKept
