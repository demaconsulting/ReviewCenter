      - id: ReviewCenter-Core-ReviewStatus
        title: >-
          The Core subsystem shall tell a viewer of a review where the review stands: who has handed in a ballot and who
          has signed, which checks the reviewers answered differently (only while the viewer may see them), how many
          questions and findings are open, the one thing the viewer should do next, and, for a reviewer who signed and
