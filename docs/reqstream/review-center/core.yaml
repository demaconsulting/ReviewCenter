      - id: ReviewCenter-Core-Signatures
        title: >-
          The Core subsystem shall let a review have reviewer slots with a primary reviewer and an optional
          alternate, let a reviewer sign the review, as approved or, when the ballots agree on a Fail, as rejected
          with a conclusion text, only when nothing blocks it (a Fail answer does not) and only after confirming the
          password again, bind each signature to a digest of the review record, keep every signature unchanged,
          and show a signature as out of date, and the review as not concluded, as soon as the record changes
          until every slot has signed the new record, and refuse a change of the record that would make a current
          signature out of date until the caller acknowledges the affected slots.
        justification: |
          A signature is only worth something if it says who signed which content and with what outcome. Binding it
          to a digest of the record, and computing the conclusion from the record each time, means a conclusion can
          never outlive the content it concluded, and asking for the password again shows the signature came from the
          person. A failed check is a finding, so it leads to a rejection that states its reasons and not to a review
          that nobody can sign. Naming the signatures that a change would withdraw, and refusing until the caller
          confirms, keeps a signature from being lost unnoticed.
        children:
          - ReviewCenter-RecordDigest-Format
          - ReviewCenter-RecordDigest-Format-Header
