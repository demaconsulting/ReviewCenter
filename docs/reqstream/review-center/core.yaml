      - id: ReviewCenter-Core-UserImpact
        title: >-
          The Core subsystem shall answer, for a user who may leave, which reviewer slots of unlocked reviews still
          wait for the user (as primary or alternate, not signed or out of date) and in which projects the user is the
          only enabled project administrator, to a system administrator for every project and to a project
          administrator for the projects the asker administers, and shall refuse every other actor.
        justification: |
          Before a person is disabled, their open review work has to be handed over and no project may be left without
          an administrator. The answer is computed from what is stored by the rules the inbox and the last-administrator
          check already use, and it is limited to those who run projects and to the projects they run.
