---
# Core Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Core subsystem
# - The Core subsystem spans the Fingerprint, ProjectService, ReviewService, ThreadService, ChecklistService,
#   UserService, RecordDigest, SigningService, RepositoryService, SelectionMatcher, and RevisionValidator units, with
#   the domain types they share (project, review, review file, thread, comment, checklist, user, role, actor, reviewer
#   slot, signature, upload, limits, repository, rule exception, and store interfaces)
# - Subsystem requirements describe the externally visible behavior of the domain model and its rules

sections:
  - title: Core Subsystem Requirements
    requirements:
      - id: ReviewCenter-Core-Projects
        title: >-
          The Core subsystem shall create projects from a name and an optional description, and shall list
          and read them back.
        justification: |
          Projects group the reviews of one body of work. The rest of the system can only manage reviews once
          projects can be created and found again.
        children:
          - ReviewCenter-ProjectService-Create
          - ReviewCenter-ProjectService-List
          - ReviewCenter-ProjectService-Read
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Reviews
        title: >-
          The Core subsystem shall create a draft review in a project from a set of uploaded files, keep every
          file byte for byte with its size and SHA-256 hash, and read the review, its list, and its file
          content back.
        justification: |
          A review is a fixed snapshot of the files to be reviewed. Keeping the exact bytes, and showing them
          again unchanged, is what lets a reviewer trust that the content seen is the content that was
          submitted, including binary files and files with Windows line endings.
        children:
          - ReviewCenter-ReviewService-Draft
          - ReviewCenter-ReviewService-Read
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack

      - id: ReviewCenter-Core-Fingerprint
        title: >-
          The Core subsystem shall give every review a content fingerprint that is calculated from the bytes of
          its files exactly as ReviewMark calculates it, independent of file names and order.
        justification: |
          The fingerprint identifies the exact content under review and later allows a review to be matched to
          the evidence ReviewMark produces for the same files. Only the same algorithm gives the same value, so
          a deviation would silently break that match.
        children:
          - ReviewCenter-Fingerprint-FileHash
          - ReviewCenter-Fingerprint-SetHash
          - ReviewCenter-Fingerprint-Duplicates
          - ReviewCenter-ReviewService-Fingerprint
        tests:
          - CoreSubsystem_ProjectAndReviewWorkflow_ValidInput_StoresFingerprintsAndReadsBack
          - CoreSubsystem_Fingerprint_SameContentOtherNamesAndOrder_GivesSameFingerprint

      - id: ReviewCenter-Core-Rules
        title: >-
          The Core subsystem shall enforce the project, review identity, and upload rules, and shall report each
          violation as a domain rule exception that names the rule, without storing anything.
        justification: |
          Rules that protect the integrity of the review record must hold no matter which user interface or
          store is used. Naming the violated rule lets a caller tell the user what to correct, and storing
          nothing on a violation keeps the record free of partial reviews.
        children:
          - ReviewCenter-ProjectService-Validation
          - ReviewCenter-ReviewService-Id
          - ReviewCenter-ReviewService-Title
          - ReviewCenter-ReviewService-Project
          - ReviewCenter-ReviewService-Files
          - ReviewCenter-ReviewService-Limits
          - ReviewCenter-ThreadService-Anchor
          - ReviewCenter-ThreadService-Comment
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-Threads
        title: >-
          The Core subsystem shall start comment threads on a file of a review, anchored to the whole file or a
          line range, let anyone reply, resolve and reopen threads, and read the threads of a review back with
          their comments in order, never changing or removing a posted comment, and give the last activity of a
          thread, an index of threads by state, and a next step.
        justification: |
          Review comments are the purpose of a review. Keeping posted comments unchanged makes the discussion a
          reliable record of what was said and in which order.
        children:
          - ReviewCenter-ThreadService-Start
          - ReviewCenter-ThreadService-Reply
          - ReviewCenter-ThreadService-State
          - ReviewCenter-ThreadService-Read
          - ReviewCenter-ThreadService-Index
          - ReviewCenter-ThreadService-NextStep
        tests:
          - CoreSubsystem_ThreadWorkflow_StartReplyResolveReopen_ReadsBackInOrder

      - id: ReviewCenter-Core-Checklist
        title: >-
          The Core subsystem shall give every review a checklist of checks grouped in sections, frozen when the
          review is created, let each section be marked as not applicable with a reason, let each check be
          answered Pass, Fail, or N/A with a justification where required, and give the progress per section and
          overall and whether the checklist is complete.
        justification: |
          The checklist turns the review into a defined set of checks, so that it is clear what was examined and
          what is still open. Freezing it at creation keeps the questions fixed for the life of the review.
        children:
          - ReviewCenter-ChecklistService-Default
          - ReviewCenter-ChecklistService-Freeze
          - ReviewCenter-ChecklistService-Applicability
          - ReviewCenter-ChecklistService-Answer
          - ReviewCenter-ChecklistService-AnsweredBy
          - ReviewCenter-ChecklistService-Progress
        tests:
          - CoreSubsystem_Checklist_FrozenAtCreationAnswerAndProgress

      - id: ReviewCenter-Core-Users
        title: >-
          The Core subsystem shall create users with a user name, a display name, a role, and a password, keeping
          only a hash of the password, check a sign-in with a lockout after repeated failures, enable and
          disable users, set roles, change and set passwords, and never leave the system without an enabled
          administrator.
        justification: |
          Accountability in a review needs verified users. The rules must hold whichever user interface or store
          is used, and keeping only a hash of the password protects the passwords if the database is copied.
        children:
          - ReviewCenter-UserService-Username
          - ReviewCenter-UserService-DisplayName
          - ReviewCenter-UserService-Password
          - ReviewCenter-UserService-Create
          - ReviewCenter-UserService-Authenticate
          - ReviewCenter-UserService-Lockout
          - ReviewCenter-UserService-Enabled
          - ReviewCenter-UserService-LastAdmin
          - ReviewCenter-UserService-ChangePassword
          - ReviewCenter-UserService-SetPassword
          - ReviewCenter-UserService-SetRole
          - ReviewCenter-UserService-NotFound
        tests:
          - CoreSubsystem_UsersWorkflow_CreateSignInLockoutAndLastAdmin

      - id: ReviewCenter-Core-Signatures
        title: >-
          The Core subsystem shall let a review have reviewer slots with a primary reviewer and an optional
          alternate, let a reviewer sign the review only when nothing blocks it and only after confirming the
          password again, bind each signature to a digest of the review record, keep every signature unchanged,
          and show a signature as out of date, and the review as not approved, as soon as the record changes
          until every slot has signed the new record.
        justification: |
          A signature is only worth something if it says who approved which content. Binding it to a digest of
          the record, and computing the approval from the record each time, means an approval can never outlive
          the content it approved, and asking for the password again shows the approval came from the person.
        children:
          - ReviewCenter-RecordDigest-Format
          - ReviewCenter-RecordDigest-Coverage
          - ReviewCenter-RecordDigest-Independence
          - ReviewCenter-RecordDigest-Unambiguous
          - ReviewCenter-SigningService-Slots
          - ReviewCenter-SigningService-SlotUsers
          - ReviewCenter-SigningService-SlotEdit
          - ReviewCenter-SigningService-Actor
          - ReviewCenter-SigningService-Blockers
          - ReviewCenter-SigningService-Sign
          - ReviewCenter-SigningService-Reauthenticate
          - ReviewCenter-SigningService-Current
          - ReviewCenter-SigningService-Status
        tests:
          - CoreSubsystem_Signatures_SignChangeOutOfDateAndResign_FollowsTheRecord

      - id: ReviewCenter-Core-AuditTrail
        title: >-
          The Core subsystem shall record every change of projects, reviews, threads, checklists, reviewer slots,
          signatures, and users, and every sign-in event, as an entry of a hash-chained audit trail that names the
          actor, the action, and a short detail without passwords or free text, read the trail back newest first
          in pages, and verify the chain by streaming, so that an edit, a deletion, an insertion, or a reordering
          in the middle of the history is detected.
        justification: |
          A review record is only trustworthy if its history can be checked. Hash chaining makes tampering with
          the middle of the history evident without a special database. It does not detect the removal of the
          newest entries or a complete rewrite by someone with write access to the database, unless the head hash
          was recorded elsewhere.
        children:
          - ReviewCenter-AuditChain-Hash
          - ReviewCenter-AuditChain-Verify
          - ReviewCenter-AuditChain-Text
          - ReviewCenter-AuditService-Record
          - ReviewCenter-AuditService-List
          - ReviewCenter-AuditService-Verify
          - ReviewCenter-ProjectService-Audit
          - ReviewCenter-ReviewService-Audit
          - ReviewCenter-ThreadService-Audit
          - ReviewCenter-ChecklistService-Audit
          - ReviewCenter-SigningService-Audit
          - ReviewCenter-UserService-Audit
          - ReviewCenter-UserService-SignInAudit
          - ReviewCenter-RepositoryService-Audit
        tests:
          - AuditService_RecordAsync_Draft_StoresEntryThatVerifies
          - UserService_AdministrationEvents_AreRecordedWithoutPasswords

      - id: ReviewCenter-Core-Repositories
        title: >-
          The Core subsystem shall keep a registry of git repositories, with a name, a location, an optional user name,
          and an optional token that is stored only encrypted and is never given back, managed by administrators only,
          disabled instead of deleted, and report each violation of its rules as a domain rule exception that names
          the rule, without storing anything.
        justification: |
          The registry decides what source code the server reads and holds secrets for it. Its rules must hold
          whichever user interface or store is used, and the token must stay write-only.
        children:
          - ReviewCenter-RepositoryService-Name
          - ReviewCenter-RepositoryService-Location
          - ReviewCenter-RepositoryService-Credentials
          - ReviewCenter-RepositoryService-Token
          - ReviewCenter-RepositoryService-Admin
          - ReviewCenter-RepositoryService-Disable
          - ReviewCenter-RepositoryService-Access
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-FileSelection
        title: >-
          The Core subsystem shall check a revision given by a user, and match repository paths against include and
          exclude selection patterns that support the common glob syntax, reporting an invalid revision or pattern
          as a domain rule exception that names the rule.
        justification: |
          Revisions and patterns come from users and are passed on to git and to the file walk. Checking them in
          one place keeps option-like text away from git and keeps a pattern from using unbounded resources.
        children:
          - ReviewCenter-RevisionValidator-Accept
          - ReviewCenter-RevisionValidator-Refuse
          - ReviewCenter-SelectionMatcher-Match
          - ReviewCenter-SelectionMatcher-Parse
          - ReviewCenter-SelectionMatcher-Bounded
          - ReviewCenter-SelectionMatcher-Compatibility
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing

      - id: ReviewCenter-Core-RepositoryReviews
        title: >-
          The Core subsystem shall create a review from the files that changed in a registered git repository between
          an optional baseline revision and a head revision and match a selection, freeze their baseline and head
          content and the resolved commits, refuse a review that has no such file, bind the source, the selection, and
          every change into the record digest, and accept a comment on the lines of a file only when it exists at the
          head.
        justification: |
          A review of a change must keep exactly what was reviewed, and a signature must bind to it, so that neither a
          later commit nor a different selection can leave a signature looking current.
        children:
          - ReviewCenter-ReviewService-FromRepository
          - ReviewCenter-ReviewService-Frozen
          - ReviewCenter-ReviewService-NothingToReview
          - ReviewCenter-ReviewService-RepositoryLimits
          - ReviewCenter-ReviewService-SkippedEntries
          - ReviewCenter-ReviewService-RepositoryAudit
          - ReviewCenter-RecordDigest-Source
          - ReviewCenter-ThreadService-DeletedFile
        tests:
          - CoreSubsystem_RuleViolation_IsReportedAsDomainRuleAndStoresNothing
          - ReviewService_CreateFromRepositoryAsync_Changes_FreezesFilesAndSource
