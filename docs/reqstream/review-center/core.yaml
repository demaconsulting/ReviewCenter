      - id: ReviewCenter-Core-RepositoryReviews
        title: >-
          The Core subsystem shall create a review from the files that changed in a registered git repository between
          an optional baseline revision and a head revision and match a selection, freeze their baseline and head
          content and the resolved commits, refuse a review that has no such file, bind the source, the selection, and
