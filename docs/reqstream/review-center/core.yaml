      - id: ReviewCenter-Core-BallotVisibility
        title: >-
          The Core subsystem shall keep the answers of the other reviewers of a review with several reviewer slots, and
          everything that would reveal them (the disputed and failed counts, the provisional outcome, the conclusion
          text, the discussions about checks, and the details of the audit entries that name an answer), from a viewer
          who has not handed in their own ballot, unless the viewer leads or administers the project, is a system
          administrator or an auditor, or the review is concluded, while who has handed in stays visible, and shall
          offer the viewer who has handed in the differing answers side by side.
        justification: |
          Reviewers add value only when they judge on their own. One rule decides who may see the others and every
          reader of the ballots asks it, so that no summary, list, or history can reveal what the checklist hides. The
          rule is enforced where the data is read, and the stored record and its signatures are untouched.
