      - id: ReviewCenter-Core-PlanReviews
        title: >-
          The Core subsystem shall plan the reviews that a head revision of a registered repository needs, one for each
          review-set that the repository defines in its configuration file, choosing for each set a full review, the
          changes since a given revision, or the changes since the last approved review of that set (falling back to a
          full review, with a plain note, when that review is not in the history or covered other files), telling which
          sets
          are already filed or have nothing to review, and create the picked reviews through the review service, each in
          its own transaction, reporting the result of each.
        justification: |
          A repository already states which sets of files are reviewed together. Planning from that statement, and
          creating the reviews with the same rules as a review made by hand, saves effort and mistakes, and falling
          back to a full review whenever a baseline cannot be trusted keeps changed files from escaping review.
