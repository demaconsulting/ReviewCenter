      - id: ReviewCenter-Core-Progress
        title: >-
          The Core subsystem shall answer for every review of a project which stage it is in (Setup, In review,
          Approved, or Rejected, derived from the approval status and not from the stored state), how many signatures
          it has of
          the number it needs and how many are out of date, whom it waits on (a disabled person marked), what blocks
          its approval with the numbers that equal the blocker sentences of the approval status, whether it is
          overdue, and when it last changed according to the audit trail, with a number of reads that does not grow
          with the number of reviews, and shall give the answer to everyone who may see the project and to nobody
          else.
