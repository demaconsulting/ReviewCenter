      - id: ReviewCenter-Core-Inbox
        title: >-
          The Core subsystem shall build for a user an inbox of the reviews that wait for the user, in the groups to
          answer, disputed, ready to sign, signature no longer counts, replies waiting, failed checks, waiting for
          others, and updates, decide on
          the current access of the user which reviews
          and which actions are shown, never show a user who has not handed in the own ballot what the others answered,
          count the reviews that need action, keep what the user has seen of each review
          so that new comments and changes are marked, never move it back, and never put it into the audit trail or
          the record digest.
        justification: |
          The inbox joins facts that the review, thread, checklist and signature rules already decide, so it is a rule
          of the domain and not of the page. Keeping it in the Core subsystem lets every page and later every client
          show the same list, and the same rules of access apply to it as to the reviews themselves.
        children:
          - ReviewCenter-InboxService-ToAnswer
