          - ReviewCenter-ThreadService-Access
          - ReviewCenter-ChecklistService-Access
          - ReviewCenter-ChecklistService-Access-Section
          - ReviewCenter-ChecklistService-Arguments
          - ReviewCenter-ChecklistService-BallotAccess
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectAccess_Revocation_TakesEffectOnTheNextCall
