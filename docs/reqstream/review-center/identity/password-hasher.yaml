---
# Software Unit Requirements for the PasswordHasher Class
#
# The PasswordHasher class adapts the ASP.NET Core password hasher to the Core password hasher interface.

sections:
  - title: PasswordHasher Unit Requirements
    requirements:
      - id: ReviewCenter-PasswordHasher-HashVerify
        title: >-
          The PasswordHasher class shall verify the right password against the hash made from it.
        justification: |
          Only a hash of a password may be stored, so that a copy of the database does not reveal passwords, and
          the right password must still let its owner in.
        tests:
          - PasswordHasher_Verify_RightAndWrongPassword_OnlyRightSucceeds

      - id: ReviewCenter-PasswordHasher-HashVerify-WrongPassword
        title: >-
          The PasswordHasher class shall not verify a wrong password against a hash.
        justification: |
          A hash that accepted other passwords would let anybody in.
        tests:
          - PasswordHasher_Verify_RightAndWrongPassword_OnlyRightSucceeds

      - id: ReviewCenter-PasswordHasher-HashVerify-InvalidHash
        title: >-
          The PasswordHasher class shall reject a hash that is not valid, without failing.
        justification: |
          A damaged hash must not let anybody in or crash the sign-in.
        tests:
          - PasswordHasher_Verify_GarbageHash_ReturnsFalse
