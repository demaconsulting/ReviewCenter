---
# Software Unit Requirements for the SignIn Unit
#
# The SignIn unit is the cookie sign-in code: the login and logout endpoints, the authorization policy for pages, the
# validation of the session, and the actor of the signed-in user.

sections:
  - title: SignIn Unit Requirements
    requirements:
      - id: ReviewCenter-SignIn-Login
        title: >-
          The SignIn unit shall, on a sign-in request with the user name and password of an enabled account, sign
          the user in with a session cookie and redirect to the requested local address or to the home page, or to
          the account page when the account has a temporary password.
        justification: |
          Signing in must lead the user back to where they were going, and nowhere else.
        tests:
          - SignIn_Login_ValidCredentials_SetsSafeSessionCookieAndRedirects
          - SignIn_Login_OverHttps_CookieIsSecure

      - id: ReviewCenter-SignIn-LoginFailure
        title: >-
          The SignIn unit shall answer a failed sign-in, whether the user name is unknown, the password is wrong,
          the account is disabled, or it is locked out, with the same redirect to the login page and set no
          cookie.
        justification: |
          A different answer per reason would tell an attacker which user names exist and which accounts are
          disabled. The one allowed difference is the refusal by the sign-in throttle, which does not depend on
          the account (see ReviewCenter-SignIn-Throttle).
        tests:
          - SignIn_Login_EveryKindOfFailure_GivesTheSameAnswerAndNoCookie
          - SignIn_Login_WrongPasswordWithReturnUrl_KeepsReturnUrlOnLoginPage

      - id: ReviewCenter-SignIn-Throttle
        title: >-
          The SignIn unit shall, before it checks a password, ask the sign-in throttle for permission and, when the
          throttle refuses, check no password, set no cookie, give the same throttled answer whether or not the
          user name exists, keep the safe return address, and record the refusal in the audit trail, at most once
          per minute and typed name, with the typed name cleaned and without the password; and shall give the
          attempts of a name back when its sign-in succeeds.
        justification: |
          Guessing passwords must be slow even where the account lockout does not apply, for example for names that
          do not exist. Refusing without checking the password, and with an answer that does not depend on the
          account, keeps the throttle from revealing which accounts exist or whether a guess was right. Recording
          the refusals once per minute shows an attack without letting it flood the trail.
        tests:
          - SignIn_Login_TooManyAttempts_RedirectsToThrottledAnswerIdenticalForKnownAndUnknownNames
          - SignIn_Login_Throttled_RefusesEvenTheRightPasswordAndSetsNoCookie
          - SignIn_Login_SuccessAfterFailures_ResetsTheNameCounter
          - SignIn_Login_Throttled_RecordsOneThrottledEntryPerWindow

      - id: ReviewCenter-SignIn-ThrottleSettings
        title: >-
          The SignIn unit shall read the limits of the sign-in throttle from the Identity:Throttle settings
          (failures per name, failures per client address, and the window in seconds), and shall stop the server
          from starting, naming the setting, when a value is not above 0, when the window is longer than one day,
          or when the limit per address is lower than the limit per name.
        justification: |
          An operator must be able to tune the throttle, and a wrong value, such as a limit of 0 that would lock
          everybody out, must be found when the server starts and not when the first user cannot sign in.
        tests:
          - ServerHost_CreateApplication_InvalidThrottleSettings_ThrowsClearError
          - ServerHost_CreateApplication_ValidThrottleSettings_BuildsTheApplication

      - id: ReviewCenter-SignIn-ReturnUrl
        title: >-
          The SignIn unit shall use a return address only when it is a local path, and shall use the home page for
          any other value, including addresses of other sites and addresses that only look local.
        justification: |
          A return address that could lead to another site would let an attacker use the login page to send
          users to a look-alike site after they sign in.
        tests:
          - SignIn_SafeReturnUrl_AnyInput_KeepsOnlyLocalPaths
          - SignIn_Login_HostileReturnUrl_RedirectsToHomePage

      - id: ReviewCenter-SignIn-ReturnDeepLink
        title: >-
          The SignIn unit shall send an anonymous request for a protected page to the login page with the address
          that was requested as the return address, exactly as it was written, including escaped characters and the
          query, so that signing in leads back to the same page.
        justification: |
          A link to one file, line or thread is only useful if it survives the sign-in. The decoded request path
          cannot be used, because it turns an escaped slash or percent sign in a file name into something else.
        tests:
          - SignIn_DeepLink_SignedOut_ReturnsToTheSameLinkAfterLogin
          - SignIn_DeepLink_PlusAndAmpersand_ReturnsToTheSameFileAfterLogin
          - SignIn_DeepLink_HostileReturnUrl_GoesToTheHomePage
      - id: ReviewCenter-SignIn-Cookie
        title: >-
          The SignIn unit shall keep the session in a cookie that scripts cannot read, that is not sent with
          requests from other sites, that is a session cookie, and that is marked Secure when the request is over
          HTTPS, and shall reject missing arguments when it is set up.
        justification: |
          The session cookie is the key to the account, so it must be protected against theft by scripts and
          against use from other sites.
        tests:
          - SignIn_Login_ValidCredentials_SetsSafeSessionCookieAndRedirects
          - SignIn_Login_OverHttps_CookieIsSecure
          - SignIn_AddSignIn_NullArguments_Throw

      - id: ReviewCenter-SignIn-Antiforgery
        title: >-
          The SignIn unit shall refuse a sign-in or sign-out request without a valid antiforgery token and shall
          sign nobody in because of it.
        justification: |
          Without the token another site could make a browser sign a user in to an account chosen by an
          attacker, or sign the user out.
        tests:
          - SignIn_PostWithoutAntiforgeryToken_IsRefusedAndSignsNobodyIn

      - id: ReviewCenter-SignIn-Logout
        title: >-
          The SignIn unit shall end the session of the signed-in user on a sign-out request and redirect to the
          home page.
        justification: |
          Users on a shared computer must be able to end their session.
        tests:
          - SignIn_Logout_SignedInUser_EndsTheSession

      - id: ReviewCenter-SignIn-Protected
        title: >-
          The SignIn unit shall redirect a request without a signed-in user to the login page, with the requested
          address as the return address, for every page except the home page and the login page, which stay open.
        justification: |
          Review data must only be reached by identified users, while the home page and the login page must work
          without signing in.
        tests:
          - SignIn_ProtectedPage_Anonymous_RedirectsToLogin
          - SignIn_PublicPage_Anonymous_IsServed

      - id: ReviewCenter-SignIn-AdminOnly
        title: >-
          The SignIn unit shall allow the user administration page only to a user with the system administrator role.
        justification: |
          Managing users is limited to system administrators, because it controls who may sign in.
        tests:
          - SignIn_UsersPage_ReviewerAndAdmin_OnlyAdminIsAllowed

      - id: ReviewCenter-SignIn-AdminClaim
        title: >-
          The SignIn unit shall put the system administrator role into the principal of a session only for a user
          who is a system administrator and has no temporary password to change, and no role for a project, and shall
          consider the principal current only
          when it has that role exactly when the stored user is such a system administrator.
        justification: |
          A project role copied into the cookie would stay true after a member was removed from the project, so
          memberships are always read from the database when they are needed. The system administrator role is
          the one claim that pages use for authorization, and comparing its presence with the stored flag ends the
          session of a user who was promoted or demoted.
        tests:
          - SignIn_IsCurrent_StoredUserVersusPrincipal_FollowsTheRule
          - SignIn_Session_RoleChangedAfterLogin_IsRejected

      - id: ReviewCenter-SignIn-TemporaryPassword
        title: >-
          The SignIn unit shall, for an account that has to change its temporary password, sign the user in and
          redirect to the account page instead of the requested address, put a must-change-password claim and no
          system administrator role into the principal, even for a system administrator, and consider the principal
          current only when the claim is present exactly when the stored user has to change the password, so that
          the session of that user ends when the password is changed and the user signs in again.
        justification: |
          A temporary password was handed over by somebody else, so it may only be used to choose a new one. The
          claim lets the layout confine the user to the account page without a call per navigation, withholding the
          administrator role keeps the rights of a system administrator out of reach until the password is replaced,
          and comparing the claim with the stored flag makes the confinement end, and the old session stop, at the
          moment the password is changed.
        tests:
          - SignIn_Login_TemporaryPassword_GoesToAccountPageWithoutAdminRoleAndStaleWhenFlagChanges
          - SignIn_IsCurrent_TemporaryPasswordFlag_MustMatchTheClaim

      - id: ReviewCenter-SignIn-SessionValidation
        title: >-
          The SignIn unit shall consider a signed-in user valid only while that user exists, is enabled, and has
          the same system administrator state and display name as at sign-in, using this one rule for every check,
          and shall reject the session cookie of a user who is not valid.
        justification: |
          Disabling a user or changing the system administrator right must take effect at once, not when the cookie
          runs out. One rule for
          the cookie and for open pages means a page that is already open cannot be treated more leniently than a
          new request.
        tests:
          - SignIn_Session_UserDisabledAfterLogin_IsRejected
          - SignIn_Session_RoleChangedAfterLogin_IsRejected
          - SignIn_IsCurrent_StoredUserVersusPrincipal_FollowsTheRule
          - SignIn_IsCurrent_MissingPrincipalUserOrClaims_ReturnsFalse

      - id: ReviewCenter-SignIn-RevalidationSetting
        title: >-
          The SignIn unit shall read the number of seconds between two checks of the signed-in user by an open
          page from the Auth:RevalidationSeconds setting, with 30 seconds as the default.
        justification: |
          How long a disabled or changed user can keep an open page is the time between two checks. An operator
          must be able to trade a shorter window against more reads of the user store, and the default must be
          usable without any setting.
        tests:
          - AuthOptions_RevalidationSeconds_Default_IsThirtyWithMinimumFive

      - id: ReviewCenter-SignIn-Actor
        title: >-
          The SignIn unit shall provide the signed-in user as an actor, with user name and display name, and shall
          refuse with a message that the user is no longer signed in, saving nothing, when nobody is signed in.
        justification: |
          The services that record who acted take the person from the sign-in, so nobody can act in the name of
          somebody else. An open page can lose its user between two clicks, so the refusal must be a message the
          page can show instead of a failure of the whole page.
        tests:
          - SignIn_GetActorAsync_SignedInAndAnonymous_ReturnsActorOrThrows

      - id: ReviewCenter-SignIn-Audit
        title: >-
          The SignIn unit shall record a successful sign-in and a sign-out in the audit trail on a best-effort basis,
          after the cookie was set or before it is cleared, taking the actor from the server-side sign-in state, and
          shall record a failed sign-in, an attempt on a locked account and a lockout, with the typed user name of an
          unknown user cleaned and capped, and never with the typed password.
        justification: |
          Who was signed in when something happened is part of the history. The actor must come from the server
          and not from form input, and a failing trail must not stop anybody from signing in or out. The typed name
          of an unknown user shows what an attacker tried, and is cleaned and capped so that it cannot forge or
          flood the trail.
        tests:
          - SignIn_Login_ValidCredentials_RecordsSignInEntry
          - SignIn_Logout_SignedInUser_RecordsSignOutEntry
          - SignIn_Login_UnknownUser_RecordsCleanedTypedNameWithoutPassword
          - SignIn_Login_WrongPassword_RecordsFailureForTheUserWithoutPassword
          - SignIn_Login_RepeatedFailures_RecordsLockoutOnce
          - SignIn_Login_LockedAccount_RecordsOneSignInLockedEntry
          - SignIn_Flow_LoginFailureAndLogout_FormAnIntactChain
