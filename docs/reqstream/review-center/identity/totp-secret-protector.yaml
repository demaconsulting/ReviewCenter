---
# Software Unit Requirements for the TotpSecretProtector Class
#
# The TotpSecretProtector class encrypts the secrets of the second factor with ASP.NET Core Data Protection before they
# are stored, with a purpose of its own and a sub-purpose for each user.

sections:
  - title: TotpSecretProtector Unit Requirements
    requirements:
      - id: ReviewCenter-TotpSecretProtector-Encrypted
        title: >-
          The TotpSecretProtector class shall return the secret of a user as encrypted text from which the secret
          cannot be read, and shall give back exactly the same secret when the text is decrypted for the same user.
        justification: |
          A secret in the database in clear text would let anybody who reads a copy of the database make the codes of
          the person. Encrypting it with the key ring of the server keeps a copy of the database alone useless.
        tests:
          - TotpSecretProtector_ProtectAndUnprotect_RoundTripsAndHidesTheSecret

      - id: ReviewCenter-TotpSecretProtector-UserBound
        title: >-
          The TotpSecretProtector class shall refuse to decrypt the text of one user for another user.
        justification: |
          Somebody who can change the database could copy the text of their own enrollment into the row of another
          user to know that user's secret, or the other way round. Binding the text to its user makes the copy
          unreadable.
        tests:
          - TotpSecretProtector_Unprotect_ValueOfAnotherUser_IsUnreadable

      - id: ReviewCenter-TotpSecretProtector-Unreadable
        title: >-
          The TotpSecretProtector class shall report text that is damaged, forged, or encrypted with another key ring
          as unreadable, with a message that holds no secret, and shall refuse missing arguments.
        justification: |
          A lost key ring or a changed row must end in a clear refusal that an administrator can resolve by resetting
          the second factor, never in a wrong secret or in a message that leaks one.
        tests:
          - TotpSecretProtector_Unprotect_DamagedOrForeignValue_IsUnreadable
          - TotpSecretProtector_NullArguments_Throw
