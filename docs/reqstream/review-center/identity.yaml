      - id: ReviewCenter-Identity-OidcOpenPageChecked
        title: >-
          The Identity subsystem shall end the sign-in state of an open page of a user of a provider when the account
          is disabled.
        justification: |
          A page that stays open makes no request, so an open page of a disabled user of a provider must not keep
          acting; the user is held to the same check as a local user. Only the check of the open page, which belongs to
          another unit, shows this for an account created by a provider.
        tests:
          - RevalidatingAuthenticationStateProvider_IsCurrentAsync_ExternalUserDisabled_ReturnsFalse

      - id: ReviewCenter-Identity-OidcStartupSettings
        title: >-
          The Identity subsystem shall build the application when the Identity:Oidc settings of an enabled provider
          are valid, with https or with http for a loopback host.
        justification: |
          A correct provider setting must not stop the server from starting.
        tests:
          - ServerHost_CreateApplication_OidcOffOrValid_BuildsTheApplication

      - id: ReviewCenter-Identity-OidcStartupSettings-Off
        title: >-
          The Identity subsystem shall build the application without checking the Identity:Oidc settings while sign-in
          with a provider is off.
        justification: |
          A server that does not use a provider must not need any provider setting.
        tests:
          - ServerHost_CreateApplication_OidcOffOrValid_BuildsTheApplication

      - id: ReviewCenter-Identity-OidcStartupValidation
        title: >-
          The Identity subsystem shall stop the server from starting with an error that names the setting when an
          enabled provider setting is invalid.
        justification: |
          A wrong address or a missing value must be found when the server starts and not when the first person cannot
          sign in.
        tests:
          - ServerHost_CreateApplication_InvalidOidcSettings_ThrowsClearErrorWithoutSecret

      - id: ReviewCenter-Identity-OidcStartupValidation-NoSecret
        title: >-
          The Identity subsystem shall keep the client secret out of the error that stops the server because of an
          invalid provider setting.
        justification: |
          The error ends up in the log, and a secret in the log would be a leak.
        tests:
          - ServerHost_CreateApplication_InvalidOidcSettings_ThrowsClearErrorWithoutSecret

      - id: ReviewCenter-Identity-OidcClientSecretFileStartup
        title: >-
          The Identity subsystem shall stop the server from starting with an error that names the ClientSecretFile
          setting when the client secret file does not exist.
        justification: |
          A file that is wrong must be found when the server starts and not when the first person cannot sign in.
        tests:
          - ServerHost_CreateApplication_ClientSecretFileProblem_ThrowsClearErrorWithoutSecret

      - id: ReviewCenter-Identity-OidcClientSecretFileStartup-BothSet
        title: >-
          The Identity subsystem shall stop the server from starting with an error that names the ClientSecretFile
          setting when the client secret is set both inline and in a file.
        justification: |
          Two sources would leave it unclear which one is in force.
        tests:
          - ServerHost_CreateApplication_ClientSecretFileProblem_ThrowsClearErrorWithoutSecret

      - id: ReviewCenter-Identity-OidcClientSecretFileStartup-NoSecret
        title: >-
          The Identity subsystem shall keep the client secret, inline and in the file, out of the error that stops the
          server because of a problem with the client secret file.
        justification: |
          The error ends up in the log, and a secret in the log would be a leak.
        tests:
          - ServerHost_CreateApplication_ClientSecretFileProblem_ThrowsClearErrorWithoutSecret

      - id: ReviewCenter-Identity-TotpSecondFactor
        title: >-
          The Identity subsystem shall, for an account with a second factor and while the feature is on, end the
          password step of the sign-in without a session, hold the person in a short pending sign-in that is bound
          to the browser and the client address, open the session only with a right code or a recovery code, count the
          wrong
          codes in the same throttle and lockout as wrong passwords, compute and check the codes by RFC 6238 with a
          secret that is stored encrypted and bound to its user, and leave the sign-in with a provider and with an API
          token as it was.
        justification: |
          The second factor must not be a form that an attacker can skip, so no session exists before the code, the
          challenge cannot be moved to another browser, and the guessing of codes has the same limits as that of
          passwords. The secret of a person must be of no use to somebody who copies the database.
        children:
          - ReviewCenter-TotpAlgorithm-Rfc6238
          - ReviewCenter-TotpAlgorithm-Rfc6238-RandomSecrets
          - ReviewCenter-TotpAlgorithm-Rfc6238-SixDigits
          - ReviewCenter-TotpAlgorithm-Window
          - ReviewCenter-TotpAlgorithm-Window-MatchedStep
          - ReviewCenter-TotpAlgorithm-Window-OutsideWindow
          - ReviewCenter-TotpAlgorithm-Window-Malformed
          - ReviewCenter-TotpAlgorithm-Secret
          - ReviewCenter-TotpAlgorithm-Secret-Base32RoundTrip
          - ReviewCenter-TotpAlgorithm-Secret-TypedTextTolerated
          - ReviewCenter-TotpAlgorithm-Secret-NonsenseRefused
          - ReviewCenter-TotpAlgorithm-Secret-OtpauthUri
          - ReviewCenter-TotpAlgorithm-Secret-InputValidation
          - ReviewCenter-TotpSecretProtector-Encrypted
          - ReviewCenter-TotpSecretProtector-Encrypted-RoundTrip
