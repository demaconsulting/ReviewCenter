---
# Software Unit Requirements for the ReviewCenterDbContext Class
#
# The ReviewCenterDbContext class is the Entity Framework Core model that maps projects, reviews, review
# files, threads, comments, checklists, users, memberships, reviewer slots, and signatures to database tables.

sections:
  - title: ReviewCenterDbContext Unit Requirements
    requirements:
      - id: ReviewCenter-DbContext-Schema
        title: >-
          The ReviewCenterDbContext class shall map projects, reviews, and review files to tables in which a
          review is identified by its project and identifier, so that the same review identifier can exist in
          different projects.
        justification: |
          Review identifiers are chosen by users per project. A key that included only the identifier would
          force identifiers to be unique across all projects.
        tests:
          - DatabaseSetup_EnsureCreated_MissingFolder_CreatesFolderFileAndTables
          - ReviewStore_AddReviewAsync_SameIdInTwoProjects_KeepsThemApart

      - id: ReviewCenter-DbContext-Content
        title: >-
          The ReviewCenterDbContext class shall store the content of a review file as binary data, so that any
          bytes, including empty content, binary content, and Windows line endings, are stored unchanged.
        justification: |
          Review content is fingerprinted and shown byte for byte. Storing it as text would let the database
          change line endings or reject bytes that are not valid text.
        tests:
          - ReviewStore_AddReviewAsync_BinaryCrLfAndEmptyFiles_StoresBytesVerbatim

      - id: ReviewCenter-DbContext-Source
        title: >-
          The ReviewCenterDbContext class shall map the source of a review (repository identity and name,
          baseline and head commit identifiers, selection text, and the review-set identifier) and, for each review
          file, its change kind and baseline content, size, and hash, as columns that are empty for an uploaded
          review, and shall keep the baseline content as binary data like the head content.
        justification: |
          A review from a repository freezes what it covers in its own rows. Binary columns keep the baseline
          bytes unchanged, and empty columns let uploaded reviews stay what they were.
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes
          - ReviewStore_GetBaselineContentAsync_StoredFiles_ReturnsBaselineBytesOrNull
          - ReviewStore_GetRecordAsync_UploadReview_HasUploadSource
          - ReviewStore_AddReviewAsync_LongestReviewSetId_RoundTrips

      - id: ReviewCenter-DbContext-Integrity
        title: >-
          The ReviewCenterDbContext class shall make the database refuse a review whose project and identifier
          are already used, and a review whose project does not exist.
        justification: |
          Relationships and uniqueness are enforced by the database so that concurrent requests and any
          programming error cannot leave inconsistent review records.
        tests:
          - ReviewStore_AddReviewAsync_DuplicateKey_ThrowsReviewIdDuplicate
          - ReviewStore_AddReviewAsync_UnknownProject_IsNotStored

      - id: ReviewCenter-DbContext-Threads
        title: >-
          The ReviewCenterDbContext class shall map threads and comments to tables in which a thread belongs to
          an existing file of its review and a comment belongs to a thread, so that the database refuses a
          thread for a file that does not exist and deletes the comments of a deleted thread, and shall map the side
          of a thread as text with Head as the default, and shall map the kind of a comment as text with Comment as the
          default and the report flag of a comment as a column that is false by default; the kind of a thread is not
          stored, it is derived from its starting comment.
        justification: |
          A thread is about one file of one review. Having the database enforce that relationship keeps the
          record consistent even when two requests overlap or a programming error occurs. Storing the side by
          name keeps the stored value readable and independent of the order of the enumeration. A comment that was
          stored without the new columns is chat, so nothing becomes part of the signed record by accident.
        tests:
          - DatabaseSetup_EnsureCreated_MissingFolder_CreatesFolderFileAndTables
          - ReviewStore_AddThreadAsync_UnknownFile_IsRefusedByDatabase
          - ReviewStore_AddThreadAsync_Side_IsStoredAsText
          - ReviewCenterDbContext_Model_CommentColumns_DefaultToChatAndComment

      - id: ReviewCenter-DbContext-Checklist
        title: >-
          The ReviewCenterDbContext class shall map the checklist snapshot, the section states, and the check
          answers to tables in which a review has at most one state per section and one answer per check, and
          in which the rows belong to the review, so that the database refuses a second row for the same
          section or check.
        justification: |
          A check has one current answer. Having the database enforce that keeps the record consistent even when
          two requests overlap.
        tests:
          - ReviewStore_SetChecklistAnswer_UpsertsSingleRowPerItem
          - ReviewStore_SetChecklistSectionState_UpsertsSingleRowPerSection

      - id: ReviewCenter-DbContext-Users
        title: >-
          The ReviewCenterDbContext class shall map users to a table in which the user name is unique regardless
          of letter case, the system administrator right and the must-change-password flag are stored as flags, and
          the time of the last sign-in is stored as an optional time,
          and shall map the user name of the
          author of a comment, of the person who answered a check, and of the person who set a section next to the
          display name, so that the database refuses a second user whose name differs only in letter case.
        justification: |
          The database is the last line of defense against two users with the same name. The user name beside the
          display name keeps the record identifiable when the display name changes. The schema is created from the
          model without migrations, so a database that was created before the flag or the last sign-in existed has to
          be recreated.
        tests:
          - UserStore_AddAsync_UsernameOtherCase_ThrowsUserNameTakenAndLookupIgnoresCase
          - UserStore_AddAsync_User_RoundTripsEveryField
          - UserStore_AddToProjectAsync_StoresAccountMembershipAndOneEventTogether

      - id: ReviewCenter-DbContext-EvidenceSettings
        title: >-
          The ReviewCenterDbContext class shall map the evidence settings of a project to seven boolean columns of
          the project table, whose defaults are the default settings (anonymous index and anonymous attestations
          off, and the five content switches on), so that a project that was not given other settings reads back
          with the defaults and a changed setting is stored in its own column. The schema is created from the
          model without a migration, so a database that was created before the columns existed has to be recreated.
        justification: |
          The settings belong to exactly one project and are read with it, so they are columns of the project, not
          a table of their own. Defaults that make the evidence private and complete mean that nothing is opened or
          left out until a project administrator decides so. The schema is created from the model and not
          migrated while the product is not released, so development databases are recreated.
        tests:
          - ReviewStore_AddProjectAsync_NewProject_HasDefaultEvidenceSettings
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-DbContext-ProjectChecklist
        title: >-
          The ReviewCenterDbContext class shall map the checklist definition of a project to one nullable text
          column of the project table with no length limit, so that a project that was not given a definition reads
          back with none, which stands for the built-in default checklist, and a definition of any size the Core
          validation allows is stored and read back unchanged. The schema is created from the model without a
          migration, so a database that was created before the column existed has to be recreated.
        justification: |
          The definition belongs to exactly one project and is read with it, so it is a column of the project. A
          definition is a document of up to several hundred kilobytes, so the column must not be bounded. The
          schema is created from the model and not migrated while the product is not released, so development
          databases are recreated.
        tests:
          - ReviewStore_AddProjectAsync_ChecklistDefinition_IsNullByDefaultAndKeptWhenGiven
          - ReviewStore_UpdateChecklistDefinitionAsync_LargeText_RoundTripsThroughTheColumn

      - id: ReviewCenter-DbContext-DueDate
        title: >-
          The ReviewCenterDbContext class shall map the optional due date of a review to one nullable text column of
          the review table that holds the calendar day as yyyy-MM-dd, so that a review that was not given a date reads
          back with none and a date reads back as the same day. The
          schema is created from the model without a migration, so a database that was created before the column
          existed has to be recreated.
        justification: |
          The date belongs to exactly one review and is read with it, so it is a column of the review. A calendar day
          has no time zone, so storing it as text keeps it from shifting. The schema is created from the model and not
          migrated while the product is not released, so development databases are recreated.
        tests:
          - ReviewStore_AddReviewAsync_DueDate_RoundTripsAsCalendarDay

      - id: ReviewCenter-DbContext-ReviewConclusionText
        title: >-
          The ReviewCenterDbContext class shall map the optional review conclusion text of a review (the free text, not
          the approved or rejected conclusion) to one nullable text column of the review table that is limited to
          4000 characters, so that a review that was not given a text reads back with none and a text reads back
          unchanged. The schema is created from the model without a migration, so a development database that was
          created before the column existed has to be recreated.
        justification: |
          The text belongs to exactly one review and is read with it, so it is a column of the review. The limit keeps
          the signed record small and the same everywhere. The schema is created from the model and not migrated
          while the product is not released, so development databases are recreated.
        tests:
          - ReviewCenterDbContext_Model_ReviewConclusionTextColumn_IsLimitedAndOptional

      - id: ReviewCenter-DbContext-Ballots
        title: >-
          The ReviewCenterDbContext class shall map the answers and the section states with the reviewer slot in their
          key (the identity 0 for the review-level rows) and a ballot status row for each slot, keyed by project, review
          and slot, that holds the status and the time and the user name of the hand-in, and that is deleted together
          with its review or its slot. The schema is created from the model without a migration, so a development
          database that was created before the tables changed has to be recreated.
        justification: |
          Each reviewer's answer is a row of its own, so the slot is part of the key. The status row follows the life of
          its review and slot so that no ballot can outlive them. The schema is created from the model and not migrated
          while the product is not released, so development databases are recreated.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SameItemTwoSlots_StoresOneRowPerSlot
          - ReviewStore_SetBallotSectionStateAsync_PerSlotRows_RoundTrip
          - ReviewStore_RemoveSlotAsync_WithBallot_DeletesTheBallotRows

      - id: ReviewCenter-DbContext-FollowUp
        title: >-
          The ReviewCenterDbContext class shall map the review that a review follows, with the numbers of answers and
          threads it took over, to columns of the review table, with an index on the project and the followed review,
          and without a foreign key because the followed review is a reference by identifier within the project, shall
          map the review that a carried answer, a carried section and a carried thread came from, and the number of a
          carried thread in the earlier review, to nullable columns, and shall not map the carried rows that a review
          holds only until it is stored, so that a review that follows nothing reads back with none of them. The schema
          is created from the model without a migration, so a development database that was created before the columns
          existed has to be recreated.
        justification: |
          The followed review belongs to exactly one review and is read with it, so it is a column. A review that has
          been followed must not be blocked from being kept or removed by a reference, and the lookup of the reviews
          that follow a review needs the index. The schema is created from the model and not migrated while the product
          is not released, so development databases are recreated.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn
          - ReviewCenterDbContext_Model_HasIndexOnProjectAndFollowedReview

      - id: ReviewCenter-DbContext-Signatures
        title: >-
          The ReviewCenterDbContext class shall map reviewer slots and signatures to tables in which a slot and
          a signature belong to a review, and a signature belongs to a slot, so that the database refuses a slot
          or a signature for a review that does not exist, refuses to delete a slot that has a signature, and
          refuses a second signature of the same slot with the same digest. A signature shall be stored and read
          back with its role, digest, and meaning unchanged.
        justification: |
          A signature is evidence and must not lose the slot it was made for. Having the database enforce the
          relationships and the uniqueness keeps the record consistent when two requests overlap or a programming
          error occurs.
        tests:
          - ReviewStore_AddSlotAsync_UnknownReview_IsRefusedByDatabase
          - ReviewStore_RemoveSlotAsync_SignedSlot_IsRefusedByDatabase
          - ReviewStore_AddSignatureAsync_SameSlotAndDigestTwice_ThrowsSigningNotAllowed
          - ReviewStore_AddSignatureAsync_CurrentDigest_StoresAndRoundTrips

      - id: ReviewCenter-DbContext-AuditEntries
        title: >-
          The ReviewCenterDbContext class shall map the audit entries to a table keyed by the sequence number,
          never assigned by the database, so that a second entry with the same sequence is refused, with no
          relationship to any other table so that an entry survives whatever happens to the rows it describes,
          and with an index for reading the entries of one review.
        justification: |
          The key is the last defense of the hash chain against two entries with the same position, and an entry
          is a snapshot of text that must not depend on other rows.
        tests:
          - AuditStore_Database_DuplicateSequence_IsRefusedByUniqueKey
          - AuditStore_ListAsync_FilterAndCursors_ReturnExpectedEntriesNewestFirst

      - id: ReviewCenter-DbContext-Repositories
        title: >-
          The ReviewCenterDbContext class shall map the registered repositories to a table with an identity assigned
          by the database and a required project, with a name that is unique within the project regardless of letter
          case, and shall keep the token only in its encrypted form, so that the database refuses a second repository
          in the same project whose name differs only in letter case, allows the same name in two projects, and
          refuses a repository for a project that does not exist.
        justification: |
          The database is the last defense against two repositories with the same name in a project, and a token
          stored only in encrypted form is not readable in a copy of the database. A name that is unique within the
          project, not across all projects, tells nobody that another project has a repository of that name.
        tests:
          - RepositoryStore_AddAsync_Repository_RoundTripsAndAudits
          - RepositoryStore_NameOtherCase_ThrowsRepositoryNameTaken
          - RepositoryStore_ListAsync_ScopedToProject_AndNamesAreUniquePerProject

      - id: ReviewCenter-DbContext-Memberships
        title: >-
          The ReviewCenterDbContext class shall map the memberships to a table keyed by the user and the project, so
          that the database refuses a second membership of a user in a project, with the role stored by its name, and
          with relationships to the user and to the project, so that the database refuses a membership for a project
          or a user that does not exist and removes the memberships of a project or a user that is removed.
        justification: |
          The key is the last defense against two roles for one user in one project when two requests overlap, and
          the relationships keep a membership from pointing at nothing. A role stored by name stays readable and stays
          valid if the list of roles is reordered.
        tests:
          - ReviewStore_AddMembershipAsync_SecondMembership_IsRejected
          - ReviewStore_AddMembershipAsync_UnknownProject_IsRefusedByTheDatabase

      - id: ReviewCenter-DbContext-Tokens
        title: >-
          The ReviewCenterDbContext class shall map the personal access tokens to a table in which the hash is
          unique, and shall map the creator and the creation through the API of a review to
          columns of the review.
        justification: |
          The database is the last defense against two tokens with one hash, which would make the owner of a request
          ambiguous, and the creator of a review must be kept with the review to be shown and audited later.
        tests:
          - ReviewCenterDbContext_Model_HasTokenTableAndReviewCreatorColumns

      - id: ReviewCenter-DbContext-TotpTables
        title: >-
          The ReviewCenterDbContext class shall map the enrollment of the second factor to a table with one row for each
          user and the recovery codes to a table with a unique index on the user and the hash of the code, and shall
          delete both with the user.
        justification: |
          The database is the last defense against two equal recovery codes of one user, and against an enrollment that
          outlives its user.
        tests:
          - TotpStore_ConfirmAsync_DuplicateHash_IsRefusedByTheDatabaseAndRolledBack
          - TotpStore_DeletingTheUser_DeletesTheEnrollmentAndCodes

      - id: ReviewCenter-DbContext-ExternalIdentity
        title: >-
          The ReviewCenterDbContext class shall map the issuer and the subject of the identity of a user at a provider
          to columns of the user, with a unique index on the pair for the users that have one.
        justification: |
          The database is the last defense against two accounts for one identity at a provider, while any number of
          local accounts, which have no such identity, must remain possible.
        tests:
          - UserStore_AddAsync_SameExternalIdentityTwice_IsRefused

      - id: ReviewCenter-DbContext-ReviewRules
        title: >-
          The ReviewCenterDbContext class shall map the setting that requires independent reviewers to a boolean column
          of the project table whose value comes from the project, on for a project that was not given another value,
          so that a changed setting is stored in its own column. The schema is created from the model without a
          migration, so a database that was created before the column existed has to be recreated.
        justification: |
          The setting belongs to exactly one project and is read with it. The value is not declared as a database
          default, so the default of the project type is the only one and a stored false is never mistaken for an
          unset value. The schema is not migrated while the product is not released, so development databases are
          recreated.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-DbContext-ReviewRuleColumns
        title: >-
          The ReviewCenterDbContext class shall map the two further review rules of a project (authors answering the
          checklist of their own review, and the person who reopened a review signing it again) to boolean columns of
          the project table whose value comes from the project, on for a project that was not given another value, so
          that a changed rule is stored in its own column. The schema is created from the model without a migration,
          so a database that was created before the columns existed has to be recreated.
        justification: |
          Each rule belongs to exactly one project and is read with it. The values are not declared as database
          defaults, so the default of the project type is the only one and a stored false is never mistaken for an
          unset value. The schema is not migrated while the product is not released, so development databases are
          recreated.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet
          - ReviewStore_AddProjectAsync_NewReviewRules_AreStoredAndReturned

      - id: ReviewCenter-DbContext-ReviewReopens
        title: >-
          The ReviewCenterDbContext class shall map the reopenings of a review to a table in which each row belongs to
          a review and is deleted with it, holds the user name, display name, time, reason, and digest of the approved
          record, and is found by project and review, so that the database refuses a reopening of a review that does
          not exist. The schema is created from the model without a migration, so a database that was created before
          the table existed has to be recreated.
        justification: |
          The history of reopenings is evidence that belongs to one review. Having the database enforce the
          relationship keeps the record consistent when two requests overlap or a programming error occurs.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-DbContext-ReviewUserState
        title: >-
          The ReviewCenterDbContext class shall map what a user has seen of a review to a table in which each row
          belongs to one user and one review, is found by that pair, holds the newest comment and the time seen, and
          is deleted with the review or the user. The schema is created from the model without a migration, so a
          database that was created before the table existed has to be recreated.
        justification: |
          The inbox keeps one row per user and review, and it doubles as the list of notifications, so no other table
          is needed. Having the database own the relationships keeps the rows consistent when requests overlap.
        tests:
          - DatabaseSetup_EnsureCreated_CreatesReviewUserStateTableAndInboxIndexes
          - InboxStore_DeletingTheReview_DeletesTheStates
          - InboxStore_DeletingTheUser_DeletesTheStates

      - id: ReviewCenter-DbContext-InboxIndexes
        title: >-
          The ReviewCenterDbContext class shall index the primary and the alternate user of the reviewer slots and the
          creator of the reviews, so that the reviews of one user are found without reading all of them.
        justification: |
          The inbox is built on every visit of the home page, so the lookup by user must not scan the tables.
        tests:
          - DatabaseSetup_EnsureCreated_CreatesReviewUserStateTableAndInboxIndexes
