---
# Software Unit Requirements for the ReviewCenterDbContext Class
#
# The ReviewCenterDbContext class is the Entity Framework Core model that maps projects, reviews, review
# files, threads, comments, checklists, users, reviewer slots, and signatures to database tables.

sections:
  - title: ReviewCenterDbContext Unit Requirements
    requirements:
      - id: ReviewCenter-DbContext-Schema
        title: >-
          The ReviewCenterDbContext class shall map projects, reviews, and review files to tables in which a
          review is identified by its project and identifier, so that the same review identifier can exist in
          different projects.
        justification: |
          Review identifiers are chosen by users per project. A key that included only the identifier would
          force identifiers to be unique across all projects.
        tests:
          - DatabaseSetup_EnsureCreated_MissingFolder_CreatesFolderFileAndTables
          - ReviewStore_AddReviewAsync_SameIdInTwoProjects_KeepsThemApart

      - id: ReviewCenter-DbContext-Content
        title: >-
          The ReviewCenterDbContext class shall store the content of a review file as binary data, so that any
          bytes, including empty content, binary content, and Windows line endings, are stored unchanged.
        justification: |
          Review content is fingerprinted and shown byte for byte. Storing it as text would let the database
          change line endings or reject bytes that are not valid text.
        tests:
          - ReviewStore_AddReviewAsync_BinaryCrLfAndEmptyFiles_StoresBytesVerbatim

      - id: ReviewCenter-DbContext-Source
        title: >-
          The ReviewCenterDbContext class shall map the source of a review (repository identity and name,
          baseline and head commit identifiers, selection text, and the review-set identifier) and, for each review
          file, its change kind and baseline content, size, and hash, as columns that are empty for an uploaded
          review, and shall keep the baseline content as binary data like the head content.
        justification: |
          A review from a repository freezes what it covers in its own rows. Binary columns keep the baseline
          bytes unchanged, and empty columns let uploaded reviews stay what they were.
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes
          - ReviewStore_GetBaselineContentAsync_StoredFiles_ReturnsBaselineBytesOrNull
          - ReviewStore_GetRecordAsync_UploadReview_HasUploadSource
          - ReviewStore_AddReviewAsync_LongestReviewSetId_RoundTrips

      - id: ReviewCenter-DbContext-Integrity
        title: >-
          The ReviewCenterDbContext class shall make the database refuse a review whose project and identifier
          are already used, and a review whose project does not exist.
        justification: |
          Relationships and uniqueness are enforced by the database so that concurrent requests and any
          programming error cannot leave inconsistent review records.
        tests:
          - ReviewStore_AddReviewAsync_DuplicateKey_ThrowsReviewIdDuplicate
          - ReviewStore_AddReviewAsync_UnknownProject_IsNotStored

      - id: ReviewCenter-DbContext-Threads
        title: >-
          The ReviewCenterDbContext class shall map threads and comments to tables in which a thread belongs to
          an existing file of its review and a comment belongs to a thread, so that the database refuses a
          thread for a file that does not exist and deletes the comments of a deleted thread, and shall map the side
          of a thread as text with Head as the default.
        justification: |
          A thread is about one file of one review. Having the database enforce that relationship keeps the
          record consistent even when two requests overlap or a programming error occurs. Storing the side by
          name keeps the stored value readable and independent of the order of the enumeration.
        tests:
          - DatabaseSetup_EnsureCreated_MissingFolder_CreatesFolderFileAndTables
          - ReviewStore_AddThreadAsync_UnknownFile_IsRefusedByDatabase
          - ReviewStore_AddThreadAsync_Side_IsStoredAsText

      - id: ReviewCenter-DbContext-Checklist
        title: >-
          The ReviewCenterDbContext class shall map the checklist snapshot, the section states, and the check
          answers to tables in which a review has at most one state per section and one answer per check, and
          in which the rows belong to the review, so that the database refuses a second row for the same
          section or check.
        justification: |
          A check has one current answer. Having the database enforce that keeps the record consistent even when
          two requests overlap.
        tests:
          - ReviewStore_SetChecklistAnswer_UpsertsSingleRowPerItem
          - ReviewStore_SetChecklistSectionState_UpsertsSingleRowPerSection

      - id: ReviewCenter-DbContext-Users
        title: >-
          The ReviewCenterDbContext class shall map users to a table in which the user name is unique regardless
          of letter case and the role is stored by its name, and shall map the user name of the author of a
          comment, of the person who answered a check, and of the person who set a section next to the display
          name, so that the database refuses a second user whose name differs only in letter case.
        justification: |
          The database is the last line of defense against two users with the same name, and a role stored by
          name stays readable and stays valid if the list of roles is reordered. The user name beside the display
          name keeps the record identifiable when the display name changes.
        tests:
          - UserStore_AddAsync_UsernameOtherCase_ThrowsUserNameTakenAndLookupIgnoresCase
          - UserStore_AddAsync_User_RoundTripsEveryField

      - id: ReviewCenter-DbContext-Signatures
        title: >-
          The ReviewCenterDbContext class shall map reviewer slots and signatures to tables in which a slot and
          a signature belong to a review, and a signature belongs to a slot, so that the database refuses a slot
          or a signature for a review that does not exist, refuses to delete a slot that has a signature, and
          refuses a second signature of the same slot with the same digest. A signature shall be stored and read
          back with its role, digest, and meaning unchanged.
        justification: |
          A signature is evidence and must not lose the slot it was made for. Having the database enforce the
          relationships and the uniqueness keeps the record consistent when two requests overlap or a programming
          error occurs.
        tests:
          - ReviewStore_AddSlotAsync_UnknownReview_IsRefusedByDatabase
          - ReviewStore_RemoveSlotAsync_SignedSlot_IsRefusedByDatabase
          - ReviewStore_AddSignatureAsync_SameSlotAndDigestTwice_ThrowsSigningNotAllowed
          - ReviewStore_AddSignatureAsync_CurrentDigest_StoresAndRoundTrips

      - id: ReviewCenter-DbContext-AuditEntries
        title: >-
          The ReviewCenterDbContext class shall map the audit entries to a table keyed by the sequence number,
          never assigned by the database, so that a second entry with the same sequence is refused, with no
          relationship to any other table so that an entry survives whatever happens to the rows it describes,
          and with an index for reading the entries of one review.
        justification: |
          The key is the last defense of the hash chain against two entries with the same position, and an entry
          is a snapshot of text that must not depend on other rows.
        tests:
          - AuditStore_Database_DuplicateSequence_IsRefusedByUniqueKey
          - AuditStore_ListAsync_FilterAndCursors_ReturnExpectedEntriesNewestFirst

      - id: ReviewCenter-DbContext-Repositories
        title: >-
          The ReviewCenterDbContext class shall map the registered repositories to a table with an identity assigned
          by the database and a name that is unique regardless of letter case, and shall keep the token only in its
          encrypted form, so that the database refuses a second repository whose name differs only in letter case.
        justification: |
          The database is the last defense against two repositories with the same name, and a token stored only in
          encrypted form is not readable in a copy of the database.
        tests:
          - RepositoryStore_AddAsync_Repository_RoundTripsAndAudits
          - RepositoryStore_NameOtherCase_ThrowsRepositoryNameTaken
