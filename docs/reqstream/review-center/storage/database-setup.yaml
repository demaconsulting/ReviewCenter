---
# Software Unit Requirements for the DatabaseSetup Class
#
# The DatabaseSetup class turns the database settings into a provider and connection, and creates the database
# on first use.

sections:
  - title: DatabaseSetup Unit Requirements
    requirements:
      - id: ReviewCenter-DatabaseSetup-Location
        title: >-
          The DatabaseSetup class shall default the database file to reviewcenter.db in a ReviewCenter folder of
          the per-user application data folder, or in a data folder beside the application when the system has
          no application data folder.
        justification: |
          A new installation must store its data in a predictable place that the user can write to, without any
          configuration. Some service accounts have no home folder, so a fallback is needed.
        tests:
          - DatabaseSetup_GetDefaultDatabasePath_WithDataFolder_UsesAppDataSubfolder
          - DatabaseSetup_GetDefaultDatabasePath_WithoutDataFolder_FallsBackToBaseDirectory

      - id: ReviewCenter-DatabaseSetup-Connection
        title: >-
          The DatabaseSetup class shall use the default database file when no connection string is configured,
          shall treat a configured value without an equals sign as a database file path, shall use any
          other configured value as the full connection string, and shall reject an in-memory database with an
          error that asks for a file path.
        justification: |
          Operators need the simplest setting for the common case, a file path, and the full connection string
          for options such as pooling. An in-memory SQLite database gives every connection its own empty
          database, so accepting it would start a server that cannot serve any data.
        tests:
          - DatabaseSetup_ResolveConnectionString_Empty_UsesDefaultFile
          - DatabaseSetup_ResolveConnectionString_PlainPath_BecomesDataSource
          - DatabaseSetup_ResolveConnectionString_FullConnectionString_IsUsedAsIs
          - DatabaseSetup_ResolveConnectionString_InMemory_ThrowsClearError

      - id: ReviewCenter-DatabaseSetup-Provider
        title: >-
          The DatabaseSetup class shall accept the provider name Sqlite in any letter case and shall reject any
          other provider with an error that names it and lists the supported providers.
        justification: |
          SQLite is the only implemented provider. Failing clearly for any other name prevents data from going
          to a database the operator did not intend, and leaves one place to extend for other providers.
        tests:
          - DatabaseSetup_Configure_UnsupportedProvider_ThrowsClearError
          - DatabaseSetup_Configure_ProviderInOtherCase_IsAccepted
          - DatabaseSetup_EnsureCreated_UnsupportedProvider_ThrowsAndCreatesNothing

      - id: ReviewCenter-DatabaseSetup-Create
        title: >-
          The DatabaseSetup class shall create the database folder, file, and tables when they do not exist, and shall
          tell without creating anything whether the configured database file is missing, and shall give the connection
          string of the database with the open mode forced to read-only.
        justification: |
          A new installation must work on first start without manual database setup, while a command that only reads
          the data (the audit check) must be able to tell that the file is not there, and must open it in a way that
          cannot create it, instead of creating an empty database.
        tests:
          - DatabaseSetup_EnsureCreated_MissingFolder_CreatesFolderFileAndTables
          - DatabaseSetup_TryGetMissingDatabaseFile_MissingExistingAndUnsupported_ReportsWithoutCreating
          - DatabaseSetup_ResolveReadOnlyConnectionString_MissingFile_IsReadOnlyAndNeverCreates

      - id: ReviewCenter-DatabaseSetup-DataDirectory
        title: >-
          The DatabaseSetup class shall give the folder of the configured database file, or the folder of the default
          database file when the settings name no usable file, as the base for the other data of the server.
        justification: |
          The encryption keys and the git cache belong with the database, so that moving or backing up the data folder
          keeps them together, without further configuration.
        tests:
          - DatabaseSetup_ResolveDataDirectory_Configured_IsFolderOfTheDatabaseFile
