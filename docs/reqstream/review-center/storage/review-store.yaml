---
# Software Unit Requirements for the ReviewStore Class
#
# The ReviewStore class is the database implementation of the Core store interface.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>. The words "in one transaction", "set-based read" and "same
# assembly" of the former texts are kept in the justifications: the unit requirements state what a caller can observe.

sections:
  - title: ReviewStore Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # Projects: save, read, list
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Projects
        title: >-
          The ReviewStore class shall save a project so that a later read returns its name, description, and creation
          time as saved.
        justification: |
          A project page must show the project exactly as it was created.
        tests:
          - ReviewStore_AddProjectAsync_ValidProject_RoundTrips

      - id: ReviewCenter-ReviewStore-Projects-IdAssigned
        title: >-
          The ReviewStore class shall assign the identifier of a saved project itself and ignore any identifier that
          the caller supplied.
        justification: |
          Identifiers belong to the database alone, so a caller can never overwrite or collide with an existing
          project.
        tests:
          - ReviewStore_AddProjectAsync_SuppliedId_IsIgnoredAndDatabaseAssignsOwn

      - id: ReviewCenter-ReviewStore-Projects-Unknown
        title: >-
          The ReviewStore class shall return nothing when a project is read by an identifier that does not exist.
        justification: |
          Pages must tell a missing project from an existing one.
        tests:
          - ReviewStore_GetProjectAsync_UnknownId_ReturnsNull

      - id: ReviewCenter-ReviewStore-Projects-List
        title: >-
          The ReviewStore class shall list projects ordered by name.
        justification: |
          Pages list projects in a stable, predictable order.
        tests:
          - ReviewStore_ListProjectsAsync_SeveralProjects_OrdersByName

      # ---------------------------------------------------------------------------------------------------------------
      # Reviews: save, scope, list
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Reviews
        title: >-
          The ReviewStore class shall save a review with its files so that the content of every file, binary, CRLF, and
          empty content included, is read back byte for byte.
        justification: |
          A review must be saved together with all of its files or not at all, and the reviewer must see the bytes
          that were uploaded.
        tests:
          - ReviewStore_AddReviewAsync_BinaryCrLfAndEmptyFiles_StoresBytesVerbatim

      - id: ReviewCenter-ReviewStore-Reviews-ProjectScope
        title: >-
          The ReviewStore class shall keep the reviews of different projects apart even when their identifiers are the
          same.
        justification: |
          A review identifier is unique within its project only, so two projects can each have a review of the same
          name without seeing each other's files.
        tests:
          - ReviewStore_AddReviewAsync_SameIdInTwoProjects_KeepsThemApart

      - id: ReviewCenter-ReviewStore-Reviews-List
        title: >-
          The ReviewStore class shall list the reviews of one project only.
        justification: |
          A project page must show exactly the reviews of that project and no review that another project owns.
        tests:
          - ReviewStore_ListReviewsAsync_TwoProjects_ReturnsOnlyOwnReviewsOrderedById

      - id: ReviewCenter-ReviewStore-Reviews-ListOrder
        title: >-
          The ReviewStore class shall list the reviews of a project in ascending order of review identifier.
        justification: |
          A fixed order lets a reader find a review at the same place on each visit, whatever the order in which the
          rows were stored.
        tests:
          - ReviewStore_ListReviewsAsync_TwoProjects_ReturnsOnlyOwnReviewsOrderedById

      # ---------------------------------------------------------------------------------------------------------------
      # Metadata: a review without the bytes of its files
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Metadata
        title: >-
          The ReviewStore class shall return a review with the path, size, and hash of its files but without their
          content.
        justification: |
          A review can hold tens of megabytes. Lists and detail pages need only file metadata.
        tests:
          - ReviewStore_GetReviewAsync_StoredReview_ReturnsMetadataWithoutContent

      - id: ReviewCenter-ReviewStore-Metadata-FileContent
        title: >-
          The ReviewStore class shall return the content of one file of a review on request.
        justification: |
          Content is read one file at a time, when a reviewer asks to see it.
        tests:
          - ReviewStore_AddReviewAsync_BinaryCrLfAndEmptyFiles_StoresBytesVerbatim

      - id: ReviewCenter-ReviewStore-Metadata-UnknownReview
        title: >-
          The ReviewStore class shall return nothing when a review is read that does not exist.
        justification: |
          Pages must tell a missing review from an existing one.
        tests:
          - ReviewStore_GetReviewAsync_UnknownReviewOrFile_ReturnsNull

      - id: ReviewCenter-ReviewStore-Metadata-UnknownFile
        title: >-
          The ReviewStore class shall return nothing when the content of a file is read that the review does not have.
        justification: |
          The file page must tell a missing file from an empty file.
        tests:
          - ReviewStore_GetReviewAsync_UnknownReviewOrFile_ReturnsNull

      # ---------------------------------------------------------------------------------------------------------------
      # Source: where a review from a repository came from
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Source
        title: >-
          The ReviewStore class shall save the source of a review from a repository (repository identity and name,
          baseline and head commit identifiers, selection text, and the review-set identifier) and return it as saved.
        justification: |
          The source must come back as saved, because the review page, the history, and the record digest all show it.
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes
          - ReviewStore_AddReviewAsync_LongestReviewSetId_RoundTrips

      - id: ReviewCenter-ReviewStore-Source-FileChange
        title: >-
          The ReviewStore class shall save for each file of a review from a repository its change kind and the size and
          hash of its baseline content, and return them with the file.
        justification: |
          The change kind and the baseline hash tell the reviewer what happened to the file without loading any
          content.
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes

      - id: ReviewCenter-ReviewStore-Source-NoContent
        title: >-
          The ReviewStore class shall return a review from a repository without the head content and without the
          baseline content of its files.
        justification: |
          The frozen baseline is as large as the head content, so neither is read with the metadata.
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes

      - id: ReviewCenter-ReviewStore-Source-BaselineContent
        title: >-
          The ReviewStore class shall return the baseline content of one file only on request.
        justification: |
          The baseline is read one file at a time, like the head content, when a reviewer asks to see the change.
        tests:
          - ReviewStore_GetBaselineContentAsync_StoredFiles_ReturnsBaselineBytesOrNull

      - id: ReviewCenter-ReviewStore-Source-NoBaseline
        title: >-
          The ReviewStore class shall return nothing for the baseline content of a file that has no baseline.
        justification: |
          An added file has no baseline, and the file page must tell that from an empty baseline.
        tests:
          - ReviewStore_GetBaselineContentAsync_StoredFiles_ReturnsBaselineBytesOrNull

      # ---------------------------------------------------------------------------------------------------------------
      # Duplicate: the same review identifier twice
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Duplicate
        title: >-
          The ReviewStore class shall refuse to save a review whose project and identifier already exist, with a
          domain rule exception that names the duplicate identifier rule.
        justification: |
          When two requests create the same review identifier at the same moment, the database refuses the
          second one. The caller must receive the same rule violation as for the ordinary duplicate check, so
          that the user sees one consistent message.
        tests:
          - ReviewStore_AddReviewAsync_DuplicateKey_ThrowsReviewIdDuplicate

      # ---------------------------------------------------------------------------------------------------------------
      # Threads: discussions about the files of a review
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Threads
        title: >-
          The ReviewStore class shall save a thread with its first comment so that a later listing returns its file,
          lines, state, and creation time, and the text and time of the comment, as saved.
        justification: |
          Pages show the threads of a review as they were written, and a thread must be saved together with its first
          comment or not at all.
        tests:
          - ReviewStore_AddThreadAsync_WholeFileAndRange_RoundTripsWithComments

      - id: ReviewCenter-ReviewStore-Threads-Ids
        title: >-
          The ReviewStore class shall assign the identifiers of a saved thread and of its first comment itself and
          ignore any identifiers that the caller supplied.
        justification: |
          Identifiers belong to the database alone, so a caller can never overwrite or collide with an existing thread
          or comment.
        tests:
          - ReviewStore_AddThreadAsync_WholeFileAndRange_RoundTripsWithComments

      - id: ReviewCenter-ReviewStore-Threads-AddComment
        title: >-
          The ReviewStore class shall append a comment to a thread of a review so that the thread lists its comments in
          the order in which they were added.
        justification: |
          A discussion reads as a conversation only when the comments keep their order.
        tests:
          - ReviewStore_AddCommentAsync_ExistingThread_AppendsInOrder

      - id: ReviewCenter-ReviewStore-Threads-UnknownComment
        title: >-
          The ReviewStore class shall return nothing when a comment is added to a thread that does not exist in the
          stated review.
        justification: |
          The caller must be told that no comment was added, so that it does not show one that is not there.
        tests:
          - ReviewStore_AddCommentAsync_UnknownOrOtherReviewThread_ReturnsNull

      - id: ReviewCenter-ReviewStore-Threads-UnknownCommentNothingStored
        title: >-
          The ReviewStore class shall leave the thread of the stated review with its single comment when a comment is
          added to a thread that does not exist in that review.
        justification: |
          A comment for a thread of another review would put text into a discussion that the caller may not see.
        tests:
          - ReviewStore_AddCommentAsync_UnknownOrOtherReviewThread_ReturnsNull

      - id: ReviewCenter-ReviewStore-Threads-Reopen
        title: >-
          The ReviewStore class shall change a resolved thread of a review to open when it is reopened.
        justification: |
          A reviewer who finds the resolution wrong must be able to continue the discussion.
        tests:
          - ReviewStore_ReopenThreadAsync_ExistingAndUnknown_ReopensOrReturnsFalse
          - ReviewStore_ThreadStateMethods_CannotResolveWithoutNote_ReopenStillWorks

      - id: ReviewCenter-ReviewStore-Threads-UnknownReopen
        title: >-
          The ReviewStore class shall report false when a thread is reopened that does not exist in the stated review.
        justification: |
          The caller must be able to tell a reopening that happened from one that found nothing.
        tests:
          - ReviewStore_ReopenThreadAsync_ExistingAndUnknown_ReopensOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Threads-List
        title: >-
          The ReviewStore class shall list the threads of one review with their comments in creation order.
        justification: |
          Pages show the threads of a review in a stable order.
        tests:
          - ReviewStore_ListThreadsAsync_TwoReviews_ReturnsOnlyOwnThreadsInOrder

      - id: ReviewCenter-ReviewStore-Threads-ListIsolation
        title: >-
          The ReviewStore class shall keep the threads of different reviews apart, so that the listing of one review
          returns none of the threads of another.
        justification: |
          A review page must show exactly the discussions of that review.
        tests:
          - ReviewStore_ListThreadsAsync_TwoReviews_ReturnsOnlyOwnThreadsInOrder

      - id: ReviewCenter-ReviewStore-Threads-Author
        title: >-
          The ReviewStore class shall keep the user name and the display name of the author of each comment.
        justification: |
          The user name keeps an author identifiable when the display name later changes.
        tests:
          - ReviewStore_AddThreadAsync_WholeFileAndRange_RoundTripsWithComments

      - id: ReviewCenter-ReviewStore-Threads-CommentKind
        title: >-
          The ReviewStore class shall keep the kind of each comment, a comment or a resolution.
        justification: |
          The kind tells a note that closes a discussion from a plain remark, and must come back as it was saved.
        tests:
          - ReviewStore_AddThreadAsync_IncludedComment_PersistsFlagAndKind
          - ReviewStore_ResolveThreadAsync_FindingWithNote_StoresIncludedResolutionAndAudits

      - id: ReviewCenter-ReviewStore-Threads-ReportFlag
        title: >-
          The ReviewStore class shall keep for each comment whether it is included in the report.
        justification: |
          The flag decides what the signed record covers, so it must come back exactly as it was saved.
        tests:
          - ReviewStore_AddThreadAsync_IncludedComment_PersistsFlagAndKind
          - ReviewStore_AddCommentAsync_IncludedReply_PersistsFlag

      - id: ReviewCenter-ReviewStore-Threads-ThreadKind
        title: >-
          The ReviewStore class shall give a thread the kind Finding when its starting comment is included in the
          report and the kind Question when it is not.
        justification: |
          The kind of a thread follows from the report flag of its starting comment, so that the two can never
          disagree.
        tests:
          - ReviewStore_GetRecordAsync_ThreadKind_DerivedFromStartingComment
          - ReviewStore_AddThreadAsync_IncludedComment_PersistsFlagAndKind

      - id: ReviewCenter-ReviewStore-Threads-Side
        title: >-
          The ReviewStore class shall keep for each thread the side, head or baseline, that it was anchored to.
        justification: |
          The side says which text the lines of a thread belong to, and must come back as it was saved.
        tests:
          - ReviewStore_AddThreadAsync_Side_IsPersisted
          - ReviewStore_AddThreadAsync_Side_IsStoredAsText

      # ---------------------------------------------------------------------------------------------------------------
      # CheckThreads: discussions about a check of the checklist
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-CheckThreads
        title: >-
          The ReviewStore class shall save a thread about a check of the checklist with the identifier of the check and
          return that identifier on a later read.
        justification: |
          A discussion about a check is a thread of the review that is tied to the check and not to a file.
        tests:
          - ReviewStore_AddThreadAsync_CheckThread_RoundTripsCheckItemId

      - id: ReviewCenter-ReviewStore-CheckThreads-NoFile
        title: >-
          The ReviewStore class shall return a thread about a check with an empty file path and without lines.
        justification: |
          A thread about a check has no file, so pages must not show a file or a line range for it.
        tests:
          - ReviewStore_AddThreadAsync_CheckThread_RoundTripsCheckItemId

      - id: ReviewCenter-ReviewStore-CheckThreads-BothOrNeither
        title: >-
          The ReviewStore class shall refuse with an ArgumentException a thread that names both a file and a check, or
          neither.
        justification: |
          A thread has exactly one anchor, either a file or a check. The database does not tie a thread to a file, so
          the store keeps this rule.
        tests:
          - ReviewStore_AddThreadAsync_ThreadWithBothOrNeitherAnchor_IsRefused

      - id: ReviewCenter-ReviewStore-CheckThreads-MissingFile
        title: >-
          The ReviewStore class shall refuse with an InvalidOperationException a thread on a file that the review does
          not have.
        justification: |
          A file thread must name a file of its own review. The database no longer ties a thread to a file, so the
          store keeps this rule.
        tests:
          - ReviewStore_AddThreadAsync_FileThreadOnMissingFile_IsRefused

      - id: ReviewCenter-ReviewStore-CheckThreads-NothingSaved
        title: >-
          The ReviewStore class shall save nothing when it refuses a thread because of its anchor.
        justification: |
          A thread that is refused for its anchor must not leave a row with a wrong anchor, which a review page would
          show as a discussion about nothing.
        tests:
          - ReviewStore_AddThreadAsync_FileThreadOnMissingFile_IsRefused
          - ReviewStore_AddThreadAsync_ThreadWithBothOrNeitherAnchor_IsRefused

      - id: ReviewCenter-ReviewStore-CheckThreads-SignatureBlocked
        title: >-
          The ReviewStore class shall refuse the final signature of a review while a thread about a check is open.
        justification: |
          A discussion about a check blocks the signature like any other open thread.
        tests:
          - ReviewStore_Conclude_OpenCheckThread_IsRefusedInTheTransaction

      # ---------------------------------------------------------------------------------------------------------------
      # ThreadCreation: a new thread is always open
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-ThreadCreation
        title: >-
          The ReviewStore class shall refuse with an ArgumentException a new thread that is not open.
        justification: |
          The rules of resolving a thread (the note, the kind, the lock of a concluded review) and the Resolution
          comment live only in the resolve method, so a thread that arrives resolved would bypass all of them.
        tests:
          - ReviewStore_AddThreadAsync_ResolvedThread_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ThreadCreation-NoComment
        title: >-
          The ReviewStore class shall refuse with an ArgumentException a new thread that has no comment.
        justification: |
          A thread without a comment cannot be reported, audited, or given a kind, which all start from its first
          comment.
        tests:
          - ReviewStore_AddThreadAsync_ThreadWithoutComment_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ThreadCreation-NothingSaved
        title: >-
          The ReviewStore class shall save nothing when it refuses a new thread because it is not open or has no
          comment.
        justification: |
          A thread that is refused because it is resolved or has no comment must not leave a row that a later read
          lists as a discussion of the review.
        tests:
          - ReviewStore_AddThreadAsync_ResolvedThread_IsRefusedAndStoresNothing
          - ReviewStore_AddThreadAsync_ThreadWithoutComment_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ThreadCreation-NoAuditEntry
        title: >-
          The ReviewStore class shall record no audit entry when it refuses a new thread because it is not open or has
          no comment.
        justification: |
          A refused thread is not an event of the review, so an entry for it would claim that a thread was started
          that never existed.
        tests:
          - ReviewStore_AddThreadAsync_ResolvedThread_IsRefusedAndStoresNothing
          - ReviewStore_AddThreadAsync_ThreadWithoutComment_IsRefusedAndStoresNothing

      # ---------------------------------------------------------------------------------------------------------------
      # ThreadReport: resolve a thread, promote or demote it, flag a reply
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-ThreadReport
        title: >-
          The ReviewStore class shall resolve a thread by saving the Resolution comment that carries the note and
          setting the state of the thread to resolved.
        justification: |
          Writing the state and the note together keeps them from disagreeing.
        tests:
          - ReviewStore_ResolveThreadAsync_FindingWithNote_StoresIncludedResolutionAndAudits

      - id: ReviewCenter-ReviewStore-ThreadReport-KindChanged
        title: >-
          The ReviewStore class shall refuse with the RecordChanged rule the resolution of a thread whose kind is not
          the kind the caller expected.
        justification: |
          The check of the service is made before the write, so another request can change the thread in between.
          The note, the acknowledgement of the signatures, and the report flag were decided for the kind the service
          saw, so a changed kind must be refused and not accepted silently.
        tests:
          - ReviewStore_ResolveThreadAsync_KindChangedSinceRead_ThrowsRecordChangedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ThreadReport-KindChangedNothingStored
        title: >-
          The ReviewStore class shall leave the thread open, store no comment, and record no audit entry when it
          refuses a resolution because the kind of the thread changed.
        justification: |
          A refused resolution must not leave a note or an audit entry behind.
        tests:
          - ReviewStore_ResolveThreadAsync_KindChangedSinceRead_ThrowsRecordChangedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ThreadReport-NoteRequired
        title: >-
          The ReviewStore class shall refuse with the ResolutionNoteRequired rule the resolution of a Finding without a
          note.
        justification: |
          A Finding must be closed with a note that explains how it was dealt with.
        tests:
          - ReviewStore_ResolveThreadAsync_FindingWithoutResolution_ThrowsResolutionNoteRequired

      - id: ReviewCenter-ReviewStore-ThreadReport-NoteRequiredNothingStored
        title: >-
          The ReviewStore class shall leave the thread open and store no comment and no audit entry when it refuses the
          resolution of a Finding because the resolution comment is missing.
        justification: |
          A refused resolution that left a comment or an entry behind would show a Finding as dealt with, or in the
          history as resolved, although it was never closed.
        tests:
          - ReviewStore_ResolveThreadAsync_FindingWithoutResolution_ThrowsResolutionNoteRequired

      - id: ReviewCenter-ReviewStore-ThreadReport-PromoteNoteRequired
        title: >-
          The ReviewStore class shall refuse with the ResolutionNoteRequired rule the promotion of a resolved Question
          that has no resolution note.
        justification: |
          A promoted Question becomes a Finding, and a resolved Finding must have a note.
        tests:
          - ReviewStore_SetThreadKindAsync_ResolvedQuestionWithoutNote_ThrowsResolutionNoteRequired

      - id: ReviewCenter-ReviewStore-ThreadReport-PromoteNoteRequiredNothingStored
        title: >-
          The ReviewStore class shall leave the kind and the report flag of the thread unchanged and store no audit
          entry when it refuses a promotion because the promotion note is missing.
        justification: |
          A half-applied promotion would put a Question without a note into the report as a Finding, and an entry
          would claim a change of kind that did not happen.
        tests:
          - ReviewStore_SetThreadKindAsync_ResolvedQuestionWithoutNote_ThrowsResolutionNoteRequired

      - id: ReviewCenter-ReviewStore-ThreadReport-OnlyResolve
        title: >-
          The ReviewStore class shall not set a thread to resolved by any write other than the resolution.
        justification: |
          The resolution-note rule must hold for every resolution, so no other write may set a thread to resolved.
        tests:
          - ReviewStore_ThreadStateMethods_CannotResolveWithoutNote_ReopenStillWorks

      - id: ReviewCenter-ReviewStore-ThreadReport-OnlyResolve-ReopenNotResolve
        title: >-
          The ReviewStore class shall not set a thread to resolved when it is reopened.
        justification: |
          Reopening continues a discussion, so a thread that came back as resolved from the reopening would hide the
          work that the reviewer has just taken up again.
        tests:
          - ReviewStore_ThreadStateMethods_CannotResolveWithoutNote_ReopenStillWorks

      - id: ReviewCenter-ReviewStore-ThreadReport-AlreadyResolved
        title: >-
          The ReviewStore class shall report false when a thread that is already resolved is resolved.
        justification: |
          A second submit of the same resolution must be told apart from the resolution that took effect.
        tests:
          - ReviewStore_ResolveThreadAsync_AlreadyResolved_ReturnsFalseAndAddsNothing

      - id: ReviewCenter-ReviewStore-ThreadReport-AlreadyResolvedNoComment
        title: >-
          The ReviewStore class shall add no comment when a thread that is already resolved is resolved.
        justification: |
          A second submit of the same resolution must not add a second note to the discussion.
        tests:
          - ReviewStore_ResolveThreadAsync_AlreadyResolved_ReturnsFalseAndAddsNothing

      - id: ReviewCenter-ReviewStore-ThreadReport-AlreadyResolvedNoAudit
        title: >-
          The ReviewStore class shall record no audit entry when a thread that is already resolved is resolved.
        justification: |
          A second submit of a resolution changes nothing, so an entry would say that the thread was resolved twice.
        tests:
          - ReviewStore_ResolveThreadAsync_AlreadyResolved_ReturnsFalseAndAddsNothing

      - id: ReviewCenter-ReviewStore-ThreadReport-Promote
        title: >-
          The ReviewStore class shall promote a thread to a Finding by including its starting comment and all its
          Resolution comments in the report.
        justification: |
          The kind of a thread follows from the report flag of its comments, so promoting must set the flag of all of
          them together.
        tests:
          - ReviewStore_SetThreadKindAsync_PromoteDemote_UpdatesStartingAndResolutionComments

      - id: ReviewCenter-ReviewStore-ThreadReport-Demote
        title: >-
          The ReviewStore class shall demote a thread to a Question by excluding its starting comment and all its
          Resolution comments from the report.
        justification: |
          The kind of a thread follows from the report flag of its comments, so demoting must clear the flag of all of
          them together.
        tests:
          - ReviewStore_SetThreadKindAsync_PromoteDemote_UpdatesStartingAndResolutionComments

      - id: ReviewCenter-ReviewStore-ThreadReport-DemoteRepliesKept
        title: >-
          The ReviewStore class shall leave the report flag of the replies of a thread as it is when the thread is
          demoted.
        justification: |
          A reply keeps its own flag, because a reviewer chose it individually.
        tests:
          - ReviewStore_SetThreadKindAsync_PromoteDemote_UpdatesStartingAndResolutionComments

      - id: ReviewCenter-ReviewStore-ThreadReport-ReplyFlag
        title: >-
          The ReviewStore class shall change whether a reply of a thread is included in the report.
        justification: |
          A reviewer decides individually which replies belong into the report.
        tests:
          - ReviewStore_SetCommentReportAsync_ReplyToggles_StartingAndResolutionRefused

      - id: ReviewCenter-ReviewStore-ThreadReport-ReplyFlagRefused
        title: >-
          The ReviewStore class shall refuse with the CommentNotTogglable rule a change of the report flag of the
          starting comment or of a Resolution comment.
        justification: |
          The flag of those comments follows the kind of the thread, so changing it alone would make the two disagree.
        tests:
          - ReviewStore_SetCommentReportAsync_ReplyToggles_StartingAndResolutionRefused

      - id: ReviewCenter-ReviewStore-ThreadReport-AuditResolve
        title: >-
          The ReviewStore class shall record one audit entry for a resolution that was made.
        justification: |
          The audit trail must show who resolved which thread.
        tests:
          - ReviewStore_ResolveThreadAsync_FindingWithNote_StoresIncludedResolutionAndAudits

      - id: ReviewCenter-ReviewStore-ThreadReport-AuditKind
        title: >-
          The ReviewStore class shall record one audit entry for a change of the kind of a thread that was made.
        justification: |
          The kind decides what the report contains, so the audit trail must show who changed it.
        tests:
          - ReviewStore_SetThreadKindAsync_Change_RecordsOneAuditEntry

      - id: ReviewCenter-ReviewStore-ThreadReport-AuditFlag
        title: >-
          The ReviewStore class shall record one audit entry for a change of the report flag of a reply that was made.
        justification: |
          The flag decides what the report contains, so the audit trail must show who changed it.
        tests:
          - ReviewStore_SetCommentReportAsync_Change_RecordsOneAuditEntry

      - id: ReviewCenter-ReviewStore-ThreadReport-Locked
        title: >-
          The ReviewStore class shall refuse with the ReviewLocked rule the resolution, the change of the kind, the
          change of a report flag, and the reopening of a thread on a concluded review.
        justification: |
          A concluded review is signed evidence, so its discussions must not change any more.
        tests:
          - ReviewStore_ThreadWrites_ConcludedReview_ThrowReviewLocked

      # ---------------------------------------------------------------------------------------------------------------
      # OpenThreadSigningRecheck: no signature while a thread is open
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-OpenThreadSigningRecheck
        title: >-
          The ReviewStore class shall refuse with the SigningNotAllowed rule a signature while any thread of the review
          is not resolved.
        justification: |
          The service checks the open threads before it saves the signature, but a thread can be started in between.
          Checking again when the signature is saved closes that gap, so no review is signed with a thread that was
          opened before the signature was saved.
        tests:
          - ReviewStore_AddSignatureAsync_OpenThread_ThrowsSigningNotAllowedAndStoresNothing
          - ReviewStore_AddSignatureAsync_ThreadOpenedBeforeFinalSignature_IsRefused

      - id: ReviewCenter-ReviewStore-OpenThreadSigningRecheck-NothingStored
        title: >-
          The ReviewStore class shall store no signature when it refuses one because a thread is open.
        justification: |
          A signature that stays stored after a refusal for an open thread would let the review count as signed while
          a discussion is still open.
        tests:
          - ReviewStore_AddSignatureAsync_OpenThread_ThrowsSigningNotAllowedAndStoresNothing
          - ReviewStore_AddSignatureAsync_ThreadOpenedBeforeFinalSignature_IsRefused

      - id: ReviewCenter-ReviewStore-OpenThreadSigningRecheck-DigestFirst
        title: >-
          The ReviewStore class shall refuse with the RecordChanged rule, and not with the SigningNotAllowed rule, a
          signature whose digest is stale while a thread is open.
        justification: |
          The comparison of the digest comes first, so a reviewer whose view is stale is told to reload.
        tests:
          - ReviewStore_AddSignatureAsync_StaleDigestAndOpenThread_ThrowsRecordChanged

      - id: ReviewCenter-ReviewStore-OpenThreadSigningRecheck-Concluded
        title: >-
          The ReviewStore class shall report a review whose slots are all signed as not concluded while a thread is
          open.
        justification: |
          The concluded state decides which writes are refused, so the records that are read and the refusals of the
          writes must agree.
        tests:
          - ReviewStore_IsConcluded_Records_FollowReviewLock

      - id: ReviewCenter-ReviewStore-OpenThreadSigningRecheck-ConcludedWhenResolved
        title: >-
          The ReviewStore class shall report a review whose slots are all signed as concluded once no thread of it is
          open.
        justification: |
          A review that stays reported as not concluded after its last thread is resolved could never be locked, so
          its signed record could still be changed.
        tests:
          - ReviewStore_IsConcluded_Records_FollowReviewLock

      # ---------------------------------------------------------------------------------------------------------------
      # Checklist: the snapshot of a review and the rows of the ballots
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Checklist
        title: >-
          The ReviewStore class shall save the checklist snapshot of a review together with the review and return it
          with its version.
        justification: |
          The snapshot must exist exactly when the review exists, so that the checklist of a review never changes
          later.
        tests:
          - ReviewStore_AddReview_WithChecklist_StoresSnapshotAtomically

      - id: ReviewCenter-ReviewStore-Checklist-NoSnapshot
        title: >-
          The ReviewStore class shall return nothing as the checklist of a review that was saved without a snapshot.
        justification: |
          Reviews from before the checklists have none, and pages must tell that from an empty checklist.
        tests:
          - ReviewStore_GetChecklist_ReviewWithoutSnapshot_ReturnsNull

      - id: ReviewCenter-ReviewStore-Checklist-UnknownReview
        title: >-
          The ReviewStore class shall return nothing as the checklist of a review that does not exist.
        justification: |
          Pages must tell a missing review from a review without a checklist.
        tests:
          - ReviewStore_GetChecklist_ReviewWithoutSnapshot_ReturnsNull

      - id: ReviewCenter-ReviewStore-Checklist-AnswerReplaced
        title: >-
          The ReviewStore class shall replace the earlier answer to a check in the ballot of a slot when the same
          check is answered again, so that each slot has one row for each check.
        justification: |
          A check has one current answer in each ballot, and the record must not carry the history of the edits.
        tests:
          - ReviewStore_SetBallotAnswer_UpsertsSingleRowPerItem
          - ReviewStore_SetBallotAnswerAsync_SameSlotAgain_ReplacesTheAnswer

      - id: ReviewCenter-ReviewStore-Checklist-SectionReplaced
        title: >-
          The ReviewStore class shall replace the earlier applicability of a section in the ballot of a slot when it
          is set again, so that each slot has one row for each section.
        justification: |
          A section has one current applicability in each ballot, and the record must not carry the history of the
          edits.
        tests:
          - ReviewStore_SetBallotSectionState_UpsertsSingleRowPerSection

      - id: ReviewCenter-ReviewStore-Checklist-AnswerRoundTrip
        title: >-
          The ReviewStore class shall read an answer to a check back with its outcome, user name, display name, and
          time as saved.
        justification: |
          A user name that is lost from a reviewed answer leaves the record unable to say who gave the answer.
        tests:
          - ReviewStore_BallotRows_RoundTripOutcomeAndTimestamps

      - id: ReviewCenter-ReviewStore-Checklist-SectionRoundTrip
        title: >-
          The ReviewStore class shall read the applicability of a section back with its reason, user name, display
          name, and time as saved.
        justification: |
          A section decision whose reason or time is lost on the way back would show a reviewer a decision that they
          cannot justify.
        tests:
          - ReviewStore_SetBallotSectionState_UpsertsSingleRowPerSection
          - ReviewStore_SetBallotSectionStateAsync_PerSlotRows_RoundTrip

      # ---------------------------------------------------------------------------------------------------------------
      # Slots: the reviewers of a review
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Slots
        title: >-
          The ReviewStore class shall add a reviewer slot with its primary and its alternate user to a review.
        justification: |
          A review is signed by the reviewers of its slots.
        tests:
          - ReviewStore_AddSlotAsync_TwoSlots_AssignsIdsAndListsInOrderPerReview

      - id: ReviewCenter-ReviewStore-Slots-IdAssigned
        title: >-
          The ReviewStore class shall assign the identifier of a new slot itself and ignore any identifier that the
          caller supplied.
        justification: |
          An identifier chosen by a caller would corrupt the record.
        tests:
          - ReviewStore_AddSlotAsync_TwoSlots_AssignsIdsAndListsInOrderPerReview

      - id: ReviewCenter-ReviewStore-Slots-List
        title: >-
          The ReviewStore class shall list the slots of one review in the order in which they were added.
        justification: |
          Pages show the slots of a review in a stable order.
        tests:
          - ReviewStore_AddSlotAsync_TwoSlots_AssignsIdsAndListsInOrderPerReview

      - id: ReviewCenter-ReviewStore-Slots-ListIsolation
        title: >-
          The ReviewStore class shall keep the slots of different reviews apart, so that the listing of one review
          returns none of the slots of another.
        justification: |
          A review page must show exactly the reviewers of that review.
        tests:
          - ReviewStore_AddSlotAsync_TwoSlots_AssignsIdsAndListsInOrderPerReview

      - id: ReviewCenter-ReviewStore-Slots-UnknownReview
        title: >-
          The ReviewStore class shall refuse a slot for a review that does not exist.
        justification: |
          A slot of a review that does not exist would corrupt the record.
        tests:
          - ReviewStore_AddSlotAsync_UnknownReview_IsRefusedByDatabase

      - id: ReviewCenter-ReviewStore-Slots-Update
        title: >-
          The ReviewStore class shall change the primary and the alternate user of a slot of a review.
        justification: |
          A reviewer can be replaced while the review is open.
        tests:
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Slots-Remove
        title: >-
          The ReviewStore class shall remove a slot of a review.
        justification: |
          A slot that was added by mistake must be removable while the review is open.
        tests:
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Slots-UpdateNotFound
        title: >-
          The ReviewStore class shall report as not found a slot that is updated and does not exist in the stated
          review, including a slot that belongs to another review.
        justification: |
          The caller must be able to tell an update that took effect from one that found no such slot in the review.
        tests:
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Slots-UpdateNothingChanged
        title: >-
          The ReviewStore class shall leave an unknown slot or a slot of another review unchanged when an update of it
          reports not found.
        justification: |
          A caller must not change the slot of another review by naming its identifier.
        tests:
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Slots-RemoveNotFound
        title: >-
          The ReviewStore class shall report as not found a slot that is removed and does not exist in the stated
          review, including a slot that belongs to another review.
        justification: |
          The caller must be able to tell a removal that took effect from one that found no such slot in the review.
        tests:
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Slots-RemoveNothingRemoved
        title: >-
          The ReviewStore class shall leave an unknown slot or a slot of another review in place when a removal of it
          reports not found.
        justification: |
          A caller must not remove the slot of another review by naming its identifier.
        tests:
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      # ---------------------------------------------------------------------------------------------------------------
      # Record: what a signature covers
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Record
        title: >-
          The ReviewStore class shall read the record of a review that a signature covers with the content fingerprint
          of the review.
        justification: |
          A signature binds a reviewer to exactly one state of the record. The record is read as a whole, because
          reading the parts one after the other could mix two states.
        tests:
          - ReviewStore_GetRecordAsync_StoredReview_CarriesFingerprintAnswersThreadsAndComments

      - id: ReviewCenter-ReviewStore-Record-Ballots
        title: >-
          The ReviewStore class shall include in the record of a review the ballots of its reviewer slots with their
          answers and section states.
        justification: |
          The answers of the reviewers are part of what a signature approves.
        tests:
          - ReviewStore_GetRecordAsync_StoredReview_CarriesFingerprintAnswersThreadsAndComments

      - id: ReviewCenter-ReviewStore-Record-Threads
        title: >-
          The ReviewStore class shall include in the record of a review its threads with their comments.
        justification: |
          The discussions are part of what a signature approves.
        tests:
          - ReviewStore_GetRecordAsync_StoredReview_CarriesFingerprintAnswersThreadsAndComments

      - id: ReviewCenter-ReviewStore-Record-Checklist
        title: >-
          The ReviewStore class shall include in the record of a review the checklist snapshot of the review.
        justification: |
          The checklist decides what the reviewers answered, so it is part of what a signature approves.
        tests:
          - ReviewStore_GetRecordAsync_ReviewWithChecklist_CarriesTheChecklistSnapshot

      - id: ReviewCenter-ReviewStore-Record-CommentOrder
        title: >-
          The ReviewStore class shall list the comments of each thread in the record of a review in the order in which
          they were posted.
        justification: |
          The digest of the record depends on the order of the comments, so it must not vary between reads.
        tests:
          - ReviewStore_GetRecordAsync_ThreadWithSeveralComments_ListsCommentsInPostingOrder

      - id: ReviewCenter-ReviewStore-Record-Unknown
        title: >-
          The ReviewStore class shall return nothing as the record of a review that does not exist.
        justification: |
          A review that does not exist has no record.
        tests:
          - ReviewStore_GetRecordAsync_UnknownReview_ReturnsNull

      - id: ReviewCenter-ReviewStore-Record-Source
        title: >-
          The ReviewStore class shall include in the record of a review from a repository its source and one change for
          each file.
        justification: |
          The source decides what the reviewers saw, so it is part of what a signature approves.
        tests:
          - ReviewStore_GetRecordAsync_RepositoryReview_CarriesSourceAndChanges

      - id: ReviewCenter-ReviewStore-Record-UploadSource
        title: >-
          The ReviewStore class shall give the record of an uploaded review the upload source.
        justification: |
          A review without a repository must be told apart from a review of a repository.
        tests:
          - ReviewStore_GetRecordAsync_UploadReview_HasUploadSource

      - id: ReviewCenter-ReviewStore-Record-Snapshot
        title: >-
          The ReviewStore class shall read the snapshot of a review with its record, its reviewer slots, and its
          signatures.
        justification: |
          Pages decide from the snapshot whether a review is approved, so it must carry every part that the decision
          needs.
        tests:
          - ReviewStore_GetSnapshotAsync_SignedReview_CarriesRecordSlotsAndSignatures

      - id: ReviewCenter-ReviewStore-Record-SnapshotDigestAgrees
        title: >-
          The ReviewStore class shall read the snapshot of a review so that the digest of its record is the digest that
          its signatures name.
        justification: |
          A snapshot whose record and signatures come from two different states would show a signed review as out of
          date, or an out-of-date review as signed.
        tests:
          - ReviewStore_GetSnapshotAsync_SignedReview_CarriesRecordSlotsAndSignatures

      - id: ReviewCenter-ReviewStore-Record-SnapshotUnknown
        title: >-
          The ReviewStore class shall return nothing as the snapshot of a review that does not exist.
        justification: |
          A review that does not exist has no snapshot.
        tests:
          - ReviewStore_GetSnapshotAsync_UnknownReview_ReturnsNull

      # ---------------------------------------------------------------------------------------------------------------
      # SnapshotBatch: the snapshots of many reviews at once
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-SnapshotBatch
        title: >-
          The ReviewStore class shall read the snapshots of several reviews of a project so that each snapshot equals
          the snapshot of that review read alone.
        justification: |
          A project overview needs the approval status and the blockers of every review of the project. The result
          must not differ from the single read, or the overview would disagree with the review pages.
        tests:
          - ReviewStore_ListSnapshotsAsync_SeveralReviews_EqualsSingleReadsAndReopenHistory

      - id: ReviewCenter-ReviewStore-SnapshotBatch-Reopens
        title: >-
          The ReviewStore class shall read the reopens of several reviews of a project so that each review that was
          reopened has the same reopens as when its history is read alone.
        justification: |
          The overview shows how often each review was reopened, and must agree with the history of the review.
        tests:
          - ReviewStore_ListSnapshotsAsync_SeveralReviews_EqualsSingleReadsAndReopenHistory

      - id: ReviewCenter-ReviewStore-SnapshotBatch-NeverReopened
        title: >-
          The ReviewStore class shall report zero reopens in the batch read of a review that was never reopened.
        justification: |
          An overview that showed a reopen count for an untouched review would suggest that its approval had been
          withdrawn.
        tests:
          - ReviewStore_ListSnapshotsAsync_SeveralReviews_EqualsSingleReadsAndReopenHistory

      - id: ReviewCenter-ReviewStore-SnapshotBatch-QueryCount
        title: >-
          The ReviewStore class shall send the same number of database queries to read the snapshots of many reviews as
          to read the snapshots of few.
        justification: |
          Reading one snapshot per review would make the cost of the overview grow with the number of reviews (about
          ten queries each). A constant number of queries keeps the overview fast for large projects.
        tests:
          - ReviewStore_ListSnapshotsAsync_MoreReviews_SendsTheSameNumberOfQueries

      - id: ReviewCenter-ReviewStore-SnapshotBatch-ReopensQueryCount
        title: >-
          The ReviewStore class shall send the same number of database queries to read the reopens of many reviews as
          to read the reopens of few.
        justification: |
          Reading the history of each review one by one would make the cost of the overview grow with the number of
          reviews.
        tests:
          - ReviewStore_ListReopensAsync_MoreReviews_SendsTheSameNumberOfQueries

      - id: ReviewCenter-ReviewStore-SnapshotBatch-UnknownLeftOut
        title: >-
          The ReviewStore class shall leave out of the result of a batch read a review that does not exist in the
          project, including a review that exists only in another project.
        justification: |
          A stale identifier in a list must not fail the whole overview, and the overview must not show the review of
          another project.
        tests:
          - ReviewStore_ListSnapshotsAsync_EmptyUnknownDuplicateAndForeignIds_AreAbsentOrReadOnce

      - id: ReviewCenter-ReviewStore-SnapshotBatch-DuplicateOnce
        title: >-
          The ReviewStore class shall return the snapshot of a review once when its identifier appears several times in
          a batch read.
        justification: |
          A list with a repeated identifier must not fail or return the review twice.
        tests:
          - ReviewStore_ListSnapshotsAsync_EmptyUnknownDuplicateAndForeignIds_AreAbsentOrReadOnce

      - id: ReviewCenter-ReviewStore-SnapshotBatch-EmptyIds
        title: >-
          The ReviewStore class shall return an empty result for a batch read without identifiers.
        justification: |
          A project without reviews must give an empty overview.
        tests:
          - ReviewStore_ListSnapshotsAsync_EmptyUnknownDuplicateAndForeignIds_AreAbsentOrReadOnce

      - id: ReviewCenter-ReviewStore-SnapshotBatch-EmptyNoQuery
        title: >-
          The ReviewStore class shall send no database query for a batch read without identifiers.
        justification: |
          An empty list needs no database work, so an empty overview costs nothing.
        tests:
          - ReviewStore_ListSnapshotsAsync_NoIds_SendsNoQuery

      - id: ReviewCenter-ReviewStore-SnapshotBatch-ManyReviews
        title: >-
          The ReviewStore class shall read all existing reviews of a batch read whose identifiers are more than one
          query can take, wherever they are in the list.
        justification: |
          Large projects must show every review, not only the first ones of the list.
        tests:
          - ReviewStore_ListSnapshotsAsync_MoreIdsThanOneChunk_ReadsAll

      # ---------------------------------------------------------------------------------------------------------------
      # Signatures: append-only evidence
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Signatures
        title: >-
          The ReviewStore class shall store every value of a signature (slot, user, display name, role, time, digest,
          and meaning) and return it in the listing of the signatures of its review as saved.
        justification: |
          A signature is evidence that a reviewer approved one exact record. Every value must come back as it was
          saved.
        tests:
          - ReviewStore_AddSignatureAsync_CurrentDigest_StoresAndRoundTrips

      - id: ReviewCenter-ReviewStore-Signatures-IdAssigned
        title: >-
          The ReviewStore class shall assign the identifier of a signature itself.
        justification: |
          Identifiers belong to the database alone.
        tests:
          - ReviewStore_AddSignatureAsync_CurrentDigest_StoresAndRoundTrips

      - id: ReviewCenter-ReviewStore-Signatures-Outcome
        title: >-
          The ReviewStore class shall store the outcome of a signature, Approved or Rejected, and return it as saved.
        justification: |
          A rejection is as binding as an approval, so the outcome must come back as saved.
        tests:
          - ReviewStore_AddSignatureAsync_RejectedOutcome_PersistsOutcome

      - id: ReviewCenter-ReviewStore-Signatures-AppendOnly
        title: >-
          The ReviewStore class shall offer no operation on the signatures of a review other than adding a signature and
          listing the signatures.
        justification: |
          A signature must never change or disappear, which holds only while the store has no operation that could
          change or delete one.
        tests:
          - ReviewStore_PublicSurface_Signatures_OffersNoUpdateOrDelete

      - id: ReviewCenter-ReviewStore-Signatures-ListOrder
        title: >-
          The ReviewStore class shall list the signatures of a review in the order in which they were added.
        justification: |
          Pages and the report show the signatures in the order of signing.
        tests:
          - ReviewStore_ListSignaturesAsync_SeveralSignatures_ReturnsThemInTheOrderAdded

      - id: ReviewCenter-ReviewStore-Signatures-StaleDigest
        title: >-
          The ReviewStore class shall refuse with the RecordChanged rule a signature whose digest is not the digest of
          the record stored at that moment, whether the digest is made up or the record changed after the digest was
          read.
        justification: |
          A signature must never be stored for a record other than the one it names.
        tests:
          - ReviewStore_AddSignatureAsync_StaleDigest_ThrowsRecordChangedAndStoresNothing

      - id: ReviewCenter-ReviewStore-Signatures-StaleDigestNothingStored
        title: >-
          The ReviewStore class shall store no signature when it refuses one because its digest is not the digest of the
          record.
        justification: |
          A signature that stays stored after a refusal for a changed digest would count as an approval of a record
          that its signer never saw.
        tests:
          - ReviewStore_AddSignatureAsync_StaleDigest_ThrowsRecordChangedAndStoresNothing

      - id: ReviewCenter-ReviewStore-Signatures-OutcomeMismatch
        title: >-
          The ReviewStore class shall refuse with the RecordChanged rule a signature whose outcome is not the agreed
          outcome of the record stored at that moment.
        justification: |
          A rejection must not be recorded as an approval of a record that the reviewers did not approve, and the
          other way round.
        tests:
          - ReviewStore_AddSignatureAsync_OutcomeDiffersFromRecord_ThrowsRecordChangedAndStoresNothing
          - ReviewStore_AddSignatureAsync_RejectedSignatureWithoutChecklist_ThrowsRecordChanged

      - id: ReviewCenter-ReviewStore-Signatures-OutcomeMismatchNothingStored
        title: >-
          The ReviewStore class shall store no signature when it refuses one because its outcome is not the agreed
          outcome of the record.
        justification: |
          A signature that stays stored after a refusal for a wrong outcome would count as an approval, or as a
          rejection, that the reviewers never agreed on.
        tests:
          - ReviewStore_AddSignatureAsync_OutcomeDiffersFromRecord_ThrowsRecordChangedAndStoresNothing

      - id: ReviewCenter-ReviewStore-Signatures-Concurrent
        title: >-
          The ReviewStore class shall refuse with the RecordChanged rule a signature when another request changes the
          record at the same time, so that the stored signature never names a record that is not the stored one.
        justification: |
          The check and the insert must not be separated by another change.
        tests:
          - ReviewStore_AddSignatureAsync_RacingWithWrite_WriteStartedFirst_EndsConsistent
          - ReviewStore_SerializableTransaction_TakesWriteLockAtBegin

      - id: ReviewCenter-ReviewStore-Signatures-Duplicate
        title: >-
          The ReviewStore class shall refuse with the SigningNotAllowed rule a second signature of the same slot with
          the same digest.
        justification: |
          A double submit must not store the same signature twice.
        tests:
          - ReviewStore_AddSignatureAsync_SameSlotAndDigestTwice_ThrowsSigningNotAllowed

      - id: ReviewCenter-ReviewStore-Signatures-UnknownSlot
        title: >-
          The ReviewStore class shall refuse a signature for a slot that does not exist in the review.
        justification: |
          A signature of a slot that does not exist would name a reviewer who was never asked.
        tests:
          - ReviewStore_AddSignatureAsync_UnknownSlotOrReview_IsRefused

      - id: ReviewCenter-ReviewStore-Signatures-UnknownReview
        title: >-
          The ReviewStore class shall refuse a signature for a review that does not exist.
        justification: |
          A signature of a review that does not exist would name a record that is not there.
        tests:
          - ReviewStore_AddSignatureAsync_UnknownSlotOrReview_IsRefused

      # ---------------------------------------------------------------------------------------------------------------
      # EvidenceSettings: what the evidence of a project contains
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-EvidenceSettings
        title: >-
          The ReviewStore class shall store the evidence settings that a new project is given and return them with the
          project.
        justification: |
          The settings decide who may read the evidence and what a PDF contains, so they must come back as they were
          saved.
        tests:
          - ReviewStore_AddProjectAsync_GivenEvidenceSettings_AreStoredAndReturned

      - id: ReviewCenter-ReviewStore-EvidenceSettings-Default
        title: >-
          The ReviewStore class shall give a new project that was not given evidence settings the default settings.
        justification: |
          A project must have well-defined settings from the moment it exists.
        tests:
          - ReviewStore_AddProjectAsync_NewProject_HasDefaultEvidenceSettings

      - id: ReviewCenter-ReviewStore-EvidenceSettings-Listed
        title: >-
          The ReviewStore class shall return the evidence settings of a project with the project in the listing of the
          projects.
        justification: |
          The project list shows the settings without a read per project.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-ReviewStore-EvidenceSettings-CompareAndSet
        title: >-
          The ReviewStore class shall replace the evidence settings of a project by new settings when the stored
          settings equal the settings the caller started from.
        justification: |
          The comparison with the stored settings is part of the update, so two administrators who save evidence
          settings at the same time cannot both succeed.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-ReviewStore-EvidenceSettings-CompareAndSetReported
        title: >-
          The ReviewStore class shall report true when it replaced the evidence settings of a project.
        justification: |
          A settings page must be told that its change took effect, so that it shows the saved settings and not an
          error.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-ReviewStore-EvidenceSettings-OnlyThatProject
        title: >-
          The ReviewStore class shall change the evidence settings of the named project only.
        justification: |
          The settings of another project must never change by accident.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-ReviewStore-EvidenceSettings-Audit
        title: >-
          The ReviewStore class shall record one audit entry of the project for a change of its evidence settings.
        justification: |
          A change that is stored without its entry, or an entry without its change, would leave the history of the
          settings untrue.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-ReviewStore-EvidenceSettings-ChainIntact
        title: >-
          The ReviewStore class shall leave the hash chain of the audit trail intact after a change of the evidence
          settings.
        justification: |
          A chain that a change of the evidence settings had broken would make every later entry of the audit trail
          unverifiable.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited

      - id: ReviewCenter-ReviewStore-EvidenceSettings-Stale
        title: >-
          The ReviewStore class shall report false when the stored evidence settings differ from the settings the
          caller started from.
        justification: |
          The caller must be told that another administrator changed the settings first.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-EvidenceSettings-StaleKept
        title: >-
          The ReviewStore class shall keep the stored evidence settings when they differ from the settings the caller
          started from.
        justification: |
          Settings that were overwritten after a refused change would discard the choice of the administrator who saved
          first.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-EvidenceSettings-Missing
        title: >-
          The ReviewStore class shall report false when the evidence settings of a project that does not exist are
          changed.
        justification: |
          A settings change for a project that was deleted meanwhile must not appear to succeed, or the page would show
          settings that are stored nowhere.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-EvidenceSettings-NoEntryWhenNotChanged
        title: >-
          The ReviewStore class shall record no audit entry for a change of evidence settings that was not made.
        justification: |
          A stale or missing change of the settings is not a change, so an entry would claim an edit of the evidence
          settings that never occurred.
        tests:
          - ReviewStore_UpdateEvidenceSettingsAsync_ExpectedDiffers_ChangesNothing

      # ---------------------------------------------------------------------------------------------------------------
      # ProjectChecklist: the checklist definition of a project
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-ProjectChecklist
        title: >-
          The ReviewStore class shall store the checklist definition that a new project is given and return it with the
          project.
        justification: |
          The definition decides the wording of every review created later, so it must come back as it was saved.
        tests:
          - ReviewStore_AddProjectAsync_ChecklistDefinition_IsNullByDefaultAndKeptWhenGiven

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Default
        title: >-
          The ReviewStore class shall give a new project that was not given a checklist definition no definition.
        justification: |
          A project without a definition of its own uses the built-in checklist, and must be told apart from one with
          an empty definition.
        tests:
          - ReviewStore_AddProjectAsync_ChecklistDefinition_IsNullByDefaultAndKeptWhenGiven

      - id: ReviewCenter-ReviewStore-ProjectChecklist-LargeText
        title: >-
          The ReviewStore class shall store a checklist definition of the full size limit, with non-ASCII characters,
          and return it unchanged.
        justification: |
          The definition is stored without a length bound in the database, so the limit of the application is the only
          limit and must work.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_LargeText_RoundTripsThroughTheColumn

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Listed
        title: >-
          The ReviewStore class shall return the checklist definition of a project with the project in the listing of
          the projects.
        justification: |
          The project list shows the definition without a read per project.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_LargeText_RoundTripsThroughTheColumn

      - id: ReviewCenter-ReviewStore-ProjectChecklist-CompareAndSet
        title: >-
          The ReviewStore class shall replace the checklist definition of a project by a new definition when the hash
          of the stored definition equals the hash the caller started from.
        justification: |
          The comparison with the stored definition is part of the update, so two administrators who save a checklist
          definition at the same time cannot both succeed.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-ProjectChecklist-CompareAndSetReported
        title: >-
          The ReviewStore class shall report true when it replaced the checklist definition of a project.
        justification: |
          A checklist page must be told that its definition was stored, so that it can offer the new definition for the
          reviews that follow.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Reset
        title: >-
          The ReviewStore class shall remove the checklist definition of a project, so that the project has none, when
          the new definition is none.
        justification: |
          An administrator must be able to return to the built-in checklist.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-ProjectChecklist-OnlyThatProject
        title: >-
          The ReviewStore class shall change the checklist definition of the named project only.
        justification: |
          The definition of another project must never change by accident.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Audit
        title: >-
          The ReviewStore class shall record one audit entry of the project for each change of its checklist
          definition.
        justification: |
          A change that is stored without its entry, or an entry without its change, would leave the history of the
          checklist untrue.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited
          - ReviewStore_UpdateChecklistDefinitionAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-ReviewStore-ProjectChecklist-ChainIntact
        title: >-
          The ReviewStore class shall leave the hash chain of the audit trail intact after a change of the checklist
          definition.
        justification: |
          A chain that a change of the checklist definition had broken would invalidate every entry written after it.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Stale
        title: >-
          The ReviewStore class shall report false when the hash the caller started from is not the hash of the stored
          checklist definition.
        justification: |
          The caller must be told that another administrator changed the definition first.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-ProjectChecklist-StaleKept
        title: >-
          The ReviewStore class shall keep the stored checklist definition when the hash the caller started from is not
          the hash of the stored definition.
        justification: |
          A definition that was overwritten after a refused change would discard the wording that the administrator who
          saved first chose.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Missing
        title: >-
          The ReviewStore class shall report false when the checklist definition of a project that does not exist is
          changed.
        justification: |
          A definition change for a project that was deleted meanwhile must not appear to succeed, or the administrator
          would believe that a definition applies to a project that is gone.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-ProjectChecklist-NoEntryWhenNotChanged
        title: >-
          The ReviewStore class shall record no audit entry for a change of the checklist definition that was not made.
        justification: |
          A stale or missing change of the definition is not a change, so an entry would claim that a checklist was
          edited that never was.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-ProjectChecklist-Concurrent
        title: >-
          The ReviewStore class shall let exactly one of two changes of a checklist definition succeed when both start
          from the same stored definition at the same time.
        justification: |
          Two administrators who save at the same time must not both believe that their definition is stored.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-ReviewStore-ProjectChecklist-ConcurrentWinnerStored
        title: >-
          The ReviewStore class shall store the checklist definition of the change that succeeded when two changes start
          from the same stored definition at the same time.
        justification: |
          A stored definition that is not the one of the winner would give the reviews that follow a wording that
          nobody reported as saved.
        tests:
          - ReviewStore_UpdateChecklistDefinitionAsync_ConcurrentWriters_ExactlyOneWins

      # ---------------------------------------------------------------------------------------------------------------
      # DueDate: the optional due date of a review
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-DueDate
        title: >-
          The ReviewStore class shall store the due date that a review is given as a calendar day and return the same
          day.
        justification: |
          A due date is a day without a time of day, and must not move by a time zone.
        tests:
          - ReviewStore_AddReviewAsync_DueDate_RoundTripsAsCalendarDay

      - id: ReviewCenter-ReviewStore-DueDate-Default
        title: >-
          The ReviewStore class shall give a review that was not given a due date no due date.
        justification: |
          The due date is optional, and a review without one must not be shown as overdue.
        tests:
          - ReviewStore_AddReviewAsync_DueDate_RoundTripsAsCalendarDay

      - id: ReviewCenter-ReviewStore-DueDate-CompareAndSet
        title: >-
          The ReviewStore class shall replace the due date of a review by a new date when the stored date equals the
          date the caller started from.
        justification: |
          The comparison with the stored date is part of the update, so two people who change the due date of a review
          at the same time cannot both succeed.
        tests:
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-DueDate-CompareAndSetReported
        title: >-
          The ReviewStore class shall report true when it replaced the due date of a review.
        justification: |
          A due date page must be told that its change took effect, so that it shows the new date and not an old one.
        tests:
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-DueDate-Clear
        title: >-
          The ReviewStore class shall remove the due date of a review, so that the review has none, when the new date
          is none.
        justification: |
          A deadline that no longer applies must be removable.
        tests:
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited

      - id: ReviewCenter-ReviewStore-DueDate-OnlyThatReview
        title: >-
          The ReviewStore class shall change the due date of the named review only.
        justification: |
          The due date of another review must never change by accident.
        tests:
          - ReviewStore_UpdateDueDateAsync_Change_ChangesOnlyThatReview

      - id: ReviewCenter-ReviewStore-DueDate-Audit
        title: >-
          The ReviewStore class shall record one audit entry of the review for each change of its due date.
        justification: |
          A date that is stored without its entry, or an entry without its date, would leave the history of the due
          date untrue.
        tests:
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited
          - ReviewStore_UpdateDueDateAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-ReviewStore-DueDate-AuditAtomic
        title: >-
          The ReviewStore class shall leave the due date of a review as it was when the audit entry of the change
          cannot be stored.
        justification: |
          A date that is stored without its entry would leave the history of the due date untrue, so the change and
          its entry are stored together or not at all.
        tests:
          - ReviewStore_UpdateDueDateAsync_AuditInsertFails_LeavesTheDueDateUnchanged

      - id: ReviewCenter-ReviewStore-DueDate-ChainIntact
        title: >-
          The ReviewStore class shall leave the hash chain of the audit trail intact after a change of a due date.
        justification: |
          A chain that a due date write had broken would invalidate every entry written after it.
        tests:
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-DueDate-Stale
        title: >-
          The ReviewStore class shall report false when the stored due date differs from the date the caller started
          from, including a caller who started from no date.
        justification: |
          The caller must be told that somebody else changed the due date first.
        tests:
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-DueDate-StaleKept
        title: >-
          The ReviewStore class shall keep the stored due date when it differs from the date the caller started from,
          including a caller who started from no date.
        justification: |
          A date that was overwritten after a refused change would discard the deadline that somebody else set first.
        tests:
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-DueDate-Missing
        title: >-
          The ReviewStore class shall report false when the due date of a review that does not exist is changed.
        justification: |
          A due date set for a review that does not exist must not appear to succeed, or the caller would believe that
          a deadline applies to nothing.
        tests:
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-DueDate-NoEntryWhenNotChanged
        title: >-
          The ReviewStore class shall record no audit entry for a change of a due date that was not made.
        justification: |
          A stale or missing change of the due date is not a change, so an entry would show a deadline edit that never
          happened.
        tests:
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-DueDate-Concurrent
        title: >-
          The ReviewStore class shall let exactly one of two changes of a due date succeed when both start from the same
          stored date at the same time.
        justification: |
          Two people who save at the same time must not both believe that their date is stored.
        tests:
          - ReviewStore_UpdateDueDateAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-ReviewStore-DueDate-ConcurrentWinnerStored
        title: >-
          The ReviewStore class shall store the due date of the change that succeeded when two changes start from the
          same stored date at the same time.
        justification: |
          A stored date that is not the one of the winner would show the review a deadline that nobody reported as
          saved.
        tests:
          - ReviewStore_UpdateDueDateAsync_ConcurrentWriters_ExactlyOneWins

      # ---------------------------------------------------------------------------------------------------------------
      # ReviewConclusionText: the free text of the conclusion of a review
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-ReviewConclusionText
        title: >-
          The ReviewStore class shall store the review conclusion text of a review (the free text, not the approved or
          rejected conclusion) and return it with the review.
        justification: |
          The text is written by the reviewers and must come back as it was saved.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_StoresTextAndAuditAndRecord

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Default
        title: >-
          The ReviewStore class shall give a review that was not given a conclusion text no text.
        justification: |
          The text is optional, and a review without one must be told apart from one with an empty text.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_StoresTextAndAuditAndRecord

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Record
        title: >-
          The ReviewStore class shall include the review conclusion text in the record of the review, so that the
          digest of the record changes with the text.
        justification: |
          A signature must cover the text, so that the text cannot change under a signature.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_StoresTextAndAuditAndRecord

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-CompareAndSet
        title: >-
          The ReviewStore class shall replace the conclusion text of a review by a new text when the stored text equals
          the text the caller started from.
        justification: |
          The comparison with the stored text is part of the update, so two people who change the conclusion text of a
          review at the same time cannot both succeed.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-CompareAndSetReported
        title: >-
          The ReviewStore class shall report true when it replaced the conclusion text of a review.
        justification: |
          An editor of the conclusion text must be told that the text was stored, so that it does not keep showing a
          draft of unsaved text.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Remove
        title: >-
          The ReviewStore class shall remove the conclusion text of a review, so that the review has none, when the new
          text is none.
        justification: |
          A conclusion text that no longer applies must be removable.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-OnlyThatReview
        title: >-
          The ReviewStore class shall change the conclusion text of the named review only.
        justification: |
          The text of another review must never change by accident.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_Change_ChangesOnlyThatReviewAndKeepsTheChainIntact

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Audit
        title: >-
          The ReviewStore class shall record one audit entry for each change of a conclusion text that was made.
        justification: |
          A text that is stored without its entry, or an entry without its text, would leave the history untrue.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_StoresTextAndAuditAndRecord
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-AuditAtomic
        title: >-
          The ReviewStore class shall leave the conclusion text of a review as it was when the audit entry of the
          change cannot be stored.
        justification: |
          A text that is stored without its entry would leave the history untrue, so the change and its entry are
          stored together or not at all.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_AuditInsertFails_LeavesTheTextUnchanged

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-ChainIntact
        title: >-
          The ReviewStore class shall leave the hash chain of the audit trail intact after a change of a conclusion
          text.
        justification: |
          A chain that a change of the conclusion text had broken would leave all later entries of the audit trail
          without proof.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_Change_ChangesOnlyThatReviewAndKeepsTheChainIntact

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Stale
        title: >-
          The ReviewStore class shall report false when the stored conclusion text differs from the text the caller
          started from.
        justification: |
          The caller must be told that somebody else changed the text first.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-StaleKept
        title: >-
          The ReviewStore class shall keep the stored conclusion text when it differs from the text the caller started
          from.
        justification: |
          A text that was overwritten after a refused change would discard the conclusion that somebody else wrote
          first.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Missing
        title: >-
          The ReviewStore class shall report false when the conclusion text of a review that does not exist is changed.
        justification: |
          A conclusion text written for a review that does not exist must not appear to be saved, or the writer would
          believe that the text is kept.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_MissingReview_ReturnsFalse

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-NoEntryWhenNotChanged
        title: >-
          The ReviewStore class shall record no audit entry for a change of a conclusion text that was not made.
        justification: |
          A stale or missing change of the conclusion text is not a change, so an entry would show a text edit that
          never happened.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation
          - ReviewStore_UpdateReviewConclusionTextAsync_MissingReview_ReturnsFalse

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-Locked
        title: >-
          The ReviewStore class shall refuse with the ReviewLocked rule a change of the conclusion text of a concluded
          review.
        justification: |
          A signed record cannot change under a signature, and the check is part of the update so that a signature
          that is stored at the same time is respected.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_ConcludedReview_ThrowsReviewLocked

      - id: ReviewCenter-ReviewStore-ReviewConclusionText-LockedNothingChanged
        title: >-
          The ReviewStore class shall keep the conclusion text and record no audit entry when it refuses a change
          because the review is concluded.
        justification: |
          A refused change must not leave a text or an audit entry behind.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_ConcludedReview_ThrowsReviewLocked

      # ---------------------------------------------------------------------------------------------------------------
      # Ballots: the answers of each reviewer slot
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Ballots
        title: >-
          The ReviewStore class shall store the answer to a check for each reviewer slot separately, so that the same
          check answered in two slots is stored twice, each with its own outcome and author.
        justification: |
          Each reviewer needs an answer of their own, so a row can no longer be identified by the review and the check
          alone.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SameItemTwoSlots_StoresOneRowPerSlot

      - id: ReviewCenter-ReviewStore-Ballots-Replaced
        title: >-
          The ReviewStore class shall replace the stored answer of a slot to a check, and keep no second row, when the
          same slot answers the same check again.
        justification: |
          A reviewer who changes their mind has one answer, the latest.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SameSlotAgain_ReplacesTheAnswer

      - id: ReviewCenter-ReviewStore-Ballots-Sections
        title: >-
          The ReviewStore class shall store the applicability of a section for each reviewer slot separately, so that
          the same section can be applicable in one slot and not in another.
        justification: |
          Each reviewer decides on their own whether a section applies.
        tests:
          - ReviewStore_SetBallotSectionStateAsync_PerSlotRows_RoundTrip

      - id: ReviewCenter-ReviewStore-Ballots-Status
        title: >-
          The ReviewStore class shall create a draft ballot, without a time and a user name of a hand-in, for the slot
          of the first answer that is stored for it.
        justification: |
          A ballot exists from the first answer, and it is not handed in until the reviewer says so.
        tests:
          - ReviewStore_SetBallotAnswerAsync_FirstAnswer_CreatesDraftBallot

      - id: ReviewCenter-ReviewStore-Ballots-SubmittedBy
        title: >-
          The ReviewStore class shall keep with a submitted ballot the time and the user name of its hand-in.
        justification: |
          The signature of a review depends on who handed in which ballot and when.
        tests:
          - ReviewStore_SubmitBallotAsync_CompleteDraft_SubmitsWithAudit
          - ReviewStore_SetBallotAnswerAsync_SingleSlotCompleteBallot_AutoSubmitsWithAudit

      - id: ReviewCenter-ReviewStore-Ballots-OwnRows
        title: >-
          The ReviewStore class shall list the ballots of a review with their own answers and section states only, and
          none of the ballots of another review.
        justification: |
          A reviewer must see their own answers, and a review page must show exactly the ballots of that review.
        tests:
          - ReviewStore_ListBallotsAsync_TwoSlots_ReturnsOwnRowsInSlotOrder

      - id: ReviewCenter-ReviewStore-Ballots-SlotOrder
        title: >-
          The ReviewStore class shall list the ballots of a review in slot order.
        justification: |
          A review page that lists the reviewers in a different order on every read would make a reviewer look for
          their own ballot.
        tests:
          - ReviewStore_ListBallotsAsync_TwoSlots_ReturnsOwnRowsInSlotOrder

      - id: ReviewCenter-ReviewStore-Ballots-NotStarted
        title: >-
          The ReviewStore class shall return nothing as the ballot of a slot that has no ballot, and nothing as the
          ballot of a slot that does not exist.
        justification: |
          Pages must tell a reviewer who has not started from one who has a draft.
        tests:
          - ReviewStore_GetBallotAsync_NotStartedSlot_ReturnsNull

      - id: ReviewCenter-ReviewStore-Ballots-SlotNotInReview
        title: >-
          The ReviewStore class shall refuse with the SlotNotFound rule an answer for a slot that does not exist in the
          stated review, including a slot of another review.
        justification: |
          An answer must never be stored in the ballot of a slot that belongs to another review.
        tests:
          - ReviewStore_SetBallotAnswerAsync_UnknownOrForeignSlot_ThrowsSlotNotFound

      - id: ReviewCenter-ReviewStore-Ballots-SlotNotInReviewNothingStored
        title: >-
          The ReviewStore class shall store no ballot and record no audit entry when it refuses an answer because the
          slot is not in the review.
        justification: |
          A refused answer must leave nothing behind.
        tests:
          - ReviewStore_SetBallotAnswerAsync_UnknownOrForeignSlot_ThrowsSlotNotFound

      - id: ReviewCenter-ReviewStore-Ballots-IdentityZero
        title: >-
          The ReviewStore class shall refuse with an ArgumentOutOfRangeException the review-level slot identity 0 as
          the slot of an answer, of a section state, and of a hand-in.
        justification: |
          The identity 0 marks the rows that a follow-up review carries, so it is never the identity of a slot.
        tests:
          - ReviewStore_SetBallotAnswerAsync_BaselineSlotId_IsRefused

      - id: ReviewCenter-ReviewStore-Ballots-IdentityZeroNothingStored
        title: >-
          The ReviewStore class shall store no ballot row when it refuses the review-level slot identity 0.
        justification: |
          A ballot row under the identity 0 would pass for a carried baseline row, and a later follow-up review would
          take it over as the agreement of an earlier review.
        tests:
          - ReviewStore_SetBallotAnswerAsync_BaselineSlotId_IsRefused

      - id: ReviewCenter-ReviewStore-Ballots-Locked
        title: >-
          The ReviewStore class shall refuse with the ReviewLocked rule an answer, a section state, and a hand-in for a
          concluded review.
        justification: |
          A signed record cannot change under a signature, and the check is part of the write so that a signature that
          is stored at the same time is respected.
        tests:
          - ReviewStore_SetBallotAnswerAsync_ConcludedReview_ThrowsReviewLocked

      - id: ReviewCenter-ReviewStore-Ballots-LockedNothingStored
        title: >-
          The ReviewStore class shall store no ballot and record no audit entry when it refuses a write because the
          review is concluded.
        justification: |
          A refused write must leave nothing behind.
        tests:
          - ReviewStore_SetBallotAnswerAsync_ConcludedReview_ThrowsReviewLocked

      - id: ReviewCenter-ReviewStore-Ballots-EditRevertsSubmitted
        title: >-
          The ReviewStore class shall make a submitted ballot a draft again, without a time and a user name of a
          hand-in, when an answer of the ballot is edited in a review with several slots.
        justification: |
          A hand-in covers the answers as they were, so a changed answer needs a new hand-in.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SubmittedBallot_RevertsToDraftWithAudit

      - id: ReviewCenter-ReviewStore-Ballots-SingleSlotAutoSubmit
        title: >-
          The ReviewStore class shall hand in a complete ballot at once, with the time and the user name of the edit,
          when an edit completes it in a review with exactly one slot.
        justification: |
          A single reviewer has nobody to hand in for, so a complete ballot needs no separate step.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SingleSlotCompleteBallot_AutoSubmitsWithAudit

      - id: ReviewCenter-ReviewStore-Ballots-SingleSlotEditStaysSubmitted
        title: >-
          The ReviewStore class shall keep a submitted ballot submitted when its answer is edited in a review with
          exactly one slot.
        justification: |
          The ballot of a single reviewer is handed in again by the edit itself.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SingleSlotSubmittedBallotEdited_StaysSubmittedWithoutTransitionAudit

      - id: ReviewCenter-ReviewStore-Ballots-SeveralSlotsNoAutoSubmit
        title: >-
          The ReviewStore class shall never hand in a ballot by an edit in a review with more than one slot.
        justification: |
          With several reviewers each hand-in is a decision of its own.
        tests:
          - ReviewStore_SetBallotAnswerAsync_TwoSlots_NeverAutoSubmits

      - id: ReviewCenter-ReviewStore-Ballots-RevertAudit
        title: >-
          The ReviewStore class shall record an audit entry of the status change when an edit reverts a submitted
          ballot to a draft, in addition to the entry of the edit.
        justification: |
          A revert that is stored without its entry, or an entry for a revert that was not stored, would make the
          history show a ballot as handed in when it is a draft again, or the reverse.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SubmittedBallot_RevertsToDraftWithAudit

      - id: ReviewCenter-ReviewStore-Ballots-AutoSubmitAudit
        title: >-
          The ReviewStore class shall record an audit entry of the status change when an edit hands in a ballot, in
          addition to the entry of the edit.
        justification: |
          A hand-in by an edit that is stored without its entry would leave no trace of when the single reviewer
          handed in, and an entry without the hand-in would claim one that never happened.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SingleSlotCompleteBallot_AutoSubmitsWithAudit

      - id: ReviewCenter-ReviewStore-Ballots-StatusAuditDetail
        title: >-
          The ReviewStore class shall name in the audit entry of a ballot status change the slot number and the counts,
          so that the entry carries no answer text.
        justification: |
          The audit trail is kept for a long time, so a status entry that quoted an answer would keep the text of a
          reviewer there for good.
        tests:
          - ReviewStore_SetBallotAnswerAsync_SubmittedBallot_RevertsToDraftWithAudit
          - ReviewStore_SetBallotAnswerAsync_SingleSlotCompleteBallot_AutoSubmitsWithAudit

      - id: ReviewCenter-ReviewStore-Ballots-StatusAuditChain
        title: >-
          The ReviewStore class shall leave the hash chain of the audit trail intact after the status changes of
          ballots (hand-in, revert, reassignment, and removal of a slot).
        justification: |
          A chain that a ballot status change had broken would leave the entries of every later hand-in unverifiable.
        tests:
          - ReviewStore_BallotTransitions_KeepTheAuditChainIntact

      - id: ReviewCenter-ReviewStore-Ballots-ReviewLevelRows
        title: >-
          The ReviewStore class shall keep the review-level answers and section states that a follow-up review carries
          out of every ballot.
        justification: |
          The carried rows are a baseline, not the answer of a reviewer, so they must not appear in the ballot of a
          slot.
        tests:
          - ReviewStore_ListChecklistAnswersAsync_BallotRows_AreNotListedAsReviewRows
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      # ---------------------------------------------------------------------------------------------------------------
      # RecordBallots: the ballots in the record
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-RecordBallots
        title: >-
          The ReviewStore class shall load into the record of a review each ballot with its status, its answers, and
          its section states.
        justification: |
          The digest of a record covers the consolidation of the submitted ballots, so the record must carry every
          ballot with its status and leave the choice of the submitted ones to the digest.
        tests:
          - ReviewStore_GetRecordAsync_BallotRows_AreInTheRecordAsBallots
          - ReviewStore_GetRecordAsync_StoredReview_CarriesFingerprintAnswersThreadsAndComments

      - id: ReviewCenter-ReviewStore-RecordBallots-DraftsIncluded
        title: >-
          The ReviewStore class shall include the draft ballots of a review in its record, as well as the submitted
          ones.
        justification: |
          The services show a reviewer the draft of their own slot, so the record must carry it.
        tests:
          - ReviewStore_GetRecordAsync_DraftAndSubmittedBallots_AreAllInTheRecordInSlotOrder

      - id: ReviewCenter-ReviewStore-RecordBallots-SlotOrder
        title: >-
          The ReviewStore class shall list the ballots in the record of a review in slot order.
        justification: |
          The digest of the record depends on the order of the ballots, so it must not vary between reads.
        tests:
          - ReviewStore_GetRecordAsync_DraftAndSubmittedBallots_AreAllInTheRecordInSlotOrder

      - id: ReviewCenter-ReviewStore-RecordBallots-Batch
        title: >-
          The ReviewStore class shall give the ballots of a review that is read in a batch with other reviews the same
          ballots as when it is read alone.
        justification: |
          The overview must agree with the review page.
        tests:
          - ReviewStore_ListSnapshotsAsync_SeveralReviews_EqualsSingleReadsAndReopenHistory

      - id: ReviewCenter-ReviewStore-RecordBallots-NoBallot
        title: >-
          The ReviewStore class shall load no ballot into the record of a review in which no slot has started one.
        justification: |
          Rows that a follow-up review carries are not a ballot, so a record without ballots must stay without them.
        tests:
          - ReviewStore_GetRecordAsync_BallotRows_AreInTheRecordAsBallots

      # ---------------------------------------------------------------------------------------------------------------
      # LegacyBaseline: the review-level rows of a follow-up review
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-LegacyBaseline
        title: >-
          The ReviewStore class shall keep listing the review-level answers and section states that a follow-up review
          carries from the review it follows (the legacy baseline) without any row of a ballot.
        justification: |
          A follow-up review starts from what its predecessor agreed on. Those rows stay readable as the baseline that
          seeds the ballot of a new slot, and must not mix with the ballots.
        tests:
          - ReviewStore_ListChecklistAnswersAsync_BallotRows_AreNotListedAsReviewRows

      - id: ReviewCenter-ReviewStore-LegacyBaseline-SlotIdentity
        title: >-
          The ReviewStore class shall refuse the review-level slot identity in the methods that write a ballot, so that
          review-level rows can be created only with the follow-up review.
        justification: |
          A reviewer's answer belongs to the ballot of the reviewer's slot, so the baseline must not be written through
          the ballot methods.
        tests:
          - ReviewStore_SetBallotAnswerAsync_BaselineSlotId_IsRefused

      - id: ReviewCenter-ReviewStore-LegacyBaseline-CarriedReplaced
        title: >-
          The ReviewStore class shall store the answer or section state that a reviewer gives to a carried check or
          section in the ballot of the slot without the carried mark.
        justification: |
          An answer that a person gave again must not keep a mark that says it was taken over by the earlier review.
        tests:
          - ReviewStore_SetBallotAnswerAndSectionState_CarriedRows_AreReplacedWithoutMarker

      - id: ReviewCenter-ReviewStore-LegacyBaseline-CarriedReplacedNoSecondRow
        title: >-
          The ReviewStore class shall keep a single answer row and a single section row in the ballot of the slot after
          the answer or section state replaces a carried one.
        justification: |
          A second row for the same check would make a ballot count one check twice in the consolidation of the
          record.
        tests:
          - ReviewStore_SetBallotAnswerAndSectionState_CarriedRows_AreReplacedWithoutMarker

      - id: ReviewCenter-ReviewStore-LegacyBaseline-CarriedRowKept
        title: >-
          The ReviewStore class shall leave the review-level carried row as it was when a reviewer answers the carried
          check or section in a ballot.
        justification: |
          The baseline must not change when somebody answers again, because it seeds the ballots of later slots.
        tests:
          - ReviewStore_SetBallotAnswerAndSectionState_CarriedRows_AreReplacedWithoutMarker

      # ---------------------------------------------------------------------------------------------------------------
      # SignOwnBallot: a signature needs the own ballot to be handed in
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-SignOwnBallot
        title: >-
          The ReviewStore class shall refuse with the BallotNotSubmitted rule a signature while the ballot of the slot
          being signed is a draft.
        justification: |
          The digest covers only the submitted ballots, so a draft of the signer changes nothing in it and the digest
          comparison cannot see it. The check closes the gap to an edit that lands between the check of the service and
          the write.
        tests:
          - ReviewStore_AddSignatureAsync_OwnBallotDraft_ThrowsBallotNotSubmitted

      - id: ReviewCenter-ReviewStore-SignOwnBallot-NoBallot
        title: >-
          The ReviewStore class shall refuse with the BallotNotSubmitted rule a signature while the slot being signed
          has no ballot in a review that has a checklist.
        justification: |
          A reviewer who never answered must not sign, although their missing ballot leaves the digest as it is.
        tests:
          - ReviewStore_AddSignatureAsync_NoBallotInReviewWithChecklist_ThrowsBallotNotSubmitted

      - id: ReviewCenter-ReviewStore-SignOwnBallot-NothingStored
        title: >-
          The ReviewStore class shall store no signature when it refuses one because the own ballot is not handed in.
        justification: |
          A signature that stays stored after a refusal for an unsubmitted ballot would let a reviewer sign for work
          that was never handed in.
        tests:
          - ReviewStore_AddSignatureAsync_OwnBallotDraft_ThrowsBallotNotSubmitted
          - ReviewStore_AddSignatureAsync_NoBallotInReviewWithChecklist_ThrowsBallotNotSubmitted

      - id: ReviewCenter-ReviewStore-SignOwnBallot-StoredWhenSubmitted
        title: >-
          The ReviewStore class shall store the signature of a slot once its ballot is handed in.
        justification: |
          The refusal must lift as soon as the reviewer has handed in.
        tests:
          - ReviewStore_AddSignatureAsync_OwnBallotDraft_ThrowsBallotNotSubmitted

      - id: ReviewCenter-ReviewStore-BallotSubmit
        title: >-
          The ReviewStore class shall hand in a complete draft ballot of a slot, storing the time and the user name of
          the hand-in together with the audit entry of the caller.
        justification: |
          Two reviewers, or one reviewer twice, can hand in at the same moment, and an edit can arrive between the
          check and the write. The hand-in is therefore one atomic change from draft to submitted that asks the
          caller's completeness test about the rows of the same transaction, so a ballot is never submitted with a
          check unanswered.
        tests:
          - ReviewStore_SubmitBallotAsync_CompleteDraft_SubmitsWithAudit

      - id: ReviewCenter-ReviewStore-BallotSubmit-Audit
        title: >-
          The ReviewStore class shall record exactly the audit entry of the caller when it hands in a ballot, and no
          further entry.
        justification: |
          The hand-in is one event, so one entry must tell it.
        tests:
          - ReviewStore_SubmitBallotAsync_CompleteDraft_SubmitsWithAudit

      - id: ReviewCenter-ReviewStore-BallotSubmit-Incomplete
        title: >-
          The ReviewStore class shall refuse with the BallotIncomplete rule the hand-in of a ballot that the caller's
          completeness test does not accept.
        justification: |
          A ballot with a check unanswered must not count as the agreement of a reviewer.
        tests:
          - ReviewStore_SubmitBallotAsync_IncompleteBallot_ThrowsBallotIncompleteAndStoresNothing

      - id: ReviewCenter-ReviewStore-BallotSubmit-IncompleteNothingStored
        title: >-
          The ReviewStore class shall leave the ballot a draft, without a time of a hand-in, and record no audit entry
          when it refuses the hand-in of an incomplete ballot.
        justification: |
          A refused hand-in must leave nothing behind.
        tests:
          - ReviewStore_SubmitBallotAsync_IncompleteBallot_ThrowsBallotIncompleteAndStoresNothing

      - id: ReviewCenter-ReviewStore-BallotSubmit-Idempotent
        title: >-
          The ReviewStore class shall return a ballot that is already submitted as it is, with its first time and user
          name of the hand-in.
        justification: |
          Two hand-ins at the same moment must agree on who handed in first.
        tests:
          - ReviewStore_SubmitBallotAsync_AlreadySubmitted_ReturnsBallotWithoutAudit

      - id: ReviewCenter-ReviewStore-BallotSubmit-IdempotentNoCompletenessCheck
        title: >-
          The ReviewStore class shall not ask the completeness test again when it is asked to hand in a ballot that is
          already submitted.
        justification: |
          A repeated hand-in that was tested again could be refused for an edit that came after the first hand-in,
          although the ballot was already handed in.
        tests:
          - ReviewStore_SubmitBallotAsync_AlreadySubmitted_ReturnsBallotWithoutAudit

      - id: ReviewCenter-ReviewStore-BallotSubmit-IdempotentNoEntry
        title: >-
          The ReviewStore class shall record no audit entry when it is asked to hand in a ballot that is already
          submitted.
        justification: |
          One hand-in must have one entry.
        tests:
          - ReviewStore_SubmitBallotAsync_AlreadySubmitted_ReturnsBallotWithoutAudit

      - id: ReviewCenter-ReviewStore-BallotSubmit-NothingToAnswer
        title: >-
          The ReviewStore class shall store a submitted ballot with no answer and no section state when a slot that has
          no ballot hands in and there is nothing to answer.
        justification: |
          A reviewer of a review without a checklist still has to hand in before signing.
        tests:
          - ReviewStore_SubmitBallotAsync_NoBallotAndNothingToAnswer_StoresSubmittedBallot

      # ---------------------------------------------------------------------------------------------------------------
      # BallotSlotLifecycle: what a change of a slot does to its ballot
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle
        title: >-
          The ReviewStore class shall seed the ballot of a new slot with a draft ballot that holds copies of the rows
          that a follow-up review carried, each keeping the review it came from.
        justification: |
          A slot gets a new reviewer while the review is still open. The new reviewer must start from what the review
          carried. The seeding happens in one transaction with the entry of the slot change, so a failure leaves the
          ballot as it was.
        tests:
          - ReviewStore_AddSlotAsync_FollowUpBaseline_SeedsDraftBallotWithCarriedRows

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-NoBaseline
        title: >-
          The ReviewStore class shall create no ballot for a new slot when the review carried no rows.
        justification: |
          A slot without a baseline starts with nothing, so a reviewer is not shown an empty ballot as handed in.
        tests:
          - ReviewStore_AddSlotAsync_NoBaseline_CreatesNoBallot

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-DepartingRows
        title: >-
          The ReviewStore class shall remove from the ballot of a slot the answers and section states that a departing
          reviewer gave, when the reviewer leaves the slot.
        justification: |
          The departed reviewer's answers must not stay under the name of the slot.
        tests:
          - ReviewStore_UpdateSlotAsync_DepartingUser_RemovesOwnRowsAndRevertsToDraft

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-CarriedKept
        title: >-
          The ReviewStore class shall keep the carried rows in the ballot of a slot when the reviewer named on them
          leaves the slot.
        justification: |
          The departing reviewer did not give the carried rows, so a departure takes nothing away from them.
        tests:
          - ReviewStore_UpdateSlotAsync_CarriedRowsOfDepartingUser_AreKept

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-CarriedKeptNoReassignEntry
        title: >-
          The ReviewStore class shall record no reassignment entry when the reviewer named on the carried rows leaves
          the slot.
        justification: |
          A reassignment entry would claim that answers were removed from the ballot, although only carried rows were
          there and all of them stayed.
        tests:
          - ReviewStore_UpdateSlotAsync_CarriedRowsOfDepartingUser_AreKept

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-RevertsToDraft
        title: >-
          The ReviewStore class shall make a submitted ballot a draft again, without a time of a hand-in, when a
          reviewer who gave rows leaves its slot.
        justification: |
          A hand-in covered the rows of the departed reviewer, so the new reviewer must hand in again.
        tests:
          - ReviewStore_UpdateSlotAsync_DepartingUser_RemovesOwnRowsAndRevertsToDraft

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-ReassignEntry
        title: >-
          The ReviewStore class shall name in the reassignment entry of a slot the slot number and the counts of the
          removed rows, so that the entry carries no answer text, when the ballot of the slot loses the rows of a
          departed reviewer.
        justification: |
          A reassignment entry that quoted the removed answers would keep the text of the departed reviewer in the
          long-lived audit trail after the answers themselves were deleted.
        tests:
          - ReviewStore_UpdateSlotAsync_DepartingUser_RemovesOwnRowsAndRevertsToDraft

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-RoleSwapKeeps
        title: >-
          The ReviewStore class shall leave the ballot of a slot, with its status and rows, as it was when the
          reviewers of the slot only swap roles.
        justification: |
          Nobody left the slot, so no answer is lost.
        tests:
          - ReviewStore_UpdateSlotAsync_RoleSwapOnly_KeepsBallot

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-RoleSwapKeepsNoReassignEntry
        title: >-
          The ReviewStore class shall record no reassignment entry when the reviewers of a slot only swap roles.
        justification: |
          A reassignment entry for a swap would tell a later reader that a reviewer was replaced, although both
          reviewers still hold the slot.
        tests:
          - ReviewStore_UpdateSlotAsync_RoleSwapOnly_KeepsBallot

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-RemovedSlot
        title: >-
          The ReviewStore class shall delete the answers, the section states, and the status of the ballot of a slot
          that is removed.
        justification: |
          A deleted slot must leave no orphan rows that a later slot with the same identity could pick up.
        tests:
          - ReviewStore_RemoveSlotAsync_WithBallot_DeletesTheBallotRows

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle-SignedSlotKept
        title: >-
          The ReviewStore class shall keep the slot, its signature, and the rows of its ballot when the removal of a
          signed slot is refused.
        justification: |
          A refused removal must leave everything of the slot as it was.
        tests:
          - ReviewStore_RemoveSlotAsync_SignedSlot_IsRefusedAndKeepsBallotRows
          - ReviewStore_RemoveSlotAsync_SignedSlot_IsRefusedByDatabase

      # ---------------------------------------------------------------------------------------------------------------
      # FollowUp: a review that continues an earlier review
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-FollowUp
        title: >-
          The ReviewStore class shall store a follow-up review with the review that it follows and the numbers of
          answers and threads it took over.
        justification: |
          The follow-up link and the counts tell a reader what the review continues. The review, the carried rows, and
          the audit entry are stored in one transaction, so a follow-up never exists without the rows it says it
          carried.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-None
        title: >-
          The ReviewStore class shall store no follow-up link and no counts of taken-over rows for a review that
          follows none.
        justification: |
          A review that carried a link or counts it never had would send a reader to an earlier review that it does
          not continue.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-CarriedAnswers
        title: >-
          The ReviewStore class shall store the answers that a follow-up review carries, each with the review it came
          from and with its original outcome, author, and time.
        justification: |
          A carried answer is the agreement of the earlier review, so it must keep what that review recorded.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-CarriedSections
        title: >-
          The ReviewStore class shall store the not-applicable sections that a follow-up review carries, each with the
          review it came from and its original reason.
        justification: |
          A carried section decision is the agreement of the earlier review, so it must keep what that review
          recorded.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-CarriedThreads
        title: >-
          The ReviewStore class shall store the threads that a follow-up review carries with copies of their comments,
          each thread with the review it came from and its number there.
        justification: |
          A carried thread is still open work, so it must keep its text and say where it came from.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-CarriedFlags
        title: >-
          The ReviewStore class shall store with a carried thread its kind and the report flag of each of its
          comments.
        justification: |
          What goes into the report must not change when a thread is carried.
        tests:
          - ReviewStore_AddReviewAsync_CarriedFinding_PersistsFlagsAndKind

      - id: ReviewCenter-ReviewStore-FollowUp-ThreadNumbers
        title: >-
          The ReviewStore class shall give the threads that a follow-up review carries new numbers of their own.
        justification: |
          A thread of the new review is its own thread, so it needs its own number.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-Record
        title: >-
          The ReviewStore class shall load the follow-up link and the carried marks of the threads into the record that
          a signature covers.
        justification: |
          The follow-up link and the mark of a thread are part of what a signature covers.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-NoCarriedBallotRows
        title: >-
          The ReviewStore class shall load no carried row into a ballot of the record of a follow-up review.
        justification: |
          A carried row that showed up in a ballot would pass for the answer of a reviewer and would enter the
          consolidation that the digest covers.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn

      - id: ReviewCenter-ReviewStore-FollowUp-Atomic
        title: >-
          The ReviewStore class shall store no review, no answer, no section state, and no thread of a follow-up
          review when carrying its rows fails.
        justification: |
          A follow-up that exists without the answers it says it carried, or carried rows without the review, would
          make the record untrue, so everything is stored together or not at all. This is the atomic rollback of the
          storage layer.
        tests:
          - ReviewStore_AddReviewAsync_FollowUpCarryFails_CreatesNothing

      - id: ReviewCenter-ReviewStore-FollowUp-AtomicNoEntry
        title: >-
          The ReviewStore class shall record no audit entry for a follow-up review when carrying its rows fails.
        justification: |
          An entry for a review that does not exist would make the history untrue.
        tests:
          - ReviewStore_AddReviewAsync_FollowUpCarryFails_CreatesNothing

      - id: ReviewCenter-ReviewStore-FollowUp-ReplacedAnswer
        title: >-
          The ReviewStore class shall store an answer or a section state that replaces a carried one in a ballot
          without the carried mark.
        justification: |
          A carried mark that stayed on an answer that a reviewer gave again would credit the earlier review with an
          answer that the reviewer of this review gave.
        tests:
          - ReviewStore_SetBallotAnswerAndSectionState_CarriedRows_AreReplacedWithoutMarker

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction
        title: >-
          The ReviewStore class shall refuse with the ReviewLocked rule a thread, a comment, a thread state, a section
          state, an answer of a ballot, a due date, and the addition, change, or removal of a reviewer slot, when the
          review is concluded at that moment.
        justification: |
          The Core services check the lock before they write, but a final signature may be stored between that check
          and the change. The store repeats the check in the same transaction as the change, using the same definition
          of concluded as the Core services (every slot signed for the current record and no thread open), so that no
          interleaving of two requests can change a concluded review.
        tests:
          - ReviewStore_WriteMethods_ApprovedReview_RefuseWithReviewLockedInTransaction
          - ReviewStore_ThreadWrites_ConcludedReview_ThrowReviewLocked

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-NothingStored
        title: >-
          The ReviewStore class shall leave the record of a concluded review exactly as it was, with the same digest,
          slots, threads, comments, and ballots, when it refuses a write because the review is concluded.
        justification: |
          A refused write must leave nothing behind that changes what the signatures cover.
        tests:
          - ReviewStore_WriteMethods_ApprovedReview_RefuseWithReviewLockedInTransaction

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-NoAuditEntry
        title: >-
          The ReviewStore class shall record no audit entry when it refuses a write because the review is concluded.
        justification: |
          A refused write is not a change, so an entry for it would show a change of a signed review that never took
          place.
        tests:
          - ReviewStore_WriteMethods_ApprovedReview_RefuseWithReviewLockedInTransaction

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-LiftedByReopen
        title: >-
          The ReviewStore class shall accept the writes to a review again once it has been reopened.
        justification: |
          The lock follows the approval, not the review, so a reopened review must be editable.
        tests:
          - ReviewStore_WriteMethods_ApprovedReview_RefuseWithReviewLockedInTransaction

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-UnknownReview
        title: >-
          The ReviewStore class shall not refuse a write to a review that does not exist with the ReviewLocked rule.
        justification: |
          A review that does not exist is not concluded, so the lock must not disguise the real problem.
        tests:
          - ReviewStore_WriteMethods_UnknownReview_AreNotRefusedAsLocked

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-UnknownReviewNothingStored
        title: >-
          The ReviewStore class shall store nothing and record no audit entry for a write to a review that does not
          exist.
        justification: |
          A write that left a row or an entry for a review that is not there would create an orphan that a later review
          of the same identifier could pick up.
        tests:
          - ReviewStore_WriteMethods_UnknownReview_AreNotRefusedAsLocked

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-SignatureFirst
        title: >-
          The ReviewStore class shall refuse with the ReviewLocked rule a write that is started at the same moment as a
          final signature but is behind it in the queue of writers.
        justification: |
          The signature that concludes the review wins when it comes first, so the write that follows it must meet the
          lock.
        tests:
          - ReviewStore_AddSignatureAsync_RacingWithWrite_SignatureStartedFirst_EndsConsistent

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-SignatureFirst-Stored
        title: >-
          The ReviewStore class shall store a final signature that is started ahead of a write at the same moment, and
          leave the review concluded.
        justification: |
          A final signature that lost to a write it was ahead of would leave a review without the approval that its
          signers gave.
        tests:
          - ReviewStore_AddSignatureAsync_RacingWithWrite_SignatureStartedFirst_EndsConsistent

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-WriteFirst
        title: >-
          The ReviewStore class shall refuse with the RecordChanged rule a final signature that is started at the same
          moment as a write but is behind it in the queue of writers.
        justification: |
          A signature must never cover a record that changed under it.
        tests:
          - ReviewStore_AddSignatureAsync_RacingWithWrite_WriteStartedFirst_EndsConsistent

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction-WriteFirst-Stored
        title: >-
          The ReviewStore class shall store a write that is started ahead of a final signature at the same moment, and
          leave the review not concluded.
        justification: |
          A write that was lost to a signature behind it would drop the change of a reviewer after the reviewer was
          told that it was saved.
        tests:
          - ReviewStore_AddSignatureAsync_RacingWithWrite_WriteStartedFirst_EndsConsistent

      - id: ReviewCenter-ReviewStore-ReopenHistory
        title: >-
          The ReviewStore class shall store the reopening of an approved review together with its audit entry, so that
          the history of the reopening exists exactly when the reopening took effect.
        justification: |
          The history of who reopened which approval and why is evidence, so it must exist exactly when the reopening
          took effect. The row and its entry are stored in one transaction, storing neither when either fails.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-ReviewStore-ReopenHistory-AuditEntry
        title: >-
          The ReviewStore class shall write one audit entry of the review, with the content that the caller gave, for a
          reopening.
        justification: |
          An entry with other content than the caller gave would put words in the mouth of the administrator who
          reopened, and a second entry would count one reopening twice.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-ReviewStore-ReopenHistory-Row
        title: >-
          The ReviewStore class shall store the reopening of an approved review as an append-only row with the user,
          the display name, the time, the reason, and the digest of the approved record.
        justification: |
          A later reader must be able to tell what was approved, who reopened it, and why.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-ReviewStore-ReopenHistory-SignaturesKept
        title: >-
          The ReviewStore class shall keep the signatures of a reopened review stored, as signatures that no longer
          make the review approved.
        justification: |
          The signatures are evidence of what was approved before the reopening.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-ReviewStore-ReopenHistory-Atomic
        title: >-
          The ReviewStore class shall store no reopening row, and leave the review approved with the same digest and
          no audit entry added, when the audit entry of the reopening cannot be stored.
        justification: |
          A reopening without its entry, or an entry without its reopening, would leave the history untrue. This is the
          atomic rollback of the storage layer.
        tests:
          - ReviewStore_ReopenReviewAsync_AuditInsertFails_RollsBackTheReopen

      - id: ReviewCenter-ReviewStore-ReopenHistory-ListOrder
        title: >-
          The ReviewStore class shall list the reopenings of one review in the order in which they were made.
        justification: |
          The history must read back in the order of events.
        tests:
          - ReviewStore_ListReopensAsync_SeveralReviewsAndReopens_AreScopedAndInCreationOrder

      - id: ReviewCenter-ReviewStore-ReopenHistory-Scoped
        title: >-
          The ReviewStore class shall list for a review only its own reopenings, and none of another review or of the
          same review identifier in another project.
        justification: |
          A review page must not show the history of another review.
        tests:
          - ReviewStore_ListReopensAsync_SeveralReviewsAndReopens_AreScopedAndInCreationOrder

      - id: ReviewCenter-ReviewStore-ReopenRefusal
        title: >-
          The ReviewStore class shall refuse with the ReviewNotLocked rule a reopening of a review that is not
          approved at that moment, including one that was already reopened.
        justification: |
          A reopening of a review that was never approved would put a false entry into the history. The check is made
          in the transaction of the change because only there can no other request come between the check and the row.
        tests:
          - ReviewStore_ReopenReviewAsync_NotApprovedOrUnknown_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ReopenRefusal-NotFound
        title: >-
          The ReviewStore class shall refuse with the ReviewNotFound rule a reopening of a review that does not exist.
        justification: |
          The caller must be told that the review is not there.
        tests:
          - ReviewStore_ReopenReviewAsync_NotApprovedOrUnknown_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ReopenRefusal-NothingStored
        title: >-
          The ReviewStore class shall store no reopening row when it refuses a reopening.
        justification: |
          A refused reopening must leave nothing behind.
        tests:
          - ReviewStore_ReopenReviewAsync_NotApprovedOrUnknown_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ReopenRefusal-NoAuditEntry
        title: >-
          The ReviewStore class shall record no audit entry when it refuses a reopening.
        justification: |
          A refused reopening is not a reopening, so an entry for it would tell a later reader that an approval was
          withdrawn that still stands.
        tests:
          - ReviewStore_ReopenReviewAsync_NotApprovedOrUnknown_IsRefusedAndStoresNothing

      - id: ReviewCenter-ReviewStore-ReopenRefusal-OneWinner
        title: >-
          The ReviewStore class shall let exactly one of two reopenings of the same review that are made at the same
          time succeed, and refuse the other with the ReviewNotLocked rule.
        justification: |
          Two administrators acting together must not both reopen the same approval.
        tests:
          - ReviewStore_ReopenReviewAsync_TwoAtOnce_ExactlyOneSucceeds

      - id: ReviewCenter-ReviewStore-ReopenRefusal-StoredOnce
        title: >-
          The ReviewStore class shall store one reopening row and one audit entry when two reopenings of the same
          review are made at the same time.
        justification: |
          A second row or a second entry for the same approval would count one reopening twice in the history and in
          the number that the record carries.
        tests:
          - ReviewStore_ReopenReviewAsync_TwoAtOnce_ExactlyOneSucceeds

      - id: ReviewCenter-ReviewStore-ReopenCount
        title: >-
          The ReviewStore class shall include the number of reopenings of a review in the record that a signature
          covers.
        justification: |
          Including the number in the record is what makes the signatures that were made before a reopening out of
          date, so that the reviewers have to sign again.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      # ---------------------------------------------------------------------------------------------------------------
      # IndependentReviewers: the setting that requires independent reviewers
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-IndependentReviewers
        title: >-
          The ReviewStore class shall store the setting that requires independent reviewers with the project and return
          it with every project it reads or lists.
        justification: |
          The setting decides who may sign, so it must come back as it was saved.
        tests:
          - ReviewStore_AddProjectAsync_RequireIndependentReviewers_IsStoredAndReturned

      - id: ReviewCenter-ReviewStore-IndependentReviewers-Default
        title: >-
          The ReviewStore class shall have the setting that requires independent reviewers on for a project that was
          not given another value.
        justification: |
          The safe choice must hold unless an administrator switches it off.
        tests:
          - ReviewStore_AddProjectAsync_RequireIndependentReviewers_IsStoredAndReturned
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-CompareAndSet
        title: >-
          The ReviewStore class shall change the setting that requires independent reviewers when the stored value
          equals the value the caller started from.
        justification: |
          The comparison with the stored value is part of the update, so two administrators who switch the setting at
          the same time cannot both succeed.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-CompareAndSetReported
        title: >-
          The ReviewStore class shall report true when it changed the setting that requires independent reviewers.
        justification: |
          A project page must be told that the switch took effect, so that it does not keep showing a setting that is
          not stored.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-Audit
        title: >-
          The ReviewStore class shall record one audit entry of the project for a change of the setting that requires
          independent reviewers.
        justification: |
          A change that is stored without its entry, or an entry without its change, would leave the history of the
          setting untrue.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-Stale
        title: >-
          The ReviewStore class shall report false when the stored setting that requires independent reviewers differs
          from the value the caller started from.
        justification: |
          The caller must be told that another administrator changed the setting first.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-StaleKept
        title: >-
          The ReviewStore class shall keep the stored setting that requires independent reviewers when it differs from
          the value the caller started from.
        justification: |
          A setting that was overwritten after a refused change would discard the choice about who may sign that the
          administrator who saved first made.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-Missing
        title: >-
          The ReviewStore class shall report false when the setting that requires independent reviewers of a project
          that does not exist is changed.
        justification: |
          A switch of the independence setting for a deleted project must not appear to succeed, or the administrator
          would believe that the rule is enforced somewhere.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-IndependentReviewers-NoEntryWhenNotChanged
        title: >-
          The ReviewStore class shall record no audit entry for a change of the setting that requires independent
          reviewers that was not made.
        justification: |
          A stale or missing switch of the independence setting is not a change, so an entry would claim that the rule
          was switched when it was not.
        tests:
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      # ---------------------------------------------------------------------------------------------------------------
      # ReviewRuleSwitches: the two further review rules
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches
        title: >-
          The ReviewStore class shall store the two further review rules (authors answering the checklist of their
          own review, and the person who reopened a review signing it again) with the project and return them with
          every project it reads or lists.
        justification: |
          The rules decide who may answer and sign, so they must come back as they were saved.
        tests:
          - ReviewStore_AddProjectAsync_NewReviewRules_AreStoredAndReturned

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-Default
        title: >-
          The ReviewStore class shall have each of the two further review rules on for a project that was not given
          another value.
        justification: |
          The safe choice must hold unless an administrator switches a rule off.
        tests:
          - ReviewStore_AddProjectAsync_NewReviewRules_AreStoredAndReturned
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-CompareAndSet
        title: >-
          The ReviewStore class shall change a review rule only when the stored value equals the value the caller
          started from.
        justification: |
          The comparison with the stored value is part of the update, so two administrators who switch the same rule at
          the same time cannot both succeed.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-CompareAndSetReported
        title: >-
          The ReviewStore class shall report true when it changed a review rule.
        justification: |
          A rules page must be told that the switch took effect, so that it does not keep showing a rule that is not
          stored.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-Audit
        title: >-
          The ReviewStore class shall record one audit entry of the project for a change of a review rule.
        justification: |
          A change that is stored without its entry, or an entry without its change, would leave the history of the
          rules untrue.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-ChainIntact
        title: >-
          The ReviewStore class shall leave the hash chain of the audit trail intact after the audit entry of a change
          of a review rule.
        justification: |
          A chain that no longer verifies after a rule change would make the whole history of the project doubtful
          instead of only the one entry.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-Stale
        title: >-
          The ReviewStore class shall report false when the stored review rule differs from the value the caller
          started from.
        justification: |
          The caller must be told that another administrator changed the rule first.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-StaleKept
        title: >-
          The ReviewStore class shall keep the stored review rule when it differs from the value the caller started
          from.
        justification: |
          A rule that was overwritten after a refused change would discard the choice about answering and signing that
          the administrator who saved first made.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-Missing
        title: >-
          The ReviewStore class shall report false when a review rule of a project that does not exist is changed.
        justification: |
          A switch of a review rule for a deleted project must not appear to succeed, or the administrator would
          believe that the rule is enforced somewhere.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-NoEntryWhenNotChanged
        title: >-
          The ReviewStore class shall record no audit entry for a change of a review rule that was not made.
        justification: |
          A stale or missing switch of a review rule is not a change, so an entry would claim that the rule was
          switched when it was not.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-ChangesOnlyNamed
        title: >-
          The ReviewStore class shall change only the named review rule and never another one.
        justification: |
          A rule must not be switched off by a change of another rule.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_ChangesOnlyTheNamedRule

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-UndefinedRule
        title: >-
          The ReviewStore class shall refuse with an ArgumentOutOfRangeException a change of a review rule that is not
          defined.
        justification: |
          An undefined rule is a programming error that must not change a stored rule.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_UndefinedRule_ThrowsArgumentOutOfRange

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches-UndefinedRuleNoAuditEntry
        title: >-
          The ReviewStore class shall record no audit entry for a change of a review rule that is not defined.
        justification: |
          An entry for a rule that does not exist would put a name into the history that no administrator can have
          switched.
        tests:
          - ReviewStore_UpdateReviewRuleAsync_UndefinedRule_ThrowsArgumentOutOfRange

      - id: ReviewCenter-ReviewStore-Audit
        title: >-
          The ReviewStore class shall store every audited change (project, project membership, evidence settings,
          project checklist definition, setting that requires independent reviewers, review, thread, comment,
          thread state, resolution, kind of a thread, report flag of a comment, checklist answer and section state,
          slot, signature, and reopening) together with its audit entry, so that each change exists with its entry.
        justification: |
          The history must be true: a change without its entry, or an entry without its change, cannot be allowed to
          exist. The change and its entry are stored in one transaction, through the process-wide audit gate that
          keeps the hash chain in order.
        tests:
          - ReviewStore_AddProjectAsync_WithDraft_StoresProjectAndEntryTogether
          - ReviewStore_ResolveThreadAsync_FindingWithNote_StoresIncludedResolutionAndAudits
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-ReviewStore-Audit-RollbackOnFailure
        title: >-
          The ReviewStore class shall store neither the change nor its audit entry when either of them fails.
        justification: |
          A change without its entry, or an entry without its change, would leave the history untrue. This is the
          atomic rollback of the storage layer, so it is verified against a real database.
        tests:
          - ReviewStore_AddReviewAsync_FailedChange_LeavesNoAuditEntry
          - ReviewStore_AddReviewAsync_AuditInsertFails_StoresNoReview
          - ReviewStore_AddProjectAsync_DraftFactoryThrows_StoresNothing
          - ReviewStore_AddProjectAsync_AuditInsertFails_RollsBackTheChange
          - ReviewStore_ReopenReviewAsync_AuditInsertFails_RollsBackTheReopen

      - id: ReviewCenter-ReviewStore-Audit-NoEntryForNoOp
        title: >-
          The ReviewStore class shall store no audit entry for a change that has no effect.
        justification: |
          A no-op change that left an entry would fill the history with events that changed nothing, and the reader
          could not tell the real ones apart.
        tests:
          - ReviewStore_NoOpChanges_RecordNothing

      # ---------------------------------------------------------------------------------------------------------------
      # Memberships: the membership of a user in a project
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-Memberships
        title: >-
          The ReviewStore class shall store the membership of a user in a project with its role (project administrator
          or user) and return the membership of a user in a project, or nothing when there is none.
        justification: |
          Memberships decide which projects a user may see, so each must come back as it was stored.
        tests:
          - ReviewStore_AddMembershipAsync_Membership_RoundTripsAndIsListed

      - id: ReviewCenter-ReviewStore-Memberships-ListByProject
        title: >-
          The ReviewStore class shall list the memberships of a project, and no membership of another project.
        justification: |
          The administration of a project needs the members of that project.
        tests:
          - ReviewStore_AddMembershipAsync_Membership_RoundTripsAndIsListed

      - id: ReviewCenter-ReviewStore-Memberships-ListByUser
        title: >-
          The ReviewStore class shall list the memberships of a user, and no membership of another user.
        justification: |
          The projects of a user are the projects of the memberships of that user.
        tests:
          - ReviewStore_AddMembershipAsync_Membership_RoundTripsAndIsListed

      - id: ReviewCenter-ReviewStore-Memberships-Exists
        title: >-
          The ReviewStore class shall refuse with the MembershipExists rule a second membership of the same user in the
          same project.
        justification: |
          A second row for the same pair would make the role ambiguous.
        tests:
          - ReviewStore_AddMembershipAsync_SecondMembership_IsRejected

      - id: ReviewCenter-ReviewStore-Memberships-ExistsRoleKept
        title: >-
          The ReviewStore class shall keep the role of the existing membership when it refuses a second membership.
        justification: |
          A refused addition must not change the access of the user.
        tests:
          - ReviewStore_AddMembershipAsync_SecondMembership_IsRejected

      - id: ReviewCenter-ReviewStore-Memberships-ChangeRole
        title: >-
          The ReviewStore class shall change the role of an existing membership.
        justification: |
          An administrator changes the role of a member without removing and adding the member again.
        tests:
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound

      - id: ReviewCenter-ReviewStore-Memberships-ChangeRoleReportsTrue
        title: >-
          The ReviewStore class shall report true when it changed the role of an existing membership.
        justification: |
          The caller that changed a role must be told that the member now has the new access, and not take true for a
          change that was not made.
        tests:
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound

      - id: ReviewCenter-ReviewStore-Memberships-ChangeRoleNotFound
        title: >-
          The ReviewStore class shall report false when the role of a membership that does not exist is changed.
        justification: |
          The caller must be told that no role was changed, so that it does not show a role that nobody holds.
        tests:
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound

      - id: ReviewCenter-ReviewStore-Memberships-Remove
        title: >-
          The ReviewStore class shall remove an existing membership.
        justification: |
          A user who leaves a project must lose the access of the membership.
        tests:
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound

      - id: ReviewCenter-ReviewStore-Memberships-RemoveReportsTrue
        title: >-
          The ReviewStore class shall report true when it removed an existing membership.
        justification: |
          The caller that removed a member must be told that the access is gone, and not take true for a removal that
          was not made.
        tests:
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound

      - id: ReviewCenter-ReviewStore-Memberships-RemoveNotFound
        title: >-
          The ReviewStore class shall report false when a membership that does not exist is removed.
        justification: |
          The caller must be told that no membership was removed, so that it does not claim that a user lost access
          that the user never had.
        tests:
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound

      - id: ReviewCenter-ReviewStore-Memberships-Audit
        title: >-
          The ReviewStore class shall record one audit entry for each addition, role change, and removal of a
          membership.
        justification: |
          A change of access that is stored without its entry, or an entry without its change, would leave the history
          of who had access untrue.
        tests:
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject

      - id: ReviewCenter-ReviewStore-Memberships-AuditProject
        title: >-
          The ReviewStore class shall name the project in the audit entry of a membership change.
        justification: |
          The history of one project can then be read from the audit trail.
        tests:
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject

      - id: ReviewCenter-ReviewStore-Memberships-NoEntryWhenNotFound
        title: >-
          The ReviewStore class shall record no audit entry for the removal of a membership that does not exist.
        justification: |
          A removal that found nothing is not a change of access, so an entry would claim that a member left who was
          never there.
        tests:
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject

      # ---------------------------------------------------------------------------------------------------------------
      # LastAdmin: a project keeps an administrator
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-LastAdmin
        title: >-
          The ReviewStore class shall, when it is told to require another administrator, refuse the removal of the
          membership of an enabled project administrator unless another enabled project administrator of the project
          remains, reporting a last project administrator rule violation.
        justification: |
          A check made before the change is not enough when two administrators act at the same moment: each would see
          the other and both would go. Only the store, inside the transaction that also writes the audit entry, can
          keep a project from losing its last administrator.
        tests:
          - ReviewStore_RemoveMembershipAsync_LastAdmin_RefusedAndRolledBackUnlessExempt

      - id: ReviewCenter-ReviewStore-LastAdmin-Demote
        title: >-
          The ReviewStore class shall, when it is told to require another administrator, refuse to change the role of
          an enabled project administrator to user unless another enabled project administrator remains, reporting a
          last project administrator rule violation.
        justification: |
          A demotion takes the administrator away as much as a removal does.
        tests:
          - ReviewStore_RemoveMembershipAsync_LastAdmin_RefusedAndRolledBackUnlessExempt

      - id: ReviewCenter-ReviewStore-LastAdmin-DisabledAdminNotCounted
        title: >-
          The ReviewStore class shall not count a disabled administrator as another administrator that remains.
        justification: |
          A disabled administrator cannot administer, so the project would be left without a usable one.
        tests:
          - ReviewStore_RemoveMembershipAsync_OtherAdminDisabled_IsRefused

      - id: ReviewCenter-ReviewStore-LastAdmin-RemoveRacesRemove
        title: >-
          The ReviewStore class shall let exactly one of two removals made at the same time succeed when two project
          administrators remove each other, each demanding that another administrator remains.
        justification: |
          Each of the two would see the other as the remaining administrator if the check and the change were not one
          atomic step.
        tests:
          - ReviewStore_RemoveMembershipAsync_TwoAdminsRemoveEachOther_ExactlyOneSucceeds

      - id: ReviewCenter-ReviewStore-LastAdmin-RemoveRacesRemoveLeavesOne
        title: >-
          The ReviewStore class shall leave one administrator in the project after two project administrators remove
          each other at the same time.
        justification: |
          A project that ended with no administrator after two removals that raced would be one that nobody can
          administer or repair.
        tests:
          - ReviewStore_RemoveMembershipAsync_TwoAdminsRemoveEachOther_ExactlyOneSucceeds

      - id: ReviewCenter-ReviewStore-LastAdmin-RemoveRacesDemote
        title: >-
          The ReviewStore class shall refuse one of a removal and a demotion of the two administrators of a project that
          are made at the same time.
        justification: |
          A removal and a demotion race in the same way as two removals.
        tests:
          - ReviewStore_MembershipChanges_RemoveRacesDemote_LeavesAnAdministrator

      - id: ReviewCenter-ReviewStore-LastAdmin-RemoveRacesDemoteLeavesOne
        title: >-
          The ReviewStore class shall leave one administrator in the project after a removal and a demotion of its two
          administrators are made at the same time.
        justification: |
          A removal and a demotion that both took effect would leave the project without the administrator that the
          rule promises.
        tests:
          - ReviewStore_MembershipChanges_RemoveRacesDemote_LeavesAnAdministrator

      - id: ReviewCenter-ReviewStore-LastAdmin-NothingStored
        title: >-
          The ReviewStore class shall keep the membership and the role of the administrator as they were when it
          refuses a change because of the last administrator.
        justification: |
          A refused removal or demotion that had already altered a row would leave the administrator with less access
          than the refusal told.
        tests:
          - ReviewStore_RemoveMembershipAsync_LastAdmin_RefusedAndRolledBackUnlessExempt
          - ReviewStore_RemoveMembershipAsync_OtherAdminDisabled_IsRefused

      - id: ReviewCenter-ReviewStore-LastAdmin-NoAuditEntry
        title: >-
          The ReviewStore class shall record no audit entry when it refuses a change because of the last
          administrator.
        justification: |
          An entry for a refused removal or demotion would tell the history that an administrator lost the project when
          the administrator did not.
        tests:
          - ReviewStore_RemoveMembershipAsync_LastAdmin_RefusedAndRolledBackUnlessExempt

      - id: ReviewCenter-ReviewStore-LastAdmin-ExemptSystemAdmin
        title: >-
          The ReviewStore class shall remove the membership of the last administrator of a project without the check
          when it is not told to require another administrator.
        justification: |
          A system administrator is exempt from the rule, so the store must also be able to apply the change without
          it.
        tests:
          - ReviewStore_RemoveMembershipAsync_LastAdmin_RefusedAndRolledBackUnlessExempt

      # ---------------------------------------------------------------------------------------------------------------
      # UserImpact: what a user holds in the review process
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-ReviewStore-UserImpact
        title: >-
          The ReviewStore class shall list the reviewer slots in which a user is the primary or the alternate reviewer,
          each with the project name, the review identifier and title, the slot identity, and the role of the user.
        justification: |
          The offboarding impact of a user is built from this read, so it must name every slot the user holds.
        tests:
          - ReviewStore_ListSlotsOfUserAsync_PrimaryAndAlternate_AreFoundInOrder

      - id: ReviewCenter-ReviewStore-UserImpact-Order
        title: >-
          The ReviewStore class shall order the slots of a user by project, review, and slot.
        justification: |
          An offboarding page that reads the slots in a fixed order shows the same list each time, so that an
          administrator can check it against the earlier one.
        tests:
          - ReviewStore_ListSlotsOfUserAsync_PrimaryAndAlternate_AreFoundInOrder

      - id: ReviewCenter-ReviewStore-UserImpact-OtherUsersSlots
        title: >-
          The ReviewStore class shall leave out of the slots of a user the slots in which the user is neither the
          primary nor the alternate reviewer.
        justification: |
          The impact of a user must not include the work of others.
        tests:
          - ReviewStore_ListSlotsOfUserAsync_PrimaryAndAlternate_AreFoundInOrder

      - id: ReviewCenter-ReviewStore-UserImpact-NoSlots
        title: >-
          The ReviewStore class shall return no slots for a user that holds none, and for a user that does not exist.
        justification: |
          A user without slots has no impact on reviews.
        tests:
          - ReviewStore_ListSlotsOfUserAsync_NoSlot_IsEmpty

      - id: ReviewCenter-ReviewStore-UserImpact-SoleAdmin
        title: >-
          The ReviewStore class shall list the projects in which an enabled user is a project administrator and no
          other enabled user is.
        justification: |
          Disabling such a user would leave the project without an administrator, so the offboarding must tell it.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_OnlyEnabledAdministrator_IsFound

      - id: ReviewCenter-ReviewStore-UserImpact-SoleAdminOrder
        title: >-
          The ReviewStore class shall order the sole-administrator projects of a user by name.
        justification: |
          A fixed order by name lets an administrator find a project in the warning at once and read the same list on
          each visit.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_OnlyEnabledAdministrator_IsFound

      - id: ReviewCenter-ReviewStore-UserImpact-SharedAdminLeftOut
        title: >-
          The ReviewStore class shall leave out of the sole-administrator projects a project in which another enabled
          user is also a project administrator.
        justification: |
          Such a project keeps an administrator when the user leaves.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_OnlyEnabledAdministrator_IsFound

      - id: ReviewCenter-ReviewStore-UserImpact-NotAdminLeftOut
        title: >-
          The ReviewStore class shall leave out of the sole-administrator projects a project in which the user is a
          member but not an administrator.
        justification: |
          The user is not the administrator of such a project, so leaving costs it nothing.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_OnlyEnabledAdministrator_IsFound

      - id: ReviewCenter-ReviewStore-UserImpact-DisabledAdminNotCounted
        title: >-
          The ReviewStore class shall not count a disabled administrator as another administrator when it decides
          whether a user is the sole administrator of a project.
        justification: |
          A disabled administrator cannot administer, which is the same rule as for the last-administrator check.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_DisabledOrOrdinaryOthers_DoNotCount

      - id: ReviewCenter-ReviewStore-UserImpact-OrdinaryMemberNotCounted
        title: >-
          The ReviewStore class shall not count an ordinary member as another administrator when it decides whether a
          user is the sole administrator of a project.
        justification: |
          A member who is not an administrator cannot take over the administration.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_DisabledOrOrdinaryOthers_DoNotCount

      - id: ReviewCenter-ReviewStore-UserImpact-DisabledUserNotReported
        title: >-
          The ReviewStore class shall report no sole-administrator project for a user that is disabled or does not
          exist, and for a user that is not an administrator.
        justification: |
          Only an enabled administrator is a loss to the project.
        tests:
          - ReviewStore_ListSoleAdminProjectsAsync_DisabledOrOrdinaryOthers_DoNotCount
