---
# Software Unit Requirements for the ReviewStore Class
#
# The ReviewStore class is the database implementation of the Core store interface.

sections:
  - title: ReviewStore Unit Requirements
    requirements:
      - id: ReviewCenter-ReviewStore-Projects
        title: >-
          The ReviewStore class shall save a project and assign its identifier, ignoring any identifier supplied
          by the caller, return a project by identifier or nothing when there is none, and list projects ordered
          by name.
        justification: |
          Pages list projects in a stable, predictable order and must tell a missing project from an existing
          one. Identifiers belong to the database alone, so a caller can never overwrite or collide with an
          existing project.
        tests:
          - ReviewStore_AddProjectAsync_ValidProject_RoundTrips
          - ReviewStore_AddProjectAsync_SuppliedId_IsIgnoredAndDatabaseAssignsOwn
          - ReviewStore_ListProjectsAsync_SeveralProjects_OrdersByName
          - ReviewStore_GetProjectAsync_UnknownId_ReturnsNull

      - id: ReviewCenter-ReviewStore-Reviews
        title: >-
          The ReviewStore class shall save a review with its files, keep the reviews of different projects
          apart even when their identifiers are the same, and list the reviews of one project ordered by
          identifier.
        justification: |
          A project page must show exactly the reviews of that project, in a stable order, and a review must be
          saved together with all of its files or not at all.
        tests:
          - ReviewStore_AddReviewAsync_BinaryCrLfAndEmptyFiles_StoresBytesVerbatim
          - ReviewStore_AddReviewAsync_SameIdInTwoProjects_KeepsThemApart
          - ReviewStore_ListReviewsAsync_TwoProjects_ReturnsOnlyOwnReviewsOrderedById

      - id: ReviewCenter-ReviewStore-Metadata
        title: >-
          The ReviewStore class shall return a review with the path, size, and hash of its files but without
          their content, return the content of one file on request, and return nothing for a review or file
          that does not exist.
        justification: |
          A review can hold tens of megabytes. Lists and detail pages need only file metadata, so content is
          read one file at a time, when a reviewer asks to see it.
        tests:
          - ReviewStore_GetReviewAsync_StoredReview_ReturnsMetadataWithoutContent
          - ReviewStore_GetReviewAsync_UnknownReviewOrFile_ReturnsNull

      - id: ReviewCenter-ReviewStore-Source
        title: >-
          The ReviewStore class shall save the source of a review from a repository (repository identity and
          name, baseline and head commit identifiers, selection text, and the review-set identifier) and, for each
          file, its change kind and
          its baseline content with their size and hash, return them as metadata without any content, return the
          baseline content of one file only on request, and return nothing for a file that has no baseline.
        justification: |
          The frozen baseline is as large as the head content, so it is read one file at a time like the head
          content. The source must come back as saved, because the review page, the history, and the record
          digest all show it.
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes
          - ReviewStore_GetBaselineContentAsync_StoredFiles_ReturnsBaselineBytesOrNull
          - ReviewStore_AddReviewAsync_LongestReviewSetId_RoundTrips

      - id: ReviewCenter-ReviewStore-Duplicate
        title: >-
          The ReviewStore class shall report a review whose project and identifier already exist as a domain
          rule exception that names the duplicate identifier rule.
        justification: |
          When two requests create the same review identifier at the same moment, the database refuses the
          second one. The caller must receive the same rule violation as for the ordinary duplicate check, so
          that the user sees one consistent message.
        tests:
          - ReviewStore_AddReviewAsync_DuplicateKey_ThrowsReviewIdDuplicate

      - id: ReviewCenter-ReviewStore-Threads
        title: >-
          The ReviewStore class shall save a thread with its first comment and assign their identifiers, append
          a comment to a thread of a review, change the state of a thread, list the threads of one review with
          their comments in creation order while keeping the threads of different reviews apart, and report a
          thread that does not exist as nothing or false. Each comment keeps the user name and the display name of
          its author, the kind (a comment or a resolution) and whether it is included in the report, and each thread
          keeps the side (head or baseline) it was anchored to.
        justification: |
          Pages show the threads of exactly one review in a stable order, and a thread must be saved together
          with its first comment or not at all. Identifiers belong to the database alone, and the user name
          keeps an author identifiable when the display name later changes. The side says which text the lines
          of a thread belong to, and must come back as it was saved. The flag decides what the signed record
          covers, so it must come back exactly as it was saved, and the kind of a thread follows from it.
        tests:
          - ReviewStore_AddThreadAsync_WholeFileAndRange_RoundTripsWithComments
          - ReviewStore_AddThreadAsync_Side_IsPersisted
          - ReviewStore_AddThreadAsync_Side_IsStoredAsText
          - ReviewStore_AddCommentAsync_ExistingThread_AppendsInOrder
          - ReviewStore_AddCommentAsync_UnknownOrOtherReviewThread_ReturnsNull
          - ReviewStore_ReopenThreadAsync_ExistingAndUnknown_ReopensOrReturnsFalse
          - ReviewStore_ListThreadsAsync_TwoReviews_ReturnsOnlyOwnThreadsInOrder
          - ReviewStore_AddThreadAsync_IncludedComment_PersistsFlagAndKind
          - ReviewStore_AddCommentAsync_IncludedReply_PersistsFlag
          - ReviewStore_GetRecordAsync_ThreadKind_DerivedFromStartingComment

      - id: ReviewCenter-ReviewStore-CheckThreads
        title: >-
          The ReviewStore class shall save a thread about a check of the checklist, with its check identifier, an
          empty file and no lines, without any file row, and read the identifier back, shall refuse a thread that
          names both a file and a check or neither with an ArgumentException, shall refuse inside the transaction a
          thread on a file that the review does not have with an InvalidOperationException, with nothing saved in
          each case, and shall refuse the final
          signature of a review while a check thread is open, inside the transaction that saves it.
        justification: |
          A thread belongs to its review, and only a thread on a file needs that file. The database no longer ties a
          thread to a file, so the store must keep the rule that a file thread names a file of its review, and that
          a thread has one anchor. A discussion about a check blocks the signature like any other open thread.
        tests:
          - ReviewStore_AddThreadAsync_CheckThread_RoundTripsCheckItemId
          - ReviewStore_AddThreadAsync_FileThreadOnMissingFile_IsRefused
          - ReviewStore_AddThreadAsync_ThreadWithBothOrNeitherAnchor_IsRefused
          - ReviewStore_Conclude_OpenCheckThread_IsRefusedInTheTransaction

      - id: ReviewCenter-ReviewStore-ThreadReport
        title: >-
          The ReviewStore class shall resolve a thread in one transaction together with the Resolution comment that
          carries the note, comparing the kind of the thread read inside that transaction with the kind the caller
          expected (refusing a changed kind with the RecordChanged rule) and refusing a Finding without
          a note with the ResolutionNoteRequired rule, shall have no other way to resolve a thread than that
          method (the reopen method cannot resolve), shall treat resolving a thread that is already resolved as
          nothing done, shall promote or demote a thread by setting the flag of its starting comment and of all its
          Resolution comments in one transaction, shall change the flag of a reply and refuse the starting comment
          and a Resolution comment, each change with its audit entry in the same transaction, and shall refuse
          every one of these writes, and the reopening of a thread, on a concluded review with the
          ReviewLocked rule.
        justification: |
          The check of the service is made before the transaction, so another request can change the thread in
          between. The note, the acknowledgement of the signatures and the report flag were decided for the kind the
          service saw, so a changed kind must be refused and not accepted silently, and the resolution-note rule must
          hold for every resolution, so the store offers no other way to set a thread to resolved. Writing the state,
          the note, and the audit entry together keeps them from disagreeing.
        tests:
          - ReviewStore_ResolveThreadAsync_FindingWithoutResolution_ThrowsResolutionNoteRequired
          - ReviewStore_ResolveThreadAsync_KindChangedSinceRead_ThrowsRecordChangedAndStoresNothing
          - ReviewStore_ThreadStateMethods_CannotResolveWithoutNote_ReopenStillWorks
          - ReviewStore_ResolveThreadAsync_FindingWithNote_StoresIncludedResolutionAndAudits
          - ReviewStore_ResolveThreadAsync_AlreadyResolved_ReturnsFalseAndAddsNothing
          - ReviewStore_SetThreadKindAsync_PromoteDemote_UpdatesStartingAndResolutionComments
          - ReviewStore_SetThreadKindAsync_ResolvedQuestionWithoutNote_ThrowsResolutionNoteRequired
          - ReviewStore_SetCommentReportAsync_ReplyToggles_StartingAndResolutionRefused
          - ReviewStore_ThreadWrites_ConcludedReview_ThrowReviewLocked

      - id: ReviewCenter-ReviewStore-OpenThreadSigningRecheck
        title: >-
          The ReviewStore class shall refuse inside the transaction that saves a signature, after the comparison of
          the digest, a signature while any thread of the review is not resolved, with the SigningNotAllowed rule and
          without storing anything, and shall decide whether a review is concluded for the records it reads with the
          same rule as the ReviewLock helper.
        justification: |
          The service checks the open threads before it saves the signature, but a thread can be started in between.
          Checking again in the transaction closes that gap, so no review is signed with a thread that was opened
          before the signature was saved.
        tests:
          - ReviewStore_AddSignatureAsync_OpenThread_ThrowsSigningNotAllowedAndStoresNothing
          - ReviewStore_AddSignatureAsync_ThreadOpenedBeforeFinalSignature_IsRefused
          - ReviewStore_IsConcluded_Records_FollowReviewLock

      - id: ReviewCenter-ReviewStore-Checklist
        title: >-
          The ReviewStore class shall save the checklist snapshot of a review together with the review, return
          it, or nothing when the review has none, save the applicability of a section and the answer to a
          check in the ballot of a reviewer slot by replacing any earlier one so that each slot has one row for each
          section and check, and read them back from the ballot with their user names, display names, and times
          unchanged.
        justification: |
          The snapshot must exist exactly when the review exists, and a check has one current answer in each ballot.
          User names, display names, and times are part of the record and must come back as saved.
        tests:
          - ReviewStore_AddReview_WithChecklist_StoresSnapshotAtomically
          - ReviewStore_GetChecklist_ReviewWithoutSnapshot_ReturnsNull
          - ReviewStore_SetBallotAnswer_UpsertsSingleRowPerItem
          - ReviewStore_SetBallotSectionState_UpsertsSingleRowPerSection
          - ReviewStore_BallotRows_RoundTripOutcomeAndTimestamps

      - id: ReviewCenter-ReviewStore-Slots
        title: >-
          The ReviewStore class shall add a reviewer slot to a review and assign its identifier, ignoring any
          identifier supplied by the caller, list the slots of one review in the order they were added while
          keeping the slots of different reviews apart, refuse a slot for a review that does not exist, change
          the reviewers of a slot, remove a slot, and report an update or removal of a slot that does not exist
          in the stated review as not found.
        justification: |
          A review is signed by the reviewers of its slots. Pages show the slots of exactly one review in a
          stable order, and a slot of a review that does not exist or an identifier chosen by a caller would
          corrupt the record.
        tests:
          - ReviewStore_AddSlotAsync_TwoSlots_AssignsIdsAndListsInOrderPerReview
          - ReviewStore_AddSlotAsync_UnknownReview_IsRefusedByDatabase
          - ReviewStore_UpdateAndRemoveSlotAsync_ExistingAndUnknown_ChangesOrReturnsFalse

      - id: ReviewCenter-ReviewStore-Record
        title: >-
          The ReviewStore class shall read, as one consistent snapshot, the record of a review that a signature
          covers - its content fingerprint, its checklist, the ballots of its reviewer slots with their answers and
          section states, and its threads with their comments in posting order - and return nothing for a review
          that does not exist.
        justification: |
          A signature binds a reviewer to exactly one state of the record. Reading the parts one after the other
          could mix two states, so the record is read as a whole. A review that does not exist has no record.
        tests:
          - ReviewStore_GetRecordAsync_StoredReview_CarriesFingerprintAnswersThreadsAndComments
          - ReviewStore_GetRecordAsync_UnknownReview_ReturnsNull
          - ReviewStore_GetRecordAsync_RepositoryReview_CarriesSourceAndChanges
          - ReviewStore_GetRecordAsync_UploadReview_HasUploadSource
          - ReviewStore_GetSnapshotAsync_SignedReview_CarriesRecordSlotsAndSignatures
          - ReviewStore_GetSnapshotAsync_UnknownReview_ReturnsNull

      - id: ReviewCenter-ReviewStore-SnapshotBatch
        title: >-
          The ReviewStore class shall read the snapshots of several reviews of a project, and the reopens of several
          reviews, with a number of queries that does not grow with the number of reviews, in one read transaction
          for the snapshots, through the same assembly of the record as the single-review read, so that each
          snapshot equals the snapshot of that review read alone, shall leave out a review that does not exist,
          shall read each identifier once, and shall return an empty result without reading the database when there
          are no identifiers.
        justification: |
          A project overview needs the approval status and the blockers of every review of the project. Reading one
          snapshot per review would make the cost of the overview grow with the number of reviews (about ten queries
          each). One set-based read, sharing the code that assembles the record with the single read, keeps the cost
          constant and cannot differ from the single read.
        tests:
          - ReviewStore_ListSnapshotsAsync_SeveralReviews_EqualsSingleReadsAndReopenHistory
          - ReviewStore_ListSnapshotsAsync_EmptyUnknownDuplicateAndForeignIds_AreAbsentOrReadOnce
          - ReviewStore_ListSnapshotsAsync_MoreIdsThanOneChunk_ReadsAll
          - ReviewStore_ListSnapshotsAsync_MoreReviews_SendsTheSameNumberOfQueries

      - id: ReviewCenter-ReviewStore-Signatures
        title: >-
          The ReviewStore class shall keep signatures append-only, offering only to add a signature and to list
          the signatures of one review in the order they were added. It shall store every value of a signature,
          including its outcome (Approved or Rejected), and assign its identifier. It shall refuse a signature, store
          nothing, and report that the record
          changed when the digest of the signature is not the digest of the record stored at that moment, or when its
          outcome is not the agreed outcome of the record stored at that moment, even
          when another request changes the record at the same time. It shall refuse a second signature of the
          same slot with the same digest as a signing that is not allowed, and refuse a signature for a slot or
          a review that does not exist.
        justification: |
          A signature is evidence that a reviewer approved one exact record. It must never change or disappear,
          and it must never be stored for a record other than the one it names. The check and the insert must not
          be separated by another change, and a double submit must not store the same signature twice.
        tests:
          - ReviewStore_AddSignatureAsync_CurrentDigest_StoresAndRoundTrips
          - ReviewStore_AddSignatureAsync_StaleDigest_ThrowsRecordChangedAndStoresNothing
          - ReviewStore_AddSignatureAsync_SameSlotAndDigestTwice_ThrowsSigningNotAllowed
          - ReviewStore_AddSignatureAsync_UnknownSlotOrReview_IsRefused
          - ReviewStore_AddSignatureAsync_RejectedOutcome_PersistsOutcome
          - ReviewStore_AddSignatureAsync_OutcomeDiffersFromRecord_ThrowsRecordChangedAndStoresNothing
          - ReviewStore_AddSignatureAsync_RejectedSignatureWithoutChecklist_ThrowsRecordChanged
          - ReviewStore_SerializableTransaction_TakesWriteLockAtBegin

      - id: ReviewCenter-ReviewStore-EvidenceSettings
        title: >-
          The ReviewStore class shall store the evidence settings of a project with the project, with the default
          settings for a project that was not given others, return them with every project it reads or lists, and
          change them only through an atomic compare-and-set that applies the new settings when the stored ones
          still equal the settings the caller started from, changes only that project, stores the audit entry of
          the change in the same transaction, and reports, without a change and without an entry, a project that
          does not exist or settings that are no longer the expected ones.
        justification: |
          The settings decide who may read the evidence and what a PDF contains, so a change must neither be lost
          nor silently overwrite the change of another administrator, and a change that is stored without its entry,
          or an entry without its change, would leave the history of the settings untrue. The comparison is part
          of the update, so two administrators who save at the same time cannot both succeed.
        tests:
          - ReviewStore_AddProjectAsync_NewProject_HasDefaultEvidenceSettings
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited
          - ReviewStore_UpdateEvidenceSettingsAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-ReviewStore-ProjectChecklist
        title: >-
          The ReviewStore class shall store the checklist definition of a project, as unbounded text, with the
          project, with no definition for a project that was not given one, return it with every project it reads
          or lists, and change it only through an atomic compare-and-set that applies the new definition, or removes
          it, when the stored one still equals the definition the caller started from, changes only that project,
          stores the audit entry of the change in the same transaction so that the hash chain stays intact, and
          reports, without a change and without an entry, a project that does not exist or a definition that is no
          longer the expected one, even when two callers change it at the same time.
        justification: |
          The definition decides the wording of every review created later, so a change must neither be lost nor
          silently overwrite the change of another administrator, and a change that is stored without its entry,
          or an entry without its change, would leave the history of the checklist untrue. The comparison is part
          of the update, so two administrators who save at the same time cannot both succeed.
        tests:
          - ReviewStore_AddProjectAsync_ChecklistDefinition_IsNullByDefaultAndKeptWhenGiven
          - ReviewStore_UpdateChecklistDefinitionAsync_LargeText_RoundTripsThroughTheColumn
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing
          - ReviewStore_UpdateChecklistDefinitionAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-ReviewStore-DueDate
        title: >-
          The ReviewStore class shall store the optional due date of a review as a calendar day, with no date for a
          review that was not given one, and change it only through an atomic compare-and-set that applies the new
          date, or removes it, when the stored one still equals the date the caller started from, changes only that
          review, stores the audit entry of the change in the same transaction so that the hash chain stays intact,
          and reports, without a change and without an entry, a review that does not exist or a date that is no
          longer the expected one, even when two callers change it at the same time.
        justification: |
          A change must neither be lost nor silently overwrite the change of another person, and a date that is
          stored without its entry, or an entry without its date, would leave the history of the due date untrue.
          The comparison is part of the update, so two people who save at the same time cannot both succeed.
        tests:
          - ReviewStore_AddReviewAsync_DueDate_RoundTripsAsCalendarDay
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing
          - ReviewStore_UpdateDueDateAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-ReviewStore-ReviewConclusionText
        title: >-
          The ReviewStore class shall store the optional review conclusion text of a review (the free text, not the
          approved or rejected conclusion) and load it into the record that a signature covers, and change it only
          through an atomic compare-and-set that applies the new text, or removes it, when the stored one still equals
          the text the caller started from, changes only that review, stores the audit entry of the change in the same
          transaction so that the hash chain stays intact, reports, without a change and without an entry, a review
          that does not exist or a text that is no longer the expected one, and refuses a concluded review with the
          ReviewLocked rule inside that transaction.
        justification: |
          A change must neither be lost nor silently overwrite the change of another person, and a text that is stored
          without its entry, or an entry without its text, would leave the history untrue. The comparison and the
          lock check are part of the update, so two people who save at the same time cannot both succeed and a
          signed record cannot change under a signature.
        tests:
          - ReviewStore_UpdateReviewConclusionTextAsync_StoresTextAndAuditAndRecord
          - ReviewStore_UpdateReviewConclusionTextAsync_CompareAndSet_RefusesStaleExpectation
          - ReviewStore_UpdateReviewConclusionTextAsync_MissingReview_ReturnsFalse
          - ReviewStore_UpdateReviewConclusionTextAsync_ConcludedReview_ThrowsReviewLocked

      - id: ReviewCenter-ReviewStore-Ballots
        title: >-
          The ReviewStore class shall store the answers and the section states of a review for each reviewer slot, one
          row for each check or section and slot, so that the same check answered in two slots is stored twice, shall
          keep the status of each slot's ballot (draft or submitted, with the time and the user name of the hand-in),
          list and read the ballots with their own rows only, and refuse a slot that does not belong to the review, the
          review-level identity 0, and a concluded review with the ReviewLocked rule inside the write transaction. An
          edit shall make a submitted ballot a draft again, shall hand in a complete ballot at once in a review with
          exactly one slot, and shall add the audit entry of the status change, naming the slot number only, in the same
          transaction as the edit, so that the hash chain stays intact. The review-level rows that a follow-up review
          carries shall not be part of any ballot.
        justification: |
          Each reviewer needs an answer of their own, so a row can no longer be identified by the review and the check
          alone. A status that is stored without its entry, or an entry without its status, would leave the history of
          the ballot untrue. The lock check is part of the write, so a signed record cannot change under a signature.
        tests:
          - ReviewStore_SetBallotAnswerAsync_FirstAnswer_CreatesDraftBallot
          - ReviewStore_SetBallotAnswerAsync_SameItemTwoSlots_StoresOneRowPerSlot
          - ReviewStore_SetBallotAnswerAsync_SameSlotAgain_ReplacesTheAnswer
          - ReviewStore_SetBallotAnswerAsync_UnknownOrForeignSlot_ThrowsSlotNotFound
          - ReviewStore_SetBallotAnswerAsync_BaselineSlotId_IsRefused
          - ReviewStore_SetBallotAnswerAsync_ConcludedReview_ThrowsReviewLocked
          - ReviewStore_SetBallotSectionStateAsync_PerSlotRows_RoundTrip
          - ReviewStore_SetBallotAnswerAsync_SubmittedBallot_RevertsToDraftWithAudit
          - ReviewStore_SetBallotAnswerAsync_SingleSlotCompleteBallot_AutoSubmitsWithAudit
          - ReviewStore_SetBallotAnswerAsync_SingleSlotSubmittedBallotEdited_StaysSubmittedWithoutTransitionAudit
          - ReviewStore_SetBallotAnswerAsync_TwoSlots_NeverAutoSubmits
          - ReviewStore_ListBallotsAsync_TwoSlots_ReturnsOwnRowsInSlotOrder
          - ReviewStore_GetBallotAsync_NotStartedSlot_ReturnsNull
          - ReviewStore_BallotTransitions_KeepTheAuditChainIntact

      - id: ReviewCenter-ReviewStore-RecordBallots
        title: >-
          The ReviewStore class shall load all ballots of a review, drafts included, each with its status, its answers,
          and its section states, into the record that a signature covers, in slot order and from the rows of one read
          transaction, for the single read of a record and for the snapshots of several reviews alike, so that the
          snapshot of a review read in a batch equals the snapshot read alone, and shall load no ballot for a review
          in which no slot has started one.
        justification: |
          The digest of a record covers the consolidation of the submitted ballots, and the services show a reviewer the
          draft of their own slot, so the record must carry every ballot with its status and leave the choice of the
          submitted ones to the digest. Loading the ballots of all reviews of a batch with set-based queries keeps the
          cost of the overview constant, and sharing the loader with the single read keeps a batch entry from differing
          from it.
        tests:
          - ReviewStore_GetRecordAsync_BallotRows_AreInTheRecordAsBallots
          - ReviewStore_GetRecordAsync_StoredReview_CarriesFingerprintAnswersThreadsAndComments
          - ReviewStore_ListSnapshotsAsync_SeveralReviews_EqualsSingleReadsAndReopenHistory

      - id: ReviewCenter-ReviewStore-LegacyBaseline
        title: >-
          The ReviewStore class shall keep listing the review-level answers and section states that a follow-up review
          carries from the review it follows (the legacy baseline) without any row of a ballot, shall refuse the
          review-level slot identity in the methods that write a ballot, so that these rows can be created only with the
          follow-up review, and shall store the answer
          or section state that a reviewer gives to a carried check or section in the ballot of the slot, without the
          carried mark, leaving the review-level carried row as it was.
        justification: |
          A follow-up review starts from what its predecessor agreed on. Those rows stay readable as the baseline that
          seeds the ballot of a new slot, but a reviewer's answer belongs to the ballot of the reviewer's slot, so the
          baseline must neither mix with the ballots nor change when somebody answers again.
        tests:
          - ReviewStore_ListChecklistAnswersAsync_BallotRows_AreNotListedAsReviewRows
          - ReviewStore_SetBallotAnswerAsync_BaselineSlotId_IsRefused
          - ReviewStore_SetBallotAnswerAndSectionState_CarriedRows_AreReplacedWithoutMarker

      - id: ReviewCenter-ReviewStore-SignOwnBallot
        title: >-
          The ReviewStore class shall refuse a signature with the BallotNotSubmitted rule, inside the write transaction
          and without storing anything, while the ballot of the slot being signed is a draft or does not exist in a
          review that has a checklist, and shall store the signature once that ballot is handed in.
        justification: |
          The digest covers only the submitted ballots, so a draft of the signer changes nothing in it and the digest
          comparison cannot see it. The check inside the write transaction closes the gap to an edit that lands between
          the check of the service and the write.
        tests:
          - ReviewStore_AddSignatureAsync_OwnBallotDraft_ThrowsBallotNotSubmitted

      - id: ReviewCenter-ReviewStore-BallotSubmit
        title: >-
          The ReviewStore class shall hand in the ballot of a slot only through an atomic compare-and-set from draft to
          submitted that asks the caller's completeness test about the rows of the same transaction, stores the time and
          the user name of the hand-in together with the audit entry of the caller, refuses an incomplete ballot with
          the BallotIncomplete rule without storing anything, and returns a ballot that is already submitted as it is,
          without a write and without an entry.
        justification: |
          Two reviewers, or one reviewer twice, can hand in at the same moment, and an edit can arrive between the
          check and the write. Testing the completeness inside the write transaction means that a ballot is never
          submitted with a check unanswered, and the idempotent second call keeps the first time and user and adds no
          second entry for one hand-in.
        tests:
          - ReviewStore_SubmitBallotAsync_CompleteDraft_SubmitsWithAudit
          - ReviewStore_SubmitBallotAsync_IncompleteBallot_ThrowsBallotIncompleteAndStoresNothing
          - ReviewStore_SubmitBallotAsync_AlreadySubmitted_ReturnsBallotWithoutAudit
          - ReviewStore_SubmitBallotAsync_NoBallotAndNothingToAnswer_StoresSubmittedBallot

      - id: ReviewCenter-ReviewStore-BallotSlotLifecycle
        title: >-
          The ReviewStore class shall, in the transaction of the slot change, seed the ballot of a new slot with copies
          of the rows that a follow-up review carried (and no ballot when there are none), remove the rows that a
          departing reviewer gave from the ballot of the slot, keep the carried rows, make a submitted ballot a draft
          again and record a reassignment entry that names the slot number and counts only, leave the ballot alone when
          the reviewers of a slot only swap roles, and delete the rows and the status of the ballot of a removed slot,
          while the refusal to remove a signed slot keeps them.
        justification: |
          A slot gets a new reviewer, or loses one, while the review is still open. The new reviewer must start from
          what the review carried, the departed reviewer's answers must not stay under the name of the slot, and a
          deleted slot must leave no orphan rows that a later slot with the same identity could pick up. All of it
          happens in one
          transaction with its entry, so a failure leaves the ballot as it was.
        tests:
          - ReviewStore_AddSlotAsync_FollowUpBaseline_SeedsDraftBallotWithCarriedRows
          - ReviewStore_AddSlotAsync_NoBaseline_CreatesNoBallot
          - ReviewStore_UpdateSlotAsync_DepartingUser_RemovesOwnRowsAndRevertsToDraft
          - ReviewStore_UpdateSlotAsync_CarriedRowsOfDepartingUser_AreKept
          - ReviewStore_UpdateSlotAsync_RoleSwapOnly_KeepsBallot
          - ReviewStore_RemoveSlotAsync_WithBallot_DeletesTheBallotRows
          - ReviewStore_RemoveSlotAsync_SignedSlot_IsRefusedAndKeepsBallotRows

      - id: ReviewCenter-ReviewStore-FollowUp
        title: >-
          The ReviewStore class shall store a follow-up review with the review that it follows, the numbers of
          answers and threads it took over, and the rows it carries (answers, not-applicable sections, and threads
          with copies of their comments including the kind and the report flag of each, each with the review it came
          from and, for a thread, its number there), all
          in the one transaction that stores the review and its audit entry, so that a carry that fails stores no
          review, no row, and no entry, shall give the threads new numbers of their own, shall load the follow-up
          and the carried marks of the threads into the record that a signature covers, and shall store an answer or
          a section that replaces a carried one in a ballot without the carried mark.
        justification: |
          A follow-up that exists without the answers it says it carried, or carried rows without the review, would
          make the record untrue, so everything is stored together or not at all. A thread of the new review is its own
          thread, so it needs its own number. The follow-up link and the mark of a thread are part of what a signature
          covers, so the record must load them, and an answer that a person gave again must not keep a mark that says
          it was taken over.
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn
          - ReviewStore_AddReviewAsync_FollowUpCarryFails_CreatesNothing
          - ReviewStore_SetBallotAnswerAndSectionState_CarriedRows_AreReplacedWithoutMarker
          - ReviewStore_AddReviewAsync_CarriedFinding_PersistsFlagsAndKind

      - id: ReviewCenter-ReviewStore-ApprovalLockInTransaction
        title: >-
          The ReviewStore class shall refuse with the ReviewLocked rule, inside the same transaction that would store
          the change, to store a thread, a comment, a thread state, a resolution, a change of the kind of a thread, a
          change of whether a comment is in the report, a section state or an answer of a ballot, a due date,
          or the addition, change, or removal of a reviewer slot, when the review is concluded at that moment, using
          the same definition of concluded as the Core services (every slot signed for the current record and no
          thread open), shall store nothing and no audit entry then, and
          shall not refuse a change to a review that does not exist for this reason.
        justification: |
          The Core services check the lock before they write, but a final signature may be stored between that check
          and the change. Repeating the check in the transaction of the change closes that gap, so that no
          interleaving of two requests can change a concluded review.
        tests:
          - ReviewStore_WriteMethods_ApprovedReview_RefuseWithReviewLockedInTransaction
          - ReviewStore_WriteMethods_UnknownReview_AreNotRefusedAsLocked
          - ReviewStore_AddSignatureAsync_RacingWithWrite_SignatureStartedFirst_EndsConsistent
          - ReviewStore_AddSignatureAsync_RacingWithWrite_WriteStartedFirst_EndsConsistent
          - ReviewStore_ThreadWrites_ConcludedReview_ThrowReviewLocked

      - id: ReviewCenter-ReviewStore-ReopenHistory
        title: >-
          The ReviewStore class shall store the reopening of an approved review as an append-only row with the user,
          the display name, the time, the reason, and the digest of the approved record, together with its audit
          entry in one transaction, storing neither when either fails, and shall list the reopenings of one review in
          the order in which they were made.
        justification: |
          The history of who reopened which approval and why is evidence, so it must exist exactly when the reopening
          took effect, and it must be read back in the order in which the reopenings were made.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory
          - ReviewStore_ReopenReviewAsync_AuditInsertFails_RollsBackTheReopen
          - ReviewStore_ListReopensAsync_SeveralReviewsAndReopens_AreScopedAndInCreationOrder

      - id: ReviewCenter-ReviewStore-ReopenRefusal
        title: >-
          The ReviewStore class shall refuse with the ReviewNotLocked rule a reopening of a review that is not
          approved at that moment, and with the ReviewNotFound rule a reopening of a review that does not exist,
          inside the transaction that would store the reopening, storing no row and no audit entry, so that of two
          reopenings made at the same time exactly one succeeds.
        justification: |
          Two administrators acting together must not both reopen the same approval, and a reopening of a review that
          was never approved would put a false entry into the history. The check is made in the transaction of the
          change because only there can no other request come between the check and the row.
        tests:
          - ReviewStore_ReopenReviewAsync_NotApprovedOrUnknown_IsRefusedAndStoresNothing
          - ReviewStore_ReopenReviewAsync_TwoAtOnce_ExactlyOneSucceeds

      - id: ReviewCenter-ReviewStore-ReopenCount
        title: >-
          The ReviewStore class shall include the number of reopenings of a review in the record that a signature
          covers.
        justification: |
          Including the number in the record is what makes the signatures that were made before a reopening out of
          date, so that the reviewers have to sign again.
        tests:
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory

      - id: ReviewCenter-ReviewStore-IndependentReviewers
        title: >-
          The ReviewStore class shall store the setting that requires independent reviewers with the project, on for
          a project that was not given another value, return it with every project it reads or lists, and change it
          only through an atomic compare-and-set that stores the audit entry of the change in the same transaction
          and reports, without a change and without an entry, a project that does not exist or a value that is no
          longer the expected one.
        justification: |
          The setting decides who may sign, so it follows the same atomic rule as the other settings of a project: a
          change must neither be lost nor silently overwrite the change of another administrator, and it must not be
          stored without its entry.
        tests:
          - ReviewStore_AddProjectAsync_RequireIndependentReviewers_IsStoredAndReturned
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet

      - id: ReviewCenter-ReviewStore-ReviewRuleSwitches
        title: >-
          The ReviewStore class shall store the two further review rules (authors answering the checklist of their
          own review, and the person who reopened a review signing it again) with the project, on for a project that
          was not given another value, return them with every project it reads or lists, and change each only through
          an atomic compare-and-set that stores the audit entry of the change in the same transaction, reports,
          without a change and without an entry, a project that does not exist or a value that is no longer the
          expected one, and never changes a rule other than the named one.
        justification: |
          The rules follow the same atomic rule as the other settings of a project: a change must neither be lost nor
          silently overwrite the change of another administrator, must not be stored without its entry, and must not
          touch another rule by mistake.
        tests:
          - ReviewStore_AddProjectAsync_NewReviewRules_AreStoredAndReturned
          - ReviewStore_UpdateReviewRuleAsync_CompareAndSet
          - ReviewStore_UpdateReviewRuleAsync_ChangesOnlyTheNamedRule
          - ReviewStore_UpdateReviewRuleAsync_UndefinedRule_ThrowsArgumentOutOfRange

      - id: ReviewCenter-ReviewStore-Audit
        title: >-
          The ReviewStore class shall store every audited change (project, project membership, evidence settings,
          project checklist definition, setting that requires independent reviewers, review, thread, comment,
          thread state, resolution, kind of a thread, report flag of a comment, checklist answer and section state,
          slot, signature, and reopening) together with its audit
          entry in one transaction, through the
          process-wide audit gate, shall store neither when either fails, and shall store no entry for a change that
          has no effect.
        justification: |
          The history must be true: a change without its entry, or an entry without its change, cannot be allowed
          to exist.
        tests:
          - ReviewStore_AddProjectAsync_WithDraft_StoresProjectAndEntryTogether
          - ReviewStore_AddReviewAsync_FailedChange_LeavesNoAuditEntry
          - ReviewStore_AddProjectAsync_DraftFactoryThrows_StoresNothing
          - ReviewStore_AddProjectAsync_AuditInsertFails_RollsBackTheChange
          - ReviewStore_NoOpChanges_RecordNothing
          - ReviewStore_ResolveThreadAsync_FindingWithNote_StoresIncludedResolutionAndAudits
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited
          - ReviewStore_UpdateRequireIndependentReviewersAsync_CompareAndSet
          - ReviewStore_ReopenReviewAsync_Persists_AuditAndHistory
          - ReviewStore_ReopenReviewAsync_AuditInsertFails_RollsBackTheReopen

      - id: ReviewCenter-ReviewStore-Memberships
        title: >-
          The ReviewStore class shall store the membership of a user in a project with its role (project administrator
          or user), read one membership and list the memberships of a project or of a user, change the role and remove
          a membership reporting whether it was found, refuse a second membership of the same user in the same
          project as a membership that exists, and store each change together with an audit entry that names the
          project in one transaction.
        justification: |
          Memberships decide which projects a user may see. A second row for the same pair would make the role
          ambiguous, and a change of access that is stored without its entry, or an entry without its change, would
          leave the history of who had access untrue. The entry names the project so that the history of one project
          can be read.
        tests:
          - ReviewStore_AddMembershipAsync_Membership_RoundTripsAndIsListed
          - ReviewStore_AddMembershipAsync_SecondMembership_IsRejected
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject

      - id: ReviewCenter-ReviewStore-LastAdmin
        title: >-
          The ReviewStore class shall, when it is told to require another administrator, refuse to remove or demote
          the membership of an enabled project administrator unless another enabled project administrator of the
          project remains, reporting the refusal as a last project administrator rule violation, shall make the
          check and the change one atomic step so that two changes made at the same time cannot leave the project
          without an enabled administrator, shall store nothing and no audit entry for a refused change, and shall
          apply the change without the check when it is not told to require one.
        justification: |
          A check made before the change is not enough when two administrators act at the same moment: each would
          see the other and both would go. Only the store, inside the transaction that also writes the audit entry,
          can keep a project from losing its last administrator. A system administrator is exempt from the rule, so
          the store must also be able to apply the change without it.
        tests:
          - ReviewStore_RemoveMembershipAsync_TwoAdminsRemoveEachOther_ExactlyOneSucceeds
          - ReviewStore_MembershipChanges_RemoveRacesDemote_LeavesAnAdministrator
          - ReviewStore_RemoveMembershipAsync_LastAdmin_RefusedAndRolledBackUnlessExempt
          - ReviewStore_RemoveMembershipAsync_OtherAdminDisabled_IsRefused

      - id: ReviewCenter-ReviewStore-UserImpact
        title: >-
          The ReviewStore class shall list the reviewer slots in which a user is the primary or the alternate reviewer
          with the project name, the review identifier and title, the slot identity and the role of the user, ordered
          by project, review and slot, using the indexes of the slot users and leaving out the slots of other users, and
          shall list the projects in which an enabled user is a project administrator and no other enabled user is,
          ordered by name, so that a disabled administrator, a member who is not an administrator, and a disabled user
          are not counted.
        justification: |
          The offboarding impact of a user is built from these two reads, so they must find the slots without scanning
          the slot table and must decide who counts as another administrator by the same rule as the last-administrator
          check that protects the project at the moment of the change.
        tests:
          - ReviewStore_ListSlotsOfUserAsync_PrimaryAndAlternate_AreFoundInOrder
          - ReviewStore_ListSlotsOfUserAsync_NoSlot_IsEmpty
          - ReviewStore_ListSoleAdminProjectsAsync_OnlyEnabledAdministrator_IsFound
          - ReviewStore_ListSoleAdminProjectsAsync_DisabledOrOrdinaryOthers_DoNotCount
          - DatabaseSetup_EnsureCreated_CreatesReviewUserStateTableAndInboxIndexes
