---
# Software Unit Requirements for the TotpStore Class
#
# The TotpStore class keeps the enrollments of the second factor and the recovery codes in the database. Every
# decision that must have exactly one winner is one conditional update.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: TotpStore Unit Requirements
    requirements:
      # Pending enrollment
      - id: ReviewCenter-TotpStore-Pending
        title: >-
          The TotpStore class shall store a pending enrollment that is not active and appears in no list of enrolled
          users.
        justification: |
          A person who has only started the setup must not be asked for a second factor yet.
        tests:
          - TotpStore_SavePendingAsync_RoundTripsAndReplacesAPendingEnrollment

      - id: ReviewCenter-TotpStore-Pending-Replace
        title: >-
          The TotpStore class shall replace an earlier pending enrollment of the user, so that one enrollment exists
          for each user.
        justification: |
          A person who starts the setup again must get a new secret.
        tests:
          - TotpStore_SavePendingAsync_RoundTripsAndReplacesAPendingEnrollment

      - id: ReviewCenter-TotpStore-Pending-ConcurrentStarts
        title: >-
          The TotpStore class shall let none of many starts for the same user that arrive at the same moment fail.
        justification: |
          Two starts at the same moment, for example a double click, must not end in an error.
        tests:
          - TotpStore_SavePendingAsync_ManyConcurrentStarts_NoExceptionAndOneCoherentPendingRow

      - id: ReviewCenter-TotpStore-Pending-ConcurrentOneRow
        title: >-
          The TotpStore class shall leave exactly one pending enrollment when many starts for the same user arrive at
          the same moment.
        justification: |
          The enrollment of a user must stay coherent, with one secret that the person can still use.
        tests:
          - TotpStore_SavePendingAsync_ManyConcurrentStarts_NoExceptionAndOneCoherentPendingRow

      - id: ReviewCenter-TotpStore-Pending-RefuseConfirmed
        title: >-
          The TotpStore class shall refuse to replace a confirmed enrollment with a new pending one.
        justification: |
          Starting the setup must never be a way to remove or replace a second factor that already works.
        tests:
          - TotpStore_SavePendingAsync_ConfirmedRow_ConcurrentStarts_AllRefuseAndNeverOverwrite
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-Pending-RefuseConfirmedKept
        title: >-
          The TotpStore class shall keep the confirmed enrollment, with its secret, step, and recovery codes, as it
          was when it refuses a new pending one.
        justification: |
          A refused start that still changed a field of the confirmed enrollment would quietly break the sign-in of a
          person whose second factor worked before.
        tests:
          - TotpStore_SavePendingAsync_ConfirmedRow_ConcurrentStarts_AllRefuseAndNeverOverwrite
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-Pending-ConcurrentWithConfirm
        title: >-
          The TotpStore class shall let no start that arrives at the same moment as a confirmation fail.
        justification: |
          A confirmation that races with a start, for example from a second tab, must not end in an error.
        tests:
          - TotpStore_SavePendingAsync_ConcurrentWithConfirm_NoExceptionAndConfirmedStaysConfirmed

      - id: ReviewCenter-TotpStore-Pending-ConcurrentWithConfirmNotOverwritten
        title: >-
          The TotpStore class shall not overwrite the enrollment that a confirmation made with a start that arrives at
          the same moment.
        justification: |
          A start that won the race against the confirmation would replace the secret that the person just proved, and
          the codes on the person's device would stop working.
        tests:
          - TotpStore_SavePendingAsync_ConcurrentWithConfirm_NoExceptionAndConfirmedStaysConfirmed

      - id: ReviewCenter-TotpStore-Pending-RemovePending
        title: >-
          The TotpStore class shall remove a pending enrollment when asked to.
        justification: |
          A person who abandons the setup must not leave an unused secret behind.
        tests:
          - TotpStore_RemovePendingAsync_RemovesPendingOnly

      - id: ReviewCenter-TotpStore-Pending-KeepConfirmed
        title: >-
          The TotpStore class shall not remove a confirmed enrollment when it is asked to remove a pending one.
        justification: |
          Abandoning a setup must never remove a second factor that already works.
        tests:
          - TotpStore_RemovePendingAsync_RemovesPendingOnly

      # Confirmation
      - id: ReviewCenter-TotpStore-ConfirmAtomic
        title: >-
          The TotpStore class shall turn a pending enrollment on when it is confirmed.
        justification: |
          The second factor applies to the sign-in only after the person proved that the secret works.
        tests:
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-ConfirmAtomic-RecoveryCodes
        title: >-
          The TotpStore class shall store the hashes of the recovery codes with the confirmation of an enrollment.
        justification: |
          A second factor that is on without its recovery codes would leave the person locked out.
        tests:
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-ConfirmAtomic-Step
        title: >-
          The TotpStore class shall set the step of the confirming code as the last accepted one when it confirms an
          enrollment.
        justification: |
          The confirming code must not be accepted a second time to sign in.
        tests:
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-ConfirmAtomic-Audit
        title: >-
          The TotpStore class shall write one audit entry for the confirmation of an enrollment.
        justification: |
          A second factor that is on without the record of it would leave the history untrue.
        tests:
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-ConfirmAtomic-Once
        title: >-
          The TotpStore class shall refuse to confirm an enrollment that is already confirmed.
        justification: |
          A second confirmation must not store a second set of codes or a second entry.
        tests:
          - TotpStore_ConfirmAsync_ActivatesStoresCodesAndAuditsOnce

      - id: ReviewCenter-TotpStore-ConfirmAtomic-NothingPending
        title: >-
          The TotpStore class shall store nothing and write no audit entry when there is no pending enrollment to
          confirm.
        justification: |
          A confirmation of nothing did not happen, so it must leave no codes and no record.
        tests:
          - TotpStore_ConfirmAsync_NothingPending_ReturnsFalseAndStoresNothing

      - id: ReviewCenter-TotpStore-ConfirmAtomic-DuplicateHashRolledBack
        title: >-
          The TotpStore class shall roll back the whole confirmation, with its audit entry, when the same recovery code
          hash is given twice.
        justification: |
          A confirmation that is half stored would leave the enrollment on without its codes or the history untrue.
        tests:
          - TotpStore_ConfirmAsync_DuplicateHash_IsRefusedByTheDatabaseAndRolledBack

      - id: ReviewCenter-TotpStore-ConfirmAtomic-SameHashOtherUsers
        title: >-
          The TotpStore class shall accept a recovery code hash that another user also has.
        justification: |
          The hashes of two users may collide by chance, and one user's codes must not depend on another user's.
        tests:
          - TotpStore_ConfirmAsync_SameHashForDifferentUsers_IsAllowed

      # Step of the accepted code
      - id: ReviewCenter-TotpStore-AtomicStep
        title: >-
          The TotpStore class shall move the last accepted step of a confirmed enrollment forward.
        justification: |
          The replay protection is only as good as this step.
        tests:
          - TotpStore_TryAdvanceStepAsync_OnlyForwardAndOnlyWhenConfirmed

      - id: ReviewCenter-TotpStore-AtomicStep-NotLater
        title: >-
          The TotpStore class shall refuse a step that is not later than the stored one.
        justification: |
          A code of an earlier or the same step is a replay.
        tests:
          - TotpStore_TryAdvanceStepAsync_OnlyForwardAndOnlyWhenConfirmed

      - id: ReviewCenter-TotpStore-AtomicStep-OnlyConfirmed
        title: >-
          The TotpStore class shall refuse to move the step of an enrollment that is only pending.
        justification: |
          A pending enrollment is not a second factor yet, so it has no accepted code.
        tests:
          - TotpStore_TryAdvanceStepAsync_OnlyForwardAndOnlyWhenConfirmed

      - id: ReviewCenter-TotpStore-AtomicStep-OneWinner
        title: >-
          The TotpStore class shall let exactly one of any number of simultaneous callers move the step to the same
          value.
        justification: |
          Reading the step and writing it later would let two requests with the same code both pass.
        tests:
          - TotpStore_TryAdvanceStepAsync_ThirtyTwoParallelRequests_HaveExactlyOneWinner

      # Recovery codes
      - id: ReviewCenter-TotpStore-RecoverySingleUse
        title: >-
          The TotpStore class shall accept an unspent recovery code of a user once and mark it as spent.
        justification: |
          A recovery code that works twice is a second way in for somebody who saw it once.
        tests:
          - TotpStore_TryConsumeRecoveryCodeAsync_SpendsOnceAndAuditsOnce

      - id: ReviewCenter-TotpStore-RecoverySingleUse-Audit
        title: >-
          The TotpStore class shall write one audit entry when a recovery code is spent.
        justification: |
          The use of a recovery code is a security event that must be in the history.
        tests:
          - TotpStore_TryConsumeRecoveryCodeAsync_SpendsOnceAndAuditsOnce

      - id: ReviewCenter-TotpStore-RecoverySingleUse-UnknownRefused
        title: >-
          The TotpStore class shall refuse a recovery code that is unknown, already spent, or belongs to another user.
        justification: |
          Only an unspent code of the user may let the user in.
        tests:
          - TotpStore_TryConsumeRecoveryCodeAsync_SpendsOnceAndAuditsOnce

      - id: ReviewCenter-TotpStore-RecoverySingleUse-RefusedNoEntry
        title: >-
          The TotpStore class shall write no audit entry for a recovery code that it refuses.
        justification: |
          A refused code did not change anything, so the history must not claim a use.
        tests:
          - TotpStore_TryConsumeRecoveryCodeAsync_SpendsOnceAndAuditsOnce

      - id: ReviewCenter-TotpStore-RecoverySingleUse-OneWinner
        title: >-
          The TotpStore class shall accept a recovery code for exactly one of any number of simultaneous callers.
        justification: |
          Two requests with the same code at the same moment must not both pass.
        tests:
          - TotpStore_TryConsumeRecoveryCodeAsync_ParallelRequests_HaveExactlyOneWinner

      - id: ReviewCenter-TotpStore-RecoverySingleUse-Replace
        title: >-
          The TotpStore class shall replace all recovery codes of a confirmed user with the new ones.
        justification: |
          A person who lost the old codes needs new ones, and the old ones must stop working.
        tests:
          - TotpStore_ReplaceRecoveryCodesAsync_ReplacesAllOldCodes

      - id: ReviewCenter-TotpStore-RecoverySingleUse-ReplaceAudit
        title: >-
          The TotpStore class shall write one audit entry when it replaces the recovery codes.
        justification: |
          A replacement of the codes is a security event that must be in the history.
        tests:
          - TotpStore_ReplaceRecoveryCodesAsync_Replaced_StoresOneAuditEntry

      - id: ReviewCenter-TotpStore-RecoverySingleUse-Count
        title: >-
          The TotpStore class shall count the recovery codes of a user that are left, not counting spent codes or the
          codes of other users.
        justification: |
          The person must be warned when few codes are left.
        tests:
          - TotpStore_TryConsumeRecoveryCodeAsync_SpendsOnceAndAuditsOnce
          - TotpStore_ReplaceRecoveryCodesAsync_ReplacesAllOldCodes

      # Removal
      - id: ReviewCenter-TotpStore-Remove
        title: >-
          The TotpStore class shall remove the enrollment and all recovery codes of a user.
        justification: |
          A removal that leaves recovery codes behind would leave a way in that nobody can see.
        tests:
          - TotpStore_RemoveAsync_DeletesEverythingOnceWithOneAuditEntry

      - id: ReviewCenter-TotpStore-Remove-Audit
        title: >-
          The TotpStore class shall write one audit entry for the removal of an enrollment.
        justification: |
          A removal that is not in the history would leave the record untrue.
        tests:
          - TotpStore_RemoveAsync_DeletesEverythingOnceWithOneAuditEntry

      - id: ReviewCenter-TotpStore-Remove-NothingRemoved
        title: >-
          The TotpStore class shall write no audit entry when there is no enrollment to remove.
        justification: |
          A removal of nothing did not happen, so the history must not claim it.
        tests:
          - TotpStore_RemoveAsync_DeletesEverythingOnceWithOneAuditEntry

      - id: ReviewCenter-TotpStore-Remove-ChainIntact
        title: >-
          The TotpStore class shall keep the audit chain intact through every change of the second factor.
        justification: |
          The audit entries of the second factor are part of the tamper-evident trail.
        tests:
          - TotpStore_Changes_KeepTheAuditChainIntact

      # Deleting a user
      - id: ReviewCenter-TotpStore-Cascade
        title: >-
          The TotpStore class shall remove the enrollment of a user when the user is deleted.
        justification: |
          Nothing of a person may stay in the database, and a left-over enrollment would apply to a new user that gets
          the same identity.
        tests:
          - TotpStore_DeletingTheUser_DeletesTheEnrollmentAndCodes

      - id: ReviewCenter-TotpStore-Cascade-RecoveryCodes
        title: >-
          The TotpStore class shall remove the recovery codes of a user when the user is deleted.
        justification: |
          Left-over recovery codes would apply to a new user that gets the same identity.
        tests:
          - TotpStore_DeletingTheUser_DeletesTheEnrollmentAndCodes
