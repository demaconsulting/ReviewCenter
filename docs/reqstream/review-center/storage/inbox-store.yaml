---
# Software Unit Requirements for the InboxStore Class
#
# The InboxStore class keeps what each user has seen of each review in the database and finds the reviews in which a
# user is a reviewer or the creator. It holds no rule of the inbox; the rules are in the InboxService class.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: InboxStore Unit Requirements
    requirements:
      - id: ReviewCenter-InboxStore-Candidates
        title: >-
          The InboxStore class shall find the reviews in which a user is the primary or the alternate reviewer of a
          slot or is the creator.
        justification: |
          The inbox must not read every review of every project. Finding only the reviews that concern the user keeps
          the cost of the page small however many reviews exist.
        tests:
          - InboxStore_ListInvolvedReviewsAsync_PrimaryAlternateAndCreator_AreFound

      - id: ReviewCenter-InboxStore-Candidates-CreatorCase
        title: >-
          The InboxStore class shall match the creator of a review by user name without regard to letter case.
        justification: |
          The creator is kept as the name that was typed when the review was made, which may differ in case from the
          user name.
        tests:
          - InboxStore_ListInvolvedReviewsAsync_PrimaryAlternateAndCreator_AreFound

      - id: ReviewCenter-InboxStore-Candidates-LightRecords
        title: >-
          The InboxStore class shall give for each review found only the project, the identifier, the title, the
          creator, and the due date, without loading any file.
        justification: |
          Only the fields the list needs are read, so that a review with a large file costs no more than one without.
        tests:
          - InboxStore_ListInvolvedReviewsAsync_DoesNotLoadFiles_ReturnsLightRecords

      - id: ReviewCenter-InboxStore-Candidates-Uninvolved
        title: >-
          The InboxStore class shall not find a review in which the user has no part.
        justification: |
          A user must not see the reviews of other people in the inbox.
        tests:
          - InboxStore_ListInvolvedReviewsAsync_PrimaryAlternateAndCreator_AreFound

      - id: ReviewCenter-InboxStore-UserState
        title: >-
          The InboxStore class shall store for a user and a review the newest comment and the time that the user has
          seen.
        justification: |
          The inbox shows what is new since the last visit, so the newest comment and the seen time must be kept for
          each user and review.
        tests:
          - InboxStore_MarkSeenAsync_InsertsThenUpdatesAndNeverMovesBackwards

      - id: ReviewCenter-InboxStore-UserState-FirstVisit
        title: >-
          The InboxStore class shall insert the state row of a user and a review on the first visit.
        justification: |
          A user who opens a review for the first time has no row yet, and without one the inbox would show every
          comment of that review as new on each later visit.
        tests:
          - InboxStore_MarkSeenAsync_InsertsThenUpdatesAndNeverMovesBackwards

      - id: ReviewCenter-InboxStore-UserState-Update
        title: >-
          The InboxStore class shall update the stored row of a user and a review on a later visit.
        justification: |
          Every later visit moves the point from which the inbox shows what is new.
        tests:
          - InboxStore_MarkSeenAsync_InsertsThenUpdatesAndNeverMovesBackwards

      - id: ReviewCenter-InboxStore-UserState-NeverBackwards
        title: >-
          The InboxStore class shall never move the stored newest comment or the stored seen time back to an older
          value.
        justification: |
          A late request that carries an old value must not make comments look new again.
        tests:
          - InboxStore_MarkSeenAsync_InsertsThenUpdatesAndNeverMovesBackwards

      - id: ReviewCenter-InboxStore-UserState-ParallelNoFailure
        title: >-
          The InboxStore class shall let none of many visits that arrive at the same moment fail.
        justification: |
          Two tabs or a double click must not end in an error.
        tests:
          - InboxStore_MarkSeenAsync_ParallelCalls_NoExceptionAndHighestWins

      - id: ReviewCenter-InboxStore-UserState-ParallelHighest
        title: >-
          The InboxStore class shall leave the highest value stored when many visits arrive at the same moment.
        justification: |
          Two tabs or a double click must not lose a newer value.
        tests:
          - InboxStore_MarkSeenAsync_ParallelCalls_NoExceptionAndHighestWins

      - id: ReviewCenter-InboxStore-UserState-OwnRowsOnly
        title: >-
          The InboxStore class shall return only the rows of the user asked for.
        justification: |
          One user must never read the state of another.
        tests:
          - InboxStore_ListStatesAsync_ReturnsOnlyTheUsersRows

      - id: ReviewCenter-InboxStore-Cascade
        title: >-
          The InboxStore class shall leave no state behind for a review that is deleted.
        justification: |
          A state row without its review is a record about nothing.
        tests:
          - InboxStore_DeletingTheReview_DeletesTheStates

      - id: ReviewCenter-InboxStore-Cascade-User
        title: >-
          The InboxStore class shall leave no state behind for a user that is deleted.
        justification: |
          The data of a deleted user should not outlive the user.
        tests:
          - InboxStore_DeletingTheUser_DeletesTheStates
