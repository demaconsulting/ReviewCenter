---
# Software Unit Requirements for the PersonalAccessTokenStore Unit
#
# The PersonalAccessTokenStore unit keeps the personal access tokens in the database file: the hash, the display id,
# the owner, the expiry, the time of last use, and the time of revocation. The value of a token is never stored.

sections:
  - title: PersonalAccessTokenStore Unit Requirements
    requirements:
      - id: ReviewCenter-PersonalAccessTokenStore-Persist
        title: >-
          The PersonalAccessTokenStore unit shall keep a token with its hash, display id, name, owner, and dates in
          the database file, record the creation in the audit trail in the same transaction, and refuse a hash that
          is already stored without recording anything.
        justification: |
          A token that is stored but not audited, or audited but not stored, would leave the record untrue. The
          hash is what a request is found by, so two tokens with one hash would make the owner of a request
          ambiguous.
        tests:
          - PersonalAccessTokenStore_AddAsync_Token_RoundTripsAndAudits
          - PersonalAccessTokenStore_AddAsync_DuplicateHash_IsRefusedAndNothingIsAudited

      - id: ReviewCenter-PersonalAccessTokenStore-Find
        title: >-
          The PersonalAccessTokenStore unit shall find a token with its owner by the hash, and list the tokens of one
          user, newest first, without the tokens of other users.
        justification: |
          A request carries only the value, so the token must be found by its hash. The list of a user must not show
          the tokens of other users.
        tests:
          - PersonalAccessTokenStore_FindByHashAsync_Hash_FindsTokenWithOwner
          - PersonalAccessTokenStore_ListForUserAsync_Tokens_AreOwnedAndNewestFirst

      - id: ReviewCenter-PersonalAccessTokenStore-Revoke
        title: >-
          The PersonalAccessTokenStore unit shall mark an own token of the user as revoked once, and record the
          revocation in the audit trail in the same transaction.
        justification: |
          Revoking twice must not change the time of the first revocation, and an audit record without the change,
          or the change without the record, would leave the record untrue.
        tests:
          - PersonalAccessTokenStore_RevokeAsync_OwnToken_RevokesOnceAndAudits

      - id: ReviewCenter-PersonalAccessTokenStore-Touch
        title: >-
          The PersonalAccessTokenStore unit shall change only the time of last use of a token when it is used, and only
          if the stored time is still the one the caller read, so that of several concurrent uses exactly one writes.
        justification: |
          Recording a use must not change any other property of a token, such as its expiry or revocation. A burst of
          requests that read the same stale time must not each write it, or the throttle of the writes would not hold.
        tests:
          - PersonalAccessTokenStore_TouchAsync_Token_ChangesOnlyLastUsed
          - PersonalAccessTokenStore_TouchAsync_ParallelSameExpected_WritesOnce
