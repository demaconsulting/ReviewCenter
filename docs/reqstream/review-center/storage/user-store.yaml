---
# Software Unit Requirements for the UserStore Class
#
# The UserStore class is the database implementation of the Core user store interface.

sections:
  - title: UserStore Unit Requirements
    requirements:
      - id: ReviewCenter-UserStore-Persist
        title: >-
          The UserStore class shall save a user with its user name, display name, system administrator flag, enabled
          state, password
          hash, must-change-password flag, failed sign-in count, lockout end, and creation time, assign its
          identifier, find it again by user
          name, change a saved user, and list all users ordered by user name, with every value coming back as it
          was saved.
        justification: |
          The user record is the basis of every sign-in. The lockout state must survive a restart, or a restart
          would reset the protection against password guessing, and the flag that confines an account with a
          temporary password must survive it too, or a restart would lift the confinement.
        tests:
          - UserStore_AddAsync_User_RoundTripsEveryField
          - UserStore_UpdateAsync_ChangedFields_AreStored
          - UserStore_ListAsync_Users_AreOrderedByUsername
          - UserStore_AddToProjectAsync_StoresAccountMembershipAndOneEventTogether

      - id: ReviewCenter-UserStore-Unique
        title: >-
          The UserStore class shall find a user by user name regardless of letter case and shall refuse to save a
          second user whose user name differs from an existing one only in letter case, reporting it as a user
          name taken rule violation.
        justification: |
          Two requests made at the same moment can both pass a check made before saving, so the database itself
          must enforce that a user name is unique, and names that differ only in case must not look like two
          people.
        tests:
          - UserStore_AddAsync_UsernameOtherCase_ThrowsUserNameTakenAndLookupIgnoresCase

      - id: ReviewCenter-UserStore-Audit
        title: >-
          The UserStore class shall store a new user, and every update that carries an audit draft, together with
          its audit entry in one transaction, through the process-wide audit gate, shall store neither when either
          fails, and shall store no entry for an update without a draft.
        justification: |
          Changes of accounts and rights must appear in the history exactly when they happened, while a failure
          counter is not an event of its own.
        tests:
          - UserStore_AddAsync_AuditInsertFails_RollsBackTheUserAndTheGateIsReleased
          - UserStore_UpdateAsync_WithAndWithoutDraft_RecordsOnlyWithDraft

      - id: ReviewCenter-UserStore-AddToProject
        title: >-
          The UserStore class shall store a new user, its membership of a project with a role, and one audit entry
          that names the project in one transaction, through the process-wide audit gate, shall build the audit
          entry from the stored user, and shall store none of the three when the user name is taken, the project
          does not exist, or any part fails, releasing the gate on every path.
        justification: |
          A project administrator creates an account only as part of adding it to the project. An account without
          its membership would be an account nobody manages, and a membership without its account cannot exist, so
          the three must be stored together or not at all.
        tests:
          - UserStore_AddToProjectAsync_StoresAccountMembershipAndOneEventTogether
          - UserStore_AddToProjectAsync_Failure_StoresNothing

      - id: ReviewCenter-UserStore-ExternalIdentity
        title: >-
          The UserStore class shall store the issuer and the subject of the identity of a user at a provider, shall
          find a user by the exact pair and by nothing else, and shall refuse to store a second user with the same
          pair.
        justification: |
          The pair is the only thing that says which account belongs to a person at a provider, so a lookup must match
          it exactly, and two accounts with one pair would let one sign-in open two accounts.
        tests:
          - UserStore_GetByExternalAsync_FindsOnlyTheExactPair
          - UserStore_AddAsync_SameExternalIdentityTwice_IsRefused
