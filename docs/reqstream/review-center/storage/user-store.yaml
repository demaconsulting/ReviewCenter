---
# Software Unit Requirements for the UserStore Class
#
# The UserStore class is the database implementation of the Core user store interface.

sections:
  - title: UserStore Unit Requirements
    requirements:
      - id: ReviewCenter-UserStore-Persist
        title: >-
          The UserStore class shall save a user with its user name, display name, role, enabled state, password
          hash, failed sign-in count, lockout end, and creation time, assign its identifier, find it again by user
          name, change a saved user, and list all users ordered by user name, with every value coming back as it
          was saved.
        justification: |
          The user record is the basis of every sign-in. The lockout state must survive a restart, or a restart
          would reset the protection against password guessing.
        tests:
          - UserStore_AddAsync_User_RoundTripsEveryField
          - UserStore_UpdateAsync_ChangedFields_AreStored
          - UserStore_ListAsync_Users_AreOrderedByUsername

      - id: ReviewCenter-UserStore-Unique
        title: >-
          The UserStore class shall find a user by user name regardless of letter case and shall refuse to save a
          second user whose user name differs from an existing one only in letter case, reporting it as a user
          name taken rule violation.
        justification: |
          Two requests made at the same moment can both pass a check made before saving, so the database itself
          must enforce that a user name is unique, and names that differ only in case must not look like two
          people.
        tests:
          - UserStore_AddAsync_UsernameOtherCase_ThrowsUserNameTakenAndLookupIgnoresCase
