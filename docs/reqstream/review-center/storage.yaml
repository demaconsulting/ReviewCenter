---
# Storage Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Storage subsystem
# - The Storage subsystem spans the ReviewCenterDbContext, ReviewStore, UserStore, AuditStore, RepositoryStore, and
#   DatabaseSetup units
# - Subsystem requirements describe the externally visible behavior of the persistence of users, projects, reviews,
#   checklists, comment threads, reviewer slots, signatures, project memberships, the evidence settings of projects,
#   the audit trail, and git repositories

sections:
  - title: Storage Subsystem Requirements
    requirements:
      - id: ReviewCenter-Storage-Persistence
        title: >-
          The Storage subsystem shall keep projects, reviews, and the exact bytes of review files in a database
          file, so that they are all still there, unchanged, when the database is opened again.
        justification: |
          Review records are evidence and must outlive the process that created them. Keeping the exact bytes
          means the fingerprint of a stored review can always be reproduced from what is stored.
        children:
          - ReviewCenter-ReviewStore-Projects
          - ReviewCenter-ReviewStore-Reviews
          - ReviewCenter-ReviewStore-Metadata
          - ReviewCenter-DbContext-Schema
          - ReviewCenter-DbContext-Content
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsProjectAndReview

      - id: ReviewCenter-Storage-Integrity
        title: >-
          The Storage subsystem shall refuse a second review with the same identifier in a project, and a
          review for a project that does not exist, leaving the stored data unchanged.
        justification: |
          The database is the last line of defense for the review record: two requests made at the same moment
          can both pass a check made before saving, so the database itself must enforce uniqueness and the
          project relationship.
        children:
          - ReviewCenter-ReviewStore-Duplicate
          - ReviewCenter-DbContext-Integrity
        tests:
          - StorageSubsystem_ServicesOverDatabase_DuplicateReviewId_IsRefusedAndKeepsOriginal
          - StorageSubsystem_ServicesOverDatabase_UnknownProject_IsRefusedAndKeepsData

      - id: ReviewCenter-Storage-Configuration
        title: >-
          The Storage subsystem shall open the database named by its provider and connection settings, create
          the database and its tables on first use, and refuse an unsupported provider with an error that names
          it, without creating a database.
        justification: |
          Operators choose where the data lives. A new installation must work without manual database setup,
          while a mistyped or not yet supported provider must fail loudly instead of quietly using something
          else.
        children:
          - ReviewCenter-DatabaseSetup-Location
          - ReviewCenter-DatabaseSetup-Connection
          - ReviewCenter-DatabaseSetup-Provider
          - ReviewCenter-DatabaseSetup-Create
          - ReviewCenter-DatabaseSetup-DataDirectory
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsProjectAndReview
          - StorageSubsystem_UnsupportedProvider_Opening_FailsWithClearErrorAndCreatesNothing

      - id: ReviewCenter-Storage-Threads
        title: >-
          The Storage subsystem shall keep comment threads with their anchors, states, and comments in the
          database file, so that they are all still there, unchanged and in order, when the database is opened
          again.
        justification: |
          Review comments are part of the review record and must outlive the process that created them. A
          thread can only exist for a file of an existing review, and the database enforces that.
        children:
          - ReviewCenter-ReviewStore-Threads
          - ReviewCenter-DbContext-Threads
        tests:
          - StorageSubsystem_ServicesOverDatabase_ReopenedDatabase_KeepsThreadsAndComments

      - id: ReviewCenter-Storage-Users
        title: >-
          The Storage subsystem shall keep users, with their system administrator flags, enabled states, password
          hashes, must-change-password flags, and lockout state, in the database file, so that they are all still
          there, unchanged, when the database is opened again, and shall keep user names unique regardless of letter
          case.
        justification: |
          Users must survive a restart, or nobody could sign in again. The lockout state is kept with the user so
          that a restart does not give an attacker a fresh set of tries, and the flag of a temporary password is kept
          so that a restart does not lift its confinement.
        children:
          - ReviewCenter-UserStore-Persist
          - ReviewCenter-UserStore-Unique
          - ReviewCenter-UserStore-AddToProject
          - ReviewCenter-DbContext-Users
        tests:
          - StorageSubsystem_Users_PersistAcrossReopen

      - id: ReviewCenter-Storage-Checklist
        title: >-
          The Storage subsystem shall keep the checklist snapshot of each review, the applicability of its
          sections, and the answers to its checks in the database file, so that they are all still there,
          unchanged, when the database is opened again.
        justification: |
          The checklist is part of the review record and must outlive the process that created it. The snapshot
          is stored with the review so that the questions never change under the answers.
        children:
          - ReviewCenter-ReviewStore-Checklist
          - ReviewCenter-DbContext-Checklist
        tests:
          - StorageSubsystem_Checklist_PersistsSnapshotAnswersAndSectionsAcrossReopen

      - id: ReviewCenter-Storage-Signatures
        title: >-
          The Storage subsystem shall keep the reviewer slots of each review and the signatures made for them in
          the database file, so that they are all still there, unchanged, when the database is opened again, and
          a signature is still current for a record that has not changed, and shall never let a signature be
          stored for a record that has changed or a signed slot be deleted.
        justification: |
          Signatures are the evidence that a review was approved and must outlive the process that created them.
          The database itself must refuse a signature of a stale record and the deletion of a signed slot, so
          that the evidence cannot be broken by overlapping requests.
        children:
          - ReviewCenter-ReviewStore-Slots
          - ReviewCenter-ReviewStore-Record
          - ReviewCenter-ReviewStore-Signatures
          - ReviewCenter-DbContext-Signatures
        tests:
          - StorageSubsystem_Signatures_PersistAcrossReopenAndStayCurrent

      - id: ReviewCenter-Storage-AuditTrail
        title: >-
          The Storage subsystem shall store every audited change together with its audit entry in one Serializable
          transaction, through one process-wide gate shared by all stores, so that both or neither are stored and
          the sequence of entries has no gap and no fork, refuse a second entry with the same sequence number,
          offer no way to update or delete an entry, and read the entries in pages and in ordered batches, also for
          one project only.
        justification: |
          The hash chain is only as good as the order of its entries. Appending inside the transaction of the
          change, under one gate, keeps the chain linear and the history true even when several users act at the
          same time or the process stops in the middle of a change.
        children:
          - ReviewCenter-AuditStore-Append
          - ReviewCenter-AuditStore-Atomic
          - ReviewCenter-AuditStore-Concurrency
          - ReviewCenter-AuditStore-Read
          - ReviewCenter-ReviewStore-Audit
          - ReviewCenter-UserStore-Audit
          - ReviewCenter-RepositoryStore-Audit
          - ReviewCenter-DbContext-AuditEntries
        tests:
          - AuditStore_ConcurrentChangesFromDifferentStores_ProduceLinearChain
          - AuditStore_PublicSurface_OffersNoUpdateOrDelete

      - id: ReviewCenter-Storage-Repositories
        title: >-
          The Storage subsystem shall keep the registered git repositories, each belonging to exactly one project,
          with their locations, user names, enabled states, and encrypted tokens, in the database file, so that they
          are all still there, unchanged, when the database is opened again, list the repositories of one project
          only, and shall keep repository names unique within a project regardless of letter case.
        justification: |
          The registry must survive a restart, or every stored token would have to be entered again. The token is
          kept only in its encrypted form, so a copy of the database does not reveal it. A repository belongs to
          one project, so a list never holds the repositories of another project, and a name that is taken in one
          project says nothing about the repositories of another.
        children:
          - ReviewCenter-RepositoryStore-Persist
          - ReviewCenter-RepositoryStore-Unique
          - ReviewCenter-RepositoryStore-Token
          - ReviewCenter-RepositoryStore-Update
          - ReviewCenter-DbContext-Repositories
        tests:
          - StorageSubsystem_Repositories_PersistAcrossReopen
          - RepositoryStore_ListAsync_ScopedToProject_AndNamesAreUniquePerProject

      - id: ReviewCenter-Storage-Memberships
        title: >-
          The Storage subsystem shall keep the membership of a user in a project, with its role of project
          administrator or user, in the database file, so that it is still there, unchanged, when the database is
          opened again, allow a user at most one membership in a project, refuse a membership for a project or a user
          that does not exist, change the role and remove a membership, report whether it existed, and store each
          change together with its audit entry, which names the project, in one transaction, and, when told to, refuse
          to remove or demote the last enabled project administrator in that same transaction, and store a new
          account with its membership and its audit entry together.
        justification: |
          Memberships decide which projects a user may see, so they must outlive the process that created them and
          must stay true when two requests overlap. A change that is stored without its audit entry, or the other way
          round, would leave the history of who had access untrue. Only a check inside the transaction keeps two
          administrators who act at the same moment from leaving a project without an administrator.
        children:
          - ReviewCenter-ReviewStore-Memberships
          - ReviewCenter-ReviewStore-LastAdmin
          - ReviewCenter-UserStore-AddToProject
          - ReviewCenter-DbContext-Memberships
        tests:
          - ReviewStore_AddMembershipAsync_Membership_RoundTripsAndIsListed
          - ReviewStore_AddMembershipAsync_SecondMembership_IsRejected
          - ReviewStore_SetAndRemoveMembershipAsync_ChangeRoleAndRemove_ReportWhetherFound
          - ReviewStore_Membership_Changes_AreAuditedWithTheProject
          - ReviewStore_AddMembershipAsync_UnknownProject_IsRefusedByTheDatabase
          - ReviewStore_RemoveMembershipAsync_TwoAdminsRemoveEachOther_ExactlyOneSucceeds
          - UserStore_AddToProjectAsync_StoresAccountMembershipAndOneEventTogether

      - id: ReviewCenter-Storage-EvidenceSettings
        title: >-
          The Storage subsystem shall keep the evidence settings of each project with the project in the database
          file, with the default settings for a project that was not given others, so that they are still there,
          unchanged, when the database is opened again, change them only by an atomic compare-and-set against the
          settings the caller started from, store each change together with its audit entry in one transaction, and
          change nothing and record nothing for a project that does not exist or settings that were changed
          meanwhile. The schema is created without a migration, so a development database that was created before
          the settings existed has to be recreated.
        justification: |
          The settings decide who may read the evidence, so they must survive a restart and must not be lost when two
          administrators save at the same time. The history of a change must stay true, so the entry is stored with
          the change or not at all.
        children:
          - ReviewCenter-ReviewStore-EvidenceSettings
          - ReviewCenter-DbContext-EvidenceSettings
        tests:
          - ReviewStore_AddProjectAsync_NewProject_HasDefaultEvidenceSettings
          - ReviewStore_UpdateEvidenceSettingsAsync_Change_IsPersistedAndAudited
          - ReviewStore_UpdateEvidenceSettingsAsync_ExpectedDiffers_ChangesNothing

      - id: ReviewCenter-Storage-ProjectChecklist
        title: >-
          The Storage subsystem shall keep the checklist definition of each project with the project in the
          database file, with no definition for a project that was not given one, so that it is still there,
          unchanged, when the database is opened again, change it only by an atomic compare-and-set against the
          definition the caller started from, store each change together with its audit entry in one transaction,
          and change nothing and record nothing for a project that does not exist or a definition that was changed
          meanwhile. The schema is created without a migration, so a development database that was created before
          the column existed has to be recreated.
        justification: |
          The definition decides the wording of the checklist of every review created later, so it must survive a
          restart and must not be lost when two administrators save at the same time. The history of a change must
          stay true, so the entry is stored with the change or not at all.
        children:
          - ReviewCenter-ReviewStore-ProjectChecklist
          - ReviewCenter-DbContext-ProjectChecklist
        tests:
          - ReviewStore_AddProjectAsync_ChecklistDefinition_IsNullByDefaultAndKeptWhenGiven
          - ReviewStore_UpdateChecklistDefinitionAsync_LargeText_RoundTripsThroughTheColumn
          - ReviewStore_UpdateChecklistDefinitionAsync_ChangeAndReset_ArePersistedAndAudited
          - ReviewStore_UpdateChecklistDefinitionAsync_ExpectedDiffers_ChangesNothing
          - ReviewStore_UpdateChecklistDefinitionAsync_ConcurrentWriters_ExactlyOneWins

      - id: ReviewCenter-Storage-DueDate
        title: >-
          The Storage subsystem shall keep the optional due date of each review with the review in the database file,
          so that it is still there, unchanged, when the database is opened again, change it only by an atomic
          compare-and-set against the date the caller started from, refuse the change of an approved review inside
          the transaction, store each change together with its audit entry in one transaction, and change nothing and
          record nothing for a review that does not exist or a date that was changed meanwhile. The schema is created
          without a migration, so a development database that was created before the column existed has to be
          recreated.
        justification: |
          The date is a commitment that must survive a restart and must not be lost when two people save at the same
          time. The history of a change must stay true, so the entry is stored with the change or not at all. A list
          that shows which dated reviews are overdue asks which of them are approved in one batch, so its cost does
          not grow with a full read of every late review.
        children:
          - ReviewCenter-ReviewStore-DueDate
          - ReviewCenter-ReviewStore-ApprovedReviewIds
          - ReviewCenter-DbContext-DueDate
        tests:
          - ReviewStore_ListApprovedReviewIdsAsync_SeveralReviews_ReturnsExactlyTheApprovedOnes
          - ReviewStore_AddReviewAsync_DueDate_RoundTripsAsCalendarDay
          - ReviewStore_UpdateDueDateAsync_ChangeAndClear_ArePersistedAndAudited
          - ReviewStore_UpdateDueDateAsync_ExpectedDiffers_ChangesNothing
          - ReviewStore_UpdateDueDateAsync_ConcurrentWriters_ExactlyOneWins
          - ReviewStore_WriteMethods_ApprovedReview_RefuseWithReviewLockedInTransaction

      - id: ReviewCenter-Storage-FollowUp
        title: >-
          The Storage subsystem shall keep the review that a follow-up review follows, the numbers of answers and
          threads it carried, and the answers, sections and threads it carried with the review they came from, in the
          database file, so that they are still there, unchanged, when the database is opened again, store them in the
          one transaction that stores the review, so that a carry that fails stores nothing, load them into the record
          that a signature covers, and store an answer that replaces a carried one without the mark. The schema is
          created without a migration, so a development database that was created before the columns existed has to be
          recreated.
        justification: |
          The follow-up and the carried answers are part of what the reviewers approve, so they must survive a restart
          and exist together with the review or not at all. The schema is created from the model and not migrated
          while the product is not released, so development databases are recreated.
        children:
          - ReviewCenter-ReviewStore-FollowUp
          - ReviewCenter-DbContext-FollowUp
        tests:
          - ReviewStore_AddReviewAsync_FollowUp_RoundTripsEveryNewColumn
          - ReviewStore_AddReviewAsync_FollowUpCarryFails_CreatesNothing

      - id: ReviewCenter-Storage-ReviewIntegrity
        title: >-
          The Storage subsystem shall keep the reopenings of a review, with the reason and the digest of the approved
          record, and the setting of a project that requires independent reviewers in the database file, so that they
          are still there, unchanged, when the database is opened again, shall refuse, inside the transaction of the
          change, every change of the content or the reviewers of a review that is approved, with the same rule as the
          Core services, and shall store the reopening and the change of the setting each together with its audit
          entry in one transaction. The schema is created without a migration, so a development database that was
          created before the table and the column existed has to be recreated.
        justification: |
          The approval lock must hold even when two requests overlap, so the database layer repeats the check in the
          transaction of the change. The history of reopenings and the setting that decides who may sign are
          evidence about the review and must survive a restart and stay true.
        children:
          - ReviewCenter-ReviewStore-ApprovalLockInTransaction
          - ReviewCenter-ReviewStore-ReopenHistory
          - ReviewCenter-ReviewStore-ReopenRefusal
          - ReviewCenter-ReviewStore-ReopenCount
          - ReviewCenter-ReviewStore-IndependentReviewers
          - ReviewCenter-DbContext-ReviewRules
          - ReviewCenter-DbContext-ReviewReopens
        tests:
          - StorageSubsystem_ReopenAndLock_SurviveRestartAndRefuseWritesInTransaction

      - id: ReviewCenter-Storage-ReviewRuleSwitches
        title: >-
          The Storage subsystem shall keep the two further review rules of a project (authors answering the checklist
          of their own review, and the person who reopened a review signing it again) in the database file, on for a
          project that does not say otherwise, so that they are still there, unchanged, when the database is opened
          again, and shall change each rule only when it still has the value the caller saw, together with its audit
          entry in one transaction, without changing another rule. The schema is created without a migration, so a
          development database that was created before the columns existed has to be recreated.
        justification: |
          A rule that is chosen for a project is evidence about how its reviews were run, so it must survive a
          restart, must not be lost when the project is read or listed, and must not be overwritten by a caller that
          saw an old value; the change and its audit entry are one step so that the history never misses a change.
        children:
          - ReviewCenter-ReviewStore-ReviewRuleSwitches
          - ReviewCenter-DbContext-ReviewRuleColumns
        tests:
          - StorageSubsystem_ReviewRuleSwitches_SurviveRestartAndAreCompareAndSet

      - id: ReviewCenter-Storage-RepositoryReviews
        title: >-
          The Storage subsystem shall keep the source of a review from a repository (including the review-set it was
          planned for) and, for each file, its change kind
          and its frozen baseline content in the database file, return them without file content in the review, and
          return the baseline content of one file on request.
        justification: |
          The frozen copies replace the repository for everything that is read later, so they must be stored with the
          review and read as cheaply as the head content.
        children:
          - ReviewCenter-ReviewStore-Source
          - ReviewCenter-DbContext-Source
        tests:
          - ReviewStore_GetReviewAsync_RepositoryReview_ReturnsSourceAndKindsWithoutBytes
          - ReviewStore_GetBaselineContentAsync_StoredFiles_ReturnsBaselineBytesOrNull
          - ReviewStore_AddReviewAsync_LongestReviewSetId_RoundTrips

      - id: ReviewCenter-Storage-AccessTokens
        title: >-
          The Storage subsystem shall keep the personal access tokens of the users (the hash, never the value) in the
          database file together with the creator of a review and whether it was created through the API, find a
          token by its hash, list the tokens of a user, mark a token as revoked or used, and write the audit record of
          a creation or a revocation in the same transaction.
        justification: |
          Tokens must survive a restart so that scripts keep working, and a change of a token without its audit record
          would leave the history untrue.
        children:
          - ReviewCenter-PersonalAccessTokenStore-Persist
          - ReviewCenter-PersonalAccessTokenStore-Find
          - ReviewCenter-PersonalAccessTokenStore-Revoke
          - ReviewCenter-PersonalAccessTokenStore-Touch
          - ReviewCenter-DbContext-Tokens
        tests:
          - StorageSubsystem_AccessTokens_PersistAcrossReopen

      - id: ReviewCenter-Storage-ExternalIdentity
        title: >-
          The Storage subsystem shall keep the issuer and the subject of the identity of a user at a provider in the
          database file, find the user by the exact pair, and allow only one user for a pair.
        justification: |
          The account of a person must be the same account at every sign-in, and no sign-in may open two accounts.
        children:
          - ReviewCenter-UserStore-ExternalIdentity
          - ReviewCenter-DbContext-ExternalIdentity
        tests:
          - UserStore_GetByExternalAsync_FindsOnlyTheExactPair
          - UserStore_AddAsync_SameExternalIdentityTwice_IsRefused

      - id: ReviewCenter-Storage-TotpSecondFactor
        title: >-
          The Storage subsystem shall keep the enrollment of the second factor and the recovery codes of a user in the
          database file, decide every race between requests (the next time step, the spending of a recovery code, the
          confirmation of a setup) with one conditional change so that exactly one request wins, write the audit entry
          with each change, and delete everything of a user with the user.
        justification: |
          The replay protection and the single use of a recovery code are only as strong as the store that decides
          them. Keeping the decision in the database makes it right for any number of requests, and the audit entry
          in the same transaction keeps the history true.
        children:
          - ReviewCenter-TotpStore-Pending
          - ReviewCenter-TotpStore-ConfirmAtomic
          - ReviewCenter-TotpStore-AtomicStep
          - ReviewCenter-TotpStore-RecoverySingleUse
          - ReviewCenter-TotpStore-Remove
          - ReviewCenter-TotpStore-Cascade
          - ReviewCenter-DbContext-TotpTables
        tests:
          - TotpStore_TryAdvanceStepAsync_ThirtyTwoParallelRequests_HaveExactlyOneWinner
          - TotpStore_TryConsumeRecoveryCodeAsync_ParallelRequests_HaveExactlyOneWinner
