---
# Web Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Web subsystem
# - The Web subsystem spans the App (App.razor, Routes.razor, MainLayout.razor), HomePage, AboutPage, HelpPage,
#   ProjectsPage, ProjectPage, PlanPage, ReviewPage, ChecklistPage, LoginPage, AccountPage, UsersPage, AuditPage,
#   RepositoriesPage, and InboxPage units; the App unit includes the SessionGate
#   component that replaces an open protected page when the sign-in state of its user ends
# - Subsystem requirements describe the externally visible behavior of the web user interface, including what each
#   kind of user (system administrator, project member, user who is no member) is shown
# - The subsystem tests run over plain HTTP, so they verify what the server renders: the pages, the read path from
#   the database, and the initial not-yet-interactive marker. Behavior that needs a live connection (forms,
#   uploads, the switch of the marker to interactive) is verified by the component tests of the child units.

sections:
  - title: Web Subsystem Requirements
    requirements:
      - id: ReviewCenter-Web-HomePage
        title: >-
          The Web subsystem shall serve a home page at the root URL, inside an HTML document
          titled ReviewCenter, with the product name and the tagline.
        justification: |
          The home page is the entry point of the web user interface. Delivering it in a
          complete HTML document through a routing layer proves that the shell, the router,
          and the page work together to put the page in front of the user.
        children:
          - ReviewCenter-App-Shell
          - ReviewCenter-App-Routing
          - ReviewCenter-App-NotFoundPage
          - ReviewCenter-HomePage-Title
          - ReviewCenter-HomePage-Anonymous
          - ReviewCenter-HomePage-GetStarted
          - ReviewCenter-HomePage-AdminLinks
          - ReviewCenter-App-HomeLink
          - ReviewCenter-App-Footer
          - ReviewCenter-App-Theme
          - ReviewCenter-AccountPage-Appearance
        tests:
          - WebSubsystem_HomeRoute_Requested_RendersTitleAndTagline

      - id: ReviewCenter-Web-Help
        title: >-
          The Web subsystem shall serve an About page at /about, and a built-in Help at /help with an index of
          topics and one page per topic at /help/{topic}, each with links to the previous topic, the next topic,
          and the index, among them the topic /help/project-members for the management of project members and the
          topic /help/evidence-settings for the evidence settings of a project, and a friendly message for an
          unknown topic.
        justification: |
          Users need to learn what the product does, which version they run, and how to work with it without
          leaving the application. One page per topic keeps every link a plain address that can be shared and
          avoids in-page anchors, which the base address of the HTML document would break.
        children:
          - ReviewCenter-AboutPage-Version
          - ReviewCenter-AboutPage-Description
          - ReviewCenter-HelpPage-Index
          - ReviewCenter-HelpPage-Topics
          - ReviewCenter-HelpPage-Navigation
          - ReviewCenter-HelpPage-NotFound
          - ReviewCenter-HelpPage-MembersTopic
          - ReviewCenter-HelpPage-EvidenceSettingsTopic
          - ReviewCenter-App-HelpLink
        tests:
          - HelpPage_Render_ListsEveryTopicWithItsPageLink
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation
          - HelpMembersPage_Render_ExplainsAddingAccountsAndTheLastAdminRule
          - HelpEvidenceSettingsPage_Render_ExplainsAnonymousAccessContentSwitchesAndScope
          - AboutPage_Render_Anonymous_ShowsVersionCopyrightAndProjectLink

      - id: ReviewCenter-Web-Interactive
        title: >-
          The Web subsystem shall mark an interactive page, such as the projects page, as not yet interactive in
          its initial server-rendered response, and as interactive once the live connection is established.
        justification: |
          Clicks made before the live server connection exists are lost. A marker on the page
          lets users, automated tests, and tooling wait until the page can respond instead of
          guessing with fixed delays. The subsystem test covers the initial server-rendered marker; the switch
          to interactive needs a live connection and is verified by the component tests of the page units.
        children:
          - ReviewCenter-ProjectsPage-Interactive
        tests:
          - WebSubsystem_ProjectsRoute_InitialResponse_IsNotYetInteractive

      - id: ReviewCenter-Web-Projects
        title: >-
          The Web subsystem shall serve a projects page at /projects that lists the projects the user may see, each
          linking to its page, and offers a New project button, to a system administrator only, that opens a page at
          /projects/new holding the creation form; a page for each project at /projects/{project} that shows its
          reviews; and a link to the projects page in the header of every page for a signed-in user.
        justification: |
          Projects are the entry point to the review features. Pages reached through plain addresses can be
          bookmarked and shared, and the header must lead to them.
        children:
          - ReviewCenter-ProjectsPage-List
          - ReviewCenter-ProjectsPage-Visibility
          - ReviewCenter-ProjectsPage-CreateAccess
          - ReviewCenter-ProjectsPage-Create
          - ReviewCenter-ProjectsPage-NewForm
          - ReviewCenter-ProjectsPage-Error
          - ReviewCenter-ProjectsPage-Interactive
          - ReviewCenter-ProjectPage-Show
          - ReviewCenter-ProjectPage-Reviews
          - ReviewCenter-ProjectPage-NewReview
          - ReviewCenter-App-Navigation
          - ReviewCenter-App-FormRoutes
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-Web-ProjectAccess
        title: >-
          The Web subsystem shall show a user only the projects the user is a member of, and a system administrator
          every project; shall show a project the user may not see exactly as a project that does not exist, so that
          a user cannot tell a hidden project from a missing one; shall let only a system administrator create
          projects, and only whoever administers a project, a system administrator or a project admin of it, manage
          its members, on the project page and the two pages for a new member, with a role of project admin or
          member for each member, where a member is added by the exact user name, with no list of users, or as a new
          account together with its membership; shall let only whoever manages a project
          open its repositories, and offer in a new review only the repositories of that project; and shall keep
          that rule for a page that stays open, by checking the view access again at the start of every action of
          a project page and, once the user has lost it, showing the page for a project that does not exist and
          none of the data the page had loaded; and shall do the same for the administer or system administrator
          right that the repositories, new repository, project members and users pages need, so that a user who
          was demoted sees no repository, member or user data that the page had loaded.
        justification: |
          Reviews of one body of work must not be visible to people who do not work on it, and the answer for a
          project the user may not see must not reveal that it exists. Membership is the one rule that decides what
          a user sees, so the pages ask the Core access service instead of deciding for themselves. A page that
          stays open does not load again, so a user whose membership was removed would otherwise keep reading
          through it; the shared ProjectViewGuard asks again at every action, for the view, the administer and the
          system administrator right, and the read services need no
          guard of their own because every page reaches them only after that check. The subsystem
          requirement is verified by the page tests of the units, which render the pages for a system administrator,
          a member, and a user who is no member, and remove the membership while the page is open.
        children:
          - ReviewCenter-ProjectsPage-Visibility
          - ReviewCenter-ProjectsPage-CreateAccess
          - ReviewCenter-ProjectPage-Show
          - ReviewCenter-ProjectPage-Members
          - ReviewCenter-ProjectPage-MemberChange
          - ReviewCenter-ProjectPage-AddMember
          - ReviewCenter-ProjectPage-CreateAccount
          - ReviewCenter-ProjectPage-RepositoriesLink
          - ReviewCenter-ProjectPage-RepositoryForm
          - ReviewCenter-RepositoriesPage-Admin
          - ReviewCenter-PlanPage-Form
          - ReviewCenter-ReviewPage-Access
          - ReviewCenter-ChecklistPage-Access
          - ReviewCenter-PlanPage-Access
          - ReviewCenter-HistoryPage-Access
        tests:
          - ProjectsPage_Render_MemberAndSystemAdmin_ListOnlyWhatEachMaySee
          - ProjectPage_Render_NonMember_LooksLikeAMissingProject
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership
          - NewMemberPage_Submit_ExistingUser_AddsWithRoleAndReturnsToTheProject
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt
          - RepositoriesPage_Render_MemberOrNonMember_ShowsNotFoundOnly
          - NewReviewPage_RepositorySelect_OffersOnlyRepositoriesOfThisProject
          - ProjectViewGuard_GuardView_Member_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardView_NonMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardView_MembershipRemovedBetweenChecks_SecondCheckReturnsFalse
          - ProjectViewGuard_GuardView_NobodySignedIn_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardAdminister_ProjectAdmin_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardAdminister_PlainMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardAdminister_AdminDemotedBetweenChecks_SecondCheckReturnsFalse
          - ProjectViewGuard_GuardAdminister_NobodySignedIn_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardSystemAdmin_SystemAdmin_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardSystemAdmin_DemotedOrDisabled_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardSystemAdmin_NobodySignedIn_ReturnsFalseAndCallsBackOnce
          - ReviewPage_SelectFile_MembershipRevoked_ShowsNotFoundAndNoData
          - ChecklistPage_Choose_MembershipRevoked_ShowsNotFoundAndNoData
          - HistoryPage_Reparameterize_MembershipRevoked_ShowsNotFoundAndNoEntries
          - PlanPage_ShowPlan_MembershipRevoked_ShowsNotFoundAndNoPlan
          - NewReviewPage_CreateForm_MembershipRevoked_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-Web-Reviews
        title: >-
          The Web subsystem shall let a user create a review of selected files on a page of its own, reached from
          the project page and within the upload limits, and shall serve a page for each review at
          /projects/{project}/reviews/{review} that opens with a summary of the checklist progress, reviewers and
          threads, and shows its files and the content of a selected file ahead of its fingerprint and file hashes,
          which are in a collapsed Details section.
        justification: |
          Creating a review from files, and seeing the fingerprint and the exact content again, is the first
          review capability of the product. Showing the user the reason for every refusal makes the upload
          limits usable. The subsystem test covers the served review and project pages; creating a review (form
          and upload) needs a live connection and is verified by the component tests of the page units.
        children:
          - ReviewCenter-ProjectPage-Selection
          - ReviewCenter-ProjectPage-Create
          - ReviewCenter-ProjectPage-Error
          - ReviewCenter-ProjectPage-ReservedId
          - ReviewCenter-ProjectPage-Limits
          - ReviewCenter-ProjectPage-Interactive
          - ReviewCenter-ReviewPage-Show
          - ReviewCenter-ReviewPage-Summary
          - ReviewCenter-ReviewPage-Layout
          - ReviewCenter-ReviewPage-Files
          - ReviewCenter-ReviewPage-Content
          - ReviewCenter-ReviewPage-Binary
          - ReviewCenter-ReviewPage-Interactive
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-Web-Comments
        title: >-
          The Web subsystem shall let a signed-in user, on the review page, start comment threads on the selected
          file, reply to them, resolve and reopen them, with the signed-in user as the author, and shall show the
          next step, an index of the threads of all files, the threads with their comments (resolved ones
          collapsed), and the open and resolved counts.
        justification: |
          Comments are written and read next to the code on the review page. The subsystem test covers the
          counts served from the database; starting, replying, and resolving need a live connection and are
          verified by the component tests of the page unit.
        children:
          - ReviewCenter-ReviewPage-ThreadSummary
          - ReviewCenter-ReviewPage-NextStep
          - ReviewCenter-ReviewPage-ThreadIndex
          - ReviewCenter-ReviewPage-ThreadCollapse
          - ReviewCenter-ReviewPage-ThreadStart
          - ReviewCenter-ReviewPage-ThreadShow
          - ReviewCenter-ReviewPage-ThreadUpdate
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-Web-Checklist
        title: >-
          The Web subsystem shall show on the review page the progress of the review's checklist with a link to
          a checklist page at /projects/{project}/reviews/{review}/checklist, where a user can see what is left
          to do, answer each check as the signed-in user, mark sections as not applicable, and be led to the next
          unanswered check.
        justification: |
          The checklist is worked through on its own page, and the review page shows how far it has got. The
          subsystem test covers the pages served from the database; answering needs a live connection and is
          verified by the component tests of the page units.
        children:
          - ReviewCenter-ReviewPage-Checklist
          - ReviewCenter-ChecklistPage-Show
          - ReviewCenter-ChecklistPage-Answer
          - ReviewCenter-ChecklistPage-Applicability
          - ReviewCenter-ChecklistPage-NextUnanswered
          - ReviewCenter-ChecklistPage-Interactive
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload

      - id: ReviewCenter-Web-Signatures
        title: >-
          The Web subsystem shall show on the review page a Reviewers card with the reviewer slots and their
          signature status, where a reviewer who occupies a slot signs the review after confirming the password,
          the approval status of the review (Approved or In review) next to its title, and the record digest in
          the Details section, and shall show the approval status of each review on the project page.
        justification: |
          Re-authenticated signatures are what turns a reviewed record into an approved one. The subsystem test
          covers what the pages show from the database: the sign form, the approval after a signature, and the
          approval going out of date when the record changes; adding slots and signing need a live connection and
          are verified by the component tests of the page units.
        children:
          - ReviewCenter-ReviewPage-Reviewers
          - ReviewCenter-ReviewPage-Sign
          - ReviewCenter-ReviewPage-Digest
          - ReviewCenter-ProjectPage-Approval
          - ReviewCenter-ReviewPage-SignatureWarning
          - ReviewCenter-ChecklistPage-SignatureWarning
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges

      - id: ReviewCenter-Web-ReviewLock
        title: >-
          The Web subsystem shall show a review that is approved as locked on the review page and on the checklist page,
          with the controls that change the review disabled and the reason given, let an administrator of the project
          or a system administrator reopen the review on the review page with a reason, show the reopenings in a
          history, and show the user who created the review that a different project member has to review and sign
          it when the project requires independent reviewers.
        justification: |
          The lock and the independence rule are enforced by the services, but the pages are where people meet them. The
          pages must say what is locked and why, offer the way out only to those who may take it, and keep the
          history of reopenings visible, so that a user is not left with controls that fail for no visible reason.
        children:
          - ReviewCenter-ReviewPage-Locked
          - ReviewCenter-ReviewPage-Reopen
          - ReviewCenter-ReviewPage-Independence
          - ReviewCenter-ChecklistPage-Locked
        tests:
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-Web-ReviewRules
        title: >-
          The Web subsystem shall let an administrator of the project or a system administrator switch the requirement
          of independent reviewers on the project page, and shall not show the setting to any other user.
        justification: |
          A project that has to let one person do both must be able to say so, and only the people who administer the
          project may relax a rule that protects its reviews.
        children:
          - ReviewCenter-ProjectPage-ReviewRules
        tests:
          - WebSubsystem_ProjectAdmin_TogglesIndependentReviewers

      - id: ReviewCenter-Web-ReviewRuleSwitches
        title: >-
          The Web subsystem shall let an administrator of the project or a system administrator switch the two
          further review rules (authors answering the checklist of their own review, and the person who reopened a
          review signing it again) on the project page, shall say next to them that the rules are on by default and
          apply to every project of the tool, also the projects that existed before, and shall not show them to any
          other user.
        justification: |
          The rules are enforced for every project from the day they are enforced, so a page that offered a switch
          without saying so would hide that an existing project is affected too. Only the people who administer the
          project may change a rule that protects its reviews.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches
        tests:
          - WebSubsystem_ProjectAdmin_SavesStoredReviewRuleSwitches

      - id: ReviewCenter-Web-ReviewRuleNotices
        title: >-
          The Web subsystem shall tell the author of a review on the checklist page, while the project does not let
          authors answer the checklist, that another member has to answer it, with the answer controls disabled, shall
          tell the person who reopened a review on the review page, while the project does not let that person sign
          again, that another reviewer must sign, instead of the sign form, and shall show the user the message of the
          rule when a reopening is refused because a slot would have nobody who may sign it.
        justification: |
          The services enforce the rules, but the pages are where people meet them. A user must not be left with
          controls that fail for no visible reason, and must be told what to do instead.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked
          - ReviewCenter-ReviewPage-ReopenerBlocked
        tests:
          - WebSubsystem_ChecklistPage_AuthorSeesNoticeAndNonAuthorAnswers

      - id: ReviewCenter-Web-SignIn
        title: >-
          The Web subsystem shall show in the page header the name of the signed-in user with a link to the
          account page and a logout button, or a sign-in link when nobody is signed in, serve a login page at
          /login with a user name and a password field that shows a failed sign-in without revealing its reason,
          serve an account page at /account where a signed-in user changes the own password and chooses the
          appearance, and, for a user who signed in with a temporary password, shows a banner and the password change
          only, with the header of such a session free of navigation tabs and every other page replaced by the account
          page, and the login page showing a notice to sign in again after the change, and serve a users page at
          /users where a system administrator enables and disables users, makes
          users system administrators or takes that away, and sets passwords, and reaches the page at /users/new that
          creates users.
        justification: |
          Users must be able to sign in, see who they are signed in as, and sign out from every page. Account and
          user management are done in the web interface so that no command line is needed after the first
          administrator exists. The subsystem tests cover the pages served over HTTP; the forms need a live
          connection and are verified by the component tests of the page units.
        children:
          - ReviewCenter-App-Header
          - ReviewCenter-App-UsersLink
          - ReviewCenter-App-RouteAuthorization
          - ReviewCenter-App-TemporaryPassword
          - ReviewCenter-LoginPage-Form
          - ReviewCenter-LoginPage-Error
          - ReviewCenter-LoginPage-PasswordChanged
          - ReviewCenter-AccountPage-Show
          - ReviewCenter-AccountPage-ChangePassword
          - ReviewCenter-AccountPage-TemporaryPassword
          - ReviewCenter-UsersPage-List
          - ReviewCenter-UsersPage-Create
          - ReviewCenter-UsersPage-NewPage
          - ReviewCenter-UsersPage-Update
          - ReviewCenter-UsersPage-Status
          - ReviewCenter-UsersPage-SearchFilter
          - ReviewCenter-UsersPage-DisableImpact
          - ReviewCenter-UsersPage-Confirmations
          - ReviewCenter-UsersPage-SystemAdmin
          - ReviewCenter-UsersPage-LastAdmin
          - ReviewCenter-UsersPage-AdminCheck
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd
          - MainLayout_Render_TemporaryPassword_ConfinesUserToAccountPage
          - MainLayout_Navigate_TemporaryPassword_RedirectsLaterNavigationAndStopsAfterDispose
          - AccountPage_ChangePassword_TemporaryPassword_RedirectsToLoginWithNotice
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId

      - id: ReviewCenter-Web-SessionEnd
        title: >-
          The Web subsystem shall make an open protected page, when its user is no longer valid, stop showing
          data and stop offering actions by replacing the page with a message that the session has ended and a
          link to the login page, and shall refuse every action that changes something on a protected page, with a
          message and without saving anything, once the sign-in state of the page has ended, and, until then,
          refuse every action of a user administration page that is no longer made by an enabled administrator.
        justification: |
          A page that stays open makes no request, so a user who was disabled, removed, or given another role
          would otherwise keep seeing and changing review data until the page is reloaded. The page is replaced
          once the sign-in state of the page ends, which happens at most one revalidation interval after the
          change; the header is served once and keeps the old name until the next navigation. An event that was
          already queued when the state ended can still reach a handler of the replaced page, so every handler
          that changes something asks for the current user first, even where its service takes no actor yet. The
          component tests of the page units cover the live pages, because ending an open page needs a live
          connection. On the pages of a project, the message is the one for a project that does not exist,
          because the access check that runs first finds no signed-in user.
        children:
          - ReviewCenter-App-SessionGate
          - ReviewCenter-UsersPage-AdminCheck
        tests:
          - ReviewPage_Revalidation_UserDisabled_PageStopsShowingAndAcceptingActions
          - UsersPage_Revalidation_AdminDemoted_PageShowsSessionEndedAndNoActions
          - SessionGate_Render_EveryProtectedPageSignedOut_ShowsSessionEndedAndNoPage
          - NewProjectPage_CreateForm_SessionEndedBeforePageKnows_ShowsClearErrorAndCreatesNothing
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing
          - ReviewPage_ResolveAndReopen_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-Web-TestIds
        title: >-
          The Web subsystem shall give every interactive element (link, button, input, select, and text area) of
          every page a stable, lowercase hyphenated data-testid attribute that is unique within the page (the
          breadcrumb links are distinct from the header tabs), so that automated tests and the
          Puppet tool can address it without depending on its text or layout.
        justification: |
          Tests that locate elements by visible text or position break whenever wording or layout changes. A
          stable identifier on every interactive element keeps the automated tests and the Puppet tool working
          as the pages evolve, and a repeated identifier would make a selector match the wrong element.
        tests:
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId
          - WebSubsystem_AllPages_TestIdsAreUniqueAndBreadcrumbsDistinct
          - ReviewPage_Render_ThreadControls_EveryInteractiveElementHasTestId
          - ReviewPage_Render_ReviewersCard_EveryInteractiveElementHasTestId

      - id: ReviewCenter-Web-AuditHistory
        title: >-
          The Web subsystem shall show every signed-in user who may see the project of a review the audit entries of
          the review, newest first, 50 to a
          page, on a history page that is reached from the review, with all text shown as plain text.
        justification: |
          Participants need to see who did what to a review and when, from the review itself.
        children:
          - ReviewCenter-HistoryPage-Display
          - ReviewCenter-HistoryPage-Paging
          - ReviewCenter-HistoryPage-Access
          - ReviewCenter-ReviewPage-HistoryLink
        tests:
          - HistoryPage_Render_ReviewWithEntries_ShowsOnlyItsEntriesNewestFirst
          - Routes_Render_NobodySignedInOpensHistoryRoute_DoesNotShowEntries

      - id: ReviewCenter-Web-AuditPage
        title: >-
          The Web subsystem shall show system administrators the whole audit trail on an audit page
          that is reached from the header, and let them verify the hash chain and read the entry count and the head
          hash of an intact chain or the first broken entry, and shall let them narrow the trail by project, actor,
          action, review, and date, shall offer, to whoever sees an audit page, links that export what the filter
          matches as CSV or JSON, and shall show whoever may read the audit trail of a project, a system
          administrator or a project admin of it, and nobody else, the audit trail of that project only on a page
          that is reached from the project page.
        justification: |
          The whole trail names every user and action. The head hash is what a system administrator records outside
          the database to detect the later removal of the newest entries. Project admins answer for their project, so
          they see its trail, and only that.
        children:
          - ReviewCenter-AuditPage-Display
          - ReviewCenter-AuditPage-ShortHash
          - ReviewCenter-AuditPage-Verify
          - ReviewCenter-AuditPage-Admin
          - ReviewCenter-AuditPage-ProjectView
          - ReviewCenter-AuditPage-Filter
          - ReviewCenter-AuditPage-Paging
          - ReviewCenter-AuditPage-Export
          - ReviewCenter-App-AuditLink
        tests:
          - AuditPage_Verify_IntactChain_ShowsCountAndFullHeadHash
          - Routes_Render_ReviewerOpensAuditRoute_ShowsAccessDeniedNotTrail
          - ProjectAuditPage_Render_ProjectAdmin_ShowsOnlyThisProjectsEvents

      - id: ReviewCenter-Web-Repositories
        title: >-
          The Web subsystem shall let whoever manages a project, a system administrator or a project admin of it,
          and nobody else, register, change, disable, and enable the git repositories of that project on a
          repositories page at /projects/{project}/repositories that is reached from the project page, and set,
          replace, or clear the token of a repository without it ever being shown again, and shall have no
          registry of repositories outside the projects.
        justification: |
          A repository belongs to one project and controls what source code the server reads for it, and the
          repository holds secrets. A token that can be read back from a page can be copied or leaked, so it is
          write-only. A user who may not manage the project is shown the page of a project that does not exist,
          so the page does not reveal a project to its members or to other users.
        children:
          - ReviewCenter-RepositoriesPage-Display
          - ReviewCenter-RepositoriesPage-Create
          - ReviewCenter-RepositoriesPage-AddPage
          - ReviewCenter-RepositoriesPage-Edit
          - ReviewCenter-RepositoriesPage-Enable
          - ReviewCenter-RepositoriesPage-Admin
          - ReviewCenter-ProjectPage-RepositoriesLink
          - ReviewCenter-App-NoRepositoriesLink
        tests:
          - SignIn_RepositoriesPage_NonMemberAndSystemAdmin_OnlyAdminIsServed
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields

      - id: ReviewCenter-Web-RepositoryReviews
        title: >-
          The Web subsystem shall let a user create a review from a git repository on the project page, choosing among
          the enabled repositories of the project by name, with a head revision, an optional baseline revision, and a
          selection, show
          the reason when it cannot be created, and show on the review page the change kind of each file, the source,
          and for a file of a review with a baseline a choice between the Diff view, the Head version (not for a
          deleted file) and a read-only Baseline version (not for an added file).
        justification: |
          Reviewing a change means seeing what it replaces. The page keeps the full texts one click away and never
          shows how the server reaches the repository.
        children:
          - ReviewCenter-ProjectPage-SourceChoice
          - ReviewCenter-ProjectPage-RepositoryForm
          - ReviewCenter-ProjectPage-RepositoryError
          - ReviewCenter-ReviewPage-Source
          - ReviewCenter-ReviewPage-Versions
        tests:
          - NewReviewPage_CreateForm_FromRepository_CreatesReviewWithSourceAndNavigates
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-Web-DiffReview
        title: >-
          The Web subsystem shall show a changed file of a review from a repository as a side-by-side diff on the
          review page, with the unchanged lines collapsed, let a signed-in user comment on a line of either version
          and read the threads under their rows, say in plain words when a comparison cannot be shown, and keep the
          diff inside the width of a phone by stacking its two sides.
        justification: |
          Reviewers judge a change by reading what changed. The subsystem test guards the stylesheet rules that keep
          the page from scrolling sideways; the interactions need a live connection and are verified by the
          component tests of the page unit.
        children:
          - ReviewCenter-ReviewPage-Diff
          - ReviewCenter-ReviewPage-DiffStates
          - ReviewCenter-ReviewPage-DiffComment
          - ReviewCenter-ReviewPage-DiffThreads
          - ReviewCenter-ReviewPage-DiffLayout
        tests:
          - WebSubsystem_Stylesheet_DiffRules_KeepCodeScrollingInsideItself
          - WebSubsystem_Stylesheet_DiffCommentControl_ShowsOnHoverFocusAndTouch
          - WebSubsystem_Stylesheet_TransparentButtons_OverrideTheGlobalHoverFill

      - id: ReviewCenter-Web-DeepLinks
        title: >-
          The Web subsystem shall give every file, line and thread of a review a stable address that opens the review
          page at that place, keep the address bar equal to what is shown as the reader chooses files and threads,
          and bring a signed-out visitor back to the same address after signing in.
        justification: |
          Review is a conversation between people, so a reviewer must be able to point a colleague at one file, one
          line or one thread by sending a link, and the link must still work after a sign-in or a reload.
        children:
          - ReviewCenter-ReviewPage-DeepLinks
          - ReviewCenter-ReviewPage-DeepLinksNotFound
          - ReviewCenter-SignIn-ReturnDeepLink
        tests:
          - Routes_DeepLink_SignedOut_LoginLinkKeepsEscapesAndQuery
          - WebSubsystem_Stylesheet_ThreadLink_IsButtonStyled

      - id: ReviewCenter-Web-PlanReviews
        title: >-
          The Web subsystem shall let a user plan the reviews a head revision of a repository of the project needs on
          a plan page that is reached from the project page, showing one plain summary, the sets that need a review
          ticked first and the sets with nothing to review collapsed, creating the ticked reviews with a result per
          review, explaining every failure in plain English, and showing on the review page the review-set a
          planned review belongs to.
        justification: |
          Planning is useful only when a user can read the answer at a glance and knows what to do next. The page
          therefore leads with the sets that need action, hides the rest, and never shows raw git output.
        children:
          - ReviewCenter-PlanPage-Form
          - ReviewCenter-PlanPage-Summary
          - ReviewCenter-PlanPage-Rows
          - ReviewCenter-PlanPage-Create
          - ReviewCenter-PlanPage-Error
          - ReviewCenter-PlanPage-State
          - ReviewCenter-PlanPage-Interactive
          - ReviewCenter-ProjectPage-PlanLink
          - ReviewCenter-ReviewPage-ReviewSet
        tests:
          - PlanPage_Create_TickedRows_ShowsResultWithLinksAndCreatesReviews
          - PlanPage_ShowPlan_SetsNeedingReview_ShowsSummaryTickedRowsAndCollapsedEmpties

      - id: ReviewCenter-Web-Attestation
        title: >-
          The Web subsystem shall offer the signed attestation of a review on the review page only when the review is
          approved, as a download of the PDF that says which kind of key will sign it, with a link to a help topic that
          explains what the signature proves and what it does not, and shall show why it is unavailable instead of the
          download when the signing key cannot be used.
        justification: |
          A user who completes a review needs the evidence at hand and needs to know how much it is worth. The
          reader of the user interface must see that the default key is not an organization key before taking the
          document anywhere.
        children:
          - ReviewCenter-ReviewPage-Attestation
          - ReviewCenter-HelpPage-AttestationTopic
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote
          - HelpAttestationPage_Render_ExplainsWhatTheSignatureProvesAndTheKey

      - id: ReviewCenter-Web-AccessTokens
        title: >-
          The Web subsystem shall let a signed-in user manage personal access tokens on the account page, creating a
          token and seeing its value once with a way to copy it, seeing the tokens with their expiry and last use,
          and revoking a token, and shall explain the tokens and the API in a help topic that the account page links
          to.
        justification: |
          A token is made, read and taken back by its owner, so the page where the user already manages the account is
          where it belongs, and a help topic next to it tells how a token is used and what it cannot do.
        children:
          - ReviewCenter-AccountPage-TokensCard
          - ReviewCenter-AccountPage-TokenCreate
          - ReviewCenter-AccountPage-TokenCopy
          - ReviewCenter-AccountPage-TokenRevoke
          - ReviewCenter-HelpPage-ApiTokensTopic
        tests:
          - AccountPage_CreateToken_ValidInput_ShowsValueOnceAndListsToken
          - AccountPage_RevokeToken_ActiveToken_MarksRevokedAndRemovesButton
          - HelpApiTokensPage_Render_ExplainsTokensCurlEndpointsAndErrors

      - id: ReviewCenter-Web-EvidenceSettings
        title: >-
          The Web subsystem shall let only whoever administers a project (a system administrator or a project admin of
          it) open the evidence settings page of the project from an Evidence settings button on the project page, and
          show anybody else the page of a project that does not exist; shall show there the switches for anonymous
          access to the evidence index and the attestation PDFs and for the content of the PDFs, with the defaults,
          the regulatory warnings, the summary of what is left out and the exposure warning shown as the switches are
          changed; shall save the switches together, record the change in the audit trail of the project, and refuse a
          save over a change made by someone else or after the right was lost; and shall explain the settings in a
          help topic.
        justification: |
          Opening evidence to anonymous readers and reducing what a PDF contains are decisions with regulatory
          consequences, so they belong to the people who answer for the project, are shown with their consequences
          before they are saved, and are accountable afterwards. The behavior needs a live connection, so it is
          verified by the component tests of the units.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsLink
          - ReviewCenter-ProjectPage-EvidenceSettingsAccess
          - ReviewCenter-ProjectPage-EvidenceSettingsSwitches
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings
          - ReviewCenter-ProjectPage-EvidenceSettingsSave
          - ReviewCenter-ProjectPage-EvidenceSettingsConflict
          - ReviewCenter-ProjectPage-EvidenceSettingsRightLost
          - ReviewCenter-HelpPage-EvidenceSettingsTopic
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings
          - EvidenceSettingsPage_Render_NoAdministerRight_ShowsNotFoundAndNoSwitches
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits
          - HelpEvidenceSettingsPage_Render_ExplainsAnonymousAccessContentSwitchesAndScope

      - id: ReviewCenter-Web-ChecklistTemplate
        title: >-
          The Web subsystem shall let only whoever administers a project (a system administrator or a project admin of
          it) open the checklist template page of the project from a Checklist button on the project page, and
          show anybody else the page of a project that does not exist; shall show on the project page a line that says
          which checklist new reviews start with; shall let the administrator export the current and the built-in
          default checklist, import a definition by pasting or from a file, check it with every error and its path
          shown, preview it and its differences from the current checklist, replace the checklist of the project after
          a confirmation that says that existing reviews keep their checklist, and reset it to the built-in default;
          shall record every change in the audit trail of the project, and refuse a change over a change made by
          someone else or after the right was lost; and shall explain the template in a help topic.
        justification: |
          The checklist is how a formal review shows what was examined, and projects in a regulated setting need their
          own wording. Letting the people who answer for the project change it, with the consequences and the
          differences shown before they confirm, with the existing reviews untouched, and accountable afterwards, makes
          that possible without access to the server. The behavior needs a live connection, so it is verified by the
          component tests of the units, and the whole journey by a system test.
        children:
          - ReviewCenter-ProjectPage-ChecklistLink
          - ReviewCenter-ProjectPage-ChecklistAccess
          - ReviewCenter-ProjectPage-ChecklistExport
          - ReviewCenter-ProjectPage-ChecklistImport
          - ReviewCenter-ProjectPage-ChecklistPreview
          - ReviewCenter-ProjectPage-ChecklistReplace
          - ReviewCenter-ProjectPage-ChecklistReset
          - ReviewCenter-ProjectPage-ChecklistConflict
          - ReviewCenter-ProjectPage-ChecklistRightLost
          - ReviewCenter-HelpPage-ChecklistTemplateTopic
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary
          - ProjectChecklistPage_Render_NoAdministerRight_ShowsNotFoundAndNothingElse
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits
          - HelpChecklistTemplatePage_Render_ExplainsExportImportReplaceResetAndCopies

      - id: ReviewCenter-Web-DueDate
        title: >-
          The Web subsystem shall let a user give a review an optional due date, stated as a calendar day in UTC, when
          creating it from files, from a repository, or from a plan (one date for all the planned reviews and one for
          each), show the due date in the header of a review with an Overdue badge while it is past and the review
          is not approved, and let the administrators of the project and the creator of the review, and nobody else,
          change or clear the date of a review that is not locked, showing the message of the rule when a date is
          refused.
        justification: |
          A lead plans reviews with dates and must see at a glance which are late. The pages must state the time basis
          so that nobody reads the date in another zone, and must not offer a change that the rules refuse. The
          behavior needs a live connection, so it is verified by the component tests of the units, and the whole
          journey by a system test.
        children:
          - ReviewCenter-ProjectPage-NewReviewDueDate
          - ReviewCenter-PlanPage-DueDate
          - ReviewCenter-ReviewPage-DueDate
          - ReviewCenter-ReviewPage-Overdue
        tests:
          - NewReviewPage_CreateForm_DueDate_IsStoredWithTheReview
          - PlanPage_Create_DueDates_DefaultAndRowDate
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused

      - id: ReviewCenter-Web-Progress
        title: >-
          The Web subsystem shall show on the project page, for every review, its stage, its signatures with the
          out-of-date ones, what blocks it, the people it waits on, its last activity, and its due date with the
          Overdue badge, a summary of the reviews by stage and the overdue ones, filters by stage, overdue, blocked,
          and text, sortable columns, and 25 reviews to a page, keep all of it in the query string, and show the same
          to a read-only auditor of the project and nothing to a user outside it.
        justification: |
          The project page is where a lead starts. It has to show who is holding each review up and let the lead
          narrow and order the list, with a link that others can open. The behavior needs a live connection, so it is
          verified by the component tests of the unit, and the whole journey by a system test.
        children:
          - ReviewCenter-ProjectPage-Progress
          - ReviewCenter-ProjectPage-Summary
          - ReviewCenter-ProjectPage-ProgressFilter
          - ReviewCenter-ProjectPage-ProgressSort
          - ReviewCenter-ProjectPage-ReadOnly
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary
          - ProjectPage_Render_QueryFilters_NarrowTheTable
          - ProjectPage_Render_AuditorAndStranger_AuditorSeesTheTableStrangerNothing
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-Web-FollowUp
        title: >-
          The Web subsystem shall let a user create a review as a follow-up of an earlier review of the project from
          the page for a new review, with a preview of what is carried over and a confirmation before open threads are
          dropped, show on the checklist of a follow-up which answers and section states were carried and from which
          review, show the earlier Fail of a check that is open again, and show on the review page what a review
          follows, what follows it and which threads were carried.
        justification: |
          Carrying work over only helps when the people see what was carried, from where, and what they still have to
          decide. The behavior needs a live connection, so it is verified by the component tests of the units, and the
          whole journey by a system test.
        children:
          - ReviewCenter-ProjectPage-FollowUp
          - ReviewCenter-ChecklistPage-CarriedMarks
          - ReviewCenter-ReviewPage-FollowUp
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp
          - ChecklistPage_Render_FollowUp_ShowsCarriedMarksAndEarlierFail
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-Web-OidcSignIn
        title: >-
          The Web subsystem shall offer the sign-in with an OpenID Connect provider as a button beside the form for a
          local account, mark the accounts of the provider on the user list without offering a password for them,
          replace the password form of their own page by a sentence, offer a confirmation at the provider in place of
          the password for a signature, and explain all of this in the help topics.
        justification: |
          People must find the way that suits their account without reading a manual, and the pages must not offer what
          the rules refuse. The behavior needs a live connection, so it is verified by the component tests of the
          units and by the tests of the flow.
        children:
          - ReviewCenter-LoginPage-OidcButton
          - ReviewCenter-UsersPage-ExternalAccount
          - ReviewCenter-AccountPage-ExternalAccount
          - ReviewCenter-ReviewPage-ExternalSignature
          - ReviewCenter-HelpPage-OidcSignIn
        tests:
          - LoginPage_Render_ProviderEnabled_ShowsButtonBesideLocalForm
          - OidcReauth_ReviewPage_OffersConfirmationThenSigning

      - id: ReviewCenter-Web-TotpSecondFactor
        title: >-
          The Web subsystem shall let a person with a local account set up, use, and turn off the second factor on
          their own page, ask for the code after the password in a page of its own, ask for the code beside the
          password in the sign form of a review, show administrators who has a second factor and let a system
          administrator reset it, and explain all of this in a help topic.
        justification: |
          The pages must make the safe way the easy way and must not offer what the rules refuse, so the person finds
          the way that suits their account without reading a manual.
        children:
          - ReviewCenter-TotpLoginPage-SecondStepForm
          - ReviewCenter-LoginPage-TotpExpiredNotice
          - ReviewCenter-AccountPage-Totp
          - ReviewCenter-UsersPage-TotpReset
          - ReviewCenter-ReviewPage-SignTotpCode
          - ReviewCenter-HelpPage-TwoFactorTopic
        tests:
          - TotpLoginPage_Render_PendingSignIn_ShowsCodeFormAndNoUserName
          - AccountPage_Confirm_RightCode_ShowsTenRecoveryCodesOnceAndNoSecret

      - id: ReviewCenter-Web-Inbox
        title: >-
          The Web subsystem shall give a signed-in user an inbox page that lists the reviews that wait for the user in
          four groups with a summary, a chip and a New badge on each item, and a button to mark all as read, show the
          number of reviews that need action on the home page, mark the new comments of a review in its index and its
          threads, remember on a visit what the user has seen, serve the page only to a signed-in user, and explain all
          of this in a help topic.
        justification: |
          A reviewer should learn from the first page what waits and be led to it, and the marks must show what is new
          without a second place to look. The help topic explains what the number counts and what clears it.
        children:
          - ReviewCenter-InboxPage-Access
          - ReviewCenter-InboxPage-Sections
          - ReviewCenter-InboxPage-Summary
          - ReviewCenter-InboxPage-MarkAllRead
          - ReviewCenter-InboxPage-Interactive
          - ReviewCenter-HomePage-InboxCard
          - ReviewCenter-ReviewPage-UnreadMarkers
          - ReviewCenter-ReviewPage-MarkSeen
          - ReviewCenter-HelpPage-InboxTopic
        tests:
          - InboxPage_Render_ToSignAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - WebSubsystem_InboxPage_Unauthenticated_IsChallenged
