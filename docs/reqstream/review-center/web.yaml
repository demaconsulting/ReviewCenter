---
# Web Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Web subsystem
# - The Web subsystem spans the App (App.razor, Routes.razor, MainLayout.razor), HomePage, AboutPage, HelpPage,
#   ProjectsPage, ProjectPage, PlanPage, ReviewPage, ChecklistPage, LoginPage, AccountPage, UsersPage, AuditPage,
#   RepositoriesPage, and InboxPage units; the App unit includes the SessionGate
#   component that replaces an open protected page when the sign-in state of its user ends
# - Subsystem requirements describe the externally visible behavior of the web user interface, including what each
#   kind of user (system administrator, project member, user who is no member) is shown
# - Each requirement states one criterion. The criterion that the old requirement stated first keeps its id; the
#   others are named <OldId>-<Aspect>. A requirement without tests is verified through its child requirements
# - The subsystem tests run over plain HTTP, so they verify what the server renders: the pages, the read path from
#   the database, and the initial not-yet-interactive marker. Behavior that needs a live connection (forms,
#   uploads, the switch of the marker to interactive) is verified by the component tests of the child units.

sections:
  - title: Web Subsystem Requirements
    requirements:
      - id: ReviewCenter-Web-HomePage
        title: >-
          The Web subsystem shall serve a home page at the root URL.
        justification: |
          The home page is the entry point of the web user interface. Reaching it through the routing layer proves
          that the router and the page work together to put the page in front of the user.
        children:
          - ReviewCenter-App-Routing
        tests:
          - WebSubsystem_HomeRoute_Requested_RendersTitleAndTagline

      - id: ReviewCenter-Web-HomePage-NotFound
        title: >-
          The Web subsystem shall show a not-found page, inside the page frame, for an address that no page handles.
        justification: |
          A visitor who follows an outdated or mistyped address needs to learn that the address is unknown and to find
          a way back, without losing the navigation of the application.
        children:
          - ReviewCenter-App-Routing-NotFound
          - ReviewCenter-App-Routing-NotFoundFrame
          - ReviewCenter-App-NotFoundPage
          - ReviewCenter-App-NotFoundPage-Message
          - ReviewCenter-App-NotFoundPage-Frame
          - ReviewCenter-App-NotFoundPage-ProjectsButton

      - id: ReviewCenter-Web-HomePage-NotFoundOther
        title: >-
          The Web subsystem shall leave the 404 of an unknown address without the not-found page when the request is
          an API address, an address with a file extension, or not a GET or HEAD request.
        justification: |
          Programs and browsers that ask for data, files, or other methods expect the plain status code. A page of
          HTML in their place would corrupt what they read.
        children:
          - ReviewCenter-App-NotFoundPage-ApiAddress
          - ReviewCenter-App-NotFoundPage-FileExtension
          - ReviewCenter-App-NotFoundPage-NonPageRequest

      - id: ReviewCenter-Web-HomePage-GetStarted
        title: >-
          The Web subsystem shall show a signed-in user a Get started section with links to the inbox page and the
          projects page.
        justification: |
          A user who has just signed in needs the two places where the daily work starts one click away from the
          home page.
        children:
          - ReviewCenter-HomePage-GetStarted
          - ReviewCenter-HomePage-GetStarted-ProjectsLink
          - ReviewCenter-HomePage-GetStarted-Descriptions

      - id: ReviewCenter-Web-HomePage-AdminLinks
        title: >-
          The Web subsystem shall add to the Get started section links to the audit page and the users page while a
          system administrator is signed in.
        justification: |
          The people who run the tool need the audit page and the users page at hand, and only they may use them.
        children:
          - ReviewCenter-HomePage-AdminLinks
          - ReviewCenter-HomePage-AdminLinks-Descriptions

      - id: ReviewCenter-Web-HomePage-AdminLinksHidden
        title: >-
          The Web subsystem shall show a signed-in user who is no system administrator no link to the audit page and
          no link to the users page.
        justification: |
          A link to a page that the user may not open would only lead to a refusal and would reveal that the page
          exists.
        children:
          - ReviewCenter-HomePage-AdminLinks-OtherUsers

      - id: ReviewCenter-Web-HomePage-HeaderLink
        title: >-
          The Web subsystem shall show in the header of every page exactly one link to the home page, labeled with the
          product name.
        justification: |
          The product name in the header is the familiar way back to the start from any page.
        children:
          - ReviewCenter-App-HomeLink
          - ReviewCenter-App-HomeLink-ProductName

      - id: ReviewCenter-Web-HomePage-Footer
        title: >-
          The Web subsystem shall show in a footer on every page the product name, its version, and the copyright
          holder, with a link to the About page.
        justification: |
          A user or an auditor who reports a problem must be able to read the version from any page and to reach the
          page that tells more about the product.
        children:
          - ReviewCenter-App-Footer
          - ReviewCenter-App-Footer-AboutLink

      - id: ReviewCenter-Web-HomePage-Document
        title: >-
          The Web subsystem shall serve the home page inside an HTML document titled ReviewCenter.
        justification: |
          A complete HTML document with the product title is what a browser, a bookmark, and a screen reader need to
          identify the page.
        children:
          - ReviewCenter-App-Shell
          - ReviewCenter-App-Shell-PageTitle
        tests:
          - WebSubsystem_HomeRoute_Requested_RendersTitleAndTagline

      - id: ReviewCenter-Web-HomePage-ClientScript
        title: >-
          The Web subsystem shall load the interactive client script in the HTML document of every page.
        justification: |
          Interactive pages need the client script in the document, or the live connection would not work on any page.
        children:
          - ReviewCenter-App-Shell-ClientScript

      - id: ReviewCenter-Web-HomePage-ClientCopyHelper
        title: >-
          The Web subsystem shall define in the HTML document of every page the browser helper that copies text to the
          clipboard.
        justification: |
          Copy buttons of all pages must behave the same, so one helper is shared.
        children:
          - ReviewCenter-App-Shell-CopyHelper

      - id: ReviewCenter-Web-HomePage-ClientFocusHelper
        title: >-
          The Web subsystem shall define in the HTML document of every page the browser helper that moves the focus to
          a field by its test id.
        justification: |
          Pages that move the focus after an update need one shared way to do it.
        children:
          - ReviewCenter-App-Shell-FocusHelper

      - id: ReviewCenter-Web-HomePage-ClientCtrlEnter
        title: >-
          The Web subsystem shall define in the HTML document of every page the keyboard shortcut that presses the
          submit button of a comment field when Ctrl+Enter is pressed in it.
        justification: |
          A keyboard user submits a text form the same way on every page.
        children:
          - ReviewCenter-App-Shell-CtrlEnterShortcut

      - id: ReviewCenter-Web-HomePage-Tagline
        title: >-
          The Web subsystem shall show the product name and the tagline on the home page.
        justification: |
          A visitor who arrives at the product must see at once what it is called and what it is for.
        children:
          - ReviewCenter-HomePage-Title
          - ReviewCenter-HomePage-Anonymous
        tests:
          - WebSubsystem_HomeRoute_Requested_RendersTitleAndTagline

      - id: ReviewCenter-Web-HomePage-NoLinks
        title: >-
          The Web subsystem shall show a visitor who is not signed in no link to any other page on the home page.
        justification: |
          A visitor who cannot sign in from the home page yet must not be offered pages that would only refuse the
          visit.
        children:
          - ReviewCenter-HomePage-Anonymous-NoLinks

      - id: ReviewCenter-Web-Help
        title: >-
          The Web subsystem shall serve a built-in Help at /help with an index of the topics.
        justification: |
          Users need to learn how to work with the product without leaving the application. One page per topic keeps
          every link a plain address that can be shared and avoids in-page anchors, which the base address of the
          HTML document would break.
        children:
          - ReviewCenter-HelpPage-Index
        tests:
          - HelpPage_Render_ListsEveryTopicWithItsPageLink

      - id: ReviewCenter-Web-Help-HeaderLink
        title: >-
          The Web subsystem shall show in the header of every page a link to the help.
        justification: |
          A visitor who is stuck, including one who cannot sign in yet, finds the Help from every page.
        children:
          - ReviewCenter-App-HelpLink

      - id: ReviewCenter-Web-Help-HeaderLinkBeforeSignIn
        title: >-
          The Web subsystem shall place the link to the help before the sign-in link in the header when nobody is signed
          in.
        justification: |
          A visitor who cannot sign in yet must meet the Help before the sign-in link.
        children:
          - ReviewCenter-App-HelpLink-BeforeSignIn

      - id: ReviewCenter-Web-Help-About
        title: >-
          The Web subsystem shall serve an About page at /about.
        justification: |
          Users and auditors must be able to tell which version of the product they run and what it does, before
          signing in as well.
        children:
          - ReviewCenter-AboutPage-Version
          - ReviewCenter-AboutPage-Version-Copyright
          - ReviewCenter-AboutPage-Version-ProjectLink
          - ReviewCenter-AboutPage-Version-AnonymousAccess
          - ReviewCenter-AboutPage-Description
          - ReviewCenter-HelpPage-Index-AboutLink
        tests:
          - AboutPage_Render_Anonymous_ShowsVersionCopyrightAndProjectLink
          - AboutPage_Request_Anonymous_IsServedWithoutSignIn

      - id: ReviewCenter-Web-Help-TopicPages
        title: >-
          The Web subsystem shall serve one Help page per topic at /help/{topic}.
        justification: |
          One page per topic keeps every link a plain address that can be shared.
        children:
          - ReviewCenter-HelpPage-Topics
          - ReviewCenter-HelpPage-Topics-ImageAlt
        tests:
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation

      - id: ReviewCenter-Web-Help-SigningTopic
        title: >-
          The Web subsystem shall explain the signing of a review in its Help topic.
        justification: |
          Signing is the step with the strictest rules (who may reopen, what a rejection means), so a reviewer needs
          them explained where the Help is.
        children:
          - ReviewCenter-HelpPage-SigningTopic
          - ReviewCenter-HelpPage-SigningTopic-ReopenRefused
          - ReviewCenter-HelpPage-SigningTopic-FailDoesNotBlock
          - ReviewCenter-HelpPage-SigningTopic-Rejection
          - ReviewCenter-HelpPage-SigningTopic-RejectionConclusion
        tests:
          - HelpSigningPage_Render_ExplainsTheReopenerRule

      - id: ReviewCenter-Web-Help-ReadingReviewTopic
        title: >-
          The Web subsystem shall explain the reading of a review in its Help topic.
        justification: |
          A reader who opens a review for the first time has to learn the cards, the slots, and what a conclusion
          changes on the page.
        children:
          - ReviewCenter-HelpPage-ReadingReviewTopic
          - ReviewCenter-HelpPage-ReadingReviewTopic-Concluding
          - ReviewCenter-HelpPage-ReadingReviewTopic-Locked
          - ReviewCenter-HelpPage-ReadingReviewTopic-ConclusionCard
          - ReviewCenter-HelpPage-ReadingReviewTopic-ConclusionHidden
        tests:
          - HelpPage_ReadingReview_ShowsSlotOwnerNote

      - id: ReviewCenter-Web-Help-Navigation
        title: >-
          The Web subsystem shall give every Help topic page links to the previous topic, the next topic, and the
          index.
        justification: |
          A reader who finishes a topic must be able to go on, or back, without returning to the index first.
        children:
          - ReviewCenter-HelpPage-Navigation
          - ReviewCenter-HelpPage-Navigation-NoAnchors
        tests:
          - HelpTopicPages_Render_EveryTopicHasAPageWithValidNavigation

      - id: ReviewCenter-Web-Help-NavigationEnds
        title: >-
          The Web subsystem shall leave out the link to the previous topic on the first Help topic page and the link
          to the next topic on the last one.
        justification: |
          A link that leads nowhere at either end of the topic list would only confuse the reader.
        children:
          - ReviewCenter-HelpPage-Navigation-FirstPage
          - ReviewCenter-HelpPage-Navigation-LastPage

      - id: ReviewCenter-Web-Help-MembersTopic
        title: >-
          The Web subsystem shall explain the management of project members in the topic /help/project-members.
        justification: |
          Adding people to a project, and the rule that a project keeps an administrator, are the first things a new
          project admin has to learn.
        children:
          - ReviewCenter-HelpPage-MembersTopic
          - ReviewCenter-HelpPage-MembersTopic-NewAccount
          - ReviewCenter-HelpPage-MembersTopic-LastAdmin
          - ReviewCenter-HelpPage-MembersTopic-FormerMember
          - ReviewCenter-HelpPage-MembersTopic-AuditTrail
        tests:
          - HelpMembersPage_Render_ExplainsAddingAccountsAndTheLastAdminRule

      - id: ReviewCenter-Web-Help-UnknownTopic
        title: >-
          The Web subsystem shall show a friendly message for an unknown Help topic.
        justification: |
          A mistyped or outdated address must lead the reader back to the Help, not to an error.
        children:
          - ReviewCenter-HelpPage-NotFound
          - ReviewCenter-HelpPage-NotFound-IndexLink

      - id: ReviewCenter-Web-Interactive
        title: >-
          The Web subsystem shall mark an interactive page, such as the projects page, as not yet interactive in its
          initial server-rendered response.
        justification: |
          Clicks made before the live server connection exists are lost. A marker on the page lets users, automated
          tests, and tooling wait until the page can respond instead of guessing with fixed delays. The subsystem
          test covers the initial server-rendered marker.
        tests:
          - WebSubsystem_ProjectsRoute_InitialResponse_IsNotYetInteractive

      - id: ReviewCenter-Web-Interactive-Live
        title: >-
          The Web subsystem shall mark an interactive page as interactive once the live connection is established.
        justification: |
          The switch to interactive needs a live connection, so it is verified by the component tests of the page
          units.
        children:
          - ReviewCenter-ProjectsPage-Interactive
          - ReviewCenter-ReviewPage-Interactive
          - ReviewCenter-ProjectPage-Interactive
          - ReviewCenter-ChecklistPage-Interactive-Marker
          - ReviewCenter-AuditPage-ProjectView-Interactive

      - id: ReviewCenter-Web-Projects
        title: >-
          The Web subsystem shall serve a projects page at /projects that lists the projects the user may see, each
          linking to its page.
        justification: |
          Projects are the entry point to the review features. Pages reached through plain addresses can be bookmarked
          and shared.
        children:
          - ReviewCenter-ProjectsPage-List
          - ReviewCenter-ProjectsPage-List-Description
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-Web-Projects-Empty
        title: >-
          The Web subsystem shall tell a user who may see no project that there are no projects.
        justification: |
          An empty list without a word looks like a failure. The message tells the user that the list is empty on
          purpose.
        children:
          - ReviewCenter-ProjectsPage-List-Empty

      - id: ReviewCenter-Web-Projects-EmptyReason
        title: >-
          The Web subsystem shall tell a user who is a member of no project that the list is empty because no
          administrator added the user.
        justification: |
          The reason for a user who no administrator has added yet tells the user what to do next.
        children:
          - ReviewCenter-ProjectsPage-Visibility-EmptyReason

      - id: ReviewCenter-Web-Projects-NewButton
        title: >-
          The Web subsystem shall offer a system administrator a button that leads to a separate page for a new project
          on the projects page.
        justification: |
          Creating a project is a decision of the people who run the tool, so the page offers the button to them.
        children:
          - ReviewCenter-ProjectsPage-NewForm
        tests:
          - ProjectsPage_Render_MemberAndSystemAdmin_ListOnlyWhatEachMaySee

      - id: ReviewCenter-Web-Projects-NewButtonHidden
        title: >-
          The Web subsystem shall offer no button that creates a project to a user who is no system administrator.
        justification: |
          A button that always ends in a refusal would only mislead a project member.
        children:
          - ReviewCenter-ProjectsPage-Visibility-NoCreateButton
        tests:
          - ProjectsPage_Render_MemberAndSystemAdmin_ListOnlyWhatEachMaySee

      - id: ReviewCenter-Web-Projects-NewPage
        title: >-
          The Web subsystem shall serve a page at /projects/new that holds the project creation form.
        justification: |
          A page of its own for the form gives the creation a plain address.
        children:
          - ReviewCenter-ProjectsPage-NewForm-FormPage

      - id: ReviewCenter-Web-Projects-NewPageNotInList
        title: >-
          The Web subsystem shall keep the project creation form off the project list.
        justification: |
          A form in the list would make the list long and would invite a creation by mistake.
        children:
          - ReviewCenter-ProjectsPage-NewForm-NotInList

      - id: ReviewCenter-Web-Projects-NewPageCancel
        title: >-
          The Web subsystem shall offer on the page for a new project a Cancel link back to the project list.
        justification: |
          A user who does not want to create a project must be able to leave the form without a detour.
        children:
          - ReviewCenter-ProjectsPage-NewForm-Cancel

      - id: ReviewCenter-Web-Projects-NewPageCreate
        title: >-
          The Web subsystem shall create a project from the name and the description entered on the page for a new
          project.
        justification: |
          The form exists to create the project, so that users can start a new body of work without any other tool.
        children:
          - ReviewCenter-ProjectsPage-Create

      - id: ReviewCenter-Web-Projects-NewPageOpens
        title: >-
          The Web subsystem shall show the page of the new project once the project has been created.
        justification: |
          The user continues at the page of the project just created.
        children:
          - ReviewCenter-ProjectsPage-Create-Opens

      - id: ReviewCenter-Web-Projects-NewPageError
        title: >-
          The Web subsystem shall show on the page for a new project the reason when a project cannot be created, such
          as that the user is no longer signed in.
        justification: |
          A user whose request fails must learn why, and whether the sign-in state has ended, to correct the entry or
          to sign in again.
        children:
          - ReviewCenter-ProjectsPage-Error
          - ReviewCenter-ProjectsPage-Error-SessionEnded

      - id: ReviewCenter-Web-Projects-NewPageNothingCreated
        title: >-
          The Web subsystem shall create no project when the project cannot be created.
        justification: |
          A refused request must leave no half-made project behind that the user would then have to find and remove.
        children:
          - ReviewCenter-ProjectsPage-Error-NothingCreated

      - id: ReviewCenter-Web-Projects-Project
        title: >-
          The Web subsystem shall serve a page for each project at /projects/{project} that shows its reviews.
        justification: |
          A project page is the place where a team finds the reviews of one body of work, and its plain address can
          be shared.
        children:
          - ReviewCenter-ProjectPage-Show
          - ReviewCenter-ProjectPage-Reviews
          - ReviewCenter-ProjectPage-Reviews-NoStateBadge
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-Web-Projects-HeaderLink
        title: >-
          The Web subsystem shall show a link to the projects page in the header of every page for a signed-in user.
        justification: |
          The header must lead to the projects from every page, and only a signed-in user has projects to reach.
        children:
          - ReviewCenter-App-Navigation

      - id: ReviewCenter-Web-Projects-HeaderLinkSignedOut
        title: >-
          The Web subsystem shall show in the header no link to the projects page while nobody is signed in.
        justification: |
          A visitor who is not signed in has no projects to reach, and a link would only lead to the sign-in page.
        children:
          - ReviewCenter-App-Navigation-SignedOut

      - id: ReviewCenter-Web-ProjectAccess
        title: >-
          The Web subsystem shall show a user who is no system administrator only the projects the user is a member
          of.
        justification: |
          Reviews of one body of work must not be visible to people who do not work on it. Membership is the one rule
          that decides what a user sees.
        children:
          - ReviewCenter-ProjectsPage-Visibility
        tests:
          - ProjectsPage_Render_MemberAndSystemAdmin_ListOnlyWhatEachMaySee

      - id: ReviewCenter-Web-ProjectAccess-AdminSeesAll
        title: >-
          The Web subsystem shall show a system administrator every project.
        justification: |
          A system administrator runs the tool and must be able to reach every project to administer it.
        children:
          - ReviewCenter-ProjectsPage-Visibility-Administrator
        tests:
          - ProjectsPage_Render_MemberAndSystemAdmin_ListOnlyWhatEachMaySee

      - id: ReviewCenter-Web-ProjectAccess-HiddenProject
        title: >-
          The Web subsystem shall show a project that the user may not see exactly as a project that does not exist.
        justification: |
          The answer for a project the user may not see must not reveal that the project exists.
        children:
          - ReviewCenter-ProjectPage-Show-Missing
          - ReviewCenter-ProjectPage-Show-Hidden
          - ReviewCenter-ProjectPage-Show-NewReviewHidden
        tests:
          - ProjectPage_Render_NonMember_LooksLikeAMissingProject

      - id: ReviewCenter-Web-ProjectAccess-CreateProjects
        title: >-
          The Web subsystem shall refuse the form for a new project of a user who is no system administrator with a
          message that names the missing right.
        justification: |
          Creating a project is a decision of the people who run the tool, and a user who is refused must learn which
          right is missing.
        children:
          - ReviewCenter-ProjectsPage-CreateAccess
        tests:
          - NewProjectPage_CreateForm_MemberWhoIsNoSystemAdmin_IsRefusedAndCreatesNothing

      - id: ReviewCenter-Web-ProjectAccess-CreateProjectsNothing
        title: >-
          The Web subsystem shall create no project from the form of a user who is no system administrator.
        justification: |
          A refused form must not leave a project behind that the user had no right to create.
        children:
          - ReviewCenter-ProjectsPage-CreateAccess-NothingCreated
        tests:
          - NewProjectPage_CreateForm_MemberWhoIsNoSystemAdmin_IsRefusedAndCreatesNothing

      - id: ReviewCenter-Web-ProjectAccess-MemberAccess
        title: >-
          The Web subsystem shall let only whoever administers a project, a system administrator or a project admin of
          it, list its members with their roles on the project page.
        justification: |
          Who may work on a project is decided by the people who answer for it, and nobody else.
        children:
          - ReviewCenter-ProjectPage-Members
          - ReviewCenter-ProjectPage-Members-Empty
        tests:
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions

      - id: ReviewCenter-Web-ProjectAccess-MemberChange
        title: >-
          The Web subsystem shall let whoever administers a project change the role of a member with the role button
          of the members list.
        justification: |
          The role decides what a member may do, so the administrator changes it where the member is listed.
        children:
          - ReviewCenter-ProjectPage-Members-RoleButton
          - ReviewCenter-ProjectPage-MemberChange
          - ReviewCenter-ProjectPage-MemberChange-Outcome
        tests:
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership

      - id: ReviewCenter-Web-ProjectAccess-MemberRemoval
        title: >-
          The Web subsystem shall let whoever administers a project remove a member with the Remove button of the
          members list.
        justification: |
          A person who leaves the work must lose the access, and the administrator ends the membership where it is
          listed.
        children:
          - ReviewCenter-ProjectPage-Members-RemoveButton
          - ReviewCenter-ProjectPage-MemberChange-Remove
          - ReviewCenter-ProjectPage-MemberChange-Outcome
          - ReviewCenter-ProjectPage-MemberChange-SelfRemoval
        tests:
          - ProjectPage_MemberActions_ToggleRoleAndRemove_ChangeTheMembership

      - id: ReviewCenter-Web-ProjectAccess-MemberChangeLastAdmin
        title: >-
          The Web subsystem shall refuse to let the last project admin remove or demote the own membership and show
          the explanation.
        justification: |
          A project without an administrator could not be managed any more, so the last administrator keeps the
          membership.
        children:
          - ReviewCenter-ProjectPage-MemberChange-LastAdmin

      - id: ReviewCenter-Web-ProjectAccess-MembersHidden
        title: >-
          The Web subsystem shall show no Members section and no + Add member button to a user who does not administer
          the project.
        justification: |
          A plain member or an auditor works on the reviews and does not manage the team, so the page offers nothing
          of that.
        children:
          - ReviewCenter-ProjectPage-Members-Hidden
          - ReviewCenter-ProjectPage-Members-AddButtonHidden
        tests:
          - ProjectPage_Render_Member_SeesReviewsButNoMembersSection

      - id: ReviewCenter-Web-ProjectAccess-Roles
        title: >-
          The Web subsystem shall give each member of a project the role project admin, auditor, or member.
        justification: |
          The three roles separate who administers a project, who only reads it, and who works in it.
        children:
          - ReviewCenter-ProjectPage-MemberRoles
          - ReviewCenter-ProjectPage-MemberRoles-ExplicitChange
        tests:
          - ProjectPage_MemberRoles_ThreeRoles_AreNamedAndChangedExplicitly
          - ProjectPage_Render_SystemAdmin_ListsMembersWithRolesAndActions

      - id: ReviewCenter-Web-ProjectAccess-RolesAuditor
        title: >-
          The Web subsystem shall offer the auditor role on the page for a new member and on the page for a new
          account and give the member or account that role.
        justification: |
          An auditor is added with the right role from the start, so no one has the write access even for a moment.
        children:
          - ReviewCenter-ProjectPage-MemberRoles-AddPageAuditor
          - ReviewCenter-ProjectPage-MemberRoles-AccountPageAuditor

      - id: ReviewCenter-Web-ProjectAccess-RolesCombination
        title: >-
          The Web subsystem shall refuse on the page for a new member and on the page for a new account to combine the
          project admin role and the auditor role.
        justification: |
          A project admin manages and an auditor only reads, so one person cannot hold both roles.
        children:
          - ReviewCenter-ProjectPage-MemberRoles-AddPageCombination
          - ReviewCenter-ProjectPage-MemberRoles-AccountPageCombination

      - id: ReviewCenter-Web-ProjectAccess-RolesOpenWork
        title: >-
          The Web subsystem shall refuse to change the role of a member who holds an unsigned review slot and name the
          reason.
        justification: |
          Taking the write access from a member who still owes a signature would leave the slot without a reviewer.
        children:
          - ReviewCenter-ProjectPage-MemberRoles-OpenWork

      - id: ReviewCenter-Web-ProjectAccess-RolesLastAdmin
        title: >-
          The Web subsystem shall refuse to make the last project admin an auditor and leave the role unchanged.
        justification: |
          An auditor cannot manage the project, so the last administrator must keep the role.
        children:
          - ReviewCenter-ProjectPage-MemberRoles-LastAdmin

      - id: ReviewCenter-Web-ProjectAccess-RolesOwnRole
        title: >-
          The Web subsystem shall show a project admin who made the own role member the + New review button and no
          members card.
        justification: |
          A project admin who steps down to member must see at once the page of a member, with the write access that
          the role keeps and without the team management that it loses.
        children:
          - ReviewCenter-ProjectPage-MemberRoles-OwnRole

      - id: ReviewCenter-Web-ProjectAccess-AuditorReadOnly
        title: >-
          The Web subsystem shall show an auditor of a project its pages without any control that changes something.
        justification: |
          An auditor reads the review record and must not be able to alter it, so the pages say that they are
          read-only and offer no control that writes.
        children:
          - ReviewCenter-ReviewPage-ReadOnly
          - ReviewCenter-ReviewPage-ReadOnly-SlotForms
          - ReviewCenter-ReviewPage-ReadOnly-ThreadForms
          - ReviewCenter-ReviewPage-ReadOnly-SigningForm
          - ReviewCenter-ReviewPage-ReadOnly-LineControls
          - ReviewCenter-ReviewPage-ReadOnly-HeadLineControls
          - ReviewCenter-ReviewPage-ReadOnly-NoComposer
          - ReviewCenter-ChecklistPage-ReadOnly-Controls
        tests:
          - ReviewPage_Render_Auditor_ShowsReadOnlyNoticeAndNoWriteControls
          - ChecklistPage_Render_Auditor_ShowsReadOnlyNoticeAndDisablesEveryControl
          - NewReviewPageAndPlanPage_Render_Auditor_ShowReadOnlyNoticeInsteadOfTheForm
          - ReviewPage_Render_AuditorWithFileSelected_ShowsThreadsWithoutWriteControls

      - id: ReviewCenter-Web-ProjectAccess-AuditorNotice
        title: >-
          The Web subsystem shall show a member whose role is auditor a notice that the access is read-only on the
          review, the checklist, and the plan page.
        justification: |
          An auditor who finds the controls missing must be told that this is the role and not a fault.
        children:
          - ReviewCenter-ReviewPage-ReadOnly-Notice
          - ReviewCenter-ReviewPage-ReadOnly-Hint
          - ReviewCenter-ChecklistPage-ReadOnly
          - ReviewCenter-PlanPage-ReadOnly
        tests:
          - ChecklistPage_Render_Auditor_ShowsReadOnlyNoticeAndDisablesEveryControl
          - NewReviewPageAndPlanPage_Render_Auditor_ShowReadOnlyNoticeInsteadOfTheForm

      - id: ReviewCenter-Web-ProjectAccess-AuditorRoleChange
        title: >-
          The Web subsystem shall drop the comment composer of the Diff view of an open page when the role of the user
          changes to auditor.
        justification: |
          A page that stays open while the role is taken away must not keep a form that the new role of the user may
          not use.
        children:
          - ReviewCenter-ReviewPage-ReadOnly-RoleChange

      - id: ReviewCenter-Web-ProjectAccess-AuditorRoleChangeDraft
        title: >-
          The Web subsystem shall discard the typed comment draft of an open page when the role of the user changes to
          auditor.
        justification: |
          A draft that was typed with the old role must not be submitted after the role was taken away.
        children:
          - ReviewCenter-ReviewPage-ReadOnly-RoleChangeDraft

      - id: ReviewCenter-Web-ProjectAccess-AuditorNoRepositoryRead
        title: >-
          The Web subsystem shall not read the repositories of the project for a member whose role is auditor.
        justification: |
          Reading a repository is part of planning a review, which an auditor may not do, and the read would cost
          time and open a connection for nothing.
        children:
          - ReviewCenter-PlanPage-ReadOnly-NoRepositoryRead

      - id: ReviewCenter-Web-ProjectAccess-AddMember
        title: >-
          The Web subsystem shall let whoever administers a project add a member by the exact user name.
        justification: |
          A list of all users would reveal who has an account, so a member is added only by a name that the
          administrator already knows.
        children:
          - ReviewCenter-ProjectPage-AddMember
          - ReviewCenter-ProjectPage-AddMember-CancelButton
          - ReviewCenter-ProjectPage-AddMember-AccountButton
          - ReviewCenter-ProjectPage-AddMember-AddsUser
          - ReviewCenter-ProjectPage-AddMember-ReturnsToProject
          - ReviewCenter-ProjectPage-Members-AddButton
        tests:
          - NewMemberPage_Submit_ExistingUser_AddsWithRoleAndReturnsToTheProject

      - id: ReviewCenter-Web-ProjectAccess-AddMemberNoUserList
        title: >-
          The Web subsystem shall show no list of the users of the system on the page of a project and on the page for
          a new member.
        justification: |
          Whoever may add a member must not be able to browse the accounts of other projects, which a list of all
          users would allow.
        children:
          - ReviewCenter-ProjectPage-AddMember-NoUserList
          - ReviewCenter-ProjectPage-Members-NoUserList

      - id: ReviewCenter-Web-ProjectAccess-AddMemberUnusableName
        title: >-
          The Web subsystem shall show one message for a name that does not exist and for the name of a disabled user,
          and add nobody.
        justification: |
          A single message gives nobody a way to find out which accounts exist, and the kept name lets the
          administrator correct the typing error.
        children:
          - ReviewCenter-ProjectPage-AddMember-UnusableName

      - id: ReviewCenter-Web-ProjectAccess-AddMemberUnusableName-NameKept
        title: >-
          The Web subsystem shall keep the typed name in the field after the user could not be added.
        justification: |
          The kept name lets the administrator correct the typing error.
        children:
          - ReviewCenter-ProjectPage-AddMember-NameKept

      - id: ReviewCenter-Web-ProjectAccess-AddMemberAlreadyMember
        title: >-
          The Web subsystem shall show a message for a user who already is a member and leave the role of the member
          unchanged.
        justification: |
          Adding a member a second time must not silently change the role that the member has.
        children:
          - ReviewCenter-ProjectPage-AddMember-AlreadyMember

      - id: ReviewCenter-Web-ProjectAccess-AddMemberNotFound
        title: >-
          The Web subsystem shall show on the page for a new member the not-found message and no form to a user who
          does not administer the project.
        justification: |
          A user who may not add members must not learn that the form of the project exists.
        children:
          - ReviewCenter-ProjectPage-AddMember-NotFound

      - id: ReviewCenter-Web-ProjectAccess-AddMemberOtherProject
        title: >-
          The Web subsystem shall drop the typed name and the old project when the page for a new member is reused for
          another project.
        justification: |
          The page is reused when the user moves between projects, and a name typed for one project must not be added
          to another.
        children:
          - ReviewCenter-ProjectPage-AddMember-OtherProject

      - id: ReviewCenter-Web-ProjectAccess-CreateAccount
        title: >-
          The Web subsystem shall let whoever administers a project add a member as a new account together with its
          membership.
        justification: |
          A project admin who brings in a person without an account would otherwise need a system administrator.
        children:
          - ReviewCenter-ProjectPage-CreateAccount
          - ReviewCenter-ProjectPage-CreateAccount-BackButton
          - ReviewCenter-ProjectPage-CreateAccount-CreatesAccount
        tests:
          - NewMemberAccountPage_Submit_ValidNames_CreatesAccountShowsPasswordOnceAndDoneHidesIt

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountPassword
        title: >-
          The Web subsystem shall show the generated temporary password once with the user name.
        justification: |
          The password is the only way for the new user to sign in, and it must not stay on the screen or be stored in
          the page for later.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-TempPassword

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountPassword-Copy
        title: >-
          The Web subsystem shall hand the temporary password to the clipboard of the browser when the Copy button is
          used, and say "Copied.".
        justification: |
          Copying avoids a typing error when the password is passed to the new user.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-CopyButton

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountPassword-DoneHides
        title: >-
          The Web subsystem shall hide the temporary password when the Done button is used.
        justification: |
          The password must not stay on the screen after the administrator is done with it.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-DoneHides

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountPassword-DoneReturns
        title: >-
          The Web subsystem shall show the project page when the Done button is used after the temporary password was
          shown.
        justification: |
          The administrator needs a way back to the project once the password has been passed on.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-DoneReturns

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountCopyFailure
        title: >-
          The Web subsystem shall say that the password could not be copied and ask the user to copy it by hand when
          the browser does not copy it.
        justification: |
          A password that was not copied and is shown only once would otherwise be lost without a hint.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-CopyFailure

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountUnusableName
        title: >-
          The Web subsystem shall show a message next to the form and create nothing for a user name that is taken or
          invalid.
        justification: |
          The administrator must learn why the account was not made, and a half-made account must not remain.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-UnusableName

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountNotFound
        title: >-
          The Web subsystem shall show on the page for a new account the not-found message and no form to a user who
          does not administer the project.
        justification: |
          A user who may not create accounts must not learn that the form of the project exists.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-NotFound

      - id: ReviewCenter-Web-ProjectAccess-CreateAccountOtherProject
        title: >-
          The Web subsystem shall drop the typed names and the password when the page for a new account is reused for
          another project.
        justification: |
          The page is reused when the user moves between projects, and a password shown for one account must not
          appear on the page of another project.
        children:
          - ReviewCenter-ProjectPage-CreateAccount-OtherProject

      - id: ReviewCenter-Web-ProjectAccess-RepositoriesAccess
        title: >-
          The Web subsystem shall let only whoever manages a project, a system administrator or a project admin of it,
          open its repositories page.
        justification: |
          A repository controls what source code the server reads, so only the people who manage the project may
          reach its page.
        children:
          - ReviewCenter-RepositoriesPage-Admin
        tests:
          - RepositoriesPage_Render_MemberOrNonMember_ShowsNotFoundOnly
          - SignIn_RepositoriesPage_NonMemberAndSystemAdmin_OnlyAdminIsServed

      - id: ReviewCenter-Web-ProjectAccess-RepositoriesNotFound
        title: >-
          The Web subsystem shall show a plain member and a user who is no member only the not-found message on the
          repositories page of a project.
        justification: |
          A user who may not manage the repositories must not learn that the project has any, so the answer is the
          same as for a project that does not exist.
        children:
          - ReviewCenter-RepositoriesPage-Admin-NotFound
        tests:
          - RepositoriesPage_Render_MemberOrNonMember_ShowsNotFoundOnly

      - id: ReviewCenter-Web-ProjectAccess-ReviewRepositories
        title: >-
          The Web subsystem shall offer in a new review only the repositories of that project.
        justification: |
          A review must not read the source code of a repository that belongs to another project.
        children:
          - ReviewCenter-ProjectPage-RepositoryForm-ThisProjectOnly
        tests:
          - NewReviewPage_RepositorySelect_OffersOnlyRepositoriesOfThisProject

      - id: ReviewCenter-Web-ProjectAccess-ViewRecheck
        title: >-
          The Web subsystem shall check the view access of the project again at the start of every action of a project
          page.
        justification: |
          A page that stays open does not load again, so a user whose membership was removed would otherwise keep
          reading through it.
        children:
          - ReviewCenter-ReviewPage-Access-SelectFile
          - ReviewCenter-ReviewPage-Access-SelectThread
          - ReviewCenter-ReviewPage-Access-FilterIndex
          - ReviewCenter-ReviewPage-Access-Reply
          - ReviewCenter-ReviewPage-Access-RevealRun
          - ReviewCenter-ChecklistPage-Access-Answer
          - ReviewCenter-ChecklistPage-Access-Section
          - ReviewCenter-PlanPage-Access-RevokedPlan
          - ReviewCenter-PlanPage-Access-RevokedCreate
        tests:
          - ProjectViewGuard_GuardView_Member_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardView_MembershipRemovedBetweenChecks_SecondCheckReturnsFalse

      - id: ReviewCenter-Web-ProjectAccess-ViewRecheckNothingStored
        title: >-
          The Web subsystem shall store nothing at an action of a project page when the user has lost the view access.
        justification: |
          An action that is refused must leave no reply, thread, answer, or review behind that a user without the
          access would have written.
        children:
          - ReviewCenter-ReviewPage-Access-ReplyNothingStored
          - ReviewCenter-ReviewPage-Access-NewThread
          - ReviewCenter-ChecklistPage-Access-NotStored
          - ReviewCenter-PlanPage-Access-RevokedCreateNothing

      - id: ReviewCenter-Web-ProjectAccess-ViewLost
        title: >-
          The Web subsystem shall show a user who has lost the view access the page of a project that does not exist
          and none of the data the page had loaded.
        justification: |
          The user must learn nothing of the project after the membership ended, neither that it exists nor what the
          page had loaded.
        children:
          - ReviewCenter-ReviewPage-Access
          - ReviewCenter-ReviewPage-Access-NoData
          - ReviewCenter-ChecklistPage-Access
          - ReviewCenter-ChecklistPage-Access-NoData
          - ReviewCenter-PlanPage-Access
          - ReviewCenter-PlanPage-Access-NothingShown
          - ReviewCenter-PlanPage-Access-RevokedPlanNoRead
          - ReviewCenter-HistoryPage-Access
          - ReviewCenter-HistoryPage-Access-Hidden
          - ReviewCenter-HistoryPage-Access-SignedOut
          - ReviewCenter-HistoryPage-Access-Revoked
          - ReviewCenter-ProjectPage-MemberChange-NotFound
        tests:
          - ProjectViewGuard_GuardView_NonMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardView_NobodySignedIn_ReturnsFalseAndCallsBackOnce
          - ReviewPage_SelectFile_MembershipRevoked_ShowsNotFoundAndNoData
          - ChecklistPage_Choose_MembershipRevoked_ShowsNotFoundAndNoData
          - HistoryPage_Reparameterize_MembershipRevoked_ShowsNotFoundAndNoEntries
          - PlanPage_ShowPlan_MembershipRevoked_ShowsNotFoundAndNoPlan
          - NewReviewPage_CreateForm_MembershipRevoked_ShowsNotFoundAndCreatesNothing

      - id: ReviewCenter-Web-ProjectAccess-AdministerRecheck
        title: >-
          The Web subsystem shall check the administer right of the project again at the start of every action of the
          repositories page and of the pages that change the members of a project.
        justification: |
          A page that stays open does not load again, so a user who was demoted would otherwise keep managing the
          project through it.
        children:
          - ReviewCenter-RepositoriesPage-Admin-RightLost
          - ReviewCenter-RepositoriesPage-Admin-SignedOut
          - ReviewCenter-ProjectPage-MemberChange-NoRight
          - ReviewCenter-ProjectPage-AddMember-RightLost
          - ReviewCenter-ProjectPage-CreateAccount-RightLost
        tests:
          - ProjectViewGuard_GuardAdminister_ProjectAdmin_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardAdminister_PlainMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardAdminister_AdminDemotedBetweenChecks_SecondCheckReturnsFalse
          - ProjectViewGuard_GuardAdminister_NobodySignedIn_ReturnsFalseAndCallsBackOnce

      - id: ReviewCenter-Web-ProjectAccess-AdministerLost
        title: >-
          The Web subsystem shall show a user who has lost the administer right no repository or member data that the
          page had loaded.
        justification: |
          A user who was demoted must not keep reading the repositories, locations, and members of the project.
        children:
          - ReviewCenter-RepositoriesPage-Admin-NothingChanged
          - ReviewCenter-RepositoriesPage-Admin-DropData
          - ReviewCenter-RepositoriesPage-Admin-DropEditState
          - ReviewCenter-RepositoriesPage-Admin-FailedReload
          - ReviewCenter-RepositoriesPage-Admin-Revalidated
          - ReviewCenter-ProjectPage-MemberChange-DropMembers
          - ReviewCenter-ProjectPage-CreateAccount-PasswordDropped

      - id: ReviewCenter-Web-ProjectAccess-SystemAdminRecheck
        title: >-
          The Web subsystem shall check the system administrator right again at the start of every action of the
          users page.
        justification: |
          A page that stays open does not load again, so a user who was demoted would otherwise keep managing users
          through it.
        children:
          - ReviewCenter-UsersPage-AdminCheck
        tests:
          - ProjectViewGuard_GuardSystemAdmin_SystemAdmin_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardSystemAdmin_DemotedOrDisabled_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardSystemAdmin_NobodySignedIn_ReturnsFalseAndCallsBackOnce

      - id: ReviewCenter-Web-ProjectAccess-SystemAdminLost
        title: >-
          The Web subsystem shall show a user who has lost the system administrator right no user data that the page
          had loaded.
        justification: |
          A user who was demoted must not keep reading the user list that the page had loaded.
        children:
          - ReviewCenter-UsersPage-AdminCheck-StopRendering

      - id: ReviewCenter-Web-ProjectAccess-ContributeRecheck
        title: >-
          The Web subsystem shall let a page check again, at the start of an action, that the user may still work in
          the project.
        justification: |
          A page that stays open does not load again, so a user whose right to work was removed would otherwise keep
          working through it.
        tests:
          - ProjectViewGuard_GuardContribute_Member_ReturnsTrueWithoutCallback

      - id: ReviewCenter-Web-ProjectAccess-ContributeReadOnly
        title: >-
          The Web subsystem shall refuse a user who can see the project but may only read it the right to work
          without reporting the project as lost to the page.
        justification: |
          The page keeps what it loaded and can say that the access is read-only.
        tests:
          - ProjectViewGuard_GuardContribute_Auditor_ReturnsFalseWithoutCallback

      - id: ReviewCenter-Web-ProjectAccess-ContributeLost
        title: >-
          The Web subsystem shall report the project as lost to a page once when the user can no longer see the
          project.
        justification: |
          The user must learn nothing of a project after the membership ended.
        tests:
          - ProjectViewGuard_GuardContribute_NonMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardContribute_NobodySignedIn_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardContribute_RevokedBetweenLookups_IsLostNotReadOnly

      - id: ReviewCenter-Web-ProjectAccess-ContributeConsistent
        title: >-
          The Web subsystem shall give a page the answer of one lookup when the access of the user is removed while
          the page checks the right to work.
        justification: |
          One check must give one decision; the next guard catches the removal.
        tests:
          - ProjectViewGuard_GuardContribute_MemberRevokedAfterFirstLookup_FollowsTheFirstAnswer

      - id: ReviewCenter-Web-ProjectAccess-AuditRecheck
        title: >-
          The Web subsystem shall let the audit page check again, at the start of an action, that the user may still
          read the audit trail of the project.
        justification: |
          A page that stays open does not load again, so a user whose right to read the audit trail was removed
          would otherwise keep reading it through the page.
        tests:
          - ProjectViewGuard_GuardAudit_AuditorAndProjectAdmin_ReturnTrueWithoutCallback

      - id: ReviewCenter-Web-ProjectAccess-AuditLost
        title: >-
          The Web subsystem shall report the project as lost to the audit page once when the user may not read the
          audit trail.
        justification: |
          The user must not keep reading the trail after losing the right.
        tests:
          - ProjectViewGuard_GuardAudit_PlainMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardAudit_NobodySignedIn_ReturnsFalseAndCallsBackOnce

      - id: ReviewCenter-Web-Reviews
        title: >-
          The Web subsystem shall let a user create a review of selected files on a page of its own.
        justification: |
          Creating a review from files, and seeing the fingerprint and the exact content again, is the first review
          capability of the product. Creating a review (form and upload) needs a live connection and is verified by
          the component tests of the page units.
        children:
          - ReviewCenter-ProjectPage-Selection
          - ReviewCenter-ProjectPage-Selection-Replacement
          - ReviewCenter-ProjectPage-Create
          - ReviewCenter-ProjectPage-Create-ShowsReview
          - ReviewCenter-App-FormRoutes

      - id: ReviewCenter-Web-Reviews-OtherProject
        title: >-
          The Web subsystem shall show the other project when the page for a new review is reused for another project.
        justification: |
          The page is reused when the user moves between projects, and a page that kept showing the first project would
          send the work of the user to the wrong place.
        children:
          - ReviewCenter-ProjectPage-Selection-OtherProject

      - id: ReviewCenter-Web-Reviews-OtherProjectReset
        title: >-
          The Web subsystem shall discard the previous form values and the file selection when the page for a new
          review is reused for another project.
        justification: |
          Files chosen for one project must not be submitted to another.
        children:
          - ReviewCenter-ProjectPage-Selection-OtherProjectReset

      - id: ReviewCenter-Web-Reviews-ProjectLink
        title: >-
          The Web subsystem shall offer the page for a new review from the project page.
        justification: |
          A user who looks at the reviews of a project must find the way to add one without knowing an address.
        children:
          - ReviewCenter-ProjectPage-NewReview

      - id: ReviewCenter-Web-Reviews-UploadLimits
        title: >-
          The Web subsystem shall keep the files of a new review within the upload limits.
        justification: |
          Showing the user the reason for a refusal makes the upload limits usable, and the limits protect the
          server from a review too large to store.
        children:
          - ReviewCenter-ProjectPage-Limits
          - ReviewCenter-ProjectPage-Limits-FileSize
          - ReviewCenter-ProjectPage-Limits-TotalSize
          - ReviewCenter-ProjectPage-Limits-ReceivedBytes
          - ReviewCenter-ProjectPage-Limits-BeforeReading
          - ReviewCenter-ProjectPage-Limits-NoSelectionKept
          - ReviewCenter-ProjectPage-Limits-NothingCreated

      - id: ReviewCenter-Web-Reviews-ReservedId
        title: >-
          The Web subsystem shall refuse the review identifier "new", in any letter case, with a message that it is
          reserved.
        justification: |
          The address of the page for a new review would otherwise be the address of a review of that name.
        children:
          - ReviewCenter-ProjectPage-ReservedId

      - id: ReviewCenter-Web-Reviews-FormError
        title: >-
          The Web subsystem shall show the reason on its page for a new review when a review cannot be created from
          the form because of the files or the identifier.
        justification: |
          A user whose form is refused must learn what to correct: the files, or the identifier of the review.
        children:
          - ReviewCenter-ProjectPage-Error
          - ReviewCenter-ProjectPage-Error-NoFiles
          - ReviewCenter-ProjectPage-Error-DuplicateId
          - ReviewCenter-ProjectPage-Error-DuplicateFileNames

      - id: ReviewCenter-Web-Reviews-FormNotFound
        title: >-
          The Web subsystem shall show the page of a project that does not exist when the sign-in state of the user
          ended or the access was lost while the form is open.
        justification: |
          A user who is no longer allowed to create reviews must learn nothing of the project, not even its name.
        children:
          - ReviewCenter-ProjectPage-Error-SessionEnded
          - ReviewCenter-ProjectPage-Error-AccessLost

      - id: ReviewCenter-Web-Reviews-NothingCreated
        title: >-
          The Web subsystem shall leave the reviews of the project unchanged when the form is refused or the page of a
          project that does not exist is shown.
        justification: |
          A refused form must not leave a half-made review behind that the team would then have to find and remove.
        children:
          - ReviewCenter-ProjectPage-Error-NothingCreated
          - ReviewCenter-ProjectPage-ReservedId-NothingCreated

      - id: ReviewCenter-Web-Reviews-Page
        title: >-
          The Web subsystem shall serve a page for each review at /projects/{project}/reviews/{review}.
        justification: |
          A review is the unit of work of the product, and a plain address lets the team share and bookmark it.
        children:
          - ReviewCenter-ReviewPage-Show
          - ReviewCenter-ReviewPage-Show-Title
          - ReviewCenter-ReviewPage-Show-NoState
          - ReviewCenter-ReviewPage-Show-ProjectLink
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-Web-Reviews-NotFound
        title: >-
          The Web subsystem shall show a not-found message when the review does not exist.
        justification: |
          An address of a deleted or mistyped review must lead to a clear answer and not to an empty or broken page.
        children:
          - ReviewCenter-ReviewPage-Show-NotFound

      - id: ReviewCenter-Web-Reviews-OtherReview
        title: >-
          The Web subsystem shall show the new review, with no selected file and no typed thread text, when the page is
          reused for another review.
        justification: |
          The page is reused when the user moves between reviews, and the file or the draft of one review must not
          carry over to another.
        children:
          - ReviewCenter-ReviewPage-Show-OtherReview

      - id: ReviewCenter-Web-Reviews-Summary
        title: >-
          The Web subsystem shall open the review page with a summary of the checklist progress, the reviewers, and
          the threads.
        justification: |
          A reader must see how far the review has got before reading the files.
        children:
          - ReviewCenter-ReviewPage-Summary
          - ReviewCenter-ReviewPage-Summary-Reviewers
          - ReviewCenter-ReviewPage-Summary-SignedCount
          - ReviewCenter-ReviewPage-Summary-OpenThreads
          - ReviewCenter-ReviewPage-Summary-ResolvedThreads
          - ReviewCenter-ReviewPage-Summary-Position
          - ReviewCenter-ReviewPage-ThreadKindIndex-SummaryQuestions
          - ReviewCenter-ReviewPage-ThreadKindIndex-SummaryFindings
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload

      - id: ReviewCenter-Web-Reviews-Files
        title: >-
          The Web subsystem shall show the files of the review and the content of a selected file.
        justification: |
          Reviewers read the files and their content, so the page must list them and show what is selected.
        children:
          - ReviewCenter-ReviewPage-Files
          - ReviewCenter-ReviewPage-Files-ButtonName
          - ReviewCenter-ReviewPage-Files-Highlight
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages

      - id: ReviewCenter-Web-Reviews-FilesLayout
        title: >-
          The Web subsystem shall place the files and the content of the review ahead of the fingerprint and the file
          hashes.
        justification: |
          The content is what a reviewer reads, so it comes first, and the technical identifiers follow.
        children:
          - ReviewCenter-ReviewPage-Layout
          - ReviewCenter-ReviewPage-Layout-Content

      - id: ReviewCenter-Web-Reviews-Content
        title: >-
          The Web subsystem shall show the selected file as numbered lines.
        justification: |
          A reviewer refers to a place in a file by its line number, and the text must be exactly the text that the
          review holds.
        children:
          - ReviewCenter-ReviewPage-Content
          - ReviewCenter-ReviewPage-Content-ExactText
          - ReviewCenter-ReviewPage-Content-PlainText
          - ReviewCenter-ReviewPage-Content-EmptyFile
          - ReviewCenter-ReviewPage-Content-OtherFile

      - id: ReviewCenter-Web-Reviews-NoSelection
        title: >-
          The Web subsystem shall show no file content until a file is selected.
        justification: |
          A page that shows an arbitrary file first would suggest a file that the reviewer has not chosen to read.
        children:
          - ReviewCenter-ReviewPage-Content-NoSelection

      - id: ReviewCenter-Web-Reviews-Binary
        title: >-
          The Web subsystem shall show a notice instead of content for a selected file that is binary, because it
          contains a NUL byte or is not valid UTF-8.
        justification: |
          Binary data cannot be read as lines, and printing it would corrupt the page.
        children:
          - ReviewCenter-ReviewPage-Binary
          - ReviewCenter-ReviewPage-Binary-InvalidUtf8

      - id: ReviewCenter-Web-Reviews-Details
        title: >-
          The Web subsystem shall show the fingerprint and the file hashes in a collapsed Details section.
        justification: |
          The identifiers matter when a record is checked, not when it is read, so they stay out of the way until
          opened.
        children:
          - ReviewCenter-ReviewPage-Show-Fingerprint
          - ReviewCenter-ReviewPage-Files-Hash
          - ReviewCenter-ReviewPage-Layout-Collapsed
        tests:
          - WebSubsystem_CreatedProjectAndReview_ArePresentedByThePages
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-Web-Comments
        title: >-
          The Web subsystem shall let a signed-in user, on the review page, start comment threads on the selected file,
          with the signed-in user as the author.
        justification: |
          Comments are written next to the code on the review page. Starting a thread needs a live connection and is
          verified by the component tests of the page unit.
        children:
          - ReviewCenter-ReviewPage-ThreadStart
          - ReviewCenter-ReviewPage-ThreadStart-Author
          - ReviewCenter-ReviewPage-ThreadStart-NoAuthorField
          - ReviewCenter-ReviewPage-ThreadStart-LineButton
          - ReviewCenter-ReviewPage-ThreadStart-Clear

      - id: ReviewCenter-Web-Comments-StartError
        title: >-
          The Web subsystem shall show an error and store no thread when a thread cannot be started.
        justification: |
          A user whose comment is refused must see why, next to the form.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-Error
          - ReviewCenter-ReviewPage-ThreadComposer-Error

      - id: ReviewCenter-Web-Comments-StartErrorKeepValues
        title: >-
          The Web subsystem shall keep the values typed into the form of a thread that could not be started.
        justification: |
          A user whose comment is refused must not have to type the comment again.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-KeepValues

      - id: ReviewCenter-Web-Comments-Shortcut
        title: >-
          The Web subsystem shall make Ctrl+Enter in a comment field or a reply field press the submit button of that
          form.
        justification: |
          Writers of long comments save time with the keyboard.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-CtrlEnter
          - ReviewCenter-ReviewPage-ThreadStart-ReplyShortcut

      - id: ReviewCenter-Web-Comments-ShortcutHint
        title: >-
          The Web subsystem shall tell the reader next to the submit button of a comment and of a reply that Ctrl+Enter
          submits.
        justification: |
          The hint tells the writers that the shortcut exists.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-ShortcutHint

      - id: ReviewCenter-Web-Comments-BinaryWholeFile
        title: >-
          The Web subsystem shall accept a thread on the whole of a binary file.
        justification: |
          A binary file has no lines, but the reviewer must still be able to comment on the file as a whole.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-BinaryWholeFile

      - id: ReviewCenter-Web-Comments-BinaryRange
        title: >-
          The Web subsystem shall refuse a line range on a binary file with a message that says the file is binary.
        justification: |
          A line range cannot exist in a binary file, and the message tells the reviewer why the range was refused.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-BinaryRange

      - id: ReviewCenter-Web-Comments-SessionEnded
        title: >-
          The Web subsystem shall show the not-found page and store no thread when the session of the user ended before
          the page knew it.
        justification: |
          A user who is signed out must not be able to write a comment, and must not see more than a stranger would.
        children:
          - ReviewCenter-ReviewPage-ThreadStart-SessionEnded

      - id: ReviewCenter-Web-Comments-KindChoice
        title: >-
          The Web subsystem shall offer, wherever a new thread is started, a choice between Question and Finding with
          Question chosen by default.
        justification: |
          A Finding goes into the report and can block a conclusion, so a plain question is the safe default.
        children:
          - ReviewCenter-ReviewPage-ThreadComposer

      - id: ReviewCenter-Web-Comments-KindChoiceFinding
        title: >-
          The Web subsystem shall start the new thread as a Finding when the reader chooses Finding.
        justification: |
          The author chooses the kind that goes into the report deliberately.
        children:
          - ReviewCenter-ReviewPage-ThreadComposer-Finding

      - id: ReviewCenter-Web-Comments-KindChoiceSingleSlot
        title: >-
          The Web subsystem shall offer the choice between Question and Finding also in a review with a single slot.
        justification: |
          A review with a single slot is no reason to hide the kind of a thread.
        children:
          - ReviewCenter-ReviewPage-ThreadComposer-SingleSlot

      - id: ReviewCenter-Web-Comments-KindChoiceCheck
        title: >-
          The Web subsystem shall start a discussion about a check from the status panel as a Finding when the reader
          chooses Finding.
        justification: |
          A discussion about a check can be a Finding as well.
        children:
          - ReviewCenter-ReviewPage-ThreadComposer-Check

      - id: ReviewCenter-Web-Comments-ReplyReport
        title: >-
          The Web subsystem shall offer in the reply box an Add to report check box that includes the reply in the
          report when it is ticked.
        justification: |
          A reply that holds a decision must be able to enter the report.
        children:
          - ReviewCenter-ReviewPage-ThreadComposer-ReplyReport

      - id: ReviewCenter-Web-Comments-ReplyChat
        title: >-
          The Web subsystem shall treat a reply as chat that is not part of the report unless the Add to report check
          box is ticked.
        justification: |
          A reply that only discusses must stay out of the report.
        children:
          - ReviewCenter-ReviewPage-ThreadComposer-ReplyChat

      - id: ReviewCenter-Web-Comments-KindBadge
        title: >-
          The Web subsystem shall show the kind of a thread, Question or Finding, with its own icon and visible word.
        justification: |
          A reader must tell a Question from a Finding at a glance.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds
          - ReviewCenter-ReviewPage-ThreadKinds-Finding
          - ReviewCenter-ReviewPage-ThreadKinds-DistinctIcons

      - id: ReviewCenter-Web-Comments-KindBadgeInReport
        title: >-
          The Web subsystem shall show an In report badge on a Finding and mark the starting comment of a Finding with
          an In report mark.
        justification: |
          A reader must see at a glance which thread goes into the report.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-InReport
          - ReviewCenter-ReviewPage-ThreadActions-InReportMark

      - id: ReviewCenter-Web-Comments-KindBadgeCard
        title: >-
          The Web subsystem shall show the kind badge of a thread in its thread card and in the card of check
          discussions.
        justification: |
          The kind must be visible wherever a thread is read.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-Card
          - ReviewCenter-ReviewPage-ThreadKinds-CheckCard

      - id: ReviewCenter-Web-Comments-KindBadgeNotColorAlone
        title: >-
          The Web subsystem shall give every kind marker a visible word or accessible name and hide its icon from
          assistive technology, so that no kind rests on the icon or the color alone.
        justification: |
          A reader must tell a Question from a Finding without depending on color alone.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-NotColorAlone

      - id: ReviewCenter-Web-Comments-KindBadgeChatBubble
        title: >-
          The Web subsystem shall show the comments of a Question as chat bubbles.
        justification: |
          A thread that is not for the report reads as a conversation.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-ChatBubble

      - id: ReviewCenter-Web-Comments-DiffMarkers
        title: >-
          The Web subsystem shall mark a diff row that has threads with one marker per kind, and show both markers on a
          row that has threads of both kinds.
        justification: |
          A reviewer who scans a diff finds where the discussion is, and what kind it is, without opening every line.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-DiffMarkers
          - ReviewCenter-ReviewPage-ThreadKinds-MixedRow

      - id: ReviewCenter-Web-Comments-DiffMarkersCount
        title: >-
          The Web subsystem shall show the number of threads of its kind on every diff marker.
        justification: |
          A reviewer must see how much discussion a row holds.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-MarkerCount

      - id: ReviewCenter-Web-Comments-DiffMarkersName
        title: >-
          The Web subsystem shall give every diff marker a title and an accessible name such as 2 questions or 1
          finding.
        justification: |
          A marker must be readable without sight of its icon.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-MarkerName

      - id: ReviewCenter-Web-Comments-DiffMarkersNone
        title: >-
          The Web subsystem shall show no marker on a diff row without threads.
        justification: |
          A marker on a quiet row would suggest a discussion that does not exist.
        children:
          - ReviewCenter-ReviewPage-ThreadKinds-NoMarker

      - id: ReviewCenter-Web-Comments-Reply
        title: >-
          The Web subsystem shall let a signed-in user reply to a comment thread.
        justification: |
          A discussion is a sequence of answers, so a thread must accept replies.
        children:
          - ReviewCenter-ReviewPage-ThreadUpdate
          - ReviewCenter-ReviewPage-ThreadUpdate-Author
          - ReviewCenter-ReviewPage-ThreadUpdate-NoAuthorField

      - id: ReviewCenter-Web-Comments-ReplyError
        title: >-
          The Web subsystem shall show a violated rule of a reply, such as a blank text, as a message inside that
          thread.
        justification: |
          A user whose reply is refused must see why, next to the reply, and not on another part of the page.
        children:
          - ReviewCenter-ReviewPage-ThreadUpdate-Error

      - id: ReviewCenter-Web-Comments-KindButtons
        title: >-
          The Web subsystem shall show the buttons that change the kind of a thread or add a reply to the report only
          to a person who may use them.
        justification: |
          The kind of a thread and the content of the report are decisions of the reviewers, so the buttons are
          offered to them alone.
        children:
          - ReviewCenter-ReviewPage-ThreadActions
          - ReviewCenter-ReviewPage-ThreadActions-Demote
          - ReviewCenter-ReviewPage-ThreadActions-ReportToggle
          - ReviewCenter-ReviewPage-ThreadActions-ReplyReport

      - id: ReviewCenter-Web-Comments-Auditor
        title: >-
          The Web subsystem shall show an auditor the kind of every thread but no action on a thread.
        justification: |
          An auditor reads the discussion and must not change it.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-Auditor

      - id: ReviewCenter-Web-Comments-Resolve
        title: >-
          The Web subsystem shall let a signed-in user resolve a comment thread.
        justification: |
          A thread that is settled must be marked so that the open ones stand out.
        children:
          - ReviewCenter-ReviewPage-ThreadUpdate-Resolve
          - ReviewCenter-ReviewPage-ThreadActions-NoteQuestion

      - id: ReviewCenter-Web-Comments-ResolveFinding
        title: >-
          The Web subsystem shall ask for a resolution note when a Finding is resolved and refuse a blank note with a
          message.
        justification: |
          A Finding goes into the report, so closing it needs a note that says how it was settled, and a cancelled
          dialog must not resolve it.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-NoteFinding

      - id: ReviewCenter-Web-Comments-ResolveFinding-Cancel
        title: >-
          The Web subsystem shall hand over no note and tell the card when the person cancels the resolution note.
        justification: |
          A canceled dialog must not resolve the Finding.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-NoteCancel

      - id: ReviewCenter-Web-Comments-SignatureWarning
        title: >-
          The Web subsystem shall ask for a confirmation that names the signers whose signatures a change of a thread
          makes stale before that change is made.
        justification: |
          A change of a thread alters the record, so the signers whose signatures go out of date must be named before
          they are lost, and the typed note must survive the question.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-SignatureWarning

      - id: ReviewCenter-Web-Comments-SignatureWarning-KeepNote
        title: >-
          The Web subsystem shall keep the typed resolution note while the confirmation is canceled and store it when
          the change is confirmed.
        justification: |
          A note that was typed with care must survive the question about the signatures.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-KeepNote

      - id: ReviewCenter-Web-Comments-WarningCancelled
        title: >-
          The Web subsystem shall store nothing when the person cancels that confirmation.
        justification: |
          Cancelling the question must leave the thread and the signatures exactly as they were.
        children:
          - ReviewCenter-ReviewPage-ThreadActions-CancelStoresNothing

      - id: ReviewCenter-Web-Comments-Reopen
        title: >-
          The Web subsystem shall let a signed-in user reopen a resolved comment thread.
        justification: |
          A thread resolved too early must be able to come back.
        children:
          - ReviewCenter-ReviewPage-ThreadUpdate-Reopen

      - id: ReviewCenter-Web-Comments-NextStep
        title: >-
          The Web subsystem shall show the next step on the review page.
        justification: |
          A reviewer should be told what to do next instead of having to work it out from the cards.
        children:
          - ReviewCenter-ReviewPage-NextStep
          - ReviewCenter-ReviewPage-NextStep-Threads
          - ReviewCenter-ReviewPage-NextStep-Checklist
          - ReviewCenter-ReviewPage-NextStep-Ready
          - ReviewCenter-ReviewPage-NextStep-Approved
          - ReviewCenter-ReviewPage-NextStep-Current
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-Web-Comments-NextStepMasked
        title: >-
          The Web subsystem shall not repeat in the next-step sentence of a viewer who may not see the answers of the
          others the notice that the answers stay hidden.
        justification: |
          The notice of hidden answers is already on the page, and a second mention in the sentence would only add
          noise.
        children:
          - ReviewCenter-ReviewPage-NextStep-HiddenNotice

      - id: ReviewCenter-Web-Comments-Index
        title: >-
          The Web subsystem shall show an index of the threads of all files on the review page.
        justification: |
          A reviewer must find every discussion of the review without opening each file.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex
          - ReviewCenter-ReviewPage-ThreadIndex-AnchorWording
          - ReviewCenter-ReviewPage-ThreadIndex-Filters
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-Web-Comments-IndexDefaultFilter
        title: >-
          The Web subsystem shall choose the filter of the index of threads first by the state of the review: Open, or
          All when the review has only resolved threads or is concluded.
        justification: |
          A reader who opens a review wants the open discussions first, but an empty list of open threads would hide
          the threads that exist.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex-DefaultOpen
          - ReviewCenter-ReviewPage-ThreadIndex-DefaultAllResolved
          - ReviewCenter-ReviewPage-ThreadIndex-DefaultAllConcluded

      - id: ReviewCenter-Web-Comments-IndexSelect
        title: >-
          The Web subsystem shall select the file of a thread when the reader chooses the thread in the index.
        justification: |
          The reader who picks a discussion in the index wants to see its file, not to look for it.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex-SelectFile

      - id: ReviewCenter-Web-Comments-IndexSelectHighlight
        title: >-
          The Web subsystem shall highlight the anchored lines of the chosen thread on the side, baseline or head, that
          the thread belongs to.
        justification: |
          The reader must see which lines the discussion is about.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex-Highlight

      - id: ReviewCenter-Web-Comments-IndexSelectScroll
        title: >-
          The Web subsystem shall scroll to the first anchored line of the thread that the reader chose in the index.
        justification: |
          The anchored lines may lie far down in a long file.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex-Scroll

      - id: ReviewCenter-Web-Comments-IndexSelectDiffView
        title: >-
          The Web subsystem shall show the thread that the reader chose in the index in the Diff view, at its row, when
          the file has a diff.
        justification: |
          A file with a diff is read in the Diff view, so the thread must appear at its row.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex-DiffView

      - id: ReviewCenter-Web-Comments-IndexNoDiff
        title: >-
          The Web subsystem shall open the version of the file that the chosen thread belongs to when the file has no
          diff because it is too large to compare.
        justification: |
          A thread of a file that cannot be compared must still lead to the text that it is about.
        children:
          - ReviewCenter-ReviewPage-ThreadIndex-Version

      - id: ReviewCenter-Web-Comments-KindFilter
        title: >-
          The Web subsystem shall let the reader filter the index of threads by kind: Both kinds, Questions or
          Findings.
        justification: |
          A reader who looks for the Findings that decide the conclusion must be able to hide the Questions.
        children:
          - ReviewCenter-ReviewPage-ThreadKindIndex
          - ReviewCenter-ReviewPage-ThreadKindIndex-KindCounts
          - ReviewCenter-ReviewPage-ThreadKindIndex-Combined
          - ReviewCenter-ReviewPage-ThreadKindIndex-StateCounts
          - ReviewCenter-ReviewPage-ThreadKindIndex-Badge

      - id: ReviewCenter-Web-Comments-Threads
        title: >-
          The Web subsystem shall show the threads with their comments on the review page.
        justification: |
          The comments are read next to the file that they are about.
        children:
          - ReviewCenter-ReviewPage-ThreadShow
          - ReviewCenter-ReviewPage-ThreadShow-Order
          - ReviewCenter-ReviewPage-ThreadShow-Markers
          - ReviewCenter-ReviewPage-ThreadShow-PlainText
          - ReviewCenter-ReviewPage-ThreadShow-Empty
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-Web-Comments-CheckThreads
        title: >-
          The Web subsystem shall show a thread about a check in the index of threads with the label Check discussion.
        justification: |
          A discussion about a check belongs to no file, but a reader must still find it from the index.
        children:
          - ReviewCenter-ReviewPage-CheckThreads

      - id: ReviewCenter-Web-Comments-CheckThreadsCard
        title: >-
          The Web subsystem shall show a thread about a check in a card of check discussions with its anchor, state and
          comments.
        justification: |
          A discussion about a check belongs to no file, so it needs a place of its own.
        children:
          - ReviewCenter-ReviewPage-CheckThreads-Card

      - id: ReviewCenter-Web-Comments-CheckThreadsApart
        title: >-
          The Web subsystem shall keep a thread about a check out of the list of threads of the selected file.
        justification: |
          A thread about a check must not be mistaken for a thread about the code of the file.
        children:
          - ReviewCenter-ReviewPage-CheckThreads-Apart

      - id: ReviewCenter-Web-Comments-CheckThreadsPlainText
        title: >-
          The Web subsystem shall show the text of a comment of a thread about a check as plain text.
        justification: |
          Text that a reader typed must not be able to change the page.
        children:
          - ReviewCenter-ReviewPage-CheckThreads-PlainText

      - id: ReviewCenter-Web-Comments-CheckThreadsActions
        title: >-
          The Web subsystem shall let a reader reply to a thread about a check and resolve it like any other thread.
        justification: |
          A discussion about a check must be as workable as any other discussion.
        children:
          - ReviewCenter-ReviewPage-CheckThreads-Reply
          - ReviewCenter-ReviewPage-CheckThreads-Resolve

      - id: ReviewCenter-Web-Comments-CheckThreadsNoForm
        title: >-
          The Web subsystem shall offer no form to start a thread in the card of check discussions.
        justification: |
          The card of check discussions is for reading and answering, not for starting threads.
        children:
          - ReviewCenter-ReviewPage-CheckThreads-NoForm

      - id: ReviewCenter-Web-Comments-CheckThreadOpen
        title: >-
          The Web subsystem shall show a thread about a check from a deep link, or from the index, without selecting a
          file.
        justification: |
          A link to a discussion about a check must work without a file that the check does not have.
        children:
          - ReviewCenter-ReviewPage-CheckThreads-DeepLink
          - ReviewCenter-ReviewPage-CheckThreads-DeepLinkNoFile
          - ReviewCenter-ReviewPage-CheckThreads-NoFile

      - id: ReviewCenter-Web-Comments-ConclusionFindings
        title: >-
          The Web subsystem shall list the findings that are in the report on the conclusion card with the outcome,
          the text and the signers of a concluded review.
        justification: |
          The conclusion is read with the findings that it settled, so they stand next to the outcome and the people
          who signed.
        children:
          - ReviewCenter-ReviewPage-ConclusionFindings
          - ReviewCenter-ReviewPage-ConclusionFindings-Outcome
          - ReviewCenter-ReviewPage-ConclusionFindings-Text
          - ReviewCenter-ReviewPage-ConclusionFindings-Signers
          - ReviewCenter-ReviewPage-ConclusionFindings-NoFindings
          - ReviewCenter-ReviewPage-ConclusionFindings-InProgress
          - ReviewCenter-ReviewPage-ConclusionFindings-Empty

      - id: ReviewCenter-Web-Comments-ConclusionMasked
        title: >-
          The Web subsystem shall show no finding, no outcome, no signer and no empty state on the conclusion card of a
          viewer who may not see the answers of the others.
        justification: |
          Whoever may not see the answers of the others must not be able to read them from the conclusion either.
        children:
          - ReviewCenter-ReviewPage-ConclusionFindings-Masked

      - id: ReviewCenter-Web-Comments-Collapsed
        title: >-
          The Web subsystem shall show resolved threads collapsed on the review page.
        justification: |
          Settled discussions must not crowd out the open ones.
        children:
          - ReviewCenter-ReviewPage-ThreadCollapse
          - ReviewCenter-ReviewPage-ThreadCollapse-Toggle
          - ReviewCenter-ReviewPage-ThreadCollapse-OnResolve

      - id: ReviewCenter-Web-Comments-OpenExpanded
        title: >-
          The Web subsystem shall keep an open thread expanded.
        justification: |
          An open discussion needs the attention of the reader, so it is never folded away.
        children:
          - ReviewCenter-ReviewPage-ThreadCollapse-OpenExpanded

      - id: ReviewCenter-Web-Comments-Counts
        title: >-
          The Web subsystem shall show the number of open and of resolved threads of the review on the filter buttons of
          the thread index.
        justification: |
          The counts tell a reader at a glance how much discussion is left. The subsystem test covers the counts
          served from the database.
        children:
          - ReviewCenter-ReviewPage-ThreadSummary
          - ReviewCenter-ReviewPage-ThreadSummary-Resolved
        tests:
          - WebSubsystem_ReviewWithThreads_ArePresentedByThePage

      - id: ReviewCenter-Web-Comments-CountsFile
        title: >-
          The Web subsystem shall show the number of open threads next to every file in the list of files.
        justification: |
          A reader finds the files that still have open discussion.
        children:
          - ReviewCenter-ReviewPage-ThreadSummary-FileCount

      - id: ReviewCenter-Web-Comments-CountsUpdate
        title: >-
          The Web subsystem shall update the counts of open and of resolved threads when a thread is resolved or
          reopened.
        justification: |
          A count that does not follow the change would mislead the reader.
        children:
          - ReviewCenter-ReviewPage-ThreadUpdate-Counts

      - id: ReviewCenter-Web-Checklist
        title: >-
          The Web subsystem shall show on the review page the progress of the review's checklist with a link to a
          checklist page at /projects/{project}/reviews/{review}/checklist.
        justification: |
          The checklist is worked through on its own page, and the review page shows how far it has got.
        children:
          - ReviewCenter-ReviewPage-Checklist
          - ReviewCenter-ReviewPage-Checklist-Link
          - ReviewCenter-ReviewPage-Checklist-Failed
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload

      - id: ReviewCenter-Web-Checklist-MaskedFailed
        title: >-
          The Web subsystem shall not show the number of failed checks to a viewer who may not see the answers of the
          others.
        justification: |
          The number of failed checks would reveal how the others answered before the viewer's own ballot is in.
        children:
          - ReviewCenter-ReviewPage-Checklist-MaskedFailed

      - id: ReviewCenter-Web-Checklist-None
        title: >-
          The Web subsystem shall show neither the checklist progress nor the link to the checklist page when the
          review has no checklist.
        justification: |
          A progress or a link for a checklist that does not exist would lead nowhere.
        children:
          - ReviewCenter-ReviewPage-Checklist-None

      - id: ReviewCenter-Web-Checklist-Page
        title: >-
          The Web subsystem shall serve the checklist page at /projects/{project}/reviews/{review}/checklist.
        justification: |
          A plain address lets a reviewer return to the checklist and share it.
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload

      - id: ReviewCenter-Web-Checklist-OneSection
        title: >-
          The Web subsystem shall keep one section open at a time on the checklist page.
        justification: |
          One open section keeps the page short and keeps the reader at one place of the checklist.
        children:
          - ReviewCenter-ChecklistPage-Interactive

      - id: ReviewCenter-Web-Checklist-NotFound
        title: >-
          The Web subsystem shall show a not-found message on the checklist page when the review does not exist.
        justification: |
          The address of a deleted or mistyped review must lead to a clear answer.
        children:
          - ReviewCenter-ChecklistPage-Show-NotFound

      - id: ReviewCenter-Web-Checklist-NoChecklist
        title: >-
          The Web subsystem shall show a message that the review has no checklist on the checklist page when it has
          none.
        justification: |
          A reader who follows the address of the checklist of such a review must learn why nothing is listed.
        children:
          - ReviewCenter-ChecklistPage-Show-NoChecklist

      - id: ReviewCenter-Web-Checklist-Remaining
        title: >-
          The Web subsystem shall show a reviewer on the checklist page what is left to do.
        justification: |
          A reviewer who sees what remains can finish the checklist without counting.
        children:
          - ReviewCenter-ChecklistPage-Show
          - ReviewCenter-ChecklistPage-Show-Complete
          - ReviewCenter-ChecklistPage-Show-Progress
          - ReviewCenter-ChecklistPage-Show-NotApplicable
          - ReviewCenter-ChecklistPage-Show-SectionProgress
          - ReviewCenter-ChecklistPage-Show-FirstOpen

      - id: ReviewCenter-Web-Checklist-Answer
        title: >-
          The Web subsystem shall offer a Pass, a Fail and an N/A answer for each check of the checklist.
        justification: |
          An answer is the reviewer's own statement of the check. The subsystem test covers that the answers survive
          a reload; answering needs a live connection.
        children:
          - ReviewCenter-ChecklistPage-Answer
          - ReviewCenter-ChecklistPage-Answer-Label
        tests:
          - WebSubsystem_ChecklistPage_AnsweredChecksSurviveReload

      - id: ReviewCenter-Web-Checklist-AnswerPass
        title: >-
          The Web subsystem shall store a Pass at once when the reviewer presses Pass.
        justification: |
          A Pass needs no further step, so it is stored as soon as it is given.
        children:
          - ReviewCenter-ChecklistPage-Answer-Pass

      - id: ReviewCenter-Web-Checklist-AnswerPassNoJustification
        title: >-
          The Web subsystem shall not ask for a justification when the reviewer answers Pass.
        justification: |
          Only a Fail or an N/A needs a reason, so a Pass must not be held up by a question.
        children:
          - ReviewCenter-ChecklistPage-Answer-PassNoJustification

      - id: ReviewCenter-Web-Checklist-AnswerJustify
        title: >-
          The Web subsystem shall ask for a justification, marked as required, when the reviewer answers Fail or N/A.
        justification: |
          A Fail or an N/A that is not explained cannot be judged by the others, so it is not stored without a reason.
        children:
          - ReviewCenter-ChecklistPage-Answer-Fail
          - ReviewCenter-ChecklistPage-Answer-NotApplicable

      - id: ReviewCenter-Web-Checklist-AnswerJustify-Required
        title: >-
          The Web subsystem shall not store a Fail whose justification is empty.
        justification: |
          A Fail without a reason cannot be judged by the others, so it is not stored.
        children:
          - ReviewCenter-ChecklistPage-Answer-Required

      - id: ReviewCenter-Web-Checklist-AnswerJustify-Save
        title: >-
          The Web subsystem shall store a Fail or an N/A together with its justification when the reviewer saves it.
        justification: |
          The justification is part of the answer and must be kept with it.
        children:
          - ReviewCenter-ChecklistPage-Answer-Save
          - ReviewCenter-ChecklistPage-Answer-SaveNotApplicable

      - id: ReviewCenter-Web-Checklist-AnswerBy
        title: >-
          The Web subsystem shall store each answer in the ballot of the reviewer slot of the signed-in user and record
          the signed-in user as the person who answered.
        justification: |
          An answer is a statement of one person, so it is recorded in the own ballot under the own name.
        children:
          - ReviewCenter-ChecklistPage-Answer-OwnSlot
          - ReviewCenter-ChecklistPage-Answer-User

      - id: ReviewCenter-Web-Checklist-AnswerByShown
        title: >-
          The Web subsystem shall show with an answer the display name of the person who answered and the UTC time of
          the answer.
        justification: |
          A reader judges an answer by who gave it and when.
        children:
          - ReviewCenter-ChecklistPage-Answer-AnsweredBy

      - id: ReviewCenter-Web-Checklist-AnswerByNoNameField
        title: >-
          The Web subsystem shall offer no field for the name of the person who answers.
        justification: |
          An answer must never be recorded under a name that was typed in.
        children:
          - ReviewCenter-ChecklistPage-Answer-NoNameField

      - id: ReviewCenter-Web-Checklist-AnswerViolation
        title: >-
          The Web subsystem shall show the message of a violated rule next to the check that was answered.
        justification: |
          A reviewer whose answer was refused must see at the check itself what rule was broken.
        children:
          - ReviewCenter-ChecklistPage-Answer-Violation

      - id: ReviewCenter-Web-Checklist-Applicability
        title: >-
          The Web subsystem shall let a reviewer mark sections of the checklist as not applicable.
        justification: |
          A section that does not apply to the change must not demand an answer for each of its checks.
        children:
          - ReviewCenter-ChecklistPage-Applicability
          - ReviewCenter-ChecklistPage-Applicability-Save
          - ReviewCenter-ChecklistPage-Applicability-Shown
          - ReviewCenter-ChecklistPage-Applicability-NoChecks
          - ReviewCenter-ChecklistPage-Applicability-Totals
          - ReviewCenter-ChecklistPage-Applicability-Reapply

      - id: ReviewCenter-Web-Checklist-ApplicabilityRefused
        title: >-
          The Web subsystem shall show the message of a violated rule next to the reason field of a section when its
          reason is saved empty.
        justification: |
          A section can only be dropped from the count with a reason, so a missing reason must be refused visibly.
        children:
          - ReviewCenter-ChecklistPage-Applicability-Violation

      - id: ReviewCenter-Web-Checklist-ApplicabilityRefused-Counted
        title: >-
          The Web subsystem shall keep counting a section as applying when its reason is saved empty.
        justification: |
          A section without a reason must not silently leave the count.
        children:
          - ReviewCenter-ChecklistPage-Applicability-Required

      - id: ReviewCenter-Web-Checklist-ApplicabilityPending
        title: >-
          The Web subsystem shall show a section whose switch is off and whose reason is not saved yet in a Reason
          needed state with a hint that nothing is saved until the reason is saved.
        justification: |
          The reader must see that a section that is switched off is not final until its reason is saved.
        children:
          - ReviewCenter-ChecklistPage-Applicability-Pending
          - ReviewCenter-ChecklistPage-Applicability-Hint

      - id: ReviewCenter-Web-Checklist-ApplicabilityPendingNothingStored
        title: >-
          The Web subsystem shall store nothing while the switch of a section is off and the reason is not saved.
        justification: |
          A switch that is turned off before the reason is written down must not change the record by itself.
        children:
          - ReviewCenter-ChecklistPage-Applicability-NothingStored

      - id: ReviewCenter-Web-Checklist-SubmitBallot
        title: >-
          The Web subsystem shall let a reviewer hand in the own ballot.
        justification: |
          Handing in the ballot is the step after which the reviewer sees how the others answered.
        children:
          - ReviewCenter-ChecklistPage-SubmitBallot
          - ReviewCenter-ChecklistPage-SubmitBallot-HandIn
          - ReviewCenter-ChecklistPage-SubmitBallot-Carried

      - id: ReviewCenter-Web-Checklist-BallotStatus
        title: >-
          The Web subsystem shall tell a reviewer in the ballot status line whether the own ballot is not answered, a
          draft that does not count, or submitted and counting.
        justification: |
          A reviewer must know whether the own ballot already counts before relying on it.
        children:
          - ReviewCenter-ChecklistPage-SubmitBallot-NotAnswered
          - ReviewCenter-ChecklistPage-SubmitBallot-Draft
          - ReviewCenter-ChecklistPage-SubmitBallot-Counted

      - id: ReviewCenter-Web-Checklist-SubmitHidden
        title: >-
          The Web subsystem shall not offer the Submit ballot button for an incomplete ballot, after hand-in, while
          the controls are disabled, or in a single-slot review whose answers handed the ballot over.
        justification: |
          A button that cannot succeed, or that would repeat a finished step, only invites mistakes.
        children:
          - ReviewCenter-ChecklistPage-SubmitBallot-Incomplete
          - ReviewCenter-ChecklistPage-SubmitBallot-AfterHandIn
          - ReviewCenter-ChecklistPage-SubmitBallot-Disabled
          - ReviewCenter-ChecklistPage-SubmitBallot-SingleSlot

      - id: ReviewCenter-Web-Checklist-NextUnanswered
        title: >-
          The Web subsystem shall lead a reviewer to the next unanswered check.
        justification: |
          A reviewer who works through a long checklist must not have to search for the place to continue.
        children:
          - ReviewCenter-ChecklistPage-NextUnanswered
          - ReviewCenter-ChecklistPage-NextUnanswered-Open
          - ReviewCenter-ChecklistPage-NextUnanswered-Scroll
          - ReviewCenter-ChecklistPage-NextUnanswered-SkipPending
          - ReviewCenter-ChecklistPage-NextUnanswered-OnlyPending
          - ReviewCenter-ChecklistPage-NextUnanswered-SectionEnd

      - id: ReviewCenter-Web-Checklist-NextUnansweredDone
        title: >-
          The Web subsystem shall offer a link back to the review once the checklist is complete.
        justification: |
          When nothing is left to answer, the way on is back to the review.
        children:
          - ReviewCenter-ChecklistPage-NextUnanswered-Complete
          - ReviewCenter-ChecklistPage-NextUnanswered-SectionEndBack

      - id: ReviewCenter-Web-Checklist-NextUnansweredNoNext
        title: >-
          The Web subsystem shall not offer the Next unanswered check button once the checklist is complete.
        justification: |
          A button for a check that does not exist would lead nowhere.
        children:
          - ReviewCenter-ChecklistPage-NextUnanswered-NoNext

      - id: ReviewCenter-Web-Checklist-JoinNotice
        title: >-
          The Web subsystem shall tell a user without a reviewer slot on the checklist page how to join.
        justification: |
          A user who sees a checklist but cannot answer it must be told why and what to do.
        children:
          - ReviewCenter-ChecklistPage-NoSlot
          - ReviewCenter-ChecklistPage-NoSlot-NoBallotStatus
          - ReviewCenter-ChecklistPage-NoSlot-NoSubmit
          - ReviewCenter-ChecklistPage-NoSlot-Disabled

      - id: ReviewCenter-Web-Checklist-Standing
        title: >-
          The Web subsystem shall show a user without a reviewer slot the consolidated standing of a single-slot or
          concluded review.
        justification: |
          Where nothing is left to hide, the standing of the review is shown to every reader. Where the standing
          stays hidden, the ballot requirement of the Web subsystem governs.
        children:
          - ReviewCenter-ChecklistPage-NoSlot-SingleStanding
          - ReviewCenter-ChecklistPage-NoSlot-ConcludedStanding

      - id: ReviewCenter-Web-Signatures
        title: >-
          The Web subsystem shall show on the review page a Reviewers card with the reviewer slots and their signature
          status.
        justification: |
          Re-authenticated signatures are what turn a reviewed record into an approved or a rejected one. The
          subsystem test covers what the pages show from the database, including the approval going out of date when
          the record changes.
        children:
          - ReviewCenter-ReviewPage-Reviewers
          - ReviewCenter-ReviewPage-Reviewers-NotSigned
          - ReviewCenter-ReviewPage-Reviewers-SignedStatus
          - ReviewCenter-ReviewPage-Reviewers-OutOfDate
          - ReviewCenter-ReviewPage-Reviewers-PlainName
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges

      - id: ReviewCenter-Web-Signatures-AddSlot
        title: >-
          The Web subsystem shall let a signed-in user add a slot by choosing a primary reviewer and an optional
          alternate reviewer from the enabled users.
        justification: |
          A review needs reviewers, and only an enabled user can do the work of one.
        children:
          - ReviewCenter-ReviewPage-Reviewers-AddSlot
          - ReviewCenter-ReviewPage-Reviewers-EnabledOnly

      - id: ReviewCenter-Web-Signatures-ChangeSlot
        title: >-
          The Web subsystem shall let a signed-in user change the primary and the alternate reviewer of a slot that
          has no signature.
        justification: |
          The staffing of a review changes while it runs, as long as no signature depends on it.
        children:
          - ReviewCenter-ReviewPage-Reviewers-ChangeSlot

      - id: ReviewCenter-Web-Signatures-ChangeSlotRemove
        title: >-
          The Web subsystem shall let a signed-in user remove a slot that has no signature.
        justification: |
          A slot that is no longer needed must go, as long as no signature depends on it.
        children:
          - ReviewCenter-ReviewPage-Reviewers-RemoveSlot

      - id: ReviewCenter-Web-Signatures-ChangeSlotBallotNote
        title: >-
          The Web subsystem shall show next to the controls of an unsigned slot a note that removing or replacing a
          reviewer also removes the ballot that reviewer handed in.
        justification: |
          The user must know that the ballot of a reviewer goes with the reviewer.
        children:
          - ReviewCenter-ReviewPage-Reviewers-BallotNote

      - id: ReviewCenter-Web-Signatures-SlotRefusal
        title: >-
          The Web subsystem shall show the reason next to the add control and add nothing when the choices of a new slot
          are refused.
        justification: |
          A person whose change was refused must see why and must be able to rely on the slots being as before.
        children:
          - ReviewCenter-ReviewPage-Reviewers-AddRefusal

      - id: ReviewCenter-Web-Signatures-SlotRefusal-Change
        title: >-
          The Web subsystem shall show the reason next to the slot and keep the slot unchanged when a change of the slot
          is refused.
        justification: |
          A person whose change of a slot was refused must see why and must be able to rely on the slot being as before.
        children:
          - ReviewCenter-ReviewPage-Reviewers-ChangeRefusal

      - id: ReviewCenter-Web-Signatures-SignedSlotFixed
        title: >-
          The Web subsystem shall offer no change or removal for a slot that has a signature.
        justification: |
          A signed slot is part of what the signature vouches for, so it is not edited behind the signature's back.
        children:
          - ReviewCenter-ReviewPage-Reviewers-SignedNoChange

      - id: ReviewCenter-Web-Signatures-EditWarning
        title: >-
          The Web subsystem shall show a warning that names the signers before a change or removal of a slot that makes
          signatures of other slots out of date.
        justification: |
          Whoever edits a slot must know whose signatures will be lost before it happens, and may still back out.
        children:
          - ReviewCenter-ReviewPage-Reviewers-EditWarning
          - ReviewCenter-ReviewPage-Reviewers-RemoveWarning

      - id: ReviewCenter-Web-Signatures-EditWarning-Confirm
        title: >-
          The Web subsystem shall carry out a change or removal of a slot that carries such a warning only after the
          user confirms.
        justification: |
          The user may still back out, so nothing is stored or removed before the confirmation.
        children:
          - ReviewCenter-ReviewPage-Reviewers-EditConfirm
          - ReviewCenter-ReviewPage-Reviewers-RemoveConfirm

      - id: ReviewCenter-Web-Signatures-NonMember
        title: >-
          The Web subsystem shall mark an assignee who is no longer a member of the project with a badge.
        justification: |
          A reader must see that an assignee lost the access, and the lists must not silently replace an assignee that
          is still entered.
        children:
          - ReviewCenter-ReviewPage-Reviewers-NonMemberBadge

      - id: ReviewCenter-Web-Signatures-NonMember-Hint
        title: >-
          The Web subsystem shall show for a slot with an assignee who is no longer a member the hint that this reviewer
          cannot sign until added to the project again.
        justification: |
          The hint tells the administrator what to do about the slot.
        children:
          - ReviewCenter-ReviewPage-Reviewers-NonMemberHint

      - id: ReviewCenter-Web-Signatures-NonMember-Choice
        title: >-
          The Web subsystem shall keep a primary or alternate reviewer who is no longer a member of the project as a
          labeled choice in the change lists.
        justification: |
          The list must not silently replace an assignee that is still entered by a blank choice.
        children:
          - ReviewCenter-ReviewPage-Reviewers-NonMemberChoice

      - id: ReviewCenter-Web-Signatures-NonMember-DisabledChoice
        title: >-
          The Web subsystem shall keep a primary or alternate reviewer who is disabled as a labeled choice in the change
          lists.
        justification: |
          The list must not silently replace a disabled assignee that is still entered by a blank choice.
        children:
          - ReviewCenter-ReviewPage-Reviewers-DisabledChoice

      - id: ReviewCenter-Web-Signatures-MemberUnmarked
        title: >-
          The Web subsystem shall show neither the badge nor the hint for assignees who are members of the project.
        justification: |
          A mark that appears for everybody says nothing, so the marks and the extra options show only where needed.
        children:
          - ReviewCenter-ReviewPage-Reviewers-MemberUnmarked

      - id: ReviewCenter-Web-Signatures-MemberUnmarked-NoExtraOption
        title: >-
          The Web subsystem shall add no extra option to the change lists for a current reviewer who is an enabled
          member.
        justification: |
          An extra option for everybody would clutter the lists, so it appears only where a choice would be lost.
        children:
          - ReviewCenter-ReviewPage-Reviewers-NoExtraOption

      - id: ReviewCenter-Web-Signatures-SignatureWarning
        title: >-
          The Web subsystem shall store a new thread, a reply, and the resolving and reopening of a thread at once and
          without a warning on a review with a current signature.
        justification: |
          Discussing a review does not change the signed record, so it must not be held up by a question.
        children:
          - ReviewCenter-ReviewPage-SignatureWarning

      - id: ReviewCenter-Web-Signatures-SignatureWarning-SignatureKept
        title: >-
          The Web subsystem shall leave the signature of a review current after chat was posted on it.
        justification: |
          Chat does not alter the signed record, so it must not cost a signature.
        children:
          - ReviewCenter-ReviewPage-SignatureWarning-SignatureKept

      - id: ReviewCenter-Web-Signatures-SignatureWarning-Question
        title: >-
          The Web subsystem shall post a new thread as a Question, which is not included in the report, on a review with
          a current signature.
        justification: |
          A new thread on a signed review must not change the signed report, so it starts as a Question.
        children:
          - ReviewCenter-ReviewPage-SignatureWarning-Question

      - id: ReviewCenter-Web-Signatures-SignatureWarning-ResolveNote
        title: >-
          The Web subsystem shall resolve a Question without a resolution note.
        justification: |
          A Question is not part of the report, so closing it needs no note about how it was settled.
        children:
          - ReviewCenter-ReviewPage-SignatureWarning-ResolveNote

      - id: ReviewCenter-Web-Signatures-ChatRefusal
        title: >-
          The Web subsystem shall show the refusal of a new thread for a review that was concluded meanwhile as the
          normal error message and not as a signature warning.
        justification: |
          A review that was concluded meanwhile is refused for that reason, which is not a warning that can be
          confirmed.
        children:
          - ReviewCenter-ReviewPage-SignatureWarning-RefusalMessage

      - id: ReviewCenter-Web-Signatures-ChecklistWarning
        title: >-
          The Web subsystem shall show a warning that names every affected slot and its signer when handing the own
          ballot in would make a signature out of date.
        justification: |
          A change on the checklist that alters the record must name the signatures that it costs before any answer is
          stored.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning

      - id: ReviewCenter-Web-Signatures-ChecklistWarning-TakenBack
        title: >-
          The Web subsystem shall show a warning that names every affected slot and its signer when taking back a
          counted dissent would make a signature out of date.
        justification: |
          Taking back a dissent changes the consolidated outcome, so the signatures it costs must be named first.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-TakenBack

      - id: ReviewCenter-Web-Signatures-ChecklistWarning-Applicability
        title: >-
          The Web subsystem shall show a warning that names every affected slot and its signer when switching a section
          back on would make a signature out of date.
        justification: |
          A section that counts again changes the record, so the signatures it costs must be named first.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-Applicability

      - id: ReviewCenter-Web-Signatures-ChecklistWarning-ApplicabilityDropped
        title: >-
          The Web subsystem shall drop the warning for switching a section on when the reviewer switches the section off
          again.
        justification: |
          A warning for a change that was undone would be wrong and would hide the real state of the checklist.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-SwitchOff

      - id: ReviewCenter-Web-Signatures-ChecklistWarning-NothingStored
        title: >-
          The Web subsystem shall store nothing while a signature warning is shown on the checklist page.
        justification: |
          The reviewer has not yet consented to losing signatures, so no answer may be stored before the consent.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-NothingStored

      - id: ReviewCenter-Web-Signatures-ChecklistConfirm
        title: >-
          The Web subsystem shall repeat the change with the warned slots acknowledged when the reviewer confirms a
          signature warning.
        justification: |
          Confirming is the explicit consent to lose the named signatures.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-Confirm

      - id: ReviewCenter-Web-Signatures-ChecklistConfirmOutOfDate
        title: >-
          The Web subsystem shall make the signatures that were named in a confirmed warning out of date.
        justification: |
          Only the confirmed change may make a signature out of date.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-OutOfDate

      - id: ReviewCenter-Web-Signatures-ChecklistMerged
        title: >-
          The Web subsystem shall store nothing and show the warning again with every affected slot when another
          signature appeared after the warning was shown and the reviewer confirms.
        justification: |
          Consent was given for the slots that were named, so a signature that appeared since must be named again
          before it is lost.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-Merged

      - id: ReviewCenter-Web-Signatures-ChecklistCancel
        title: >-
          The Web subsystem shall leave the signatures and the record unchanged when the reviewer cancels a signature
          warning.
        justification: |
          Cancelling must undo the attempt completely, with the page showing what is really stored.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-Cancel

      - id: ReviewCenter-Web-Signatures-ChecklistCancel-KeepChoice
        title: >-
          The Web subsystem shall keep the unsaved switch position and reason of a section when the reviewer cancels the
          warning of a hand-in.
        justification: |
          The reviewer must not have to type the reason of a section again after backing out of a warning.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-KeepChoice

      - id: ReviewCenter-Web-Signatures-ChecklistCancel-Revert
        title: >-
          The Web subsystem shall put the switch of a section that does not apply back to off when the reviewer cancels
          the warning for switching it on.
        justification: |
          The switch must show what is stored, so an enabling switch that was canceled goes back to off.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-Revert

      - id: ReviewCenter-Web-Signatures-ChecklistNoWarning
        title: >-
          The Web subsystem shall show no signature warning for a save that leaves the digest of the record unchanged,
          such as an answer in a draft ballot.
        justification: |
          A warning for a change that costs no signature would train people to click it away.
        children:
          - ReviewCenter-ChecklistPage-SignatureWarning-Draft

      - id: ReviewCenter-Web-Signatures-Approve
        title: >-
          The Web subsystem shall let a reviewer who occupies a slot sign the review as an approval after confirming
          the password.
        justification: |
          A signature is the statement of a person, so the person confirms the password before it is recorded.
        children:
          - ReviewCenter-ReviewPage-Sign
          - ReviewCenter-ReviewPage-Sign-Signature
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges

      - id: ReviewCenter-Web-Signatures-ApproveOutcome
        title: >-
          The Web subsystem shall show in the sign form of a review that can be approved the outcome Approved and the
          meaning of that outcome.
        justification: |
          The signer must know what an approval means before giving it.
        children:
          - ReviewCenter-ReviewPage-Sign-ApprovedOutcome

      - id: ReviewCenter-Web-Signatures-ApprovePasswordHidden
        title: >-
          The Web subsystem shall never show the typed password in the page, neither after a wrong nor after a correct
          password.
        justification: |
          A secret must not stay readable in the page.
        children:
          - ReviewCenter-ReviewPage-Sign-PasswordHidden

      - id: ReviewCenter-Web-Signatures-ApproveNoSecondForm
        title: >-
          The Web subsystem shall offer no sign form for a slot after it was signed.
        justification: |
          A slot that is signed needs no second signature.
        children:
          - ReviewCenter-ReviewPage-Sign-NoSecondForm

      - id: ReviewCenter-Web-Signatures-ApproveResult
        title: >-
          The Web subsystem shall show the review as Approved when every slot has a current signature.
        justification: |
          The reader must see when the review is approved.
        children:
          - ReviewCenter-ReviewPage-Sign-ApprovedResult

      - id: ReviewCenter-Web-Signatures-WrongPassword
        title: >-
          The Web subsystem shall answer a wrong password with the generic message "The password is incorrect." only.
        justification: |
          A message that says more would help somebody who guesses the password of another person.
        children:
          - ReviewCenter-ReviewPage-Sign-WrongPassword

      - id: ReviewCenter-Web-Signatures-StaleRecord
        title: >-
          The Web subsystem shall not sign a slot when the record has changed since the page was drawn.
        justification: |
          A signature must vouch for the record that the signer saw, not for one that changed meanwhile.
        children:
          - ReviewCenter-ReviewPage-Sign-StaleRecord

      - id: ReviewCenter-Web-Signatures-StaleRecord-Message
        title: >-
          The Web subsystem shall tell the signer that the record has changed when signing is refused because the record
          changed since the page was drawn.
        justification: |
          A signer whose signature was refused must learn why, so that the page can be read again.
        children:
          - ReviewCenter-ReviewPage-Sign-StaleMessage

      - id: ReviewCenter-Web-Signatures-Blockers
        title: >-
          The Web subsystem shall list what blocks signing instead of the sign form to the reviewer of a slot while
          the review cannot be signed, including a missing conclusion text for a Rejected outcome.
        justification: |
          A reviewer who cannot sign yet must be told what is missing instead of meeting a form that fails.
        children:
          - ReviewCenter-ReviewPage-Sign-Blockers
          - ReviewCenter-ReviewPage-Sign-ConclusionBlocker

      - id: ReviewCenter-Web-Signatures-OthersNoForm
        title: >-
          The Web subsystem shall show neither the sign form nor the blockers of a slot to a user who is not its
          primary or alternate reviewer.
        justification: |
          Only the people of a slot sign for it, so nobody else is shown a form or a list of blockers for it.
        children:
          - ReviewCenter-ReviewPage-Sign-OthersNoForm

      - id: ReviewCenter-Web-Signatures-Reject
        title: >-
          The Web subsystem shall show in the sign form of a review that can be rejected the outcome Rejected and the
          meaning of that outcome.
        justification: |
          A signer must know what a rejection means before giving it.
        children:
          - ReviewCenter-ReviewPage-Sign-RejectedOutcome

      - id: ReviewCenter-Web-Signatures-RejectResult
        title: >-
          The Web subsystem shall show the review as Rejected when every slot is signed with the outcome Rejected.
        justification: |
          A review that finds the work not acceptable must be able to end with a rejection.
        children:
          - ReviewCenter-ReviewPage-Sign-RejectedResult

      - id: ReviewCenter-Web-Signatures-Conclusion
        title: >-
          The Web subsystem shall let the slot owners write the conclusion text in a Review conclusion card.
        justification: |
          The conclusion is the shared statement of the reviewers, so it has a card where they write it together.
        children:
          - ReviewCenter-ReviewPage-ConclusionCard
          - ReviewCenter-ReviewPage-ConclusionCard-EmptyState
          - ReviewCenter-ReviewPage-ConclusionCard-Write
          - ReviewCenter-ReviewPage-ConclusionCard-AlternateWrite
          - ReviewCenter-ReviewPage-ConclusionCard-Warning
          - ReviewCenter-ReviewPage-ConclusionCard-ConfirmSave

      - id: ReviewCenter-Web-Signatures-ConclusionReadOnly
        title: >-
          The Web subsystem shall show the conclusion text without an editor to a viewer who owns no slot and on a
          concluded review, even to the owner of a slot.
        justification: |
          Only the owners of a slot may change the conclusion, and nobody may change it once the review is concluded.
        children:
          - ReviewCenter-ReviewPage-ConclusionCard-NoEditor
          - ReviewCenter-ReviewPage-ConclusionCard-Concluded

      - id: ReviewCenter-Web-Signatures-ConclusionRefusal
        title: >-
          The Web subsystem shall show the message of the rule when the service refuses a change of the conclusion
          text.
        justification: |
          A writer whose text was refused must learn the reason instead of losing the text without a word.
        children:
          - ReviewCenter-ReviewPage-ConclusionCard-Refusal

      - id: ReviewCenter-Web-Signatures-Status
        title: >-
          The Web subsystem shall show the approval status of the review (Approved, Rejected, or In review) next to its
          title.
        justification: |
          The status is the first thing a reader looks for on the page of a review.
        children:
          - ReviewCenter-ReviewPage-Reviewers-ApprovedBadge
          - ReviewCenter-ReviewPage-Reviewers-InReviewBadge
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges

      - id: ReviewCenter-Web-Signatures-Digest
        title: >-
          The Web subsystem shall show the record digest in the Details section of the review page.
        justification: |
          The digest identifies the exact record that was signed, so a reader can check it outside the tool.
        children:
          - ReviewCenter-ReviewPage-Digest
          - ReviewCenter-ReviewPage-Digest-FullValue

      - id: ReviewCenter-Web-Signatures-ProjectStatus
        title: >-
          The Web subsystem shall show the approval status of each review on the project page.
        justification: |
          A lead must see which reviews are approved without opening each one.
        children:
          - ReviewCenter-ProjectPage-Approval
          - ReviewCenter-ProjectPage-Approval-Setup
          - ReviewCenter-ProjectPage-Approval-Rejected
          - ReviewCenter-ProjectPage-Approval-InReview
          - ReviewCenter-ProjectPage-Approval-Current
        tests:
          - WebSubsystem_SignedReview_ApprovalIsPresentedAndGoesOutOfDateWhenRecordChanges

      - id: ReviewCenter-Web-ReviewLock
        title: >-
          The Web subsystem shall show a review that is concluded, approved or rejected, as locked on the review page,
          with the reason given.
        justification: |
          The lock is enforced by the services, but the page is where people meet it. The page must say what is locked
          and why, so that a user is not left with controls that fail for no visible reason.
        children:
          - ReviewCenter-ReviewPage-Locked
          - ReviewCenter-ReviewPage-Locked-Banner
          - ReviewCenter-ReviewPage-Locked-SlotsNote
        tests:
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-Web-ReviewLock-ChecklistLocked
        title: >-
          The Web subsystem shall show a review that is concluded, approved or rejected, as locked on the checklist
          page, with the reason given.
        justification: |
          A reviewer who opens the checklist of a concluded review must be told why nothing can be changed.
        children:
          - ReviewCenter-ChecklistPage-Locked

      - id: ReviewCenter-Web-ReviewLock-Controls
        title: >-
          The Web subsystem shall disable the controls that change a locked review.
        justification: |
          A control that is offered but refused is confusing, so the controls of a locked review are disabled.
        children:
          - ReviewCenter-ReviewPage-Locked-NoNewThread
          - ReviewCenter-ReviewPage-Locked-NoReply
          - ReviewCenter-ReviewPage-Locked-DiffHint
          - ReviewCenter-ReviewPage-Locked-LineButtons
          - ReviewCenter-ReviewPage-Locked-DiffButtons
          - ReviewCenter-ReviewPage-Locked-NoResolve
          - ReviewCenter-ReviewPage-Locked-SlotsNoControls
          - ReviewCenter-ChecklistPage-Locked-Controls
          - ReviewCenter-ReviewPage-ThreadActions-Concluded

      - id: ReviewCenter-Web-ReviewLock-Reading
        title: >-
          The Web subsystem shall keep selecting a file, reading the comments of its threads and opening the sections of
          the checklist available on a locked review.
        justification: |
          A lock stops changes, not reading, so the record of a concluded review stays open to its readers.
        children:
          - ReviewCenter-ReviewPage-Locked-Reading
          - ReviewCenter-ChecklistPage-Locked-Readable

      - id: ReviewCenter-Web-ReviewLock-ReadingThreads
        title: >-
          The Web subsystem shall list all threads, not only the open ones, at first on a concluded review.
        justification: |
          A reader of a concluded review wants the whole discussion, not only what is still open.
        children:
          - ReviewCenter-ReviewPage-Locked-ThreadsAll

      - id: ReviewCenter-Web-ReviewLock-Reopen
        title: >-
          The Web subsystem shall let an administrator of the project or a system administrator reopen a locked review
          on the review page with a reason.
        justification: |
          The way out of a lock is offered only to those who may take it, and the reason keeps the record honest.
        children:
          - ReviewCenter-ReviewPage-Reopen
          - ReviewCenter-ReviewPage-Reopen-ProjectAdmin
          - ReviewCenter-ReviewPage-Reopen-ReasonLimit
          - ReviewCenter-ReviewPage-Reopen-InReview
        tests:
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-Web-ReviewLock-ReopenHidden
        title: >-
          The Web subsystem shall show the reopen form of a locked review to no user other than an administrator of the
          project or a system administrator.
        justification: |
          A form that is shown to a person who may not use it would only lead to a refusal.
        children:
          - ReviewCenter-ReviewPage-Reopen-NobodyElse

      - id: ReviewCenter-Web-ReviewLock-ReopenRefused
        title: >-
          The Web subsystem shall show the message of the rule when the service refuses to reopen the review.
        justification: |
          A refused reopening must leave no trace in the record and must tell the person why.
        children:
          - ReviewCenter-ReviewPage-Reopen-Refusal

      - id: ReviewCenter-Web-ReviewLock-ReopenRefused-StaysLocked
        title: >-
          The Web subsystem shall keep the review locked and record no reopening when the service refuses to reopen it.
        justification: |
          A refused reopening must leave no trace in the record.
        children:
          - ReviewCenter-ReviewPage-Reopen-StaysLocked

      - id: ReviewCenter-Web-ReviewLock-ReopenHistory
        title: >-
          The Web subsystem shall show the reopenings of a review in a history.
        justification: |
          A reader must see that a review was reopened, when, and why.
        children:
          - ReviewCenter-ReviewPage-Reopen-History
          - ReviewCenter-ReviewPage-Reopen-HistoryOrder
        tests:
          - WebSubsystem_ApprovedReview_ShowsLockedAndAdminCanReopen

      - id: ReviewCenter-Web-ReviewLock-Independence
        title: >-
          The Web subsystem shall show the user who created a review that a different project member has to review and
          sign it when the project requires independent reviewers.
        justification: |
          The user must be told why the own review cannot be signed and what to do, instead of being left with controls
          that fail.
        children:
          - ReviewCenter-ReviewPage-Independence
          - ReviewCenter-ReviewPage-Independence-AuthorHint
          - ReviewCenter-ReviewPage-Reviewers-AuthorChoice

      - id: ReviewCenter-Web-ReviewLock-IndependenceHintHidden
        title: >-
          The Web subsystem shall show the independence hint to no user other than the author of the review.
        justification: |
          The hint is about the own review of the author, so it would only confuse everybody else.
        children:
          - ReviewCenter-ReviewPage-Independence-HintAuthorOnly

      - id: ReviewCenter-Web-ReviewLock-IndependenceOff
        title: >-
          The Web subsystem shall offer every user again, including the author, and show no hint while the project
          does not require independent reviewers.
        justification: |
          A project that does not require independence must not be held to it by the lists or by a hint.
        children:
          - ReviewCenter-ReviewPage-Independence-Off

      - id: ReviewCenter-Web-ReviewRules
        title: >-
          The Web subsystem shall let an administrator of the project or a system administrator switch the requirement
          of independent reviewers on the project page.
        justification: |
          A project that has to let one person do both must be able to say so, and only the people who administer the
          project may relax a rule that protects its reviews.
        children:
          - ReviewCenter-ProjectPage-ReviewRules
          - ReviewCenter-ProjectPage-ReviewRules-SystemAdmin
          - ReviewCenter-ProjectPage-ReviewRules-Explanation
          - ReviewCenter-ProjectPage-ReviewRules-Save
          - ReviewCenter-ProjectPage-ReviewRules-Confirmation
        tests:
          - WebSubsystem_ProjectAdmin_TogglesIndependentReviewers

      - id: ReviewCenter-Web-ReviewRules-Audit
        title: >-
          The Web subsystem shall cause for a saved independent-reviewers switch an audit entry of the project that
          names the old and the new value.
        justification: |
          A change of a rule that protects the reviews must be traceable afterwards.
        children:
          - ReviewCenter-ProjectPage-ReviewRules-Audit

      - id: ReviewCenter-Web-ReviewRules-Conflict
        title: >-
          The Web subsystem shall show the message of the rule when the administrator saves the independent-reviewers
          switch that somebody else changed.
        justification: |
          A save that rests on an out-of-date page must not overwrite the change of another administrator unseen.
        children:
          - ReviewCenter-ProjectPage-ReviewRules-Conflict

      - id: ReviewCenter-Web-ReviewRules-ConflictShowsStored
        title: >-
          The Web subsystem shall show the stored values of the review rules, instead of the unsaved choices, after a
          save of the independent-reviewers switch was refused because somebody else changed it.
        justification: |
          The administrator must see what is really stored before choosing again.
        children:
          - ReviewCenter-ProjectPage-ReviewRules-ConflictShowsStored

      - id: ReviewCenter-Web-ReviewRules-ConflictNothingRecorded
        title: >-
          The Web subsystem shall record no audit entry when a save of the independent-reviewers switch is refused
          because somebody else changed it.
        justification: |
          The audit trail must tell what happened, and nothing was changed by the refused save.
        children:
          - ReviewCenter-ProjectPage-ReviewRules-ConflictNothingRecorded

      - id: ReviewCenter-Web-ReviewRules-Hidden
        title: >-
          The Web subsystem shall not show the independent-reviewers setting to any other user.
        justification: |
          Only the people who administer the project may see and change a rule that protects its reviews.
        children:
          - ReviewCenter-ProjectPage-ReviewRules-Hidden
        tests:
          - WebSubsystem_ProjectAdmin_TogglesIndependentReviewers

      - id: ReviewCenter-Web-ReviewRuleSwitches
        title: >-
          The Web subsystem shall let an administrator of the project or a system administrator switch the rule that
          authors answer the checklist of their own review on the project page.
        justification: |
          Only the people who administer the project may change a rule that protects its reviews.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Save
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Confirmation
        tests:
          - WebSubsystem_ProjectAdmin_SavesStoredReviewRuleSwitches

      - id: ReviewCenter-Web-ReviewRuleSwitches-Audit
        title: >-
          The Web subsystem shall cause for each changed one of these switches one audit entry of the project that
          names the rule and the old and the new value.
        justification: |
          A change of a rule that protects the reviews must be traceable per rule afterwards.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Audit

      - id: ReviewCenter-Web-ReviewRuleSwitches-Conflict
        title: >-
          The Web subsystem shall show the message of the rule when the administrator saves the author-answers or
          reopener-signing switch that somebody else changed.
        justification: |
          A save of these two switches that rests on an out-of-date page must not overwrite the change of another
          administrator unseen.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Conflict

      - id: ReviewCenter-Web-ReviewRuleSwitches-ConflictShowsStored
        title: >-
          The Web subsystem shall show the stored values of the author-answers and reopener-signing switches, instead of
          the unsaved choices, after a save was refused because somebody else changed one.
        justification: |
          The administrator must see what is really stored for these switches before choosing again.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-ConflictShowsStored

      - id: ReviewCenter-Web-ReviewRuleSwitches-ConflictNothingRecorded
        title: >-
          The Web subsystem shall record no audit entry when a save of the author-answers or reopener-signing switch is
          refused because somebody else changed it.
        justification: |
          A refused save of these switches changes nothing, so the audit trail must not show a change.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-ConflictNothingRecorded

      - id: ReviewCenter-Web-ReviewRuleSwitches-ReopenerSigning
        title: >-
          The Web subsystem shall let an administrator of the project or a system administrator switch the rule that
          the person who reopened a review signs it again on the project page.
        justification: |
          The second rule is stored and confirmed apart from the first, so its own save must be shown to work.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Save
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Confirmation
        tests:
          - WebSubsystem_ProjectAdmin_SavesStoredReviewRuleSwitches

      - id: ReviewCenter-Web-ReviewRuleSwitches-DefaultNotice
        title: >-
          The Web subsystem shall say with each review rule switch that the rule applies to every project, including a
          project that was created before the rule was enforced.
        justification: |
          The rules are enforced for every project from the day they are enforced, so a page that offered a switch
          without saying so would hide that an existing project is affected too.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-EnforcementHints

      - id: ReviewCenter-Web-ReviewRuleSwitches-DefaultOn
        title: >-
          The Web subsystem shall show both review rule switches on for a project that was not given another value.
        justification: |
          A project that nobody has set up must still follow the rules.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-DefaultOn

      - id: ReviewCenter-Web-ReviewRuleSwitches-Hidden
        title: >-
          The Web subsystem shall not show the two review rules to any other user.
        justification: |
          Only the people who administer the project may see and change the rules on who answers and who signs.
        children:
          - ReviewCenter-ProjectPage-ReviewRuleSwitches-Hidden
        tests:
          - WebSubsystem_ProjectAdmin_SavesStoredReviewRuleSwitches

      - id: ReviewCenter-Web-ReviewRuleNotices
        title: >-
          The Web subsystem shall tell the author of a review on the checklist page, while the project does not let
          authors answer the checklist, that another member has to answer it.
        justification: |
          The services enforce the rules, but the pages are where people meet them. A user must be told what to do
          instead of being left with controls that fail for no visible reason.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked
        tests:
          - WebSubsystem_ChecklistPage_AuthorSeesNoticeAndNonAuthorAnswers

      - id: ReviewCenter-Web-ReviewRuleNotices-Hidden
        title: >-
          The Web subsystem shall show no author notice to a user who is not the author, while the project lets authors
          answer, or on a locked review, which shows only the lock notice.
        justification: |
          A notice that is shown to the wrong person, or where it does not apply, would mislead the reader.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked-OtherUser
          - ReviewCenter-ChecklistPage-AuthorBlocked-RuleOff
          - ReviewCenter-ChecklistPage-AuthorBlocked-Locked

      - id: ReviewCenter-Web-ReviewRuleNotices-AuthorRefusal
        title: >-
          The Web subsystem shall show the message of the rule next to the check when a page loaded before the rule was
          switched on sends an answer of the author.
        justification: |
          A page that was loaded earlier can still send an answer, so the refusal must reach the reader and must leave
          the ballot unchanged.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked-Refusal

      - id: ReviewCenter-Web-ReviewRuleNotices-AuthorRefusal-NotStored
        title: >-
          The Web subsystem shall store nothing when a page loaded before the rule was switched on sends an answer of
          the author.
        justification: |
          The refused answer must leave the ballot unchanged.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked-NotStored

      - id: ReviewCenter-Web-ReviewRuleNotices-AuthorControls
        title: >-
          The Web subsystem shall disable the answer controls for the author of a review while the project does not let
          authors answer the checklist.
        justification: |
          A control that the rules refuse must not be offered.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked-Controls
        tests:
          - WebSubsystem_ChecklistPage_AuthorSeesNoticeAndNonAuthorAnswers

      - id: ReviewCenter-Web-ReviewRuleNotices-OtherControls
        title: >-
          The Web subsystem shall keep the answer controls enabled for a project member other than the author.
        justification: |
          The rule restricts the author only, so every other member keeps working on the checklist.
        children:
          - ReviewCenter-ChecklistPage-AuthorBlocked-OtherControls

      - id: ReviewCenter-Web-ReviewRuleNotices-ReopenerNotice
        title: >-
          The Web subsystem shall tell the person who reopened a review on the review page, while the project does not
          let that person sign again, that another reviewer must sign, instead of the sign form.
        justification: |
          A user must be told what to do instead of being offered a form that the rules refuse.
        children:
          - ReviewCenter-ReviewPage-ReopenerBlocked

      - id: ReviewCenter-Web-ReviewRuleNotices-ReopenerNoticeHidden
        title: >-
          The Web subsystem shall show the sign form and no such notice to every other occupant of the slot and to the
          person who reopened the review when the project switched the rule off.
        justification: |
          The notice and the withheld form apply to one person under one rule, so everybody else keeps the normal form.
        children:
          - ReviewCenter-ReviewPage-ReopenerBlocked-OtherOccupants
          - ReviewCenter-ReviewPage-ReopenerBlocked-RuleOff

      - id: ReviewCenter-Web-ReviewRuleNotices-ReopenRefused
        title: >-
          The Web subsystem shall show the user the message of the rule when a reopening is refused because a slot
          would have nobody who may sign it.
        justification: |
          A refused reopening must say why, so that the user can fix the cause.
        children:
          - ReviewCenter-ReviewPage-ReopenerBlocked-StrandRefusal

      - id: ReviewCenter-Web-SignIn
        title: >-
          The Web subsystem shall show in the page header the name of the signed-in user with a link to the account
          page.
        justification: |
          Users must be able to see who they are signed in as, and reach their account, from every page.
        children:
          - ReviewCenter-App-Header
          - ReviewCenter-App-Header-AccountLink
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-Web-SignIn-Logout
        title: >-
          The Web subsystem shall show a logout button in the page header for a signed-in user.
        justification: |
          A user must be able to sign out from every page, for example on a shared computer.
        children:
          - ReviewCenter-App-Header-LogoutButton
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd

      - id: ReviewCenter-Web-SignIn-SignInLink
        title: >-
          The Web subsystem shall show a sign-in link in the page header when nobody is signed in.
        justification: |
          A visitor must find the way to sign in from every page.
        children:
          - ReviewCenter-App-Header-SignInLink

      - id: ReviewCenter-Web-SignIn-LoginPage
        title: >-
          The Web subsystem shall serve a login page at /login with a user name and a password field.
        justification: |
          Users must be able to sign in with a local account in the web interface. The subsystem test covers the
          page served over HTTP.
        children:
          - ReviewCenter-LoginPage-Form
          - ReviewCenter-LoginPage-Form-Fields
          - ReviewCenter-LoginPage-Form-PostTarget
        tests:
          - IdentitySubsystem_SignInJourney_LoginUseAndLogout_WorksEndToEnd
          - SignIn_PublicPage_Anonymous_IsServed

      - id: ReviewCenter-Web-SignIn-RouteAuthorization
        title: >-
          The Web subsystem shall show a page to a user who has the role that the page needs when the user navigates
          to it inside the app.
        justification: |
          Navigating inside the app makes no request to the server, so the page must decide the access itself and must
          not turn away the users who may enter.
        children:
          - ReviewCenter-App-RouteAuthorization

      - id: ReviewCenter-Web-SignIn-AccessDenied
        title: >-
          The Web subsystem shall show a signed-in user without the role that a page needs an access denied message,
          and not the page.
        justification: |
          A signed-in user who lacks the role must be told so and must not see the data of the page.
        children:
          - ReviewCenter-App-RouteAuthorization-AccessDenied

      - id: ReviewCenter-Web-SignIn-RouteLoginLink
        title: >-
          The Web subsystem shall show a signed-out user a link to the login page, and not the page, when the user
          navigates to a page that needs a role.
        justification: |
          A visitor who is not signed in needs the way to the login page, not an access denied message.
        children:
          - ReviewCenter-App-RouteAuthorization-LoginLink

      - id: ReviewCenter-Web-SignIn-LoginPage-Antiforgery
        title: >-
          The Web subsystem shall put an antiforgery token into the form of the login page.
        justification: |
          The antiforgery token stops another site from signing a user in to an account chosen by an attacker. The
          token is added by the server when the page is served, so only the page requested over HTTP shows it.
        tests:
          - SignIn_LoginPage_Anonymous_FormPostsToSignInEndpointWithAntiforgeryToken

      - id: ReviewCenter-Web-SignIn-LoginFailure
        title: >-
          The Web subsystem shall show a failed sign-in without revealing its reason.
        justification: |
          A page that tells whether the user name or the password was wrong helps somebody who guesses accounts.
        children:
          - ReviewCenter-LoginPage-Error

      - id: ReviewCenter-Web-SignIn-LoginThrottled
        title: >-
          The Web subsystem shall show a different message, saying that there were too many attempts and to try again
          in a few minutes, when sign-in attempts are throttled.
        justification: |
          A person who is held back by the throttle must learn to wait, and the throttle does not reveal an account.
        children:
          - ReviewCenter-LoginPage-Error-Throttled

      - id: ReviewCenter-Web-SignIn-LoginReturnAddress
        title: >-
          The Web subsystem shall keep a local return address through a failed sign-in.
        justification: |
          A user who mistyped the password must still arrive at the page that was asked for.
        children:
          - ReviewCenter-LoginPage-Error-ReturnAddress

      - id: ReviewCenter-Web-SignIn-LoginForeignAddress
        title: >-
          The Web subsystem shall ignore a return address that leads to another site.
        justification: |
          A return address that leaves the site would turn the login page into a redirect to an attacker's page.
        children:
          - ReviewCenter-LoginPage-Error-ForeignAddress

      - id: ReviewCenter-Web-SignIn-AccountPage
        title: >-
          The Web subsystem shall serve an account page at /account for a signed-in user.
        justification: |
          Account management is done in the web interface, so that no command line is needed after the first
          administrator exists.
        children:
          - ReviewCenter-AccountPage-Show

      - id: ReviewCenter-Web-SignIn-ChangePassword
        title: >-
          The Web subsystem shall let a signed-in user change the own password on the account page.
        justification: |
          A user must be able to replace a password that is old or that others may know, without asking anybody.
        children:
          - ReviewCenter-AccountPage-ChangePassword
          - ReviewCenter-AccountPage-ChangePassword-ClearFields

      - id: ReviewCenter-Web-SignIn-ChangePasswordRefused
        title: >-
          The Web subsystem shall show a violated password rule as a message.
        justification: |
          A password that breaks a rule must be refused with the reason.
        children:
          - ReviewCenter-AccountPage-ChangePassword-RuleViolation

      - id: ReviewCenter-Web-SignIn-ChangePasswordNothingChanged
        title: >-
          The Web subsystem shall leave the password unchanged when the change of the password is refused.
        justification: |
          The old password must stay in force after a refused change.
        children:
          - ReviewCenter-AccountPage-ChangePassword-NothingChanged

      - id: ReviewCenter-Web-SignIn-ChangePasswordCodeField
        title: >-
          The Web subsystem shall ask a user who has turned on the second factor for a code or a recovery code in the
          form that changes the password.
        justification: |
          A second factor protects the password change too.
        children:
          - ReviewCenter-AccountPage-ChangePassword-CodeField

      - id: ReviewCenter-Web-SignIn-ChangePasswordClearCode
        title: >-
          The Web subsystem shall empty the code field after an attempt to change the password.
        justification: |
          A code that stays in the field could be reused by somebody who looks at the screen.
        children:
          - ReviewCenter-AccountPage-ChangePassword-ClearCode

      - id: ReviewCenter-Web-SignIn-ChangePasswordNoCodeField
        title: >-
          The Web subsystem shall ask for no code in the form that changes the password when the user has not turned on
          the second factor.
        justification: |
          A field that asks for a code that the user does not have would block the change of the password.
        children:
          - ReviewCenter-AccountPage-ChangePassword-NoCodeField

      - id: ReviewCenter-Web-SignIn-ChangePasswordCode
        title: >-
          The Web subsystem shall change the password of a user who has turned on the second factor when the right code
          or a recovery code is sent with it.
        justification: |
          The second factor and the recovery codes are the ways to prove the right to change the password, so both
          must lead to the change.
        children:
          - ReviewCenter-AccountPage-ChangePassword-CodeAccepted
          - ReviewCenter-AccountPage-ChangePassword-RecoveryCode

      - id: ReviewCenter-Web-SignIn-ChangePasswordCodeRefused
        title: >-
          The Web subsystem shall answer a missing or a wrong code of a user who has turned on the second factor with
          the same general message.
        justification: |
          A message that tells a missing code from a wrong one would help somebody who tries codes.
        children:
          - ReviewCenter-AccountPage-ChangePassword-MissingCode
          - ReviewCenter-AccountPage-ChangePassword-WrongCode

      - id: ReviewCenter-Web-SignIn-Appearance
        title: >-
          The Web subsystem shall let a signed-in user choose the appearance on the account page.
        justification: |
          Readers differ in what they can read comfortably, so the choice between the system, a light, and a dark
          appearance belongs to the user.
        children:
          - ReviewCenter-AccountPage-Appearance
          - ReviewCenter-AccountPage-Appearance-Default
          - ReviewCenter-AccountPage-Appearance-Apply
          - ReviewCenter-AccountPage-Appearance-BrowserOnly
          - ReviewCenter-AccountPage-Appearance-StoredChoice

      - id: ReviewCenter-Web-SignIn-AppearanceFirstPaint
        title: >-
          The Web subsystem shall apply the light, dark, or system appearance stored in the browser before the first
          paint of every page.
        justification: |
          An appearance that is applied after the first paint would flash the wrong colors at every page load.
        children:
          - ReviewCenter-App-Theme

      - id: ReviewCenter-Web-SignIn-TemporaryPassword
        title: >-
          The Web subsystem shall show a user who signed in with a temporary password a banner that says so.
        justification: |
          The user must be told why the page offers nothing but the change of the password.
        children:
          - ReviewCenter-AccountPage-TemporaryPassword
        tests:
          - MainLayout_Render_TemporaryPassword_ConfinesUserToAccountPage

      - id: ReviewCenter-Web-SignIn-TemporaryPasswordFormOnly
        title: >-
          The Web subsystem shall show a user who signed in with a temporary password only the form for changing the
          password, with no card of personal access tokens and no appearance card.
        justification: |
          A temporary password is known to the person who set it, so the user must replace it before anything else.
        children:
          - ReviewCenter-AccountPage-TemporaryPassword-PasswordFormOnly

      - id: ReviewCenter-Web-SignIn-TemporaryPasswordNone
        title: >-
          The Web subsystem shall show no banner about a temporary password in a session that does not carry the
          must-change-password mark.
        justification: |
          A banner that appears in a normal session would tell users to change a password that is fine.
        children:
          - ReviewCenter-AccountPage-TemporaryPassword-NormalSession

      - id: ReviewCenter-Web-SignIn-TemporaryHeader
        title: >-
          The Web subsystem shall keep the header of a temporary-password session free of navigation tabs.
        justification: |
          A tab that leads to a page that is replaced anyway would only confuse the user.
        children:
          - ReviewCenter-App-TemporaryPassword-NoTabs
        tests:
          - MainLayout_Render_TemporaryPassword_ConfinesUserToAccountPage

      - id: ReviewCenter-Web-SignIn-TemporaryPages
        title: >-
          The Web subsystem shall replace every other page in a temporary-password session by the account page.
        justification: |
          The user must change the password first, so no other page may be reached until it is changed.
        children:
          - ReviewCenter-App-TemporaryPassword
          - ReviewCenter-App-TemporaryPassword-LaterNavigation
        tests:
          - MainLayout_Render_TemporaryPassword_ConfinesUserToAccountPage
          - MainLayout_Navigate_TemporaryPassword_RedirectsLaterNavigationAndStopsAfterDispose

      - id: ReviewCenter-Web-SignIn-TemporaryOpenPages
        title: >-
          The Web subsystem shall not send the browser away from the account, login, help, and about pages while the
          session carries the must-change-password mark.
        justification: |
          The pages that a user needs to change the password or to read the help must stay reachable.
        children:
          - ReviewCenter-App-TemporaryPassword-OpenPages

      - id: ReviewCenter-Web-SignIn-PasswordChanged
        title: >-
          The Web subsystem shall show a notice to sign in again on the login page after the temporary password was
          changed.
        justification: |
          The change ends the session, and the user must be told why the login page appears.
        children:
          - ReviewCenter-LoginPage-PasswordChanged
          - ReviewCenter-AccountPage-TemporaryPassword-SignInAgain
        tests:
          - AccountPage_ChangePassword_TemporaryPassword_RedirectsToLoginWithNotice

      - id: ReviewCenter-Web-SignIn-UsersPage
        title: >-
          The Web subsystem shall serve a users page at /users that lists the users to a system administrator.
        justification: |
          User management is done in the web interface, so that no command line is needed after the first
          administrator exists.
        children:
          - ReviewCenter-UsersPage-List
          - ReviewCenter-UsersPage-List-AdminOnly
          - ReviewCenter-UsersPage-List-Controls
          - ReviewCenter-UsersPage-List-NoRole
        tests:
          - SignIn_UsersPage_ReviewerAndAdmin_OnlyAdminIsAllowed

      - id: ReviewCenter-Web-SignIn-UsersFilter
        title: >-
          The Web subsystem shall narrow the list of users by the typed text and the chosen status together.
        justification: |
          A long list must be searchable, so both conditions apply together.
        children:
          - ReviewCenter-UsersPage-SearchFilter
          - ReviewCenter-UsersPage-SearchFilter-Status
          - ReviewCenter-UsersPage-SearchFilter-Combined

      - id: ReviewCenter-Web-SignIn-UsersFilterNoReload
        title: >-
          The Web subsystem shall narrow the list of users without a new request to the store.
        justification: |
          A long list must be searchable at once, without a round trip.
        children:
          - ReviewCenter-UsersPage-SearchFilter-NoReload

      - id: ReviewCenter-Web-SignIn-UsersStatus
        title: >-
          The Web subsystem shall show for each user the lockout end, the temporary-password badge, and the time of the
          last sign-in or the word Never.
        justification: |
          An administrator who is asked for help needs the state of the account at a glance.
        children:
          - ReviewCenter-UsersPage-Status
          - ReviewCenter-UsersPage-Status-Temporary
          - ReviewCenter-UsersPage-Status-LastSignIn
          - ReviewCenter-UsersPage-Status-NeverSignedIn

      - id: ReviewCenter-Web-SignIn-UsersUnlock
        title: >-
          The Web subsystem shall offer the button that ends the lockout only for a locked user.
        justification: |
          A button for a user who is not locked would invite an action that does nothing.
        children:
          - ReviewCenter-UsersPage-Status-UnlockButton

      - id: ReviewCenter-Web-SignIn-UsersUnlockAction
        title: >-
          The Web subsystem shall end the lockout of a user at once when the button is clicked, without a
          confirmation.
        justification: |
          Ending a lockout is harmless and urgent for the person who is locked out, so it needs no confirmation.
        children:
          - ReviewCenter-UsersPage-Status-Unlock

      - id: ReviewCenter-Web-SignIn-UsersUnlockOutcome
        title: >-
          The Web subsystem shall show the outcome when the lockout of a user was ended.
        justification: |
          An action without a confirmation must at least report what happened.
        children:
          - ReviewCenter-UsersPage-Status-UnlockOutcome

      - id: ReviewCenter-Web-SignIn-UsersLink
        title: >-
          The Web subsystem shall show a link to the users page in the header only while an enabled system
          administrator is signed in.
        justification: |
          A link that leads to a page that a user may not open would only lead to a refusal.
        children:
          - ReviewCenter-App-UsersLink

      - id: ReviewCenter-Web-SignIn-Enable
        title: >-
          The Web subsystem shall let a system administrator enable a user.
        justification: |
          An account that was disabled must be able to come back without a command line.
        children:
          - ReviewCenter-UsersPage-Update

      - id: ReviewCenter-Web-SignIn-Disable
        title: >-
          The Web subsystem shall let a system administrator disable a user.
        justification: |
          A person who leaves must lose the access at once. The confirmation shows what the disabling affects.
        children:
          - ReviewCenter-UsersPage-Update
          - ReviewCenter-UsersPage-DisableImpact
          - ReviewCenter-UsersPage-DisableImpact-Projects
          - ReviewCenter-UsersPage-DisableImpact-NothingWaiting
          - ReviewCenter-UsersPage-DisableImpact-SecondClick

      - id: ReviewCenter-Web-SignIn-DisableCancel
        title: >-
          The Web subsystem shall change nothing when the confirmation of disabling is cancelled.
        justification: |
          A person who backs out of the confirmation must find the account as it was.
        children:
          - ReviewCenter-UsersPage-DisableImpact-Cancel

      - id: ReviewCenter-Web-SignIn-DisableLoadError
        title: >-
          The Web subsystem shall show an error when the impact of disabling a user cannot be loaded.
        justification: |
          The administrator must be told that the impact could not be loaded.
        children:
          - ReviewCenter-UsersPage-DisableImpact-LoadError

      - id: ReviewCenter-Web-SignIn-DisableLoadErrorNoPanel
        title: >-
          The Web subsystem shall open no confirmation of disabling when the impact of disabling cannot be loaded.
        justification: |
          A confirmation without the impact would ask for a decision on what is not known.
        children:
          - ReviewCenter-UsersPage-DisableImpact-NoPanel

      - id: ReviewCenter-Web-SignIn-MakeAdmin
        title: >-
          The Web subsystem shall let a system administrator make a user a system administrator.
        justification: |
          The administration of the tool needs more than one person.
        children:
          - ReviewCenter-UsersPage-SystemAdmin
          - ReviewCenter-UsersPage-SystemAdmin-Outcome

      - id: ReviewCenter-Web-SignIn-TakeAdmin
        title: >-
          The Web subsystem shall let a system administrator take the system administrator role away from a user.
        justification: |
          A role that is no longer needed must be able to go, but the tool keeps at least one enabled system
          administrator.
        children:
          - ReviewCenter-UsersPage-SystemAdmin
          - ReviewCenter-UsersPage-SystemAdmin-Outcome

      - id: ReviewCenter-Web-SignIn-LastAdmin
        title: >-
          The Web subsystem shall show an error when a system administrator tries to disable or demote the last enabled
          system administrator.
        justification: |
          The tool must always keep one enabled administrator, so an action that would remove the last one is refused
          visibly.
        children:
          - ReviewCenter-UsersPage-LastAdmin

      - id: ReviewCenter-Web-SignIn-LastAdminNothingChanged
        title: >-
          The Web subsystem shall change nothing when a system administrator tries to disable or demote the last
          enabled system administrator.
        justification: |
          A refused action must leave every user as it was.
        children:
          - ReviewCenter-UsersPage-LastAdmin-NothingChanged

      - id: ReviewCenter-Web-SignIn-SetPassword
        title: >-
          The Web subsystem shall let a system administrator set the password of a user.
        justification: |
          A user who lost the password must be able to get back in, and the confirmation says what the user has to do
          next.
        children:
          - ReviewCenter-UsersPage-Update-SetPassword
          - ReviewCenter-UsersPage-Update-PasswordCleared
          - ReviewCenter-UsersPage-Update-TemporaryNotice
          - ReviewCenter-UsersPage-Confirmations-PasswordExplained
          - ReviewCenter-UsersPage-Confirmations-PasswordSecondClick

      - id: ReviewCenter-Web-SignIn-SetPasswordOwn
        title: >-
          The Web subsystem shall say, instead of that explanation, that the password is not temporary when the system
          administrator sets the own password.
        justification: |
          A password that the administrator sets for the own account is known to nobody else, so the explanation of a
          temporary password would be wrong.
        children:
          - ReviewCenter-UsersPage-Confirmations-OwnPassword

      - id: ReviewCenter-Web-SignIn-SetPasswordCancel
        title: >-
          The Web subsystem shall change nothing when the confirmation of setting a password is cancelled.
        justification: |
          A person who backs out of the confirmation must find the password as it was.
        children:
          - ReviewCenter-UsersPage-Confirmations-PasswordCancel

      - id: ReviewCenter-Web-SignIn-NewUser
        title: >-
          The Web subsystem shall serve a page at /users/new that creates users.
        justification: |
          Accounts are created in the web interface, so that no command line is needed after the first administrator
          exists.
        children:
          - ReviewCenter-UsersPage-Create
          - ReviewCenter-UsersPage-Create-PasswordCleared
          - ReviewCenter-UsersPage-NewPage
          - ReviewCenter-UsersPage-NewPage-FormOnly
          - ReviewCenter-UsersPage-NewPage-Return

      - id: ReviewCenter-Web-SignIn-NewUserRefused
        title: >-
          The Web subsystem shall show a rule that the new user violates as a message.
        justification: |
          An account that breaks a rule must be refused with the reason.
        children:
          - ReviewCenter-UsersPage-Create-Violation

      - id: ReviewCenter-Web-SignIn-NewUserNothingCreated
        title: >-
          The Web subsystem shall create no user when a rule is violated by the entry for a new user.
        justification: |
          An account that breaks a rule must not be created half-way.
        children:
          - ReviewCenter-UsersPage-Create-NothingCreated

      - id: ReviewCenter-Web-SignIn-NewUserCancel
        title: >-
          The Web subsystem shall offer on the page for creating a user a way back to the list that creates nothing.
        justification: |
          An administrator who does not want a new user must be able to leave without creating one.
        children:
          - ReviewCenter-UsersPage-NewPage-Cancel

      - id: ReviewCenter-Web-SessionEnd
        title: >-
          The Web subsystem shall replace an open protected page whose user is no longer valid by a message that the
          session has ended.
        justification: |
          A page that stays open makes no request, so a user who was disabled, removed, or given another role would
          otherwise keep seeing and changing review data until the page is reloaded. The page is replaced once the
          sign-in state of the page ends, and the component tests of the page units cover the live pages.
        children:
          - ReviewCenter-App-SessionGate-Ended
          - ReviewCenter-App-SessionGate-NoContent
        tests:
          - ReviewPage_Revalidation_UserDisabled_PageStopsShowingAndAcceptingActions
          - UsersPage_Revalidation_AdminDemoted_PageShowsSessionEndedAndNoActions
          - SessionGate_Render_EveryProtectedPageSignedOut_ShowsSessionEndedAndNoPage

      - id: ReviewCenter-Web-SessionEnd-LoginLink
        title: >-
          The Web subsystem shall show in the message that the session has ended a link to the login page that returns
          to the same page.
        justification: |
          A user whose session has ended needs a way to sign in again and to come back to the page.
        children:
          - ReviewCenter-App-SessionGate-LoginLink

      - id: ReviewCenter-Web-SessionEnd-Active
        title: >-
          The Web subsystem shall show the content of a protected page while a user is signed in.
        justification: |
          The gate must let a valid user through, or no protected page could be used at all.
        children:
          - ReviewCenter-App-SessionGate

      - id: ReviewCenter-Web-SessionEnd-ChangeRefused
        title: >-
          The Web subsystem shall refuse every action that changes something on a protected page with a message once
          the sign-in state of the page has ended.
        justification: |
          An event that was already queued when the state ended can still reach a handler of the replaced page, so
          every handler that changes something asks for the current user first. On the pages of a project, the message
          is the one for a project that does not exist.
        tests:
          - NewProjectPage_CreateForm_SessionEndedBeforePageKnows_ShowsClearErrorAndCreatesNothing
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing
          - ReviewPage_ResolveAndReopen_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-Web-SessionEnd-NothingChanged
        title: >-
          The Web subsystem shall save nothing when an action is refused because the sign-in state of the page has
          ended.
        justification: |
          A refused action that still saved something would let a user who is no longer valid change the record.
        tests:
          - NewProjectPage_CreateForm_SessionEndedBeforePageKnows_ShowsClearErrorAndCreatesNothing
          - NewReviewPage_CreateForm_SessionEndedBeforePageKnows_ShowsNotFoundAndCreatesNothing
          - ReviewPage_ResolveAndReopen_SessionEndedBeforePageKnows_ShowsNotFoundAndChangesNothing

      - id: ReviewCenter-Web-SessionEnd-UserAdminRefused
        title: >-
          The Web subsystem shall refuse every action of a user administration page that is no longer made by an
          enabled administrator.
        justification: |
          A user who was demoted must not keep managing users through a page that stays open.
        children:
          - ReviewCenter-UsersPage-AdminCheck
          - ReviewCenter-UsersPage-AdminCheck-NotSignedIn
          - ReviewCenter-UsersPage-AdminCheck-CreateAction
        tests:
          - UsersPage_Revalidation_AdminDemoted_PageShowsSessionEndedAndNoActions

      - id: ReviewCenter-Web-SessionEnd-UserAdminNothingChanged
        title: >-
          The Web subsystem shall change nothing when an action of a user administration page is refused because the
          signed-in user is no longer a system administrator.
        justification: |
          A refusal that still changed something would let a demoted user manage users.
        children:
          - ReviewCenter-UsersPage-AdminCheck-NothingChanged

      - id: ReviewCenter-Web-TestIds
        title: >-
          The Web subsystem shall give every interactive element (link, button, input, select, and text area) of every
          page a stable data-testid attribute.
        justification: |
          Tests that locate elements by visible text or position break whenever wording or layout changes. A stable
          identifier on every interactive element keeps the automated tests and the Puppet tool working as the pages
          evolve.
        children:
          - ReviewCenter-ChecklistPage-Interactive-TestId
          - ReviewCenter-ChecklistPage-Interactive-WarningTestId
        tests:
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId
          - ReviewPage_Render_ThreadControls_EveryInteractiveElementHasTestId
          - ReviewPage_Render_ReviewersCard_EveryInteractiveElementHasTestId

      - id: ReviewCenter-Web-TestIds-Format
        title: >-
          The Web subsystem shall write each data-testid in lowercase hyphenated form.
        justification: |
          A single form lets automated tests and the Puppet tool address an element without guessing its spelling.
        tests:
          - WebSubsystem_AllPages_EveryInteractiveElementHasTestId

      - id: ReviewCenter-Web-TestIds-Unique
        title: >-
          The Web subsystem shall keep each data-testid unique within the page, with the breadcrumb links distinct from
          the header tabs.
        justification: |
          A repeated identifier would make a selector match the wrong element.
        tests:
          - WebSubsystem_AllPages_TestIdsAreUniqueAndBreadcrumbsDistinct

      - id: ReviewCenter-Web-AuditHistory
        title: >-
          The Web subsystem shall show every signed-in user who may see the project of a review the audit entries of
          that review on a history page.
        justification: |
          Participants need to see who did what to a review and when, from the review itself.
        children:
          - ReviewCenter-HistoryPage-Display
          - ReviewCenter-HistoryPage-Display-OnlyReview
          - ReviewCenter-HistoryPage-Display-Columns
          - ReviewCenter-HistoryPage-Display-Empty
          - ReviewCenter-HistoryPage-Display-BackLink
        tests:
          - HistoryPage_Render_ReviewWithEntries_ShowsOnlyItsEntriesNewestFirst
          - Routes_Render_NobodySignedInOpensHistoryRoute_DoesNotShowEntries

      - id: ReviewCenter-Web-AuditHistory-NotFound
        title: >-
          The Web subsystem shall show a message naming the review, and no entries, when the review does not exist.
        justification: |
          The address of a review that does not exist must lead to a clear answer and must not leak entries.
        children:
          - ReviewCenter-HistoryPage-Display-NotFound

      - id: ReviewCenter-Web-AuditHistory-Access
        title: >-
          The Web subsystem shall show no entries for a project that the user may not see, as for a project that does
          not exist, to a visitor who is not signed in, and to a user whose membership was revoked.
        justification: |
          A history that is shown to somebody who may not see the project would reveal the project, its members and
          their actions.
        children:
          - ReviewCenter-HistoryPage-Access
          - ReviewCenter-HistoryPage-Access-Hidden
          - ReviewCenter-HistoryPage-Access-SignedOut
          - ReviewCenter-HistoryPage-Access-Revoked

      - id: ReviewCenter-Web-AuditHistory-Newest
        title: >-
          The Web subsystem shall show the audit entries of a review newest first.
        justification: |
          The latest change is what a reader looks for first.
        children:
          - ReviewCenter-HistoryPage-Display-Newest
        tests:
          - HistoryPage_Render_ReviewWithEntries_ShowsOnlyItsEntriesNewestFirst

      - id: ReviewCenter-Web-AuditHistory-Paging
        title: >-
          The Web subsystem shall show the audit entries of a review 50 to a page.
        justification: |
          A long history must stay quick to load and easy to read.
        children:
          - ReviewCenter-HistoryPage-Paging
          - ReviewCenter-HistoryPage-Paging-Older
          - ReviewCenter-HistoryPage-Paging-Newer

      - id: ReviewCenter-Web-AuditHistory-Link
        title: >-
          The Web subsystem shall let a user reach the history page from the review page.
        justification: |
          The history belongs to the review, so it is reached from the review.
        children:
          - ReviewCenter-ReviewPage-HistoryLink

      - id: ReviewCenter-Web-AuditHistory-PlainText
        title: >-
          The Web subsystem shall show all text of the audit entries as plain text.
        justification: |
          Entries contain text that users typed, and markup in it must not be interpreted.
        children:
          - ReviewCenter-HistoryPage-Access-PlainText

      - id: ReviewCenter-Web-AuditPage
        title: >-
          The Web subsystem shall show system administrators the whole audit trail on an audit page, and nobody else.
        justification: |
          The whole trail names every user and action, so only the people who run the tool may read all of it.
        children:
          - ReviewCenter-AuditPage-Display
          - ReviewCenter-AuditPage-Display-Newest
          - ReviewCenter-AuditPage-Display-Columns
          - ReviewCenter-AuditPage-Display-PageSize
          - ReviewCenter-AuditPage-Display-Empty
          - ReviewCenter-AuditPage-Display-PlainText
          - ReviewCenter-AuditPage-Admin
        tests:
          - Routes_Render_ReviewerOpensAuditRoute_ShowsAccessDeniedNotTrail
          - Routes_Render_AdminOpensAuditRoute_ShowsAuditPage

      - id: ReviewCenter-Web-AuditPage-Paging
        title: >-
          The Web subsystem shall show links to the older and the newer page of the audit trail only when entries exist
          behind them.
        justification: |
          A link that leads to an empty page is useless.
        children:
          - ReviewCenter-AuditPage-Display-Paging

      - id: ReviewCenter-Web-AuditPage-PagingFilter
        title: >-
          The Web subsystem shall carry the filter in the links to the older and the newer page, as escaped query
          values, so that paging stays inside the filtered entries.
        justification: |
          A link that drops the filter would change what is read.
        children:
          - ReviewCenter-AuditPage-Paging
          - ReviewCenter-AuditPage-Paging-Escaped

      - id: ReviewCenter-Web-AuditPage-PagingSize
        title: >-
          The Web subsystem shall carry the page size in the links to the older and the newer page.
        justification: |
          A link that drops the page size would change how much is read.
        children:
          - ReviewCenter-AuditPage-Paging-Size

      - id: ReviewCenter-Web-AuditPage-ShortHash
        title: >-
          The Web subsystem shall show a long hexadecimal value in the detail of an entry shortened to its first 12
          characters followed by an ellipsis.
        justification: |
          A hash makes a row unreadable.
        children:
          - ReviewCenter-AuditPage-ShortHash

      - id: ReviewCenter-Web-AuditPage-ShortHashTooltip
        title: >-
          The Web subsystem shall make the full value of a shortened hexadecimal value available as the tooltip of the
          shortened value.
        justification: |
          The full value must stay available for a check.
        children:
          - ReviewCenter-AuditPage-ShortHash-Tooltip

      - id: ReviewCenter-Web-AuditPage-Refused
        title: >-
          The Web subsystem shall show an error instead of the audit trail to a user who is not an enabled system
          administrator.
        justification: |
          The role of a user can change while a page is open, so the page asks the user store again and reads nothing
          for a user who may no longer read.
        children:
          - ReviewCenter-AuditPage-Admin-Refused

      - id: ReviewCenter-Web-AuditPage-Refused-Role
        title: >-
          The Web subsystem shall decide from the role in the user store, not from the claims of the session, whether a
          user is a system administrator.
        justification: |
          The role of a user can change while a page is open, so the page asks the user store again.
        children:
          - ReviewCenter-AuditPage-Admin-Role

      - id: ReviewCenter-Web-AuditPage-Refused-Disabled
        title: >-
          The Web subsystem shall refuse a system administrator who is disabled in the user store.
        justification: |
          A disabled account must not read the audit trail whatever its role.
        children:
          - ReviewCenter-AuditPage-Admin-Enabled

      - id: ReviewCenter-Web-AuditPage-Refused-NoEntries
        title: >-
          The Web subsystem shall show no entry of the audit trail to a user who is refused.
        justification: |
          An entry that is shown to a refused user would leak the trail.
        children:
          - ReviewCenter-AuditPage-Admin-NoEntries

      - id: ReviewCenter-Web-AuditPage-Refused-NoRead
        title: >-
          The Web subsystem shall read nothing from the audit trail for a user who is refused.
        justification: |
          Reading for a refused user would expose the trail to a later mistake.
        children:
          - ReviewCenter-AuditPage-Admin-NoRead

      - id: ReviewCenter-Web-AuditPage-VerifyRefused
        title: >-
          The Web subsystem shall refuse a verification with an error when the user who presses it is no longer an
          enabled system administrator.
        justification: |
          A verification reads the whole trail, so it needs the same check of the user as the page itself.
        children:
          - ReviewCenter-AuditPage-Admin-Verify

      - id: ReviewCenter-Web-AuditPage-VerifyRefused-NoEntries
        title: >-
          The Web subsystem shall show no entry and no verification result after a refused verification.
        justification: |
          A refused user must learn nothing of the trail from the verification.
        children:
          - ReviewCenter-AuditPage-Admin-VerifyNoEntries

      - id: ReviewCenter-Web-AuditPage-VerifyRefused-NoRead
        title: >-
          The Web subsystem shall read nothing from the audit trail for a refused verification.
        justification: |
          A refused verification must not even touch the trail.
        children:
          - ReviewCenter-AuditPage-Admin-VerifyNoRead

      - id: ReviewCenter-Web-AuditPage-HeaderLink
        title: >-
          The Web subsystem shall let a system administrator reach the audit page from the header.
        justification: |
          The audit trail is checked often by those who run the tool, so it needs a place in the header.
        children:
          - ReviewCenter-App-AuditLink

      - id: ReviewCenter-Web-AuditPage-Verify
        title: >-
          The Web subsystem shall let a system administrator verify the hash chain of the audit trail.
        justification: |
          A trail that cannot be checked proves nothing, so the check is offered next to the trail.
        tests:
          - AuditPage_Verify_IntactChain_ShowsCountAndFullHeadHash

      - id: ReviewCenter-Web-AuditPage-Intact
        title: >-
          The Web subsystem shall show the number of entries of an intact hash chain when a system administrator
          verifies the chain.
        justification: |
          The count tells the system administrator how much of the trail the verification covered.
        children:
          - ReviewCenter-AuditPage-Verify
        tests:
          - AuditPage_Verify_IntactChain_ShowsCountAndFullHeadHash

      - id: ReviewCenter-Web-AuditPage-IntactHeadHash
        title: >-
          The Web subsystem shall show the full head hash of an intact hash chain, not shortened.
        justification: |
          The head hash is what a system administrator records outside the database to detect the later removal of the
          newest entries.
        children:
          - ReviewCenter-AuditPage-Verify-HeadHash
        tests:
          - AuditPage_Verify_IntactChain_ShowsCountAndFullHeadHash

      - id: ReviewCenter-Web-AuditPage-Broken
        title: >-
          The Web subsystem shall show the first broken entry of a broken chain.
        justification: |
          A system administrator who learns that the trail was altered needs to know where to look first.
        children:
          - ReviewCenter-AuditPage-Verify-Broken
        tests:
          - AuditPage_Verify_TamperedChain_ShowsFirstBadEntry

      - id: ReviewCenter-Web-AuditPage-BrokenHeadHash
        title: >-
          The Web subsystem shall show the head hash of the last entry that verified when the hash chain is broken.
        justification: |
          The last verified entry tells where the intact part of the trail ends.
        children:
          - ReviewCenter-AuditPage-Verify-BrokenHeadHash
        tests:
          - AuditPage_Verify_TamperedChain_ShowsFirstBadEntry

      - id: ReviewCenter-Web-AuditPage-Filter
        title: >-
          The Web subsystem shall let a system administrator narrow the audit trail by project, actor, action, review,
          and date.
        justification: |
          A trail is read to answer a question, and the question names a project, a person, an action, or a time.
        children:
          - ReviewCenter-AuditPage-Filter
          - ReviewCenter-AuditPage-Filter-ProjectPage
          - ReviewCenter-AuditPage-Filter-Actor
          - ReviewCenter-AuditPage-Filter-Action
          - ReviewCenter-AuditPage-Filter-Group
          - ReviewCenter-AuditPage-Filter-Review
          - ReviewCenter-AuditPage-Filter-Project
          - ReviewCenter-AuditPage-Filter-Dates
          - ReviewCenter-AuditPage-Filter-PageSize
          - ReviewCenter-AuditPage-Filter-Cut
          - ReviewCenter-AuditPage-Filter-Encoded
          - ReviewCenter-AuditPage-Filter-Clear
          - ReviewCenter-AuditPage-Filter-NoMatch

      - id: ReviewCenter-Web-AuditPage-FilterAddress
        title: >-
          The Web subsystem shall read the choice of the filter from the address and show it in the filter form, so that
          the form and a link to a view are the same.
        justification: |
          A filter that lives in the address can be shared.
        children:
          - ReviewCenter-AuditPage-Filter-Address

      - id: ReviewCenter-Web-AuditPage-FilterAddressFallback
        title: >-
          The Web subsystem shall treat a filter value of the address that cannot be used as no condition instead of
          failing.
        justification: |
          A hand-edited address must not break the page.
        children:
          - ReviewCenter-AuditPage-Filter-Fallback

      - id: ReviewCenter-Web-AuditPage-FilterAddressFallbackSize
        title: >-
          The Web subsystem shall use a page size of 50 when the page size of the address cannot be used.
        justification: |
          A page size that is not offered must not change how much is read.
        children:
          - ReviewCenter-AuditPage-Filter-FallbackSize

      - id: ReviewCenter-Web-AuditPage-FilterReversed
        title: >-
          The Web subsystem shall ignore a range of days that ends before it starts.
        justification: |
          A range that ends before it starts matches nothing, so it is dropped instead of showing an empty trail that
          looks like no activity.
        children:
          - ReviewCenter-AuditPage-Filter-Reversed

      - id: ReviewCenter-Web-AuditPage-FilterReversedMessage
        title: >-
          The Web subsystem shall say that a range of days that ends before it starts is ignored.
        justification: |
          The reader must learn why the range has no effect.
        children:
          - ReviewCenter-AuditPage-Filter-ReversedMessage

      - id: ReviewCenter-Web-AuditPage-ExportCsv
        title: >-
          The Web subsystem shall offer to whoever sees an audit page a link that exports what the filter matches as
          CSV.
        justification: |
          An auditor must be able to take the trail into a spreadsheet.
        children:
          - ReviewCenter-AuditPage-Export

      - id: ReviewCenter-Web-AuditPage-ExportLinks
        title: >-
          The Web subsystem shall point the export links of the whole audit trail to /audit/export and the export links
          of the audit trail of a project to /projects/{project}/audit/export of that project.
        justification: |
          An export must come from the endpoint of the trail that the reader is looking at.
        children:
          - ReviewCenter-AuditPage-Export-GlobalTarget
          - ReviewCenter-AuditPage-Export-ProjectTarget

      - id: ReviewCenter-Web-AuditPage-ExportFilter
        title: >-
          The Web subsystem shall carry the current filter in the export links, and the chosen project in those of the
          whole audit trail, as escaped query values.
        justification: |
          An export must hold what the reader filtered.
        children:
          - ReviewCenter-AuditPage-Export-Filter
          - ReviewCenter-AuditPage-Export-Project
          - ReviewCenter-AuditPage-Export-Escaped

      - id: ReviewCenter-Web-AuditPage-ExportNoPaging
        title: >-
          The Web subsystem shall never carry the page size or the paging cursors in the export links.
        justification: |
          An export must hold all matching entries, so the links carry the filter and not the page.
        children:
          - ReviewCenter-AuditPage-Export-NoPaging

      - id: ReviewCenter-Web-AuditPage-ExportNote
        title: >-
          The Web subsystem shall state next to the export links that the export covers every entry that matches the
          filter, not only the page shown.
        justification: |
          A reader who takes the trail away must know that it is complete.
        children:
          - ReviewCenter-AuditPage-Export-Note

      - id: ReviewCenter-Web-AuditPage-ExportNoteChain
        title: >-
          The Web subsystem shall state next to the export links that the export states whether the audit chain is
          intact.
        justification: |
          A reader who takes the trail away must know whether it can be trusted.
        children:
          - ReviewCenter-AuditPage-Export-Chain

      - id: ReviewCenter-Web-AuditPage-ExportJson
        title: >-
          The Web subsystem shall offer to whoever sees an audit page a link that exports what the filter matches as
          JSON.
        justification: |
          An auditor must be able to take the trail into a tool that reads structured data.
        children:
          - ReviewCenter-AuditPage-Export-Json

      - id: ReviewCenter-Web-AuditPage-ProjectTrail
        title: >-
          The Web subsystem shall show whoever may read the audit trail of a project, a system administrator or a
          project admin of it, the trail of that project only, on a page that is reached from the project page.
        justification: |
          Project admins answer for their project, so they see its trail, and only that.
        children:
          - ReviewCenter-AuditPage-ProjectView
          - ReviewCenter-AuditPage-ProjectView-SystemAdmin
          - ReviewCenter-AuditPage-ProjectView-Newest
          - ReviewCenter-AuditPage-ProjectView-PageSize
          - ReviewCenter-AuditPage-ProjectView-Paging
          - ReviewCenter-AuditPage-ProjectView-Empty
          - ReviewCenter-AuditPage-Filter-ProjectScope
          - ReviewCenter-ProjectPage-Members-AuditLink
        tests:
          - ProjectAuditPage_Render_ProjectAdmin_ShowsOnlyThisProjectsEvents

      - id: ReviewCenter-Web-AuditPage-ProjectTrailAuditor
        title: >-
          The Web subsystem shall show the audit trail of a project on that page to an Auditor of that project, and not
          that of another project.
        justification: |
          An Auditor reads the trail of the project that the role belongs to, and the role gives no view of any other
          project.
        children:
          - ReviewCenter-AuditPage-ProjectView-Auditor

      - id: ReviewCenter-Web-AuditPage-ProjectTrailOnly
        title: >-
          The Web subsystem shall show nobody else the audit trail of a project.
        justification: |
          The trail of a project names its members and their actions, so it is not for other users.
        children:
          - ReviewCenter-AuditPage-ProjectView-NotFoundMember
          - ReviewCenter-AuditPage-ProjectView-NotFoundOutsider
          - ReviewCenter-AuditPage-ProjectView-NotFoundMissing
          - ReviewCenter-ProjectPage-Members-AuditLinkHidden

      - id: ReviewCenter-Web-AuditPage-ProjectTrailLost
        title: >-
          The Web subsystem shall drop the entries and show the not-found message when the access of the user to the
          audit trail of a project ends while the page is open.
        justification: |
          A page that stays open makes no request, so it must stop showing the trail once the access of the user has
          ended.
        children:
          - ReviewCenter-AuditPage-ProjectView-Revoked
          - ReviewCenter-AuditPage-ProjectView-Demoted
          - ReviewCenter-AuditPage-ProjectView-SessionEnded

      - id: ReviewCenter-Web-Repositories
        title: >-
          The Web subsystem shall serve a repositories page at /projects/{project}/repositories, reached from the
          project page, to whoever manages the project.
        justification: |
          A repository belongs to one project and controls what source code the server reads for it. A user who may
          not manage the project is shown the page of a project that does not exist, so the page does not reveal a
          project to its members or to other users.
        children:
          - ReviewCenter-RepositoriesPage-Display
          - ReviewCenter-RepositoriesPage-Display-ProjectOnly
          - ReviewCenter-RepositoriesPage-Display-OptionalFields
          - ReviewCenter-RepositoriesPage-Display-NoDelete
          - ReviewCenter-ProjectPage-RepositoriesLink
        tests:
          - SignIn_RepositoriesPage_NonMemberAndSystemAdmin_OnlyAdminIsServed

      - id: ReviewCenter-Web-Repositories-LinkHidden
        title: >-
          The Web subsystem shall show no Repositories button on the project page to a user who does not administer
          the project.
        justification: |
          A button that leads to a page that the user may not use would only lead to a refusal.
        children:
          - ReviewCenter-ProjectPage-RepositoriesLink-Hidden

      - id: ReviewCenter-Web-Repositories-Register
        title: >-
          The Web subsystem shall let whoever manages a project register a git repository of that project, optionally
          with a token.
        justification: |
          The server reads source code only from repositories that the people who manage the project registered.
        children:
          - ReviewCenter-RepositoriesPage-Create
          - ReviewCenter-RepositoriesPage-Create-Optional
        tests:
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields

      - id: ReviewCenter-Web-Repositories-RegisterRefused
        title: >-
          The Web subsystem shall show a violated rule as an error message when a repository is registered.
        justification: |
          A repository that breaks a rule must be refused with the reason.
        children:
          - ReviewCenter-RepositoriesPage-Create-Violation

      - id: ReviewCenter-Web-Repositories-RegisterNothingCreated
        title: >-
          The Web subsystem shall create no repository when a rule is violated by the registration.
        justification: |
          A repository that breaks a rule must not be half registered.
        children:
          - ReviewCenter-RepositoriesPage-Create-NothingCreated

      - id: ReviewCenter-Web-Repositories-AddPage
        title: >-
          The Web subsystem shall offer on the list an add button that leads to a separate page that holds only the
          form that registers a repository.
        justification: |
          A form of its own keeps the list short and keeps the entry of a token away from the list.
        children:
          - ReviewCenter-RepositoriesPage-AddPage
          - ReviewCenter-RepositoriesPage-AddPage-NoFormOnList
          - ReviewCenter-RepositoriesPage-AddPage-FormOnly
          - ReviewCenter-RepositoriesPage-AddPage-Cancel
          - ReviewCenter-RepositoriesPage-AddPage-Return

      - id: ReviewCenter-Web-Repositories-Change
        title: >-
          The Web subsystem shall let whoever manages a project change a repository.
        justification: |
          A repository moves or is renamed, and the registration must follow without a new one.
        children:
          - ReviewCenter-RepositoriesPage-Edit
          - ReviewCenter-RepositoriesPage-Edit-KeepToken
          - ReviewCenter-RepositoriesPage-Edit-Cancel

      - id: ReviewCenter-Web-Repositories-Disable
        title: >-
          The Web subsystem shall let whoever manages a project disable a repository.
        justification: |
          A repository that must no longer be read can be switched off without losing its registration.
        children:
          - ReviewCenter-RepositoriesPage-Enable

      - id: ReviewCenter-Web-Repositories-Enable
        title: >-
          The Web subsystem shall let whoever manages a project enable a repository.
        justification: |
          A repository that was switched off must be able to come back.
        children:
          - ReviewCenter-RepositoriesPage-Enable

      - id: ReviewCenter-Web-Repositories-TokenReplace
        title: >-
          The Web subsystem shall let whoever manages a project replace the token of a repository.
        justification: |
          A token expires or leaks, and it must be replaceable without registering the repository again.
        children:
          - ReviewCenter-RepositoriesPage-Edit-ReplaceToken

      - id: ReviewCenter-Web-Repositories-TokenClear
        title: >-
          The Web subsystem shall let whoever manages a project clear the token of a repository.
        justification: |
          A repository that no longer needs a token must not keep a secret that nobody uses.
        children:
          - ReviewCenter-RepositoriesPage-Edit-ClearToken

      - id: ReviewCenter-Web-Repositories-TokenHidden
        title: >-
          The Web subsystem shall never show a stored repository token again.
        justification: |
          A token that can be read back from a page can be copied or leaked, so it is write-only.
        children:
          - ReviewCenter-RepositoriesPage-Display-NoToken
          - ReviewCenter-RepositoriesPage-Edit-NoStoredToken
          - ReviewCenter-RepositoriesPage-Create-TokenCleared
        tests:
          - NewRepositoryPage_CreateForm_WithToken_StoresItWriteOnlyAndClearsFields

      - id: ReviewCenter-Web-Repositories-NoRegistry
        title: >-
          The Web subsystem shall have no registry of repositories outside the projects.
        justification: |
          A repository belongs to one project, so no page lists the repositories of all projects.
        children:
          - ReviewCenter-App-NoRepositoriesLink
          - ReviewCenter-HomePage-AdminLinks-NoRepositories

      - id: ReviewCenter-Web-RepositoryReviews
        title: >-
          The Web subsystem shall let a user create a review from a git repository on the project page, with a head
          revision, an optional baseline revision, and a selection.
        justification: |
          Reviewing a change means seeing what it replaces, so a review can start from a repository and a baseline.
        children:
          - ReviewCenter-ProjectPage-SourceChoice
          - ReviewCenter-ProjectPage-RepositoryForm-Revisions
          - ReviewCenter-ProjectPage-RepositoryForm-Creates
          - ReviewCenter-ProjectPage-RepositoryForm-NoBaseline
        tests:
          - NewReviewPage_CreateForm_FromRepository_CreatesReviewWithSourceAndNavigates

      - id: ReviewCenter-Web-RepositoryReviews-SkippedEntries
        title: >-
          The Web subsystem shall list the skipped links and submodules with a link to the review, and not open the
          review at once, when the baseline skips entries.
        justification: |
          A reviewer must learn which entries of the baseline were left out before the review is relied on.
        children:
          - ReviewCenter-ProjectPage-RepositoryForm-SkippedEntries

      - id: ReviewCenter-Web-RepositoryReviews-EnabledOnly
        title: >-
          The Web subsystem shall offer, for the source of a new review, the enabled repositories of the project by
          name.
        justification: |
          A disabled repository must not be read, and the page never shows how the server reaches a repository.
        children:
          - ReviewCenter-ProjectPage-RepositoryForm
          - ReviewCenter-ProjectPage-SourceChoice-RepositoryOffered

      - id: ReviewCenter-Web-RepositoryReviews-NoRepository
        title: >-
          The Web subsystem shall say, when no repository of the project is enabled, that the project has no
          repository and that one must be registered.
        justification: |
          A user who finds no repository to choose needs to be told what to do next.
        children:
          - ReviewCenter-ProjectPage-SourceChoice-NoRepositoryHint

      - id: ReviewCenter-Web-RepositoryReviews-Reason
        title: >-
          The Web subsystem shall show the reason when a review from a repository cannot be created.
        justification: |
          A user who is refused must be told why, in words and not as raw git output.
        children:
          - ReviewCenter-ProjectPage-RepositoryError
          - ReviewCenter-ProjectPage-RepositoryError-BadRevision
          - ReviewCenter-ProjectPage-RepositoryError-NoneChosen
          - ReviewCenter-ProjectPage-RepositoryError-Disabled

      - id: ReviewCenter-Web-RepositoryReviews-ChangeKind
        title: >-
          The Web subsystem shall show on the review page the change kind of each file.
        justification: |
          A reviewer must see at once which files were added, changed, or deleted.
        children:
          - ReviewCenter-ReviewPage-Source

      - id: ReviewCenter-Web-RepositoryReviews-UploadNoKind
        title: >-
          The Web subsystem shall show no change kind for the files of an uploaded review.
        justification: |
          An uploaded review has no baseline to compare with, so a kind would claim a change that is not known.
        children:
          - ReviewCenter-ReviewPage-Source-UploadNoKind

      - id: ReviewCenter-Web-RepositoryReviews-Source
        title: >-
          The Web subsystem shall show the repository name, the baseline and head commit identifiers and the selection
          in the Details section of a review from a repository.
        justification: |
          A reader must know which repository and revisions the review is about.
        children:
          - ReviewCenter-ReviewPage-Source-Details
        tests:
          - NewReviewPage_CreateForm_FromRepository_CreatesReviewWithSourceAndNavigates

      - id: ReviewCenter-Web-RepositoryReviews-Source-Upload
        title: >-
          The Web subsystem shall show no repository name, commit identifiers or selection in the Details section of
          an uploaded review.
        justification: |
          An uploaded review has no repository behind it, so the page must not invent a source for it.
        children:
          - ReviewCenter-ReviewPage-Source-UploadNoDetails

      - id: ReviewCenter-Web-RepositoryReviews-DiffView
        title: >-
          The Web subsystem shall offer, for a file of a review with a baseline, a choice of the Diff view.
        justification: |
          Reviewing a change means seeing what it replaces.
        children:
          - ReviewCenter-ReviewPage-Versions
          - ReviewCenter-ReviewPage-Versions-NextFile
          - ReviewCenter-ReviewPage-Versions-AddedFile
          - ReviewCenter-ReviewPage-Versions-DeletedFile
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-Web-RepositoryReviews-HeadVersion
        title: >-
          The Web subsystem shall offer, for a file of a review with a baseline, the Head version, and not for a
          deleted file.
        justification: |
          The page keeps the full text one click away, and a deleted file has no head version to show.
        children:
          - ReviewCenter-ReviewPage-Versions-Head
          - ReviewCenter-ReviewPage-Versions-AddedFile
          - ReviewCenter-ReviewPage-Versions-DeletedFile
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-Web-RepositoryReviews-BaselineVersion
        title: >-
          The Web subsystem shall offer, for a file of a review with a baseline, a read-only Baseline version, and not
          for an added file.
        justification: |
          The page keeps the replaced text one click away, and an added file has no baseline version to show.
        children:
          - ReviewCenter-ReviewPage-Versions-Baseline
          - ReviewCenter-ReviewPage-Versions-AddedFile
          - ReviewCenter-ReviewPage-Versions-DeletedFile
          - ReviewCenter-ReviewPage-Versions-DeletedContent
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-Web-RepositoryReviews-HeadOnly
        title: >-
          The Web subsystem shall show a file of an uploaded review, or of a review without a baseline commit, as the
          Head version only, with no choice.
        justification: |
          Without a baseline there is nothing to compare with, so offering a choice would only confuse the reader.
        children:
          - ReviewCenter-ReviewPage-Versions-HeadOnly

      - id: ReviewCenter-Web-RepositoryReviews-VersionSwitch
        title: >-
          The Web subsystem shall keep the text of the file and clear the line selection when the reader switches
          between versions.
        justification: |
          A reader who changes the view must not lose the place in the file, and a selection of lines that are no longer
          shown must not linger.
        children:
          - ReviewCenter-ReviewPage-Versions-Switch

      - id: ReviewCenter-Web-RepositoryReviews-DeletedFileComment
        title: >-
          The Web subsystem shall accept for a deleted file a comment on the whole file only.
        justification: |
          A deleted file has no head lines to point at, so a comment can only be about the file as a whole.
        children:
          - ReviewCenter-ReviewPage-Versions-DeletedComment

      - id: ReviewCenter-Web-DiffReview
        title: >-
          The Web subsystem shall show a changed file of a review from a repository as a side-by-side diff on the
          review page.
        justification: |
          Reviewers judge a change by reading what changed.
        children:
          - ReviewCenter-ReviewPage-Diff
          - ReviewCenter-ReviewPage-Diff-PlainText
          - ReviewCenter-ReviewPage-Diff-Unchanged
          - ReviewCenter-ReviewPage-Diff-Pairing
          - ReviewCenter-ReviewPage-Diff-AddedFile
          - ReviewCenter-ReviewPage-Diff-DeletedFile
          - ReviewCenter-ReviewPage-Diff-Marks
          - ReviewCenter-ReviewPage-Diff-Colors
          - ReviewCenter-ReviewPage-Diff-Summary
          - ReviewCenter-ReviewPage-Diff-NoRows
        tests:
          - ReviewPage_FileSelect_ModifiedFile_TogglesBetweenDiffHeadAndReadOnlyBaseline

      - id: ReviewCenter-Web-DiffReview-Collapsed
        title: >-
          The Web subsystem shall collapse the unchanged lines of a diff.
        justification: |
          The lines that did not change would bury the lines that did.
        children:
          - ReviewCenter-ReviewPage-Diff-Collapsed

      - id: ReviewCenter-Web-DiffReview-ScrollToChange
        title: >-
          The Web subsystem shall bring the first change into view when a file opens on its Diff view.
        justification: |
          A reader who opens a long file wants to see what changed without scrolling to look for it.
        children:
          - ReviewCenter-ReviewPage-Diff-ScrollToChange

      - id: ReviewCenter-Web-DiffReview-LineComment
        title: >-
          The Web subsystem shall let a signed-in user comment on a line of either version of a diff.
        justification: |
          A comment belongs to the line that it is about, whether the line is in the old or the new version. The
          subsystem tests guard the stylesheet rules that show the comment control.
        children:
          - ReviewCenter-ReviewPage-DiffComment
          - ReviewCenter-ReviewPage-DiffComment-Baseline
          - ReviewCenter-ReviewPage-DiffComment-Head
          - ReviewCenter-ReviewPage-DiffComment-PlainWords
          - ReviewCenter-ReviewPage-DiffComment-ShiftClick
          - ReviewCenter-ReviewPage-DiffComment-ThroughLine
          - ReviewCenter-ReviewPage-DiffComment-Focus
          - ReviewCenter-ReviewPage-Diff-Hint
        tests:
          - WebSubsystem_Stylesheet_DiffCommentControl_ShowsOnHoverFocusAndTouch
          - WebSubsystem_Stylesheet_TransparentButtons_OverrideTheGlobalHoverFill

      - id: ReviewCenter-Web-DiffReview-CommentForm
        title: >-
          The Web subsystem shall offer in the comment form of the Diff view a whole-file comment that keeps the typed
          text.
        justification: |
          A reader who started on a line may decide that the remark is about the file, and must not lose the text.
        children:
          - ReviewCenter-ReviewPage-DiffComment-WholeFile

      - id: ReviewCenter-Web-DiffReview-CommentFormCancel
        title: >-
          The Web subsystem shall close the comment form of the Diff view and clear the selection when Cancel is
          chosen.
        justification: |
          A reader who gives up must not be left with a stale selection.
        children:
          - ReviewCenter-ReviewPage-DiffComment-Cancel

      - id: ReviewCenter-Web-DiffReview-LineThreads
        title: >-
          The Web subsystem shall show the threads of a diff under their rows.
        justification: |
          A reader sees the discussion next to the line that it is about.
        children:
          - ReviewCenter-ReviewPage-DiffThreads
          - ReviewCenter-ReviewPage-DiffThreads-FirstLine
          - ReviewCenter-ReviewPage-DiffThreads-Collapsed
          - ReviewCenter-ReviewPage-DiffThreads-Highlight
          - ReviewCenter-ReviewPage-DiffThreads-Resolved
          - ReviewCenter-ReviewPage-DiffThreads-Controls

      - id: ReviewCenter-Web-DiffReview-FileThreads
        title: >-
          The Web subsystem shall list the whole-file threads of a file below its Diff view.
        justification: |
          A remark about a whole file has no line to sit under.
        children:
          - ReviewCenter-ReviewPage-DiffThreads-WholeFileOnly

      - id: ReviewCenter-Web-DiffReview-FileThreadsCounts
        title: >-
          The Web subsystem shall count the open threads of both sides of a file in the file list.
        justification: |
          The reader needs to see in the file list where open discussions wait.
        children:
          - ReviewCenter-ReviewPage-DiffThreads-Counts

      - id: ReviewCenter-Web-DiffReview-Unavailable
        title: >-
          The Web subsystem shall say in plain words when a comparison cannot be shown.
        justification: |
          A reader who sees no diff must be told why instead of seeing an empty page.
        children:
          - ReviewCenter-ReviewPage-DiffStates
          - ReviewCenter-ReviewPage-DiffStates-Versions
          - ReviewCenter-ReviewPage-DiffStates-Binary
          - ReviewCenter-ReviewPage-DiffStates-LineEndings

      - id: ReviewCenter-Web-DiffReview-PhoneLayout
        title: >-
          The Web subsystem shall keep a diff inside the width of a phone by stacking its two sides.
        justification: |
          A page that scrolls sideways is hard to read on a phone. The subsystem test guards the stylesheet rules that
          keep the code scrolling inside itself.
        tests:
          - WebSubsystem_Stylesheet_DiffRules_KeepCodeScrollingInsideItself

      - id: ReviewCenter-Web-DeepLinks
        title: >-
          The Web subsystem shall give every file, line, and thread of a review a stable address that opens the review
          page at that place.
        justification: |
          Review is a conversation between people, so a reviewer must be able to point a colleague at one file, one
          line, or one thread by sending a link. The subsystem test guards the style of the link to a thread.
        children:
          - ReviewCenter-ReviewPage-DeepLinks
          - ReviewCenter-ReviewPage-DeepLinks-Line
          - ReviewCenter-ReviewPage-DeepLinks-BaselineLine
          - ReviewCenter-ReviewPage-DeepLinks-Thread
          - ReviewCenter-ReviewPage-DeepLinks-ThreadScroll
          - ReviewCenter-ReviewPage-DeepLinks-BaselineThread
          - ReviewCenter-ReviewPage-DeepLinks-ResolvedThread
          - ReviewCenter-ReviewPage-DeepLinks-ThreadCounts
          - ReviewCenter-ReviewPage-DeepLinks-BuildReview
          - ReviewCenter-ReviewPage-DeepLinks-BuildLine
          - ReviewCenter-ReviewPage-DeepLinks-BuildThread
          - ReviewCenter-ReviewPage-DeepLinks-Escaping
          - ReviewCenter-ReviewPage-DeepLinks-RoundTrip
          - ReviewCenter-ReviewPage-DeepLinks-LocalOnly
        tests:
          - WebSubsystem_Stylesheet_ThreadLink_IsButtonStyled

      - id: ReviewCenter-Web-DeepLinks-AddressBar
        title: >-
          The Web subsystem shall keep the address bar equal to what is shown as the reader chooses files and threads.
        justification: |
          A link that the reader copies from the address bar must open what the reader sees.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-ReplaceAddress

      - id: ReviewCenter-Web-DeepLinks-AddressBar-Opened
        title: >-
          The Web subsystem shall leave the address of the browser as it is when the review page opens an address.
        justification: |
          An address that the reader opened is already the right one, and rewriting it would add a needless step to
          the history of the browser.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-KeepAddress

      - id: ReviewCenter-Web-DeepLinks-ThreadLink
        title: >-
          The Web subsystem shall show on every thread a link to its address.
        justification: |
          A reviewer who wants to point a colleague at one thread needs the address at hand. The subsystem test guards
          the style of the link to a thread.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-ThreadLink
        tests:
          - WebSubsystem_Stylesheet_ThreadLink_IsButtonStyled

      - id: ReviewCenter-Web-DeepLinks-ThreadLinkCopy
        title: >-
          The Web subsystem shall show on every thread a Copy link button that copies the absolute address of the
          thread to the clipboard.
        justification: |
          A reviewer should not have to build the address from the address bar.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-CopyButton
          - ReviewCenter-ReviewPage-DeepLinks-CopyLink

      - id: ReviewCenter-Web-DeepLinks-ThreadLinkCopyConfirm
        title: >-
          The Web subsystem shall confirm a copy of the thread address with the message "Copied" until two seconds
          after the latest click.
        justification: |
          A copy to the clipboard shows nothing by itself, so the reader needs a short confirmation.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-CopyConfirm
          - ReviewCenter-ReviewPage-DeepLinks-CopyTiming

      - id: ReviewCenter-Web-DeepLinks-CopyFailed
        title: >-
          The Web subsystem shall report "Copy failed" when the clipboard refuses the copy of a thread address.
        justification: |
          A reviewer who pressed Copy link must not believe that the address was copied when the browser refused.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-CopyFailed

      - id: ReviewCenter-Web-DeepLinks-NullArgument
        title: >-
          The Web subsystem shall throw an argument-null exception when an address is built from a null argument.
        justification: |
          A missing value is a fault of the caller and must stop at once instead of producing a broken address.
        children:
          - ReviewCenter-ReviewPage-DeepLinks-NullArguments

      - id: ReviewCenter-Web-DeepLinks-NotFound
        title: >-
          The Web subsystem shall answer an address that names nothing in the review with a message in the page and not
          with an error page.
        justification: |
          A stale or mistyped link is common, and the reader must meet a message instead of an error page.
        children:
          - ReviewCenter-ReviewPage-DeepLinksNotFound
          - ReviewCenter-ReviewPage-DeepLinksNotFound-NoErrorPage

      - id: ReviewCenter-Web-DeepLinks-NotFoundWayBack
        title: >-
          The Web subsystem shall show with the not-found message a link back to the file list of the review.
        justification: |
          The reader must be able to carry on with the review from the same page.
        children:
          - ReviewCenter-ReviewPage-DeepLinksNotFound-WayBack

      - id: ReviewCenter-Web-DeepLinks-NotFoundFileList
        title: >-
          The Web subsystem shall keep the file list working when it shows the not-found message.
        justification: |
          A file list that stops working would leave the reader stuck on the message.
        children:
          - ReviewCenter-ReviewPage-DeepLinksNotFound-FileList

      - id: ReviewCenter-Web-DeepLinks-NotFoundCleared
        title: >-
          The Web subsystem shall clear the not-found message when the reader chooses a file.
        justification: |
          A message about an address that was left must not stay on the page.
        children:
          - ReviewCenter-ReviewPage-DeepLinksNotFound-Cleared

      - id: ReviewCenter-Web-DeepLinks-UnknownSide
        title: >-
          The Web subsystem shall read an unknown side in the address of a line as the head and show no message.
        justification: |
          A side that the page does not know is most likely a typing slip, and the line of the head is the best guess
          that keeps the link useful.
        children:
          - ReviewCenter-ReviewPage-DeepLinksNotFound-UnknownSide

      - id: ReviewCenter-Web-DeepLinks-ReturnAfterSignIn
        title: >-
          The Web subsystem shall bring a signed-out visitor back to the same address after signing in.
        justification: |
          The link must still work after a sign-in, so the address survives the login page.
        children:
          - ReviewCenter-SignIn-ReturnDeepLink
          - ReviewCenter-SignIn-ReturnDeepLink-ExactEncoding
        tests:
          - Routes_DeepLink_SignedOut_LoginLinkKeepsEscapesAndQuery

      - id: ReviewCenter-Web-DeepLinks-FirstResponse
        title: >-
          The Web subsystem shall answer the first request for the address of a thread with the page that shows the
          file of the thread and the highlighted thread.
        justification: |
          A colleague who opens a shared link must see the thread at once, so the server-rendered first response
          already holds the file and the highlighted thread instead of waiting for the browser to run code.
        tests:
          - ReviewPage_ThreadAddress_OverHttp_RendersFileAndHighlightedThread

      - id: ReviewCenter-Web-PlanReviews
        title: >-
          The Web subsystem shall let a user plan the reviews that a head revision of a repository of the project needs
          on a plan page that is reached from the project page.
        justification: |
          Planning is useful only when a user can start it from the project and read the answer without raw git output.
        children:
          - ReviewCenter-PlanPage-Form
          - ReviewCenter-PlanPage-Form-ProjectName
          - ReviewCenter-PlanPage-Form-EnabledOnly
          - ReviewCenter-PlanPage-Form-NoSecrets
          - ReviewCenter-PlanPage-Form-Head
          - ReviewCenter-PlanPage-Form-Baseline
          - ReviewCenter-PlanPage-Form-BaselineDefault
          - ReviewCenter-PlanPage-Form-BaselineInput
          - ReviewCenter-ProjectPage-PlanLink
        tests:
          - PlanPage_Create_TickedRows_ShowsResultWithLinksAndCreatesReviews
          - PlanPage_ShowPlan_SetsNeedingReview_ShowsSummaryTickedRowsAndCollapsedEmpties

      - id: ReviewCenter-Web-PlanReviews-LinkUnavailable
        title: >-
          The Web subsystem shall show no Plan reviews link on the project page, with a note that says whom to ask,
          when no repository of the project is enabled.
        justification: |
          A link that leads to a plan that cannot be made would only frustrate the user, and the note tells the user
          who can enable a repository.
        children:
          - ReviewCenter-ProjectPage-PlanLink-Unavailable
          - ReviewCenter-ProjectPage-PlanLink-Disabled

      - id: ReviewCenter-Web-PlanReviews-NoForm
        title: >-
          The Web subsystem shall show a plain message that names the project, instead of the plan form, for a project
          that does not exist.
        justification: |
          A plan needs a project, so an address that names no such project must end in a plain message and not in an
          empty form.
        children:
          - ReviewCenter-PlanPage-Form-NotFound

      - id: ReviewCenter-Web-PlanReviews-NoRepository
        title: >-
          The Web subsystem shall show a plain message that names whom to ask, instead of the plan form, for a project
          that has no repository.
        justification: |
          A plan needs a repository, and the user must learn whom to ask for one.
        children:
          - ReviewCenter-PlanPage-Form-NoRepository

      - id: ReviewCenter-Web-PlanReviews-Incomplete
        title: >-
          The Web subsystem shall say what is missing when a plan is requested with an incomplete form.
        justification: |
          A user who forgot a field must be told which one.
        children:
          - ReviewCenter-PlanPage-Form-MissingRepository
          - ReviewCenter-PlanPage-Form-MissingHead
          - ReviewCenter-PlanPage-Form-MissingBaseline

      - id: ReviewCenter-Web-PlanReviews-IncompleteNoGitRead
        title: >-
          The Web subsystem shall read nothing from the repository when a plan is requested with an incomplete form.
        justification: |
          A half-filled request must not make the server run git.
        children:
          - ReviewCenter-PlanPage-Form-NoGitRead

      - id: ReviewCenter-Web-PlanReviews-Reset
        title: >-
          The Web subsystem shall discard the plan when the head revision, the baseline choice, the repository or the
          baseline revision of the form changes.
        justification: |
          A plan that was made for other inputs would mislead the user into creating reviews that no longer match the
          form.
        children:
          - ReviewCenter-PlanPage-State
          - ReviewCenter-PlanPage-State-Mode
          - ReviewCenter-PlanPage-State-Repository
          - ReviewCenter-PlanPage-State-BaselineRevision

      - id: ReviewCenter-Web-PlanReviews-Reset-Error
        title: >-
          The Web subsystem shall discard a shown error when the form of the plan page changes.
        justification: |
          An error about an earlier input would mislead the user about the new input.
        children:
          - ReviewCenter-PlanPage-State-Error

      - id: ReviewCenter-Web-PlanReviews-ProjectSwitch
        title: >-
          The Web subsystem shall clear the form, the plan and the results of created reviews when the plan page is
          reused for another project.
        justification: |
          The plan page is reused when the user moves between projects, and nothing of one project may show in or be
          created for another.
        children:
          - ReviewCenter-PlanPage-State-Project
          - ReviewCenter-PlanPage-State-ProjectResults

      - id: ReviewCenter-Web-PlanReviews-ProjectSwitchLateAnswer
        title: >-
          The Web subsystem shall ignore a plan or the results of creating that arrive after the plan page was reused
          for another project.
        justification: |
          A slow answer for the former project must not appear under the new one.
        children:
          - ReviewCenter-PlanPage-State-StaleRead
          - ReviewCenter-PlanPage-State-StaleCreate

      - id: ReviewCenter-Web-PlanReviews-ProjectSwitchFreeForm
        title: >-
          The Web subsystem shall leave the form of the new project usable after a late answer of the former project
          was ignored.
        justification: |
          Ignoring a late answer must not leave the form of the new project locked.
        children:
          - ReviewCenter-PlanPage-State-FreeForm

      - id: ReviewCenter-Web-PlanReviews-Busy
        title: >-
          The Web subsystem shall say that the repository is being read while it is read.
        justification: |
          Reading a repository and creating reviews take time, and a second click in the meantime would start the work
          twice.
        children:
          - ReviewCenter-PlanPage-State-Loading

      - id: ReviewCenter-Web-PlanReviews-Busy-ReadDisabled
        title: >-
          The Web subsystem shall disable the form while the repository is read.
        justification: |
          A second click while the repository is read would start the work twice.
        children:
          - ReviewCenter-PlanPage-State-ReadDisabled

      - id: ReviewCenter-Web-PlanReviews-Busy-CreateDisabled
        title: >-
          The Web subsystem shall disable the form while the reviews are created.
        justification: |
          A second click while the reviews are created would create them twice.
        children:
          - ReviewCenter-PlanPage-State-CreateDisabled

      - id: ReviewCenter-Web-PlanReviews-Interactive
        title: >-
          The Web subsystem shall report through a marker on its root element that the plan page is interactive once
          it has rendered on a live connection.
        justification: |
          Automated checks and users of assistive tools need a signal that the page now reacts to input.
        children:
          - ReviewCenter-PlanPage-Interactive

      - id: ReviewCenter-Web-PlanReviews-HelpTopic
        title: >-
          The Web subsystem shall explain in the Planning reviews topic the default baseline, what counts as an
          approved review, and the full review of a set without an approved review.
        justification: |
          A user who plans reviews must understand which earlier review the plan compares with and why a set gets a
          full review.
        children:
          - ReviewCenter-HelpPage-PlanningTopic
          - ReviewCenter-HelpPage-PlanningTopic-Approved
          - ReviewCenter-HelpPage-PlanningTopic-NoApproved

      - id: ReviewCenter-Web-PlanReviews-Summary
        title: >-
          The Web subsystem shall show one plain summary of the plan on the plan page.
        justification: |
          A user must read the answer at a glance.
        children:
          - ReviewCenter-PlanPage-Summary
          - ReviewCenter-PlanPage-Summary-Facts
          - ReviewCenter-PlanPage-Summary-NextStep
        tests:
          - PlanPage_ShowPlan_SetsNeedingReview_ShowsSummaryTickedRowsAndCollapsedEmpties

      - id: ReviewCenter-Web-PlanReviews-Ordering
        title: >-
          The Web subsystem shall show the sets that need a review first and ticked on the plan page.
        justification: |
          The sets that need action are what the user came for, so they lead and are ready to be created.
        children:
          - ReviewCenter-PlanPage-Rows
          - ReviewCenter-PlanPage-Rows-First
        tests:
          - PlanPage_ShowPlan_SetsNeedingReview_ShowsSummaryTickedRowsAndCollapsedEmpties

      - id: ReviewCenter-Web-PlanReviews-EmptySets
        title: >-
          The Web subsystem shall show the sets with nothing to review collapsed on the plan page.
        justification: |
          Sets with nothing to do would bury the sets that need action.
        children:
          - ReviewCenter-PlanPage-Rows-EmptySets
          - ReviewCenter-PlanPage-Rows-HiddenGroups
        tests:
          - PlanPage_ShowPlan_SetsNeedingReview_ShowsSummaryTickedRowsAndCollapsedEmpties

      - id: ReviewCenter-Web-PlanReviews-RowDetails
        title: >-
          The Web subsystem shall show for each set that needs a review its title as plain text, where its baseline
          comes from and the counts of added, modified and deleted files.
        justification: |
          The user decides whether to create a review from what the row says, and a title that came from a repository
          must never be read as markup.
        children:
          - ReviewCenter-PlanPage-Rows-Details
          - ReviewCenter-PlanPage-Rows-Counts
          - ReviewCenter-PlanPage-Rows-PlainTitle

      - id: ReviewCenter-Web-PlanReviews-BulkSelection
        title: >-
          The Web subsystem shall offer select all and select none only for more than three rows that need a review.
        justification: |
          A few rows can be ticked by hand, and the shortcut is worth its place on the page only for a longer list.
        children:
          - ReviewCenter-PlanPage-Rows-BulkSelection

      - id: ReviewCenter-Web-PlanReviews-OtherSets
        title: >-
          The Web subsystem shall show the sets that are already filed with a link to their review.
        justification: |
          A user must see why a set is not offered for creation when the review exists, and must be able to open it.
        children:
          - ReviewCenter-PlanPage-Rows-FiledSets

      - id: ReviewCenter-Web-PlanReviews-ProblemSets
        title: >-
          The Web subsystem shall show the sets that cannot be planned with the reason as plain text, and without a
          checkbox.
        justification: |
          A user must see why a set is not offered for creation, in words that tell what to correct, and must not be
          able to tick it.
        children:
          - ReviewCenter-PlanPage-Rows-ProblemSets
          - ReviewCenter-PlanPage-Rows-PlainReason

      - id: ReviewCenter-Web-PlanReviews-Create
        title: >-
          The Web subsystem shall create the ticked reviews of a plan and show a result per review.
        justification: |
          The user must see which reviews were created and which were not.
        children:
          - ReviewCenter-PlanPage-Create
          - ReviewCenter-PlanPage-Create-Disabled
          - ReviewCenter-PlanPage-Create-TickedOnly
          - ReviewCenter-PlanPage-Create-FromPlanCommit
          - ReviewCenter-PlanPage-Create-Results
          - ReviewCenter-PlanPage-Create-ResultCreated
          - ReviewCenter-PlanPage-Create-PlanAgain
          - ReviewCenter-PlanPage-Create-BackLink
        tests:
          - PlanPage_Create_TickedRows_ShowsResultWithLinksAndCreatesReviews

      - id: ReviewCenter-Web-PlanReviews-RowFailed
        title: >-
          The Web subsystem shall show a review that could not be created as failed, with the reason.
        justification: |
          A user needs to know which review failed and why.
        children:
          - ReviewCenter-PlanPage-Create-ResultFailed

      - id: ReviewCenter-Web-PlanReviews-RowFailedNoGitText
        title: >-
          The Web subsystem shall never show the text printed by git in a result of creating reviews.
        justification: |
          The output of git would not help the user and may expose details of the server.
        children:
          - ReviewCenter-PlanPage-Create-NoGitText

      - id: ReviewCenter-Web-PlanReviews-RowFailedKeeps
        title: >-
          The Web subsystem shall continue with the other ticked rows when one row fails.
        justification: |
          One bad set must not stop the work for the others.
        children:
          - ReviewCenter-PlanPage-Create-FailedKeepsOthers

      - id: ReviewCenter-Web-PlanReviews-RowFailedKeepsEarlier
        title: >-
          The Web subsystem shall keep the reviews already created when a later row fails.
        justification: |
          One bad set must not undo the work already done or leave the user to repeat it.
        children:
          - ReviewCenter-PlanPage-Create-FailedKeepsEarlier

      - id: ReviewCenter-Web-PlanReviews-Refused
        title: >-
          The Web subsystem shall show the error next to the create button when the whole batch is refused.
        justification: |
          A user who pressed Create must find the reason where the button is.
        children:
          - ReviewCenter-PlanPage-Create-Refused

      - id: ReviewCenter-Web-PlanReviews-RefusedNothing
        title: >-
          The Web subsystem shall create no review when the whole batch is refused.
        justification: |
          A refused batch must leave nothing half done.
        children:
          - ReviewCenter-PlanPage-Create-RefusedCreatesNothing

      - id: ReviewCenter-Web-PlanReviews-RefusedKeepsPlan
        title: >-
          The Web subsystem shall keep the plan and its ticks when the whole batch is refused.
        justification: |
          The user must be able to correct the cause and press Create again without planning anew.
        children:
          - ReviewCenter-PlanPage-Create-RefusedKeepsPlan

      - id: ReviewCenter-Web-PlanReviews-Failures
        title: >-
          The Web subsystem shall explain every failure of planning in plain English.
        justification: |
          Raw git output does not tell a user what to do next.
        children:
          - ReviewCenter-PlanPage-Error
          - ReviewCenter-PlanPage-Error-NoConfig
          - ReviewCenter-PlanPage-Error-NoConfigLink
          - ReviewCenter-PlanPage-Error-InvalidConfig
          - ReviewCenter-PlanPage-Error-Disabled
          - ReviewCenter-PlanPage-Error-Unreadable
          - ReviewCenter-PlanPage-Error-Unexpected
          - ReviewCenter-PlanPage-Error-NoPlan

      - id: ReviewCenter-Web-PlanReviews-NoLeak
        title: >-
          The Web subsystem shall show no repository location, credential, text of git, text of a fault or stack trace
          in the message of a failed plan.
        justification: |
          A message that is read by many users must not hand out where the server reads from, how it signs in, or how
          it failed inside.
        children:
          - ReviewCenter-PlanPage-Error-DisabledNoSecrets
          - ReviewCenter-PlanPage-Error-UnreadableNoGitText
          - ReviewCenter-PlanPage-Error-UnexpectedNoDetail

      - id: ReviewCenter-Web-PlanReviews-ReviewSet
        title: >-
          The Web subsystem shall show on the review page the review-set that a planned review belongs to.
        justification: |
          A reader of a planned review must see which set of files it covers.
        children:
          - ReviewCenter-ReviewPage-ReviewSet

      - id: ReviewCenter-Web-PlanReviews-ReviewSetNone
        title: >-
          The Web subsystem shall show no review-set row in the Details section of a review that was not planned from
          a review-set.
        justification: |
          A review that was made by hand has no set, and an empty row would suggest that something is missing.
        children:
          - ReviewCenter-ReviewPage-ReviewSet-NoRow

      - id: ReviewCenter-Web-Attestation
        title: >-
          The Web subsystem shall offer the signed attestation of a review on the review page as a download of the PDF
          only when the review is concluded, approved or rejected.
        justification: |
          A user who completes a review needs the evidence at hand, and a review that is not concluded has none yet.
        children:
          - ReviewCenter-ReviewPage-Attestation
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-Web-Attestation-Address
        title: >-
          The Web subsystem shall link the download button of the attestation to the attestation address of the project
          and the review.
        justification: |
          The download must fetch the attestation of this review, not of another.
        children:
          - ReviewCenter-ReviewPage-Attestation-Address

      - id: ReviewCenter-Web-Attestation-NotConcluded
        title: >-
          The Web subsystem shall show nothing about the attestation on the review page for a review that is not
          concluded.
        justification: |
          A review that is still open has no attestation, and a hint about one would only raise questions.
        children:
          - ReviewCenter-ReviewPage-Attestation-NotConcluded

      - id: ReviewCenter-Web-Attestation-KeyNote
        title: >-
          The Web subsystem shall say next to the attestation download which kind of key will sign it.
        justification: |
          The reader of the user interface must see that the default key is not an organization key before taking the
          document anywhere.
        children:
          - ReviewCenter-ReviewPage-Attestation-SelfSignedNote
          - ReviewCenter-ReviewPage-Attestation-SuppliedNote
          - ReviewCenter-ReviewPage-Attestation-OrganizationNote
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-Web-Attestation-HelpLink
        title: >-
          The Web subsystem shall link from the attestation download to a help topic.
        justification: |
          A user needs to know how much the signature is worth before relying on it.
        children:
          - ReviewCenter-ReviewPage-Attestation-HelpLink
        tests:
          - ReviewPage_Render_ReviewApprovedWithSelfSignedKey_OffersAttestationDownloadWithKeyNote

      - id: ReviewCenter-Web-Attestation-HelpTopic
        title: >-
          The Web subsystem shall explain in a help topic what the signature of the attestation proves and what it does
          not.
        justification: |
          A signature that is read as more than it proves misleads those who rely on it.
        children:
          - ReviewCenter-HelpPage-AttestationTopic
          - ReviewCenter-HelpPage-AttestationTopic-KeyChoice
          - ReviewCenter-HelpPage-AttestationTopic-ExpiryWarning
          - ReviewCenter-HelpPage-AttestationTopic-TrustedKey
          - ReviewCenter-HelpPage-AttestationTopic-CodeSigning
          - ReviewCenter-HelpPage-AttestationTopic-PdfContents
          - ReviewCenter-HelpPage-AttestationTopic-Concluded
          - ReviewCenter-HelpPage-AttestationTopic-Screenshot
        tests:
          - HelpAttestationPage_Render_ExplainsWhatTheSignatureProvesAndTheKey

      - id: ReviewCenter-Web-Attestation-Unavailable
        title: >-
          The Web subsystem shall show why the attestation is unavailable instead of the download when the signing key
          cannot be used.
        justification: |
          A user who sees no download must be told why instead of looking for it.
        children:
          - ReviewCenter-ReviewPage-Attestation-KeyProblem

      - id: ReviewCenter-Web-Attestation-KeyWarning
        title: >-
          The Web subsystem shall show the warnings of the key status, such as a certificate that ends soon, next to
          the attestation download.
        justification: |
          A certificate that ends soon should be noticed by the people who download attestations, before the download
          stops working.
        children:
          - ReviewCenter-ReviewPage-Attestation-KeyWarning

      - id: ReviewCenter-Web-Attestation-NoKeyWarning
        title: >-
          The Web subsystem shall show no key warning next to the attestation download when the key status has none.
        justification: |
          A warning that is always there is not read, so the page shows one only when the key status has something to
          say.
        children:
          - ReviewCenter-ReviewPage-Attestation-NoKeyWarning

      - id: ReviewCenter-Web-AccessTokens
        title: >-
          The Web subsystem shall let a signed-in user create a personal access token on the account page and see its
          value once.
        justification: |
          A token is made by its owner, so the page where the user already manages the account is where it belongs.
        children:
          - ReviewCenter-AccountPage-TokenCreate
        tests:
          - AccountPage_CreateToken_ValidInput_ShowsValueOnceAndListsToken

      - id: ReviewCenter-Web-AccessTokens-ValueOnce
        title: >-
          The Web subsystem shall show the value of a new token once, until the user dismisses it.
        justification: |
          The value of a token cannot be read again later, so the one time that it is shown is the only chance to note
          it down.
        children:
          - ReviewCenter-AccountPage-TokenCreate-ValueOnce
        tests:
          - AccountPage_CreateToken_ValidInput_ShowsValueOnceAndListsToken

      - id: ReviewCenter-Web-AccessTokens-ValueOnceNote
        title: >-
          The Web subsystem shall show with the value of a new token a note that the value cannot be shown again.
        justification: |
          A user who does not know that the value is shown only once may close it before taking it.
        children:
          - ReviewCenter-AccountPage-TokenCreate-Note

      - id: ReviewCenter-Web-AccessTokens-Refused
        title: >-
          The Web subsystem shall show an error when the form for a token is submitted with an empty name or while the
          user already has 20 active tokens.
        justification: |
          A token without a name cannot be told apart in the list, and the limit keeps the number of live credentials
          of one user in check.
        children:
          - ReviewCenter-AccountPage-TokenCreate-EmptyName
          - ReviewCenter-AccountPage-TokenCreate-LimitReached

      - id: ReviewCenter-Web-AccessTokens-RefusedNothing
        title: >-
          The Web subsystem shall create no token and show no token value when it refuses the form for a token.
        justification: |
          A refused request must not leave a working credential behind or show a value that does not work.
        children:
          - ReviewCenter-AccountPage-TokenCreate-NothingCreated

      - id: ReviewCenter-Web-AccessTokens-Copy
        title: >-
          The Web subsystem shall offer a way to copy the value of a new token.
        justification: |
          The value is shown once, so copying it must be easy.
        children:
          - ReviewCenter-AccountPage-TokenCopy

      - id: ReviewCenter-Web-AccessTokens-CopyRefused
        title: >-
          The Web subsystem shall show a hint to copy the value by hand when the browser refuses the copy of a new
          token.
        justification: |
          A browser may refuse the clipboard, and the user must still be told how to take the value.
        children:
          - ReviewCenter-AccountPage-TokenCopy-Hint

      - id: ReviewCenter-Web-AccessTokens-CopyRefusedValueKept
        title: >-
          The Web subsystem shall keep the value of a new token on the page when the browser refuses the copy.
        justification: |
          The value appears only once, so it must stay at hand for the copy by hand.
        children:
          - ReviewCenter-AccountPage-TokenCopy-ValueKept

      - id: ReviewCenter-Web-AccessTokens-List
        title: >-
          The Web subsystem shall show the tokens of the signed-in user with their expiry and last use.
        justification: |
          The owner decides from expiry and last use which token to keep and which to revoke.
        children:
          - ReviewCenter-AccountPage-TokensCard
          - ReviewCenter-AccountPage-TokensCard-List
          - ReviewCenter-AccountPage-TokensCard-NoValue
          - ReviewCenter-AccountPage-TokenCreate-Listed
        tests:
          - AccountPage_CreateToken_ValidInput_ShowsValueOnceAndListsToken

      - id: ReviewCenter-Web-AccessTokens-Revoke
        title: >-
          The Web subsystem shall let a signed-in user revoke a personal access token.
        justification: |
          A token that leaks or is no longer needed must be taken back by its owner.
        children:
          - ReviewCenter-AccountPage-TokenRevoke
        tests:
          - AccountPage_RevokeToken_ActiveToken_MarksRevokedAndRemovesButton

      - id: ReviewCenter-Web-AccessTokens-RevokeNotOffered
        title: >-
          The Web subsystem shall offer no revoke button for a token that is already revoked or expired.
        justification: |
          Taking back a token that no longer works would change nothing, and the button would suggest that it still
          did.
        children:
          - ReviewCenter-AccountPage-TokenRevoke-NoButton
          - ReviewCenter-AccountPage-TokenRevoke-ExpiredToken
        tests:
          - AccountPage_RevokeToken_ActiveToken_MarksRevokedAndRemovesButton

      - id: ReviewCenter-Web-AccessTokens-HelpTopic
        title: >-
          The Web subsystem shall explain the personal access tokens and the API in a help topic.
        justification: |
          A help topic tells how a token is used and what it cannot do.
        children:
          - ReviewCenter-HelpPage-ApiTokensTopic
          - ReviewCenter-HelpPage-ApiTokensTopic-CurlExample
          - ReviewCenter-HelpPage-ApiTokensTopic-Endpoints
          - ReviewCenter-HelpPage-ApiTokensTopic-ReviewMark
          - ReviewCenter-HelpPage-ApiTokensTopic-NeverSigns
          - ReviewCenter-HelpPage-ApiTokensTopic-Errors
        tests:
          - HelpApiTokensPage_Render_ExplainsTokensCurlEndpointsAndErrors

      - id: ReviewCenter-Web-AccessTokens-HelpLink
        title: >-
          The Web subsystem shall link from the account page to the help topic about the tokens.
        justification: |
          The help topic must be one click away from where the tokens are managed.
        children:
          - ReviewCenter-AccountPage-TokensCard-HelpLink

      - id: ReviewCenter-Web-EvidenceSettings
        title: >-
          The Web subsystem shall let only whoever administers a project, a system administrator or a project admin of
          it, open the evidence settings page of the project from an Evidence settings button on the project page.
        justification: |
          Opening evidence to anonymous readers and reducing what a PDF contains are decisions with regulatory
          consequences, so they belong to the people who answer for the project. The behavior needs a live
          connection, so it is verified by the component tests of the units.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsLink
          - ReviewCenter-ProjectPage-EvidenceSettingsLink-SystemAdmin
          - ReviewCenter-ProjectPage-EvidenceSettingsLink-Hidden
          - ReviewCenter-ProjectPage-EvidenceSettingsAccess
          - ReviewCenter-ProjectPage-EvidenceSettingsAccess-BackButton
        tests:
          - EvidenceSettingsPage_Render_NoAdministerRight_ShowsNotFoundAndNoSwitches
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-Web-EvidenceSettings-HiddenProject
        title: >-
          The Web subsystem shall show anybody else who opens the evidence settings page the page of a project that
          does not exist.
        justification: |
          The page must not reveal a project to a user who may not administer it.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsAccess-NotFound
          - ReviewCenter-ProjectPage-EvidenceSettingsAccess-MissingProject
        tests:
          - EvidenceSettingsPage_Render_NoAdministerRight_ShowsNotFoundAndNoSwitches

      - id: ReviewCenter-Web-EvidenceSettings-Switches
        title: >-
          The Web subsystem shall show on the evidence settings page the switches for anonymous access to the evidence
          index and the attestation PDFs and for the content of the PDFs, with their defaults.
        justification: |
          The administrator must see the current state of every decision before changing it.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsSwitches
          - ReviewCenter-ProjectPage-EvidenceSettingsSwitches-Defaults
          - ReviewCenter-ProjectPage-EvidenceSettingsSwitches-Descriptions
          - ReviewCenter-ProjectPage-EvidenceSettingsSwitches-IndexDescription
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-Web-EvidenceSettings-RegulatoryWarnings
        title: >-
          The Web subsystem shall show the regulatory warnings on the evidence settings page as the switches are
          changed.
        justification: |
          The consequences of a decision are shown before it is saved.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings-Removed
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings-ReviewerNames

      - id: ReviewCenter-Web-EvidenceSettings-LeftOutSummary
        title: >-
          The Web subsystem shall show the summary of what is left out of the PDFs on the evidence settings page as the
          switches are changed.
        justification: |
          The administrator must see what a reader of the PDF will miss.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings-Banner

      - id: ReviewCenter-Web-EvidenceSettings-ExposureWarning
        title: >-
          The Web subsystem shall show the exposure warning on the evidence settings page as the switches are changed.
        justification: |
          The administrator must see what becomes readable without signing in.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings-Exposure
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings-PeopleLine

      - id: ReviewCenter-Web-EvidenceSettings-NoWarnings
        title: >-
          The Web subsystem shall show no warning and no summary on the evidence settings page for the default
          settings.
        justification: |
          A warning that is shown when nothing is exposed or removed would teach the administrator to ignore warnings.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsWarnings-NoneByDefault
        tests:
          - EvidenceSettingsPage_Render_Administrator_ShowsDefaultsWithoutWarnings

      - id: ReviewCenter-Web-EvidenceSettings-Save
        title: >-
          The Web subsystem shall save the evidence switches together.
        justification: |
          Switches that depend on each other must not be saved one by one.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsSave
          - ReviewCenter-ProjectPage-EvidenceSettingsSave-StaysOpen
          - ReviewCenter-ProjectPage-EvidenceSettingsSave-Confirmation
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits

      - id: ReviewCenter-Web-EvidenceSettings-SaveUnchanged
        title: >-
          The Web subsystem shall say that there is nothing to save when the user saves the evidence switches without a
          change.
        justification: |
          A save without a change must not look like a decision.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsSave-NothingToSave

      - id: ReviewCenter-Web-EvidenceSettings-SaveUnchangedNothingRecorded
        title: >-
          The Web subsystem shall record no audit entry when the user saves the evidence switches without a change.
        justification: |
          An audit trail that holds entries for no change would hide the real ones.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsSave-NothingRecorded

      - id: ReviewCenter-Web-EvidenceSettings-Audit
        title: >-
          The Web subsystem shall record a change of the evidence switches in the audit trail of the project.
        justification: |
          Decisions with regulatory consequences must be accountable afterwards.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsSave-Audit
        tests:
          - EvidenceSettingsPage_Save_Change_StoresConfirmsAndAudits

      - id: ReviewCenter-Web-EvidenceSettings-Conflict
        title: >-
          The Web subsystem shall refuse a save of the evidence switches over a change made by someone else.
        justification: |
          A save that overwrites a change nobody saw would undo a decision unnoticed.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsConflict
          - ReviewCenter-ProjectPage-EvidenceSettingsConflict-NothingStored
          - ReviewCenter-ProjectPage-EvidenceSettingsConflict-ShowsStored

      - id: ReviewCenter-Web-EvidenceSettings-RightLost
        title: >-
          The Web subsystem shall replace the evidence settings page with the not-found message, without form, error or
          status, when the user saves after the right to administer the project was lost.
        justification: |
          A page that stays open must not let a user who lost the right keep deciding.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsRightLost

      - id: ReviewCenter-Web-EvidenceSettings-RightLostNothingChanged
        title: >-
          The Web subsystem shall store and record nothing when the user saves or changes a switch after the right to
          administer the project was lost.
        justification: |
          A user who lost the right must not leave a trace in the settings of the project.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsRightLost-NothingChanged

      - id: ReviewCenter-Web-EvidenceSettings-RightLostSwitch
        title: >-
          The Web subsystem shall replace the evidence settings with the not-found message, without warning, summary
          or settings, when the user changes a switch after the right to administer the project was lost.
        justification: |
          A switch that is changed on a page that stays open must lead to the refusal at once.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsRightLost-Switch

      - id: ReviewCenter-Web-EvidenceSettings-OtherProject
        title: >-
          The Web subsystem shall show the not-found message and nothing of the previous project when the evidence
          settings page is reused for a project that the user does not administer.
        justification: |
          The page is reused when the user moves between projects, and the settings of one project must not stay on
          screen for a project that the user may not see.
        children:
          - ReviewCenter-ProjectPage-EvidenceSettingsRightLost-OtherProject

      - id: ReviewCenter-Web-EvidenceSettings-Topic
        title: >-
          The Web subsystem shall explain the evidence settings in a help topic at /help/evidence-settings.
        justification: |
          The administrator needs the meaning of each switch before changing it.
        children:
          - ReviewCenter-HelpPage-EvidenceSettingsTopic
          - ReviewCenter-HelpPage-EvidenceSettingsTopic-AnonymousSwitches
          - ReviewCenter-HelpPage-EvidenceSettingsTopic-IndexAlone
          - ReviewCenter-HelpPage-EvidenceSettingsTopic-ContentSwitches
          - ReviewCenter-HelpPage-EvidenceSettingsTopic-ContentScope
          - ReviewCenter-HelpPage-EvidenceSettingsTopic-AuditRecord
          - ReviewCenter-HelpPage-EvidenceSettingsTopic-Screenshots
        tests:
          - HelpEvidenceSettingsPage_Render_ExplainsAnonymousAccessContentSwitchesAndScope

      - id: ReviewCenter-Web-ChecklistTemplate
        title: >-
          The Web subsystem shall let only whoever administers a project, a system administrator or a project admin of
          it, open the checklist template page of the project from a Checklist button on the project page.
        justification: |
          The checklist is how a formal review shows what was examined, so changing it belongs to the people who answer
          for the project. The behavior needs a live connection, so it is verified by the component tests of the units.
        children:
          - ReviewCenter-ProjectPage-ChecklistLink
          - ReviewCenter-ProjectPage-ChecklistLink-SystemAdmin
          - ReviewCenter-ProjectPage-ChecklistLink-Hidden
          - ReviewCenter-ProjectPage-ChecklistAccess
          - ReviewCenter-ProjectPage-ChecklistAccess-DefaultBadge
          - ReviewCenter-ProjectPage-ChecklistAccess-BackButton
        tests:
          - ProjectChecklistPage_Render_Administrator_ShowsDefaultSummary
          - ProjectChecklistPage_Render_NoAdministerRight_ShowsNotFoundAndNothingElse

      - id: ReviewCenter-Web-ChecklistTemplate-HiddenProject
        title: >-
          The Web subsystem shall show anybody else who opens the checklist template page the page of a project that
          does not exist.
        justification: |
          The checklist template page must not reveal a project to a user who may not administer it.
        children:
          - ReviewCenter-ProjectPage-ChecklistAccess-NotFound
          - ReviewCenter-ProjectPage-ChecklistAccess-MissingProject
        tests:
          - ProjectChecklistPage_Render_NoAdministerRight_ShowsNotFoundAndNothingElse

      - id: ReviewCenter-Web-ChecklistTemplate-StartLine
        title: >-
          The Web subsystem shall show on the project page a line that says which checklist new reviews start with.
        justification: |
          A user who creates a review must know which questions it will contain.
        children:
          - ReviewCenter-ProjectPage-ChecklistLink-Summary
          - ReviewCenter-ProjectPage-ChecklistLink-SummaryLink

      - id: ReviewCenter-Web-ChecklistTemplate-StartLineHidden
        title: >-
          The Web subsystem shall show a plain member no checklist summary on the project page.
        justification: |
          The checklist is managed by the administrators of the project, so a plain member is not shown a line that
          leads to a page that is closed to them.
        children:
          - ReviewCenter-ProjectPage-ChecklistLink-SummaryHidden

      - id: ReviewCenter-Web-ChecklistTemplate-ExportCurrent
        title: >-
          The Web subsystem shall let the administrator of a project export the current checklist of the project.
        justification: |
          An export is the starting point for a change and the way to keep a copy.
        children:
          - ReviewCenter-ProjectPage-ChecklistExport
          - ReviewCenter-ProjectPage-ChecklistExport-IndentedJson
          - ReviewCenter-ProjectPage-ChecklistExport-ReadsBack
          - ReviewCenter-ProjectPage-ChecklistExport-LineBreak

      - id: ReviewCenter-Web-ChecklistTemplate-ExportDefault
        title: >-
          The Web subsystem shall let the administrator of a project export the built-in default checklist.
        justification: |
          The default is the base of every own wording, so it must be available to start from.
        children:
          - ReviewCenter-ProjectPage-ChecklistExport-Default

      - id: ReviewCenter-Web-ChecklistTemplate-ExportRightLost
        title: >-
          The Web subsystem shall download nothing when the user exports after the right to administer the project was
          lost while the page was open.
        justification: |
          A page that stays open must not let a user who lost the right keep taking the checklist of the project.
        children:
          - ReviewCenter-ProjectPage-ChecklistExport-RightLost

      - id: ReviewCenter-Web-ChecklistTemplate-ImportPaste
        title: >-
          The Web subsystem shall let the administrator of a project import a checklist definition by pasting it.
        justification: |
          Pasting is the quickest way to bring in a definition.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport

      - id: ReviewCenter-Web-ChecklistTemplate-ImportFile
        title: >-
          The Web subsystem shall let the administrator of a project import a checklist definition from a file.
        justification: |
          A definition is kept as a file in a repository, so it must be taken from one.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-File
          - ReviewCenter-ProjectPage-ChecklistImport-FileName

      - id: ReviewCenter-Web-ChecklistTemplate-ImportFileRefused
        title: >-
          The Web subsystem shall refuse a chosen checklist file larger than 256 KiB, naming the limit.
        justification: |
          A file of unbounded size would burden the server.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-FileTooLarge

      - id: ReviewCenter-Web-ChecklistTemplate-ImportFileRefusedDropsImport
        title: >-
          The Web subsystem shall drop the earlier import when it refuses a chosen checklist file.
        justification: |
          An import that was dropped must not be mistaken for the one that is shown.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-RefusedFileDropsImport

      - id: ReviewCenter-Web-ChecklistTemplate-Validation
        title: >-
          The Web subsystem shall check an imported checklist definition and show every error with its path.
        justification: |
          An administrator must be able to correct all errors in one pass.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-AllErrors
          - ReviewCenter-ProjectPage-ChecklistImport-NotJson
          - ReviewCenter-ProjectPage-ChecklistImport-NothingImported

      - id: ReviewCenter-Web-ChecklistTemplate-ValidationNothingChanged
        title: >-
          The Web subsystem shall say that nothing was changed when it shows the errors of an invalid checklist
          definition.
        justification: |
          Checking a definition is a dry run, and the administrator must be told that the current checklist is still
          in force.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-NothingChangedNotice

      - id: ReviewCenter-Web-ChecklistTemplate-ValidationNoPreview
        title: >-
          The Web subsystem shall show no preview for an invalid checklist definition.
        justification: |
          A preview of a definition that cannot be used would suggest that it could be put in force.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-NoPreview

      - id: ReviewCenter-Web-ChecklistTemplate-ValidationNothingStored
        title: >-
          The Web subsystem shall store and audit nothing while it only checks a checklist definition.
        justification: |
          A check must not change the stored checklist or leave an entry in the audit trail.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-NothingStored

      - id: ReviewCenter-Web-ChecklistTemplate-ValidationSample
        title: >-
          The Web subsystem shall accept the IEC 62304 example checklist definition of the user guide as valid.
        justification: |
          The example that the user guide shows must work as printed, or administrators would copy a definition that
          fails.
        children:
          - ReviewCenter-ProjectPage-ChecklistImport-Sample

      - id: ReviewCenter-Web-ChecklistTemplate-Preview
        title: >-
          The Web subsystem shall show a preview of an imported checklist definition.
        justification: |
          The administrator sees how the checklist will look before it replaces the current one.
        children:
          - ReviewCenter-ProjectPage-ChecklistPreview
          - ReviewCenter-ProjectPage-ChecklistPreview-Sections

      - id: ReviewCenter-Web-ChecklistTemplate-Differences
        title: >-
          The Web subsystem shall show the differences of an imported checklist definition from the current checklist.
        justification: |
          The administrator confirms a change knowing what changes.
        children:
          - ReviewCenter-ProjectPage-ChecklistPreview-Version
          - ReviewCenter-ProjectPage-ChecklistPreview-Added
          - ReviewCenter-ProjectPage-ChecklistPreview-Removed
          - ReviewCenter-ProjectPage-ChecklistPreview-Reworded
          - ReviewCenter-ProjectPage-ChecklistPreview-Moved

      - id: ReviewCenter-Web-ChecklistTemplate-DifferencesNone
        title: >-
          The Web subsystem shall report no difference between identical checklists, or for a change of letter case,
          order or a missing hint only.
        justification: |
          A change that does not alter the meaning of the checklist must not raise a new version of it.
        children:
          - ReviewCenter-ProjectPage-ChecklistPreview-Ignored
          - ReviewCenter-ProjectPage-ChecklistPreview-NoChange

      - id: ReviewCenter-Web-ChecklistTemplate-DifferencesNothingToReplace
        title: >-
          The Web subsystem shall say that there is nothing to replace when the definition equals the current
          checklist.
        justification: |
          The administrator must be told that a replacement would do nothing.
        children:
          - ReviewCenter-ProjectPage-ChecklistPreview-NothingToReplace

      - id: ReviewCenter-Web-ChecklistTemplate-LabelWarning
        title: >-
          The Web subsystem shall warn when an imported definition keeps the version label of the current checklist
          but differs in content.
        justification: |
          Two checklists with different content under one label cannot be told apart in the record of a review.
        children:
          - ReviewCenter-ProjectPage-ChecklistPreview-LabelWarning

      - id: ReviewCenter-Web-ChecklistTemplate-PreviewNullArgument
        title: >-
          The Web subsystem shall refuse a missing checklist when it compares two checklists or writes one as JSON.
        justification: |
          A missing checklist is a fault of the caller and must stop at once instead of producing a wrong comparison.
        children:
          - ReviewCenter-ProjectPage-ChecklistPreview-NullArgument

      - id: ReviewCenter-Web-ChecklistTemplate-Replace
        title: >-
          The Web subsystem shall let the administrator of a project replace the checklist of the project with an
          imported definition.
        justification: |
          Projects in a regulated setting need their own wording without access to the server.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace
          - ReviewCenter-ProjectPage-ChecklistReplace-Confirmed
          - ReviewCenter-ProjectPage-ChecklistReplace-Shown
          - ReviewCenter-ProjectPage-ChecklistReplace-Status
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-Web-ChecklistTemplate-Confirmation
        title: >-
          The Web subsystem shall ask for a confirmation before the checklist is replaced or reset that says that
          existing reviews keep their checklist.
        justification: |
          The administrator must know that the change does not touch reviews that are under way.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace-Confirmation
          - ReviewCenter-ProjectPage-ChecklistReset-Confirmation
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-Web-ChecklistTemplate-ConfirmationCancelled
        title: >-
          The Web subsystem shall store and audit nothing, and leave the checklist unchanged, when the administrator
          cancels the confirmation of a replacement or a reset.
        justification: |
          An administrator who thinks twice must be able to back out without leaving a trace in the checklist or in the
          audit trail.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace-Cancelled
          - ReviewCenter-ProjectPage-ChecklistReset-Cancelled

      - id: ReviewCenter-Web-ChecklistTemplate-ReplaceRefused
        title: >-
          The Web subsystem shall show that the version label must change when the service refuses a replacement that
          keeps the version label.
        justification: |
          An administrator whose replacement is refused must learn what to fix.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace-Refusal

      - id: ReviewCenter-Web-ChecklistTemplate-ReplaceNothingStored
        title: >-
          The Web subsystem shall leave the stored checklist unchanged when the service refuses a replacement.
        justification: |
          A refused replacement must not alter the checklist that is in force.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace-RefusalNothingStored

      - id: ReviewCenter-Web-ChecklistTemplate-ReplaceKeepsCandidate
        title: >-
          The Web subsystem shall keep the definition and its preview on the page after the service refused the
          replacement.
        justification: |
          An administrator must not have to paste the definition again after fixing the version label.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace-RefusalKeepsCandidate

      - id: ReviewCenter-Web-ChecklistTemplate-Reset
        title: >-
          The Web subsystem shall let the administrator of a project reset the checklist of the project to the built-in
          default.
        justification: |
          An own wording that is no longer wanted must be able to go.
        children:
          - ReviewCenter-ProjectPage-ChecklistReset
          - ReviewCenter-ProjectPage-ChecklistReset-Disabled
          - ReviewCenter-ProjectPage-ChecklistReset-Confirmed
          - ReviewCenter-ProjectPage-ChecklistReset-Shown
          - ReviewCenter-ProjectPage-ChecklistReset-Status

      - id: ReviewCenter-Web-ChecklistTemplate-Audit
        title: >-
          The Web subsystem shall record every change of the checklist in the audit trail of the project.
        justification: |
          The checklist shows what was examined, so a change of it must be accountable afterwards.
        children:
          - ReviewCenter-ProjectPage-ChecklistReplace-Audit
          - ReviewCenter-ProjectPage-ChecklistReset-Audit
        tests:
          - ProjectChecklistPage_Replace_Confirmed_StoresShowsAndAudits

      - id: ReviewCenter-Web-ChecklistTemplate-Conflict
        title: >-
          The Web subsystem shall refuse a change of the checklist over a change made by someone else.
        justification: |
          A change that overwrites a change nobody saw would undo it unnoticed.
        children:
          - ReviewCenter-ProjectPage-ChecklistConflict
          - ReviewCenter-ProjectPage-ChecklistConflict-NothingStored
          - ReviewCenter-ProjectPage-ChecklistConflict-ShowsStored
          - ReviewCenter-ProjectPage-ChecklistConflict-Differences
          - ReviewCenter-ProjectPage-ChecklistConflict-Reset
          - ReviewCenter-ProjectPage-ChecklistConflict-ResetNothingStored
          - ReviewCenter-ProjectPage-ChecklistConflict-ResetShowsStored

      - id: ReviewCenter-Web-ChecklistTemplate-RightLost
        title: >-
          The Web subsystem shall refuse a change of the checklist after the right to administer the project was lost.
        justification: |
          A page that stays open must not let a user who lost the right keep changing the checklist.
        children:
          - ReviewCenter-ProjectPage-ChecklistRightLost
          - ReviewCenter-ProjectPage-ChecklistRightLost-NothingChanged

      - id: ReviewCenter-Web-ChecklistTemplate-OtherProject
        title: >-
          The Web subsystem shall show the not-found message and nothing of the previous project when the checklist
          page is reused for a project that the user does not administer.
        justification: |
          The page is reused when the user moves between projects, and the checklist of one project must not stay on
          screen for a project that the user may not see.
        children:
          - ReviewCenter-ProjectPage-ChecklistRightLost-OtherProject

      - id: ReviewCenter-Web-ChecklistTemplate-Topic
        title: >-
          The Web subsystem shall explain the checklist template in a help topic.
        justification: |
          The administrator needs to know how export, import, replacing, and resetting work and what they leave alone.
        children:
          - ReviewCenter-HelpPage-ChecklistTemplateTopic
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-ReviewsKeepCopy
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-Export
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-Import
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-VersionLabel
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-ReplaceReset
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-AuditRecord
          - ReviewCenter-HelpPage-ChecklistTemplateTopic-ExampleNotCompliant
        tests:
          - HelpChecklistTemplatePage_Render_ExplainsExportImportReplaceResetAndCopies

      - id: ReviewCenter-Web-DueDate
        title: >-
          The Web subsystem shall let a user give a review an optional due date, stated as a calendar day in UTC, when
          creating it from files.
        justification: |
          A lead plans reviews with dates. The pages must state the time basis so that nobody reads the date in another
          zone. The behavior needs a live connection, so it is verified by the component tests of the units.
        children:
          - ReviewCenter-ProjectPage-NewReviewDueDate
          - ReviewCenter-ProjectPage-NewReviewDueDate-UtcStatement
          - ReviewCenter-ProjectPage-NewReviewDueDate-Stored
        tests:
          - NewReviewPage_Render_DueDateField_StatesCalendarDayInUtc

      - id: ReviewCenter-Web-DueDate-Repository
        title: >-
          The Web subsystem shall let a user give a review an optional due date when creating it from a repository.
        justification: |
          A review from a repository is planned with a date as well.
        children:
          - ReviewCenter-ProjectPage-NewReviewDueDate-StoredFromRepository
        tests:
          - NewReviewPage_CreateForm_DueDate_IsStoredWithTheReview

      - id: ReviewCenter-Web-DueDate-PastRefused
        title: >-
          The Web subsystem shall refuse a due date in the past on the page for a new review, naming the due date in
          the error.
        justification: |
          A date that has already passed cannot be met, so a review that starts with one would be late from the first
          day.
        children:
          - ReviewCenter-ProjectPage-NewReviewDueDate-PastDate

      - id: ReviewCenter-Web-DueDate-PastNothingCreated
        title: >-
          The Web subsystem shall create no review when it has refused the due date of the page for a new review.
        justification: |
          A refused request must leave nothing behind that the user has to find and remove.
        children:
          - ReviewCenter-ProjectPage-NewReviewDueDate-PastDateNothingCreated

      - id: ReviewCenter-Web-DueDate-PlanDefault
        title: >-
          The Web subsystem shall let a user give all the reviews of a plan one due date.
        justification: |
          Planned reviews usually share a date, so the user states it once.
        children:
          - ReviewCenter-PlanPage-DueDate
          - ReviewCenter-PlanPage-DueDate-Utc
          - ReviewCenter-PlanPage-DueDate-Default
        tests:
          - PlanPage_Create_DueDates_DefaultAndRowDate

      - id: ReviewCenter-Web-DueDate-PlanRow
        title: >-
          The Web subsystem shall let a user give each review of a plan its own due date.
        justification: |
          One review of a plan may be due earlier than the others.
        children:
          - ReviewCenter-PlanPage-DueDate-Row
          - ReviewCenter-PlanPage-DueDate-RowDate
        tests:
          - PlanPage_Create_DueDates_DefaultAndRowDate

      - id: ReviewCenter-Web-DueDate-PlanRefused
        title: >-
          The Web subsystem shall show a refused due date of a plan as the failure of that review only.
        justification: |
          A date that the rules refuse concerns one review, so the other reviews of the plan must still be created.
        children:
          - ReviewCenter-PlanPage-DueDate-Refused

      - id: ReviewCenter-Web-DueDate-Header
        title: >-
          The Web subsystem shall show the due date of a review in its header, stated as a calendar day in UTC.
        justification: |
          A reader must see when a review is due and in which time basis.
        children:
          - ReviewCenter-ReviewPage-DueDate
          - ReviewCenter-ReviewPage-DueDate-NoDate
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc

      - id: ReviewCenter-Web-DueDate-Overdue
        title: >-
          The Web subsystem shall show an Overdue badge next to the due date while the date is past and the review is
          not concluded.
        justification: |
          A lead must see at a glance which reviews are late.
        children:
          - ReviewCenter-ReviewPage-Overdue
          - ReviewCenter-ReviewPage-Overdue-TodayOrLater
          - ReviewCenter-ReviewPage-Overdue-Concluded
        tests:
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused

      - id: ReviewCenter-Web-DueDate-DateKept
        title: >-
          The Web subsystem shall keep showing the due date of a concluded review.
        justification: |
          The date remains part of the record of a review after it is concluded, even though it can no longer be late.
        children:
          - ReviewCenter-ReviewPage-Overdue-DateKept

      - id: ReviewCenter-Web-DueDate-Change
        title: >-
          The Web subsystem shall let the administrators of the project and the creator of the review, and nobody
          else, change the due date of a review that is not locked.
        justification: |
          The date is a commitment, so only those who answer for the review may move it, and a locked review is
          closed.
        children:
          - ReviewCenter-ReviewPage-DueDate-SystemAdminForm
          - ReviewCenter-ReviewPage-DueDate-ProjectAdminForm
          - ReviewCenter-ReviewPage-DueDate-CreatorForm
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc

      - id: ReviewCenter-Web-DueDate-ChangeSave
        title: >-
          The Web subsystem shall show the new date after the save button was pressed with a valid date.
        justification: |
          The entitled user must see that the date was stored.
        children:
          - ReviewCenter-ReviewPage-DueDate-SaveDate

      - id: ReviewCenter-Web-DueDate-NoForm
        title: >-
          The Web subsystem shall show the due date form to no other user and to nobody on a locked review.
        justification: |
          A form that is shown to a user who may not use it, or on a review that is closed, would only lead to a
          refusal.
        children:
          - ReviewCenter-ReviewPage-DueDate-NoFormOthers
          - ReviewCenter-ReviewPage-DueDate-NoFormLocked

      - id: ReviewCenter-Web-DueDate-Clear
        title: >-
          The Web subsystem shall let the same users clear the due date of a review that is not locked.
        justification: |
          A date that no longer applies must be able to go.
        children:
          - ReviewCenter-ReviewPage-DueDate-ClearDate
        tests:
          - ReviewPage_DueDate_AdministratorSetsAndClears_ShowsDateInUtc

      - id: ReviewCenter-Web-DueDate-Refused
        title: >-
          The Web subsystem shall show the message of the rule when a due date is refused.
        justification: |
          A user who is refused must be told why and must not be offered a change that the rules refuse.
        children:
          - ReviewCenter-ReviewPage-DueDate-BadText
          - ReviewCenter-ReviewPage-DueDate-LockedRefusal
          - ReviewCenter-ReviewPage-DueDate-RefusalKept
        tests:
          - ReviewPage_DueDate_InThePast_ShowsOverdueBadgeAndBadTextIsRefused

      - id: ReviewCenter-Web-Progress
        title: >-
          The Web subsystem shall show on the project page, for every review, its stage.
        justification: |
          The project page is where a lead starts. The lead must see at a glance how far each review has come. The
          behavior needs a live connection, so it is verified by the component tests of the unit.
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-Web-Progress-Signatures
        title: >-
          The Web subsystem shall show on the project page, for every review, how many signatures were given of how many
          are needed, and a dash for a review in Setup.
        justification: |
          A lead must see who has signed.
        children:
          - ReviewCenter-ProjectPage-Progress
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-Web-Progress-SignaturesOutOfDate
        title: >-
          The Web subsystem shall say on the project page, for a review in which a signature is out of date, that the
          signature was given and the review changed afterwards.
        justification: |
          A lead must see who has to sign again.
        children:
          - ReviewCenter-ProjectPage-Progress-OutOfDate

      - id: ReviewCenter-Web-Progress-Blockers
        title: >-
          The Web subsystem shall show on the project page, for every review, what blocks it.
        justification: |
          A lead must see what stands between a review and its approval.
        children:
          - ReviewCenter-ProjectPage-Progress-NoChecklist
          - ReviewCenter-ProjectPage-Progress-OpenThreads
          - ReviewCenter-ProjectPage-Progress-UnansweredChecks
          - ReviewCenter-ProjectPage-Progress-ConclusionNeeded
          - ReviewCenter-ProjectPage-Progress-DisputedChecks
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-Web-Progress-BlockersNoFail
        title: >-
          The Web subsystem shall not count a check answered Fail as a blocker of a review on the project page.
        justification: |
          A Fail is an answer and not an open item, so counting it would keep a rejected review looking unfinished.
        children:
          - ReviewCenter-ProjectPage-Progress-NoFailCount

      - id: ReviewCenter-Web-Progress-WaitingOn
        title: >-
          The Web subsystem shall show on the project page, for every review, the people it waits on.
        justification: |
          A lead must see who is holding each review up.
        children:
          - ReviewCenter-ProjectPage-Progress-WaitingOn
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-Web-Progress-LastActivity
        title: >-
          The Web subsystem shall show on the project page, for every review, its last activity.
        justification: |
          A review that has been quiet for long needs a nudge.
        children:
          - ReviewCenter-ProjectPage-Progress-LastActivity
        tests:
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-Web-Progress-DateFormat
        title: >-
          The Web subsystem shall write the dates of the project page in the invariant culture, in Gregorian digits.
        justification: |
          A date that reads differently for each visitor cannot be compared between people.
        children:
          - ReviewCenter-ProjectPage-Progress-Culture
        tests:
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-Web-Progress-DateFormat-Attributes
        title: >-
          The Web subsystem shall give the times of the project page as machine-readable attributes.
        justification: |
          A date that a script cannot parse cannot be compared between tools.
        children:
          - ReviewCenter-ProjectPage-Progress-DateAttributes
        tests:
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-Web-Progress-DueDate
        title: >-
          The Web subsystem shall show on the project page, for every review, its due date, or a dash for a review
          without one.
        justification: |
          A lead must see when each review is due without opening it.
        children:
          - ReviewCenter-ProjectPage-Progress-DueDate
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary
          - ProjectPage_Render_NonGregorianCulture_ShowsInvariantGregorianDates

      - id: ReviewCenter-Web-Progress-DueDateOverdue
        title: >-
          The Web subsystem shall show an Overdue badge on the project page on a review whose due date has passed.
        justification: |
          A lead must see which reviews are late without comparing dates.
        children:
          - ReviewCenter-ProjectPage-Progress-Overdue

      - id: ReviewCenter-Web-Progress-Summary
        title: >-
          The Web subsystem shall show on the project page a summary of the number of reviews by stage, including the
          rejected ones.
        justification: |
          A lead reads the state of the project before reading the table.
        children:
          - ReviewCenter-ProjectPage-Summary
          - ReviewCenter-ProjectPage-Summary-Rejected
        tests:
          - ProjectPage_Render_Overview_ShowsStageSignaturesBlockersWaitingOnAndSummary

      - id: ReviewCenter-Web-Progress-SummaryOverdue
        title: >-
          The Web subsystem shall show the number of overdue reviews in the summary on the project page.
        justification: |
          A lead must see how many reviews are late before reading the table.
        children:
          - ReviewCenter-ProjectPage-Summary-Overdue

      - id: ReviewCenter-Web-Progress-SummaryAllReviews
        title: >-
          The Web subsystem shall count all reviews of the project in the summary, and not only the ones that a filter
          shows.
        justification: |
          A filter changes what the table shows, and the figures of the summary must not follow it.
        children:
          - ReviewCenter-ProjectPage-Summary-AllReviews

      - id: ReviewCenter-Web-Progress-Filters
        title: >-
          The Web subsystem shall let a user filter the reviews of the project page by stage, overdue, blocked, and
          text.
        justification: |
          A lead narrows the list to what needs attention.
        children:
          - ReviewCenter-ProjectPage-ProgressFilter
          - ReviewCenter-ProjectPage-ProgressFilter-Overdue
          - ReviewCenter-ProjectPage-ProgressFilter-Blocked
          - ReviewCenter-ProjectPage-ProgressFilter-Text
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-Web-Progress-FilterNoMatch
        title: >-
          The Web subsystem shall show a message instead of the table on the project page when no review matches the
          filters.
        justification: |
          An empty table would read as a fault, so the page says that the filters left nothing.
        children:
          - ReviewCenter-ProjectPage-ProgressFilter-NoMatch

      - id: ReviewCenter-Web-Progress-Sorting
        title: >-
          The Web subsystem shall let a user sort the reviews of the project page by a column of the table.
        justification: |
          A lead orders the list by what matters at the moment.
        children:
          - ReviewCenter-ProjectPage-ProgressSort
          - ReviewCenter-ProjectPage-ProgressSort-Stage
          - ReviewCenter-ProjectPage-ProgressSort-Signatures
          - ReviewCenter-ProjectPage-ProgressSort-Activity
          - ReviewCenter-ProjectPage-ProgressSort-Due
          - ReviewCenter-ProjectPage-ProgressSort-Direction
          - ReviewCenter-ProjectPage-ProgressSort-HeaderLinks

      - id: ReviewCenter-Web-Progress-Paging
        title: >-
          The Web subsystem shall show the reviews of the project page 25 to a page.
        justification: |
          A project with many reviews must stay quick to load and easy to read.
        children:
          - ReviewCenter-ProjectPage-ProgressSort-PageSize

      - id: ReviewCenter-Web-Progress-PageRange
        title: >-
          The Web subsystem shall show the first page of the project page when the requested page is not a whole
          number and bring a number outside the existing pages into range.
        justification: |
          A link that was edited by hand or that outlived its data must still show a page and not an error.
        children:
          - ReviewCenter-ProjectPage-ProgressFilter-PageNotNumber
          - ReviewCenter-ProjectPage-ProgressFilter-PageRange

      - id: ReviewCenter-Web-Progress-QueryString
        title: >-
          The Web subsystem shall keep the filters, the sort, and the page of the project page in the query string.
        justification: |
          A link that others can open must show the same list.
        children:
          - ReviewCenter-ProjectPage-ProgressSort-LinksKeepState
        tests:
          - ProjectPage_Render_QueryFilters_NarrowTheTable

      - id: ReviewCenter-Web-Progress-QueryIgnored
        title: >-
          The Web subsystem shall ignore a filter or sort value of the project page query string that it does not
          know.
        justification: |
          A stale or mistyped link must still open the page instead of failing.
        children:
          - ReviewCenter-ProjectPage-ProgressFilter-Ignored

      - id: ReviewCenter-Web-Progress-QueryEncoded
        title: >-
          The Web subsystem shall show text taken from the query string or from a review on the project page encoded,
          never as markup.
        justification: |
          Text that anyone can forge in an address must never inject markup into the page.
        children:
          - ReviewCenter-ProjectPage-ProgressFilter-Encoded

      - id: ReviewCenter-Web-Progress-AuditorView
        title: >-
          The Web subsystem shall show the same project page to a read-only auditor of the project.
        justification: |
          An auditor must be able to read the progress of the project.
        children:
          - ReviewCenter-ProjectPage-ReadOnly
          - ReviewCenter-ProjectPage-ReadOnly-Notice
        tests:
          - ProjectPage_Render_AuditorAndStranger_AuditorSeesTheTableStrangerNothing

      - id: ReviewCenter-Web-Progress-AuditorRestrictions
        title: >-
          The Web subsystem shall offer a read-only auditor of the project no control that creates, plans or administers
          on the project page.
        justification: |
          Read access must not become a way to change records, and the rights must follow a change of role at once.
        children:
          - ReviewCenter-ProjectPage-ReadOnly-NoControls

      - id: ReviewCenter-Web-Progress-AuditorRestrictions-NewReviewPage
        title: >-
          The Web subsystem shall show a read-only auditor on the page for a new review the read-only notice instead of
          the form.
        justification: |
          The form of a new review would invite an action that the auditor may not take.
        children:
          - ReviewCenter-ProjectPage-ReadOnly-NewReviewPage

      - id: ReviewCenter-Web-Progress-AuditorRestrictions-OwnRole
        title: >-
          The Web subsystem shall show a project admin who made the own role auditor the read-only notice and the Audit
          trail button, and neither the members card nor the + New review button.
        justification: |
          The rights must follow a change of the own role at once.
        children:
          - ReviewCenter-ProjectPage-ReadOnly-OwnRole

      - id: ReviewCenter-Web-Progress-AuditorNoRead
        title: >-
          The Web subsystem shall read no repository of the project for a read-only auditor of the project page.
        justification: |
          The list of repositories is for contributors, and the page must not fail on the parts that only they may see.
        children:
          - ReviewCenter-ProjectPage-ReadOnly-NoRepositoryRead

      - id: ReviewCenter-Web-Progress-EmptyProject
        title: >-
          The Web subsystem shall show a neutral message, without the invitation to add the first review, on the
          project page of a project without reviews to a user who may not contribute.
        justification: |
          An auditor cannot add a review, so an invitation to do so would mislead.
        children:
          - ReviewCenter-ProjectPage-ReadOnly-EmptyProject

      - id: ReviewCenter-Web-Progress-OutsiderView
        title: >-
          The Web subsystem shall show nothing of the project page to a user outside the project.
        justification: |
          The page must not reveal a project to a user who may not see it.
        children:
          - ReviewCenter-ProjectPage-ReadOnly-Stranger
        tests:
          - ProjectPage_Render_AuditorAndStranger_AuditorSeesTheTableStrangerNothing

      - id: ReviewCenter-Web-FollowUp
        title: >-
          The Web subsystem shall let a user create a review as a follow-up of an earlier review of the project from the
          page for a new review.
        justification: |
          Carrying work over only helps when the people see what was carried, from where, and what they still have to
          decide. The behavior needs a live connection, so it is verified by the component tests of the units.
        children:
          - ReviewCenter-ProjectPage-FollowUp
          - ReviewCenter-ProjectPage-FollowUp-UploadCreation
          - ReviewCenter-ProjectPage-FollowUp-RepositoryCreation
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-Web-FollowUp-NoChoice
        title: >-
          The Web subsystem shall offer no choice of a review to follow up when the project has no earlier review.
        justification: |
          A choice without an option would only confuse, so the page leaves it out.
        children:
          - ReviewCenter-ProjectPage-FollowUp-NoEarlierReview

      - id: ReviewCenter-Web-FollowUp-PlainReview
        title: >-
          The Web subsystem shall remove the follow-up preview and create a plain review when the choice of the review
          to follow up is cleared.
        justification: |
          A user who changes their mind must get an ordinary review without leftovers of the follow-up.
        children:
          - ReviewCenter-ProjectPage-FollowUp-PlainReview

      - id: ReviewCenter-Web-FollowUp-Title
        title: >-
          The Web subsystem shall suggest the title "Follow-up to" followed by the identifier of the followed review.
        justification: |
          A suggested title saves typing.
        children:
          - ReviewCenter-ProjectPage-FollowUp-Title
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-Web-FollowUp-TitleTyped
        title: >-
          The Web subsystem shall keep a title that the user typed instead of replacing it with the suggestion.
        justification: |
          A title that the user chose must never be overwritten.
        children:
          - ReviewCenter-ProjectPage-FollowUp-TypedTitle

      - id: ReviewCenter-Web-FollowUp-Tag
        title: >-
          The Web subsystem shall mark a follow-up in the list of reviews of a project with a tag that links to the
          review it follows.
        justification: |
          A reader of the list must see which reviews continue earlier ones without opening them.
        children:
          - ReviewCenter-ProjectPage-FollowUp-FollowTag

      - id: ReviewCenter-Web-FollowUp-Refusal
        title: >-
          The Web subsystem shall show the message of the service instead of the follow-up preview when the service
          refuses the follow-up.
        justification: |
          The rules of the service decide what may be followed, so the page shows their message.
        children:
          - ReviewCenter-ProjectPage-FollowUp-Refusal

      - id: ReviewCenter-Web-FollowUp-RefusalOnCreate
        title: >-
          The Web subsystem shall show the same message of the service and create no review when the user creates a
          follow-up that the service refuses.
        justification: |
          A refusal on creation must read as the one on the form and must keep the data unchanged.
        children:
          - ReviewCenter-ProjectPage-FollowUp-RefusalOnCreate

      - id: ReviewCenter-Web-FollowUp-Preview
        title: >-
          The Web subsystem shall show a preview of what is carried over before a follow-up is created.
        justification: |
          The user must see what the follow-up takes over before creating it.
        children:
          - ReviewCenter-ProjectPage-FollowUp-Answers
          - ReviewCenter-ProjectPage-FollowUp-NotApplicableSections
          - ReviewCenter-ProjectPage-FollowUp-OpenThreads
          - ReviewCenter-ProjectPage-FollowUp-ResolvedThreads
          - ReviewCenter-ProjectPage-FollowUp-CheckDiscussions
          - ReviewCenter-ProjectPage-FollowUp-DroppedFiles
        tests:
          - NewReviewPage_FollowUp_Upload_ShowsPreviewSuggestsTitleAndCreatesFollowUp

      - id: ReviewCenter-Web-FollowUp-DropConfirmation
        title: >-
          The Web subsystem shall ask for a confirmation before open threads are dropped from a follow-up.
        justification: |
          Open discussion must not be lost by a single click.
        children:
          - ReviewCenter-ProjectPage-FollowUp-Acknowledgement
          - ReviewCenter-ProjectPage-FollowUp-AcknowledgementPassed

      - id: ReviewCenter-Web-FollowUp-CarriedMarks
        title: >-
          The Web subsystem shall show on the checklist of a follow-up which answers and section states were carried
          and from which review.
        justification: |
          The reviewers must see what they inherited and from where.
        children:
          - ReviewCenter-ChecklistPage-CarriedMarks
          - ReviewCenter-ChecklistPage-CarriedMarks-Section
        tests:
          - ChecklistPage_Render_FollowUp_ShowsCarriedMarksAndEarlierFail

      - id: ReviewCenter-Web-FollowUp-EarlierFail
        title: >-
          The Web subsystem shall show on the checklist of a follow-up the earlier Fail of a check that is open again.
        justification: |
          The reviewers must see why a check is open again.
        children:
          - ReviewCenter-ChecklistPage-CarriedMarks-EarlierFail
          - ReviewCenter-ChecklistPage-CarriedMarks-EarlierFailLink
        tests:
          - ChecklistPage_Render_FollowUp_ShowsCarriedMarksAndEarlierFail

      - id: ReviewCenter-Web-FollowUp-EarlierFailHidden
        title: >-
          The Web subsystem shall show no earlier Fail on the checklist of a follow-up once the check is answered
          again, for a check with other wording, or on a review that follows nothing.
        justification: |
          An earlier Fail that no longer applies to the check would mislead the reviewers.
        children:
          - ReviewCenter-ChecklistPage-CarriedMarks-AnsweredAgain
          - ReviewCenter-ChecklistPage-CarriedMarks-SameWording
          - ReviewCenter-ChecklistPage-CarriedMarks-NoFollowed

      - id: ReviewCenter-Web-FollowUp-Follows
        title: >-
          The Web subsystem shall show on the review page which review it follows.
        justification: |
          A reader must find the earlier review.
        children:
          - ReviewCenter-ReviewPage-FollowUp
          - ReviewCenter-ReviewPage-FollowUp-Counts
        tests:
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-Web-FollowUp-FollowedBy
        title: >-
          The Web subsystem shall show on the review page which reviews follow it.
        justification: |
          A reader must find the later reviews.
        children:
          - ReviewCenter-ReviewPage-FollowUp-FollowedBy
        tests:
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-Web-FollowUp-CarriedThreads
        title: >-
          The Web subsystem shall show on the review page which threads were carried.
        justification: |
          A reader must tell a carried thread from a new one.
        children:
          - ReviewCenter-ReviewPage-FollowUp-CarriedMark
        tests:
          - ReviewPage_Render_FollowUp_ShowsFollowsLinkCountsAndCarriedThreadMark

      - id: ReviewCenter-Web-FollowUp-Standalone
        title: >-
          The Web subsystem shall show no follows line, no list of follow-ups and no carried mark on a review that
          neither follows nor is followed.
        justification: |
          A review that stands alone must not carry empty follow-up furniture that suggests a missing link.
        children:
          - ReviewCenter-ReviewPage-FollowUp-Standalone

      - id: ReviewCenter-Web-OidcSignIn
        title: >-
          The Web subsystem shall offer the sign-in with an OpenID Connect provider as a button beside the form for a
          local account.
        justification: |
          People must find the way that suits their account without reading a manual. The behavior needs a live
          connection, so it is verified by the component tests of the units and by the tests of the flow.
        children:
          - ReviewCenter-LoginPage-OidcButton
        tests:
          - LoginPage_Render_ProviderEnabled_ShowsButtonBesideLocalForm

      - id: ReviewCenter-Web-OidcSignIn-Error
        title: >-
          The Web subsystem shall show a general message next to the provider button when the sign-in with the provider
          failed.
        justification: |
          A user who failed at the provider must learn that it failed without being told why, because the reason may
          help an attacker.
        children:
          - ReviewCenter-LoginPage-OidcButton-Error

      - id: ReviewCenter-Web-OidcSignIn-Off
        title: >-
          The Web subsystem shall show no provider button when the sign-in with a provider is off.
        justification: |
          A button that leads nowhere would invite a sign-in that cannot succeed.
        children:
          - ReviewCenter-LoginPage-OidcButton-Off

      - id: ReviewCenter-Web-OidcSignIn-UserList
        title: >-
          The Web subsystem shall mark the accounts of the OpenID Connect provider on the user list.
        justification: |
          An administrator must tell the accounts of the provider from the local accounts.
        children:
          - ReviewCenter-UsersPage-ExternalAccount

      - id: ReviewCenter-Web-OidcSignIn-NoPassword
        title: >-
          The Web subsystem shall offer no password for the accounts of the OpenID Connect provider on the user list.
        justification: |
          The rules refuse a password for such an account, so the page must not offer one.
        children:
          - ReviewCenter-UsersPage-ExternalAccount-NoPassword

      - id: ReviewCenter-Web-OidcSignIn-OwnPage
        title: >-
          The Web subsystem shall replace the password form of the own page of such an account by a sentence.
        justification: |
          The user must be told where the password is managed instead of seeing a form that does not work.
        children:
          - ReviewCenter-AccountPage-ExternalAccount
          - ReviewCenter-AccountPage-ExternalAccount-NoForm

      - id: ReviewCenter-Web-OidcSignIn-Signature
        title: >-
          The Web subsystem shall offer a confirmation at the provider in place of the password for a signature of such
          an account.
        justification: |
          The user has no password here, so the provider confirms the identity of the signer.
        children:
          - ReviewCenter-ReviewPage-ExternalSignature
          - ReviewCenter-ReviewPage-ExternalSignature-Confirmed
        tests:
          - OidcReauth_ReviewPage_OffersConfirmationThenSigning

      - id: ReviewCenter-Web-OidcSignIn-SignatureFailed
        title: >-
          The Web subsystem shall say after a failed confirmation of identity at the provider, because the provider
          reported no usable sign-in time, that no usable sign-in time was reported.
        justification: |
          A signer whose confirmation failed must learn what to do next.
        children:
          - ReviewCenter-ReviewPage-ExternalSignature-MissingTime

      - id: ReviewCenter-Web-OidcSignIn-SignatureFailedStale
        title: >-
          The Web subsystem shall say after a failed confirmation of identity, because the sign-in was not recent
          enough, that the sign-in was not recent enough.
        justification: |
          A signer whose sign-in is too old needs to know that a fresh sign-in is the way on.
        children:
          - ReviewCenter-ReviewPage-ExternalSignature-StaleTime

      - id: ReviewCenter-Web-OidcSignIn-SignatureFailedGeneral
        title: >-
          The Web subsystem shall give the general message after any other failed confirmation of identity.
        justification: |
          The page must not reveal more than needed about other failures.
        children:
          - ReviewCenter-ReviewPage-ExternalSignature-GeneralMessage

      - id: ReviewCenter-Web-OidcSignIn-HelpTopics
        title: >-
          The Web subsystem shall explain the sign-in with the provider in the help topics.
        justification: |
          The user must find the explanation without reading a manual.
        children:
          - ReviewCenter-HelpPage-OidcSignIn
          - ReviewCenter-HelpPage-OidcSignIn-Signing
          - ReviewCenter-HelpPage-OidcSignIn-ApiTokens

      - id: ReviewCenter-Web-BallotExperience
        title: >-
          The Web subsystem shall keep the answers of the other reviewers hidden on the checklist page from a reviewer
          who has not handed in their own ballot.
        justification: |
          The reviewers have to give independent answers and then settle the differences, and the pages must make both
          steps obvious without a manual. The behavior needs a live connection, so it is verified by the component
          tests of the units.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-NoAnswers
          - ReviewCenter-ChecklistPage-HiddenBallots-NoMark
          - ReviewCenter-ChecklistPage-HiddenBallots-NoCount
          - ReviewCenter-ChecklistPage-HiddenBallots-NoReason
          - ReviewCenter-ChecklistPage-HiddenBallots-NoFailed
        tests:
          - ChecklistPage_DraftBallot_HidesOtherBallotsAndDisputeCounts

      - id: ReviewCenter-Web-BallotExperience-Counts
        title: >-
          The Web subsystem shall tell a reviewer who has not handed in the own ballot how many ballots are handed in
          out of how many.
        justification: |
          A reviewer waiting for the others needs to know how far they are.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots
        tests:
          - ChecklistPage_DraftBallot_HidesOtherBallotsAndDisputeCounts

      - id: ReviewCenter-Web-BallotExperience-CountsNotice
        title: >-
          The Web subsystem shall tell a reviewer who has not handed in the own ballot that the answers of the others
          stay hidden until the own ballot is handed in.
        justification: |
          A reviewer must not learn what the others answered before committing to the own answers.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-Notice

      - id: ReviewCenter-Web-BallotExperience-CountsMissing
        title: >-
          The Web subsystem shall name the other reviewers who have not handed in to a reviewer who has not handed in
          the own ballot.
        justification: |
          A reviewer who waits needs to know whom to ask.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-Missing

      - id: ReviewCenter-Web-BallotExperience-MemberView
        title: >-
          The Web subsystem shall tell a project member who holds no reviewer slot how many ballots are handed in out
          of how many.
        justification: |
          A member who does not take part still sees how far the review is.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-MemberCount

      - id: ReviewCenter-Web-BallotExperience-MemberViewNoStanding
        title: >-
          The Web subsystem shall show a project member who holds no reviewer slot of a review with several slots no
          status line and no progress line.
        justification: |
          A standing could hint at the answers of the reviewers.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-MemberNoStanding

      - id: ReviewCenter-Web-BallotExperience-Administrator
        title: >-
          The Web subsystem shall show a system administrator who holds no ballot the differing answers side by side
          instead of the hidden notice.
        justification: |
          An administrator has to be able to look into a review for support and does not take part in its ballots.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-Administrator

      - id: ReviewCenter-Web-BallotExperience-SingleSlot
        title: >-
          The Web subsystem shall show no ballot count, no hidden notice and no side-by-side answers for a review with
          a single reviewer slot.
        justification: |
          With one reviewer there are no other answers to hide or to compare, so the hiding machinery would only
          confuse.
        children:
          - ReviewCenter-ChecklistPage-HiddenBallots-SingleSlot

      - id: ReviewCenter-Web-BallotExperience-ReviewPage
        title: >-
          The Web subsystem shall keep the answers of the other reviewers hidden on the review page from a reviewer who
          has not handed in their own ballot.
        justification: |
          The review page must not give away what the checklist page hides.
        children:
          - ReviewCenter-ReviewPage-BallotMasking
          - ReviewCenter-ReviewPage-BallotMasking-OwnProgress
          - ReviewCenter-ReviewPage-BallotMasking-CheckThreads
          - ReviewCenter-ReviewPage-BallotMasking-ThreadCount
          - ReviewCenter-ReviewPage-BallotMasking-Conclusion
        tests:
          - ReviewPage_HiddenViewer_ShowsNoStandingConclusionOrCheckThreads

      - id: ReviewCenter-Web-BallotExperience-ReviewPageAdministrator
        title: >-
          The Web subsystem shall show a system administrator the discussions about checks with their count and the
          conclusion, without the notice that they are hidden.
        justification: |
          An administrator who supports a review must see the whole page, so the masking that protects reviewers does
          not apply.
        children:
          - ReviewCenter-ReviewPage-BallotMasking-Administrator

      - id: ReviewCenter-Web-BallotExperience-ProjectOverview
        title: >-
          The Web subsystem shall keep the answers of the other reviewers hidden in the project overview from a
          reviewer who has not handed in their own ballot.
        justification: |
          The project overview must not give away what the checklist page hides.
        children:
          - ReviewCenter-ProjectPage-BallotMasking

      - id: ReviewCenter-Web-BallotExperience-ProjectBallots
        title: >-
          The Web subsystem shall show on the project page how many ballots were handed in of how many a review with
          several reviewer slots needs.
        justification: |
          A lead needs the progress of the ballots at a glance.
        children:
          - ReviewCenter-ProjectPage-Ballots

      - id: ReviewCenter-Web-BallotExperience-ProjectBallotsMissing
        title: >-
          The Web subsystem shall name on the project page the people whose ballot is missing on a review with several
          reviewer slots.
        justification: |
          A lead needs to know whom to ask for a ballot.
        children:
          - ReviewCenter-ProjectPage-Ballots-Missing

      - id: ReviewCenter-Web-BallotExperience-ProjectBallotsSameForEveryViewer
        title: >-
          The Web subsystem shall show the same ballot counts and names on the project page to every viewer, also to a
          viewer who has not handed in their own ballot.
        justification: |
          The figures must not depend on who looks.
        children:
          - ReviewCenter-ProjectPage-Ballots-SameForEveryViewer

      - id: ReviewCenter-Web-BallotExperience-ProjectBallotsSingleSlot
        title: >-
          The Web subsystem shall show only a dash on the project page for the ballots of a review with fewer than two
          reviewer slots.
        justification: |
          A review with a single slot has no ballots to compare.
        children:
          - ReviewCenter-ProjectPage-Ballots-SingleSlot

      - id: ReviewCenter-Web-BallotExperience-MaskedNote
        title: >-
          The Web subsystem shall show a viewer who has not handed in their own ballot in some review the note that
          some details are hidden until they hand it in.
        justification: |
          A viewer who sees fewer details than expected must be told why.
        children:
          - ReviewCenter-ProjectPage-Ballots-MaskedNote

      - id: ReviewCenter-Web-BallotExperience-NoteGone
        title: >-
          The Web subsystem shall show no such note to a viewer who handed in their own ballot in every review.
        justification: |
          A note about hidden details that are not hidden would raise doubts without cause.
        children:
          - ReviewCenter-ProjectPage-Ballots-NoteGone

      - id: ReviewCenter-Web-BallotExperience-History
        title: >-
          The Web subsystem shall keep the answers of the other reviewers hidden in the history from a reviewer who has
          not handed in their own ballot.
        justification: |
          The history must not give away what the checklist page hides.
        children:
          - ReviewCenter-HistoryPage-BallotMasking
          - ReviewCenter-HistoryPage-BallotMasking-Metadata
        tests:
          - HistoryPage_HiddenViewer_HidesAnswerDetailsOnly

      - id: ReviewCenter-Web-BallotExperience-HistoryVisible
        title: >-
          The Web subsystem shall show the details of the history entries in full to a viewer who may see the other
          ballots.
        justification: |
          Hiding is meant for reviewers who have not handed in, so every other viewer needs the complete record.
        children:
          - ReviewCenter-HistoryPage-BallotMasking-Visible

      - id: ReviewCenter-Web-BallotExperience-SideBySide
        title: >-
          The Web subsystem shall offer a reviewer who has handed in their ballot the differing answers side by side.
        justification: |
          The reviewers settle the differences, so they must see them next to each other.
        children:
          - ReviewCenter-ChecklistPage-SideBySide
          - ReviewCenter-ChecklistPage-SideBySide-Order
          - ReviewCenter-ChecklistPage-SideBySide-Badge
          - ReviewCenter-ChecklistPage-SideBySide-Reason
          - ReviewCenter-ChecklistPage-SideBySide-ReasonEncoded
          - ReviewCenter-ChecklistPage-SideBySide-OwnReason
          - ReviewCenter-ChecklistPage-SideBySide-History
        tests:
          - ChecklistPage_SubmittedBallot_ShowsSideBySideForDifferingChecks

      - id: ReviewCenter-Web-BallotExperience-SideBySideSummary
        title: >-
          The Web subsystem shall say at the top of the checklist how many checks are answered differently.
        justification: |
          Reviewers need the size of the dispute before they read the single checks.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-Summary

      - id: ReviewCenter-Web-BallotExperience-SideBySideFailedStatus
        title: >-
          The Web subsystem shall word the status line "Checklist complete, N checks failed." when the submitted
          ballots agree on a failure.
        justification: |
          Reviewers need the state of the review when the ballots agree on a failure.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-FailedStatus

      - id: ReviewCenter-Web-BallotExperience-Discuss
        title: >-
          The Web subsystem shall offer a button to discuss a differing answer.
        justification: |
          The way from a difference to its discussion must be one click.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-Discuss

      - id: ReviewCenter-Web-BallotExperience-DiscussThread
        title: >-
          The Web subsystem shall start a discussion thread about the check with the text given when the reviewer starts
          the discussion in the Discuss form.
        justification: |
          The discussion must be a record on the review, so that its outcome is kept and can be found.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-Thread

      - id: ReviewCenter-Web-BallotExperience-DiscussThreadKind
        title: >-
          The Web subsystem shall start the discussion as a Finding when the reviewer chooses the kind Finding in the
          Discuss form.
        justification: |
          A difference that the reviewers cannot settle may be a finding that must be tracked.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-DiscussKind

      - id: ReviewCenter-Web-BallotExperience-DiscussThreadLink
        title: >-
          The Web subsystem shall link the notice of a started discussion to the review page.
        justification: |
          The reviewer must be able to reach the thread that was started.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-ThreadLink

      - id: ReviewCenter-Web-BallotExperience-DiscussNoThread
        title: >-
          The Web subsystem shall refuse an empty Discuss text with a message next to the form.
        justification: |
          An empty thread would be noise, so the reviewer is told what is missing.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-Empty

      - id: ReviewCenter-Web-BallotExperience-DiscussNotStarted
        title: >-
          The Web subsystem shall start no thread when the Discuss text is empty.
        justification: |
          A refused discussion must leave no record on the review.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-EmptyNotStarted

      - id: ReviewCenter-Web-BallotExperience-DiscussCancel
        title: >-
          The Web subsystem shall close the Discuss form without starting a thread when the reviewer cancels.
        justification: |
          A reviewer who changes their mind must be able to leave without a trace.
        children:
          - ReviewCenter-ChecklistPage-SideBySide-Cancel

      - id: ReviewCenter-Web-BallotExperience-SubmitAndSign
        title: >-
          The Web subsystem shall offer Submit and sign where the rules accept it.
        justification: |
          A reviewer who is done should not have to take two steps where one is allowed.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign
          - ReviewCenter-ChecklistPage-SubmitAndSign-Password
          - ReviewCenter-ChecklistPage-SubmitAndSign-Code
          - ReviewCenter-ChecklistPage-SubmitAndSign-Secondary
          - ReviewCenter-ChecklistPage-SubmitAndSign-MissingBallots
        tests:
          - ChecklistPage_SubmitAndSign_SubmitsThenSigns

      - id: ReviewCenter-Web-BallotExperience-Sign
        title: >-
          The Web subsystem shall hand the ballot in and then sign it when the Submit and sign button is pressed.
        justification: |
          The reviewer states the intent once, and the two records must still be made in their proper order.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-Sign
        tests:
          - ChecklistPage_SubmitAndSign_SubmitsThenSigns

      - id: ReviewCenter-Web-BallotExperience-SubmitOnly
        title: >-
          The Web subsystem shall hand the ballot in without signing when the Submit ballot button is pressed.
        justification: |
          A reviewer may be done with the answers and not yet ready to sign, so the hand-in stands on its own.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-SubmitOnly

      - id: ReviewCenter-Web-BallotExperience-Provider
        title: >-
          The Web subsystem shall hand the ballot in for an account of an identity provider when the Submit and sign
          button is pressed.
        justification: |
          An account of a provider has no password here, so the hand-in goes through the provider.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-ProviderHandIn

      - id: ReviewCenter-Web-BallotExperience-ProviderConfirm
        title: >-
          The Web subsystem shall ask the user of an account of an identity provider to confirm the identity at the
          provider before the ballot is handed in.
        justification: |
          The provider confirms the identity that signs the ballot.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-ProviderConfirm

      - id: ReviewCenter-Web-BallotExperience-ProviderNoSecrets
        title: >-
          The Web subsystem shall show no field, and hand nothing over, for an account of an identity provider when the
          button to sign is pressed.
        justification: |
          A password or a code must never be asked for, or passed on, for an account that has none here.
        children:
          - ReviewCenter-ChecklistPage-SignConfirm-NoFields
          - ReviewCenter-ChecklistPage-SignConfirm-NoEntries

      - id: ReviewCenter-Web-BallotExperience-Revealed
        title: >-
          The Web subsystem shall sign nothing when the view reloaded after the hand-in shows a check that the submitted
          ballots answer differently.
        justification: |
          A signature given before the user saw the differences that the hand-in revealed would not be informed.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-Revealed

      - id: ReviewCenter-Web-BallotExperience-Revealed-Explains
        title: >-
          The Web subsystem shall tell the user that something changed when the view reloaded after the hand-in shows a
          check that the submitted ballots answer differently.
        justification: |
          A user whose signing was stopped must learn why.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-RevealedExplains

      - id: ReviewCenter-Web-BallotExperience-Revealed-Provider
        title: >-
          The Web subsystem shall skip the confirmation of the identity at the provider for an account of an identity
          provider when the hand-in revealed a difference.
        justification: |
          No signature follows, so asking the provider to confirm the identity would be pointless.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-ProviderRevealed

      - id: ReviewCenter-Web-BallotExperience-Refused
        title: >-
          The Web subsystem shall keep the ballot handed in when the signature is refused after the hand-in.
        justification: |
          A refusal of the signature must not undo or hide the hand-in that was already made.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-RefusedKeeps

      - id: ReviewCenter-Web-BallotExperience-RefusedExplains
        title: >-
          The Web subsystem shall say that the ballot is handed in but the signature failed, with a link to the review,
          when the signature is refused after the hand-in.
        justification: |
          The reviewer must learn what state the ballot is in and where to go on.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-RefusedExplains

      - id: ReviewCenter-Web-BallotExperience-NotOffered
        title: >-
          The Web subsystem shall offer neither Submit and sign nor Submit ballot for a draft that is not complete.
        justification: |
          The rules refuse an incomplete draft, so the page must not offer buttons that can only fail.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-Incomplete

      - id: ReviewCenter-Web-BallotExperience-NotOfferedSingleSlot
        title: >-
          The Web subsystem shall not offer Submit and sign in a review with a single reviewer slot.
        justification: |
          The rules refuse the signed hand-in for a single slot, so the page must not offer a button that can only fail.
        children:
          - ReviewCenter-ChecklistPage-SubmitAndSign-SingleSlot

      - id: ReviewCenter-Web-BallotExperience-Confirm
        title: >-
          The Web subsystem shall show a password field to a local account that confirms a signature.
        justification: |
          A secret that is typed once must travel once and must not stay in the page afterwards.
        children:
          - ReviewCenter-ChecklistPage-SignConfirm

      - id: ReviewCenter-Web-BallotExperience-Confirm-Code
        title: >-
          The Web subsystem shall show a code field to a local account that has a second factor.
        justification: |
          A second factor is useless unless the signer can enter the code.
        children:
          - ReviewCenter-ChecklistPage-SignConfirm-Code

      - id: ReviewCenter-Web-BallotExperience-Confirm-HandOver
        title: >-
          The Web subsystem shall hand the password to the page once when the button is pressed.
        justification: |
          A secret that is typed once must travel once.
        children:
          - ReviewCenter-ChecklistPage-SignConfirm-HandOver

      - id: ReviewCenter-Web-BallotExperience-Confirm-HandOverCode
        title: >-
          The Web subsystem shall hand the code to the page together with the password when the button is pressed.
        justification: |
          The server checks the code with the password, so both must arrive together.
        children:
          - ReviewCenter-ChecklistPage-SignConfirm-HandOverCode

      - id: ReviewCenter-Web-BallotExperience-Confirm-Clear
        title: >-
          The Web subsystem shall clear the password field after the button is pressed.
        justification: |
          A secret must not stay in the page after it was handed over.
        children:
          - ReviewCenter-ChecklistPage-SignConfirm-Clear

      - id: ReviewCenter-Web-BallotExperience-AssignMe
        title: >-
          The Web subsystem shall offer Assign me as reviewer where the rules accept it.
        justification: |
          A user who wants to take part must be able to join without asking someone to assign them.
        children:
          - ReviewCenter-ChecklistPage-AssignMe
        tests:
          - ChecklistPage_AssignMe_AddsNewSlotAndKeepsExistingOnes

      - id: ReviewCenter-Web-BallotExperience-AssignMeSlot
        title: >-
          The Web subsystem shall add a new reviewer slot with the user as primary reviewer when Assign me as reviewer
          is pressed.
        justification: |
          Joining must never take over or disturb the place of another reviewer.
        children:
          - ReviewCenter-ChecklistPage-AssignMe-NewSlot
        tests:
          - ChecklistPage_AssignMe_AddsNewSlotAndKeepsExistingOnes

      - id: ReviewCenter-Web-BallotExperience-AssignMeSlot-NoAlternate
        title: >-
          The Web subsystem shall add the new reviewer slot of Assign me as reviewer with no alternate reviewer.
        justification: |
          The user joins alone; an alternate is a decision of the project.
        children:
          - ReviewCenter-ChecklistPage-AssignMe-NoAlternate
        tests:
          - ChecklistPage_AssignMe_AddsNewSlotAndKeepsExistingOnes

      - id: ReviewCenter-Web-BallotExperience-AssignMeSlot-KeepsSlots
        title: >-
          The Web subsystem shall leave every existing reviewer slot as it is when Assign me as reviewer is pressed.
        justification: |
          Joining must leave the place of every other reviewer as it was, never taking over or disturbing it.
        children:
          - ReviewCenter-ChecklistPage-AssignMe-KeepsSlots
        tests:
          - ChecklistPage_AssignMe_AddsNewSlotAndKeepsExistingOnes

      - id: ReviewCenter-Web-BallotExperience-AssignMeNotOffered
        title: >-
          The Web subsystem shall not offer Assign me as reviewer to a user who holds a reviewer slot or who is not a
          member of the project.
        justification: |
          A user who already holds a slot, or who has no right to join, would only be refused, so the page offers
          nothing.
        children:
          - ReviewCenter-ChecklistPage-AssignMe-SlotHolder
          - ReviewCenter-ChecklistPage-AssignMe-NonMember

      - id: ReviewCenter-Web-BallotExperience-HelpTopics
        title: >-
          The Web subsystem shall explain the ballot steps in the help topics.
        justification: |
          The reviewers have to understand the steps without a manual. The topic that explains how to read a review
          covers the own ballot, the submission, and the hidden conclusion.
        children:
          - ReviewCenter-HelpPage-ReadingReviewTopic
          - ReviewCenter-HelpPage-ReadingReviewTopic-ConclusionHidden
          - ReviewCenter-HelpPage-InboxTopic-HiddenBallots
        tests:
          - HelpPage_ReadingReview_ShowsSlotOwnerNote

      - id: ReviewCenter-Web-TotpSecondFactor
        title: >-
          The Web subsystem shall let a person with a local account set up the second factor on their own page.
        justification: |
          The pages must make the safe way the easy way and must not offer what the rules refuse, so the person finds
          the way that suits their account without reading a manual.
        children:
          - ReviewCenter-AccountPage-Totp
          - ReviewCenter-AccountPage-Totp-Start
          - ReviewCenter-AccountPage-Totp-Secret
          - ReviewCenter-AccountPage-Totp-Confirm
          - ReviewCenter-AccountPage-Totp-RecoveryCodes
          - ReviewCenter-AccountPage-Totp-RecoveryOnce
          - ReviewCenter-AccountPage-Totp-GiveUp
        tests:
          - AccountPage_Confirm_RightCode_ShowsTenRecoveryCodesOnceAndNoSecret

      - id: ReviewCenter-Web-TotpSecondFactor-WrongCode
        title: >-
          The Web subsystem shall answer a wrong code on the account page with a general message, for the confirmation,
          the new recovery codes and the turning off.
        justification: |
          A wrong code must reveal nothing and must never leave the account in a half-changed state.
        children:
          - ReviewCenter-AccountPage-Totp-ConfirmWrongCode
          - ReviewCenter-AccountPage-Totp-RegenerateWrongCode
          - ReviewCenter-AccountPage-Totp-DisableWrongCode

      - id: ReviewCenter-Web-TotpSecondFactor-WrongCode-SetupOpen
        title: >-
          The Web subsystem shall keep the set-up of the second factor open after a wrong code for its confirmation.
        justification: |
          The account must not be left half changed after a wrong code.
        children:
          - ReviewCenter-AccountPage-Totp-ConfirmWrongCode-SetupOpen

      - id: ReviewCenter-Web-TotpSecondFactor-WrongCode-NoCodes
        title: >-
          The Web subsystem shall show no recovery codes after a wrong code for new recovery codes.
        justification: |
          Recovery codes must not be revealed to a person who did not prove the code.
        children:
          - ReviewCenter-AccountPage-Totp-RegenerateWrongCode-NoCodes

      - id: ReviewCenter-Web-TotpSecondFactor-WrongCode-StaysOn
        title: >-
          The Web subsystem shall keep the second factor on after a wrong code for turning it off.
        justification: |
          Turning a protection off needs the proof, so a wrong code leaves it on.
        children:
          - ReviewCenter-AccountPage-Totp-DisableWrongCode-StaysOn

      - id: ReviewCenter-Web-TotpSecondFactor-Recovery
        title: >-
          The Web subsystem shall show how many recovery codes are left.
        justification: |
          A person who lost the device needs the recovery codes, so they must see when the supply runs low.
        children:
          - ReviewCenter-AccountPage-Totp-RecoveryLeft

      - id: ReviewCenter-Web-TotpSecondFactor-RecoveryRegenerate
        title: >-
          The Web subsystem shall replace the recovery codes when the user gives the password and a code.
        justification: |
          Renewing the supply of recovery codes must need proof that the user holds the account.
        children:
          - ReviewCenter-AccountPage-Totp-Regenerate

      - id: ReviewCenter-Web-TotpSecondFactor-FieldsEmptied
        title: >-
          The Web subsystem shall empty the password and code fields of the second-factor card after an attempt.
        justification: |
          A secret that was typed must not stay in the page after it was used.
        children:
          - ReviewCenter-AccountPage-Totp-FieldsEmptied

      - id: ReviewCenter-Web-TotpSecondFactor-NoCard
        title: >-
          The Web subsystem shall show no card for the second factor while the feature is off or the password is
          temporary.
        justification: |
          The rules refuse a set-up in both cases, so the page must not offer one.
        children:
          - ReviewCenter-AccountPage-Totp-FeatureOff
          - ReviewCenter-AccountPage-Totp-TemporaryPassword

      - id: ReviewCenter-Web-TotpSecondFactor-External
        title: >-
          The Web subsystem shall show, for an account of a provider, a sentence that the provider handles the second
          factor of the sign-in.
        justification: |
          A user of a provider has no second factor here and must be told where it is handled.
        children:
          - ReviewCenter-AccountPage-Totp-External

      - id: ReviewCenter-Web-TotpSecondFactor-TurnOff
        title: >-
          The Web subsystem shall let a person with a local account turn off the second factor on their own page.
        justification: |
          A person who no longer wants the second factor must be able to remove it.
        children:
          - ReviewCenter-AccountPage-Totp-Disable

      - id: ReviewCenter-Web-TotpSecondFactor-CodePage
        title: >-
          The Web subsystem shall ask for the code after the password in a page of its own.
        justification: |
          The code is asked for only after the password was right, so a wrong password never reveals that the account
          has a second factor.
        children:
          - ReviewCenter-TotpLoginPage-SecondStepForm
          - ReviewCenter-TotpLoginPage-SecondStepForm-NoUserName
        tests:
          - TotpLoginPage_Render_PendingSignIn_ShowsCodeFormAndNoUserName

      - id: ReviewCenter-Web-TotpSecondFactor-CodePage-Refused
        title: >-
          The Web subsystem shall show the same message for a wrong code whatever the reason, a message that does not
          tell the cause.
        justification: |
          An identical message gives an attacker nothing to tell the causes apart.
        children:
          - ReviewCenter-TotpLoginPage-SecondStepForm-WrongCode

      - id: ReviewCenter-Web-TotpSecondFactor-CodePageThrottled
        title: >-
          The Web subsystem shall show a message that there were too many attempts when the client made too many
          attempts.
        justification: |
          The limit on attempts slows down guessing, and the user must learn why the code was not taken.
        children:
          - ReviewCenter-TotpLoginPage-SecondStepForm-Throttled

      - id: ReviewCenter-Web-TotpSecondFactor-CodePage-NoPending
        title: >-
          The Web subsystem shall send a visitor who has no valid pending sign-in, or whose pending sign-in was
          started from another address, to the login page.
        justification: |
          The page for the code makes sense only right after a right password, so it must not be reachable otherwise.
        children:
          - ReviewCenter-TotpLoginPage-SecondStepForm-NoPendingSignIn
          - ReviewCenter-TotpLoginPage-SecondStepForm-OtherAddress

      - id: ReviewCenter-Web-TotpSecondFactor-ExpiredNotice
        title: >-
          The Web subsystem shall show on the login page a notice that the sign-in with the code has ended, and no
          password error, when the address carries the totp-expired flag.
        justification: |
          A person whose sign-in timed out must learn that they only have to start again, not that the password was
          wrong.
        children:
          - ReviewCenter-LoginPage-TotpExpiredNotice
          - ReviewCenter-LoginPage-TotpExpiredNotice-NoPasswordError

      - id: ReviewCenter-Web-TotpSecondFactor-WrongPasswordNoNotice
        title: >-
          The Web subsystem shall show no notice that the sign-in with the code has ended for a wrong password.
        justification: |
          The notice would tell a visitor who guessed a password that the account has a second factor.
        children:
          - ReviewCenter-LoginPage-TotpExpiredNotice-WrongPassword

      - id: ReviewCenter-Web-TotpSecondFactor-CodePage-Antiforgery
        title: >-
          The Web subsystem shall put an antiforgery token into the form of the page that asks for the code.
        justification: |
          The token stops another site from posting a code on behalf of the person who is signing in. It is added by
          the server when the page is served, so only the page requested over HTTP shows it.
        tests:
          - TotpSignIn_CodePage_PendingSignIn_FormCarriesAntiforgeryToken

      - id: ReviewCenter-Web-TotpSecondFactor-SignatureCode
        title: >-
          The Web subsystem shall ask for the code beside the password in the sign form of a review.
        justification: |
          A signature is confirmed with the same factors as the sign-in.
        children:
          - ReviewCenter-ReviewPage-SignTotpCode
          - ReviewCenter-ReviewPage-SignTotpCode-CodePassed
          - ReviewCenter-ReviewPage-SignTotpCode-FieldsCleared

      - id: ReviewCenter-Web-TotpSecondFactor-SignatureCodeNoField
        title: >-
          The Web subsystem shall show no code field in the sign form for a signer without a second factor.
        justification: |
          A field that the signer cannot fill would only confuse and could not be satisfied.
        children:
          - ReviewCenter-ReviewPage-SignTotpCode-NoCodeField

      - id: ReviewCenter-Web-TotpSecondFactor-SignatureCodeRefused
        title: >-
          The Web subsystem shall answer a wrong code, a code already used in its time step and a recovery code typed
          in place of the code with the same message and sign nothing.
        justification: |
          One message for every refusal tells an attacker nothing, and a refused code must never produce a signature.
        children:
          - ReviewCenter-ReviewPage-SignTotpCode-WrongCode
          - ReviewCenter-ReviewPage-SignTotpCode-ReusedCode
          - ReviewCenter-ReviewPage-SignTotpCode-RecoveryCode

      - id: ReviewCenter-Web-TotpSecondFactor-Visibility
        title: >-
          The Web subsystem shall show administrators who has a second factor.
        justification: |
          An administrator must see whose second factor can be reset.
        children:
          - ReviewCenter-UsersPage-TotpReset
          - ReviewCenter-UsersPage-TotpReset-FeatureOff

      - id: ReviewCenter-Web-TotpSecondFactor-VisibilityExternal
        title: >-
          The Web subsystem shall show no second-factor badge and no reset button for an account of a provider.
        justification: |
          The provider holds the second factor of such an account, so the badge and the reset would not be true.
        children:
          - ReviewCenter-UsersPage-TotpReset-External

      - id: ReviewCenter-Web-TotpSecondFactor-Reset
        title: >-
          The Web subsystem shall let a system administrator reset the second factor of a user.
        justification: |
          A user who lost the device must be able to get back in.
        children:
          - ReviewCenter-UsersPage-TotpReset-ResetButton
          - ReviewCenter-UsersPage-TotpReset-Reset
          - ReviewCenter-UsersPage-TotpReset-ResetStatus
          - ReviewCenter-UsersPage-Confirmations
          - ReviewCenter-UsersPage-Confirmations-ResetSecondClick

      - id: ReviewCenter-Web-TotpSecondFactor-ResetCancelled
        title: >-
          The Web subsystem shall change nothing when the confirmation of the reset of the second factor is cancelled.
        justification: |
          A reset removes a protection, so backing out of the confirmation must leave the account as it was.
        children:
          - ReviewCenter-UsersPage-Confirmations-ResetCancel

      - id: ReviewCenter-Web-TotpSecondFactor-ResetRefused
        title: >-
          The Web subsystem shall show an error when the second factor is reset while the signed-in user is no longer a
          system administrator or nobody is signed in.
        justification: |
          A right can be withdrawn between showing the button and pressing it, so the refusal must be shown.
        children:
          - ReviewCenter-UsersPage-TotpReset-ResetError

      - id: ReviewCenter-Web-TotpSecondFactor-ResetKept
        title: >-
          The Web subsystem shall keep the second factor of the account when the reset is refused.
        justification: |
          A refused reset must leave the protection of the account in force.
        children:
          - ReviewCenter-UsersPage-TotpReset-ResetKept

      - id: ReviewCenter-Web-TotpSecondFactor-HelpTopic
        title: >-
          The Web subsystem shall explain the second factor in a help topic.
        justification: |
          The person finds the way that suits their account without reading a manual.
        children:
          - ReviewCenter-HelpPage-TwoFactorTopic
          - ReviewCenter-HelpPage-TwoFactorTopic-SignIn
          - ReviewCenter-HelpPage-TwoFactorTopic-Recovery
          - ReviewCenter-HelpPage-TwoFactorTopic-SigningWithCode
          - ReviewCenter-HelpPage-TwoFactorTopic-TurnOff
          - ReviewCenter-HelpPage-TwoFactorTopic-Reset
          - ReviewCenter-HelpPage-TwoFactorTopic-Unaffected
          - ReviewCenter-HelpPage-TwoFactorTopic-SigningLink

      - id: ReviewCenter-Web-Inbox
        title: >-
          The Web subsystem shall give a signed-in user an inbox page that lists the reviews that wait for the user in
          eight groups (to answer, disputed, ready to sign, signature no longer counts, replies waiting, failed checks,
          waiting for others, and updates).
        justification: |
          A reviewer should learn from the first page what waits and be led to it.
        children:
          - ReviewCenter-InboxPage-Sections
          - ReviewCenter-InboxPage-Sections-Project
          - ReviewCenter-InboxPage-Sections-ChecklistLink
          - ReviewCenter-InboxPage-Sections-ReviewLink
          - ReviewCenter-InboxPage-Sections-QuestionLink
          - ReviewCenter-InboxPage-Sections-DetailLine
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks
          - WebSubsystem_InboxPage_SignedIn_IsServedAsInteractivePage

      - id: ReviewCenter-Web-Inbox-DueMark
        title: >-
          The Web subsystem shall mark the due date of an action item with the word Due, and with the word Overdue
          when the date has passed.
        justification: |
          A user who sorts the work by urgency must see which items are late without opening them.
        children:
          - ReviewCenter-InboxPage-Sections-DueMark
          - ReviewCenter-InboxPage-Sections-OverdueMark

      - id: ReviewCenter-Web-Inbox-Empty
        title: >-
          The Web subsystem shall show a short message when nothing needs action.
        justification: |
          An empty page would read as a fault, so it says that nothing waits.
        children:
          - ReviewCenter-InboxPage-Sections-EmptyMessage

      - id: ReviewCenter-Web-Inbox-Interactive
        title: >-
          The Web subsystem shall set the interactive marker on the inbox page once it has rendered.
        justification: |
          The marker tells that the page is ready to be used.
        children:
          - ReviewCenter-InboxPage-Interactive

      - id: ReviewCenter-Web-Inbox-Summary
        title: >-
          The Web subsystem shall show a summary on the inbox page.
        justification: |
          The summary tells at a glance how many reviews need action.
        children:
          - ReviewCenter-InboxPage-Summary
          - ReviewCenter-InboxPage-Summary-WaitingCount
          - ReviewCenter-InboxPage-Summary-WaitingNotAction
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks

      - id: ReviewCenter-Web-Inbox-Chip
        title: >-
          The Web subsystem shall show a chip on each item of the inbox page.
        justification: |
          The chip tells what the user is asked to do with the item.
        children:
          - ReviewCenter-InboxPage-Sections-Chip
        tests:
          - InboxPage_Render_ToAnswerAndRepliesWaiting_ShowsSectionsRowsChipsAndLinks

      - id: ReviewCenter-Web-Inbox-NewBadge
        title: >-
          The Web subsystem shall show a New badge on each new item of the inbox page.
        justification: |
          The user must see what is new without a second place to look.
        children:
          - ReviewCenter-InboxPage-Sections-NewBadge

      - id: ReviewCenter-Web-Inbox-MarkAllRead
        title: >-
          The Web subsystem shall offer a button on the inbox page to mark all items as read.
        justification: |
          A user who has caught up must be able to clear the marks at once.
        children:
          - ReviewCenter-InboxPage-MarkAllRead
          - ReviewCenter-InboxPage-MarkAllRead-BadgesCleared

      - id: ReviewCenter-Web-Inbox-HomeCount
        title: >-
          The Web subsystem shall show the number of reviews that need action on the home page.
        justification: |
          The first page must tell what waits.
        children:
          - ReviewCenter-HomePage-InboxCard

      - id: ReviewCenter-Web-Inbox-HomeCountNone
        title: >-
          The Web subsystem shall show on the home page the sentence that nothing needs action when the number of
          reviews that need the action of the user is zero.
        justification: |
          A zero must read as good news and not as a missing number.
        children:
          - ReviewCenter-HomePage-InboxCard-NoAction

      - id: ReviewCenter-Web-Inbox-HeaderTab
        title: >-
          The Web subsystem shall show the number of reviews that need action on an Inbox tab of the header.
        justification: |
          The number must be visible from every page.
        children:
          - ReviewCenter-App-InboxBadge
          - ReviewCenter-App-InboxBadge-Tab
          - ReviewCenter-App-InboxBadge-HiddenAtZero
          - ReviewCenter-App-InboxBadge-Capped
          - ReviewCenter-App-InboxBadge-AccessibleLabel

      - id: ReviewCenter-Web-Inbox-HeaderTabRefresh
        title: >-
          The Web subsystem shall read the number of reviews that need action when the layout starts and again on each
          navigation, once per user in 30 seconds.
        justification: |
          The number must stay current while the user moves around, without a read of the store on every request.
        children:
          - ReviewCenter-App-InboxBadge-ReadAtStart
          - ReviewCenter-App-InboxBadge-ReadOnNavigation
          - ReviewCenter-App-InboxBadge-Cache

      - id: ReviewCenter-Web-Inbox-HeaderTabNoTab
        title: >-
          The Web subsystem shall ask for no number and show no Inbox tab when nobody is signed in or the password is
          temporary.
        justification: |
          A visitor who is not signed in, or who must first change a temporary password, has no inbox to point to.
        children:
          - ReviewCenter-App-InboxBadge-NoRead

      - id: ReviewCenter-Web-Inbox-HeaderTabReadFailure
        title: >-
          The Web subsystem shall hide the badge and still render the page when the number cannot be read.
        justification: |
          A failing read of a convenience figure must never make the whole page fail.
        children:
          - ReviewCenter-App-InboxBadge-ReadFailure
          - ReviewCenter-App-InboxBadge-ReadFailurePage

      - id: ReviewCenter-Web-Inbox-IndexMarkers
        title: >-
          The Web subsystem shall mark the new comments of a review in its thread index.
        justification: |
          The marks must show what is new without a second place to look.
        children:
          - ReviewCenter-ReviewPage-UnreadMarkers-Index

      - id: ReviewCenter-Web-Inbox-ThreadMarkers
        title: >-
          The Web subsystem shall mark the new comments of a review in its threads.
        justification: |
          The marks must show what is new where the reader reads.
        children:
          - ReviewCenter-ReviewPage-UnreadMarkers

      - id: ReviewCenter-Web-Inbox-MarkersSummary
        title: >-
          The Web subsystem shall give the number of comments that are new to the user in the summary of the review.
        justification: |
          The summary tells the reader before reading how much has been added.
        children:
          - ReviewCenter-ReviewPage-UnreadMarkers-Summary

      - id: ReviewCenter-Web-Inbox-MarkersNone
        title: >-
          The Web subsystem shall show no New badge for the comments of the user, nor on a later visit when nothing
          was added since the last visit.
        justification: |
          A badge on what the user wrote, or on what the user has already seen, would be noise.
        children:
          - ReviewCenter-ReviewPage-UnreadMarkers-OwnComments
          - ReviewCenter-ReviewPage-UnreadMarkers-LaterVisit

      - id: ReviewCenter-Web-Inbox-SeenOnVisit
        title: >-
          The Web subsystem shall remember on a visit to a review what the user has seen.
        justification: |
          A comment stops being new once the user has seen it.
        children:
          - ReviewCenter-ReviewPage-MarkSeen
          - ReviewCenter-ReviewPage-MarkSeen-Baseline
          - ReviewCenter-ReviewPage-MarkSeen-LoadStart
          - ReviewCenter-ReviewPage-MarkSeen-ParameterChange

      - id: ReviewCenter-Web-Inbox-SeenNoAccess
        title: >-
          The Web subsystem shall store nothing as seen for a user who may not see the review.
        justification: |
          A user who may not see a review has seen nothing of it, so there is nothing to record.
        children:
          - ReviewCenter-ReviewPage-MarkSeen-NoAccess

      - id: ReviewCenter-Web-Inbox-SignedInOnly
        title: >-
          The Web subsystem shall serve the inbox page only to a signed-in user.
        justification: |
          The inbox lists the reviews of one user, so nobody else may see it.
        children:
          - ReviewCenter-InboxPage-Access
          - ReviewCenter-InboxPage-Interactive-Challenge
        tests:
          - WebSubsystem_InboxPage_Unauthenticated_IsChallenged

      - id: ReviewCenter-Web-Inbox-HelpTopic
        title: >-
          The Web subsystem shall explain the inbox in a help topic.
        justification: |
          The help topic explains what the number counts and what clears it.
        children:
          - ReviewCenter-HelpPage-InboxTopic
          - ReviewCenter-HelpPage-InboxTopic-QuestionForYou
          - ReviewCenter-HelpPage-InboxTopic-NewMarker
          - ReviewCenter-HelpPage-InboxTopic-MarkAllRead
          - ReviewCenter-HelpPage-InboxTopic-HiddenBallots
          - ReviewCenter-HelpPage-InboxTopic-SeenNotRecorded

      - id: ReviewCenter-Web-WhereAreWe
        title: >-
          The Web subsystem shall show on the review page a panel that says where the review stands and what to do
          next.
        justification: |
          People who review together must know the standing without reading every card. The behavior needs a live
          connection, so it is verified by the component tests of the units.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-NextAction
        tests:
          - ReviewStatusPanel_ShowsExactlyOneNextActionButton

      - id: ReviewCenter-Web-WhereAreWe-Ballots
        title: >-
          The Web subsystem shall show in the status panel each reviewer's ballot and signature.
        justification: |
          The reader sees who is done without opening the checklist.
        children:
          - ReviewCenter-ReviewPage-StatusPanel
          - ReviewCenter-ReviewPage-StatusPanel-Signature

      - id: ReviewCenter-Web-WhereAreWe-Differences
        title: >-
          The Web subsystem shall show in the status panel the checks answered differently, with a way to discuss them.
        justification: |
          The differences are what the reviewers have to settle.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-Disputed
          - ReviewCenter-ReviewPage-StatusPanel-Discuss

      - id: ReviewCenter-Web-WhereAreWe-DiscussWarning
        title: >-
          The Web subsystem shall show the signature warning in the form first when starting a discussion would make a
          signature stale.
        justification: |
          A discussion can change the record that reviewers have signed, so the user must see that first.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-DiscussWarning

      - id: ReviewCenter-Web-WhereAreWe-DiscussConfirm
        title: >-
          The Web subsystem shall store a discussion that would make a signature stale only when the signature warning
          is confirmed.
        justification: |
          The user must agree to the effect on the signatures before the discussion is stored.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-DiscussConfirm

      - id: ReviewCenter-Web-WhereAreWe-DiscussCancel
        title: >-
          The Web subsystem shall store nothing and keep the typed text in the form when the signature warning is
          cancelled.
        justification: |
          A user who backs out of the warning must not lose what was typed and must not change the record.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-DiscussCancel

      - id: ReviewCenter-Web-WhereAreWe-OpenQuestions
        title: >-
          The Web subsystem shall show in the status panel the open questions and findings.
        justification: |
          The open questions are what stands between the review and its approval.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-OpenCounts

      - id: ReviewCenter-Web-WhereAreWe-ChangesSince
        title: >-
          The Web subsystem shall explain to a reviewer whose signature no longer matches the report what changed since
          the signature.
        justification: |
          A reviewer who is asked to sign again must see why.
        children:
          - ReviewCenter-ReviewPage-ChangesSinceSigning
          - ReviewCenter-ReviewPage-ChangesSinceSigning-List
          - ReviewCenter-ReviewPage-ChangesSinceSigning-Change
          - ReviewCenter-ReviewPage-ChangesSinceSigning-Note
        tests:
          - ReviewPage_SignedThenChanged_ExplainsWhatChanged

      - id: ReviewCenter-Web-WhereAreWe-ChangesSinceWarning
        title: >-
          The Web subsystem shall say in the warning before a change that alters the report that the signed reviewers
          will need to look again and sign again.
        justification: |
          A user who is about to change the report must know what it costs the reviewers who already signed.
        children:
          - ReviewCenter-ReviewPage-ChangesSinceSigning-Warning

      - id: ReviewCenter-Web-NotificationCard
        title: >-
          The Web subsystem shall give a signed-in user a card on the Account page for the e-mail address that
          notifications are sent to.
        justification: |
          E-mail reaches a person only at an address that the person gave and proved to be theirs, and the Account
          page is where a person manages their own settings. The card must also keep the proof, the code, off the page.
        children:
          - ReviewCenter-AccountPage-NotificationAddressField
          - ReviewCenter-AccountPage-NotificationSendCodeButton
          - ReviewCenter-AccountPage-NotificationNoRemoveWithoutAddress
          - ReviewCenter-AccountPage-NotificationCodeNeverShown
        tests:
          - AccountPage_Render_NotificationsOnNoAddress_ShowsExplanationAndAddressForm
          - AccountPage_Confirm_RightCode_ShowsConfirmedAddress

      - id: ReviewCenter-Web-NotificationUnavailable
        title: >-
          The Web subsystem shall show only the sentence that e-mail notifications are not set up, with no field,
          button or explanation and no read of the notification address of the user, while they are not enabled.
        justification: |
          A feature that is off must say so plainly and must neither offer controls for itself nor touch the stored
          address of the user.
        children:
          - ReviewCenter-AccountPage-NotificationUnavailableSentence
          - ReviewCenter-AccountPage-NotificationUnavailableNoFields
          - ReviewCenter-AccountPage-NotificationUnavailableNoButton
          - ReviewCenter-AccountPage-NotificationUnavailableNoExplanation
          - ReviewCenter-AccountPage-NotificationUnavailableNoStoreRead

      - id: ReviewCenter-Web-NotificationCodeSent
        title: >-
          The Web subsystem shall have exactly one confirmation e-mail sent to a valid address that the user submits.
        justification: |
          The person proves the address by receiving a code there, so one mail must go out.
        children:
          - ReviewCenter-AccountPage-NotificationCodeMailed
        tests:
          - AccountPage_SendCode_ValidAddress_MailsCodeAndShowsConfirmForm

      - id: ReviewCenter-Web-NotificationPendingAddress
        title: >-
          The Web subsystem shall show the address that waits for its code after the confirmation e-mail was sent.
        justification: |
          The page must show which address the answer is expected for.
        children:
          - ReviewCenter-AccountPage-NotificationPendingAddressShown

      - id: ReviewCenter-Web-NotificationCodeField
        title: >-
          The Web subsystem shall show a field for the confirmation code after the confirmation e-mail was sent.
        justification: |
          The user needs a place to enter the code that arrived.
        children:
          - ReviewCenter-AccountPage-NotificationCodeFieldShown

      - id: ReviewCenter-Web-NotificationSentNotice
        title: >-
          The Web subsystem shall show a notice that a code was sent after the confirmation e-mail was sent.
        justification: |
          The user must know that a mail was sent and should be looked for.
        children:
          - ReviewCenter-AccountPage-NotificationSentNotice

      - id: ReviewCenter-Web-NotificationInvalidAddress
        title: >-
          The Web subsystem shall show an error when the user submits an address that is not a valid e-mail address.
        justification: |
          A mail to a malformed address cannot arrive, so the user is told at once.
        children:
          - ReviewCenter-AccountPage-NotificationInvalidAddressError

      - id: ReviewCenter-Web-NotificationInvalidAddressNoMail
        title: >-
          The Web subsystem shall have no e-mail sent when the user submits an address that is not a valid e-mail
          address.
        justification: |
          No mail may be attempted to an address that cannot receive one.
        children:
          - ReviewCenter-AccountPage-NotificationInvalidAddressNoMail

      - id: ReviewCenter-Web-NotificationRightCode
        title: >-
          The Web subsystem shall show the address as confirmed after the user enters the right code.
        justification: |
          The user must see that the proof worked.
        children:
          - ReviewCenter-AccountPage-NotificationRightCodeConfirmed
        tests:
          - AccountPage_Confirm_RightCode_ShowsConfirmedAddress

      - id: ReviewCenter-Web-NotificationRightCodeNotice
        title: >-
          The Web subsystem shall show the message "Your e-mail address is confirmed." after the user enters the right
          code.
        justification: |
          The user must be told in words that the address is confirmed.
        children:
          - ReviewCenter-AccountPage-NotificationRightCodeNotice

      - id: ReviewCenter-Web-NotificationRightCodeClosesForm
        title: >-
          The Web subsystem shall remove the field for the code after the user enters the right code.
        justification: |
          Nothing more is asked once the proof worked.
        children:
          - ReviewCenter-AccountPage-NotificationRightCodeClosesForm

      - id: ReviewCenter-Web-NotificationWrongCode
        title: >-
          The Web subsystem shall show an error when the user enters a wrong code.
        justification: |
          A wrong code proves nothing, so the user is told and may try again.
        children:
          - ReviewCenter-AccountPage-NotificationWrongCodeError

      - id: ReviewCenter-Web-NotificationWrongCodeKeepsForm
        title: >-
          The Web subsystem shall keep the field for the code on the page after the user enters a wrong code.
        justification: |
          The user must be able to try again at once.
        children:
          - ReviewCenter-AccountPage-NotificationWrongCodeKeepsForm

      - id: ReviewCenter-Web-NotificationWrongCodeEmptiesField
        title: >-
          The Web subsystem shall empty the field for the code after the user enters a wrong code.
        justification: |
          A wrong code that stays in the field invites a second try with the same value.
        children:
          - ReviewCenter-AccountPage-NotificationWrongCodeEmptiesField

      - id: ReviewCenter-Web-NotificationWrongCodeNotConfirmed
        title: >-
          The Web subsystem shall show no address as confirmed after the user enters a wrong code.
        justification: |
          A wrong code proves nothing, so the address must stay unconfirmed.
        children:
          - ReviewCenter-AccountPage-NotificationWrongCodeNotConfirmed

      - id: ReviewCenter-Web-NotificationResend
        title: >-
          The Web subsystem shall show a button that sends a new code while an address waits for its code.
        justification: |
          A code that did not arrive must be replaceable.
        children:
          - ReviewCenter-AccountPage-NotificationResendButton

      - id: ReviewCenter-Web-NotificationResendAfterCooldown
        title: >-
          The Web subsystem shall have a new confirmation e-mail sent when the user asks for a new code more than 60
          seconds after the previous confirmation e-mail.
        justification: |
          The wait keeps the button from being used to flood a mailbox, but must not block a later request.
        children:
          - ReviewCenter-AccountPage-NotificationResendAfterCooldown

      - id: ReviewCenter-Web-NotificationResendCooldown
        title: >-
          The Web subsystem shall show an error when the user asks for a new code within 60 seconds of the previous
          confirmation e-mail.
        justification: |
          Repeated requests must not turn the page into a way to send many mails to one address, and the user must
          learn why nothing came.
        children:
          - ReviewCenter-AccountPage-NotificationResendCooldownError

      - id: ReviewCenter-Web-NotificationResendCooldownNoMail
        title: >-
          The Web subsystem shall have no e-mail sent when the user asks for a new code within 60 seconds of the
          previous confirmation e-mail.
        justification: |
          A refused request must not send a mail to the address.
        children:
          - ReviewCenter-AccountPage-NotificationResendCooldownNoMail

      - id: ReviewCenter-Web-NotificationRemove
        title: >-
          The Web subsystem shall show a button to remove a confirmed address.
        justification: |
          A person must be able to stop all mail to an address, and the page must show that it is done.
        children:
          - ReviewCenter-AccountPage-NotificationRemoveButton

      - id: ReviewCenter-Web-NotificationRemove-Form
        title: >-
          The Web subsystem shall show the field for a new address after the user removes the address.
        justification: |
          After the removal the user may enter another address.
        children:
          - ReviewCenter-AccountPage-NotificationRemoveShowsForm

      - id: ReviewCenter-Web-NotificationRemove-Notice
        title: >-
          The Web subsystem shall show the message "Your e-mail address was removed." after the user removes the
          address.
        justification: |
          The page must show that the removal is done.
        children:
          - ReviewCenter-AccountPage-NotificationRemoveNotice

      - id: ReviewCenter-Web-NotificationRemove-HidesAddress
        title: >-
          The Web subsystem shall not show the removed address after the user removes the address.
        justification: |
          An address that was removed must not stay on the page.
        children:
          - ReviewCenter-AccountPage-NotificationRemoveHidesAddress

      - id: ReviewCenter-Web-NotificationTemporaryPassword
        title: >-
          The Web subsystem shall show no notification card to a user whose password is temporary.
        justification: |
          A user with a temporary password must first choose a password, so the page offers nothing else.
        children:
          - ReviewCenter-AccountPage-NotificationHiddenForTemporaryPassword

      - id: ReviewCenter-Web-NotificationExternalUser
        title: >-
          The Web subsystem shall show the field for the e-mail address in the notification card to a user of an
          identity provider.
        justification: |
          A user of a provider has no password here, but the address for mail is still the user's own choice.
        children:
          - ReviewCenter-AccountPage-NotificationExternalUser

      - id: ReviewCenter-Web-WhereAreWe-SignAgain
        title: >-
          The Web subsystem shall explain to such a reviewer that signing again is the way forward.
        justification: |
          The reviewer must know what to do next.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-SignatureLost
        tests:
          - ReviewPage_SignedThenChanged_ExplainsWhatChanged

      - id: ReviewCenter-Web-WhereAreWe-Answers
        title: >-
          The Web subsystem shall show in the status panel, to a viewer who may see the answers of the others, who
          answered what to each disputed check, with the justification of the other reviewer as plain text and never
          that of the viewer.
        justification: |
          A reviewer settles a difference only by reading the reasons of the other side, and a reason typed by someone
          else must never run as markup.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance
          - ReviewCenter-ReviewPage-StatusPanelGuidance-Justification
          - ReviewCenter-ReviewPage-StatusPanelGuidance-PlainText

      - id: ReviewCenter-Web-WhereAreWe-SigningGuidance
        title: >-
          The Web subsystem shall state in plain words that the review will be Rejected, and which check failed, when
          all reviewers failed a check.
        justification: |
          A reviewer must know the outcome that follows from the answers before signing it.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-Outcome

      - id: ReviewCenter-Web-WhereAreWe-SigningCaution
        title: >-
          The Web subsystem shall caution a viewer who is about to sign, naming the reviewers who have not handed in a
          ballot.
        justification: |
          A signature given before all ballots are in may be made on an incomplete picture.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-Caution

      - id: ReviewCenter-Web-WhereAreWe-Waiting
        title: >-
          The Web subsystem shall show the person who asked an open question a sentence that says whom they wait for,
          instead of a button.
        justification: |
          A question that waits on someone else is only useful when the page says on whom.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-AskerWaits

      - id: ReviewCenter-Web-WhereAreWe-WaitingOtherParty
        title: >-
          The Web subsystem shall show the reviewer who is asked a link to answer the open questions.
        justification: |
          The asked reviewer needs a way to the questions that wait for an answer.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-OtherParty

      - id: ReviewCenter-Web-WhereAreWe-WaitingAfterSigning
        title: >-
          The Web subsystem shall say to a reviewer who signed whom the review waits for, in the same meaning as the
          next-step line.
        justification: |
          A signature that waits on someone else is only useful when the page says on whom.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-AfterSigning

      - id: ReviewCenter-Web-WhereAreWe-GuidanceMasked
        title: >-
          The Web subsystem shall show none of the answers, the failed checks, the outcome or the caution to a viewer
          who has not handed in a ballot.
        justification: |
          The guidance is built from the answers of the others, so it must not give away what the ballot hides.
        children:
          - ReviewCenter-ReviewPage-StatusPanelGuidance-Masked

      - id: ReviewCenter-Web-WhereAreWe-PlainWords
        title: >-
          The Web subsystem shall use plain words for the state of a signature in the pages and the help topics.
        justification: |
          "Out of date" is the language of the implementation, not of the reviewer.
        children:
          - ReviewCenter-HelpPage-PlainLanguage
          - ReviewCenter-HelpPage-PlainLanguage-WhereAreWe
          - ReviewCenter-HelpPage-PlainLanguage-Changes
          - ReviewCenter-HelpPage-PlainLanguage-NoOutOfDate
          - ReviewCenter-ReviewPage-ChangesSinceSigning-NoJargon

      - id: ReviewCenter-Web-WhereAreWe-Hidden
        title: >-
          The Web subsystem shall keep the status panel hidden from a reviewer who has not handed in their own ballot.
        justification: |
          The panel shows the ballots of the others, so it must not give away what the checklist page hides.
        children:
          - ReviewCenter-ReviewPage-StatusPanel-Hidden
          - ReviewCenter-ReviewPage-StatusPanel-HiddenDisputes
        tests:
          - ReviewPage_HiddenViewer_ShowsNoStandingConclusionOrCheckThreads

      - id: ReviewCenter-Web-NotificationMode
        title: >-
          The Web subsystem shall let a signed-in user with a confirmed address choose the notification mode on the
          Account page.
        justification: |
          The mode decides whether and when mail is sent, so it is chosen where the address is managed, with None as the
          default.
        children:
          - ReviewCenter-AccountPage-NotificationModeSelector
          - ReviewCenter-AccountPage-NotificationModeThreeChoices
          - ReviewCenter-AccountPage-NotificationModeStoredShown
          - ReviewCenter-AccountPage-NotificationModeDefaultNone
        tests:
          - WebSubsystem_AccountPage_ChoosesNotificationMode
          - AccountPage_Render_ModeSelector_OffersThreeModes

      - id: ReviewCenter-Web-NotificationModeNeedsAddress
        title: >-
          The Web subsystem shall show the mode selector as disabled while the user has no confirmed address.
        justification: |
          Mail cannot go to an address that does not exist, so the choice is closed until one is confirmed and falls
          back to None when it is removed.
        children:
          - ReviewCenter-AccountPage-NotificationModeNeedsAddressDisabled

      - id: ReviewCenter-Web-NotificationModeNeedsAddress-NoSaveButton
        title: >-
          The Web subsystem shall show no save button for the mode while the user has no confirmed address.
        justification: |
          A save button on a closed choice would invite an action that cannot succeed.
        children:
          - ReviewCenter-AccountPage-NotificationModeNeedsAddressDisabled-NoSaveButton

      - id: ReviewCenter-Web-NotificationModeNeedsAddress-Explained
        title: >-
          The Web subsystem shall explain next to the disabled selector that a confirmed address is needed.
        justification: |
          The user needs to know how to open the closed choice.
        children:
          - ReviewCenter-AccountPage-NotificationModeNeedsAddressExplained

      - id: ReviewCenter-Web-NotificationModeNeedsAddress-RemovedNone
        title: >-
          The Web subsystem shall show the mode None in the disabled selector when the user removes the address.
        justification: |
          The choice falls back to None when the address it relied on is removed.
        children:
          - ReviewCenter-AccountPage-NotificationModeRemoveAddressNone

      - id: ReviewCenter-Web-NotificationModeSave
        title: >-
          The Web subsystem shall set the selected mode through the notification preference service when the user saves
          it.
        justification: |
          The stored preference is what later decides about mail.
        children:
          - ReviewCenter-AccountPage-NotificationModeSaveCalls

      - id: ReviewCenter-Web-NotificationModeSavedNotice
        title: >-
          The Web subsystem shall show a notice that the choice was saved when a mode was saved.
        justification: |
          The user needs to see that the save worked.
        children:
          - ReviewCenter-AccountPage-NotificationModeSavedNotice

      - id: ReviewCenter-Web-NotificationModeSavedNoError
        title: >-
          The Web subsystem shall show no error when a mode was saved.
        justification: |
          An error beside a saved choice would contradict the notice.
        children:
          - ReviewCenter-AccountPage-NotificationModeSavedNotice-NoError

      - id: ReviewCenter-Web-NotificationModeRefused
        title: >-
          The Web subsystem shall show the message of the refusal when the service refuses a mode.
        justification: |
          A refused mode is not stored, so the page must say why.
        children:
          - ReviewCenter-AccountPage-NotificationModeRefusedMessage

      - id: ReviewCenter-Web-NotificationModeRefusedNoSavedNotice
        title: >-
          The Web subsystem shall show no notice that the choice was saved when the service refuses a mode.
        justification: |
          A refused mode is not stored, so the page must not claim that it was saved.
        children:
          - ReviewCenter-AccountPage-NotificationModeRefusedMessage-NoSavedNotice

      - id: ReviewCenter-Web-NotificationModeHiddenNotAvailable
        title: >-
          While notifications are not available, the Web subsystem shall show no mode selector on the Account page.
        justification: |
          A feature that is off must show no controls for itself.
        children:
          - ReviewCenter-AccountPage-NotificationModeHiddenNotAvailable
        tests:
          - AccountPage_Render_NotificationsNotSetUp_NoModeSelector

      - id: ReviewCenter-Web-NotificationExplainsMail
        title: >-
          The Web subsystem shall explain on the Account page what a notification mail contains.
        justification: |
          A person turns mail on only when they know what will be sent.
        children:
          - ReviewCenter-AccountPage-NotificationExplainsContent
          - ReviewCenter-AccountPage-NotificationExplainsContent-ProjectAndReview
          - ReviewCenter-AccountPage-NotificationExplainsContent-Link
          - ReviewCenter-AccountPage-NotificationExplanationShown
        tests:
          - AccountPage_Render_Card_ExplainsWhatIsMailed

      - id: ReviewCenter-Web-NotificationExplainsMail-NotMailed
        title: >-
          The Web subsystem shall explain on the Account page what a notification mail never contains.
        justification: |
          Reviews of regulated projects can be confidential.
        children:
          - ReviewCenter-AccountPage-NotificationExplainsNotMailed
          - ReviewCenter-AccountPage-NotificationExplanationNoReviewText
        tests:
          - AccountPage_Render_Card_ExplainsWhatIsNotMailed

      - id: ReviewCenter-Web-NotificationExplainsMail-Modes
        title: >-
          The Web subsystem shall explain on the Account page what each notification mode does.
        justification: |
          A person chooses a mode only when they know what it does.
        children:
          - ReviewCenter-AccountPage-NotificationExplainsModes
        tests:
          - AccountPage_Render_Card_ExplainsModes

      - id: ReviewCenter-Web-NotificationHelpTopic
        title: >-
          The Web subsystem shall explain e-mail notifications in a help topic.
        justification: |
          A person who reads about the mail before turning it on needs a page that tells in plain words what is sent
          and what is never sent.
        children:
          - ReviewCenter-HelpPage-NotificationsTopic
          - ReviewCenter-HelpPage-NotificationsTopic-WhatIsMailed
          - ReviewCenter-HelpPage-NotificationsTopic-NeverMailed
          - ReviewCenter-HelpPage-NotificationsTopic-Confirmation
          - ReviewCenter-HelpPage-NotificationsTopic-Modes
          - ReviewCenter-HelpPage-NotificationsTopic-HowToStop
        tests:
          - HelpNotificationsPage_Render_ExplainsWhatIsMailedAndWhatIsNever

      - id: ReviewCenter-Web-NotificationHelpLink
        title: >-
          The Web subsystem shall link the notification card of the Account page to the help topic.
        justification: |
          A person who reads the card must reach the full explanation in one step.
        children:
          - ReviewCenter-AccountPage-NotificationHelpLink
        tests:
          - AccountPage_Render_NotificationCard_LinksToEmailNotificationsTopic
