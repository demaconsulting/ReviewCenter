---
# Software Unit Requirements for the ChecklistService Class
#
# The ChecklistService class provides the review checklist: the default checklist, the frozen copy each review
# keeps, section applicability, the answers to the checks, and the progress derived from them.

sections:
  - title: ChecklistService Unit Requirements
    requirements:
      - id: ReviewCenter-ChecklistService-Default
        title: >-
          The ChecklistService class shall provide a built-in default checklist of 14 sections and 58 checks, with
          the section and check identifiers, titles, and wording of the Continuous Compliance review template, each
          check identifier unique and starting with the identifier of its section, and a version that names the
          wording, which is the checklist of every project that has not been given a checklist of its own and
          which passes the validation of a project checklist.
        justification: |
          Reviewers follow the same checks in every review, and a check keeps one stable identifier. A version
          names which wording a review was done against, so that the wording can be improved later without
          changing what earlier reviews recorded. The default is the starting point and the fallback of every
          project, so it must itself satisfy the rules that a project checklist has to satisfy.
        tests:
          - ChecklistService_DefaultChecklist_HasTemplateSectionsAndItemIdsInOrder
          - ChecklistService_DefaultChecklist_IdsUniqueAndPrefixedBySection
          - ChecklistService_DefaultChecklist_RoundTripsThroughJson
          - ChecklistService_FromJson_IncompleteDefinition_ThrowsJsonException
          - ChecklistValidator_Validate_DefaultChecklist_IsValid

      - id: ReviewCenter-ChecklistService-Freeze
        title: >-
          The ChecklistService class shall read the checklist of a review from the copy that the review received
          when it was created, taken from the checklist of the project at that time or from the default checklist
          when the project has none, so that a later change to the default checklist or to the checklist of the
          project does not change an existing review, and shall report that a review without such a copy has no
          checklist.
        justification: |
          A review is a record. Changing the questions after the answers were given would change the meaning of
          the answers, so each review keeps the checklist it was started with.
        tests:
          - ReviewService_CreateDraftAsync_ValidInput_AttachesDefaultChecklistSnapshot
          - ChecklistService_Get_AfterDefaultChanges_ReturnsFrozenSnapshot
          - ChecklistService_Get_UnknownReview_ReturnsNull
          - ReviewService_ProjectChecklistChangedLater_ExistingReviewsAreUnaffected

      - id: ReviewCenter-ChecklistService-Validation
        title: >-
          The ChecklistValidator class shall accept a checklist definition only when it is valid JSON of at most
          256 KiB with a version of 1 to 64 characters, 1 to 50 sections and 1 to 500 checks in all, no empty
          section, identifiers of 1 to 32 letters, digits, dots, underscores, and hyphens that start with a letter
          or digit and are unique across all sections and checks, section titles and check titles of 1 to 200
          characters, check wording of 1 to 1000 characters, and an applicability hint of at most 500 characters,
          and shall report every violation it finds, each with the path of the value in the definition, such as
          sections[2].items[1].id, and not only the first, using the same canonical path format (lower-case member
          names, no JSON-path prefix) for the errors found while reading the text as for the errors of the structure.
        justification: |
          A checklist is entered by a person and then frozen into every review. A definition that is too large,
          has the same identifier twice, or leaves a section empty would corrupt the answers or the page, so it is
          refused before it is stored. Naming every problem with its place lets the person correct the definition
          in one pass.
        tests:
          - ChecklistValidator_Validate_DefaultChecklist_IsValid
          - ChecklistValidator_Validate_SmallDefinition_IsValid
          - ChecklistValidator_Validate_EmptyText_GivesOneError
          - ChecklistValidator_Validate_BadJson_GivesOneError
          - ChecklistValidator_Validate_ParserError_UsesTheCanonicalPath
          - ChecklistValidator_Validate_TextSize_LimitsAtMaxBytes
          - ChecklistValidator_Validate_Version_BoundariesAndPresence
          - ChecklistValidator_Validate_NoSections_IsRefused
          - ChecklistValidator_Validate_SectionCount_LimitsAtMaxSections
          - ChecklistValidator_Validate_ItemCount_LimitsAtMaxItems
          - ChecklistValidator_Validate_EmptySection_IsRefused
          - ChecklistValidator_Validate_IdForm_AcceptsOnlyTheAllowedCharacters
          - ChecklistValidator_Validate_IdLength_LimitsAtMaxIdLength
          - ChecklistValidator_Validate_DuplicateIds_AreReportedAtTheLaterUse
          - ChecklistValidator_Validate_TitlesTextAndHint_BoundariesAndPresence
          - ChecklistValidator_Validate_NullEntries_AreReported
          - ChecklistValidator_Validate_ManyProblems_AreAllReportedTogether
          - ChecklistValidator_Validate_MemberNamesInAnyCase_AreRead
          - ChecklistValidator_ParseOrThrow_Invalid_ThrowsWithPathsAndAtMostTenErrors
          - ChecklistValidationError_ToString_IsPathAndMessage

      - id: ReviewCenter-ChecklistService-Applicability
        title: >-
          The ChecklistService class shall record whether a section of a review's checklist applies to the
          review, shall require a reason of at most 2000 characters, stored trimmed, when a section does not
          apply, shall clear the reason when it applies again, and shall reject a section that is not in the
          checklist, storing nothing on a violation.
        justification: |
          Not every section is relevant to every review, for example a review without source code has no code
          checks. Saying why a section was skipped keeps that decision visible to the people who rely on the
          review.
        tests:
          - ChecklistService_SetSectionApplicability_NotApplicableWithoutReason_Throws
          - ChecklistService_SetSectionApplicability_NotApplicableWithReason_StoresTrimmedReason
          - ChecklistService_SetSectionApplicability_Applicable_ClearsReason
          - ChecklistService_SetSectionApplicability_UnknownSection_ThrowsChecklistItemNotFound

      - id: ReviewCenter-ChecklistService-Answer
        title: >-
          The ChecklistService class shall record the answer Pass, Fail, or N/A to a check of a review's
          checklist in the ballot of the reviewer slot of the actor, replacing an earlier answer of that slot to
          the same check, shall require a justification for Fail and N/A, shall accept a justification of at most
          2000 characters stored trimmed (none stored for an empty one on a Pass), and shall reject a check that
          is not in the checklist and a review that has no checklist, storing nothing on a violation.
        justification: |
          A failed or not-applicable check is only useful to the next reader when it says why. A pass needs no
          explanation. Replacing the answer lets a reviewer correct a mistake without leaving two answers of one
          reviewer to one question, while each reviewer keeps an answer of their own.
        tests:
          - ChecklistService_SetAnswer_PassWithoutJustification_Stores
          - ChecklistService_SetAnswer_FailOrNotApplicableWithoutJustification_Throws
          - ChecklistService_SetAnswer_JustificationTooLong_Throws
          - ChecklistService_SetAnswer_UnknownItem_ThrowsChecklistItemNotFound
          - ChecklistService_SetAnswer_UnknownReview_ThrowsChecklistNotFound
          - ChecklistService_SetAnswer_ReanswerWithPaddedJustification_OverwritesAndTrims

      - id: ReviewCenter-ChecklistService-AnsweredBy
        title: >-
          The ChecklistService class shall take the person of each answer and of each change of section
          applicability as the signed-in actor (user name and display name), reject a missing actor, and store
          both names with the UTC time of the change in the ballot of the slot of the actor, without making the
          answerer part of the record digest.
        justification: |
          Every answer must be attributable and dated. The person is the signed-in user, who needs no check, and
          storing the user name keeps the person identifiable if the display name changes later. The answerer is
          kept with the ballot row for the history; the digest covers the agreed standing, so another reviewer
          giving the same answer does not change what a signature approves.
        tests:
          - ChecklistService_SetAnswer_NullActor_Throws
          - ChecklistService_SetAnswer_StoresActorAndUtcTime

      - id: ReviewCenter-ChecklistService-Progress
        title: >-
          The ChecklistService class shall derive from the checklist state of a review, the consolidated standing of
          its submitted ballots or the ballot of one reviewer slot, the number of answered and total checks per
          section and overall, counting a failed check as answered, leaving out the checks of a section that does
          not apply (such a section counts as done) and any answers kept for it, shall report the checklist
          complete when every check of every applicable section is answered, shall give the first section with
          unanswered checks and the first unanswered check, and shall count the draft answers of the only slot of
          a review in the progress of the consolidated standing.
        justification: |
          Reviewers need to see what is left to do without counting. One set of rules in one place keeps every
          page showing the same numbers, and the first unanswered check lets a page lead the reviewer to the
          next piece of work. A review with one slot has nobody to agree with and no separate hand-in step, so
          its partly answered checklist shows its true progress.
        tests:
          - ChecklistState_Progress_CountsAnsweredPerSectionAndOverall
          - ChecklistState_Progress_NotApplicableSection_CountsAsDoneAndLeavesTotal
          - ChecklistState_Progress_AnswersInNotApplicableSection_Ignored
          - ChecklistState_Progress_AllApplicableAnswered_IsComplete
          - ChecklistState_Progress_AllSectionsNotApplicable_IsComplete
          - ChecklistState_NextUnansweredItemId_SkipsAnsweredAndNotApplicableSections
          - ChecklistState_FirstIncompleteSectionId_ReturnsFirstSectionWithUnanswered
          - BallotProjection_Consolidate_SingleSlotDraft_CountsOnlyWithTheSlotCount

      - id: ReviewCenter-ChecklistService-Audit
        title: >-
          The ChecklistService class shall record answering a check and changing the applicability of a section in
          the audit trail, in the same transaction as the change, naming the actor, the identifiers, and the outcome,
          with a short hash of the justification but never the justification itself.
        justification: |
          The history must show who answered which check and how, without copying free text into a record that
          cannot be edited.
        tests:
          - ChecklistService_ChecklistEvents_RecordOutcomeAndDigestButNotJustification

      - id: ReviewCenter-ChecklistService-Access
        title: >-
          The ChecklistService class shall require, for answering a check and for changing the applicability of a
          section, that the actor may see the project of the review (through IProjectAccess), refusing an actor who
          may not with the same ProjectNotFound rule as for a project that does not exist, before anything else is
          checked or stored.
        justification: |
          A user outside a project must not be able to change its review checklist, nor learn that the project
          exists. The service enforces this itself, whatever the page or the API checked, so that a route added later
          cannot bypass the rule.
        tests:
          - ChecklistService_Constructor_NullArguments_Throws

      - id: ReviewCenter-ChecklistService-ApprovalLock
        title: >-
          The ChecklistService class shall refuse to answer a check, to change the applicability of a section and to
          hand in a ballot in a review that is approved and therefore locked, with the ReviewLocked rule, after the
          access check and before anything is stored.
        justification: |
          The answers are part of what a signature approves. Changing one after the approval would make the approval
          describe a record that no longer exists, so the service refuses until an administrator reopens the review.
        tests:
          - ChecklistService_Mutations_ApprovedReview_ThrowReviewLocked

      - id: ReviewCenter-ChecklistService-AuthorRule
        title: >-
          The ChecklistService class shall refuse to answer a check and to change the applicability of a section when
          the project requires that authors do not answer the checklist and the actor is the author of the review
          (compared by user name, ignoring case), with the AuthorCannotAnswer rule, after the access check and before
          the lock check and before anything is stored, shall let any other actor and any author of a project that
          switched the rule off pass, shall tell a page through the ChecklistState whether the viewer is blocked, and
          shall leave comment threads unaffected.
        justification: |
          A person who wrote the content must not be the one who answers whether the content meets the checks, or the
          checklist is no independent look. The service enforces the rule itself, whatever the page or the API checked,
          and reports it before the lock so that the reason that counts is named. The rule is on by default and applies
          to every project, also those created before it was enforced; an administrator can switch it off per project.
        tests:
          - ChecklistService_Answer_AuthorWhileRuleIsOn_ThrowsAuthorCannotAnswerAndStoresNothing
          - ChecklistService_Answer_AuthorWhileRuleIsOff_Stores
          - ChecklistService_Answer_AuthorOfApprovedReview_ReportsAuthorRuleBeforeLock
          - ChecklistService_Get_ViewerUsername_SetsAuthorBlockedOnlyForTheAuthorWhileRuleIsOn
          - ThreadService_Threads_AuthorWhileRuleIsOn_AreNotAffected

      - id: ReviewCenter-ChecklistService-SignatureImpact
        title: >-
          The ChecklistService class shall refuse to hand in the ballot of a reviewer slot (and, in a review with one
          slot, the answer or section change that completes and thereby hands in the ballot) when the hand-in would
          change the record digest and make a current signature of another slot out of date and the caller has not
          acknowledged the affected slots, with the SignaturesWouldBecomeOutOfDate rule that names each affected slot
          number and signer, before anything is stored, shall never require the acknowledgement of the signature of
          the own slot of the reviewer, shall let a change that does not alter the digest, such as a draft edit or a
          ballot that agrees with the others, or a review without a current signature, pass without acknowledgement,
          shall refuse again only for the slots that remain unacknowledged, and shall report a locked review with the
          ReviewLocked rule first. The exception shall keep its own copy of the affected slots.
        justification: |
          The agreed standing of the ballots is what a signature approves. Handing in a ballot that changes that
          standing silently withdraws the signatures of the other reviewers, so the service tells the caller which
          signatures would be lost and refuses until the caller confirms. A draft, or a ballot that agrees with the
          others, changes nothing, so it needs no confirmation, and a reviewer who changes the own ballot knows that
          the own signature goes out of date.
        tests:
          - ChecklistService_Changes_NoSignatureOrNoOp_DoNotThrow
          - ChecklistService_SetAnswerAsync_SameValueByOtherSlot_KeepsTheSignature
          - ChecklistService_SetAnswerAsync_PrimaryAndAlternateSigners_NamesSlotNumbersAndSigners
          - ChecklistService_SetAnswerAsync_PartialAcknowledgement_ThrowsWithRemainingSlots
          - ChecklistService_SetAnswerAsync_FullAcknowledgement_StoresAndSignatureOutOfDate
          - ChecklistService_SetSectionApplicabilityAsync_Signed_NeedsAcknowledgement
          - ChecklistService_SetAnswerAsync_ApprovedReview_ReportsLockedBeforeImpact
          - ChecklistService_DomainRuleException_AffectedSlots_AreCopiedFromTheSource

      - id: ReviewCenter-ChecklistService-CarriedMarking
        title: >-
          The ChecklistService class shall store an answer, and the applicability of a section, that a person gives or
          changes in the ballot of the own slot of a review that carries answers from an earlier review without the
          mark of the earlier review, so that an answer carried into the ballot and then answered again, or a
          not-applicable section carried into the ballot and then set again, belongs to the review and to the person
          who gave it, and shall count a carried answer as answered for the progress of the checklist.
        justification: |
          The mark says that nobody in this review has looked at the answer yet. Once a person answers again, the
          answer is theirs, and keeping the mark would claim that it was taken over. A carried answer was given by a
          reviewer and is a real answer, so the checklist is complete when all checks are carried or answered.
        tests:
          - ReviewService_FollowUp_ReAnsweringOrResettingSection_ClearsTheCarriedMarker
          - ReviewService_CreateDraftAsync_FollowUp_CarriedAnswersCountAsAnswered

      - id: ReviewCenter-ChecklistService-BallotSlot
        title: >-
          The ChecklistService class shall require, for answering a check, changing the applicability of a section and
          handing in a ballot, that the actor is the primary or the alternate reviewer of a slot of the review,
          refusing any other actor with the NoReviewerSlot rule, storing nothing, and shall put the change into the
          ballot of that slot and into no other.
        justification: |
          Each reviewer answers the checklist on their own, so that the reviewers can agree or disagree. An answer
          needs the slot that owns it, and a person without a slot has no ballot to answer on.
        tests:
          - ChecklistService_SetAnswerAsync_ActorWithoutSlot_ThrowsNoReviewerSlot
          - ChecklistService_SubmitBallotAsync_ActorWithoutSlot_ThrowsNoReviewerSlot

      - id: ReviewCenter-ChecklistService-BallotSubmit
        title: >-
          The ChecklistService class shall keep the ballot of a slot of a review with more than one slot a draft until
          its reviewer hands it in with SubmitBallotAsync, shall refuse to hand in a ballot in which a check of an
          applicable section has no answer with the BallotIncomplete rule and store nothing, and shall treat handing
          in a ballot that is submitted already as no change.
        justification: |
          Another reviewer must not see, or be bound by, an answer that its reviewer has not finished. The hand-in is
          the moment the ballot counts in the record, so it needs a complete ballot, and repeating it must be safe.
        tests:
          - ChecklistService_SubmitBallotAsync_TwoSlots_StaysDraftUntilSubmit
          - ChecklistService_SubmitBallotAsync_Incomplete_ThrowsBallotIncomplete

      - id: ReviewCenter-ChecklistService-SingleSlotAutoSubmit
        title: >-
          The ChecklistService class shall hand in the ballot of the only slot of a review with the answer or the
          section change that completes it, and shall keep it a draft until then, so that answering in a review with one
          reviewer needs no separate hand-in step (a complete ballot that no edit produced, such as a follow-up with
          every check carried, is handed in with SubmitBallotAsync).
        justification: |
          With one reviewer there is nobody to agree with and nobody to hide a draft from, so answering stays as
          simple as it was before each reviewer had a ballot.
        tests:
          - ChecklistService_SetAnswerAsync_SingleSlotComplete_AutoSubmits

      - id: ReviewCenter-ChecklistService-OwnBallotView
        title: >-
          The ChecklistService class shall give a viewer who holds a slot of a review the own ballot, drafts
          included, and never the draft of another slot, and shall give every other viewer the consolidated standing
          of the submitted ballots, marked as without a slot when a viewer is given and holds none.
        justification: |
          A reviewer needs to see and continue the own work, while an unfinished ballot of somebody else must stay
          private until it is handed in. Everybody else reads the agreed standing, which is what the record covers.
        tests:
          - ChecklistService_GetAsync_Viewer_SeesOwnDraftOnly
          - ChecklistService_GetAsync_NoSlot_Consolidated

      - id: ReviewCenter-ChecklistService-BallotImpact
        title: >-
          The ChecklistService class shall, when a ballot is handed in, compare the record digest after the hand-in
          with the digest now, shall refuse with the SignaturesWouldBecomeOutOfDate rule when the digest would change
          and a current signature of another slot is not acknowledged in the acknowledgedSlotIds argument, shall let a
          hand-in that leaves the digest as it is pass without a warning, and shall not ask a reviewer to acknowledge
          the signature of the own slot.
        justification: |
          A ballot that changes the agreed standing withdraws the signatures of the other reviewers, so they are named
          before the ballot counts. A ballot that agrees with the others changes nothing. A reviewer who changes the
          own ballot knows that the own signature goes out of date.
        tests:
          - ChecklistService_SubmitBallotAsync_DigestChanging_RequiresAcknowledgementOfOtherSlots
          - ChecklistService_SubmitBallotAsync_AgreeingSubmit_NoWarning
          - ChecklistService_SubmitBallotAsync_SignedOwnSlot_NoSelfAcknowledgement

      - id: ReviewCenter-ChecklistService-ReopenerBallot
        title: >-
          The ChecklistService class shall let the person who reopened a review, while the project requires that the
          person who reopened a review does not sign it again, answer a check, change the applicability of a section
          and hand in the ballot of the own slot like any other reviewer, so that the person is barred from signing
          only (with the ReopenerCannotSign rule of the SigningService) and not from the ballot.
        justification: |
          The rule keeps the person who reopened a review from approving it alone. It does not say that the person may
          not review. A reopener who holds a slot has to be able to correct and hand in the own ballot, or the review
          could not be completed by the slot.
        tests:
          - ChecklistService_Ballot_ReopenerWhileRuleIsOn_EditsAndSubmitsButCannotSign

      - id: ReviewCenter-ChecklistService-BallotAccess
        title: >-
          The ChecklistService class shall refuse an actor who may only read the project, such as an auditor, with the
          ActorNotAllowed rule when the actor answers a check, changes the applicability of a section or hands in a
          ballot, also when the actor still holds a slot of the review, before the slot of the actor is looked up (so
          that the NoReviewerSlot rule is not the reason) and storing nothing.
        justification: |
          An auditor reads the record and never changes it. A person who was a reviewer and became an auditor can still
          hold a slot, so the role, not the slot, decides, and the refusal names the role.
        tests:
          - ChecklistService_BallotWrites_AuditorHoldingSlot_ThrowsActorNotAllowed

      - id: ReviewCenter-ChecklistService-ReviewConclusionText
        title: >-
          The ChecklistService class shall let the primary or the alternate reviewer of any slot of a review, and the
          lead of the review (its creator who can still contribute, or an administrator of the project), set, change
          or clear the review conclusion text (the free text of the record, at most 4000 characters, not the approved
          or rejected conclusion), shall refuse a person outside the project as a missing project, and an auditor, an
          API token and a member who is neither a reviewer nor the lead as not allowed, shall tell a page through
          CanSetReviewConclusionTextAsync who may write it, shall store the text with line breaks written as LF and
          without leading and trailing white space and a blank text as none, shall refuse a text that is too long or
          has a control character other than a line feed or a tab with the ConclusionTextInvalid rule, shall refuse a
          concluded review with the ReviewLocked rule, shall refuse a change that would make a current signature out
          of date, naming each affected slot and signer, until the caller acknowledges the slots, shall treat the same
          text again as no change without an acknowledgement and without an audit entry, and shall refuse with the
          RecordChanged rule, storing nothing, when someone else changed the text between the read and the store.
        justification: |
          The text is what the people behind the record conclude in words, so only they and the lead may write it. It
          is part of what a signature approves, so a concluded review is locked, and a change while a signature is
          current withdraws the signature and must be confirmed. The comparison against the text that was read keeps
          two people from silently overwriting each other. A normalized text keeps the digest the same whatever the
          browser sent. The rule that a rejected review needs a text to be signed is a separate, later rule.
        tests:
          - ChecklistService_SetReviewConclusionTextAsync_SlotOwnerOrLead_Stores
          - ChecklistService_SetReviewConclusionTextAsync_OtherMember_ThrowsActorNotAllowed
          - ChecklistService_SetReviewConclusionTextAsync_NonMember_ThrowsProjectNotFound
          - ChecklistService_SetReviewConclusionTextAsync_Auditor_Refused
          - ChecklistService_SetReviewConclusionTextAsync_ApiToken_Refused
          - ChecklistService_SetReviewConclusionTextAsync_Concluded_ThrowsReviewLocked
          - ChecklistService_SetReviewConclusionTextAsync_CrlfBlankLongControl_NormalizesOrThrows
          - ChecklistService_SetReviewConclusionTextAsync_StrayCarriageReturn_ThrowsAndStoresNothing
          - ChecklistService_SetReviewConclusionTextAsync_AfterSignature_NeedsAcknowledgement
          - ChecklistService_SetReviewConclusionTextAsync_SameValue_NoOpNoAudit
          - ChecklistService_SetReviewConclusionTextAsync_ConcurrentChange_ThrowsRecordChanged
          - ChecklistService_CanSetReviewConclusionTextAsync_Roles
          - ReviewOperations_Auditor_AreRefusedAsNotAllowedAndChangeNothing

      - id: ReviewCenter-ChecklistService-ReviewConclusionTextAudit
        title: >-
          The ChecklistService class shall record every change of the review conclusion text in the audit trail as
          review.conclusion-changed, in the same transaction as the change, with the actor, the project, the review
          and only the old and the new length of the text in the detail, and shall never write the text itself into
          the audit trail.
        justification: |
          The audit trail is read by people who may not be allowed to read the review, and it can never be corrected,
          so what a reviewer wrote must not be copied into it. The lengths show that and how much the text changed.
        tests:
          - ChecklistService_SetReviewConclusionTextAsync_Audit_RecordsLengthsOnly
