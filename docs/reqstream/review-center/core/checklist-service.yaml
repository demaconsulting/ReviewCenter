---
# Software Unit Requirements for the ChecklistService Class
#
# The ChecklistService class provides the review checklist: the default checklist, the frozen copy each review
# keeps, section applicability, the answers to the checks, and the progress derived from them.

sections:
  - title: ChecklistService Unit Requirements
    requirements:
      - id: ReviewCenter-ChecklistService-Default
        title: >-
          The ChecklistService class shall provide a built-in default checklist of 14 sections and 58 checks, with
          the section and check identifiers, titles, and wording of the Continuous Compliance review template, each
          check identifier unique and starting with the identifier of its section, and a version that names the
          wording, which is the checklist of every project that has not been given a checklist of its own and
          which passes the validation of a project checklist.
        justification: |
          Reviewers follow the same checks in every review, and a check keeps one stable identifier. A version
          names which wording a review was done against, so that the wording can be improved later without
          changing what earlier reviews recorded. The default is the starting point and the fallback of every
          project, so it must itself satisfy the rules that a project checklist has to satisfy.
        tests:
          - ChecklistService_DefaultChecklist_HasTemplateSectionsAndItemIdsInOrder
          - ChecklistService_DefaultChecklist_IdsUniqueAndPrefixedBySection
          - ChecklistService_DefaultChecklist_RoundTripsThroughJson
          - ChecklistService_FromJson_IncompleteDefinition_ThrowsJsonException
          - ChecklistValidator_Validate_DefaultChecklist_IsValid

      - id: ReviewCenter-ChecklistService-Freeze
        title: >-
          The ChecklistService class shall read the checklist of a review from the copy that the review received
          when it was created, taken from the checklist of the project at that time or from the default checklist
          when the project has none, so that a later change to the default checklist or to the checklist of the
          project does not change an existing review, and shall report that a review without such a copy has no
          checklist.
        justification: |
          A review is a record. Changing the questions after the answers were given would change the meaning of
          the answers, so each review keeps the checklist it was started with.
        tests:
          - ReviewService_CreateDraftAsync_ValidInput_AttachesDefaultChecklistSnapshot
          - ChecklistService_Get_AfterDefaultChanges_ReturnsFrozenSnapshot
          - ChecklistService_Get_UnknownReview_ReturnsNull
          - ReviewService_ProjectChecklistChangedLater_ExistingReviewsAreUnaffected

      - id: ReviewCenter-ChecklistService-Validation
        title: >-
          The ChecklistValidator class shall accept a checklist definition only when it is valid JSON of at most
          256 KiB with a version of 1 to 64 characters, 1 to 50 sections and 1 to 500 checks in all, no empty
          section, identifiers of 1 to 32 letters, digits, dots, underscores, and hyphens that start with a letter
          or digit and are unique across all sections and checks, section titles and check titles of 1 to 200
          characters, check wording of 1 to 1000 characters, and an applicability hint of at most 500 characters,
          and shall report every violation it finds, each with the path of the value in the definition, such as
          sections[2].items[1].id, and not only the first.
        justification: |
          A checklist is entered by a person and then frozen into every review. A definition that is too large,
          has the same identifier twice, or leaves a section empty would corrupt the answers or the page, so it is
          refused before it is stored. Naming every problem with its place lets the person correct the definition
          in one pass.
        tests:
          - ChecklistValidator_Validate_DefaultChecklist_IsValid
          - ChecklistValidator_Validate_SmallDefinition_IsValid
          - ChecklistValidator_Validate_EmptyText_GivesOneError
          - ChecklistValidator_Validate_BadJson_GivesOneError
          - ChecklistValidator_Validate_TextSize_LimitsAtMaxBytes
          - ChecklistValidator_Validate_Version_BoundariesAndPresence
          - ChecklistValidator_Validate_NoSections_IsRefused
          - ChecklistValidator_Validate_SectionCount_LimitsAtMaxSections
          - ChecklistValidator_Validate_ItemCount_LimitsAtMaxItems
          - ChecklistValidator_Validate_EmptySection_IsRefused
          - ChecklistValidator_Validate_IdForm_AcceptsOnlyTheAllowedCharacters
          - ChecklistValidator_Validate_IdLength_LimitsAtMaxIdLength
          - ChecklistValidator_Validate_DuplicateIds_AreReportedAtTheLaterUse
          - ChecklistValidator_Validate_TitlesTextAndHint_BoundariesAndPresence
          - ChecklistValidator_Validate_NullEntries_AreReported
          - ChecklistValidator_Validate_ManyProblems_AreAllReportedTogether
          - ChecklistValidator_Validate_MemberNamesInAnyCase_AreRead
          - ChecklistValidator_ParseOrThrow_Invalid_ThrowsWithPathsAndAtMostTenErrors
          - ChecklistValidationError_ToString_IsPathAndMessage

      - id: ReviewCenter-ChecklistService-Applicability
        title: >-
          The ChecklistService class shall record whether a section of a review's checklist applies to the
          review, shall require a reason of at most 2000 characters, stored trimmed, when a section does not
          apply, shall clear the reason when it applies again, and shall reject a section that is not in the
          checklist, storing nothing on a violation.
        justification: |
          Not every section is relevant to every review, for example a review without source code has no code
          checks. Saying why a section was skipped keeps that decision visible to the people who rely on the
          review.
        tests:
          - ChecklistService_SetSectionApplicability_NotApplicableWithoutReason_Throws
          - ChecklistService_SetSectionApplicability_NotApplicableWithReason_StoresTrimmedReason
          - ChecklistService_SetSectionApplicability_Applicable_ClearsReason
          - ChecklistService_SetSectionApplicability_UnknownSection_ThrowsChecklistItemNotFound

      - id: ReviewCenter-ChecklistService-Answer
        title: >-
          The ChecklistService class shall record the answer Pass, Fail, or N/A to a check of a review's
          checklist, replacing an earlier answer to the same check, shall require a justification for Fail and
          N/A, shall accept a justification of at most 2000 characters stored trimmed (none stored for an empty
          one on a Pass), and shall reject a check that is not in the checklist and a review that has no
          checklist, storing nothing on a violation.
        justification: |
          A failed or not-applicable check is only useful to the next reader when it says why. A pass needs no
          explanation. Replacing the answer lets a reviewer correct a mistake without leaving two answers to one
          question.
        tests:
          - ChecklistService_SetAnswer_PassWithoutJustification_Stores
          - ChecklistService_SetAnswer_FailOrNotApplicableWithoutJustification_Throws
          - ChecklistService_SetAnswer_JustificationTooLong_Throws
          - ChecklistService_SetAnswer_UnknownItem_ThrowsChecklistItemNotFound
          - ChecklistService_SetAnswer_UnknownReview_ThrowsChecklistNotFound
          - ChecklistService_SetAnswer_ReanswerWithPaddedJustification_OverwritesAndTrims

      - id: ReviewCenter-ChecklistService-AnsweredBy
        title: >-
          The ChecklistService class shall take the person of each answer and of each change of section
          applicability as the signed-in actor (user name and display name), reject a missing actor, and store
          both names with the UTC time of the change.
        justification: |
          Every answer must be attributable and dated. The person is the signed-in user, who needs no check, and
          storing the user name keeps the person identifiable if the display name changes later.
        tests:
          - ChecklistService_SetAnswer_NullActor_Throws
          - ChecklistService_SetAnswer_StoresActorAndUtcTime

      - id: ReviewCenter-ChecklistService-Progress
        title: >-
          The ChecklistService class shall derive from a review's checklist the number of answered and total
          checks per section and overall, counting a failed check as answered, leaving out the checks of a
          section that does not apply (such a section counts as done) and any answers kept for it, shall report
          the checklist complete when every check of every applicable section is answered, and shall give the
          first section with unanswered checks and the first unanswered check.
        justification: |
          Reviewers need to see what is left to do without counting. One set of rules in one place keeps every
          page showing the same numbers, and the first unanswered check lets a page lead the reviewer to the
          next piece of work.
        tests:
          - ChecklistState_Progress_CountsAnsweredPerSectionAndOverall
          - ChecklistState_Progress_NotApplicableSection_CountsAsDoneAndLeavesTotal
          - ChecklistState_Progress_AnswersInNotApplicableSection_Ignored
          - ChecklistState_Progress_AllApplicableAnswered_IsComplete
          - ChecklistState_Progress_AllSectionsNotApplicable_IsComplete
          - ChecklistState_NextUnansweredItemId_SkipsAnsweredAndNotApplicableSections
          - ChecklistState_FirstIncompleteSectionId_ReturnsFirstSectionWithUnanswered

      - id: ReviewCenter-ChecklistService-Audit
        title: >-
          The ChecklistService class shall record answering a check and changing the applicability of a section in
          the audit trail, in the same transaction as the change, naming the actor, the identifiers, and the outcome,
          with a short hash of the justification but never the justification itself.
        justification: |
          The history must show who answered which check and how, without copying free text into a record that
          cannot be edited.
        tests:
          - ChecklistService_ChecklistEvents_RecordOutcomeAndDigestButNotJustification

      - id: ReviewCenter-ChecklistService-Access
        title: >-
          The ChecklistService class shall require, for answering a check and for changing the applicability of a
          section, that the actor may see the project of the review (through IProjectAccess), refusing an actor who
          may not with the same ProjectNotFound rule as for a project that does not exist, before anything else is
          checked or stored.
        justification: |
          A user outside a project must not be able to change its review checklist, nor learn that the project
          exists. The service enforces this itself, whatever the page or the API checked, so that a route added later
          cannot bypass the rule.
        tests:
          - ChecklistService_Constructor_NullArguments_Throws

      - id: ReviewCenter-ChecklistService-ApprovalLock
        title: >-
          The ChecklistService class shall refuse to answer a check and to change the applicability of a section in a
          review that is approved and therefore locked, with the ReviewLocked rule, after the access check and before
          anything is stored.
        justification: |
          The answers are part of what a signature approves. Changing one after the approval would make the approval
          describe a record that no longer exists, so the service refuses until an administrator reopens the review.
        tests:
          - ChecklistService_Mutations_ApprovedReview_ThrowReviewLocked
