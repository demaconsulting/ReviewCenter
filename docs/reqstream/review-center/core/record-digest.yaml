---
# Software Unit Requirements for the RecordDigest Class
#
# The RecordDigest class calculates the digest of a review record: the value a signature binds itself to. The digest
# is a SHA-256 hash of a canonical text of the fingerprint, the checklist answers, the sections that do not apply, and
# the threads with their comments.

sections:
  - title: RecordDigest Unit Requirements
    requirements:
      - id: ReviewCenter-RecordDigest-Format
        title: >-
          The RecordDigest class shall calculate the digest of a review record as the SHA-256 hash, written as 64
          lowercase hexadecimal characters, of a canonical text that is built in one documented way and starts with
          the version header ReviewCenter record v1, so that the same record always gives the same digest, and
          shall reject a missing record.
        justification: |
          A signature is only evidence if the same record can be recognized later. Fixing the text that is hashed,
          and checking it against a known answer, means a change of the format cannot go unnoticed and make every
          earlier signature look out of date.
        tests:
          - RecordDigest_Canonicalize_SmallRecord_MatchesDocumentedFormat
          - RecordDigest_Compute_SameRecord_IsStableSha256OfCanonicalText
          - RecordDigest_Compute_KnownRecord_MatchesKnownValue
          - RecordDigest_Compute_ThreadSide_IsWrittenAndMatchesKnownValue
          - RecordDigest_Compute_NullRecord_Throws

      - id: ReviewCenter-RecordDigest-Coverage
        title: >-
          The RecordDigest class shall give a different digest when the content fingerprint, the outcome or
          justification of a check, an answered check, a section marked as not applicable or its reason, a thread
          or its file, side, range, or state, or the author, text, or order of a comment, or a new comment, changes.
        justification: |
          A signature approves what the reviewer saw. Anything the reviewer relied on must change the digest, or a
          signature could stay current after the content, the answers, or the discussion it approved had changed.
        tests:
          - RecordDigest_Compute_CoveredChange_ChangesDigest
          - RecordDigest_Compute_CommentOrder_ChangesDigest
          - RecordDigest_Compute_ThreadSideChange_ChangesDigest

      - id: ReviewCenter-RecordDigest-Checklist
        title: >-
          The RecordDigest class shall cover the checklist the review was created with in the canonical text: its
          version and, sorted by identifier, the identifier and title of every section and the identifier and
          question wording of every check (none for a review without a checklist), and shall give a different
          digest when any of them changes, and the same digest whatever order the definition lists them in.
        justification: |
          A signed answer only has meaning together with the question it answers. If the wording were not covered,
          a signature would not show which question the reviewer vouched for.
        tests:
          - RecordDigest_Compute_ChecklistRecord_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Compute_ChecklistWordingChange_ChangesDigest
          - RecordDigest_Compute_ChecklistDefinitionOrder_SameDigest
          - RecordDigest_Canonicalize_MalformedChecklistDefinition_Throws

      - id: ReviewCenter-RecordDigest-AnsweredBy
        title: >-
          The RecordDigest class shall cover who answered every check (display name and user name) in the canonical
          text, and shall give a different digest when either changes, but the same digest when only the time of
          the answer changes.
        justification: |
          A signature vouches for the record as it says who gave each answer. A different person answering the same
          value is a different statement, whereas the moment of answering is not a claim the record makes.
        tests:
          - RecordDigest_Compute_AnsweredByChanged_ChangesDigestButAnsweredAtDoesNot

      - id: ReviewCenter-RecordDigest-Independence
        title: >-
          The RecordDigest class shall give the same digest for the same record whatever the order in which its
          threads, answers, and sections are given and whatever identities the storage has given them, and shall
          not change when a section that applies is recorded as applying.
        justification: |
          The digest describes the review, not how it is stored. Without this, reading the record in another order,
          or recording the default of a section, would wrongly invalidate signatures.
        tests:
          - RecordDigest_Compute_ReorderedAndRenumbered_SameDigest
          - RecordDigest_Compute_ApplicableSection_NotCovered

      - id: ReviewCenter-RecordDigest-Unambiguous
        title: >-
          The RecordDigest class shall give different digests for two records that differ only in where text
          ends and the next value begins, so that no text of a comment, justification, or name can imitate the
          structure of the digest.
        justification: |
          Comment text is typed by users. If a text could contain what looks like the next field, two different
          records could share a digest, and a signature could be reused for a record it never covered.
        tests:
          - RecordDigest_Compute_TextWithDelimiters_DoesNotCollide

      - id: ReviewCenter-RecordDigest-ThreadSide
        title: >-
          The RecordDigest class shall write the side of every thread (Head or Baseline) into the canonical text
          between the file path and the line range, and shall give a different digest
          for two records that differ only in the side of a thread.
        justification: |
          A comment on a baseline line is about different text than a comment on a head line of the same number.
          A signature approves the discussion as it was, so the side must be part of what the signature binds to.
        tests:
          - RecordDigest_Compute_ThreadSide_IsWrittenAndMatchesKnownValue
          - RecordDigest_Compute_ThreadSideChange_ChangesDigest

      - id: ReviewCenter-RecordDigest-Source
        title: >-
          The RecordDigest class shall cover the source of a review in the canonical text: the word upload for an
          uploaded review, and for a review from a repository the repository
          identity, the baseline and head commit identifiers, the selection text, the identifier of the review-set
          the review was planned from (distinguishing none from the empty text), and every change with its path,
          change kind, baseline hash, and head hash, and shall give a different digest when any of them changes,
          and the same digest whatever the order of the changes.
        justification: |
          A signature approves a review of specific commits and files. If the source were not covered, the same
          signature could stay current for another selection, another commit, or a changed file. The review-set is
          part of what the review claims to cover, so a signature must not stay current if it is changed.
        tests:
          - RecordDigest_Canonicalize_GitSource_MatchesDocumentedFormat
          - RecordDigest_Compute_SourceChange_ChangesDigest
          - RecordDigest_Compute_ChangeOrder_SameDigest
          - RecordDigest_Compute_ReviewSetId_IsCoveredAndDistinguishesNullFromEmpty
