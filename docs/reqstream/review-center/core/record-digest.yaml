---
# Software Unit Requirements for the RecordDigest Class
#
# The RecordDigest class calculates the digest of a review record: the value a signature binds itself to. The digest
# is a SHA-256 hash of a canonical text of the fingerprint, the source of the files, the checklist wording, the
# checklist answers with who answered, the sections that do not apply, the report (the Findings and the included
# comments of the threads), and the number of reopenings.

sections:
  - title: RecordDigest Unit Requirements
    requirements:
      - id: ReviewCenter-RecordDigest-Format
        title: >-
          The RecordDigest class shall calculate the digest of a review record as the SHA-256 hash, written as 64
          lowercase hexadecimal characters, of a canonical text that is built in one documented way and starts with
          the version header ReviewCenter record v2, so that the same record always gives the same digest.
        justification: |
          A signature is only evidence if the same record can be recognized later. Fixing the text that is hashed,
          and checking it against a known answer, means a change of the format cannot go unnoticed and make every
          earlier signature look out of date.
        tests:
          - RecordDigest_Canonicalize_SmallRecord_MatchesDocumentedFormat
          - RecordDigest_Compute_SameRecord_IsStableSha256OfCanonicalText
          - RecordDigest_Compute_KnownRecord_MatchesKnownValue
          - RecordDigest_Compute_ThreadSide_IsWrittenAndMatchesKnownValue
          - RecordDigest_Compute_CoveredFieldsRecord_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Canonicalize_EmptyReport_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Canonicalize_Header_IsV2

      - id: ReviewCenter-RecordDigest-NullRecord
        title: >-
          The RecordDigest class shall reject a missing record with an ArgumentNullException, both when it builds
          the canonical text and when it calculates the digest.
        justification: |
          A missing record has no digest. Failing loudly stops a signature from binding to a digest of nothing.
        tests:
          - RecordDigest_Compute_NullRecord_Throws

      - id: ReviewCenter-RecordDigest-Coverage
        title: >-
          The RecordDigest class shall give a different digest when the content fingerprint, the outcome
          (Pass, Fail, or NotApplicable) or justification of a check (an absent justification being different from
          an empty one), an answered check, a section marked as not applicable or its reason, a thread that has an
          included comment or its file, side, start line, end line (a whole-file thread being different from one with
          lines), or an included comment's kind, author display name, author user name, text, time, or order, or a new
          included comment, changes, and shall give the same digest when only chat, the state of a thread, or the
          creation time or identity of a thread changes.
        justification: |
          A signature approves what the reviewer saw. Anything the reviewer relied on must change the digest, or a
          signature could stay current after the content, the answers, or the report it approved had changed. Chat
          and whether a thread is open are not part of what is signed, so they must not invalidate a signature;
          an open thread blocks signing by a rule of its own.
        tests:
          - RecordDigest_Compute_CoveredChange_ChangesDigest
          - RecordDigest_Compute_CommentOrder_ChangesDigest
          - RecordDigest_Compute_ThreadSideChange_ChangesDigest
          - RecordDigest_Compute_CoveredFieldsRecord_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Compute_ChatAddedToFinding_DigestUnchanged
          - RecordDigest_Compute_ThreadState_NotCovered
          - RecordDigest_Compute_ThreadCreatedAndIds_NotCovered

      - id: ReviewCenter-RecordDigest-Checklist
        title: >-
          The RecordDigest class shall cover the checklist the review was created with in the canonical text: its
          version and, sorted by identifier, the identifier and title of every section and the identifier and
          question wording of every check (none for a review without a checklist), and shall give a different
          digest when any of them changes, and the same digest whatever order the definition lists them in (assuming
          the identifiers of its sections and checks are unique).
        justification: |
          A signed answer only has meaning together with the question it answers. If the wording were not covered,
          a signature would not show which question the reviewer vouched for.
        tests:
          - RecordDigest_Compute_ChecklistRecord_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Compute_ChecklistWordingChange_ChangesDigest
          - RecordDigest_Compute_ChecklistDefinitionOrder_SameDigest

      - id: ReviewCenter-RecordDigest-ChecklistInvalid
        title: >-
          The RecordDigest class shall refuse a stored checklist definition that is invalid or incomplete with a
          JSON error instead of hiding it, and shall still accept a minimal complete definition.
        justification: |
          Corrupted stored text must stop the digest instead of being read as a different definition, while a
          valid definition must not be refused for being small.
        tests:
          - RecordDigest_Canonicalize_MalformedChecklistDefinition_Throws
          - RecordDigest_Canonicalize_MinimalChecklistDefinition_Computes

      - id: ReviewCenter-RecordDigest-AnsweredBy
        title: >-
          The RecordDigest class shall cover who answered every check (display name and user name) in the canonical
          text, and shall give a different digest when either changes, but the same digest when only the time of
          the answer changes.
        justification: |
          A signature vouches for the record as it says who gave each answer. A different person answering the same
          value is a different statement, whereas the moment of answering is not a claim the record makes.
        tests:
          - RecordDigest_Compute_AnsweredByChanged_ChangesDigestButAnsweredAtDoesNot

      - id: ReviewCenter-RecordDigest-SectionSetter
        title: >-
          The RecordDigest class shall not cover who marked a section as not applicable or when, so that the digest
          is the same whatever person or time is stored with the section.
        justification: |
          The section and its reason are what the record says; who recorded the exception is not a claim a
          signature vouches for. Leaving it out also keeps the digest of every existing review as it was.
        tests:
          - RecordDigest_Compute_SectionSetterAndTime_NotCovered

      - id: ReviewCenter-RecordDigest-Independence
        title: >-
          The RecordDigest class shall give the same digest for the same record whatever the order in which its
          threads, answers, and sections are given and whatever identities the storage has given them, and shall
          not change when a section that applies is recorded as applying.
        justification: |
          The digest describes the review, not how it is stored. Without this, reading the record in another order,
          or recording the default of a section, would wrongly invalidate signatures. The order holds for lists whose
          keys are unique, which is assumed of the input: the store keeps them unique.
        tests:
          - RecordDigest_Compute_ReorderedAndRenumbered_SameDigest
          - RecordDigest_Compute_ApplicableSection_NotCovered

      - id: ReviewCenter-RecordDigest-Unambiguous
        title: >-
          The RecordDigest class shall give different digests for two records that differ only in where text
          ends and the next value begins, so that no text of a comment, a justification, a name, a path, a
          checklist title, or any other string can imitate the structure of the digest, and an absent value shall
          differ from every text.
        justification: |
          Comment text is typed by users. If a text could contain what looks like the next field, two different
          records could share a digest, and a signature could be reused for a record it never covered.
        tests:
          - RecordDigest_Compute_TextWithDelimiters_DoesNotCollide
          - RecordDigest_Compute_EmptyAndSplitValues_DoNotCollide

      - id: ReviewCenter-RecordDigest-ThreadSide
        title: >-
          The RecordDigest class shall write the side of every thread of the report (Head or Baseline) into the
          canonical text between the file path and the line range, and shall give a different digest
          for two records that differ only in the side of a thread.
        justification: |
          A comment on a baseline line is about different text than a comment on a head line of the same number.
          A signature approves the report as it was, so the side must be part of what the signature binds to.
        tests:
          - RecordDigest_Compute_ThreadSide_IsWrittenAndMatchesKnownValue
          - RecordDigest_Compute_ThreadSideChange_ChangesDigest
          - RecordDigest_Compute_BaselineFinding_MatchesKnownValue

      - id: ReviewCenter-RecordDigest-Source
        title: >-
          The RecordDigest class shall cover the source of a review in the canonical text: the word upload for an
          uploaded review, and for a review from a repository the repository
          identity, the baseline and head commit identifiers, the selection text, the identifier of the review-set
          the review was planned from (distinguishing none from the empty text), and every change with its path,
          change kind, baseline hash, and head hash, and shall give a different digest when any of them changes.
        justification: |
          A signature approves a review of specific commits and files. If the source were not covered, the same
          signature could stay current for another selection, another commit, or a changed file. The review-set is
          part of what the review claims to cover, so a signature must not stay current if it is changed.
        tests:
          - RecordDigest_Canonicalize_GitSource_MatchesDocumentedFormat
          - RecordDigest_Compute_SourceChange_ChangesDigest
          - RecordDigest_Compute_ReviewSetId_IsCoveredAndDistinguishesNullFromEmpty
          - RecordDigest_Compute_CoveredFieldsRecord_MatchesDocumentedFormatAndKnownValue

      - id: ReviewCenter-RecordDigest-SourceOrder
        title: >-
          The RecordDigest class shall give the same digest for the same changes of a review whatever the order
          they are given in.
        justification: |
          The store does not promise an order for the changes. The digest must describe the review, not the order
          they were read in, or a signature could look out of date for no reason. The order holds for changes
          whose paths are unique, as they are within one review.
        tests:
          - RecordDigest_Compute_ChangeOrder_SameDigest

      - id: ReviewCenter-RecordDigest-ReopenCount
        title: >-
          The RecordDigest class shall cover the number of times a review was reopened in the canonical text, as a
          line that is written only when the number is greater than zero, shall give a different digest when the
          number changes, and shall give for a review that was never reopened the same digest as before the reopening
          existed, without a new format version.
        justification: |
          A reopened review must not accept its earlier signatures again, not even when the content is changed back to
          what was signed. Counting the reopenings in the digest makes every earlier signature out of date for good,
          while leaving the line out for a review that was never reopened keeps every existing signature and the
          evidence index valid.
        tests:
          - RecordDigest_Compute_ZeroReopens_EqualsDigestWithoutReopensLine
          - RecordDigest_Compute_ReopensChangeDigest
          - RecordDigest_Compute_CoveredFieldsRecord_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Compute_Reopens_MatchesKnownValueAfterReport

      - id: ReviewCenter-RecordDigest-FollowUp
        title: >-
          The RecordDigest class shall cover the review that a follow-up review follows, as a line that is written
          only for a follow-up, and the review that a carried answer, a carried not-applicable section and a carried
          thread of the report came from, as a suffix that is written only on a carried line (a carried thread that
          has no included comment is not written at all), shall give a different digest when either changes, shall
          not cover the number that the carried thread had in the earlier review, and shall give
          for a review that is not a follow-up, and has nothing carried, the same digest as a review without them,
          without a new format version.
        justification: |
          What a signature approves includes whether the reviewers answered a check themselves or took the answer over
          from an earlier review, so a change of that is a change of the record. Leaving the lines out when they do
          not apply keeps every existing signature and the evidence index valid. The number of the thread in the
          earlier review is a database number that adds nothing a reader could check, so it is not covered.
        tests:
          - RecordDigest_Compute_NoFollowUp_EqualsLegacyDigest
          - RecordDigest_Canonicalize_FollowUpRecord_MatchesDocumentedFormat
          - RecordDigest_Compute_FollowUpMarkerChange_ChangesDigest
          - RecordDigest_Compute_CarriedFromThreadId_NotCovered
          - ReviewService_FollowUp_DigestBindsToFollowAndIsImmuneToLaterChecklistChange
          - RecordDigest_Compute_CarriedFinding_MatchesKnownValue

      - id: ReviewCenter-RecordDigest-Report
        title: >-
          The RecordDigest class shall write the report of a review into the canonical text as the marker line
          report followed by one block for every thread that has at least one included comment, shall write in a block
          the file anchor of the thread and then, in the order they were posted, only the included comments as
          claim (the starting comment of a Finding), comment (an included reply), or resolution (an included
          resolution note) lines with the author display name, author user name, text, and time, shall sort the blocks
          ordinally so that the order of the threads does not matter, shall not write chat or a thread without an
          included comment, and shall keep the digest of a record without any included comment equal to that of the
          empty report.
        justification: |
          The report is what the owner chooses to put into the signed record. A canonical layout that names the kind
          of every line keeps a claim, a reply, and a resolution apart, and omitting everything else makes chat
          free of consequences. The known values pin the layout so that a change of it cannot go unnoticed.
        tests:
          - RecordDigest_Canonicalize_EmptyReport_MatchesDocumentedFormatAndKnownValue
          - RecordDigest_Compute_ResolvedFinding_MatchesKnownValue
          - RecordDigest_Compute_OpenFinding_MatchesKnownValue
          - RecordDigest_Compute_QuestionWithIncludedReply_MatchesKnownValue
          - RecordDigest_Compute_BaselineFinding_MatchesKnownValue
          - RecordDigest_Compute_CarriedFinding_MatchesKnownValue
          - RecordDigest_Compute_TwoIncludedThreads_SortedBlocksMatchKnownValue
          - RecordDigest_Compute_ChatOnlyThreads_EqualsEmptyReport
          - RecordDigest_Compute_PromoteDemote_ChangesDigestAndRoundTrips
          - RecordDigest_Compute_ReplyInclusionToggle_ChangesDigest
          - RecordDigest_Compute_ResolutionNote_CoveredOnlyWhenIncluded
          - RecordDigest_Compute_ThreadOrder_SameDigest
          - RecordDigest_Compute_ReportCommentOrder_ChangesDigest
          - RecordDigest_Compute_DelimitersInReportText_DoNotCollide
