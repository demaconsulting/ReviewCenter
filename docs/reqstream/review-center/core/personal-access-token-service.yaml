---
# Software Unit Requirements for the PersonalAccessTokenService Unit
#
# The PersonalAccessTokenService unit creates, lists, authenticates, and revokes the personal access tokens with
# which a script calls the API as a user. It keeps only a hash of each token value.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: PersonalAccessTokenService Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # Creation
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-Create
        title: >-
          The PersonalAccessTokenService unit shall create a token for a known, enabled user and list it among the
          tokens of that user.
        justification: |
          A script needs a credential of its own for the API.
        tests:
          - PersonalAccessTokenService_Create_ValidRequest_ReturnsTheTokenAndListsIt

      - id: ReviewCenter-PersonalAccessTokenService-Create-Prefix
        title: >-
          The PersonalAccessTokenService unit shall start the value of a new token with the prefix rcpat_.
        justification: |
          A prefix lets secret scanners recognize a leaked token.
        tests:
          - PersonalAccessTokenService_Create_NewToken_HasPrefixAndHighEntropyValue

      - id: ReviewCenter-PersonalAccessTokenService-Create-ValueFormat
        title: >-
          The PersonalAccessTokenService unit shall follow the prefix of a new token value with 43 URL-safe characters
          that encode 32 random bytes.
        justification: |
          A random value that cannot be guessed makes guessing hopeless.
        tests:
          - PersonalAccessTokenService_Create_NewToken_HasPrefixAndHighEntropyValue

      - id: ReviewCenter-PersonalAccessTokenService-Create-ValueUnique
        title: >-
          The PersonalAccessTokenService unit shall give two new tokens different values.
        justification: |
          Two tokens must never open the same door.
        tests:
          - PersonalAccessTokenService_Create_NewToken_HasPrefixAndHighEntropyValue

      - id: ReviewCenter-PersonalAccessTokenService-Create-HashOnly
        title: >-
          The PersonalAccessTokenService unit shall store only the SHA-256 hash of the value of a new token and no
          other stored text that holds the value.
        justification: |
          A stolen database must not hand out working tokens.
        tests:
          - PersonalAccessTokenService_Create_NewToken_StoresOnlyTheSha256Hash

      - id: ReviewCenter-PersonalAccessTokenService-Create-DisplayId
        title: >-
          The PersonalAccessTokenService unit shall give a new token a display id of 8 characters from the digits and
          the capital letters without I, L, O, and U.
        justification: |
          A short readable id lets the owner and the audit trail name a token.
        tests:
          - PersonalAccessTokenService_Create_DisplayId_IsShortRandomAndIndependentOfTheSecret

      - id: ReviewCenter-PersonalAccessTokenService-Create-DisplayIdIndependent
        title: >-
          The PersonalAccessTokenService unit shall give a new token a display id that is not part of its value.
        justification: |
          The id must not expose any part of the secret.
        tests:
          - PersonalAccessTokenService_Create_DisplayId_IsShortRandomAndIndependentOfTheSecret

      - id: ReviewCenter-PersonalAccessTokenService-Create-DisplayIdRandom
        title: >-
          The PersonalAccessTokenService unit shall draw the display id at random, so that tokens created one after
          another have different ids.
        justification: |
          Ids must tell tokens apart.
        tests:
          - PersonalAccessTokenService_Create_DisplayId_IsShortRandomAndIndependentOfTheSecret

      - id: ReviewCenter-PersonalAccessTokenService-Create-ValueOnce
        title: >-
          The PersonalAccessTokenService unit shall show the value of a token only in the answer of its creation and
          never in the list of tokens.
        justification: |
          The value cannot be read again, so a stolen listing yields nothing.
        tests:
          - PersonalAccessTokenService_List_AfterCreate_NeverReturnsTheValue

      - id: ReviewCenter-PersonalAccessTokenService-Create-NameTrimmed
        title: >-
          The PersonalAccessTokenService unit shall store the name of a new token without leading and trailing white
          space.
        justification: |
          Names are shown in lists and audit entries.
        tests:
          - PersonalAccessTokenService_Create_NameWithSurroundingSpaces_StoresItTrimmed

      - id: ReviewCenter-PersonalAccessTokenService-Create-NameEmpty
        title: >-
          The PersonalAccessTokenService unit shall refuse an empty or blank token name with the token name invalid
          rule.
        justification: |
          A token without a name cannot be told apart in a list.
        tests:
          - PersonalAccessTokenService_Create_InvalidName_ThrowsTokenNameInvalid

      - id: ReviewCenter-PersonalAccessTokenService-Create-NameControl
        title: >-
          The PersonalAccessTokenService unit shall refuse a token name that contains a control character with the
          token name invalid rule.
        justification: |
          A control character could disturb lists and audit text.
        tests:
          - PersonalAccessTokenService_Create_InvalidName_ThrowsTokenNameInvalid

      - id: ReviewCenter-PersonalAccessTokenService-Create-NameLength
        title: >-
          The PersonalAccessTokenService unit shall accept a token name of exactly the allowed length of 100
          characters.
        justification: |
          The limit must be inclusive.
        tests:
          - PersonalAccessTokenService_Create_NameLength_HasInclusiveLimit

      - id: ReviewCenter-PersonalAccessTokenService-Create-NameTooLong
        title: >-
          The PersonalAccessTokenService unit shall refuse a token name longer than 100 characters with the token name
          invalid rule.
        justification: |
          A limit keeps stored data and lists bounded.
        tests:
          - PersonalAccessTokenService_Create_NameLength_HasInclusiveLimit

      - id: ReviewCenter-PersonalAccessTokenService-Create-UnknownOwner
        title: >-
          The PersonalAccessTokenService unit shall refuse to create a token for an unknown user with the actor not
          allowed rule, and store nothing.
        justification: |
          Only a real account may own a token.
        tests:
          - PersonalAccessTokenService_Create_UnknownOwner_IsRefused

      - id: ReviewCenter-PersonalAccessTokenService-Create-DisabledOwner
        title: >-
          The PersonalAccessTokenService unit shall refuse to create a token for a disabled user with the actor not
          allowed rule, and store nothing.
        justification: |
          A disabled account must not gain a new credential.
        tests:
          - PersonalAccessTokenService_Create_DisabledOwner_IsRefused

      - id: ReviewCenter-PersonalAccessTokenService-Create-ListUnknownOwner
        title: >-
          The PersonalAccessTokenService unit shall refuse to list the tokens of an unknown user with the actor not
          allowed rule.
        justification: |
          Nothing about tokens is shown to a stranger.
        tests:
          - PersonalAccessTokenService_List_UnknownOwner_IsRefused

      # ---------------------------------------------------------------------------------------------------------------
      # Expiry
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-Expiry
        title: >-
          The PersonalAccessTokenService unit shall give a token an expiry 90 days after its creation when the choice
          is 90 days.
        justification: |
          A token that never expires is a permanent risk if it leaks.
        tests:
          - PersonalAccessTokenService_Create_ExpiryChoice_SetsTheExpiry

      - id: ReviewCenter-PersonalAccessTokenService-Expiry-Days30
        title: >-
          The PersonalAccessTokenService unit shall give a token an expiry 30 days after its creation when the choice
          is 30 days.
        justification: |
          A short life limits the damage of a leak.
        tests:
          - PersonalAccessTokenService_Create_ExpiryChoice_SetsTheExpiry

      - id: ReviewCenter-PersonalAccessTokenService-Expiry-Days365
        title: >-
          The PersonalAccessTokenService unit shall give a token an expiry 365 days after its creation when the choice
          is 365 days.
        justification: |
          A script that runs for a long time needs a token with a longer life.
        tests:
          - PersonalAccessTokenService_Create_ExpiryChoice_SetsTheExpiry

      - id: ReviewCenter-PersonalAccessTokenService-Expiry-Other
        title: >-
          The PersonalAccessTokenService unit shall refuse a choice of expiry other than 30, 90, or 365 days with the
          token expiry invalid rule, and store nothing.
        justification: |
          A short list of choices keeps the settings simple.
        tests:
          - PersonalAccessTokenService_Create_InvalidExpiry_ThrowsTokenExpiryInvalid

      - id: ReviewCenter-PersonalAccessTokenService-Expiry-Expired
        title: >-
          The PersonalAccessTokenService unit shall refuse a token from its expiry time on with the expired failure
          reason.
        justification: |
          Refusing at the expiry makes the choice real.
        tests:
          - PersonalAccessTokenService_Authenticate_AfterExpiry_IsRejected

      # ---------------------------------------------------------------------------------------------------------------
      # Limit
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-Limit
        title: >-
          The PersonalAccessTokenService unit shall refuse to create a token for a user who already has 20 active
          tokens, with the token limit reached rule, and store nothing.
        justification: |
          A limit keeps a script from filling the table.
        tests:
          - PersonalAccessTokenService_Create_TwentyActive_RejectsTheTwentyFirst

      - id: ReviewCenter-PersonalAccessTokenService-Limit-Revoked
        title: >-
          The PersonalAccessTokenService unit shall not count a revoked token among the active tokens.
        justification: |
          The user can always make room by revoking a token.
        tests:
          - PersonalAccessTokenService_Create_RevokedTokens_DoNotCount

      - id: ReviewCenter-PersonalAccessTokenService-Limit-Expired
        title: >-
          The PersonalAccessTokenService unit shall not count an expired token among the active tokens.
        justification: |
          An expired token no longer grants access.
        tests:
          - PersonalAccessTokenService_Create_ExpiredTokens_DoNotCount

      # ---------------------------------------------------------------------------------------------------------------
      # Temporary password
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword
        title: >-
          The PersonalAccessTokenService unit shall refuse to create a token for a user whose password is a temporary
          one with the password change required rule.
        justification: |
          A temporary password is known to the person who handed it over.
        tests:
          - PersonalAccessTokenService_TemporaryPassword_RefusesEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-List
        title: >-
          The PersonalAccessTokenService unit shall refuse to list the tokens of a user whose password is a temporary
          one with the password change required rule.
        justification: |
          An account that has not taken over must not use the token features.
        tests:
          - PersonalAccessTokenService_TemporaryPassword_RefusesEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Revoke
        title: >-
          The PersonalAccessTokenService unit shall refuse to revoke a token of a user whose password is a temporary
          one with the password change required rule.
        justification: |
          The account has not taken over, so it must not use the token features.
        tests:
          - PersonalAccessTokenService_TemporaryPassword_RefusesEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Authenticate
        title: >-
          The PersonalAccessTokenService unit shall refuse every token of an owner whose password is a temporary one at
          authentication with the owner must change password failure reason.
        justification: |
          A token from before the reset must not open an account that may have changed hands.
        tests:
          - PersonalAccessTokenService_TemporaryPassword_RefusesEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared
        title: >-
          The PersonalAccessTokenService unit shall let a user create a token again once the password of the user is no
          longer a temporary one.
        justification: |
          The refusal ends when the user has chosen a new password.
        tests:
          - PersonalAccessTokenService_TemporaryPasswordCleared_AllowsEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared-List
        title: >-
          The PersonalAccessTokenService unit shall let a user list the tokens again once the password of the user is
          no longer a temporary one.
        justification: |
          The refusal to list ends when the user has chosen a new password.
        tests:
          - PersonalAccessTokenService_TemporaryPasswordCleared_AllowsEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared-Revoke
        title: >-
          The PersonalAccessTokenService unit shall let a user revoke a token again once the password of the user is no
          longer a temporary one.
        justification: |
          The refusal to revoke ends when the user has chosen a new password.
        tests:
          - PersonalAccessTokenService_TemporaryPasswordCleared_AllowsEveryUse

      - id: ReviewCenter-PersonalAccessTokenService-TemporaryPassword-Cleared-Authenticate
        title: >-
          The PersonalAccessTokenService unit shall accept a token of an owner at authentication again once the
          password of the owner is no longer a temporary one.
        justification: |
          The refusal at authentication ends when the owner has chosen a new password.
        tests:
          - PersonalAccessTokenService_TemporaryPasswordCleared_AllowsEveryUse

      # ---------------------------------------------------------------------------------------------------------------
      # Authentication
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-Authenticate
        title: >-
          The PersonalAccessTokenService unit shall accept a token value whose hash equals the stored hash and answer
          the owner of the token with the current role.
        justification: |
          A token must work for the person who has the value.
        tests:
          - PersonalAccessTokenService_Authenticate_RightAndWrongValue_OnlyRightSucceeds

      - id: ReviewCenter-PersonalAccessTokenService-Authenticate-Unknown
        title: >-
          The PersonalAccessTokenService unit shall refuse a well-formed value that matches no stored token with the
          unknown failure reason and no owner.
        justification: |
          A token must work for nobody else.
        tests:
          - PersonalAccessTokenService_Authenticate_RightAndWrongValue_OnlyRightSucceeds
          - PersonalAccessTokenService_Authenticate_StoreReturnsRowWithOtherHash_IsRejected

      - id: ReviewCenter-PersonalAccessTokenService-Authenticate-HashRecheck
        title: >-
          The PersonalAccessTokenService unit shall refuse a token whose stored hash differs from the hash of the
          presented value, even when the store returned its row.
        justification: |
          The match is verified again and not trusted.
        tests:
          - PersonalAccessTokenService_Authenticate_StoreReturnsRowWithOtherHash_IsRejected

      - id: ReviewCenter-PersonalAccessTokenService-Authenticate-Malformed
        title: >-
          The PersonalAccessTokenService unit shall refuse a value that has the wrong shape with the malformed failure
          reason.
        justification: |
          A value of the wrong shape is no token.
        tests:
          - PersonalAccessTokenService_Authenticate_Malformed_IsRejected

      - id: ReviewCenter-PersonalAccessTokenService-Authenticate-Revoked
        title: >-
          The PersonalAccessTokenService unit shall refuse a revoked token with the revoked failure reason.
        justification: |
          A token that was taken back must stop working.
        tests:
          - PersonalAccessTokenService_Revoke_OwnToken_StopsWorkingAndIsAudited

      - id: ReviewCenter-PersonalAccessTokenService-Authenticate-OwnerDisabled
        title: >-
          The PersonalAccessTokenService unit shall refuse a token of a disabled owner with the owner disabled failure
          reason.
        justification: |
          A token must stop working when the person may no longer act.
        tests:
          - PersonalAccessTokenService_Authenticate_DisabledOrLockedOwner_IsRejected

      - id: ReviewCenter-PersonalAccessTokenService-Authenticate-OwnerLockedOut
        title: >-
          The PersonalAccessTokenService unit shall refuse a token of a locked-out owner with the owner locked out
          failure reason.
        justification: |
          A locked-out account must not be used through a token.
        tests:
          - PersonalAccessTokenService_Authenticate_DisabledOrLockedOwner_IsRejected

      # ---------------------------------------------------------------------------------------------------------------
      # Last use
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-LastUsed
        title: >-
          The PersonalAccessTokenService unit shall record the time of the first use of a token when it is
          authenticated.
        justification: |
          The owner can tell a token that is no longer used and revoke it.
        tests:
          - PersonalAccessTokenService_Authenticate_FirstUse_RecordsTheTime
          - PersonalAccessTokenService_Authenticate_Touch_AtMostOncePerFiveMinutes

      - id: ReviewCenter-PersonalAccessTokenService-LastUsed-WithinFiveMinutes
        title: >-
          The PersonalAccessTokenService unit shall not record the last use of a token again within five minutes of the
          recorded time.
        justification: |
          A script that calls often must not cause a write on every request.
        tests:
          - PersonalAccessTokenService_Authenticate_Touch_AtMostOncePerFiveMinutes

      - id: ReviewCenter-PersonalAccessTokenService-LastUsed-AfterFiveMinutes
        title: >-
          The PersonalAccessTokenService unit shall record the last use of a token again when five minutes have passed
          since the recorded time.
        justification: |
          The recorded time must stay useful.
        tests:
          - PersonalAccessTokenService_Authenticate_Touch_AtMostOncePerFiveMinutes

      - id: ReviewCenter-PersonalAccessTokenService-LastUsed-Burst
        title: >-
          The PersonalAccessTokenService unit shall record the last use of a token once when several requests arrive at
          once.
        justification: |
          A burst of requests must not cause a burst of writes.
        tests:
          - PersonalAccessTokenService_Authenticate_ParallelBurst_TouchesOnce

      # ---------------------------------------------------------------------------------------------------------------
      # Revocation
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-Revoke
        title: >-
          The PersonalAccessTokenService unit shall let a user revoke a token of their own so that it stops working at
          once.
        justification: |
          A leaked token must be possible to take back.
        tests:
          - PersonalAccessTokenService_Revoke_OwnToken_StopsWorkingAndIsAudited

      - id: ReviewCenter-PersonalAccessTokenService-Revoke-OtherUser
        title: >-
          The PersonalAccessTokenService unit shall refuse to revoke the token of another user with the token not found
          rule and leave the token working.
        justification: |
          A user must not take back the tokens of others.
        tests:
          - PersonalAccessTokenService_Revoke_OtherUsersToken_IsRefusedAndTheTokenKeepsWorking

      - id: ReviewCenter-PersonalAccessTokenService-Revoke-Missing
        title: >-
          The PersonalAccessTokenService unit shall refuse to revoke a token that does not exist with the token not
          found rule.
        justification: |
          The refusal must not tell a missing token apart from the token of another user.
        tests:
          - PersonalAccessTokenService_Revoke_OtherUsersToken_IsRefused

      - id: ReviewCenter-PersonalAccessTokenService-Revoke-AlreadyRevoked
        title: >-
          The PersonalAccessTokenService unit shall refuse to revoke a token that is already revoked with the token not
          found rule.
        justification: |
          A revoked token is as good as gone.
        tests:
          - PersonalAccessTokenService_Revoke_OtherUsersToken_IsRefused

      - id: ReviewCenter-PersonalAccessTokenService-Revoke-ApiTokenCreate
        title: >-
          The PersonalAccessTokenService unit shall refuse to create a token for an actor that came through a token
          with the actor not allowed rule, and store nothing.
        justification: |
          A leaked token must not be able to make more tokens.
        tests:
          - PersonalAccessTokenService_CreateAndRevoke_ApiTokenActor_IsRefused

      - id: ReviewCenter-PersonalAccessTokenService-Revoke-ApiToken
        title: >-
          The PersonalAccessTokenService unit shall refuse to revoke a token for an actor that came through a token
          with the actor not allowed rule, and leave the token working.
        justification: |
          A leaked token must not be able to take back the other tokens of its owner.
        tests:
          - PersonalAccessTokenService_CreateAndRevoke_ApiTokenActor_IsRefused

      # ---------------------------------------------------------------------------------------------------------------
      # Audit
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-PersonalAccessTokenService-Audit
        title: >-
          The PersonalAccessTokenService unit shall record the creation of a token in the audit trail with the acting
          user, the token name, and the display id.
        justification: |
          Who made a token must be traceable.
        tests:
          - PersonalAccessTokenService_CreateAndRevoke_RecordAuditEventsWithoutTheValue

      - id: ReviewCenter-PersonalAccessTokenService-Audit-Revoked
        title: >-
          The PersonalAccessTokenService unit shall record the revocation of a token in the audit trail with the acting
          user, the token name, and the display id.
        justification: |
          Who took a token back must be traceable.
        tests:
          - PersonalAccessTokenService_CreateAndRevoke_RecordAuditEventsWithoutTheValue
          - PersonalAccessTokenService_Revoke_OwnToken_StopsWorkingAndIsAudited

      - id: ReviewCenter-PersonalAccessTokenService-Audit-NoValue
        title: >-
          The PersonalAccessTokenService unit shall never put the value or the hash of a token into an audit entry.
        justification: |
          The audit trail is read by more people than the owner.
        tests:
          - PersonalAccessTokenService_CreateAndRevoke_RecordAuditEventsWithoutTheValue

      - id: ReviewCenter-PersonalAccessTokenService-Audit-Expiry
        title: >-
          The PersonalAccessTokenService unit shall state the expiry time of a new token in its creation entry.
        justification: |
          When a token stops working belongs in the record.
        tests:
          - PersonalAccessTokenService_CreateAndRevoke_RecordAuditEventsWithoutTheValue
