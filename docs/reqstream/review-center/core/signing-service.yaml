---
# Software Unit Requirements for the SigningService Class
#
# The SigningService class manages the reviewer slots of a review, decides whether a review can be signed, signs it for
# a reviewer after the reviewer confirms the password again, and computes whether each slot, and the review, has a
# current signature.

sections:
  - title: SigningService Unit Requirements
    requirements:
      - id: ReviewCenter-SigningService-Slots
        title: >-
          The SigningService class shall let a review have any number of reviewer slots, including none, each
          with a primary reviewer and an optional alternate, numbered in the order in which they were added, none
          of them signed when added, and shall reject a slot in a review that does not exist.
        justification: |
          A review is approved by the reviewers who are named for it. A slot names the person responsible and
          optionally a stand-in, and a review that has not yet named anybody is simply not approved yet.
        tests:
          - SigningService_AddSlotAsync_Valid_AddsNumberedUnsignedSlot
          - SigningService_AddSlotAsync_MissingReview_ThrowsReviewNotFound
          - SigningService_GetApprovalAsync_NoSlots_NotApprovedAndAsksForSlot

      - id: ReviewCenter-SigningService-SlotUsers
        title: >-
          The SigningService class shall require that the primary reviewer and the alternate of a slot are
          existing, enabled users who are members of the project of the review, even when a user is a system
          administrator, that they are different users, and that no user is in two slots of one review, and shall
          offer only the enabled members of the project, without their passwords, as candidates to an actor who may
          see the project.
        justification: |
          A signature must come from a known, active person who belongs to the project, because only the members
          are meant to review its work. One person holding two slots would let a single reviewer fill every place
          that is meant to bring independent reviewers.
        tests:
          - SigningService_AddSlotAsync_SameUserTwice_ThrowsSlotUserInvalid
          - SigningService_AddSlotAsync_UserInOtherSlot_ThrowsSlotUserInvalid
          - SigningService_AddSlotAsync_UnknownOrDisabledUser_ThrowsSlotUserInvalid
          - SigningService_AddSlotAsync_NonMember_ThrowsSlotUserInvalid
          - SigningService_UpdateSlotAsync_KeepOwnUsers_Succeeds
          - SigningService_ListCandidatesAsync_ReturnsEnabledMembersOnly

      - id: ReviewCenter-SigningService-SlotEdit
        title: >-
          The SigningService class shall let a slot that has never been signed be changed or removed, shall refuse
          to change or remove a slot that has any signature, current or out of date, and shall reject a slot that
          does not exist in the review.
        justification: |
          A signature must always point to a slot that still says who the signer was. Allowing a signed slot to be
          reassigned or removed would let the record claim that someone else approved.
        tests:
          - SigningService_UpdateAndRemoveSlotAsync_Unsigned_Succeed
          - SigningService_UpdateAndRemoveSlotAsync_Signed_ThrowsSlotSigned
          - SigningService_UpdateAndRemoveSlotAsync_UnknownSlot_ThrowsSlotNotFound

      - id: ReviewCenter-SigningService-Actor
        title: >-
          The SigningService class shall allow a slot to be added, changed, removed, or signed, and a review to be
          reopened, only for a signed-in user that still exists and is enabled, shall refuse every one of them for a
          project that does not exist or that the actor may not see with the ProjectNotFound rule, shall let any actor
          who may see the project, a member or a system administrator who is not a member, add, change, and remove
          slots, shall allow a slot to be signed only by its primary reviewer or its alternate who is still a member of
          the project, and shall refuse a system administrator who is not a member the right to sign.
        justification: |
          The page shows who is signed in, but the rules must hold even if the page or a browser session is out of
          date. A user who has been disabled or removed from the project since signing in must not be able to
          change or approve a review, and a signature is only meaningful when the signer is the person the slot
          names and belongs to the project. Arranging the slots needs no membership, so that a system administrator
          can set up a review, because only a member can be named in a slot and only a member can sign, which keeps
          the signatures with the members.
        tests:
          - SigningService_AddSlotAsync_ActorDisabledOrUnknown_ThrowsActorNotAllowed
          - SigningService_UpdateRemoveAndReopen_ActorDisabledOrUnknown_ThrowsActorNotAllowed
          - SigningService_SlotSignAndReopenCalls_ProjectNotFound_ThrowsProjectNotFound
          - SigningService_SlotChanges_RealAccessRules_NeedViewAccessOnly
          - SigningService_SignAsync_ActorDisabled_ThrowsActorNotAllowed
          - SigningService_SignAsync_NotInSlot_ThrowsActorNotAllowed
          - SigningService_SignAsync_NotAMember_IsRefused

      - id: ReviewCenter-SigningService-Blockers
        title: >-
          The SigningService class shall refuse to sign a review while a check in a section that applies is
          unanswered, a check is answered Fail, or a thread is open, shall list each of these as a blocker, and
          shall not count a check answered Fail in a section that does not apply.
        justification: |
          A signature says the reviewer approves the record. That is not true while checks are unanswered, a check
          has failed, or a discussion is still open, and a failed check in a section that was excluded is not part
          of what is being approved.
        tests:
          - SigningService_SignAsync_Blocker_ThrowsSigningNotAllowedAndListsBlocker
          - SigningService_GetApprovalAsync_NotApplicableSectionFail_DoesNotBlock

      - id: ReviewCenter-SigningService-Sign
        title: >-
          The SigningService class shall store a signature for a primary reviewer or an alternate of a slot that
          records the slot, the user, the display name at that time, the role, the time, the digest of the record,
          and the fixed meaning text, and shall never change or remove a signature that has been stored.
        justification: |
          The signature is the evidence of who approved which record and when. Keeping every signature unchanged
          means the history of approvals stays reliable after the record changes and is signed again.
        tests:
          - SigningService_SignAsync_PrimaryWithPassword_StoresSignatureAndApproves
          - SigningService_SignAsync_Alternate_RecordsAlternateRole
          - SigningService_SignAsync_RecordChangedAfterSigning_OutOfDateThenResignable
          - SigningService_GetApprovalAsync_ContentChangedAfterSigning_OutOfDateThenResignable

      - id: ReviewCenter-SigningService-Reauthenticate
        title: >-
          The SigningService class shall store a signature only after the signer has given the password of the
          account again, shall ask for the password only after every other check has passed, so that a refusal for
          another reason does not count as a wrong password, shall report a wrong password and a locked account in the
          same way, and shall count wrong passwords toward the same lockout as signing in.
        justification: |
          A signature must come from the person, not from a session left open at a desk. Reusing the sign-in
          check gives the same protection against guessing, and one generic answer gives an attacker nothing more
          than the login page does. Checking the password last means a signer who is told that the record changed or
          that a thread is open is not locked out for the password typed with the request.
        tests:
          - SigningService_SignAsync_WrongPassword_ThrowsReauthenticationFailed
          - SigningService_SignAsync_RepeatedWrongPassword_LocksOutLikeLogin
          - SigningService_SignAsync_RefusedBeforePassword_DoesNotCountWrongPasswords

      - id: ReviewCenter-SigningService-ReauthAudit
        title: >-
          The SigningService class shall have the failures of the password check of a signature (wrong password,
          locked account) recorded in the audit trail as failed re-authentications, without the password, using the
          re-authentication check of the UserService.
        justification: |
          Guessing the password at signing time must be visible in the history, apart from failed sign-ins, so that
          the history shows where the attempt was made.
        tests:
          - SigningService_SignAsync_WrongPasswordThenLocked_RecordsReauthFailedEntriesWithoutPassword

      - id: ReviewCenter-SigningService-Current
        title: >-
          The SigningService class shall store a signature only for the digest of the record that the signer
          saw, and shall refuse with a message that the record changed when the record is not that one any more,
          and shall refuse to sign a slot that already has a signature for the current record.
        justification: |
          A reviewer who signs a page that is out of date would approve content they have not seen. Signing what
          was seen keeps the signature honest, and a second signature for the same record would add nothing.
        tests:
          - SigningService_SignAsync_StaleExpectedDigest_ThrowsRecordChanged
          - SigningService_SignAsync_AlreadySignedCurrent_ThrowsSigningNotAllowed

      - id: ReviewCenter-SigningService-Status
        title: >-
          The SigningService class shall give for a review the digest of its record, for each slot whether it is
          not signed, signed with a current signature (naming the signer and time), or out of date because it was
          signed only for an earlier record, whether the review is approved, which requires at least one slot and
          every slot to have a current signature, the blockers, and one sentence naming the next step, and shall
          give nothing for a review that does not exist. The status shall also say for the primary and for the alternate
          reviewer of each slot whether that user is still a member of the project, and shall keep the slot assigned
          to a user who has been removed from the project.
        justification: |
          Approval has to follow the record. Computing it from the signatures and the record each time means a
          change to the record can never leave a review looking approved, and nothing about the status can be
          stored out of step with the record. A reviewer who was removed from the project cannot sign, so the
          people who arrange the review must be able to see that a slot needs another reviewer, while the history of
          the slot stays intact.
        tests:
          - SigningService_GetApprovalAsync_TwoSlots_ApprovedOnlyWhenBothSigned
          - SigningService_SignAsync_RecordChangedAfterSigning_OutOfDateThenResignable
          - SigningService_GetApprovalAsync_ContentChangedAfterSigning_OutOfDateThenResignable
          - SigningService_GetApprovalAsync_NoSlots_NotApprovedAndAsksForSlot
          - SigningService_GetApprovalAsync_MissingReview_ReturnsNull
          - SigningService_GetApprovalAsync_AssigneeRemovedFromProject_IsMarkedNotAMember
          - SigningService_GetApprovalsAsync_SeveralReviews_EqualsSingleReadsAndLoadsUsersOnce
          - SigningService_GetApprovalsAsync_NoReviews_ReturnsEmptyWithoutReadingUsers

      - id: ReviewCenter-SigningService-Audit
        title: >-
          The SigningService class shall record adding, changing, and removing a slot and adding a signature in the
          audit trail, by passing the entry to the store in the same call as the change, so that the store saves them in
          one transaction (which is verified by the tests of the ReviewStore class), naming the actor, the slot, the
          reviewers, and for a signature the role and the record digest, and shall record nothing for a change that is
          refused.
        justification: |
          The approval of a review is the most important event of its history, and the history must show who
          arranged the reviewers and who signed which record.
        tests:
          - SigningService_SlotAndSignatureEvents_AreRecordedWithMembersAndDigest
          - SigningService_RemoveSlotAsync_RecordsSlotRemovedWithItsMembers

      - id: ReviewCenter-SigningService-ApiToken
        title: >-
          The SigningService class shall refuse to sign, and to add, change, or remove a reviewer slot, for an actor
          that came through a personal access token, with the ActorNotAllowed rule and a message that names the API
          token, before it checks anything else, and without counting a password or recording an audit entry.
        justification: |
          A signature must prove that the person was present and knew their password, which a token held by a script
          does not. Refusing in the service, not only in the routes, keeps a later route or page from giving a token
          the power to sign.
        tests:
          - SigningService_SignAsync_ApiTokenActor_IsRefusedBeforeAnyCheck
          - SigningService_AddUpdateRemoveSlot_ApiTokenActor_IsRefused

      - id: ReviewCenter-SigningService-ExternalReauth
        title: >-
          The SigningService class shall let a user of a provider sign a slot only when a confirmation of identity that
          was issued for this user, project, review, and slot is still valid, shall use that confirmation up only after
          every other check has passed, shall keep it when the signature is refused before for another reason, shall
          refuse the signature, record it as a failed confirmation (a failed re-authentication in the audit trail with
          the detail oidc: no-proof, without any secret), and sign nothing when there is none, and shall let
          the page ask whether a confirmation exists without using it up.
        justification: |
          A user of a provider has no password to type, so the confirmation that the person just signed in again takes
          its place, and it must be as hard to reuse as a password that has to be typed for every signature. Keeping
          it when a signature is refused for another reason lets the person correct the cause and sign. The page needs
          to know whether to offer the signature or the confirmation without spending it.
        tests:
          - SigningService_SignAsync_ExternalUserWithProof_SignsOnce
          - SigningService_SignAsync_ExternalUserWithoutLiveProof_IsRefused
          - SigningService_SignAsync_ProofOfOtherBinding_IsRefused
          - SigningService_SignAsync_ExternalUserWithoutProofStore_IsRefused
          - SigningService_SignAsync_ApiTokenActorWithProof_IsRefusedAndKeepsProof
          - SigningService_SignAsync_RecordChanged_KeepsTheProof
          - SigningService_HasReauthProofAsync_AnswersWithoutSpending
          - SigningService_RequireConfirmableAsync_AcceptsOnlyAReviewerOfTheSlot
          - SigningService_RequireConfirmableAsync_NotAReviewerOfTheSlot_IsRefused

      - id: ReviewCenter-SigningService-TotpReauth
        title: >-
          The SigningService class shall require, for a signer with a second factor, a fresh code of the authenticator
          app in addition to the password, check the password first and keep the code when the password is wrong,
          refuse a recovery code and a code that was already used in the current step with the same message as a wrong
          password, refuse an actor that came through an API token with the ActorNotAllowed rule and the API token
          message (see the ApiToken requirement) and keep the code, count wrong codes toward the lockout and record
          them in the audit trail, fail closed when the second factor cannot be checked, and need no code for a user
          without a second factor, for a user of a provider, or after an administrator reset.
        justification: |
          A signature is the strongest statement in the product and the person must prove that they are there. A code
          that was used to sign in cannot be used again, so the person waits for the next one, which is the cost of
          the replay protection. A recovery code must not sign, as it is for getting back in.
        tests:
          - SigningService_SignAsync_EnrolledUserWithPasswordAndFreshCode_Signs
          - SigningService_SignAsync_EnrolledUserWithoutRightCode_IsRefused
          - SigningService_SignAsync_WrongPasswordRightCode_IsRefusedAndKeepsTheCode
          - SigningService_SignAsync_WrongCodes_LockTheAccountForSigningAndSignIn
          - SigningService_SignAsync_EnrolledUserWithoutTotpService_FailsClosed
          - SigningService_SignAsync_UserWithoutSecondFactor_NeedsNoCode
          - SigningService_SignAsync_ExternalUser_IsNotAffectedByTheSecondFactor
          - SigningService_SignAsync_ApiTokenActorWithPasswordAndCode_IsRefusedAndKeepsTheCode
          - SigningService_SignAsync_AfterAdministratorReset_NeedsNoCode

      - id: ReviewCenter-SigningService-ApprovalLock
        title: >-
          The SigningService class shall treat a review that is approved (every slot, at least one, has a signature
          of the current record) as locked, shall refuse to add, change, or remove a slot and shall refuse to sign
          while the review is locked, with the ReviewLocked rule and a message that says the review is approved and
          has to be reopened first, and shall compute the lock from the signatures and the record each time and not
          store it.
        justification: |
          A signature approves the review as it was. If the content, the checklist, or the people who have to sign
          could still change after the approval, the approval would describe something other than what is on record.
          Computing the lock from the current record means it can never be out of step with the signatures, and a
          reviewer who tries to sign again is told the reason instead of a message about an earlier signature.
        tests:
          - SigningService_AddUpdateRemoveSlotAsync_ApprovedReview_ThrowsReviewLocked
          - SigningService_SignAsync_ApprovedReview_ThrowsReviewLocked

      - id: ReviewCenter-SigningService-Reopen
        title: >-
          The SigningService class shall let only an administrator of the project or a system administrator reopen a
          locked review, never an actor that came through a personal access token, shall require a reason of one to
          250 characters after trimming, shall refuse a review that is not locked with the ReviewNotLocked rule, shall
          store the reopening with the user, the time, the reason, and the digest of the approved record, shall record
          it in the audit trail as review.reopened, in the same transaction as the change, with the reason and the
          digest, shall keep every earlier signature as history that is out of date, and shall need fresh signatures
          from every slot before the review is approved again.
        justification: |
          Leaving the lock has to be a deliberate and accountable act that an ordinary reviewer or a script cannot
          perform. The reason and the digest in the history show who reopened which approval and why, and keeping the
          earlier signatures, which are out of date from then on, means the approval history stays complete while no
          old signature can approve the changed record, not even when the content is changed back.
        tests:
          - SigningService_ReopenReviewAsync_NotAdmin_ThrowsActorNotAllowed
          - SigningService_ReopenReviewAsync_InvalidReason_ThrowsReopenReasonInvalid
          - SigningService_ReopenReviewAsync_NotLocked_ThrowsReviewNotLocked
          - SigningService_ReopenReviewAsync_ApiToken_ThrowsActorNotAllowed
          - SigningService_ReopenReviewAsync_Admin_ReturnsToInReviewKeepsSignaturesAndAudits
          - SigningService_ReopenReviewAsync_MissingReview_ThrowsReviewNotFound
          - SigningService_ReopenReviewAsync_ReasonAtLimitWithBlanks_IsAcceptedTrimmed
          - SigningService_ReopenReviewAsync_RealAccessRules_ReopensOnlyForAdministrators
          - SigningService_ReopenReviewAsync_ThenResign_ApprovesAgainWithBothSignatures

      - id: ReviewCenter-SigningService-IndependentReviewers
        title: >-
          The SigningService class shall, when the project requires independent reviewers, refuse with the
          ReviewerNotIndependent rule to put the user who created the review into a slot as primary reviewer or as
          alternate, when a slot is added or changed, and shall refuse the signature of that user at the time of
          signing, also for a slot that was filled before the setting was switched on, and shall enforce nothing when
          the project does not require independent reviewers.
        justification: |
          A review is worth little when the person who made it also approves it. Checking at the assignment gives
          early feedback, and checking again at signing closes the gap for slots that were filled while the setting
          was off. The author is the user of Review Center who created the review, because the tool knows nothing
          about the authors of the commits, which is stated to the users. A project in which one person has to do
          both may switch the rule off.
        tests:
          - SigningService_AddSlotAsync_AuthorAsPrimaryOrAlternate_ThrowsReviewerNotIndependent
          - SigningService_UpdateSlotAsync_AuthorAsPrimaryOrAlternate_ThrowsReviewerNotIndependent
          - SigningService_AddSlotAsync_AuthorAndIndependenceOff_Succeeds
          - SigningService_SignAsync_AuthorInPreexistingSlot_ThrowsReviewerNotIndependent
