---
# Software Unit Requirements for the SigningService Class
#
# The SigningService class manages the reviewer slots of a review, decides whether a review can be signed, signs it for
# a reviewer after the reviewer confirms the password again, and computes whether each slot, and the review, has a
# current signature.

sections:
  - title: SigningService Unit Requirements
    requirements:
      - id: ReviewCenter-SigningService-Slots
        title: >-
          The SigningService class shall let a review have any number of reviewer slots, including none, each
          with a primary reviewer and an optional alternate, numbered in the order in which they were added, none
          of them signed when added, and shall reject a slot in a review that does not exist.
        justification: |
          A review is approved by the reviewers who are named for it. A slot names the person responsible and
          optionally a stand-in, and a review that has not yet named anybody is simply not approved yet.
        tests:
          - SigningService_AddSlotAsync_Valid_AddsNumberedUnsignedSlot
          - SigningService_AddSlotAsync_MissingReview_ThrowsReviewNotFound
          - SigningService_GetApprovalAsync_NoSlots_NotApprovedAndAsksForSlot

      - id: ReviewCenter-SigningService-SlotUsers
        title: >-
          The SigningService class shall require that the primary reviewer and the alternate of a slot are
          existing, enabled users who are members of the project of the review, even when a user is a system
          administrator, that they are different users, and that no user is in two slots of one review, and shall
          offer only the enabled members of the project, without their passwords, as candidates to an actor who may
          see the project.
        justification: |
          A signature must come from a known, active person who belongs to the project, because only the members
          are meant to review its work. One person holding two slots would let a single reviewer fill every place
          that is meant to bring independent reviewers.
        tests:
          - SigningService_AddSlotAsync_SameUserTwice_ThrowsSlotUserInvalid
          - SigningService_AddSlotAsync_UserInOtherSlot_ThrowsSlotUserInvalid
          - SigningService_AddSlotAsync_UnknownOrDisabledUser_ThrowsSlotUserInvalid
          - SigningService_AddSlotAsync_NonMember_ThrowsSlotUserInvalid
          - SigningService_UpdateSlotAsync_KeepOwnUsers_Succeeds
          - SigningService_ListCandidatesAsync_ReturnsEnabledMembersOnly

      - id: ReviewCenter-SigningService-SlotEdit
        title: >-
          The SigningService class shall let a slot that has never been signed be changed or removed, shall take the
          ballot of a removed slot out of the record together with the slot, shall refuse to change or remove a slot
          that has any signature, current or out of date, and shall reject a slot that does not exist in the review.
        justification: |
          A signature must always point to a slot that still says who the signer was. Allowing a signed slot to be
          reassigned or removed would let the record claim that someone else approved. The ballot belongs to its slot,
          so it leaves with it.
        tests:
          - SigningService_UpdateAndRemoveSlotAsync_Unsigned_Succeed
          - SigningService_UpdateAndRemoveSlotAsync_Signed_ThrowsSlotSigned
          - SigningService_UpdateAndRemoveSlotAsync_UnknownSlot_ThrowsSlotNotFound
          - SigningService_RemoveSlotAsync_SubmittedBallotChangesDigest_RequiresAcknowledgement

      - id: ReviewCenter-SigningService-Actor
        title: >-
          The SigningService class shall allow a slot to be added, changed, removed, or signed, and a review to be
          reopened, only for a signed-in user that still exists and is enabled, shall refuse every one of them for a
          project that does not exist or that the actor may not see with the ProjectNotFound rule, shall let any actor
          who may see the project, a member or a system administrator who is not a member, add, change, and remove
          slots, shall allow a slot to be signed only by its primary reviewer or its alternate who is still a member of
          the project, and shall refuse a system administrator who is not a member the right to sign.
        justification: |
          The page shows who is signed in, but the rules must hold even if the page or a browser session is out of
          date. A user who has been disabled or removed from the project since signing in must not be able to
          change or approve a review, and a signature is only meaningful when the signer is the person the slot
          names and belongs to the project. Arranging the slots needs no membership, so that a system administrator
          can set up a review, because only a member can be named in a slot and only a member can sign, which keeps
          the signatures with the members.
        tests:
          - SigningService_AddSlotAsync_ActorDisabledOrUnknown_ThrowsActorNotAllowed
          - SigningService_UpdateRemoveAndReopen_ActorDisabledOrUnknown_ThrowsActorNotAllowed
          - SigningService_SlotSignAndReopenCalls_ProjectNotFound_ThrowsProjectNotFound
          - SigningService_SlotChanges_RealAccessRules_NeedViewAccessOnly
          - SigningService_SignAsync_ActorDisabled_ThrowsActorNotAllowed
          - SigningService_SignAsync_NotInSlot_ThrowsActorNotAllowed
          - SigningService_SignAsync_NotAMember_IsRefused

      - id: ReviewCenter-SigningService-AuditorNotReviewer
        title: >-
          The SigningService class shall not offer a member whose role is Auditor as a candidate for a reviewer slot,
          shall refuse to name an Auditor as the primary or the alternate reviewer of a slot with the slot-user-invalid
          rule, and shall refuse to let an Auditor sign, even when a slot still names the Auditor, with the
          actor-not-allowed rule, and shall store nothing in each case.
        justification: |
          An auditor reads and changes nothing. Naming an auditor in a slot would make a review wait for somebody who
          may not sign, and a signature of an auditor would break the rule that only those who work in a project
          approve what it reviews.
        tests:
          - SigningService_Slots_Auditor_IsNeitherCandidateNorAssignable
          - SigningService_SignAsync_AuditorStillNamedInASlot_IsRefused

      - id: ReviewCenter-SigningService-Blockers
        title: >-
          The SigningService class shall refuse to sign a review while a check in a section that applies is
          unanswered or disputed in the consolidated ballots, a thread is open (chat or included in the report), or
          the review concludes as Rejected without a conclusion text, shall list each of these as a blocker, and shall
          not treat a check answered Fail as a blocker, in a section that applies or not.
        justification: |
          A signature records the outcome that the signer reached about the record, and the record covers the
          consolidation of the submitted ballots. That is not possible while checks are unanswered or disputed, or a
          discussion is still open, and a rejection that states no reasons is of no use to the author. A failed check
          is a finding, and the outcome that follows from it is a rejection, not a refusal to sign.
        tests:
          - SigningService_SignAsync_Blocker_ThrowsSigningNotAllowedAndListsBlocker
          - SigningService_GetApprovalAsync_NotApplicableSectionFail_DoesNotBlock
          - SigningService_GetApprovalAsync_MissingChecklist_FlagMatchesTheBlockerSentence
          - SigningService_SignAsync_OpenChatThread_ThrowsSigningNotAllowed
          - SigningService_SignAsync_RejectedNoTextAndOpenThread_ThrowsSigningNotAllowedListingBoth

      - id: ReviewCenter-SigningService-Sign
        title: >-
          The SigningService class shall store a signature for a primary reviewer or an alternate of a slot that
          records the slot, the user, the display name at that time, the role, the time, the digest of the record (which
          covers the consolidation of the submitted ballots), the agreed outcome (Approved, or Rejected when the
          ballots agree on at least one Fail), and the fixed meaning text of that outcome, and shall never change or
          remove a signature that has been stored.
        justification: |
          The signature is the evidence of who approved or rejected which record and when. The meaning text says what
          the signer stated, so an approval and a rejection can never be mistaken for each other. Keeping every
          signature unchanged means the history of signatures stays reliable after the record changes and is signed
          again.
        tests:
          - SigningService_SignAsync_PrimaryWithPassword_StoresSignatureAndApproves
          - SigningService_SignAsync_Approved_StoresApprovedSignature
          - SigningService_SignAsync_RejectedWithText_StoresRejectedSignature
          - SigningService_SignAsync_Alternate_RecordsAlternateRole
          - SigningService_SignAsync_RecordChangedAfterSigning_OutOfDateThenResignable
          - SigningService_GetApprovalAsync_ContentChangedAfterSigning_OutOfDateThenResignable

      - id: ReviewCenter-SigningService-Reauthenticate
        title: >-
          The SigningService class shall store a signature only after the signer has given the password of the
          account again, shall ask for the password only after every other check has passed, so that a refusal for
          another reason does not count as a wrong password, shall report a wrong password and a locked account in the
          same way, and shall count wrong passwords toward the same lockout as signing in.
        justification: |
          A signature must come from the person, not from a session left open at a desk. Reusing the sign-in
          check gives the same protection against guessing, and one generic answer gives an attacker nothing more
          than the login page does. Checking the password last means a signer who is told that the record changed or
          that a thread is open is not locked out for the password typed with the request.
        tests:
          - SigningService_SignAsync_WrongPassword_ThrowsReauthenticationFailed
          - SigningService_SignAsync_RepeatedWrongPassword_LocksOutLikeLogin
          - SigningService_SignAsync_RefusedBeforePassword_DoesNotCountWrongPasswords

      - id: ReviewCenter-SigningService-ReauthAudit
        title: >-
          The SigningService class shall have the failures of the password check of a signature (wrong password,
          locked account) recorded in the audit trail as failed re-authentications, without the password, using the
          re-authentication check of the UserService.
        justification: |
          Guessing the password at signing time must be visible in the history, apart from failed sign-ins, so that
          the history shows where the attempt was made.
        tests:
          - SigningService_SignAsync_WrongPasswordThenLocked_RecordsReauthFailedEntriesWithoutPassword

      - id: ReviewCenter-SigningService-Current
        title: >-
          The SigningService class shall store a signature only for the digest of the record that the signer
          saw, and shall refuse with a message that the record changed when the record is not that one any more,
          and shall refuse to sign a slot that already has a signature for the current record.
        justification: |
          A reviewer who signs a page that is out of date would approve content they have not seen. Signing what
          was seen keeps the signature honest, and a second signature for the same record would add nothing.
        tests:
          - SigningService_SignAsync_StaleExpectedDigest_ThrowsRecordChanged
          - SigningService_SignAsync_AlreadySignedCurrent_ThrowsSigningNotAllowed

      - id: ReviewCenter-SigningService-Status
        title: >-
          The SigningService class shall give for a review the digest of its record, for each slot whether it is
          not signed, signed with a current signature (naming the signer and time), or out of date because it was
          signed only for an earlier record, whether the review is approved or concluded (see the Concluded
          requirement), the
          blockers, and one sentence naming the next step, and shall give nothing for a review that does not exist.
          The status shall also say for the primary and for the alternate reviewer of each slot whether that user is
          still a member of the project, and shall keep the slot assigned to a user who has been removed from the
          project.
        justification: |
          Approval has to follow the record. Computing it from the signatures and the record each time means a
          change to the record can never leave a review looking approved, and nothing about the status can be
          stored out of step with the record. A reviewer who was removed from the project cannot sign, so the
          people who arrange the review must be able to see that a slot needs another reviewer, while the history of
          the slot stays intact.
        tests:
          - SigningService_GetApprovalAsync_TwoSlots_ApprovedOnlyWhenBothSigned
          - SigningService_SignAsync_RecordChangedAfterSigning_OutOfDateThenResignable
          - SigningService_GetApprovalAsync_ContentChangedAfterSigning_OutOfDateThenResignable
          - SigningService_GetApprovalAsync_NoSlots_NotApprovedAndAsksForSlot
          - SigningService_GetApprovalAsync_MissingReview_ReturnsNull
          - SigningService_GetApprovalAsync_AssigneeRemovedFromProject_IsMarkedNotAMember
          - SigningService_GetApprovalsAsync_SeveralReviews_EqualsSingleReadsAndLoadsUsersOnce
          - SigningService_GetApprovalsAsync_SeveralReviews_UsesOneStoreBatchAndNoSingleSnapshots
          - SigningService_GetApprovalsAsync_NoReviews_ReturnsEmptyWithoutReadingUsers
          - SigningService_GetApprovalAsync_OpenThreadAllSigned_IsNotApprovedAndCountsOpenThread

      - id: ReviewCenter-SigningService-Audit
        title: >-
          The SigningService class shall record adding, changing, and removing a slot and adding a signature in the
          audit trail, together with the change, so that a change is never saved without its entry and an entry is never
          saved without its change, naming the actor, the slot (by its number on the review page, counted from 1, not
          by its database identifier), the reviewers, and for a signature the role, the outcome, and the
          record digest, and shall record nothing for a change that is refused.
        justification: |
          The approval of a review is the most important event of its history, and the history must show who
          arranged the reviewers and who signed which record. The slot number is the one the reader sees on the page.
        tests:
          - SigningService_SlotAndSignatureEvents_AreRecordedWithMembersAndDigest
          - SigningService_SlotEvents_AfterEarlierSlotRemoved_UsePageNumberNotIdentity
          - SigningService_RemoveSlotAsync_RecordsSlotRemovedWithItsMembers

      - id: ReviewCenter-SigningService-ApiToken
        title: >-
          The SigningService class shall refuse to sign, and to add, change, or remove a reviewer slot, for an actor
          that came through a personal access token, with the ActorNotAllowed rule and a message that names the API
          token, before it checks anything else, and without counting a password or recording an audit entry.
        justification: |
          A signature must prove that the person was present and knew their password, which a token held by a script
          does not. Refusing in the service, not only in the routes, keeps a later route or page from giving a token
          the power to sign.
        tests:
          - SigningService_SignAsync_ApiTokenActor_IsRefusedBeforeAnyCheck
          - SigningService_AddUpdateRemoveSlot_ApiTokenActor_IsRefused

      - id: ReviewCenter-SigningService-ExternalReauth
        title: >-
          The SigningService class shall let a user of a provider sign a slot only when a confirmation of identity that
          was issued for this user, project, review, and slot is still valid, shall use that confirmation up only after
          every other check has passed, shall keep it when the signature is refused before for another reason, shall
          refuse the signature, record it as a failed confirmation (a failed re-authentication in the audit trail with
          the detail oidc: no-proof, without any secret), and sign nothing when there is none, and shall let
          the page ask whether a confirmation exists without using it up.
        justification: |
          A user of a provider has no password to type, so the confirmation that the person just signed in again takes
          its place, and it must be as hard to reuse as a password that has to be typed for every signature. Keeping
          it when a signature is refused for another reason lets the person correct the cause and sign. The page needs
          to know whether to offer the signature or the confirmation without spending it.
        tests:
          - SigningService_SignAsync_ExternalUserWithProof_SignsOnce
          - SigningService_SignAsync_ExternalUserWithoutLiveProof_IsRefused
          - SigningService_SignAsync_ProofOfOtherBinding_IsRefused
          - SigningService_SignAsync_ExternalUserWithoutProofStore_IsRefused
          - SigningService_SignAsync_ApiTokenActorWithProof_IsRefusedAndKeepsProof
          - SigningService_SignAsync_RecordChanged_KeepsTheProof
          - SigningService_HasReauthProofAsync_AnswersWithoutSpending
          - SigningService_RequireConfirmableAsync_AcceptsOnlyAReviewerOfTheSlot
          - SigningService_RequireConfirmableAsync_NotAReviewerOfTheSlot_IsRefused

      - id: ReviewCenter-SigningService-TotpReauth
        title: >-
          The SigningService class shall require, for a signer with a second factor, a fresh code of the authenticator
          app in addition to the password, check the password first and keep the code when the password is wrong,
          refuse a recovery code and a code that was already used in the current step with the same message as a wrong
          password, refuse an actor that came through an API token with the ActorNotAllowed rule and the API token
          message (see the ApiToken requirement) and keep the code, count wrong codes toward the lockout and record
          them in the audit trail, fail closed when the second factor cannot be checked, and need no code for a user
          without a second factor, for a user of a provider, or after an administrator reset.
        justification: |
          A signature is the strongest statement in the product and the person must prove that they are there. A code
          that was used to sign in cannot be used again, so the person waits for the next one, which is the cost of
          the replay protection. A recovery code must not sign, as it is for getting back in.
        tests:
          - SigningService_SignAsync_EnrolledUserWithPasswordAndFreshCode_Signs
          - SigningService_SignAsync_EnrolledUserWithoutRightCode_IsRefused
          - SigningService_SignAsync_WrongPasswordRightCode_IsRefusedAndKeepsTheCode
          - SigningService_SignAsync_WrongCodes_LockTheAccountForSigningAndSignIn
          - SigningService_SignAsync_EnrolledUserWithoutTotpService_FailsClosed
          - SigningService_SignAsync_UserWithoutSecondFactor_NeedsNoCode
          - SigningService_SignAsync_ExternalUser_IsNotAffectedByTheSecondFactor
          - SigningService_SignAsync_ApiTokenActorWithPasswordAndCode_IsRefusedAndKeepsTheCode
          - SigningService_SignAsync_AfterAdministratorReset_NeedsNoCode

      - id: ReviewCenter-SigningService-ApprovalLock
        title: >-
          The SigningService class shall treat a review that is concluded, as Approved or as Rejected (every slot, at
          least one, has a signature of the current record with the same outcome, and no thread is open; see the
          Concluded requirement for the ballots) as locked,
          shall refuse to add, change, or remove a slot and
          shall refuse to sign while the review is locked, with the ReviewLocked rule and a message that says the
          review is concluded and has to be reopened first, and shall compute the lock from the signatures, the
          threads, and the record each time and not store it.
        justification: |
          A signature approves the review as it was. If the content, the checklist, or the people who have to sign
          could still change after the approval, the approval would describe something other than what is on record.
          Computing the lock from the current record means it can never be out of step with the signatures, and a
          reviewer who tries to sign again is told the reason instead of a message about an earlier signature.
        tests:
          - SigningService_AddUpdateRemoveSlotAsync_ApprovedReview_ThrowsReviewLocked
          - SigningService_SignAsync_ApprovedReview_ThrowsReviewLocked
          - ReviewLock_IsConcluded_AllSignedNoThreads_IsTrue
          - ReviewLock_IsConcluded_AllSignedAllResolved_IsTrue

      - id: ReviewCenter-SigningService-Reopen
        title: >-
          The SigningService class shall let only an administrator of the project or a system administrator reopen a
          locked (concluded) review, never an actor that came through a personal access token, shall require a reason
          of one to 250 characters after trimming, shall refuse a review that is not locked, including one whose
          slots are all signed but that still has an open thread, with the ReviewNotLocked rule, shall
          store the reopening with the user, the time, the reason, and the digest of the approved record, shall record
          it in the audit trail as review.reopened, in the same transaction as the change, with the reason and the
          digest, shall keep every earlier signature as history that is out of date, and shall need fresh signatures
          from every slot before the review is approved again. The ballots of the slots shall stay as they are, so a
          submitted ballot stays submitted, and the reopen count of the record, which the digest covers, shall make
          every earlier signature out of date even though the ballots still say what they said.
        justification: |
          Leaving the lock has to be a deliberate and accountable act that an ordinary reviewer or a script cannot
          perform. The reason and the digest in the history show who reopened which approval and why, and keeping the
          earlier signatures, which are out of date from then on, means the approval history stays complete while no
          old signature can approve the changed record, not even when the content is changed back.
        tests:
          - SigningService_ReopenReviewAsync_NotAdmin_ThrowsActorNotAllowed
          - SigningService_ReopenReviewAsync_InvalidReason_ThrowsReopenReasonInvalid
          - SigningService_ReopenReviewAsync_NotLocked_ThrowsReviewNotLocked
          - SigningService_ReopenReviewAsync_ApiToken_ThrowsActorNotAllowed
          - SigningService_ReopenReviewAsync_Admin_ReturnsToInReviewKeepsSignaturesAndAudits
          - SigningService_ReopenReviewAsync_MissingReview_ThrowsReviewNotFound
          - SigningService_ReopenReviewAsync_ReasonAtLimitWithBlanks_IsAcceptedTrimmed
          - SigningService_ReopenReviewAsync_RealAccessRules_ReopensOnlyForAdministrators
          - SigningService_ReopenReviewAsync_ThenResign_ApprovesAgainWithBothSignatures
          - SigningService_ReopenReviewAsync_AllSignedButThreadOpen_ThrowsReviewNotLocked
          - SigningService_ReopenReviewAsync_BallotsStaySubmitted
          - SigningService_ReopenReviewAsync_Rejected_ReopensTheReview

      - id: ReviewCenter-SigningService-OpenThreadRule
        title: >-
          The SigningService class shall treat a review as concluded only when every slot, at least one, has a
          signature of the current record and every thread is resolved (besides the ballot rules of the Concluded
          requirement), so that a review whose slots are all signed
          but that still has an open thread, chat or included, is not concluded, not locked, and not approved, shall
          refuse a signature while a thread is open with the SigningNotAllowed rule, as a rule separate from the
          comparison of the digest, shall keep the signatures that exist valid when a chat thread is started after
          them, and shall conclude the review, without any further audit entry, when the last open thread is
          resolved.
        justification: |
          What a signature approves is the report, and chat is not part of it, but an unanswered question is not a
          finished review. Keeping the open-thread rule apart from the digest lets chat stay free of consequences for
          existing signatures while no review is concluded with a discussion still waiting for an answer.
        tests:
          - ReviewLock_IsConcluded_AllSignedNoThreads_IsTrue
          - ReviewLock_IsConcluded_AllSignedOpenChatThread_IsFalse
          - ReviewLock_IsConcluded_AllSignedAllResolved_IsTrue
          - ReviewLock_IsConcluded_NoSlots_IsFalse
          - ReviewLock_IsConcluded_OneSlotUnsigned_IsFalse
          - ReviewLock_IsConcluded_ParityWithInboxRules_ForAllStateCombinations
          - SigningService_SignAsync_OpenChatThread_ThrowsSigningNotAllowed
          - SigningService_RemoveSlotAsync_LastUnsignedSlotWithOpenThread_AllSignedButNotConcluded
          - SigningService_ResolveLastThreadAfterSlotRemoval_ConcludesReview
          - SigningService_ChatThreadAfterPartialSigning_KeepsSignaturesValidAndBlocksOthers
          - SigningService_GetApprovalAsync_OpenThreadAllSigned_IsNotApprovedAndCountsOpenThread

      - id: ReviewCenter-SigningService-OpenCheckThread
        title: >-
          The SigningService class shall treat an open thread about a check like any other open thread: it shall
          refuse a signature with the SigningNotAllowed rule while one is open, shall not conclude a review, or
          call it approved, while one is open, and shall allow the signature and the conclusion once it is
          resolved.
        justification: |
          A question about a check is as unanswered as a question about a file, and a review must not be concluded
          while a discussion still waits for an answer, wherever it is anchored.
        tests:
          - SigningService_SignAsync_OpenCheckThread_IsRefused
          - SigningService_SignAsync_ResolvedCheckThread_IsAllowed
          - SigningService_GetApprovalAsync_OpenCheckThread_BlocksConclusion

      - id: ReviewCenter-SigningService-IndependentReviewers
        title: >-
          The SigningService class shall, when the project requires independent reviewers, refuse with the
          ReviewerNotIndependent rule to put the user who created the review into a slot as primary reviewer or as
          alternate, when a slot is added or changed, and shall refuse the signature of that user at the time of
          signing, also for a slot that was filled before the setting was switched on, and shall enforce nothing when
          the project does not require independent reviewers.
        justification: |
          A review is worth little when the person who made it also approves it. Checking at the assignment gives
          early feedback, and checking again at signing closes the gap for slots that were filled while the setting
          was off. The author is the user of Review Center who created the review, because the tool knows nothing
          about the authors of the commits, which is stated to the users. A project in which one person has to do
          both may switch the rule off.
        tests:
          - SigningService_AddSlotAsync_AuthorAsPrimaryOrAlternate_ThrowsReviewerNotIndependent
          - SigningService_UpdateSlotAsync_AuthorAsPrimaryOrAlternate_ThrowsReviewerNotIndependent
          - SigningService_AddSlotAsync_AuthorAndIndependenceOff_Succeeds
          - SigningService_SignAsync_AuthorInPreexistingSlot_ThrowsReviewerNotIndependent

      - id: ReviewCenter-SigningService-ReopenerRule
        title: >-
          The SigningService class shall, when the project requires that the person who reopened a review does not
          sign it again, refuse the signature of a user who reopened the review at any time before, with the
          ReopenerCannotSign rule, after the independence check and before the password is checked, so that no failed
          attempt is counted or recorded, and shall enforce nothing when the project switched the rule off.
        justification: |
          A reopening followed by a signature of the same person would turn the reopening into a re-stamp: the approval
          that was withdrawn is approved again by the one who withdrew it. Checking before the password means that the
          refusal is a rule and not a failed login. The rule is on by default and applies to every project, also those
          created before it was enforced; an administrator can switch it off per project.
        tests:
          - SigningService_SignAsync_ReopenerWhileRuleIsOn_ThrowsReopenerCannotSignBeforePassword
          - SigningService_SignAsync_EarlierReopener_StaysBlocked
          - SigningService_SignAsync_ReopenerWhileRuleIsOff_Signs

      - id: ReviewCenter-SigningService-StrandedSlot
        title: >-
          The SigningService class shall, when the project requires that the person who reopened a review does not
          sign it again, refuse a reopening with the ReopenWouldStrandSlot rule that names the slots, when after it a
          slot of the review would have nobody who may sign it, counting the primary reviewer and the alternate of every
          slot and treating the user who reopens and every user who reopened the review before as unable to sign, before
          anything is stored, and shall reopen when the rule is switched off or every slot keeps somebody.
        justification: |
          Without this check an administrator who is the only person of a slot could reopen a review that nobody could
          approve again. The pure function that decides which slots would be stranded is separate from the service, so
          that the rule can be tested without a store. Occupants that are disabled or no longer members are not
          considered; the message points to another administrator or to switching the rule off.
        tests:
          - ReopenRules_StrandedSlots_PrimaryAndAlternate_StrandsOnlyWhenNobodyIsFree
          - ReopenRules_StrandedSlots_UnorderedSlotsAndNoBlockedUsers_NumbersByIdentity
          - ReopenRules_StrandedSlots_NullArguments_Throw
          - ReopenRules_StrandedMessage_OneOrMoreSlots_NamesThem
          - ReopenRules_StrandedMessage_NullOrEmpty_Throws
          - SigningService_ReopenReviewAsync_WouldStrandSlot_ThrowsAndRecordsNothing
          - SigningService_ReopenReviewAsync_EarlierReopenerCounts_ThrowsForTheLastFreePerson
          - SigningService_ReopenReviewAsync_WouldStrandSlotWhileRuleIsOff_Reopens

      - id: ReviewCenter-SigningService-CarriedRecord
        title: >-
          The SigningService class shall treat the answers that a follow-up review carried from an earlier review as
          answered checks, so that they do not block approval (they are the consolidated answers of the earlier
          review and seed draft ballots only, never submitted ones), and the open threads that it carried as open
          threads, so that they block approval with the same message as any open thread, and shall still treat the
          user who created the follow-up as its author for the rule of independent reviewers, whoever answered the
          carried checks.
        justification: |
          A carried answer was given by a reviewer, so it is a real answer, but an open thread is an unresolved
          finding and must be resolved before approval wherever it was started. The rule of independence concerns the
          creation of the review, and carrying work over does not change who created it.
        tests:
          - ReviewService_FollowUp_CarriedOpenThreadBlocksSigning_CarriedAnswersDoNot
          - ReviewService_FollowUp_CreatorStaysTheAuthorForIndependence

      - id: ReviewCenter-SigningService-SignatureImpact
        title: >-
          The SigningService unit shall compute, from the record of a review and the record that a change would
          produce, which current signatures the change would make out of date, shall number each affected slot in the
          order of the slots and name its signer, and shall refuse the change with the SignaturesWouldBecomeOutOfDate
          rule, before anything is stored, unless the caller has acknowledged every affected slot, with a change that
          leaves the digest of the record as it is (chat, for example, or a draft ballot that leaves the consolidated
          standing alone), or a review without a current signature, needing no acknowledgement, and shall leave the
          signature of the slot of the person who changes the own ballot out of the list when the caller excludes it.
        justification: |
          Whether a signature stays valid is decided by the digest of the record, so comparing the digest before and
          after the change finds the affected signatures exactly, without a trial write. Naming the slot number and
          the signer lets a person see whose approval they are about to withdraw.
        tests:
          - ChecklistService_SetAnswerAsync_PrimaryAndAlternateSigners_NamesSlotNumbersAndSigners
          - ChecklistService_SetAnswerAsync_PartialAcknowledgement_ThrowsWithRemainingSlots
          - ChecklistService_Changes_NoSignatureOrNoOp_DoNotThrow
          - ThreadService_StartThreadAsync_IncludedAndSigned_NeedsAcknowledgement
          - ThreadService_StartThreadAsync_ChatAfterSignature_NeedsNoAcknowledgementAndKeepsSignature
          - SigningService_GetApprovalAsync_ContentChangedAfterSigning_OutOfDateThenResignable
          - SignatureImpact_RequireAcknowledged_DifferingBallot_ListsTheOtherSlot
          - SignatureImpact_RequireAcknowledged_OwnSlotExcluded_NeedsNoAcknowledgement
          - SignatureImpact_RequireAcknowledged_SameStanding_NoWarning

      - id: ReviewCenter-SigningService-ProgressCounts
        title: >-
          The SigningService class shall return with the approval status of a review, besides the sentences that say
          what blocks the approval, the number of open threads, of unanswered checks, of checks answered Fail (for
          information only, as a Fail does not block), and of
          checks on which the submitted ballots disagree, calculated in the same step as the sentences so that each
          count equals the number it states, and shall return for each person of a slot whether the account is
          enabled.
        justification: |
          The project overview and any later list of work need the numbers and not the text. Taking them from the
          step that writes the sentences means the two cannot disagree, and no second rule for what blocks a review
          can drift from the first. A slot whose person cannot sign any more has to be recognizable.
        tests:
          - SigningService_GetApprovalAsync_BlockerCounts_EqualTheBlockerSentences
          - SigningService_SignAsync_Disputed_BlocksSigning

      - id: ReviewCenter-SigningService-OwnBallotSubmitted
        title: >-
          The SigningService class shall refuse a signature of a slot whose own ballot has not been handed in
          (submitted) with the BallotNotSubmitted rule and store nothing, after the comparison of the digest and the
          check for an earlier signature and before the blockers, except that in a review with a single slot, where a
          draft ballot counts for the progress and the blockers, the blockers are named first.
        justification: |
          The digest covers only the submitted ballots, so it cannot say whether the signer finished the own answers.
          A signature that binds to the answers of the others while the own ballot is still a draft would approve a
          standing the signer has not given.
        tests:
          - SigningService_SignAsync_OwnBallotDraft_ThrowsBallotNotSubmitted

      - id: ReviewCenter-SigningService-EarlySigning
        title: >-
          The SigningService class shall let a slot sign as soon as its own ballot is submitted and nothing blocks the
          review, without waiting for the ballots of the other slots, and shall make that signature out of date,
          through the digest of the record, when a later ballot changes the consolidated standing, for example by a
          disagreement.
        justification: |
          A reviewer who has finished should not have to wait for the others. What the signature approves is the
          consolidated standing, so it stays valid while that standing is the same and ends when another reviewer's
          ballot disagrees, as the digest rule always decides.
        tests:
          - SigningService_SignAsync_EarlySign_OtherSlotNotSubmitted_Succeeds
          - SigningService_SignAsync_OtherSlotDisputes_SignatureOutOfDate

      - id: ReviewCenter-SigningService-DisputedBlocker
        title: >-
          The SigningService class shall refuse to sign a review while the submitted ballots disagree on a check, with
          the SigningNotAllowed rule and a message that names the number of checks disputed between the ballots, shall
          list that number as a blocker, and shall return it as the count of disputed checks of the approval status.
        justification: |
          A signature approves one standing of the checklist. While reviewers disagree there is no such standing, so
          nobody can sign until the ballots are settled.
        tests:
          - SigningService_SignAsync_Disputed_BlocksSigning

      - id: ReviewCenter-SigningService-SlotBallotImpact
        title: >-
          The SigningService class shall require the acknowledgement of the other signed slots, with the
          SignaturesWouldBecomeOutOfDate rule and before anything is stored, when removing a slot, or changing the
          reviewers of a slot so that a reviewer leaves it, would change the consolidated standing, and so the digest,
          because the ballot of the slot leaves the record, or reverts to a draft without the rows of the departed
          reviewer, and shall not ask for it when the standing, and so the digest, stays as it is.
        justification: |
          The ballot of a slot is part of what the other signatures cover. Removing a slot whose submitted ballot
          disagreed, for example, makes the others agree and so changes the digest; the person who does it has to see
          whose signature this withdraws. A departing reviewer takes the own rows with them, which can do the same. A
          change that leaves the standing as it is withdraws nothing, so it needs no confirmation.
        tests:
          - SigningService_RemoveSlotAsync_SubmittedBallotChangesDigest_RequiresAcknowledgement
          - SigningService_UpdateSlotAsync_DepartingSubmittedBallotChangesDigest_RequiresAcknowledgement
          - SigningService_UpdateSlotAsync_DepartingBallotKeepsDigest_NoAcknowledgement

      - id: ReviewCenter-SigningService-Concluded
        title: >-
          The SigningService class shall treat a review as concluded, and locked, only when every slot has a submitted
          ballot, no check is pending or disputed in the consolidation, every slot has a signature of the current
          digest with the same outcome (Approved, or Rejected with a conclusion text), and no thread is open, shall
          treat it as approved only when that outcome is Approved, shall take the one definition of this from
          ReviewLock, and shall word the next step of a review that has blockers
          as the hint for them, also when the review has no slot (for example that checks are unanswered).
        justification: |
          A review is concluded only when every reviewer has handed in a ballot, they agree, and each has signed that
          standing, whether the agreed outcome is approval or rejection. Using one definition keeps the status, the
          locks, and the store from disagreeing about what is concluded. A review with no slot has no one who can
          answer its checks, so the open checks are the honest next step.
        tests:
          - SigningService_GetApprovalAsync_AllSubmittedAgreedSigned_Approved
          - ReviewLock_IsConcluded_UnsubmittedBallot_False
          - ReviewLock_IsConcluded_Disputed_False
          - ReviewLock_IsConcluded_AllSubmittedAgreedSigned_True
          - ReviewLock_IsConcluded_AgreedBallotsOneSlotUnsigned_False
          - ReviewLock_IsConcluded_AgreedSignedBallotsOpenThread_False
          - ReviewLock_IsConcluded_RejectedAllSignedWithText_True
          - ReviewLock_IsConcluded_RejectedNoText_False
          - ReviewLock_IsConcluded_RejectedSignedForApproval_False
          - ReviewLock_IsConcluded_RejectedOneSlotUnsigned_False
          - ReviewLock_ConcludedOutcome_AllSubmittedAgreedSigned_Approved
          - ReviewLock_ConcludedOutcome_Disputed_None
          - SigningService_GetApprovalAsync_RejectedAllSigned_ConcludedAndNotApproved
          - SigningService_GetApprovalAsync_ApprovalSignedThenRejectionAgreed_SignatureOutOfDate
          - SigningService_NextStep_NoSlots_PointsToTheUnansweredChecks

      - id: ReviewCenter-SigningService-RejectedOutcome
        title: >-
          The SigningService class shall record on each signature the outcome that the signer signed, Rejected when the
          submitted ballots agree on at least one Fail and Approved otherwise, shall require a conclusion text that is
          not blank before a Rejected outcome is signed, refusing with the ConclusionRequired rule and the message
          "A rejected review needs a conclusion stating the reasons." when that is the only blocker and otherwise with
          the SigningNotAllowed rule that lists every blocker, shall lock a review that is concluded as Rejected and
          let an administrator reopen it as any concluded review, and shall write the outcome into the audit entry of
          the signature.
        justification: |
          A review whose checklist has a failed check is a finished review when the reviewers agree that the work is
          not acceptable. Recording the outcome on the signature, together with the meaning text of that outcome, lets
          the history tell an approval from a rejection. A rejection without stated reasons gives the author nothing to
          act on, so the conclusion is required. Locking and reopening work as for an approval so that a rejected
          record cannot be changed unnoticed.
        tests:
          - SigningService_SignAsync_RejectedWithText_StoresRejectedSignature
          - SigningService_SignAsync_RejectedNoText_ThrowsConclusionRequired
          - SigningService_SignAsync_RejectedBlankText_ThrowsConclusionRequired
          - SigningService_SignAsync_RejectedNoTextAndOpenThread_ThrowsSigningNotAllowedListingBoth
          - SigningService_GetApprovalAsync_ApprovalSignedThenRejectionAgreed_SignatureOutOfDate
          - SigningService_ReopenReviewAsync_Rejected_ReopensTheReview
          - SigningService_SlotAndSignatureEvents_AreRecordedWithMembersAndDigest
          - ReviewLock_IsConcluded_RejectedAllSignedWithText_True
