---
# Software Unit Requirements for the ReviewService Class
#
# The ReviewService class creates draft reviews from uploaded files, enforces the review and upload rules,
# and reads reviews back.

sections:
  - title: ReviewService Unit Requirements
    requirements:
      - id: ReviewCenter-ReviewService-Draft
        title: >-
          The ReviewService class shall create a review in the Draft state with the creation time and the title
          without surrounding white space, and shall keep every uploaded file byte for byte together with its
          size and SHA-256 hash.
        justification: |
          A review is a snapshot of the submitted files. Binary content, Windows line endings, and empty files
          are valid review content and must come back exactly as they went in.
        tests:
          - ReviewService_CreateDraftAsync_ValidInput_StoresDraftWithFingerprint
          - ReviewService_CreateDraftAsync_BinaryAndCrLfContent_KeepsBytesVerbatim

      - id: ReviewCenter-ReviewService-Fingerprint
        title: >-
          The ReviewService class shall set the content fingerprint of a review to the fingerprint of the
          contents of its files, regardless of their names and order.
        justification: |
          The fingerprint identifies the content under review. The same files submitted under other names or in
          another order are the same content and must give the same fingerprint.
        tests:
          - ReviewService_CreateDraftAsync_ValidInput_StoresDraftWithFingerprint
          - ReviewService_CreateDraftAsync_SameBytesDifferentPathsAndOrder_GivesSameFingerprint

      - id: ReviewCenter-ReviewService-Id
        title: >-
          The ReviewService class shall accept a review identifier only when it has 1 to 100 characters, starts
          with an ASCII letter or digit, and otherwise contains only ASCII letters, digits, dots, underscores,
          and hyphens, and shall refuse an identifier already used by another review of the same project while
          allowing the same identifier in a different project.
        justification: |
          The identifier appears in page addresses and later in reports, so it must be short, stable, and safe
          to use in a URL. Uniqueness is per project, because each project keeps its own numbering.
        tests:
          - ReviewService_CreateDraftAsync_InvalidId_ThrowsReviewIdInvalid
          - ReviewService_CreateDraftAsync_IdLength_LimitIsInclusive
          - ReviewService_CreateDraftAsync_DuplicateIdInSameProject_ThrowsReviewIdDuplicate
          - ReviewService_CreateDraftAsync_SameIdInOtherProject_IsAllowed

      - id: ReviewCenter-ReviewService-Title
        title: >-
          The ReviewService class shall reject a review whose title is blank or longer than 200 characters.
        justification: |
          A title is how people recognize a review in lists, so it must exist and must stay displayable.
        tests:
          - ReviewService_CreateDraftAsync_BlankTitle_ThrowsReviewTitleInvalid
          - ReviewService_CreateDraftAsync_TitleTooLong_ThrowsReviewTitleInvalid

      - id: ReviewCenter-ReviewService-Project
        title: >-
          The ReviewService class shall reject a review for a project that does not exist or that the actor may not
          see, with the same refusal (ProjectNotFound) in both cases, before anything else is checked or stored.
        justification: |
          A review that belongs to no project could never be found again and would break the project hierarchy.
          A project that a user may not see must not be told apart from a missing one, so creating a review in it
          reveals nothing.
        tests:
          - ReviewService_CreateDraftAsync_UnknownProject_ThrowsProjectNotFound
          - ReviewService_CreateFromRepositoryAsync_DuplicateIdOrUnknownProject_RefusedBeforeOpening

      - id: ReviewCenter-ReviewService-Files
        title: >-
          The ReviewService class shall reject a review that has no files, a file path that is blank or longer
          than 400 characters, or two files with the same path, comparing paths exactly so that paths differing
          only in letter case are different.
        justification: |
          A review without files has nothing to review. A path must be present to identify a file, and two files
          under one path would be ambiguous. Paths on some systems are case-sensitive, so they are compared
          exactly.
        tests:
          - ReviewService_CreateDraftAsync_NoFiles_ThrowsNoFiles
          - ReviewService_CreateDraftAsync_DuplicatePaths_ThrowsDuplicatePath
          - ReviewService_CreateDraftAsync_PathsDifferingInCase_AreDistinct
          - ReviewService_CreateDraftAsync_BlankPath_ThrowsPathInvalid
          - ReviewService_CreateDraftAsync_PathTooLong_ThrowsPathInvalid

      - id: ReviewCenter-ReviewService-Limits
        title: >-
          The ReviewService class shall reject a review with a file larger than 2 MiB, more than 200 files, or
          more than 20 MiB of file content in total, accepting the limit values themselves.
        justification: |
          Review content is stored in the database and held in memory while it is saved, so it must be bounded
          to keep the service responsive and the database a reasonable size.
        tests:
          - ReviewService_CreateDraftAsync_FileSize_LimitIsInclusive
          - ReviewService_CreateDraftAsync_TooManyFiles_ThrowsTooManyFiles
          - ReviewService_CreateDraftAsync_TotalTooLarge_ThrowsTotalSizeExceeded

      - id: ReviewCenter-ReviewService-Read
        title: >-
          The ReviewService class shall return a review of a project with its file list, list the reviews of a
          project, and return the content of one file of a review, or nothing when the review or the file does
          not exist.
        justification: |
          Pages show a review and its files without loading all file content, and load the content of one file
          only when a reviewer asks for it. A stored link to a review or file that is gone must lead to a clear
          answer rather than to a failure.
        tests:
          - ReviewService_GetAsync_CreatedReview_ReturnsReviewListAndContent
          - ReviewService_GetFileContentAsync_MissingFileOrReview_ReturnsNull

      - id: ReviewCenter-ReviewService-Audit
        title: >-
          The ReviewService class shall record the creation of a draft review in the audit trail, in the same
          transaction as the review, naming the actor, the title, the content fingerprint, and the number of files.
        justification: |
          The fingerprint in the history ties the creation of a review to the exact content it covers.
        tests:
          - ReviewService_CreateDraftAsync_Review_RecordsReviewCreatedWithFingerprint
          - ReviewService_CreateDraftAsync_SeveralFiles_RecordsPluralCount

      - id: ReviewCenter-ReviewService-FromRepository
        title: >-
          The ReviewService class shall create a review from a registered, enabled git repository of the same
          project as the review (a repository of another project is refused as not found) that covers the
          files changed between an optional baseline revision and a head revision and matching a selection,
          freezing in the database, for each file, its path, its change kind (Added, Modified, or Deleted), and
          its baseline and head content, together with the repository, the two resolved commit identifiers, and
          the selection text, and shall set the content fingerprint from the files that exist at the head.
        justification: |
          A review of a change must keep exactly what was reviewed. Freezing the content and the resolved
          commits means a later change of the repository, or a moved branch, cannot alter the review, and the
          fingerprint stays comparable with that of an uploaded review of the same files.
        tests:
          - ReviewService_CreateFromRepositoryAsync_Changes_FreezesFilesAndSource
          - ReviewService_CreateFromRepositoryAsync_Changes_FingerprintCoversHeadFilesOnly
          - ReviewService_CreateFromRepositoryAsync_Selection_ChoosesFiles
          - ReviewService_CreateFromRepositoryAsync_NullSelection_ReviewsEveryChangedFile
          - ReviewService_CreateFromRepositoryAsync_SelectionOfDeletedFile_ReviewsIt
          - ReviewService_CreateFromRepositoryAsync_BlankBaseline_ReviewsAllHeadFilesAsAdded
          - ReviewService_CreateFromRepositoryAsync_BadRequests_AreRefusedWithTheirRule
          - ReviewService_CreateFromRepositoryAsync_GitFailure_IsPassedOn
          - ReviewService_CreateFromRepositoryAsync_DuplicateIdOrUnknownProject_RefusedBeforeOpening
          - ReviewService_CreateFromRepositoryAsync_WithoutRepositories_Throws

      - id: ReviewCenter-ReviewService-Frozen
        title: >-
          The ReviewService class shall read a review created from a repository only from its frozen copies, never
          from the repository, so that a later commit, a moved branch, or a removed repository changes neither
          the review, nor its content, nor its record digest.
        justification: |
          A signature binds to the record digest. If the review followed the repository, the same signature
          would cover content nobody has seen.
        tests:
          - ReviewService_CreateFromRepositoryAsync_RepositoryChangesLater_ReviewIsUnaffected
          - ReviewService_CreateFromRepositoryAsync_RealGit_FreezesChangesAgainstLaterCommits

      - id: ReviewCenter-ReviewService-ProjectChecklist
        title: >-
          The ReviewService class shall give every review it creates, from uploaded files and from a repository or
          a review plan alike, a frozen copy of the checklist of the project, validated at that moment, or of the
          built-in default checklist when the project has none, shall refuse to create the review, storing nothing,
          with the ChecklistDefinitionInvalid rule when the stored definition of the project cannot be read or
          is not valid, never falling back to the default, and shall leave the checklist, and so the record digest,
          of every review that exists unchanged when the checklist of the project changes later, whether the review
          is approved or not.
        justification: |
          The checklist of a project is the standard its reviews are answered against, so a review must carry the
          wording that was in force when it was created. A silent fallback to the default would let a review be
          answered against a standard the project did not choose, and a later edit that reached an existing review
          would change what the reviewers answered and what a signature covers.
        tests:
          - ReviewService_Create_ProjectChecklist_IsFrozenAtBothCreatePaths
          - ReviewService_Create_NoProjectChecklist_FreezesTheDefaultAtBothCreatePaths
          - ReviewService_Create_UnusableProjectChecklist_FailsClosed
          - ReviewService_ProjectChecklistChangedLater_ExistingReviewsAreUnaffected
          - ReviewService_ProjectChecklistChangedLater_ApprovedReviewIsUnaffected
          - ReviewPlanner_CreateAsync_ProjectChecklist_IsFrozenIntoTheReview

      - id: ReviewCenter-ReviewService-NothingToReview
        title: >-
          The ReviewService class shall refuse to create a review from a repository when no changed file matches
          the selection, storing nothing, and shall say "Nothing to review: no files matching the selection
          changed between" the baseline and the head.
        justification: |
          A review without files has nothing to review. The creator must learn that the selection or the
          revisions are wrong instead of getting an empty review.
        tests:
          - ReviewService_CreateFromRepositoryAsync_NoMatchingChange_RefusesWithNothingToReview
          - ReviewService_CreateFromRepositoryAsync_NoBaselineNoMatch_NamesBeginningOfHistory

      - id: ReviewCenter-ReviewService-RepositoryLimits
        title: >-
          The ReviewService class shall apply the limits of an upload (2 MiB per file, 200 files, 20 MiB in
          total) to a review from a repository, counting both the baseline and the head content, and shall
          refuse a review that exceeds them before reading file content.
        justification: |
          The frozen copies live in the database and in memory like uploaded files, so the same bounds protect
          the service, and a refusal before the content is read keeps a huge change from being fetched.
        tests:
          - ReviewService_CreateFromRepositoryAsync_FileTooLarge_RefusedBeforeReading
          - ReviewService_CreateFromRepositoryAsync_TotalTooLarge_RefusedBeforeReading
          - ReviewService_CreateFromRepositoryAsync_TooManyFiles_Refused

      - id: ReviewCenter-ReviewService-SkippedEntries
        title: >-
          The ReviewService class shall leave symbolic links and submodules out of a review from a repository,
          return them with their reasons to the creator, and count them in the audit entry.
        justification: |
          Only regular files can be reviewed. Silently dropping the others would hide parts of the change.
        tests:
          - ReviewService_CreateFromRepositoryAsync_SkippedEntries_ReturnedAndCounted

      - id: ReviewCenter-ReviewService-RepositoryAudit
        title: >-
          The ReviewService class shall record the creation of a review from a repository in the audit trail, in
          the same transaction as the review, naming the repository, the baseline and head commits, the number
          of files by change kind, the number of skipped entries, and the content fingerprint.
        justification: |
          The history must show which commits and selection a review covers without opening the review.
        tests:
          - ReviewService_CreateFromRepositoryAsync_Changes_AuditDetailDescribesSource
          - ReviewService_CreateFromRepositoryAsync_SameFilesOtherSource_ChangesDigest

      - id: ReviewCenter-ReviewService-ReviewSet
        title: >-
          The ReviewService class shall let a review created from a plan record the identifier of the review-set it
          comes from (1 to 100 characters, refused otherwise), create that review through an already open
          repository session so that a batch of reviews fetches the repository once, name the set last in the audit
          entry, and keep the identifier empty for every other review.
        justification: |
          A review that was planned from a set must say which set it covers, so that the next plan can find the
          last signed review of the same set. A shared session keeps a plan of many sets from fetching the
          repository once per review, and a bounded identifier keeps the stored value and the audit text bounded.
        tests:
          - ReviewPlanner_CreateAsync_PlanRows_CreatesReviewsWithSetIdAndOneSession
          - ReviewPlanner_CreateAsync_InvalidRequests_FailPerRequest
          - ReviewPlanner_CreateAsync_LongestInputs_AuditDetailFits
          - ReviewService_CreateFromRepositoryAsync_SelectionTooLong_ThrowsAndManualReviewHasNoSet

      - id: ReviewCenter-ReviewService-Diff
        title: >-
          The ReviewService class shall give the line differences between the baseline and the head content of a
          file of a review, computed from the content already stored with the review and without opening the
          repository, treating an added file as all lines added and a deleted file as all lines removed, and shall
          report instead of lines that the review has no baseline (an uploaded review or one without a baseline
          commit), that a side of the file is binary, or that the file is too large to compare, and that the lines
          are the same when only line endings or the final line ending differ, and shall give nothing for a review
          or file that does not exist.
        justification: |
          A reviewer needs to see what changed in a file. The review froze both contents, so the answer must not
          depend on the repository still being available or unchanged, and must be the same every time. A file that
          cannot be compared sensibly is better explained than shown wrongly.
        tests:
          - ReviewService_GetDiffAsync_ModifiedAddedDeleted_ComparesFrozenContentWithoutGit
          - ReviewService_GetDiffAsync_UnknownFileOrReview_ReturnsNull
          - ReviewService_GetDiffAsync_NoBaselineOrUpload_ReportsNoBaseline
          - ReviewService_GetDiffAsync_BinarySide_ReportsBinary
          - ReviewService_GetDiffAsync_BeyondLineLimit_ReportsTooLarge
          - ReviewService_GetDiffAsync_OnlyLineEndingsDiffer_IsFlagged

      - id: ReviewCenter-ReviewService-CreatedVia
        title: >-
          The ReviewService class shall record the user who created a review, mark a review that an actor created
          through a personal access token as created through the API, and name the id of the token, never the value,
          in the audit entry of the creation, both for a draft from files and for a review from a repository.
        justification: |
          Reviewers should see that a script, and not a person at the screen, made a draft, and an investigation
          should be able to tell which token did it.
        tests:
          - ReviewService_CreateDraftAsync_ApiActor_FlagsReviewAndAuditText
          - ReviewService_CreateDraftAsync_UiActor_RecordsCreatorWithoutApiFlag
          - ReviewService_CreateFromRepositoryAsync_ApiActor_FlagsReviewAndAuditText

      - id: ReviewCenter-ReviewService-DueDate
        title: >-
          The ReviewService class shall let a review be created, from files, from a repository, or from a plan,
          with an optional due date that is a calendar day in UTC, shall keep it outside the record digest, shall
          refuse a date before today or more than two years ahead with the DueDateInvalid rule, storing nothing,
          shall name the date in the audit entry of the creation only when one is set, and shall treat a review as
          overdue only while its due date is before today (UTC) and the review is not approved, and shall tell for a
          list of reviews which of those with a due date before today are approved, with one batch question to the
          store and not one full read per review.
        justification: |
          A lead needs to say when a review is expected without every review having a deadline. A date in the past
          is a mistake at creation, and one far in the future is most likely a typing error. The date is planning
          information, not review content, so it must not change what a signature covers, and a review that is
          approved has met its purpose and must not be reported as late.
        tests:
          - ReviewService_CreateDraftAsync_DueDateInRange_StoresDateAndAuditsIt
          - ReviewService_CreateDraftAsync_NoDueDate_HasNoDateAndNoAuditText
          - ReviewService_CreateDraftAsync_DueDateOutOfRange_IsRefusedAndStoresNothing
          - ReviewService_IsOverdue_PastDateAndNotApproved_IsTheOnlyOverdueCase
          - ReviewService_ListApprovedWithPastDueDateAsync_OnlyPastDatedReviews_ReturnsTheApprovedOnes
          - ReviewService_ParseDueDate_IsoTextOnly_ReadsDateOrRefuses
          - ReviewService_SetDueDateAsync_AfterSignature_KeepsDigestAndSignature

      - id: ReviewCenter-ReviewService-DueDateChange
        title: >-
          The ReviewService class shall let only a project administrator, a system administrator, or the user who
          created the review and can still contribute to the project (not a read-only member), and never an actor
          that works through a personal access token, set, change, or clear
          the due date of a review after its creation, accepting a date in the past but not one more than two years
          ahead, shall refuse the change of an approved review with the ReviewLocked rule, shall store the change
          only when the stored date is still the one it started from, and shall record in the audit trail, in the
          same transaction, the old and the new date.
        justification: |
          The due date is a commitment that the people in charge of the project make, so a member who is neither
          the creator nor an administrator, and a script, must not move it. A lead may record that something was
          due last week, so the past is allowed on edit. An approved review is locked so that nothing changes, and
          it is never overdue, so a change has no purpose until it is reopened. The comparison is part of the update
          and the entry is stored with it, so two people cannot both succeed and the history cannot disagree with
          the date.
        tests:
          - ReviewService_SetDueDateAsync_ProjectAdmin_ChangesAndAuditsOldAndNew
          - ReviewService_SetDueDateAsync_CreatorAndSystemAdmin_AreAllowed
          - ReviewService_SetDueDateAsync_OtherMemberOrOutsider_IsRefusedAndChangesNothing
          - ReviewService_SetDueDateAsync_CreatorNowReadOnly_IsRefused
          - ReviewService_SetDueDateAsync_ApiToken_IsRefused
          - ReviewService_SetDueDateAsync_ClearAndUnchanged_AuditsOnlyTheChange
          - ReviewService_SetDueDateAsync_TooFarAhead_IsRefused
          - ReviewService_SetDueDateAsync_MissingReview_IsNotFound
          - ReviewService_SetDueDateAsync_ApprovedReview_IsLockedAndNeverOverdue
          - ReviewService_SetDueDateAsync_ChangedByOtherMeanwhile_FailsAsRecordChanged
