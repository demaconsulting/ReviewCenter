---
# Software Unit Requirements for the ReviewProgressService Class
#
# The ReviewProgressService class answers, for every review of a project, where it stands and who is holding it up:
# its stage, how many signatures it has and needs, the names of the people it waits on, what blocks its approval, when
# it last changed, and whether it is overdue. It computes this on demand from what is stored (the approval status of
# the SigningService unit, the due date rule of the ReviewService unit, and the audit trail) and stores nothing. The
# ReviewProgress and ReviewStage types that carry the answer are verified with it. The blocker counts themselves are
# produced by the SigningService unit and the last activity by the audit store; their requirements are in their own
# files.

sections:
  - title: ReviewProgressService Unit Requirements
    requirements:
      - id: ReviewCenter-ReviewProgressService-Stage
        title: >-
          The ReviewProgressService class shall derive the stage of every review from its approval status and not
          from the stored state of the review: Setup while it has no reviewer slot, Approved when every slot has a
          valid signature and nothing blocks the approval, and In review otherwise, including a review that was
          reopened after an approval, which it shall flag as reopened.
        justification: |
          A lead wants to know whether a review has not started, is under way, or is done. The stored state only says
          whether a review is open or closed, and a review that was reopened is open again whatever it was before, so
          the stage is computed from the same approval status that the review page shows and cannot disagree with it.
        tests:
          - ReviewProgressService_GetProgressAsync_SlotsAndSignatures_DeriveTheStage
          - ReviewProgressService_GetProgressAsync_ProjectWithoutReviews_IsEmpty
          - ReviewProgressService_GetProgressAsync_ReopenedReview_IsFlaggedAndNotApproved

      - id: ReviewCenter-ReviewProgressService-SlotProgress
        title: >-
          The ReviewProgressService class shall report, for every review, the number of reviewer slots, the number
          that have a valid signature, and the number whose signature is out of date because the review changed
          after it was given.
        justification: |
          "2 of 3 signed" and "one signature no longer counts" are the first things a lead looks for. An out-of-date
          signature is not progress, and a count that hid it would make a review look nearer to approval than it is.
        tests:
          - ReviewProgressService_GetProgressAsync_SlotsAndSignatures_DeriveTheStage
          - ReviewProgressService_GetProgressAsync_CommentAfterSignature_CountsOutOfDate

      - id: ReviewCenter-ReviewProgressService-WaitingOn
        title: >-
          The ReviewProgressService class shall name, for a review that is not approved, the primary reviewer and,
          when that is another person, the alternate reviewer of every slot that is not signed or is out of date,
          each person once and in slot order, show a person whose account is disabled with the suffix "(disabled)",
          and name nobody for an approved review.
        justification: |
          A lead who has to chase a review needs the names of the people to ask. A primary reviewer who can no
          longer sign must be recognizable, so the lead knows the slot has to be reassigned and not waited for.
        tests:
          - ReviewProgressService_GetProgressAsync_WaitingOn_NamesPrimaryAndAlternateOfOpenSlots

      - id: ReviewCenter-ReviewProgressService-Blockers
        title: >-
          The ReviewProgressService class shall report for every review the number of open threads, of unanswered
          checks, and of checks answered Fail, taken from the same blocker counts of the approval status that the
          blocker sentences of the review page come from, and shall mark an unapproved review with any of them as
          blocked.
        justification: |
          What blocks a review is a different question from who has not signed. The counts and the sentences are
          produced in one place, so the overview and the review page cannot disagree about why a review is not
          approved.
        tests:
          - ReviewProgressService_GetProgressAsync_BlockerCounts_EqualTheApprovalBlockers

      - id: ReviewCenter-ReviewProgressService-Overdue
        title: >-
          The ReviewProgressService class shall report for every review its due date and whether it is overdue by the
          rule of the ReviewService class: overdue from the day after the due date until the review is approved, not
          on the due date itself, never for a review without a due date, and never for an approved review.
        justification: |
          The overview and the review page must agree on which reviews are late, so the overview asks the rule that
          the page uses and does not repeat it.
        tests:
          - ReviewProgressService_GetProgressAsync_DueDate_OverdueFromTheDayAfter

      - id: ReviewCenter-ReviewProgressService-LastActivity
        title: >-
          The ReviewProgressService class shall report for every review the time of its newest entry in the audit
          trail, which is the creation time of the review when the trail has no entry for it, and shall read the
          activity of all reviews of the project with one query of the audit trail.
        justification: |
          "Nothing has happened for three weeks" is what a lead needs to see. The audit trail records every change of
          a review and is already tamper evident, so the time is taken from it and not kept in a column that could
          drift from it.
        tests:
          - ReviewProgressService_GetProgressAsync_LastActivity_ComesFromTheAuditTrail
          - ReviewProgressService_GetProgressAsync_ManyReviews_ReadsActivityOnceAndIsFast

      - id: ReviewCenter-ReviewProgressService-ViewerRights
        title: >-
          The ReviewProgressService class shall return the progress of a project to every actor who may see the
          project, a read-only auditor included, and give every other
          actor, including a user outside the project, a disabled user, and no actor at all, the answer for a project
          that does not exist.
        justification: |
          The overview only shows what the review pages show to the same people. A project that the actor may not see
          must read like a missing one, so that its existence does not leak.
        tests:
          - ReviewProgressService_GetProgressAsync_ActorKinds_AreAllowedOrNotFound

      - id: ReviewCenter-ReviewProgressService-Performance
        title: >-
          The ReviewProgressService class shall need a number of reads that does not grow with the number of reviews
          of the project: one read of the reviews, one batch read of the approval statuses, and one read of the last
          activity, so that a project with 300 reviews is answered within a loose time bound on a test database.
        justification: |
          The overview is the page that every user opens first. A read per review would make it slow exactly for the
          projects that most need an overview.
        tests:
          - ReviewProgressService_GetProgressAsync_ManyReviews_ReadsActivityOnceAndIsFast

      - id: ReviewCenter-ReviewProgressService-Arguments
        title: >-
          The ReviewProgressService class shall refuse a null review service, signing service, audit store, or access
          rule.
        justification: |
          A missing collaborator is a programming error that must show at once, not later as a null reference in the
          middle of a request.
        tests:
          - ReviewProgressService_Constructor_NullArgument_Throws
