---
# Software Unit Requirements for the ThreadService Class
#
# The ThreadService class starts review comment threads on a file of a review, appends replies, resolves and
# reopens threads, enforces the comment rules, and reads threads back.

sections:
  - title: ThreadService Unit Requirements
    requirements:
      - id: ReviewCenter-ThreadService-Start
        title: >-
          The ThreadService class shall start a thread on an existing file of a review, anchored to the whole
          file or to an inclusive range of 1-based lines, in the Open state, with the creation time and the
          first comment.
        justification: |
          A review discussion is a thread of comments about a file or a part of it. Starting a thread always
          records its first comment, so a thread is never empty.
        tests:
          - ThreadService_StartThreadAsync_WholeFile_StoresOpenThreadWithFirstComment
          - ThreadService_StartThreadAsync_LineRange_StoresRange

      - id: ReviewCenter-ThreadService-Anchor
        title: >-
          The ThreadService class shall reject a thread on a review or file that does not exist, a range with
          only one endpoint given, a start line below 1, an end line before the start line, an end line beyond the
          last line of the file, or a range on a binary or empty file, and shall accept a thread on the whole
          of any file and a range that ends exactly at the last line, counting lines so that Windows and Unix
          line endings count the same and a final line ending adds no line.
        justification: |
          A thread must point at something that exists, or the reader could not find what it is about. A file
          that has no lines to point at can only be commented as a whole. Counting lines by their separators
          gives the same numbers whichever line endings the file uses.
        tests:
          - ThreadService_StartThreadAsync_RangeLimits_AreInclusiveAndCountLinesBySeparator
          - ThreadService_StartThreadAsync_InvalidRange_ThrowsThreadAnchorInvalid
          - ThreadService_StartThreadAsync_RangeOnBinaryOrEmptyFile_ThrowsThreadAnchorInvalid
          - ThreadService_StartThreadAsync_WholeFileOnBinaryFile_IsAllowed
          - ThreadService_StartThreadAsync_UnknownFileOrReview_ThrowsThreadAnchorInvalid

      - id: ReviewCenter-ThreadService-DeletedFile
        title: >-
          The ThreadService class shall reject a thread anchored to head lines of a file that a repository review
          marks as Deleted, and shall accept a thread on the whole of a deleted file, a thread on baseline lines of a
          deleted file, and a thread on lines of a modified or added file.
        justification: |
          A deleted file has no lines at the head, so a head line range would point at nothing; the reviewer can
          comment on the deletion as a whole or on the removed baseline lines. Lines of a modified or added file
          exist at the head.
        tests:
          - ThreadService_StartThreadAsync_LineOnDeletedFile_ThrowsThreadAnchorInvalid
          - ThreadService_StartThreadAsync_WholeFileOnDeletedAndLineOnModified_AreAllowed

      - id: ReviewCenter-ThreadService-Side
        title: >-
          The ThreadService class shall anchor a thread to the Head or the Baseline side of a file, taking Head
          when no side is given, shall check the lines of a range against the lines of the chosen side only, shall
          accept the Baseline side only for a modified or deleted file of a review that has a baseline commit, and
          shall store a whole-file thread as Head and reject a whole-file anchor that names the Baseline side, and
          shall reject a side value that is not defined with an ArgumentOutOfRangeException.
        justification: |
          A diff shows removed lines that exist only in the baseline. A reviewer must be able to comment on them,
          and the number of a line means different things on each side, so the side decides which text the range
          is checked against and what the thread is about.
        tests:
          - ThreadService_StartThreadAsync_SideMatrix_AcceptsOnlyLinesThatExistOnThatSide
          - ThreadService_StartThreadAsync_BaselineWithoutBaselineCommit_ThrowsThreadAnchorInvalid
          - ThreadService_StartThreadAsync_WholeFileSide_BaselineRefusedHeadStored
          - ThreadService_StartThreadAsync_NoSideGiven_IsHeadThread
          - ThreadService_StartThreadAsync_BaselineRange_UsesBaselineLineCount
          - ThreadService_StartThreadAsync_UndefinedSide_ThrowsArgumentOutOfRange

      - id: ReviewCenter-ThreadService-Comment
        title: >-
          The ThreadService class shall take the author of a thread or reply as the signed-in actor (user name and
          display name), store both with the comment, require a text of at most 4000 characters that is not blank
          after trimming and store it trimmed, for a new thread and for a reply, and shall store nothing when a rule
          is violated.
        justification: |
          A comment without text carries no information, and unbounded text would make the review record and its
          pages unwieldy. The author comes from the signed-in user, so it needs no check and cannot be chosen by
          the person who writes the comment; storing the user name keeps the author identifiable if the display
          name changes later.
        tests:
          - ThreadService_StartThreadAsync_Actor_RecordsUsernameAndDisplayName
          - ThreadService_StartThreadAsync_BlankOrLongText_ThrowsCommentTextInvalid
          - ThreadService_StartThreadAsync_PaddedText_IsTrimmed
          - ThreadService_ReplyAsync_InvalidText_ThrowsAndStoresNothing

      - id: ReviewCenter-ThreadService-Reply
        title: >-
          The ThreadService class shall append a reply with the creation time to an existing thread of the
          review, keeping the earlier comments unchanged and in posting order without changing the state of the
          thread, and shall reject a thread that does not exist or belongs to another review.
        justification: |
          Replies are how a discussion proceeds. Comments are immutable, so a reply only ever adds to the
          thread, and a reply must never reach a thread of another review through a mistaken identity.
        tests:
          - ThreadService_ReplyAsync_ExistingThread_AppendsInOrderAndKeepsEarlierComments
          - ThreadService_ReplyAsync_UnknownThreadOrOtherReview_ThrowsThreadNotFound

      - id: ReviewCenter-ThreadService-State
        title: >-
          The ThreadService class shall resolve and reopen a thread of the review without touching its
          comments, treating a repeated request as harmless, and shall reject a thread that does not exist or
          belongs to another review.
        justification: |
          The state of a thread tells reviewers what still needs attention. A repeated click or request must
          leave the thread in the requested state rather than fail.
        tests:
          - ThreadService_ResolveAsync_ReopenAsync_ChangeStateKeepCommentsAndAreIdempotent
          - ThreadService_ResolveAsync_UnknownThread_ThrowsThreadNotFound

      - id: ReviewCenter-ThreadService-Read
        title: >-
          The ThreadService class shall list all threads of a review with their comments, with threads and
          comments in creation order, and an empty list when there are none.
        justification: |
          Pages show every thread of a review, and a stable order lets a reader follow the discussion.
        tests:
          - ThreadService_ListAsync_SeveralThreads_ReturnsAllInOrderWithComments
          - ThreadService_ListAsync_NoThreadsOrUnknownReview_ReturnsEmpty

      - id: ReviewCenter-ThreadService-Index
        title: >-
          The ThreadService class shall derive the last activity of a thread as the time of its latest comment,
          and shall list the threads of a review, optionally only those Open or only those Resolved, newest
          last activity first, without any change to what is stored.
        justification: |
          Reviewers look for the discussion that needs attention, which is usually the most recently active.
          Deriving the time from the comments keeps one source of truth and needs no stored data.
        tests:
          - ThreadService_LastActivity_IsTimeOfLatestComment
          - ThreadService_BuildIndex_StateFilter_ReturnsMatchingNewestActivityFirst

      - id: ReviewCenter-ThreadService-NextStep
        title: >-
          The ThreadService class shall give, for the threads of a review and optionally the progress of its
          checklist and the number of checks answered Fail (information only, a Fail is not a blocker), one short
          sentence naming the next action: the number
          of unanswered checklist checks, the number of checks disputed between the ballots, the number of checks
          answered Fail, the number of open threads to
          resolve, all of them that apply, that the checklist is complete, or that all threads are resolved, and,
          when there are no threads and no checklist, to start a discussion, and shall add the hint to write the
          review conclusion when the review would be rejected and has no conclusion text.
        justification: |
          A reader should not have to count threads or checks to know what to do next; one sentence says it. A
          disputed check stops the signing and a rejection needs its reasons, so the sentence names them.
        tests:
          - ThreadService_NextStep_NoThreadsOpenAndAllResolved_NamesNextAction
          - ThreadService_NextStep_WithChecklist_CombinesChecksAndThreads
          - ThreadService_NextStep_WithFailedChecks_NamesThemBeforeThreads
          - ThreadService_NextStep_DisputedAndConclusion_AreNamed

      - id: ReviewCenter-ThreadService-Audit
        title: >-
          The ThreadService class shall record starting a thread, replying, resolving, and reopening in the audit
          trail, in the same transaction as the change, naming the actor, the identifiers, the anchor (marking a
          line anchor on the Baseline side), and a short
          hash of the comment text but never the text itself, and shall record nothing for a thread that does not
          exist.
        justification: |
          The history must show who discussed what and when without copying the comments into a record that cannot
          be edited, and a request that changed nothing must leave no entry.
        tests:
          - ThreadService_ThreadEvents_RecordIdsAnchorsAndDigestButNotText
          - ThreadService_StartThreadAsync_Audit_NamesBaselineSideOnly
          - ThreadService_ResolveAsync_MissingThread_RecordsNothing

      - id: ReviewCenter-ThreadService-CheckThreads
        title: >-
          The ThreadService class shall start a thread anchored to a check of the frozen checklist of the review
          instead of a file, stored with the identifier of the check, an empty file, no lines and the Head side,
          shall reject an anchor that names both a file and a check, a check with lines or the Baseline side, an
          empty check identifier, a review without a checklist and a check that the checklist does not have, shall
          store nothing when a rule is violated, and shall let a check thread be replied to, resolved with the
          resolution-note rule of its kind, and reopened like any other thread.
        justification: |
          A discussion can be about the wording or the answer to a check rather than about a file, and the checklist
          is frozen with the review, so the check must exist there. A thread has one anchor, so an anchor that names
          two things is a mistake, and a check has no lines or baseline to point at. Once started, the thread is an
          ordinary thread.
        tests:
          - ThreadService_StartThreadAsync_CheckAnchor_StoresCheckThreadWithEmptyFileAndNoLines
          - ThreadService_StartThreadAsync_CheckAnchorUnknownItem_ThrowsChecklistItemNotFound
          - ThreadService_StartThreadAsync_CheckAnchorWithoutChecklist_ThrowsChecklistNotFound
          - ThreadService_StartThreadAsync_MixedFileAndCheckAnchor_ThrowsThreadAnchorInvalid
          - ThreadService_StartThreadAsync_CheckAnchorWithLinesOrBaselineSide_ThrowsThreadAnchorInvalid
          - ThreadService_ReplyAsync_ResolveAsync_ReopenAsync_OnCheckThread_Work

      - id: ReviewCenter-ThreadService-CheckThreadStart
        title: >-
          The ThreadService class shall allow starting a check thread only to a system administrator, a project
          administrator, the creator or lead of the review, and a reviewer who holds a slot of the review and has
          handed in the own ballot or holds the only slot, shall refuse any other actor, including an auditor and a
          plain contributor, with the ActorNotAllowed rule, shall refuse a concluded review with the ReviewLocked
          rule, and shall require the acknowledgement of the signatures that the new open thread would make out of
          date.
        justification: |
          The ballots of the other reviewers stay hidden until they hand in their own, and a thread about a check
          would reveal what a reviewer thinks of it. A reviewer who has submitted has nothing left to hide, and a
          reviewer who is alone has no one to hide from. An open thread blocks signing, so starting one is a change
          like any other that can outdate a signature.
        tests:
          - CheckThreadRules_CanStart_SubmittedSlotOwner_IsAllowed
          - CheckThreadRules_CanStart_DraftOrNoBallotSlotOwner_IsRefusedWhenSeveralSlots
          - CheckThreadRules_CanStart_SoleSlotOwnerWithDraft_IsAllowed
          - CheckThreadRules_CanStart_LeadCreatorProjectAdminAndSystemAdmin_AreAllowed
          - ThreadService_StartThreadAsync_CheckAnchorByAuditorOrPlainContributor_ThrowsActorNotAllowed
          - ThreadService_StartThreadAsync_CheckAnchor_SlotOwnerNeedsSubmittedBallotWhenSeveralSlots
          - ThreadService_StartThreadAsync_CheckAnchorWhenConcluded_ThrowsReviewLocked
          - ThreadService_StartThreadAsync_CheckAnchorWouldOutdateSignature_RequiresAcknowledgement

      - id: ReviewCenter-ThreadService-CheckThreadAudit
        title: >-
          The ThreadService class shall record starting a check thread in the audit trail in the same transaction,
          naming the thread, the check and a short hash of the comment text but never the text itself.
        justification: |
          The history must show that a discussion about a check was started and by whom, with the same care as for
          a thread on a file, and without copying the comment into a record that cannot be edited.
        tests:
          - ThreadService_StartThreadAsync_CheckAnchor_AuditsThreadStartedOnCheck

      - id: ReviewCenter-ThreadService-Access
        title: >-
          The ThreadService class shall require, for starting a thread, replying, resolving, reopening, promoting,
          demoting, and changing whether a comment is included in the report, that the actor may see the project of
          the review (through IProjectAccess), refusing an actor who may not with the same ProjectNotFound rule as
          for a project that does not exist, before anything else is checked or stored.
        justification: |
          A user outside a project must not be able to read or write its discussion, nor learn that it exists. The
          service enforces this itself, whatever the page or the API checked, so that a route added later cannot
          bypass the rule.
        tests:
          - ThreadService_Constructor_NullArguments_Throws
          - ThreadService_ReportMutations_OutsideUser_ThrowsProjectNotFound
          - ThreadService_ReportActions_CommandLine_ThrowsProjectNotFound
          - ThreadService_ReportMutations_Auditor_ThrowActorNotAllowedOrProjectNotFoundAsBefore

      - id: ReviewCenter-ThreadService-ApprovalLock
        title: >-
          The ThreadService class shall refuse to start a thread, to reply, to resolve, to reopen, to promote, to
          demote, and to change whether a comment is included in the report in a review that is concluded (every
          slot signed for the current record and no thread open, and therefore locked), with the ReviewLocked rule,
          after the access check and before the file of a new thread is looked up or anything is stored, shall not
          refuse them in a review whose slots are all signed but that still has an open thread, and shall leave a
          review that does not exist to the existing not-found rule.
        justification: |
          What a concluded review signed is its record, and it must not change after that, so the service refuses
          until an administrator reopens the review. A review with an open thread is not concluded, so the open
          thread can still be discussed and resolved.
        tests:
          - ThreadService_Mutations_ApprovedReview_ThrowReviewLocked
          - ThreadService_AllThreadActions_ConcludedReview_ThrowReviewLocked
          - ThreadService_StartThreadAsync_ConcludedReviewAndInvalidAnchor_ReportsReviewLocked
          - ThreadService_Mutations_OpenThreadReview_NotLockedEvenWhenAllSigned

      - id: ReviewCenter-ThreadService-SignatureImpact
        title: >-
          The ThreadService class shall refuse to start a thread, to reply, to resolve, to reopen, to promote, to
          demote, and to change whether a comment is included in the report when the change would alter the record
          digest and so make a current signature out of date and the caller has not acknowledged the affected slots,
          with the SignaturesWouldBecomeOutOfDate rule that names each affected slot number and signer, after the
          validation of the request and before anything is stored, shall report a thread that does not exist with
          the existing not-found rule, shall not refuse a resolve or reopen that leaves the state as it is, and shall
          need no acknowledgement for chat (a thread or reply that is not included in the report), for resolving a
          Question, or for reopening a thread, because none of them changes the digest.
        justification: |
          Only the content of the report is part of what a signature covers. A person who changes it after somebody
          has signed silently withdraws that signature, so the service says which signatures would be lost and asks
          the caller to confirm. Chat and the open or resolved state of a thread are not part of the digest, so they
          never invalidate a signature and need no confirmation. A request that is not valid is reported as that
          error, and a request that changes nothing needs no confirmation.
        tests:
          - ThreadService_StartThreadAsync_IncludedAndSigned_NeedsAcknowledgement
          - ThreadService_StartThreadAsync_SignedAndInvalidAnchor_ReportsTheAnchor
          - ThreadService_ReplyAsync_IncludedAndSigned_NeedsAcknowledgement
          - ThreadService_ReopenAndResolveAsync_Signed_StateChangesNeedNoAcknowledgement
          - ThreadService_StartThreadAsync_ChatAfterSignature_NeedsNoAcknowledgementAndKeepsSignature
          - ThreadService_ReplyAsync_ChatAfterSignature_KeepsSignature
          - ThreadService_StartThreadAsync_IncludedAfterSignature_NeedsAcknowledgement
          - ThreadService_ReplyAsync_IncludedAfterSignature_NeedsAcknowledgement
          - ThreadService_PromoteAsync_AfterSignature_NeedsAcknowledgement
          - ThreadService_DemoteAsync_AfterSignature_NeedsAcknowledgement
          - ThreadService_SetCommentIncludedAsync_AfterSignature_NeedsAcknowledgement
          - ThreadService_ResolveAsync_FindingAfterSignature_NeedsAcknowledgement
          - ThreadService_ResolveAsync_QuestionAfterSignature_NeedsNoAcknowledgement
          - ThreadService_ReopenAsync_FindingAfterSignature_NeedsNoAcknowledgement
          - ThreadService_PromoteThenDemoteWithAcknowledgement_RestoresOriginalDigest

      - id: ReviewCenter-ThreadService-IncludedComment
        title: >-
          The ThreadService class shall let a thread or a reply be included in the report when it is started or
          posted, store the flag with the comment, treat a comment that is not included as chat, and derive the kind
          of a thread from its starting comment: a Finding when that comment is included, otherwise a Question.
        justification: |
          Only what the owner chooses to include is part of the signed record. Chat stays free of consequences, so
          the discussion is not slowed by the question whether a remark is part of the record; the flag decides, and
          the kind of the thread follows from the starting comment, so there is no second field to keep in step.
        tests:
          - ThreadService_StartThreadAsync_IncludeInReport_StoresFindingWithFlaggedStartingComment
          - ThreadService_StartThreadAsync_Default_StoresQuestion
          - ThreadService_ReplyAsync_IncludeInReport_FlagsOnlyTheReply
          - ThreadService_ListAsync_Comments_CarryFlagAndKind
          - ThreadKindRules_KindOf_StartingCommentIncluded_IsFinding
          - ThreadKindRules_KindOf_OnlyReplyIncluded_IsQuestion

      - id: ReviewCenter-ThreadService-ResolutionNote
        title: >-
          The ThreadService class shall require a resolution note of at most 4000 characters that is not blank after
          trimming to resolve a Finding, refusing it otherwise with the ResolutionNoteRequired rule and storing
          nothing, shall accept an optional note for a Question and treat a blank note as none, shall store a note as a
          Resolution comment in the same transaction as the new state (included in the report when the thread is a
          Finding), shall treat resolving a thread that is already resolved as harmless without a note, an audit entry
          or an acknowledgement, and shall keep the earlier Resolution comments when a thread is reopened and resolved
          again, and shall refuse a resolution with the RecordChanged rule, storing nothing, when the thread was
          promoted or demoted between its check and the write.
        justification: |
          Closing a Finding is a statement in the record, so the record must say how it was closed. A Question is
          chat, so its resolution needs no explanation. Storing the note with the state change keeps the two from
          ever disagreeing, and keeping the earlier notes keeps the history of the thread. The note, the
          acknowledgement and the report flag are decided for the kind that the service saw, so a kind that changed
          meanwhile must be refused and not accepted silently.
        tests:
          - ThreadService_ResolveAsync_FindingWithoutNote_ThrowsResolutionNoteRequiredAndStoresNothing
          - ThreadService_ResolveAsync_KindChangedBeforeStoreWrite_ThrowsRecordChangedAndStoresNothing
          - ThreadService_ResolveAsync_FindingWithNote_StoresIncludedResolutionComment
          - ThreadService_ResolveAsync_QuestionWithNote_StoresExcludedResolutionComment
          - ThreadService_ResolveAsync_QuestionWithoutNote_Resolves
          - ThreadService_ResolveAsync_BlankNoteOnQuestion_IsNoNote
          - ThreadService_ResolveAsync_NoteTooLong_ThrowsCommentTextInvalid
          - ThreadService_ResolveAsync_AlreadyResolved_IsNoOpWithoutNoteOrAudit
          - ThreadService_ReopenThenResolveFinding_AddsSecondResolutionComment
          - ThreadService_ReopenAsync_Finding_KeepsEarlierResolutionComment

      - id: ReviewCenter-ThreadService-Promote
        title: >-
          The ThreadService class shall promote a Question to a Finding for the starter of the thread, the owner of
          any reviewer slot (primary or alternate), and a lead (the creator of the review who may contribute, a
          project administrator, or a system administrator; never an actor authenticated with an API token), shall
          demote a Finding to a Question for the starter and
          a lead only, shall refuse everybody else with the ActorNotAllowed rule, shall include or exclude the
          Resolution comments of the thread together with its starting comment while keeping the flags of the
          replies, shall treat promoting a Finding or demoting a Question as harmless, and shall never let an Auditor
          promote or demote.
        justification: |
          Moving a thread into or out of the record changes what the signatures cover, so only the people who are
          responsible for the content of the thread or the review may do it. The Resolution comments follow the kind,
          because a note on a Question is chat and a note on a Finding is part of the record.
        tests:
          - ThreadService_PromoteAsync_StarterSlotOwnerAndLead_Allowed
          - ThreadService_PromoteAsync_OtherMember_ThrowsActorNotAllowed
          - ThreadService_PromoteAsync_AlsoIncludesExistingResolutionComments
          - ThreadService_PromoteAsync_ResolvedQuestionWithoutNote_ThrowsResolutionNoteRequired
          - ThreadService_PromoteAsync_AlreadyFinding_IsNoOp
          - ThreadService_PromoteAsync_AlternateOfSlot_Allowed
          - ThreadService_ReportActions_LeadWhoIsNotStarterOrReviewer_Allowed
          - ThreadService_ReportActions_LeadViaApiToken_ThrowsActorNotAllowed
          - ThreadService_ReportActions_CreatorDowngradedToAuditor_ThrowsActorNotAllowed
          - ReviewActorRoles_IsLeadAsync_Creator_IsLeadWithoutRegardToCase
          - ReviewActorRoles_IsLeadAsync_ProjectAdminWhoIsNotCreator_IsLead
          - ReviewActorRoles_IsLeadAsync_SystemAdminWhoIsNotMember_IsLead
          - ReviewActorRoles_IsLeadAsync_CreatorDowngradedToAuditor_IsNotLead
          - ReviewActorRoles_IsLeadAsync_PlainMemberAndOutsider_AreNotLead
          - ReviewActorRoles_IsLeadAsync_ApiTokenCommandLineOrNoActor_IsNotLead
          - ReviewActorRoles_IsLeadAsync_ReviewWithoutCreator_OnlyAdministratorsLead
          - ReviewActorRoles_IsSlotOwnerAsync_PrimaryAndAlternate_AreSlotOwners
          - ReviewActorRoles_IsSlotOwnerAsync_NoSlotCommandLineOrNoActor_IsNotSlotOwner
          - ThreadService_DemoteAsync_StarterAndLead_Allowed
          - ThreadService_DemoteAsync_SlotOwnerWhoIsNotStarter_ThrowsActorNotAllowed
          - ThreadService_DemoteAsync_ExcludesResolutionButKeepsReplyFlags
          - ThreadService_DemoteAsync_AlreadyQuestion_IsNoOp
          - ThreadKindRules_CanPromote_Roles_StarterSlotOwnerLeadOnly
          - ThreadKindRules_CanDemote_Roles_StarterAndLeadOnly

      - id: ReviewCenter-ThreadService-CommentToggle
        title: >-
          The ThreadService class shall include a reply in the report or take it out again for the author of that
          reply and a lead, shall refuse everybody else with the ActorNotAllowed rule, shall refuse the starting
          comment and a Resolution comment with the CommentNotTogglable rule, shall report a comment that is not in
          the thread as a missing thread, and shall treat setting the value a comment already has as harmless.
        justification: |
          A reply is the author's own words, so the author decides whether they are part of the record, and a lead
          can correct it. The starting comment and the resolution follow the kind of the thread instead, so they are
          changed by promoting or demoting.
        tests:
          - ThreadService_SetCommentIncludedAsync_ReplyByAuthorOrLead_Toggles
          - ThreadService_SetCommentIncludedAsync_OtherMember_ThrowsActorNotAllowed
          - ThreadService_SetCommentIncludedAsync_StartingOrResolutionComment_ThrowsCommentNotTogglable
          - ThreadService_SetCommentIncludedAsync_UnknownComment_ThrowsThreadNotFound
          - ThreadService_SetCommentIncludedAsync_SameValue_IsNoOp
          - ThreadService_ReportActions_LeadWhoIsNotStarterOrReviewer_Allowed
          - ThreadService_ReportActions_LeadViaApiToken_ThrowsActorNotAllowed
          - ThreadKindRules_CanToggleReply_Roles_AuthorAndLeadOnly
          - ThreadKindRules_IsToggleable_StartingAndResolutionComments_AreNot

      - id: ReviewCenter-ThreadService-ConcludedRefusal
        title: >-
          The ThreadService class shall refuse every thread action (start, reply, resolve, reopen, promote, demote,
          and the inclusion of a comment) on a concluded review with the ReviewLocked rule.
        justification: |
          A concluded review is locked, and no thread action may be a way around the lock, so all seven actions are
          covered by one test over every one of them.
        tests:
          - ThreadService_AllThreadActions_ConcludedReview_ThrowReviewLocked
          - ThreadService_StartThreadAsync_ConcludedReviewAndInvalidAnchor_ReportsReviewLocked

      - id: ReviewCenter-ThreadService-ReportAudit
        title: >-
          The ThreadService class shall record in the audit trail, in the same transaction as the change, a change of
          the kind of a thread (thread.kind-changed, naming the old and the new kind), a change of whether a comment is
          included in the report (thread.comment-report-changed, naming the thread and the comment), the hash but never
          the text of a resolution note on thread.resolved, and the marker that a started thread or reply is in the
          report, and shall record nothing for a request that changes nothing.
        justification: |
          Moving content into or out of the record is a decision that must be traceable. Hashing the note keeps the
          text out of a record that cannot be edited, and a request that changed nothing must leave no entry.
        tests:
          - ThreadService_PromoteAndDemoteAsync_Audit_NamesKindChange
          - ThreadService_SetCommentIncludedAsync_Audit_NamesCommentAndChange
          - ThreadService_ResolveAsync_WithNote_Audit_HasNoteHashButNotText
          - ThreadService_StartThreadAsync_IncludeInReport_Audit_MarksInReport
          - ThreadService_NoOpReportMutations_RecordNothing

      - id: ReviewCenter-ThreadService-Capabilities
        title: >-
          The ThreadService class shall tell a viewer, with the same rules that the thread actions enforce, whether
          each thread may be made a Finding (by the starter of the thread, any reviewer of a slot, or the lead),
          made a Question again (by the starter or the lead only), or resolved, and which comments may be added to or
          taken out of the report (by the author of the reply or the lead), and shall tell an auditor and any viewer of
          a concluded review that nothing is allowed (an API token gets what its user gets, except the rights of the
          lead), so that a page offers exactly the actions that would be accepted, and shall count the threads by kind
          and state for every page that shows a count.
        justification: |
          A button that the rules refuse is a trap, and a page that works the rules out for itself would drift from
          the service. One answer from one place keeps both the same, and one count keeps the summary strip, the
          progress, and the inbox in step.
        tests:
          - ThreadCapabilities_Promote_StarterSlotOwnerAndLead
          - ThreadCapabilities_Demote_StarterAndLeadOnly
          - ThreadCapabilities_ResolvedQuestion_PromoteNeedsResolutionNote
          - ThreadCapabilities_Auditor_NothingAllowed
          - ThreadCapabilities_ApiToken_ActsForItsUserButIsNeverLead
          - ThreadCapabilities_Concluded_NothingAllowed
          - ThreadCapabilities_ToggleReply_AuthorOrLead
          - ThreadCapabilities_Resolve_AnyContributor_UnknownThreadNothing
          - ThreadCapabilities_Equality_ComparesPerThreadActionsByValue
          - ThreadCounts_SplitByKindAndState
          - ThreadCounts_OpenPhrase_NamesTheKinds
          - ThreadCounts_KindPhrases_NameZeroOneAndMany
          - ThreadCounts_From_NullThreads_Throws
