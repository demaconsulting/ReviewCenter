---
# Software Unit Requirements for the UserImpactService Class
#
# The UserImpactService class answers, for one user, what would be left behind if the user left: the reviewer slots of
# unlocked reviews that still wait for the user, and the projects in which the user is the only enabled project
# administrator. It computes this on demand from what is stored, by the signature rules of the InboxRules and
# ReviewLock classes, and stores nothing. The UserImpact records that carry the answer are verified with it. The two
# store reads behind it are verified in the ReviewStore unit, and the project administrator rule it shares with the
# last-administrator rule of the membership store is in the same unit.

sections:
  - title: UserImpactService Unit Requirements
    requirements:
      - id: ReviewCenter-UserImpactService-OpenWork
        title: >-
          The UserImpactService class shall report, for a user, every reviewer slot of an unlocked (not approved)
          review in which the user is the primary or the alternate reviewer and which is not currently signed.
        justification: |
          When a person leaves, the review work that still waits for them has to be handed over, and a lead needs the
          list.
        tests:
          - UserImpactService_GetImpactAsync_PrimaryAndAlternateSlots_AreOpenWork

      - id: ReviewCenter-UserImpactService-OpenWork-Fields
        title: >-
          The UserImpactService class shall give each open work item with the project, the review, its title, the
          number of the slot, and the role of the user.
        justification: |
          A lead hands the work over by project, review, and slot, so the list must say where each item is.
        tests:
          - UserImpactService_GetImpactAsync_PrimaryAndAlternateSlots_AreOpenWork

      - id: ReviewCenter-UserImpactService-OpenWork-NotSigned
        title: >-
          The UserImpactService class shall give a slot that has no signature the state not signed.
        justification: |
          The list tells the lead whether the reviewer has not begun to sign.
        tests:
          - UserImpactService_GetImpactAsync_PrimaryAndAlternateSlots_AreOpenWork

      - id: ReviewCenter-UserImpactService-OpenWork-OutOfDate
        title: >-
          The UserImpactService class shall give a slot whose signature no longer covers the record the state out of
          date, as the inbox does.
        justification: |
          A signature that no longer covers the record has to be given again. The rule for "signed" and "out of
          date" is the one the inbox and the review page already use, so the list cannot disagree with them.
        tests:
          - UserImpactService_GetImpactAsync_OutOfDateSlot_IsOpenWorkAsOutOfDate

      - id: ReviewCenter-UserImpactService-OpenWork-SignedLeftOut
        title: >-
          The UserImpactService class shall leave out a slot that has a current signature.
        justification: |
          A slot that is signed needs nothing, and a list that showed it would hide the real work.
        tests:
          - UserImpactService_GetImpactAsync_SignedSlot_IsNotOpenWork

      - id: ReviewCenter-UserImpactService-OpenWork-ApprovedLeftOut
        title: >-
          The UserImpactService class shall leave out the slots of an approved review.
        justification: |
          An approved review is locked, and nothing waits for its reviewers.
        tests:
          - UserImpactService_GetImpactAsync_ApprovedReviewExcluded_UnlockedReviewIncluded

      - id: ReviewCenter-UserImpactService-OpenWork-Ordering
        title: >-
          The UserImpactService class shall order the open work by project name and then by review identifier.
        justification: |
          A stable order lets a lead work through the list and compare it from one day to the next.
        tests:
          - UserImpactService_GetImpactAsync_ManyReviews_AreOrderedAndReadInOneBatchPerProject

      - id: ReviewCenter-UserImpactService-OpenWork-BatchRead
        title: >-
          The UserImpactService class shall read the snapshots of the reviews of a project with one batch read.
        justification: |
          A user with many slots must not cost one store read per review.
        tests:
          - UserImpactService_GetImpactAsync_ManyReviews_AreOrderedAndReadInOneBatchPerProject

      - id: ReviewCenter-UserImpactService-OpenWork-DisabledUser
        title: >-
          The UserImpactService class shall report the open work of a user whose account is disabled.
        justification: |
          The review work of a leaver is wanted after the account was disabled.
        tests:
          - UserImpactService_GetImpactAsync_DisabledUserWithSlot_StillShowsOpenWork

      - id: ReviewCenter-UserImpactService-SoleAdmin
        title: >-
          The UserImpactService class shall report, for a user, every project in which the user is an enabled project
          administrator and no other enabled project administrator exists.
        justification: |
          A project without an enabled project administrator can no longer have members, reviewers, or settings
          changed by anyone but a system administrator. The report warns before the last administrator is disabled
          or removed. It uses the rule of the last-administrator check of the membership store, so a warning means
          the change would really be refused.
        tests:
          - UserImpactService_GetImpactAsync_OnlyEnabledProjectAdministrator_IsSoleAdmin

      - id: ReviewCenter-UserImpactService-SoleAdmin-OtherAdmin
        title: >-
          The UserImpactService class shall not report a project in which another enabled project administrator
          exists.
        justification: |
          The project can still be run when the user leaves.
        tests:
          - UserImpactService_GetImpactAsync_AnotherEnabledAdministrator_IsNotSoleAdmin

      - id: ReviewCenter-UserImpactService-SoleAdmin-DisabledNotCounted
        title: >-
          The UserImpactService class shall not count a disabled account as another administrator.
        justification: |
          A disabled administrator can not run the project.
        tests:
          - UserImpactService_GetImpactAsync_DisabledSecondAdministrator_DoesNotCount

      - id: ReviewCenter-UserImpactService-SoleAdmin-MemberNotCounted
        title: >-
          The UserImpactService class shall not count a member who is not a project administrator as another
          administrator.
        justification: |
          A plain member can not change members, reviewers, or settings of the project.
        tests:
          - UserImpactService_GetImpactAsync_PlainMemberOfTheProject_DoesNotCountAsAdministrator

      - id: ReviewCenter-UserImpactService-SoleAdmin-SystemAdminNotCounted
        title: >-
          The UserImpactService class shall not count a system administrator who is not a project administrator as
          another administrator.
        justification: |
          A system administrator runs the installation and not the project, and the project administrator rule
          counts only the role in the project.
        tests:
          - UserImpactService_GetImpactAsync_SystemAdministratorMember_DoesNotCountAsAdministrator

      - id: ReviewCenter-UserImpactService-Scope
        title: >-
          The UserImpactService class shall answer a system administrator for every project.
        justification: |
          The impact of a leaver tells who works on what, so it is for the people who run projects, and a system
          administrator runs all of them.
        tests:
          - UserImpactService_GetImpactAsync_SystemAdministrator_SeesEveryProject

      - id: ReviewCenter-UserImpactService-Scope-ProjectAdmin
        title: >-
          The UserImpactService class shall answer a project administrator, for any user, only for the projects the
          asker administers.
        justification: |
          A project administrator has to see the part that concerns the project, and must not learn about the work of
          the user in other projects.
        tests:
          - UserImpactService_GetImpactAsync_ProjectAdministrator_SeesOnlyOwnProjects

      - id: ReviewCenter-UserImpactService-Scope-Refused
        title: >-
          The UserImpactService class shall refuse an actor who administers no project (a member, a read-only member,
          a user outside every project, an unknown actor, or the command line) as not allowed.
        justification: |
          The impact of a leaver is not for people who do not run projects.
        tests:
          - UserImpactService_GetImpactAsync_ActorWithoutAdministration_IsRefused

      - id: ReviewCenter-UserImpactService-Scope-DisabledAdmin
        title: >-
          The UserImpactService class shall refuse a project administrator whose account is disabled as not allowed.
        justification: |
          A disabled account has no rights at all.
        tests:
          - UserImpactService_GetImpactAsync_DisabledProjectAdministrator_IsRefused

      - id: ReviewCenter-UserImpactService-Scope-UserNotFound
        title: >-
          The UserImpactService class shall report a user that does not exist as not found to an administrator.
        justification: |
          An administrator who asks about a missing user has made a mistake and must be told.
        tests:
          - UserImpactService_GetImpactAsync_UnknownUser_IsNotFoundForAnAdministratorOnly

      - id: ReviewCenter-UserImpactService-Scope-NoLeak
        title: >-
          The UserImpactService class shall refuse an actor who may not ask as not allowed before it tells whether
          the user exists.
        justification: |
          A refused actor is told nothing about whether the user exists.
        tests:
          - UserImpactService_GetImpactAsync_UnknownUser_IsNotFoundForAnAdministratorOnly

      - id: ReviewCenter-UserImpactService-Arguments
        title: >-
          The UserImpactService class shall refuse a null actor and a null review store, user store, or access rule.
        justification: |
          A missing collaborator or actor is a programming error that must show at once, not later as a null reference
          in the middle of a request.
        tests:
          - UserImpactService_NullArguments_AreRefused
