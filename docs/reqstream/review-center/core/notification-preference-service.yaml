---
# Software Unit Requirements for the NotificationPreferenceService Class
#
# The NotificationPreferenceService class lets a user name an e-mail address for notifications and confirm that it is
# the user's own by typing back a six digit code that was mailed to that address. It sends no other mail. Each
# requirement states one rule, so that each limit, refusal, and protection has its own test case.

sections:
  - title: NotificationPreferenceService Unit Requirements
    requirements:
      - id: ReviewCenter-NotificationPreferenceService-MailCode
        title: >-
          The NotificationPreferenceService class shall mail a six digit code to the address a user asks to confirm.
        justification: |
          Only a person who can read the mail of the address can type the code back, which shows that the address is
          theirs.
        tests:
          - NotificationPreferenceService_RequestConfirmation_ValidAddress_MailsCodeAndStoresPending

      - id: ReviewCenter-NotificationPreferenceService-MailNormalizedAddress
        title: >-
          The NotificationPreferenceService class shall mail the code to the address in lower case.
        justification: |
          One form of the address is needed so that the limits per address count the same address once.
        tests:
          - NotificationPreferenceService_RequestConfirmation_ValidAddress_MailsCodeAndStoresPending

      - id: ReviewCenter-NotificationPreferenceService-PendingUntilConfirmed
        title: >-
          The NotificationPreferenceService class shall keep a requested address as pending until its code is
          confirmed.
        justification: |
          An address that nobody proved to be theirs must not receive notifications.
        tests:
          - NotificationPreferenceService_RequestConfirmation_ValidAddress_MailsCodeAndStoresPending

      - id: ReviewCenter-NotificationPreferenceService-ConfirmRightCode
        title: >-
          The NotificationPreferenceService class shall confirm the pending address when the user types back the
          code.
        justification: |
          The right code shows that the user can read the mail of the address.
        tests:
          - NotificationPreferenceService_Confirm_RightCode_ConfirmsAddress

      - id: ReviewCenter-NotificationPreferenceService-IgnoreSpacesInCode
        title: >-
          The NotificationPreferenceService class shall ignore white space in the code that the user types.
        justification: |
          People copy the code with a space or a line break, and a correct code must not fail because of it.
        tests:
          - NotificationPreferenceService_Confirm_RightCode_ConfirmsAddress

      - id: ReviewCenter-NotificationPreferenceService-ConfirmedAddressShown
        title: >-
          The NotificationPreferenceService class shall report the confirmed address in the status of a user.
        justification: |
          The user needs to see which address receives the mail.
        tests:
          - NotificationPreferenceService_Confirm_RightCode_ConfirmsAddress

      - id: ReviewCenter-NotificationPreferenceService-PendingAddressShown
        title: >-
          The NotificationPreferenceService class shall report the pending address in the status of a user.
        justification: |
          The user needs to see which address waits for the code.
        tests:
          - NotificationPreferenceService_RequestConfirmation_ValidAddress_MailsCodeAndStoresPending

      - id: ReviewCenter-NotificationPreferenceService-WrongCodeRefused
        title: >-
          The NotificationPreferenceService class shall refuse a code that is not the mailed code.
        justification: |
          Any other code does not show that the user can read the mail.
        tests:
          - NotificationPreferenceService_Confirm_WrongCode_ThrowsAndStaysPending

      - id: ReviewCenter-NotificationPreferenceService-WrongCodeKeepsPending
        title: >-
          The NotificationPreferenceService class shall keep the address pending after a wrong code.
        justification: |
          A typing error must not force the user to ask for a new code.
        tests:
          - NotificationPreferenceService_Confirm_WrongCode_ThrowsAndStaysPending

      - id: ReviewCenter-NotificationPreferenceService-AttemptLimit
        title: >-
          The NotificationPreferenceService class shall refuse the right code after five wrong codes were typed.
        justification: |
          A six digit code has only one million values, so the number of tries must be small.
        tests:
          - NotificationPreferenceService_Confirm_AfterMaxWrongAttempts_RefusesTheRightCode

      - id: ReviewCenter-NotificationPreferenceService-CodeLifetime
        title: >-
          The NotificationPreferenceService class shall refuse a code that is more than 30 minutes old.
        justification: |
          A code that stays valid for a long time is more likely to be found and used by someone else.
        tests:
          - NotificationPreferenceService_Confirm_AfterLifetime_ThrowsExpired

      - id: ReviewCenter-NotificationPreferenceService-ExpiredReported
        title: >-
          The NotificationPreferenceService class shall report in the status that a pending code has expired.
        justification: |
          The page can then ask the user to request a new code instead of typing the old one.
        tests:
          - NotificationPreferenceService_Confirm_AfterLifetime_ThrowsExpired

      - id: ReviewCenter-NotificationPreferenceService-NothingPending
        title: >-
          The NotificationPreferenceService class shall refuse a code when no address is pending.
        justification: |
          There is nothing to confirm, so any code has to be refused.
        tests:
          - NotificationPreferenceService_Confirm_NothingPending_Throws

      - id: ReviewCenter-NotificationPreferenceService-CodeUsedOnce
        title: >-
          The NotificationPreferenceService class shall refuse a code that has already confirmed an address.
        justification: |
          A code that works a second time would let a copy of the mail be used again.
        tests:
          - NotificationPreferenceService_Confirm_SameCodeTwice_SecondIsRefused

      - id: ReviewCenter-NotificationPreferenceService-InvalidAddressRefused
        title: >-
          The NotificationPreferenceService class shall refuse an address that is not one valid e-mail address.
        justification: |
          A bad address would make the server mail a stranger or send a broken mail.
        tests:
          - NotificationPreferenceService_RequestConfirmation_InvalidAddress_ThrowsAndSendsNothing

      - id: ReviewCenter-NotificationPreferenceService-InvalidAddressSendsNothing
        title: >-
          The NotificationPreferenceService class shall send no mail for an address that is refused.
        justification: |
          A refused address must not cause any traffic to a mail server.
        tests:
          - NotificationPreferenceService_RequestConfirmation_InvalidAddress_ThrowsAndSendsNothing

      - id: ReviewCenter-NotificationPreferenceService-ResendCooldown
        title: >-
          The NotificationPreferenceService class shall refuse a new confirmation mail within 60 seconds of the
          previous one for the same user.
        justification: |
          The pause keeps one user from using the server to flood an address with mail.
        tests:
          - NotificationPreferenceService_RequestConfirmation_WithinCooldown_ThrowsTooSoon

      - id: ReviewCenter-NotificationPreferenceService-ResendAfterCooldown
        title: >-
          The NotificationPreferenceService class shall mail a new code 60 seconds after the previous confirmation mail.
        justification: |
          A user who did not get the mail must be able to ask again.
        tests:
          - NotificationPreferenceService_RequestConfirmation_AfterCooldown_OldCodeStopsWorking

      - id: ReviewCenter-NotificationPreferenceService-NewCodeReplacesOld
        title: >-
          The NotificationPreferenceService class shall refuse the earlier code once a new code was mailed.
        justification: |
          Only the latest mail may confirm the address, so that old copies of the mail are worthless.
        tests:
          - NotificationPreferenceService_RequestConfirmation_AfterCooldown_OldCodeStopsWorking

      - id: ReviewCenter-NotificationPreferenceService-UserDailyLimit
        title: >-
          The NotificationPreferenceService class shall refuse a fourth confirmation mail for the same user within a
          day.
        justification: |
          The limit per user keeps one account from using the mail server for bulk mail.
        tests:
          - NotificationPreferenceService_RequestConfirmation_UserDailyLimit_ThrowsLimitReached

      - id: ReviewCenter-NotificationPreferenceService-AddressDailyLimit
        title: >-
          The NotificationPreferenceService class shall refuse a fourth confirmation mail to the same address within
          a day.
        justification: |
          The limit per address keeps several accounts from flooding one mailbox.
        tests:
          - NotificationPreferenceService_RequestConfirmation_AddressDailyLimit_ThrowsLimitReached

      - id: ReviewCenter-NotificationPreferenceService-ServerHourlyLimit
        title: >-
          The NotificationPreferenceService class shall refuse a confirmation mail when the server has already sent
          its hourly limit of mails.
        justification: |
          The limit for the whole server bounds the load on the mail server and the cost of an abuse.
        tests:
          - NotificationPreferenceService_RequestConfirmation_ServerHourlyLimit_ThrowsLimitReached

      - id: ReviewCenter-NotificationPreferenceService-LimitsRecover
        title: >-
          The NotificationPreferenceService class shall mail a confirmation again after a day has passed since the
          limit was reached.
        justification: |
          A limit that never ends would lock a user out for good.
        tests:
          - NotificationPreferenceService_RequestConfirmation_UserDailyLimit_ThrowsLimitReached

      - id: ReviewCenter-NotificationPreferenceService-SendFailureReported
        title: >-
          The NotificationPreferenceService class shall tell the user when the mail could not be sent.
        justification: |
          The user must know that no code is on its way.
        tests:
          - NotificationPreferenceService_RequestConfirmation_SendFails_RollsBackAndThrows

      - id: ReviewCenter-NotificationPreferenceService-SendFailureRollsBack
        title: >-
          The NotificationPreferenceService class shall drop the pending address when the mail could not be sent.
        justification: |
          A code that was never mailed must not wait to be confirmed, and a failed send must not use up the limits.
        tests:
          - NotificationPreferenceService_RequestConfirmation_SendFails_RollsBackAndThrows

      - id: ReviewCenter-NotificationPreferenceService-ConfirmedAddressKept
        title: >-
          The NotificationPreferenceService class shall keep the confirmed address while a new address is pending.
        justification: |
          A typing error in a new address must not switch off the notifications that already work.
        tests:
          - NotificationPreferenceService_RequestConfirmation_NewAddress_KeepsConfirmedAddressUntilConfirmed

      - id: ReviewCenter-NotificationPreferenceService-MailOnlyToConfirmed
        title: >-
          The NotificationPreferenceService class shall give an address for notification mail only when it is
          confirmed.
        justification: |
          Mail to an address that nobody proved to be theirs could reach a stranger.
        tests:
          - NotificationPreferenceService_GetConfirmedAddress_OnlyPending_ReturnsNull

      - id: ReviewCenter-NotificationPreferenceService-Remove
        title: >-
          The NotificationPreferenceService class shall remove the address of a user on request.
        justification: |
          A user must be able to stop the notifications at any time.
        tests:
          - NotificationPreferenceService_RemoveAddress_RemovesAddressAndReportsIt

      - id: ReviewCenter-NotificationPreferenceService-RemoveReported
        title: >-
          The NotificationPreferenceService class shall report whether a removal removed an address.
        justification: |
          The page can then tell the user whether there was something to remove.
        tests:
          - NotificationPreferenceService_RemoveAddress_RemovesAddressAndReportsIt

      - id: ReviewCenter-NotificationPreferenceService-AuditRequest
        title: >-
          The NotificationPreferenceService class shall record an audit entry when an address is entered.
        justification: |
          A change of the place where mail goes belongs in the audit trail.
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-NotificationPreferenceService-AuditConfirm
        title: >-
          The NotificationPreferenceService class shall record an audit entry when an address is confirmed.
        justification: |
          The moment an address starts to receive mail belongs in the audit trail.
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-NotificationPreferenceService-AuditRemove
        title: >-
          The NotificationPreferenceService class shall record an audit entry when an address is removed.
        justification: |
          The end of the mail to an address belongs in the audit trail.
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-NotificationPreferenceService-AuditNoAddress
        title: >-
          The NotificationPreferenceService class shall keep the e-mail address out of its audit entries.
        justification: |
          The audit trail is kept for a long time, and an address is personal data.
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-NotificationPreferenceService-AuditNoCode
        title: >-
          The NotificationPreferenceService class shall keep the confirmation code out of its audit entries.
        justification: |
          A code in the audit trail could be read by a person who must not be able to confirm the address.
        tests:
          - NotificationPreferenceService_Changes_AreAuditedWithoutAddressOrCode

      - id: ReviewCenter-NotificationPreferenceService-CodeNotStored
        title: >-
          The NotificationPreferenceService class shall keep the confirmation code out of the data it stores.
        justification: |
          A copy of the database must not reveal a code that can still be used.
        tests:
          - NotificationPreferenceService_RequestConfirmation_StoresOnlyASaltedHashOfTheCode

      - id: ReviewCenter-NotificationPreferenceService-CanceledSendRollsBack
        title: >-
          The NotificationPreferenceService class shall drop the pending address when the send is canceled.
        justification: |
          A code that was never mailed must not wait to be confirmed, and a canceled send must not use up the limits.
        tests:
          - NotificationPreferenceService_RequestConfirmation_CanceledOrUnexpectedSendFailure_RollsBackAndRethrows

      - id: ReviewCenter-NotificationPreferenceService-MailCarriesLifetime
        title: >-
          The NotificationPreferenceService class shall state in the confirmation mail how long the code is valid.
        justification: |
          The reader needs to know how much time there is to type the code.
        tests:
          - NotificationPreferenceService_RequestConfirmation_Mail_HasNameValidityAndNoLink

      - id: ReviewCenter-NotificationPreferenceService-MailCarriesName
        title: >-
          The NotificationPreferenceService class shall put the name of the instance in the subject of the
          confirmation mail.
        justification: |
          The reader must see which server sent the mail.
        tests:
          - NotificationPreferenceService_RequestConfirmation_Mail_HasNameValidityAndNoLink

      - id: ReviewCenter-NotificationPreferenceService-MailIgnoreHint
        title: >-
          The NotificationPreferenceService class shall tell in the confirmation mail that the mail can be ignored
          when it was not asked for.
        justification: |
          A person who did not ask for the mail must know that nothing has to be done.
        tests:
          - NotificationPreferenceService_RequestConfirmation_Mail_HasNameValidityAndNoLink

      - id: ReviewCenter-NotificationPreferenceService-MailNoLinkText
        title: >-
          The NotificationPreferenceService class shall put no link in the plain text part of the confirmation mail.
        justification: |
          A link in a mail trains people to click links and is the form that phishing mails take.
        tests:
          - NotificationPreferenceService_RequestConfirmation_Mail_HasNameValidityAndNoLink

      - id: ReviewCenter-NotificationPreferenceService-MailNoLinkHtml
        title: >-
          The NotificationPreferenceService class shall put no link in the HTML part of the confirmation mail.
        justification: |
          A link in a mail trains people to click links and is the form that phishing mails take.
        tests:
          - NotificationPreferenceService_RequestConfirmation_Mail_HasNameValidityAndNoLink

      - id: ReviewCenter-NotificationPreferenceService-HtmlEncodesName
        title: >-
          The NotificationPreferenceService class shall encode the instance name in the HTML part of the confirmation
          mail.
        justification: |
          A name with markup must show as plain text, so that an administrator setting can not inject content.
        tests:
          - NotificationPreferenceService_RequestConfirmation_NameWithMarkup_IsEncodedInHtml

      - id: ReviewCenter-NotificationPreferenceService-RefuseApiToken
        title: >-
          The NotificationPreferenceService class shall refuse every notification action of an actor that signed in
          with an API token.
        justification: |
          A token is meant for automation, and a stolen token must not be able to aim mail at an address.
        tests:
          - NotificationPreferenceService_Actions_ApiTokenActor_AreRefused

      - id: ReviewCenter-NotificationPreferenceService-RefuseFeatureOff
        title: >-
          The NotificationPreferenceService class shall refuse every notification action when e-mail notifications are
          not enabled.
        justification: |
          An administrator who has not enabled the feature expects that no mail leaves the server.
        tests:
          - NotificationPreferenceService_Actions_FeatureOff_AreRefusedAndTouchNoStore

      - id: ReviewCenter-NotificationPreferenceService-FeatureOffTouchesNoStore
        title: >-
          The NotificationPreferenceService class shall change no stored data when e-mail notifications are not
          enabled.
        justification: |
          A feature that is not enabled must leave no trace in the data.
        tests:
          - NotificationPreferenceService_Actions_FeatureOff_AreRefusedAndTouchNoStore

      - id: ReviewCenter-NotificationPreferenceService-UnavailableWithoutSender
        title: >-
          The NotificationPreferenceService class shall refuse every notification action while no mail transport is
          configured.
        justification: |
          Without a mail server a code can not be mailed, so the page must not offer the feature.
        tests:
          - NotificationPreferenceService_IsAvailable_SenderNotConfigured_IsFalse

      - id: ReviewCenter-NotificationPreferenceService-RefuseDisabledUser
        title: >-
          The NotificationPreferenceService class shall refuse every notification action of a disabled user.
        justification: |
          A disabled account must not be able to cause mail.
        tests:
          - NotificationPreferenceService_Actions_DisabledOrUnknownUser_AreRefused

      - id: ReviewCenter-NotificationPreferenceService-RefuseUnknownUser
        title: >-
          The NotificationPreferenceService class shall refuse every notification action of an unknown user.
        justification: |
          A user that does not exist must not be able to cause mail.
        tests:
          - NotificationPreferenceService_Actions_DisabledOrUnknownUser_AreRefused

      - id: ReviewCenter-NotificationPreferenceService-RefuseTemporaryPassword
        title: >-
          The NotificationPreferenceService class shall refuse every notification action of a user who must still
          change a temporary password.
        justification: |
          A user with a temporary password has not finished signing in and must not be able to cause mail.
        tests:
          - NotificationPreferenceService_Actions_TemporaryPassword_AreRefused

      - id: ReviewCenter-NotificationPreferenceService-RefuseMissingActor
        title: >-
          The NotificationPreferenceService class shall refuse a notification action without an actor.
        justification: |
          A missing actor is a programming error and must not be treated as an anonymous action.
        tests:
          - NotificationPreferenceService_Actions_NullActor_ThrowsArgumentNull
