---
# Software Unit Requirements for the RepositoryService Class
#
# The RepositoryService class keeps the registry of git repositories that reviews can be created from, and the access
# tokens of those repositories. Every repository belongs to exactly one project and is administered by the project
# administrators of that project and by system administrators.

sections:
  - title: RepositoryService Unit Requirements
    requirements:
      - id: ReviewCenter-RepositoryService-Name
        title: >-
          The RepositoryService class shall register a repository under a name of 1 to 40 letters, digits, dots,
          underscores, and dashes that starts with a letter or digit, refuse any other name, and refuse a second
          repository in the same project whose name differs from an existing one only in letter case, while the same
          name may be used in two different projects.
        justification: |
          The name is what users see and choose, so it must be short, plain, and unambiguous. Projects are
          separate bodies of work and must not have to agree on names with each other.
        tests:
          - RepositoryService_CreateAsync_InvalidName_ThrowsRepositoryNameInvalid
          - RepositoryService_CreateAsync_NameLimitsAndDuplicate_AreEnforced
          - RepositoryService_ProjectAdministrator_ManagesOwnProjectOnly

      - id: ReviewCenter-RepositoryService-Location
        title: >-
          The RepositoryService class shall accept as the location of a repository an https URL, an http URL whose
          host is exactly localhost, 127.0.0.1, or [::1], a file URL, or an absolute local path, and shall refuse,
          when a repository is registered and when it is changed, an http URL with any other host (including a
          host that only starts or ends like a loopback host), an empty or too long location, a location that git
          could read as an option or a helper, any other form (including ssh and git addresses), and a location that
          carries credentials of its own, in the user information, the query string, or a fragment.
        justification: |
          The location is handed to git and fetched by the server. Only the forms that the server can use safely are
          allowed, and credentials belong in the token, where they are protected, not in the location, where they
          would be shown. Plain http to a remote host can be tampered with on the way, so it is allowed only for the
          local machine, where tests and local git servers use it.
        tests:
          - RepositoryService_CreateAsync_AllowedLocation_Registers
          - RepositoryService_CreateAsync_AbsoluteLocalPath_Registers
          - RepositoryService_CreateAsync_InvalidLocation_ThrowsRepositoryLocationInvalid
          - RepositoryService_CreateAndUpdate_LoopbackHttpLocation_Accepted
          - RepositoryService_CreateAndUpdate_NonLoopbackHttpLocation_ThrowsRepositoryLocationInvalid

      - id: ReviewCenter-RepositoryService-Credentials
        title: >-
          The RepositoryService class shall accept a user name and a token only for an https location, refuse a token
          without a user name, refuse a user name or token with characters or a length that is not allowed, and refuse a
          token that is contained in (is a substring of, compared ordinally, with case) the repository name, the user
          name, or the location (its percent-escaped form too, whatever the case of the hex digits), when it is
          registered, when it replaces the stored token, and when the name, the user, or the location is changed while
          the stored token is kept.
        justification: |
          A credential that cannot work, or that could change the meaning of a header, must be reported when it is
          entered, not when a review is created. The repository name, the user name, and the location are written to
          audit entries and messages, so a token that is part of one of them would put the secret there.
        tests:
          - RepositoryService_CreateAsync_InvalidCredentials_ThrowsRepositoryCredentialInvalid
          - RepositoryService_CreateAndUpdate_LoopbackHttpWithCredentials_ThrowsRepositoryCredentialInvalid
          - RepositoryService_CreateAsync_TokenEqualsNameOrUsername_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_TokenEqualsNameOrUsername_ThrowsRepositoryCredentialInvalid
          - RepositoryService_CreateAsync_TokenEqualsLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_NewTokenEqualsLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_KeepTokenEqualsNewLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_CreateAsync_TokenContainedInNameUserOrLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_NewTokenContainedInNameUserOrLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_KeepTokenContainedInNewNameUserOrLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_CreateAsync_EscapedTokenContainedInLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_EscapedTokenContainedInLocation_ThrowsRepositoryCredentialInvalid
          - RepositoryService_UpdateAsync_KeepUnreadableOrClearedToken_DoesNotCompare

      - id: ReviewCenter-RepositoryService-Token
        title: >-
          The RepositoryService class shall store a token only encrypted, let an update keep, replace, or clear it,
          never give it back to a caller that shows or changes the registry, and never show it in the text form of
          any value it hands out.
        justification: |
          The token is write-only: an administrator can set it, but nobody, including an administrator, can read it
          back through the registry, so it cannot leak through a page or a log.
        tests:
          - RepositoryService_CreateAsync_WithToken_StoresItEncryptedAndWriteOnly
          - RepositoryService_NoOpChanges_AreNotAudited
          - RepositoryService_UpdateAsync_InvalidRequests_ThrowRules
          - RepositoryService_TokenTypes_ToStringHidesToken

      - id: ReviewCenter-RepositoryService-Admin
        title: >-
          The RepositoryService class shall let only an administrator of the project, that is a project
          administrator of it or an enabled system administrator, list the registry of the project, register,
          change, enable, and disable its repositories, checking the acting user again on every call, shall refuse
          a plain member of the project with the actor not allowed failure, and shall refuse a user who cannot see
          the project, an unknown user, and a disabled user with the same project not found or repository not found
          failure as for something that does not exist.
        justification: |
          The registry holds the locations and tokens through which the server reads source code, so changing it
          is a duty of the people who run the project. An open page keeps its state for a while after rights are
          taken away, so the check is made again each time, and a refusal must not show that a repository exists.
        tests:
          - RepositoryService_AdminOnly_RefusesOtherActors
          - RepositoryService_ProjectAdministrator_ManagesOwnProjectOnly

      - id: ReviewCenter-RepositoryService-Ownership
        title: >-
          The RepositoryService class shall register every repository in exactly one project, shall give the git
          layer the access data of a repository only for the project that owns it and report any other project's
          repository as not found, and shall offer the enabled repositories of a project only to a user who may
          see that project.
        justification: |
          A repository is registered with the credentials of one body of work. Another project must not be able to
          open it, not even by guessing its identity.
        tests:
          - RepositoryService_ProjectAdministrator_ManagesOwnProjectOnly
          - RepositoryService_DisabledRepository_IsNotSelectable

      - id: ReviewCenter-RepositoryService-Audit
        title: >-
          The RepositoryService class shall record the creation, the change, the disabling, and the enabling of a
          repository in the audit trail with the project, with the names of the fields that changed, never with a
          token or other secret, and shall record nothing for a request that changes nothing.
        justification: |
          Who made source code reachable through the server, and who changed that, must be traceable, but the audit
          trail must never become a place where secrets are kept.
        tests:
          - RepositoryService_Changes_AreAuditedWithoutSecrets
          - RepositoryService_NoOpChanges_AreNotAudited

      - id: ReviewCenter-RepositoryService-Disable
        title: >-
          The RepositoryService class shall disable a repository instead of deleting it, offer the members of the
          project only the name of its enabled repositories, and refuse access to a disabled repository.
        justification: |
          Reviews made from a repository keep their reference to it, so it is never deleted, and disabling it is how
          a project administrator stops its use.
        tests:
          - RepositoryService_DisabledRepository_IsNotSelectable

      - id: ReviewCenter-RepositoryService-Access
        title: >-
          The RepositoryService class shall give the git layer the location, the user name, and the decrypted token
          of an enabled repository, as one consistent registration even while an administrator changes it, and shall
          report that the credentials cannot be read, without naming any secret,
          when the stored token cannot be decrypted.
        justification: |
          The server must be able to use the token, and when the key ring was lost the administrator must be told to
          enter the token again. A location paired with the token of another version would send a token to the wrong
          host.
        tests:
          - RepositoryService_GetAccessAsync_UnreadableToken_ThrowsCredentialsUnreadable
          - RepositoryService_GetAccessAsync_ConcurrentUpdate_ReturnsConsistentPair
