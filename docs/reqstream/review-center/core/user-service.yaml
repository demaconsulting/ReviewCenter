---
# Software Unit Requirements for the UserService Class
#
# The UserService class creates users and checks their sign-in: it enforces the user name, display name, and password
# rules, keeps only a password hash, authenticates with a lockout after repeated failures, enables and disables users,
# sets the system administrator right, changes passwords, and protects the last enabled system administrator.

sections:
  - title: UserService Unit Requirements
    requirements:
      - id: ReviewCenter-UserService-Username
        title: >-
          The UserService class shall accept as a user name 3 to 50 characters made only of letters, digits,
          full stops, underscores, and hyphens, and shall reject any other user name, and a user name that is
          already taken in any letter case, storing nothing.
        justification: |
          A user name is typed at every sign-in and shown in the record. A restricted alphabet keeps names
          readable and unambiguous, and treating letter case as insignificant stops two people from holding names
          that look alike.
        tests:
          - UserService_CreateAsync_ValidUsername_Creates
          - UserService_CreateAsync_InvalidUsername_ThrowsUserNameInvalid
          - UserService_CreateAsync_DuplicateUsernameOtherCase_ThrowsUserNameTaken

      - id: ReviewCenter-UserService-DisplayName
        title: >-
          The UserService class shall require a display name of 1 to 100 characters after trimming and shall
          store it trimmed.
        justification: |
          The display name is the human-readable name shown next to comments and answers, so it must not be
          blank, and stray white space has no meaning in it.
        tests:
          - UserService_CreateAsync_DisplayName_IsTrimmedAndLimited

      - id: ReviewCenter-UserService-Password
        title: >-
          The UserService class shall require a password of 12 to 128 characters, without composition rules and
          without trimming it, and shall reject any other password, storing nothing.
        justification: |
          Length is what makes a password hard to guess, and the upper limit keeps the cost of hashing bounded.
          A password with spaces at its ends is a different password, so it must not be altered.
        tests:
          - UserService_CreateAsync_PasswordLength_FollowsPolicy
          - UserService_CreateAsync_MissingPasswordOrWhiteSpacePadding_FollowsLengthRule

      - id: ReviewCenter-UserService-Create
        title: >-
          The UserService class shall create an enabled user, a system administrator only when it is asked to,
          storing a hash of the password and never the password itself.
        justification: |
          A copy of the database must not reveal the passwords, and the system administrator right must never be
          given by default, because it reaches every project.
        tests:
          - UserService_CreateAsync_StoresHashNotPassword
          - UserService_Constructor_NullArguments_Throws

      - id: ReviewCenter-UserService-Authenticate
        title: >-
          The UserService class shall return the user, found by user name in any letter case, when the password
          is right and the user is enabled, and nothing in every other case, taking about the same effort for an
          unknown user name.
        justification: |
          Sign-in must not tell an attacker which part was wrong, so one answer covers an unknown user, a wrong
          password, and a disabled user, and checking a password hash even for an unknown name keeps the time
          taken from revealing which names exist.
        tests:
          - UserService_AuthenticateAsync_RightWrongAndUnknown_OnlyRightSucceeds
          - UserService_AuthenticateAsync_DisabledUser_ReturnsNullUntilEnabled

      - id: ReviewCenter-UserService-Lockout
        title: >-
          The UserService class shall lock a user out for 5 minutes after 5 failed sign-ins in a row, refusing
          even the right password while the lockout lasts without counting that attempt, and shall reset the count
          of failures after a successful sign-in.
        justification: |
          A lockout limits how many passwords can be tried against one account. A success between failures shows
          that the real user is present, so it starts the count again.
        tests:
          - UserService_AuthenticateAsync_FiveFailures_LockForFiveMinutes
          - UserService_AuthenticateAsync_SuccessBetweenFailures_ResetsCounter

      - id: ReviewCenter-UserService-Enabled
        title: >-
          The UserService class shall let a user be disabled and enabled again, and shall not let a disabled user
          sign in.
        justification: |
          Disabling takes access away from a person who has left or is not trusted, without deleting the user
          and so without losing the record of what the user did.
        tests:
          - UserService_AuthenticateAsync_DisabledUser_ReturnsNullUntilEnabled
          - UserService_SetEnabledAsync_SetRoleAsync_LastAdmin_IsProtected

      - id: ReviewCenter-UserService-LastAdmin
        title: >-
          The UserService class shall refuse to disable or demote the last enabled system administrator, while
          allowing it when another enabled system administrator remains.
        justification: |
          Without an enabled system administrator nobody could create projects or manage users and members, and
          the only way out would be to edit the database.
        tests:
          - UserService_SetEnabledAsync_SetRoleAsync_LastAdmin_IsProtected
          - UserService_SetEnabledAsync_OtherAdminDisabled_StillProtectsLastEnabledAdmin
          - UserService_SetSystemAdminAsync_PromoteAndDemote_LastAdminIsKept

      - id: ReviewCenter-UserService-ChangePassword
        title: >-
          The UserService class shall change the password of a user only when the current password is given
          correctly and the new password follows the password rules, counting a wrong current password as a
          failed sign-in for the lockout, and shall, for a user whose second factor is on, refuse the change that
          comes without the proof of the second factor, count that refusal and leave the password and the failure
          counter as they were.
        justification: |
          Whoever sits at a signed-in session must not be able to take over the account without knowing the
          password, and the change must not be a free way to guess it. A change that needs the password alone must
          not be a way round the second factor, so it fails closed.
        tests:
          - UserService_ChangeOwnPasswordAsync_NeedsCurrentPasswordAndPolicy
          - UserService_ChangeOwnPasswordAsync_RepeatedWrongPassword_LocksOut
          - UserService_ChangeOwnPasswordAsync_EnrolledUser_FailsClosedAndKeepsHashAndCounter
          - UserService_ChangeOwnPasswordAsync_EnrolledUser_WrongPasswordCountsAndFeatureOffChanges

      - id: ReviewCenter-UserService-SetPassword
        title: >-
          The UserService class shall set a new password for a user, without knowing the old one, when the new
          password follows the password rules, and shall end a lockout of that user.
        justification: |
          An administrator must be able to help a user who forgot the password, and a new password is a fresh
          start for the account.
        tests:
          - UserService_SetPasswordAsync_NewPassword_WorksAndEndsLockout

      - id: ReviewCenter-UserService-SetSystemAdmin
        title: >-
          The UserService class shall give a user the system administrator right and take it away again, by user
          name, and shall report the user that does not exist as a user not found rule violation.
        justification: |
          The system administrator right reaches every project and every user, so it is the one right that
          changes who may do what everywhere, and it must be changed on purpose, for a known user.
        tests:
          - UserService_SetSystemAdminAsync_PromoteAndDemote_LastAdminIsKept
          - UserService_Changes_UnknownUser_ThrowUserNotFound

      - id: ReviewCenter-UserService-NotFound
        title: >-
          The UserService class shall report a change of a user that does not exist as a user not found rule
          violation.
        justification: |
          A request that names nobody must fail visibly instead of appearing to succeed.
        tests:
          - UserService_Changes_UnknownUser_ThrowUserNotFound

      - id: ReviewCenter-UserService-Audit
        title: >-
          The UserService class shall record creating a user, enabling, disabling, changing the system
          administrator right, setting a password as an administrator, changing one's own password, and unlocking
          a user in the audit trail, in the same transaction as the change, naming the actor (the command line for a
          user created from it), and never recording a password.
        justification: |
          Changes of accounts and rights are what an auditor looks for first, and a password in a history that
          cannot be edited could never be removed.
        tests:
          - UserService_AdministrationEvents_AreRecordedWithoutPasswords
          - UserService_CreateAsync_CommandLineActor_IsRecordedAsCommandLine
          - UserService_UnlockAsync_SystemAdmin_ClearsLockoutAndAudits

      - id: ReviewCenter-UserService-SignInAudit
        title: >-
          The UserService class shall record a failed sign-in (wrong password, disabled account, unknown user), an
          attempt on a locked account, and the lockout of an account in the audit trail on a best-effort basis, with
          the typed user name of an unknown user cleaned and capped to the length of a user name, without recording
          a password, with attempts on a locked account, failures of a disabled account, and failures for an unknown
          user recorded at most once per minute, name and reason, and without ever letting a failure of the trail
          change the result of the sign-in.
        justification: |
          Failed sign-ins show attempts to break in, but the trail must not let an unauthenticated caller fill it
          with text of their choice or with an unlimited number of rows, and a failing trail must not lock
          everybody out. The typed name of an unknown user shows what an attacker tried; it is cleaned to one line
          and capped, so it cannot forge entries. Wrong passwords are bounded by the lockout and are recorded every
          time. A right password on a disabled account is not counted by the lockout, so those failures are
          coalesced like those of locked and unknown accounts.
        tests:
          - UserService_AuthenticateAsync_WrongPassword_CounterUpdateCarriesNoDraft
          - UserService_AuthenticateAsync_UnknownUser_RecordsCleanedCappedTypedNameWithoutPassword
          - UserService_AuthenticateAsync_UnknownUserRepeated_RecordsOneEntryPerWindow
          - UserService_AuthenticateAsync_WrongPassword_RecordsExistingUserWithoutPassword
          - UserService_AuthenticateAsync_DisabledAccount_RecordsAccountDisabled
          - UserService_AuthenticateAsync_DisabledAccountRepeated_RecordsOneEntryPerWindow
          - UserService_AuthenticateAsync_FifthFailure_RecordsLockoutOnce
          - UserService_AuthenticateAsync_LockedAccount_RecordsSignInLockedOncePerWindow
          - UserService_AuthenticateAsync_AuditStoreFails_StillRefusesAndDoesNotThrow
          - UserService_AuthenticateAsync_NoAuditService_Works

      - id: ReviewCenter-UserService-ReauthAudit
        title: >-
          The UserService class shall offer a re-authentication check that works like a sign-in check, including the
          lockout, and shall record its failures (wrong password, disabled account, locked account, unknown user)
          under a re-authentication action that is different from the sign-in action, without recording a
          password, and with failures of a disabled or locked account recorded at most once per minute, account and
          reason.
        justification: |
          A signature asks for the password again, and guessing it there is as dangerous as at sign-in. The trail
          must show where the failed attempt happened, which the sign-in action alone cannot tell. The reason is
          part of the once-per-minute key, so a disabled account and a locked account of one name both show.
        tests:
          - UserService_ReauthenticateAsync_WrongPasswordAndLockedAccount_RecordSignatureReauthFailed
          - UserService_ReauthenticateAsync_DisabledAccountRepeated_RecordsOneSignatureReauthFailedPerWindow
          - UserService_ReauthenticateAsync_DisabledThenLockedInOneMinute_RecordsBothReasons

      - id: ReviewCenter-UserService-TemporaryPassword
        title: >-
          The UserService class shall let a user whose password is a temporary one sign in, so that the user can
          reach the page that replaces it, shall refuse that user a re-authentication for a signature and record the
          refusal in the audit trail with the reason that a password change is pending, shall refuse a new password
          that is the same as the temporary one and keep the temporary state in that case, and shall end the
          temporary state when the user changes the own password.
        justification: |
          A temporary password has been handed over by somebody else, so it is good enough to prove who arrives at
          the password page but not to confirm a signature, which is a personal statement. The state must end only
          when the person has really chosen a password of their own.
        tests:
          - UserService_AuthenticateAsync_TemporaryPassword_SignsIn
          - UserService_ReauthenticateAsync_TemporaryPassword_IsRefusedAndAudited
          - UserService_ChangeOwnPasswordAsync_NewPassword_ClearsTheFlagAndGivesAccess
          - UserService_ChangeOwnPasswordAsync_SameAsTemporary_IsRefusedAndKeepsTheFlag

      - id: ReviewCenter-UserService-AdminPasswordIsTemporary
        title: >-
          The UserService class shall make the password that a system administrator sets for another user a
          temporary one, so that the user has to change it at the next sign-in, also for a user who had no temporary
          password before, shall not do so when the actor sets the password of the own account, and shall keep an
          account of a provider without a password.
        justification: |
          An administrator who types a password knows it, so the user must replace it before using the account. A
          person who sets the own password has chosen it and needs no second change. The rule is in the service, so
          every caller gets it.
        tests:
          - UserService_SetPasswordAsync_ByAdministrator_MakesThePasswordTemporaryExceptOwn
          - UserService_SetPasswordAsync_OtherUserOrOwn_OnlyOtherForcesAChange
          - UserService_SetPasswordAsync_OwnRow_DoesNotForceAChange
          - UserService_SetPasswordAsync_ApiTokenActorOrExternalUser_ForcesAChangeOrIsRefused

      - id: ReviewCenter-UserService-LastSignIn
        title: >-
          The UserService class shall store the time of the last successful sign-in of a user, by password without
          a second factor, by the completed second factor, and by a provider, and shall store nothing for a failed
          sign-in, a password step that still waits for the second factor, or a re-authentication for a signature.
        justification: |
          An administrator who reviews who still has access needs to see which accounts are not used any more. Only a
          sign-in that opened a session counts, so a guessed password cannot make an unused account look active.
        tests:
          - UserService_AuthenticatePasswordAsync_SuccessOnly_RecordsLastSignIn
          - UserService_SignInExternalAsync_AcceptedOnly_RecordsLastSignIn
          - TotpService_CompleteSignInAsync_Success_RecordsLastSignInOnlyThen
          - SignIn_Login_ValidCredentials_SetsSafeSessionCookieAndRedirects
          - TotpSignIn_CodeStep_RightCode_SignsInAndRedirects
          - OidcSignIn_FirstSignIn_CreatesPlainAccountAndSignsIn

      - id: ReviewCenter-UserService-LockedStatus
        title: >-
          The UserService class shall offer a check that tells whether a user is locked out at a given time, which is
          the case until the end of the lockout and no longer.
        justification: |
          The page that shows the lockout and the sign-in that refuses a locked user must use one rule, or the page
          could show a user as free who cannot sign in.
        tests:
          - UserService_IsLocked_Lockout_IsLockedUntilItsEnd

      - id: ReviewCenter-UserService-Unlock
        title: >-
          The UserService class shall let a system administrator end the lockout of a user by user identifier,
          clearing the count of failed sign-ins, record that in the audit trail as an unlock of the named user,
          refuse every other actor, and report an unknown user as a user not found rule violation.
        justification: |
          A person who mistyped the password has to wait out the lockout unless an administrator can end it. The
          right is the administrator's alone, and the trail shows who used it.
        tests:
          - UserService_UnlockAsync_SystemAdmin_ClearsLockoutAndAudits
          - UserService_UnlockAsync_NotAllowedOrUnknown_IsRefused

      - id: ReviewCenter-UserService-ExternalSignIn
        title: >-
          The UserService class shall find the account of an identity at a provider by the issuer and the subject
          only, never by a name or an e-mail address, create the account on the first sign-in as an enabled user who is
          not a system administrator and has no project, refuse the sign-in of a disabled account, refuse a missing
          identity or one that is longer than the stored limits, and record the creation in the audit trail.
        justification: |
          A name that a person chooses at the provider is no proof of who they are, so only the pair that the provider
          guarantees may find an account. A new person has no rights until somebody who may give them does so, and the
          limits keep a hostile provider answer out of the database.
        tests:
          - UserService_SignInExternalAsync_FirstThenSecond_CreatesOnceAndMatches
          - UserService_SignInExternalAsync_MatchesOnlyByIssuerAndSubject
          - UserService_SignInExternalAsync_MissingIdentity_IsInvalid
          - UserService_SignInExternalAsync_IdentityLengthLimits_AreEnforced
          - UserService_SignInExternalAsync_DisabledAccount_IsRefused

      - id: ReviewCenter-UserService-ExternalCreate
        title: >-
          The UserService class shall give the account of a provider a display name that is cleaned of control
          characters and cut to the limit, and a user name that is made from the suggestion of the provider by keeping
          only the allowed characters and the length limit, and that is unique.
        justification: |
          The names come from another system and may hold anything, so they are cleaned before they are stored and
          shown.
        tests:
          - UserService_SignInExternalAsync_Candidate_IsReducedToAValidUsername
          - UserService_SignInExternalAsync_DisplayName_IsSanitized
          - UserService_SignInExternalAsync_LongDisplayName_IsBounded

      - id: ReviewCenter-UserService-UsernameCollision
        title: >-
          The UserService class shall, when the user name made for a new account of a provider is taken, add a number
          to it, and when no such name is free use a generated name from the identity, numbered the same way when a
          local account holds that name too, so that the sign-in does not fail because of a name and never uses the
          account that holds the name.
        justification: |
          Two people can have the same name at a provider, and a person can have the name of a local account, even the
          generated one. Neither may be refused for that, and neither may get another person's account.
        tests:
          - UserService_SignInExternalAsync_MatchesOnlyByIssuerAndSubject
          - UserService_SignInExternalAsync_AllNamesTaken_UsesNameFromIdentity
          - UserService_SignInExternalAsync_OnlyIdentityNameTaken_UsesFirstVariant
          - UserService_SignInExternalAsync_IdentityNameTakenByLocalAccount_UsesNumberedVariant

      - id: ReviewCenter-UserService-ExternalNoPassword
        title: >-
          The UserService class shall refuse to authenticate, to confirm for a signature, to change the password of,
          and to set the password of an account of a provider, so that the account has no password at all.
        justification: |
          An account that is managed by a provider must not have a second way in, which could be guessed or set by
          somebody who does not pass the rules of the provider.
        tests:
          - UserService_ExternalAccount_EveryPasswordPathIsRefused

      - id: ReviewCenter-UserService-SecondFactorRequired
        title: >-
          The UserService class shall check the password of an account with a second factor without opening a session
          and report that the code is still required, shall refuse a disabled account, shall not clear the counter of
          wrong attempts for the password alone, and shall let the older sign-in and confirmation paths fail for such
          an account, so that no path can sign in with the password alone.
        justification: |
          A password step that signs in would make the second factor optional for the attacker. The step is split so
          that the page can ask for the code, and the old paths are closed so that they cannot be used to avoid it.
        tests:
          - UserService_AuthenticatePasswordAsync_EnrolledUser_AsksForTheSecondFactorAndKeepsTheCounter
          - UserService_AuthenticateAndReauthenticate_EnrolledUser_FailClosed
          - UserService_AuthenticateAsync_NoSecondFactorOrFeatureOff_SignsInWithThePassword
          - UserService_AuthenticatePasswordAsync_WithoutTotpStore_NeverAsksForTheSecondFactor
          - UserService_AuthenticatePasswordAsync_WrongPassword_LooksTheSameWithAndWithoutSecondFactor
          - UserService_AuthenticatePasswordAsync_DisabledEnrolledUser_IsRefused

      - id: ReviewCenter-UserService-SecondFactorLockout
        title: >-
          The UserService class shall count a wrong code with the wrong passwords in one counter with one lockout, let
          the second factor ask whether an account is locked, and refuse the check of a password for a locked account.
        justification: |
          The counter is kept with the user, so the codes and the passwords share the five attempts, and a locked
          account must not even have its password checked.
        tests:
          - UserService_ConfirmPasswordAsync_ChecksThePasswordOnly
          - UserService_ConfirmPasswordAsync_LockedAccount_IsRefused
