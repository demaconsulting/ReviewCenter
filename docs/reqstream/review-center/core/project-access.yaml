---
# Software Unit Requirements for the ProjectAccess Class
#
# The ProjectAccess class is the single place that decides who may see, work in, administer, and audit a project.
# It reads the user and the memberships fresh on every call, so taking rights away works at once.

sections:
  - title: ProjectAccess Unit Requirements
    requirements:
      - id: ReviewCenter-ProjectAccess-Visibility
        title: >-
          The ProjectAccess class shall let a user see only the projects the user is a member of, and administer
          only the projects the user is a project administrator of, shall let neither a non-member nor a
          project the user does not belong to be seen or administered, and shall treat a member whose stored role
          is not defined as a non-member, so that such a member sees nothing.
        justification: |
          Reviews of one body of work must not be readable by people who have nothing to do with it. One rule in
          one place keeps every page, route, and service in agreement about who may see what. A role that no code
          defines must never gain access, so the answer fails closed.
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectAccess_Matrix_UndefinedRole_FailsClosedAsNoAccess

      - id: ReviewCenter-ProjectAccess-SystemAdmin
        title: >-
          The ProjectAccess class shall let an enabled system administrator see and administer every project that
          exists, and no project that does not exist.
        justification: |
          A system administrator manages the whole installation and must be able to reach every project, for
          example to add its first members. A project that does not exist has nothing to see, whoever asks.
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectAccess_Matrix_AnonymousCommandLineAndMissingProject_GetNothing

      - id: ReviewCenter-ProjectAccess-NoAccount
        title: >-
          The ProjectAccess class shall give no access at all to a missing actor, to the command line, to a user
          name that no user has, and to a disabled user, even when that user has a membership or the system
          administrator right.
        justification: |
          Access follows a live account. An actor that is not an enabled user, including the command line which
          acts outside any project, must see nothing and be treated like a stranger.
        tests:
          - ProjectAccess_Matrix_ActorKinds_GetTheirRights
          - ProjectAccess_Matrix_AnonymousCommandLineAndMissingProject_GetNothing

      - id: ReviewCenter-ProjectAccess-NotFound
        title: >-
          The ProjectAccess class shall refuse, when it is asked to require access, a project that is not visible
          to the actor with the same project not found failure and the same message as a project that does not
          exist, shall refuse a project administrator action by a member who is no project administrator with the
          actor not allowed failure, and shall refuse a system administrator action by anyone else with the actor
          not allowed failure.
        justification: |
          A different answer for a hidden project and a missing one would let anybody probe which projects exist.
          A member sees the project already, so telling that member that an action is not allowed leaks nothing.
        tests:
          - ProjectAccess_Require_HiddenMissingAndNotAdministrator_FailWithTheRightRule
          - ReviewOperations_NotAMember_AreRefusedAsAMissingProjectAndChangeNothing
          - Repositories_OfAnotherProject_CannotBeUsedOrChanged

      - id: ReviewCenter-ProjectAccess-Contribute
        title: >-
          The ProjectAccess class shall let a member whose role is User or ProjectAdmin and an enabled system
          administrator work in a project, shall let a member whose role is Auditor see the project but not work
          in it, shall treat a stored role that is not defined as no membership at all, and shall refuse, when it
          is asked to require the right to work, a project that is not visible with the project not found failure
          and a member who may only read with the actor not allowed failure.
        justification: |
          A read-only oversight role must be enforced in one place, or every service would have to remember it.
          The member already sees the project, so telling a read-only member that the action is not allowed
          leaks nothing, and a role that no code defines must never gain any power.
        tests:
          - ProjectAccess_Matrix_ViewContributeAdministerAudit_EachActorKind_GetTheirRights
          - ProjectAccess_Require_ContributeAndAudit_FailWithTheRightRule
          - ProjectAccess_Revocation_RoleChangedBetweenCalls_ContributeAndAuditFollowTheNextCall
          - ProjectAccess_Matrix_UndefinedRole_FailsClosedAsNoAccess
          - ReviewOperations_Auditor_AreRefusedAsNotAllowedAndChangeNothing
          - ReviewOperations_ProjectAdminAndSystemAdmin_AreAllowed
          - ReviewReads_Auditor_AreAllowed
          - AccessCoverage_PublicActorMethods_AreAllClassified
          - ProjectViewGuard_GuardContribute_Member_ReturnsTrueWithoutCallback
          - ProjectViewGuard_GuardContribute_Auditor_ReturnsFalseWithoutCallback
          - ProjectViewGuard_GuardContribute_NonMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardContribute_NobodySignedIn_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardContribute_RevokedBetweenLookups_IsLostNotReadOnly
          - ProjectViewGuard_GuardContribute_MemberRevokedAfterFirstLookup_FollowsTheFirstAnswer

      - id: ReviewCenter-ProjectAccess-AuditAccess
        title: >-
          The ProjectAccess class shall let a project administrator, a member whose role is Auditor, and an
          enabled system administrator read the audit trail of a project, shall refuse any other member with the
          actor not allowed failure, and shall refuse anybody who cannot see the project with the project not
          found failure.
        justification: |
          The audit trail records what everybody did in the project, so it is for those who manage or oversee the
          project and not for every member. A hidden project must not reveal that it exists.
        tests:
          - ProjectAccess_Matrix_ViewContributeAdministerAudit_EachActorKind_GetTheirRights
          - ProjectAccess_Require_ContributeAndAudit_FailWithTheRightRule
          - ProjectViewGuard_GuardAudit_AuditorAndProjectAdmin_ReturnTrueWithoutCallback
          - ProjectViewGuard_GuardAudit_PlainMember_ReturnsFalseAndCallsBackOnce
          - ProjectViewGuard_GuardAudit_NobodySignedIn_ReturnsFalseAndCallsBackOnce

      - id: ReviewCenter-ProjectAccess-TemporaryPassword
        title: >-
          The ProjectAccess class shall give no access at all to a user whose password is still a temporary one,
          even when that user has a membership or the system administrator right, until the user has chosen a new
          password.
        justification: |
          A temporary password has been handed over by somebody else and may be known to more than one person.
          It may prove who is signing in only well enough to reach the page that replaces it, so until then the
          account must neither see nor change anything in any project.
        tests:
          - ProjectAccess_TemporaryPassword_GivesNoAccessAtAll
          - UserService_ChangeOwnPasswordAsync_NewPassword_ClearsTheFlagAndGivesAccess

      - id: ReviewCenter-ProjectAccess-Revocation
        title: >-
          The ProjectAccess class shall look the user and the membership up again on every call and keep nothing
          between calls, so that a removed membership, a lowered project role, and a disabled account change the
          next answer.
        justification: |
          Taking rights away must work at once, not after a cache expires or a session ends, because it is done
          exactly when somebody must no longer have them.
        tests:
          - ProjectAccess_Revocation_TakesEffectOnTheNextCall

      - id: ReviewCenter-ProjectAccess-TokenOwner
        title: >-
          The ProjectAccess class shall give an actor that came through a personal access token exactly the access
          of the owner of the token, found by the user name the actor carries, and no more.
        justification: |
          A script acting for a user must neither see more than the user nor keep seeing what the user has lost,
          and inheriting the memberships through the user name needs no separate list of rights for tokens.
        tests:
          - ProjectAccess_TokenActor_HasTheMembershipsOfItsOwner

      - id: ReviewCenter-ProjectAccess-List
        title: >-
          The ProjectAccess class shall list the projects an actor may see, which are all projects for an enabled
          system administrator, the projects of the memberships for an enabled user, and none for any other actor.
        justification: |
          The project list is the first page of the application, and a list that showed a hidden project would
          disclose its existence and name.
        tests:
          - ProjectAccess_ListVisibleProjectsAsync_EachKind_SeesOnlyItsProjects
          - ProjectAccess_Matrix_AnonymousCommandLineAndMissingProject_GetNothing

      - id: ReviewCenter-ProjectAccess-Dependencies
        title: >-
          The ProjectAccess class shall refuse to be created without the user store or the project store it reads.
        justification: |
          An access decision made without its data could only guess, so a missing dependency must fail when the
          service is created and not when the first user is judged.
        tests:
          - ProjectAccess_Constructor_NullArguments_Throws
