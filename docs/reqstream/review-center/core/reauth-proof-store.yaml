---
# Software Unit Requirements for the ReauthProofStore Class
#
# The ReauthProofStore class remembers, for a short time and in memory, that a user of an identity provider has just
# confirmed their identity for one signature, so that the signature can use the confirmation once.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: ReauthProofStore Unit Requirements
    requirements:
      - id: ReviewCenter-ReauthProofStore-SingleUse
        title: >-
          The ReauthProofStore class shall let a confirmation of identity be consumed once.
        justification: |
          A confirmation that could be used twice would let one login at the provider sign more than one slot, or the
          same slot again after the record changed.
        tests:
          - ReauthProofStore_TryConsume_SucceedsExactlyOnce

      - id: ReviewCenter-ReauthProofStore-SingleUse-Spent
        title: >-
          The ReauthProofStore class shall refuse every later attempt to consume a confirmation that was already
          consumed.
        justification: |
          Each signature needs its own confirmation.
        tests:
          - ReauthProofStore_TryConsume_SucceedsExactlyOnce

      - id: ReviewCenter-ReauthProofStore-SingleUse-Reissue
        title: >-
          The ReauthProofStore class shall let a confirmation that was consumed be consumed again once a new
          confirmation was issued for the same user, project, review, and slot.
        justification: |
          A new login at the provider must be able to confirm the next signature.
        tests:
          - ReauthProofStore_Issue_AfterConsume_AllowsConsumingAgain

      - id: ReviewCenter-ReauthProofStore-Binding
        title: >-
          The ReauthProofStore class shall accept a confirmation only for the user, project, review, and slot it was
          issued for.
        justification: |
          A confirmation for one slot of one review must not sign another slot, another review, or for another user.
        tests:
          - ReauthProofStore_OtherBinding_IsRefusedAndKeepsTheProof

      - id: ReviewCenter-ReauthProofStore-Binding-Kept
        title: >-
          The ReauthProofStore class shall keep a confirmation when another user, project, review, or slot tries to
          consume it.
        justification: |
          An attempt for something else must not use up the confirmation of its owner.
        tests:
          - ReauthProofStore_OtherBinding_IsRefusedAndKeepsTheProof

      - id: ReviewCenter-ReauthProofStore-Binding-Clock
        title: >-
          The ReauthProofStore class shall refuse to be created without a clock.
        justification: |
          The lifetime of a confirmation cannot be applied without a clock, so a missing clock must fail when the
          store is created.
        tests:
          - ReauthProofStore_NullArguments_Throw

      - id: ReviewCenter-ReauthProofStore-Binding-ReviewId
        title: >-
          The ReauthProofStore class shall refuse a missing review identifier when a confirmation is issued, checked,
          or consumed.
        justification: |
          A confirmation is bound to a review, so a missing review must fail early instead of matching by accident.
        tests:
          - ReauthProofStore_NullArguments_Throw

      - id: ReviewCenter-ReauthProofStore-Expiry
        title: >-
          The ReauthProofStore class shall treat a confirmation as ended once its lifetime has passed since it was
          issued.
        justification: |
          A confirmation is proof that the person was at the keyboard a moment ago. It must not be good for a day,
          when somebody else may sit there.
        tests:
          - ReauthProofStore_Expiry_EndsTheProofAtTheLifetime

      - id: ReviewCenter-ReauthProofStore-Expiry-Lifetime
        title: >-
          The ReauthProofStore class shall use a lifetime of five minutes for a confirmation.
        justification: |
          The lifetime must be long enough to finish a signature and short enough that the proof stays fresh.
        tests:
          - ReauthProofStore_Limits_AreFiveMinutesAndTenThousand

      - id: ReviewCenter-ReauthProofStore-Expiry-Renewed
        title: >-
          The ReauthProofStore class shall restart the lifetime of a confirmation when a new confirmation is issued
          for the same user, project, review, and slot.
        justification: |
          The newest confirmation is the one that counts.
        tests:
          - ReauthProofStore_IssueAgain_RestartsTheLifetime

      - id: ReviewCenter-ReauthProofStore-Bounded
        title: >-
          The ReauthProofStore class shall keep at most 10000 confirmations.
        justification: |
          Anybody who can sign in at the provider can make a confirmation, so the memory it takes must have a limit
          that a flood cannot pass.
        tests:
          - ReauthProofStore_Full_DropsExpiredThenOldest
          - ReauthProofStore_Limits_AreFiveMinutesAndTenThousand

      - id: ReviewCenter-ReauthProofStore-Bounded-Oldest
        title: >-
          The ReauthProofStore class shall drop the oldest confirmation to make room for a new one when it is full.
        justification: |
          The store must keep accepting new confirmations under a flood.
        tests:
          - ReauthProofStore_Full_DropsExpiredThenOldest

      - id: ReviewCenter-ReauthProofStore-Bounded-Ended
        title: >-
          The ReauthProofStore class shall not drop a live confirmation to make room for a new one while an ended
          confirmation is stored.
        justification: |
          An ended confirmation is of no use, so it must not push out a live one.
        tests:
          - ReauthProofStore_Full_EndedProofsMakeRoomAndLiveOnesStay
