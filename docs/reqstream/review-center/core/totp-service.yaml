---
# Software Unit Requirements for the TotpService Class
#
# The TotpService class holds the rules of the optional second factor of local accounts: enrollment, the second step
# of the sign-in, the code at the time of a signature, recovery codes, removal by the owner, and the reset by a system
# administrator.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: TotpService Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # Enrollment
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Enrollment
        title: >-
          The TotpService class shall return a new secret, as text and as an authenticator address, when a signed-in
          user of a local account starts the setup of a second factor with the current password.
        justification: |
          Starting the setup is the first step of binding an authenticator app to the account.
        tests:
          - TotpService_BeginEnrollmentAsync_ValidPassword_ReturnsSecretAndUriButIsNotActive

      - id: ReviewCenter-TotpService-Enrollment-Pending
        title: >-
          The TotpService class shall keep a started setup pending, so that the password alone still signs in until the
          setup is confirmed.
        justification: |
          A half-finished setup must not lock the person out of the account.
        tests:
          - TotpService_BeginEnrollmentAsync_ValidPassword_ReturnsSecretAndUriButIsNotActive

      - id: ReviewCenter-TotpService-Enrollment-Replace
        title: >-
          The TotpService class shall replace the pending secret with a new one when the setup is started again, so that
          a code of the old secret no longer confirms.
        justification: |
          A QR code that was lost or seen by somebody else must not stay valid.
        tests:
          - TotpService_BeginEnrollmentAsync_Twice_ReplacesThePendingSecret

      - id: ReviewCenter-TotpService-Enrollment-Password
        title: >-
          The TotpService class shall refuse to start the setup when the current password is wrong.
        justification: |
          A stolen session must not be able to bind the app of an attacker to the account.
        tests:
          - TotpService_BeginEnrollmentAsync_WrongPassword_ThrowsAndStoresNothing

      - id: ReviewCenter-TotpService-Enrollment-PasswordNothingStored
        title: >-
          The TotpService class shall store no secret when the setup is refused for a wrong password.
        justification: |
          A refused start must leave nothing behind that could be confirmed later.
        tests:
          - TotpService_BeginEnrollmentAsync_WrongPassword_ThrowsAndStoresNothing

      - id: ReviewCenter-TotpService-Enrollment-AlreadyOn
        title: >-
          The TotpService class shall refuse to start the setup for a user whose second factor is already on.
        justification: |
          A user has one active second factor, and a new setup must not replace a working one by accident.
        tests:
          - TotpService_BeginEnrollmentAsync_AlreadyEnrolled_ThrowsTotpAlreadyEnrolled

      - id: ReviewCenter-TotpService-Enrollment-Confirm
        title: >-
          The TotpService class shall turn the second factor on when the user confirms a pending setup with a right code
          from the app within 15 minutes.
        justification: |
          A right code proves that the app holds the secret; a factor that is not proven to work would lock the person
          out at the next sign-in.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ValidCode_ActivatesAndIssuesTenRecoveryCodes

      - id: ReviewCenter-TotpService-Enrollment-Window
        title: >-
          The TotpService class shall accept the confirmation of a setup exactly 15 minutes after it was started.
        justification: |
          The limit must be exact, so that a person who needs the whole time is not refused and the rule is not
          stricter than it says.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ExactlyFifteenMinutes_Confirms

      - id: ReviewCenter-TotpService-Enrollment-Expired
        title: >-
          The TotpService class shall refuse the confirmation of a setup that was started more than 15 minutes ago.
        justification: |
          A secret that stayed pending for long may have been seen by somebody else.
        tests:
          - TotpService_ConfirmEnrollmentAsync_AfterFifteenMinutes_ThrowsTotpEnrollmentExpired

      - id: ReviewCenter-TotpService-Enrollment-WrongCode
        title: >-
          The TotpService class shall refuse the confirmation of a setup with a wrong or a malformed code, with the
          same message for both.
        justification: |
          The answer must not help a person who guesses to tell a near miss from a bad format.
        tests:
          - TotpService_ConfirmEnrollmentAsync_WrongCode_ThrowsAndStaysPending

      - id: ReviewCenter-TotpService-Enrollment-WrongCodePending
        title: >-
          The TotpService class shall keep the setup pending after a wrong code, so that the right code still confirms
          it.
        justification: |
          A typing error must not force the person to start the setup again.
        tests:
          - TotpService_ConfirmEnrollmentAsync_WrongCode_ThrowsAndStaysPending

      - id: ReviewCenter-TotpService-Enrollment-NothingStarted
        title: >-
          The TotpService class shall refuse the confirmation of a setup when none was started.
        justification: |
          There is nothing to confirm, and a code must not create an enrollment out of nothing.
        tests:
          - TotpService_ConfirmEnrollmentAsync_NothingStarted_ThrowsTotpNotEnrolled

      - id: ReviewCenter-TotpService-Enrollment-RecoveryCodes
        title: >-
          The TotpService class shall return ten recovery codes in the answer that confirms the setup.
        justification: |
          The person needs the way back in at the moment the second factor is turned on.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ValidCode_ActivatesAndIssuesTenRecoveryCodes

      - id: ReviewCenter-TotpService-Enrollment-Cancel
        title: >-
          The TotpService class shall remove a pending setup when the user gives it up.
        justification: |
          Giving up must leave no secret behind that could be confirmed later.
        tests:
          - TotpService_CancelEnrollmentAsync_PendingOnly_RemovesPendingKeepsConfirmed

      - id: ReviewCenter-TotpService-Enrollment-CancelKeepsOn
        title: >-
          The TotpService class shall leave a confirmed second factor alone when the user gives up a setup.
        justification: |
          Giving up a new setup must not remove a second factor that already works.
        tests:
          - TotpService_CancelEnrollmentAsync_PendingOnly_RemovesPendingKeepsConfirmed

      # ---------------------------------------------------------------------------------------------------------------
      # Availability
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Availability
        title: >-
          The TotpService class shall refuse the setup of a second factor for an account of an identity provider.
        justification: |
          A provider owns the second factor of its accounts, so the product must not add a second one.
        tests:
          - TotpService_BeginEnrollmentAsync_ExternalAccount_ThrowsTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-TemporaryPassword
        title: >-
          The TotpService class shall refuse the setup of a second factor for an account with a temporary password.
        justification: |
          A temporary password must be replaced before anything else is set up.
        tests:
          - TotpService_BeginEnrollmentAsync_TemporaryPassword_ThrowsTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-ApiToken
        title: >-
          The TotpService class shall refuse the setup of a second factor for a request that comes with an API token.
        justification: |
          A token can never act for a person, so it must not bind an app to the account.
        tests:
          - TotpService_BeginEnrollmentAsync_ApiTokenActor_ThrowsTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-FeatureOff
        title: >-
          The TotpService class shall refuse the setup of a second factor while the feature is switched off.
        justification: |
          Switching the feature off must close the door for new enrollments.
        tests:
          - TotpService_BeginEnrollmentAsync_FeatureDisabled_ThrowsTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-Message
        title: >-
          The TotpService class shall give the same message, that a second factor is not available for the account,
          whichever reason makes the setup of a second factor unavailable.
        justification: |
          The user must learn why the setup is refused, without detail that helps an attacker.
        tests:
          - TotpService_BeginEnrollmentAsync_ExternalAccount_ThrowsTotpNotAvailable
          - TotpService_BeginEnrollmentAsync_TemporaryPassword_ThrowsTotpNotAvailable
          - TotpService_BeginEnrollmentAsync_ApiTokenActor_ThrowsTotpNotAvailable
          - TotpService_BeginEnrollmentAsync_FeatureDisabled_ThrowsTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-OperationsApiToken
        title: >-
          The TotpService class shall refuse each account operation of the second factor, namely the confirmation, the
          cancellation, the removal, and the issue of new recovery codes, for a request that comes with an API token.
        justification: |
          A token must not use any operation of the second factor. The four operations share one rule, shown row by
          row by the tests.
        tests:
          - TotpService_AccountOperations_ApiTokenActor_ThrowTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-OperationsFeatureOff
        title: >-
          The TotpService class shall refuse each account operation of the second factor, namely the confirmation, the
          cancellation, the removal, and the issue of new recovery codes, while the feature is switched off.
        justification: |
          A switched-off feature must refuse every operation, not only the setup. The four operations share one rule,
          shown row by row by the tests.
        tests:
          - TotpService_AccountOperations_FeatureDisabled_ThrowTotpNotAvailable

      - id: ReviewCenter-TotpService-Availability-Status
        title: >-
          The TotpService class shall report a user for whom a second factor is not available as unable to set one up.
        justification: |
          The account page must hide the setup for a user who cannot use it.
        tests:
          - TotpService_GetStatusAsync_ApiTokenActor_IsNotAvailable
          - TotpService_BeginEnrollmentAsync_FeatureDisabled_ThrowsTotpNotAvailable
          - TotpService_GetStatusAsync_ExternalOrTemporaryPasswordAccount_IsNotAvailable

      - id: ReviewCenter-TotpService-Availability-NullArguments
        title: >-
          The TotpService class shall refuse a missing argument with an argument-null error.
        justification: |
          Misuse by a caller must fail loudly instead of acting on missing data.
        tests:
          - TotpService_NullArguments_Throw

      # ---------------------------------------------------------------------------------------------------------------
      # Second step of the sign-in
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Verify
        title: >-
          The TotpService class shall complete the second step of a sign-in with a code of the current 30 second step or
          of the step before or after it.
        justification: |
          The clocks of phones run a little fast or slow, so one step of tolerance on each side is needed.
        tests:
          - TotpService_CompleteSignInAsync_CodeWithinTheWindow_SignsIn

      - id: ReviewCenter-TotpService-Verify-OutsideWindow
        title: >-
          The TotpService class shall refuse a code that is two or more steps away from the current step.
        justification: |
          The window must stay narrow, or the number of codes that work grows.
        tests:
          - TotpService_CompleteSignInAsync_WindowAndOrder_AcceptsPlusMinusOneStepOnlyOnceForward

      - id: ReviewCenter-TotpService-Verify-User
        title: >-
          The TotpService class shall sign in the user of the pending challenge, not a user named by the request.
        justification: |
          The request carries no user name, so a code of another person can never sign in as somebody else.
        tests:
          - TotpService_CompleteSignInAsync_TwoUsers_SignsInTheUserOfTheChallenge

      - id: ReviewCenter-TotpService-Verify-Refusal
        title: >-
          The TotpService class shall give the same failed outcome, without a user, for a wrong, a reused, an empty, and
          a malformed code.
        justification: |
          The answer must not tell a person who guesses which of the cases it was.
        tests:
          - TotpService_CompleteSignInAsync_WrongReusedMalformed_AreIndistinguishable

      - id: ReviewCenter-TotpService-Verify-ChallengeInvalid
        title: >-
          The TotpService class shall answer a missing, unknown, used, expired, or foreign-client challenge with the
          outcome "challenge invalid" and no user.
        justification: |
          A challenge works once, from its own client, while it lives, and the answer must not tell which rule failed.
        tests:
          - TotpService_CompleteSignInAsync_BadChallenge_IsChallengeInvalid

      - id: ReviewCenter-TotpService-Verify-DisabledUser
        title: >-
          The TotpService class shall answer a challenge of a user who was disabled meanwhile with the outcome
          "challenge invalid".
        justification: |
          A disabled account must not finish a sign-in that it started before it was disabled.
        tests:
          - TotpService_CompleteSignInAsync_DisabledUser_IsChallengeInvalid

      - id: ReviewCenter-TotpService-Verify-ForeignClientKept
        title: >-
          The TotpService class shall keep a challenge that was tried from another client address, so that its own
          client can still use it.
        justification: |
          Somebody else who holds the token must not be able to spend the challenge of the person.
        tests:
          - TotpService_CompleteSignInAsync_ForeignClient_DoesNotSpendTheChallenge

      - id: ReviewCenter-TotpService-Verify-FeatureOff
        title: >-
          The TotpService class shall answer every challenge with the outcome "challenge invalid" while the feature is
          switched off.
        justification: |
          A switched-off feature makes an existing enrollment inert, so no second step is offered.
        tests:
          - TotpService_CompleteSignInAsync_FeatureDisabled_IsChallengeInvalidAndPasswordAloneSignsIn

      - id: ReviewCenter-TotpService-Verify-UnreadableSecret
        title: >-
          The TotpService class shall refuse a six digit code like a wrong one when the stored secret cannot be read.
        justification: |
          A lost key ring must not crash the sign-in or let a code pass.
        tests:
          - TotpService_CompleteSignInAsync_UnreadableSecret_RefusesCodesButRecoveryStillWorks

      - id: ReviewCenter-TotpService-Verify-Invalidated
        title: >-
          The TotpService class shall not give back a challenge that was ended while its code was being checked.
        justification: |
          A sign-in that was ended meanwhile, for example by a removal of the second factor, must not come back to life.
        tests:
          - TotpService_CompleteSignInAsync_UserInvalidatedWhileCodeIsChecked_DoesNotResurrectTheChallenge

      - id: ReviewCenter-TotpService-Verify-LastSignIn
        title: >-
          The TotpService class shall store the time of the last sign-in only when the second step succeeds, and not for
          a failed code.
        justification: |
          A guessed code must not make an account look active.
        tests:
          - TotpService_CompleteSignInAsync_Success_RecordsLastSignInOnlyThen

      # ---------------------------------------------------------------------------------------------------------------
      # Replay protection
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Replay
        title: >-
          The TotpService class shall accept a code only when its time step is later than the step of the last accepted
          code.
        justification: |
          A code that somebody saw over the shoulder must work once, not again within its window.
        tests:
          - TotpService_CompleteSignInAsync_WindowAndOrder_AcceptsPlusMinusOneStepOnlyOnceForward

      - id: ReviewCenter-TotpService-Replay-Concurrent
        title: >-
          The TotpService class shall let exactly one of several requests that present the same code at the same moment
          succeed.
        justification: |
          Two requests that race with the same code must not both pass.
        tests:
          - TotpService_CompleteSignInAsync_ConcurrentSameCode_ExactlyOneSucceeds

      - id: ReviewCenter-TotpService-Replay-Enrollment
        title: >-
          The TotpService class shall refuse the code that confirmed the setup when it is used to sign in.
        justification: |
          The confirming code was typed once already and may have been seen.
        tests:
          - TotpService_CompleteSignInAsync_CodeOfTheEnrollment_IsAReplay

      # ---------------------------------------------------------------------------------------------------------------
      # Recovery codes
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-RecoveryCodes
        title: >-
          The TotpService class shall create each set of recovery codes as ten distinct codes.
        justification: |
          A person who loses the phone needs several ways back in, and two equal codes would be one way only.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ValidCode_ActivatesAndIssuesTenRecoveryCodes
          - TotpService_RegenerateRecoveryCodesAsync_PasswordAndCode_ReplacesTheCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-Strength
        title: >-
          The TotpService class shall write each recovery code as four groups of four symbols from an alphabet of 32
          symbols, separated by hyphens.
        justification: |
          Sixteen symbols of 5 bits each are long enough that a code cannot be guessed, and four groups are easy to copy
          by hand.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ValidCode_ActivatesAndIssuesTenRecoveryCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-Hashed
        title: >-
          The TotpService class shall store only a hash of each recovery code.
        justification: |
          A leaked table must not hold codes that can be used.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ValidCode_ActivatesAndIssuesTenRecoveryCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-SignIn
        title: >-
          The TotpService class shall accept an unused recovery code in place of an authenticator code at the second
          step of a sign-in.
        justification: |
          A person without the phone needs a second way to finish the sign-in.
        tests:
          - TotpService_CompleteSignInAsync_RecoveryCode_WorksOnceAndIsAudited

      - id: ReviewCenter-TotpService-RecoveryCodes-Spelling
        title: >-
          The TotpService class shall accept a recovery code regardless of case, spaces, and hyphens.
        justification: |
          People copy a printed code by hand, so a harmless difference in the spelling must not refuse it.
        tests:
          - TotpService_CompleteSignInAsync_RecoveryCodeSpellings_AreAccepted

      - id: ReviewCenter-TotpService-RecoveryCodes-Once
        title: >-
          The TotpService class shall accept each recovery code only once.
        justification: |
          A spent code must stay spent, or a seen code would stay a way in.
        tests:
          - TotpService_CompleteSignInAsync_RecoveryCode_WorksOnceAndIsAudited

      - id: ReviewCenter-TotpService-RecoveryCodes-Concurrent
        title: >-
          The TotpService class shall let exactly one of several requests that present the same recovery code at the
          same moment succeed.
        justification: |
          Two requests that race with the same code must not both pass.
        tests:
          - TotpService_CompleteSignInAsync_ConcurrentSameRecoveryCode_ExactlyOneSucceeds

      - id: ReviewCenter-TotpService-RecoveryCodes-OtherUser
        title: >-
          The TotpService class shall refuse the recovery code of another user.
        justification: |
          A code belongs to one account only.
        tests:
          - TotpService_CompleteSignInAsync_RecoveryCodeOfAnotherUser_IsRefused

      - id: ReviewCenter-TotpService-RecoveryCodes-Replace
        title: >-
          The TotpService class shall replace all recovery codes by ten new codes when the user presents the current
          password and a right code from the app.
        justification: |
          A person who suspects that the codes were seen needs to start again with a new set.
        tests:
          - TotpService_RegenerateRecoveryCodesAsync_PasswordAndCode_ReplacesTheCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-ReplaceStopsOld
        title: >-
          The TotpService class shall refuse the old recovery codes after a new set was issued.
        justification: |
          The old set must be dead, or a seen code would stay a way in.
        tests:
          - TotpService_RegenerateRecoveryCodesAsync_PasswordAndCode_ReplacesTheCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-ReplaceNeedsAppCode
        title: >-
          The TotpService class shall refuse a recovery code in place of the code from the app when new recovery codes
          are requested.
        justification: |
          Spent codes must not be able to create new ones.
        tests:
          - TotpService_RegenerateRecoveryCodesAsync_PasswordAndCode_ReplacesTheCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-ReplacePassword
        title: >-
          The TotpService class shall refuse new recovery codes when the password is wrong, and keep the old codes.
        justification: |
          The password is part of the proof that the owner asks.
        tests:
          - TotpService_RegenerateRecoveryCodesAsync_WrongPassword_ThrowsAndKeepsTheCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-ReplaceCode
        title: >-
          The TotpService class shall refuse new recovery codes when the code from the app is wrong, and keep the old
          codes.
        justification: |
          The code from the app is part of the proof that the owner asks.
        tests:
          - TotpService_RegenerateRecoveryCodesAsync_WrongCode_ThrowsAndKeepsTheCodes

      - id: ReviewCenter-TotpService-RecoveryCodes-UnreadableSecret
        title: >-
          The TotpService class shall accept a recovery code at the second step of a sign-in when the stored secret
          cannot be read.
        justification: |
          A lost key ring must not lock out the person who holds the recovery codes.
        tests:
          - TotpService_CompleteSignInAsync_UnreadableSecret_RefusesCodesButRecoveryStillWorks

      # ---------------------------------------------------------------------------------------------------------------
      # Removal by the owner
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Disable
        title: >-
          The TotpService class shall remove the second factor of a user who presents the current password and a right
          code.
        justification: |
          Removing the second factor lowers the protection, so it needs the same proofs as a sign-in plus the password.
        tests:
          - TotpService_DisableAsync_PasswordAndCode_RemovesAndInvalidatesPendingSignIns

      - id: ReviewCenter-TotpService-Disable-RecoveryCode
        title: >-
          The TotpService class shall remove the second factor of a user who presents the current password and an unused
          recovery code.
        justification: |
          A person who lost the phone must be able to remove the second factor with a recovery code.
        tests:
          - TotpService_DisableAsync_RecoveryCode_Removes

      - id: ReviewCenter-TotpService-Disable-WrongPassword
        title: >-
          The TotpService class shall refuse the removal of the second factor when the password is wrong, and keep the
          second factor.
        justification: |
          The password is part of the proof that the owner asks.
        tests:
          - TotpService_DisableAsync_WrongPassword_ThrowsAndKeepsTheSecondFactor

      - id: ReviewCenter-TotpService-Disable-WrongCode
        title: >-
          The TotpService class shall refuse the removal of the second factor when the code is wrong, and keep the
          second factor.
        justification: |
          The code is part of the proof that the owner asks.
        tests:
          - TotpService_DisableAsync_WrongCode_ThrowsCountsAndKeepsTheSecondFactor

      - id: ReviewCenter-TotpService-Disable-NotEnrolled
        title: >-
          The TotpService class shall refuse the removal for a user who has no second factor.
        justification: |
          There is nothing to remove, and the refusal tells the user so.
        tests:
          - TotpService_DisableAsync_NotEnrolled_ThrowsTotpNotEnrolled

      - id: ReviewCenter-TotpService-Disable-RecoveryCodesDeleted
        title: >-
          The TotpService class shall delete the recovery codes of the user together with the secret.
        justification: |
          A removed second factor must leave no codes behind that could be used later.
        tests:
          - TotpService_DisableAsync_PasswordAndCode_RemovesAndInvalidatesPendingSignIns

      - id: ReviewCenter-TotpService-Disable-PendingSignIns
        title: >-
          The TotpService class shall end every pending sign-in of the user whose second factor was removed.
        justification: |
          A pending sign-in must not finish against a second factor that is gone.
        tests:
          - TotpService_DisableAsync_PasswordAndCode_RemovesAndInvalidatesPendingSignIns

      # ---------------------------------------------------------------------------------------------------------------
      # Reset by a system administrator
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-AdminReset
        title: >-
          The TotpService class shall let an enabled system administrator remove the second factor of another user.
        justification: |
          Somebody must be able to help a person who lost both the phone and the recovery codes.
        tests:
          - TotpService_ResetAsync_SystemAdministrator_RemovesAndInvalidatesPendingSignIns

      - id: ReviewCenter-TotpService-AdminReset-NotAdmin
        title: >-
          The TotpService class shall refuse the reset when the caller is not a system administrator, and keep the
          second factor of the user.
        justification: |
          The right is as narrow as the right to create users; a project administrator or an ordinary user must not
          take away the protection of another account.
        tests:
          - TotpService_ResetAsync_NotASystemAdministrator_ThrowsActorNotAllowed

      - id: ReviewCenter-TotpService-AdminReset-ApiToken
        title: >-
          The TotpService class shall refuse the reset when the system administrator acts through an API token.
        justification: |
          A token can never act for a person, not even for an administrator.
        tests:
          - TotpService_ResetAsync_ApiTokenAdministrator_ThrowsActorNotAllowed

      - id: ReviewCenter-TotpService-AdminReset-DisabledAdmin
        title: >-
          The TotpService class shall refuse the reset when the system administrator account is disabled.
        justification: |
          A disabled account has no rights.
        tests:
          - TotpService_ResetAsync_DisabledAdministrator_ThrowsActorNotAllowed

      - id: ReviewCenter-TotpService-AdminReset-UnknownUser
        title: >-
          The TotpService class shall refuse the reset of a user who does not exist.
        justification: |
          There is nothing to reset, and the refusal tells the administrator so.
        tests:
          - TotpService_ResetAsync_UnknownUser_ThrowsUserNotFound

      - id: ReviewCenter-TotpService-AdminReset-NotEnrolled
        title: >-
          The TotpService class shall refuse the reset of a user who has no second factor.
        justification: |
          There is nothing to reset, and the refusal tells the administrator so.
        tests:
          - TotpService_ResetAsync_UserWithoutSecondFactor_ThrowsTotpNotEnrolled

      - id: ReviewCenter-TotpService-AdminReset-PendingSignIns
        title: >-
          The TotpService class shall end every pending sign-in of the user whose second factor was reset.
        justification: |
          A pending sign-in must not finish against a second factor that is gone.
        tests:
          - TotpService_ResetAsync_SystemAdministrator_RemovesAndInvalidatesPendingSignIns

      - id: ReviewCenter-TotpService-AdminReset-EnrolledList
        title: >-
          The TotpService class shall list the users who have a confirmed second factor, and not those with a pending
          setup.
        justification: |
          The administrator page needs to show who has a second factor that could be reset.
        tests:
          - TotpService_ListEnrolledUserIdsAsync_HoldsConfirmedEnrollmentsOnly

      # ---------------------------------------------------------------------------------------------------------------
      # Lockout
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Lockout
        title: >-
          The TotpService class shall count a wrong code at the second step of a sign-in toward the lockout that counts
          wrong passwords.
        justification: |
          Codes must not be guessable without limit.
        tests:
          - TotpService_CompleteSignInAsync_FiveWrongCodes_LocksTheAccount

      - id: ReviewCenter-TotpService-Lockout-Locked
        title: >-
          The TotpService class shall refuse even a right code at the second step while the account is locked out.
        justification: |
          A lockout must bind both factors, or the second factor would be a way around it.
        tests:
          - TotpService_CompleteSignInAsync_FiveWrongCodes_LocksTheAccount

      - id: ReviewCenter-TotpService-Lockout-Setup
        title: >-
          The TotpService class shall count a wrong code at the confirmation of a setup toward the lockout.
        justification: |
          The setup is a guessing surface too.
        tests:
          - TotpService_ConfirmEnrollmentAsync_WrongCode_ThrowsAndStaysPending

      - id: ReviewCenter-TotpService-Lockout-Removal
        title: >-
          The TotpService class shall count a wrong code at the removal of the second factor toward the lockout.
        justification: |
          The removal is a guessing surface too.
        tests:
          - TotpService_DisableAsync_WrongCode_ThrowsCountsAndKeepsTheSecondFactor

      - id: ReviewCenter-TotpService-Lockout-Signature
        title: >-
          The TotpService class shall count a wrong code at a signature toward the lockout.
        justification: |
          The signature is a guessing surface too.
        tests:
          - TotpService_VerifyForSignatureAsync_WrongCode_ReturnsFalseAndCountsTheFailure

      - id: ReviewCenter-TotpService-Lockout-Shared
        title: >-
          The TotpService class shall count wrong codes and wrong passwords in one counter.
        justification: |
          Codes and passwords together must not give more attempts than one of them.
        tests:
          - TotpService_CompleteSignInAsync_PasswordAndCodeFailures_ShareOneCounter

      - id: ReviewCenter-TotpService-Lockout-Cleared
        title: >-
          The TotpService class shall clear the failure counter when the whole sign-in succeeds.
        justification: |
          A person who signed in starts fresh.
        tests:
          - TotpService_CompleteSignInAsync_Success_ClearsTheCounter

      - id: ReviewCenter-TotpService-Lockout-PasswordAlone
        title: >-
          The TotpService class shall not clear the failure counter when only the password of a sign-in is right.
        justification: |
          An attacker who knows the password must not be able to restart the count with a right password between
          wrong codes, or the codes could be guessed without limit.
        tests:
          - TotpService_CompleteSignInAsync_RightPasswordBetweenWrongCodes_DoesNotResetTheCounter

      # ---------------------------------------------------------------------------------------------------------------
      # Change of the own password
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-ChangePassword
        title: >-
          The TotpService class shall change the own password of a user whose second factor is on when the current
          password and a right code from the app are given.
        justification: |
          A stolen session must not be enough to take over the account, so the change needs the second factor too.
        tests:
          - TotpService_ChangeOwnPasswordAsync_PasswordAndValidCode_ChangesAndClearsTheCounter

      - id: ReviewCenter-TotpService-ChangePassword-RecoveryCode
        title: >-
          The TotpService class shall accept an unused recovery code in place of the code from the app when the password
          is changed.
        justification: |
          A person who lost the phone must still be able to change the password.
        tests:
          - TotpService_ChangeOwnPasswordAsync_RecoveryCode_WorksOnceAndIsAudited

      - id: ReviewCenter-TotpService-ChangePassword-RecoveryCodeOnce
        title: >-
          The TotpService class shall accept a recovery code only once when the password is changed.
        justification: |
          A spent code must stay spent.
        tests:
          - TotpService_ChangeOwnPasswordAsync_RecoveryCode_WorksOnceAndIsAudited

      - id: ReviewCenter-TotpService-ChangePassword-NoCode
        title: >-
          The TotpService class shall refuse the change of the password without a code, with an empty code, or with a
          blank code, and keep the password hash.
        justification: |
          The password alone must not be enough, whatever page or caller asks.
        tests:
          - TotpService_ChangeOwnPasswordAsync_NoCode_IsRefusedCountsAndKeepsTheHash

      - id: ReviewCenter-TotpService-ChangePassword-WrongCode
        title: >-
          The TotpService class shall refuse the change of the password with a wrong code, and keep the password hash.
        justification: |
          The code is part of the proof that the owner asks.
        tests:
          - TotpService_ChangeOwnPasswordAsync_WrongCode_IsRefusedCountedAndKeepsTheHash

      - id: ReviewCenter-TotpService-ChangePassword-WrongPassword
        title: >-
          The TotpService class shall refuse the change of the password with a wrong current password before the code
          is looked at, and keep the code unused.
        justification: |
          The password is part of the proof, and a refused password must not use up a code of the person.
        tests:
          - TotpService_ChangeOwnPasswordAsync_WrongPassword_IsRefusedBeforeTheCodeIsLookedAt

      - id: ReviewCenter-TotpService-ChangePassword-Reused
        title: >-
          The TotpService class shall refuse the change of the password with a code whose step was already used.
        justification: |
          The same replay rule applies as at the sign-in.
        tests:
          - TotpService_ChangeOwnPasswordAsync_ReusedCode_IsRefused

      - id: ReviewCenter-TotpService-ChangePassword-Counted
        title: >-
          The TotpService class shall count a wrong or missing code at a password change toward the shared failure
          counter.
        justification: |
          The same counter applies as at the sign-in, so the password change is no way around the lockout.
        tests:
          - TotpService_ChangeOwnPasswordAsync_NoCode_IsRefusedCountsAndKeepsTheHash
          - TotpService_ChangeOwnPasswordAsync_WrongCode_IsRefusedCountedAndKeepsTheHash

      - id: ReviewCenter-TotpService-ChangePassword-ClearedAfterProof
        title: >-
          The TotpService class shall clear the failure counter only after the whole proof of a password change
          succeeded.
        justification: |
          A half proof must not give attempts back.
        tests:
          - TotpService_ChangeOwnPasswordAsync_PasswordAndValidCode_ChangesAndClearsTheCounter

      - id: ReviewCenter-TotpService-ChangePassword-Lockout
        title: >-
          The TotpService class shall refuse even a right code at a password change after five wrong codes, until the
          lockout ends.
        justification: |
          The same lockout applies as at the sign-in.
        tests:
          - TotpService_ChangeOwnPasswordAsync_FiveWrongCodes_LockTheAccount

      - id: ReviewCenter-TotpService-ChangePassword-PasswordOnly
        title: >-
          The TotpService class shall leave the failure counter alone when the password is right but the code is
          missing.
        justification: |
          A known password must not reset the guessing limit of the code.
        tests:
          - TotpService_ChangeOwnPasswordAsync_PasswordOnlyBetweenWrongCodes_DoesNotResetTheCounter

      - id: ReviewCenter-TotpService-ChangePassword-ApiToken
        title: >-
          The TotpService class shall refuse the change of the password for a request that comes with an API token.
        justification: |
          A token can never act for a person.
        tests:
          - TotpService_ChangeOwnPasswordAsync_ApiTokenActor_ThrowsActorNotAllowed

      - id: ReviewCenter-TotpService-ChangePassword-NotEnrolled
        title: >-
          The TotpService class shall change the password with the password alone for a user without a second factor.
        justification: |
          There is no second factor to prove, so none may be asked for.
        tests:
          - TotpService_ChangeOwnPasswordAsync_NotEnrolled_PasswordAloneWorks

      - id: ReviewCenter-TotpService-ChangePassword-FeatureOff
        title: >-
          The TotpService class shall change the password with the password alone while the feature is switched off.
        justification: |
          A switched-off feature asks for no code.
        tests:
          - TotpService_ChangeOwnPasswordAsync_FeatureDisabled_PasswordAloneWorks

      - id: ReviewCenter-TotpService-ChangePassword-TemporaryPassword
        title: >-
          The TotpService class shall change a temporary password without a code.
        justification: |
          A temporary password belongs to an account that has no second factor yet, and the person must be able to
          replace it.
        tests:
          - TotpService_ChangeOwnPasswordAsync_TemporaryPassword_NeedsNoCode

      - id: ReviewCenter-TotpService-ChangePassword-UnreadableSecret
        title: >-
          The TotpService class shall refuse a six digit code at a password change like a wrong one when the stored
          secret cannot be read.
        justification: |
          A lost key ring must not crash the change or let a code pass.
        tests:
          - TotpService_ChangeOwnPasswordAsync_UnreadableSecret_RefusesCodesButRecoveryStillWorks

      - id: ReviewCenter-TotpService-ChangePassword-UnreadableRecovery
        title: >-
          The TotpService class shall accept a recovery code at a password change when the stored secret cannot be read.
        justification: |
          The recovery codes must still work when the key ring is lost.
        tests:
          - TotpService_ChangeOwnPasswordAsync_UnreadableSecret_RefusesCodesButRecoveryStillWorks

      - id: ReviewCenter-TotpService-ChangePassword-Concurrent
        title: >-
          The TotpService class shall let exactly one of several requests that present the same code and a password
          change the password.
        justification: |
          Two requests that race with the same code must not both pass.
        tests:
          - TotpService_ChangeOwnPasswordAsync_ConcurrentSameCode_ExactlyOneSucceeds

      # ---------------------------------------------------------------------------------------------------------------
      # Audit trail
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-Audit
        title: >-
          The TotpService class shall record in the audit trail that a setup was completed.
        justification: |
          A change in how a person proves identity belongs to the history of the account.
        tests:
          - TotpService_ConfirmEnrollmentAsync_ValidCode_ActivatesAndIssuesTenRecoveryCodes

      - id: ReviewCenter-TotpService-Audit-Removed
        title: >-
          The TotpService class shall record in the audit trail that a second factor was removed by its owner.
        justification: |
          A change in how a person proves identity belongs to the history of the account.
        tests:
          - TotpService_DisableAsync_PasswordAndCode_RemovesAndInvalidatesPendingSignIns

      - id: ReviewCenter-TotpService-Audit-Reset
        title: >-
          The TotpService class shall record in the audit trail that a second factor was reset by an administrator, with
          the administrator and the target.
        justification: |
          A reset by somebody else must be traceable to the person who did it and to the account it touched.
        tests:
          - TotpService_ResetAsync_SystemAdministrator_RemovesAndInvalidatesPendingSignIns

      - id: ReviewCenter-TotpService-Audit-RecoveryRegenerated
        title: >-
          The TotpService class shall record in the audit trail that a new set of recovery codes was issued.
        justification: |
          A change in how a person proves identity belongs to the history of the account.
        tests:
          - TotpService_RegenerateRecoveryCodesAsync_PasswordAndCode_ReplacesTheCodes

      - id: ReviewCenter-TotpService-Audit-RecoveryUsed
        title: >-
          The TotpService class shall record in the audit trail the use of a recovery code, without the code.
        justification: |
          A spent recovery code means the phone may be lost or stolen, and the owner must be able to see it.
        tests:
          - TotpService_CompleteSignInAsync_RecoveryCode_WorksOnceAndIsAudited
          - TotpService_DisableAsync_RecoveryCode_Removes
          - TotpService_ChangeOwnPasswordAsync_RecoveryCode_WorksOnceAndIsAudited

      - id: ReviewCenter-TotpService-Audit-WrongCode
        title: >-
          The TotpService class shall record in the audit trail a wrong code at the second step, with the user as actor
          and a fixed text.
        justification: |
          Failed proofs are the trace of an attack, and the text must not hold the code.
        tests:
          - TotpService_CompleteSignInAsync_FiveWrongCodes_LocksTheAccount
          - TotpService_CompleteSignInAsync_WrongCode_RecordsTheFailureWithAFixedText

      # ---------------------------------------------------------------------------------------------------------------
      # No leak of secrets
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-TotpService-NoSecretLeak
        title: >-
          The TotpService class shall never put secret material of the second factor, namely the secret, a code, a
          recovery code, or a challenge token, into the audit trail.
        justification: |
          The history is read by people who must not be able to sign in as the user. The kinds of secret material are
          checked one by one by the test.
        tests:
          - TotpService_WholeLifeCycle_NeverPutsSecretsOrCodesInAuditOrErrors

      - id: ReviewCenter-TotpService-NoSecretLeak-ErrorMessages
        title: >-
          The TotpService class shall never put secret material of the second factor, namely the secret, a code, a
          recovery code, or a challenge token, into an error message.
        justification: |
          Messages travel to pages and logs that more people can read than the owner. The kinds of secret material are
          checked one by one by the test.
        tests:
          - TotpService_WholeLifeCycle_NeverPutsSecretsOrCodesInAuditOrErrors

      - id: ReviewCenter-TotpService-NoSecretLeak-ShownOnce
        title: >-
          The TotpService class shall show the secret and the recovery codes only in the answer to the request that
          created them, and not when the status is read.
        justification: |
          A shown secret can be copied by anybody who sees the page again.
        tests:
          - TotpService_GetStatusAsync_Enrolled_ShowsNeitherSecretNorRecoveryCodes
