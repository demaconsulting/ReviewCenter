---
# Software Unit Requirements for the AuditService Class
#
# The AuditService class records the events that change no data on a best-effort basis, reads the audit trail one
# page at a time, and verifies the hash chain by streaming. It also defines the store contract.

sections:
  - title: AuditService Unit Requirements
    requirements:
      - id: ReviewCenter-AuditService-Record
        title: >-
          The AuditService class shall record an audit draft as the next entry of the trail, letting a failure
          propagate for the strict operation and, for the best-effort operation, awaiting the write, reporting a
          failure to an error hook, never letting it reach the caller, and never swallowing cancellation.
        justification: |
          Sign-in, sign-out, failed sign-in, and lockout change no data, so a failing trail must not stop anybody
          from signing in, yet the failure must be visible to the operator through the log.
        tests:
          - AuditService_Constructor_NullStore_Throws
          - AuditService_RecordAsync_Draft_StoresEntryThatVerifies
          - AuditService_RecordAsync_NullDraftOrStoreFailure_Throws
          - AuditService_TryRecordAsync_Draft_StoresEntryAndReturnsTrue
          - AuditService_TryRecordAsync_StoreFailure_IsSwallowedAndReported
          - AuditService_TryRecordAsync_FailingOrMissingHook_StillReturnsFalse
          - AuditService_TryRecordAsync_Cancellation_Propagates
          - AuditService_TryRecordAsync_NullDraft_Throws

      - id: ReviewCenter-AuditService-Coalesce
        title: >-
          The AuditService class shall, for events that a caller can repeat without limit, record the first event of a
          key in a one-minute window and count the repeats of that key in the window instead of recording them,
          shall put the number of counted repeats into the detail of the first event of the key in the next window,
          shall keep at most a fixed number of keys (see the overflow requirement for a full table), shall neither
          count nor start a window for an event whose cancellation was already requested and shall not swallow
          cancellation, and shall report a failure of the store like the best-effort operation does.
        justification: |
          Failed sign-ins of unknown names and attempts on locked or disabled accounts are not limited by the
          account lockout. Recording each of them would let an attacker fill the audit trail, and its database, at
          will. One row per key and minute keeps the attack visible and the growth bounded. The count of the last
          window is lost when the key does not occur again, because entries of the trail are never changed. A
          request that its caller has cancelled must not change the counts, or the trail would show too few
          repeats or lose the first event of a window.
        tests:
          - AuditService_TryRecordCoalescedAsync_RepeatsWithinWindow_StoresOnlyTheFirst
          - AuditService_TryRecordCoalescedAsync_NextWindow_StoresEntryWithSuppressedCount
          - AuditService_TryRecordCoalescedAsync_DifferentKeys_StoreSeparateEntries
          - AuditService_TryRecordCoalescedAsync_CancelledRepeat_ThrowsAndDoesNotCountTheRepeat
          - AuditService_TryRecordCoalescedAsync_CancelledFirstEvent_ThrowsAndDoesNotStartWindow
          - AuditService_TryRecordCoalescedAsync_TooManyKeys_DoesNotStoreNewKeysUntilWindowPasses
          - AuditService_TryRecordCoalescedAsync_StoreFailure_IsSwallowedAndReported
          - AuditService_TryRecordCoalescedAsync_NullArguments_Throw

      - id: ReviewCenter-AuditService-CoalesceOverflow
        title: >-
          The AuditService class, when its table of coalesced keys is full of keys that have not expired, shall count
          the events of new keys instead of recording them, shall record at most one audit entry per one-minute window
          that says that events were suppressed (with the count of the previous window), and shall report the
          saturation to the error hook at most once per window.
        justification: |
          The keys come from the caller (for example typed user names), so an attacker can fill the table. Dropping
          events silently would let an attacker hide behind the flood; one bounded row per minute and one report to
          the operator make the gap visible without letting the trail grow. Existing keys keep coalescing, so the
          rows per minute stay bounded by the table size plus one.
        tests:
          - AuditService_TryRecordCoalescedAsync_TooManyKeys_DoesNotStoreNewKeysUntilWindowPasses
          - AuditService_TryRecordCoalescedAsync_TableFull_WritesOneOverflowRowAndReportsOncePerWindow
          - AuditService_TryRecordCoalescedAsync_TableFullNextWindow_OverflowRowCarriesPreviousCount
          - AuditService_TryRecordCoalescedAsync_TableFullAndHookThrows_StillReturnsFalse

      - id: ReviewCenter-AuditService-List
        title: >-
          The AuditService class shall list the audit trail newest first, 50 entries to a page, for the whole trail,
          for one project (every entry of the project, and no entry of another project or without a project), or
          for one review, with cursors for the older and the newer page that are offered only when entries exist
          behind them, and with the older position winning when both are given.
        justification: |
          The history of a review, the audit history of a project, and the audit page must show a trail of any
          length in bounded pages, and every entry must appear exactly once while paging. The administrators of a
          project may see the history of their project and must see nothing of any other project.
        tests:
          - AuditService_ListAsync_FirstPage_IsNewestFirstWithOlderOnly
          - AuditService_ListAsync_PagingOlder_CoversEveryEntryOnce
          - AuditService_ListAsync_PagingNewer_ReturnsThePageBefore
          - AuditService_ListAsync_ExactlyOnePage_HasNoLinks
          - AuditService_ListAsync_EmptyTrail_GivesEmptyPage
          - AuditService_ListAsync_ReviewFilter_ReturnsOnlyThatReview
          - AuditService_ListAsync_ProjectOnly_ReturnsOnlyThatProjectsEvents
          - AuditService_ListAsync_ReviewFilterOverFiftyEntries_Pages
          - AuditService_ListAsync_BothPositions_BeforeWins

      - id: ReviewCenter-AuditService-Verify
        title: >-
          The AuditService class shall verify the hash chain of the whole trail by reading it in ordered batches,
          reporting an intact chain with its entry count and head hash, or the first broken entry.
        justification: |
          An operator must be able to check a trail of any size without loading it into memory, and a tampered entry
          in any batch must be found.
        tests:
          - AuditService_VerifyAsync_UntouchedTrail_IsIntactAndReadInBatches
          - AuditService_VerifyAsync_EmptyTrail_IsIntact
          - AuditService_VerifyAsync_TamperedEntryInLaterBatch_ReportsItsSequence
