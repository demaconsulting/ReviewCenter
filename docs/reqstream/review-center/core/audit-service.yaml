---
# Software Unit Requirements for the AuditService Class
#
# The AuditService class records the events that change no data on a best-effort basis, reads the audit trail one
# page at a time, verifies the hash chain by streaming, and streams an export of the filtered trail. The
# AuditExportWriter class writes the export as CSV or JSON. The AuditService also defines the store contract.

sections:
  - title: AuditService Unit Requirements
    requirements:
      - id: ReviewCenter-AuditService-Record
        title: >-
          The AuditService class shall record an audit draft as the next entry of the trail, letting a failure
          propagate for the strict operation and, for the best-effort operation, awaiting the write, reporting a
          failure to an error hook, never letting it reach the caller, and never swallowing cancellation.
        justification: |
          Sign-in, sign-out, failed sign-in, and lockout change no data, so a failing trail must not stop anybody
          from signing in, yet the failure must be visible to the operator through the log.
        tests:
          - AuditService_Constructor_NullStore_Throws
          - AuditService_RecordAsync_Draft_StoresEntryThatVerifies
          - AuditService_RecordAsync_NullDraftOrStoreFailure_Throws
          - AuditService_TryRecordAsync_Draft_StoresEntryAndReturnsTrue
          - AuditService_TryRecordAsync_StoreFailure_IsSwallowedAndReported
          - AuditService_TryRecordAsync_FailingOrMissingHook_StillReturnsFalse
          - AuditService_TryRecordAsync_Cancellation_Propagates
          - AuditService_TryRecordAsync_NullDraft_Throws

      - id: ReviewCenter-AuditService-Coalesce
        title: >-
          The AuditService class shall, for events that a caller can repeat without limit, record the first event of a
          key in a one-minute window and count the repeats of that key in the window instead of recording them,
          shall put the number of counted repeats into the detail of the first event of the key in the next window,
          shall keep at most a fixed number of keys (see the overflow requirement for a full table), shall neither
          count nor start a window for an event whose cancellation was already requested and shall not swallow
          cancellation, and shall report a failure of the store like the best-effort operation does.
        justification: |
          Failed sign-ins of unknown names and attempts on locked or disabled accounts are not limited by the
          account lockout. Recording each of them would let an attacker fill the audit trail, and its database, at
          will. One row per key and minute keeps the attack visible and the growth bounded. The count of the last
          window is lost when the key does not occur again, because entries of the trail are never changed. A
          request that its caller has cancelled must not change the counts, or the trail would show too few
          repeats or lose the first event of a window.
        tests:
          - AuditService_TryRecordCoalescedAsync_RepeatsWithinWindow_StoresOnlyTheFirst
          - AuditService_TryRecordCoalescedAsync_NextWindow_StoresEntryWithSuppressedCount
          - AuditService_TryRecordCoalescedAsync_DifferentKeys_StoreSeparateEntries
          - AuditService_TryRecordCoalescedAsync_CancelledRepeat_ThrowsAndDoesNotCountTheRepeat
          - AuditService_TryRecordCoalescedAsync_CancelledFirstEvent_ThrowsAndDoesNotStartWindow
          - AuditService_TryRecordCoalescedAsync_TooManyKeys_DoesNotStoreNewKeysUntilWindowPasses
          - AuditService_TryRecordCoalescedAsync_StoreFailure_IsSwallowedAndReported
          - AuditService_TryRecordCoalescedAsync_NullArguments_Throw

      - id: ReviewCenter-AuditService-CoalesceOverflow
        title: >-
          The AuditService class, when its table of coalesced keys is full of keys that have not expired, shall count
          the events of new keys instead of recording them, shall record at most one audit entry per one-minute window
          that says that events were suppressed (with the count of the previous window), and shall report the
          saturation to the error hook at most once per window.
        justification: |
          The keys come from the caller (for example typed user names), so an attacker can fill the table. Dropping
          events silently would let an attacker hide behind the flood; one bounded row per minute and one report to
          the operator make the gap visible without letting the trail grow. Existing keys keep coalescing, so the
          rows per minute stay bounded by the table size plus one.
        tests:
          - AuditService_TryRecordCoalescedAsync_TooManyKeys_DoesNotStoreNewKeysUntilWindowPasses
          - AuditService_TryRecordCoalescedAsync_TableFull_WritesOneOverflowRowAndReportsOncePerWindow
          - AuditService_TryRecordCoalescedAsync_TableFullNextWindow_OverflowRowCarriesPreviousCount
          - AuditService_TryRecordCoalescedAsync_TableFullAndHookThrows_StillReturnsFalse

      - id: ReviewCenter-AuditService-List
        title: >-
          The AuditService class shall list the audit trail newest first, 50 entries to a page by default and never
          more than 200, for the whole trail, for one project (every entry of the project, and no entry of another
          project or without a project), or for one review, with cursors for the older and the newer page that are
          offered only when entries exist behind them, and with the older position winning when both are given.
        justification: |
          The history of a review, the audit history of a project, and the audit page must show a trail of any
          length in bounded pages, and every entry must appear exactly once while paging. The administrators of a
          project may see the history of their project and must see nothing of any other project. The hard cap keeps
          a hostile page size from reading the whole trail at once.
        tests:
          - AuditService_ListAsync_FirstPage_IsNewestFirstWithOlderOnly
          - AuditService_ListAsync_PagingOlder_CoversEveryEntryOnce
          - AuditService_ListAsync_PagingNewer_ReturnsThePageBefore
          - AuditService_ListAsync_ExactlyOnePage_HasNoLinks
          - AuditService_ListAsync_EmptyTrail_GivesEmptyPage
          - AuditService_ListAsync_ReviewFilter_ReturnsOnlyThatReview
          - AuditService_ListAsync_ProjectOnly_ReturnsOnlyThatProjectsEvents
          - AuditService_ListAsync_ReviewFilterOverFiftyEntries_Pages
          - AuditService_ListAsync_BothPositions_BeforeWins
          - AuditService_ListAsync_PageSize_DefaultsAndIsCapped

      - id: ReviewCenter-AuditService-Filter
        title: >-
          The AuditService class shall narrow the listing of the audit trail by project, review, actor identity, a
          case-insensitive text in the actor name, one exact action or a group of actions, and a range of UTC days
          with both ends included, all conditions together, with the paging of the listing following the matching
          entries only, shall trim the texts and turn an empty text into no condition, shall refuse a text that is
          longer than the field it is compared with and a range that ends before it starts with the invalid-filter
          rule, and shall keep to a list of the known actions that matches the actions the code records.
        justification: |
          An auditor looking for what one person did, or for every change of a kind, cannot read a trail of any length
          page by page. The filter is checked before the store is read, so a hostile query value cannot cost a scan,
          and a filter for a project can never return an entry without a project. The list of actions lets the page
          offer the choices, and the test that scans the sources keeps the list from drifting away from what is really
          recorded.
        tests:
          - AuditService_ListAsync_Filter_NarrowsByEachFieldAndKeepsProjectScoping
          - AuditService_ListAsync_FilterWithPaging_LinksFollowTheMatchingEntries
          - AuditService_ListAsync_InvalidFilter_IsRefused
          - AuditFilter_Validated_TextsAreTrimmedAndEmptyBecomesNull
          - AuditFilter_None_ValidatesToItself
          - AuditFilter_Validated_TextTooLong_IsRefused
          - AuditFilter_Validated_ReversedRange_IsRefusedAndSingleDayAccepted
          - AuditFilter_Range_StartOfFromDayAndStartOfDayAfterTo
          - AuditActions_All_IsSortedUniqueAndWellFormed
          - AuditActions_Prefixes_AreTheGroupsOfTheActions
          - AuditActions_IsKnown_AcceptsOnlyListedValues
          - AuditActions_All_MatchesTheActionsTheSourcesRecord

      - id: ReviewCenter-AuditService-Verify
        title: >-
          The AuditService class shall verify the hash chain of the whole trail by reading it in ordered batches,
          reporting an intact chain with its entry count and head hash, or the first broken entry.
        justification: |
          An operator must be able to check a trail of any size without loading it into memory, and a tampered entry
          in any batch must be found.
        tests:
          - AuditService_VerifyAsync_UntouchedTrail_IsIntactAndReadInBatches
          - AuditService_VerifyAsync_EmptyTrail_IsIntact
          - AuditService_VerifyAsync_TamperedEntryInLaterBatch_ReportsItsSequence

      - id: ReviewCenter-AuditService-Export
        title: >-
          The AuditService class shall prepare and stream an export of the audit trail that honors the filter of the
          listing, writes every matching entry once, in ascending sequence order, in keyset batches of 500 that are
          never held together in memory, up to the newest sequence that existed when the export was prepared (so
          that entries appended meanwhile, including its own audit entry, are not part of it), for a project only
          the entries of that project, never an entry without a project, and shall stop at once when cancelled.
        justification: |
          An auditor or a regulator needs a copy of the trail that can be kept and checked elsewhere (21 CFR Part 11
          section 11.10(b) and (e)). The trail only grows and may be large, so the export streams it in bounded
          batches, and the fixed upper bound gives one consistent view while the chain keeps growing.
        tests:
          - AuditExport_ExportAsync_Filter_WritesMatchingEntriesAscending
          - AuditExport_ExportAsync_Scope_ProjectNeverHoldsGlobalRows
          - AuditExport_ExportAsync_EntriesAppendedAfterPrepare_AreNotIncluded
          - AuditExport_ExportAsync_MoreThanOneBatch_ReadsInBatchesOf500
          - AuditExport_ExportAsync_ExactlyWholeBatches_EndsAfterAnEmptyRead
          - AuditExport_ExportAsync_EmptyTrail_IsValidAndAudited
          - AuditExport_PrepareExportAsync_InvalidFilter_ThrowsDomainRule
          - AuditExport_NullArguments_Throw
          - AuditFilter_Describe_SetParts_AreListedInOrder

      - id: ReviewCenter-AuditService-ExportChainStatus
        title: >-
          The AuditService class shall verify the whole chain once while preparing an export, after it has captured
          the newest sequence and before the first byte is written, so that the status of the chain (intact, or
          broken with the first broken sequence) is known to the caller in advance and covers every exported entry,
          shall export a broken chain too and say so, and shall reveal, for a project export, neither the number
          nor the head hash of the whole chain nor anything of the entries of other projects.
        justification: |
          An export of a tampered trail must say so, in a place the reader sees before reading the data, but the chain
          is global, so a project export may name only whether the whole chain is sound and where it first breaks.
        tests:
          - AuditExport_PrepareExportAsync_IntactChain_ReportsIntact
          - AuditExport_PrepareExportAsync_TamperedChain_ReportsBrokenAtFirstBadSequence
          - AuditExport_ExportAsync_ProjectExport_RevealsNoCountsOfOtherProjects
          - AuditExport_FileNameAndContentType_FollowScopeFormatAndStatus

      - id: ReviewCenter-AuditService-ExportAudited
        title: >-
          The AuditService class shall, after the export has ended and so outside its snapshot, record the export as
          an audit entry of the action audit.exported for the exporting user, scoped to the project of the filter or
          without a project, whose detail names the format, the number of entries written, whether the export was
          complete or incomplete (cancelled or failed), and a bounded human-readable summary of the filter, and shall
          record it also when the export is cancelled or fails, without letting a failure of that entry hide the
          outcome of the export.
        justification: |
          A copy of the whole trail is itself an event that an auditor must be able to find (21 CFR Part 11 section
          11.10(e)). A cancelled download still handed out data, so it is recorded, marked incomplete.
        tests:
          - AuditExport_ExportAsync_ProjectScope_RecordsAuditEntryAfterStream
          - AuditExport_ExportAsync_GlobalScope_RecordsEntryWithoutProject
          - AuditExport_ExportAsync_CancelledMidStream_RecordsIncompleteEntry
          - AuditExport_ExportAsync_TargetFails_RecordsIncompleteEntryAndRethrows
          - AuditExport_ExportAsync_AuditAppendFails_ReportsErrorAndStillCompletes
          - AuditExport_ExportedAction_IsInTheActionCatalog
          - AuditExport_ExportAsync_MaximalFilter_DetailFitsAndKeepsCountAndDates

      - id: ReviewCenter-AuditService-ExportFormat
        title: >-
          The AuditExportWriter class shall write an export as CSV, in UTF-8 with a byte order mark, with the columns
          sequence, timestampUtc, actor, action, project, review, detail, previousHash, and hash, CRLF line ends, the
          quoting of RFC 4180 for a comma, a quote, and a line break, and ISO 8601 UTC timestamps, or as JSON, as one
          streamed object with the export (time and filter), the chain status, and the entries, escaped by a JSON
          writer, in both cases a valid document when nothing matches, and shall, in CSV, prefix with an apostrophe any
          text cell (actor, action, review, detail) that starts with =, +, -, @, a tab, or a carriage return, and
          alter no hash, sequence, or timestamp.
        justification: |
          The file is opened in spreadsheets, where a cell that starts with a formula character is executed, and the
          text of the trail comes from users. Neutralizing only the text cells keeps the hashes usable for the
          re-check of the chain, and the JSON form is not interpreted by a spreadsheet.
        tests:
          - AuditExportWriter_Csv_StartsWithBomAndHeader_AndUsesCrlf
          - AuditExportWriter_Csv_Row_HasColumnsInOrderAndUtcTimestamp
          - AuditExportWriter_Quote_SpecialCharacters_QuotedPerRfc4180
          - AuditExportWriter_Csv_DetailWithCommaQuoteAndNewline_IsOneQuotedCell
          - AuditExportWriter_Neutralize_LeadingFormulaCharacter_IsPrefixed
          - AuditExportWriter_Csv_TextCells_AreNeutralizedAndGeneratedCellsAreNot
          - AuditExportWriter_Csv_Unicode_IsWrittenAsUtf8
          - AuditExportWriter_Csv_NoEntries_IsHeaderOnly
          - AuditExportWriter_Csv_NoProject_LeavesProjectCellEmpty
          - AuditExportWriter_Json_Envelope_HasExportChainAndEntries
          - AuditExportWriter_Json_HostileText_IsEscapedAndRoundTrips
          - AuditExportWriter_Json_NoEntries_IsValidDocument
          - AuditExportWriter_Json_BrokenChain_NamesFirstBrokenSequenceAndNoCounts
          - AuditExportWriter_FlushToAsync_EmptiesTheBufferEachTime
          - AuditExportWriter_NullArguments_Throw
          - AuditExportWriter_Dispose_ReleasesBuffersAndIsRepeatable
