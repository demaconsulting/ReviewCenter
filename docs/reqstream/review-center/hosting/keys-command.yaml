---
# Software Unit Requirements for the KeysCommand Class
#
# The KeysCommand class runs the keys reprotect verb: it rolls a new Data Protection key and re-protects every stored
# repository token and second-factor secret with it, so that old key material and an old certificate can be retired.
# It is the only verb that writes the key ring and these stored secret columns.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: KeysCommand Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # Reprotect: a new key, and every stored secret protected again with it
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeysCommand-Reprotect
        title: >-
          The KeysCommand class shall create exactly one new Data Protection key file when it re-protects the stored
          secrets.
        justification: |
          Re-protecting is what makes an old key file, and the certificate that protected it, retirable, and it needs
          a new key to protect with.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported

      - id: ReviewCenter-KeysCommand-Reprotect-KeyProtection
        title: >-
          The KeysCommand class shall protect the new key file with the key ring protection that is configured.
        justification: |
          A new key that is less protected than the ring it joins would be the weakest part of the ring.
        tests:
          - KeysCommand_Run_CertificateConfigured_NewKeyFileIsEncrypted

      - id: ReviewCenter-KeysCommand-Reprotect-Tokens
        title: >-
          The KeysCommand class shall store every repository token protected with the new key.
        justification: |
          Only when no stored token needs an older key can the older key file be retired.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported
          - KeysCommand_Run_SecondRun_IsIdempotentAndGivesAnotherKey

      - id: ReviewCenter-KeysCommand-Reprotect-SecondFactor
        title: >-
          The KeysCommand class shall store every second-factor secret protected with the new key.
        justification: |
          Only when no stored second-factor secret needs an older key can the older key file be retired.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported

      - id: ReviewCenter-KeysCommand-Reprotect-Readable
        title: >-
          The KeysCommand class shall keep every stored secret readable, with its value unchanged, after it was
          protected again.
        justification: |
          A rotation that loses a secret on the way would be worse than none.
        tests:
          - KeysCommand_Run_SecretsOfTheRing_AreStillReadableAfterwards
          - KeysCommand_Run_SecondRun_IsIdempotentAndGivesAnotherKey

      - id: ReviewCenter-KeysCommand-Reprotect-SecondRun
        title: >-
          The KeysCommand class shall succeed and create another new key when it is run a second time.
        justification: |
          An operator must be able to repeat the command, for example after a failure or to rotate again.
        tests:
          - KeysCommand_Run_SecondRun_IsIdempotentAndGivesAnotherKey

      - id: ReviewCenter-KeysCommand-Reprotect-NoSecrets
        title: >-
          The KeysCommand class shall succeed and report zero re-protected secrets when no secret is stored.
        justification: |
          A new installation has nothing to re-protect, and the command must not fail on it.
        tests:
          - KeysCommand_Run_NoSecrets_SucceedsWithZeroCounts

      - id: ReviewCenter-KeysCommand-Reprotect-KeyFolder
        title: >-
          The KeysCommand class shall create a key folder that does not exist with the owner-only access that the
          server gives it.
        justification: |
          Key material must not be readable by other users of the machine.
        tests:
          - KeysCommand_Run_MissingKeyFolder_IsCreatedWithOwnerOnlyAccess

      - id: ReviewCenter-KeysCommand-Reprotect-TableUnchanged
        title: >-
          The KeysCommand class shall leave a table whose re-protection fails unchanged as a whole.
        justification: |
          A half-converted table would mix payloads of two keys and make the report of the referenced keys wrong.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable
          - KeysCommand_Run_FailureInTable_LeavesWholeTableUnchanged

      - id: ReviewCenter-KeysCommand-Reprotect-Failure
        title: >-
          The KeysCommand class shall report an error that says that re-protecting stopped, and return exit code 1,
          when writing a table fails after the new key was created.
        justification: |
          Scripts rely on the exit code, and the operator must hear that the run did not finish.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable

      - id: ReviewCenter-KeysCommand-Reprotect-FailureNewKey
        title: >-
          The KeysCommand class shall name the new key in the error that it reports when writing a table fails.
        justification: |
          The new key now exists in the key folder, and the operator needs its identifier to find and keep it.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable

      - id: ReviewCenter-KeysCommand-Reprotect-CompletedTables
        title: >-
          The KeysCommand class shall report how many secrets of the tables that were completed stay re-protected when
          writing a later table fails.
        justification: |
          The operator must know which part of the work was done before the failure.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable

      - id: ReviewCenter-KeysCommand-Reprotect-FailureUnchangedTable
        title: >-
          The KeysCommand class shall name the table that is unchanged in the error that it reports when writing that
          table fails.
        justification: |
          The operator must know which stored secrets are still protected with the older keys.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable

      - id: ReviewCenter-KeysCommand-Reprotect-FailureRunAgain
        title: >-
          The KeysCommand class shall tell the operator to stop the server and run the command again in the error that
          it reports when writing a table fails.
        justification: |
          A second run is safe and finishes the work, which the operator only does when the message says so.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable

      - id: ReviewCenter-KeysCommand-Reprotect-FailureNoSecret
        title: >-
          The KeysCommand class shall not write a secret value, plain or protected, in the error that it reports when
          writing a table fails.
        justification: |
          The failure message is printed after a partial run, when plain and protected values are in memory; it must not
          leak them to the terminal or the job log.
        tests:
          - KeysCommand_Run_SecondTableFails_ReportsNewKeyAndCompletedTable

      # ---------------------------------------------------------------------------------------------------------------
      # RefusesUnreadable: a refusal changes nothing
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeysCommand-RefusesUnreadable
        title: >-
          The KeysCommand class shall refuse with exit code 1, saying that nothing was changed, when a stored
          protected secret cannot be read with the current key ring.
        justification: |
          Re-protecting what cannot be read would not rescue it, and would destroy the chance to restore the ring.
        tests:
          - KeysCommand_Run_UnreadableSecret_RefusesAndChangesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableCount
        title: >-
          The KeysCommand class shall state in its refusal how many of the stored protected secrets cannot be read.
        justification: |
          The operator can tell a single stray secret from a lost ring by the count.
        tests:
          - KeysCommand_Run_UnreadableSecret_RefusesAndChangesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableIds
        title: >-
          The KeysCommand class shall name in its refusal the ids of the repositories whose tokens cannot be read.
        justification: |
          The operator needs to know which tokens to enter again.
        tests:
          - KeysCommand_Run_UnreadableSecret_RefusesAndChangesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableNoChange
        title: >-
          The KeysCommand class shall change no key file and no stored secret when it refuses because a secret cannot
          be read.
        justification: |
          A refusal must be harmless, so that the operator can fix the cause and run the command again.
        tests:
          - KeysCommand_Run_UnreadableSecret_RefusesAndChangesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-UnreadableNoSecret
        title: >-
          The KeysCommand class shall not write a secret value, plain or protected, in the refusal that it reports
          when a secret cannot be read.
        justification: |
          The refusal names the unreadable rows, and an operator pastes it into tickets; it must not repeat the values.
        tests:
          - KeysCommand_Run_UnreadableSecret_RefusesAndChangesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-EmptyRing
        title: >-
          The KeysCommand class shall refuse with exit code 1, saying that the key ring is empty, when secrets are
          stored but the key ring holds no key.
        justification: |
          A command that created a key in an empty ring would hide the loss of the original ring.
        tests:
          - KeysCommand_Run_EmptyRingWithSecrets_RefusesAndCreatesNoKey

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-EmptyRingNoKey
        title: >-
          The KeysCommand class shall create no key file when it refuses because the key ring is empty.
        justification: |
          A new key in the empty ring would look like a healthy ring to the checks of the next start.
        tests:
          - KeysCommand_Run_EmptyRingWithSecrets_RefusesAndCreatesNoKey

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-SettingsProblem
        title: >-
          The KeysCommand class shall refuse with exit code 1, naming the DataProtection:RequireEncryptedKeys setting,
          when that setting requires encrypted keys that the configured protection cannot provide.
        justification: |
          A key that is created against the configured policy would leave the ring in a state that the server refuses.
        tests:
          - KeysCommand_Run_KeyRingSettingsProblem_RefusesAndCreatesNoKey

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-SettingsNoChange
        title: >-
          The KeysCommand class shall create no key file and change no stored secret when it refuses because of a key
          ring settings problem.
        justification: |
          A refusal must be harmless, so that the operator can correct the settings and run the command again.
        tests:
          - KeysCommand_Run_KeyRingSettingsProblem_RefusesAndCreatesNoKey

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-MissingDatabase
        title: >-
          The KeysCommand class shall refuse with exit code 1, saying that the database file does not exist, when the
          configured database file is missing.
        justification: |
          Without a database there is nothing to re-protect, and a wrong path must be reported, not hidden.
        tests:
          - KeysCommand_Run_MissingDatabase_RefusesAndCreatesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-MissingDatabaseNothingCreated
        title: >-
          The KeysCommand class shall create no database, no key folder and no key file when it refuses because the
          database file is missing.
        justification: |
          A command run against a wrong path must not leave a new empty installation behind.
        tests:
          - KeysCommand_Run_MissingDatabase_RefusesAndCreatesNothing

      - id: ReviewCenter-KeysCommand-RefusesUnreadable-Arguments
        title: >-
          The KeysCommand class shall throw an ArgumentNullException when it is run without a context.
        justification: |
          The keys verb must fail at once on a missing context, before it opens the database or creates a key.
        tests:
          - KeysCommand_Run_NullContext_ThrowsArgumentNullException

      # ---------------------------------------------------------------------------------------------------------------
      # Report: what the operator learns from a successful run
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeysCommand-Report
        title: >-
          The KeysCommand class shall report the identifier of the new key.
        justification: |
          The operator must be able to identify the key that has to be backed up.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported

      - id: ReviewCenter-KeysCommand-Report-Counts
        title: >-
          The KeysCommand class shall report how many repository tokens it re-protected.
        justification: |
          The count confirms that no token was missed.
        tests:
          - KeysCommand_Run_SecretsOfTheRing_AreStillReadableAfterwards
          - KeysCommand_Run_SecondRun_IsIdempotentAndGivesAnotherKey
          - KeysCommand_Run_NoSecrets_SucceedsWithZeroCounts

      - id: ReviewCenter-KeysCommand-Report-Counts-SecondFactor
        title: >-
          The KeysCommand class shall report how many second-factor secrets it re-protected.
        justification: |
          The count confirms that no second-factor secret was missed.
        tests:
          - KeysCommand_Run_OnlySecondFactorSecrets_ReportsTheirCount

      - id: ReviewCenter-KeysCommand-Report-ReferencedKeys
        title: >-
          The KeysCommand class shall report that all stored secrets reference the new key.
        justification: |
          The operator deletes older key files only when no stored secret references them.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported

      - id: ReviewCenter-KeysCommand-Report-UnreferencedKeys
        title: >-
          The KeysCommand class shall list the older keys of the ring that no stored secret references.
        justification: |
          Those are the key files that the operator can delete.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported

      - id: ReviewCenter-KeysCommand-Report-PayloadHeaders
        title: >-
          The KeysCommand class shall read the key identifier of a stored secret from the header of its protected
          payload.
        justification: |
          The report of the referenced keys depends on it.
        tests:
          - KeysCommand_ReadKeyId_Payload_GivesKeyIdOrNull

      - id: ReviewCenter-KeysCommand-Report-PayloadHeaders-NotPayload
        title: >-
          The KeysCommand class shall read no key identifier from text that is not a protected payload.
        justification: |
          A value that is no payload (empty, null, not encoded, too short) must not be counted as a secret that the new
          key protects, which would hide a secret that cannot be read.
        tests:
          - KeysCommand_ReadKeyId_Payload_GivesKeyIdOrNull

      - id: ReviewCenter-KeysCommand-Report-NextSteps
        title: >-
          The KeysCommand class shall end its report with the next steps for the operator.
        justification: |
          After a rotation the operator must retire the older keys and start the server again.
        tests:
          - KeysCommand_Run_NewKey_IsTheOnlyOneReferencedAndOldKeyIsReported

      - id: ReviewCenter-KeysCommand-Report-NoSecret
        title: >-
          The KeysCommand class shall not write a secret value, plain or protected, in its report.
        justification: |
          The success report is kept in job logs for years; it may hold counts only.
        tests:
          - KeysCommand_Run_Report_HoldsNoSecretValue
