---
# Software Unit Requirements for the SecretScan Class
#
# The SecretScan class is the read-only look at what the key ring and the database hold: how many key files the ring
# has and how many of them are not encrypted, and how many repository tokens and second-factor secrets the database
# holds and how many of those the ring can no longer decrypt. The server start and the key check of the
# self-validation use it to find a restored database without its key ring before anything is lost.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: SecretScan Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # RingState: what the key ring holds
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretScan-RingState
        title: >-
          The SecretScan class shall report the number of key files of the key ring.
        justification: |
          Whether the ring has any key at all is the first fact needed to tell a lost ring from a healthy one.
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable
          - SecretScan_ScanAsync_PlaintextKeyFile_IsCountedAndMissingDatabaseIsNotCreated
          - SecretScan_ScanAsync_MalformedKeyFileOnly_CountsSecretsUnreadableAndCreatesNoKey

      - id: ReviewCenter-SecretScan-RingState-Unencrypted
        title: >-
          The SecretScan class shall report how many key files of the key ring hold an unencrypted key.
        justification: |
          A restore check and a policy of encrypted keys depend on knowing whether the keys are unencrypted.
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable
          - SecretScan_ScanAsync_PlaintextKeyFile_IsCountedAndMissingDatabaseIsNotCreated

      - id: ReviewCenter-SecretScan-RingState-Empty
        title: >-
          The SecretScan class shall report a key ring as empty when its folder holds no key file.
        justification: |
          An empty ring next to protected secrets is a lost ring.
        tests:
          - SecretScan_ScanAsync_EmptyRingWithSecrets_CountsThemUnreadableAndCreatesNoKey

      - id: ReviewCenter-SecretScan-RingState-MissingFolder
        title: >-
          The SecretScan class shall treat a key folder that does not exist as a key ring without keys.
        justification: |
          A new installation has no key folder yet.
        tests:
          - SecretScan_ScanAsync_MissingKeyFolder_ReportsEmptyRingAndCreatesNoFolder

      # ---------------------------------------------------------------------------------------------------------------
      # SecretReadability: which secrets the ring can still decrypt
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretScan-SecretReadability
        title: >-
          The SecretScan class shall count the repository tokens and the second-factor secrets that the database holds.
        justification: |
          The operator needs to know how much the key ring protects.
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable
          - SecretScan_ScanAsync_MixedSecrets_CountsOnlyTheUnreadableOnes

      - id: ReviewCenter-SecretScan-SecretReadability-Readable
        title: >-
          The SecretScan class shall count no secret as unreadable that the production protectors of the key ring can
          decrypt.
        justification: |
          Decrypting with the protectors that the server uses is the only test that is true to what the server will be
          able to do.
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable

      - id: ReviewCenter-SecretScan-SecretReadability-Unreadable
        title: >-
          The SecretScan class shall count the repository tokens that the production protectors of the key ring cannot
          decrypt.
        justification: |
          A token that cannot be decrypted is the damage that a lost or foreign key ring does.
        tests:
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
          - SecretScan_ScanAsync_MixedSecrets_CountsOnlyTheUnreadableOnes

      - id: ReviewCenter-SecretScan-SecretReadability-Unreadable-SecondFactor
        title: >-
          The SecretScan class shall count the second-factor secrets that the production protectors of the key ring
          cannot decrypt.
        justification: |
          A second-factor secret that cannot be decrypted locks its user out of the second step of the sign-in.
        tests:
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
          - SecretScan_ScanAsync_ForeignSecondFactorSecret_CountsAndNamesOnlyThatUser

      - id: ReviewCenter-SecretScan-SecretReadability-Ids
        title: >-
          The SecretScan class shall name the repositories whose tokens cannot be decrypted by their ids.
        justification: |
          The operator needs to know where the damage is.
        tests:
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
          - SecretScan_ScanAsync_MixedSecrets_CountsOnlyTheUnreadableOnes

      - id: ReviewCenter-SecretScan-SecretReadability-Ids-Users
        title: >-
          The SecretScan class shall name the users whose second-factor secrets cannot be decrypted by their ids.
        justification: |
          The operator needs to know which users must set up their second factor again.
        tests:
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
          - SecretScan_ScanAsync_ForeignSecondFactorSecret_CountsAndNamesOnlyThatUser

      - id: ReviewCenter-SecretScan-SecretReadability-IdList
        title: >-
          The SecretScan class shall show at most ten ids in the text of a list of ids, and the number of the others.
        justification: |
          A long list of ids would flood a message.
        tests:
          - SecretScan_FormatIds_ManyIds_ShowsTenAndTheCountOfTheOthers

      - id: ReviewCenter-SecretScan-SecretReadability-NoKeyFiles
        title: >-
          The SecretScan class shall count every secret as unreadable when the key folder holds no key file.
        justification: |
          The secrets cannot be read without a key, and a key ring that is asked anyway would create one.
        tests:
          - SecretScan_ScanAsync_EmptyRingWithSecrets_CountsThemUnreadableAndCreatesNoKey

      - id: ReviewCenter-SecretScan-SecretReadability-MalformedKeys
        title: >-
          The SecretScan class shall count every secret as unreadable when the only key files of the key ring are
          malformed.
        justification: |
          A malformed key file is not a key.
        tests:
          - SecretScan_ScanAsync_MalformedKeyFileOnly_CountsSecretsUnreadableAndCreatesNoKey

      - id: ReviewCenter-SecretScan-SecretReadability-MissingDatabase
        title: >-
          The SecretScan class shall treat a database that does not exist as holding no secret.
        justification: |
          A new installation has no database yet and must not be reported as damaged.
        tests:
          - SecretScan_ScanAsync_PlaintextKeyFile_IsCountedAndMissingDatabaseIsNotCreated

      - id: ReviewCenter-SecretScan-SecretReadability-MissingTables
        title: >-
          The SecretScan class shall treat a database that does not have the tables of the secrets as holding no
          secret.
        justification: |
          A database from before the secrets were stored must not be reported as damaged.
        tests:
          - SecretScan_ScanAsync_NoTablesOrNoRows_HoldsNoSecrets

      - id: ReviewCenter-SecretScan-SecretReadability-NoRows
        title: >-
          The SecretScan class shall treat a database whose secret tables hold no row as holding no secret.
        justification: |
          An installation that has not stored any secret is not damaged.
        tests:
          - SecretScan_ScanAsync_NoTablesOrNoRows_HoldsNoSecrets

      # ---------------------------------------------------------------------------------------------------------------
      # ReadOnly: the scan leaves no trace
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretScan-ReadOnly
        title: >-
          The SecretScan class shall leave the database and every file of the key ring as they were.
        justification: |
          The scan runs on a restored copy before the server decides to start, and a scan that wrote to the database
          or to the key ring would change the evidence of the restore.
        tests:
          - SecretScan_ScanAsync_AnyRing_LeavesDatabaseAndRingUnchanged
          - SecretScan_ScanAsync_MalformedKeyFileOnly_CountsSecretsUnreadableAndCreatesNoKey

      - id: ReviewCenter-SecretScan-ReadOnly-NoDatabase
        title: >-
          The SecretScan class shall not create a database that does not exist.
        justification: |
          A scan must leave no trace, and an empty database that it created would look like a healthy installation.
        tests:
          - SecretScan_ScanAsync_PlaintextKeyFile_IsCountedAndMissingDatabaseIsNotCreated

      - id: ReviewCenter-SecretScan-ReadOnly-NoKey
        title: >-
          The SecretScan class shall not create a key, also when the key ring is empty or holds only malformed key
          files.
        justification: |
          A scan that created a key would hide the very loss that it is meant to find.
        tests:
          - SecretScan_ScanAsync_EmptyRingWithSecrets_CountsThemUnreadableAndCreatesNoKey
          - SecretScan_ScanAsync_MalformedKeyFileOnly_CountsSecretsUnreadableAndCreatesNoKey
          - SecretScan_ScanAsync_AnyRing_LeavesDatabaseAndRingUnchanged

      - id: ReviewCenter-SecretScan-ReadOnly-NoKeyFolder
        title: >-
          The SecretScan class shall not create a key folder that does not exist.
        justification: |
          A scan must leave no trace, and a key folder that it created would hide that the ring is missing.
        tests:
          - SecretScan_ScanAsync_MissingKeyFolder_ReportsEmptyRingAndCreatesNoFolder

      - id: ReviewCenter-SecretScan-ReadOnly-NoProtect
        title: >-
          The SecretScan class shall never protect a value.
        justification: |
          Protecting a value would create a key in a key ring that has none.
        tests:
          - SecretScan_ScanAsync_Secrets_NeverCallsProtect

      - id: ReviewCenter-SecretScan-ReadOnly-Arguments
        title: >-
          The SecretScan class shall refuse a missing key folder, missing database options, a missing token protector,
          or a missing second-factor protector with an argument error.
        justification: |
          A missing argument is a programming error that must not turn into a wrong result.
        tests:
          - SecretScan_ScanAsync_NullArgument_ThrowsArgumentNullException

      # ---------------------------------------------------------------------------------------------------------------
      # NoDisclosure: the result holds counts and ids only
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-SecretScan-NoDisclosure
        title: >-
          The SecretScan class shall return no secret, decrypted value, ciphertext, or path in its result.
        justification: |
          The result is printed by the configuration check and logged at the server start, so it must not be able to
          disclose what the key ring protects, nor where the files are.
        tests:
          - SecretScan_ScanAsync_Result_HoldsNoSecretCiphertextOrPath

      - id: ReviewCenter-SecretScan-NoDisclosure-IdsOnly
        title: >-
          The SecretScan class shall return only counts and the ids of the rows that cannot be read as information
          about the secrets.
        justification: |
          The ids are what the operator needs to find the damage, and nothing more is needed.
        tests:
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
