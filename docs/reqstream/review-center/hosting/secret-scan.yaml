---
# Software Unit Requirements for the SecretScan Class
#
# The SecretScan class is the read-only look at what the key ring and the database hold: how many key files the ring
# has and how many of them are not encrypted, and how many repository tokens and second-factor secrets the database
# holds and how many of those the ring can no longer decrypt. The server start and the key check of the
# self-validation use it to find a restored database without its key ring before anything is lost.

sections:
  - title: SecretScan Unit Requirements
    requirements:
      - id: ReviewCenter-SecretScan-RingState
        title: >-
          The SecretScan class shall report the number of key files of the key ring and how many of them hold an
          unencrypted key, treating a folder that does not exist as a ring without keys.
        justification: |
          Whether the ring has any key at all is the first fact needed to tell a lost ring from a healthy one, and
          whether its keys are unencrypted is what a restore check and a policy of encrypted keys depend on.
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable
          - SecretScan_ScanAsync_PlaintextKeyFile_IsCountedAndMissingDatabaseIsNotCreated
          - SecretScan_ScanAsync_EmptyRingWithSecrets_CountsThemUnreadableAndCreatesNoKey

      - id: ReviewCenter-SecretScan-SecretReadability
        title: >-
          The SecretScan class shall count the repository tokens and the second-factor secrets that the database holds,
          decrypt each with the production protectors and count those that cannot be decrypted, name the repositories
          and the users of those by id, count every secret as unreadable without decrypting it when the ring has no key
          file, and treat a database that is missing, or has no such table or no such row, as holding no secret.
        justification: |
          A secret that cannot be decrypted is the damage that a lost or foreign key ring does, and the operator needs
          to know how much of it and where. Decrypting with the protectors that the server uses is the only test that
          is true to what the server will be able to do. A ring without keys would otherwise create one when asked to
          decrypt, so nothing is decrypted then. A new installation has no secrets and must not be reported as damaged.
        tests:
          - SecretScan_ScanAsync_SecretsOfTheRing_AreCountedReadable
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
          - SecretScan_ScanAsync_MixedSecrets_CountsOnlyTheUnreadableOnes
          - SecretScan_ScanAsync_EmptyRingWithSecrets_CountsThemUnreadableAndCreatesNoKey
          - SecretScan_ScanAsync_NoTablesOrNoRows_HoldsNoSecrets
          - SecretScan_FormatIds_ManyIds_ShowsTenAndTheCountOfTheOthers

      - id: ReviewCenter-SecretScan-ReadOnly
        title: >-
          The SecretScan class shall open the database read-only, shall never create a database, a key, a key folder,
          or any other file, and shall never protect a value, so that the database and the key ring are as they were.
        justification: |
          The scan runs before the server has decided to start and for a check that an operator runs on a restored
          copy; a scan that created a key would hide the very loss it is meant to find, and one that wrote to the
          database would change the evidence of a restore.
        tests:
          - SecretScan_ScanAsync_AnyRing_LeavesDatabaseAndRingUnchanged
          - SecretScan_ScanAsync_EmptyRingWithSecrets_CountsThemUnreadableAndCreatesNoKey
          - SecretScan_ScanAsync_PlaintextKeyFile_IsCountedAndMissingDatabaseIsNotCreated
          - SecretScan_ScanAsync_NullArgument_ThrowsArgumentNullException

      - id: ReviewCenter-SecretScan-NoDisclosure
        title: >-
          The SecretScan class shall never return, log, or put into a message a secret, a decrypted value, a
          ciphertext, or a path, and shall return only counts and the ids of the rows that cannot be read.
        justification: |
          The result is printed by the configuration check and logged at the server start, so it must not be able to
          disclose what the key ring protects, nor where the files are.
        tests:
          - SecretScan_ScanAsync_Result_HoldsNoSecretCiphertextOrPath
          - SecretScan_ScanAsync_OtherRing_CountsEverySecretUnreadableWithIds
