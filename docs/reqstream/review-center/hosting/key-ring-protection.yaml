---
# Software Unit Requirements for the KeyRingProtection Class
#
# The KeyRingProtection class decides how the Data Protection key ring is protected at rest (Windows DPAPI, a
# certificate, or the permissions of its folder), wires the encryption of the key files, and checks the ring before
# the server starts, so that a wrong setting or a wrong certificate stops the start with a message that names the
# setting instead of silently replacing the keys.
#
# Every requirement states one criterion. The first criterion of a topic keeps the original id; the further criteria of
# the same topic are named <original id>-<Aspect>.

sections:
  - title: KeyRingProtection Unit Requirements
    requirements:
      # ---------------------------------------------------------------------------------------------------------------
      # Auto: which protection the default choice picks
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-Auto
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Auto, choose the certificate protection on
          any operating system when DataProtection:CertificatePath is set.
        justification: |
          An operator who supplies a certificate has asked for it to be used, on any platform.
        tests:
          - KeyRingProtection_ResolveMode_AutoWithCertificatePath_ChoosesCertificate

      - id: ReviewCenter-KeyRingProtection-Auto-Windows
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Auto without a certificate path, choose
          Windows DPAPI on Windows.
        justification: |
          Windows offers a key store that needs no secret, so a new installation is protected without any setting.
        tests:
          - KeyRingProtection_ResolveMode_AutoOnWindowsWithoutCertificate_ChoosesDpapi

      - id: ReviewCenter-KeyRingProtection-Auto-Unix
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Auto without a certificate path, choose
          the permissions of the key folder on an operating system other than Windows.
        justification: |
          Linux and macOS offer no key store without a secret from the operator, so the permissions are all there is.
        tests:
          - KeyRingProtection_ResolveMode_AutoOnUnixWithoutCertificate_ChoosesPermissionsOnly

      - id: ReviewCenter-KeyRingProtection-Auto-Default
        title: >-
          The KeyRingProtection class shall treat DataProtection:Protection as Auto when it is not set.
        justification: |
          A new installation must be protected as well as its operating system allows without any setting.
        tests:
          - KeyRingProtection_ResolveMode_AutoOnWindowsWithoutCertificate_ChoosesDpapi

      - id: ReviewCenter-KeyRingProtection-Auto-Explicit
        title: >-
          The KeyRingProtection class shall use the protection that DataProtection:Protection names, in any letter
          case and ignoring surrounding spaces, instead of the choice of Auto.
        justification: |
          An operator who names a protection must get it, whatever else is configured.
        tests:
          - KeyRingProtection_ResolveMode_ExplicitChoice_IsHonoredInAnyCase

      # ---------------------------------------------------------------------------------------------------------------
      # Dpapi: Windows DPAPI protection
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-Dpapi
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Dpapi on Windows, encrypt the key files
          with Windows DPAPI so that a key file holds an encrypted secret and not the key.
        justification: |
          DPAPI binds the keys to an account or machine without any secret to keep, which is the strongest protection
          available on Windows with no operator effort.
        tests:
          - KeyRingProtection_Apply_Dpapi_CreatesTheEncryptorForTheScope
          - windows@KeyRingProtection_DpapiRing_WindowsKeyFileIsEncryptedAndRestartReadsIt

      - id: ReviewCenter-KeyRingProtection-Dpapi-CurrentUser
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Dpapi, protect the key files for the
          current user when DataProtection:DpapiScope is not set or is CurrentUser.
        justification: |
          The user scope is the default and the narrower binding of the keys.
        tests:
          - KeyRingProtection_Apply_Dpapi_CreatesTheEncryptorForTheScope
          - KeyRingProtection_Prepare_DpapiScope_IsCheckedAndCarried

      - id: ReviewCenter-KeyRingProtection-Dpapi-LocalMachine
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Dpapi with DataProtection:DpapiScope
          LocalMachine in any letter case, protect the key files for the machine.
        justification: |
          A service that runs under changing accounts needs the keys to be bound to the machine.
        tests:
          - KeyRingProtection_Apply_Dpapi_CreatesTheEncryptorForTheScope
          - KeyRingProtection_Prepare_DpapiScope_IsCheckedAndCarried

      - id: ReviewCenter-KeyRingProtection-Dpapi-Restart
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Dpapi on Windows, let the key ring be
          read again after a restart.
        justification: |
          Protected keys that cannot be read after a restart would lose every stored secret.
        tests:
          - windows@KeyRingProtection_DpapiRing_WindowsKeyFileIsEncryptedAndRestartReadsIt

      - id: ReviewCenter-KeyRingProtection-Dpapi-OtherSystem
        title: >-
          The KeyRingProtection class shall refuse DataProtection:Protection Dpapi on an operating system other than
          Windows with a message that names DataProtection:Protection.
        justification: |
          Silently using another protection when the operator asked for DPAPI would leave the keys weaker than the
          operator believes.
        tests:
          - KeyRingProtection_ResolveMode_DpapiOnUnix_ThrowsNamingTheSetting

      - id: ReviewCenter-KeyRingProtection-Dpapi-Log
        title: >-
          The KeyRingProtection class shall log which DPAPI scope protects the key ring when DPAPI is the protection.
        justification: |
          The operator must be able to see which protection is in force.
        tests:
          - KeyRingProtection_LogProtection_EachMode_LogsTheProtectionInForce

      - id: ReviewCenter-KeyRingProtection-Dpapi-FolderRules
        title: >-
          The KeyRingProtection class shall leave the inherited access rules of the key folder unchanged on Windows
          when DPAPI is the protection.
        justification: |
          DPAPI encrypts the key files itself, so the access rules of the folder are not the protection and must not
          be changed.
        tests:
          - windows@KeyRingProtection_RestrictKeyFolder_WindowsDpapi_LeavesTheInheritedRules

      # ---------------------------------------------------------------------------------------------------------------
      # Certificate: protection with a certificate of the operator
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-Certificate
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Certificate, encrypt the key files with the
          certificate that DataProtection:CertificatePath names so that a key file holds an encrypted secret and not
          the key.
        justification: |
          A certificate that the operator supplies is the only way to bind the keys to a secret on Linux and macOS,
          and it also lets a ring move between machines.
        tests:
          - KeyRingProtection_CertificateRing_KeyFileIsEncryptedAndRestartReadsIt
          - KeyRingProtection_Apply_CertificateAndOthers_WiresTheCertificateEncryptorOnly

      - id: ReviewCenter-KeyRingProtection-Certificate-Restart
        title: >-
          The KeyRingProtection class shall, for DataProtection:Protection Certificate, let the key ring be read again
          after a restart with the same certificate.
        justification: |
          Keys that cannot be read after a restart would lose every stored secret.
        tests:
          - KeyRingProtection_CertificateRing_KeyFileIsEncryptedAndRestartReadsIt

      - id: ReviewCenter-KeyRingProtection-Certificate-Formats
        title: >-
          The KeyRingProtection class shall load a certificate with a private key from a PFX file.
        justification: |
          Operators hold their certificates in different formats and should not have to convert them; the PFX file is
          the usual format on Windows.
        tests:
          - KeyRingProtection_Prepare_PfxCertificate_LoadsWithPrivateKey
          - KeyRingProtection_Prepare_SupportedFormats_LoadWithPrivateKey

      - id: ReviewCenter-KeyRingProtection-Certificate-Formats-PemInside
        title: >-
          The KeyRingProtection class shall load a certificate with a private key from a PEM file that holds the key.
        justification: |
          A single PEM file with the certificate and its key is the usual output of many certificate tools.
        tests:
          - KeyRingProtection_Prepare_PemWithKeyInside_LoadsWithPrivateKey

      - id: ReviewCenter-KeyRingProtection-Certificate-Formats-PemSeparateKey
        title: >-
          The KeyRingProtection class shall load a certificate with a private key from a PEM file and the separate key
          file that DataProtection:CertificateKeyPath names.
        justification: |
          Many tools write the certificate and its key to two files, and the operator should not have to join them.
        tests:
          - KeyRingProtection_Prepare_PemWithSeparateKeyFile_LoadsWithPrivateKey

      - id: ReviewCenter-KeyRingProtection-Certificate-Formats-PemEncryptedKey
        title: >-
          The KeyRingProtection class shall load a certificate with a private key from a PEM file with an encrypted key.
        justification: |
          A private key that is stored encrypted is safer on disk, and the operator should not have to decrypt it.
        tests:
          - KeyRingProtection_Prepare_PemWithEncryptedKey_LoadsWithPrivateKey

      - id: ReviewCenter-KeyRingProtection-Certificate-Password
        title: >-
          The KeyRingProtection class shall open a certificate with the password in
          DataProtection:CertificatePassword.
        justification: |
          A certificate that is protected by a password cannot be used without it.
        tests:
          - KeyRingProtection_Prepare_SupportedFormats_LoadWithPrivateKey

      - id: ReviewCenter-KeyRingProtection-Certificate-PasswordFile
        title: >-
          The KeyRingProtection class shall open a certificate with the password that
          DataProtection:CertificatePasswordFile names.
        justification: |
          A password in a file keeps the secret out of the configuration.
        tests:
          - KeyRingProtection_CertificateRing_PreviousCertificateAndPasswordFile_StillReadTheRing

      - id: ReviewCenter-KeyRingProtection-Certificate-NoPath
        title: >-
          The KeyRingProtection class shall refuse DataProtection:Protection Certificate without a
          DataProtection:CertificatePath with a message that names DataProtection:CertificatePath and
          DataProtection:Protection.
        justification: |
          The operator must be told which setting is missing.
        tests:
          - KeyRingProtection_ResolveMode_CertificateWithoutPath_ThrowsNamingTheSettings

      - id: ReviewCenter-KeyRingProtection-Certificate-Missing
        title: >-
          The KeyRingProtection class shall report a certificate file that does not exist as a problem that names
          DataProtection:CertificatePath and the path.
        justification: |
          A start that falls back to plain keys when the certificate is missing would leave the keys unprotected
          without telling the operator.
        tests:
          - KeyRingProtection_Prepare_MissingCertificateFile_ReturnsProblemNamingTheSetting

      - id: ReviewCenter-KeyRingProtection-Certificate-WrongPassword
        title: >-
          The KeyRingProtection class shall report a certificate that the password does not open as a problem that
          says wrong password or not a certificate with a private key.
        justification: |
          The operator must be told what to check when a certificate cannot be opened.
        tests:
          - KeyRingProtection_Prepare_WrongPassword_ReturnsProblemWithoutThePassword

      - id: ReviewCenter-KeyRingProtection-Certificate-NoPrivateKey
        title: >-
          The KeyRingProtection class shall report a file that is not a certificate, or a certificate without a
          private key, as a problem that says wrong password or not a certificate with a private key.
        justification: |
          The key files cannot be encrypted without a private key.
        tests:
          - KeyRingProtection_Prepare_NotACertificateWithPrivateKey_ReturnsProblem

      - id: ReviewCenter-KeyRingProtection-Certificate-Rsa
        title: >-
          The KeyRingProtection class shall report a certificate whose key is not an RSA key as a problem that names
          RSA and DataProtection:CertificatePath.
        justification: |
          Only an RSA certificate can encrypt the key files, and the operator must be told why another one is refused.
        tests:
          - KeyRingProtection_Prepare_EcdsaCertificate_ReturnsProblemNamingRsa

      - id: ReviewCenter-KeyRingProtection-Certificate-Platform
        title: >-
          The KeyRingProtection class shall fail with an error that names DataProtection:CertificatePath and the path
          when the operating system cannot load the certificate file.
        justification: |
          The operator must know why a file that exists is refused, instead of seeing an unexplained platform error.
        tests:
          - KeyRingProtection_LoadCertificate_PlatformCannotLoadPfx_ThrowsNamingTheSetting

      - id: ReviewCenter-KeyRingProtection-Certificate-BothPasswords
        title: >-
          The KeyRingProtection class shall report a certificate password that is set both in
          DataProtection:CertificatePassword and in DataProtection:CertificatePasswordFile as a problem that names
          both settings.
        justification: |
          Two passwords are ambiguous, and the operator must be told to choose one.
        tests:
          - KeyRingProtection_Prepare_PasswordAndPasswordFile_ReturnsProblemWithoutThePassword

      - id: ReviewCenter-KeyRingProtection-Certificate-PasswordHidden
        title: >-
          The KeyRingProtection class shall never put the certificate password into the message about a certificate
          that cannot be loaded.
        justification: |
          A message is logged and printed, and a password in it would be disclosed.
        tests:
          - KeyRingProtection_Prepare_MissingCertificateFile_ReturnsProblemNamingTheSetting
          - KeyRingProtection_Prepare_WrongPassword_ReturnsProblemWithoutThePassword
          - KeyRingProtection_LoadCertificate_PlatformCannotLoadPfx_ThrowsNamingTheSetting
          - KeyRingProtection_Prepare_PasswordAndPasswordFile_ReturnsProblemWithoutThePassword

      - id: ReviewCenter-KeyRingProtection-Certificate-Log
        title: >-
          The KeyRingProtection class shall log at information level the thumbprint of the certificate that protects
          the key ring.
        justification: |
          The operator must be able to see which certificate is in force, and a thumbprint is public.
        tests:
          - KeyRingProtection_LogProtection_EachMode_LogsTheProtectionInForce

      # ---------------------------------------------------------------------------------------------------------------
      # PermissionsOnly: protection by the permissions of the key folder and the key files
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-PermissionsOnly
        title: >-
          The KeyRingProtection class shall restrict the existing key files of the key ring to read and write by their
          owner (mode 0600) on Linux and macOS, whatever mode they were created with.
        justification: |
          Without a secret from the operator, the permissions of the key files are the only protection, and a key file
          is created with the default mode.
        tests:
          - ubuntu@KeyRingProtection_RestrictKeyFiles_UnixKeyFiles_AreOwnerReadWriteOnly

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-NewKeyFiles
        title: >-
          The KeyRingProtection class shall restrict a key file that Data Protection stores while the server runs to
          its owner (mode 0600) on Linux and macOS as it is stored.
        justification: |
          The ring rolls to a new key from time to time, and a file that was restricted only at the next start would be
          exposed until then.
        tests:
          - KeyRingProtection_KeyFileRestrictingRepository_StoreElementOnUnix_RestrictsTheStoredFile
          - ubuntu@KeyRingProtection_KeyFileRestrictingRepository_UnixStoredKeyFile_IsOwnerReadWriteOnly

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-NewKeyFiles-StillReadable
        title: >-
          The KeyRingProtection class shall return what was stored through the repository that restricts the key file.
        justification: |
          Restricting the file must not break the ring; a key that is stored but cannot be read back would lock the
          server out at the next start.
        tests:
          - KeyRingProtection_KeyFileRestrictingRepository_StoreElementOnUnix_RestrictsTheStoredFile

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-WindowsFiles
        title: >-
          The KeyRingProtection class shall leave the mode of a key file that it stores on Windows unchanged.
        justification: |
          Windows has no such mode; the access rules of the folder apply there.
        tests:
          - KeyRingProtection_KeyFileRestrictingRepository_StoreElementOnWindows_DoesNotChangeModes

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-WindowsFiles-StillStored
        title: >-
          The KeyRingProtection class shall still store the key file and return what was stored when it runs on
          Windows.
        justification: |
          On Windows the decorator must act as a plain pass-through; a mode that is skipped by mistake must not skip
          the storage.
        tests:
          - KeyRingProtection_KeyFileRestrictingRepository_StoreElementOnWindows_DoesNotChangeModes

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-UnixFolder
        title: >-
          The KeyRingProtection class shall restrict the key folder to its owner (mode 0700) on Linux and macOS.
        justification: |
          Only the account of the server may read keys that decrypt the stored tokens.
        tests:
          - ubuntu@KeyRingProtection_PrepareKeyFolder_UnixFolder_IsOwnerOnly

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-WindowsFolder
        title: >-
          The KeyRingProtection class shall, on Windows, restrict the key folder to access rules without inheritance
          that admit only the account of the server and the system.
        justification: |
          A folder inherits the access rules of its parent on Windows, and those usually admit other users.
        tests:
          - windows@KeyRingProtection_RestrictKeyFolder_WindowsPermissionsOnly_AdmitsOnlyOwnerAndSystem

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-WindowsInherit
        title: >-
          The KeyRingProtection class shall, on Windows, give a key file that is created later in the restricted key
          folder exactly the access rules of the folder.
        justification: |
          A new key that is created when the ring rolls must be as restricted as the folder.
        tests:
          - windows@KeyRingProtection_RestrictKeyFolder_WindowsPermissionsOnly_AdmitsOnlyOwnerAndSystem

      - id: ReviewCenter-KeyRingProtection-PermissionsOnly-Warning
        title: >-
          The KeyRingProtection class shall log a warning that the key ring is not encrypted at rest, and that names
          DataProtection:CertificatePath and DataProtection:RequireEncryptedKeys as the remedies, when the permissions
          of the key folder are the protection.
        justification: |
          The operator must be told that the protection is not encryption, and how to get encryption.
        tests:
          - KeyRingProtection_LogProtection_EachMode_LogsTheProtectionInForce

      # ---------------------------------------------------------------------------------------------------------------
      # Require: refuse a ring that is not encrypted when encryption is required
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-Require
        title: >-
          The KeyRingProtection class shall report DataProtection:RequireEncryptedKeys true together with the
          PermissionsOnly protection, whether chosen explicitly or by Auto, as a problem that names
          DataProtection:RequireEncryptedKeys.
        justification: |
          An operator who must not run with plain keys needs the server to enforce that, rather than to rely on a log
          line.
        tests:
          - KeyRingProtection_Prepare_PermissionsOnlyWithRequireEncryptedKeys_ReturnsProblem
          - KeyRingProtection_Prepare_AutoOnUnixWithRequireEncryptedKeys_ReturnsProblem

      - id: ReviewCenter-KeyRingProtection-Require-PlaintextRing
        title: >-
          The KeyRingProtection class shall refuse a key ring that holds a key file that is not encrypted when
          DataProtection:RequireEncryptedKeys is true, with a message that names DataProtection:RequireEncryptedKeys
          and the file.
        justification: |
          A ring that was made before encryption was enabled must stop the start instead of staying in the clear.
        tests:
          - KeyRingProtection_CheckRing_RequireEncryptedKeysWithPlaintextKeyFile_Refuses

      - id: ReviewCenter-KeyRingProtection-Require-EncryptedRing
        title: >-
          The KeyRingProtection class shall accept a key ring whose key files are all encrypted when
          DataProtection:RequireEncryptedKeys is true.
        justification: |
          The setting must not stop an installation that is protected as required.
        tests:
          - KeyRingProtection_CertificateRing_KeyFileIsEncryptedAndRestartReadsIt

      # ---------------------------------------------------------------------------------------------------------------
      # PreviousCertificates: replacing the certificate without losing the ring
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-PreviousCertificates
        title: >-
          The KeyRingProtection class shall let a key ring whose key files were encrypted with a certificate listed in
          DataProtection:PreviousCertificatePaths be read when another certificate is the current one.
        justification: |
          A certificate expires or is replaced, and the keys that it protects must stay readable until Data Protection
          has rolled to a key that the new certificate protects.
        tests:
          - KeyRingProtection_CertificateRing_PreviousCertificateAndPasswordFile_StillReadTheRing

      - id: ReviewCenter-KeyRingProtection-PreviousCertificates-SharedPassword
        title: >-
          The KeyRingProtection class shall open each certificate of DataProtection:PreviousCertificatePaths with the
          password of the current certificate or, when that password does not open it, without a password.
        justification: |
          Earlier certificates are often kept without the password of the new one.
        tests:
          - KeyRingProtection_Prepare_PreviousCertificates_LoadWithSharedPasswordOrNone

      - id: ReviewCenter-KeyRingProtection-PreviousCertificates-Entry
        title: >-
          The KeyRingProtection class shall name the position of an entry of DataProtection:PreviousCertificatePaths
          that cannot be loaded in the problem that it reports.
        justification: |
          The operator must be told which of the old certificates is at fault.
        tests:
          - KeyRingProtection_Prepare_PreviousCertificates_LoadWithSharedPasswordOrNone

      # ---------------------------------------------------------------------------------------------------------------
      # WrongKeyGuard: no new key over a ring that cannot be read
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard
        title: >-
          The KeyRingProtection class shall refuse a key ring that holds key files when the newest key, or every key,
          cannot be decrypted, with a message that names DataProtection:CertificatePath and
          DataProtection:PreviousCertificatePaths.
        justification: |
          Data Protection answers a key that it cannot read by silently creating a new one, after which every stored
          token and secret is unreadable. Starting with the wrong certificate must stop before that happens.
        tests:
          - KeyRingProtection_CheckRing_WrongCertificate_RefusesWithoutCreatingASecondKey

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-NoCertificate
        title: >-
          The KeyRingProtection class shall refuse an encrypted key ring when no certificate is configured, with a
          message that names DataProtection:CertificatePath.
        justification: |
          Starting without the certificate after one was used would lose the ring.
        tests:
          - KeyRingProtection_CheckRing_EncryptedRingWithoutCertificate_Refuses

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-NoKeyCreated
        title: >-
          The KeyRingProtection class shall create no key and change nothing in the key folder when it refuses a key
          ring.
        justification: |
          A replacement key is the damage that the refusal is meant to prevent.
        tests:
          - KeyRingProtection_CheckRing_WrongCertificate_RefusesWithoutCreatingASecondKey
          - KeyRingProtection_CheckRing_KeyFilesButNoReadableKey_RefusesWithoutChangingTheFolder

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-UnreadableKeys
        title: >-
          The KeyRingProtection class shall refuse a key folder that holds key files from which no key can be read,
          with a message that names DataProtection:KeysPath and says that the keys could not be read.
        justification: |
          Data Protection skips a key file that it cannot deserialize, so a folder with key files and no readable key
          is not a new ring.
        tests:
          - KeyRingProtection_CheckRing_KeyFilesButNoReadableKey_RefusesWithoutChangingTheFolder

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-ContentHidden
        title: >-
          The KeyRingProtection class shall not put the content of an unreadable key file into the message that it
          refuses with.
        justification: |
          A key file may hold a secret, and a message is logged and printed.
        tests:
          - KeyRingProtection_CheckRing_KeyFilesButNoReadableKey_RefusesWithoutChangingTheFolder

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-NewRing
        title: >-
          The KeyRingProtection class shall accept a key folder that is empty or does not exist, also when
          DataProtection:RequireEncryptedKeys is true.
        justification: |
          A new installation has no ring yet and must start.
        tests:
          - KeyRingProtection_CheckRing_EmptyRing_Passes

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-NewRingNoKey
        title: >-
          The KeyRingProtection class shall create no key when it accepts an empty key ring.
        justification: |
          Creating a key while checking would hide a ring that was lost.
        tests:
          - KeyRingProtection_CheckRing_EmptyRing_Passes

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-OlderKeyError
        title: >-
          The KeyRingProtection class shall log one error that names DataProtection:PreviousCertificatePaths when only
          an older key of the key ring cannot be decrypted.
        justification: |
          An old key that cannot be read must be reported, so that the operator can list the certificate that it needs.
        tests:
          - KeyRingProtection_CheckRing_OlderKeyUnreadable_LogsErrorAndPasses

      - id: ReviewCenter-KeyRingProtection-WrongKeyGuard-OlderKeyStart
        title: >-
          The KeyRingProtection class shall accept a key ring in which the newest key can be decrypted although an
          older key cannot.
        justification: |
          The newest key is enough to run, and stopping the server for an old key would be too strict.
        tests:
          - KeyRingProtection_CheckRing_OlderKeyUnreadable_LogsErrorAndPasses

      # ---------------------------------------------------------------------------------------------------------------
      # AllowNewKeyRing: the escape for an accepted loss, and the read-only description of a ring
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-AllowNewKeyRing
        title: >-
          The KeyRingProtection class shall provide the DataProtection:AllowNewKeyRing setting with the value false
          when it is not set.
        justification: |
          The escape for an operator who has accepted the loss of the key ring must be off unless it is chosen.
        tests:
          - KeyRingSettings_AllowNewKeyRing_DefaultsToFalse

      - id: ReviewCenter-KeyRingProtection-AllowNewKeyRing-KeyFileCounts
        title: >-
          The KeyRingProtection class shall describe a key ring by the number of its key files and how many of them
          hold an unencrypted or an encrypted key.
        justification: |
          The check of a restored ring and the scan of the secrets depend on these facts.
        tests:
          - KeyRingProtection_InspectKeyFiles_MixedFolder_CountsByKindAndChangesNothing

      - id: ReviewCenter-KeyRingProtection-AllowNewKeyRing-MissingFolder
        title: >-
          The KeyRingProtection class shall describe a key folder that does not exist as a key ring with no key files.
        justification: |
          The count of a missing folder is zero, so that a new installation reads as a ring that is empty.
        tests:
          - KeyRingProtection_InspectKeyFiles_MixedFolder_CountsByKindAndChangesNothing

      - id: ReviewCenter-KeyRingProtection-AllowNewKeyRing-MissingFolder-NothingCreated
        title: >-
          The KeyRingProtection class shall not create the key folder when it describes a key folder that does not
          exist.
        justification: |
          A new installation has no key folder, and describing it must leave no trace.
        tests:
          - KeyRingProtection_InspectKeyFiles_MixedFolder_CountsByKindAndChangesNothing

      - id: ReviewCenter-KeyRingProtection-AllowNewKeyRing-ReadOnly
        title: >-
          The KeyRingProtection class shall change nothing in the key folder while it describes the key ring.
        justification: |
          A ring that is changed while it is examined would hide the loss that the examination is meant to find.
        tests:
          - KeyRingProtection_InspectKeyFiles_MixedFolder_CountsByKindAndChangesNothing

      - id: ReviewCenter-KeyRingProtection-AllowNewKeyRing-Unreadable
        title: >-
          The KeyRingProtection class shall count a key file that cannot be read only in the total number of key
          files.
        justification: |
          The operator still sees that the file exists, and one unreadable file does not stop the description.
        tests:
          - KeyRingProtection_InspectKeyFiles_AccessDeniedKeyFile_CountsOnlyInTheTotal

      # ---------------------------------------------------------------------------------------------------------------
      # Validation: unusable settings are reported with the setting that is wrong
      # ---------------------------------------------------------------------------------------------------------------
      - id: ReviewCenter-KeyRingProtection-Validation
        title: >-
          The KeyRingProtection class shall refuse a DataProtection:Protection value that is not Auto, Dpapi,
          Certificate, or PermissionsOnly with a message that names the setting and lists the choices.
        justification: |
          A misspelled protection must not fall back to one that is weaker than the operator intended, and the
          operator must be told which setting is wrong and what the choices are.
        tests:
          - KeyRingProtection_ResolveMode_UnknownProtection_ThrowsListingTheChoices

      - id: ReviewCenter-KeyRingProtection-Validation-Scope
        title: >-
          The KeyRingProtection class shall report a DataProtection:DpapiScope value that is not CurrentUser or
          LocalMachine as a problem that names the setting and lists the choices.
        justification: |
          A misspelled scope must not fall back to a default that binds the keys differently than intended.
        tests:
          - KeyRingProtection_Prepare_DpapiScope_IsCheckedAndCarried

      - id: ReviewCenter-KeyRingProtection-Validation-Report
        title: >-
          The KeyRingProtection class shall report an unknown protection as a problem, and not as an exception, whose
          message starts with the words invalid key ring settings.
        justification: |
          The server turns the problem into one clear error at the start.
        tests:
          - KeyRingProtection_Prepare_UnknownProtection_ReturnsProblemWithPrefix

      - id: ReviewCenter-KeyRingProtection-Validation-BadType
        title: >-
          The KeyRingProtection class shall report a setting whose value cannot be read as its type, such as a boolean
          that is not true or false, as a problem whose message starts with the words invalid key ring settings.
        justification: |
          A value that cannot be bound must not be ignored, because the setting would then silently keep its default.
        tests:
          - KeyRingProtection_Prepare_Configuration_BindsTheSectionAndReportsBadValues

      - id: ReviewCenter-KeyRingProtection-Validation-Binding
        title: >-
          The KeyRingProtection class shall read its settings from the DataProtection configuration section, including
          the list of previous certificates and DataProtection:RequireEncryptedKeys, without regard to the letter case
          of the names.
        justification: |
          The settings of the operator must reach the logic that decides how the key ring is protected.
        tests:
          - KeyRingProtection_Prepare_Configuration_BindsTheSectionAndReportsBadValues
