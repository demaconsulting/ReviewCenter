---
# Software Unit Requirements for the ServerHost Class
#
# The ServerHost class is the composition root of the web server: it builds, configures,
# and runs the ASP.NET Core application behind the serve verb.

sections:
  - title: ServerHost Unit Requirements
    requirements:
      - id: ReviewCenter-ServerHost-Health
        title: The ServerHost class shall map a /health route that answers HTTP status 200 with the text Healthy.
        justification: |
          Probes and test tooling need a trivial liveness check that does not depend on the
          user interface or on authentication.
        tests:
          - ServerHost_CreateApplication_HealthRoute_Returns200Healthy

      - id: ReviewCenter-ServerHost-Logging
        title: >-
          The ServerHost class shall write a start-up log entry that exposes the listen URL as a
          named, machine-readable value when the server has started.
        justification: |
          A start-up entry confirms to operators that the server is accepting requests and
          where. Exposing the URL as a named value, rather than only as text, lets log aggregation
          tools filter and correlate entries.
        tests:
          - ServerHost_CreateApplication_StartupLogging_EmitsStructuredEntry

      - id: ReviewCenter-ServerHost-SilentMode
        title: >-
          The ServerHost class shall omit console logging when the silent option is set and
          shall include console logging otherwise.
        justification: |
          The silent option must hold for the long-running server just as it does for every
          other action, so that automated environments do not receive unwanted console output,
          while interactive operators see the server log by default.
        tests:
          - ServerHost_CreateApplication_Silent_OmitsConsoleProvider
          - ServerHost_CreateApplication_NotSilent_IncludesConsoleProvider

      - id: ReviewCenter-ServerHost-Database
        title: >-
          The ServerHost class shall read the Database settings, register the database store and the project,
          review, user, and signing services for the pages, and create the database when the application is
          built.
        justification: |
          The composition root is the one place that connects the pages to the database. Creating the database
          while building the application means a ready database exists before the first request and a failure
          is found before the server starts.
        tests:
          - ServerHost_CreateApplication_DatabaseConfigured_CreatesFileAndServesDomainServices
          - ServerHost_CreateApplication_RestartedOnSameDatabase_KeepsData
          - ServerHost_AddServices_Configured_RegistersUserService
          - ServerHost_AddServices_Configured_RegistersSigningService

      - id: ReviewCenter-ServerHost-Authentication
        title: >-
          The ServerHost class shall set up cookie sign-in with a session cookie that is HttpOnly, SameSite Lax,
          and Secure when the request is over HTTPS, lasting the number of hours set in Auth:SessionHours (8 by
          default), shall fail with an error that names Auth:SessionHours when that value is not a positive
          number, shall fail with an error that names Auth:RevalidationSeconds when that value, the seconds
          between two checks of the user of an open page (30 by default), is below 5, shall require a signed-in
          user for all pages except the home page and the login page, and shall map the sign-in and sign-out
          endpoints, keeping the /health route open to everyone.
        justification: |
          The composition root is the one place where authentication is connected to the pages. A wrong session
          length or check interval must stop the server at start-up with a clear message, a too short interval
          would turn the check of open pages into constant database load, and the pages must be closed by
          default so that a new page cannot be left open by mistake.
        tests:
          - ServerHost_CreateApplication_NonPositiveSessionHours_ThrowsClearError
          - ServerHost_CreateApplication_RevalidationSecondsBelowMinimum_ThrowsClearError
          - ServerHost_CreateApplication_HealthRoute_Returns200Healthy
          - SignIn_PublicPage_Anonymous_IsServed
          - SignIn_ProtectedPage_Anonymous_RedirectsToLogin

      - id: ReviewCenter-ServerHost-GitSettings
        title: >-
          The ServerHost class shall fail with an error that names Git:TimeoutSeconds, before it serves any request,
          when that value, the time limit of every git call in seconds (120 by default), is not between 1 and 3600.
        justification: |
          A zero, negative or huge limit would either silently fall back to a default the operator did not choose
          or let a hung git call block a repository for hours, so a wrong value must stop the server at start-up
          with a message that names the setting.
        tests:
          - ServerHost_CreateApplication_GitTimeoutOutOfRange_ThrowsClearError
          - ServerHost_CreateApplication_GitTimeoutAtLimits_Starts

      - id: ReviewCenter-ServerHost-DatabaseFailure
        title: >-
          The ServerHost class shall fail with an error that begins Failed to prepare the database when the
          database settings cannot be used, and shall report that error and return exit code 1 when running the
          server.
        justification: |
          Operators need one clear message for any database problem (an unsupported provider, an unusable
          location), and a non-zero exit code so that a supervisor or script notices the failure.
        tests:
          - ServerHost_CreateApplication_UnsupportedProvider_ThrowsClearError
          - ServerHost_RunAsync_UnsupportedProvider_ReturnsExitCodeOne
          - ServerHost_RunAsync_UnusableDatabaseLocation_ReturnsExitCodeOne

      - id: ReviewCenter-ServerHost-AuditServices
        title: >-
          The ServerHost class shall register the audit appender, the audit store, and the audit service once for the
          whole process, shared by the server and by the command-line verbs, with a logging hook that writes a
          warning, never shown to the user, when the audit trail cannot be written.
        justification: |
          One gate shared by all stores is what keeps the hash chain linear, and the operator must learn from the
          log when the trail could not be written.
        tests:
          - AuditCommand_Run_IntactTrail_ReportsEntryCountWithExitCodeZero
          - SignIn_Flow_LoginFailureAndLogout_FormAnIntactChain

      - id: ReviewCenter-ServerHost-ProjectAccess
        title: >-
          The ServerHost class shall register the project access rules (`IProjectAccess`) once for the whole
          process, as a singleton shared by the services, the endpoints, and the pages, before the services that use
          them.
        justification: |
          The rules read the stored users and memberships afresh on every call, so one shared instance holds no
          state that could go stale, and every service decides visibility the same way.
        tests:
          - ServerHost_CreateApplication_DatabaseConfigured_CreatesFileAndServesDomainServices
          - ApiProjectAccess_EveryProjectRoute_NonMemberToken_AnswersLikeAMissingProject

      - id: ReviewCenter-ServerHost-RepositoryServices
        title: >-
          The ServerHost class shall register the repository registry, the credential protector, and the git content
          source once for the whole process, reading the Git settings, with the git cache folder
          (Git:CachePath) and the key ring folder (DataProtection:KeysPath) defaulting to folders beside the
          database file.
        justification: |
          The composition root is the one place that connects the registry to the database, the key ring, and git.
          Defaults beside the database mean a new installation works without configuration and the data, the keys,
          and the cache are kept and backed up together.
        tests:
          - ServerHost_AddServices_Configured_RegistersRepositoryServicesWithDefaultFolders
          - ServerHost_ResolveKeysPath_ConfiguredOrDefault_ChoosesTheFolder

      - id: ReviewCenter-ServerHost-PlannerServices
        title: >-
          The ServerHost class shall register the review planner and the parser of the review-set file once for the
          whole process.
        justification: |
          The planner is used by the pages that offer a review for every review-set of a repository, and the
          composition root is the one place that connects it to the review service, the signing service, the git
          source, and the parser.
        tests:
          - ServerHost_AddServices_Configured_RegistersReviewPlannerAndParser

      - id: ReviewCenter-ServerHost-KeyRing
        title: >-
          The ServerHost class shall keep the Data Protection key ring in a folder, so that a token encrypted before a
          restart is readable after it.
        justification: |
          Without a persisted key ring the keys would be new at every start, and every stored token would become
          unreadable.
        tests:
          - ServerHost_Restart_KeyRingPersisted_TokenStaysReadable

      - id: ReviewCenter-ServerHost-KeyRingFailure
        title: >-
          The ServerHost class shall fail with an error that names the key ring folder and DataProtection:KeysPath,
          before serving requests, when the key ring folder cannot be written.
        justification: |
          A key ring that cannot be saved would silently fall back to keys that are lost at the next restart. The
          operator must learn that at start-up and correct the setting.
        tests:
          - ServerHost_CreateApplication_KeyRingFolderNotWritable_ThrowsClearError

      - id: ReviewCenter-ServerHost-AttestationServices
        title: >-
          The ServerHost class shall register the attestation key provider chosen by the Attestation settings, the
          renderer, the signer, and the attestation service once for the whole process, keep the self-signed key in
          Attestation:SelfSignedFolder or, by default, in a folder beside the Data Protection keys, and map the
          download of the attestation of a review.
        justification: |
          The composition root is the one place that connects the Evidence subsystem to the audit trail, the signing
          service, and the settings. The default folder keeps the self-signed key with the other keys so that it
          persists across restarts.
        tests:
          - ServerHost_CreateApplication_NoAttestationSettings_CreatesSelfSignedKeyBesideTheDataProtectionKeys
          - ServerHost_CreateApplication_SelfSignedFolderConfigured_KeepsTheKeyThere

      - id: ReviewCenter-ServerHost-AttestationKeyFailure
        title: >-
          The ServerHost class shall obtain the signing key at start-up and fail, before serving requests, with an
          error that says the attestation signing key is not usable and names the setting at fault, when the provider
          is unknown, the thumbprint is missing, the certificate is not in the store, RequireTrustedKey is set with the
          SelfSigned provider, or the self-signed folder cannot be used.
        justification: |
          An operator who chose a certificate must learn at start-up that the choice does not work, and must not find
          out at the first download. A provider that would not accept the key later would be a trap.
        tests:
          - ServerHost_CreateApplication_UnknownAttestationProvider_ThrowsClearError
          - ServerHost_CreateApplication_CertificateStoreWithoutThumbprint_ThrowsClearError
          - ServerHost_CreateApplication_CertificateNotInStore_ThrowsClearError
          - ServerHost_CreateApplication_RequireTrustedKeyWithSelfSignedProvider_ThrowsClearError
          - ServerHost_CreateApplication_SelfSignedFolderIsAFile_ThrowsClearError

      - id: ReviewCenter-ServerHost-ApiRegistration
        title: >-
          The ServerHost class shall register the personal access token service as one service for the server,
          map the API routes under /api, serve the OpenAPI document without a token, and answer an address under /api
          that does not exist with a JSON problem document instead of a page.
        justification: |
          The API can only be used when the server connects the routes and the token service to the pipeline, and a
          script that mistypes an address must not receive the HTML of the not-found page.
        tests:
          - ServerHost_CreateApplication_ApiRoutes_AreMapped

      - id: ReviewCenter-ServerHost-OidcSettings
        title: >-
          The ServerHost class shall, when the sign-in with an OpenID Connect provider is turned on, check its settings
          at the start and stop with an error that names the setting that is wrong (a missing client secret included)
          and never shows its value or the
          client secret, shall do nothing for the provider when it is off, and shall keep the address of the callback
          for itself so that no other route is mapped there.
        justification: |
          A wrong setting of a sign-in must be found by the administrator when the server starts, not by the first
          person who cannot sign in, and a message that holds the secret would put it in the logs.
        tests:
          - ServerHost_CreateApplication_InvalidOidcSettings_ThrowsClearErrorWithoutSecret
          - ServerHost_CreateApplication_OidcOffOrValid_BuildsTheApplication
          - OidcSignIn_Disabled_EndpointsAreNotMappedAndNoButtonIsShown
