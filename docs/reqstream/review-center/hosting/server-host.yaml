---
# Software Unit Requirements for the ServerHost Class
#
# The ServerHost class is the composition root of the web server: it builds, configures,
# and runs the ASP.NET Core application behind the serve verb.

sections:
  - title: ServerHost Unit Requirements
    requirements:
      - id: ReviewCenter-ServerHost-Health
        title: The ServerHost class shall map a /health route that answers HTTP status 200 with the text Healthy.
        justification: |
          Probes and test tooling need a trivial liveness check that does not depend on the
          user interface or on authentication.
        tests:
          - ServerHost_CreateApplication_HealthRoute_Returns200Healthy

      - id: ReviewCenter-ServerHost-Logging
        title: >-
          The ServerHost class shall write a start-up log entry that exposes the listen URL as a
          named, machine-readable value when the server has started.
        justification: |
          A start-up entry confirms to operators that the server is accepting requests and
          where. Exposing the URL as a named value, rather than only as text, lets log aggregation
          tools filter and correlate entries.
        tests:
          - ServerHost_CreateApplication_StartupLogging_EmitsStructuredEntry

      - id: ReviewCenter-ServerHost-SilentMode
        title: >-
          The ServerHost class shall omit console logging when the silent option is set and
          shall include console logging otherwise.
        justification: |
          The silent option must hold for the long-running server just as it does for every
          other action, so that automated environments do not receive unwanted console output,
          while interactive operators see the server log by default.
        tests:
          - ServerHost_CreateApplication_Silent_OmitsConsoleProvider
          - ServerHost_CreateApplication_NotSilent_IncludesConsoleProvider

      - id: ReviewCenter-ServerHost-Database
        title: >-
          The ServerHost class shall read the Database settings, register the database store and the project,
          review, user, and signing services for the pages, and create the database when the application is
          built.
        justification: |
          The composition root is the one place that connects the pages to the database. Creating the database
          while building the application means a ready database exists before the first request and a failure
          is found before the server starts.
        tests:
          - ServerHost_CreateApplication_DatabaseConfigured_CreatesFileAndServesDomainServices
          - ServerHost_CreateApplication_RestartedOnSameDatabase_KeepsData
          - ServerHost_AddServices_Configured_RegistersUserService
          - ServerHost_AddServices_Configured_RegistersSigningService

      - id: ReviewCenter-ServerHost-Authentication
        title: >-
          The ServerHost class shall set up cookie sign-in with a session cookie that is HttpOnly, SameSite Lax,
          and Secure when the request is over HTTPS, lasting the number of hours set in Auth:SessionHours (8 by
          default), shall fail with an error that names Auth:SessionHours when that value is not a positive
          number, shall fail with an error that names Auth:RevalidationSeconds when that value, the seconds
          between two checks of the user of an open page (30 by default), is below 5, shall require a signed-in
          user for all pages except the home page and the login page, and shall map the sign-in and sign-out
          endpoints, keeping the /health route open to everyone.
        justification: |
          The composition root is the one place where authentication is connected to the pages. A wrong session
          length or check interval must stop the server at start-up with a clear message, a too short interval
          would turn the check of open pages into constant database load, and the pages must be closed by
          default so that a new page cannot be left open by mistake.
        tests:
          - ServerHost_CreateApplication_NonPositiveSessionHours_ThrowsClearError
          - ServerHost_CreateApplication_RevalidationSecondsBelowMinimum_ThrowsClearError
          - ServerHost_CreateApplication_HealthRoute_Returns200Healthy
          - SignIn_PublicPage_Anonymous_IsServed
          - SignIn_ProtectedPage_Anonymous_RedirectsToLogin

      - id: ReviewCenter-ServerHost-DatabaseFailure
        title: >-
          The ServerHost class shall fail with an error that begins Failed to prepare the database when the
          database settings cannot be used, and shall report that error and return exit code 1 when running the
          server.
        justification: |
          Operators need one clear message for any database problem (an unsupported provider, an unusable
          location), and a non-zero exit code so that a supervisor or script notices the failure.
        tests:
          - ServerHost_CreateApplication_UnsupportedProvider_ThrowsClearError
          - ServerHost_RunAsync_UnsupportedProvider_ReturnsExitCodeOne
          - ServerHost_RunAsync_UnusableDatabaseLocation_ReturnsExitCodeOne
