---
# Software Unit Requirements for the Program Class
#
# The Program unit is the top-level command dispatcher for the tool.

sections:
  - title: Program Unit Requirements
    requirements:
      - id: ReviewCenter-Program-Version
        title: The Program class shall support -v and --version flags to display version information.
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification.
        tests:
          - Program_Run_WithVersionFlag_DisplaysVersionOnly
          - Program_Run_WithShortVersionFlag_DisplaysVersion
          - Program_Version_ReturnsNonEmptyString

      - id: ReviewCenter-Program-Help
        title: The Program class shall support -?, -h, and --help flags to display usage information.
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources.
        tests:
          - Program_Run_WithHelpFlag_DisplaysUsageInformation
          - Program_Run_WithShortHelpFlag_DisplaysUsage
          - Program_Run_WithQuestionMarkFlag_DisplaysUsage

      - id: ReviewCenter-Program-Validate
        title: The Program class shall support --validate flag to invoke the self-validation framework.
        justification: |
          Provides a built-in mechanism to verify the tool is functioning correctly
          in the deployment environment.
        tests:
          - Program_Run_WithValidateFlag_RunsValidation

      - id: ReviewCenter-Program-ExitCode
        title: The Program class shall return a non-zero exit code on failure.
        justification: |
          Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
          programmatically via the process exit code.
        tests:
          - Program_Main_WithInvalidArgs_ReturnsNonZeroExitCode

      - id: ReviewCenter-Program-Serve
        title: >-
          The Program class shall run the web server until it is stopped when the serve verb is
          provided, report an unusable listen address as an error, and list the serve verb and
          the `--urls` option in the help text.
        justification: |
          Program is the single dispatcher for every action of the tool, so it must start the
          web server on request, stop it cleanly when asked, and turn a start-up failure such
          as a port that is already in use into an ordinary error with a non-zero exit code
          instead of an unhandled exception. Operators discover the verb and option from the
          help text.
        tests:
          - Program_Run_WithServeVerb_StartsServerAndStopsOnCancellation
          - Program_Run_WithServeVerb_PortInUse_ReportsError
          - Program_Run_WithHelpFlag_ListsServeVerbAndUrlsOption

      - id: ReviewCenter-Program-UserAdd
        title: >-
          The Program class shall create a user in the configured database when the user add verb is provided,
          report any failure as an error with a non-zero exit code, and list the user add verb and its options in
          the help text.
        justification: |
          Program is the single dispatcher for every action of the tool, so it must run the command that creates
          a user and turn a failure into an ordinary error. Operators discover the verb and its options from the
          help text.
        tests:
          - Program_Run_WithHelpFlag_ListsUserAddVerbAndOptions
          - ReviewCenter_UserAddVerb_PasswordFromEnvironment_CreatesUserThenRejectsDuplicate

      - id: ReviewCenter-Program-AuditVerify
        title: >-
          The Program class shall list the audit verify verb in the help text, and shall run the audit trail
          verification, with exit code 0 for an intact chain and 1 for a broken chain or an unreadable database,
          when the verb is provided.
        justification: |
          Program is the single dispatcher for every action of the tool, and operators discover the verb from the
          help text. The dispatch itself is verified through the AuditCommand unit tests, which run the command
          directly.
        tests:
          - Program_Run_Help_DocumentsAuditVerify
          - AuditCommand_Run_IntactTrail_ReportsEntryCountWithExitCodeZero
          - AuditCommand_Run_TamperedEntry_ReportsFirstBadEntryWithExitCodeOne
