---
# Messaging Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReviewCenter Messaging subsystem
# - The Messaging subsystem spans the NotificationOptions, SmtpNotificationSender, FileNotificationSender, and
#   NotificationWorker units
# - Subsystem requirements describe the externally visible behavior of the delivery of e-mail: which transport the
#   settings of the Notifications section select, what happens while notifications are off, what happens to
#   settings that are not valid, and how the background passes that send the mails run

sections:
  - title: Messaging Subsystem Requirements
    requirements:
      - id: ReviewCenter-Messaging-Off
        title: >-
          While e-mail notifications are not enabled (the Enabled setting of the Notifications section is false), the
          Messaging subsystem shall report that no mail transport is configured.
        justification: |
          The default installation must not depend on a mail server; the rest of the server needs a plain answer to
          the question whether mail can be sent. E-mail notifications are enabled when the Enabled setting of the
          Notifications section is true and not enabled otherwise; this is the only term used for that state.
        children:
          - ReviewCenter-NotificationOptions-DefaultSender
          - ReviewCenter-NotificationMessage-NoSenderNotConfigured
        tests:
          - MessagingSubsystem_NotificationsOff_SenderIsNotConfiguredAndSendFails

      - id: ReviewCenter-Messaging-OffRefusesSend
        title: >-
          While e-mail notifications are not enabled, the Messaging subsystem shall reject every attempt to send a
          message with a send error.
        justification: |
          A message that is not delivered must never be mistaken for a delivered one.
        children:
          - ReviewCenter-NotificationMessage-NoSenderRefuses
        tests:
          - MessagingSubsystem_NotificationsOff_SenderIsNotConfiguredAndSendFails

      - id: ReviewCenter-Messaging-OffSettings
        title: >-
          While e-mail notifications are not enabled, the Messaging subsystem shall report the notification settings
          as not enabled.
        justification: |
          The pages of the server must not offer notifications that cannot be delivered.
        children:
          - ReviewCenter-NotificationOptions-DefaultOff
        tests:
          - MessagingSubsystem_NotificationsOff_SenderIsNotConfiguredAndSendFails

      - id: ReviewCenter-Messaging-Off-OtherSettings
        title: >-
          While e-mail notifications are not enabled, the Messaging subsystem shall accept every value of every other
          notification setting.
        justification: |
          Half-finished mail settings must not stop an operator who has not switched notifications on.
        children:
          - ReviewCenter-NotificationOptions-DisabledAcceptsAll

      - id: ReviewCenter-Messaging-FileTransport
        title: >-
          When the file transport is selected with valid settings, the Messaging subsystem shall deliver a message as
          one file in the folder named in the settings.
        justification: |
          Demonstrations, development and tests need mail that works without a mail server.
        children:
          - ReviewCenter-NotificationOptions-AcceptFile
          - ReviewCenter-NotificationOptions-BindingFile
          - ReviewCenter-FileNotificationSender-OneFile
        tests:
          - MessagingSubsystem_FileTransport_SettingsChooseFileSenderThatDeliversMessage

      - id: ReviewCenter-Messaging-FileTransport-Extension
        title: >-
          When the file transport is selected with valid settings, the Messaging subsystem shall give the file of a
          message the extension eml.
        justification: |
          Mail programs and tools open a file with this extension as a mail message.
        children:
          - ReviewCenter-FileNotificationSender-Extension
        tests:
          - MessagingSubsystem_FileTransport_SettingsChooseFileSenderThatDeliversMessage

      - id: ReviewCenter-Messaging-FileTransport-CreateFolder
        title: >-
          When the file transport is selected with valid settings and the folder of the settings does not exist, the
          Messaging subsystem shall create the folder.
        justification: |
          The operator names a folder for the mail files and should not have to create it first.
        children:
          - ReviewCenter-FileNotificationSender-CreateFolder
        tests:
          - MessagingSubsystem_FileTransport_SettingsChooseFileSenderThatDeliversMessage

      - id: ReviewCenter-Messaging-FileTransport-Content
        title: >-
          When the file transport is selected with valid settings, the Messaging subsystem shall write a file that
          holds the subject, the recipient address, the sender address, and the plain text and HTML bodies of the
          message as the matching parts of the mail.
        justification: |
          The file is the mail that an operator reads, so every field of the message must be in it in its place.
        children:
          - ReviewCenter-FileNotificationSender-Subject
          - ReviewCenter-FileNotificationSender-Recipient
          - ReviewCenter-FileNotificationSender-Sender
          - ReviewCenter-FileNotificationSender-TextPart
          - ReviewCenter-FileNotificationSender-HtmlPart
          - ReviewCenter-OTS-MailKit-MimeSubject
          - ReviewCenter-OTS-MailKit-MimeRecipient
          - ReviewCenter-OTS-MailKit-MimeSender
          - ReviewCenter-OTS-MailKit-MimeText
          - ReviewCenter-OTS-MailKit-MimeHtml
        tests:
          - FileNotificationSender_Send_WritesParseableEmlFile

      - id: ReviewCenter-Messaging-FileTransport-UniqueNames
        title: >-
          When the file transport is selected with valid settings, the Messaging subsystem shall give every file a
          name that no other file written by it has, also for messages sent at the same moment.
        justification: |
          A message must never overwrite the file of another message.
        children:
          - ReviewCenter-FileNotificationSender-NewFileEachTime
          - ReviewCenter-FileNotificationSender-Concurrent
        tests:
          - FileNotificationSender_Send_SeveralMessages_WritesSeparateFiles

      - id: ReviewCenter-Messaging-FileTransport-NoTemporaryFile
        title: >-
          When the file transport is selected with valid settings, the Messaging subsystem shall leave only the file of
          the message in the folder after a successful send.
        justification: |
          A half-written temporary file must not be taken for a mail.
        children:
          - ReviewCenter-FileNotificationSender-OnlyEmlAfterSend
        tests:
          - FileNotificationSender_Send_Success_LeavesOnlyTheEmlFile

      - id: ReviewCenter-Messaging-FileEnabled
        title: >-
          When the file transport is selected with valid settings, the Messaging subsystem shall report the
          notification settings as enabled.
        justification: |
          The pages of the server offer notifications only when mail can be delivered.
        children:
          - ReviewCenter-NotificationOptions-AcceptFile
          - ReviewCenter-NotificationOptions-BindingGeneral
        tests:
          - MessagingSubsystem_FileTransport_SettingsChooseFileSenderThatDeliversMessage

      - id: ReviewCenter-Messaging-SmtpTransport
        title: >-
          When the SMTP transport is selected with valid settings, the Messaging subsystem shall report that a mail
          transport is configured.
        justification: |
          Production installations deliver mail through the mail server of the organization.
        children:
          - ReviewCenter-NotificationOptions-AcceptSmtp
          - ReviewCenter-NotificationOptions-BindingSmtp
          - ReviewCenter-SmtpNotificationSender-IsConfigured
        tests:
          - MessagingSubsystem_SmtpTransport_SettingsChooseSmtpSender

      - id: ReviewCenter-Messaging-InvalidSettings
        title: >-
          While e-mail notifications are enabled, the Messaging subsystem shall refuse to provide a mail transport when
          the notification settings are not valid.
        justification: |
          A wrong configuration must stop the start of the server and not show up when the first mail fails.
        children:
          - ReviewCenter-NotificationOptions-SmtpHostRequired
          - ReviewCenter-NotificationOptions-SenderRequired
          - ReviewCenter-NotificationOptions-FromAddressRequired
          - ReviewCenter-NotificationOptions-BaseUrlRequired
          - ReviewCenter-NotificationOptions-FromAddressLineBreak
          - ReviewCenter-NotificationOptions-FromNameLineBreak
          - ReviewCenter-NotificationOptions-BaseUrlAbsolute
          - ReviewCenter-NotificationOptions-BaseUrlQuery
          - ReviewCenter-NotificationOptions-BaseUrlFragment
          - ReviewCenter-NotificationOptions-BaseUrlUserInfo
          - ReviewCenter-NotificationOptions-BaseUrlHttpRemote
          - ReviewCenter-NotificationOptions-SmtpHostSpace
          - ReviewCenter-NotificationOptions-SmtpPortRange
          - ReviewCenter-NotificationOptions-SmtpTlsUnknown
          - ReviewCenter-NotificationOptions-SmtpTimeoutRange
          - ReviewCenter-NotificationOptions-UsernameNeedsPassword
          - ReviewCenter-NotificationOptions-PasswordNeedsUsername
          - ReviewCenter-NotificationOptions-PasswordExclusive
          - ReviewCenter-NotificationOptions-PasswordFileMissing
          - ReviewCenter-NotificationOptions-CredentialsRemoteClear
          - ReviewCenter-NotificationOptions-FileDirectoryRequired
          - ReviewCenter-NotificationOptions-DigestHourRange
          - ReviewCenter-NotificationOptions-TimeZoneUnknown
          - ReviewCenter-NotificationOptions-BatchWindowRange
          - ReviewCenter-NotificationOptions-PollIntervalRange
          - ReviewCenter-NotificationOptions-MaxMailsRange
          - ReviewCenter-SmtpNotificationSender-TlsUndefined
        tests:
          - MessagingSubsystem_InvalidSettings_AreRefusedNamingTheSetting

      - id: ReviewCenter-Messaging-SettingsDefaults
        title: >-
          While a setting of the Notifications section is not given, the Messaging subsystem shall use the default
          value of that setting.
        justification: |
          An operator should have to give only the settings that differ from the usual ones.
        children:
          - ReviewCenter-NotificationOptions-DefaultSmtpPort
          - ReviewCenter-NotificationOptions-DefaultTls
          - ReviewCenter-NotificationOptions-DefaultDigestHour
          - ReviewCenter-NotificationOptions-DefaultTimeZone
          - ReviewCenter-NotificationOptions-DefaultBatchWindow
          - ReviewCenter-NotificationOptions-DefaultPollInterval
          - ReviewCenter-NotificationOptions-DefaultTitles
          - ReviewCenter-NotificationOptions-WorkerTitlesShownByDefault
        tests:
          - NotificationOptions_Defaults_AreOffAndDocumented

      - id: ReviewCenter-Messaging-PasswordFile
        title: >-
          When a password file is named in the settings, the Messaging subsystem shall read the SMTP password from that
          file.
        justification: |
          A password in a file keeps it out of the configuration and lets the operator rotate it without a change of
          the settings.
        children:
          - ReviewCenter-NotificationOptions-PasswordFileRead
        tests:
          - NotificationOptions_ResolvePassword_FromFile_ReturnsTrimmedPassword

      - id: ReviewCenter-Messaging-PasswordFile-Trimmed
        title: >-
          When a password file is named in the settings, the Messaging subsystem shall remove the trailing line break
          of the file from the SMTP password.
        justification: |
          Editors add a line break at the end of a file, which would make the login fail if it stayed in the password.
        children:
          - ReviewCenter-NotificationOptions-PasswordFileTrimmed
        tests:
          - NotificationOptions_ResolvePassword_FromFile_ReturnsTrimmedPassword

      - id: ReviewCenter-Messaging-Warnings
        title: >-
          When the SMTP password is given inline in the settings, the Messaging subsystem shall report a warning.
        justification: |
          A password in the configuration or the environment is easier to leak than a password in a file, so the
          operator should see the warning.
        children:
          - ReviewCenter-NotificationOptions-WarningInlinePassword
        tests:
          - NotificationOptions_GetWarnings_InlinePassword_WarnsWithoutValue

      - id: ReviewCenter-Messaging-WarningClearRemote
        title: >-
          When the SMTP connection to another machine is not protected by TLS, the Messaging subsystem shall report a
          warning.
        justification: |
          The mail then crosses the network in clear text, which an operator should do only knowingly.
        children:
          - ReviewCenter-NotificationOptions-WarningClearRemote
        tests:
          - NotificationOptions_GetWarnings_NoTlsToRemoteHost_Warns

      - id: ReviewCenter-Messaging-WarningNoPassword
        title: >-
          The Messaging subsystem shall not put the SMTP password in a warning.
        justification: |
          A warning must not become a new place where a password leaks.
        children:
          - ReviewCenter-NotificationOptions-WarningNoPasswordValue
        tests:
          - NotificationOptions_GetWarnings_InlinePassword_WarnsWithoutValue

      - id: ReviewCenter-Messaging-WarningNoneForGoodSettings
        title: >-
          When the notification settings give no cause for a warning, the Messaging subsystem shall report no warning.
        justification: |
          A warning that is always there is ignored; it must mean something.
        children:
          - ReviewCenter-NotificationOptions-WarningNoneForGood
        tests:
          - NotificationOptions_GetWarnings_GoodOrDisabled_IsEmpty

      - id: ReviewCenter-Messaging-WarningNoneWhenNotEnabled
        title: >-
          While e-mail notifications are not enabled, the Messaging subsystem shall report no warning.
        justification: |
          Settings of a feature that is not enabled do not matter and must not cause noise.
        children:
          - ReviewCenter-NotificationOptions-WarningNoneWhenOff
        tests:
          - NotificationOptions_GetWarnings_GoodOrDisabled_IsEmpty

      - id: ReviewCenter-Messaging-LoopbackBaseUrl
        title: >-
          The Messaging subsystem shall accept an http base address for the local machine.
        justification: |
          A test installation on the local machine has no certificate.
        children:
          - ReviewCenter-NotificationOptions-BaseUrlHttpLoopback
        tests:
          - NotificationOptionsValidator_HttpBaseUrlForLoopback_IsAccepted

      - id: ReviewCenter-Messaging-LoopbackCredentials
        title: >-
          The Messaging subsystem shall accept a login without TLS to an SMTP server on the local machine.
        justification: |
          A test mail server on the local machine needs no certificate, and the password does not cross a network.
        children:
          - ReviewCenter-NotificationOptions-CredentialsLoopbackClear
        tests:
          - NotificationOptionsValidator_CredentialsWithoutTlsToLoopback_AreAccepted

      - id: ReviewCenter-Messaging-SmtpDelivery
        title: >-
          When the SMTP transport is used, the Messaging subsystem shall hand the message that it is given to the
          SMTP server.
        justification: |
          A mail that is not handed to the server is never delivered.
        children:
          - ReviewCenter-SmtpNotificationSender-Delivery
          - ReviewCenter-OTS-MailKit-Smtp
        tests:
          - SmtpNotificationSender_Send_DeliversMessageToServer

      - id: ReviewCenter-Messaging-SmtpDelivery-Envelope
        title: >-
          When the SMTP transport is used, the Messaging subsystem shall give the SMTP server the sender address of the
          settings as the sender and the recipient address of the message as the only recipient.
        justification: |
          A wrong envelope sends the mail to the wrong person or makes the server refuse it.
        children:
          - ReviewCenter-SmtpNotificationSender-EnvelopeSender
          - ReviewCenter-SmtpNotificationSender-EnvelopeRecipient
          - ReviewCenter-SmtpNotificationSender-SingleRecipient
          - ReviewCenter-OTS-MailKit-EnvelopeSender
          - ReviewCenter-OTS-MailKit-EnvelopeRecipient
        tests:
          - SmtpNotificationSender_Send_DeliversMessageToServer
          - SmtpNotificationSender_Send_SpecialCharacters_DoNotLeaveTheirHeader

      - id: ReviewCenter-Messaging-SmtpDelivery-Content
        title: >-
          When the SMTP transport is used, the Messaging subsystem shall deliver the subject, the sender name, and the
          plain text and HTML bodies of the message as the matching parts of the mail.
        justification: |
          The mail must read the way the message was written, so every field has to arrive in its place.
        children:
          - ReviewCenter-SmtpNotificationSender-Subject
          - ReviewCenter-SmtpNotificationSender-SenderName
          - ReviewCenter-SmtpNotificationSender-TextPart
          - ReviewCenter-SmtpNotificationSender-HtmlPart
          - ReviewCenter-OTS-MailKit-MimeSender
          - ReviewCenter-OTS-MailKit-MimeText
          - ReviewCenter-OTS-MailKit-MimeHtml
        tests:
          - SmtpNotificationSender_Send_DeliversMessageToServer

      - id: ReviewCenter-Messaging-SmtpDelivery-SpecialCharacters
        title: >-
          When the SMTP transport is used, the Messaging subsystem shall deliver a sender name with special characters
          and a subject with characters outside ASCII or the text of a header line unchanged and inside its own header.
        justification: |
          Names and subjects come from users, so they must neither be garbled nor be able to inject a header line.
        children:
          - ReviewCenter-SmtpNotificationSender-SenderNameIsolated
          - ReviewCenter-SmtpNotificationSender-SubjectIsolated
          - ReviewCenter-SmtpNotificationSender-SubjectCharacters
          - ReviewCenter-OTS-MailKit-MimeSenderName
          - ReviewCenter-OTS-MailKit-MimeSubjectEncoding
          - ReviewCenter-OTS-MailKit-MimeSubjectHeader
        tests:
          - SmtpNotificationSender_Send_SpecialCharacters_DoNotLeaveTheirHeader

      - id: ReviewCenter-Messaging-SmtpDelivery-Authentication
        title: >-
          When the SMTP transport is used and the settings give a user name, the Messaging subsystem shall sign in to
          the SMTP server with the credentials of the settings.
        justification: |
          Most mail servers of an organization accept mail only from a user who has signed in.
        children:
          - ReviewCenter-SmtpNotificationSender-Authentication
          - ReviewCenter-OTS-MailKit-Auth
        tests:
          - SmtpNotificationSender_Send_WithCredentials_Authenticates

      - id: ReviewCenter-Messaging-SmtpTls
        title: >-
          When the SMTP transport is used, the Messaging subsystem shall connect to the SMTP server with the TLS mode
          of the settings.
        justification: |
          The operator decides how the connection to the mail server is protected.
        children:
          - ReviewCenter-SmtpNotificationSender-TlsNone
          - ReviewCenter-SmtpNotificationSender-TlsUpgrade
          - ReviewCenter-SmtpNotificationSender-TlsImplicit
          - ReviewCenter-OTS-MailKit-Tls
        tests:
          - SmtpNotificationSender_MapTls_MapsEveryMode

      - id: ReviewCenter-Messaging-FileConfigured
        title: >-
          While the file transport is selected, the Messaging subsystem shall report that a mail transport is
          configured.
        justification: |
          The rest of the server needs a plain answer to the question whether mail can be sent.
        children:
          - ReviewCenter-FileNotificationSender-IsConfigured
        tests:
          - FileNotificationSender_IsConfigured_IsTrue

      - id: ReviewCenter-Messaging-SendFailure
        title: >-
          When the delivery of a message fails, the Messaging subsystem shall report a send error.
        justification: |
          A message that was not delivered must never be mistaken for a delivered one.
        children:
          - ReviewCenter-SmtpNotificationSender-AuthenticationRefused
          - ReviewCenter-SmtpNotificationSender-RecipientRefused
          - ReviewCenter-SmtpNotificationSender-Unreachable
          - ReviewCenter-FileNotificationSender-WriteFailure
          - ReviewCenter-OTS-MailKit-AuthRefused
          - ReviewCenter-OTS-MailKit-RecipientRefused
          - ReviewCenter-OTS-MailKit-Unreachable
        tests:
          - SmtpNotificationSender_Send_WrongPassword_ThrowsWithoutSecret
          - FileNotificationSender_Send_FolderIsAFile_ThrowsWithoutPath

      - id: ReviewCenter-Messaging-SendFailure-NothingDelivered
        title: >-
          When the delivery of a message fails, the Messaging subsystem shall deliver no message to the SMTP server and
          leave no file in the folder.
        justification: |
          A failed send must leave no half result that could be mistaken for a mail.
        children:
          - ReviewCenter-SmtpNotificationSender-NothingDeliveredOnFailure
          - ReviewCenter-FileNotificationSender-FailedNoFile
        tests:
          - SmtpNotificationSender_Send_WrongPassword_ThrowsWithoutSecret
          - FileNotificationSender_Send_Failure_LeavesNoMessageOrTemporaryFile

      - id: ReviewCenter-Messaging-SendErrorNoPassword
        title: >-
          The message of a send error of the Messaging subsystem shall not contain the SMTP password.
        justification: |
          An error message reaches logs and pages, so it must never be a place where a password leaks.
        children:
          - ReviewCenter-SmtpNotificationSender-ErrorNoPassword
        tests:
          - SmtpNotificationSender_Send_WrongPassword_ThrowsWithoutSecret

      - id: ReviewCenter-Messaging-SendErrorNoAddress
        title: >-
          The message of a send error of the Messaging subsystem shall not contain the address of the recipient.
        justification: |
          An address is personal data that must not spread into logs and pages through an error message.
        children:
          - ReviewCenter-SmtpNotificationSender-ErrorNoAddress
        tests:
          - SmtpNotificationSender_Send_RecipientRefused_ThrowsWithoutAddress

      - id: ReviewCenter-Messaging-SendErrorNoServerText
        title: >-
          The message of a send error of the Messaging subsystem shall not contain text that the SMTP server sent.
        justification: |
          The text of a server is outside the control of the product and may repeat an address or a secret.
        children:
          - ReviewCenter-SmtpNotificationSender-ErrorNoServerText
        tests:
          - SmtpNotificationSender_Send_WrongPassword_ThrowsWithoutSecret
          - SmtpNotificationSender_Send_RecipientRefused_ThrowsWithoutAddress

      - id: ReviewCenter-Messaging-SendErrorNoPath
        title: >-
          The message of a send error of the file transport shall not contain the path of the folder.
        justification: |
          The path of a folder shows the layout of the server and must not reach a page.
        children:
          - ReviewCenter-FileNotificationSender-ErrorNoPath
        tests:
          - FileNotificationSender_Send_FolderIsAFile_ThrowsWithoutPath

      - id: ReviewCenter-Messaging-Cancellation
        title: >-
          When the cancellation token is canceled, the Messaging subsystem shall end the send with a cancellation.
        justification: |
          A server that stops must not wait for a mail server.
        children:
          - ReviewCenter-SmtpNotificationSender-Cancellation
          - ReviewCenter-OTS-MailKit-Cancellation
        tests:
          - SmtpNotificationSender_Send_Canceled_ThrowsOperationCanceled

      - id: ReviewCenter-Messaging-Cancellation-NothingSent
        title: >-
          When the cancellation token is canceled, the Messaging subsystem shall deliver no message and write no file.
        justification: |
          A canceled send must have no effect that the caller does not expect.
        children:
          - ReviewCenter-SmtpNotificationSender-CanceledNothingSent
          - ReviewCenter-FileNotificationSender-CanceledNoFile
        tests:
          - SmtpNotificationSender_Send_Canceled_ThrowsOperationCanceled
          - FileNotificationSender_Send_Cancelled_LeavesNoFile

      - id: ReviewCenter-Messaging-NullMessage
        title: >-
          When no message is given, the Messaging subsystem shall refuse the send with an argument error.
        justification: |
          A call without a message is a mistake of the caller that must show at once.
        children:
          - ReviewCenter-SmtpNotificationSender-NullMessage
          - ReviewCenter-FileNotificationSender-NullMessage
        tests:
          - SmtpNotificationSender_Send_NullMessage_ThrowsArgumentNull
          - FileNotificationSender_Send_NullMessage_ThrowsArgumentNull

      - id: ReviewCenter-Messaging-InvalidSettingsNamed
        title: >-
          When the notification settings are not valid, the Messaging subsystem shall name the invalid setting in the
          message of the rejection.
        justification: |
          An operator can only fix a configuration when the message says which setting is wrong.
        children:
          - ReviewCenter-NotificationOptions-MessagesNameSetting
        tests:
          - MessagingSubsystem_InvalidSettings_AreRefusedNamingTheSetting

      - id: ReviewCenter-Messaging-InvalidSettingsNamed-NoPassword
        title: >-
          When the notification settings are not valid, the Messaging subsystem shall not put the SMTP password in the
          message of the rejection.
        justification: |
          The message of the rejection goes to logs and consoles, so it must not become a place where a password leaks.
        children:
          - ReviewCenter-NotificationOptions-MessagesNoPassword

      - id: ReviewCenter-Messaging-NotificationWorker
        title: >-
          While e-mail notifications are enabled, the Messaging subsystem shall run a notification pass at the polling
          interval of the settings.
        justification: |
          The mails of the server are sent by a background pass, so the passes must recur for as long as the server
          runs. A notification pass is one look at all recipients that sends the mails that are due.
        children:
          - ReviewCenter-NotificationWorker-RunsPassEachInterval
          - ReviewCenter-NotificationWorker-WaitsBetweenPasses
        tests:
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure

      - id: ReviewCenter-Messaging-NotificationWorker-OnStart
        title: >-
          While e-mail notifications are enabled, the Messaging subsystem shall run a notification pass when the server
          starts.
        justification: |
          The first mails of a window must not wait for a whole polling interval after the start of the server.
        children:
          - ReviewCenter-NotificationWorker-RunsPassOnStart
        tests:
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure

      - id: ReviewCenter-Messaging-WorkerStops
        title: >-
          When the server stops, the Messaging subsystem shall end the notification passes before the next polling
          interval ends.
        justification: |
          A server that stops must not wait for a background service or leave an error in the log.
        children:
          - ReviewCenter-NotificationWorker-StopCompletes
          - ReviewCenter-NotificationWorker-StopWhileWaiting
        tests:
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure
          - NotificationWorker_StopAsync_Waiting_ReturnsPromptly

      - id: ReviewCenter-Messaging-WorkerStops-CancelsPass
        title: >-
          When the server stops, the Messaging subsystem shall cancel a notification pass that is running.
        justification: |
          A server that stops must not wait for a pass.
        children:
          - ReviewCenter-NotificationWorker-CancelRunningPass
        tests:
          - NotificationWorker_StopAsync_PassRunning_CancelsPass

      - id: ReviewCenter-Messaging-WorkerStops-NoErrorLogged
        title: >-
          When the server stops, the Messaging subsystem shall leave no error in the log for the canceled pass.
        justification: |
          A normal stop of the server is no error.
        children:
          - ReviewCenter-NotificationWorker-CancelRunningPass-NothingLogged
        tests:
          - NotificationWorker_StopAsync_PassRunning_NothingLogged

      - id: ReviewCenter-Messaging-WorkerSurvivesFailure
        title: >-
          When a notification pass fails, the Messaging subsystem shall run the next notification pass.
        justification: |
          A failure of the mail server or the database for a while must not end the notifications until the next
          restart.
        children:
          - ReviewCenter-NotificationWorker-SurvivesFailedPass
        tests:
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure
          - NotificationWorker_ExecuteAsync_PassThrows_RunsNextPass

      - id: ReviewCenter-Messaging-WorkerSurvivesFailure-NoFault
        title: >-
          When a notification pass fails, the Messaging subsystem shall keep the server running.
        justification: |
          A failed pass must not bring the server down.
        children:
          - ReviewCenter-NotificationWorker-FailedPassNoFault
        tests:
          - NotificationWorker_ExecuteAsync_PassThrows_TaskNotFaulted

      - id: ReviewCenter-Messaging-WorkerLogHasNoPersonalData
        title: >-
          The Messaging subsystem shall keep the address of a recipient out of the log of the notification passes.
        justification: |
          A log is kept and read by operators.
        children:
          - ReviewCenter-NotificationWorker-LogNoAddress
        tests:
          - NotificationWorker_ExecuteAsync_PassResultWithAddress_NotLogged
          - NotificationWorker_ExecuteAsync_PassThrowsWithAddress_NoAddressAnywhereInLog

      - id: ReviewCenter-Messaging-WorkerLogHasNoPersonalData-ErrorMessage
        title: >-
          The Messaging subsystem shall keep the message of an error out of the log of the notification passes.
        justification: |
          The message of an error can hold an address.
        children:
          - ReviewCenter-NotificationWorker-LogFailureTypeOnly-NoMessage
        tests:
          - NotificationWorker_ExecuteAsync_PassThrows_LogHasNoMessage

      - id: ReviewCenter-Messaging-WorkerLogHasNoPersonalData-ErrorMessage-Type
        title: >-
          When a notification pass fails, the Messaging subsystem shall log the type of the error.
        justification: |
          The operator must see what failed, and the type of an error holds no personal data.
        children:
          - ReviewCenter-NotificationWorker-LogFailureTypeOnly

      - id: ReviewCenter-Messaging-WorkerLogCounts
        title: >-
          When a notification pass sent or failed a mail, the Messaging subsystem shall log the numbers of sent, failed,
          and deferred mails.
        justification: |
          The operator sees that the notifications work and how often they fail.
        children:
          - ReviewCenter-NotificationWorker-LogCounts
        tests:
          - NotificationWorker_ExecuteAsync_PassSent_LogsCounts

      - id: ReviewCenter-Messaging-WorkerLogCounts-IdleQuiet
        title: >-
          When a notification pass sent and failed no mail, the Messaging subsystem shall log nothing for that pass.
        justification: |
          An idle server leaves the log quiet.
        children:
          - ReviewCenter-NotificationWorker-LogNothingIdle
        tests:
          - NotificationWorker_ExecuteAsync_IdlePass_NothingLogged

      - id: ReviewCenter-Messaging-WorkerArguments
        title: >-
          When the notification worker is given no pass, clock, or logger, the Messaging subsystem shall refuse it with
          an argument error.
        justification: |
          A worker without one of these could never run properly, so the mistake must show at once.
        children:
          - ReviewCenter-NotificationWorker-RefuseNullArgument
        tests:
          - NotificationWorker_Constructor_NullArgument_Throws

      - id: ReviewCenter-Messaging-WorkerArguments-Interval
        title: >-
          When the notification worker is given a polling interval that is not positive, the Messaging subsystem shall
          refuse it with an argument error.
        justification: |
          A worker with an interval of zero could never run properly, so the mistake must show at once.
        children:
          - ReviewCenter-NotificationWorker-RefuseNonPositivePoll
        tests:
          - NotificationWorker_Constructor_NonPositivePoll_Throws

      - id: ReviewCenter-Messaging-WorkerRegisteredWhenEnabled
        title: >-
          While e-mail notifications are enabled with a sender that sends mail, the Messaging subsystem shall register
          one notification worker.
        justification: |
          The notification passes must run for as long as the server runs, and they must run once.
        children:
          - ReviewCenter-NotificationOptions-WorkerRegisteredSmtp
          - ReviewCenter-NotificationOptions-WorkerRegisteredFile
        tests:
          - MessagingSubsystem_Worker_EnabledRunsDispatcherAndSurvivesFailure
          - NotificationRegistration_AddNotificationWorker_EnabledSmtp_Registers

      - id: ReviewCenter-Messaging-WorkerRegisteredWhenEnabled-NoSender
        title: >-
          While e-mail notifications are enabled with no mail transport selected, the Messaging subsystem shall
          register no background service.
        justification: |
          A worker without a sender could only fail, so a sender of None gets no worker.
        children:
          - ReviewCenter-NotificationOptions-WorkerNotRegisteredSenderNone

      - id: ReviewCenter-Messaging-WorkerRegisteredWhenEnabled-NullArgument
        title: >-
          The Messaging subsystem shall refuse a missing argument when it registers the notification worker with an
          argument error.
        justification: |
          A programming error in the start of the server must show at once and not as a missing worker later.
        children:
          - ReviewCenter-NotificationOptions-WorkerRegistrationNullArgument

      - id: ReviewCenter-Messaging-WorkerNotRegisteredWhenOff
        title: >-
          While e-mail notifications are not enabled, the Messaging subsystem shall register no background service.
        justification: |
          A feature that is off must run no background work and cost nothing.
        children:
          - ReviewCenter-NotificationOptions-WorkerNotRegisteredOff
          - ReviewCenter-NotificationOptions-WorkerNotRegisteredNoSection
        tests:
          - NotificationRegistration_AddNotificationWorker_Off_NotRegistered
          - NotificationRegistration_AddNotificationWorker_NoSection_NotRegistered

      - id: ReviewCenter-Messaging-WorkerUsesSettings
        title: >-
          The Messaging subsystem shall run the notification passes with the polling interval of the notification
          settings.
        justification: |
          The administrator tunes the delay of the mails with this setting, and it must be in effect.
        children:
          - ReviewCenter-NotificationOptions-WorkerUsesPollInterval
        tests:
          - NotificationRegistration_AddNotificationWorker_PollSeconds_Honored

      - id: ReviewCenter-Messaging-WorkerUsesSettings-BatchWindow
        title: >-
          The Messaging subsystem shall run the notification passes with the batch window of the notification settings.
        justification: |
          The administrator tunes the collecting of changes with this setting, and it must be in effect.
        children:
          - ReviewCenter-NotificationOptions-WorkerUsesBatchWindow
        tests:
          - NotificationRegistration_AddNotificationWorker_BatchWindow_Honored

      - id: ReviewCenter-Messaging-WorkerUsesSettings-DigestSchedule
        title: >-
          The Messaging subsystem shall run the notification passes with the digest schedule of the notification
          settings.
        justification: |
          The administrator tunes the time of the daily summary with the digest schedule, and it must be in effect.
        children:
          - ReviewCenter-NotificationOptions-WorkerUsesDigestSchedule
        tests:
          - NotificationRegistration_AddNotificationWorker_ZoneAndHour_Honored

      - id: ReviewCenter-Messaging-WorkerUsesSettings-IncludeTitles
        title: >-
          The Messaging subsystem shall run the notification passes with the title setting of the notification
          settings.
        justification: |
          The administrator tunes the privacy of titles with this setting, and it must be in effect.
        children:
          - ReviewCenter-NotificationOptions-WorkerUsesIncludeTitles
        tests:
          - NotificationRegistration_AddNotificationWorker_IncludeTitles_Honored
