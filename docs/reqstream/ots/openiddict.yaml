---
# OpenIddict OTS Software Requirements
#
# Requirements for OpenIddict, which the tests use as a fake identity provider, so that the sign-in with an OpenID
# Connect provider can be verified without an external service. It is not part of the shipped product.

sections:
  - title: OTS Software Requirements
    sections:
      - title: OpenIddict Requirements
        requirements:
          - id: ReviewCenter-OTS-OpenIddict-TestProvider
            title: >-
              OpenIddict shall serve the discovery document and the signing keys of a provider, so that the sign-in code
              can find them in the tests.
            justification: |
              The tests of the sign-in need a provider that speaks the protocol, so that they test the product and
              not a mock. A passing test that runs the full flow against it confirms that the application finds the
              discovery document and the keys.
            tags: [ots]
            tests:
              - OidcSignIn_FirstSignIn_CreatesPlainAccountAndSignsIn
          - id: ReviewCenter-OTS-OpenIddict-TestProvider-IdentityToken
            title: >-
              OpenIddict shall issue an identity token that is signed with its keys in the authorization code flow
              with a proof key.
            justification: |
              The tests of the sign-in need tokens that the product can really validate. A passing test that runs the
              full flow confirms that the application accepts the token, which shows that it is signed with the keys
              that the provider serves.
            tags: [ots]
            tests:
              - OidcSignIn_FirstSignIn_CreatesPlainAccountAndSignsIn
          - id: ReviewCenter-OTS-OpenIddict-TestProvider-AuthTime
            title: OpenIddict shall put the authentication time of the login into the identity tokens that it issues.
            justification: |
              The confirmation of identity for a signature checks the time of the login. Passing tests confirm that a
              fresh sign-in gives a token with a recent time and that a provider set to an old, a future, or no time
              issues exactly that.
            tags: [ots]
            tests:
              - OidcReauth_FreshSignInOfSamePerson_AllowsExactlyOneSignature
              - OidcReauth_AuthTimeNotInWindow_IsRefusedFailClosed
