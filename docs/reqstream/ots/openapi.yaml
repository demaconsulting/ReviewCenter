---
# OpenAPI OTS Software Requirements
#
# Requirements for Microsoft.AspNetCore.OpenApi, which generates the OpenAPI document of the API from its routes.

sections:
  - title: OTS Software Requirements
    sections:
      - title: OpenApi Requirements
        requirements:
          - id: ReviewCenter-OTS-OpenApi-Document
            title: >-
              Microsoft.AspNetCore.OpenApi shall generate an OpenAPI document from the routes of the API that lists
              the routes.
            justification: |
              The OpenAPI document of the API is generated by this package. Passing tests that fetch the document from
              a running server and compare it with the copy kept in the documentation confirm that it lists the
              routes of the API.
            tags: [ots]
            tests:
              - ApiDocument_Get_NoToken_DescribesTheApiWithBearerScheme
              - ApiDocument_Get_MatchesCommittedSnapshot
          - id: ReviewCenter-OTS-OpenApi-Document-SecurityScheme
            title: >-
              Microsoft.AspNetCore.OpenApi shall write the bearer security scheme of the API into the OpenAPI
              document.
            justification: |
              Clients learn from the document how to authenticate. A passing test that fetches the document confirms
              that it holds the HTTP bearer security scheme and a security requirement on every operation.
            tags: [ots]
            tests:
              - ApiDocument_Get_NoToken_DescribesTheApiWithBearerScheme
          - id: ReviewCenter-OTS-OpenApi-Document-Stable
            title: Microsoft.AspNetCore.OpenApi shall generate the same OpenAPI document on every run.
            justification: |
              The document is kept in the documentation and compared with the generated one, so the output must not
              vary between runs. A passing test that fetches the document from two separately started applications
              confirms that the two documents are byte for byte the same.
            tags: [ots]
            tests:
              - ApiDocument_Get_TwoApplications_AreIdentical
