---
# Playwright OTS Software Requirements
#
# Requirements for the Playwright browser automation functionality that the system tests use, through the
# Puppeting test-support library, to drive the web interface of ReviewCenter in a real browser.
#
# Driving a real Chromium is proven by the real-browser system test: CI installs Chromium and fails that test
# when the browser is missing.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Playwright Requirements
        requirements:
          - id: ReviewCenter-OTS-Playwright-Chromium
            title: Playwright shall drive a headless Chromium to load pages.
            justification: |
              The system tests depend on Playwright to exercise the web interface as a user does, so it must start a
              headless Chromium and load pages. The real-browser system test navigates to pages of a real server.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
          - id: ReviewCenter-OTS-Playwright-Chromium-Click
            title: Playwright shall click an element of a page in a headless Chromium.
            justification: |
              The system tests follow links and press buttons of the web interface. The real-browser system test
              clicks the sign-in, projects, new project, and create project controls.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
          - id: ReviewCenter-OTS-Playwright-Chromium-Hover
            title: Playwright shall hover an element of a page in a headless Chromium.
            justification: |
              Some controls of the web interface appear only while the mouse is on them. The real-browser system test
              hovers a control and shows that the hover persists until the mouse moves.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
          - id: ReviewCenter-OTS-Playwright-Chromium-Fill
            title: Playwright shall fill a form field of a page in a headless Chromium.
            justification: |
              The system tests sign in and create records through forms. The real-browser system test fills in the
              sign-in and the project forms.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
          - id: ReviewCenter-OTS-Playwright-Chromium-ReadText
            title: Playwright shall read the text of an element of a page in a headless Chromium.
            justification: |
              The system tests check messages and names that the web interface shows. The real-browser system test
              reads the text of an error message, of the current user, and of the project name.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
          - id: ReviewCenter-OTS-Playwright-Chromium-ColorScheme
            title: Playwright shall emulate the color scheme of a page in a headless Chromium.
            justification: |
              The system tests check the dark and the light appearance of the web interface. The real-browser system
              test emulates the dark and the light scheme and reads the media query of the page.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
          - id: ReviewCenter-OTS-Playwright-Chromium-Screenshot
            title: Playwright shall capture a screenshot of a page in a headless Chromium.
            justification: |
              The system tests record the web interface as images. The real-browser system test captures a screenshot
              of the page and of one element and checks that the files are PNG images.
            tags: [ots]
            tests:
              - windows@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
              - ubuntu@ReviewCenter_RealBrowser_SignInCreateProjectAndTheme_WorksOverTheLiveConnection
