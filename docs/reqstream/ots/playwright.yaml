---
# Playwright OTS Software Requirements
#
# Requirements for the Playwright browser automation functionality used by the Puppet developer tool.
# These requirements belong to the ReviewCenterPuppet system, so their IDs use that prefix.
#
# Driving a real Chromium is proven by the real-browser end-to-end test: CI installs Chromium and
# fails that test when the browser is missing.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Playwright Requirements
        requirements:
          - id: ReviewCenterPuppet-OTS-Playwright-Chromium
            title: >-
              Playwright shall drive a headless Chromium to load pages, click, fill, read text, and capture
              screenshots.
            justification: |
              The Puppet developer tool depends on Playwright to show a coding agent the web interface.
            tags: [ots]
            tests:
              - windows@PuppetEndToEnd_StepsFile_HelloAndCounter_WritesScreenshotAndReportsText
              - ubuntu@PuppetEndToEnd_StepsFile_HelloAndCounter_WritesScreenshotAndReportsText
