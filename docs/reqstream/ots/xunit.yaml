---
# xUnit OTS Software Requirements
#
# Requirements for the xUnit testing framework functionality.

sections:
  - title: OTS Software Requirements
    sections:
      - title: xUnit Requirements
        requirements:
          - id: ReviewCenter-OTS-xUnit-Execute
            title: xUnit shall discover and execute unit tests.
            justification: |
              xUnit is the unit-testing framework used by the project. It discovers and
              runs all test methods annotated with [Fact] or [Theory] on the Microsoft Testing
              Platform. Passing tests confirm the framework correctly identifies and executes each
              test method.
            tags: [ots]
            tests:
              - Context_Create_NoArguments_ReturnsDefaultContext
              - Context_Create_VersionFlag_SetsVersionTrue
              - Context_Create_SilentFlag_SetsSilentTrue
              - Context_Create_LogFlag_OpensLogFile
              - Context_Create_UnknownArgument_ThrowsArgumentException
              - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
              - Program_Run_WithVersionFlag_DisplaysVersionOnly
              - Validation_Run_WithSilentContext_PrintsSummary
              - SelectorResolver_Resolve_AllForms_ReturnsPlaywrightSelector
          - id: ReviewCenter-OTS-xUnit-Report
            title: >-
              The TRX result file produced by the test run shall contain results for the tests the project
              has written.
            justification: |
              The Microsoft.Testing.Extensions.TrxReport extension (enabled with --report-trx) writes the TRX
              result files from the results xUnit supplies. The TRX files feed coverage reporting and
              requirements traceability via ReqStream. The evidence is the TRX file of the normal test run:
              ReqStream matches the tests linked here against it, so the requirement is satisfied exactly
              when the TRX contains results for those tests. No dedicated test is needed.
            tags: [ots]
            tests:
              - Context_Create_NoArguments_ReturnsDefaultContext
              - Context_Create_VersionFlag_SetsVersionTrue
              - Context_Create_SilentFlag_SetsSilentTrue
              - Context_Create_LogFlag_OpensLogFile
              - Context_Create_UnknownArgument_ThrowsArgumentException
              - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
              - Program_Run_WithVersionFlag_DisplaysVersionOnly
              - Validation_Run_WithSilentContext_PrintsSummary
              - SelectorResolver_Resolve_AllForms_ReturnsPlaywrightSelector
