---
# ASP.NET Core OTS Software Requirements
#
# Requirements for the ASP.NET Core web platform functionality.

sections:
  - title: OTS Software Requirements
    sections:
      - title: ASP.NET Core Requirements
        requirements:
          - id: ReviewCenter-OTS-AspNetCore-Host
            title: ASP.NET Core shall host the web application and answer HTTP requests on its mapped routes.
            justification: |
              ASP.NET Core with the Kestrel web server is the web platform on which the ReviewCenter
              service runs. The service depends on it to route requests to the health endpoint and the
              home page and to return the responses. Passing tests confirm the framework hosts the
              application correctly, both in memory and in a real server process.
            tags: [ots]
            tests:
              - ServerHost_CreateApplication_HealthRoute_Returns200Healthy
              - ReviewCenter_ServeVerb_Started_HealthEndpointReturnsHealthy
              - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndControls
          - id: ReviewCenter-OTS-AspNetCore-Components
            title: ASP.NET Core shall render Razor components and handle their interactive events.
            justification: |
              The ReviewCenter user interface is built from Razor components rendered by Blazor Server.
              The service depends on the framework to render the routed page to HTML and to handle user
              events such as button clicks. Passing tests confirm components render and respond
              correctly.
            tags: [ots]
            tests:
              - ReviewCenter_ServeVerb_Started_HomePageContainsTitleAndControls
              - WebSubsystem_HomeRoute_Requested_RendersTitleAndControls
              - HomePage_HelloButton_Clicked_ShowsGreeting
          - id: ReviewCenter-OTS-AspNetCore-Authentication
            title: >-
              ASP.NET Core shall provide cookie sign-in and sign-out with a redirect for requests without a signed-in
              user, antiforgery protection of form posts, and a salted password hasher that accepts a right password
              and rejects a wrong one.
            justification: |
              Signing in with a local account and a session cookie is built on the cookie authentication, the
              authorization, the antiforgery, and the password hasher of the framework, which is part of the same
              shared framework as the web platform. The service depends on them to issue a safe session cookie, to
              send anonymous users to the login page, to refuse forged form posts, and to store passwords only as
              hashes. Passing tests of the sign-in code confirm that the framework does so.
            tags: [ots]
            tests:
              - SignIn_Login_ValidCredentials_SetsSafeSessionCookieAndRedirects
              - SignIn_ProtectedPage_Anonymous_RedirectsToLogin
              - SignIn_PostWithoutAntiforgeryToken_IsRefusedAndSignsNobodyIn
              - PasswordHasher_Verify_RightAndWrongPassword_OnlyRightSucceeds
          - id: ReviewCenter-OTS-AspNetCore-DataProtection
            title: >-
              ASP.NET Core shall encrypt and decrypt text with keys kept in a key ring in a folder, so that text
              protected with a purpose can be read again after a restart with the same key ring, and cannot be read
              with another purpose or another key ring.
            justification: |
              The access tokens of git repositories are stored only encrypted. The service depends on the Data
              Protection of the framework, which is part of the same shared framework as the web platform, to encrypt
              them, to keep its keys in a folder that survives restarts, and to keep text protected for one purpose
              unreadable for another. Passing tests of the credential code confirm that the framework does so.
            tags: [ots]
            tests:
              - CredentialProtector_ProtectUnprotect_RoundTripsAndHidesToken
              - CredentialProtector_PersistedKeyRing_SurvivesRestart
              - CredentialProtector_Unprotect_OtherKeyRing_ThrowsCredentialsUnreadable
              - CredentialProtector_Purpose_IsolatesTokensFromOtherUses
