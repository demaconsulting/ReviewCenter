<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Git revisions, review-sets, a project checklist, and the reviewers flow into the
       ReviewCenter web app, which produces a signed attestation PDF, the agreed checklist answers, a hash-chained
       audit trail, and the evidence index that ReviewMark reads downstream.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 40px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
      <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size:73px">Review</text>
  <text class="word brandText" x="303.6" y="176" style="font-size:73px">Center</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Every review, signed.</text>
  <text class="tag brandText" x="56" y="316">Every step, audited.</text>
  <text class="body" x="58" y="368">Formal code reviews in your browser:</text>
  <text class="body" x="58" y="402">diffs, checklists, threaded comments,</text>
  <text class="body" x="58" y="436">and re-authenticated sign-off.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">reviewcenter serve --urls</text>
  <text class="cmd file" x="138" y="539">http://localhost:8080</text>
  <text class="note" x="58" y="604">Every action joins a hash chain.</text>

  <!-- Input cards -->
  <g>
    <!-- Input one: a baseline revision and the head revision of a git repository, with the change counts -->
    <rect class="card" x="580" y="40" width="236" height="160" rx="16"/>
    <rect x="642" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <line x1="40" y1="30" x2="180" y2="30" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <circle cx="40" cy="30" r="10" fill="#0a1022" stroke="#fbbf24" stroke-width="4"/>
      <circle cx="110" cy="30" r="7" fill="#fbbf24" fill-opacity="0.5"/>
      <circle cx="180" cy="30" r="10" fill="#fbbf24"/>
      <text class="miniMono" x="40" y="68" fill="#fde68a" text-anchor="middle">v1.0</text>
      <text class="miniMono" x="180" y="68" fill="#fde68a" text-anchor="middle">HEAD</text>
      <text class="miniMono" x="72" y="100" fill="#4ade80" text-anchor="middle">+12</text>
      <text class="miniMono" x="148" y="100" fill="#f87171" text-anchor="middle">-3</text>
    </g>
    <text class="label" x="698" y="190">Git revisions</text>

    <!-- Input two: the review-sets of the repository's ReviewMark configuration -->
    <rect class="card" x="828" y="40" width="236" height="160" rx="16"/>
    <rect x="890" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="836" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(836 48)">
      <text class="miniMono" x="22" y="34" fill="#a5f3fc">reviews:</text>
      <text class="miniMono" x="38" y="66" fill="#e2e8f0">- id: core</text>
      <text class="miniMono" x="38" y="98" fill="#e2e8f0">- id: web</text>
    </g>
    <text class="label" x="946" y="190">Review-sets</text>

    <!-- Input three: the project checklist, with its questions -->
    <rect class="card" x="1076" y="40" width="236" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1084" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1084 48)">
      <rect x="40" y="14" width="22" height="22" rx="5" fill="none" stroke="#f472b6" stroke-width="2.5"/>
      <rect class="bar" x="74" y="21" width="106" height="8" rx="4" fill-opacity="0.75"/>
      <rect x="40" y="45" width="22" height="22" rx="5" fill="none" stroke="#f472b6" stroke-width="2.5"/>
      <rect class="bar" x="74" y="52" width="86" height="8" rx="4" fill-opacity="0.75"/>
      <rect x="40" y="76" width="22" height="22" rx="5" fill="none" stroke="#f472b6" stroke-width="2.5"/>
      <rect class="bar" x="74" y="83" width="96" height="8" rx="4" fill-opacity="0.75"/>
    </g>
    <text class="label" x="1194" y="190">Checklist</text>

    <!-- Input four: the author and the reviewers -->
    <rect class="card" x="1324" y="40" width="236" height="160" rx="16"/>
    <rect x="1386" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1332" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1332 48)" fill="#60a5fa">
      <circle cx="56" cy="40" r="14" fill-opacity="0.7"/>
      <path d="M30 92 C30 66 82 66 82 92 Z" fill-opacity="0.7"/>
      <circle cx="164" cy="40" r="14" fill-opacity="0.7"/>
      <path d="M138 92 C138 66 190 66 190 92 Z" fill-opacity="0.7"/>
      <circle cx="110" cy="34" r="17"/>
      <path d="M78 98 C78 66 142 66 142 98 Z"/>
    </g>
    <text class="label" x="1442" y="190">Reviewers</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M698,206 C698,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M946,206 C946,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1194,206 C1194,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1442,206 C1442,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="698" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="946" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1194" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1442" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine -->
  <rect x="838" y="262" width="464" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="838" y="262" width="464" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="862" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M871 282 L884 282 L890 288 L890 306 L871 306 Z" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="875" y="290" width="11" height="2.5" rx="1.2"/>
    <rect x="875" y="295" width="11" height="2.5" rx="1.2"/>
    <rect x="875" y="300" width="7" height="2.5" rx="1.2"/>
  </g>
  <text class="engine" x="914" y="305">ReviewCenter</text>
  <line x1="1156" y1="278" x2="1156" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1176" y="303">web app</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: the signed attestation PDF, with its signatures and seal -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <path class="page" d="M604 406 L834 406 L852 424 L852 542 L604 542 Z"/>
    <path d="M834 406 L834 424 L852 424 Z" fill="#cbd5e1"/>
    <text class="mini ink" x="618" y="436">Attestation</text>
    <rect x="618" y="446" width="120" height="5" rx="2.5" fill="#4f46e5"/>
    <rect class="bar" x="618" y="462" width="140" height="5" rx="2.5"/>
    <rect class="bar" x="618" y="474" width="120" height="5" rx="2.5"/>
    <path d="M620 520 C632 496 640 528 652 508 C662 492 668 526 682 510 C690 502 696 514 708 512" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="618" y1="530" x2="720" y2="530" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="800" cy="494" r="30" fill="url(#brand)"/>
    <circle cx="800" cy="494" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M788 494 L797 503 L813 485" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="728" y="585">Signed attestation</text>

    <!-- Output two: the agreed checklist answers, consolidated from the reviewers' ballots -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <rect class="bar" x="915" y="425" width="78" height="8" rx="4" fill-opacity="0.75"/>
    <rect x="1009" y="414" width="74" height="30" rx="15" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="mini" x="1046" y="436" fill="#bbf7d0" text-anchor="middle">Yes</text>
    <rect class="bar" x="915" y="469" width="64" height="8" rx="4" fill-opacity="0.75"/>
    <rect x="1009" y="458" width="74" height="30" rx="15" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="mini" x="1046" y="480" fill="#bbf7d0" text-anchor="middle">Yes</text>
    <rect class="bar" x="915" y="513" width="72" height="8" rx="4" fill-opacity="0.75"/>
    <rect x="1009" y="502" width="74" height="30" rx="15" fill="#94a3b8" fill-opacity="0.18" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="mini" x="1046" y="524" fill="#e2e8f0" text-anchor="middle">N/A</text>
    <text class="label" x="999" y="585">Agreed answers</text>

    <!-- Output three: the hash-chained audit trail -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <g stroke="#5eead4" stroke-width="3" stroke-linecap="round">
      <line x1="1194" y1="440" x2="1206" y2="440"/>
      <line x1="1258" y1="440" x2="1270" y2="440"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-width="2">
      <rect x="1146" y="416" width="48" height="48" rx="8"/>
      <rect x="1206" y="416" width="52" height="48" rx="8"/>
      <rect x="1270" y="416" width="48" height="48" rx="8"/>
    </g>
    <text class="miniMono" x="1170" y="448" fill="#e2e8f0" text-anchor="middle">7f</text>
    <text class="miniMono" x="1232" y="448" fill="#e2e8f0" text-anchor="middle">c2</text>
    <text class="miniMono" x="1294" y="448" fill="#e2e8f0" text-anchor="middle">e9</text>
    <rect x="1162" y="494" width="140" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1232" y="520" fill="#e2e8f0" text-anchor="middle">CSV JSON</text>
    <text class="label" x="1232" y="585">Audit trail</text>

    <!-- Output four: the evidence index, which ReviewMark reads downstream -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="440" r="24" fill="url(#brand)"/>
    <path d="M1447 426 L1462 426 L1469 433 L1469 454 L1447 454 Z" fill="#ffffff"/>
    <rect x="1405" y="478" width="104" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="502" fill="#e2e8f0" text-anchor="middle">JSON</text>
    <text class="mini" x="1457" y="538" fill="#94a3b8" text-anchor="middle">to ReviewMark</text>
    <text class="label" x="1457" y="585">Evidence index</text>
  </g>
</svg>
