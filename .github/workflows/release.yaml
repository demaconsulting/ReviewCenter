---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish type'
        required: true
        type: choice
        options:
          - none
          - release

jobs:
  # Calls the reusable build workflow to build, test, and generate documentation
  # for the release version.
  build:
    name: Build
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ inputs.version }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Cuts the release, creating a GitHub release with the self-contained executable
  # archives, their SHA-256 checksums, and the generated documents attached. ReviewCenter
  # is distributed only through GitHub releases; nothing is published to NuGet.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download release archives (Windows)
        uses: actions/download-artifact@v8
        with:
          name: release-windows-latest
          path: artifacts

      - name: Download release archives (Linux)
        uses: actions/download-artifact@v8
        with:
          name: release-ubuntu-latest
          path: artifacts

      - name: Download documents artifact
        uses: actions/download-artifact@v8
        with:
          name: documents
          path: artifacts

      - name: Create GitHub Release
        if: inputs.publish == 'release'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          artifacts: artifacts/*
          bodyFile: artifacts/build_notes.md
          generateReleaseNotes: false
