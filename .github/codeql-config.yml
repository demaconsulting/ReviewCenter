---
# CodeQL configuration for ReviewCenter
# Suppresses intentional generic catch clauses

name: "ReviewCenter CodeQL Config"

# Query filters to disable specific queries for certain paths
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
    paths:
      - src/DemaConsulting.ReviewCenter/Cli/Context.cs
      - src/DemaConsulting.ReviewCenter/SelfTest/Validation.cs
  # Exclude path-combine warnings in PathHelpers (validated safe usage)
  - exclude:
      id: cs/path-combine
    paths:
      - src/DemaConsulting.ReviewCenter/Utilities/PathHelpers.cs
